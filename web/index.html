<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>anneal</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#14171c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&display=swap" />
    <script>
      // Apply the saved theme before first paint, so there's no flash.
      try { const t = localStorage.getItem("anneal-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
      try { const a = localStorage.getItem("anneal-accent"), c = localStorage.getItem("anneal-accent-custom"); if (a && a !== "copper") document.documentElement.dataset.accent = a; if (a === "custom" && c) document.documentElement.style.setProperty("--acc-custom", c); } catch {}
      try { const r = document.documentElement.dataset, g = (k) => JSON.parse(localStorage.getItem("anneal:" + k) || "null");
        if (g("ui.motion") === "reduce") r.motion = "reduce"; if (["110", "125"].includes(g("ui.zoom"))) r.zoom = g("ui.zoom"); if (g("ui.contrast") === "high") r.contrast = "high"; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
