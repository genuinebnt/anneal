# CI for every push and pull request; on master, a green build is also deployed to production (docs/DEPLOY.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy, tests, content)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: anneal
          POSTGRES_PASSWORD: anneal
          POSTGRES_DB: anneal
        # .cargo/config.toml points the tests at localhost:5435.
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U anneal" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Progress is stored by problem id: a vanished id or an edited migration would lose it (docs/DEPLOY.md).
      - name: Progress safety
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check-progress-safety.py "$BASE"
          else
            echo "no base commit to compare with"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate content
        run: cargo run -q --locked -p anneal-cli -- validate
      # The published course modules meet the owner's stage standards (docs/COURSE_STANDARDS.md).
      - name: Course standards
        run: cargo run -q --locked -p anneal-cli -- course lint
      # The doc comments a learner keeps are timeless (docs/COURSE_STANDARDS.md, "Code comments"): no stage ids, course words or history.
      - name: Course code comments
        run: python3 tools/check_code_comments.py
      # Every ```rust test example in the course's concept articles compiles and passes.
      - name: Course concept examples
        run: python3 tools/course_snippets.py
      - name: Run the pattern lesson templates
        run: python3 tools/neetcode/check_lessons.py

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: anneal
          POSTGRES_PASSWORD: anneal
          POSTGRES_DB: anneal
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U anneal" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p anneal-api
      - name: Start the API
        env:
          ANNEAL_DATABASE_URL: postgres://anneal:anneal@localhost:5435/anneal
          ANNEAL_SANDBOX: host
          ANNEAL_ADDR: 127.0.0.1:8791
          ANNEAL_WEB_DIST: web/dist
        run: |
          ./target/debug/anneal-api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8791/courses && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - name: API log on failure
        if: failure()
        run: cat api.log

  # The CLI for other computers (docs/CLI_INSTALL.md): built on master and served by the app at /downloads, installed by /install.sh.
  cli:
    name: CLI (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - run: cargo build --release --locked -p anneal-cli --target ${{ matrix.target }}
      - name: Name the binary for the installer
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/anneal out/anneal-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: out/anneal-${{ matrix.name }}
          if-no-files-found: error

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, web, e2e, cli]
    runs-on: ubuntu-latest
    # One deploy at a time; a newer commit waits and then ships, older queued ones are skipped.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://anneal.genuinebasil.dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The app image carries the installers' binaries (Dockerfile: COPY dist-cli /app/downloads).
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist-cli
          merge-multiple: true
      # The reference is in the checkout but not in the image: the solutions the app shows are generated from it here and shipped as data.
      - name: Generate the solutions the app serves
        run: |
          chmod +x dist-cli/anneal-linux-x64
          dist-cli/anneal-linux-x64 course solutions --out courses/bustub/solutions.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/genuinebnt/anneal:${{ github.sha }}
            ghcr.io/genuinebnt/anneal:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build and push the runner image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/runner.Dockerfile
          push: true
          tags: |
            ghcr.io/genuinebnt/anneal-runner:${{ github.sha }}
            ghcr.io/genuinebnt/anneal-runner:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted to deploy/ssh-deploy.sh on the server; the token (valid for this job only) lets it
          # pull the images, then it logs out.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "deploy@$HOST" "deploy ${{ github.sha }}"
