[[hints]]
kind = "approach"
text = "The fixed window is the period roll you have done before, with a counter in place of a total. `replay` needs the time each admitted request counts at, in order."

[[hints]]
kind = "rust"
text = "`&mut L` with `L: ?Sized` accepts both a concrete limiter and a `&mut dyn Limiter`. Keep the admitted times in a `Vec`; it is already sorted."

[[hints]]
kind = "edge"
text = "Pass the limiter the effective time, never an earlier one. Call `check` exactly once per arrival. A stretch is half-open, and times can be near `u64::MAX`."

[solution]
explanation = "The fixed window keeps the latest time, the window's number and its count. Replay clamps each arrival to the latest time so far, asks the limiter once and keeps the admitted times. The busiest stretch is then one pass with two positions over those sorted times."
time = "O(n) for n arrivals"
space = "O(n) for the report"

