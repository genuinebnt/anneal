[[hints]]
kind = "approach"
text = "Every entry is run alone, from a fresh start. Decide what turns a `Policy` into a working limiter, and whether `Shared` needs separate code at all."

[[hints]]
kind = "rust"
text = "`Box<dyn Forget>` can hold any of the six once the two remaining meters implement `Forget`. For `Keyed` to hold boxes, the box itself must implement `Limiter` and `Forget`. `BTreeMap::entry(..).or_default()` collects per-client facts."

[[hints]]
kind = "edge"
text = "Clamp times once per run, across all clients. A client's busiest stretch uses only that client's admitted times. `differs_from_first_at` always compares with entry 0. `held` is what remains after a sweep at the last time."

[solution]
explanation = "Each entry builds a keyed map of boxed limiters; shared scope is the same map with one key. The run clamps times once, records every decision and each admitted time, globally and per client, then sweeps to count the limiters that still matter. The busiest stretches use the two-position walk, and a final pass finds each entry's first disagreement with entry 0."
time = "O(entries × requests × log clients)"
space = "O(requests)"

