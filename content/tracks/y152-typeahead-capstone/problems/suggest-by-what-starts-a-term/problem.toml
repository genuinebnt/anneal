[[hints]]
kind = "approach"
text = "Keep one table of terms found by key, and beside it a structure over the keys that answers for any beginning. Which of the two must change when a term is chosen?"

[[hints]]
kind = "rust"
text = "Numbers into a `Vec` of terms avoid borrowing trouble: the nodes hold `usize`s, and a `HashMap<String, usize>` finds a term. Pass the terms to the comparison."

[[hints]]
kind = "edge"
text = "A batch may name one term twice, or move two terms under one beginning. A time of 999 000 000 seconds is 277 500 half-lives. A term added with count 0 is still a term."

[solution]
explanation = "Terms live in a vector and are found by key. Each term stores the base-2 logarithm of its choices weighted by 2 to the power of at / HALF_LIFE, which keeps the order without rescoring. A tree over the key characters keeps the twenty best terms at every node. After each single change, that term is moved within each list on its path by binary search."
time = "O(L * MOST) per change, O(L + limit) per question"
space = "O(total key characters * MOST)"

