slug = "functions-made-here"
title = "Formulas that make their own functions"
mode = "write"
level = "hard"
stage = "meaning"
order = 6
status = "ready"
tags = ["interpreters", "closures", "lexical scoping", "Rc and RefCell"]
teaches = [
  "A scope is an immutable chain of variables, newest first; each variable's value is in a `RefCell`. A new variable extends the chain without touching it, so older holders keep their view. A function value stores the chain that was current when it was made, and a call extends that chain with the parameters. A recursive function first adds its variable, builds the function over that chain, then stores the function in the variable.",
]
follow_up = "1) Which values in your design are never freed? 2) How would you replace the search by name with a number worked out before running?"
