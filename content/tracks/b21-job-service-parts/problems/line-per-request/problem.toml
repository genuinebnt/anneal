slug = "line-per-request"
title = "A log line for every request"
mode = "write"
level = "medium"
stage = "running"
order = 8
status = "ready"
tags = ["axum", "middleware", "from_fn", "tracing", "spans", "Instrument", "drop guard"]
teaches = [
  "Middleware wraps every handler, so a rule about all requests is written once.",
  "In async code a span is attached to the future with `instrument`, not entered with a guard. It is then active exactly while that future runs.",
  "Code after an await does not run when a request is abandoned. A drop guard is how you still hear about it.",
  "`Router::layer` also covers unknown paths; `route_layer` does not.",
]
follow_up = "1) How would you carry this context into a task the handler spawns? 2) Which fields are dangerous as metric labels but fine in spans? 3) Where should timing go so that it includes the response body?"
related = ["B1", "C4"]
crates = ["axum", "tokio", "tracing", "tracing-subscriber", "tower", "futures"]

[[hints]]
kind = "approach"
text = "Write one async function that sees the request before the handler and the response after it. Decide what must be true if that function never reaches its second half."

[[hints]]
kind = "rust"
text = "`axum::middleware::from_fn`, `tracing::info_span!` with `%value` fields, `tracing::Instrument::instrument`, and `tracing::info!(parent: &span, status = .., \"..\")`. Apply it with `Router::layer`."

[[hints]]
kind = "edge"
text = "Do not hold `span.enter()` across an await. Log the path with `uri().path()`. A guard that is disarmed once the response exists can emit the WARN from `drop`."

[solution]
explanation = "A from_fn layer builds the span from the request and runs the rest of the stack inside it with instrument, so the span is entered on every poll and left again between polls. After the response it logs one INFO event with the status. A guard armed before the await logs the WARN if the future is dropped instead. Router::layer includes the fallbacks."
time = "O(1) per request"
space = "O(1)"

