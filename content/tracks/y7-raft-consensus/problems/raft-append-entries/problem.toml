slug = "raft-append-entries"
title = "Raft's AppendEntries: the follower's side of log replication"
mode = "write"
level = "hard"
stage = "rules"
order = 2
status = "ready"
tags = ["Raft", "log replication", "AppendEntries", "consistency check", "log matching", "commit index", "idempotence"]
teaches = [
  "The **log matching property**: if a follower has an entry with the same index *and term* as the leader's `prev` entry, the two logs are identical up to there. The consistency check is how a leader finds that point.",
  "Only a *conflicting* entry (same index, different term) is deleted, along with everything after it. A request carrying entries the follower already has must change nothing: it may be a delayed duplicate.",
  "The commit index only moves forward, and never past the last entry this request vouched for: the follower's own tail beyond it may be stale.",
]
follow_up = "1) Add the conflict hint (`conflict_term`, `conflict_index`) to `AppendReply` and write the leader's `next_index` back-off that uses it: how many round trips does it save after a long partition? 2) Persist the log and term to a file before replying (write-ahead) and test a crash between append and reply. 3) Write a randomised test: a leader's log, a follower's divergent log, deliver the leader's messages duplicated and reordered, and check the follower's log always converges to a prefix of the leader's. 4) Add log compaction (a snapshot replaces entries up to an index) and see which of these rules change. 5) The leader side comes next: how it decides what is committed."
related = ["Y7", "B4", "C2"]

[[hints]]
kind = "approach"
text = "Four steps in order: term check, consistency check on `prev`, merge the entries one by one (append past the end, truncate only on a term *conflict*, keep matches), then advance the commit index. A failed check must return before touching the log."

[[hints]]
kind = "rust"
text = "`self.log.get(p as usize - 1)` is the entry at 1-based index `p` (guard `p > 0` first). Use the 0-based position `p + k` for the `k`-th new entry; `Vec::truncate(pos)` drops `pos..`. For the commit index, `commit_index = commit_index.max(leader_commit.min(last_new))` is monotone by construction."

[[hints]]
kind = "edge"
text = "Why not just `truncate(prev)` then extend? Because a reordered older request would then delete entries a newer request already delivered (and maybe acknowledged). And why `min(leader_commit, last_new)` rather than the log length? The follower may hold a stale tail from an old leader that this request has not yet overwritten: committing it would be wrong."

[solution]
explanation = "This is Figure 2 of the Raft paper and the core of every Raft library (etcd, TiKV, Consul, rqlite). The mistakes tested here (truncating on duplicates, committing a stale tail, letting the commit index go backwards) are the classic ones that pass happy-path tests and corrupt data after a partition or a reordered packet. Real implementations add a conflict hint to the reply (term and first index of the conflicting term) so the leader can back up by a term at a time instead of one entry."
time = "O(entries) per request"
space = "O(1) extra"
