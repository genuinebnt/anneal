slug = "sleep-without-missing-work"
title = "Go to sleep without missing work"
mode = "write"
level = "hard"
stage = "events-and-threads"
order = 10
status = "ready"
tags = ["Condvar", "lost wake-up", "eventcount", "parking"]
teaches = [
  "Announce that you are about to sleep, look once more, then sleep only if nothing was announced since.",
  "A ticket that remembers a count turns \"was I notified meanwhile?\" into a comparison.",
  "This is the shape of an eventcount: it lets any lock-free queue block without polling.",
]
follow_up = "1) If `notify_one` unlocked before it signalled, which thread could take the signal, and what happens to the earlier sleeper? One test forces that with the given `Signal`. Why could a real `Condvar` hide the same bug for months? 2) Your `notify_one` takes a lock even when nobody waits. Schedulers avoid that with an atomic count of sleepers. Which memory ordering or fence is then needed between \"push work\" and \"read the count\", and why? 3) Many runtimes add a timeout to the sleep as a safety net. What bug would it hide? 4) Where does crossbeam use this idea?"
related = ["C1", "C3"]

[[hints]]
kind = "approach"
text = "The sleeper must be able to tell, at the moment it goes to sleep, whether anything was announced since it said it would. What can the ticket remember?"

[[hints]]
kind = "rust"
text = "A counter under a `Lock`, a `Signal`, and `wait_while`. The ticket holds the counter's value at `prepare`."

[[hints]]
kind = "edge"
text = "Two sleepers, two `notify_one` calls, and neither has woken up yet. And: can a flag be consumed by the wrong one?"

[solution]
explanation = "The gate counts notifications under a mutex. A ticket records the count when it is made, and `sleep` waits while the count has not moved. Each notification moves the count, so every older ticket becomes releasable. `notify_one` signals while it still holds the lock, so only older tickets can be asleep to receive the signal. Nothing is stored for a cancelled ticket to consume."
time = "O(1) per call"
space = "O(1)"
