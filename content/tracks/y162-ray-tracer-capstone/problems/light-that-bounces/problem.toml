teaches = [
    "One random path is a poor guess; the average of many is the right answer, if no step of the guess leans one way.",
    "Choosing directions as often as they matter makes the weights cancel, and some answers become exact in every sample.",
    "Paths can be ended by chance without lowering the average, if the survivors count for more.",
    "A closed scene with a known answer is the test that catches a renderer that looks right but loses light.",
]
follow_up = "1) With a very small lamp almost every path finds nothing. How could a bounce ask the lamps directly, and what must you then not count twice? 2) Your estimate with max_bounces = 5 is a little too low. Why, and for which scenes does it matter?"
