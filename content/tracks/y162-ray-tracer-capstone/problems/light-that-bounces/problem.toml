[[hints]]
kind = "approach"
text = "Keep two running values: the light gathered, and the weight of what is still to come. Each surface either adds to the first (and ends) or filters the second and picks a new direction."

[[hints]]
kind = "approach"
text = "For the direction: a point spread evenly over the disk under the normal, lifted straight up onto the half ball, has exactly the density asked for. You need two unit vectors at right angles to the normal."

[[hints]]
kind = "edge"
text = "When you end a path by chance with survival probability p, divide the weight of the survivors by p. Keep p away from 0 and from 1."

[solution]
explanation = "The path keeps gathered light and a weight. A matte bounce multiplies the weight by the colour and picks a cosine-weighted direction, so the cosine and the density cancel. Glass takes one of its two ways with probability given by the reflected share, so the weight stays. After a few bounces the path survives with a probability tied to its weight, clamped, and the weight is divided by it."
time = "O(bounces) world queries per path"
space = "O(1)"
