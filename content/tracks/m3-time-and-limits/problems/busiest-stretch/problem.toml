[[hints]]
kind = "approach"
text = "A best stretch can always be slid forward until it begins at an event. Then think about the stretches by where they end, and what changes from one ending to the next."

[[hints]]
kind = "rust"
text = "Keep the index of the oldest event still inside and a running sum. Add the new event, then drop old ones from the front with `while`. Sum in `u128`."

[[hints]]
kind = "edge"
text = "Compare ages (`now - then >= span`) instead of adding to a time, which can overflow. An event exactly `span_ms` older is outside. Among equal totals keep the earliest start, and count every event of that stretch, including those of size 0."

[solution]
explanation = "Both questions walk the log with the oldest event still inside and a running total. For each new event the old ones drop off the front, and each event is added and removed once. The best stretch is updated only when the total grows, so ties keep the earliest start."
time = "O(n)"
space = "O(1) beyond the input"

