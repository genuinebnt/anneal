teaches = [
  "`compare_exchange(Acquire)` to take the lock and `store(Release)` to give it back: the pair that makes a critical section.",
  "An RAII guard (`Deref`, `DerefMut`, `Drop`) so the lock cannot be forgotten, with lifetimes tying the data to the guard.",
