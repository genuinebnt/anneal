[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>designing or reviewing distributed locks</li><li>leader election</li><li>any "only one writer at a time" protocol</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
a discrete-event simulation of a lease service (grants a TTL lease plus a monotonically increasing **fencing token**), several clients (acquire, write to shared storage, renew via heartbeat) and a storage service that either ignores or enforces the tokens.

Time is a simulated clock; the event queue is a `BinaryHeap<Reverse<(time, seq, Event)>>` and every delay comes from a seeded xorshift RNG, so each schedule is exactly reproducible from its seed.
"""

[[sections]]
heading = "Why it matters"
body = """
a lease alone cannot give mutual exclusion. The service decides "your lease expired" using **its** clock, but a client can only act on what it believed when it last looked. If the client then stalls (GC pause, VM freeze, slow network) for longer than the TTL, it wakes up still believing it holds the lease while a new holder is already writing.

No check on the client side closes this gap, because the pause can land between the check and the write. This is the argument of Martin Kleppmann's essay (Read: below). The fix must live at the resource: reject any write whose token is lower than the highest token already seen.
"""

[[sections]]
heading = "How it works"
body = """
scenario A (no fencing) is searched for deterministically and replayed with a timeline showing the corruption; scenario B replays the **same** schedule against a fencing storage and shows the stale write rejected; then 2000 random schedules check the safety invariant: accepted tokens never go backwards and the final value is the last write of the highest token.

Without fencing the same schedules violate it. Clients deliberately ignore the write ack when deciding what to do next, so the schedule is identical in both modes and the comparison is apples to apples.
"""

[[sections]]
heading = "Common uses"
body = """
ZooKeeper / etcd / Consul leases with revision numbers as fencing tokens, Chubby sequencers, HBase and Kafka controller epochs, Raft terms rejecting stale leaders, S3 or DynamoDB conditional writes (version check), database "**select** ... **For update**" plus version columns, Kubernetes leader election with resourceVersion.

Testing pattern: deterministic simulation testing (FoundationDB, TigerBeetle, Jepsen/Maelstrom style fault injection).
"""

