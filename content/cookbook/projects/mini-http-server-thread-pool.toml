[[sections]]
heading = "What it is"
body = """
a complete little HTTP/1.1 server with no HTTP crate: an acceptor thread, a **fixed** pool of worker threads fed through a **bounded** queue, an incremental request parser, keep-alive and pipelining, a router with path parameters and middleware, static files (ETag, Last-Modified, Range, traversal protection), a streaming chunked response, `Expect: 100-continue`, **head**, graceful shutdown and Prometheus-style /metrics.

A load-test client with its own latency histogram compares thread-per-connection, the pool and a tokio server that reuses the same parser and routes.
"""

[[sections]]
heading = "Design notes"
body = """
clients --TCP-> [acceptor] --try_send-> [ bounded queue (cap N) ] --recv-> [worker 0..W]

```text
                     |                          full?                              | serve_connection():
                     +-- 503 + Retry-After <----+                                   |  read -> parse -> route
                                                                                    |  -> middleware -> write
request_id -> logging -> timing -> catch_panic -> router -> handler                 +- loop (keep-alive)
```

**Why** a bounded queue: an unbounded queue turns overload into unbounded latency and memory; refusing early with `503 Retry-After` keeps latency for admitted work flat (load shedding) and tells clients to back off. **Why** a fixed pool: the number of threads (and so memory and context switches) no longer depends on the number of clients.

The classic price: a worker is pinned to a connection while it is open, so idle keep-alive clients can starve queued ones. Real servers bound that with idle timeouts and max-requests-per-connection (both here), or use an event loop (the tokio comparison below) so an idle connection costs a few hundred bytes instead of a thread.
"""

[[sections]]
heading = "How it works"
body = """
- a TCP read can contain half a request, one request, or five; the parser is a pure function over the buffer that answers Incomplete / Done(request, bytes_used) / Bad(error), so pipelining is just "parse again on the rest".
- limits everywhere: request line 2 KiB (414), header block 8 KiB or 64 headers (431), body 64 KiB (413), chunk size line 40 bytes (400), trailer section 8 KiB (431). Syntax and ambiguity (both Content-Length and chunked, or Transfer-Encoding twice: request-smuggling vectors) are 400. Errors close the connection.
- a limit must give the same answer however the bytes are cut: an unfinished line may end in the CR of its CRLF, so that CR is not counted. The checks parse every prefix of requests at and just over the limits.
- the read side uses 50 ms timeout slices so idle keep-alive connections notice shutdown and the idle timeout without a separate timer thread. The request timeout (slow loris, 408) is checked on every turn of the loop: checked only after a silent read, a client that keeps dripping bytes would escape it and block shutdown.
- a handler panic is caught by middleware (500) and, as a second line, around the whole connection, so one bad request never costs the pool a thread.
- closing a socket that still holds unread input sends RST, which can destroy the error response in flight; so error paths do a lingering close: shutdown(Write), drain briefly, then drop. It is bounded in bytes **and** time. A refused (503) socket is handed to one `rejector` thread that drains all of them without blocking, so the acceptor never waits.

   Any bounded linger has a limit: bytes sent after it can still draw a reset, and when more than 64 refused sockets are open the oldest is dropped early.
- HTTP/1.0 has no chunked coding: a streamed response to such a client is ended by closing the connection (the client then cannot tell a cut-off body from a complete one). Range applies to `GET` only, not `HEAD`.
- the latency histogram is approximate, but the Prometheus `le` buckets are inclusive and need exact counters.
- graceful shutdown: set `stopping`, wake the blocked `accept`, drop the queue sender (workers drain what is queued then exit), in-flight requests finish and answer `Connection: close`, idle connections are closed, all joined.
"""

