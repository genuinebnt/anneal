"""

[[sections]]
heading = "What it is"
body = """
a filesystem stored in **one** file that is treated as an array of 4096-byte blocks (a **block device**). Everything above the device (cache, journal, allocators, inodes, directories, path resolution) is ordinary Rust over `read_block / write_block / sync`.
"""

[[sections]]
heading = "Design notes"
body = """
**On-disk layout** (block numbers; the example geometry is 256 blocks, 64 inodes, 64 journal blocks):

'''text

```text
 0        1 .. 1+J          ibm        dbm .. dbm+D        itable ..            data_start .. total
+--------+-----------------+----------+-------------------+--------------------+--------------------+
| super  | journal         | inode    | data-block bitmap | inode table        | data blocks        |
| block  | hdr|images..|cmt| bitmap   | (1 bit per block)  | (32 x 128 B/block) | files, dirs, ind.  |
+--------+-----------------+----------+-------------------+--------------------+--------------------+
```

magic, version, geometry, crc32        bit i = block i (metadata bits pre-set; next-fit allocator)

inode (128 B): kind, nlink, mode, size, mtime, ctime, direct[12], single-indirect, double-indirect file blocks: 12 direct + 1024 (via indirect) + 1024&#42;1024 (via double indirect) = 1,049,612 blocks  (about 4.0 GiB) directory  : a regular file whose content is 64-byte entries [inode u32][name_len u8][name &lt;= 59 B]; "." and ".." are real entries '''

**Journal** (ext3 `data=journal` style, one transaction at a time): every public operation is a **transaction**, except that a long write is cut into several. Each piece is atomic. The whole write is not: a crash or a full disk can leave a prefix of it. Block writes only go to the buffer cache (dirty, never evicted).

**Commit** = write [header: seq, target block numbers] + [block images], sync, write [commit record: seq + crc32 over header and images], sync, then **checkpoint** the images to their home locations, sync, and finally mark the journal clean.

Recovery on mount: a header with a matching, checksummed commit record is replayed (idempotent: the same images are written again); anything else is discarded. So a crash at any write boundary leaves each transaction either entirely applied or not applied at all. If a commit fails on the device, the filesystem refuses every later call until it is mounted again.

The checksum is what makes torn and **reordered** writes between two syncs harmless (the fault injector below simulates both).

FSCK walks the tree from the root and checks: every entry points at an allocated inode, link counts equal the number of directory entries, no block is claimed twice (cross-link), bitmaps equal the set of reachable blocks, no orphan inodes, "." and ".." are right, every directory is reachable exactly once, no name is there twice.

Simple problems (link counts, leaked blocks, orphans, missing bits) are repaired. When part of the tree cannot be read, repair only marks things as used and frees nothing.

Repair can free live data. A directory whose size was shortened, or an entry that was zeroed, looks like fewer names. The walk seems complete, so the files named there are taken for orphans and freed.

The crash tests cannot prove every sync. With a checksummed commit record, no cut shows a need for the sync between the journal copies and that record. The same holds for the last sync of a commit, of recovery and of format.

Limits: only the superblock and journal records are checksummed, so some damage elsewhere cannot be told from good data. A directory whose kind byte says &quot;file&quot; hides its children, and repair would free them. A very large device with a small journal can make one unlink too big for a transaction.
"""

[[sections]]
heading = "Common uses"
body = """
ext2 taught the inode/indirect-block/bitmap design (that is this file's layout); ext3/ext4 added the journal (crash recovery in time proportional to the log, not the disk, and the checksummed commit block of ext4's journal_checksum); FFS introduced cylinder groups and locality-aware allocation (here: next-fit);

Xv6's file system (a few hundred lines in C) is the smallest teaching implementation of inodes + log + directories; ZFS-style designs put checksums on everything and detect silent corruption (here: the superblock and journal records are checksummed).

The same crash-injection method tests databases and key-value stores.
"""

