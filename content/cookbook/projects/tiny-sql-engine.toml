[[sections]]
heading = "What it is"
body = """
**Create table** / **insert** / **select** (**where**, **group by** with COUNT/SUM/MIN/MAX, **order by**, **limit**) over typed INT/TEXT/BOOL columns.
"""

[[sections]]
heading = "Why it matters"
body = """
every database is this pipeline at a different scale; seeing it in &#126;450 lines makes DataFusion or SQLite readable.
"""

[[sections]]
heading = "How it works"
body = """
```text
lex      bytes -> tokens carrying byte spans         parse   tokens -> AST (recursive descent + Pratt for expressions)
```

bind     AST expr -> `Bound` expr (column names become indices, static type check, so type errors surface **before** any row is read)

```text
plan     Select -> a tree of operators:  Scan -> Filter -> Sort -> Limit -> Project   (or ... Filter -> Aggregate -> Sort -> Limit)
```

execute  volcano model: every operator implements `next() -> Result<Option<Row>>` and pulls from its child, so **limit** stops the scan early.

**Null semantics** (three-valued logic): any comparison or arithmetic with **null** is **null**; `NULL AND false` = false, `NULL AND true` = **null**, `NULL OR true` = true, `NULL OR false` = **null**, `NOT NULL` = **null**; **where** keeps a row only when the predicate is exactly **true**.

NULLs sort first in ASC order (last in DESC); aggregates ignore NULLs; SUM/MIN/MAX of nothing is **null**, **count** of nothing is 0. **Errors** are values: parse errors carry a span and render compiler-style with a caret line; type, catalog and runtime (division by zero, overflow) errors are `SqlError` variants. Nothing in the engine panics on user input.
"""

[[sections]]
heading = "Verification"
body = """
hand-checked results on a small table, then seeded random tables/predicates compared with an independent brute-force Rust oracle (sortedness, **limit** = min(n, rows), **where** = closure filter, **group by** = BTreeMap fold).
"""

