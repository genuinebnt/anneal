[[sections]]
heading = "What it is"
body = """
a small regex dialect: literals, `.`, `*`, `+`, `?`, `|`, `( )`, classes `[a-z_]` / `[^...]`, anchors `^` `$`, escapes (`\\d \\w \\s \\n \\t`, also inside classes). A backslash before punctuation means that character (`\\.`); before any other ASCII letter or digit (`\\D`, `\\r`) it is an error. `\\d \\w \\s` are ASCII only.

A shorthand cannot be the end of a range (`[a-\\d]`).
"""

[[sections]]
heading = "Why it matters"
body = """
the classic backtracking matcher (Perl, PCRE, Python `re`, JS) is exponential on patterns like `(a*)*b`; that is the ReDoS bug class. A Thompson NFA keeps **all** possible positions at once, so matching costs O(text &#42; states) and can never blow up.
"""

[[sections]]
heading = "How it works"
body = """
```text
parse    text -> `Ast`  recursive descent, one function per precedence level (alt < concat < repeat < atom); errors carry a char position
         open groups and syntax-tree height are both capped at 250, so a hostile pattern gets an error instead of overflowing the stack
```

compile  `Ast` -> `Nfa` states in a `Vec`, ids are indices; built back-to-front so every fragment is told its `next` state (no patch lists) run      simulate the **set** of live states; epsilon-closure follows `Split`, and `^`/`$` only when the position allows it `find` is **leftmost-longest** (POSIX style): the earliest start that can match, then the longest end from it.

Perl/rust-regex use leftmost-**first** (alternation priority); that needs thread priorities and is deliberately left out. Positions are char indexes.

**Verify**: an obviously-correct backtracking matcher over the AST (with a step budget) is the oracle; thousands of random regexes and strings must agree, state count must stay linear in regex length, and `(a*)*b` on a run of `a`s must exhaust the oracle but not the NFA.
"""

