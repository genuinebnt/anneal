[[sections]]
heading = "Where you would use it"
body = """
any "submit work over HTTP, run it in the background, watch it" service.
"""

[[sections]]
heading = "What it is"
body = """
a small job service for image-resize jobs. Clients **post** a job, poll it, list jobs page by page, cancel it, and replay its event log over Server-Sent Events. Everything runs in-process and is driven through `tower::ServiceExt::oneshot`, so there are no sockets and the example is fast and deterministic.
"""

[[sections]]
heading = "Why it matters"
body = """
it combines recipes axum_router_state (router state), axum_errors (error type), axum_sse_replay (SSE replay), axum_middleware (middleware), axum_idempotency (idempotency) and worker_pool (worker pool) into the shape real services have.
"""

[[sections]]
heading = "How it works"
body = """
- `App` is cheap-to-clone shared state (`Arc<Inner>`). It holds the job store behind a mutex, a `Semaphore` that bounds concurrency, and a `watch` count of unfinished jobs. The store also holds a logical clock (a counter, so timestamps are deterministic) and the closed flag.
- Each job gets one tokio task. It waits for a permit or for cancellation. It runs the resize in a **child** task, so a panic surfaces as a `JoinError` and becomes `failed`. A `select!` watches a `watch` channel for cancellation.
- An accepted cancel always wins. The job ends `cancelled`, even if its work had just finished, and a job still queued never starts. An aborted child is awaited before the job is reported as cancelled and its slot is freed.
- Every state change appends to a per-job event log (ids 1, 2, 3, ...). The events route sends the entries after `Last-Event-ID` and then **ends the response**. It does not follow a running job: the client has to reconnect to see more.
- `ApiError` gives every error one JSON shape with a stable machine-readable `code`. That includes unknown routes (404), wrong methods (405), an id that does not decode, and a body that is too large (413).
- Shutdown closes the store under the same lock that creates jobs. A new idempotency key then gets 503, but a retry of an accepted job still gets that job. Shutdown waits until no job is unfinished and reports counts. It only watches a counter, so any number of callers may wait, and dropping the future (after a timeout, say) stops no job. It has no deadline of its own.
- The last scenarios in `main` check these edge cases, most of them on a single-threaded runtime so that the order of events is fixed.
"""

