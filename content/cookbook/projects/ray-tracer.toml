[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>learning how offline renderers work</li><li>synthetic image generation</li><li>a base for experiments with sampling and acceleration structures</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
a self-contained CPU ray tracer. Scene = spheres, an infinite checkerboard plane and triangle meshes (a generated icosphere, boxes, quads). Materials: Lambert, checker, Blinn-Phong, perfect mirror, dielectric glass (Fresnel by Schlick, total internal reflection, optional Beer-Lambert absorption) and emissive.

Lights: point (hard shadows) and rectangular area lights (soft shadows by Monte-Carlo sampling). Camera: pinhole with vertical field of view plus an optional thin lens (depth of field).

Two integrators: a Whitted ray tracer (recursive mirror/glass + shadow rays) and a unidirectional **path tracer** (cosine-weighted hemisphere sampling, Russian roulette) used for a Cornell-box scene.
"""

[[sections]]
heading = "Why it matters"
body = """
every piece is small, but they interact; the assertions at the end (BVH == brute force, thread count does not change the image, white-furnace energy conservation, RMSE shrinking like 1/sqrt(N)) are the standard ways to know a renderer is correct rather than merely pretty.
"""

[[sections]]
heading = "How it works"
body = """
camera ray: dir = normalize(forward + (2s-1) tan(fov/2) aspect right + (1-2t) tan(fov/2) up); thin lens: pick a point on the lens disk, aim at the point where the pinhole ray crosses the focus plane, so only that plane stays sharp. sphere: &#124;o + t d - c&#124;&#94;2 = r&#94;2 -> quadratic, solved from the part of o - c at right angles to the ray, so that a far origin does not destroy the digits. triangle: Moller-Trumbore. plane: t = (k - n.o) / (n.d).

BVH: binary tree of axis-aligned boxes over triangles/spheres, median split on the longest centroid axis, stored in a flat Vec (depth-first: left child = index + 1, right child index stored), traversal with an explicit stack that skips boxes beyond the closest hit found so far.

Planes are unbounded, so they are tested separately. determinism: the RNG for pixel (x, y) is seeded from (seed, x, y) only, and a hit tie is broken by primitive index, so the result does not depend on thread count or band order. The BVH gives the same hits as brute force on the tested scenes; its box padding is a fixed 1e-6, so scenes with coordinates around 1e10 or more are outside what it promises.

Whitted shading at a diffuse hit: albedo &#42; (ambient + sum over lights of light &#42; max(0, n.l) / d&#94;2 &#42; visibility) + Blinn term ks &#42; max(0, n.h)&#94;shininess, with h = normalize(l + v). path tracing (Lambert): next dir &#126; cos(theta)/pi so pdf cancels the cosine and throughput &#42;= albedo; after 3 bounces Russian roulette keeps the path with probability p = clamp(max(throughput), .05, .95) and divides by p. The roulette adds no bias; the hard limit on bounces does cut off a little light.

Schlick's formula takes the angle on the side with the smaller index, so leaving glass it uses the outgoing angle and reaches 1 at total internal reflection. Glass picks reflection with probability R (Fresnel), refraction otherwise, so throughput needs no extra weight. white furnace: any closed lossless material inside uniform radiance 1 must look exactly 1; a deviation means the BRDF/refraction code creates or destroys energy. In theory the RMSE of an N-sample image against a very

```text
high-sample reference falls like 1/sqrt(N). The program checks that it falls at every step and by more than 2.5x from 1 to 64 samples.
```
"""

[[sections]]
heading = "Limits"
body = """
<ul class="cb-g-uses"><li>the path tracer sees only the sky and emissive surfaces: it ignores point and area lights and treats Blinn as matte</li><li>Whitted shadow rays treat glass as opaque, and area lights have no emitter-cosine or area term</li><li>glass is always taken to be surrounded by air</li><li>the camera, the PNG writer and the renderer stop with a message on input they cannot use, such as a camera that looks at itself or an image with no pixels</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>film and product-visualisation offline renderers (the same ideas as PBRT/Cycles)</li><li>game-engine lightmap baking and reference images</li><li>synthetic data generation for computer vision</li><li>teaching sampling/variance</li></ul>
"""

