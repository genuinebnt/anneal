[[sections]]
heading = "Design notes"
body = """
**Architecture**

```text
+----------------------------+  Msg::Req{cmds, oneshot}   +-----------------------------------------------------+
| read -> incremental RESP   |--------------------------->| crossbeam channel -> drain queued msgs (group commit)|
| parse ALL buffered cmds    |                            |   dispatch: subscriber gate / MULTI queue / execute  |
| (pipelining, inline, limits|<---- BatchReply (frames) --|   Engine { BTreeMap<key,Value>, Expires, watchers,   |
|  protocol error => -ERR +  |      sent AFTER the AOF     |            pub/sub tables, blocked-client FIFOs }    |
|  close) -> ONE write       |  write (always: + fsync)    |   then: append AOF records (fsync policy), reply     |
|  select! { socket read,    |<--- bounded mpsc push ------|   PUBLISH -> try_send into each subscriber's queue   |
|   push queue, kill, stop } |     (full queue => kill)    |   tick every 10 ms: BLPOP timeouts, active expiry,   |
+----------------------------+                            |   everysec fsync;  BGSAVE/BGREWRITE on helper threads|
                                                          +-----------------------------------------------------+
```

Values: <code>Str</code>, <code>List(VecDeque)</code>, <code>Hash(BTreeMap)</code>, <code>Set(BTreeSet)</code>, and <code>ZSet</code> (a map from member to score plus a skip list with spans). Persistence: <code>appendonly.aof</code> (RESP commands, replayed on start) and <code>dump.mrdb</code> (binary with a CRC32). Snapshots, rewrites and the first log made from a snapshot are put in place by rename.
"""

[[sections]]
heading = "What it is"
body = """
a server that speaks a subset of Redis (85 commands over RESP2) and a small async client in one file. Its socket tests use real loopback connections; other checks call the parser, the data structures and the engine directly. `redis-cli` itself has not been tried against it. **Why**: Redis is the best small study of how a database trades generality for speed: one thread, one in-memory structure per type, a text protocol, and a log for durability. **How**:

<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Concurrency model</div><div class="cb-g-says"><p>(chosen: single-threaded executor, like real Redis). Connection tasks only do I/O and parsing; every command runs on one thread, so each command, MULTI/EXEC block and BLPOP wake-up is trivially atomic and the AOF order is the execution order. No per-key locks, no lock ordering, no torn multi-key commands (<strong>sinter</strong>, <strong>rename</strong>, EXEC).</p><p>The alternative, a sharded store with one lock per shard, can run single-key commands on several cores at once, but makes every multi-key command and transaction a lock-ordering problem.</p><p>The file includes a small benchmark without sockets. In one run on one machine, with one thread, a channel round trip per operation was about 20 times slower than taking an uncontended lock, and sending 64 operations per trip closed much of that gap. It did not show sharding paying off: 8 threads on 16 locks were slower than 1 thread. Your numbers will differ. Replies are released only after the AOF write, and queued requests share one fsync (group commit).</p></div></div><div class="cb-g-term"><div class="cb-g-name">Protocol</div><div class="cb-g-says"><p>RESP2 parsing is incremental (<code>Ok(None)</code> = need more bytes), every declared length is untrusted and checked <strong>before</strong> waiting for or allocating the bytes, one command is capped at 4 MiB, and a protocol error replies <code>-ERR Protocol error: ...</code> then closes. Line ends are removed from error replies, which quote client input.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Expiry</div><div class="cb-g-says"><p>Lazy (every command that looks a key up checks its deadline; KEYS and SCAN skip expired keys, and DBSIZE still counts keys nobody has reclaimed) plus <strong>active</strong>: each cycle samples 20 random keys that have a TTL (a Vec + position map gives O(1) random choice), deletes the expired, and repeats while more than 25% were expired. The clock is a trait, so tests drive time with <code>ManualClock</code>. Expiry is logged as an explicit DEL, and replay deletes nothing because of its own clock: a deadline that passed while the server was down takes effect after the replay.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Blocking pops</div><div class="cb-g-says"><p>A paused batch is parked with its remaining commands; waiters per key are a FIFO queue; once the pushing batch has finished, the oldest waiter is served first and its batch resumes, so its pipelined replies stay in order.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Pub/sub</div><div class="cb-g-says"><p>Subscriber mode is per-connection state; messages are pushed through a queue with a <strong>bounded</strong> number of frames (not bytes), so a reader that stops reading is disconnected when it fills. <strong>Transactions</strong>: <strong>watch</strong> registers the client on keys; any write or expiry marks it dirty; EXEC then answers nil.</p><p><strong>Persistence</strong>: AOF with always/everysec/no, background rewrite (snapshot + buffered tail), torn-tail truncation on replay (other damage that parsing or replay can see refuses to start), and an RDB-style snapshot with a checksum. If a write or sync of the log fails, the server drops the unconfirmed replies and its executor stops. Simplifications vs real Redis: single database, RESP2 only, no replication/eviction/Lua/ACL, BGSAVE clones instead of fork(), hash/set replies are sorted (Redis: unspecified order).</p></div></div></div>
"""

[[sections]]
heading = "Limits"
body = """
This is a teaching server. Do not keep real data in it.

<ul class="cb-g-uses"><li>Durability is untested against power cuts. Tests cut the log file and restart the server in the same process. The code calls fsync on files and their directory. Checks watch the sync calls and inject failures into most of them. The file sync before a snapshot or rewritten log is renamed is only seen to be called. No check shows that data survives. No partial or full-disk write is tried.</li><li>The log has no per-record checksum. Damage that still reads as valid commands, or a damaged length that makes the rest look unfinished, is replayed or cut off without an error.</li><li>Memory is not bounded: there is no maxmemory and no limit on clients, value size, MULTI queue, subscriptions or reply size.</li><li>A command that arrives in pieces is parsed again from its start each time. Long commands, snapshot cloning, SAVE and the end of a rewrite stall every client. Shutdown does not wait for a background save.</li><li>Unlike Redis, blocked clients are served after the whole pushing pipeline batch, so a later pop in that batch can take the element first.</li><li>A message published just before UNSUBSCRIBE may arrive after its confirmation. SAVE and BGSAVE are refused inside MULTI. Deadlines follow the system clock, which can jump.</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>Redis is used as a cache (<strong>get/set</strong> with TTL)</li><li>a session store</li><li>a job/message queue (lists, BLPOP)</li><li>a rate limiter (INCR + <strong>expire</strong>)</li><li>a leaderboard (sorted sets)</li><li>a lightweight pub/sub bus</li><li><strong>Multi/watch</strong> give optimistic transactions</li></ul>
"""

