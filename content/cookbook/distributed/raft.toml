[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Replicated state machine.</strong> To keep several copies of a deterministic service identical, give every copy the same sequence of commands. Raft maintains that sequence, the <em>log</em>, on a majority of servers even when some crash and the network drops, delays, duplicates and partitions messages. A command is <em>committed</em> when it is on a majority; every committed command will be in the log of every future leader.</li> <li><strong>One leader per term.</strong> Time is divided into <em>terms</em>, numbered. A follower that hears nothing from a leader for a randomized <em>election timeout</em> becomes a candidate, increments its term, votes for itself and asks the others. A server gives at most one vote per term and only to a candidate whose log is at least as up to date (higher last term, or same last term and at least as long). A majority of votes makes a leader; two leaders cannot share a term because two majorities intersect.</li> <li><strong>The leader's log is the truth.</strong> The leader sends <code>AppendEntries(prev_index, prev_term, entries, commit)</code>. A follower accepts only if its log has the entry <code>(prev_index, prev_term)</code>; otherwise it replies with a hint and the leader backs up. If the follower has entries that conflict with the leader's, it deletes them and everything after. This <em>log matching</em> rule gives the property that two logs agreeing on one entry agree on everything before it.</li> <li><strong>Only entries of the leader's own term commit by counting.</strong> A leader marks index <em>N</em> committed when <em>N</em> is stored on a majority <em>and</em> the entry at <em>N</em> is from the current term. Entries of earlier terms then commit indirectly, as a prefix. Counting replicas of an old entry is unsafe (the paper's Figure 8: an old entry on a majority can still be overwritten by a leader whose log ends with a newer term), which is why every new leader appends a <em>no-op</em> of its own term at once.</li> <li><strong>Persist before replying.</strong> A server's current term, its vote and its log must be on stable storage before it answers a message that depends on them. A restart that forgets a vote can vote twice in one term; one that forgets a term can accept an old leader.</li> <li><strong>Pre-vote.</strong> A server cut off from the others keeps timing out and raising its term. When it returns, its inflated term deposes a healthy leader. With pre-vote it first asks "would you vote for me?" without changing any term, and nobody that has recently heard from a leader says yes; the partitioned server never inflates its term.</li> <li><strong>Clients need exactly-once semantics.</strong> A timed-out client cannot know whether its command was applied, so it retries; the state machine remembers, per client, the last sequence number and its result, and applies a command only once.</li> <li><strong>What Raft does not give you for free</strong>: reads (a stale leader may answer from old state, so reads go through the log, a heartbeat round or a lease), membership changes, log compaction and snapshots, and flow control. They are the exercises.</li> </ul>
"""

[[sections]]
heading = "The protocol in code"
body = """
<ul> <li><strong>State per server</strong>: durable <code>term</code>, <code>voted_for</code> and <code>log</code>; volatile <code>role</code>, <code>commit</code>, the applied state machine, and, on a leader, <code>next[p]</code> and <code>matched[p]</code> for each follower.</li> <li><strong>Messages</strong>: <code>Vote</code>/<code>VoteResp</code> and <code>PreVote</code>/<code>PreVoteResp</code>; <code>Append</code> with <code>prev_index</code>, <code>prev_term</code>, entries and the leader's commit index; <code>AppendResp</code> with success, the highest matching index and a <em>hint</em> where to resume after a failed check.</li> <li><strong>Replication</strong> uses <em>optimistic pipelining</em>: when the leader sends entries it advances <code>next[p]</code> at once, so a second proposal sends only its own entry; a rejection moves <code>next[p]</code> back to the hint. A heartbeat is an <code>Append</code> with whatever the follower still lacks.</li> <li><strong>Commit index</strong>: sort the match indices (the leader counts its own last index), take the quorum-th largest, and commit it if its entry is from the current term.</li> <li><strong>Restart</strong> reloads term, vote and log from the simulated disk and forgets everything else, the state machine included, which is rebuilt as the commit index advances again.</li> </ul>

:::deeper Reference: Raft node, replicated key-value state machine, and the deterministic cluster simulator with its safety checks
