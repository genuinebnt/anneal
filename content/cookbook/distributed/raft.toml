//! Raft consensus, written from the paper: leader election with randomized timeouts (and optional pre-vote), log replication with
//! consistency checks and fast backtracking, commitment by majority in the leader's own term, durable state that survives restarts,
//! and a replicated key-value state machine with exactly-once client commands. A deterministic cluster simulator with message delay,
//! loss, duplication, partitions and crashes drives it and checks the safety properties of the paper after every few steps.
use std::collections::{BTreeMap, HashMap, HashSet};

#[derive(Clone, Debug, PartialEq)]
pub enum Cmd {
    /// Appended by every new leader so that entries of earlier terms can be committed.
    Noop,
    Put { client: u64, seq: u64, key: u64, val: u64 },
    Get { client: u64, seq: u64, key: u64 },
}
#[derive(Clone, Debug, PartialEq)]
pub struct Entry {
    pub term: u64,
    pub cmd: Cmd,
}
#[derive(Clone, Debug, PartialEq)]
pub enum Resp {
    Ok,
    Value(Option<u64>),
}

#[derive(Clone, Debug)]
pub enum Msg {
    PreVote { term: u64, last_index: u64, last_term: u64 },
    PreVoteResp { term: u64, granted: bool },
    Vote { term: u64, last_index: u64, last_term: u64 },
    VoteResp { term: u64, granted: bool },
    Append { term: u64, prev_index: u64, prev_term: u64, entries: Vec<Entry>, commit: u64 },
    AppendResp { term: u64, ok: bool, match_index: u64, hint: u64 },
}

#[derive(Clone, Copy, Debug, PartialEq)]
pub enum Role {
    Follower,
    PreCandidate,
    Candidate,
    Leader,
}

/// The replicated state machine: a map with per-client duplicate suppression.
#[derive(Default, Clone, Debug, PartialEq)]
pub struct Sm {
    pub kv: HashMap<u64, u64>,
    last: HashMap<u64, (u64, Resp)>,
}
impl Sm {
    pub fn apply(&mut self, c: &Cmd) -> Resp {
        match c {
            Cmd::Noop => Resp::Ok,
            Cmd::Put { client, seq, key, val } => {
                if let Some((s, r)) = self.last.get(client) {
                    if seq <= s {
                        return r.clone();
                    }
                }
                self.kv.insert(*key, *val);
                self.last.insert(*client, (*seq, Resp::Ok));
                Resp::Ok
            }
            Cmd::Get { client, seq, key } => {
                if let Some((s, r)) = self.last.get(client) {
                    if seq <= s {
                        return r.clone();
                    }
                }
                let r = Resp::Value(self.kv.get(key).copied());
                self.last.insert(*client, (*seq, r.clone()));
                r
            }
        }
    }
}

#[derive(Clone, Debug, Default)]
struct Durable {
    term: u64,
    voted_for: Option<usize>,
    log: Vec<Entry>, // log[0] is a placeholder, so that indices start at 1
}

#[derive(Clone, Copy, Debug)]
pub struct Config {
    pub election_ticks: u64, // timeouts are drawn from [election_ticks, 2 * election_ticks)
    pub heartbeat_ticks: u64,
    pub pre_vote: bool,
    pub max_batch: usize,
}
impl Default for Config {
    fn default() -> Self {
        Config { election_ticks: 10, heartbeat_ticks: 3, pre_vote: false, max_batch: 64 }
    }
}

pub struct Node {
    pub id: usize,
    n: usize,
    pub cfg: Config,
    pub role: Role,
    d: Durable,
    disk: Durable,
    dirty_from: usize,
    pub commit: u64,
    pub applied: u64,
    pub sm: Sm,
    pub leader: Option<usize>,
    pub results: HashMap<u64, Resp>,
    elapsed: u64,
    timeout: u64,
    rng: u64,
    votes: HashSet<usize>,
    next: Vec<u64>,
    matched: Vec<u64>,
}

impl Node {
    pub fn new(id: usize, n: usize, cfg: Config, seed: u64) -> Node {
        let d = Durable { term: 0, voted_for: None, log: vec![Entry { term: 0, cmd: Cmd::Noop }] };
        let mut node = Node {
            id, n, cfg, role: Role::Follower, disk: d.clone(), d, dirty_from: 1, commit: 0, applied: 0, sm: Sm::default(), leader: None,
            results: HashMap::new(), elapsed: 0, timeout: 0, rng: seed.wrapping_mul(0x9E3779B97F4A7C15) | 1, votes: HashSet::new(), next: vec![1; n], matched: vec![0; n],
        };
        node.reset_timer();
        node
    }
    pub fn term(&self) -> u64 {
        self.d.term
    }
    pub fn log_len(&self) -> u64 {
        self.last_index()
    }
    pub fn entry(&self, i: u64) -> &Entry {
        &self.d.log[i as usize]
    }
    fn last_index(&self) -> u64 {
        self.d.log.len() as u64 - 1
    }
    fn last_term(&self) -> u64 {
        self.d.log.last().unwrap().term
    }
    fn rnd(&mut self, m: u64) -> u64 {
        self.rng ^= self.rng << 13;
        self.rng ^= self.rng >> 7;
        self.rng ^= self.rng << 17;
        self.rng % m
    }
    fn reset_timer(&mut self) {
        self.elapsed = 0;
        self.timeout = self.cfg.election_ticks + self.rnd(self.cfg.election_ticks);
    }
    /// Make the current term, vote and log durable. Messages that depend on them are sent after this.
    fn persist(&mut self) {
        self.disk.term = self.d.term;
        self.disk.voted_for = self.d.voted_for;
        let from = self.dirty_from.min(self.d.log.len());
        self.disk.log.truncate(from);
        self.disk.log.extend_from_slice(&self.d.log[from..]);
        self.dirty_from = self.d.log.len();
    }
    /// A restart loses everything that is not on disk.
    pub fn restart(&mut self) {
        self.d = self.disk.clone();
        self.dirty_from = self.d.log.len();
        self.role = Role::Follower;
        self.commit = 0;
        self.applied = 0;
        self.sm = Sm::default();
        self.results.clear();
        self.leader = None;
        self.votes.clear();
        self.reset_timer();
    }

    fn up_to_date(&self, last_index: u64, last_term: u64) -> bool {
        last_term > self.last_term() || (last_term == self.last_term() && last_index >= self.last_index())
    }
    fn step_down(&mut self, term: u64) {
        if term > self.d.term {
            self.d.term = term;
            self.d.voted_for = None;
            self.persist();
        }
        self.role = Role::Follower;
    }
    fn quorum(&self) -> usize {
        self.n / 2 + 1
    }
    fn broadcast(&self, out: &mut Vec<(usize, Msg)>, f: impl Fn(usize) -> Msg) {
        for p in 0..self.n {
            if p != self.id {
                out.push((p, f(p)));
            }
        }
    }

    pub fn on_tick(&mut self, out: &mut Vec<(usize, Msg)>) {
        self.elapsed += 1;
        match self.role {
            Role::Leader => {
                if self.elapsed >= self.cfg.heartbeat_ticks {
                    self.elapsed = 0;
                    self.replicate_all(out, true);
                }
            }
            _ => {
                if self.elapsed >= self.timeout {
                    if self.cfg.pre_vote && self.n > 1 {
                        self.role = Role::PreCandidate;
                        self.votes = HashSet::from([self.id]);
                        self.reset_timer();
                        let (t, li, lt) = (self.d.term + 1, self.last_index(), self.last_term());
                        self.broadcast(out, |_| Msg::PreVote { term: t, last_index: li, last_term: lt });
                    } else {
                        self.start_election(out);
                    }
                }
            }
        }
    }

    fn start_election(&mut self, out: &mut Vec<(usize, Msg)>) {
        self.d.term += 1;
        self.d.voted_for = Some(self.id);
        self.persist();
        self.role = Role::Candidate;
        self.leader = None;
        self.votes = HashSet::from([self.id]);
        self.reset_timer();
        if self.votes.len() >= self.quorum() {
            return self.become_leader(out);
        }
        let (t, li, lt) = (self.d.term, self.last_index(), self.last_term());
        self.broadcast(out, |_| Msg::Vote { term: t, last_index: li, last_term: lt });
    }

    fn become_leader(&mut self, out: &mut Vec<(usize, Msg)>) {
        self.role = Role::Leader;
        self.leader = Some(self.id);
        self.next = vec![self.last_index() + 1; self.n];
        self.matched = vec![0; self.n];
        self.elapsed = 0;
        self.d.log.push(Entry { term: self.d.term, cmd: Cmd::Noop });
        self.persist();
        self.advance_commit();
        self.replicate_all(out, true);
    }

    fn replicate_all(&mut self, out: &mut Vec<(usize, Msg)>, heartbeat: bool) {
        for p in 0..self.n {
            if p != self.id && (self.next[p] <= self.last_index() || heartbeat) {
                self.replicate_to(p, out);
            }
        }
    }
    /// Send the entries a follower is missing. `next` advances optimistically as soon as they are sent (pipelining), so entries are not
    /// sent twice while the first copy is in flight; a rejection moves it back.
    fn replicate_to(&mut self, p: usize, out: &mut Vec<(usize, Msg)>) {
        let prev = self.next[p] - 1;
        let end = (self.next[p] as usize + self.cfg.max_batch).min(self.d.log.len());
        let entries = self.d.log[self.next[p] as usize..end].to_vec();
        self.next[p] += entries.len() as u64;
        out.push((p, Msg::Append { term: self.d.term, prev_index: prev, prev_term: self.d.log[prev as usize].term, entries, commit: self.commit }));
    }

    /// Like `propose` but only appends to the log; `flush` makes the batch durable once and sends it (group commit).
    pub fn propose_buffered(&mut self, cmd: Cmd) -> Option<u64> {
        if self.role != Role::Leader {
            return None;
        }
        self.d.log.push(Entry { term: self.d.term, cmd });
        Some(self.last_index())
    }
    pub fn flush(&mut self, out: &mut Vec<(usize, Msg)>) {
        if self.role == Role::Leader {
            self.persist();
            self.advance_commit();
            self.replicate_all(out, false);
        }
    }

    /// Client entry point: only a leader accepts a command. Returns the log index it was given.
    pub fn propose(&mut self, cmd: Cmd, out: &mut Vec<(usize, Msg)>) -> Option<u64> {
        if self.role != Role::Leader {
            return None;
        }
        self.d.log.push(Entry { term: self.d.term, cmd });
        self.persist();
        self.advance_commit();
        self.replicate_all(out, false);
        Some(self.last_index())
    }

    fn advance_commit(&mut self) {
        // the largest index stored on a majority (the quorum-th largest match, counting our own log); it commits only if its entry is
        // from the current term, and then everything before it, including entries of earlier terms, commits with it
        let mut m: Vec<u64> = (0..self.n).map(|p| if p == self.id { self.last_index() } else { self.matched[p] }).collect();
        m.sort_unstable_by(|a, b| b.cmp(a));
        let n = m[self.quorum() - 1];
        if n > self.commit && self.d.log[n as usize].term == self.d.term {
            self.commit = n;
        }
        self.apply();
    }
    fn apply(&mut self) {
        while self.applied < self.commit {
            self.applied += 1;
            let r = self.sm.apply(&self.d.log[self.applied as usize].cmd);
            self.results.insert(self.applied, r);
        }
    }

    pub fn on_msg(&mut self, from: usize, m: Msg, out: &mut Vec<(usize, Msg)>) {
        match m {
            Msg::PreVote { term, last_index, last_term } => {
                // grant only if we would vote for this candidate and have not heard from a leader recently
                let heard = self.role == Role::Leader || (self.leader.is_some() && self.elapsed < self.cfg.election_ticks);
                let granted = term > self.d.term && self.up_to_date(last_index, last_term) && !heard;
                out.push((from, Msg::PreVoteResp { term, granted }));
            }
            Msg::PreVoteResp { term, granted } => {
                if self.role == Role::PreCandidate && term == self.d.term + 1 && granted {
                    self.votes.insert(from);
                    if self.votes.len() >= self.quorum() {
                        self.start_election(out);
                    }
                }
            }
            Msg::Vote { term, last_index, last_term } => {
                if term > self.d.term {
                    self.step_down(term);
                }
                let granted = term == self.d.term && self.d.voted_for.is_none_or(|v| v == from) && self.up_to_date(last_index, last_term);
                if granted {
                    self.d.voted_for = Some(from);
                    self.persist();
                    self.reset_timer();
                }
                out.push((from, Msg::VoteResp { term: self.d.term, granted }));
            }
            Msg::VoteResp { term, granted } => {
                if term > self.d.term {
                    return self.step_down(term);
                }
                if self.role == Role::Candidate && term == self.d.term && granted {
                    self.votes.insert(from);
                    if self.votes.len() >= self.quorum() {
                        self.become_leader(out);
                    }
                }
            }
            Msg::Append { term, prev_index, prev_term, entries, commit } => {
                if term < self.d.term {
                    return out.push((from, Msg::AppendResp { term: self.d.term, ok: false, match_index: 0, hint: 0 }));
                }
                if term > self.d.term || self.role != Role::Follower {
                    self.step_down(term);
                }
                self.leader = Some(from);
                self.reset_timer();
                // the entry before the new ones must match
                if prev_index > self.last_index() {
                    return out.push((from, Msg::AppendResp { term: self.d.term, ok: false, match_index: 0, hint: self.last_index() + 1 }));
                }
                if self.d.log[prev_index as usize].term != prev_term {
                    let bad = self.d.log[prev_index as usize].term;
                    let mut first = prev_index;
                    while first > 1 && self.d.log[first as usize - 1].term == bad {
                        first -= 1;
                    }
                    return out.push((from, Msg::AppendResp { term: self.d.term, ok: false, match_index: 0, hint: first }));
                }
                // append, replacing only entries that conflict
                let mut changed = false;
                for (k, e) in entries.iter().enumerate() {
                    let idx = prev_index as usize + 1 + k;
                    if idx < self.d.log.len() {
                        if self.d.log[idx].term != e.term {
                            self.d.log.truncate(idx);
                            self.dirty_from = self.dirty_from.min(idx);
                            self.d.log.push(e.clone());
                            changed = true;
                        }
                    } else {
                        self.d.log.push(e.clone());
                        changed = true;
                    }
                }
                if changed {
                    self.persist();
                }
                let last_new = prev_index + entries.len() as u64;
                if commit > self.commit {
                    self.commit = commit.min(last_new);
                    self.apply();
                }
                out.push((from, Msg::AppendResp { term: self.d.term, ok: true, match_index: last_new, hint: 0 }));
            }
            Msg::AppendResp { term, ok, match_index, hint } => {
                if term > self.d.term {
                    return self.step_down(term);
                }
                if self.role != Role::Leader || term != self.d.term {
                    return;
                }
                if ok {
                    self.matched[from] = self.matched[from].max(match_index);
                    self.next[from] = self.next[from].max(self.matched[from] + 1);
                    self.advance_commit();
                    if self.next[from] <= self.last_index() {
                        self.replicate_to(from, out);
                    }
                } else {
                    self.next[from] = hint.clamp(1, self.last_index() + 1);
                    self.replicate_to(from, out);
                }
            }
        }
    }
}

// ---------------------------------------------------------------------------------------------------------------------------------
// the simulated cluster
// ---------------------------------------------------------------------------------------------------------------------------------

pub struct Cluster {
    pub nodes: Vec<Node>,
    pub up: Vec<bool>,
    pub now: u64,
    net: Vec<(u64, usize, usize, Msg)>,
    rng: u64,
    /// `cut[a][b]`: messages from `a` to `b` are lost.
    pub cut: Vec<Vec<bool>>,
    pub drop_pct: u64,
    pub dup_pct: u64,
    pub max_delay: u64,
    /// Deliver messages between each pair of nodes in the order they were sent (like a TCP connection) instead of reordering them.
    pub fifo: bool,
    last_at: Vec<Vec<u64>>,
    pub sent: u64,
    pub leaders_by_term: BTreeMap<u64, usize>,
    pub committed: Vec<Entry>,
    pub violation: Option<String>,
    /// Turn the per-step safety checks off for long measurement runs.
    pub check: bool,
}

impl Cluster {
    pub fn new(n: usize, cfg: Config, seed: u64) -> Cluster {
        Cluster {
            nodes: (0..n).map(|i| Node::new(i, n, cfg, seed * 1000 + i as u64 + 1)).collect(),
            up: vec![true; n], now: 0, net: vec![], rng: seed.wrapping_mul(0x2545F4914F6CDD1D) | 1, cut: vec![vec![false; n]; n], drop_pct: 0, dup_pct: 0, max_delay: 3,
            fifo: false,
            last_at: vec![vec![0; n]; n],
            sent: 0, leaders_by_term: BTreeMap::new(), committed: vec![], violation: None, check: true,
        }
    }
    pub fn rnd(&mut self, m: u64) -> u64 {
        self.rng ^= self.rng << 13;
        self.rng ^= self.rng >> 7;
        self.rng ^= self.rng << 17;
        self.rng % m
    }
    fn send(&mut self, from: usize, out: Vec<(usize, Msg)>) {
        for (to, m) in out {
            self.sent += 1;
            let mut delay = 1 + self.rnd(self.max_delay);
            if self.fifo {
                // never overtake an earlier message on the same link
                delay = delay.max(self.last_at[from][to].saturating_sub(self.now));
                self.last_at[from][to] = self.now + delay;
            }
            if self.dup_pct > 0 && self.rnd(100) < self.dup_pct {
                let extra = self.rnd(self.max_delay);
                self.net.push((self.now + delay + extra, from, to, m.clone()));
            }
            self.net.push((self.now + delay, from, to, m));
        }
    }
    pub fn partition(&mut self, groups: &[&[usize]]) {
        let n = self.nodes.len();
        for a in 0..n {
            for b in 0..n {
                self.cut[a][b] = !groups.iter().any(|g| g.contains(&a) && g.contains(&b)) && a != b;
            }
        }
    }
    pub fn heal(&mut self) {
        for row in self.cut.iter_mut() {
            row.iter_mut().for_each(|c| *c = false);
        }
    }
    pub fn crash(&mut self, i: usize) {
        self.up[i] = false;
    }
    pub fn restart(&mut self, i: usize) {
        self.nodes[i].restart();
        self.up[i] = true;
    }
    /// Replicate what a leader has buffered with `propose_buffered`.
    pub fn flush(&mut self, i: usize) {
        if !self.up[i] {
            return;
        }
        let mut out = vec![];
        self.nodes[i].flush(&mut out);
        self.send(i, out);
        self.check_cheap();
    }
    pub fn leader(&self) -> Option<usize> {
        (0..self.nodes.len()).filter(|&i| self.up[i] && self.nodes[i].role == Role::Leader).max_by_key(|&i| self.nodes[i].term())
    }
    pub fn propose(&mut self, to: usize, cmd: Cmd) -> Option<u64> {
        if !self.up[to] {
            return None;
        }
        let mut out = vec![];
        let r = self.nodes[to].propose(cmd, &mut out);
        self.send(to, out);
        self.check_cheap();
        r
    }

    /// One tick of simulated time: deliver what is due, then fire timers.
    pub fn step(&mut self) {
        self.now += 1;
        let mut due: Vec<(usize, usize, Msg)> = vec![];
        let mut keep = Vec::with_capacity(self.net.len());
        for (at, f, t, m) in std::mem::take(&mut self.net) {
            if at <= self.now {
                due.push((f, t, m));
            } else {
                keep.push((at, f, t, m));
            }
        }
        self.net = keep;
        if !self.fifo {
            // arrival order within a tick is random
            for k in (1..due.len()).rev() {
                let j = self.rnd(k as u64 + 1) as usize;
                due.swap(k, j);
            }
        }
        for (f, t, m) in due {
            if !self.up[t] || self.cut[f][t] || (self.drop_pct > 0 && self.rnd(100) < self.drop_pct) {
                continue;
            }
            let mut out = vec![];
            self.nodes[t].on_msg(f, m, &mut out);
            self.send(t, out);
        }
        for i in 0..self.nodes.len() {
            if self.up[i] {
                let mut out = vec![];
                self.nodes[i].on_tick(&mut out);
                self.send(i, out);
            }
        }
        self.check_cheap();
        if self.check && self.now % 10 == 0 {
            self.check_logs();
        }
    }
    pub fn run(&mut self, ticks: u64) {
        for _ in 0..ticks {
            self.step();
        }
    }

    fn fail(&mut self, msg: String) {
        if self.violation.is_none() {
            self.violation = Some(msg);
        }
    }
    /// Election safety and state-machine safety, checked after every step.
    fn check_cheap(&mut self) {
        if !self.check {
            return;
        }
        for i in 0..self.nodes.len() {
            if self.nodes[i].role == Role::Leader {
                let t = self.nodes[i].term();
                match self.leaders_by_term.get(&t) {
                    Some(&j) if j != i => self.fail(format!("two leaders in term {t}: {j} and {i}")),
                    _ => {
                        self.leaders_by_term.insert(t, i);
                    }
                }
            }
            for k in 1..=self.nodes[i].commit as usize {
                let e = self.nodes[i].d.log[k].clone();
                if k <= self.committed.len() {
                    if self.committed[k - 1] != e {
                        self.fail(format!("node {i} committed a different entry at index {k}: {:?} against {:?}", e, self.committed[k - 1]));
                    }
                } else if k == self.committed.len() + 1 {
                    self.committed.push(e);
                } else {
                    unreachable!("commit index skipped an entry");
                }
            }
        }
    }
    /// Log matching: entries with the same index and term imply identical prefixes.
    fn check_logs(&mut self) {
        let n = self.nodes.len();
        for a in 0..n {
            for b in a + 1..n {
                let (la, lb) = (&self.nodes[a].d.log, &self.nodes[b].d.log);
                let common = la.len().min(lb.len());
                if let Some(i) = (1..common).rev().find(|&i| la[i].term == lb[i].term) {
                    if la[..=i] != lb[..=i] {
                        let msg = format!("logs of {a} and {b} agree on (index {i}, term {}) but differ before it", la[i].term);
                        self.fail(msg);
                        return;
                    }
                }
            }
        }
    }
    /// The state machine of every node that has applied `k` entries equals a replay of the committed prefix.
    pub fn check_state_machines(&self) -> Result<(), String> {
        for (i, nd) in self.nodes.iter().enumerate() {
            let mut sm = Sm::default();
            for e in self.committed.iter().take(nd.applied as usize) {
                sm.apply(&e.cmd);
            }
            if sm != nd.sm {
                return Err(format!("node {i}'s state machine differs from a replay of {} committed entries", nd.applied));
            }
        }
        Ok(())
    }
}
