[[sections]]
heading = "Measured"
body = """
<p>The harness is a deterministic cluster: messages are delayed by 1 to 3 ticks, may be dropped, duplicated, reordered or cut by a partition; nodes crash and restart from their disks. After every step it checks, independently of the nodes' own logic: <em>election safety</em> (at most one leader per term), <em>state-machine safety</em> (the committed prefix is identical on every node and no node ever commits something different at an index another node committed), and, every ten ticks, <em>log matching</em> (equal term at an index implies equal prefix).</p>

```text title="safety under faults, linearizability of the replicated store, and pre-vote"
pre-vote false: isolated node's term 27 (cluster's 1); after healing the leader's term is 28, leader changed: true
pre-vote  true: isolated node's term 1 (cluster's 1); after healing the leader's term is 1, leader changed: false
120 runs: 1081 operations completed, 3714 retried, 1385 left pending; every per-key history is linearizable
300 chaotic runs: 3169 leaders elected over 14926 partitions and 5187 crashes, 12532 entries committed, highest term 100; no safety violation
```

<ul> <li><strong>300 chaotic runs</strong> (3 or 5 nodes, up to 20% loss, 10% duplication, partitions of a node or into two halves, crashes and restarts, random client commands to random nodes): <strong>no safety violation</strong> in 1 500 ticks each, 3 169 leaders elected, 12 532 entries committed, terms up to 100. At the end each run heals the cluster and requires a leader within 300 ticks, every log entry of earlier terms committed without any new client command (the no-op), and a fresh command applied on all nodes.</li> <li><strong>Linearizability</strong>: 120 runs of three clients issuing reads and writes through crashes and partitions, retrying timed-out commands on other nodes. 1 081 operations completed, 3 714 were retried, 1 385 stayed pending (the client gave up); a Wing and Gong checker finds a legal sequential order for every key's history, with pending writes free to have taken effect or not. The checker itself is tested: it rejects a read after a completed write that returns the old value.</li> <li><strong>Pre-vote in numbers</strong>: a node isolated for 400 ticks raises its term to <strong>27</strong> without pre-vote and then deposes the leader at the heal (leader's term 28); with pre-vote it stays at term 1 and nothing changes.</li> </ul>

```text title="leader failure, and the cost of replication"
leader crash in a 5-node cluster (message delay 1 to 3 ticks), 150 crashes per row; ticks from the crash until a new leader exists / until a command commits
election ticks  heartbeat   leader p50   leader p99   commit p50   commit p99
             5          2            9           34           15           49
            10          3           15           54           21           61
            20          5           28           68           33           77
            40         10           50          112           56          117
steady state: 5 nodes, 8 commands proposed per tick for 4 000 ticks, ordered links, no faults
              leader sends  max batch    committed   messages/entry   commit lag p50
         on every proposal          1        32000             8.34              5 t
         on every proposal         64        32000             8.34              5 t
             once per tick          1        32000             8.19              7 t
             once per tick         64        32000             1.34              4 t
```

<ul> <li><strong>Unavailability after a leader failure is about the election timeout plus an election</strong>: the median new leader appears 15 ticks after the crash with a timeout of 10 to 20 ticks, and a command commits 21 ticks after the crash. The 99th percentile is 3 to 4 times the median because split votes need a second round; larger timeouts trade recovery time for fewer spurious elections.</li> <li><strong>A message per entry is the cost of sending on every proposal</strong>: 4 appends and 4 acknowledgements per entry (8.34). Sending once per tick with a batch of 64 entries takes <strong>1.34 messages per entry, six times fewer</strong>, and a lower commit lag (4 ticks against 5). Batching only helps if the batch limit allows it: with one entry per message the coalesced leader still sends 8.19.</li> </ul>

<aside data-call="note"><b>Three things the measurements forced</b><p><strong>Quadratic commit.</strong> The first <code>advance_commit</code> walked down from the last index looking for the highest replicated entry; a leader whose followers fall behind scans the whole backlog on every acknowledgement, and a 32 000-entry run did not finish. It now sorts the match indices (O(n log n), independent of the backlog) and the Figure 8 test still passes. <strong>A message storm.</strong> The first replication sent the missing entries on every proposal and again on every acknowledgement, and moved <code>next</code> only when an acknowledgement arrived. With reordered messages the leader sent the same entries many times over: <strong>780 messages per entry</strong> at a batch limit of 1. Optimistic pipelining plus ordered links (the transport Raft is normally built on) brought it to 8.3. <strong>A mistaken client.</strong> Even a perfectly correct cluster loses a command proposed to a leader that is about to be deposed; the first measurement client waited forever. Clients must retry at the current leader, and the state machine's duplicate suppression makes that safe.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A node is a pure state machine</strong>: <code>on_msg(from, msg, &amp;mut out)</code> and <code>on_tick(&amp;mut out)</code> take and produce messages and touch nothing else. The simulator owns the network, time and failures, so a run is a function of a seed and any failure replays exactly.</li> <li><strong>Durable versus volatile state</strong>: <code>Durable { term, voted_for, log }</code> is cloned to a <code>disk</code> copy by <code>persist()</code>, which copies only the suffix of the log that changed (<code>dirty_from</code>); <code>restart()</code> rebuilds the node from the disk copy. Forgetting a <code>persist()</code> call is then a visible, testable bug.</li> <li><strong>Enums for roles and messages</strong>: every message is a variant of <code>Msg</code>; the handler is one <code>match</code>. <code>Option&lt;usize&gt;</code> for <code>voted_for</code>, <code>is_none_or(|v| v == from)</code> for the vote rule.</li> <li><strong>Index 0 is a sentinel entry</strong> so that <code>prev_index = 0</code> needs no special case and log indices equal Vec indices.</li> <li><strong>The cluster checks, the node doesn't</strong>: <code>Cluster</code> records which node led each term and the globally committed prefix, so the safety properties are asserted by code that shares nothing with the protocol logic.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Chaos (300 seeds)</strong>: loss, duplication, delay, partitions, crashes, random client commands, with pre-vote on and off, checked every step for election safety and state-machine safety and every ten ticks for log matching; at the end the cluster is healed and must elect a leader, commit all earlier-term entries without new commands, replicate a fresh command everywhere, and have state machines equal to a replay of the committed prefix.</li> <li><strong>Linearizability (120 seeds)</strong>: three clients with retries against crashes and partitions; per-key Wing and Gong check with pending writes; the checker is itself tested on accepted and rejected histories.</li> <li><strong>Scenarios</strong>: a cluster of 1, 3 and 5 nodes elects exactly one leader and converges; a leader isolated with one follower accepts three commands that never commit and loses them when the partition heals, while the majority's commands survive; a duplicated command is applied once; pre-vote leaves the term unchanged for an isolated node.</li> <li><strong>Single-node rules that random runs reach only by luck</strong>: a vote given in a term is refused to another candidate after a restart; a term learned from a vote or a heartbeat survives a restart; a restarted candidate remembers it voted for itself; a follower caps the leader's commit index by what it received; a vote reply from an earlier term does not count; pre-vote is refused after a recent heartbeat and granted after silence.</li> <li><strong>Figure 8</strong>: scripted by hand with message-by-message delivery: entry 2 of term 1 reaches a majority through a leader of term 3 that crashes before replicating its own entry; the leader must not have committed it, and when a node with a term-2 entry wins a later election, nothing committed may be lost.</li> <li><strong>Mutants run against these tests</strong>: a candidate with a stale log winning; a vote, a candidate's own vote, or a new term not persisted; counting replicas to commit an earlier-term entry; one replica too few; conflicting entries not truncated; the previous-entry check skipped; a follower committing beyond what it has; a follower not resetting its timer on appends; a node voting twice in a term; a leader ignoring a higher term in a reply; no no-op after an election; duplicate commands applied again; pre-vote ignoring a recent leader; stale vote replies counted; the leader's own entry not persisted. <strong>All 17 were killed.</strong> Seven survived the random runs and needed the directed tests above (the three persistence rules, Figure 8, the commit cap, the pre-vote rule, the stale vote); random crashes cannot be relied on to hit the one tick where a missing <code>persist</code> matters.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>etcd</strong> (Go, the Raft behind Kubernetes) and <strong>Consul</strong>/<strong>Nomad</strong> (HashiCorp's Raft library) are the best-known implementations; both use pre-vote, leader leases or ReadIndex for reads, snapshots, and learner (non-voting) members.</li> <li><strong>TiKV</strong> runs one Raft group per <em>region</em> (about 96 MB of keys) with thousands of groups per node, batching their messages together; <strong>CockroachDB</strong> and <strong>YugabyteDB</strong> do the same per range or tablet; <strong>MongoDB</strong> has a Raft-like protocol for its replica sets; <strong>Kafka</strong> replaced ZooKeeper by KRaft.</li> <li><strong>Variants</strong>: Multi-Paxos (the same guarantees, differently organized), Viewstamped Replication, EPaxos (leaderless, for commutative commands), Raft with <em>joint consensus</em> or single-server changes for membership, and witness replicas that vote without storing data.</li> <li><strong>What the implementations add to the paper</strong>: flow control and pipelining with inflight windows, log compaction with <code>InstallSnapshot</code>, check-quorum so a leader that cannot reach a majority steps down, batching of fsyncs (group commit), disk-failure handling, and persistence formats with checksums (<a href="/cookbook/p/a-durable-lsm-tree">a durable log</a>).</li> <li><strong>Testing</strong>: Jepsen tests find bugs in every system that claims consensus; FoundationDB's deterministic simulation, and its descendants (TigerBeetle, Antithesis), are the model for what this section's simulator does at small scale (<a href="/cookbook/p/deterministic-simulation">deterministic simulation</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>A missing <code>fsync</code> is an invisible bug.</strong> The protocol is correct only if the persisted term, vote and log are on stable storage before any reply that depends on them. Test restart at every message boundary.</li> <li><strong>Reads need care.</strong> A deposed leader that has not noticed can serve stale reads. Send reads through the log, confirm leadership with a heartbeat round (ReadIndex), or use a lease with a bounded clock-drift assumption.</li> <li><strong>Timeouts are a trade-off and a hazard.</strong> Too short and a slow disk or GC pause causes elections; too long and failures take long to notice. Use at least ten times the heartbeat interval and measure the real latency distribution. Check-quorum and pre-vote prevent the worst cascades.</li> <li><strong>Membership changes are subtle.</strong> Switching a configuration all at once can create two disjoint majorities. Change one server at a time, or use joint consensus.</li> <li><strong>Unbounded logs</strong>: without snapshots the log grows forever and a restarted node replays it all.</li> <li><strong>Reordering and duplicates</strong> are normal in the paper's model but expensive in practice; run on ordered, reliable connections and keep retransmission logic simple.</li> <li><strong>Each Raft group has one leader</strong>: a single group caps throughput at one machine's. Scale by running many groups (<a href="/cookbook/p/sharding">sharding</a>).</li> </ul></aside>
