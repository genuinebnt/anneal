[[sections]]
heading = "What it is"
body = """
a deterministic, single-threaded, in-memory model of the ideas that make Kafka work (not its protocol or IO). **A topic** has **P partitions**; each partition is an append-only **log** of records with increasing offsets.

Ordering is only guaranteed **within** a partition: the producer's partitioner maps a key to a partition by hash (same key -> same partition -> per-key order) and spreads null-key records round-robin; across partitions there is no order, which is what buys parallelism.
"""

[[sections]]
heading = "Design notes"
body = """
**Storage**: a partition is split into **segments**. Only the last (active) segment is written; old segments are immutable, so **retention** is "delete whole old files" (cheap) and **compaction** rewrites closed segments keeping only the latest value per key (a None value is a **tombstone** = delete).

**A sparse offset index** (one entry per few records) is binary searched, then a short scan finishes the lookup: small memory, near-O(log n) reads.

**Delivery**: an idempotent producer tags batches with (producer id, sequence); the broker drops retried duplicates. Consumers in a **group** split partitions (each owned by exactly one member); progress is a **committed offset** per (group, topic, partition).

Commit **after** processing = at-least-once (a crash replays); commit **before** = at-most-once (a crash skips); at-least-once plus an idempotent sink (dedupe by partition+offset, ideally atomically with the effect) = effectively-once. **Replication**: followers copy the leader; the **high watermark** is the smallest log end among in-sync replicas (ISR).

Consumers only see data below it, so anything a consumer saw survives a leader failover.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>event sourcing and CDC pipelines</li><li>durable work queues</li><li>metrics/log aggregation</li><li>stream processing state changelogs (compacted topics hold the latest state per key)</li><li>cross-service integration where consumers replay history</li></ul>
"""

