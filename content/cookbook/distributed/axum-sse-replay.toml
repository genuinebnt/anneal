<ul class="cb-g-uses"><li>live progress feeds: build logs</li><li>job status</li><li>notifications</li><li>reconnect-safe via Last-Event-ID</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: persist events with increasing ids. When a client reconnects it sends `Last-Event-ID: N`; the server replays only events with id > N, then continues live. `KeepAlive` sends comment lines so proxies do not close idle connections.

Here the "live" part is omitted; the replay logic is the lesson. Spec: <https://html.spec.whatwg.org/multipage/server-sent-events.html>
"""

