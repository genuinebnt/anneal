[[sections]]
heading = "Design notes"
body = """
Companions: `axum_idempotency` is the HTTP shape; `lease_fencing_sim` shows **why** a lease without tokens fails (not repeated here); `transactional_outbox_inbox_sqlite` makes "record the key" and "do the effect" one transaction.

A. **Idempotency keys**. State per (key): IN-FLIGHT(attempt, fingerprint, lock expiry) or DONE(response, fingerprint, retention expiry).

Same key + different request body is a **client bug** and is refused, never replayed. A concurrent duplicate gets "in flight" (HTTP 409), not a second execution. A handler that dies leaves a lock that expires; the takeover gets a **new** attempt number and the old attempt can no longer complete.

**What this cannot do**: if the handler died **after** the effect and **before** `complete`, the retry runs the effect again. Only an effect committed **atomically** with the key (same database transaction) or an effect that is itself keyed closes that gap; both outcomes are demonstrated. B.

**Dedup for consumers**. Three tools: (1) exact set with a time window; (2) per-producer **sliding window** over sequence numbers (a high-water mark plus a bitmap; anything older than the window is refused, so memory is constant); (3) a **bloom filter** as a pre-check: "definitely new" skips the expensive exact lookup, "maybe seen" **must** fall through to it.

Dropping on a Bloom hit silently loses new messages. No window is forever: a duplicate older than the window is a design decision, not a surprise. C.

**Leader election** on a linearisable store with only `read` and `compare_and_set(revision)`. The record is (holder, expires_at, token); every change of leadership increments the token. Expiry is judged by the **store**'s clock.

Nodes measure their own lease with their own, skewed clocks, and may be paused at any instruction. D. **The fenced resource** rejects a token lower than the highest it has seen, checking and writing in **one** atomic step.

**The subtle part**: that alone is not enough. Until the new leader **touches** the resource, the resource has not heard of the new token, so an old leader's delayed write is still accepted, possibly **after** the new leader has read the state it is about to overwrite: a lost update. So a new leader must first **fence** the resource (publish its token) and only **then** read.

The chaos test runs the same schedules with: no check, check only, check + fence-before-read. **Simulation**: single threaded and seeded; each node is a state machine advanced one step at a time, so a "pause" is simply not being scheduled while the store clock runs. In-flight messages are delayed and reordered.

Not modelled: the lease store itself failing (that is consensus: see the Raft recipes), or Byzantine nodes that forge tokens. Nor a message delivered **twice**: a token check alone accepts a repeated write from the current leader, which can undo its later write; that also needs a sequence number or a version check.

**Limits**: `IdemStore` never evicts a key (an expired one stays until the same key is used again), and a key left in flight by a crash stays tied to its first request body. `Window::accept` panics on sequence number 0, so check untrusted input before calling it; and one forged huge number moves the window past all real ones (authenticate first).
"""

