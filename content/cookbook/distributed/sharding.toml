heading = "Measured"
body = """
<p>First, correctness. 60 runs of 600 operations on 4 to 7 nodes mix client puts, deletes, gets and scans (through three clients with their own caches) with random splits, merges, leader transfers, automatic splits and replica moves that advance a few keys at a time <em>between</em> the client requests. After every operation the invariants hold (ranges tile the key space; replicas are distinct, include the leader, and are identical; no node holds data for a range it is not part of), and every read equals a plain map.</p>

```text title="60 randomized runs, and load balance by key design"
60 runs: 1601 splits, 870 merges, 459 replica moves with concurrent writes, 1785 leader transfers, 7808 stale-cache redirects
200 000 writes, 9 nodes, rf 3: load of the busiest node relative to the average (1.0 is perfect)
key design                                   ranges  imbalance   splits  transfers ranges for 200 neighbours
sequential keys (timestamp, auto-increment)      19       9.00       18       1116                  1
hashed keys                                      16       1.20       15       3038                 16
tenant prefix + sequence inside the tenant       16       1.12       15       4001                  1
skewed reads (Zipf-like, 100 000 keys): imbalance 9.00 with 32 ranges (hottest range 139842 requests); after load-based splits and leader transfers: 1.12 with 113 ranges (112 splits, 240 leader transfers, 47 replica moves)
adding node 10 to 9 nodes (900000 stored copies in 32 ranges): range rebalancing copied 84375 keys (9.4% of copies); hash-mod placement would move 90%, ideal 1/10 = 10%
```

<ul> <li><strong>Sequential keys defeat sharding.</strong> After 18 splits and over a thousand leader transfers, the busiest node still serves <strong>9.00×</strong> the average, which is all nine nodes' worth of writes on one: every insert goes to the last range. The splitting works (19 ranges), but the new keys keep arriving at the right edge.</li> <li><strong>Hashing fixes the load and breaks the scan</strong>: imbalance 1.20, but 200 logically adjacent records sit in all 16 ranges. A <strong>tenant prefix with a per-tenant sequence</strong> gets both: imbalance 1.12 and the 200 neighbours in a single range. This is the design rule behind composite primary keys in range-sharded databases.</li> <li><strong>Skewed reads are fixed by splitting and moving leadership</strong>: a Zipf-like read workload started with all load on one node (9.00, the hottest range taking 139 842 of 200 000 requests); 112 load-based splits, 240 leader transfers and 47 replica moves bring it to <strong>1.12</strong>. A single hot <em>key</em> can never be split further; the floor is the key's own share.</li> <li><strong>Adding a tenth node copies 9.4% of the stored data</strong>, near the ideal 10%; placing keys by hash modulo the node count would move 90%.</li> <li><strong>Stale caches are cheap</strong>: the 60 runs, with ranges changing under three caching clients, cost 7 808 redirects for the whole workload, each one a metadata lookup; every redirected request still returned the right answer.</li> </ul>

<aside data-call="note"><b>Out of memory, and what it taught about the test harness</b><p>A mutation run of this section's tests ran the development machine out of memory (the editor reported 120 GB): a mutant that skipped one key when a scan crossed a range boundary made the scan loop run away, collecting results without bound, and the mutation script killed only <code>cargo</code>, not the test binary that <code>cargo</code> had started, so the runaway process kept growing. The script now starts each run in its own process group, kills the whole group on timeout, polls its memory use and kills it above a cap (3 GB by default), and restores the mutated source file even when interrupted. The library got the matching defence: a client request that has not converged after 16 refreshes panics instead of looping.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Ranges in a <code>BTreeMap&lt;Key, RangeDesc&gt;</code> keyed by start</strong>: <code>range(..=key).next_back()</code> is the lookup, <code>split_off</code> cuts a replica's data at the split key in place, and the invariant "the starts tile the key space" is one loop in <code>check()</code>.</li> <li><strong>Replica data in a <code>HashMap&lt;(range id, node), BTreeMap&gt;</code></strong>: removing a replica is removing a map entry; a mutant that forgets to is found by counting stores against replicas.</li> <li><strong>Learner cursor</strong>: a learner receives a write only if the key is below the copy cursor, because keys above it will be copied later from the (already updated) leader. Both halves of the rule are needed, and the model test interleaves writes with every chunk to exercise them.</li> <li><strong>Errors for control flow</strong>: <code>RangeError::Stale</code> is the only error; the client's <code>with</code> takes a closure <code>FnMut(&amp;mut Store, id, epoch) -&gt; Result&lt;T, RangeError&gt;</code>, so one retry loop serves puts, deletes, gets and scans.</li> <li><strong>Policies are plain functions on the store</strong>, so a test can run them at any moment and check the invariants; a production system runs them as a background scheduler with rate limits.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Randomized model (60 seeds × 600 steps)</strong>: clients with separate caches, splits at random keys, merges, leader transfers, automatic splits, and replica moves advanced in small steps between requests; <code>check()</code> after every step; every get and scan equals a <code>BTreeMap</code>; final contents equal the model.</li> <li><strong>Directed</strong>: a fresh cache needs no redirect, a stale one is corrected once and then fresh; a leader transfer makes a cached route stale; a replica added while writes land both below and above its copy cursor ends identical to the leader and can serve alone; a learner cannot be promoted after copying 10 of 100 keys; ranges with different replica sets or different leaders do not merge.</li> <li><strong>Mutants run against these tests</strong>: a learner missing puts or deletes below its cursor; the copy cursor not advancing; the copy finishing early; a learner promoted before its copy is complete; a split leaving the boundary key on the wrong side; a merge ignoring differing leaders; a range lookup excluding its start key; a removed replica keeping its data; writes reaching only the leader; a scan skipping the first key of the next range; a leader transfer not changing the epoch; a client keeping overlapping stale entries; a merge forgetting the right range's keys. <strong>All 14 were killed</strong>: twelve by failing assertions or panics, one by non-termination and one by the memory cap. The first run left one alive (merge of ranges with different leaders), now covered.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>CockroachDB</strong> splits ranges at 512 MB (or by load, "load-based splitting"), keeps one Raft group per range, rebalances replicas and leaseholders by store capacity and QPS, and caches range descriptors in clients and gateways with epoch-checked retries. <strong>TiKV</strong> calls them regions (96 MB), with the Placement Driver as the scheduler. <strong>YugabyteDB</strong> uses tablets, with hash or range sharding per table. <strong>Spanner</strong> has splits, moved by load and size. <strong>Bigtable/HBase</strong> tablets and regions work the same way.</li> <li><strong>Vitess</strong> and <strong>Citus</strong> shard MySQL and PostgreSQL by a sharding key chosen per table (hash or range), with a routing layer. <strong>MongoDB</strong> has hashed or ranged shard keys with chunk migration and a balancer. <strong>Cassandra/DynamoDB</strong> hash the partition key and keep the sort key ordered inside the partition, the "prefix plus ordering" design above.</li> <li><strong>Hot-spot defences</strong>: hash-prefixing monotonic keys (and giving up scans), salting a hot key across buckets and merging reads, sequences with randomized high bits (UUIDv7-like keys keep time order but not insert order across a prefix), and adaptive splitting of single hot ranges.</li> <li><strong>Consistent hashing and rendezvous hashing</strong> (Dynamo, Cassandra) place keys without a map; they move 1/N on a change like range rebalancing, but cannot scan (<a href="/cookbook/p/distributed-databases-i">distributed databases</a> covers the algorithms).</li> <li><strong>Multi-Raft</strong>: thousands of groups per node need coalesced heartbeats, shared logs or one fsync for many groups, and per-group snapshots (<a href="/cookbook/p/raft">Raft</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Monotonic keys.</strong> Auto-increment ids and timestamps as the leading key column give one hot range forever. Choose a leading prefix that spreads writes.</li> <li><strong>Cross-range operations are distributed transactions</strong> (<a href="/cookbook/p/distributed-transactions">next section</a>): a transaction touching two ranges needs a commit protocol, and so does a split in flight. Design schemas so that the common transaction touches one range.</li> <li><strong>Stale reads from stale leaders</strong>: the epoch check protects against a client's stale <em>map</em>, not against an old leader that has been deposed; leader leases or a read through the group are still needed.</li> <li><strong>Moves compete with traffic.</strong> Copying a 512 MB range consumes disk and network; rate-limit it, and move at most a few ranges at a time. Never let two overlapping reconfigurations of one range run together.</li> <li><strong>Split points inside a row's keys.</strong> Splitting between a row and its index entries or between a vertex and its edges breaks locality; split on prefix boundaries.</li> <li><strong>Too many small ranges</strong> cost heartbeats, metadata and memory; too few cannot spread load. Merge small ranges; split on size and on load.</li> <li><strong>The metadata is itself a hot spot</strong>: cache it, replicate it, and keep lookups off the critical path (a two-level map like Bigtable's <code>META</code> tablets).</li> </ul></aside>
"""

