[[sections]]
heading = "Design notes"
body = """
!!! **Educational implementation**. **Not** constant-time-audited.

**Not for production**. !!! Use audited libraries (RustCrypto <https://github.com/RustCrypto> , ring <https://github.com/briansmith/ring>) and never roll your own crypto for real systems. This file exists to teach how the pieces fit.

What: SHA-256 (Merkle-Damgard, 64-byte blocks, incremental update/finalize), HMAC-SHA256 (RFC 2104/4231), HKDF (RFC 5869: extract then expand), PBKDF2-HMAC-SHA256 (RFC 8018, vectors from RFC 7914 and widely published).

Why: SHA-256's digest IS its internal state after the last block. Anyone holding H(secret &#124;&#124; m) can resume hashing from that state and append data without knowing `secret` (**length extension**). So `H(key || msg)` is not a MAC.

HMAC = H((K&#94;opad) &#124;&#124; H((K&#94;ipad) &#124;&#124; m)): the outer hash hides the inner state, so extension fails.

How: the attack below rebuilds the glue padding the victim hash applied, seeds a hasher with the tag as state and the right byte count, then hashes the attacker suffix. Every algorithm is asserted against official vectors.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>HMAC in TLS 1.2 PRF/records and JWT HS256 signatures</li><li>HKDF in TLS 1.3 key schedule</li><li>Signal</li><li>Noise</li><li>PBKDF2 for password hashing (prefer scrypt/argon2 today) and WPA2 passphrase derivation</li></ul>
"""

