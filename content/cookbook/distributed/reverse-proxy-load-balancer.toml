[[sections]]
heading = "Design notes"
body = """
What: a real proxy (`proxy.test`) forwarding to three real backends (`b1.test`, `b2.test`, `b3.test`), with transcripts of **both** legs.

- Forwarding: method, path, query, headers and body (large bodies are **streamed**, small ones are buffered so they can be retried).
- **Hop-by-hop** headers (Connection and every header it names, Keep-Alive, TE, Trailer, Transfer-Encoding, Upgrade, Proxy-&#42;) are meaningful for one TCP hop only and are stripped in both directions.
- `X-Forwarded-For/Proto/Host` and `Forwarded` (RFC 7239). A client can **send** these headers, so an edge proxy must overwrite them (or only extend them when the peer is a trusted proxy) and a backend must read the chain from the **right**, skipping trusted hops: taking the leftmost value lets anyone spoof their IP (rate limits, allow-lists, audit logs).
- Balancing strategies behind a `Strategy` trait: round robin, least connections, smooth weighted round robin (nginx style), and consistent hashing with virtual nodes (sticky sessions; when a backend dies only **its** keys move). Exact distributions are asserted.
- Health: active checks (probe `/healthz`, thresholds in both directions), passive ejection (consecutive failures, injectable clock, timed recovery), retries on another backend for idempotent requests (and for connect errors, where nothing was sent), timeouts mapped to 504, unreachable upstream to 502, no healthy upstream to 503 + Retry-After.
- `X-Request-Id`: accepted if well-formed, otherwise generated; propagated to the backend and echoed to the client.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>nginx/HAProxy/Envoy-style edge proxies</li><li>API gateways</li><li>canary routing</li><li>per-tenant sticky routing</li><li>service-mesh sidecars</li></ul>
"""

