[[sections]]
heading = "Design notes"
body = """
One thread serves many sockets. Every socket is non-blocking. The thread sleeps in `Poll::poll` (epoll on Linux, kqueue on macOS and BSD) until the kernel reports that a socket is ready, then does only the work that cannot block.

Each registered source gets a `Token`, the key into your own table of connections.

Edge-triggered: after an event, mio promises another one only once the operation has returned `WouldBlock`. So on a readable event, read until `WouldBlock`, and on the listener, accept until `WouldBlock`. Writes work the same way: write until `WouldBlock`, then ask for `WRITABLE` interest and carry on at the next writable event.

Each connection is a small state machine. `rbuf` holds an unfinished line (TCP delivers bytes in any pieces). `out` and `wpos` are the write queue: a short `write` leaves a tail to send later.

`WRITABLE` interest is on only while `out` holds unsent bytes, because a socket is nearly always writable and would wake the loop for nothing. When the peer closes its side, the server sends everything still queued before it closes, so every complete line gets its reply (text after the last newline gets none).

Hostile peers: both buffers are bounded, so a peer that never sends a newline, or sends and never reads, is disconnected. A connection reset before `accept` must not stop the server (on macOS, setting an option on it fails).

**Limits.** One peer that keeps its socket readable is read until `WouldBlock` before the others get a turn. Running out of file descriptors stops the server. A connection that stays open makes shutdown give up after 5 seconds.

`mio::Waker`: another thread can't interrupt `poll` by changing your data, so it calls `wake()`. The loop then gets an event with the waker's token (an eventfd on Linux, a user event on kqueue). Here it asks for a graceful shutdown: stop accepting, finish the open connections, then return.

In Tokio: the I/O driver is this loop. Each registered socket has a `ScheduledIo` with its readiness bits and the wakers of the tasks waiting on it. A task's `read().await` tries a non-blocking read.

On `WouldBlock`, it clears the readiness and leaves its waker. When `poll` reports the token, the driver sets the readiness and wakes those tasks. An `async fn` is the compiler-made version of the per-connection state machine written by hand below.
"""

