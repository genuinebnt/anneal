[[sections]]
heading = "What it is"
body = """
one thread serves many sockets. All sockets are **nonblocking**; the thread sleeps in `Poll::poll` (epoll on Linux, kqueue on macOS/BSD) until the kernel reports **readiness** events, then does only the work that cannot block. Registration associates each source with a `Token` (your index into a table).
"""

[[sections]]
heading = "Design notes"
body = """
**Edge-triggered**: mio reports a &#42;transition&#42; to ready, once. If you read only part of what is available you will not be told again, so on a readable event you must read until `WouldBlock`, and on the listener you must `accept` until `WouldBlock`.

Same for writes: write until `WouldBlock`, then ask for `WRITABLE` interest and resume when the next writable edge arrives.

**Per-connection state machine**: `rbuf` holds an incomplete trailing line (TCP delivers arbitrary fragments); `out` + `wpos` is the write queue (a partial `write` leaves a tail to resume later). **Writable** interest is toggled on only while `out` is non-empty: a socket that is always writable would otherwise wake us pointlessly.

Half-close (peer EOF) is remembered; we flush all pending output before closing, so no complete line goes unanswered (text after the last newline gets no reply).

**Hostile peers**: both buffers are bounded, so a peer that never sends a newline, or sends and never reads, is disconnected. A connection that was reset before `accept` must not stop the server (on macOS, setting an option on it fails).

**Limits**: one peer that keeps its socket readable is read until `WouldBlock` before others get a turn; running out of file descriptors stops the server; a connection that stays open makes shutdown give up after 5 seconds with an error.

`mio::Waker`: other threads cannot interrupt `poll` by touching your data, so they `wake()`, which makes the loop return an event with the waker's token (eventfd on Linux, a user event on kqueue). Here it requests graceful shutdown: stop accepting, drain the open connections, then exit.

**How this is TOKIO**: tokio's I/O driver is this loop. `tokio::net::TcpStream` registers with a mio `Poll` and keeps a ScheduledIo per source holding the readiness bits and the wakers of tasks waiting on it. A task that does `read().await` tries a nonblocking read; on `WouldBlock` it clears readiness and parks its `Waker`.

When the driver's `poll` returns the token, it sets readiness and wakes those tasks, which the scheduler re-polls. `async fn` is the compiler-generated version of the per-connection state machine written by hand below, and `Waker` is the same idea at the task level. Writing this once makes `await` less magical.
"""

