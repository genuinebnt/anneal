[[sections]]
heading = "Where you would use it"
body = """
understanding what a stream processor promises when data is out of order and machines crash.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>Apache Flink (watermarks, allowed lateness, side outputs, aligned barriers, two-phase-commit sinks)</li><li>Google Dataflow / Apache Beam (windows, triggers, accumulation modes)</li><li>Kafka Streams and Spark Structured Streaming (replayable offsets + state checkpoints)</li><li>Heron (the CMU time-series talk)</li><li>real jobs: per-minute metrics rollups</li><li>user sessionization</li><li>joining impressions to clicks within a time bound</li><li>continuous alerting. Course: CMU Database Group time-series talks (Twitter Heron)</li><li>Chandy-Lamport itself is recipe 404</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
records carry the time something **happened** (event time); the engine sees them later, in some other order (processing time). Grouping by arrival gives answers that change with scheduling; grouping by event time gives one answer, but then the engine must decide when a window is complete.

**The model** (a deterministic simulator; a seeded scheduler picks one small step at a time, so every interleaving is reproducible): P partitions of a replayable log -> P sources -> bounded FIFO channels (one per source/operator pair, records routed by key) -> N parallel keyed operators, each with P input channels -> transactional sink.
"""

[[sections]]
heading = "How it works"
body = """
<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Watermark W</div><div class="cb-g-says"><p>= "I expect no more records with ts &lt;= W". A source broadcasts max_ts_seen - B - 1 (B = out-of-orderness bound); an end-of-partition source sends i64::MAX. An operator's W is the <strong>minimum</strong> over its input channels, so the slowest partition holds everyone back (Flink also marks idle partitions so they do not stall W forever; not modelled here).</p></div></div><div class="cb-g-term"><div class="cb-g-name">Windows</div><div class="cb-g-says"><p>[start, end): tumbling, sliding (0 &lt; slide &lt;= size; a record is in about size/slide windows) and session (each record opens [ts, ts+gap); windows of a key that <strong>overlap</strong> merge; merely touching ones do not, whereas Flink's TimeWindow.intersects also merges touching ones: see below).</p></div></div><div class="cb-g-term"><div class="cb-g-name">Lateness</div><div class="cb-g-says"><p>A window is complete when W &gt;= end-1 and its state is kept until W &gt;= end-1+L (L = allowed lateness). A record for a window with end-1+L &lt;= W is dropped from it; if it is dropped from all of its windows it goes to the <strong>late</strong> side output. A session record is judged after merging with live sessions.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Why disorder</div><div class="cb-g-says"><p>&lt;= B + <strong>L is enough for exact results</strong>: if no record is more than B+L behind the newest earlier record of its partition, then ts &gt;= W+1-L at every operator. So its window is still live, and it cannot overlap a session that was already purged (those end at or before W+1-L).</p><p>Hence: nothing dropped and final results equal a batch <strong>group by</strong>, for <strong>any</strong> interleaving and <strong>any</strong> crash schedule. Asserted on 1000 random streams.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Beyond the bound</div><div class="cb-g-says"><p>Results depend on the interleaving (which watermark overtook which record). The oracle therefore reads each operator's consumption trace, recomputes W by brute force, derives the dropped (record, window) pairs, and expects batch results minus exactly those. After a crash the trace is cut back to the checkpoint, so it is the history that actually took effect.</p><p>For sessions beyond the bound a purged session can sit next to a later one that batch would have merged with it, so only conservation is asserted: counted + dropped == all records, count and sum per key.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Triggers</div><div class="cb-g-says"><p>Decide when to emit a <strong>pane</strong>: on the watermark (one on-time pane, then one per accepted late record), early every n records, or per record. <strong>Accumulation</strong>: accumulating panes carry the running total (the sink overwrites); discarding panes carry only the delta (the sink adds). Session merges must <strong>retract</strong> panes already emitted for the windows that disappear.</p><p>(Discarding mode is limited to tumbling/sliding here.)</p></div></div><div class="cb-g-term"><div class="cb-g-name">Checkpoints</div><div class="cb-g-says"><p>(Carbone et al., "asynchronous barrier snapshotting", a Chandy-Lamport relative for dataflow DAGs): each source records (offset, max_ts) and puts barrier n in all its channels. An operator that has barrier n on one channel <strong>blocks</strong> that channel until it has it on all, then snapshots its state and its per-channel watermarks.</p><p>No in-flight records need saving: everything before the barriers is in the state, everything after will be replayed.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Exactly-once effects</div><div class="cb-g-says"><p>Output since the last barrier stays in a pending transaction, is pre-committed with the snapshot, and is committed once <strong>all</strong> operators have acked. A crash can fall between "checkpoint durable" and "sink committed", so recovery re-sends the commit and the sink ignores an epoch it has applied. Records may be <strong>processed</strong> many times; their effect appears once.</p><p>Output is only visible after a checkpoint: that is the latency price.</p></div></div><div class="cb-g-term"><div class="cb-g-name">What breaks it</div><div class="cb-g-says"><p>(run as mutations, and the checks must catch them): not blocking channels (state then contains records the restored offsets will replay: at-least-once) and a sink that applies output immediately (replayed deltas are added twice).</p><p>On in-bounds input both only <strong>over</strong>-count: every record missing from a snapshot comes later in its partition than any watermark in that snapshot, so the B + L argument still protects it.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Stream-stream interval join</div><div class="cb-g-says"><p>Pair (a, b) with equal key and b.ts - a.ts in [lo, hi]. Each side is buffered; the watermark evicts a once W &gt;= a.ts+hi and b once W &gt;= b.ts-lo, because every record still accepted has ts &gt; W. It runs on the same runtime, so it gets the same crash testing.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Backpressure</div><div class="cb-g-says"><p>Channels are bounded; a source that cannot place a record (and watermark) stalls. Alignment blocks channels, which pushes back to the sources, but cannot deadlock: a channel is blocked only after its source has already sent that barrier, so sources that still owe it can drain.</p></div></div></div>
"""

