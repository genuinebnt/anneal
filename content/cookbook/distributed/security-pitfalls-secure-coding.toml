[[sections]]
heading = "Design notes"
body = """
**Defensive test fixtures**. Every attack string here exists so a test can show that the **fixed** function resists it. Everything runs in-process or in a private temporary directory: no network, and the only "payload" any command runs is `echo`.

The `vuln_*` functions are deliberately broken: never copy them. **The shape of each pair**: (1) the attack **succeeds** against `vuln_*` (so the test really exercises the bug), (2) the same attack **fails** against the fixed version, (3) ordinary input still works (a fix that rejects everything proves nothing).

**The common root**: data crossing into a place where it is interpreted as **code** or **structure** (SQL, shell, path, HTML, URL, log line, object fields). The fix is to keep data and structure separate (parameters, argument vectors, typed DTOs), or where that is impossible, to **parse** strictly, then check the parsed value, then use **that** value (not the original string).

**What rust does and does not do**: safe Rust prevents out-of-bounds reads, use-after-free and data races. It does **not** prevent injection, traversal, logic errors, secrets left in a reused buffer, arithmetic wrapping in release builds (unless `overflow-checks` is on), unbounded recursion (a stack overflow aborts the process) or unbounded allocation.

**Limits**: these are focused demonstrations, not a security library. In production use maintained crates (`url`, `ammonia` or a templating engine with auto-escaping, `regex`, `subtle`, `getrandom`) and get a review.

The timing demo counts comparisons instead of measuring time; constant-time guarantees against an optimising compiler need `subtle` or assembly-level checks. Unix only for the symlink, TOCTOU, shell and /dev/urandom parts.
"""

