[[sections]]
heading = "Design notes"
body = """
What: a **sender** that signs and delivers events, and a **receiver** that must not trust the network.

- Signature (Stripe style): header `Webhook-Signature: t=<unix ts>,v1=<hex HMAC-SHA256(secret, "<t>.<raw body>")>`. Signing the timestamp **into** the MAC is what makes the replay window enforceable.
- Receiver: verify over the **raw bytes** (not parsed-and-reserialized JSON), compare in **constant time**, reject a timestamp outside +/-300s (replay), **deduplicate** by event id (the sender is at-least-once), answer 2xx **fast** and process asynchronously from a queue, accept **two** active secrets so a secret can be **rotated** with no downtime.
- Statuses: 400 for a bad/old signature (permanent: do not retry), 408/429/5xx => the sender retries.
- Sender: exponential backoff with jitter, an injectable clock/sleeper (no real sleeping: virtual time), a max attempt budget and a **dead-letter** queue that can be re-driven. A fresh signature is made for every attempt.
- Attacks shown being rejected: modified body, replayed old timestamp, wrong secret, missing/garbled header, and the classic bug of verifying a re-serialized JSON value. Delivery is at-least-once; at-least-once + idempotent receiver = effectively-once processing.
"""

