<ul class="cb-g-uses"><li>every HTTPS connection</li><li>mTLS between services</li><li>certificate pinning and expiry monitoring</li><li>reading <code>openssl x509 -text</code> output (this is what it decodes)</li><li>building private CAs</li><li>understanding why "certificate verify failed" happens (name mismatch vs expiry vs unknown issuer vs path length)</li></ul>
"""

