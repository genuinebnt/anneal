[[sections]]
heading = "Design notes"
body = """
!!! **Educational implementation**. **Not** constant-time-audited, **not** for production.

Use audited libraries (RustCrypto !!! <https://github.com/RustCrypto> : `pbkdf2`, `scrypt`, `argon2`, `uuid`; ring <https://github.com/briansmith/ring> ) and never !!! roll your own crypto for real systems. Our SHA-256/HMAC/PBKDF2 are checked against published vectors but are slow and unhardened.

**What** / **why**:

<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Randomness</div><div class="cb-g-says"><p>Security-relevant bytes must come from the OS CSPRNG, never from <code>rand::thread_rng</code> seeded by time, a xorshift, or <code>RandomState</code>. On Unix read <code>/dev/urandom</code> (never blocks once the kernel is seeded; <code>/dev/random</code> is no "more secure" on modern kernels). The <code>getrandom</code> crate (<a href="https://docs.rs/getrandom" target="_blank" rel="noreferrer">https://docs.rs/getrandom</a>) wraps the right syscall per OS.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Nonces</div><div class="cb-g-says"><p>A nonce must not repeat under one key (AES-GCM / ChaCha20-Poly1305 repeat = catastrophic). Random nonces collide by the <strong>birthday</strong> bound p ~ 1 - exp(-n(n-1)/2N). 96-bit random nonces after 2&#94;32 messages: p ~ 2&#94;-33, which is why NIST SP 800-38D caps random-nonce GCM at 2&#94;32 messages per key. We compute it and validate the formula by Monte Carlo on a 24-bit nonce.</p><p>Counter nonces never collide but need durable state (and care across restarts/replicas); 192-bit random nonces (XChaCha20) make random safe.</p></div></div><div class="cb-g-term"><div class="cb-g-name"></div><div class="cb-g-says"><p>UUIDs (RFC 9562): v4 = 122 random bits with version/variant bits set; v7 = 48-bit Unix-ms timestamp + random, so IDs sort by creation time (great for B-tree primary keys; leaks creation time, and v4/v7 are identifiers, not secrets).</p></div></div><div class="cb-g-term"><div class="cb-g-name">Passwords</div><div class="cb-g-says"><p>Store a slow, salted, per-user hash, never a fast hash (SHA-256 runs billions/s on a GPU). PBKDF2-HMAC-SHA256 (RFC 8018) is slow by iteration count only; memory-hard functions (scrypt RFC 7914, Argon2 RFC 9106) also need lots of RAM, which makes parallel GPU/ASIC attacks expensive.</p><p>We implement HMAC, PBKDF2 (RFC 7914 / well-known vectors) and a toy ROMix-style memory-hard function (SHA-256 based, <strong>not</strong> scrypt-compatible), verify with a constant-time compare, and print a timing table.</p></div></div><div class="cb-g-term"><div class="cb-g-name">Strength</div><div class="cb-g-says"><p>Entropy = length * log2(pool) is an <strong>upper</strong> bound that holds only for uniformly random characters. Human-chosen passwords ("P&#64;ssw0rd!") are far weaker; real estimators (zxcvbn, <a href="https://github.com/dropbox/zxcvbn" target="_blank" rel="noreferrer">https://github.com/dropbox/zxcvbn</a>) model dictionaries, keyboard walks and leetspeak. Our estimator applies only crude caps; treat it as a teaching tool.</p></div></div></div>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>session tokens and API keys from the OS RNG</li><li>AEAD nonce management in TLS 1.3 (sequence-number-derived nonces) and libsodium-style APIs</li><li>UUIDs as primary keys</li><li>PBKDF2 in WPA2 passphrase derivation</li><li>disk-encryption key derivation and many password stores</li><li>scrypt/Argon2 in modern password storage</li><li>Diceware-style passphrases</li></ul>
"""

