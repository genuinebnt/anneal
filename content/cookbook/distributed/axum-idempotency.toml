[[sections]]
heading = "Design notes"
body = """
Pattern: the client sends `Idempotency-Key: <uuid>`. First time: do the work, remember key -> result, return 201. Retry with the same key: return the **same** result (200), do **not** create a second execution.

This is what makes client retries and at-least-once delivery safe. (Real systems also persist the key in the DB in the same transaction as the work, and compare the request body hash.) Background: <https://stripe.com/blog/idempotency>
"""

