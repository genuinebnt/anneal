body = """
<ul class="cb-g-uses"><li>constant-time HMAC/tag comparison (TLS, JWT and webhook-signature verification)</li><li>password-hash verification</li><li>constant-time scalar multiplication in elliptic-curve libraries</li><li>bitsliced or hardware <strong>aes</strong> instead of T-tables</li><li>zeroizing keys on drop in key-management code</li></ul>
"""

