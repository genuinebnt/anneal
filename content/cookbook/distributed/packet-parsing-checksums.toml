[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>packet capture tools</li><li>firewalls</li><li>load balancers</li><li><strong>Ids</strong></li><li>userspace network stacks (smoltcp-style)</li><li>protocol test harnesses</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
a bounds-checked, zero-copy dissector. Each header type is a thin **view** over `&[u8]`: `parse` validates lengths **once** (header present, IHL/data-offset sane, total length within the buffer) and the accessors then read fixed offsets without copying. Anything inconsistent returns `ParseError`; nothing panics, which the 30,000-input fuzz at the end checks.

Stack handled: Ethernet II with 802.1Q/QinQ tags, ARP, IPv4 (IHL, options, flags, fragment offset), IPv6 (extension-header chain), TCP (flags, MSS/WS/SACK/timestamp options), UDP, ICMP and ICMPv6 echo.
"""

[[sections]]
heading = "Design notes"
body = """
**The internet checksum** (RFC 1071): ones' complement of the ones' complement sum of 16-bit big-endian words (odd trailing byte padded with 0).

Properties used here: the sum is order-independent and can be folded lazily (carries added back at the end); verifying = summing everything **including** the checksum field and getting 0xFFFF; RFC 1624 incremental update HC' = &#126;(&#126;HC + &#126;m + m') patches a header when one word changes (TTL decrement in a router) without re-summing.

TCP/UDP/ICMPv6 checksums also cover a **pseudo-header** (addresses, protocol, length) so a segment delivered to the wrong host or protocol fails.

**Fragmentation**: IPv4 splits a datagram into fragments whose payload offsets are multiples of 8, all sharing (src, dst, id, protocol); the last has MF=0.

**Reassembly** is attack surface: out-of-order and duplicate fragments must work, but **overlapping** fragments with different bytes (teardrop, and the ambiguity **ids** evasion exploits) are rejected here by dropping the whole datagram; sizes past 65535 (ping of death), too many fragments, and unbounded tables are capped.

PCAP: the classic libpcap file (24-byte global header with a magic that tells byte order and microsecond vs nanosecond timestamps, then 16-byte record headers). **Flow table**: packets grouped by canonical 5-tuple with a simplified TCP state machine (SYN -> SYN/ACK -> ACK -> FINs -> closed, RST), ignoring sequence validation and timers.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>tcpdump/Wireshark dissectors</li><li>Suricata/Zeek-style monitors</li><li>Linux netfilter conntrack</li><li>NAT devices (they patch addresses and ports with incremental checksum updates)</li><li>software routers</li><li>smoltcp</li></ul>
"""

