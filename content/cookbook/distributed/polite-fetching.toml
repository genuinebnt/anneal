[[sections]]
heading = "Design notes"
body = """
A reader for `robots.txt` that follows the main rules of RFC 9309, one request at a time to each host with a gap between them, waiting that respects `Retry-After`, a user agent that says who is asking, and a stop that stays stopped when a host says no. When a site refuses you, the program stops. It does not try to get round the refusal.

&#42;&#42;**limits**&#42;&#42;: following `robots.txt` is not permission. A site's terms, the law and the owner's wishes still apply. This keeps its state in one process, reads one of the three HTTP date forms, and cannot recognise a refusal that arrives as an ordinary page with status 200.

It does not read `Crawl-delay` or `Sitemap` lines. Time is passed in, so the checks never sleep. The one network check uses a local server.
"""

