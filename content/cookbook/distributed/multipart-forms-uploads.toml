[[sections]]
heading = "Design notes"
body = """
What: a real axum server with hand-written parsers, driven by a reqwest client that builds the multipart bytes itself (reqwest's own `multipart` feature is not enabled in this crate, and neither is axum's `Multipart`, which needs the `multer` crate: with `axum = { features = ["multipart"] }` the equivalent is `while let Some(field) = multipart.next_field().await? { field.name(); field.file_name(); field.chunk().await? }`).

- `application/x-www-form-urlencoded`: split on `&`/`=`, `+` => space, percent-decoding with strict validation (bad `%zz`, truncated `%`, invalid UTF-8 => 400), repeated keys kept in order; cross-checked against axum's own `Form` extractor.
- `multipart/form-data` (RFC 7578 / RFC 2046): boundary from the Content-Type (quoted or not, &lt;= 70 chars), a **streaming** state machine (preamble -> part headers -> data -> delimiter) that never holds more than one network chunk plus `len(delimiter)` bytes, even when a delimiter is split across chunks (asserted by feeding 1 byte at a time).
- Per-part headers: Content-Disposition (`name`, `filename`, escaped quotes), Content-Type.
- Uploads stream into a temp file with a **size limit** (413, partial file deleted); a 6 MB upload is accepted with a buffer of a few tens of KB (`max_buffered` is asserted and printed).
- Security: filenames are untrusted (`../../etc/passwd` => 400, we store under a server-generated name); the Content-Type the client claims is **not** trusted: we sniff magic bytes and refuse mismatches (e.g. HTML sent as `image/png`).
"""

