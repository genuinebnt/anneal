[[sections]]
heading = "Design notes"
body = """
What: one in-memory `/v1/items` API (real axum server on 127.0.0.1:0, reqwest client) demonstrating the patterns a production API needs, each with a `curl -v` style transcript and asserts:

- offset pagination breaks under concurrent writes (duplicate after an insert, skipped row after a delete); keyset/cursor pagination (opaque base64url cursor + `Link: rel="next"`) does not.
- filtering + sorting through a **whitelist** (unknown field => 400, it never reaches the "query layer").
- **Put** (replace, idempotent) vs **patch**; JSON Merge Patch (RFC 7396) and JSON Patch (RFC 6902: add/remove/replace/ move/copy/test) written by hand; a JSON Patch is applied to a **copy** and committed only if **every** op succeeds.
- optimistic concurrency: `ETag` + `If-Match` (412 stale write, 428 header missing), `If-None-Match` => 304.
- idempotency: **put/delete** are naturally idempotent, **post** gets `Idempotency-Key`; 201 + `Location`; 202 Accepted + a status resource for long-running work.
- errors as `application/problem+json` (RFC 9457) with stable `type` URIs clients can switch on.
- versioning: URL (`/v2/..`) vs media-type header (`Accept: application/vnd.forge.v2+json`), compared.
- HATEOAS-style `_links`, and bulk operations answering with per-item results (207 Multi-Status style).

   Why: these are the decisions that are expensive to change once clients exist.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>public/partner APIs</li><li>mobile backends</li><li>admin consoles with infinite scroll</li><li>payment-style APIs (Idempotency-Key + ETag)</li><li>long-running exports/reports</li><li>gateways that enforce one stable error contract</li></ul>
"""

