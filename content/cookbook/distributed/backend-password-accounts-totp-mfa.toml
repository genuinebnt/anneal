[[sections]]
heading = "Design notes"
body = """
Extends: auth_basic_bearer_jwt (credentials -> token), cookies_sessions_csrf (cookie sessions), oauth2_pkce_flow (delegated login).

Everything cryptographic is implemented from scratch with std only so you can **see** it, and checked against published test vectors: SHA-1 / SHA-256 (the round constants are **derived** from fractional parts of roots of primes, then the vectors prove them), HMAC (RFC 2202/4231), PBKDF2-HMAC-SHA256 (RFC 7914 vectors), HOTP (RFC 4226 Appendix D) and TOTP (RFC 6238 Appendix B), base32.

**Do not** ship hand-rolled crypto: production uses `argon2` (Argon2id), `hmac`+`sha1`/`sha2`, `totp-rs`, `rand`/`getrandom` (OS CSPRNG; this file uses a seeded xorshift **only** so runs are deterministic). The lifecycle logic (tokens, lockout, rotation) is the real lesson.

Password hashing choices: Argon2id is the default pick (OWASP minimum &#126;19 MiB memory, t=2, p=1; more memory is better; memory-hard resists GPUs). scrypt is the alternative. PBKDF2-HMAC-SHA256 (OWASP: 600,000 iterations) is for **fips** environments. bcrypt truncates at 72 bytes.

The stored string encodes algorithm+params so you can raise cost later and rehash transparently on the next login.

Cheat sheet (I want to ... -> use ...):

```text
store a password             -> memory-hard KDF + per-user random salt; encode params in the string; never SHA-256(pw)
email-verify / reset token   -> 32 random bytes, hex; store ONLY sha256(token); single use; short expiry (verify 24h, reset 30m)
```

compare secrets              -> `ct_eq` (constant time) for MACs/TOTP codes;

Random-token lookup by hash is fine avoid user enumeration       -> same response + same work for unknown email (dummy hash), "if that email exists..." on reset brute-force defence          -> per-account failure counter + exponential lock, plus per-IP throttling (backend_rate_limit_quota_middleware) session fixation             -> issue a **new** session id at login, delete the pre-login one after password change        -> kill all sessions + remember-me tokens remember-me                  -> selector:validator cookie, store hash(validator), rotate on use, theft = revoke all authenticator app            -> base32 secret, TOTP SHA-1 6 digits 30 s, accept +-1 step, remember last used counter (replay) recovery codes               -> 8-10 random codes, store hashes, each usable once, shown once upgrade hash params          -> `needs_rehash()` on successful login
"""

