[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>OLTP vs OLAP</strong>: OLTP = short read/write transactions with a small footprint and repetitive operations; OLAP = long read-only queries with complex joins and exploratory access. They stress distributed systems differently: OLTP needs cheap atomic commit, OLAP needs cheap data movement.</li> <li><strong>Atomic commit protocols</strong> decide the fate of a multi-node transaction (commit or abort) among <strong>resource managers</strong> (RMs): 2PC (1970s), 3PC (1983), Viewstamped Replication (1988), Paxos (1989), ZAB (ZooKeeper), Raft (2013). Required properties: <strong>stability</strong> (a decided fate never changes), <strong>consistency</strong> (all RMs end in the same state, even after failures), <strong>liveness</strong> (the protocol can always make progress while enough nodes are up and connected).</li> <li><strong>Two-phase commit</strong>: client → coordinator <em>commit request</em>. <strong>Phase 1</strong>: coordinator sends <strong>Prepare</strong>; each participant that can commit <strong>forces a prepared record</strong> and votes <strong>Yes</strong>, otherwise <strong>No</strong>. <strong>Phase 2</strong>: all Yes ⇒ coordinator logs <strong>Commit</strong> (the commit point) and tells everyone; any No ⇒ <strong>Abort</strong>. Participants <strong>Ack</strong>; either everyone commits or no one does. Every node keeps a non-volatile log of each phase's outcome. If the coordinator fails after Prepare, prepared participants are <strong>blocked</strong> (in doubt) until it returns; safe fallback is to abort if a participant hasn't yet voted, or ask peers. A crashed participant is treated as having voted No if it hadn't acknowledged. <strong>Optimizations</strong>: <em>early prepare voting</em> (the last query's result carries the vote), <em>early acknowledgement</em> (tell the client once all Yes votes are in).</li> <li><strong>Paxos</strong>: a <em>proposer</em> offers an outcome and <em>acceptors</em> vote. <strong>Propose</strong> → acceptors <strong>Agree</strong> unless they've agreed to a higher timestamp (then <strong>Reject</strong>) → on a majority of Agrees the proposer sends <strong>Commit/Accept</strong> → success after a <strong>majority of Accepts</strong>. Uses 2F+1 nodes and progresses with F+1 alive; <strong>2PC is the F = 0 special case</strong>. Use <strong>exponential backoff</strong> after a failed proposal to avoid dueling proposers. <strong>Multi-Paxos</strong>: a stable elected leader skips the propose phase until it fails. If nodes share a datacenter, fail rarely and aren't malicious, 2PC wins on round trips; Paxos/Raft win on availability.</li> <li><strong>CAP</strong>: during a network <strong>P</strong>artition a system can keep <strong>C</strong>onsistency (linearizability: once a write completes every later read returns it or something newer) or <strong>A</strong>vailability (every live node answers), not both. CP systems refuse writes without a majority; AP systems (many NoSQL) accept and reconcile. <strong>PACELC</strong>: <em>if</em> partitioned, choose A or C; <strong>E</strong>lse (normal operation), choose <strong>L</strong>atency or <strong>C</strong>onsistency.</li> <li><strong>Distributed joins</strong> (the data must meet): ① one table <strong>replicated</strong> everywhere ⇒ join locally; ② both tables <strong>partitioned on the join key</strong> (co-located) ⇒ join locally, gather; ③ different keys, one table small ⇒ <strong>broadcast join</strong>; ④ neither partitioned on the key ⇒ <strong>shuffle join</strong> (repartition both on the key, the network version of the exchange operator; fails if there's no space). Always ship the minimum.</li> <li><strong>Semi-join optimization</strong>: before moving a table, send a compact filter of the other side's join keys (a <strong>Bloom filter</strong>) and drop rows that can't match. A <strong>shuffle</strong> is also the general tool for rebalancing data and capacity.</li> </ul>
"""

[[sections]]
heading = "Two-phase commit, as a state machine"
body = """
```text
coordinator                                participant
  ─ Prepare ─────────────────────────────►   can I commit?  force PREPARED to the log, then vote
  ◄──────────────────────────────  Yes / No
  all Yes ⇒ force COMMIT to the log        ◄─ ← the commit point is this log write
  ─ Commit / Abort ──────────────────────►   force outcome, release locks
  ◄─────────────────────────────────  Ack
```

<p>Two rules make it atomic: a participant <strong>must not vote Yes until its prepared record is durable</strong> (after that it can no longer abort on its own), and the coordinator <strong>must not announce a decision before logging it</strong>. The <em>window of uncertainty</em> for a prepared participant is from its Yes vote to the decision, during which it holds locks and cannot decide alone.</p>

<p><strong>Presumed abort</strong> (used here) removes work: the coordinator logs nothing for an aborted transaction and doesn't log before the votes are in; a participant that <em>inquires</em> and finds the coordinator with no record is told "abort". A restarted coordinator that never logged a decision simply answers abort.</p>

:::deeper Reference: deterministic network simulator (random delivery, drops, duplicates, crashes with durable state)
```rust title="src/dist/sim.rs"
//! A deterministic network simulator: random delivery order, drops, duplicates, crashes with durable state.
use std::fmt::Debug;

pub struct Rng(pub u64);
impl Rng {
    pub fn next(&mut self, m: u64) -> u64 { self.0 = self.0.wrapping_mul(6364136223846793005).wrapping_add(1442695040888963407); (self.0 >> 33) % m }
    pub fn chance(&mut self, pct: u64) -> bool { self.next(100) < pct }
}

pub trait Node {
    type Msg: Clone + Debug;
    fn on_msg(&mut self, from: usize, m: Self::Msg, out: &mut Vec<(usize, Self::Msg)>);
    /// Timer: retransmit, time out, start a new attempt.
    fn on_tick(&mut self, out: &mut Vec<(usize, Self::Msg)>);
    /// Lose all volatile state, keep what was made durable.
    fn restart(&mut self);
}

pub struct Sim<N: Node> {
    pub nodes: Vec<N>,
    pub up: Vec<bool>,
    flight: Vec<(usize, usize, N::Msg)>,
    pub rng: Rng,
    pub drop_pct: u64,
    pub dup_pct: u64,
    pub delivered: u64,
}

impl<N: Node> Sim<N> {
    pub fn new(nodes: Vec<N>, seed: u64) -> Self {
        let n = nodes.len();
        Self { nodes, up: vec![true; n], flight: vec![], rng: Rng(seed.wrapping_mul(0x9E3779B97F4A7C15) | 1), drop_pct: 0, dup_pct: 0, delivered: 0 }
    }

    pub fn send(&mut self, from: usize, out: Vec<(usize, N::Msg)>) { for (to, m) in out { self.flight.push((from, to, m)); } }
    pub fn in_flight(&self) -> usize { self.flight.len() }
    pub fn clear_flight(&mut self) { self.flight.clear(); }

    /// Deliver one random in-flight message (possibly dropping or duplicating it). `false` if none are in flight.
    pub fn step(&mut self) -> bool {
        if self.flight.is_empty() { return false; }
        let i = self.rng.next(self.flight.len() as u64) as usize;
        let (from, to, m) = self.flight.swap_remove(i);
        if self.rng.chance(self.drop_pct) || !self.up[to] { return true; }
        if self.rng.chance(self.dup_pct) { self.flight.push((from, to, m.clone())); }
        let mut out = vec![];
        self.nodes[to].on_msg(from, m, &mut out);
        self.delivered += 1;
        self.send(to, out);
        true
    }

    pub fn tick_all(&mut self) {
        for i in 0..self.nodes.len() {
            if !self.up[i] { continue; }
            let mut out = vec![];
            self.nodes[i].on_tick(&mut out);
            self.send(i, out);
        }
    }

    pub fn crash(&mut self, i: usize) { self.up[i] = false; }
    pub fn restart(&mut self, i: usize) { if !self.up[i] { self.up[i] = true; self.nodes[i].restart(); } }
}
```
