[[sections]]
heading = "Design notes"
body = """
!!! **Educational implementation**. **Not** constant-time-audited.

**Not for production**. !!! Use audited libraries (RustCrypto <https://github.com/RustCrypto> , ring <https://github.com/briansmith/ring>) and never roll your own crypto for real systems. This file exists to teach how the pieces fit.

What: ChaCha20 (**arx** stream cipher: add, rotate, xor on a 4x4 u32 state), Poly1305 (one-time polynomial MAC over the prime 2&#94;130-5) and their AEAD composition (RFC 8439 section 2.8). Why AEAD: encryption alone gives confidentiality but no integrity; an attacker can flip ciphertext bits and flip the same plaintext bits.

The tag authenticates ciphertext **and** associated data (**aad**, e.g. headers). How Poly1305 arithmetic works here: 130-bit numbers are held in five 26-bit limbs inside u64s, so a limb product (&lt;2&#94;52) summed five times never overflows u64. Reduction uses 2&#94;130 = 5 (mod p), hence the "&#42;5" terms.

The one-time Poly1305 key is the first 32 bytes of the ChaCha20 block with counter 0; the message is encrypted starting at counter 1. Decrypt verifies the tag **first** and returns no plaintext on failure. **Nonce reuse** is catastrophic: same key+nonce means the same keystream, so c1 &#94; c2 == p1 &#94; p2, and the Poly1305 key repeats too, which enables forgeries.

Nonces must be unique per key (counter or random 96-bit w/ care).
"""

