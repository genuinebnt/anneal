[[sections]]
heading = "Measured"
body = """
<p>The workload is a bank: ten accounts of 100 on four shards, eight concurrent coordinators moving money, each one RPC at a time with random delays; 1.5% of coordinators crash between their steps in the commit phase, 3% of steps are slow, locks expire after 30 ticks, and every 25 ticks a read-only snapshot totals all accounts. After the run, time passes, every account is read, and the tests check three things: the total is still 1000, no lock remains, and every transaction is committed on <em>all</em> its keys with <em>one</em> commit timestamp or on none.</p>

```text title="60 runs with crashing coordinators, and the cost of commit"
60 runs: 66318 transfers committed, 122849 aborted on conflict, 6560 coordinators crashed; 765 consistent snapshots (13635 blocked by locks); readers rolled 2133 dead transactions forward and 7057 back
RPCs to commit a transaction writing k keys on k shards (Percolator): prewrite k, commit the primary 1, commit the other k-1 afterwards
   k     rpcs rounds before the client ack classic 2PC with a coordinator log
   1        3      1 (single-key commit)                                  1
   2        5      2 (prewrite, primary)   3 (prepare, log, commit); 4 rpcs
   4        9      2 (prewrite, primary)   3 (prepare, log, commit); 8 rpcs
   8       17      2 (prewrite, primary)  3 (prepare, log, commit); 16 rpcs
the lock timeout trades stalls against spurious aborts: 8 workers, 6 000 ticks, 1.5% of coordinators crash before committing, 3% of steps are slow (up to 60 ticks)
  lock ttl  committed    aborted    crashed  blocked reads dead txns resolved  snapshots blocked
         5      12675      25949       1363          24821             4482           2119/2400
        20      11839      22718       1198          41781             1853           2244/2400
        80       8888      15112        813          80084              567           2307/2400
       320       4459       6919        391         128162              281           2357/2400
```

<ul> <li><strong>No anomaly in any run.</strong> Across 60 runs with 6 560 crashed coordinators, the total never changed, every snapshot that could be taken read exactly 1000, no transaction was half-committed, and no lock survived the final reads. Readers rolled 2 133 dead transactions forward (the primary had committed) and 7 057 back (it had not): both outcomes happen and both are consistent.</li> <li><strong>Contention is brutal on ten accounts</strong>: 66 318 transfers committed and 122 849 aborted on write conflicts, because eight workers fight over ten keys. Snapshots mostly find a live lock (13 635 blocked, 765 taken). The workload is chosen to stress the protocol, not to show throughput.</li> <li><strong>The commit cost</strong>: a k-key transaction takes <code>2k + 1</code> RPCs here (k prewrites, one check and one commit of the primary, k − 1 commits of the rest); the client can be told the outcome after two sequential rounds, because the secondaries are committed afterwards. A classic coordinator-log two-phase commit needs three sequential rounds, including a durable log write, and <code>2k</code> RPCs. Percolator shifts the commit point onto the primary key's own replication, avoiding a coordinator state machine.</li> <li><strong>A short timeout wins here, a long one stalls</strong>: with locks expiring after 5 ticks the system committed 12 675 transfers; with 320 ticks only 4 459, with 128 162 blocked reads. A crashed coordinator holds its keys until the timeout, so a long timeout makes every crash an outage. The price of a short timeout, killing slow but healthy transactions, shows as more aborts per commit (2.05 against 1.55); in this workload the stall cost dominates. With rarer crashes and slower steps the balance flips; the timeout must exceed the 99.9th percentile of a healthy commit.</li> </ul>

<aside data-call="note"><b>The subtle step: the rollback record</b><p>The rollback record looks removable: deleting the lock would seem to be enough. The mutation test that removed it passed the whole randomized suite, and the reason is instructive: the dangerous case is a <em>duplicated or delayed prewrite of the primary</em> arriving after readers rolled the transaction back. It re-creates the primary lock, the zombie's commit of the primary then succeeds, and the transaction commits although its secondaries were already rolled back. The random simulator never delivers a stale duplicate; a directed test does it explicitly (<code>prewrite</code> after a rollback must return <code>RolledBack</code>). Network retries and duplicates are normal; the rollback record turns them into harmless rejections.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A coordinator as a state machine</strong>: <code>Txn::step</code> performs exactly one RPC and returns the new <code>Phase</code>. Tests drive many coordinators in one thread, choose which steps run, and drop a <code>Txn</code> to model a crash; a real coordinator runs the same logic with async calls. The protocol code never sleeps or spawns anything.</li> <li><strong>Columns as maps</strong>: <code>data: BTreeMap&lt;(Key, Ts), Option&lt;u64&gt;&gt;</code>, <code>lock: BTreeMap&lt;Key, Lock&gt;</code>, <code>write: BTreeMap&lt;Key, Vec&lt;(commit, start)&gt;&gt;</code>, <code>rolled_back: BTreeSet&lt;(Key, Ts)&gt;</code>. A tombstone is <code>None</code> in the data column.</li> <li><strong><code>Result</code> types that carry the reason</strong>: <code>Conflict::{WriteConflict, RolledBack}</code> and <code>ReadError::Blocked</code> distinguish "retry with a new snapshot" from "wait".</li> <li><strong><code>Hlc</code> derives <code>Ord</code></strong> with fields in the order <code>(wall, logical)</code>, so timestamp comparison is the derived lexicographic one; <code>tick</code> and <code>observe</code> are the whole clock.</li> <li><strong>Borrow shapes</strong>: shard access goes through <code>fn shard(&amp;mut self, k)</code>, which also counts the RPC; snapshot reads use a read-only accessor so the resolve loop can re-read after each repair.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Clocks (100 seeds)</strong>: five nodes with physical clocks off by up to ±20 ticks exchange messages at random; per-node timestamps strictly increase; a received timestamp exceeds the one sent; no hybrid clock runs ahead of the fastest physical clock; the logical counter stays small. A scripted case has physical time going backwards.</li> <li><strong>Bank (60 seeds × 6 000 ticks)</strong>: as above; asserts at every snapshot that the sum is 1000, at the end that locks, money and per-transaction atomicity hold.</li> <li><strong>Directed protocol cases</strong>: a lost update is prevented (second incrementer aborts, value 11); a crash after the primary commit is rolled forward by the next reader after the timeout and blocks it before; a crash before the primary commit is rolled back and the zombie coordinator aborts when it wakes; a delayed prewrite after the rollback is rejected; a snapshot does not see later commits and history is in commit order.</li> <li><strong>Mutants run against these tests</strong>: prewrite ignoring newer commits or existing locks; the primary commit not checking its lock; readers ignoring locks; an expired lock rolled back although its primary committed; no rollback record; secondaries committed at another timestamp; a snapshot seeing later commits; the clock's receive rule not exceeding the sent timestamp; a repeated timestamp at equal physical time; every lock naming itself as primary; commit leaving locks behind. <strong>All 12 were killed</strong>; the rollback record survived the first suite and needed the directed duplicate-prewrite test.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Percolator</strong> (Google, 2010) built the web index with this protocol on Bigtable; <strong>TiKV/TiDB</strong> implement it nearly verbatim (with async commit and one-phase commit optimizations that skip the secondaries' wait, and pessimistic locking as the default for SQL); <strong>Yugabyte</strong> and <strong>FoundationDB</strong> differ in detail (FoundationDB uses optimistic conflict ranges checked by resolvers).</li> <li><strong>CockroachDB</strong> commits with <em>write intents</em> and a transaction record on one range (the primary), with a parallel-commit optimization that lets the client be acknowledged after one round trip, and uses hybrid logical clocks with a maximum clock offset: a read that finds a value in its uncertainty window restarts at a later timestamp.</li> <li><strong>Spanner</strong> takes locks with two-phase locking inside each Paxos group, runs two-phase commit across groups (the coordinator is itself a replicated group, so it does not die), and assigns commit timestamps from <strong>TrueTime</strong>, waiting out the clock uncertainty (a few milliseconds) before releasing locks; read-only transactions read at a timestamp without locks.</li> <li><strong>Calvin/FaunaDB</strong> sequences transactions in a replicated log and executes them deterministically on every replica; no distributed commit protocol is needed, at the cost of declaring read and write sets up front. <strong>SLOG</strong> and <strong>VoltDB</strong> build on determinism too.</li> <li><strong>Yugabyte, Aurora DSQL, OceanBase</strong> and others combine hybrid or synchronized clocks with Raft groups per shard.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Clock skew breaks snapshot isolation silently</strong> if timestamps come from local clocks and nothing bounds the offset. Use an oracle, hybrid clocks with uncertainty restarts, or synchronized clocks with commit wait.</li> <li><strong>Timeouts that are too short kill healthy transactions; too long freeze keys.</strong> Resolution must be safe at <em>any</em> timeout (it is, by the primary-key rule); tune the value to your commit latency tail.</li> <li><strong>The primary is a hot spot for recovery</strong>: every resolution reads it. Keep it on a range that is not itself overloaded, and prefer a key that is cheap to read.</li> <li><strong>Read-heavy workloads suffer from locks</strong>: a reader waits for a lock whose owner is only slow. Production systems add lock-wait queues, push-timestamp mechanisms, and cache the primary's status.</li> <li><strong>Write skew remains</strong> (this is snapshot isolation): enforce invariants over several rows with explicit locks or by writing a shared key (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>).</li> <li><strong>Cross-shard transactions cost</strong>: keep the commonly co-accessed data in one range (key design, <a href="/cookbook/p/sharding">M9</a>) and measure the fraction of single-range transactions.</li> <li><strong>Async commit and one-phase commit change who can observe what when</strong>; reasoning about recovery must include the fast paths.</li> </ul></aside>
"""

