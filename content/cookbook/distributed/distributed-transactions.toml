[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A transaction that touches two ranges needs agreement between them.</strong> <a href="/cookbook/p/sharding">Sharding</a> puts keys on different Raft groups; each group can commit its own writes atomically, but nothing yet makes "debit here, credit there" all-or-nothing. That is the atomic commit problem, and the classic answer is two-phase commit (<a href="/cookbook/p/distributed-databases-ii">distributed databases</a>): a coordinator asks every participant to <em>prepare</em>, records the decision durably, then tells everyone. Its weakness is the coordinator: if it dies between the phases, participants hold locks they cannot release.</li> <li><strong>Percolator makes the decision a single write on one key.</strong> Pick one of the transaction's keys as the <em>primary</em>. Phase one, <em>prewrite</em>: for every key, check that nobody committed it since the snapshot and nobody has it locked, then stage the value and write a lock that points to the primary. Phase two: commit the primary (replace its lock by a <em>write record</em> naming the commit timestamp) in one atomic single-key step. <strong>That step is the commit point.</strong> Then commit the other keys at leisure.</li> <li><strong>Anyone can finish a dead transaction.</strong> A reader that meets a lock looks at the lock's primary. If the primary has a write record for that transaction, the transaction committed: the reader commits this key too (<em>rolls forward</em>). If the primary still holds the lock and the lock is old, the coordinator is presumed dead: the reader removes the primary lock and leaves a rollback record (<em>rolls back</em>). Because the decision is one key's state, the readers can never disagree.</li> <li><strong>A rollback record keeps a zombie dead.</strong> A coordinator that was only slow can wake up after its locks were rolled back. Its commit of the primary fails because the lock is gone; a delayed, duplicated prewrite fails because of the rollback record. Without the record, a duplicate prewrite of the primary could revive the transaction after its secondaries were rolled back.</li> <li><strong>Snapshots come from timestamps.</strong> A transaction takes a <em>start timestamp</em> from a global source, reads the newest version committed at or before it, and takes a <em>commit timestamp</em> later. A lock with a start at or before the read timestamp <em>might</em> commit before it, so the reader must wait or resolve it. This is the multi-version scheme of <a href="/cookbook/p/transactions-on-the-key-space">M2</a> with the validation moved to the shards.</li> <li><strong>Where timestamps come from decides the architecture.</strong> A single oracle (Percolator, TiDB's placement driver) is simple and a bottleneck and a latency hop. <strong>Hybrid logical clocks</strong> give each node timestamps that respect causality and stay near physical time without a central source, at the price of clock-uncertainty handling for reads (CockroachDB). <strong>TrueTime</strong> (Spanner) bounds the uncertainty with hardware and waits it out at commit. <strong>Calvin</strong> avoids two-phase commit altogether by agreeing on the order of transactions first and executing them deterministically.</li> <li><strong>The timeout trades stalls against aborts, never safety.</strong> Whether a lock is expired changes how long readers wait and how many slow transactions are killed; the commit point guarantees the outcome is consistent either way.</li> </ul>
"""

[[sections]]
heading = "The protocol"
body = """
```text
begin:      start_ts = oracle()
read k:     newest write record with commit_ts ≤ start_ts → its data;  a lock with start ≤ ts: wait, or resolve if expired
commit:     1. prewrite each key (primary first): fail if a write ≥ start_ts or any lock exists; stage data@start_ts; lock → primary
            2. commit_ts = oracle(); if the primary's lock is gone: abort.  Else: write record(commit_ts → start_ts), drop lock   ← commit point
            3. for each secondary: write record, drop lock                      (asynchronous; may never run)
resolve(lock):  primary has write record for lock.start?  → commit this key at that commit_ts   (roll forward)
                else                                      → remove the lock, leave a rollback record  (roll back)
```

<ul> <li><strong>Hybrid logical clock</strong> <code>(wall, logical)</code>: a local event takes the physical time if it is greater than the clock, else increments the counter; on receiving a message the clock becomes greater than both its own value and the message's. Timestamps compare lexicographically.</li> <li><strong>The model</strong>: shards hold the three columns per key; <code>Txn::step</code> runs one RPC of the protocol so a test can stop a coordinator between any two steps; <code>Cluster::get</code> is the snapshot read with resolution.</li> </ul>

:::deeper Reference: hybrid logical clock, Percolator columns, prewrite, commit, snapshot reads and lock resolution
```rust title="src/multimodel/dtxn.rs"
//! Distributed transactions over sharded storage in the style of Percolator: snapshot isolation with no central coordinator state.
//! Each key has a data column (values by start timestamp), a lock column and a write column (commit timestamp → start timestamp).
//! A transaction pre-writes every key (locking, one of them the *primary*), commits the primary by one atomic step, then commits the
//! rest. A crash anywhere leaves locks that any reader can resolve by looking at the primary. Also a hybrid logical clock.
use std::collections::{BTreeMap, BTreeSet};

pub type Key = u64;
pub type Ts = u64;

// ---- hybrid logical clock ------------------------------------------------------------------------------------------------------------

/// A timestamp that follows physical time when it can and a counter when it must, and always respects causality.
#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Default)]
pub struct Hlc {
    pub wall: u64,
    pub logical: u32,
}
impl Hlc {
    /// A local event or a send, given this node's physical clock.
    pub fn tick(&mut self, physical: u64) -> Hlc {
        if physical > self.wall {
            self.wall = physical;
            self.logical = 0;
        } else {
            self.logical += 1;
        }
        *self
    }
    /// A receive: the result is greater than both our clock and the message's timestamp.
    pub fn observe(&mut self, physical: u64, msg: Hlc) -> Hlc {
        let wall = physical.max(self.wall).max(msg.wall);
        self.logical = if wall == self.wall && wall == msg.wall {
            self.logical.max(msg.logical) + 1
        } else if wall == self.wall {
            self.logical + 1
        } else if wall == msg.wall {
            msg.logical + 1
        } else {
            0
        };
        self.wall = wall;
        *self
    }
}

// ---- the sharded multi-version store ------------------------------------------------------------------------------------------------

#[derive(Clone, Debug, PartialEq)]
pub struct Lock {
    pub start: Ts,
    pub primary: Key,
    /// Cluster time when the lock was written, for expiry.
    pub at: u64,
}

#[derive(Default, Clone, Debug)]
pub struct Shard {
    data: BTreeMap<(Key, Ts), Option<u64>>,
    lock: BTreeMap<Key, Lock>,
    write: BTreeMap<Key, Vec<(Ts, Ts)>>, // key → (commit ts, start ts), ascending
    rolled_back: BTreeSet<(Key, Ts)>,
}

#[derive(Debug, PartialEq)]
pub enum Conflict {
    /// Another transaction committed this key after our snapshot, or holds a lock on it.
    WriteConflict,
    /// Our transaction was rolled back by someone who found it expired.
    RolledBack,
}
#[derive(Debug, PartialEq)]
pub enum ReadError {
    /// A live lock covers the key; try again later.
    Blocked,
}

#[derive(Default, Clone, Debug)]
pub struct Stats {
    pub rpcs: u64,
    pub resolved_forward: u64,
    pub resolved_back: u64,
    pub blocked_reads: u64,
}

pub struct Cluster {
    pub shards: Vec<Shard>,
    /// The timestamp oracle.
    pub oracle: Ts,
    /// Wall-clock time in arbitrary ticks, advanced by the caller; locks older than `lock_ttl` may be resolved by readers.
    pub now: u64,
    pub lock_ttl: u64,
    pub stats: Stats,
}

impl Cluster {
    pub fn new(shards: usize, lock_ttl: u64) -> Cluster {
        Cluster { shards: vec![Shard::default(); shards], oracle: 0, now: 0, lock_ttl, stats: Stats::default() }
    }
    pub fn ts(&mut self) -> Ts {
        self.oracle += 1;
        self.oracle
    }
    fn shard(&mut self, k: Key) -> &mut Shard {
        self.stats.rpcs += 1;
        let n = self.shards.len();
        &mut self.shards[k as usize % n]
    }
    fn shard_ro(&self, k: Key) -> &Shard {
        &self.shards[k as usize % self.shards.len()]
    }

    /// The value of `key` in the snapshot at `ts`. A lock that could still commit at or below `ts` blocks the read, unless it has
    /// expired, in which case the reader resolves it first (roll forward if its primary committed, roll back otherwise).
    pub fn get(&mut self, key: Key, ts: Ts) -> Result<Option<u64>, ReadError> {
        loop {
            let lock = self.shard_ro(key).lock.get(&key).cloned();
            if let Some(l) = lock {
                if l.start <= ts {
                    if self.now.saturating_sub(l.at) < self.lock_ttl {
                        self.stats.blocked_reads += 1;
                        return Err(ReadError::Blocked);
                    }
                    self.resolve(key, &l);
                    continue;
                }
            }
            self.stats.rpcs += 1;
            let sh = self.shard_ro(key);
            let latest = sh.write.get(&key).and_then(|w| w.iter().rev().find(|(c, _)| *c <= ts)).copied();
            return Ok(match latest {
                None => None,
                Some((_, start)) => *sh.data.get(&(key, start)).expect("a write record always has its data"),
            });
        }
    }

    /// Settle an expired lock using the state of its primary.
    fn resolve(&mut self, key: Key, l: &Lock) {
        let primary = l.primary;
        let committed = self.shard_ro(primary).write.get(&primary).and_then(|w| w.iter().find(|(_, s)| *s == l.start)).map(|(c, _)| *c);
        match committed {
            Some(commit) => {
                self.commit_key(key, l.start, commit);
                self.stats.resolved_forward += 1;
            }
            None => {
                // the primary is not committed: make sure it never will be, then drop our lock
                self.rollback_key(primary, l.start);
                self.rollback_key(key, l.start);
                self.stats.resolved_back += 1;
            }
        }
    }
    fn commit_key(&mut self, key: Key, start: Ts, commit: Ts) {
        let sh = self.shard(key);
        if sh.lock.get(&key).is_some_and(|l| l.start == start) {
            sh.lock.remove(&key);
        }
        let w = sh.write.entry(key).or_default();
        if !w.iter().any(|(c, _)| *c == commit) {
            w.push((commit, start));
            w.sort();
        }
    }
    fn rollback_key(&mut self, key: Key, start: Ts) {
        let sh = self.shard(key);
        if sh.lock.get(&key).is_some_and(|l| l.start == start) {
            sh.lock.remove(&key);
        }
        sh.data.remove(&(key, start));
        sh.rolled_back.insert((key, start));
    }
}

/// A transaction run one RPC at a time, so that a test can crash its coordinator between any two steps.
pub struct Txn {
    pub start: Ts,
    pub writes: BTreeMap<Key, Option<u64>>,
    order: Vec<Key>,
    primary: Key,
    next: usize,
    pub commit: Option<Ts>,
    pub phase: Phase,
}

#[derive(Debug, Clone, Copy, PartialEq)]
pub enum Phase {
    Prewriting,
    CommittingPrimary,
    CommittingSecondaries,
    Done,
    Aborted,
}

impl Txn {
    pub fn begin(c: &mut Cluster) -> Txn {
        Txn { start: c.ts(), writes: BTreeMap::new(), order: vec![], primary: 0, next: 0, commit: None, phase: Phase::Prewriting }
    }
    pub fn read(&self, c: &mut Cluster, key: Key) -> Result<Option<u64>, ReadError> {
        if let Some(w) = self.writes.get(&key) {
            return Ok(*w);
        }
        c.get(key, self.start)
    }
    pub fn write(&mut self, key: Key, val: u64) {
        self.writes.insert(key, Some(val));
    }
    pub fn delete(&mut self, key: Key) {
        self.writes.insert(key, None);
    }

    /// Run one RPC of the commit protocol. Returns the phase afterwards.
    pub fn step(&mut self, c: &mut Cluster) -> Phase {
        if self.phase == Phase::Prewriting && self.order.is_empty() {
            if self.writes.is_empty() {
                self.phase = Phase::Done;
                return self.phase;
            }
            self.order = self.writes.keys().copied().collect();
            self.primary = self.order[0];
        }
        match self.phase {
            Phase::Prewriting => {
                let key = self.order[self.next];
                if let Err(why) = c.prewrite(key, self.start, self.primary, self.writes[&key]) {
                    return self.abort(c, why);
                }
                self.next += 1;
                if self.next == self.order.len() {
                    self.phase = Phase::CommittingPrimary;
                }
            }
            Phase::CommittingPrimary => {
                let commit = c.ts();
                let (start, primary) = (self.start, self.primary);
                // the lock must still be ours: if a reader rolled us back, the transaction is dead
                let alive = c.shard(primary).lock.get(&primary).is_some_and(|l| l.start == start);
                if !alive {
                    return self.abort(c, Conflict::RolledBack);
                }
                c.commit_key(primary, start, commit);
                self.commit = Some(commit);
                self.next = 1;
                self.phase = if self.order.len() == 1 { Phase::Done } else { Phase::CommittingSecondaries };
            }
            Phase::CommittingSecondaries => {
                let key = self.order[self.next];
                c.commit_key(key, self.start, self.commit.unwrap());
                self.next += 1;
                if self.next == self.order.len() {
                    self.phase = Phase::Done;
                }
            }
            Phase::Done | Phase::Aborted => {}
        }
        self.phase
    }
    fn abort(&mut self, c: &mut Cluster, _why: Conflict) -> Phase {
        for i in 0..self.next.max(1).min(self.order.len()) {
            let k = self.order[i];
            c.rollback_key(k, self.start);
        }
        self.phase = Phase::Aborted;
        self.phase
    }
    /// Run to the end.
    pub fn finish(&mut self, c: &mut Cluster) -> Phase {
        while !matches!(self.step(c), Phase::Done | Phase::Aborted) {}
        self.phase
    }
    pub fn primary(&self) -> Key {
        self.primary
    }
    pub fn keys(&self) -> &[Key] {
        &self.order
    }
}

impl Cluster {
    /// Lock `key` for the transaction that started at `start` and stage its value; refuse if the key changed since the snapshot, is locked,
    /// or the transaction was already rolled back (a duplicated or delayed prewrite must not revive it).
    pub fn prewrite(&mut self, key: Key, start: Ts, primary: Key, val: Option<u64>) -> Result<(), Conflict> {
        let now = self.now;
        let sh = self.shard(key);
        let newer = sh.write.get(&key).is_some_and(|w| w.iter().any(|(commit, _)| *commit >= start));
        if sh.rolled_back.contains(&(key, start)) {
            return Err(Conflict::RolledBack);
        }
        if newer || sh.lock.contains_key(&key) {
            return Err(Conflict::WriteConflict);
        }
        sh.data.insert((key, start), val);
        sh.lock.insert(key, Lock { start, primary, at: now });
        Ok(())
    }
    pub fn locks(&self) -> usize {
        self.shards.iter().map(|s| s.lock.len()).sum()
    }
    /// Every committed value of a key in commit order: `(commit ts, start ts, value)`.
    pub fn history(&self, key: Key) -> Vec<(Ts, Ts, Option<u64>)> {
        let sh = self.shard_ro(key);
        sh.write.get(&key).map(|w| w.iter().map(|&(c, s)| (c, s, sh.data[&(key, s)])).collect()).unwrap_or_default()
    }
    /// Is there a commit record for this transaction on this key?
    pub fn committed_at(&self, key: Key, start: Ts) -> Option<Ts> {
        self.shard_ro(key).write.get(&key).and_then(|w| w.iter().find(|(_, s)| *s == start)).map(|(c, _)| *c)
    }
}
