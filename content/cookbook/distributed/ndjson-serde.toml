[[sections]]
heading = "Design notes"
body = """
`#[serde(tag = "type")]` turns an enum into JSON objects with a discriminator field: perfect for event streams. Newline-delimited JSON (one JSON value per line) can be consumed **lazily**: parse each line independently so one bad line does not lose the rest, and memory stays flat for huge logs.

Docs: <https://serde.rs/enum-representations.html> and <https://serde.rs/attributes.html>
"""

