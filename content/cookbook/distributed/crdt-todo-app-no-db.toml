[[sections]]
heading = "What it is"
body = """
replicas keep **all** state in memory and sync over a simulated network that loses, duplicates, reorders and partitions messages. State is a composition of CRDTs:

- items: an OR-Set style "alive" flag (add tags + observed-remove set) with an **add-wins** or **remove-wins** policy (`Policy`),
- per-field registers: `title`/`due` are LWW registers stamped with a hybrid logical clock (`Hlc`), `done` is a multi-value register (concurrent true/false both survive, read policy = "done wins"),
- a PN-counter of completion events (increment on done, decrement on un-done); it counts **events**, so under concurrent toggles it can differ from "how many items are done": the demo prints both,
- **Order** of items: a sequence CRDT behind one trait `Seq`, implemented three ways: RGA, Logoot/LSEQ position ids, and Fugue.
"""

[[sections]]
heading = "How it works"
body = """
every local change is an `Op` stamped with a dot (replica, seq) and its causal dependencies (a version vector). Delivery goes through a **causal buffer** (an op waits until its origin's previous op and every dep were delivered; duplicates are dropped by the version vector). Sync is delta-state: replica A sends B only the ops B's version vector lacks.

RGA/Fugue store a tree (each node names its parent), Logoot stores a dense position id per element. In every case the visible order is a pure function of the **set** of nodes, so merge = set union and the three CRDT laws (commutative, associative, idempotent) are tested directly on `Doc::merge`.

- Fugue (Weidner et al.): to insert after visible element L: if L has no right child, become L's right child, otherwise become a **left** child of the next node in the full (tombstones included) traversal. Siblings sort by id. This keeps one author's run contiguous.

   This is **basic** Fugue, not FugueMax: FugueMax orders right-side siblings by their right origins (reverse order, ids break ties) and is the variant the paper proves "maximally non-interleaving"; basic Fugue may interleave more than necessary where some interleaving is unavoidable.
- RGA: insert after L; siblings with the same origin sort newest-first by a Lamport timestamp. Typing **backwards** interleaves.
- Logoot/LSEQ: a position is a path of (digit, site, counter); allocate between neighbours with boundary strategies. Concurrent runs interleave.

a tombstone is removable once its delete is **causally stable** (every replica reported a version vector covering it) **and** this replica has delivered everything those reports cover (otherwise a concurrent op that names the tombstone as origin could still be in flight). RGA and Logoot satisfy this per tombstone.

Fugue may name a tombstone as `rightOrigin` even after seeing its delete, so its tombstones are only collected at a **barrier** (all replicas identical, nothing in flight); we do that explicitly. Tags of the OR-sets are collected the same way.

**Snapshot**: `Replica::save`/`load` use a hand-written binary format (magic, LEB128 varints, length-prefixed strings, FNV checksum).

Honest limits: snapshots do not contain the op log (restart only when your local ops are already replicated); GC'd state must not be state-merged with un-GC'd old states (tag removal assumes op-based delivery); only the happy path of Fugue's published proofs is exercised here.
"""

