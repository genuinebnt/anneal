heading = "Where you would use it"
body = """
retry stage.
"""

[[sections]]
heading = "Common uses"
body = """
every network client that retries (HTTP, RPC, queue consumers): jitter prevents synchronized retry storms.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: wait `random(0, min(cap, base * 2^attempt))`. Exponential growth backs off quickly; the random jitter stops many clients retrying in lockstep (thundering herd). Inject the RNG so tests are exact.
"""

