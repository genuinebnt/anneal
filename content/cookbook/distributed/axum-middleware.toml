[[sections]]
heading = "Design notes"
body = """
Pattern: a middleware is `async fn(Request, Next) -> Response`. It can inspect/modify the request before calling `next.run(req)` and the response after. Here: reuse the caller's `x-request-id` or mint one, and echo it back so logs across services can be joined.

Layers wrap routes added **before** `.layer(..)`.
"""
