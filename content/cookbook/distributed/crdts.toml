heading = "Measured"
body = """
```text title="metadata under churn, a text document, and gossip"
set churn: 4 replicas, 200 000 random adds and removes over a universe of 50 000 values, merging every 100 operations
  observed-remove set: 24647 live elements, 24842 dots + version-vector entries of metadata
  two-phase set:       13673 live elements, 72719 entries kept (added + tombstones), and removed values can never be re-added
text document: 3 replicas, 30000 edits in 0.6 s; 2011 characters visible, 15982 elements stored (7.9x: tombstones are never removed without coordination)
gossip: every round each replica merges with one random peer (push-pull); rounds until all replicas hold an update made on one of them
  replicas     rounds      log2(n)
         8          4          3.0
        32          4          5.0
       128          5          7.0
       512          7          9.0
```

<ul> <li><strong>The merge laws hold on reachable states.</strong> For each of six state-based types, 300 random states (four replicas making random updates and merging at random) satisfy: <code>a ⊔ b = b ⊔ a</code>, <code>(a ⊔ b) ⊔ c = a ⊔ (b ⊔ c)</code>, <code>a ⊔ a = a</code>, and re-merging an input changes nothing.</li> <li><strong>Convergence is checked against oracles that share no code with the types.</strong> Counters equal the sum of all operations. The observed-remove set is compared with an oracle built from the adds and from the dots each remove observed (300 runs, four values, four replicas). The multi-value register keeps exactly the writes that no other write had seen. The list: 200 runs of three replicas editing concurrently with reordered, delayed and duplicated delivery all end with the same text, a single replica behaves exactly like a <code>Vec</code>, and two replicas typing "abc" and "xyz" at the same spot get "abcxyz" or "xyzabc", never an interleaving.</li> <li><strong>Observed-remove metadata stays proportional to the live data.</strong> After 200 000 random adds and removes, the observed-remove set holds 24 647 live elements and 24 842 units of metadata (one dot each plus four version-vector entries). A two-phase set, which keeps removals as permanent tombstones, holds 72 719 entries for 13 673 live elements and cannot re-add a removed value.</li> <li><strong>A text document pays for its tombstones</strong>: 30 000 edits by three replicas leave 2 011 visible characters stored as 15 982 elements, <strong>7.9 times</strong> the live text. Deleted characters stay, because a concurrent insert may still refer to them. Real editors compact tombstones when every replica has acknowledged them, or use structures that merge adjacent runs.</li> <li><strong>Gossip converges in about log₂ n rounds</strong>: one update reaches 512 replicas in 7 rounds of random pairwise exchange, 128 in 5, 8 in 4.</li> </ul>

<aside data-call="note"><b>Why the oracle for the set changed once</b><p>The first oracle for the observed-remove set counted every add dot as alive unless a <em>remove</em> had observed it, and the check failed on the second seed. The set was right and the oracle was wrong: an <code>add</code> of an element a replica already holds supersedes the dots it observed, exactly as a remove does. Both are observations. The oracle now records the dots seen at each add and each remove. It is a useful reminder that in these types "removed" means "observed by a later operation", never "absent".</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Types, not traits, per CRDT</strong>: each type has <code>merge(&amp;mut self, other: &amp;Self)</code> and its own mutators; a generic test harness (<code>laws</code>) takes the constructor, a random mutator and the merge as closures, so one function checks all six types.</li> <li><strong><code>BTreeMap</code> and <code>BTreeSet</code> everywhere</strong> make state comparison and iteration deterministic, which is what lets the tests compare two replicas with <code>==</code>.</li> <li><strong><code>Dot = (Replica, u64)</code></strong> is <code>Ord + Copy</code>, usable as a map key; <code>VClock::covers(dot)</code> is the whole causal-context test used by the set and the register merges.</li> <li><strong>Operation-based types separate the protocol from the data</strong>: <code>Rga::apply</code> assumes causal delivery and <code>CausalBuffer&lt;M&gt;</code> provides it for any message type <code>M</code> with a manual <code>Default</code> (a derive would demand <code>M: Default</code>).</li> <li><strong>Lamport counters</strong>: the list's clock follows every id it sees (<code>clock = max(clock, id.0)</code>) so that an element typed after seeing others sorts after them; a mutant that drops this line changes where characters land, and a directed test catches it.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Laws</strong>: for G-counter, PN-counter, LWW register, MV register, OR-set and LWW map, 300 random reachable states each; commutativity, associativity, idempotence and absorption.</li> <li><strong>Convergence against oracles</strong>: counter totals; the set's oracle from observed dots (300 runs); the register's surviving writes (300 runs).</li> <li><strong>Semantics</strong>: concurrent add and remove (add wins); a remove of everything observed removes; remove then re-add works while a two-phase set refuses; concurrent register writes both survive and a later write that saw both replaces them; a last-writer-wins tie is broken by replica id.</li> <li><strong>List</strong>: one replica equals a <code>Vec</code> under 500 random inserts and deletes; three replicas with reordering and duplication converge in 200 runs and the causal buffer ends empty; concurrent runs of typing do not interleave; a delete and a concurrent insert after the deleted character both take effect; a character typed after seeing another sorts after it; a duplicated operation changes nothing.</li> <li><strong>Mutants run against these tests</strong>: a counter that adds instead of taking the maximum; decrements added; a register keeping the older write; the multi-value register dropping values the other side had not seen; the set forgetting common dots, keeping a removed element's dot, or keeping the dots an add supersedes; concurrent list inserts ordered the other way; operations applied twice; the list clock not following what it receives; causal delivery ignoring dependencies. <strong>All 11 were killed.</strong> A twelfth, letting causal delivery accept gaps from one sender, survives and is equivalent: the dependency vector already contains the sender's earlier messages.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Redis Enterprise (CRDB)</strong>, <strong>Riak</strong> (data types: counters, sets, maps, registers, flags), <strong>Azure Cosmos DB</strong> (multi-region writes with LWW or custom merge), <strong>AntidoteDB</strong> and <strong>Akka Distributed Data</strong> provide CRDTs as database types. <strong>DynamoDB global tables</strong> use last-writer-wins per item; <strong>Cassandra</strong> uses cell-level last-write-wins timestamps and counters.</li> <li><strong>Collaborative editing</strong>: <strong>Automerge</strong> and <strong>Yjs</strong> are the widely used libraries for text and JSON documents (Yjs uses a YATA sequence CRDT, Automerge an RGA-like one with a compact binary format); <strong>Figma</strong> uses a CRDT-inspired approach with a central server ordering operations.</li> <li><strong>Local-first software</strong> keeps the authoritative copy on the device and syncs with CRDTs: the topic of the "Local-first software" essay (Kleppmann et al., Ink &amp; Switch), with Automerge as its engine.</li> <li><strong>Anna</strong> (the KVS in the <a href="/cookbook/p/tech-talks">tech talks list</a>) keeps lattices as values and gets coordination-free scaling from their merge; <strong>Dynamo-style</strong> stores keep sibling versions, the multi-value register of this section.</li> <li><strong>Where it ends</strong>: financial ledgers, inventory with limits and unique constraints use coordinated transactions (<a href="/cookbook/p/distributed-transactions">M10</a>), sometimes mixed with CRDT counters plus escrow (bounded counters) to make local decisions within a quota.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Last writer wins loses data silently and depends on clocks.</strong> Use hybrid logical clocks, expect lost concurrent writes, and choose it only where that is acceptable (a profile field, a last-seen time).</li> <li><strong>Wall clocks that jump</strong> (a phone with a wrong date) can make one replica's writes win forever; clamp timestamps relative to a trusted source.</li> <li><strong>Metadata grows</strong>: version vectors have an entry per replica that ever wrote; tombstones accumulate in sequences. Plan garbage collection with a stability point every replica acknowledged.</li> <li><strong>Not every invariant survives merging.</strong> A set of unique usernames, a non-negative balance, "at most one" need a coordinated path; mixing a CRDT column with a constraint is a bug waiting for a partition.</li> <li><strong>Operation-based CRDTs need exactly-once, causal delivery</strong>; state-based ones need only eventual delivery of states but ship more data. Delta-state sync (shipping just the part the peer lacks) is the production compromise and has its own subtleties (a delta must carry enough context to express removals).</li> <li><strong>Merging is not application-level merging.</strong> A multi-value register hands the application a set of conflicting values; someone has to define what to do with it.</li> <li><strong>Intention preservation in text is only approximate.</strong> Concurrent edits to the same sentence merge by position, not by meaning.</li> </ul></aside>
