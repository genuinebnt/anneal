```rust title="src/multimodel/crdt.rs"
//! Conflict-free replicated data types. State-based types (G-counter, PN-counter, last-writer-wins register, multi-value register,
//! add-wins observed-remove set, a map of registers) have a `merge` that is commutative, associative and idempotent, so replicas that
//! exchange state in any order, any number of times, converge. The list type (RGA) is operation-based and needs causal delivery,
//! which `CausalBuffer` provides.
use std::collections::{BTreeMap, BTreeSet};

pub type Replica = usize;
/// A unique event identifier: the replica that generated it and that replica's running count.
pub type Dot = (Replica, u64);

/// A version vector: for every replica, the highest dot of it that has been seen (events of one replica are seen in order).
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct VClock(pub BTreeMap<Replica, u64>);
impl VClock {
    pub fn get(&self, r: Replica) -> u64 {
        self.0.get(&r).copied().unwrap_or(0)
    }
    pub fn covers(&self, d: Dot) -> bool {
        self.get(d.0) >= d.1
    }
    pub fn next(&mut self, r: Replica) -> Dot {
        let c = self.0.entry(r).or_insert(0);
        *c += 1;
        (r, *c)
    }
    pub fn merge(&mut self, o: &VClock) {
        for (&r, &c) in &o.0 {
            let e = self.0.entry(r).or_insert(0);
            *e = (*e).max(c);
        }
    }
    pub fn leq(&self, o: &VClock) -> bool {
        self.0.iter().all(|(&r, &c)| o.get(r) >= c)
    }
}

// ---- counters ------------------------------------------------------------------------------------------------------------------------

#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct GCounter(pub BTreeMap<Replica, u64>);
impl GCounter {
    pub fn inc(&mut self, r: Replica, by: u64) {
        *self.0.entry(r).or_insert(0) += by;
    }
    pub fn value(&self) -> u64 {
        self.0.values().sum()
    }
    pub fn merge(&mut self, o: &GCounter) {
        for (&r, &c) in &o.0 {
            let e = self.0.entry(r).or_insert(0);
            *e = (*e).max(c);
        }
    }
}
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct PnCounter {
    pub p: GCounter,
    pub n: GCounter,
}
impl PnCounter {
    pub fn add(&mut self, r: Replica, by: i64) {
        if by >= 0 { self.p.inc(r, by as u64) } else { self.n.inc(r, by.unsigned_abs()) }
    }
    pub fn value(&self) -> i64 {
        self.p.value() as i64 - self.n.value() as i64
    }
    pub fn merge(&mut self, o: &PnCounter) {
        self.p.merge(&o.p);
        self.n.merge(&o.n);
    }
}

// ---- registers -----------------------------------------------------------------------------------------------------------------------

/// Last writer wins: the write with the greater `(timestamp, replica)` survives. Timestamps should come from a hybrid logical clock.
#[derive(Clone, Debug, PartialEq, Eq)]
pub struct LwwReg<T> {
    pub val: Option<T>,
    pub ts: (u64, Replica),
}
impl<T: Clone> Default for LwwReg<T> {
    fn default() -> Self {
        LwwReg { val: None, ts: (0, 0) }
    }
}
impl<T: Clone> LwwReg<T> {
    pub fn set(&mut self, r: Replica, ts: u64, v: T) {
        if (ts, r) > self.ts {
            self.val = Some(v);
            self.ts = (ts, r);
        }
    }
    pub fn merge(&mut self, o: &LwwReg<T>) {
        if o.ts > self.ts {
            *self = o.clone();
        }
    }
}

/// Keeps every concurrent write: a write replaces exactly the values it had seen.
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct MvReg<T> {
    pub vals: BTreeMap<Dot, T>,
    pub ctx: VClock,
}
impl<T: Clone + PartialEq> MvReg<T> {
    pub fn set(&mut self, r: Replica, v: T) {
        let d = self.ctx.next(r);
        self.vals.clear();
        self.vals.insert(d, v);
    }
    pub fn values(&self) -> Vec<&T> {
        self.vals.values().collect()
    }
    pub fn merge(&mut self, o: &MvReg<T>) {
        // a value survives if the other side has it too or has not yet seen it
        let mine: Vec<Dot> = self.vals.keys().copied().collect();
        for d in mine {
            if !o.vals.contains_key(&d) && o.ctx.covers(d) {
                self.vals.remove(&d);
            }
        }
        for (d, v) in &o.vals {
            if !self.vals.contains_key(d) && !self.ctx.covers(*d) {
                self.vals.insert(*d, v.clone());
            }
        }
        self.ctx.merge(&o.ctx);
    }
}

// ---- add-wins observed-remove set ---------------------------------------------------------------------------------------------

/// Each add creates a fresh dot; a remove deletes the dots it has observed; a concurrent add survives because its dot is unseen.
/// The causal context records what each replica has seen, so removals need no tombstones.
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct OrSet<T: Ord> {
    pub entries: BTreeMap<T, BTreeSet<Dot>>,
    pub ctx: VClock,
}
impl<T: Ord + Clone> OrSet<T> {
    pub fn add(&mut self, r: Replica, x: T) {
        let d = self.ctx.next(r);
        let e = self.entries.entry(x).or_default();
        e.clear();           // the new dot supersedes the ones this replica has observed
        e.insert(d);
    }
    pub fn remove(&mut self, x: &T) {
        self.entries.remove(x);
    }
    pub fn contains(&self, x: &T) -> bool {
        self.entries.contains_key(x)
    }
    pub fn items(&self) -> Vec<&T> {
        self.entries.keys().collect()
    }
    pub fn merge(&mut self, o: &OrSet<T>) {
        let keys: BTreeSet<T> = self.entries.keys().chain(o.entries.keys()).cloned().collect();
        let mut out: BTreeMap<T, BTreeSet<Dot>> = BTreeMap::new();
        let empty = BTreeSet::new();
        for k in keys {
            let (a, b) = (self.entries.get(&k).unwrap_or(&empty), o.entries.get(&k).unwrap_or(&empty));
            let mut dots: BTreeSet<Dot> = a.intersection(b).copied().collect();
            dots.extend(a.iter().filter(|d| !o.ctx.covers(**d)));
            dots.extend(b.iter().filter(|d| !self.ctx.covers(**d)));
            if !dots.is_empty() {
                out.insert(k, dots);
            }
        }
        self.entries = out;
        self.ctx.merge(&o.ctx);
    }
    pub fn metadata_dots(&self) -> usize {
        self.entries.values().map(|d| d.len()).sum::<usize>() + self.ctx.0.len()
    }
}

/// A two-phase set for comparison: removals are permanent tombstones that grow without bound.
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct TwoPhaseSet<T: Ord> {
    pub added: BTreeSet<T>,
    pub removed: BTreeSet<T>,
}
impl<T: Ord + Clone> TwoPhaseSet<T> {
    pub fn add(&mut self, x: T) {
        self.added.insert(x);
    }
    pub fn remove(&mut self, x: &T) {
        if self.added.contains(x) {
            self.removed.insert(x.clone());
        }
    }
    pub fn contains(&self, x: &T) -> bool {
        self.added.contains(x) && !self.removed.contains(x)
    }
    pub fn merge(&mut self, o: &TwoPhaseSet<T>) {
        self.added.extend(o.added.iter().cloned());
        self.removed.extend(o.removed.iter().cloned());
    }
    pub fn metadata(&self) -> usize {
        self.added.len() + self.removed.len()
    }
}

/// A map from keys to last-writer-wins registers: the shape of a row whose columns merge independently.
#[derive(Clone, Debug, Default, PartialEq, Eq)]
pub struct LwwMap<K: Ord, V>(pub BTreeMap<K, LwwReg<V>>);
impl<K: Ord + Clone, V: Clone> LwwMap<K, V> {
    pub fn set(&mut self, r: Replica, ts: u64, k: K, v: V) {
        self.0.entry(k).or_default().set(r, ts, v);
    }
    pub fn delete(&mut self, r: Replica, ts: u64, k: K) {
        let e = self.0.entry(k).or_default();
        if (ts, r) > e.ts {
            e.val = None;
            e.ts = (ts, r);
        }
    }
    pub fn get(&self, k: &K) -> Option<&V> {
        self.0.get(k).and_then(|r| r.val.as_ref())
    }
    pub fn merge(&mut self, o: &LwwMap<K, V>) {
        for (k, r) in &o.0 {
            self.0.entry(k.clone()).or_default().merge(r);
        }
    }
}

// ---- a replicated list (RGA) --------------------------------------------------------------------------------------------------------

pub type ElemId = (u64, Replica); // (Lamport counter, replica): a total order
#[derive(Clone, Debug, PartialEq)]
pub enum ListOp {
    Insert { id: ElemId, after: Option<ElemId>, ch: char },
    Delete { id: ElemId },
}
#[derive(Clone, Debug, PartialEq)]
struct Elem {
    id: ElemId,
    ch: char,
    dead: bool,
}
/// Replicated Growable Array: elements are linked in a sequence; an insert goes right after the element it was typed after,
/// skipping elements with a greater id (those were typed concurrently or later at the same position). Deletes leave tombstones.
#[derive(Clone, Debug, Default)]
pub struct Rga {
    elems: Vec<Elem>,
    clock: u64,
    pub replica: Replica,
}
impl Rga {
    pub fn new(replica: Replica) -> Rga {
        Rga { elems: vec![], clock: 0, replica }
    }
    pub fn text(&self) -> String {
        self.elems.iter().filter(|e| !e.dead).map(|e| e.ch).collect()
    }
    pub fn len_with_tombstones(&self) -> usize {
        self.elems.len()
    }
    fn visible(&self) -> Vec<usize> {
        (0..self.elems.len()).filter(|&i| !self.elems[i].dead).collect()
    }
    /// Type a character so that it appears at visible position `pos`. Returns the operation to broadcast.
    pub fn insert_at(&mut self, pos: usize, ch: char) -> ListOp {
        let vis = self.visible();
        let after = if pos == 0 { None } else { Some(self.elems[vis[pos - 1]].id) };
        self.clock += 1;
        let op = ListOp::Insert { id: (self.clock, self.replica), after, ch };
        self.apply(&op);
        op
    }
    pub fn delete_at(&mut self, pos: usize) -> ListOp {
        let vis = self.visible();
        let op = ListOp::Delete { id: self.elems[vis[pos]].id };
        self.apply(&op);
        op
    }
    /// Integrate an operation (own or remote). Remote operations must arrive after the operations they depend on.
    pub fn apply(&mut self, op: &ListOp) {
        match op {
            ListOp::Insert { id, after, ch } => {
                if self.elems.iter().any(|e| e.id == *id) {
                    return; // duplicate delivery
                }
                self.clock = self.clock.max(id.0);
                let mut i = match after {
                    None => 0,
                    Some(a) => self.elems.iter().position(|e| e.id == *a).expect("causal delivery: the reference element exists") + 1,
                };
                while i < self.elems.len() && self.elems[i].id > *id {
                    i += 1;
                }
                self.elems.insert(i, Elem { id: *id, ch: *ch, dead: false });
            }
            ListOp::Delete { id } => {
                if let Some(e) = self.elems.iter_mut().find(|e| e.id == *id) {
                    e.dead = true;
                }
            }
        }
    }
}

/// Delivers messages only after everything they causally depend on has been delivered.
pub struct CausalBuffer<M> {
    pub seen: VClock,
    pending: Vec<(Dot, VClock, M)>,
}
impl<M> Default for CausalBuffer<M> {
    fn default() -> Self {
        CausalBuffer { seen: VClock::default(), pending: vec![] }
    }
}
impl<M> CausalBuffer<M> {
    /// Accept a message sent by `dot.0` as its `dot.1`-th broadcast with dependencies `deps`; returns what became deliverable, in order.
    pub fn receive(&mut self, dot: Dot, deps: VClock, m: M) -> Vec<M> {
        if self.seen.covers(dot) {
            return vec![]; // duplicate
        }
        if !self.pending.iter().any(|p| p.0 == dot) {
            self.pending.push((dot, deps, m));
        }
        let mut out = vec![];
        loop {
            let pos = self.pending.iter().position(|(d, deps, _)| self.seen.get(d.0) + 1 == d.1 && deps.leq(&self.seen));
            let Some(i) = pos else { break };
            let (d, _, m) = self.pending.remove(i);
            self.seen.0.insert(d.0, d.1);
            out.push(m);
        }
        out
    }
    pub fn waiting(&self) -> usize {
        self.pending.len()
    }
}
