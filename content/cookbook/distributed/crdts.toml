[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Coordination is the expensive part of replication.</strong> <a href="/cookbook/p/raft">Raft</a> and <a href="/cookbook/p/distributed-transactions">distributed transactions</a> make every write wait for a majority. Some data does not need that: a like counter, a shopping cart, a collaboratively edited document, a replicated profile on a phone that is offline. For these, let every replica accept writes locally and make the <em>merge</em> of two replicas' states well defined, so that they converge when they exchange information, in any order.</li> <li><strong>A CRDT is a state with a join.</strong> A state-based CRDT is a set of states with a merge function that is <strong>commutative, associative and idempotent</strong>: the states form a semilattice and merging only moves up. Then it does not matter in which order, how many times, or through which path updates arrive; replicas that have seen the same updates hold the same state (<em>strong eventual consistency</em>). The laws are testable properties.</li> <li><strong>The art is making conflicts mean something.</strong> Counters: keep a vector of per-replica counts and add them up (G-counter), two of them for decrements (PN-counter). Registers: <em>last writer wins</em> (needs timestamps, and loses concurrent writes silently) or <em>multi-value</em> (keeps every concurrent write and lets the application or a later write resolve). Sets: an <strong>observed-remove set</strong> where an add creates a unique <em>dot</em>, a remove deletes only the dots it observed, and an add concurrent with a remove survives (<em>add wins</em>).</li> <li><strong>Causal context replaces tombstones.</strong> The set keeps one version vector saying which dots it has seen. A dot that is absent from a replica but covered by its context was seen and removed; one that is absent and not covered has simply not arrived. So a remove needs no tombstone and the metadata stays proportional to the live elements plus the number of replicas.</li> <li><strong>Sequences are the hard case.</strong> For text or lists, each element gets a unique identifier ordered consistently; an insert names the element it goes after and is placed among concurrent siblings by identifier order (RGA). Deletes leave tombstones, because a later insert may refer to a deleted element. Operation-based types like this need <em>causal delivery</em>: an operation arrives only after everything it depends on.</li> <li><strong>What CRDTs cannot do.</strong> They cannot enforce a constraint that needs agreement: a unique username, a balance that must stay non-negative, a limit of one winner. Those need coordination, at least for the operations that could violate them. A system with a CRDT mode lets a schema choose per column: coordinated (strong) or merged (convergent).</li> <li><strong>Garbage collection needs coordination too.</strong> Tombstones, and the version vector entries of departed replicas, can be dropped only when every replica has seen them; that is an agreement problem.</li> </ul>
"""

