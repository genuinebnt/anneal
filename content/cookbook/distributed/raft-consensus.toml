[[sections]]
heading = "Where you would use it"
body = """
building or reviewing a replicated state machine (config store, metadata service, lock service) or testing any consensus code.
"""

[[sections]]
heading = "What it is"
body = """
five Raft nodes (follower / candidate / leader) with terms, RequestVote, AppendEntries with the prev-index/prev-term **consistency check** and log repair, a commit index that advances only when a majority has replicated an entry of the **current** term, randomised election timeouts, heartbeats, **persistent** state (currentTerm, votedFor, log) that survives a crash while everything else (role, commit index, applied state, leader bookkeeping) is lost and rebuilt, and a replicated KV state machine.

The whole cluster runs inside one thread: a simulated network (drop, delay, duplication, reordering by random delay, partitions) and all timers are events in a time-ordered queue, and **all** randomness comes from a seeded xorshift, so any failing schedule is reproduced exactly from its seed.
"""

[[sections]]
heading = "Why it matters"
body = """
consensus bugs hide in rare interleavings (a vote lost here, a stale leader there). Real tests cannot reach them reliably, a simulator can: it plays thousands of schedules in seconds and checks the paper's safety properties **after every single event**, not just at the end. This is deterministic simulation testing (FoundationDB, TigerBeetle, Jepsen).
"""

[[sections]]
heading = "How it works"
body = """
- Election safety: a node votes once per term (votedFor persisted **before** replying) and a leader needs a majority.
- Log matching: AppendEntries carries (prevIndex, prevTerm); a follower refuses unless it has that entry, so "same index and term => same prefix" holds by induction. A refusal makes the leader back nextIndex up (with a hint of the follower's length) until logs agree; the follower then overwrites only **conflicting** entries.

   Truncating on a match would let a delayed duplicate delete good entries.
- Leader completeness: a candidate's log must be at least as up to date as the voter's (last term, then index).
- State machine safety: entries are applied in order from the commit index. A leader counts replicas only for entries of its **own** term (Figure 8): an old-term entry on a majority can still be overwritten by a later leader, so old entries commit indirectly; hence each new leader appends a no-op at once.

   Liveness needs randomised timeouts so one candidate usually wins before the others time out. **Teeth**: the checker is only credible if it can fail, so a deliberately broken node (it grants votes without the up-to-date check) is run through the same schedules and the invariant checker must catch it.
"""

