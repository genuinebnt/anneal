[[sections]]
heading = "Design notes"
body = """
DP recipe: (1) define the state, (2) write the recurrence, (3) fix the fill order, (4) read the answer, (5) backtrack. best[i][c] = best value using only the first i items with capacity c

```text
best[i][c] = max( best[i-1][c]                       // skip item i
                , best[i-1][c - w_i] + v_i  if w_i <= c )   // take item i
```

O(items &#42; capacity) time. The 2-D table lets us backtrack; if you only need the **value**, one row suffices (iterate capacity downwards). Greedy-by-ratio is **not** optimal here (see the assert).
"""

