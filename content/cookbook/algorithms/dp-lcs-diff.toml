[[sections]]
heading = "Design notes"
body = """
L[i][j] = length of the LCS of the first i items of A and first j items of B

```text
L[i][j] = L[i-1][j-1] + 1            if A[i] == B[j]
        = max(L[i-1][j], L[i][j-1])   otherwise
```

Backtrack from (n, m): equal items are kept; otherwise step in the direction of the larger neighbour, which means "delete from A" (up) or "insert from B" (left). Items in the LCS are unchanged, everything else is a change. Real-world diffs use Myers' O(ND) algorithm: <https://github.com/mitsuhiko/similar> and git's diff.
"""

