[[sections]]
heading = "Design notes"
body = """
Pattern: k hash functions set k bits per item. A lookup that finds any bit unset is a certain NO; all bits set means **maybe**. No false negatives; false-positive rate is tuned by bits-per-item and k.

We derive k hashes from two via double hashing.
"""

