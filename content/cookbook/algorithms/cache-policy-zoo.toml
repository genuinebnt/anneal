[[sections]]
heading = "Common uses"
body = """
OS page replacement (**clock** variants), database buffer pools (2Q, ARC-like, LRU-K), CDN and object caches (**sieve**, S3-FIFO, TinyLFU), **caveat** (measured, not fully explained): on the abrupt "shifting" trace **sieve** and W-TinyLFU lose to LRU/CLOCK/ARC at large cache sizes (e.g. 65% and 59% vs 90% at c=1024), and LFU collapses (stale frequencies).

Their state scales with the cache size, so they adapt slowly when the whole working set is replaced at once.

This was not cross-checked against a reference implementation (try libCacheSim or caffeine on the same trace): treat the numbers as a property of **these** implementations on **this** trace, and the lesson as "no policy wins every workload". in-process application caches (W-TinyLFU is what the Java library Caffeine uses), and offline "what hit ratio could **any** policy reach" analysis (**opt**).
"""

[[sections]]
heading = "Design notes"
body = """
What: nine policies behind one `trait Cache { fn access(&mut self, key) -> bool /*hit*/; fn len(&self) }`. Only keys matter (no values), because eviction policy is independent of payload.

Everything is arena based: one `Arena` of nodes (parallel Vecs) with `usize` links and a free list, many intrusive doubly linked `List`s over it, and a `HashMap<key, node index>`. No unsafe, no Rc (see lru_cache for the single-list version).

Why: no policy wins everywhere.

LRU collapses on scans and on loops slightly larger than the cache; LFU never forgets; **clock** approximates LRU cheaply (one bit, no list reordering on a hit); ARC and 2Q resist scans; **sieve** gets scan resistance with a single FIFO queue, a visited bit and a moving hand (hits only set a bit: no lock or reordering, which is why it is attractive for concurrent caches); W-TinyLFU adds **admission**: a candidate only displaces the victim if a count-min sketch says it is more frequent.

**Opt** (Belady: evict the key used farthest in the future, bypass a newcomer that would be used later than everything resident) needs the whole trace and is the unreachable upper bound.

How: seeded traces (Zipf, hot-set + scan pollution, a loop slightly larger than the cache, a shifting working set) are replayed against every policy at three sizes; the table is printed and then **asserted**: **opt** >= all, capacity never exceeded, ARC/SIEVE/2Q beat LRU under scan pollution, LRU &#126;0 on the loop while CLOCK/LFU/OPT are not, and ARC's four invariants from the paper are checked after **every** access.

ARC (Megiddo &amp; Modha): T1 = resident seen once, T2 = resident seen 2+ times, B1/B2 = ghost (key only) lists of what was evicted from T1/T2; a ghost hit in B1 means "recency deserved more room" so target p (the wanted size of T1) grows, a ghost hit in B2 shrinks it.
"""

