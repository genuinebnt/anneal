[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>roguelike/maze level generators</li><li>puzzle apps and solvers (exact cover)</li><li>constraint propagation in procedural content (wave function collapse)</li><li>enumerating permutations/subsets in brute-force search</li><li>Gray codes in rotary encoders and Karnaugh maps</li><li>flood fill/connected components in image processing and paint tools</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Each section is a small, classic algorithm with a **self-check** that does not trust the algorithm: mazes (4 generators) are verified to be spanning trees; solvers are verified shortest and unique; Sudoku solutions are validated and solver counts are cross-checked between Dancing Links and a backtracker;

N-queens counts must equal the known sequence; WFC output is re-checked cell by cell against the adjacency rules; flood fill is cross-checked against union-find; knight's tours are re-walked; Hanoi, Gray codes and permutation generators are checked against their defining properties.
"""

