"""

[[sections]]
heading = "Design notes"
body = """
Pattern: `BinaryHeap` is a MAX-heap; wrap keys in `Reverse` for min-first. Tuples compare field by field, so `(priority, sequence, name)` gives "lowest priority number first, then first-come-first-served". Never rely on `HashMap`/`HashSet` iteration order for output: it differs between runs.

Real code: std BinaryHeap -> <https://github.com/rust-lang/rust/blob/master/library/alloc/src/collections/binary_heap/mod.rs>
"""

