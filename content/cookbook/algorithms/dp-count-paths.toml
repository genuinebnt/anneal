[[sections]]
heading = "Design notes"
body = """
DAG DP pattern: the answer for a node depends only on the answers of its **predecessors**, so process nodes in an order where predecessors come first. Two equivalent ways:

- bottom-up: iterate nodes in that order, filling a table (no recursion, no stack risk)
- top-down: recursive function + memo table `Vec<Option<T>>` (computes only what is asked, simple to write) Here: number of distinct routes from node 0 to each node. The combine step is **sum**; think about which operation and which per-node weight you would use for a different question (longest, cheapest, earliest).

   Domain: delivery hubs, nodes are numbered so every edge goes from a lower to a higher number (a valid order for free).
"""

