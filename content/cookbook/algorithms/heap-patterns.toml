[[sections]]
heading = "What it is"
body = """
a heap keeps the smallest (or largest) element at index 0 of a plain `Vec`. The tree is implicit: children of i are 2i+1 and 2i+2 (d-ary: d&#42;i+1 ..= d&#42;i+d). **Why** a Vec: no pointers, great cache behaviour.
"""

[[sections]]
heading = "How it works"
body = """
`push` appends and sifts UP; `pop` swaps the last element to the root and sifts **down**; `heapify` sifts down every internal node from the last parent to the root, which is O(n) (not O(n log n)) because most nodes sit near the leaves and barely move. Heapsort = heapify, then repeatedly swap max to the end.

A d-ary heap is shallower (log_d n levels): cheaper push, costlier pop; often faster in practice. An **indexed** heap also stores each id's position, so `decrease_key(id, new)` is O(log n): that is what Dijkstra wants (dijkstra instead pushes duplicates and skips stale entries, "lazy deletion").

Patterns below each have a brute-force oracle fed with seeded random data.
"""

