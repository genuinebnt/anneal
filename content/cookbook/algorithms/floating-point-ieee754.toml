[[sections]]
heading = "Design notes"
body = """
**What**, in order of the demo:

1. Decode/encode by hand for any (exponent bits, mantissa bits) layout and check against `to_bits`/`from_bits` on random bit patterns of f64 and f32 (including subnormals, infinities, NaNs).
2. **Soft float**: addition and multiplication built from integer arithmetic only, for any small layout, with all five rounding modes (nearest-even, nearest-away, toward zero, up, down).

   The 8-bit minifloat (1-4-3) is checked **exhaustively** (all 65536 operand pairs, all modes) against an independent reference: exact f64 arithmetic (exact because operands are tiny) followed by "pick the nearest representable value" from a table of all codes. binary16 (1-5-10) is checked on random pairs.

   Ties-to-even is the default because it is unbiased: ties go up and down equally often, so errors do not drift.
3. ulp, next_up/next_down by bit twiddling (compared with std), and a monotone integer key that turns float comparison into integer comparison; ulp distance; why "relative + absolute + ulps" tolerance tests.
4. Catastrophic cancellation: (1-cos x)/x&#94;2 and the quadratic formula, naive vs stable.
5. FMA: exact product error `fma(a,b,-a*b)`, checked against Dekker's FMA-free two_prod; Kahan's accurate 2x2 determinant.
6. Summation: naive, Kahan, Neumaier, pairwise, and exact (Shewchuk partials, as in Python's `math.fsum`), with the exact one verified against i128 integer arithmetic and the others ranked by measured error.
7. Comparison pitfalls: NaN != NaN, `total_cmp`, signed zero, `min`/`max` with NaN, floats as hash keys.
8. Shortest round-trip printing (Rust's `{}`/`{:?}`): parse(print(x)) == x for random bit patterns and no shorter digit string round-trips; why 0.1 + 0.2 != 0.3; why money should use integers (see `decimal_fixed_point_money`).
"""

[[sections]]
heading = "Why it matters"
body = """
a double is a 53-bit significand scaled by a power of two. Every rounding error is "half an ulp", errors accumulate predictably, and almost every surprise (0.1+0.2, NaN keys, non-associative sums) follows from that.
"""

