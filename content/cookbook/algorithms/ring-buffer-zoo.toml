"""

[[sections]]
heading = "Design notes"
body = """
What: five ring-buffer flavours built from scratch, all safe code (the only `unsafe` in the file is the 3-line counting allocator wrapper used to **prove** the steady state does not allocate, same pattern as counting_allocator).

1. `Ring<T, N>`: fixed capacity, N a power of two so `counter & (N-1)` replaces `%`. `head` and `tail` are free-running **wrapping** counters (never reduced), so `len = tail - head` (wrapping) and full (`len == N`) is distinguishable from empty (`len == 0`) with NO wasted slot. The naive "head == tail" design needs a spare slot or a flag.

   Wrapping arithmetic stays correct when the counters overflow usize (tested by starting them near usize::MAX).
2. `MyDeque<T>`: a growable ring like `VecDeque`. When full it doubles and **unwraps**: element i goes to slot i of the new buffer so head = 0. `as_slices` returns the two segments, `make_contiguous` rotates the buffer so the live data is one slice.

   (Storage is `Vec<T>` with `T: Default` so no `MaybeUninit`/unsafe is needed; std uses uninitialised slots.)
3. `FlightRecorder`: overwrite-on-full ring of log lines (keeps the **last N**); lines are formatted into reused Strings, so logging is allocation free once each slot has grown to the longest line.
4. `ByteRing`: bytes with `write`/`read` that copy in at most **two** segments (to the end of the buffer, then from the start), plus zero-copy views (`readable`, `writable`, `commit`, `consume`) returning contiguous slices: the shape of `read(fd, ring.writable())` then parse in place.
5. `WindowStats`: moving average/min/max over the last W samples; min/max use a **monotonic** deque (each sample is pushed and popped at most once, so amortised O(1)) built on `MyDeque`. Verified by differential tests against `VecDeque` (50k seeded random operations), brute-force window statistics, and an allocation count of 0

over 100k operations after warm-up. **Promoting to SPSC** (see spsc_ring_buffer): make `head` and `tail` atomics, the producer owns `tail` and the consumer owns `head`.

The producer writes the slot **first**, then publishes with `tail.store(.., Release)`; the consumer reads `tail` with Acquire before touching the slot, then frees it with `head.store(.., Release)`, which the producer observes with an Acquire load of `head` before reusing the slot.

Each side may cache the other's counter and reload only when the ring looks full/empty. Put head and tail on separate cache lines (false sharing). Slots need interior mutability (UnsafeCell), which is where the unsafe in spsc_ring_buffer comes from; the wrapping-counter indexing carries over unchanged.

Relaxed is **not** enough: it would let the consumer see the new tail before the slot's contents.
"""

