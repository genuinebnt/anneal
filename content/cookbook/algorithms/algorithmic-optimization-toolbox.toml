[[sections]]
heading = "Where you would use it"
body = """
any "it passes the small tests but times out" moment; choosing the right asymptotic idea before micro-tuning.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>query engines (sort+merge instead of nested loops, prefix sums for range aggregates)</li><li>monitoring (sliding-window max/min)</li><li>scheduling and partitioning DPs</li><li>path finding (A*)</li><li>randomised selection in analytics</li><li>cache-friendly matrix code</li><li>contest/interview problems. Course: MIT 6.006 / 6.046 (amortised analysis, divide and conquer, DP)</li><li>CMU 15-451 for randomised algorithms</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
12 sections of pairs (naive, optimised).

For each pair: (1) both are run on seeded random inputs and must return the same answer; (2) both increment an explicit **operation counter** (comparisons, cell updates, pointer moves, cache misses of a simulated cache); (3) the asymptotic gap is **asserted** on the counters, never on wall-clock time, so the asserts hold on any machine.

The counts are printed so you can see O(n&#94;2) vs O(n log n) as actual numbers.
"""

[[sections]]
heading = "Why it matters"
body = """
micro-optimisation (SIMD, unrolling; see `loop_optimization_ladder`) multiplies by a constant; the ideas here change the exponent. The order of attack is: better algorithm, better data layout, then constant factors.
"""

[[sections]]
heading = "How it works"
body = """
each section is one idea in &#126;20 lines. Ideas only described (not coded) are marked **described**:

- SMAWK: row minima of a totally monotone matrix in O(n + m); generalises divide-and-conquer DP optimisation.
- van Emde Boas layout: store a search tree recursively by halving height so any block size B is served at O(log_B n) misses without knowing B (cache-oblivious); section 12 shows the same trick on transposition.
- HyperLogLog: approximate distinct counting in O(log log n) space; see the probabilistic data structure recipes.
"""

[[sections]]
heading = "Design notes"
body = """
**Limits**: these are teaching versions. Sums and squares must fit in their integer types (nothing checks for overflow, also not `d * d` in `prime_6k` for n close to `u64::MAX`). The group-split and Knuth optimisations are only valid for non-negative numbers, and the convex hull trick expects the heights in increasing order.

The pair count of the two-pointer version leaves out the sort. A random pivot does **not** save this quickselect from many equal values: its two-way partition then takes a quadratic number of comparisons (a three-way partition avoids that).
"""

