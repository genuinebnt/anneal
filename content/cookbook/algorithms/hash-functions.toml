body = """
<ul class="cb-g-uses"><li>HashMap/HashSet hasher selection (fast_hashing)</li><li>consistent hashing and sharding (consistent_hashing, hash_partitioning)</li><li>bloom/cuckoo filters (bloom_filter, cuckoo_hashing)</li><li>content-defined chunking</li><li>deduplication fingerprints</li><li>HashDoS hardening of servers that build maps from request data</li></ul>
"""

