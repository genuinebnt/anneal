[[sections]]
heading = "Design notes"
body = """
Knuth (TAOCP Vol 4A, 7.2.1) treats generation as a first-class problem: visit every object of a family exactly once, with O(1) **amortised** work per object, ideally changing as little as possible between neighbours.

Every generator here is an `Iterator` that keeps a tiny state and mutates it in place (the `Vec` yielded by some of them is a clone for convenience; the state update itself is the amortised O(1) part). Each is checked against a known count and a brute-force oracle for small n.

- Gray code: gray(i) = i &#94; (i >> 1); neighbours differ in **one** bit.
- Combinations: lexicographic in-place successor, and Gosper's hack (next mask with the same popcount).
- Permutations: next_permutation (lexicographic), Heap's (one swap per step), Steinhaus-Johnson-Trotter (adjacent transposition per step; this version scans for the mobile element in O(n), Even's speed-up makes it O(1)).
- Rank/unrank via the factorial number system (Lehmer code).
- Integer partitions p(n), set partitions via restricted growth strings (Bell numbers), Dyck words &lt;-> binary trees (Catalan numbers), Lyndon words/necklaces (Duval/FKM), de Bruijn sequences from Lyndon words.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>exhaustive and combinatorial test generation</li><li>Gray codes in rotary encoders and error-minimising labelling</li><li>de Bruijn sequences in lock-picking/brute-force analysis and position encoding</li><li>necklace counting in chemistry/music/cryptography</li><li>Gosper's hack for subset-DP over bitmasks</li><li>next_permutation in contest code and the C++ standard library</li></ul>
"""

