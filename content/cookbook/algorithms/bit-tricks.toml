[[sections]]
heading = "Design notes"
body = """
Each trick below is implemented in the "classic" form, then asserted equal to the standard-library intrinsic or to an obviously-correct loop on the edge cases 0, 1, MAX, powers of two, and thousands of seeded random inputs.

The tricks: lowest-set-bit tools, SWAR popcount / parity / bit reversal, smearing for next power of two, zero-byte detection (word-at-a-time strlen), branchless min/max/abs/sign, Gosper's hack, Morton codes with PDEP/PEXT semantics (and a Z-order range query), 8x8 bit-matrix transpose, carry-less multiply, Gray code, rank/select inside a word, division by constants via multiply-high magic numbers, sign extension, and saturating arithmetic.

**What LLVM already does**: modern compilers recognise many of these idioms.

`x & (x - 1)` becomes BLSR on x86 with BMI1, a hand-written SWAR popcount is often replaced by a single POPCNT (or by the `ctpop` intrinsic lowered per target), `x / 7` is always compiled into the multiply-high form shown here (never emit a real `div` for a constant), and min/max/abs patterns become cmov or dedicated instructions.

So: prefer `count_ones`, `leading_zeros`, `reverse_bits`, `rotate_left`, `isqrt`, `div_ceil` and friends; they map to the best instruction per target.

Write a manual trick when std has no equivalent (Morton, bit-matrix transpose, SWAR on bytes) and **check** the assembly: `cargo install cargo-show-asm`, then `cargo asm --example bit_tricks <function>` (<https://github.com/pacak/cargo-show-asm>).

Use `std::hint::black_box` on inputs/outputs in micro-benchmarks, otherwise the optimiser folds your constant inputs away and you time nothing (see the timing at the end of main).
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>bitset/bitmap indexes and roaring-style containers</li><li>hash functions and PRNGs</li><li>chess engines (bitboards)</li><li>spatial indexing with Z-order/Morton keys (databases, GPUs, quadtrees)</li><li>fast string scanning (memchr-style zero-byte tests)</li><li>checksums (carry-less multiply drives CRC/GHASH hardware)</li><li>compilers (division by constants)</li></ul>
"""

