body = """
<ul class="cb-g-uses"><li>order-statistic trees (rank/percentile queries)</li><li>interval trees in calendar double-booking checks</li><li>range-based scheduling</li><li>genomics tools that intersect regions (<strong>bed</strong>-style intervals)</li><li>Cartesian-tree/rope style sequences (implicit treaps)</li></ul>
