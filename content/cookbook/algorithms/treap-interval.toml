[[sections]]
heading = "What it is"
body = """
a treap is a BST on keys that is simultaneously a max-heap on random priorities.

Random priorities make its shape that of a random BST, so depth is O(log n) **expected** with no rotations or balance bookkeeping: everything is built from two primitives, `split(t, key)` (cut into &lt; key and >= key) and `merge(a, b)` (join two treaps where all of a &lt; all of b). insert = split + merge; remove = split twice + merge; arena-based (`Vec` of nodes, `usize` ids, arena_ids).

**Augmentation** is the general technique: each node caches an aggregate of its subtree, recomputed in `pull` after any structural change. `size` gives order statistics (rank, k-th, range count).

A `max hi` aggregate over (lo, hi, id) keys gives an **interval tree**: a whole subtree whose max endpoint is &lt; a can be skipped, so "which intervals overlap [a, b]" is output-sensitive. The augmentation is a trait (`Augment`), so the same treap code serves both uses.

Verified against a sorted `Vec` / naive interval scan with 10k seeded random operations each, plus a structural checker.
"""

[[sections]]
