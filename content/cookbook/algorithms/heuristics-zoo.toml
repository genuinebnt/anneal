[[sections]]
heading = "Where you would use it"
body = """
NP-hard optimisation you cannot solve exactly at scale (packing, covering, routing, join ordering).
"""

[[sections]]
heading = "What it is"
body = """
when the exact problem is NP-hard you pick one of three tools. The trick that makes them trustworthy is to test every one against an **exact** solver on tiny seeded instances, so claims like "within 11/9 **opt**" are asserted rather than believed.
"""

[[sections]]
heading = "Design notes"
body = """
```text
| kind                       | guarantee                 | here                                            | typical use                              |
```

&#124;----------------------------&#124;---------------------------&#124;-------------------------------------------------&#124;------------------------------------------&#124;

```text
| exact (B&B, DP, Held-Karp) | optimal, exponential cost | bin packing B&B, subset enumeration, Held-Karp  | small n, ground truth for tests          |
| approximation algorithm    | PROVEN ratio to OPT       | FFD <= 11/9 OPT+1, greedy set cover <= H(n),    | schedulers, covering, when you need a    |
|                            |                           | MST-doubling TSP <= 2 OPT (metric)              | worst-case promise                       |
| heuristic / metaheuristic  | none (empirically good)   | 2-opt, annealing, restarts, beam, genetic       | many-join optimisers, routing, tuning    |
```

Where used: PostgreSQL optimises joins with exhaustive dynamic programming for few tables and switches to a genetic algorithm (GEQO) above a table-count threshold; compilers allocate registers by graph-colouring heuristics or linear scan because optimal allocation is NP-hard;

Bin-packing style first-fit/best-fit heuristics are the core of resource placement and cutting-stock tools; A&#42; with an admissible heuristic is exact, with an inadmissible one it trades optimality for speed.
"""

[[sections]]
heading = "How it works"
body = """
seeded xorshift everywhere (deterministic); every section ends with assert!s on ratios against the exact answer.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>query join ordering</li><li>VM/container placement</li><li>cutting stock</li><li>vehicle routing</li><li>test-suite minimisation (set cover)</li><li>chip placement (annealing)</li><li>feature selection (beam/genetic)</li><li>pathfinding in games and robotics</li></ul>
"""

