"""

[[sections]]
heading = "Design notes"
body = """
Try to match each left node. If its preferred right node is taken, ask the **current** owner to move to another option (recursively): that chain is an "augmenting path". Each success grows the matching by one.

O(V&#42;E). For big inputs use Hopcroft-Karp O(E sqrt V); for **costs** use the Hungarian algorithm / min-cost flow.
"""

