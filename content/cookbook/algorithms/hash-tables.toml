[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Where DBMSs use data structures</strong>: internal metadata (page tables, directories), core storage (index-organized tables), temporary structures (join and aggregation hash tables), and table indexes. Two design axes every time: <strong>data organization</strong> (layout, memory vs disk) and <strong>concurrency</strong>.</li> <li><strong>Hash table</strong> = hash function + collision scheme. O(1) average, O(n) worst case, and no ordering, so no range scans.</li> <li><strong>Hash functions</strong>: fast, with a low collision rate. No cryptographic strength needed. State of the art: <strong>xxHash3</strong> (and friends: wyhash, CityHash, FarmHash, rapidhash).</li> <li><strong>Static schemes</strong> need the size up front; growing means rebuilding (usually at 2×). Size at about 2× the expected number of elements.</li> <li><strong>Linear probing</strong>: one circular array, probe forward on collisions. It's the fastest and most cache-friendly scheme, but it clusters at high load. Delete with <strong>tombstones</strong> (lookups continue past them, inserts reuse them), or by shifting entries back (rarely done). Store the key (or its hash) in the slot to verify matches.</li> <li><strong>Variable-length keys</strong> live out of line (hash + pointer or RID in the slot). <strong>Non-unique keys</strong>: store redundant copies of the key (common), or a value list per key.</li> <li><strong>Optimizations</strong>: specialize the table per key type or size; keep slot metadata (empty/tombstone/hash bits) in a separate compact array (<strong>SwissTable / <code>absl::flat_hash_map</code></strong>); version counters for O(1) clear-and-reuse.</li> <li><strong>Cuckoo hashing</strong>: several hash functions (often one table), and a key is always in one of k slots, so lookups are O(1). Inserts evict ("kick") occupants to their alternate slot; on a cycle, rehash or grow.</li> <li><strong>Dynamic schemes</strong> grow incrementally. <strong>Chained</strong>: a list of buckets per slot. <strong>Extendible</strong>: a directory of 2&#94;global-depth pointers to buckets with local depths; split only the full bucket, and double the directory only when local depth = global depth. <strong>Linear</strong>: a split pointer splits buckets round-robin whenever <em>any</em> bucket overflows; two hash functions coexist during a round; it can shrink too.</li> </ul>
"""

