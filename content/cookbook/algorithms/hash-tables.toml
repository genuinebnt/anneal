std HashMap (SipHash)  insert   25.0 ns/op   lookup   19.7 ns/op   ← hashbrown: SIMD SwissTable, slower hash
```

<p>Two things to notice. Open addressing with a cheap hash beats everything on lookups, which is why join and aggregation tables use it. And the dynamic schemes pay for incremental growth with an extra indirection. That's the right trade <em>on disk</em>, where a full rebuild means rewriting every page, and the wrong one in memory.</p>

:::deeper Reference: linear probing with control bytes, cuckoo, extendible, linear hashing
```rust title="src/container/hash/schemes.rs"
//! Hash tables from L07: open addressing (linear probing with control bytes),
//! cuckoo, extendible and linear hashing. u64 keys/values keep the focus on the schemes.

#[inline]
pub fn hash64(x: u64, seed: u64) -> u64 {
    // splitmix64 finalizer: fast, well-mixed; a stand-in for xxh3 on 8-byte keys
    let mut z = x.wrapping_add(seed).wrapping_add(0x9E37_79B9_7F4A_7C15);
    z = (z ^ (z >> 30)).wrapping_mul(0xBF58_476D_1CE4_E5B9);
    z = (z ^ (z >> 27)).wrapping_mul(0x94D0_49BB_1331_11EB);
    z ^ (z >> 31)
}

// ------------------------------------------------------------------------------------
// Linear probing with a separate control-byte array (SwissTable idea, scalar version).
// ctrl: EMPTY | TOMBSTONE | 0x00..0x7F = low 7 bits of the hash ("h2"). Probing compares
// one byte per slot and only touches keys whose h2 matches: ~1/128 false matches.
const EMPTY: u8 = 0x80;
const TOMB: u8 = 0xFE;

pub struct LinearProbe { ctrl: Vec<u8>, keys: Vec<u64>, vals: Vec<u64>, len: usize, tombs: usize }

impl LinearProbe {
    pub fn with_capacity(n: usize) -> Self {
        let cap = (n * 2).next_power_of_two().max(8);          // load factor ≤ 0.5 at the requested size
        LinearProbe { ctrl: vec![EMPTY; cap], keys: vec![0; cap], vals: vec![0; cap], len: 0, tombs: 0 }
    }
    fn mask(&self) -> usize { self.ctrl.len() - 1 }
    fn split(h: u64) -> (usize, u8) { ((h >> 7) as usize, (h & 0x7F) as u8) }

    pub fn get(&self, k: u64) -> Option<u64> {
        let (mut i, h2) = Self::split(hash64(k, 0));
        loop {
            i &= self.mask();
            match self.ctrl[i] {
                EMPTY => return None,                           // an empty slot ends every probe chain
                c if c == h2 && self.keys[i] == k => return Some(self.vals[i]),
                _ => i += 1,                                    // tombstone or other key: keep going
            }
        }
    }

    pub fn insert(&mut self, k: u64, v: u64) -> Option<u64> {
        if (self.len + self.tombs + 1) * 8 > self.ctrl.len() * 7 { self.resize(); }   // max load 7/8
        let (mut i, h2) = Self::split(hash64(k, 0));
        let mut first_tomb = None;
        loop {
            i &= self.mask();
            match self.ctrl[i] {
                EMPTY => {
                    // Key absent. Reuse the first tombstone we passed, if any.
                    let at = first_tomb.unwrap_or(i);
                    if self.ctrl[at] == TOMB { self.tombs -= 1; }
                    self.ctrl[at] = h2; self.keys[at] = k; self.vals[at] = v;
                    self.len += 1;
                    return None;
                }
                TOMB => { first_tomb.get_or_insert(i); i += 1; }
                c if c == h2 && self.keys[i] == k => return Some(std::mem::replace(&mut self.vals[i], v)),
                _ => i += 1,
            }
        }
    }

    pub fn remove(&mut self, k: u64) -> Option<u64> {
        let (mut i, h2) = Self::split(hash64(k, 0));
        loop {
            i &= self.mask();
            match self.ctrl[i] {
                EMPTY => return None,
                c if c == h2 && self.keys[i] == k => {
                    // If the next slot is EMPTY no chain passes through here: mark EMPTY, not TOMB.
                    if self.ctrl[(i + 1) & self.mask()] == EMPTY { self.ctrl[i] = EMPTY; } else { self.ctrl[i] = TOMB; self.tombs += 1; }
                    self.len -= 1;
                    return Some(self.vals[i]);
                }
                _ => i += 1,
            }
        }
    }

    fn resize(&mut self) {
        // Grow only if genuinely full of live entries; otherwise rebuild in place to purge tombstones.
        let cap = if self.len * 2 >= self.ctrl.len() { self.ctrl.len() * 2 } else { self.ctrl.len() };
        let old = std::mem::replace(self, LinearProbe { ctrl: vec![EMPTY; cap], keys: vec![0; cap], vals: vec![0; cap], len: 0, tombs: 0 });
        for i in 0..old.ctrl.len() { if old.ctrl[i] < 0x80 { self.insert(old.keys[i], old.vals[i]); } }
    }
    pub fn len(&self) -> usize { self.len }
    pub fn is_empty(&self) -> bool { self.len == 0 }
}

// ------------------------------------------------------------------------------------
// Cuckoo hashing: every key lives in one of two slots, h1(k) or h2(k). Lookups probe
// at most two slots. Inserts evict ("kick") the occupant to its other slot.
pub struct Cuckoo { slots: Vec<Option<(u64, u64)>>, seed: u64, len: usize }

impl Cuckoo {
    pub fn new(cap: usize) -> Self { Cuckoo { slots: vec![None; cap.next_power_of_two().max(8)], seed: 1, len: 0 } }
    fn pos(&self, k: u64, which: u64) -> usize { (hash64(k, self.seed.wrapping_mul(which + 1)) as usize) & (self.slots.len() - 1) }

    pub fn get(&self, k: u64) -> Option<u64> {
        [self.pos(k, 0), self.pos(k, 1)].into_iter().find_map(|i| match self.slots[i] { Some((kk, v)) if kk == k => Some(v), _ => None })
    }

    pub fn insert(&mut self, k: u64, v: u64) {
        for i in [self.pos(k, 0), self.pos(k, 1)] {
            if let Some((kk, vv)) = &mut self.slots[i] { if *kk == k { *vv = v; return; } }
        }
        let mut cur = (k, v);
        let mut i = self.pos(k, 0);
        for _ in 0..64 {                                          // bounded kick chain
            match self.slots[i].replace(cur) {
                None => { self.len += 1; return; }
                Some(evicted) => {
                    cur = evicted;
                    let (a, b) = (self.pos(cur.0, 0), self.pos(cur.0, 1));
                    i = if i == a { b } else { a };               // move the evicted key to its other home
                }
            }
        }
        // Cycle or table too full: grow, re-seed, and re-insert everything.
        self.rebuild(self.slots.len() * 2);
        self.insert(cur.0, cur.1);
    }

    fn rebuild(&mut self, cap: usize) {
        let old = std::mem::replace(&mut self.slots, vec![None; cap]);
        self.seed = self.seed.wrapping_add(0x9E37);
        self.len = 0;
        for (k, v) in old.into_iter().flatten() { self.insert(k, v); }
    }

    pub fn remove(&mut self, k: u64) -> Option<u64> {
        for i in [self.pos(k, 0), self.pos(k, 1)] {
            if matches!(self.slots[i], Some((kk, _)) if kk == k) { self.len -= 1; return self.slots[i].take().map(|(_, v)| v); }
        }
        None
    }
}

// ------------------------------------------------------------------------------------
// Extendible hashing: a directory of 2^global_depth pointers into buckets; each bucket
// has a local depth ≤ global depth. A full bucket splits; the directory doubles only
// when the splitting bucket's local depth equals the global depth.
// Uses the LOW bits of the hash, as BusTub's disk implementation does.
pub struct Extendible { dir: Vec<usize>, buckets: Vec<Bucket>, global: u32, bucket_cap: usize }
struct Bucket { depth: u32, items: Vec<(u64, u64)> }

impl Extendible {
    pub fn new(bucket_cap: usize) -> Self {
        Extendible { dir: vec![0], buckets: vec![Bucket { depth: 0, items: vec![] }], global: 0, bucket_cap }
    }
    fn slot(&self, h: u64) -> usize { (h & ((1u64 << self.global) - 1)) as usize }

    pub fn get(&self, k: u64) -> Option<u64> {
        let b = &self.buckets[self.dir[self.slot(hash64(k, 7))]];
        b.items.iter().find(|(kk, _)| *kk == k).map(|(_, v)| *v)
    }

    pub fn insert(&mut self, k: u64, v: u64) {
        let h = hash64(k, 7);
        loop {
            let bi = self.dir[self.slot(h)];
            let b = &mut self.buckets[bi];
            if let Some(e) = b.items.iter_mut().find(|(kk, _)| *kk == k) { e.1 = v; return; }
            if b.items.len() < self.bucket_cap { b.items.push((k, v)); return; }
            if b.depth == 40 { b.items.push((k, v)); return; }      // pathological: all hashes equal; overflow
            self.split(bi);                                          // then retry: may split again
        }
    }

    fn split(&mut self, bi: usize) {
        if self.buckets[bi].depth == self.global {
            self.dir.extend_from_within(..);                       // double: new half mirrors old half
            self.global += 1;
        }
        let d = self.buckets[bi].depth;
        let high_bit = 1u64 << d;                                    // the bit that now tells siblings apart
        let items = std::mem::take(&mut self.buckets[bi].items);
        self.buckets[bi].depth = d + 1;
        let nb = self.buckets.len();
        self.buckets.push(Bucket { depth: d + 1, items: vec![] });
        // Every directory slot that pointed to bi and has the new bit set now points to nb.
        for (i, p) in self.dir.iter_mut().enumerate() {
            if *p == bi && (i as u64) & high_bit != 0 { *p = nb; }
        }
        for (k, v) in items {
            let target = if hash64(k, 7) & high_bit != 0 { nb } else { bi };
            self.buckets[target].items.push((k, v));
        }
    }

    pub fn remove(&mut self, k: u64) -> Option<u64> {
        let bi = self.dir[self.slot(hash64(k, 7))];
        let b = &mut self.buckets[bi];
        let pos = b.items.iter().position(|(kk, _)| *kk == k)?;
        Some(b.items.swap_remove(pos).1)                              // no merging: see exercises
    }

    pub fn global_depth(&self) -> u32 { self.global }
    pub fn check_invariants(&self) {
        assert_eq!(self.dir.len(), 1 << self.global);
        for (i, &bi) in self.dir.iter().enumerate() {
            let b = &self.buckets[bi];
            assert!(b.depth <= self.global);
            // All slots sharing the bucket agree on the low `depth` bits.
            let mask = (1u64 << b.depth) - 1;
            for (k, _) in &b.items { assert_eq!(hash64(*k, 7) & mask, i as u64 & mask); }
            // A bucket of depth d is referenced by exactly 2^(global - d) slots.
            assert_eq!(self.dir.iter().filter(|&&x| x == bi).count(), 1 << (self.global - b.depth));
        }
    }
}

// ------------------------------------------------------------------------------------
// Linear hashing: buckets split one at a time in round-robin order (split pointer),
// whenever the load factor exceeds a threshold, not necessarily the overflowing bucket.
pub struct LinearHash { buckets: Vec<Vec<(u64, u64)>>, level: u32, next: usize, n0: usize, len: usize }

impl LinearHash {
    pub fn new(n0: usize) -> Self { LinearHash { buckets: vec![vec![]; n0], level: 0, next: 0, n0, len: 0 } }
    fn addr(&self, k: u64) -> usize {
        let h = hash64(k, 3) as usize;
        let m = self.n0 << self.level;
        let b = h % m;
        if b < self.next { h % (m * 2) } else { b }   // already split this round: use the next-level function
    }
    pub fn get(&self, k: u64) -> Option<u64> { self.buckets[self.addr(k)].iter().find(|e| e.0 == k).map(|e| e.1) }
    pub fn insert(&mut self, k: u64, v: u64) {
        let a = self.addr(k);
        if let Some(e) = self.buckets[a].iter_mut().find(|e| e.0 == k) { e.1 = v; return; }
        self.buckets[a].push((k, v));
        self.len += 1;
        if self.len > self.buckets.len() * 4 { self.split_next(); }    // load factor > 4 per bucket
    }
    fn split_next(&mut self) {
        let m = self.n0 << self.level;
        self.buckets.push(vec![]);                                   // new bucket at index next + m
        let old = std::mem::take(&mut self.buckets[self.next]);
        for (k, v) in old {
            let b = (hash64(k, 3) as usize) % (m * 2);
            self.buckets[b].push((k, v));                             // lands in `next` or `next + m`
        }
        self.next += 1;
        if self.next == m { self.level += 1; self.next = 0; }       // round complete: double the base
    }
    pub fn remove(&mut self, k: u64) -> Option<u64> {
        let a = self.addr(k);
        let pos = self.buckets[a].iter().position(|e| e.0 == k)?;
        self.len -= 1;
        Some(self.buckets[a].swap_remove(pos).1)
    }
    pub fn num_buckets(&self) -> usize { self.buckets.len() }
}
```
:::

<aside data-call="rust"><b>The <code>EMPTY</code>-neighbour trick for deletes</b><p>Tombstones make lookups walk further as deletes accumulate. hashbrown's rule, used above: if the slot <em>after</em> the deleted one is <code>EMPTY</code>, no probe chain can pass through this slot, so mark it <code>EMPTY</code> instead of <code>TOMBSTONE</code>. When tombstones do pile up, the load check counts them (<code>len + tombs</code>), and the table rebuilds <em>at the same size</em> to purge them, rather than growing. That bug of growing forever under insert/delete churn has hit real systems.</p></aside>

<aside data-call="rust"><b><code>Vec::extend_from_within(..)</code> doubles a directory in one call</b><p>Extendible hashing's directory doubling means "append a copy of myself". <code>dir.extend_from_within(..)</code> does it without a temporary clone and without fighting the borrow checker (you can't <code>dir.extend(dir.iter())</code>, because that's a shared and a mutable borrow at once). Reference: <a href="https://doc.rust-lang.org/std/vec/struct.Vec.html#method.extend_from_within" target="_blank" rel="noreferrer"><code>Vec::extend_from_within</code></a>.</p></aside>
"""

