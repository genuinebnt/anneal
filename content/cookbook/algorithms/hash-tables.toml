```text title="2M random u64 keys, insert then lookup all · Apple M4 Pro, release · verify/tests/hashing.rs"
linear probe (ctrl)    insert   46.6 ns/op   lookup   11.2 ns/op
cuckoo                 insert  111.6 ns/op   lookup   15.4 ns/op
extendible (cap 64)    insert  241.7 ns/op   lookup   47.1 ns/op   ← directory hop + bucket scan
