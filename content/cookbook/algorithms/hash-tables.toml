[[sections]]
heading = "The disk-based version (BusTub P2, Fall 2023 / Spring 2024)"
body = """
<p>BusTub's extendible hash <em>index</em> spreads the structure over buffer-pool pages: a <strong>header page</strong> (routes the top bits of the hash to directory pages), <strong>directory pages</strong> (global depth, local depths, bucket page ids) and <strong>bucket pages</strong> (a sorted or unsorted array of (key, RID)). Each operation walks header → directory → bucket through page guards, crabbing write latches when it splits. Turning the in-memory reference into that three-level page format is an excellent exercise before the B+Tree: it has the same guard discipline with a much simpler structure.</p>

<aside data-call="performance"><b>What makes production hash tables fast</b><ul> <li><strong>Control bytes + SIMD</strong>: SwissTable (Abseil, and hashbrown behind Rust's <code>HashMap</code>) compares 16 control bytes in one SSE2/NEON instruction. Most probes touch a single cache line.</li> <li><strong>Store the hash</strong> (or part of it) to skip expensive key comparisons, especially for strings.</li> <li><strong>Choose the hash per workload</strong>: SipHash (<code>std</code>'s default) resists hash flooding and costs about 20 ns; FxHash or ahash costs about 1–2 ns. Join tables inside a DBMS don't face adversarial keys: use a fast hash.</li> <li><strong>Partition for cache fit</strong>: radix-partition both join inputs so each partition's table fits in L2 (Part II, parallel hash join).</li> <li><strong>Prefetch</strong>: when probing a batch of keys, compute all hashes first and issue prefetches, then probe. This hides DRAM latency (Part II).</li> </ul></aside>
"""

