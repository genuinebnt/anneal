[[sections]]
heading = "Where you would use it"
body = """
any "find / count / compare substrings" job beyond str::find, and as building blocks for text indexes.
"""

[[sections]]
heading = "Design notes"
body = """
Two families. Single-pattern scanners (KMP, Z, Rabin-Karp) preprocess the **pattern** and scan the text once in O(n + m). Indexes (suffix array + LCP) preprocess the **text** once so that many later queries are cheap.

- KMP prefix function pi[i] = length of the longest proper border of pat[..=i]; on a mismatch we fall back along borders instead of re-reading text, which is why `aaaa...ab` cannot make it quadratic.
- Z-algorithm z[i] = longest common prefix of s and s[i..]; matches of P in T are the z-values >= &#124;P&#124; in P#T.
- Rabin-Karp compares a rolling hash of each window; equal hashes are only **candidates**, so every hit is verified byte by byte. We use modulus 2&#94;61-1 (fast mulmod through u128) and also a tiny modulus to show verification working.
- Suffix array sorts all suffixes by prefix doubling: rank by the first 2&#94;k bytes, then by pairs (rank[i], rank[i+2&#94;k]). O(n log&#94;2 n) with a comparison sort. Kasai computes LCP of neighbouring suffixes in O(n) by noticing that lcp can drop by at most 1 when moving from suffix i to suffix i+1.
- With SA + LCP: longest repeated substring = max LCP; distinct substrings = n(n+1)/2 - sum(LCP); substring search = binary search over sorted suffixes, O(m log n).
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>text search and grep-like tools (Z/KMP style scanners, SIMD two-way variants inside std/memchr)</li><li>genome indexing (suffix arrays / FM-indexes locate reads in a reference)</li><li>plagiarism and duplicate detection (shared long substrings = large LCP between documents)</li><li>compression (the Burrows-Wheeler transform used by bzip2 is built from the suffix array)</li><li>log deduplication via rolling hashes (content-defined chunking uses the same idea)</li></ul>
"""

