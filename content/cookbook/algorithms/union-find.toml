[[sections]]
heading = "Design notes"
body = """
Each group is a tree stored in a vector of parent numbers; `find` walks to the root, which stands for the group. **Union by size** hangs the smaller tree under the larger root, so no path is longer than log2(n). Path halving makes every other item on a walked path skip one step, so later walks are shorter.

It can join groups but cannot split them, and it does not remember why two items are together. The checks compare it with a slow version that relabels items, on seeded random pairs, and measure tree depth.
"""

