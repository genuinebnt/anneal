<ul class="cb-g-uses"><li>connected components of <strong>undirected</strong> relations</li><li>Kruskal's MST</li><li>grouping duplicates</li><li>incremental connectivity</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>network connectivity</li><li>Kruskal MST</li><li>image segmentation</li><li>deduplicating equivalent records</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Each set is a tree; `find` returns the root. Two optimisations make it effectively O(1) amortised (inverse Ackermann): **path compression** (flatten trees while finding) and **union by size** (attach the small tree under the big).

**Note.** This answers connectivity for **undirected** edges and can only **add** edges; it cannot detect directed cycles.
"""

