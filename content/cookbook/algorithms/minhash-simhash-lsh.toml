[[sections]]
heading = "Design notes"
body = """
MINHASH: turn a document into a set of k-word shingles. Under a random ordering of all shingles, the smallest shingle of A and B together is equally likely to be any of them. Both sets have the same smallest one only when it is shared, so the chance of agreement is the Jaccard similarity J.

A seeded 64-bit mixer only imitates a random ordering, so this file measures how close it comes. With n independent slots the share of equal slots estimates J with a standard error of sqrt(J(1-J)/n).

BANDING (LSH): cut the signature into b bands of r rows. Two documents are candidates if any band is wholly equal. For similarity s the chance is 1 - (1 - s&#94;r)&#94;b.

Candidates still have to be checked with the exact similarity.

SIMHASH: one 64-bit fingerprint per document. Each token adds +1 or -1 to each of 64 sums, and the signs are the fingerprint. Similar token counts give fingerprints that differ in few bits.

A sum of zero counts as a 0 bit, which pulls short documents with an even number of tokens towards each other. A few very frequent words can decide every bit, so that unrelated documents look alike.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>web crawlers dropping near-duplicate pages</li><li>news clustering</li><li>spam and plagiarism detection</li><li>removing repeats from training data</li><li>proposing candidate pairs for record matching</li></ul>
"""

