[[sections]]
heading = "Design notes"
body = """
Problem: fewest coins summing to `amount`.  min_coins(a) = 1 + min over coins c &lt;= a of min_coins(a - c).

Overlapping subproblems (the same a-c recur) + optimal substructure = dynamic programming. top-down: natural recursion, cache results in a map (`HashMap` or `Vec<Option<_>>`); recursion depth = amount! bottom-up: fill a Vec from 0 upwards; no recursion, usually faster, easy to reason about.

Greedy (always take the biggest coin) works for some coin systems but fails for others, so you need the DP.
"""

