[[sections]]
heading = "What it is"
body = """
insertion, merge (stable), introsort-lite (quicksort + heapsort fallback + 3-way partition), LSD radix, counting sort, quickselect; then lower/upper bound, first-true search, galloping, interpolation, ternary search and binary search on the answer. Every function is checked against `sort`/`binary_search` or a brute-force oracle on seeded random inputs.

**Why** each exists: insertion sort is the fastest for tiny or nearly sorted slices (and is the base case of the others); merge sort is stable and O(n log n) always; quicksort is fast on average but can degrade to O(n&#94;2) on bad pivots, so introsort counts depth and switches to heapsort (O(n log n) worst case);

A three-way partition makes many-duplicate inputs linear; radix/counting sorts skip comparisons entirely (O(n &#42; key bytes)) when keys are small integers;

Quickselect finds the k-th smallest in expected O(n) without fully sorting (worst case O(n&#94;2); median-of-medians makes it worst-case O(n) but with a large constant, so it is rarely used in practice).

**Why** std's sort is a hybrid (as documented by the Rust team, details may change between releases): since Rust 1.81 `slice::sort` is driftsort and `sort_unstable` is ipnsort.

Both combine several ideas from the list above: they detect already-sorted/reversed runs, use small-sort networks/insertion for short pieces, and keep a worst-case guarantee, because no single algorithm wins on every input shape. See the table printed below for how shape changes the winner.

Binary search recipe: pick a predicate that is false...false true...true over a range, then find the first true. Bounds are half-open [lo, hi) and `mid = lo + (hi - lo) / 2` never overflows.
"""

