[[sections]]
heading = "Design notes"
body = """
d[i][j] = minimum edits to turn the first i chars of A into the first j chars of B

```text
d[i][j] = min( d[i-1][j] + 1            // delete a char of A
             , d[i][j-1] + 1            // insert a char
             , d[i-1][j-1] + (A[i]!=B[j]) )   // substitute (free if equal)
```

Only the previous row is needed, so memory is O(len B). Work on `chars`, not bytes, for correct Unicode. Real use: cargo/clap suggestions use Jaro-Winkler/Levenshtein-style similarity; see <https://github.com/rapidfuzz/strsim-rs>
"""

