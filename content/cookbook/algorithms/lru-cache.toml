[[sections]]
heading = "Where you would use it"
body = """
caches (lookups, compiled plans, parsed files), and the "index graph" pattern for linked structures.
"""

[[sections]]
heading = "Common uses"
body = """
caches of every kind (LRU in browsers, DBs, CDNs); the index-linked-list pattern for any ordered structure.
"""

[[sections]]
heading = "Design notes"
body = """
Operations must be O(1): the HashMap finds a node by key; the linked list orders nodes by recency; touching a node unlinks it and relinks it at the head; evicting removes the tail. A linked list with pointers fights Rust ownership, so the nodes live in a `Vec` and "pointers" are `usize` indices (index_graph, arena_ids). Generic over K, V with trait bounds.

Verified by a **model test**: run random operations against both this cache and a trivially-correct slow model; they must agree. Real code: <https://github.com/jeromefroe/lru-rs> (uses unsafe pointers) and <https://github.com/moka-rs/moka> (concurrent).
"""

