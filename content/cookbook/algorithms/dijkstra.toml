[[sections]]
heading = "Design notes"
body = """
Maintain `dist[]`; repeatedly take the closest unfinalised node from a min-heap and relax its edges. "Lazy deletion": instead of decreasing a key in the heap, push a **new** (smaller) entry and ignore stale ones when popped. O((V+E) log V).

**Requires** non-negative weights (use Bellman-Ford for negatives). BFS (index_graph) is Dijkstra with all weights 1.
"""

