[[sections]]
heading = "What it is"
body = """
one idea (repeatedly take the smallest head among k sorted sources) and its many costumes.

Part 1 compares a binary-heap merge with a loser (tournament) tree by **counting** key comparisons: the heap needs about 2 log k per output (compare the two children, then the better child with the parent), the loser tree needs about log k because each node remembers who **lost** the match, so after a source advances it replays only its own leaf-to-root path.

Part 2 is a lazy `Iterator` adapter generic over `Ord`, stable on ties by source index (the tie-break is part of the heap key). Part 3 applies it: external-sort passes with block buffers and IO counts, LSM compaction with newest-wins dedupe and tombstones, k sorted linked lists.

Part 4 is the interview classics that are all "k-way merge in disguise": smallest range covering one element of each list, k-th smallest in a sorted matrix, k smallest pair sums, k-th ugly number, top-k from a stream, median of k sorted arrays.

Part 5 is two-way merge variants: galloping (Timsort), branchless, and merge path (split the output by anti-diagonals so p threads merge independent slices). **Why** the stable tie-break matters: LSM compaction must prefer the newest run, a database sort-merge join must keep input order, and parallel merge must give the same bytes as the sequential one.

Every piece is checked against a "concatenate and sort" oracle on 2000 seeded random inputs including empty lists, many duplicates and all-equal keys. Comparison counts are asserted (loser tree total &lt;= heap total); timings are not.
"""

