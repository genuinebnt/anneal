[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A multi-model query is a join of access paths, not a union of products.</strong> "The ten items most similar to this vector, in categories 2 or 4, under 700, mentioning <code>raft</code>, within three hops of this item" touches four indexes: a relational index, an inverted index, a graph, a vector index. Each can either <strong>produce the set</strong> of ids matching its predicate or <strong>answer a probe</strong> for one candidate id. The planner's job is to decide which predicates to materialize, which to probe, and how to rank.</li> <li><strong>The cheapest plan depends on selectivity, and selectivity differs by model.</strong> A rare term is best materialized and everything else probed on its few matches. A predicate that keeps 90% of items is best probed (materializing it costs more than the work it saves). A neighbourhood of a seed item is usually tiny. With no filter at all the best plan is an approximate nearest-neighbour search; with filters, approximate search must over-fetch and filter afterwards, and its recall depends on whether the filters correlate with vector locality.</li> <li><strong>Plans are sets of choices.</strong> For <em>p</em> predicates there are 2&#94;p exact plans: the subset computed as sets (intersected smallest-first) and the rest probed one by one on the survivors, followed by an exact distance ranking of what remains. Plus the approximate plan: ask the vector index for <em>m</em> neighbours, filter them, double <em>m</em> until <em>k</em> survive.</li> <li><strong>A cost model is statistics plus a unit.</strong> Each model contributes an estimate of how many items its predicate keeps (exact counts for categories, a sorted array for price, document frequencies from the text index combined under independence, average degree to the power of hops for the graph), a cost to produce the set, and a cost to probe. The unit is one touched row, posting or edge; a vector distance costs <code>dim/8</code> units.</li> <li><strong>The model must be tested against the work actually done.</strong> Execution counts rows, postings, edges and distance computations. The planner's quality is the ratio of the chosen plan's <em>actual</em> work to the best plan's actual work (its <em>regret</em>), measured over many queries. Without that measurement a cost model is an opinion.</li> <li><strong>Correctness comes first and is easy to state</strong>: every exact plan returns the same top-k as evaluating every predicate on every item, in the same order, ties by id.</li> </ul>
"""

[[sections]]
heading = "The query and the plans"
body = """
```sql
SELECT id FROM items
 WHERE category IN (…) AND price BETWEEN a AND b          -- relational
   AND text CONTAINS ALL (…)                              -- inverted index
   AND id IN NEIGHBOURS(seed, hops)                       -- graph
 ORDER BY distance(vec, q) LIMIT k                        -- vector
```

<ul> <li><strong><code>Plan::Sets { sets, probes }</code></strong>: build the id set of each predicate in <code>sets</code> (category: union of lists; price: a range of a sorted array; text: the required-term search; neighbours: breadth-first search limited to <em>hops</em>), intersect them smallest first, probe the survivors with the predicates in <code>probes</code>, rank them by exact distance.</li> <li><strong><code>Plan::Ann</code></strong>: IVF search for <code>m = max(4k, 16)</code> neighbours, probe all predicates on them, double <code>m</code> while fewer than <em>k</em> pass.</li> <li><strong>Costing</strong> (<code>est_cost</code>): sum of set costs, intersection cost, then for each probe the number of surviving candidates times the probe cost, shrinking by the predicate's selectivity; plus <code>candidates × dim/8</code> for ranking. For <code>Ann</code>: the cost of the index probe, the neighbour set if any, and <code>m</code> probes, with <code>m</code> estimated as <code>k / (combined selectivity)</code>.</li> <li><strong><code>choose</code></strong> returns the plan of minimum estimated cost among the exact plans, and optionally the approximate one.</li> </ul>

:::deeper Reference: the multi-model query, set and probe execution of each predicate, exact and approximate ranking, statistics, cost model, the oracle
```rust title="src/multimodel/plan.rs"
//! A planner for queries that mix models: relational filters (category, price range), full-text conditions, graph reachability from a seed
//! item, and nearest-neighbour ranking by vector distance. Every predicate can be answered two ways (produce the set of matching ids from
//! its index, or probe one candidate), and the vector step can rank an exact candidate set or ask an ANN index and filter afterwards. The
//! planner estimates the cost of each strategy from statistics and picks the cheapest; execution counts the work it really did.
use crate::fts::{Index, Mode, Query as TextQuery};
use crate::graph::{bfs, Bfs, Csr, UNREACHED};
use crate::vecidx::{l2, Cand, Data, Ivf};

#[derive(Clone, Debug)]
pub struct Q {
    pub cats: Option<Vec<u16>>,
    pub price: Option<(u16, u16)>,
    pub text: Option<Vec<String>>,
    /// Items within `hops` edges of the seed item.
    pub near: Option<(u32, u32)>,
    pub vec: Vec<f32>,
    pub k: usize,
}

#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash, PartialOrd, Ord)]
pub enum P {
    Cat,
    Price,
    Text,
    Near,
}

pub struct World {
    pub n: usize,
    pub category: Vec<u16>,
    pub price: Vec<u16>,
    pub terms: Vec<Vec<String>>,
    pub by_cat: Vec<Vec<u32>>,
    pub by_price: Vec<(u16, u32)>,
    pub text: Index,
    pub graph: Csr,
    pub rev: Csr,
    pub vecs: Data,
    pub ivf: Ivf,
    pub nprobe: usize,
    /// Number of categories; the first statistics are exact counts.
    pub ncat: usize,
}

#[derive(Default, Clone, Debug)]
pub struct Work {
    /// Rows, postings and edges touched.
    pub rows: u64,
    /// Vector distance computations.
    pub dists: u64,
}
impl Work {
    pub fn cost(&self, dim: usize) -> f64 {
        self.rows as f64 + self.dists as f64 * (dim as f64 / 8.0)
    }
}

#[derive(Clone, Debug, PartialEq)]
pub enum Plan {
    /// Compute the id set of every listed predicate, intersect, probe the rest on the survivors, rank exactly.
    Sets { sets: Vec<P>, probes: Vec<P> },
    /// Ask the ANN index for `m` neighbours (doubling while too few pass), then check every predicate on them.
    Ann,
}

impl World {
    fn has_pred(q: &Q, p: P) -> bool {
        match p { P::Cat => q.cats.is_some(), P::Price => q.price.is_some(), P::Text => q.text.is_some(), P::Near => q.near.is_some() }
    }
    pub fn preds(q: &Q) -> Vec<P> {
        [P::Cat, P::Price, P::Text, P::Near].into_iter().filter(|p| Self::has_pred(q, *p)).collect()
    }

    // ---- executing a predicate as a set or as a probe ----------------------------------------------------------------------------------

    fn set_of(&self, q: &Q, p: P, w: &mut Work) -> Vec<u32> {
        match p {
            P::Cat => {
                let mut ids: Vec<u32> = q.cats.as_ref().unwrap().iter().flat_map(|c| self.by_cat[*c as usize].iter().copied()).collect();
                w.rows += ids.len() as u64;
                ids.sort_unstable();
                ids.dedup();                      // a category listed twice must not duplicate its items
                ids
            }
            P::Price => {
                let (lo, hi) = q.price.unwrap();
                let a = self.by_price.partition_point(|x| x.0 < lo);
                let b = self.by_price.partition_point(|x| x.0 <= hi);
                let mut ids: Vec<u32> = self.by_price[a..b].iter().map(|x| x.1).collect();
                w.rows += ids.len() as u64;
                ids.sort_unstable();
                ids
            }
            P::Text => {
                let (hits, st) = self.text.search(&TextQuery { must: q.text.clone().unwrap(), ..Default::default() }, self.n, Mode::Exhaustive);
                // the search reads every posting list of the required terms and scores the documents that contain all of them
                let listed: usize = q.text.as_ref().unwrap().iter().map(|t| self.text.segments.iter().map(|sg| sg.postings.get(t).map_or(0, |ps| ps.len())).sum::<usize>()).sum();
                w.rows += listed as u64 + st.docs_scored;
                let mut ids: Vec<u32> = hits.into_iter().map(|h| h.0 as u32).collect();
                ids.sort_unstable();
                ids
            }
            P::Near => {
                let (seed, hops) = q.near.unwrap();
                // breadth-first search limited to `hops` levels
                let mut dist = vec![UNREACHED; self.n];
                dist[seed as usize] = 0;
                let mut frontier = vec![seed];
                let mut out = vec![];
                for level in 1..=hops {
                    let mut next = vec![];
                    for &u in &frontier {
                        for &v in self.graph.adj(u) {
                            w.rows += 1;
                            if dist[v as usize] == UNREACHED {
                                dist[v as usize] = level;
                                next.push(v);
                                out.push(v);
                            }
                        }
                    }
                    frontier = next;
                }
                out.sort_unstable();
                out
            }
        }
    }
    fn probe(&self, q: &Q, p: P, id: u32, near: Option<&Vec<u32>>, w: &mut Work) -> bool {
        w.rows += 1;
        match p {
            P::Cat => q.cats.as_ref().unwrap().contains(&self.category[id as usize]),
            P::Price => { let (lo, hi) = q.price.unwrap(); (lo..=hi).contains(&self.price[id as usize]) }
            P::Text => { w.rows += 2; let t = &self.terms[id as usize]; q.text.as_ref().unwrap().iter().all(|x| t.binary_search(x).is_ok()) }
            P::Near => near.expect("the neighbour set is computed before probing").binary_search(&id).is_ok(),
        }
    }

    // ---- executing a plan ---------------------------------------------------------------------------------------------------------------

    /// Returns the top `k` item ids by distance (ties by id) and the work done.
    pub fn execute(&self, q: &Q, plan: &Plan) -> (Vec<u32>, Work) {
        let mut w = Work::default();
        let dist = |id: u32, w: &mut Work| { w.dists += 1; l2(&q.vec, self.vecs.row(id)) };
        let rank = |cands: Vec<u32>, w: &mut Work| -> Vec<u32> {
            let mut v: Vec<Cand> = cands.into_iter().map(|id| Cand(dist(id, w), id)).collect();
            v.sort();
            v.truncate(q.k);
            v.into_iter().map(|c| c.1).collect()
        };
        match plan {
            Plan::Sets { sets, probes } => {
                let mut near_set: Option<Vec<u32>> = None;
                let mut cur: Option<Vec<u32>> = None;
                let mut computed: Vec<(P, Vec<u32>)> = sets.iter().map(|&p| (p, self.set_of(q, p, &mut w))).collect();
                computed.sort_by_key(|(_, s)| s.len());
                for (p, s) in computed {
                    if p == P::Near { near_set = Some(s.clone()); }
                    cur = Some(match cur {
                        None => s,
                        Some(c) => { w.rows += (c.len() + s.len()) as u64; let mut o = vec![]; crate::graph::intersect(&c, &s, &mut o); o }
                    });
                }
                if probes.contains(&P::Near) && near_set.is_none() { near_set = Some(self.set_of(q, P::Near, &mut w)); }
                let cands: Vec<u32> = match cur { Some(c) => c, None => (0..self.n as u32).collect() };
                let mut keep = vec![];
                for id in cands {
                    if probes.iter().all(|&p| self.probe(q, p, id, near_set.as_ref(), &mut w)) { keep.push(id); }
                }
                (rank(keep, &mut w), w)
            }
            Plan::Ann => {
                let near_set = q.near.map(|_| self.set_of(q, P::Near, &mut w));
                let preds = Self::preds(q);
                let mut m = (q.k * 4).max(16);
                loop {
                    let (cands, scanned) = self.ivf.search(&q.vec, m.min(self.n), self.nprobe);
                    w.dists += scanned as u64;
                    let mut ok: Vec<Cand> = vec![];
                    for c in &cands {
                        if preds.iter().all(|&p| self.probe(q, p, c.1, near_set.as_ref(), &mut w)) { ok.push(*c); }
                    }
                    if ok.len() >= q.k || m >= self.n || cands.len() < m {
                        ok.sort();
                        ok.truncate(q.k);
                        return (ok.into_iter().map(|c| c.1).collect(), w);
                    }
                    m *= 2;
                }
            }
        }
    }

    // ---- statistics and the cost model --------------------------------------------------------------------------------------------------

    /// Estimated number of items matching one predicate.
    pub fn est_size(&self, q: &Q, p: P) -> f64 {
        let n = self.n as f64;
        match p {
            P::Cat => q.cats.as_ref().unwrap().iter().map(|c| self.by_cat[*c as usize].len() as f64).sum(),
            P::Price => { let (lo, hi) = q.price.unwrap(); let a = self.by_price.partition_point(|x| x.0 < lo); let b = self.by_price.partition_point(|x| x.0 <= hi); (b - a) as f64 }
            P::Text => {
                // document frequencies from the index, combined under independence
                let mut sel = 1.0;
                for t in q.text.as_ref().unwrap() {
                    let df: usize = self.text.segments.iter().map(|s| s.postings.get(t).map_or(0, |ps| ps.len())).sum();
                    sel *= df as f64 / n;
                }
                sel * n
            }
            P::Near => { let (_, hops) = q.near.unwrap(); let d = self.graph.edges() as f64 / n; (d.powi(hops as i32)).min(n) }
        }
    }
    fn est_set_cost(&self, q: &Q, p: P) -> f64 {
        match p {
            P::Text => q.text.as_ref().unwrap().iter().map(|t| self.text.segments.iter().map(|s| s.postings.get(t).map_or(0, |ps| ps.len())).sum::<usize>() as f64).sum::<f64>() + self.est_size(q, P::Text),
            P::Near => self.est_size(q, P::Near),
            _ => self.est_size(q, p),
        }
    }
    fn est_probe_cost(&self, _q: &Q, p: P) -> f64 {
        match p {
            P::Text => 3.0,
            _ => 1.0,
        }
    }

    /// Estimated cost of a plan in the same units as `Work::cost`.
    pub fn est_cost(&self, q: &Q, plan: &Plan) -> f64 {
        let n = self.n as f64;
        let dim = self.vecs.dim as f64;
        let sel = |p: P| (self.est_size(q, p) / n).min(1.0);
        match plan {
            Plan::Sets { sets, probes } => {
                let mut cost: f64 = sets.iter().map(|&p| self.est_set_cost(q, p)).sum();
                let mut sizes: Vec<f64> = sets.iter().map(|&p| self.est_size(q, p)).collect();
                sizes.sort_by(|a, b| a.total_cmp(b));
                cost += sizes.iter().sum::<f64>();                                  // intersecting
                let mut cands = if sets.is_empty() { n } else { n * sets.iter().map(|&p| sel(p)).product::<f64>() };
                if probes.contains(&P::Near) && !sets.contains(&P::Near) { cost += self.est_set_cost(q, P::Near); }
                for &p in probes {
                    cost += cands * self.est_probe_cost(q, p);
                    cands *= sel(p);
                }
                cost + cands * dim / 8.0
            }
            Plan::Ann => {
                let total_sel = Self::preds(q).iter().map(|&p| sel(p)).product::<f64>().max(1.0 / n);
                let m = ((q.k as f64 / total_sel) * 1.2).clamp(16.0, n);
                let per = self.ivf.search(&q.vec, 1, self.nprobe).1 as f64 * dim / 8.0;
                let near = if q.near.is_some() { self.est_set_cost(q, P::Near) } else { 0.0 };
                per + near + m * Self::preds(q).iter().map(|&p| self.est_probe_cost(q, p)).sum::<f64>()
            }
        }
    }

    /// All exact plans: every nonempty subset of predicates computed as sets (the rest probed), plus an exact scan with probes.
    pub fn exact_plans(&self, q: &Q) -> Vec<Plan> {
        let preds = Self::preds(q);
        let mut out = vec![];
        for mask in 0..(1u32 << preds.len()) {
            let sets: Vec<P> = preds.iter().enumerate().filter(|(i, _)| mask >> i & 1 == 1).map(|(_, p)| *p).collect();
            let probes: Vec<P> = preds.iter().enumerate().filter(|(i, _)| mask >> i & 1 == 0).map(|(_, p)| *p).collect();
            out.push(Plan::Sets { sets, probes });
        }
        out
    }
    pub fn choose(&self, q: &Q, allow_ann: bool) -> Plan {
        let mut plans = self.exact_plans(q);
        if allow_ann { plans.push(Plan::Ann); }
        plans.into_iter().min_by(|a, b| self.est_cost(q, a).total_cmp(&self.est_cost(q, b))).unwrap()
    }

    /// The reference: evaluate every predicate on every item, rank exactly.
    pub fn oracle(&self, q: &Q) -> Vec<u32> {
        let near: Option<Vec<u32>> = q.near.map(|(seed, hops)| {
            let (d, _) = bfs(&self.graph, &self.rev, seed, Bfs::TopDown);
            (0..self.n as u32).filter(|&v| v != seed && d[v as usize] != UNREACHED && d[v as usize] <= hops).collect()
        });
        let mut v: Vec<Cand> = (0..self.n as u32)
            .filter(|&id| {
                q.cats.as_ref().is_none_or(|c| c.contains(&self.category[id as usize]))
                    && q.price.is_none_or(|(lo, hi)| (lo..=hi).contains(&self.price[id as usize]))
                    && q.text.as_ref().is_none_or(|t| t.iter().all(|x| self.terms[id as usize].contains(x)))
                    && near.as_ref().is_none_or(|s| s.binary_search(&id).is_ok())
            })
            .map(|id| Cand(l2(&q.vec, self.vecs.row(id)), id))
            .collect();
        v.sort();
        v.truncate(q.k);
        v.into_iter().map(|c| c.1).collect()
    }
}
