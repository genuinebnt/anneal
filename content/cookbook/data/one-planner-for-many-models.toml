heading = "Measured"
body = """
<p>100 000 items. Category (40 values, Zipf), price 0 to 999, eight terms each from a 300-term Zipf vocabulary, a 16-dimensional vector (20 overlapping clusters), six random out-edges per item. Costs below are in the work units defined above (rows, postings and edges touched plus <code>dim/8</code> per distance).</p>

```text title="the planner's choice on seven query shapes, with the best plan's cost and the approximate plan's recall"
100000 items: category (40, Zipf), price (0-999), 8 terms of a 300-term Zipf vocabulary, a 16-d vector (20 clusters), 6 random out-edges; built in 1.8 s
workload                                         chosen plan                    est cost     actual      best   regret
vector only                                      sets [] probe []                 200000     200000    200000     1.0x   (2.0 ms; scan with probes 200000)
                                                 ann (approximate)                  5118       5118                      (recall 0.60, 0.0 ms)
rare text terms + wide price range               sets [t] probe [p]                 1094       1092      1092     1.0x   (0.1 ms; scan with probes 369949)
                                                 ann (approximate)                405118      54627                      (recall 0.00, 0.9 ms)
narrow price range + one category                sets [p] probe [c]                 6656       4566      4566     1.0x   (0.0 ms; scan with probes 106409)
                                                 ann (approximate)                 23551      41242                      (recall 0.40, 0.4 ms)
neighbours of a seed (2 hops) + wide price       sets [n] probe [p]                  166        156       156     1.0x   (0.0 ms; scan with probes 180080)
                                                 ann (approximate)                 88527      45030                      (recall 0.10, 0.4 ms)
two broad filters (price 0-900, categories 0-2)  sets [c] probe [p]               179717     142160    142160     1.0x   (1.0 ms; scan with probes 204716)
                                                 ann (approximate)                  5189       5171                      (recall 0.80, 0.0 ms)
frequent text term + category                    sets [c] probe [t]                46557      38716     38716     1.0x   (0.4 ms; scan with probes 130811)
                                                 ann (approximate)                  6483      27112                      (recall 0.50, 0.2 ms)
text + category + price + neighbours             sets [n] probe [c, p, t]            718        603       603     1.0x   (0.0 ms; scan with probes 132290)
                                                 ann (approximate)                605334      42922                      (recall 1.00, 0.5 ms)
```

<ul> <li><strong>The estimates track the work</strong>: on six of seven shapes the estimate is within 30% of the actual cost (1 094 against 1 092; 166 against 156; 718 against 603), and in all seven the chosen exact plan <em>was</em> the cheapest of its 2&#94;p alternatives. Over 300 random queries on a smaller world the median regret is <strong>1.00×</strong>, the 90th percentile 1.00× and the worst <strong>1.4×</strong>.</li> <li><strong>Plans differ by orders of magnitude</strong>: for the rare text terms the best plan costs 1 092 units and the exact scan 369 949 (340×); for the seed's neighbourhood 156 against 180 080 (1 150×). The planner finds them without a search of results, from statistics alone.</li> <li><strong>Approximate ranking helps when filters are weak and hurts when they are strong</strong>: with no filter, or two broad filters, the ANN plan costs 5 118 and 5 171 units against 200 000 and 142 160 for the exact plans, at recall 0.60 and 0.80; with a rare term it fails (recall 0.0) because the matching items are not near the query vector, and the over-fetch loop ends up scanning for 54 627 units. A planner can choose ANN only when it is allowed to lose recall; the estimate of its cost is right on the broad cases and wrong by 7× on the rare one, which is the signal that filtered ANN needs the correlation between filter and vector locality in its statistics.</li> <li><strong>The exact scan with probes is never the winner here</strong> except for the vector-only query, where it is the only exact option (200 000 units: a distance per item).</li> </ul>

<aside data-call="note"><b>The 196× regret that was a counting bug</b><p>The first run reported a worst-case regret of 196×, and the diagnostic showed plans whose <em>actual</em> cost was 0 or 5 where the estimate said 700. The text search charges only the documents it scores, so a conjunction with one rare term scored almost nothing and looked free, although the engine had read every posting list of the required terms. The executor now charges the lists it reads, the estimate charges the same, and the worst regret fell to 1.4×. The planner had been right and the accounting wrong: when a cost model and its measurements disagree, check what the measurement counts. A second bug was found by the oracle comparison: a query that named a category twice (<code>IN (2, 13, 0, 0)</code>) produced duplicate ids in the set, and the top-k contained the same item twice. Sets must be deduplicated after a union.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Predicates as an enum <code>P</code> and plans as data</strong>: <code>Plan::Sets { sets: Vec&lt;P&gt;, probes: Vec&lt;P&gt; }</code> is a value the planner builds, costs and the executor interprets. The 2&#94;p enumeration is a loop over bit masks, with the predicates present in the query as the universe.</li> <li><strong><code>Work</code> counters threaded through execution</strong> (<code>&amp;mut Work</code>) rather than global state: the same function that executes also measures, so the measurement cannot drift from what ran.</li> <li><strong>Closures for shared steps</strong>: <code>rank</code> and <code>dist</code> are local closures capturing the query, used by both plan variants.</li> <li><strong>Reuse of earlier sections</strong>: <code>Index::search</code> (full-text, <a href="/cookbook/p/full-text-search">M16</a>) for the text set, <code>Csr</code> and the intersection routine (<a href="/cookbook/p/the-graph-store">M13</a>) for graph sets and set intersection, <code>Ivf::search</code> (<a href="/cookbook/p/vector-databases">S2</a>) for ANN. The planner is a few hundred lines because the models expose set production and probing, not because it reimplements them.</li> <li><strong><code>Option&lt;T&gt;</code> fields for optional predicates</strong> make "the query has a price filter" a pattern match, and <code>World::preds(q)</code> the list of predicates present.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Oracle equivalence (300 random queries, 4 000 items)</strong>: each query includes each predicate with probability one half (1 to 4 categories, a price range, 1 or 2 text terms, a 1 to 3 hop neighbourhood); for every one of the 2&#94;p exact plans the returned ids equal the oracle's (evaluate every predicate on every item, rank exactly, ties by id); 60 of the queries have no answer and must return an empty list from every plan.</li> <li><strong>The approximate plan</strong> returns only items that satisfy every predicate (no false positives), and its recall against the exact answer is reported.</li> <li><strong>Plan choice</strong>: rare text terms with a wide price range choose the text set; a 95% price range is probed, not materialized; a narrow price range alone is answered from the price index; no filter and ANN allowed chooses ANN, exact-only chooses the scan; a one-hop neighbourhood is chosen as the driver.</li> <li><strong>Regret</strong>: median ≤ 1.5× and 90th percentile ≤ 4× of the best plan's actual work over the 300 queries.</li> <li><strong>Mutants run against these tests</strong>: a price range excluding its upper end; duplicate items from a repeated category; the neighbourhood stopping a hop short; the neighbour probe accepting everything; a text probe needing only one term; sets not intersected; a candidate passing if any probe passes; the ranking returning one result too many; the approximate plan skipping the predicates; the planner choosing the most expensive plan; price ranges estimated as the whole table; probing estimated as free. <strong>All 12 were killed</strong>; the price estimate survived until the narrow-price test was added.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Hybrid search engines</strong> (Elasticsearch/OpenSearch k-NN with filters, Vespa, Weaviate, Qdrant, Milvus, pgvector with <code>WHERE</code> clauses) choose between <strong>pre-filtering</strong> (apply the filter, then search the matching vectors exactly or in a filtered index), <strong>post-filtering</strong> (search, then filter, over-fetching) and in-graph filtering, using filter selectivity estimates; Qdrant, for example, switches strategy by the estimated cardinality of the payload filter.</li> <li><strong>PostgreSQL</strong> plans <code>ORDER BY embedding &lt;-&gt; q LIMIT k</code> with <code>WHERE</code> clauses as an index scan on the vector index with post-filtering or a different index on the filter, by cost; the cost of an ANN index scan is a known weak spot in the planner.</li> <li><strong>Multi-model databases</strong> (ArangoDB AQL, SurrealDB, Cosmos DB, Oracle converged DB, SQL Server graph + JSON + full-text) plan across models with per-model statistics and rewrite rules; the shared transaction layer gives all of them one snapshot (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>).</li> <li><strong>Cascades-style optimizers</strong> treat each access path as an implementation rule of a logical operator and cost the alternatives in one memo (<a href="/cookbook/p/a-cascades-memo-in-rust">Part III</a>); this section's enumeration is that search for a star-shaped query, where the number of plans is small enough to enumerate.</li> <li><strong>Learned cardinality estimators and adaptive execution</strong> (<a href="/cookbook/p/adaptive-and-robust">Part III</a>) address the independence assumption this planner makes between text terms and between predicates; for filters correlated with vector locality, per-cluster statistics are the usual fix.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Independence is the common error.</strong> Text terms and categories correlate in real data; a combined estimate that multiplies selectivities will be off by large factors. Collect correlated statistics (multi-column histograms, samples) for the predicate pairs that matter.</li> <li><strong>Approximate plans change semantics</strong>: the same query returns different answers under different plans. Make approximate search an explicit choice, report recall, and never silently switch.</li> <li><strong>Cost units that mix models are fragile</strong>: a graph edge, a posting and a distance are different costs on different hardware; calibrate by measurement (<a href="/cookbook/p/cost-models">Part III</a>) rather than by guess.</li> <li><strong>Probing can be expensive when it is not a point lookup</strong>: here a graph probe needs the whole neighbour set; a text probe needs a forward index. Check that each model offers the probe you cost.</li> <li><strong>Ties and ordering must be specified</strong> (here: distance, then id), or plans will return different but equally valid answers and tests will flake.</li> <li><strong>Hot paths of one model dominate</strong>: a wide text conjunction can cost more than the rest of the query together; per-model limits and timeouts protect the system.</li> <li><strong>Plan caches</strong> keyed by the query shape must include the selectivity regime, or a plan chosen for a rare term will be reused for a frequent one.</li> </ul></aside>
"""
