[[sections]]
heading = "Design decisions"
body = """
<ol> <li><strong>Where does <code>size</code> mean children vs keys?</strong> BusTub counts <em>children</em> in internal pages (size = number of pointers) and <em>entries</em> in leaves. Mixing the two up is the most common off-by-one in P2. Write it in the page's doc comment.</li> <li><strong>In-place vs read-modify-write.</strong> The hot paths (search, insert without split) touch one slot in place with <code>copy_within</code>. The structural paths (split, borrow, merge) read the node into <code>Vec</code>s, rearrange, and write it back. That's 8 KiB of copying on a rare path, in exchange for code that is obviously right.</li> <li><strong>The <code>level</code> byte.</strong> Internal pages record their height above the leaves (1 means "my children are leaves"). An optimistic descent needs to know <em>before</em> latching the next page whether it's a leaf, so that it can take a write latch on the leaf and read latches everywhere else (<a href="/cookbook/p/b-tree-concurrency">P2.5</a>).</li> <li><strong>Fixed arrays, not <code>Vec</code>.</strong> Pages must be valid for any byte pattern and have no heap pointers, which is why BusTub forbids <code>std::vector</code> members in page classes. In Rust, the typed-view approach makes this automatic: there is no struct to put a <code>Vec</code> into.</li> </ol>

<aside data-call="rust"><b>Why not <code>#[repr(C)] struct LeafPage { keys: [u64; N], … }</code>?</b><p>It works if every field is plain old data (integers, arrays of integers), and the <code>zerocopy</code> crate can prove that at compile time (<code>FromBytes + IntoBytes + KnownLayout</code>). Two things make offset accessors attractive anyway. <strong>Endianness</strong>: an on-disk format should be fixed-endian, and <code>u64</code> fields are native-endian. <strong>Runtime <code>max_size</code></strong>: tests want small nodes (max 3–5) while the physical capacity stays 509. With views, <code>leaf_max</code> is just a number in the tree, not a type parameter. If you choose the struct route, use <code>zerocopy::little_endian::U64</code> fields to get both properties.</p></aside>
"""

[[sections]]
heading = "Visualizing a tree"
body = """
<p>A tree you can't see is a tree you can't debug. BusTub ships <code>b_plus_tree_printer</code> and a <code>Draw()</code> that emits Graphviz DOT. The Rust equivalent is about 25 lines: walk from the root, emit one record-shaped node per page, and emit edges parent → child plus dashed sibling edges.</p>

```rust title="debug: Graphviz output (render with dot -Tsvg tree.dot > tree.svg)"
pub fn to_dot(&self) -> Res<String> {
    use std::fmt::Write;
    let mut out = String::from("digraph btree {\\n  node [shape=record, fontname=monospace];\\n");
    let root = root_of(self.bpm.read_page(self.header)?.data());
    let mut stack = if root.is_valid() { vec![root] } else { vec![] };
    while let Some(pid) = stack.pop() {
        let b = *self.bpm.read_page(pid)?.data();
        if is_leaf(&b) {
            let t = tombs(&b);
            let keys: Vec<String> = (0..size(&b)).map(|i| if t.contains(&i) { format!("~{}", lkey(&b, i)) } else { lkey(&b, i).to_string() }).collect();
            writeln!(out, "  p{} [label="{}"];", pid.0, keys.join("|")).unwrap();
            if next_leaf(&b).is_valid() { writeln!(out, "  p{} -> p{} [style=dashed, constraint=false];", pid.0, next_leaf(&b).0).unwrap(); }
        } else {
            let keys: Vec<String> = (1..size(&b)).map(|i| ikey(&b, i).to_string()).collect();
            writeln!(out, "  p{} [label="·|{}"];", pid.0, keys.join("|·|")).unwrap();
            for i in 0..size(&b) { writeln!(out, "  p{} -> p{};", pid.0, ichild(&b, i).0).unwrap(); stack.push(ichild(&b, i)); }
        }
    }
    out.push_str("}\\n");
    Ok(out)
}
```

Tombstoned keys print with a `~` prefix, so you can watch the deletion buffer fill and drain.



