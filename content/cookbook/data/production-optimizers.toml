```

<ul> <li><strong>The graph is exactly the memo</strong>: <code>2&#94;n − 1</code> classes (one per non-empty subset) and <code>3&#94;n − 2&#94;(n+1) + 1 + n</code> e-nodes (every ordered split of every subset, plus the scans), for every query shape: 54 nodes at 4 relations, 173 063 at 11. The tests check both formulas for n = 3…8.</li> <li><strong>Extraction is optimal</strong>: the cheapest tree equals the optimum over all bushy trees, cross products included, computed by an independent dynamic program, for 60 random graphs (and for every row above). A cross product beat every cross-product-free plan in 2 of 200 random 8-relation queries.</li> <li><strong>The rules are what make it work.</strong> With commutativity alone the graph saturates in two or three rounds and the extracted plan has exactly the cost of the starting tree; adding associativity reaches the optimum, and on random 5-relation queries it improves a random starting order in the large majority of cases (the test asserts more than half).</li> <li><strong>For join ordering alone it is the wrong tool.</strong> Saturation takes 1.4 s for 11 relations while DPccp finds the same optimum in 0.017 ms (chain) to 1.3 ms (clique), about 80 000 times faster on the chain and 1 000 times on the clique: the e-graph explores every ordered split of every subset, including cross products (<code>~3&#94;n</code>), where DPccp enumerates only the connected pairs (220 pairs for the 11-relation chain). Specialized enumeration beats a generic mechanism on the problem it was designed for.</li> <li><strong>Implementation matters as much as the idea.</strong> The first version of the rule loop merged classes as it went, so later insertions missed the not-yet-rebuilt hash-cons table and created duplicate classes for congruence to merge afterwards: saturating 11 relations took 53 s (chain) and 29 s (clique). Adding all right-hand sides first, merging second and rebuilding once cut it to 1.4 s, 21–38× faster, with identical graphs.</li> <li><strong>Why use equality saturation at all?</strong> Its strength is <em>rule interaction</em>: rewrites that enable each other in orders no one planned (algebraic simplification, predicate and aggregation rewrites, expression canonicalization) are found without a hand-designed phase ordering, and the cost model decides at the end. The price is the size of the graph, which is why practical uses bound the rules and the graph, or run it on the part of the plan where rewrites interact and use DP for join order.</li> <li><strong>Reading the random-order row.</strong> A random connected left-deep join order costs a median 9 838× the optimum under <code>C_out</code> (p90 1.8·10⁷) on these synthetic cardinalities (100 to 10⁶ rows per relation), which is the argument for doing the search at all.</li> </ul>
"""

[[sections]]
heading = "Choosing"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>situation</th> <th>choice</th> </tr> </thead> <tbody> <tr> <td>a young engine, mostly simple queries</td> <td>normalization rules + greedy or DP join order + a simple cost model; add statistics before a framework</td> </tr> <tr> <td>a mature OLTP engine with a rich index design</td> <td>bottom-up DP over paths with interesting orders (PostgreSQL style), a plan cache and a cost model tuned to the hardware</td> </tr> <tr> <td>a warehouse with many large joins and operator choices</td> <td>a Cascades-style memo, DPccp/DPhyp for join order inside it, runtime filters and adaptive execution (<a href="/cookbook/p/adaptive-and-robust">Q10</a>)</td> </tr> <tr> <td>an embedded or analytical engine with unusual operators</td> <td>a framework with rules as data (Calcite, optd, or your own), so a new operator is a rule and an implementation</td> </tr> <tr> <td>many interacting algebraic rewrites</td> <td>normalization to a fixpoint, optionally equality saturation on that part, then a conventional cost-based phase</td> </tr> <tr> <td>distributed execution</td> <td>the same plus properties for data placement and enforcers for exchanges, and a model for network bytes (<a href="/cookbook/p/distributed-databases-i">L23</a>, <a href="/cookbook/p/distributed-databases-ii">L24</a>)</td> </tr> </tbody> </table></div>

<aside data-call="note"><b>Cairn's planner</b><p>For the multi-model engine of Part V the structure to aim for is: a <strong>normalization</strong> stage (pushdown, unnesting, outer-join simplification, constant folding), <strong>DPccp/DPhyp</strong> for join order over the relational part, a <strong>memo with physical properties</strong> (sort order, partitioning, vector-index availability) for implementation choices, a <strong>calibrated cost model</strong> (<a href="/cookbook/p/cost-models">Q9</a>) with the cardinality estimators that fit the data models (<a href="/cookbook/p/statistics">Q7</a>, <a href="/cookbook/p/cardinality-estimation">Q8</a>), runtime filters and re-optimization at pipeline breakers (<a href="/cookbook/p/adaptive-and-robust">Q10</a>), a plan cache with invalidation, and an <code>EXPLAIN</code> that prints estimates beside actuals. Rules should be data, so a graph traversal, a vector search or a time-series window can be added as an operator with its own implementation and cost.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Ids, not references, for a graph</strong>: e-nodes hold <code>u32</code> class ids, never <code>&amp;</code> or <code>Rc</code>; the union-find is a <code>Vec&lt;Id&gt;</code>, the classes a <code>HashMap&lt;Id, Class&gt;</code>, the memo a <code>HashMap&lt;ENode, Id&gt;</code>. There is no lifetime problem and no cycle problem because nothing is owned by anything else; this is the idiomatic shape for any graph with merging (compare arenas in <a href="/cookbook/p/rust-for-systems-code">Part VI</a>).</li> <li><strong><code>#[derive(Hash, Eq)]</code> on a small <code>Copy</code> enum</strong> gives the hash-cons key for free. Keeping <code>ENode</code> at 12 bytes (<code>Join(u32, u32)</code> plus a tag) makes the memo cache-friendly; a general e-graph (<code>egg</code>) uses a generic <code>Language</code> trait with children slices instead.</li> <li><strong>Two-phase mutation to satisfy the borrow checker and the algorithm</strong>: collect <code>(class, new class)</code> pairs while only calling <code>add</code>, then union them all. It avoids invalidating iterators and, as measured, avoids creating duplicates. A snapshot (<code>clone</code> of the node lists) is the simple way to iterate while mutating; <code>egg</code> avoids the copy with an e-matching machine.</li> <li><strong><code>should_panic(expected = …)</code> for invariants</strong>: the relation-set assertion in <code>union</code> turns an unsound rule (a rewrite that changes what the expression computes) into an immediate, located failure, which is how the associativity mutant (<code>b ⋈ z</code> replaced by <code>a ⋈ z</code>) was caught.</li> <li><strong><code>check_invariants() -&gt; Result&lt;(), String&gt;</code></strong> as a debug method, called by tests after every phase, is cheaper than reasoning about whether <code>rebuild</code> is right.</li> <li><strong>Round and size limits as defaults, not options</strong>: a rewrite system that can loop must have a budget; <code>saturate</code> returns <code>(rounds, saturated)</code> so callers can tell fixpoint from cut-off.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Hash-consing</strong>: adding the same node or tree twice returns the same class; different nodes stay different until a rule merges them.</li> <li><strong>Congruence</strong>: after <code>union(x, y)</code> and <code>rebuild</code>, <code>Join(x, s)</code> and <code>Join(y, s)</code> are one class with one node; handles to either merged class are accepted by <code>add</code> and find the same class.</li> <li><strong>Soundness check</strong>: merging classes over different relation sets panics.</li> <li><strong>Closed forms</strong>: after saturation the graph has <code>2&#94;n − 1</code> classes and <code>3&#94;n − 2&#94;(n+1) + 1 + n</code> nodes for n = 3…8, invariants hold, and the root covers all relations.</li> <li><strong>Optimality</strong>: for 60 random graphs of every shape (3–7 relations) from a random starting order, the extracted cost equals an independent dynamic program over all subsets with cross products; the cost recomputed from the extracted tree matches; every relation occurs exactly once; the cost is at most DPccp's.</li> <li><strong>Rules</strong>: commutativity alone leaves the cost of the starting tree unchanged and saturates in at most three rounds; adding associativity never increases cost and improves most random starting orders; a node limit stops saturation and leaves valid invariants.</li> <li><strong>Mutants run against these tests</strong> (all killed): <code>rebuild</code> never merges congruent classes; <code>union</code> drops the merged class's nodes (the first test run <strong>hung</strong>, which showed <code>saturate</code> needed a round limit; with the limit it fails by assertion); extraction picks the most expensive node; <code>add</code> skips canonicalization (<strong>survived until a test used stale handles</strong>); associativity builds a wrong right-hand side (caught by the relation-set assertion); commutativity removed; the relation-set check removed (caught by the <code>should_panic</code> test that merges classes over different sets).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Plan caches and plan management</strong> are as much a part of the optimizer as the search: PostgreSQL caches generic versus custom plans for prepared statements and decides by comparing costs after a few executions; SQL Server's Query Store records plans and runtime statistics and can force a previous plan; Oracle's SQL plan management captures baselines and evolves them only when the new plan is verified better; Db2 offers optimization profiles that steer or pin plans.</li> <li><strong>Optimization time limits</strong>: SQL Server stops the search at a cost-based threshold or a timeout and returns the best plan so far (visible as "TimeOut" in the plan's reason for early termination); PostgreSQL falls back to GEQO beyond its threshold; Oracle caps join permutations; Calcite and Orca expose search budgets.</li> <li><strong>Observability</strong>: PostgreSQL <code>EXPLAIN (ANALYZE, BUFFERS)</code> with estimated and actual rows per node; MySQL's <code>optimizer_trace</code> prints every decision and rejected alternative; SQL Server's actual execution plans show estimates, actuals and warnings; Orca ships verification tools that compare the chosen plan with others (TAQO). Showing estimated against actual rows is the cheapest debugging tool an optimizer can offer.</li> <li><strong>Testing</strong>: differential testing of optimized against unoptimized execution (SQLancer's ternary-logic partitioning and NoREC approaches, <a href="/cookbook/p/testing-a-database">Part VI</a>), plan-regression suites over saved queries, and join-order benchmarks (JOB). Every optimizer bug is either a wrong result (unsound rule) or a wrong plan (cost or estimate); the first kind must be caught by differential tests.</li> <li><strong>Dynamic and adaptive layers</strong>: Spark AQE, SQL Server adaptive joins, Oracle adaptive plans, and runtime filters (<a href="/cookbook/p/adaptive-and-robust">Q10</a>) sit <em>after</em> the static optimizer and fix what it could not know.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Rule soundness is the whole contract.</strong> An unsound rewrite (an outer-join reordering that changes NULL semantics, a pushdown through a window, a decorrelation that loses the <code>COUNT</code> bug) returns wrong answers, silently. Test every rule with random data against the unrewritten plan (<a href="/cookbook/p/plan-transformations-and-rule-soundness">Q3</a>, <a href="/cookbook/p/unnesting-subqueries">Q6</a>).</li> <li><strong>Rules that undo each other loop.</strong> Normalization rules need a termination argument (a measure that strictly decreases) or an iteration cap; the e-graph's <code>MAX_ROUNDS</code> and node limit are the minimum.</li> <li><strong>Search-space size is a feature to be budgeted.</strong> Exhaustive search over all subsets grows as <code>3&#94;n</code>; measure optimization time per query shape, and put a ceiling on it.</li> <li><strong>Cross products are not always bad.</strong> A tiny dimension table crossed with another before a large join can win (2 of 200 random queries here); excluding cross products is a pruning heuristic, not a law.</li> <li><strong>Do not copy an architecture without its supporting parts.</strong> A Cascades memo without good properties, a cost model and statistics is a slow way to get a worse plan than PostgreSQL's DP; the search is perhaps 20% of an optimizer.</li> <li><strong>Extraction with sharing is hard.</strong> The cost of a plan with a common subexpression is not the sum of its children's costs; e-graph extraction by per-class minimum is exact only for additive, tree-shaped costs, and extraction under sharing is NP-hard in general.</li> <li><strong>Plan changes are user-visible events.</strong> A new statistic, a new index or a new version can change a plan; ship plan hints, pinning and plan comparison before shipping a smarter optimizer.</li> </ul></aside>
"""

