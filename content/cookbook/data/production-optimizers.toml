[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Three components, always</strong>: a <em>search space</em> (which plans can be reached), a <em>cost model</em> (<a href="/cookbook/p/cost-models">Q9</a>) with <em>cardinality estimates</em> (<a href="/cookbook/p/cardinality-estimation">Q8</a>), and an <em>enumeration architecture</em> that explores the space. Production optimizers differ most in the third, and the lecture's taxonomy is a good map: <strong>heuristics</strong> (static rules, no cost: early Ingres, early Oracle, MongoDB, most young systems), <strong>heuristics + cost-based search</strong> (a rewrite phase, then a bottom-up search: System R, early DB2, PostgreSQL, most open-source systems), <strong>stratified search</strong> (a generator with separate rewrite and cost-based phases: Starburst, and CockroachDB's normalization-then-exploration), and <strong>unified search</strong> (one search where logical and physical transformations interleave: Volcano, Cascades, OPT++, SQL Server, Orca, optd).</li> <li><strong>Optimizer generators separate the search from the rules.</strong> The search algorithm is a framework; the transformation rules are data, often written in a declarative language, and adding an operator or a rewrite means adding a rule, not editing the search. That is the argument for Starburst, Volcano and Cascades, and the reason most new engines adopt a framework (Calcite, Orca, optd, CockroachDB's <code>optgen</code>) instead of a monolith.</li> <li><strong>Logical operators do not map one-to-one to physical ones</strong>: a logical join plus a logical sort can become one physical sort-merge join. Transformations go logical→logical, logical→physical and physical→physical, <strong>never physical back to logical</strong>.</li> <li><strong>Heuristics are not obsolete.</strong> Predicate splitting and pushdown, replacing a Cartesian product plus filter by a join, projection pushdown, constant folding and subquery unnesting are almost always beneficial and need no cost model; production systems apply them first (normalization), shrinking the space the cost-based search must cover. The danger is magic constants and rule interactions.</li> <li><strong>Optimization time is a budget.</strong> Exhaustive join search is exponential (<a href="/cookbook/p/join-ordering">Q4</a>), so every production optimizer has a <em>timeout or a size limit</em> and a <em>fallback</em>: SQL Server's search phases with cost thresholds and a time-out, PostgreSQL's <code>join_collapse_limit</code> and GEQO beyond a dozen relations, MySQL's search-depth limit. A good plan found in 1 ms beats an optimal plan found in 1 s for a 5 ms query, and a plan cache amortizes the rest.</li> <li><strong>Plans age.</strong> The best plan changes with the data, the indexes, the parameter values and the statistics. Production answers are a <strong>plan cache</strong> with invalidation, <strong>reversion</strong> to a previous plan when a new one regresses (query store), <strong>plan stitching</strong> of the best sub-plans from past executions, and the adaptive techniques of <a href="/cookbook/p/adaptive-and-robust">Q10</a>.</li> <li><strong>Equality saturation is the newest enumeration style</strong>: keep <em>every</em> equivalent form of an expression in a compact graph, apply rewrite rules until nothing new appears, then extract the cheapest. It is the Cascades memo without the guidance, and it composes with arbitrary rules. The lab below builds one, proves it finds the optimal join order, and measures what it costs.</li> </ul>
"""

[[sections]]
heading = "Anatomy"
body = """
<p>Every production optimizer is a pipeline of stages, each of which can be skipped, merged or replaced by a framework:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>stage</th> <th>does</th> <th>typical form</th> <th>where bugs and surprises live</th> </tr> </thead> <tbody> <tr> <td>parse and bind</td> <td>names to catalog objects, types, views expanded</td> <td>AST → logical tree</td> <td>name resolution, implicit casts (<a href="/cookbook/p/modern-sql">L02</a>)</td> </tr> <tr> <td>normalize / rewrite</td> <td>constant folding, predicate pushdown, subquery unnesting (<a href="/cookbook/p/unnesting-subqueries">Q6</a>), view merging, outer-join simplification (<a href="/cookbook/p/plan-transformations-and-rule-soundness">Q3</a>)</td> <td>heuristic rules to a fixpoint</td> <td>rule interaction, ordering, soundness with NULLs</td> </tr> <tr> <td>statistics and estimates</td> <td>attach row counts and distinctness to each node (<a href="/cookbook/p/statistics">Q7</a>, <a href="/cookbook/p/cardinality-estimation">Q8</a>)</td> <td>bottom-up derivation or memo property</td> <td>defaults, correlation, staleness</td> </tr> <tr> <td>logical exploration</td> <td>join order, aggregation placement, set-operation rewrites (<a href="/cookbook/p/join-ordering">Q4</a>)</td> <td>DP over subsets, or rules in a memo (<a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>)</td> <td>search-space explosion, timeouts</td> </tr> <tr> <td>physical implementation</td> <td>algorithms, access paths, build sides, exchange operators (<a href="/cookbook/p/cost-models">Q9</a>)</td> <td>implementation rules + required properties and enforcers</td> <td>cost model constants, ties</td> </tr> <tr> <td>post-processing</td> <td>parallelization, distribution, memory grants, prepared-plan parameters</td> <td>tree walk</td> <td>partition pruning, skew</td> </tr> <tr> <td>plan management</td> <td>cache, invalidate, pin, compare, revert</td> <td>plan cache, query store</td> <td>stale plans, regression</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "A survey"
body = """
<p>What each system does, from the lecture notes, the talks above and the systems' own documentation. Architectures change between releases; read the current documentation before relying on a detail.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>system</th> <th>search architecture</th> <th>joins</th> <th>what to study it for</th> </tr> </thead> <tbody> <tr> <td><strong>PostgreSQL</strong></td> <td>heuristics + cost-based, bottom-up dynamic programming over join levels on <em>paths</em> (each with startup and total cost, sort order)</td> <td>DP over join levels; <code>join_collapse_limit</code> and <code>from_collapse_limit</code> (default 8) bound how many items are reordered, and a genetic search (GEQO) takes over at 12 or more</td> <td>the clearest small codebase to read; <code>pathkeys</code> for interesting orders; extended statistics</td> </tr> <tr> <td><strong>MySQL / MariaDB</strong></td> <td>heuristics + cost-based; a depth-limited greedy/exhaustive left-deep search (<code>optimizer_search_depth</code>, pruning); a refactored pipeline in 8.x</td> <td>left-deep, with pruning</td> <td>an optimizer evolved from a rule-based core; the optimizer trace</td> </tr> <tr> <td><strong>SQL Server</strong></td> <td><strong>unified search</strong>: a Cascades-derived memo; staged search phases (trivial plan, then increasingly thorough phases) with cost thresholds and time-outs</td> <td>memo-based exploration with pruning</td> <td>the Cascades implementation at product scale; query store; adaptive features</td> </tr> <tr> <td><strong>Oracle</strong></td> <td>cost-based with a large set of query transformations (view merging, unnesting, star transformation) followed by join permutation search</td> <td>permutation search with limits</td> <td>transformation catalog; dynamic sampling; adaptive plans; SQL plan directives</td> </tr> <tr> <td><strong>IBM Db2</strong></td> <td>descendant of <strong>Starburst</strong>: query graph model rewrite phase, then cost-based bottom-up join enumeration</td> <td>DP</td> <td>rewrite rules over the QGM; LEO feedback; the historical reference</td> </tr> <tr> <td><strong>CockroachDB</strong></td> <td><strong>stratified</strong> memo-based: <em>normalization</em> rules fire as expressions are built; <em>exploration</em> rules are cost-based; rules written in a DSL (<code>optgen</code>) that generates Go</td> <td>DP-style exploration inside the memo</td> <td>readable rule language; statistics collection in a distributed setting</td> </tr> <tr> <td><strong>Apache Calcite</strong></td> <td>Volcano/Cascades-style planner with <em>traits</em> (calling convention, collation) plus a heuristic planner for rule programs</td> <td>memo-based join reordering rules</td> <td>the most reused framework (Hive, Flink, Drill, Beam SQL); adapters to many backends</td> </tr> <tr> <td><strong>Orca</strong> (Greenplum, Cloudberry)</td> <td><strong>Cascades</strong>, as a standalone optimizer service speaking an XML plan language (DXL); a multi-threaded job scheduler for the search</td> <td>memo-based</td> <td>the modular architecture; plan verification tooling</td> </tr> <tr> <td><strong>Spark SQL (Catalyst)</strong></td> <td>rule-based tree transformations in <em>batches</em> run to a fixpoint (analysis, logical optimization, physical planning); optional cost-based join reordering; AQE at run time</td> <td>DP when the CBO is enabled</td> <td>writing rules with pattern matching; adaptive re-optimization at stage boundaries (<a href="/cookbook/p/adaptive-and-robust">Q10</a>)</td> </tr> <tr> <td><strong>Trino / Starburst</strong></td> <td>iterative rule-based optimizer over a memo of plan groups, with cost-based rules for join order and distribution</td> <td>cost-based reordering, broadcast vs partitioned decided by cost</td> <td>plan fragments and exchanges; dynamic filtering</td> </tr> <tr> <td><strong>DuckDB</strong></td> <td>rule-based rewrites, statistics propagation, unnesting by dependent joins (<a href="/cookbook/p/unnesting-subqueries">Q6</a>), a join-order optimizer driven by estimated cardinalities</td> <td>hypergraph dynamic programming with a fallback for large queries</td> <td>a modern small optimizer for a vectorized engine; works with few statistics</td> </tr> <tr> <td><strong>HyPer / Umbra</strong></td> <td>unnesting of arbitrary subqueries, DP over join hypergraphs with an adaptive strategy for very large queries, sampling for base-table estimates</td> <td>adaptive: exact DP for small, heuristics for huge</td> <td>join ordering at scale (<a href="/cookbook/p/join-ordering">Q4</a>)</td> </tr> <tr> <td><strong>DataFusion</strong></td> <td>logical rule-based optimizer, physical planning, physical-plan optimizer rules (distribution, sorting); mostly statistics-light</td> <td>rule-based, basic reordering</td> <td>a Rust optimizer you can read and extend</td> </tr> <tr> <td><strong>optd</strong></td> <td><strong>Cascades</strong> framework in Rust (CMU), with a property-driven top-down search</td> <td>memo-based</td> <td>a research/teaching Cascades implementation</td> </tr> <tr> <td><strong>egg / egglog</strong></td> <td><strong>equality saturation</strong> with e-graphs and e-class analyses (a library for building optimizers)</td> <td>whatever the rules express</td> <td>extraction, rule interaction, the lab below</td> </tr> </tbody> </table></div>

<aside data-call="note"><b>Frameworks versus monoliths</b><p>PostgreSQL and MySQL are monoliths: the search is hand-written and the rules are code. Calcite, Orca, CockroachDB and SQL Server are frameworks: the search is generic and the rules are data (or code behind a uniform interface). A monolith is easier to tune for a workload, a framework easier to extend; many systems end up hybrid (a framework for exploration, hand-written code for join enumeration and cost, as in the DP-within-memo approach).</p></aside>
"""

[[sections]]
heading = "An e-graph"
body = """
<p>Equality saturation is a different answer to "how do I explore the space of equivalent plans?" The structure is exactly the memo of <a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a> with the sharing made automatic:</p>

<ol> <li>An <strong>e-node</strong> is an operator whose children are <strong>e-classes</strong> (here <code>Scan(i)</code> or <code>Join(class, class)</code>).</li> <li>An <strong>e-class</strong> is a set of e-nodes known to be equivalent, plus an <em>analysis</em> value that must agree across the class (here the set of relations it covers: a join tree is only equivalent to another over the same relations, so merging classes with different sets is a bug and the code asserts it).</li> <li><strong>Hash-consing</strong>: the memo maps each canonical e-node to its class, so the same expression is never stored twice.</li> <li><strong>Union-find</strong> merges classes; after merges, <strong><code>rebuild</code></strong> restores <em>congruence</em>: if two e-nodes have children that are now the same class, they are the same node, so their classes merge, which may cascade.</li> <li><strong>Rewrite rules</strong> are applied to the whole graph: commutativity <code>a ⋈ b → b ⋈ a</code> and associativity <code>(a ⋈ b) ⋈ c → a ⋈ (b ⋈ c)</code>. All right-hand sides are added first, then all unions are applied, then one rebuild (the two-phase scheme of egg).</li> <li><strong>Saturation</strong> is the fixpoint: no rule changes the graph. A node limit and a round limit guard against rule sets that never saturate.</li> <li><strong>Extraction</strong> picks, per class, the cheapest node by bottom-up dynamic programming: <code>best(class) = min over nodes of Σ best(children) + card(class)</code>. For <code>C_out</code> the cardinality of a class depends only on its relation set, so the extraction is exact.</li> </ol>

:::deeper Reference: e-graph with hash-consing, union-find, congruence rebuild, equality saturation with join commutativity and associativity, cost-based extraction, and an independent oracle
```rust title="src/opt/egraph.rs"
//! An e-graph for join ordering: hash-consed e-nodes, union-find over e-classes, congruence closure (`rebuild`),
//! equality saturation with the two rules every optimizer has (commutativity and associativity of joins), and
//! extraction of the cheapest tree under `C_out`. It is the same structure as the Cascades memo of Q2 (a group
//! is an e-class, an expression is an e-node) with two differences: nodes are deduplicated and merged by
//! congruence automatically, and rules are applied to everything until nothing new appears instead of on demand.
use std::collections::HashMap;
use crate::joinorder::{Graph, Tree};

pub type Id = u32;

/// A safety net: saturating a join graph of n relations takes about n + 3 rounds, so this is never reached by a correct rule set.
const MAX_ROUNDS: usize = 64;

#[derive(Clone, Copy, PartialEq, Eq, Hash, Debug)]
pub enum ENode { Scan(u8), Join(Id, Id) }

struct Class { nodes: Vec<ENode>, set: u64 }

#[derive(Default)]
pub struct EGraph {
    parent: Vec<Id>,
    classes: HashMap<Id, Class>,
    memo: HashMap<ENode, Id>,
}

impl EGraph {
    pub fn new() -> Self { Self::default() }

    pub fn find(&self, mut x: Id) -> Id { while self.parent[x as usize] != x { x = self.parent[x as usize]; } x }
    fn find_compress(&mut self, x: Id) -> Id {
        let root = self.find(x);
        let mut y = x;
        while self.parent[y as usize] != root { let next = self.parent[y as usize]; self.parent[y as usize] = root; y = next; }
        root
    }
    fn canon(&self, n: ENode) -> ENode { match n { ENode::Join(a, b) => ENode::Join(self.find(a), self.find(b)), s => s } }

    /// The set of base relations an e-class covers: the *analysis* every node of the class must agree on.
    pub fn set_of(&self, c: Id) -> u64 { self.classes[&self.find(c)].set }

    /// Add a node (or find the existing class that already contains it).
    pub fn add(&mut self, n: ENode) -> Id {
        let n = self.canon(n);
        if let Some(&id) = self.memo.get(&n) { return self.find(id); }
        let id = self.parent.len() as Id;
        self.parent.push(id);
        let set = match n { ENode::Scan(i) => 1u64 << i, ENode::Join(a, b) => self.set_of(a) | self.set_of(b) };
        self.classes.insert(id, Class { nodes: vec![n], set });
        self.memo.insert(n, id);
        id
    }

    /// Merge two classes. Their relation sets must be equal: a join tree is only equivalent to a tree over the same relations.
    pub fn union(&mut self, a: Id, b: Id) -> Id {
        let (a, b) = (self.find_compress(a), self.find_compress(b));
        if a == b { return a; }
        assert_eq!(self.classes[&a].set, self.classes[&b].set, "merging classes over different relation sets");
        let (big, small) = if self.classes[&a].nodes.len() >= self.classes[&b].nodes.len() { (a, b) } else { (b, a) };
        self.parent[small as usize] = big;
        let moved = self.classes.remove(&small).unwrap();
        self.classes.get_mut(&big).unwrap().nodes.extend(moved.nodes);
        big
    }

    /// Restore the invariants after unions: every node is canonical (its children are class roots), the memo maps each
    /// canonical node to its class, and two nodes that became equal because their children were merged live in the same
    /// class (congruence closure). Group all nodes by canonical form, merge the classes that share one, and repeat.
    pub fn rebuild(&mut self) {
        loop {
            let mut owner: HashMap<ENode, Id> = HashMap::new();
            let mut merges: Vec<(Id, Id)> = vec![];
            for (&id, cls) in &self.classes {
                for &n in &cls.nodes {
                    let c = self.canon(n);
                    match owner.get(&c) { Some(&o) if o != id => merges.push((o, id)), Some(_) => {}, None => { owner.insert(c, id); } }
                }
            }
            if merges.is_empty() {
                let ids: Vec<Id> = self.classes.keys().copied().collect();
                for id in ids {
                    let mut seen = std::collections::HashSet::new();
                    let fresh: Vec<ENode> = self.classes[&id].nodes.iter().map(|&n| self.canon(n)).filter(|n| seen.insert(*n)).collect();
                    self.classes.get_mut(&id).unwrap().nodes = fresh;
                }
                self.memo = owner;
                return;
            }
            for (a, b) in merges { self.union(a, b); }
        }
    }

    pub fn n_classes(&self) -> usize { self.classes.len() }
    pub fn n_nodes(&self) -> usize { self.classes.values().map(|c| c.nodes.len()).sum() }

    /// Add a join tree and return its class.
    pub fn add_tree(&mut self, t: &Tree) -> Id {
        match t {
            Tree::Leaf(i) => self.add(ENode::Scan(*i as u8)),
            Tree::Join(a, b) => { let (x, y) = (self.add_tree(a), self.add_tree(b)); self.add(ENode::Join(x, y)) }
        }
    }

    /// One round of the rewrite rules over a snapshot of the graph; returns how much the graph changed (unions + new nodes + new classes).
    ///   commutativity   a ⋈ b      ->  b ⋈ a
    ///   associativity   (a ⋈ b) ⋈ c ->  a ⋈ (b ⋈ c)
    /// Two phases, as in egg: first *add* every right-hand side (no merging, so the hash-cons memo stays exact and nothing is
    /// duplicated), then perform all the unions, then `rebuild` once.
    fn apply_rules(&mut self, assoc: bool) -> usize {
        let before = (self.n_nodes(), self.n_classes());
        let snapshot: Vec<(Id, Vec<ENode>)> = self.classes.iter().map(|(&id, c)| (id, c.nodes.clone())).collect();
        let mut equal: Vec<(Id, Id)> = vec![];
        for (cid, nodes) in snapshot {
            for n in nodes {
                if let ENode::Join(x, z) = n {
                    equal.push((cid, self.add(ENode::Join(z, x))));
                    if assoc {
                        let left: Vec<ENode> = self.classes[&self.find(x)].nodes.clone();
                        for m in left {
                            if let ENode::Join(a, b) = m {
                                let bz = self.add(ENode::Join(b, z));
                                equal.push((cid, self.add(ENode::Join(a, bz))));
                            }
                        }
                    }
                }
            }
        }
        let mut unions = 0;
        for (a, b) in equal { if self.find(a) != self.find(b) { self.union(a, b); unions += 1; } }
        self.rebuild();
        unions + self.n_nodes().abs_diff(before.0) + self.n_classes().abs_diff(before.1)
    }

    /// Apply the rules until nothing changes, the graph exceeds `node_limit`, or `MAX_ROUNDS` rounds pass. Returns (rounds, saturated).
    pub fn saturate(&mut self, assoc: bool, node_limit: usize) -> (usize, bool) {
        for round in 1..=MAX_ROUNDS {
            if self.apply_rules(assoc) == 0 { return (round, true); }
            if self.n_nodes() > node_limit { return (round, false); }
        }
        (MAX_ROUNDS, false)
    }

    /// Cheapest tree of class `root` under C_out: the sum of the cardinalities of all join results (leaves are free).
    /// A class's cardinality depends only on its relation set, so the best tree is a bottom-up minimum over its nodes.
    pub fn extract(&self, root: Id, g: &Graph) -> (f64, Tree) {
        let mut ids: Vec<Id> = self.classes.keys().copied().collect();
        ids.sort_by_key(|&c| self.classes[&c].set.count_ones());
        let mut best: HashMap<Id, (f64, ENode)> = HashMap::new();
        for c in ids {
            let cls = &self.classes[&c];
            let card = g.card_of(cls.set);
            let mut pick: Option<(f64, ENode)> = None;
            for &n in &cls.nodes {
                let cost = match n {
                    ENode::Scan(_) => 0.0,
                    ENode::Join(a, b) => best[&self.find(a)].0 + best[&self.find(b)].0 + card,
                };
                if pick.map_or(true, |p| cost < p.0) { pick = Some((cost, n)); }
            }
            best.insert(c, pick.unwrap());
        }
        fn build(eg: &EGraph, best: &HashMap<Id, (f64, ENode)>, c: Id) -> Tree {
            match best[&eg.find(c)].1 {
                ENode::Scan(i) => Tree::Leaf(i as usize),
                ENode::Join(a, b) => Tree::Join(Box::new(build(eg, best, a)), Box::new(build(eg, best, b))),
            }
        }
        let r = self.find(root);
        (best[&r].0, build(self, &best, r))
    }

    /// Debug check of the invariants `rebuild` promises.
    pub fn check_invariants(&self) -> Result<(), String> {
        for (&id, cls) in &self.classes {
            if self.find(id) != id { return Err(format!("class {id} is not a root")); }
            for &n in &cls.nodes {
                if self.canon(n) != n { return Err(format!("non-canonical node {n:?} in class {id}")); }
                match self.memo.get(&n) {
                    Some(&m) if self.find(m) == id => {}
                    other => return Err(format!("memo of {n:?} is {other:?}, expected class {id}")),
                }
                let set = match n { ENode::Scan(i) => 1u64 << i, ENode::Join(a, b) => self.set_of(a) | self.set_of(b) };
                if set != cls.set { return Err(format!("node {n:?} covers a different relation set than class {id}")); }
            }
        }
        Ok(())
    }
}

/// Cost (C_out) of a given tree, computed from scratch.
pub fn tree_cost(t: &Tree, g: &Graph) -> f64 {
    fn go(t: &Tree, g: &Graph) -> (f64, u64) {
        match t {
            Tree::Leaf(i) => (0.0, 1 << i),
            Tree::Join(a, b) => { let (ca, sa) = go(a, g); let (cb, sb) = go(b, g); (ca + cb + g.card_of(sa | sb), sa | sb) }
        }
    }
    go(t, g).0
}

/// An independent oracle: the best bushy tree over every subset *including cross products* (what the e-graph searches).
pub fn best_with_cross_products(g: &Graph) -> f64 {
    let n = g.n;
    let mut best = vec![f64::INFINITY; 1 << n];
    for i in 0..n { best[1 << i] = 0.0; }
    for set in 1u64..(1 << n) {
        if set.count_ones() < 2 { continue; }
        let card = g.card_of(set);
        let mut sub = (set - 1) & set;
        while sub > 0 {
            if sub & (set & set.wrapping_neg()) != 0 {
                let c = best[sub as usize] + best[(set ^ sub) as usize] + card;
                if c < best[set as usize] { best[set as usize] = c; }
            }
            sub = (sub - 1) & set;
        }
    }
    best[(1 << n) - 1]
}
```
:::
"""

