meta pages synced lazily (NOMETASYNC): 500 scenarios, 165 transactions finished before the crash point; of 335 crashes during a commit, 318 recovered an older committed state and 17 the new one; 104 meta writes were torn
```

<ul> <li><strong>Reads are cheap</strong>: 3 pages per lookup (height 3 for a million keys), about 50 ns each with every page in memory. There is nothing to latch: a reader follows immutable pages.</li> <li><strong>Writes pay for the path</strong>: one update per transaction writes <strong>3 pages = 12 KB</strong>, a height's worth, to change a 16-byte record. Batching amortizes the root and upper levels: 2.06 pages per update at 10 per transaction, 1.06 at 1 000, 0.67 at 10 000. A write-ahead-log engine writes about 30 bytes of log per update; this is why LMDB is a read-optimized engine and why batching matters.</li> <li><strong>Space needs a reader policy</strong>: with no reader the file stays at 2.17× the live tree under steady updates (24 979 pages for 11 509 live). One long-lived read transaction pins everything replaced after its snapshot: the same updates grew the file to <strong>15.35×</strong> (176 638 pages, 165 129 of them held by the reader). When the reader ends, those pages become reusable at once but the file does not shrink, which is why an LMDB application must not hold read transactions open.</li> <li><strong>Crashes</strong>: in 500 scenarios per mode (a few dozen warm-up transactions with page reuse, then a crash at a random event of the next commit, with each unsynced write kept or lost at random) every recovery was one of the committed states, passed the structural check, and the recovered store accepted 20 more transactions. With the meta synced at every commit, no acknowledged commit was ever lost. In the lazy mode (LMDB's <code>MDB_NOMETASYNC</code>: skip the second <code>fsync</code>, so the meta reaches disk with the next commit's sync) recovery may return the state <em>before</em> the last acknowledged commit, never a torn mix; the test accepts exactly that and nothing else. 14 and 104 meta writes were torn, and all were detected.</li> </ul>

<aside data-call="note"><b>What the second fsync is for</b><p>Pages first, then the meta. If the meta could reach the disk before the pages it points to, a crash would leave a root that refers to pages never written. The mutant that removes the page <code>fsync</code> was caught immediately; the one that skips the meta <code>fsync</code> is caught by the strict-durability check (a commit that returned must survive). The two modes are the two points on the durability dial: <code>fsync</code> twice per commit, or once and risk losing the last transaction.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A <code>Disk</code> that can crash</strong> is the whole trick of the test: every <code>write_page</code>, <code>write_meta</code> and <code>sync</code> is an <em>event</em>, <code>crash_after(n, seed)</code> makes the n-th one fail, and at that instant each buffered write survives or not by a seeded coin. A real power loss can do exactly this because the drive may reorder and cache; modelling it is what makes the recovery code testable.</li> <li><strong>Checksummed meta</strong> (<code>Meta::new</code> seals, <code>valid</code> checks): the torn write in the simulation flips fields without updating the checksum, so recovery's filter is exercised rather than assumed.</li> <li><strong><code>Option&lt;u32&gt;</code> for the root</strong> and <code>Result&lt;(), Error&gt;</code> from <code>commit</code>: an empty tree is <code>None</code>; a crash is an <code>Err(Crashed)</code> that leaves the in-memory store untouched, as in a process that died.</li> <li><strong>Ownership mirrors the algorithm</strong>: a <code>Tx</code> borrows the store, holds the <code>dirty</code> page map and the <code>freed</code>/<code>released</code> lists, and <code>commit</code> consumes it in one place; a page id that the transaction created can be modified again in place (<code>dirty.contains_key</code>), one that belongs to a committed tree never can.</li> <li><strong>Testing without a file system</strong>: pages live in a <code>Vec&lt;Option&lt;Node&gt;&gt;</code>; "the file" is its length, so the space measurements are exact and deterministic.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Model</strong>: after every transaction of random puts and deletes (small pages so splits, empty leaves and root collapses are frequent) the store equals a <code>BTreeMap</code>, passes a structural check (sorted keys, separators bracket their subtrees, uniform depth), and range scans agree.</li> <li><strong>No leaks, no sharing</strong>: <code>allocated pages == live pages + pages waiting on the free list</code> after every commit; no page id is reachable twice; a separate test inserts and deletes hundreds of fresh keys inside one transaction, and the file must stay small across rounds.</li> <li><strong>Readers</strong>: a snapshot taken at transaction <em>t</em> returns the same contents after 100 more commits; while it is open the number of reusable pages stays small and the file grows; after it ends the pages become reusable.</li> <li><strong>Crashes</strong>: 500 scenarios per sync mode as above, plus a directed test where the newest meta is torn and recovery must fall back to the other one.</li> <li><strong>Mutants run against these tests</strong>: the previous commit's pages reused at once; readers not pinning pages; meta pages not alternating; recovery choosing the oldest meta; no <code>fsync</code> before the meta; no <code>fsync</code> after the meta; replaced pages forgotten; pages created and dropped in a transaction forgotten; a committed page modified in place; an off-by-one separator; reused pages left on the free list; a deleted empty leaf not freed; recovery not checking the checksum. <strong>All 13 were killed.</strong> Three survived the first version of the suite: reusing the previous commit's pages (the model did not have unsynced meta writes), forgetting transient pages (no test created and discarded pages in one transaction) and the torn-meta path (a torn write was simply "lost", so the checksum was never needed); each led to a model change or a new test, described above.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>LMDB</strong> (C, used by OpenLDAP, Monero, many caches) is this design on a memory-mapped file: one writer, unlimited lock-free readers, two meta pages, a free-page database, no recovery step; <code>MDB_NOMETASYNC</code> and <code>MDB_NOSYNC</code> trade durability for speed. Descendants: <strong>BoltDB/bbolt</strong> (Go, used by etcd) and <strong>redb</strong> (Rust).</li> <li><strong>SQLite</strong> keeps a B-tree in a single file with either a rollback journal (old page images saved before overwriting) or a write-ahead log (readers see the database as of when they began; a checkpoint copies the log back); one writer at a time; SQL is compiled to bytecode (<a href="/cookbook/p/execution-pipelines">execution</a>).</li> <li><strong>WiredTiger</strong> (C, MongoDB's default engine) has B-trees with hazard-pointer-protected in-memory pages, multi-version records at document level, a journal and periodic checkpoints that are copy-on-write on disk, and optional LSM and column-store layouts.</li> <li><strong>RocksDB</strong> (C++, a LevelDB fork from Facebook) is the standard embeddable LSM engine, with leveled, universal and FIFO compaction, column families, and wide use inside other databases (TiKV, MyRocks).</li> <li><strong>BerkeleyDB</strong> (C, now Oracle) offers B-tree, hash, queue and record-number access methods with transactions and logging; <strong>SQL Anywhere</strong> (SAP) is a full SQL database designed to run unattended on small devices.</li> <li><strong>Memory-first</strong>: <strong>Hekaton</strong> (SQL Server In-Memory OLTP) with lock-free hash and Bw-tree indexes, optimistic MVCC and compiled stored procedures; <strong>SingleStore (MemSQL)</strong> with an in-memory skip-list rowstore and a disk columnstore; <strong>VoltDB</strong> with single-threaded partitions executing stored procedures serially; <strong>NuoDB</strong> with a peer-to-peer memory-centric architecture; <strong>Tokutek's TokuDB</strong> (fractal trees, since discontinued) brought write-optimized trees to MySQL and MongoDB.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong><code>fsync</code> lies if you let it</strong>: disks and file systems cache; <code>fsync</code> on the file may not flush the directory entry; macOS needs <code>F_FULLFSYNC</code>. Test on the media you deploy on; this model cannot find a lying drive.</li> <li><strong>Reader leaks</strong> make a copy-on-write file grow without bound; put a deadline and a monitor on read transactions.</li> <li><strong>Single-writer means a queue</strong>: a slow writer blocks all others; keep write transactions short and batch.</li> <li><strong>Torn pages</strong>: pages bigger than the device's atomic write unit can be half written; checksums, not luck, tell you.</li> <li><strong>Memory-mapped I/O hides stalls</strong>: a page fault inside a read can block like any disk read, and on an I/O error a mapped file raises a signal, not a <code>Result</code>.</li> <li><strong>Write amplification of CoW</strong> is real for small transactions: a million single-row commits write 12 GB of pages for 16 MB of data in the measurement above.</li> <li><strong>Do not benchmark an embedded engine against a server on one workload</strong>: the network and the client library often dominate the difference.</li> </ul></aside>
"""

