[[sections]]
heading = "Measured"
body = """
<p>50 000 vectors of 32 dimensions in 100 heavily overlapping clusters (a hard case for partitioning indexes), 200 queries, recall&#64;10 against an exact scan.</p>

```text title="Vamana with and without PQ guidance, sector reads against IVF, HNSW and a scan, and the transactional table"
50000 vectors, 32 dimensions, 100 overlapping clusters, recall@10 over 200 queries; a node sector holds a vector and its neighbour list
Vamana build (R=32, L=100, alpha 1.2, two passes): 6.3 s; node sector 260 bytes (15 nodes per 4 KB page if packed); reachable 50000/50000; mean degree 31.6
  beam L |      plain graph on disk |    PQ-guided (8 bytes per vector in RAM)
      10 |    0.837           342.6 |    0.513            16.1          363
      20 |    0.921           469.6 |    0.705            25.7          494
      40 |    0.965           676.4 |    0.864            45.2          701
      80 |    0.984          1047.2 |    0.955            84.4         1074
     160 |    0.994          1778.5 |    0.987           163.0         1810
     320 |    0.997          3261.1 |    0.997           322.1         3356
sector reads per query at recall >= 0.95:
  Vamana, plain graph on disk (L=40)             recall 0.965      676.4 sectors
  Vamana with PQ guidance (L=80)                 recall 0.955       84.4 sectors
  IVF-flat (nlist 200, nprobe 16)                recall 0.968      115.1 sectors
  HNSW (M=16, ef 40), each visit one sector      recall 0.966      727.7 sectors
  exact scan of every vector                     recall 1.000     1562.5 sectors
transactional IVF table: 20 000 vectors inserted in 0.04 s (459325 vectors/s, 100 per transaction)
  nprobe  recall@10  scanned/query     us/query
       1      0.718            330          342
       2      0.792            713          695
       4      0.884           1451         1373
       8      0.942           2937         2802
      16      0.984           5841         5774
      64      1.000          20000        20199
```

<ul> <li><strong>PQ guidance is what makes a graph viable on disk</strong>: a plain graph needs 676 sector reads per query for recall 0.965, nearly half the 1 563 of a scan; the PQ-guided search reaches 0.955 with <strong>84 reads</strong>, eight times fewer, because candidates are ranked from the 8-byte codes in memory and only expanded nodes are read. The price is memory: 8 bytes × 50 000 = 400 KB here, one sixteenth of the raw 128 bytes per vector.</li> <li><strong>Against the alternatives at recall ≥ 0.95</strong>: IVF-flat with 200 cells and 16 probes reads 115 sectors, but they are contiguous (a list is one sequential read), so its time per sector is far lower than a graph's random reads; HNSW needs 728 visits when every visit is a sector, which is why it is an in-memory index. A graph with PQ wins on random reads; an IVF index wins on bandwidth. Which one is faster depends on the device: on NVMe the random-read penalty is small and the graph's 84 reads usually win; on slow storage the sequential lists do.</li> <li><strong>Build cost</strong>: 6.3 s for 50 000 vectors (two passes of a 100-wide search each) and 31.6 neighbours per node on average. The construction is quadratic-ish in the beam width and does not parallelize trivially; production builders partition the data, build sub-graphs and merge.</li> <li><strong>The transactional table</strong>: 20 000 vectors in 200 transactions (460 000 per second, an in-memory key space, so the figure is the cost of the layout and the versioned keys, not of a disk). Probing 8 of 64 cells scans 15% of the vectors for recall 0.942; probing 16 reaches 0.984; probing all is the exact answer.</li> <li><strong>The test of transactionality is stronger than the number</strong>: 40 randomized runs of concurrent transactions inserting, moving, deleting and searching, with row keys written in the same transactions, compare every search with a brute force over that transaction's own view (its snapshot plus its writes), check that an aborted transaction leaves neither the row nor the vector, and check that probing the two nearest cells scans exactly the vectors assigned to them.</li> </ul>

<aside data-call="note"><b>A graph that does not reach every node</b><p>The paper's construction does not guarantee that every node is reachable from the medoid. On the 50 000-point test set with tight clusters, the first build left a handful of points unreachable: they could never be returned by any query, whatever the beam width. <code>repair</code> finds each stranded node, searches for the nearest reachable one and links it (dropping that node's farthest neighbour if it is full), repeating until nothing is stranded. The test uses that configuration, asserts that the unrepaired construction strands nodes and the repaired one does not, and a mutant that skips the repair is killed. A recall figure that silently excludes some points is a worse failure than a slow query.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Beam as a sorted <code>Vec&lt;(Cand, bool)&gt;</code></strong>: insertion by <code>partition_point</code>, truncation to <em>L</em>, and a flag for "already expanded"; for widths of 10 to 300 this beats a pair of heaps. <code>Cand(f32, u32)</code> is <code>Ord</code> through <code>total_cmp</code> with the id as tie-breaker, so results are deterministic.</li> <li><strong>Visited marks by epoch</strong>: a <code>Vec&lt;u32&gt;</code> stamped with the query number replaces a hash set and a clear; the build reuses one array across a hundred thousand searches.</li> <li><strong>Squared distances with a squared α</strong>: <code>α² · d²(best, c) &gt; d²(p, c)</code> is the pruning rule without a square root.</li> <li><strong>Two probe counters</strong>: <code>reads</code> (expansions) and <code>exact</code> (full-vector evaluations) let one run report both the plain-on-disk cost (every exact evaluation is a read) and the PQ-guided cost (only expansions are).</li> <li><strong>Vectors as bytes in the key space</strong>: <code>f32::to_le_bytes</code> into the value of <code>vector_key(index, cell, id)</code>; the id is decoded back from the key with <code>decode_tuple</code>, so the value holds only the vector.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Graph invariants</strong> on 3 000 points: every degree ≤ <em>R</em>, no self loops or duplicate neighbours, every node reachable from the medoid, the medoid is the point nearest the centroid, and a beam as wide as the collection returns exactly the brute-force top 10 for 30 queries.</li> <li><strong>Recall behaviour</strong> on 8 000 points: recall&#64;10 never falls when the beam grows (10 to 160), is above 0.9 at <em>L</em> = 80 for exact distances and above 0.85 for PQ-guided search; every PQ-guided result carries its exact distance and the list is sorted; PQ search never reads more than twice what a plain search expands plus a constant.</li> <li><strong>Connectivity</strong>: the unrepaired construction on the 50 000-point test set strands nodes, the repaired graph reaches all, with bounded degrees; a graph from which two nodes' in-edges were removed by hand is repaired.</li> <li><strong>Transactional table (40 seeds × 150 steps)</strong>: three concurrent snapshot transactions with upserts, removals, gets and searches; every operation equals a model of the transaction's view; commits keep the row and vectors together (row key visible after commit, absent after an abort); a search with <code>nprobe</code> of 2 scans exactly the vectors of the two nearest cells; final contents equal the model.</li> <li><strong>Mutants run against these tests</strong>: pruning keeping covered candidates; no degree bound; no reverse edges (the build then does not finish within the time limit); the medoid being the farthest point; PQ search returning approximate distances; stranded nodes not reconnected; an upsert leaving the old entry; a removal leaving the location entry; a search probing one cell too many; vectors assigned to the farthest cell. <strong>All 10 were killed</strong>; the repair mutant survived until the stranding configuration was added.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>DiskANN</strong> (Microsoft Research; used in Bing and as the engine of several vector databases) and its descendants <strong>Filtered-DiskANN</strong> and <strong>FreshDiskANN</strong> (streaming inserts and deletes with a merge into the disk graph) are the reference for SSD-resident graphs. <strong>Milvus, Weaviate, Qdrant, Vespa, pgvecto.rs, SQL Server 2025 and Azure Cosmos DB</strong> offer disk-based or quantized graph indexes.</li> <li><strong>pgvector</strong> has IVFFlat and HNSW as Postgres index access methods, so vectors participate in transactions and WAL like any index; <strong>LanceDB</strong> and <strong>Turbopuffer</strong> build IVF-PQ and graph indexes over object storage; <strong>SingleStore</strong> and <strong>Elasticsearch/OpenSearch</strong> (Lucene HNSW, per-segment) keep per-segment indexes next to a transactional or near-real-time delta.</li> <li><strong>Scalar quantization and binary codes</strong> (int8, 1-bit with re-ranking), <strong>RaBitQ</strong> and <strong>ScaNN's anisotropic quantization</strong> push the resident memory per vector below PQ's at similar recall; <strong>hybrid search</strong> combines a vector score with BM25 or filters (<a href="/cookbook/p/full-text-search">M16</a>, <a href="/cookbook/p/one-planner-for-many-models">M18</a>).</li> <li><strong>Filtering</strong> is the hard part in practice: pre-filtering shrinks the candidate set but breaks graph connectivity, post-filtering wastes the search; Filtered-DiskANN builds label-aware edges; databases choose by selectivity (<a href="/cookbook/p/vector-databases">S2</a> measured the planner choice).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Recall measured on easy data is meaningless.</strong> Well-separated clusters make any index look perfect; test on data with the overlap and the dimensionality of the real embeddings, and report the recall–work curve, not one point.</li> <li><strong>Deletes in a graph</strong> leave holes: marking a node deleted keeps routing through it; real removal needs re-linking its neighbours. Rebuild periodically.</li> <li><strong>Embedding drift</strong>: re-embedding a table with a new model invalidates every index; version the index with the model.</li> <li><strong>Normalization and metric</strong>: cosine similarity needs unit vectors (or an inner-product index over normalized data); mixing metrics between build and query is a silent recall bug.</li> <li><strong>Memory for codes grows with the table</strong>: 8 bytes per vector means 8 GB per billion; plan the residency, not only the disk.</li> <li><strong>Read amplification of a sector per node</strong> is wasted when a node is 260 bytes; pack nodes of nearby ids per page or store the neighbour lists compactly.</li> <li><strong>Transactionality of the graph itself</strong> is not provided by the key layout of Part B; if the graph is an immutable segment, the delta since its build must be searched too and merged into the results.</li> </ul></aside>
"""

