[[sections]]
heading = "Measured"
body = """
<p>One million events over 1 000 keys; event time advances 7 ms per event on average and each event arrives up to 800 ms late (so arrival order is shuffled within a window of about 115 events).</p>

```text title="throughput by window type, the cost of lateness, and checkpoint intervals"
1000000 events, 1 000 keys, event time advancing 7 ms per event on average, each event up to 800 ms late
window                             M events/s     accepted   peak windows    dropped
tumbling 1 s                             3.68      1000000            253          0
sliding 10 s every 1 s                   0.40      1000000           5861          0
session, gap 200 ms                      3.24      1000000            197          0
lateness trade-off, tumbling 1 s windows: a larger delay keeps more events and holds results back
delay (ms)    dropped %   peak windows  result lag (ms)
         0       31.52%            117               45
       200       16.36%            148              245
       400        6.12%            172              444
       800        0.00%            228              844
      1600        0.00%            337             1644
checkpoint interval trade-off (tumbling 1 s windows, 1 000 keys): a checkpoint copies the operator state
    interval  checkpoints     run time (s) events replayed per crash
        1000         1000             0.29                    555
       10000          100             0.28                   5555
      100000           10             0.31                  38888
     1000000            1             0.70                 505555
```

<ul> <li><strong>Throughput follows the number of windows an event touches</strong>: 3.7 million events per second for tumbling windows, 3.2 million for sessions, 0.4 million for 10-second windows sliding by 1 second (ten window updates per event, 5 861 windows open at a time).</li> <li><strong>The delay buys completeness with latency</strong>: with no delay and events up to 800 ms late, <strong>31.5%</strong> of events are dropped; 200 ms drops 16.4%; 400 ms drops 6.1%; at 800 ms, equal to the maximum lateness, nothing is dropped and every result trails its window by about 850 ms. State grows with the delay (117 to 337 open windows).</li> <li><strong>Checkpoint cost is state size times frequency</strong>: with only a few hundred open windows, checkpoints every 1 000 events cost nothing measurable (0.29 s for 1 000 of them); the price shows on the recovery side: a crash replays on average half an interval (555 events at an interval of 1 000, 505 555 when the only checkpoint is the start).</li> <li><strong>Correctness first</strong>: the tumbling and sliding output equals a definition-based reference for 200 random configurations (32 230 windows; 5 139 late events dropped; 4 876 revisions emitted); sessions equal a batch definition when nothing is late and a sequential reference when data is late; and the output committed by a pipeline that crashed 660 times at random points, with random checkpoint intervals, equals the crash-free output exactly (same results, same order).</li> </ul>

<aside data-call="note"><b>Two semantic gaps the tests found</b><p><strong>Sessions at distance exactly the gap.</strong> The first implementation merged events whose distance equalled the gap; the batch definition (events <em>less than</em> the gap apart belong together, a session is <code>[start, last + gap)</code>) said otherwise, and the comparison with the batch oracle failed on the third seed. The window is half-open, like every other window in the operator. <strong>An emitted session forgotten too soon.</strong> The first sequential-reference comparison for late sessions failed because the operator discarded a closed session at once (grace zero) and then accepted a late event that overlapped it, producing a second, overlapping session. A closed session has to be remembered for one more gap. The rule "an event is late if it overlaps a session whose result was already emitted" is the only one that keeps the output a partition of the key's activity.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Ordered sets as priority queues</strong>: <code>BTreeSet&lt;(end, key, start)&gt;</code> for windows not yet emitted and <code>BTreeSet&lt;(expire_at, key, start)&gt;</code> for state; <code>iter().next()</code> is the minimum, and removal is <code>O(log n)</code>. A <code>BinaryHeap</code> cannot delete a window that a session merge rewrites; the ordered set can.</li> <li><strong>State and output are plain data</strong>: <code>WindowOp</code> derives <code>Clone</code>, so a checkpoint is <code>op.clone()</code> and a restore is an assignment; the sink is a <code>Vec&lt;Out&gt;</code>. Real systems write checkpoints incrementally and asynchronously, but the contract is the same.</li> <li><strong><code>Out</code> carries the watermark</strong> at emission, so the test can assert the central invariant directly: no window is emitted before the watermark reaches its end.</li> <li><strong>Floor semantics for window starts</strong>: <code>ts - ts.rem_euclid(w)</code> handles negative timestamps; sliding windows enumerate starts from the last multiple of the slide downward while the window still contains the timestamp.</li> <li><strong>A fault is a flag</strong>: <code>eager_commit</code> makes the pipeline publish output as it is produced; the test shows it duplicating results after a crash, which is the failure the checkpointed sink prevents.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Windows against the definition (200 seeds)</strong>: random out-of-order streams (four disorder levels, 1 to 4 keys), tumbling and sliding shapes, delays 0 to 700 and grace 0 to 200; the folded output equals a reference computed from the definition of window membership and lateness; stream invariants hold (a window is emitted once, never before the watermark reaches its end; a retraction withdraws exactly the last value and is followed by its revision with one more event); accepted plus dropped equals the input.</li> <li><strong>Completeness</strong>: with the delay at least the disorder nothing is dropped and counts and sums equal the input; with zero delay events are lost.</li> <li><strong>Sessions</strong>: against a batch definition (sort per key, cut at gaps) when nothing is late (200 seeds), and against a sequential list-based reference when events are late (200 seeds, more than 200 drops).</li> <li><strong>Timing</strong>: a directed test of the emission moment (the event that brings the watermark to the end closes the window), zero-grace drops and grace revisions with retraction.</li> <li><strong>Exactly once (120 seeds)</strong>: random checkpoint intervals and crashes at 1% of steps (660 crashes); committed output equals the crash-free run exactly; the eager-commit variant produces duplicates.</li> <li><strong>Mutants run against these tests</strong>: a watermark ahead of the data; the grace boundary off by one; sliding events joining a window that has just ended; windows closing a tick late; late events not announced as revisions; state dropped before the grace period; sessions merging at exactly the gap; events merged into emitted sessions; a checkpoint forgetting the offset; recovery keeping lost state; output visible before the checkpoint; aggregates losing the maximum on merge. <strong>All 12 were killed.</strong></li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Apache Flink</strong> is the reference for event-time processing: watermark generators with bounded out-of-orderness, window assigners (tumbling, sliding, session, global), allowed lateness with late firings and side outputs, and Chandy–Lamport-style barrier checkpoints with two-phase-commit sinks for exactly-once to Kafka and databases. <strong>Apache Beam/Dataflow</strong> formalized the model (event time, windows, triggers, accumulation modes: the <em>Dataflow Model</em> paper). <strong>Spark Structured Streaming</strong> has watermarks and stateful aggregations; <strong>Kafka Streams</strong> has windowed state stores with grace periods and changelog-topic checkpoints.</li> <li><strong>Streaming databases</strong> (Materialize, RisingWave, Flink SQL, ksqlDB, ClickHouse materialized views) expose these as SQL: <code>TUMBLE</code>, <code>HOP</code>, <code>SESSION</code> window functions and <code>WATERMARK FOR ts AS ts - INTERVAL '5' SECOND</code>; the maintained result is an incrementally updated table, as in <a href="/cookbook/p/streaming-and-incremental-views">S3</a>.</li> <li><strong>Time-series databases</strong> use the same idea for continuous aggregates and late data (<a href="/cookbook/p/the-time-series-engine">M15</a>: a watermark that late writes pull back).</li> <li><strong>Change data capture</strong> (Debezium) turns a database's transaction log into a stream of changes that these operators consume; exactly-once to the sink is again offsets plus transactions, as in Kafka's transactional producer.</li> <li><strong>Triggers</strong> (when to emit: at the watermark, early every N seconds, on each late element) and <strong>accumulation modes</strong> (discard, accumulate, accumulate-and-retract) are the Beam vocabulary for what this section's grace period and revisions provide in one fixed combination.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>A watermark is a heuristic.</strong> The delay encodes a belief about the data's disorder; a stalled source holds the watermark back for everyone, an idle partition must be declared idle, and a burst of very late data is simply lost unless you counted it.</li> <li><strong>Event time versus processing time</strong>: aggregating by arrival time is simpler and wrong whenever delays vary; clock skew between producers needs handling at the source.</li> <li><strong>State growth</strong> from long windows, large grace periods and high key cardinality is the usual operational failure; monitor open windows and state size, and set time-to-live on keyed state.</li> <li><strong>Exactly-once to external systems needs the sink's cooperation</strong>: idempotent writes (key by window and revision), or a transactional commit tied to the checkpoint. A non-transactional sink gives at-least-once.</li> <li><strong>Retractions must reach consumers</strong>: a downstream system that cannot apply retractions will double-count; choose append-only final results for such sinks and accept the latency.</li> <li><strong>Replay after a crash re-sends events</strong> to operators: operators must be deterministic functions of their input and state, with no hidden clocks or randomness.</li> <li><strong>Session windows and out-of-order data interact</strong>: a late event can merge sessions already emitted by an earlier version of the pipeline; decide the policy (drop, side output, revise) and document it.</li> </ul></aside>
"""

