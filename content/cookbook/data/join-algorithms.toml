```rust title="tests: every algorithm must equal naive nested loop, with NULLs and duplicates"
use proptest::prelude::*;
use std::collections::BTreeMap;
use scratch::joins::*;

fn norm(mut v: Vec<Pair>) -> Vec<Pair> { v.sort_unstable(); v }
fn key() -> impl Strategy<Value = Option<i64>> { prop_oneof![1 => Just(None), 8 => (0i64..12).prop_map(Some)] }

proptest! {
    #[test]
    fn all_joins_agree(r in prop::collection::vec(key(), 0..80), s in prop::collection::vec(key(), 0..80), mem in 1usize..20) {
        let r: Vec<Row> = r.into_iter().enumerate().map(|(i, k)| (k, i as u32)).collect();
        let s: Vec<Row> = s.into_iter().enumerate().map(|(i, k)| (k, 1000 + i as u32)).collect();
        let want = norm(nested_loop(&r, &s));
        prop_assert_eq!(norm(block_nested_loop(&r, &s, 7)), want.clone());
        let mut idx: BTreeMap<i64, Vec<u32>> = BTreeMap::new();
        for &(k, p) in &s { if let Some(k) = k { idx.entry(k).or_default().push(p); } }
        prop_assert_eq!(norm(index_nested_loop(&r, &idx)), want.clone());
        prop_assert_eq!(norm(sort_merge(&r, &s)), want.clone());
        prop_assert_eq!(norm(hash_join(&r, &s)), want.clone());
        prop_assert_eq!(norm(grace_hash_join(&r, &s, mem, 4).0), want.clone());
        // outer join = inner join + unmatched outer rows
        let lo = left_outer_hash_join(&r, &s);
        let matched: Vec<Pair> = lo.iter().filter_map(|&(p, q)| q.map(|q| (p, q))).collect();
        prop_assert_eq!(norm(matched), want.clone());
        let unmatched: Vec<u32> = lo.iter().filter(|x| x.1.is_none()).map(|x| x.0).collect();
        let mut anti = anti_join(&r, &s); anti.sort();
        let mut un = unmatched.clone(); un.sort();
        prop_assert_eq!(un, anti.clone());
        let mut semi = semi_join(&r, &s); semi.sort();
        let mut from_want: Vec<u32> = want.iter().map(|x| x.0).collect(); from_want.sort(); from_want.dedup();
        prop_assert_eq!(semi, from_want);
    }
}

#[test]
fn skew_falls_back() {
    let r: Vec<Row> = (0..5000u32).map(|i| (Some(if i < 4000 { 7 } else { i as i64 }), i)).collect();
    let s: Vec<Row> = (0..300u32).map(|i| (Some(if i < 3 { 7 } else { i as i64 }), 10_000 + i)).collect();
    let (out, st) = grace_hash_join(&r, &s, 256, 8);
    assert_eq!(norm(out), norm(hash_join(&r, &s)));
    eprintln!("skewed grace join: {st:?}");
    assert!(st.bnl_fallbacks >= 1);
}

#[test]
fn lecture_cost_table_and_timing() {
    for (name, io) in costs(1000, 100_000, 500, 40_000, 100) {
        eprintln!("{name:<32} {io:>12} I/Os = {:>10.2} s at 0.1 ms/I/O", io as f64 * 1e-4);
    }
    let (m, n) = (100_000u32, 40_000u32);
    let mut x = 5u64; let mut rnd = || { x ^= x << 13; x ^= x >> 7; x ^= x << 17; (x % 50_000) as i64 };
    let r: Vec<Row> = (0..m).map(|i| (Some(rnd()), i)).collect();
    let s: Vec<Row> = (0..n).map(|i| (Some(rnd()), i)).collect();
    let t = std::time::Instant::now(); let a = hash_join(&r, &s).len(); let th = t.elapsed();
    let t = std::time::Instant::now(); let b = sort_merge(&r, &s).len(); let ts = t.elapsed();
    let t = std::time::Instant::now(); let c = grace_hash_join(&r, &s, 8_192, 16).0.len(); let tg = t.elapsed();
    let t = std::time::Instant::now(); let d = block_nested_loop(&r[..10_000], &s, 1024).len(); let tb = t.elapsed();
    assert!(a == b && b == c);
    eprintln!("in memory, 100k ⋈ 40k: hash {th:?}, sort-merge {ts:?}, grace(mem 8k) {tg:?}; block NLJ on 10k ⋈ 40k: {tb:?} ({d} rows)");
}
```

<aside data-call="warning"><b>NULL semantics in joins</b><p><code>NULL = NULL</code> is UNKNOWN, so NULL keys never match in an inner join. Every algorithm above filters them out <em>before</em> building or partitioning, because a hash table that treats <code>None == None</code> as equal produces spurious matches. For outer joins, NULL-keyed outer rows appear unmatched. For anti joins, <strong><code>NOT EXISTS</code> and <code>NOT IN</code> differ</strong>: <code>NOT EXISTS</code> keeps NULL-keyed outer rows, while <code>NOT IN (subquery)</code> returns <em>nothing</em> if the subquery yields any NULL (<a href="/cookbook/p/modern-sql">L02</a>). The planner must implement <code>NOT IN</code> as a <em>null-aware</em> anti join.</p></aside>

<aside data-call="rust"><b>Returning pairs, not tuples</b><p>The reference joins return <code>(left_id, right_id)</code> pairs. That's late materialization: the caller fetches only the columns it needs. In the executor (<a href="/cookbook/p/grace-hash-join-and-spilling">P3</a>), the same algorithms work on <code>Tuple</code>s, and the output schema is left columns ++ right columns, so an early-materialized join copies both sides into a new <code>Tuple</code>. With Arrow-style batches (Part II), the join emits two index vectors, and a <code>take</code> kernel gathers the columns.</p></aside>
"""

