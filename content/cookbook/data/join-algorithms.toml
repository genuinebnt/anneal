heading = "Choosing a join"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Situation</th> <th>Best algorithm</th> </tr> </thead> <tbody> <tr> <td>Equijoin, build side fits in memory</td> <td>in-memory hash join (build on the smaller side)</td> </tr> <tr> <td>Equijoin, both sides large</td> <td>Grace / partitioned hash join; radix-partitioned in memory (Part II)</td> </tr> <tr> <td>Inputs already sorted on the key (clustered index, previous merge join)</td> <td>sort-merge, with no sort needed</td> </tr> <tr> <td>Outer side tiny, inner side has an index on the key</td> <td>index nested loop</td> </tr> <tr> <td>Non-equality predicate (<code>a.x &lt; b.y</code>, band joins, <code>LIKE</code>)</td> <td>block NLJ (or sort-based band join)</td> </tr> <tr> <td>Severe skew on one key</td> <td>hash join with a skew-aware partition, or sort-merge</td> </tr> <tr> <td>Cyclic multi-way joins (graph patterns, triangles)</td> <td>worst-case optimal joins (Part II)</td> </tr> </tbody> </table></div>

<aside data-call="production"><b>In production</b><ul> <li><strong>PostgreSQL</strong>: nested loop, merge join, and hash join (hybrid-style batching; parallel hash join since v11, with a shared hash table).</li> <li><strong>DuckDB, Velox, Umbra</strong>: radix-partitioned parallel hash joins, spilling per partition, with runtime join filters (min/max, and Bloom where it pays).</li> <li><strong>MySQL</strong>: nested loops only until 8.0.18 added hash join, a good illustration of how long a system can live without one.</li> </ul></aside>
"""

