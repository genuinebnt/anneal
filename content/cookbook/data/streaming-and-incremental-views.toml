[[sections]]
heading = "Measured"
body = """
<p>1 000 000 orders whose customers follow a Zipf(1.0) distribution over 10 007 customers (the hottest customer has about 57 000 orders), 50 regions. The view is the query above with <code>amount &gt;= 10</code>. A batch is a mix of changes (60% new orders, 30% order deletes, 9% customer region changes, 1% customers appearing or disappearing). Single thread, release build; after every measured batch the maintained table is compared with a full recomputation.</p>

```text title="incremental maintenance versus recomputation"
1000000 orders (customers Zipf-skewed over 10007), 10007 customers, 50 regions; view = SUM/COUNT of orders >= 10 joined to customers, grouped by region
initial load as one huge delta: 122 ms (8.2 M rows/s, 909558 state rows); full recomputation: 21 ms
incremental step vs recomputation, by batch size (mix per change: 60% new order, 30% order delete, 9% customer region change, 1% customers appear or disappear)
    batch |    incremental      recompute |       speedup  changes/s (inc)
        1 |         1.3 us        19.6 ms |        14848x           759474
       10 |        10.7 us        21.5 ms |         2015x           935493
      100 |        81.7 us        18.7 ms |          228x          1223805
     1000 |       547.6 us        19.2 ms |           35x          1826297
    10000 |      4097.3 us        19.2 ms |            5x          2440606
   100000 |     31442.0 us        23.0 ms |            1x          3180456
   500000 |     93084.4 us        26.4 ms |            0x          5371468
cost of one customer region change by how many orders the customer has (the join fan-out)
customer                          orders     join rows     step time
hottest customer                   57235        114470     1347.3 us
rank 10                             2469          4938       66.4 us
rank 100                             306           612       15.6 us
rank 1000                            114           228        9.4 us
rank 5000                             67           134        6.0 us
MIN(amount) per customer: load 136 ms, recompute 18 ms; incremental batches of 10 changes: 1.7 us each (10653x faster than recomputing)
```

<ul> <li><strong>A single change costs 1.3 µs; recomputing costs 19.6 ms</strong>: the incremental view is <strong>14 848× cheaper</strong> for one change, 2 015× for ten, 228× for a hundred, 35× for a thousand, 5× for ten thousand.</li> <li><strong>The break-even is a few percent of the data</strong>: at 100 000 changes (10% of the table) the incremental step (31.4 ms) is already slower than recomputing (23.0 ms), and at 500 000 changes it is 3.5× slower. Per change the incremental path costs 0.2 to 1.3 µs (hash updates on two indexes plus the join probes), while a recomputation costs about 20 ns per input row; IVM wins by touching few rows, not by being cheaper per row. This is why streaming engines batch by epoch and why bulk loads bypass the incremental path (the initial load here, one huge delta, takes 122 ms against 21 ms for a direct computation: a 6× overhead).</li> <li><strong>State is roughly the size of the input</strong>: 909 558 rows of state for 1 000 000 inputs (orders that pass the filter, plus customers and the 50 groups). Without state there is no incremental join.</li> <li><strong>Hot keys make updates expensive.</strong> Moving one customer to another region retracts and re-inserts every joined order: for the hottest customer (57 235 orders) that is 114 470 join rows and <strong>1.35 ms</strong>, for the customer of rank 10 66 µs, rank 100 16 µs, rank 5 000 6 µs. A single dimension update to a hot key costs as much as roughly 1 000 to 2 500 order inserts. Systems handle it by batching, by pre-aggregating the fact side before the join, or by rewriting the query so the dimension is joined after the aggregation when possible.</li> <li><strong><code>MIN</code> is non-linear but still incremental</strong>: with a counted multiset per customer, a batch of ten changes costs 1.7 µs against 18 ms for recomputation (10 653×), at the price of the multiset state (the first load takes 136 ms against 18 ms to scan).</li> </ul>

<aside data-call="note"><b>Why the join formula needs the old state</b><p>The identity is <code>(A + ΔA) ⋈ (B + ΔB) − A ⋈ B = ΔA ⋈ B_old + A_old ⋈ ΔB + ΔA ⋈ ΔB</code>. Equivalently <code>ΔA ⋈ B_new + A_old ⋈ ΔB</code>, since <code>B_new = B_old + ΔB</code>. Mixing the two forms (the new state in both terms, or the new state in one term <em>and</em> the cross term) counts rows that arrive together twice; leaving out the cross term loses them. The test <code>same_batch_insert_of_customer_and_orders_is_counted_once</code> exists because dropping the third term is the classic bug.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A Z-set is <code>HashMap&lt;K, i64&gt;</code> with one invariant</strong> (no zero weights) enforced in a single function, <code>z_add</code>; every operator builds on it, so the invariant cannot be violated by accident, and a property test checks it.</li> <li><strong>Operators are structs owning their state with a <code>step(&amp;mut self, delta) -&gt; delta</code> method.</strong> The type system documents that state is private to the operator and updated in place; no <code>Rc&lt;RefCell&lt;…&gt;&gt;</code> is needed for a linear pipeline. For a DAG with fan-out, operators are stored in a <code>Vec</code> and wired by index.</li> <li><strong>Generic over the row type</strong>: <code>Z&lt;K: Hash + Eq + Clone&gt;</code> with closures for <code>filter</code> and <code>map</code> (<code>impl Fn(&amp;K) -&gt; bool</code>) monomorphizes into tight loops; rows are small <code>Copy</code> structs, so cloning is free.</li> <li><strong>Closures capturing the output set</strong>: the <code>emit</code> closure borrows <code>joined</code> mutably for the three join loops and ends before the aggregation reads it; shortening the closure's life is how the borrow checker accepts the code without restructuring.</li> <li><strong>Indexing the second delta by key</strong> (<code>dc_by_key</code>) turns the <code>ΔO ⋈ ΔC</code> term from a nested loop over the batches into a hash probe; the first version was quadratic in the batch size.</li> <li><strong>Unordered maps in tests</strong>: results are compared as maps and sets, never as iteration orders. For deterministic output (golden tests, replay), emit sorted <code>Vec</code>s or use <code>BTreeMap</code>.</li> <li><strong>Test-harness data structures matter</strong>: sampling a random live row from a <code>HashMap</code> with <code>.keys().nth(i)</code> is <code>O(n)</code> and made a million-row benchmark unusable; the harness keeps a <code>Vec</code> plus position map for <code>O(1)</code> sampling and swap-removal.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Group laws (property tests)</strong>: Z-sets never store zero weights; merge is commutative; a set plus its negation is empty; <code>filter(a + b) = filter(a) + filter(b)</code> and the same for <code>map</code> (linearity: the reason these operators are their own incremental versions).</li> <li><strong>The view against recomputation</strong>: 12 seeds × 150 batches of 1–30 random changes (order inserts and deletes, customers appearing, moving region and disappearing, including delete-and-insert of the same customer in one batch); after each batch the materialized table built from the emitted deltas, and the circuit's own state, equal a from-scratch recomputation; every emitted row has weight ±1.</li> <li><strong>The third join term</strong>: an order and its customer inserted in the same batch are counted once; inserting both and deleting both cancels exactly and releases all state; a region change moves the contribution.</li> <li><strong>Filter on deletions</strong>: deleting a row the filter rejected changes nothing.</li> <li><strong>MIN</strong> against recomputation over 10 seeds × 200 batches with deletions of current minima; <strong>DISTINCT</strong> emits only on zero crossings and ignores <code>+3 −3</code>.</li> <li><strong>Mutants run against these tests</strong> (all 11 killed at the first run): the delta-delta join term dropped; customer or order state never integrated; the filter passing every deletion; the old aggregate row not retracted; empty groups kept; zero weights stored; MIN keeping a stale minimum or looking at the maximum; DISTINCT emitting on every change; delta application ignoring removals.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Feldera</strong> (Rust) implements DBSP directly: SQL compiled to incremental circuits over Z-sets, with the formal theory as its specification.</li> <li><strong>Materialize</strong> is built on Timely and Differential Dataflow (McSherry et al.): incrementally maintained SQL views with strict-serializability semantics, arrangements (indexed state shared between operators), and a persistence layer on object storage.</li> <li><strong>RisingWave</strong> (Rust, PostgreSQL-compatible): streaming jobs defined as materialized views; operator state kept in an LSM-tree state store on object storage (Hummock) with in-memory caching; periodic <em>barriers</em> (Chandy–Lamport style, as in Flink) give consistent checkpoints and define the epochs at which results become visible.</li> <li><strong>Apache Flink SQL</strong> represents streams as <em>changelogs</em> with row kinds (insert, update-before, update-after, delete); operators such as joins and aggregations keep keyed state in RocksDB and emit retractions; watermarks and TTLs bound the state.</li> <li><strong>Databases</strong>: PostgreSQL has no built-in incremental materialized views (<code>REFRESH MATERIALIZED VIEW</code> recomputes; the <code>pg_ivm</code> extension maintains simple views on write); Oracle offers <em>fast refresh</em> from materialized view logs; SQL Server maintains <em>indexed views</em> synchronously inside the transaction; Snowflake <em>dynamic tables</em> and Databricks materialized views refresh incrementally on a schedule; ClickHouse materialized views are insert-time transformations, not general IVM.</li> <li><strong>Classical algorithms</strong> behind them: the <em>counting</em> algorithm for non-recursive views (Gupta–Mumick–Subrahmanian) and <em>DRed</em> for recursive ones; <strong>DBToaster</strong> compiles higher-order deltas (the delta of the delta) to avoid keeping join state at all for some queries.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>State grows without bound</strong> unless something bounds it: a join between two unbounded streams keeps both forever. Use windows, watermarks and TTLs, and size the state store for the join, not for the final view.</li> <li><strong>Deletions need the right operators.</strong> MIN, MAX, top-k, DISTINCT and any aggregate that is not invertible need counted or ordered state; <code>SUM</code> and <code>COUNT</code> are invertible and free. A circuit built only from "append-only" assumptions breaks the first time an upstream table is updated.</li> <li><strong>Floating-point sums are not invertible exactly</strong>: adding then subtracting a float does not return the original, so a long-lived incremental <code>SUM(f64)</code> drifts from the recomputed value. Use integers or decimals for money, or periodically recompute.</li> <li><strong>Hot keys are a latency bomb</strong>: one update to a popular dimension row touches every joined fact. Measure the degree distribution of join keys and bound the worst case (batching, pre-aggregation, join reordering).</li> <li><strong>Order of operations inside a step matters</strong>: the join must see the old state; integrating a delta before joining double counts. Make the order explicit and test with same-batch inserts and deletes.</li> <li><strong>Consistency across views</strong>: two views fed by the same input must reflect the same input prefix, or a query joining them sees a state that never existed. Epoch- or timestamp-based visibility is part of the design, not an afterthought.</li> <li><strong>Recomputation is the oracle</strong>: every incremental operator needs a differential test against its batch definition on random streams with deletions, including empty batches and cancelling changes; most production IVM bugs are visible there.</li> <li><strong>Do not incrementalize bulk loads</strong>: for deltas above a few percent of the data, refresh from scratch; the break-even in this lab was about 7%.</li> </ul></aside>
