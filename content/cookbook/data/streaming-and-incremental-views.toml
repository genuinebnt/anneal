[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from the DBSP, differential dataflow and view-maintenance literature and the systems' documentation, not a summary of any talk.)</em></p>

<ul> <li><strong>The problem</strong>: a view <code>V = Q(DB)</code> is expensive to compute and wanted fresh. When the database changes by a small <code>Δ</code>, recomputing <code>Q</code> over everything wastes work proportional to the data; <strong>incremental view maintenance (IVM)</strong> computes the <em>change of the view</em> <code>ΔV</code> from <code>Δ</code> and some retained state. A streaming database is an IVM engine whose views are always on: SQL views over unbounded inputs, results kept current.</li> <li><strong>Changes are rows with signed weights.</strong> Represent a collection as a <strong>Z-set</strong>: a map from row to an integer weight, where an insertion is <code>+1</code>, a deletion is <code>-1</code>, an update is a deletion plus an insertion, and weights add. Z-sets form a group (every change has an inverse), which makes <em>retraction</em> a first-class operation instead of a special case.</li> <li><strong>DBSP</strong> (Budiu et al., VLDB 2023) reduces IVM to four ideas: <em>lift</em> any query to operate on streams of Z-sets, <em>integrate</em> <code>I</code> (a running sum turns a stream of changes into the stream of states), <em>differentiate</em> <code>D</code> (the inverse: states to changes) and <em>delay</em>. The incremental version of any query is <code>Q&#94;Δ = D ∘ Q ∘ I</code>, and algebra on that formula derives efficient circuits: <strong>linear operators</strong> (filter, projection, union, sum) are their own incremental versions, because <code>Q(a + b) = Q(a) + Q(b)</code>; the <strong>join is bilinear</strong>, with <code>Δ(A ⋈ B) = ΔA ⋈ B_old + A_old ⋈ ΔB + ΔA ⋈ ΔB</code>; <strong>non-linear operators</strong> (distinct, min, max, top-k) need state that records enough of the input to react to a deletion. Operators compose by the chain rule, so incrementalizing a whole query is mechanical.</li> <li><strong>State is the price.</strong> An incremental join keeps both inputs (indexed by the join key); a group-by keeps one accumulator per group; <code>MIN</code> keeps a counted multiset per group, because deleting the minimum requires knowing the next one; <code>DISTINCT</code> keeps counts. Streaming engines therefore live or die by their <strong>state store</strong>: in memory, on local disk as an LSM tree, or on object storage with a cache (RisingWave's design), with TTLs and watermarks to bound growth.</li> <li><strong>Updates have a fan-out.</strong> One changed dimension row must retract and re-insert every fact row joined to it; with skewed keys a single update can cost as much as thousands of ordinary ones.</li> <li><strong>Time and consistency are the other half.</strong> Streams arrive out of order and in parallel: engines use <em>watermarks</em> (a promise that no earlier event will arrive), <em>epochs</em> or <em>barriers</em> (a consistent cut across all operators, as in Chandy–Lamport snapshots) so that views reflect a transaction-consistent prefix of the input and recovery restores a checkpoint, and <em>windows</em> to bound state for time-based aggregates.</li> <li><strong>Recursion</strong> (graph reachability, transitive closure) is incrementalized by nested streams (DBSP, differential dataflow) or by classical algorithms for views: <em>counting</em> derivations, and <em>delete-and-rederive</em> (DRed) for deletions.</li> <li><strong>Incremental is not always faster.</strong> The per-change cost of IVM is a constant times a hash-table update, several times a recomputation's per-row cost; it wins when the delta is small relative to the data and loses for bulk loads, which is why systems batch changes per epoch and fall back to a full refresh for huge deltas.</li> </ul>
"""

[[sections]]
heading = "The model in code"
body = """
<p>A <strong>Z-set</strong> is a <code>HashMap&lt;K, i64&gt;</code> that never stores zero weights. The module defines the group operations (add, merge, negate) and the linear operators (filter, map), then a small query as a circuit:</p>

```sql
SELECT region, SUM(amount), COUNT(*)
FROM orders o JOIN customers c ON o.cust = c.id
WHERE o.amount >= thr
GROUP BY region
```

<p>The circuit receives one batch of changes <code>(Δorders, Δcustomers)</code> per step and returns the change of the view:</p>

<ol> <li><strong>Filter</strong> the order delta (linear: deletions are filtered exactly like insertions).</li> <li><strong>Join</strong> with the three-term formula: <code>Δorders ⋈ customers_state</code>, <code>orders_state ⋈ Δcustomers</code>, <code>Δorders ⋈ Δcustomers</code>, all against the <em>old</em> state; only then fold the deltas into the state. Both inputs are indexed by the join key.</li> <li><strong>Aggregate</strong>: add each joined row's weight to the group's <code>(sum, count)</code>; for every group that changed emit the old row with weight <code>-1</code> and the new row with weight <code>+1</code>, and drop groups whose count reaches zero.</li> <li>Elsewhere in the module: <strong>MIN</strong> with a counted multiset per group, and <strong>DISTINCT</strong> emitting only when a count crosses zero.</li> </ol>

<p>The tests compare the incrementally maintained table with a from-scratch <code>recompute</code> after <em>every</em> batch of random inserts, deletes and customer region changes.</p>

:::deeper Reference: Z-sets and linear operators, the incremental join + aggregate circuit, MIN with counted state, DISTINCT
```rust title="src/ivm/mod.rs"
//! Incremental view maintenance in the style of DBSP: collections are Z-sets (rows with integer weights; a deletion is a negative
//! weight), a query is a circuit of operators that consume *deltas* and emit deltas, and the state each operator keeps is the
//! integral of its inputs. Linear operators (filter, project, union, sum) are their own incremental versions; the join is
//! bilinear and needs both integrated inputs; MIN and DISTINCT are non-linear and keep counted state.
use std::collections::{BTreeMap, HashMap};
use std::hash::Hash;

pub type Z<K> = HashMap<K, i64>;

/// `z[k] += w`, dropping the entry when the weight becomes zero (a Z-set never stores zeros).
pub fn z_add<K: Hash + Eq + Clone>(z: &mut Z<K>, k: K, w: i64) {
    if w == 0 { return; }
    let e = z.entry(k.clone()).or_insert(0);
    *e += w;
    if *e == 0 { z.remove(&k); }
}
pub fn z_merge<K: Hash + Eq + Clone>(a: &mut Z<K>, b: &Z<K>) { for (k, w) in b { z_add(a, k.clone(), *w); } }
pub fn z_neg<K: Hash + Eq + Clone>(a: &Z<K>) -> Z<K> { a.iter().map(|(k, w)| (k.clone(), -w)).collect() }
/// Linear operator: filter. Applies to insertions and deletions alike, since both are just weighted rows.
pub fn z_filter<K: Hash + Eq + Clone>(a: &Z<K>, p: impl Fn(&K) -> bool) -> Z<K> { a.iter().filter(|(k, _)| p(k)).map(|(k, w)| (k.clone(), *w)).collect() }
/// Linear operator: map / project (rows that collide add their weights).
pub fn z_map<K: Hash + Eq + Clone, R: Hash + Eq + Clone>(a: &Z<K>, f: impl Fn(&K) -> R) -> Z<R> { let mut o = Z::new(); for (k, w) in a { z_add(&mut o, f(k), *w); } o }

#[derive(Clone, Copy, PartialEq, Eq, Hash, Debug, PartialOrd, Ord)]
pub struct Order { pub id: u32, pub cust: u32, pub amount: i64 }
#[derive(Clone, Copy, PartialEq, Eq, Hash, Debug, PartialOrd, Ord)]
pub struct Cust { pub id: u32, pub region: u32 }

/// `SELECT region, SUM(amount), COUNT(*) FROM orders o JOIN customers c ON o.cust = c.id WHERE o.amount >= thr GROUP BY region`
/// as a row `(region, sum, count)` per non-empty group, recomputed from scratch (the reference semantics).
pub fn recompute(orders: &Z<Order>, custs: &Z<Cust>, thr: i64) -> HashMap<u32, (i64, i64)> {
    let mut by_cust: HashMap<u32, Vec<(u32, i64)>> = HashMap::new();
    for (c, w) in custs { by_cust.entry(c.id).or_default().push((c.region, *w)); }
    let mut out: HashMap<u32, (i64, i64)> = HashMap::new();
    for (o, wo) in orders {
        if o.amount < thr { continue; }
        for &(region, wc) in by_cust.get(&o.cust).map_or(&[][..], |v| &v[..]) {
            let e = out.entry(region).or_insert((0, 0));
            e.0 += wo * wc * o.amount;
            e.1 += wo * wc;
        }
    }
    out.retain(|_, v| v.1 != 0);
    out
}

/// The incremental circuit for the query above. State = the integral of each input after the filter, indexed by join key, plus the
/// current aggregate per region.
pub struct View {
    thr: i64,
    orders: HashMap<u32, Z<Order>>,
    custs: HashMap<u32, Z<Cust>>,
    pub agg: HashMap<u32, (i64, i64)>,
    pub join_rows: u64,
}
pub type ViewDelta = Z<(u32, i64, i64)>;

impl View {
    pub fn new(thr: i64) -> Self { View { thr, orders: HashMap::new(), custs: HashMap::new(), agg: HashMap::new(), join_rows: 0 } }

    /// Consume one batch of changes and return the change of the view as a Z-set of `(region, sum, count)` rows
    /// (the old row with weight -1 and the new row with weight +1 for every region that changed).
    pub fn step(&mut self, d_orders: &Z<Order>, d_custs: &Z<Cust>) -> ViewDelta {
        let thr = self.thr;
        let fo = z_filter(d_orders, |o| o.amount >= thr);                    // linear: its own incremental version
        // Δ(O ⋈ C) = ΔO ⋈ C_old  +  O_old ⋈ ΔC  +  ΔO ⋈ ΔC
        let mut joined: Z<(u32, i64)> = Z::new();                            // (region, amount) with weight
        let mut emit = |region: u32, amount: i64, w: i64, rows: &mut u64| { z_add(&mut joined, (region, amount), w); *rows += 1; };
        let mut rows = 0u64;
        for (o, wo) in &fo {
            if let Some(cs) = self.custs.get(&o.cust) { for (c, wc) in cs { emit(c.region, o.amount, wo * wc, &mut rows); } }
        }
        for (c, wc) in d_custs {
            if let Some(os) = self.orders.get(&c.id) { for (o, wo) in os { emit(c.region, o.amount, wo * wc, &mut rows); } }
        }
        let mut dc_by_key: HashMap<u32, Vec<(Cust, i64)>> = HashMap::new();
        for (c, wc) in d_custs { dc_by_key.entry(c.id).or_default().push((*c, *wc)); }
        for (o, wo) in &fo {
            if let Some(cs) = dc_by_key.get(&o.cust) { for (c, wc) in cs { emit(c.region, o.amount, wo * wc, &mut rows); } }
        }
        self.join_rows += rows;
        // integrate the inputs (after the join used the old state)
        for (o, w) in &fo { let m = self.orders.entry(o.cust).or_default(); z_add(m, *o, *w); if m.is_empty() { self.orders.remove(&o.cust); } }
        for (c, w) in d_custs { let m = self.custs.entry(c.id).or_default(); z_add(m, *c, *w); if m.is_empty() { self.custs.remove(&c.id); } }
        // incremental SUM / COUNT by region: linear, so the state just accumulates
        let mut touched: HashMap<u32, (i64, i64)> = HashMap::new();
        for (&(region, amount), &w) in &joined {
            let e = touched.entry(region).or_insert((0, 0));
            e.0 += w * amount;
            e.1 += w;
        }
        let mut out = ViewDelta::new();
        for (region, (ds, dc)) in touched {
            if ds == 0 && dc == 0 { continue; }
            let old = self.agg.get(&region).copied();
            let new = (old.map_or(0, |o| o.0) + ds, old.map_or(0, |o| o.1) + dc);
            if let Some(o) = old { z_add(&mut out, (region, o.0, o.1), -1); }
            if new.1 != 0 { z_add(&mut out, (region, new.0, new.1), 1); self.agg.insert(region, new); } else { self.agg.remove(&region); }
        }
        out
    }
    pub fn state_rows(&self) -> usize { self.orders.values().map(|m| m.len()).sum::<usize>() + self.custs.values().map(|m| m.len()).sum::<usize>() + self.agg.len() }
}

/// Integrate a stream of view deltas into a materialized table (what a downstream consumer would do).
pub fn apply_delta(table: &mut HashMap<u32, (i64, i64)>, d: &ViewDelta) {
    for (&(region, s, c), &w) in d { if w < 0 { table.remove(&region); } else if w > 0 { table.insert(region, (s, c)); } }
    // a region present with weight -1 and +1 in the same delta ends up with the new row: apply removals first, then insertions
    for (&(region, s, c), &w) in d { if w > 0 { table.insert(region, (s, c)); } }
}

/// `SELECT cust, MIN(amount) FROM orders GROUP BY cust`. MIN is not linear: after a deletion the new minimum is unknown without the
/// other values, so each group keeps a counted multiset (`amount -> count`).
#[derive(Default)]
pub struct MinView { groups: HashMap<u32, BTreeMap<i64, i64>>, pub current: HashMap<u32, i64> }
impl MinView {
    pub fn step(&mut self, d: &Z<Order>) -> Z<(u32, i64)> {
        let mut changed: Vec<u32> = vec![];
        for (o, w) in d {
            let g = self.groups.entry(o.cust).or_default();
            let c = g.entry(o.amount).or_insert(0);
            *c += w;
            if *c == 0 { g.remove(&o.amount); }
            changed.push(o.cust);
        }
        changed.sort_unstable(); changed.dedup();
        let mut out = Z::new();
        for c in changed {
            let new = self.groups.get(&c).and_then(|g| g.keys().next().copied());
            let old = self.current.get(&c).copied();
            if new != old {
                if let Some(o) = old { z_add(&mut out, (c, o), -1); }
                if let Some(n) = new { z_add(&mut out, (c, n), 1); self.current.insert(c, n); } else { self.current.remove(&c); }
            }
            if self.groups.get(&c).is_some_and(|g| g.is_empty()) { self.groups.remove(&c); }
        }
        out
    }
}
pub fn recompute_min(orders: &Z<Order>) -> HashMap<u32, i64> {
    let mut m: HashMap<u32, i64> = HashMap::new();
    for (o, w) in orders { if *w > 0 { let e = m.entry(o.cust).or_insert(i64::MAX); *e = (*e).min(o.amount); } }
    m
}

/// Incremental DISTINCT: emits a row only when its count crosses zero.
#[derive(Default)]
pub struct Distinct<K: Hash + Eq + Clone> { counts: Z<K> }
impl<K: Hash + Eq + Clone> Distinct<K> {
    pub fn new() -> Self { Distinct { counts: Z::new() } }
    pub fn step(&mut self, d: &Z<K>) -> Z<K> {
        let mut out = Z::new();
        for (k, w) in d {
            let before = self.counts.get(k).copied().unwrap_or(0);
            z_add(&mut self.counts, k.clone(), *w);
            let after = self.counts.get(k).copied().unwrap_or(0);
            match (before > 0, after > 0) { (false, true) => z_add(&mut out, k.clone(), 1), (true, false) => z_add(&mut out, k.clone(), -1), _ => {} }
        }
        out
    }
}
```
