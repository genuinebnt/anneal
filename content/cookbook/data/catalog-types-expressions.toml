[[sections]]
heading = "Overview"
body = """
<p>Executors need three things that are not storage: a <strong>catalog</strong> that says what tables, columns and indexes exist; <strong>expressions</strong> that compute over rows; and <strong>types</strong> that decide what <code>1 + 2.5</code> means. BusTub gives you these. Writing a minimal version first makes every later executor much shorter, because the rest of the engine is built on exactly these three pieces.</p>
"""

[[sections]]
heading = "Catalog"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Object</th> <th>Holds</th> <th>Used by</th> </tr> </thead> <tbody> <tr> <td><code>Schema</code> / <code>Column</code></td> <td>name, type, and the <strong>table qualifier</strong> (<code>e.name</code> vs <code>d.name</code>)</td> <td>the binder (name resolution), every executor (output shape)</td> </tr> <tr> <td><code>TableInfo</code></td> <td>oid, name, schema, tuple layout, the table heap</td> <td>scans, DML</td> </tr> <tr> <td><code>IndexInfo</code></td> <td>name, table, key column, the B+Tree</td> <td>index scans, index joins, DML maintenance</td> </tr> </tbody> </table></div>

<p>Name resolution is the first place SQL semantics bite: <code>resolve(qualifier, name)</code> returns the index of the one matching column and fails for <strong>zero matches</strong> (unknown column) and for <strong>two matches</strong> (<code>SELECT id FROM emp JOIN dept …</code> where both have <code>id</code>: ambiguous). A self-join works only because each side's schema is re-qualified with its alias (<code>e</code>, <code>b</code>).</p>

:::deeper Catalog, schema resolution, index creation with backfill, type coercion
```rust title="src/catalog/catalog.rs"
//! Catalog: schemas, tables (heap + codec layout), indexes (B+Tree on one integer column).
use crate::buffer::arc_replacer::ArcReplacer;
use crate::buffer::buffer_pool_manager::BufferPoolManager;
use crate::storage::index::b_plus_tree::BPlusTree;
use crate::storage::table::tuple_codec::{ColType, Layout};
use crate::storage::table::table_heap::TableHeap;
use crate::types::value::Value;
use super::{err, Result};

pub type Bpm = BufferPoolManager<ArcReplacer>;

#[derive(Clone, Debug, PartialEq)]
pub struct Column { pub name: String, pub ty: ColType, pub table: Option<String> }

#[derive(Clone, Debug, Default, PartialEq)]
pub struct Schema { pub cols: Vec<Column> }

impl Schema {
    pub fn new(cols: Vec<Column>) -> Self { Schema { cols } }
    pub fn len(&self) -> usize { self.cols.len() }
    pub fn is_empty(&self) -> bool { self.cols.is_empty() }
    /// Resolve `[qual.]name`, rejecting ambiguity (two tables with the same column name).
    pub fn resolve(&self, qual: Option<&str>, name: &str) -> Result<usize> {
        let hits: Vec<usize> = self.cols.iter().enumerate()
            .filter(|(_, c)| c.name.eq_ignore_ascii_case(name)
                && qual.is_none_or(|q| c.table.as_deref().is_some_and(|t| t.eq_ignore_ascii_case(q))))
            .map(|(i, _)| i).collect();
        match hits.as_slice() {
            [i] => Ok(*i),
            [] => err(format!("column {}{name} not found", qual.map(|q| format!("{q}.")).unwrap_or_default())),
            _ => err(format!("column reference {name} is ambiguous")),
        }
    }
    pub fn join(&self, other: &Schema) -> Schema { Schema { cols: self.cols.iter().chain(&other.cols).cloned().collect() } }
    pub fn with_qualifier(&self, q: &str) -> Schema {
        Schema { cols: self.cols.iter().map(|c| Column { table: Some(q.to_string()), ..c.clone() }).collect() }
    }
}

pub struct TableInfo<'a> { pub oid: u32, pub name: String, pub schema: Schema, pub layout: Layout, pub heap: TableHeap<'a, ArcReplacer> }
pub struct IndexInfo<'a> { pub oid: u32, pub name: String, pub table: String, pub col: usize, pub tree: BPlusTree<'a, ArcReplacer> }

pub struct Catalog<'a> { pub bpm: &'a Bpm, pub tables: Vec<TableInfo<'a>>, pub indexes: Vec<IndexInfo<'a>> }

/// Order-preserving i64 -> u64 for B+Tree keys: flip the sign bit.
pub fn index_key(v: &Value) -> Option<u64> { match v { Value::Int(i) => Some((*i as u64) ^ (1 << 63)), _ => None } }

impl<'a> Catalog<'a> {
    pub fn new(bpm: &'a Bpm) -> Self { Catalog { bpm, tables: vec![], indexes: vec![] } }

    pub fn table(&self, name: &str) -> Result<&TableInfo<'a>> {
        self.tables.iter().find(|t| t.name.eq_ignore_ascii_case(name)).map_or_else(|| err(format!("table {name} does not exist")), Ok)
    }

    pub fn create_table(&mut self, name: &str, cols: Vec<(String, ColType)>) -> Result<()> {
        if self.table(name).is_ok() { return err(format!("table {name} already exists")); }
        let types: Vec<ColType> = cols.iter().map(|c| c.1).collect();
        let schema = Schema::new(cols.into_iter().map(|(n, ty)| Column { name: n, ty, table: Some(name.to_string()) }).collect());
        let heap = TableHeap::create(self.bpm).map_err(|e| super::Error(format!("{e:?}")))?;
        self.tables.push(TableInfo { oid: self.tables.len() as u32, name: name.to_string(), schema, layout: Layout::new(&types), heap });
        Ok(())
    }

    pub fn indexes_on(&self, table: &str) -> impl Iterator<Item = &IndexInfo<'a>> {
        let t = table.to_string();
        self.indexes.iter().filter(move |i| i.table.eq_ignore_ascii_case(&t))
    }

    /// Unique B+Tree index on one INTEGER/BIGINT column; existing rows are bulk-inserted.
    pub fn create_index(&mut self, name: &str, table: &str, col: &str) -> Result<()> {
        let t = self.table(table)?;
        let ci = t.schema.resolve(None, col)?;
        if !matches!(t.schema.cols[ci].ty, ColType::Int | ColType::BigInt) { return err("only integer columns can be indexed".into()); }
        let tree = BPlusTree::new(self.bpm, 255, 255, 0).map_err(|e| super::Error(format!("{e:?}")))?;
        for r in t.heap.iter().map_err(|e| super::Error(format!("{e:?}")))? {
            let (rid, meta, bytes) = r.map_err(|e| super::Error(format!("{e:?}")))?;
            if meta.deleted { continue; }
            let v = t.layout.decode_col(&bytes, ci);
            let Some(k) = index_key(&v) else { continue };             // NULLs aren't indexed
            if !tree.insert(k, crate::storage::index::b_plus_tree::pack_rid(rid.page.0, rid.slot)).map_err(|e| super::Error(format!("{e:?}")))? {
                return err(format!("could not create unique index {name}: duplicate key {v:?}"));
            }
        }
        self.indexes.push(IndexInfo { oid: self.indexes.len() as u32, name: name.to_string(), table: t.name.clone(), col: ci, tree });
        Ok(())
    }
}

/// Cast a value into a column's type (the binder's job in a full system).
pub fn coerce(v: Value, ty: ColType) -> Result<Value> {
    use Value::*;
    Ok(match (v, ty) {
        (Null, _) => Null,
        (Int(i), ColType::Int) => { if i32::try_from(i).is_err() { return err(format!("integer out of range: {i}")); } Int(i) }
        (Int(i), ColType::BigInt) => Int(i),
        (Int(i), ColType::Float) => Float(i as f64),
        (Float(f), ColType::Float) => Float(f),
        (Float(f), ColType::Int | ColType::BigInt) => Int(f.round() as i64),
        (Bool(b), ColType::Bool) => Bool(b),
        (Text(s), ColType::Varchar) => Text(s),
        (Int(i), ColType::Varchar) => Text(i.to_string().into()),
        (v, ty) => return err(format!("cannot store {v:?} in a {ty:?} column")),
    })
}
