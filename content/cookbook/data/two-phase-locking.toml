[[sections]]
heading = "Deadlock detection and prevention, compared"
body = """
<p>Each decision procedure is a few lines inside <code>acquire</code>:</p>

```rust
// Wait-Die: an older requester waits; a younger one dies instead of waiting for anyone older.
Policy::WaitDie => if blockers.iter().any(|&b| b < t) { return Err(Abort::Die) },

// Wound-Wait: a younger blocker is wounded (condemned); the requester then waits for it to let go.
Policy::WoundWait => for &b in blockers.iter().filter(|&&b| b > t) { victims.insert(b, Abort::Wounded); },

// Detection: wait, and let a background pass find cycles in the waits-for graph.
Policy::Detect => {}
```

<p>Detection runs a DFS over <code>waiter → blocker</code> edges, condemns the <strong>youngest</strong> member of each cycle, and repeats until the graph is acyclic (ignoring condemned waiters). The test makes the lecture's example happen with real threads: T1 holds A and wants B, T2 holds B and wants A; the graph shows <code>[(1,2), (2,1)]</code>, the detector picks T2, T2's <code>lock</code> returns <code>Err(Deadlock)</code>, it releases, and T1 proceeds. The <em>upgrade deadlock</em> (two S holders both asking for X on the same row) is detected the same way, with no special case.</p>
"""

[[sections]]
heading = "Measured: 8 threads, transfers between random accounts"
body = """
<p>Each transaction moves 1 unit between two accounts, 8 000 transactions per row; <em>X first</em> locks both rows exclusively up front (the <code>FOR UPDATE</code> style), <em>S then X</em> reads under S locks and then upgrades; <em>sorted</em> acquires locks in a global order. The detector wakes every 1 ms.</p>

```text title="txn/s and abort rate, 4 hot accounts vs 64 accounts"
policy     access     lockorder accts      txn/s    aborts    abort%
Detect     X first    random        4       3506      1772     18.1%
Detect     S then X   random        4       1214      7822     49.4%
Detect     X first    sorted        4      63357         0      0.0%
WaitDie    X first    random        4      51872     57605     87.8%
WaitDie    S then X   random        4      21942    117740     93.6%
WaitDie    X first    sorted        4      75145     45422     85.0%
WoundWait  X first    random        4      19232     21524     72.9%
WoundWait  S then X   random        4      11284     35500     81.6%
WoundWait  X first    sorted        4      49621      4229     34.6%
Detect     X first    random       64     195570         5      0.1%
Detect     S then X   random       64      12859       803      9.1%
Detect     X first    sorted       64     310286         0      0.0%
WaitDie    X first    random       64     304018      2434     23.3%
WaitDie    S then X   random       64     228687      6267     43.9%
WaitDie    X first    sorted       64     333023      4480     35.9%
WoundWait  X first    random       64     207174       236      2.9%
WoundWait  S then X   random       64     127924      1390     14.8%
WoundWait  X first    sorted       64     208793       253      3.1%
```

<p>What the table teaches:</p>

<ul> <li><strong>Taking the right lock first is the biggest lever.</strong> <em>S then X</em> versus <em>X first</em> costs 3× throughput under detection (1 214 vs 3 506/s) and 15× at 64 accounts (12 859 vs 195 570/s), because every pair of concurrent upgraders deadlocks. This is why <code>SELECT … FOR UPDATE</code> exists.</li> <li><strong>A global lock order removes deadlocks entirely</strong>, and detection then costs nothing: 0 aborts, 63 357/s (18× the random-order run). Applications and internal code that can sort their keys should.</li> <li><strong>Prevention is conservative.</strong> Wait-Die aborts on <em>possible</em> deadlock, not actual: even with sorted locks it aborts 85% of attempts at 4 accounts (no deadlock was possible!). It still wins on the hot random-order workload (51 872/s vs 3 506/s), because a detection-based deadlock stalls two threads for up to a detector interval, while prevention kills the loser immediately and retries. Wound-Wait aborts far less when sorted (34.6%) and stays calm when contention is low (2.9% at 64 accounts).</li> <li><strong>When deadlocks are rare, detection wins</strong> (0.1% aborts at 64 accounts, no restarts needed); when they are frequent, a short detector interval or prevention wins. The interval is the knob: 1 ms here, 1 s by default in PostgreSQL (<code>deadlock_timeout</code>, which first <em>waits</em> and only then runs the detector, so most lock waits never pay for a graph search).</li> </ul>

<aside data-call="testing"><b>Verifying a lock manager</b><ul> <li><strong>Matrix and lattice</strong>: assert the full 5×5 compatibility table against a literal, symmetry, <code>lub(IX, S) = SIX</code>, <code>X.covers(everything)</code>.</li> <li><strong>Deterministic scenarios with real threads</strong>: spin until <code>waits_for()</code> shows the edge you expect instead of sleeping, then act. No flaky timing.</li> <li><strong>Fairness</strong>: queue a writer behind a reader and assert a <em>new</em> reader is refused.</li> <li><strong>Policies</strong>: wait-die and wound-wait outcomes for older/younger requesters; wounded transaction's <em>next</em> lock call fails; <code>release_all</code> lets the wounder proceed.</li> <li><strong>Conservation workload</strong>: 6 threads of random transfers under all 3 policies × 2 access styles; the total balance is invariant and the lock table is empty at the end (no leaked locks).</li> <li><strong>Close the loop with L17</strong>: record every read, write and commit while holding the locks, keep the committed attempts, and feed the schedule to <code>is_conflict_serializable</code> and <code>is_strict</code>. All six policy/style combinations produce conflict-serializable, strict schedules.</li> </ul></aside>

<aside data-call="warning"><b>Lock manager pitfalls</b><ul> <li><strong>Releasing the lock table's mutex before blocking</strong> without re-checking state: you wake up and use a stale decision. Always loop: <em>check → decide → wait → re-check</em>.</li> <li><strong>Forgetting to remove a waiter</strong> when it is aborted or times out: the phantom request blocks everyone behind it. Every exit path must <code>retain(|w| w.txn != t)</code>.</li> <li><strong>Restarting with a fresh timestamp</strong> under wait-die/wound-wait: the victim stays young and may starve. Keep the original priority; assign new ids only under detection.</li> <li><strong>Undo after release</strong>: roll back changes <em>before</em> releasing locks, or someone reads a half-undone row.</li> <li><strong>Lock escalation under concurrency</strong>: converting 10 000 row locks to a table lock can deadlock with another escalator; escalate with a <code>try</code> and fall back to staying fine-grained.</li> </ul></aside>

<aside data-call="production"><b>Locking in real systems</b><ul> <li><strong>PostgreSQL</strong>: row locks live in the <em>tuple header</em> (xmax + infomask bits), not in the lock table, so locking a million rows costs no memory; the heavyweight lock manager (8 modes, table level) handles tables, relations, and advisory locks. Deadlock detector runs after <code>deadlock_timeout</code> (1 s).</li> <li><strong>MySQL/InnoDB</strong>: record locks, <strong>gap locks</strong> and <strong>next-key locks</strong> (record + gap before it) on index entries prevent phantoms under REPEATABLE READ; deadlock detection on a waits-for graph, victim with the least undo.</li> <li><strong>SQL Server / DB2</strong>: lock escalation after ~5 000 row locks; many lock modes beyond S/X/I* (update locks <code>U</code> avoid the upgrade deadlock: take U when you read for update, and only one U can be held).</li> <li><strong>Spanner, CockroachDB</strong>: distributed 2PL or lock-table-per-range with wound-wait for deadlock avoidance (Spanner), because a global waits-for graph is impractical.</li> </ul></aside>
"""

