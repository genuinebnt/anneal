[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Locks vs latches</strong>: latches protect the DBMS's <em>internal data structures</em> from threads, are held for microseconds, and are managed by discipline (ordering, crabbing). <strong>Locks</strong> protect <em>database objects</em> from <em>transactions</em>, are held until commit, and live in a central <strong>lock manager</strong> because the DBMS can't control application logic. The lock table needn't be durable: after a crash every active transaction aborts anyway.</li> <li><strong>Modes</strong>: <strong>S</strong> (many readers) and <strong>X</strong> (one writer). Locks alone don't give serializability; a <em>protocol</em> for how they are used does.</li> <li><strong>2PL</strong>: <em>growing</em> phase (only acquire), then <em>shrinking</em> phase (only release; begins at the first release). Pessimistic, needs no knowledge of future queries, <strong>guarantees an acyclic dependency graph</strong>: the order in which transactions reach their <em>lock point</em> is a valid serial order. Weaknesses: <strong>cascading aborts</strong> (releases before commit expose dirty data), dirty reads, deadlocks, and it rejects some serializable schedules.</li> <li><strong>Strong strict 2PL (rigorous)</strong>: release <em>everything at commit or abort</em>. Schedules are <strong>strict</strong>, so abort is a plain restore of before-images, there are no cascades, and it is what the DBMS actually runs. <em>Strict 2PL</em> (release only S locks early) is weaker. Universe: serial ⊂ strong strict 2PL ⊂ conflict-serializable ⊂ view-serializable ⊂ all.</li> <li><strong>Deadlock</strong> = a cycle of waiters. <strong>Detection</strong>: a <strong>waits-for graph</strong> (edge Tᵢ → Tⱼ: Tᵢ waits for a lock Tⱼ holds); a background thread looks for cycles (no latches needed: a missed cycle is found next pass) and aborts a <strong>victim</strong>. Frequency trades CPU against how long deadlocked transactions stall. Victim heuristics: age, progress, locks held, work to undo, number of past restarts (anti-starvation). Rollback fully or to a <strong>savepoint</strong>.</li> <li><strong>Prevention</strong>: transactions get a <strong>timestamp priority</strong> (older = higher), and it is reused on restart so nobody starves. <strong>Wait-Die</strong>: older requester <em>waits</em>, younger requester <em>dies</em>. <strong>Wound-Wait</strong>: older requester <em>wounds</em> (aborts) the holder, younger requester <em>waits</em>. Mnemonic for X-Y: if the requester has <em>higher</em> priority it does X, otherwise Y. Both only allow waiting in one direction, so no cycles.</li> <li><strong>Granularity</strong>: locking a billion rows one at a time kills the lock manager; locking the table for one read kills parallelism. A <strong>hierarchy</strong> (database → table → page → tuple → attribute) with <strong>intention locks</strong>: <strong>IS</strong>, <strong>IX</strong>, <strong>SIX</strong> on ancestors announce explicit locks below. Escalate to a coarser lock when a transaction holds many fine ones.</li> <li><strong>In practice</strong>: applications rarely lock explicitly, but <code>SELECT … FOR UPDATE / FOR SHARE</code> avoids the read-then-upgrade deadlock in read-modify-write code, and <code>SKIP LOCKED</code> turns a table into a work queue.</li> </ul>
"""

[[sections]]
heading = "Lock manager design"
body = """
<p>The table maps each resource to a <strong>queue</strong>: the <em>granted group</em> and a FIFO of <em>waiting requests</em>. Five rules make it correct and fair:</p>

<ol> <li><strong>Compatibility matrix.</strong> A request is granted when its mode is compatible with every holder:</li> </ol>

<div class="cb-g-tt"><table> <thead> <tr> <th></th> <th>IS</th> <th>IX</th> <th>S</th> <th>SIX</th> <th>X</th> </tr> </thead> <tbody> <tr> <td><strong>IS</strong></td> <td>✓</td> <td>✓</td> <td>✓</td> <td>✓</td> <td></td> </tr> <tr> <td><strong>IX</strong></td> <td>✓</td> <td>✓</td> <td></td> <td></td> <td></td> </tr> <tr> <td><strong>S</strong></td> <td>✓</td> <td></td> <td>✓</td> <td></td> <td></td> </tr> <tr> <td><strong>SIX</strong></td> <td>✓</td> <td></td> <td></td> <td></td> <td></td> </tr> <tr> <td><strong>X</strong></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr> </tbody> </table></div>

<ol start="2"> <li><strong>FIFO.</strong> A fresh request is also blocked by <em>incompatible requests queued ahead of it</em>. Without this, a steady stream of readers starves a waiting writer forever.</li> <li><strong>Re-entrancy and upgrade.</strong> A transaction asking for a mode it already covers returns immediately; asking for more computes the <em>least upper bound</em> (IX + S = SIX, anything + X = X) and waits only for <em>other holders</em>. Upgrades jump the queue; otherwise an upgrade would wait behind requests that wait for it.</li> <li><strong>Intention locks go on top-down, release bottom-up.</strong> To lock a row in S take IS on the table first; to lock a row in X take IX. A table-level S (scan) then conflicts with IX, so writers below can't sneak in, while IS/IS and IX/IX proceed in parallel.</li> <li><strong>Release only at commit/abort</strong> (strong strict 2PL). <code>release_all(t)</code> is the only exit; an <code>unlock</code> for plain 2PL flips the transaction into <em>shrinking</em> and every later <code>lock</code> is refused.</li> </ol>

<aside data-call="rust"><b>Rust design notes</b><ul> <li><strong>One <code>Mutex&lt;Inner&gt;</code> plus one <code>Condvar</code></strong> is enough to be correct and simple; waiters re-check their predicate after every <code>notify_all</code> (spurious wakeups are normal). A production lock manager shards the table by <code>hash(resource)</code> and gives each queue its own mutex and condvar (or parks threads individually) to avoid the thundering herd.</li> <li><strong>Abort as a value</strong>: <code>Result&lt;(), Abort&gt;</code> makes "you were chosen as victim" an ordinary error that <code>?</code> propagates up to the retry loop, where the transaction's undo and <code>release_all</code> run. Never abort by panicking.</li> <li><strong>Condemned flags</strong>: a victim might be <em>running</em>, not waiting, when it is wounded. The manager records it in a <code>victims</code> map; the next <code>lock()</code> or an explicit <code>check()</code> before commit reports it. Waiting victims are woken by <code>notify_all</code> and see the flag.</li> <li><strong>Resources are <code>Copy</code> enums</strong> (<code>Table(u32)</code>, <code>Row(u32, u64)</code>): cheap hash keys, no allocation per lock.</li> <li><strong><code>try_lock</code></strong> shares the same code path with <code>block = false</code>: that is <code>NOWAIT</code> / <code>SKIP LOCKED</code> for free.</li> </ul></aside>

:::deeper Reference: lock manager (modes, queues, upgrades, wait-die, wound-wait, waits-for detector)
```rust title="src/txn/lock_manager.rs"
//! Transaction lock manager: S/X/IS/IX/SIX modes, FIFO queues, upgrades,
//! three deadlock policies (detection, wait-die, wound-wait), strict 2PL release.
use std::collections::{HashMap, HashSet, VecDeque};
use std::sync::atomic::{AtomicBool, Ordering};
use std::sync::{Condvar, Mutex};
use std::time::Duration;

/// Doubles as the priority: a smaller id is an older, higher-priority transaction.
pub type TxnId = u64;

#[derive(Clone, Copy, PartialEq, Eq, Debug, Hash)]
pub enum Mode { IS, IX, S, SIX, X }

impl Mode {
    /// Compatibility matrix (symmetric). Rows/cols: IS IX S SIX X.
    pub fn compatible(self, other: Mode) -> bool {
        const T: [[bool; 5]; 5] = [
            [true, true, true, true, false],
            [true, true, false, false, false],
            [true, false, true, false, false],
            [true, false, false, false, false],
            [false, false, false, false, false],
        ];
        T[self as usize][other as usize]
    }

    /// `self` grants at least everything `other` does.
    pub fn covers(self, other: Mode) -> bool {
        use Mode::*;
        self == other
            || matches!((self, other), (X, _) | (SIX, IS | IX | S) | (S, IS) | (IX, IS))
    }

    /// Least upper bound: the weakest mode that covers both (used for upgrades).
    pub fn lub(self, other: Mode) -> Mode {
        use Mode::*;
        if self.covers(other) { self }
        else if other.covers(self) { other }
        else if matches!((self, other), (IX, S) | (S, IX)) { SIX }
        else { X }
    }
}

#[derive(Clone, Copy, PartialEq, Eq, Debug, Hash)]
pub enum Resource { Table(u32), Row(u32, u64) }

#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Policy { Detect, WaitDie, WoundWait }

#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Abort { Deadlock, Die, Wounded, Shrinking }

struct Req { txn: TxnId, mode: Mode }

#[derive(Default)]
struct Queue { granted: Vec<(TxnId, Mode)>, waiting: VecDeque<Req> }

impl Queue {
    /// Everyone `t` must wait for to get `target`: incompatible holders, plus (for a
    /// fresh request) incompatible requests queued ahead of it, which keeps the queue FIFO.
    fn blockers(&self, t: TxnId, target: Mode, upgrade: bool) -> Vec<TxnId> {
        let mut out: Vec<TxnId> = self.granted.iter()
            .filter(|&&(o, m)| o != t && !m.compatible(target)).map(|&(o, _)| o).collect();
        if !upgrade {
            for w in self.waiting.iter().take_while(|w| w.txn != t) {
                if !w.mode.compatible(target) { out.push(w.txn); }
            }
        }
        out
    }
}

#[derive(Default)]
struct Inner {
    q: HashMap<Resource, Queue>,
    held: HashMap<TxnId, Vec<Resource>>,
    shrinking: HashSet<TxnId>,
    victims: HashMap<TxnId, Abort>,
}

pub struct LockManager { policy: Policy, inner: Mutex<Inner>, cv: Condvar }

impl LockManager {
    pub fn new(policy: Policy) -> Self {
        Self { policy, inner: Mutex::new(Inner::default()), cv: Condvar::new() }
    }

    pub fn lock(&self, t: TxnId, r: Resource, m: Mode) -> Result<(), Abort> {
        self.acquire(t, r, m, true).map(|_| ())
    }

    /// Never blocks: `Ok(false)` if the lock isn't immediately available (SKIP LOCKED).
    pub fn try_lock(&self, t: TxnId, r: Resource, m: Mode) -> Result<bool, Abort> {
        self.acquire(t, r, m, false)
    }

    /// Row lock with the matching intention lock on its table.
    pub fn lock_row(&self, t: TxnId, table: u32, row: u64, m: Mode) -> Result<(), Abort> {
        assert!(matches!(m, Mode::S | Mode::X));
        self.lock(t, Resource::Table(table), if m == Mode::S { Mode::IS } else { Mode::IX })?;
        self.lock(t, Resource::Row(table, row), m)
    }

    fn acquire(&self, t: TxnId, r: Resource, want: Mode, block: bool) -> Result<bool, Abort> {
        let mut g = self.inner.lock().unwrap();
        loop {
            let inn = &mut *g;
            if let Some(&why) = inn.victims.get(&t) {
                if let Some(q) = inn.q.get_mut(&r) { q.waiting.retain(|w| w.txn != t); }
                return Err(why);
            }
            if inn.shrinking.contains(&t) { return Err(Abort::Shrinking); }
            let q = inn.q.entry(r).or_default();
            let held = q.granted.iter().find(|g| g.0 == t).map(|g| g.1);
            let target = match held {
                Some(h) if h.covers(want) => return Ok(true),
                Some(h) => h.lub(want),
                None => want,
            };
            let blockers = q.blockers(t, target, held.is_some());
            if blockers.is_empty() {
                q.waiting.retain(|w| w.txn != t);
                match held {
                    Some(_) => q.granted.iter_mut().find(|g| g.0 == t).unwrap().1 = target,
                    None => {
                        q.granted.push((t, target));
                        inn.held.entry(t).or_default().push(r);
                    }
                }
                return Ok(true);
            }
            if !block {
                q.waiting.retain(|w| w.txn != t);
                return Ok(false);
            }
            match self.policy {
                Policy::Detect => {}
                // older waits for younger; a younger requester dies instead of waiting
                Policy::WaitDie => if blockers.iter().any(|&b| b < t) {
                    q.waiting.retain(|w| w.txn != t);
                    return Err(Abort::Die);
                },
                // a younger holder is wounded; the requester then waits for it to let go
                Policy::WoundWait => {
                    let mut any = false;
                    for &b in blockers.iter().filter(|&&b| b > t) {
                        any |= inn.victims.insert(b, Abort::Wounded).is_none();
                    }
                    if any { self.cv.notify_all(); }
                }
            }
            let q = inn.q.get_mut(&r).unwrap();
            if !q.waiting.iter().any(|w| w.txn == t) {
                let req = Req { txn: t, mode: target };
                // upgrades jump the queue: otherwise two S holders upgrading would wait on each other's queue slot
                if held.is_some() { q.waiting.push_front(req) } else { q.waiting.push_back(req) }
            }
            g = self.cv.wait(g).unwrap();
        }
    }

    /// Plain 2PL: release one lock early. Afterwards `t` may not acquire anything.
    pub fn unlock(&self, t: TxnId, r: Resource) {
        let mut g = self.inner.lock().unwrap();
        g.shrinking.insert(t);
        Self::release(&mut g, t, r);
        self.cv.notify_all();
    }

    /// Strict 2PL: called once, at commit or after rollback.
    pub fn release_all(&self, t: TxnId) {
        let mut g = self.inner.lock().unwrap();
        for r in g.held.remove(&t).unwrap_or_default() { Self::release(&mut g, t, r); }
        g.shrinking.remove(&t);
        g.victims.remove(&t);
        self.cv.notify_all();
    }

    fn release(g: &mut Inner, t: TxnId, r: Resource) {
        if let Some(v) = g.held.get_mut(&t) { v.retain(|x| *x != r); }
        if let Some(q) = g.q.get_mut(&r) {
            q.granted.retain(|x| x.0 != t);
            q.waiting.retain(|w| w.txn != t);
            if q.granted.is_empty() && q.waiting.is_empty() { g.q.remove(&r); }
        }
    }

    /// A wounded or deadlock-victim transaction must find out even if it never calls `lock` again.
    pub fn check(&self, t: TxnId) -> Result<(), Abort> {
        match self.inner.lock().unwrap().victims.get(&t) { Some(&a) => Err(a), None => Ok(()) }
    }

    /// Edges `waiter → holder-or-earlier-waiter`, skipping transactions already condemned.
    pub fn waits_for(&self) -> Vec<(TxnId, TxnId)> { Self::edges(&self.inner.lock().unwrap()) }

    fn edges(g: &Inner) -> Vec<(TxnId, TxnId)> {
        let mut e = Vec::new();
        for q in g.q.values() {
            for w in &q.waiting {
                if g.victims.contains_key(&w.txn) { continue; }
                let up = q.granted.iter().any(|x| x.0 == w.txn);
                for b in q.blockers(w.txn, w.mode, up) { e.push((w.txn, b)); }
            }
        }
        e.sort(); e.dedup(); e
    }

    /// One detector pass: find cycles, condemn the youngest member of each. Returns the victims.
    pub fn detect_once(&self) -> Vec<TxnId> {
        let mut g = self.inner.lock().unwrap();
        let mut victims = Vec::new();
        while let Some(cycle) = Self::find_cycle(&Self::edges(&g)) {
            let v = *cycle.iter().max().unwrap();
            g.victims.insert(v, Abort::Deadlock);
            victims.push(v);
        }
        if !victims.is_empty() { self.cv.notify_all(); }
        victims
    }

    /// Run in a background thread: wake every `every` until `stop`.
    pub fn run_detector(&self, stop: &AtomicBool, every: Duration) {
        while !stop.load(Ordering::Relaxed) {
            std::thread::sleep(every);
            self.detect_once();
        }
    }

    fn find_cycle(edges: &[(TxnId, TxnId)]) -> Option<Vec<TxnId>> {
        let mut adj: HashMap<TxnId, Vec<TxnId>> = HashMap::new();
        for &(a, b) in edges { adj.entry(a).or_default().push(b); }
        // 0 = unseen, 1 = on the DFS stack, 2 = done
        fn dfs(u: TxnId, adj: &HashMap<TxnId, Vec<TxnId>>, color: &mut HashMap<TxnId, u8>, stack: &mut Vec<TxnId>) -> Option<Vec<TxnId>> {
            color.insert(u, 1);
            stack.push(u);
            for &v in adj.get(&u).into_iter().flatten() {
                match color.get(&v).copied().unwrap_or(0) {
                    1 => { let i = stack.iter().position(|&x| x == v).unwrap(); return Some(stack[i..].to_vec()); }
                    0 => if let Some(c) = dfs(v, adj, color, stack) { return Some(c); },
                    _ => {}
                }
            }
            stack.pop();
            color.insert(u, 2);
            None
        }
        let mut color = HashMap::new();
        let mut keys: Vec<_> = adj.keys().copied().collect();
        keys.sort();
        for k in keys {
            if color.get(&k).copied().unwrap_or(0) == 0 {
                if let Some(c) = dfs(k, &adj, &mut color, &mut Vec::new()) { return Some(c); }
            }
        }
        None
    }

    pub fn is_idle(&self) -> bool {
        let g = self.inner.lock().unwrap();
        g.q.is_empty() && g.held.values().all(|v| v.is_empty())
    }
}
