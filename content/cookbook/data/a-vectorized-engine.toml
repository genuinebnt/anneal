[[sections]]
heading = "Measured"
body = """
```text title="four queries on 4 000 000 rows, a batch-size sweep, and the selection-vector variants"
4000000 rows x 4 integer columns, best of 3 (ms); results of the two engines are compared first
query                                          row engine   vectorized  speed-up
filter a<50 AND b<100, SUM(d), COUNT                   98           23      4.2x
SUM(a*b + d)                                          216           49      4.4x
GROUP BY k: SUM, COUNT, MAX (1000 groups)             180           58      3.1x
JOIN dim (1000 rows) GROUP BY dim.g, SUM              309           72      4.3x
batch size sweep (ms), vectorized
query \\ batch                                        1       4      16      64     256    1024    4096   16384   65536 1048576
filter a<50 AND b<100                              466     149      58      32      24      23      25      23      23      24
GROUP BY k: SUM                                    461     145      76      62      58      57      54      52      51      51
selection vector versus compaction, and narrowing versus independent evaluation (filter query, batch 1024)
  selection vector, narrowing                    23 ms
  compacted survivors, narrowing                 25 ms
  selection vector, independent conjuncts        32 ms
```

<ul> <li><strong>3 to 4.4× faster than the row engine</strong> on every query, with identical results. The row engine here is a good baseline (no boxing of values beyond one <code>Vec</code> per row); against an interpreter that allocates more per value the factor grows. The gain is bounded because both engines are single-threaded and the hash aggregation and the join spend their time in hash lookups either way (3.1× and 4.3×); the pure scan-filter-sum and arithmetic queries are where batches pay most.</li> <li><strong>The sweep has a knee at 64 to 256 rows.</strong> Batch size 1 is 2.6 to 4.8× <em>slower</em> than the row engine (466 ms against 98 ms on the filter query, 461 against 180 on the group-by): the batch machinery costs more than the work. From 256 up the filter query is flat at 23 ms; the group-by keeps improving slightly up to 64 K (57 → 51 ms) because the hash table is touched once per batch. The 1024-row default sits on the flat part.</li> <li><strong>Narrowing beats independent evaluation</strong>: running the second predicate only on the first one's survivors takes 23 ms, evaluating both on all rows and intersecting 32 ms (<strong>+39%</strong>), which is the effect that left the bitmap scan behind the row loop in M3.</li> <li><strong>Compaction did not help here</strong> (25 against 23 ms): the filter keeps 5% of the rows but the only consumer is a two-column sum, so there is no later loop to benefit. It pays in plans where several operators follow a selective filter.</li> </ul>

<aside data-call="note"><b>What the tests could not see, and what did</b><p>The two engines share the aggregate <code>State</code> (sum, count, min, max). A differential test between them cannot catch a bug in code both run: the first mutation run left "MIN keeps the largest" alive. A direct computation of the groups from the input, independent of both engines, kills it. Differential testing needs <em>independent</em> implementations of everything it is meant to check.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Generic closures instead of virtual calls inside loops</strong>: the <code>go!</code> macro instantiates the loop once per comparison, so the comparison inlines. Each operator is still behind a <code>Box&lt;dyn BatchOp&gt;</code>, but that call happens once per batch.</li> <li><strong><code>Ev&lt;'a&gt;</code></strong> (<code>Ref(&amp;Col)</code>, <code>Own(Col)</code>, <code>Lit(i64)</code>) lets an expression refer to a column without copying it, own a computed column, or stay a scalar that the loop reads without indexing. It borrows the batch, so the borrow checker guarantees a result cannot outlive its input.</li> <li><strong><code>Batch::each(|i| …)</code></strong> iterates dense or selected positions through one <code>#[inline]</code> helper; every kernel is written once for both cases.</li> <li><strong><code>Option&lt;Vec&lt;bool&gt;&gt;</code> as validity</strong>: <code>None</code> means no NULLs, and <code>is_none_or</code> keeps the check one expression.</li> <li><strong>Group keys as <code>(Val, Val)</code></strong>: a <code>Copy</code> tuple, hashed with the same cheap <code>Fx</code> hasher as the join code, avoids a heap allocation per row, which a <code>Vec&lt;Val&gt;</code> key would cost.</li> <li><strong><code>wrapping_add/sub/mul</code></strong> make overflow behaviour identical in both engines; SQL engines raise an error instead, which is a design choice with its own cost (a check per row, or a range proof per batch).</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Differential</strong>: 1 500 random plans (a scan, an optional join with a second table, filters with column-versus-literal and expression-versus-expression conjuncts, a projection of random expressions, an optional second filter, an optional aggregation with 0 to 2 group columns and 1 to 3 aggregates), over tables of 0 to 200 rows with 15% NULLs, each run by the row engine and by the vectorized engine in 24 configurations (batch sizes 1, 2, 3, 7, 64, 1024 × selection or compaction × narrowing or independent conjuncts). Results are compared as multisets; 858 plans had a non-empty result, 713 an aggregation, 505 a join.</li> <li><strong>Edge cases</strong>: an ungrouped aggregate over no rows gives <code>COUNT = 0</code> and NULL for the others; a grouped one gives no rows; an all-NULL column has <code>SUM</code> NULL, <code>COUNT(col)</code> 0 and <code>COUNT(*)</code> the row count; <code>NULL + 1 &gt; 1</code> is not satisfied; NULL join keys never match.</li> <li><strong>Independent aggregate oracle</strong>: 300 random tables, groups computed directly with <code>BTreeMap</code> and iterators, compared with both engines for <code>SUM</code>, <code>COUNT(*)</code>, <code>COUNT</code>, <code>MIN</code>, <code>MAX</code> with NULLs.</li> <li><strong>Mutants run against these tests</strong>: <code>&lt;</code> as <code>&lt;=</code>; NULLs satisfying comparisons in a selected or a dense batch; arithmetic ignoring NULL operands; subtraction as addition; intersection stepping the wrong side; independent conjuncts ignoring an earlier selection; <code>MIN</code> keeping the largest; an empty aggregate with the wrong <code>COUNT</code>; <code>COUNT(col)</code> counting NULLs; a NULL join key matching; overlapping scan batches; projection dropping the selection; compaction losing the NULL flags; the join gathering the wrong right row; the second grouping column replaced by the first. <strong>16 killed.</strong> One mutant survives by design: removing the early <code>break</code> when a conjunct has emptied the selection changes only how much work is done, never the result.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>MonetDB/X100 → VectorWise → Actian Vector</strong> introduced the vectorized model ("MonetDB/X100: Hyper-Pipelining Query Execution", CIDR 2005); <strong>DuckDB</strong> processes vectors of 2 048 values with selection vectors and dictionary/constant vector types so a filter on a dictionary column compares codes; <strong>ClickHouse</strong> processes blocks of columns with SIMD kernels chosen at run time by CPU features.</li> <li><strong>Velox</strong> (Meta) and <strong>Arrow DataFusion</strong> run vectorized operators over Arrow arrays; Velox uses selectivity vectors and lazy vectors that decode a column only for the rows still alive.</li> <li><strong>SQL Server batch mode</strong> and <strong>Oracle In-Memory</strong> run vectorized operators over columnstore data; <strong>Snowflake</strong> and <strong>Databricks Photon</strong> do the same.</li> <li><strong>The alternative is compilation</strong>: HyPer and Umbra generate code per pipeline (<a href="/cookbook/p/query-compilation-and-code-generation">code generation</a>); the two approaches reach similar speeds in the "Everything You Always Wanted to Know About Compiled and Vectorized Queries" comparison (Kersten et al., VLDB 2018). Cairn's bytecode virtual machine (<a href="/cookbook/p/a-bytecode-virtual-machine">M5</a>) is a third point: a compact program run by a small interpreter.</li> <li><strong>Parallelism</strong> comes from running one pipeline per core on morsels of batches (<a href="/cookbook/p/query-scheduling">scheduling</a>, <a href="/cookbook/p/parallel-hash-joins">parallel hash joins</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Vector size is not a free parameter in a real engine</strong>: the working set of a pipeline (all intermediate vectors of all operators) should fit in L1 or L2. Wide rows or many expressions push the right size down.</li> <li><strong>Selection vectors and SIMD interact badly</strong>: a gather through a selection vector cannot use contiguous loads. Engines switch to full-vector evaluation with a mask when the selection is dense (above roughly 30 to 50%), then back.</li> <li><strong>Null handling doubles the kernels</strong>: each kernel needs a validity-aware variant; getting the common null-free path fast is worth the extra code, and the tests must exercise both.</li> <li><strong>Overflow and errors in a batch</strong>: erroring on the first overflow in row order requires care when a batch is evaluated column by column and some of its rows would have been filtered out.</li> <li><strong>Materialization inside operators</strong> (the join build side here is rows) can dominate; a real engine builds from columns.</li> <li><strong>Do not compare against a strawman.</strong> The honest baseline is a decent row engine, not one that allocates on every value; the section reports a 3 to 4× gap, not 20×, for that reason.</li> </ul></aside>
