<aside data-call="testing"><b>Test plan</b><ul> <li><code>unnesting_matches_nested_iteration_on_random_subqueries</code>: 1 500 random correlated subqueries compared on 3 random databases each (tables of 0–6 rows over {0, 1, 2, NULL}). The generator draws a correlation predicate (<code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>≤</code>, <code>&gt;</code>) against either outer column and an optional local filter, then one of: nothing, an inner join, a <strong>left join</strong>, <code>DISTINCT</code>, or a <strong>second correlated level that references both its parent and the outermost table</strong>; the result is a <strong>scalar SUM</strong>, a <strong>scalar COUNT</strong>, or a <strong>grouped</strong> aggregate. Coverage is asserted (504 COUNT, 576 SUM, 420 grouped, 253 two-level, 275 join, 240 left join, 236 distinct). Every rewritten plan must contain <strong>no dependent join</strong> and expose the same columns.</li> <li><code>the_count_bug_and_the_null_safe_join_are_caught</code>: two mutants must produce wrong answers: <em>skip the COUNT-bug fix</em> (inner-join the grouped result): <strong>383 of 1 500</strong> queries wrong; <em>use plain <code>=</code> instead of null-safe equality on the domain join</em>: <strong>154 of 1 500</strong> wrong (an outer row with a NULL correlation value loses its "empty" result).</li> <li><code>the_classic_count_bug_by_hand</code>: <code>T.b &gt; (SELECT COUNT(*) FROM S WHERE S.c = T.a)</code> over a T row with no match and a T row whose key is NULL; the correct rewrite keeps both rows, each mutant loses them.</li> </ul></aside>
"""

[[sections]]
heading = "Measured"
body = """
<p>Nested iteration vs the unnested, normalized plan (same executor; tables of N rows with about 10 rows per key; <code>T</code> is the outer table; "rows" counts rows produced by all operators):</p>

```text title="correlated subquery: nested iteration vs unnested plan"
query                                             N    nested ms  unnested ms   speedup      nested rows    unnested rows
SUM(d) WHERE c = T.a  (equality)                500         15.3         0.59       26x           256449             4800
SUM(d) WHERE c = T.a  (equality)               1000         30.3         0.56       54x          1013148             9600
SUM(d) WHERE c = T.a  (equality)               2000         80.4         1.82       44x          4025971            19200
SUM(d) WHERE c = T.a  (equality)               4000        311.5         1.78      175x         16052211            38400
COUNT(*) WHERE c = T.a AND d <= T.b             500          6.6         0.73        9x           254432             9792
COUNT(*) WHERE c = T.a AND d <= T.b            1000         25.2         1.41       18x          1008993            19770
COUNT(*) WHERE c = T.a AND d <= T.b            2000        101.7         2.91       35x          4018034            39664
COUNT(*) WHERE c = T.a AND d <= T.b            4000        401.4         5.87       68x         16036392            78853
COUNT(*) WHERE d < T.b (inequality only)        500          7.2         1.75        4x           377895            16555
COUNT(*) WHERE d < T.b (inequality only)       1000         28.5         3.39        8x          1470876            32237
COUNT(*) WHERE d < T.b (inequality only)       2000        114.6         6.91       17x          5955621            65741
COUNT(*) WHERE d < T.b (inequality only)       4000        462.8        13.81       34x         23811916           129506
2 levels: COUNT over (S with COUNT over U)      100         28.9         2.05       14x          1072810            31389
2 levels: COUNT over (S with COUNT over U)      200        212.4         8.18       26x          8343659           121971
2 levels: COUNT over (S with COUNT over U)      400       1636.7        32.22       51x         65287694           468753
```

<ul> <li><strong>Nested iteration is quadratic, the unnested plan is linear</strong>: doubling N multiplies the nested row count by 4 (256 K → 1 M → 4 M → 16 M) and the unnested one by 2 (4 800 → 38 400): the speedup grows with N, from 26× to <strong>175×</strong> for the equality-correlated sum, and the two-level query (cubic when nested: 1 M → 65 M rows) reaches <strong>51×</strong> at N = 400.</li> <li><strong>An inequality correlation still wins, for a different reason</strong>: with <code>d &lt; T.b</code> there is no equi-join to hash, but the <strong>domain</strong> has only as many rows as there are distinct <code>T.b</code> values (≈50), so the right side is evaluated 50 times instead of N times: 4× at N = 500, <strong>34×</strong> at N = 4000, and growing, since the work stays proportional to |S| × (distinct correlation values).</li> <li><strong>Unnesting alone was not enough</strong>: the first version of this module stopped after the dependent join was removed, leaving <code>Select(Cross(D, S))</code>, which executes as a nested loop. There the equality-correlated sum gained only 4–5×, and <code>COUNT … WHERE c = T.a AND d &lt;= T.b</code> was <strong>2.2× slower</strong> than nested iteration (892 ms vs 405 ms at N = 4000: the domain <code>(a, b)</code> had almost as many rows as <code>T</code>, so nothing was saved and the cross product was materialised). The normalization pass (turn <code>Select</code> over <code>Cross</code> into a hash join) is <em>part of unnesting</em>, and the same query is then <strong>68×</strong> faster.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Dynamic scope as a <code>Vec</code></strong>: the environment is <code>Vec&lt;(Col, Val)&gt;</code>, extended per outer row and searched <strong>from the end</strong>, so the innermost binding wins; a column that is neither in the current schema nor bound panics with its name (an unbound reference is a rewrite bug and should never be silent).</li> <li><strong>Hygiene by fresh ids</strong>: decorrelation renames the correlated columns it introduces with a counter (<code>Ctx::fresh</code>), so nested rewrites and the two copies of a domain pushed into both sides of a join never capture each other's names. <code>rename_refs</code> renames only <em>references</em>, which is safe because the outer columns are never defined inside the subquery.</li> <li><strong>Hash keys are <code>Vec&lt;Option&lt;i64&gt;&gt;</code></strong>: <code>Option</code> is <code>Hash + Eq</code> with <code>None == None</code>, which is exactly SQL's rule for <code>GROUP BY</code> and <code>DISTINCT</code> (NULLs group together) but <strong>not</strong> for <code>=</code> joins; <code>equi_keys</code> carries a per-key null-safe flag and skips probe/build rows whose non-null-safe keys are NULL.</li> <li><strong>One probe routine for both join algorithms</strong>: the closure <code>push(x, ys, out)</code> takes the candidate rows as <code>&amp;mut dyn Iterator&lt;Item = &amp;Row&gt;</code>, so the nested-loop and hash paths share the residual-predicate and left-join padding logic.</li> <li><strong><code>let … else</code> and <code>matches!</code> as guards</strong>: <code>normalize</code> starts with <code>let Select(p, x) = r else { return r };</code>: the pattern of each rule in one line.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>The COUNT bug and its relatives</strong>: every aggregate with a non-NULL value on empty input (<code>COUNT</code>) needs the left-join-and-<code>COALESCE</code> treatment; every consumer that distinguishes "no row" from "row with NULL" (<code>IS NULL</code>, <code>NOT EXISTS</code>, outer joins) needs care. The mutant that skipped the fix was wrong on a quarter of random queries.</li> <li><strong>NULL correlation keys</strong>: grouping the domain merges NULLs, so the join back to the outer query must be <strong>null-safe</strong> (<code>IS NOT DISTINCT FROM</code>), while the <em>original</em> predicate <code>S.c = T.a</code> is not: the fix is entirely about keeping those two equalities apart (the second mutant failed on 154 of 1 500 queries).</li> <li><strong>Domain size decides profitability</strong>: the domain only helps when it is smaller than the outer input (few distinct correlation values) or when the pushed plan turns into hash joins; with a unique correlation key and a non-hashable predicate, decorrelation can approach nested cost and the optimizer should keep the dependent join (an <em>apply</em> operator, ideally an index nested-loop).</li> <li><strong>Operators missing from this algebra</strong> each need a push rule: windows, set operations, <code>LIMIT</code>/top-1 per group (needs a ranking rewrite), recursive CTEs, <code>LATERAL</code> in <code>FROM</code>; <code>NOT IN</code> needs a <strong>null-aware anti-join</strong> because <code>x NOT IN (… NULL …)</code> is never true.</li> <li><strong>Duplicates and bag semantics</strong>: the domain is <code>DISTINCT</code> because evaluating <code>R</code> per <em>distinct</em> binding is enough; forgetting the <code>DISTINCT</code> is still correct but silently multiplies work, forgetting to join back on <em>all</em> correlated columns is wrong.</li> <li><strong>Test with a nested-iteration oracle</strong>: the oracle here is ten lines and found nothing wrong only because the mutants showed it can; every production unnesting implementation needs the same differential test (fuzz SQL against a mode that never decorrelates).</li> </ul></aside>
"""

