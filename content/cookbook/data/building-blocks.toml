<ul> <li><strong>The file is 5× smaller than raw</strong>: 13.3 MB against 68 MB. Timestamps take 0.63 byte per row (clustered, small deltas), the amount 2.63 bytes (decimal integers), the random user id 2.63 bytes (20 random bits plus delta sign: no codec helps random values), the dictionary-coded country 0.77 byte.</li> <li><strong>Selective, clustered filter (A)</strong>: reading the footer, pruning to 2 of 62 groups and fetching only the timestamp and amount chunks of those groups reads <strong>0.21 MB instead of 13.3 MB</strong> (64× fewer bytes). On the object-store model that is 52–55 ms against 173 ms for downloading the file; on the SSD model 0.3–0.6 ms against 6.8 ms.</li> <li><strong>The request/bytes trade-off flips with the storage.</strong> With one connection on the object-store model, four separate chunk requests cost 128 ms (latency dominates) while one coalesced 0.41 MB request (the gap of 1 MB merged the chunks and the column in between) costs 55 ms: reading twice the bytes in a quarter of the requests is <strong>2.3× faster</strong>. With 16 connections both take about 52–55 ms. On the SSD the opposite holds: 16 concurrent exact chunk reads (0.28 ms) beat the coalesced read (0.44 ms) because bytes, not requests, cost. The right coalescing threshold is a property of the storage, not of the file.</li> <li><strong>A filter that cannot prune is expensive if done chunk by chunk (B).</strong> The user id is random, so every row group's min/max spans the domain and all 62 groups are read: 124 requests for 10.5 MB. On the object-store model with one connection that is <strong>3 243 ms</strong>, with 16 connections 233 ms: <em>slower than downloading the whole 13.3 MB file in one request (173 ms)</em>. Coalescing turns it into one large request (199 ms). The lesson is a planner rule: when the estimated skip fraction is small, read big and sequential.</li> <li><strong>Projection helps bytes more than time (C).</strong> Summing one column over the whole table needs 5.3 MB, but its chunks are interleaved with the other columns' inside each row group: 62 requests, 1 634 ms on one connection and 130 ms on 16, against 173 ms for the whole file. A coalescing gap of 1 MB merges them into one request of 13.2 MB, which reads everything again. Column-contiguous layouts (larger row groups; formats that store a column's pages together across the file) are the fix; row-group size is a trade-off between fewer requests and coarser pruning.</li> <li><strong>Pruning depends entirely on clustering</strong>: a range of 1% of the values reads 1 group when the column is the file's sort order (timestamps; or the user id when the <em>file is sorted by user</em>), and <strong>all 62</strong> when the column is in random order. Sorting or partitioning by the common filter column is the cheapest query optimization a lake can do (<a href="/cookbook/p/lakehouses-and-table-formats">S5</a>).</li> <li><strong>Opening a file</strong>: the footer is 8 727 bytes. A tail guess smaller than that (512 or 4 096 bytes) costs a second request; a guess of 64 KiB or 1 MiB gets it in one, reading 7× to 120× more bytes than needed. Real readers guess 64 KiB or cache footers. The format's footer would reach about 34 MB for a table of 1 000 columns in 1 000 row groups at 34 bytes per chunk, which is why wide tables need column-subset footers or separate manifests.</li> </ul>

<aside data-call="note"><b>Arrow and Parquet are not alternatives</b><p>Arrow is the <em>in-memory</em> layout of decoded columns (fixed-width values, validity bitmaps, offsets); Parquet is the <em>at-rest</em> layout of encoded, compressed columns with statistics. A scan decodes Parquet pages into Arrow arrays, and the engine's kernels, the Flight stream and the Python process on the other side all see the same Arrow buffers. The lab's <code>decode_col</code> is the Parquet-to-Arrow step in miniature.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A trait for the store, a struct for the reader</strong>: <code>Reader&lt;'a, S: ObjectStore&gt;</code> is generic over the store, so the same reader runs against the in-memory counting store here and <code>object_store</code>/OpenDAL in production; monomorphization makes the abstraction free. Production APIs are <code>async</code> (<code>get_range</code>, <code>get_ranges</code> returning <code>Bytes</code>); the lab is synchronous to keep the request accounting obvious.</li> <li><strong><code>Mutex&lt;Vec&lt;(u64, u64)&gt;&gt;</code> as an interior-mutable request log</strong>: <code>get_range</code> takes <code>&amp;self</code>, so a store can be shared by many readers; the log makes "how many requests did that query make?" a one-line assertion in tests.</li> <li><strong><code>bytes::Bytes</code> instead of <code>Vec&lt;u8&gt;</code></strong>: the lab copies each range with <code>to_vec()</code>; real code returns reference-counted slices, so slicing a chunk out of a coalesced range is free. Arrow arrays hold their buffers the same way (<code>Buffer</code> over <code>Bytes</code>).</li> <li><strong>List scheduling in six lines</strong>: <code>simulate</code> keeps a vector of connection-free times and assigns each request to the earliest one (<code>min_by(total_cmp)</code>); the makespan is the maximum. Good enough to compare plans; real clients add per-connection setup, TLS, throttling and retries.</li> <li><strong>Small binary formats by hand</strong>: the footer is little-endian integers written with <code>to_le_bytes</code> and read with checked slicing (<code>b.get(p..p+n)?</code>), so a truncated or corrupt footer returns <code>None</code> instead of panicking; production code uses a schema language (Thrift for Parquet, FlatBuffers for Arrow) for evolution.</li> <li><strong>Reuse of the bit I/O from <a href="/cookbook/p/time-series-databases">S1</a></strong>: the same <code>BitWriter</code> writes the delta frames and the dictionary codes; sharing the primitive across formats is how real libraries stay small.</li> <li><strong><code>Option::is_none_or</code></strong> and <code>is_some_and</code> keep the pruning predicates readable: <code>plan.coalesce_gap.is_some_and(|gap| m.offset &lt;= r.1 + gap)</code>.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Codecs (property tests)</strong>: arbitrary <code>i64</code> columns round-trip; arbitrary <code>f64</code> bit patterns (NaN payloads included) round-trip bit-exactly; two-decimal floats choose the decimal codec and round-trip; string columns (including empty strings) round-trip through the dictionary.</li> <li><strong>Footer and open</strong>: the footer serializes and parses to itself; opening with tail guesses of 16, 100, 4 096 and 1 MiB issues exactly one request when the footer fits and two otherwise; a damaged magic number is rejected.</li> <li><strong>Every plan equals a scan of the table</strong>: 40 random tables (1 to 6 000 rows), random row-group sizes, queries with no filter, a clustered filter and a random filter, random ranges (including empty and out-of-domain), and for each: whole-file download and coalescing gaps of none, 0, 100 bytes and unbounded return the same sum and count; bytes fetched are at least the bytes needed, the request sizes add up, and without coalescing the fetch is exactly the needed chunks.</li> <li><strong>Pruning boundaries</strong>: ranges that touch only the maximum of one group or only the minimum of the next read exactly the right groups; ranges above or below the data read none.</li> <li><strong>Coalescing</strong>: reading two columns of every group gives 12 requests unmerged, between 6 and 12 with gap 0, and exactly 1 with an unbounded gap (reading more bytes than needed but fewer than the whole file); with neighbouring columns, a gap of 0 merges each adjacent pair into one request per group without extra bytes, and the gap that bridges two groups merges them at exactly the size of what lies between and not one byte less.</li> <li><strong>Network model</strong>: more connections never increase the makespan; one connection is the sum of the request times; enough connections give the longest single request; no requests take no time.</li> <li><strong>Mutants run against these tests</strong>: pruning that drops boundary groups, or that keeps everything (killed); coalescing that ignores the gap limit (killed), is off by one at the boundary (<strong>survived until the adjacency test with exact request counts</strong>), or keeps the wrong end of a merged range (equivalent: chunks are sorted by offset and never nest); chunks sliced one byte off; the footer's split read returning the wrong bytes; a scheduler that gives every request its own connection; a dictionary width one bit short; the decimal codec dropping its scale; a filter column that is also the sum column fetched twice; a whole-file baseline that reads half the file (all killed).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Parquet readers</strong> (arrow-rs/DataFusion, DuckDB, Spark, Trino) follow the lab's protocol with more refinement: a tail read then footer, row-group pruning from statistics, <strong>page-level pruning</strong> from the column index and offset index, Bloom filters for equality predicates, dictionary-aware filtering, late materialization (decode the filter column first, then only matching rows of the others), parallel column and row-group reads, <strong>range coalescing</strong> (the Rust <code>object_store</code> crate merges ranges closer than about 1 MiB), and metadata caches.</li> <li><strong>Object-store clients</strong> hide the network: retries with backoff, parallel multipart downloads, request hedging for slow tails, on-disk and in-memory block caches (OpenDAL layers; Alluxio-style caches; Snowflake, Databricks and others keep a local SSD cache in front of S3), and credentials/region handling.</li> <li><strong>DataFusion</strong> executes a plan as a tree of asynchronous streams of Arrow <code>RecordBatch</code>es (default 8 192 rows), partitioned across cores, with an <code>ExecutionPlan</code> trait for custom operators and a <code>TableProvider</code> trait for custom sources; Comet registers native operators under Spark's physical plan; ParadeDB maps Postgres tables and search indexes into providers.</li> <li><strong>InfluxDB 3.0 (FDAP)</strong> ingests line protocol into an in-memory buffer with a WAL, writes Parquet files to object storage, and answers SQL and InfluxQL with DataFusion over Arrow, using the file statistics for time-range pruning: the arrangement the lab's query A measures.</li> <li><strong>Flight and ADBC</strong> carry Arrow over gRPC (parallel streams per endpoint) and replace row-oriented drivers, removing the serialization step between a columnar server and a columnar client.</li> <li><strong>Table formats</strong> (Iceberg, Delta, Hudi) add a manifest layer above Parquet files so that listing and statistics come from metadata, and add atomic commits (<a href="/cookbook/p/lakehouses-and-table-formats">S5</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Many small requests.</strong> Object stores charge latency and money per request. A plan of one request per column chunk is the easy implementation and the slow one (3 243 ms against 173 ms for the same bytes here). Coalesce, issue concurrently, and cap the number of in-flight requests.</li> <li><strong>Coalescing too eagerly.</strong> Merging with a huge gap turns projection into a whole-file download. Choose the gap from the storage's <code>latency × bandwidth</code> product (the bytes you could have transferred in one request's latency: ~2 MB for the 25 ms, 90 MB/s model, ~200 KB for a fast SSD).</li> <li><strong>Statistics lie on unsorted data.</strong> Pruning needs clustering; a million-row group with a user id between 0 and 1 000 000 prunes nothing. Sort or partition by the common filter columns when writing, and check the actual skip rate on the workload.</li> <li><strong>Tiny row groups and huge footers.</strong> Too many row groups bloat the footer and the number of requests; too few lose pruning and strain memory. Aim for row groups of tens of MB on object storage, and keep file counts reasonable.</li> <li><strong>Reading the footer repeatedly.</strong> Planning a query over thousands of files by opening every footer is slow; cache footers, or keep statistics in the table format's manifests.</li> <li><strong>Floats, NaN and statistics.</strong> Min/max for floating-point columns must define how NaN is ordered and must not claim a skip when NaNs may match; the lab leaves statistics off for non-finite columns.</li> <li><strong>Version skew in a composed stack</strong>: Arrow, Parquet, DataFusion and the table format release independently; pin versions together, test on real files from other writers, and be careful with feature flags (encodings, page indexes) that another reader may not support.</li> <li><strong>Do not treat the model's times as measurements.</strong> The network model has two parameters; real object stores add tail latency, throttling and per-prefix limits. Use it to compare plans, then measure on the real store.</li> </ul></aside>
