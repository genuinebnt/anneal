heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from their documentation, source and the composable-systems literature, not a summary of any talk.)</em></p>

<ul> <li><strong>A database is now an assembly of components that exist as libraries.</strong> The seminar's systems each reuse most of a stack and build only what makes them different: a <em>columnar in-memory format</em> (<strong>Apache Arrow</strong>), a <em>columnar file format</em> (<strong>Apache Parquet</strong>), a <em>wire protocol and driver layer</em> that moves Arrow batches (<strong>Arrow Flight</strong>, <strong>ADBC</strong>), a <em>query engine</em> (<strong>DataFusion</strong>, in Rust; Velox, in C++), a <em>plan interchange format</em> (<strong>Substrait</strong>), <em>storage access</em> (<strong>object_store</strong>, <strong>OpenDAL</strong>: one API over S3, GCS, Azure, local disks), and a <em>table format and catalog</em> (Iceberg, Delta, Polaris; see <a href="/cookbook/p/lakehouses-and-table-formats">S5</a>). InfluxDB 3.0's name for its choice is <strong>FDAP</strong>: Flight, DataFusion, Arrow, Parquet.</li> <li><strong>Why composition works</strong>: the interfaces are data, not code. Two components that agree on Arrow's memory layout exchange batches by pointer with no serialization; two that agree on Parquet share files; a plan expressed in Substrait runs on any engine that reads it. The cost of a new database falls from years to months, and the cost of a <em>bug</em> in a shared component is paid by everyone.</li> <li><strong>Arrow</strong>: each column is a set of contiguous buffers (values; a validity bitmap for nulls; offsets for variable-length data), identical in every language, so a batch can be memory-mapped, sent over a socket or handed to another process without conversion. Parquet is the same idea <em>at rest</em>: encoded and compressed, laid out for skipping.</li> <li><strong>DataFusion</strong> is extensible at every seam: custom table sources (<code>TableProvider</code>), user-defined functions, optimizer rules, physical operators, and a streaming, partitioned, asynchronous execution model on <code>tokio</code>. Systems differ in what they plug in: <strong>Comet</strong> replaces Spark's execution with DataFusion natively; <strong>ParadeDB</strong> adds search and analytics to Postgres; <strong>Spice.ai</strong> federates sources and caches hot data; <strong>Exon</strong> exposes bioinformatics file formats as tables; <strong>Synnada</strong> pushes streaming and unified batch/stream; <strong>GreptimeDB</strong> and <strong>InfluxDB 3.0</strong> build time-series databases; <strong>GlareDB</strong> rebuilt its engine around the stack.</li> <li><strong>The cloud object store changes the physical design.</strong> A request costs ~10–30 ms before the first byte and money per request, bandwidth per connection is modest (tens to ~100 MB/s) but aggregate bandwidth scales with parallel connections, and objects are immutable (append means rewrite). Formats and readers are therefore built around <strong>few, large, parallel range reads</strong>: footer at the end (one tail read finds the layout), column chunks grouped in row groups, statistics for skipping, and a reader that <em>coalesces</em> nearby ranges and issues them concurrently.</li> <li><strong>Skipping is the optimization that matters</strong>: statistics per row group (and per page), dictionaries and Bloom filters let a reader avoid fetching or decoding data that cannot match. It only works if the data is <strong>clustered</strong> on the filtered columns (sorted, or partitioned by a correlated key); on randomly ordered data every group's min/max covers the domain.</li> <li><strong>Metadata is data.</strong> The footer of a wide, many-row-group file can be megabytes; table formats keep file lists and statistics in separate manifests so that planning does not read every file's footer.</li> </ul>
"""

