[[sections]]
heading = "The lab: a Parquet-like file over a counting object store"
body = """
<ol> <li><strong><code>ObjectStore</code> trait</strong> with <code>size</code> and <code>get_range</code> (HTTP range semantics: clamped to the object). <code>MemStore</code> implements it and logs every request, so the experiments can report <strong>requests</strong> and <strong>bytes</strong> exactly.</li> <li><strong>File layout</strong> <code>magic | row group 0 (one chunk per column) | row group 1 | … | footer | footer length | magic</code>. A chunk is one column of one row group, encoded by type: integers as first value plus <strong>zigzag deltas in frames</strong> of 128 (as in <a href="/cookbook/p/time-series-databases">S1</a>), floats as <strong>decimal integers</strong> when exactly representable (else plain), strings <strong>dictionary-encoded</strong> with bit-packed codes. The footer holds, for every chunk, offset, length, codec and <strong>min/max statistics</strong> (not for strings).</li> <li><strong>Reader</strong>: one <strong>tail read</strong> (a configurable guess, say 64 KiB) to find the footer, a second request only if the footer is larger; then for a query <code>SUM(col) WHERE lo ≤ filter ≤ hi</code>: prune row groups whose min/max cannot match, list the needed chunks (filter and sum columns of the surviving groups), <strong>coalesce</strong> ranges whose gap is at most a threshold, fetch each merged range, slice the chunks out, decode and aggregate.</li> <li><strong>Network model</strong>: each request costs <code>latency + size / bandwidth</code>; with <code>c</code> connections, requests are scheduled in order onto the first free one, and the makespan is the time. The parameters are assumptions, labelled in the tables: an object store (25 ms, 90 MB/s per connection) and a local SSD (0.1 ms, 2 GB/s per connection).</li> </ol>

:::deeper Reference: object-store trait and counting store, network model, column codecs, file writer, footer, tail-read reader with pruning, projection and coalescing
```rust title="src/blocks/objfile.rs"
//! A Parquet-like columnar file read through an object-store interface that counts requests and bytes: row groups of column
//! chunks, per-chunk min/max statistics, a footer found by a tail read, column projection and row-group pruning, range
//! coalescing, and a network cost model with parallel requests.
use std::collections::HashMap;
use std::sync::Mutex;
use crate::ts::{BitReader, BitWriter};

// ----------------------------------------------------------------------------------------------- object store

pub trait ObjectStore {
    fn size(&self, key: &str) -> u64;
    /// Bytes `[start, start + len)`, clamped to the object's size (HTTP range semantics).
    fn get_range(&self, key: &str, start: u64, len: u64) -> Vec<u8>;
}

/// In-memory store that logs every request as `(start, len actually returned)`.
#[derive(Default)]
pub struct MemStore { objs: HashMap<String, Vec<u8>>, log: Mutex<Vec<(u64, u64)>> }
impl MemStore {
    pub fn new() -> Self { Self::default() }
    pub fn put(&mut self, key: &str, bytes: Vec<u8>) { self.objs.insert(key.into(), bytes); }
    pub fn log(&self) -> Vec<(u64, u64)> { self.log.lock().unwrap().clone() }
    pub fn reset(&self) { self.log.lock().unwrap().clear(); }
    pub fn requests(&self) -> usize { self.log.lock().unwrap().len() }
    pub fn bytes(&self) -> u64 { self.log.lock().unwrap().iter().map(|x| x.1).sum() }
}
impl ObjectStore for MemStore {
    fn size(&self, key: &str) -> u64 { self.objs[key].len() as u64 }
    fn get_range(&self, key: &str, start: u64, len: u64) -> Vec<u8> {
        let o = &self.objs[key];
        let s = (start as usize).min(o.len());
        let e = (start.saturating_add(len) as usize).min(o.len());
        self.log.lock().unwrap().push((start, (e - s) as u64));
        o[s..e].to_vec()
    }
}

/// A network model: each request pays `latency` seconds and then transfers at `bandwidth` bytes/s; up to `concurrency` requests
/// are in flight. Returns the makespan when requests are issued in the given order to the first free connection.
#[derive(Clone, Copy, Debug)]
pub struct Net { pub latency: f64, pub bandwidth: f64, pub concurrency: usize }
pub fn simulate(net: &Net, sizes: &[u64]) -> f64 {
    let mut free = vec![0.0f64; net.concurrency.max(1)];
    for &s in sizes {
        let (i, _) = free.iter().enumerate().min_by(|a, b| a.1.total_cmp(b.1)).unwrap();
        free[i] += net.latency + s as f64 / net.bandwidth;
    }
    free.into_iter().fold(0.0, f64::max)
}

// ----------------------------------------------------------------------------------------------- columns and codecs

#[derive(Clone, Debug, PartialEq)]
pub enum Col { I64(Vec<i64>), F64(Vec<f64>), Str(Vec<String>) }
impl Col {
    pub fn len(&self) -> usize { match self { Col::I64(v) => v.len(), Col::F64(v) => v.len(), Col::Str(v) => v.len() } }
    fn slice(&self, a: usize, b: usize) -> Col { match self { Col::I64(v) => Col::I64(v[a..b].to_vec()), Col::F64(v) => Col::F64(v[a..b].to_vec()), Col::Str(v) => Col::Str(v[a..b].to_vec()) } }
    fn type_id(&self) -> u8 { match self { Col::I64(_) => 0, Col::F64(_) => 1, Col::Str(_) => 2 } }
}
pub struct Table { pub names: Vec<String>, pub cols: Vec<Col> }

#[inline] fn zigzag(v: i64) -> u64 { ((v << 1) ^ (v >> 63)) as u64 }
#[inline] fn unzigzag(z: u64) -> i64 { ((z >> 1) as i64) ^ -((z & 1) as i64) }

/// First value, then zigzag deltas in frames of 128 packed at the frame's maximum width.
fn put_ints(w: &mut BitWriter, v: &[i64]) {
    w.put(v.first().copied().unwrap_or(0) as u64, 64);
    let z: Vec<u64> = v.windows(2).map(|p| zigzag(p[1].wrapping_sub(p[0]))).collect();
    for f in z.chunks(128) {
        let width = 64 - f.iter().fold(0, |a, &x| a | x).leading_zeros();
        w.put(width as u64, 7);
        for &x in f { w.put(x, width); }
    }
}
fn get_ints(r: &mut BitReader, n: usize) -> Option<Vec<i64>> {
    if n == 0 { return Some(vec![]); }
    let mut out = Vec::with_capacity(n);
    let mut cur = r.get(64)? as i64;
    out.push(cur);
    while out.len() < n {
        let width = r.get(7)? as u32;
        for _ in 0..128.min(n - out.len()) { cur = cur.wrapping_add(unzigzag(r.get(width)?)); out.push(cur); }
    }
    Some(out)
}

pub const C_INT: u8 = 0; pub const C_DEC: u8 = 1; pub const C_PLAIN: u8 = 2; pub const C_DICT: u8 = 3;

/// Encode one column chunk; returns (codec, bytes, has_stats, min bits, max bits).
pub fn encode_col(c: &Col) -> (u8, Vec<u8>, bool, u64, u64) {
    let mut w = BitWriter::new();
    match c {
        Col::I64(v) => {
            put_ints(&mut w, v);
            let (mn, mx) = (v.iter().copied().min().unwrap_or(0), v.iter().copied().max().unwrap_or(0));
            (C_INT, w.finish(), !v.is_empty(), mn as u64, mx as u64)
        }
        Col::F64(v) => {
            let (mn, mx) = v.iter().fold((f64::INFINITY, f64::NEG_INFINITY), |a, &x| (a.0.min(x), a.1.max(x)));
            let stats = !v.is_empty() && v.iter().all(|x| x.is_finite());
            match crate::ts::decimals(v) {
                Some(d) => {
                    let scale = 10f64.powi(d as i32);
                    w.put(d as u64, 4);
                    put_ints(&mut w, &v.iter().map(|&x| (x * scale).round() as i64).collect::<Vec<_>>());
                    (C_DEC, w.finish(), stats, mn.to_bits(), mx.to_bits())
                }
                None => { for &x in v { w.put(x.to_bits(), 64); } (C_PLAIN, w.finish(), stats, mn.to_bits(), mx.to_bits()) }
            }
        }
        Col::Str(v) => {
            let mut dict: Vec<&str> = vec![];
            let mut ix: HashMap<&str, u32> = HashMap::new();
            let codes: Vec<u32> = v.iter().map(|s| *ix.entry(s.as_str()).or_insert_with(|| { dict.push(s); dict.len() as u32 - 1 })).collect();
            w.put(dict.len() as u64, 32);
            for s in &dict { w.put(s.len() as u64, 32); for b in s.bytes() { w.put(b as u64, 8); } }
            let width = 64 - (dict.len().max(1) as u64 - 1).leading_zeros();
            w.put(width as u64, 7);
            for c in codes { w.put(c as u64, width); }
            (C_DICT, w.finish(), false, 0, 0)
        }
    }
}

pub fn decode_col(ty: u8, codec: u8, bytes: &[u8], n: usize) -> Option<Col> {
    let mut r = BitReader::new(bytes);
    Some(match (ty, codec) {
        (0, C_INT) => Col::I64(get_ints(&mut r, n)?),
        (1, C_DEC) => { let d = r.get(4)? as i32; let s = 10f64.powi(d); Col::F64(get_ints(&mut r, n)?.into_iter().map(|k| k as f64 / s).collect()) }
        (1, C_PLAIN) => Col::F64((0..n).map(|_| r.get(64).map(f64::from_bits)).collect::<Option<Vec<_>>>()?),
        (2, C_DICT) => {
            let nd = r.get(32)? as usize;
            let mut dict = Vec::with_capacity(nd);
            for _ in 0..nd { let l = r.get(32)? as usize; dict.push(String::from_utf8((0..l).map(|_| r.get(8).map(|b| b as u8)).collect::<Option<Vec<_>>>()?).ok()?); }
            let width = r.get(7)? as u32;
            Col::Str((0..n).map(|_| r.get(width).map(|c| dict[c as usize].clone())).collect::<Option<Vec<_>>>()?)
        }
        _ => return None,
    })
}

// ----------------------------------------------------------------------------------------------- file layout

const MAGIC: &[u8; 4] = b"CLF1";

#[derive(Clone, Debug, PartialEq)]
pub struct ChunkMeta { pub offset: u64, pub len: u64, pub codec: u8, pub has_stats: bool, pub min: u64, pub max: u64 }
#[derive(Clone, Debug, PartialEq)]
pub struct RgMeta { pub rows: u32, pub chunks: Vec<ChunkMeta> }
#[derive(Clone, Debug, PartialEq)]
pub struct Footer { pub names: Vec<String>, pub types: Vec<u8>, pub rgs: Vec<RgMeta> }

impl Footer {
    pub fn to_bytes(&self) -> Vec<u8> {
        let mut b = vec![];
        b.extend((self.names.len() as u32).to_le_bytes());
        for (n, t) in self.names.iter().zip(&self.types) { b.extend((n.len() as u32).to_le_bytes()); b.extend(n.as_bytes()); b.push(*t); }
        b.extend((self.rgs.len() as u32).to_le_bytes());
        for g in &self.rgs {
            b.extend(g.rows.to_le_bytes());
            for c in &g.chunks { b.extend(c.offset.to_le_bytes()); b.extend(c.len.to_le_bytes()); b.push(c.codec); b.push(c.has_stats as u8); b.extend(c.min.to_le_bytes()); b.extend(c.max.to_le_bytes()); }
        }
        b
    }
    pub fn from_bytes(b: &[u8]) -> Option<Footer> {
        let mut p = 0usize;
        let mut take = |n: usize| -> Option<&[u8]> { let s = b.get(p..p + n)?; p += n; Some(s) };
        let u32_ = |s: &[u8]| u32::from_le_bytes(s.try_into().unwrap());
        let u64_ = |s: &[u8]| u64::from_le_bytes(s.try_into().unwrap());
        let nc = u32_(take(4)?) as usize;
        let (mut names, mut types) = (vec![], vec![]);
        for _ in 0..nc { let l = u32_(take(4)?) as usize; names.push(String::from_utf8(take(l)?.to_vec()).ok()?); types.push(take(1)?[0]); }
        let ng = u32_(take(4)?) as usize;
        let mut rgs = vec![];
        for _ in 0..ng {
            let rows = u32_(take(4)?);
            let mut chunks = vec![];
            for _ in 0..nc {
                let offset = u64_(take(8)?); let len = u64_(take(8)?);
                let codec = take(1)?[0]; let has_stats = take(1)?[0] == 1;
                let min = u64_(take(8)?); let max = u64_(take(8)?);
                chunks.push(ChunkMeta { offset, len, codec, has_stats, min, max });
            }
            rgs.push(RgMeta { rows, chunks });
        }
        Some(Footer { names, types, rgs })
    }
}

/// `magic | row group 0: chunk per column | row group 1 | … | footer | footer length (u32) | magic`
pub fn write_table(t: &Table, rg_rows: usize) -> Vec<u8> {
    let n = t.cols[0].len();
    let mut out = MAGIC.to_vec();
    let mut rgs = vec![];
    let mut start = 0;
    while start < n || (n == 0 && rgs.is_empty()) {
        let end = (start + rg_rows).min(n);
        let mut chunks = vec![];
        for c in &t.cols {
            let (codec, bytes, has_stats, min, max) = encode_col(&c.slice(start, end));
            chunks.push(ChunkMeta { offset: out.len() as u64, len: bytes.len() as u64, codec, has_stats, min, max });
            out.extend(bytes);
        }
        rgs.push(RgMeta { rows: (end - start) as u32, chunks });
        start = end;
        if n == 0 { break; }
    }
    let footer = Footer { names: t.names.clone(), types: t.cols.iter().map(|c| c.type_id()).collect(), rgs };
    let fb = footer.to_bytes();
    out.extend(&fb);
    out.extend((fb.len() as u32).to_le_bytes());
    out.extend(MAGIC);
    out
}

// ----------------------------------------------------------------------------------------------- reading

/// `SELECT SUM(sum_col), COUNT(*) FROM t WHERE lo <= filter_col <= hi` (or without the filter).
#[derive(Clone, Copy, Debug)]
pub struct Query { pub filter_col: Option<usize>, pub lo: i64, pub hi: i64, pub sum_col: usize }

#[derive(Clone, Copy, Debug)]
pub struct ReadPlan {
    /// Merge two needed ranges into one request when the gap between them is at most this many bytes (`None`: one request per chunk).
    pub coalesce_gap: Option<u64>,
}

#[derive(Clone, Debug, Default)]
pub struct ScanStats { pub row_groups: usize, pub row_groups_read: usize, pub requests: usize, pub bytes_fetched: u64, pub bytes_needed: u64, pub sizes: Vec<u64> }

pub struct Reader<'a, S: ObjectStore> { store: &'a S, key: String, pub footer: Footer, pub file_size: u64, pub open_sizes: Vec<u64> }

impl<'a, S: ObjectStore> Reader<'a, S> {
    /// Read the last `tail_guess` bytes; if the footer is longer than that, one more request fetches the rest.
    pub fn open(store: &'a S, key: &str, tail_guess: u64) -> Option<Self> {
        let size = store.size(key);
        let start = size.saturating_sub(tail_guess);
        let tail = store.get_range(key, start, tail_guess);
        let mut open_sizes = vec![tail.len() as u64];
        if tail.len() < 8 || &tail[tail.len() - 4..] != MAGIC { return None; }
        let flen = u32::from_le_bytes(tail[tail.len() - 8..tail.len() - 4].try_into().unwrap()) as usize;
        let footer_bytes = if flen + 8 <= tail.len() { tail[tail.len() - 8 - flen..tail.len() - 8].to_vec() } else {
            let need_start = size - 8 - flen as u64;
            let head = store.get_range(key, need_start, flen as u64 + 8 - tail.len() as u64);
            open_sizes.push(head.len() as u64);
            let mut all = head; all.extend(&tail); all[..flen].to_vec()
        };
        Some(Reader { store, key: key.into(), footer: Footer::from_bytes(&footer_bytes)?, file_size: size, open_sizes })
    }

    fn fetch_chunks(&self, wanted: &mut Vec<(usize, usize)>, plan: &ReadPlan, stats: &mut ScanStats) -> HashMap<(usize, usize), Vec<u8>> {
        wanted.sort_by_key(|&(g, c)| self.footer.rgs[g].chunks[c].offset);
        let mut ranges: Vec<(u64, u64, Vec<(usize, usize)>)> = vec![];                // (start, end, chunks inside)
        for &(g, c) in wanted.iter() {
            let m = &self.footer.rgs[g].chunks[c];
            stats.bytes_needed += m.len;
            match ranges.last_mut() {
                Some(r) if plan.coalesce_gap.is_some_and(|gap| m.offset <= r.1 + gap) => { r.1 = r.1.max(m.offset + m.len); r.2.push((g, c)); }
                _ => ranges.push((m.offset, m.offset + m.len, vec![(g, c)])),
            }
        }
        let mut out = HashMap::new();
        for (s, e, chunks) in ranges {
            let data = self.store.get_range(&self.key, s, e - s);
            stats.requests += 1; stats.bytes_fetched += data.len() as u64; stats.sizes.push(data.len() as u64);
            for (g, c) in chunks {
                let m = &self.footer.rgs[g].chunks[c];
                out.insert((g, c), data[(m.offset - s) as usize..(m.offset - s + m.len) as usize].to_vec());
            }
        }
        out
    }

    fn col_stats_overlap(&self, m: &ChunkMeta, ty: u8, lo: i64, hi: i64) -> bool {
        if !m.has_stats { return true; }
        match ty { 0 => !((m.max as i64) < lo || (m.min as i64) > hi), _ => true }
    }

    /// Run the query with row-group pruning from the statistics, column projection, and the given request-coalescing plan.
    pub fn scan(&self, q: &Query, plan: &ReadPlan) -> (f64, u64, ScanStats) {
        let mut stats = ScanStats { row_groups: self.footer.rgs.len(), ..Default::default() };
        let keep: Vec<usize> = (0..self.footer.rgs.len()).filter(|&g| match q.filter_col {
            Some(fc) => self.col_stats_overlap(&self.footer.rgs[g].chunks[fc], self.footer.types[fc], q.lo, q.hi),
            None => true,
        }).collect();
        stats.row_groups_read = keep.len();
        let mut wanted: Vec<(usize, usize)> = vec![];
        for &g in &keep { if let Some(fc) = q.filter_col { wanted.push((g, fc)); } if q.filter_col != Some(q.sum_col) { wanted.push((g, q.sum_col)); } }
        let data = self.fetch_chunks(&mut wanted, plan, &mut stats);
        self.aggregate(q, &keep, &data, &mut stats)
    }

    /// Baseline: download the whole object, then do the same work.
    pub fn scan_whole_file(&self, q: &Query) -> (f64, u64, ScanStats) {
        let all = self.store.get_range(&self.key, 0, self.file_size);
        let mut stats = ScanStats { row_groups: self.footer.rgs.len(), row_groups_read: self.footer.rgs.len(), requests: 1, bytes_fetched: all.len() as u64, sizes: vec![all.len() as u64], ..Default::default() };
        let mut data = HashMap::new();
        for g in 0..self.footer.rgs.len() { for c in 0..self.footer.names.len() { let m = &self.footer.rgs[g].chunks[c]; data.insert((g, c), all[m.offset as usize..(m.offset + m.len) as usize].to_vec()); } }
        let keep: Vec<usize> = (0..self.footer.rgs.len()).collect();
        self.aggregate(q, &keep, &data, &mut stats)
    }

    fn aggregate(&self, q: &Query, keep: &[usize], data: &HashMap<(usize, usize), Vec<u8>>, stats: &mut ScanStats) -> (f64, u64, ScanStats) {
        let (mut sum, mut count) = (0.0, 0u64);
        for &g in keep {
            let rows = self.footer.rgs[g].rows as usize;
            let dec = |c: usize| decode_col(self.footer.types[c], self.footer.rgs[g].chunks[c].codec, &data[&(g, c)], rows).expect("valid chunk");
            let mask: Option<Vec<bool>> = q.filter_col.map(|fc| match dec(fc) { Col::I64(v) => v.iter().map(|&x| x >= q.lo && x <= q.hi).collect(), _ => panic!("filter column must be integer") });
            let vals: Vec<f64> = match dec(q.sum_col) { Col::I64(v) => v.into_iter().map(|x| x as f64).collect(), Col::F64(v) => v, Col::Str(_) => panic!("cannot sum strings") };
            for i in 0..rows { if mask.as_ref().is_none_or(|m| m[i]) { sum += vals[i]; count += 1; } }
        }
        (sum, count, std::mem::take(stats))
    }
}
```
