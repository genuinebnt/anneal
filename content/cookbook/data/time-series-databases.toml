[[sections]]
heading = "Measured"
body = """
<p>All single-threaded, release build. The compression series are 200 000 points each; the store experiments use 5 million points.</p>

```text title="bits per point, and codec throughput"
bits per point (timestamp + value), 200000 points per series; raw is 128 bits (two 64-bit words)
series                        |    G ts   G val  Gorilla |    P ts   P val   packed | best/raw
counter (+0..5 per 10 s)      |    1.00   15.84    16.85 |    0.06    4.06     4.12 |   31.1x
CPU gauge, 2 decimals, 10 s   |    1.00   63.87    64.87 |    0.06    7.05     7.12 |   18.0x
temperature, full f64, 1 s    |    1.00   54.98    55.98 |       -       -      n/a |    2.3x
temperature, 0.1 resolution   |    1.00    7.05     8.05 |    0.06    1.98     2.04 |   62.7x
constant 42.0                 |    1.00    1.00     2.00 |    0.06    0.06     0.12 | 1091.4x
gauge, jittered timestamps    |   10.18   56.64    66.83 |    9.06    7.05    16.11 |    7.9x
stock price, irregular ms     |   12.74   42.02    54.76 |   11.82    3.06    14.88 |    8.6x
uniform random f64            |    1.00   58.69    59.69 |       -       -      n/a |    2.1x
throughput (million points per second, single thread)
series                           Gorilla enc   Gorilla dec    packed enc    packed dec
CPU gauge, 2 decimals, 10 s            103.7          93.9         235.0         187.7
temperature, full f64, 1 s             109.8          98.7           n/a           n/a
```

<ul> <li><strong>Regular timestamps cost about 1 bit per point</strong> in Gorilla (the delta-of-delta is zero) and 0.06 bit in the packed form (a 7-bit width header per frame of 128). <strong>Jitter breaks that</strong>: ±50 ms of noise on a 1 s grid costs 10.2 bits per timestamp in Gorilla (an escape code plus 9 or 12 bits) and 9.1 in the packed form; irregular exponential arrivals cost 12.7 and 11.8. If timestamps are noisy, they, not the values, are the cost.</li> <li><strong>Gorilla is not good at decimals.</strong> A CPU gauge rounded to two decimals costs <strong>63.9 bits per value</strong> in Gorilla: a decimal like 50.37 is not a short binary fraction, so consecutive values differ in most mantissa bits. The packed form needs <strong>7.1 bits</strong> (about 9× smaller). Integer-valued floats (a counter) are the good case for Gorilla (15.8 bits) and still 4× larger than packed (4.1). Full-precision floats (a noisy sensor, uniform random values) cost 55–59 bits in Gorilla and <strong>cannot be packed</strong>: the floor is the entropy of the mantissa.</li> <li><strong>Best-of-both reaches 18–63× over raw 16-byte points for decimal data</strong> (counter 31×, gauge 18×, 0.1-resolution sensor 63×, constant series 1 091×), 8–9× for decimal values with noisy timestamps, and only <strong>2.1–2.3×</strong> for full-precision floats (where the 16 raw bytes are mostly the 8-byte value).</li> <li><strong>Throughput</strong>: Gorilla encodes at 104–110 and decodes at 94–99 million points per second per core; the packed form encodes at 235 and decodes at 188. At 100 M points/s a core decodes 1.6 GB/s of raw-equivalent data; compression here is not a CPU problem.</li> </ul>

```text title="chunk size, pruning and rollups"
chunk size trade-off: 5000000 points of a CPU gauge (10 s interval), window queries
   chunk  bytes/pt    chunks  packed |  0.1% window (range) |    aggregate, 30% window | aggregate, 0.1% window
      64      3.06     78125    100% |       120 us  79.0 dec |           57 us   1.5 dec |         48 us   1.7 dec
     256      1.91     19531    100% |        57 us  20.5 dec |           18 us   1.9 dec |         15 us   1.9 dec
    1024      1.15      4882    100% |        40 us   5.9 dec |           15 us   2.0 dec |         14 us   2.0 dec
    4096      0.96      1220    100% |        51 us   2.2 dec |           42 us   2.0 dec |         42 us   2.0 dec
   16384      0.91       305    100% |       107 us   1.3 dec |          155 us   2.0 dec |        102 us   1.3 dec
raw Vec scan of a 30% aggregate: 1999 us (1500000 points, sum 78678616); 16 bytes per point
continuous aggregate: hourly buckets over 578 days of data; the query is the daily average for 90 days
ingest: store 17 ns/point, rollup update 16 ns/point (13890 buckets)
90 daily averages: chunk summaries + decoding edge chunks 1234 us, rollup 10 us (results 4600.482 / 4600.482)
```

<ul> <li><strong>Storage with per-chunk codec choice is 0.91–1.15 bytes per point for the gauge at chunk sizes of 1 024 or more</strong> (every chunk chose the packed codec), against 16 for raw. Small chunks pay a fixed header and a frame header each: 3.06 bytes per point at 64 points per chunk, 1.91 at 256.</li> <li><strong>Window queries decode at most two chunks regardless of chunk size</strong> for an aggregate: the stored summaries answer the interior. A 30% window aggregate takes <strong>15 µs</strong> at 1 024 points per chunk against <strong>1 999 µs</strong> for scanning the raw vectors (130× faster, with about 14 times less memory). The cost grows with chunk size only because the two edge chunks are decoded (155 µs at 16 384 points).</li> <li><strong>A narrow range query (0.1% of the data) is best at 1 024 points per chunk</strong> (40 µs, 5.9 chunks decoded): smaller chunks decode more of them (79 at 64 points), larger ones decode more points that are then discarded (107 µs at 16 384). The right chunk size balances header overhead and edge waste; 256 to 4 096 points is a safe range, and real systems use time-based sizes (hours or days) with a point-count cap.</li> <li><strong>A rollup answers 90 daily averages in 10 µs</strong>, against 1 234 µs for chunk summaries plus edge decoding (about 120×), at a cost of 16 ns per point to maintain (the store's own ingest costs 17 ns per point, including compression). Late points update their bucket in place. The price is storage for each resolution and the fact that only the aggregates you defined are available.</li> </ul>

```text title="as-of join"
as-of join: 1000000 trades against 2000000 quotes, 500 symbols
naive scan:               558445 ns/trade (measured on 2000 trades; it is O(n·m))
per-key binary search:        63 ns/trade (index build included)
merge, last per key:          23 ns/trade
merge with 1 ms tolerance: 24 ns/trade, 33.0% of trades matched (against 100.0% without tolerance)
```

<ul> <li><strong>Sorted input turns the join into a merge</strong>: 23 ns per trade against 63 ns for the per-key binary search and <strong>558 000 ns</strong> for the naive scan (an <code>O(n·m)</code> loop over 2 million quotes). The merge is 24 000× faster than naive here, and the binary-search version, which does not need sorted trades, is 8 800× faster.</li> <li><strong>A tolerance changes the answer, not the cost</strong>: with a 1 ms window only 33% of trades find a quote (the quotes of a symbol arrive on average 2.5 ms apart), at the same ~24 ns. Without it every trade matches an arbitrarily stale quote; a tolerance is a correctness parameter.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A <code>BitWriter</code> over <code>Vec&lt;u8&gt;</code></strong> with a current byte and a bit count; <code>put(value, n)</code> writes the low <code>n</code> bits most significant first in a loop of at most <code>n/8 + 1</code> iterations. The reader mirrors it and returns <code>Option</code>, so truncated input becomes <code>None</code> instead of a panic or a wrong value. Decoders for stored data must treat bytes as untrusted.</li> <li><strong>Wrapping arithmetic for timestamps</strong>: <code>wrapping_sub</code>/<code>wrapping_add</code> make delta-of-delta total over all <code>i64</code>, so the round trip is exact even for <code>i64::MIN</code> and decreasing sequences. A property test with arbitrary <code>i64</code> pairs checks it.</li> <li><strong><code>f64::to_bits</code> / <code>from_bits</code> everywhere</strong> values cross the codec: equality of floats is the wrong test (<code>NaN != NaN</code>, <code>-0.0 == 0.0</code>); the tests compare bit patterns, including NaN payloads.</li> <li><strong>Interior mutability for counters</strong>: <code>chunks_decoded: Cell&lt;u64&gt;</code> lets read methods taking <code>&amp;self</code> count decodes, so the tests can assert "this query decoded at most two chunks".</li> <li><strong><code>partition_point</code> is the whole index</strong>: the late buffer insertion point, the as-of lookup and the per-key search are each one call on a sorted slice.</li> <li><strong>Enum plus method for codec dispatch</strong> (<code>Chunk::decode</code> matches on <code>Codec</code>) keeps the store ignorant of the formats; adding a third codec is one variant and one arm.</li> <li><strong><code>debug_assert!</code> on preconditions that are expensive</strong> (the merge join requires time-sorted inputs; checking costs <code>O(n)</code> and is compiled out of release builds).</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Bit I/O</strong>: 5 000 random <code>(value, width)</code> pairs with widths 0–64 round-trip; reading past the end fails.</li> <li><strong>Gorilla, bit-exact (property tests)</strong>: arbitrary <code>(i64, u64)</code> pairs as timestamps and value bit patterns (NaNs, subnormals, infinities included) decode to the same bits; realistic series (regular grids with small jitter, eighth-valued floats) too.</li> <li><strong>Boundaries</strong>: delta-of-deltas exactly at and around ±64, ±256, ±2048, 2&#94;31 and the extremes of <code>i64</code>; XOR patterns with 1, 31, 32, 33, 62, 63 leading zeros, a lone low bit, a lone high bit and all 64 bits, with windows that fit, shrink, grow and move; a constant series costs exactly 2 bits per point; truncated streams at several cut points return <code>None</code>.</li> <li><strong>Packing</strong>: fixed-precision data (0–4 decimals, arbitrary timestamp steps, wrapping) round-trips bit-exactly; π, NaN and <code>-0.0</code> are refused.</li> <li><strong>Store against brute force</strong>: 600 appends with 10% late points, chunk sizes 1, 2, 7 and 64; 80 random windows each; <code>range</code> equals the sorted filter, <code>aggregate</code> equals count, sum, min and max of the filter.</li> <li><strong>Pruning</strong>: a narrow window decodes at most two chunks; the aggregate of the whole range decodes none; a window cutting two chunks decodes exactly two; window ends are exclusive and starts inclusive exactly at chunk boundaries.</li> <li><strong>Codec choice</strong>: blocks of two-decimal data pick the packed codec, blocks of full-precision floats pick Gorilla, each is no larger than the other codec's encoding of the same block, and the whole series reads back unchanged.</li> <li><strong>Rollups against recomputation</strong>: 5 000 inserts including negative and out-of-order times, 100 random aligned windows.</li> <li><strong>As-of</strong>: the three algorithms equal the naive definition on 200 random inputs with duplicate timestamps, missing keys and tolerances of none, 0, 3 and 25; an unsorted left side works for the binary-search version.</li> <li><strong>Mutants run against these tests</strong> (all killed): the 7-bit and 9-bit escape ranges off by one (random inputs rarely land exactly on an escape edge, so these are <strong>killed by the boundary test</strong>); the XOR window reuse test changed from AND to OR; leading zeros not capped at 31 (<strong>survived every random test, killed by the extreme-XOR test</strong>: random 64-bit values never differ only in their low 32 bits); the decoder forgetting that length 0 means 64; <code>-0.0</code> accepted by the packer; the frame width off by one; chunk end treated as inclusive in the aggregate; a chunk ending at <code>t0</code> skipped; truncating division in the rollup bucket; late points dropped from aggregates; strict <code>&lt;</code> in either as-of algorithm; tolerance ignored in the merge; the store keeping the larger codec, decoding with the wrong codec, or never trying the packed one.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>InfluxDB</strong>: the TSM (time-structured merge tree) engine keeps an in-memory cache with a WAL and immutable compressed files per shard (a time range), with type-specific encodings (delta and Simple8b-style packing for integers and timestamps, Gorilla-style for floats, snappy for strings) and an inverted tag index (TSI) on disk. InfluxDB 3.0 moves the data to Parquet files queried by DataFusion over Arrow (see <a href="/cookbook/p/building-blocks">S4</a> when written).</li> <li><strong>TimescaleDB</strong>: PostgreSQL extension; <em>hypertables</em> partitioned into chunks by time (and optionally a space dimension), <em>continuous aggregates</em> as materialized views maintained incrementally, and a <em>columnar compression</em> of older chunks (arrays per column per series segment, with delta-of-delta, Gorilla-style and dictionary encodings), with retention policies that drop chunks.</li> <li><strong>kdb+/q</strong>: a column store in a vector language, with a real-time database in memory plus a write-ahead tickerplant log, and a historical database as date-partitioned, column-per-file ("splayed") tables; the <code>aj</code> as-of join and <code>wj</code> window join are core operators.</li> <li><strong>Prometheus</strong>: a per-series Gorilla-style chunk compressor with a 2-hour head block, a write-ahead log, and immutable blocks with an inverted index; a famous high-cardinality failure mode.</li> <li><strong>ClickHouse, DuckDB and general warehouses</strong> are widely used for time series as plain columnar tables sorted by time, with codecs like <code>DoubleDelta</code>, <code>Gorilla</code> and <code>Delta</code> chosen per column, and <code>ASOF JOIN</code> as a built-in.</li> <li><strong>Streaming ingest</strong> (Pulsar, Kafka) in front of the database provides the buffering, ordering and replay that an in-process memtable cannot.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Cardinality is the budget.</strong> The series index lives in memory in most systems; a tag with unbounded values is an outage, not a slowdown. Cap distinct values per tag, reject or drop offending writes, and monitor the series count.</li> <li><strong>Gorilla on decimals.</strong> A sensor with two decimals stored as <code>f64</code> compresses poorly with XOR coding and well with integer scaling (or ALP); look at the data's actual precision before choosing a codec, and keep exactness: only accept a scaling that reproduces every value bit for bit.</li> <li><strong>Floating-point sums are order-dependent.</strong> Chunk summaries, rollups and a direct scan add the same numbers in different orders and can differ in the last digits; for exact results use integers (scaled decimals) or compensated summation, and test with tolerances only where unavoidable.</li> <li><strong>Window ends.</strong> Use half-open intervals <code>[t0, t1)</code> everywhere; an inclusive end double-counts the boundary point when windows tile. The chunk-boundary tests exist for exactly this.</li> <li><strong>Late data and summaries.</strong> A late point inside a sealed chunk's range must not be missed by the chunk's summary; here late points live outside the chunks and are always scanned. Systems that merge late points into old chunks must refresh the summary.</li> <li><strong>Retention and rollups interact</strong>: dropping raw data after a week makes a later change of the rollup definition impossible for old data; choose the rollups you need before the raw data expires.</li> <li><strong>Time zones, leap seconds and units</strong>: store UTC instants as integers with a documented unit (ms, µs or ns); do windowing in a calendar-aware layer, not by dividing by 86 400 000.</li> <li><strong>As-of semantics need a tie rule and a tolerance.</strong> "Last quote at or before the trade" must define what happens with equal timestamps and with stale quotes, or two engines return different answers.</li> <li><strong>Do not benchmark compression on synthetic perfection</strong>: constant and perfectly regular series give 1 000× ratios that no real source achieves; report the realistic rows (noisy timestamps, full-precision floats).</li> </ul></aside>
"""

