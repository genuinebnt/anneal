[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(These are first-person system talks without published notes. The points below are the design space the systems share, drawn from their public papers and documentation, not a summary of what each speaker said.)</em></p>

<ul> <li><strong>The workload is the definition.</strong> A time-series workload is <strong>append-mostly and time-ordered</strong> (points arrive roughly in timestamp order), <strong>write-heavy</strong> (millions of points per second), <strong>recent-biased</strong> (dashboards read the last hour; analysis reads ranges), <strong>aggregation-heavy</strong> (<code>avg</code>, <code>max</code>, percentiles per time window, grouped by tags), and <strong>retention-bounded</strong> (old data is dropped or downsampled by age, not updated). A database that exploits those facts beats a general one by an order of magnitude on storage and often on speed; one that does not is just a table with a timestamp column.</li> <li><strong>A series is a metric plus a set of tags; a point is a timestamp and values.</strong> <code>cpu,host=a,region=eu usage=0.42 1700000000000</code>: the <em>tags</em> identify the series and are indexed; the <em>fields</em> are the measured values and are not. The <strong>cardinality</strong> (the number of distinct tag combinations) drives index size and memory, not the point count: one tag with a million distinct values (a request id, a container id) turns a cheap workload into an unbounded index.</li> <li><strong>Time is the partition key.</strong> Data is cut into <strong>time chunks</strong> (Timescale hypertable chunks, InfluxDB shards, kdb+ date partitions). Writes touch the newest chunk, range queries touch only overlapping chunks, and <strong>retention is dropping whole chunks</strong>, an <code>O(1)</code> metadata operation instead of a delete that rewrites data.</li> <li><strong>Compression is the main tool, because the data is regular.</strong> Timestamps are almost evenly spaced: store the <strong>delta of deltas</strong>, which is zero most of the time. Values are close to their predecessors: <strong>XOR</strong> consecutive floats (Gorilla), or <strong>delta and bit-pack</strong> integers and fixed-precision decimals. Real systems choose a codec <strong>per column and per block</strong> from the data. Typical results are 1–2 bytes per point for regular, low-entropy series.</li> <li><strong>Pre-aggregate, then prune.</strong> Keep <strong>per-chunk summaries</strong> (count, sum, min, max, time range) so a query that covers whole chunks never decodes them, and <strong>rollups</strong> (continuous aggregates) so a dashboard over months reads hundreds of buckets instead of millions of points. Multi-resolution retention (raw for a week, one-minute rollups for a quarter, hourly forever) is the standard tiering.</li> <li><strong>Time-aware joins and windows are first-class.</strong> The <strong>as-of join</strong> ("for each trade, the last quote at or before it, for the same symbol") is the operation that quantitative-finance time-series systems (kdb+'s <code>aj</code>) are built around; gap filling, interpolation and sliding windows are the others.</li> <li><strong>Out-of-order and late data are a fact.</strong> Sensors buffer, networks retry, backfills happen. A design that only appends in order must have a side path for late points that does not rewrite old chunks.</li> <li><strong>Architectures differ in where the recent data lives.</strong> A common shape (kdb+'s real-time database and historical database, the memtable and sealed files of an LSM, Influx's cache and TSM files) keeps the last window in memory with a write-ahead log and seals it into immutable compressed blocks, so reads see both.</li> </ul>
"""

[[sections]]
heading = "The data model"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>concept</th> <th>example</th> <th>indexed?</th> <th>cost driver</th> </tr> </thead> <tbody> <tr> <td>measurement / metric</td> <td><code>cpu</code></td> <td>yes (name)</td> <td>few</td> </tr> <tr> <td>tag</td> <td><code>host=a</code>, <code>region=eu</code></td> <td>yes: tag → set of series ids</td> <td><strong>number of distinct combinations</strong></td> </tr> <tr> <td>field</td> <td><code>usage=0.42</code></td> <td>no</td> <td>points × bytes per point</td> </tr> <tr> <td>timestamp</td> <td><code>1700000000000</code> ms</td> <td>partition key</td> <td>order and regularity</td> </tr> </tbody> </table></div>

<p>The series count is the <strong>product</strong> of tag cardinalities that actually occur together: 1 000 hosts × 20 services × 5 regions is at most 100 000 series, cheap; adding a <code>request_id</code> tag makes it one series per request, which is a table scan with extra steps. The index is an <strong>inverted index</strong> from <code>(tag, value)</code> to a sorted list of series ids; a query <code>host=a AND region=eu</code> intersects two lists. Rule of thumb: tags are what you filter and group by with <em>bounded</em> values; unbounded identifiers belong in fields or in a different system.</p>
"""

[[sections]]
heading = "Compression"
body = """
<p>Two codecs, chosen per block by size.</p>

<p><strong>Gorilla</strong> (Pelkonen et al., Facebook, VLDB 2015; the basis of the Prometheus, InfluxDB and M3 encodings and of many variants) codes a block as a bit stream:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>part</th> <th>bits</th> <th>rule</th> </tr> </thead> <tbody> <tr> <td>first timestamp, first value</td> <td>64 + 64</td> <td>raw</td> </tr> <tr> <td>timestamp, delta-of-delta <code>D</code> = 0</td> <td><code>0</code> (1 bit)</td> <td>the common case on a regular grid</td> </tr> <tr> <td><code>D</code> in −64..=63</td> <td><code>10</code> + 7</td> <td>small jitter</td> </tr> <tr> <td><code>D</code> in −256..=255</td> <td><code>110</code> + 9</td> <td></td> </tr> <tr> <td><code>D</code> in −2048..=2047</td> <td><code>1110</code> + 12</td> <td></td> </tr> <tr> <td>anything else</td> <td><code>1111</code> + 64</td> <td>the paper uses 32; 64 bits makes any <code>i64</code> timestamp legal</td> </tr> <tr> <td>value equal to the previous</td> <td><code>0</code></td> <td>repeated gauge</td> </tr> <tr> <td>value, XOR fits the previous window</td> <td><code>10</code> + meaningful bits</td> <td>the window of leading and trailing zeros is reused</td> </tr> <tr> <td>value, new window</td> <td><code>11</code> + 5 (leading zeros, capped at 31) + 6 (length, 64 stored as 0) + bits</td> <td></td> </tr> </tbody> </table></div>

<p>A regular series that does not change costs <strong>2 bits per point</strong>. The scheme is excellent when consecutive values share most bits (integers stored as floats, slowly varying readings) and poor when they do not.</p>

<p><strong>Frame-of-reference packing</strong> for fixed-precision data (a temperature to 0.1, a price to 0.01, a percentage to 0.01): detect that every value is <code>k / 10&#94;d</code> exactly (<code>d ≤ 6</code>, bitwise-exact on the round trip, and no <code>-0.0</code>), turn values into integers, take <strong>zigzag deltas</strong> of values and <strong>zigzag delta-of-deltas</strong> of timestamps, and pack them in frames of 128 at the width of the largest entry. This is what the integer codecs of Timescale and InfluxDB do for integer columns (with Simple8b or similar), and the idea behind <strong>ALP</strong> (Afroozeh et al., SIGMOD 2024), which finds the decimal exponent per vector for floating-point columns. It rejects any block that is not exactly decimal, so it never loses a bit.</p>
"""

[[sections]]
heading = "A series store"
body = """
<p>A store ties the pieces together:</p>

<ol> <li><strong>Head</strong>: in-order points are appended to an in-memory vector; when it reaches <code>chunk_points</code> it is <em>sealed</em>.</li> <li><strong>Sealing</strong> encodes the block with both codecs, keeps the smaller (a tag records which), and stores the block's <strong>time range</strong> and an <strong>aggregate summary</strong> (count, sum, min, max) next to the bytes.</li> <li><strong>Late points</strong> (older than the newest point) go to a small sorted side buffer and are merged at query time, so a late arrival never rewrites a sealed block.</li> <li><strong><code>range(t0, t1)</code></strong> decodes only blocks whose time range overlaps; <strong><code>aggregate(t0, t1)</code></strong> merges stored summaries for blocks fully inside the window and decodes only the (at most two) blocks cut by its ends, plus the head and late buffer.</li> <li>A <strong>rollup</strong> is a tumbling-window aggregate (<code>bucket = floor(t / width) × width</code>) updated on every insert, so a late point simply updates its bucket.</li> </ol>
"""

[[sections]]
heading = "As-of joins"
body = """
<p><code>aj(trades, quotes, on symbol, time)</code>: for each trade, the quote with the same symbol and the greatest time not after the trade's (greatest index among equal times), optionally within a tolerance. Three algorithms:</p>

<ul> <li><strong>Naive</strong>: scan all quotes per trade, <code>O(n·m)</code>; the definition and the test oracle.</li> <li><strong>Per-key binary search</strong>: group quotes by symbol into time-sorted vectors; one <code>partition_point</code> per trade, <code>O(n log m)</code>, no ordering needed on the trades.</li> <li><strong>Merge</strong>: when both sides are sorted by time, walk them together and remember the latest quote per symbol; <code>O(n + m)</code>. This is the shape of kdb+'s <code>aj</code> and of <code>ASOF JOIN</code> in modern engines.</li> </ul>

:::deeper Reference: bit reader/writer, Gorilla encode/decode, frame-of-reference packing, chunked series store with summaries and codec choice, rollups, as-of joins
```rust title="src/ts.rs"
//! Time-series building blocks: a bit-level reader/writer, Gorilla compression (delta-of-delta timestamps, XOR floats),
//! a frame-of-reference integer packer for fixed-precision data, a chunked series store with summaries for pruning,
//! incrementally maintained rollups, and as-of joins.
use std::collections::BTreeMap;

// ----------------------------------------------------------------------------------------------- bits

#[derive(Default)]
pub struct BitWriter { buf: Vec<u8>, cur: u8, cur_bits: u32, pub nbits: usize }
impl BitWriter {
    pub fn new() -> Self { Self::default() }
    /// Append the low `n` bits of `v`, most significant first (`n` in 0..=64).
    pub fn put(&mut self, v: u64, n: u32) {
        debug_assert!(n <= 64);
        let mut left = n;
        while left > 0 {
            let take = left.min(8 - self.cur_bits);
            let shift = left - take;
            let part = ((v >> shift) & ((1u64 << take) - 1)) as u8;
            self.cur = if take == 8 { part } else { (self.cur << take) | part };
            self.cur_bits += take;
            left -= take;
            if self.cur_bits == 8 { self.buf.push(self.cur); self.cur = 0; self.cur_bits = 0; }
        }
        self.nbits += n as usize;
    }
    pub fn finish(mut self) -> Vec<u8> {
        if self.cur_bits > 0 { self.buf.push(self.cur << (8 - self.cur_bits)); }
        self.buf
    }
}

pub struct BitReader<'a> { buf: &'a [u8], pos: usize }
impl<'a> BitReader<'a> {
    pub fn new(buf: &'a [u8]) -> Self { BitReader { buf, pos: 0 } }
    /// Read `n` bits (0..=64) as the low bits of the result; `None` past the end.
    pub fn get(&mut self, n: u32) -> Option<u64> {
        if self.pos + n as usize > self.buf.len() * 8 { return None; }
        let mut out = 0u64;
        let mut left = n;
        while left > 0 {
            let byte = self.buf[self.pos / 8];
            let avail = 8 - (self.pos % 8) as u32;
            let take = left.min(avail);
            let bits = (byte >> (avail - take)) & (((1u16 << take) - 1) as u8);
            out = (out << take) | bits as u64;
            self.pos += take as usize;
            left -= take;
        }
        Some(out)
    }
    pub fn bit(&mut self) -> Option<bool> { self.get(1).map(|b| b == 1) }
}

#[inline] fn sign_extend(v: u64, bits: u32) -> i64 { ((v << (64 - bits)) as i64) >> (64 - bits) }
#[inline] fn zigzag(v: i64) -> u64 { ((v << 1) ^ (v >> 63)) as u64 }
#[inline] fn unzigzag(z: u64) -> i64 { ((z >> 1) as i64) ^ -((z & 1) as i64) }

// ----------------------------------------------------------------------------------------------- Gorilla

/// Bits spent on timestamps and on values (for the tables), plus the encoded bytes.
pub struct Encoded { pub bytes: Vec<u8>, pub ts_bits: usize, pub val_bits: usize }

/// Facebook's Gorilla scheme (Pelkonen et al., VLDB 2015) with two deviations: the first delta is coded like any other delta-of-delta
/// (against 0), and the widest delta-of-delta escape carries 64 bits so any `i64` timestamps round-trip.
///   timestamps: delta-of-delta D: `0` | `10`+7b (-64..=63) | `110`+9b (-256..=255) | `1110`+12b (-2048..=2047) | `1111`+64b
///   values:     XOR with the previous value: `0` if equal; `10` + the meaningful bits when they fit the previous window of
///               (leading, trailing) zeros; `11` + 5b leading zeros (capped at 31) + 6b length (64 stored as 0) + the meaningful bits
pub fn gorilla_encode(ts: &[i64], vs: &[f64]) -> Encoded {
    assert_eq!(ts.len(), vs.len());
    let mut w = BitWriter::new();
    w.put(ts.len() as u64, 32);
    let (mut ts_bits, mut val_bits) = (32usize, 0usize);
    if ts.is_empty() { return Encoded { bytes: w.finish(), ts_bits, val_bits }; }
    w.put(ts[0] as u64, 64);
    w.put(vs[0].to_bits(), 64);
    ts_bits += 64; val_bits += 64;
    let (mut prev_t, mut prev_delta) = (ts[0], 0i64);
    let (mut prev_v, mut lead_p, mut trail_p) = (vs[0].to_bits(), u32::MAX, 0u32);
    for i in 1..ts.len() {
        let before = w.nbits;
        let delta = ts[i].wrapping_sub(prev_t);
        let d = delta.wrapping_sub(prev_delta);
        match d {
            0 => w.put(0, 1),
            -64..=63 => { w.put(0b10, 2); w.put((d as u64) & 0x7f, 7); }
            -256..=255 => { w.put(0b110, 3); w.put((d as u64) & 0x1ff, 9); }
            -2048..=2047 => { w.put(0b1110, 4); w.put((d as u64) & 0xfff, 12); }
            _ => { w.put(0b1111, 4); w.put(d as u64, 64); }
        }
        prev_t = ts[i]; prev_delta = delta;
        ts_bits += w.nbits - before;
        let before = w.nbits;
        let bits = vs[i].to_bits();
        let x = bits ^ prev_v;
        if x == 0 { w.put(0, 1); } else {
            let lead = x.leading_zeros().min(31);
            let trail = x.trailing_zeros();
            if lead_p != u32::MAX && lead >= lead_p && trail >= trail_p {
                w.put(0b10, 2);
                w.put(x >> trail_p, 64 - lead_p - trail_p);
            } else {
                let len = 64 - lead - trail;
                w.put(0b11, 2);
                w.put(lead as u64, 5);
                w.put((len & 63) as u64, 6);
                w.put(x >> trail, len);
                lead_p = lead; trail_p = trail;
            }
        }
        prev_v = bits;
        val_bits += w.nbits - before;
    }
    Encoded { bytes: w.finish(), ts_bits, val_bits }
}

pub fn gorilla_decode(bytes: &[u8]) -> Option<(Vec<i64>, Vec<f64>)> {
    let mut r = BitReader::new(bytes);
    let n = r.get(32)? as usize;
    let (mut ts, mut vs) = (Vec::with_capacity(n), Vec::with_capacity(n));
    if n == 0 { return Some((ts, vs)); }
    ts.push(r.get(64)? as i64);
    let mut prev_v = r.get(64)?;
    vs.push(f64::from_bits(prev_v));
    let (mut prev_delta, mut lead_p, mut trail_p) = (0i64, 0u32, 0u32);
    for _ in 1..n {
        let d = if !r.bit()? { 0 }
            else if !r.bit()? { sign_extend(r.get(7)?, 7) }
            else if !r.bit()? { sign_extend(r.get(9)?, 9) }
            else if !r.bit()? { sign_extend(r.get(12)?, 12) }
            else { r.get(64)? as i64 };
        prev_delta = prev_delta.wrapping_add(d);
        let t = ts.last().unwrap().wrapping_add(prev_delta);
        ts.push(t);
        if r.bit()? {
            if r.bit()? {
                lead_p = r.get(5)? as u32;
                let mut len = r.get(6)? as u32;
                if len == 0 { len = 64; }
                trail_p = 64 - lead_p - len;
            }
            let meaningful = 64 - lead_p - trail_p;
            prev_v ^= r.get(meaningful)? << trail_p;
        }
        vs.push(f64::from_bits(prev_v));
    }
    Some((ts, vs))
}

// ----------------------------------------------------------------------------------------------- frame-of-reference packing

/// If every value is a decimal number with at most 6 fractional digits (exactly: `round(v·10^d)/10^d == v` bitwise, and no `-0.0`,
/// which an integer cannot represent), return `d`.
pub fn decimals(vs: &[f64]) -> Option<u32> {
    'outer: for d in 0..=6u32 {
        let scale = 10f64.powi(d as i32);
        for &v in vs {
            let k = (v * scale).round();
            if !v.is_finite() || v.to_bits() == (-0.0f64).to_bits() || k.abs() >= 9.0e15 || (k / scale).to_bits() != v.to_bits() { continue 'outer; }
        }
        return Some(d);
    }
    None
}

const FRAME: usize = 128;
fn pack_frames(w: &mut BitWriter, z: &[u64]) {
    for frame in z.chunks(FRAME) {
        let width = 64 - frame.iter().fold(0, |a, &x| a | x).leading_zeros();
        w.put(width as u64, 7);
        for &x in frame { w.put(x, width); }
    }
}
fn unpack_frames(r: &mut BitReader, count: usize) -> Option<Vec<u64>> {
    let mut out = Vec::with_capacity(count);
    while out.len() < count {
        let width = r.get(7)? as u32;
        for _ in 0..FRAME.min(count - out.len()) { out.push(r.get(width)?); }
    }
    Some(out)
}

/// Fixed-precision data: values become integers (`v·10^d`), timestamps and values become zigzag deltas, packed in frames of 128 at the
/// width of the largest entry (a "frame of reference" layout that decodes 128 values with a tight loop and no per-value branching).
pub fn scaled_encode(ts: &[i64], vs: &[f64]) -> Option<Encoded> {
    assert_eq!(ts.len(), vs.len());
    let d = decimals(vs)?;
    let scale = 10f64.powi(d as i32);
    let ints: Vec<i64> = vs.iter().map(|&v| (v * scale).round() as i64).collect();
    let mut w = BitWriter::new();
    w.put(ts.len() as u64, 32);
    w.put(d as u64, 4);
    if ts.is_empty() { let b = w.nbits; return Some(Encoded { bytes: w.finish(), ts_bits: b, val_bits: 0 }); }
    w.put(ts[0] as u64, 64);
    w.put(ints[0] as u64, 64);
    let mut tz = Vec::with_capacity(ts.len());
    let mut vz = Vec::with_capacity(ts.len());
    let mut prev_delta = 0i64;
    for i in 1..ts.len() {
        let delta = ts[i].wrapping_sub(ts[i - 1]);
        tz.push(zigzag(delta.wrapping_sub(prev_delta)));
        prev_delta = delta;
        vz.push(zigzag(ints[i].wrapping_sub(ints[i - 1])));
    }
    let head = w.nbits;
    pack_frames(&mut w, &tz);
    let mid = w.nbits;
    pack_frames(&mut w, &vz);
    let total = w.nbits;
    Some(Encoded { bytes: w.finish(), ts_bits: head - 64 + (mid - head), val_bits: 64 + (total - mid) })
}

pub fn scaled_decode(bytes: &[u8]) -> Option<(Vec<i64>, Vec<f64>)> {
    let mut r = BitReader::new(bytes);
    let n = r.get(32)? as usize;
    let d = r.get(4)? as i32;
    if n == 0 { return Some((vec![], vec![])); }
    let scale = 10f64.powi(d);
    let t0 = r.get(64)? as i64;
    let v0 = r.get(64)? as i64;
    let tz = unpack_frames(&mut r, n - 1)?;
    let vz = unpack_frames(&mut r, n - 1)?;
    let (mut ts, mut vs) = (vec![t0], vec![v0 as f64 / scale]);
    let (mut delta, mut iv) = (0i64, v0);
    for i in 0..n - 1 {
        delta = delta.wrapping_add(unzigzag(tz[i]));
        ts.push(ts[i].wrapping_add(delta));
        iv = iv.wrapping_add(unzigzag(vz[i]));
        vs.push(iv as f64 / scale);
    }
    Some((ts, vs))
}

// ----------------------------------------------------------------------------------------------- aggregates

#[derive(Clone, Copy, Debug, PartialEq)]
pub struct Agg { pub count: u64, pub sum: f64, pub min: f64, pub max: f64 }
impl Agg {
    pub const EMPTY: Agg = Agg { count: 0, sum: 0.0, min: f64::INFINITY, max: f64::NEG_INFINITY };
    pub fn add(&mut self, v: f64) { self.count += 1; self.sum += v; self.min = self.min.min(v); self.max = self.max.max(v); }
    pub fn merge(&mut self, o: &Agg) { self.count += o.count; self.sum += o.sum; self.min = self.min.min(o.min); self.max = self.max.max(o.max); }
}

// ----------------------------------------------------------------------------------------------- series store

#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Codec { Gorilla, Packed }

/// A sealed block: time range, aggregate summary, the codec that won for this block, and the encoded bytes.
pub struct Chunk { pub t_min: i64, pub t_max: i64, pub agg: Agg, pub codec: Codec, pub blob: Vec<u8> }
impl Chunk {
    pub fn decode(&self) -> (Vec<i64>, Vec<f64>) {
        match self.codec { Codec::Gorilla => gorilla_decode(&self.blob), Codec::Packed => scaled_decode(&self.blob) }.expect("valid chunk")
    }
}

/// One series: in-order points go to the head and are sealed into compressed chunks of `chunk_points`; late (out-of-order) points
/// are kept in a small sorted side buffer and merged at query time. Every sealed chunk keeps its time range and an aggregate summary.
pub struct SeriesStore {
    chunk_points: usize,
    pub sealed: Vec<Chunk>,
    head_t: Vec<i64>, head_v: Vec<f64>,
    late: Vec<(i64, f64)>,
    pub chunks_decoded: std::cell::Cell<u64>,
}
impl SeriesStore {
    pub fn new(chunk_points: usize) -> Self { SeriesStore { chunk_points, sealed: vec![], head_t: vec![], head_v: vec![], late: vec![], chunks_decoded: Default::default() } }
    fn last_t(&self) -> Option<i64> { self.head_t.last().copied().or_else(|| self.sealed.last().map(|c| c.t_max)) }
    pub fn append(&mut self, t: i64, v: f64) {
        if self.last_t().is_some_and(|l| t < l) {
            let at = self.late.partition_point(|x| x.0 <= t);
            self.late.insert(at, (t, v));
            return;
        }
        self.head_t.push(t); self.head_v.push(v);
        if self.head_t.len() == self.chunk_points { self.seal(); }
    }
    fn seal(&mut self) {
        if self.head_t.is_empty() { return; }
        let mut agg = Agg::EMPTY;
        for &v in &self.head_v { agg.add(v); }
        // try both codecs and keep the smaller: fixed-precision blocks pack into a few bits, everything else falls back to Gorilla
        let g = gorilla_encode(&self.head_t, &self.head_v).bytes;
        let (codec, blob) = match scaled_encode(&self.head_t, &self.head_v) {
            Some(p) if p.bytes.len() < g.len() => (Codec::Packed, p.bytes),
            _ => (Codec::Gorilla, g),
        };
        self.sealed.push(Chunk { t_min: self.head_t[0], t_max: *self.head_t.last().unwrap(), agg, codec, blob });
        self.head_t.clear(); self.head_v.clear();
    }
    pub fn len(&self) -> usize { self.sealed.iter().map(|c| c.agg.count as usize).sum::<usize>() + self.head_t.len() + self.late.len() }
    pub fn compressed_bytes(&self) -> usize { self.sealed.iter().map(|c| c.blob.len()).sum() }

    /// All points with `t0 <= t < t1`, in time order. Chunks whose range does not overlap are never decoded.
    pub fn range(&self, t0: i64, t1: i64) -> Vec<(i64, f64)> {
        let mut out: Vec<(i64, f64)> = vec![];
        for c in &self.sealed {
            if c.t_max < t0 || c.t_min >= t1 { continue; }
            self.chunks_decoded.set(self.chunks_decoded.get() + 1);
            let (ts, vs) = c.decode();
            out.extend(ts.into_iter().zip(vs).filter(|p| p.0 >= t0 && p.0 < t1));
        }
        out.extend(self.head_t.iter().copied().zip(self.head_v.iter().copied()).filter(|p| p.0 >= t0 && p.0 < t1));
        out.extend(self.late.iter().copied().filter(|p| p.0 >= t0 && p.0 < t1));
        out.sort_by_key(|p| p.0);          // stable: ties keep the order chunk, head, late
        out
    }

    /// Aggregate over `t0 <= t < t1`. A chunk fully inside the window contributes its stored summary without being decoded.
    pub fn aggregate(&self, t0: i64, t1: i64) -> Agg {
        let mut a = Agg::EMPTY;
        for c in &self.sealed {
            if c.t_max < t0 || c.t_min >= t1 { continue; }
            if c.t_min >= t0 && c.t_max < t1 { a.merge(&c.agg); continue; }
            self.chunks_decoded.set(self.chunks_decoded.get() + 1);
            let (ts, vs) = c.decode();
            for (t, v) in ts.into_iter().zip(vs) { if t >= t0 && t < t1 { a.add(v); } }
        }
        for (&t, &v) in self.head_t.iter().zip(&self.head_v) { if t >= t0 && t < t1 { a.add(v); } }
        for &(t, v) in &self.late { if t >= t0 && t < t1 { a.add(v); } }
        a
    }
}

/// A continuous aggregate: tumbling windows of `width`, updated on every insert, so a dashboard query reads a few buckets instead of raw points.
pub struct Rollup { pub width: i64, pub buckets: BTreeMap<i64, Agg> }
impl Rollup {
    pub fn new(width: i64) -> Self { Rollup { width, buckets: BTreeMap::new() } }
    pub fn insert(&mut self, t: i64, v: f64) { self.buckets.entry(t.div_euclid(self.width) * self.width).or_insert(Agg::EMPTY).add(v); }
    /// Windows that start in `[t0, t1)`; exact when `t0` and `t1` are multiples of the width.
    pub fn aggregate(&self, t0: i64, t1: i64) -> Agg { let mut a = Agg::EMPTY; for (_, b) in self.buckets.range(t0..t1) { a.merge(b); } a }
}

// ----------------------------------------------------------------------------------------------- as-of join

#[derive(Clone, Copy, Debug)]
pub struct Event { pub t: i64, pub key: u32 }

/// For each left event, the right event with the same key and the greatest `(t, index)` such that `t_right <= t_left` (and, with
/// a tolerance, `t_left - t_right <= tol`). Reference implementation: scan everything.
pub fn asof_naive(left: &[Event], right: &[Event], tol: Option<i64>) -> Vec<Option<usize>> {
    left.iter().map(|l| {
        let mut best: Option<usize> = None;
        for (j, r) in right.iter().enumerate() {
            if r.key == l.key && r.t <= l.t && tol.is_none_or(|w| l.t - r.t <= w) && best.is_none_or(|b| (r.t, j) >= (right[b].t, b)) { best = Some(j); }
        }
        best
    }).collect()
}

/// Per-key sorted index of the right side and a binary search per left event: `O(n log m)`, no ordering needed on the left.
pub fn asof_bsearch(left: &[Event], right: &[Event], tol: Option<i64>) -> Vec<Option<usize>> {
    let mut by_key: std::collections::HashMap<u32, Vec<(i64, usize)>> = Default::default();
    for (j, r) in right.iter().enumerate() { by_key.entry(r.key).or_default().push((r.t, j)); }
    for v in by_key.values_mut() { v.sort(); }
    left.iter().map(|l| {
        let v = by_key.get(&l.key)?;
        let i = v.partition_point(|x| x.0 <= l.t);
        let (t, j) = *v.get(i.checked_sub(1)?)?;
        tol.is_none_or(|w| l.t - t <= w).then_some(j)
    }).collect()
}

/// Merge join in time order, remembering the last right event per key: `O(n + m)` for inputs sorted by time (kdb+'s `aj` shape).
pub fn asof_merge(left: &[Event], right: &[Event], tol: Option<i64>) -> Vec<Option<usize>> {
    debug_assert!(left.windows(2).all(|w| w[0].t <= w[1].t) && right.windows(2).all(|w| w[0].t <= w[1].t));
    let mut last: std::collections::HashMap<u32, usize> = Default::default();
    let mut j = 0;
    left.iter().map(|l| {
        while j < right.len() && right[j].t <= l.t { last.insert(right[j].key, j); j += 1; }
        last.get(&l.key).copied().filter(|&k| tol.is_none_or(|w| l.t - right[k].t <= w))
    }).collect()
}
