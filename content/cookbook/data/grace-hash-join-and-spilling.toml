[[sections]]
heading = "Overview"
body = """
<p>The optimizer turns <code>NestedLoopJoin</code> into <code>HashJoin</code> when the predicate has equality conjuncts. Two implementations then share one plan node:</p>

<ol> <li><strong>In-memory hash join</strong> (the build side fits): build a <code>HashMap</code> from the right side, stream the left side through it. NULL keys are never inserted or probed. For a left join, an unmatched left row is emitted with NULLs. Residual (non-equality) conjuncts are evaluated on the joined row.</li> <li><strong>Grace hash join</strong> (it doesn't fit): partition both inputs to disk by hash, then join partition pairs one at a time. This is what BusTub's P3 Task 3 requires, and it's what this section builds.</li> </ol>
"""

[[sections]]
heading = "Intermediate pages"
body = """
<p>A spill file is a list of buffer-pool pages holding serialized rows. Pages are allocated through the <strong>same buffer pool</strong> as table data, so a spill competes for frames with everything else (and may itself be evicted to disk), and a finished spill must <strong>return its pages</strong> to the disk manager, or the file grows forever.</p>

```text title="spill page layout (8 KiB)"
[ used: u32 ][ len u32 | row bytes ][ len u32 | row bytes ] ... free
row bytes: [ ncols u16 ] then per value: tag u8 (0 NULL · 1 bool · 2 int · 3 float · 4 text) + payload
```

:::deeper Spill writer, spill file, page-at-a-time reader, row codec
```rust title="src/execution/spill.rs"
//! Spill files: rows serialized into buffer-pool pages. Page layout: [used u32][records...],
//! record = [len u32][encoded row]. BusTub's P3 asks for exactly this (an "intermediate result page").
use std::collections::VecDeque;
use std::sync::atomic::{AtomicU64, Ordering::Relaxed};
use crate::common::config::{PageId, PAGE_SIZE};
use crate::types::value::Value;
use super::catalog::Bpm;
use super::{err, Result};

pub type Row = Vec<Value>;
pub static PAGES_WRITTEN: AtomicU64 = AtomicU64::new(0);
pub static PAGES_READ: AtomicU64 = AtomicU64::new(0);

pub fn encode_row(row: &[Value], out: &mut Vec<u8>) {
    out.extend_from_slice(&(row.len() as u16).to_le_bytes());
    for v in row {
        match v {
            Value::Null => out.push(0),
            Value::Bool(b) => { out.push(1); out.push(*b as u8); }
            Value::Int(i) => { out.push(2); out.extend_from_slice(&i.to_le_bytes()); }
            Value::Float(f) => { out.push(3); out.extend_from_slice(&f.to_bits().to_le_bytes()); }
            Value::Text(s) => { out.push(4); out.extend_from_slice(&(s.len() as u32).to_le_bytes()); out.extend_from_slice(s.as_bytes()); }
        }
    }
}

pub fn decode_row(b: &[u8]) -> Row {
    let n = u16::from_le_bytes([b[0], b[1]]) as usize;
    let (mut i, mut row) = (2, Vec::with_capacity(n));
    for _ in 0..n {
        let tag = b[i]; i += 1;
        row.push(match tag {
            0 => Value::Null,
            1 => { i += 1; Value::Bool(b[i - 1] != 0) }
            2 => { i += 8; Value::Int(i64::from_le_bytes(b[i - 8..i].try_into().unwrap())) }
            3 => { i += 8; Value::Float(f64::from_bits(u64::from_le_bytes(b[i - 8..i].try_into().unwrap()))) }
            _ => {
                let l = u32::from_le_bytes(b[i..i + 4].try_into().unwrap()) as usize; i += 4 + l;
                Value::Text(String::from_utf8_lossy(&b[i - l..i]).into_owned().into())
            }
        });
    }
    row
}

pub struct SpillWriter<'a> { bpm: &'a Bpm, pages: Vec<PageId>, buf: Vec<u8>, rows: usize }
pub struct SpillFile { pub pages: Vec<PageId>, pub rows: usize }

impl<'a> SpillWriter<'a> {
    pub fn new(bpm: &'a Bpm) -> Self { SpillWriter { bpm, pages: vec![], buf: Vec::with_capacity(PAGE_SIZE), rows: 0 } }
    pub fn push(&mut self, row: &[Value]) -> Result<()> {
        let mut enc = vec![];
        encode_row(row, &mut enc);
        if enc.len() + 8 > PAGE_SIZE { return err("row too large to spill (must fit in one page)".into()); }
        if self.buf.len() + 4 + enc.len() > PAGE_SIZE - 4 { self.flush()?; }
        self.buf.extend_from_slice(&(enc.len() as u32).to_le_bytes());
        self.buf.extend_from_slice(&enc);
        self.rows += 1;
        Ok(())
    }
    fn flush(&mut self) -> Result<()> {
        if self.buf.is_empty() { return Ok(()); }
        let pid = self.bpm.new_page();
        let mut g = self.bpm.write_page(pid)?;
        let d = g.data_mut();
        d[0..4].copy_from_slice(&(self.buf.len() as u32).to_le_bytes());
        d[4..4 + self.buf.len()].copy_from_slice(&self.buf);
        self.pages.push(pid);
        self.buf.clear();
        PAGES_WRITTEN.fetch_add(1, Relaxed);
        Ok(())
    }
    pub fn finish(mut self) -> Result<SpillFile> { self.flush()?; Ok(SpillFile { pages: self.pages, rows: self.rows }) }
}

impl SpillFile {
    pub fn iter<'a>(&'a self, bpm: &'a Bpm) -> SpillIter<'a> { SpillIter { bpm, pages: &self.pages, pi: 0, cur: VecDeque::new() } }
    /// Release every page back to the disk manager. Forgetting this leaks pages until restart.
    pub fn free(self, bpm: &Bpm) { for p in self.pages { bpm.delete_page(p); } }
}

pub struct SpillIter<'a> { bpm: &'a Bpm, pages: &'a [PageId], pi: usize, cur: VecDeque<Row> }
impl Iterator for SpillIter<'_> {
    type Item = Result<Row>;
    fn next(&mut self) -> Option<Self::Item> {
        while self.cur.is_empty() && self.pi < self.pages.len() {
            let g = match self.bpm.read_page(self.pages[self.pi]) { Ok(g) => g, Err(e) => { self.pi = usize::MAX - 1; return Some(Err(e.into())) } };
            let d = g.data();
            let used = u32::from_le_bytes(d[0..4].try_into().unwrap()) as usize;
            let mut at = 4;
            while at < 4 + used {
                let l = u32::from_le_bytes(d[at..at + 4].try_into().unwrap()) as usize;
                self.cur.push_back(decode_row(&d[at + 4..at + 4 + l]));
                at += 4 + l;
            }
            self.pi += 1;
            PAGES_READ.fetch_add(1, Relaxed);
        }
        self.cur.pop_front().map(Ok)
    }
}
