[[sections]]
heading = "The algorithm"
body = """
```text
start:
  read the right (build) side; if it has ≤ budget rows → in-memory hash join and stop
  PHASE 1: stream both sides into `fanout` spill files each, by hash h₁ of the join key
           (NULL-keyed rows can never match: drop them; for LEFT joins emit left ones with NULLs now)
join_partition(L_i, R_i, depth):
  R_i empty         → inner: nothing; left: emit every L_i row with NULLs
  |R_i| ≤ budget    → build hash table from R_i, stream L_i against it, free both files
  else, depth < 6   → re-partition both with hash h_{depth+1}; if some sub-partition still holds ALL of R_i,
                      it's one hot key: no hash function can split it
  else              → block nested loop: load R_i in budget-sized chunks, scan L_i once per chunk,
                      track matched flags for LEFT joins
```

<p>Cost for the in-memory-after-one-partitioning case: <strong>3(M + N)</strong> page I/Os: write both sides (M + N), read them back (M + N) and the initial scans (counted by the children). The measurement below follows the shape: shrink <code>work_mem</code> and the pages written grow, because partitions have to be split again.</p>

:::deeper Grace join executor: in-memory fast path, partitioning, recursion, hot-key fallback
```rust title="src/execution/grace_hash_join.rs"
//! Memory-bounded operators: Grace hash join and external merge sort, both spilling through the buffer pool.
use std::cmp::Ordering;
use std::collections::{BinaryHeap, HashMap, VecDeque};
use std::hash::{Hash, Hasher};
use crate::types::value::Value;
use super::catalog::Bpm;
use super::exec::{Exec, Tuple};
use super::expr::{truthy, Expr};
use super::spill::{Row, SpillFile, SpillWriter};
use super::sql::JoinKind;
use super::Result;

type Boxed<'e> = Box<dyn Exec + 'e>;
const MAX_DEPTH: u32 = 6;

fn nulls(n: usize) -> Row { vec![Value::Null; n] }
fn keys(es: &[Expr], row: &[Value]) -> Result<Vec<Value>> { es.iter().map(|e| e.eval(row)).collect() }
fn part_of(key: &[Value], seed: u32, fanout: usize) -> usize {
    let mut h = std::collections::hash_map::DefaultHasher::new();
    seed.hash(&mut h);                       // a different seed per recursion level = a different hash function (h1, h2, ...)
    key.hash(&mut h);
    (h.finish() % fanout as u64) as usize
}
// ---------------- Grace hash join ---------------------------------------------------------------------
pub struct GraceJoin<'e> {
    bpm: &'e Bpm, left: Boxed<'e>, right: Option<Boxed<'e>>, lk: Vec<Expr>, rk: Vec<Expr>, residual: Option<Expr>,
    kind: JoinKind, rw: usize, budget: usize, fanout: usize,
    out: VecDeque<Row>, parts: VecDeque<(SpillFile, SpillFile)>, started: bool,
    /// in-memory fast path: right side fit in `budget`, so stream the left side against a hash table
    inmem: Option<HashMap<Vec<Value>, Vec<Row>>>,
}

impl<'e> GraceJoin<'e> {
    #[allow(clippy::too_many_arguments)]
    pub fn new(bpm: &'e Bpm, left: Boxed<'e>, right: Boxed<'e>, lk: Vec<Expr>, rk: Vec<Expr>, residual: Option<Expr>, kind: JoinKind, rw: usize, budget: usize) -> Self {
        GraceJoin { bpm, left, right: Some(right), lk, rk, residual, kind, rw, budget: budget.max(2), fanout: 8, out: VecDeque::new(), parts: VecDeque::new(), started: false, inmem: None }
    }

    fn probe(&self, l: &[Value], table: &HashMap<Vec<Value>, Vec<Row>>, out: &mut VecDeque<Row>) -> Result<()> {
        let key = keys(&self.lk, l)?;
        let mut any = false;
        if !key.iter().any(Value::is_null) {
            for m in table.get(&key).into_iter().flatten() {
                let joined: Row = l.iter().chain(m).cloned().collect();
                if self.residual.as_ref().map_or(Ok(true), |p| p.eval(&joined).map(|v| truthy(&v)))? { any = true; out.push_back(joined); }
            }
        }
        if !any && self.kind == JoinKind::Left { out.push_back(l.iter().cloned().chain(nulls(self.rw)).collect()); }
        Ok(())
    }

    fn build(&self, rows: impl Iterator<Item = Result<Row>>) -> Result<HashMap<Vec<Value>, Vec<Row>>> {
        let mut t: HashMap<Vec<Value>, Vec<Row>> = HashMap::new();
        for r in rows { let r = r?; let k = keys(&self.rk, &r)?; if !k.iter().any(Value::is_null) { t.entry(k).or_default().push(r); } }
        Ok(t)
    }

    fn start(&mut self) -> Result<()> {
        self.started = true;
        let mut right = self.right.take().unwrap();
        let mut mem: Vec<Row> = vec![];
        let mut spilled = false;
        while let Some(t) = right.next()? { mem.push(t.vals); if mem.len() > self.budget { spilled = true; break; } }
        if !spilled { self.inmem = Some(self.build(mem.into_iter().map(Ok))?); return Ok(()); }
        // Phase 1: partition both inputs with h1 into `fanout` spill files each.
        let mut rw: Vec<SpillWriter> = (0..self.fanout).map(|_| SpillWriter::new(self.bpm)).collect();
        let mut lw: Vec<SpillWriter> = (0..self.fanout).map(|_| SpillWriter::new(self.bpm)).collect();
        let part = |w: &mut Vec<SpillWriter>, row: &Row, es: &[Expr]| -> Result<bool> {
            let k = keys(es, row)?;
            if k.iter().any(Value::is_null) { return Ok(false); }       // can never match
            w[part_of(&k, 1, self.fanout)].push(row)?;
            Ok(true)
        };
        for r in mem.drain(..) { part(&mut rw, &r, &self.rk)?; }
        while let Some(t) = right.next()? { part(&mut rw, &t.vals, &self.rk)?; }
        while let Some(t) = self.left.next()? {
            if !part(&mut lw, &t.vals, &self.lk)? && self.kind == JoinKind::Left {
                self.out.push_back(t.vals.into_iter().chain(nulls(self.rw)).collect());   // NULL-keyed left rows: unmatched by definition
            }
        }
        for (l, r) in lw.into_iter().zip(rw) { self.parts.push_back((l.finish()?, r.finish()?)); }
        Ok(())
    }

    /// Phase 2: join one partition pair (recursing if the build side is still too big).
    fn join_partition(&mut self, l: SpillFile, r: SpillFile, depth: u32) -> Result<()> {
        if l.rows == 0 { l.free(self.bpm); r.free(self.bpm); return Ok(()); }
        if r.rows == 0 {
            if self.kind == JoinKind::Left { for row in l.iter(self.bpm) { self.out.push_back(row?.into_iter().chain(nulls(self.rw)).collect()); } }
            l.free(self.bpm); r.free(self.bpm); return Ok(());
        }
        if r.rows <= self.budget {
            let table = self.build(r.iter(self.bpm))?;
            let mut out = VecDeque::new();
            for row in l.iter(self.bpm) { self.probe(&row?, &table, &mut out)?; }
            self.out.extend(out);
            l.free(self.bpm); r.free(self.bpm);
            return Ok(());
        }
        if depth < MAX_DEPTH {
            // Re-partition both sides with a new hash function. If one sub-partition still holds the whole
            // build side, the data is one hot key: no hash function can split it.
            let mut rw: Vec<SpillWriter> = (0..self.fanout).map(|_| SpillWriter::new(self.bpm)).collect();
            let mut lw: Vec<SpillWriter> = (0..self.fanout).map(|_| SpillWriter::new(self.bpm)).collect();
            for row in r.iter(self.bpm) { let row = row?; let k = keys(&self.rk, &row)?; rw[part_of(&k, depth + 1, self.fanout)].push(&row)?; }
            for row in l.iter(self.bpm) { let row = row?; let k = keys(&self.lk, &row)?; lw[part_of(&k, depth + 1, self.fanout)].push(&row)?; }
            let rfiles: Vec<SpillFile> = rw.into_iter().map(|w| w.finish()).collect::<Result<_>>()?;
            let lfiles: Vec<SpillFile> = lw.into_iter().map(|w| w.finish()).collect::<Result<_>>()?;
            if rfiles.iter().all(|f| f.rows < r.rows) {
                l.free(self.bpm); r.free(self.bpm);
                for (lf, rf) in lfiles.into_iter().zip(rfiles) { self.join_partition(lf, rf, depth + 1)?; }
                return Ok(());
            }
            for f in lfiles.into_iter().chain(rfiles) { f.free(self.bpm); }
        }
        self.block_nested_loop(l, r)
    }

    /// Fallback for a partition that cannot be split: load the build side in `budget`-row chunks and
    /// scan the probe side once per chunk. Sequential I/O in exchange for repeated passes.
    fn block_nested_loop(&mut self, l: SpillFile, r: SpillFile) -> Result<()> {
        let mut matched = vec![false; l.rows];
        let mut chunk: Vec<Row> = vec![];
        let mut rows = r.iter(self.bpm);
        loop {
            chunk.clear();
            while chunk.len() < self.budget { match rows.next() { Some(x) => chunk.push(x?), None => break } }
            if chunk.is_empty() { break; }
            let table = self.build(chunk.iter().cloned().map(Ok))?;
            for (i, row) in l.iter(self.bpm).enumerate() {
                let row = row?;
                let key = keys(&self.lk, &row)?;
                for m in table.get(&key).into_iter().flatten() {
                    let joined: Row = row.iter().chain(m).cloned().collect();
                    if self.residual.as_ref().map_or(Ok(true), |p| p.eval(&joined).map(|v| truthy(&v)))? { matched[i] = true; self.out.push_back(joined); }
                }
            }
        }
        if self.kind == JoinKind::Left {
            for (i, row) in l.iter(self.bpm).enumerate() { if !matched[i] { self.out.push_back(row?.into_iter().chain(nulls(self.rw)).collect()); } }
        }
        drop(rows);
        l.free(self.bpm); r.free(self.bpm);
        Ok(())
    }
}

impl Exec for GraceJoin<'_> {
    fn next(&mut self) -> Result<Option<Tuple>> {
        if !self.started { self.start()?; }
        loop {
            if let Some(r) = self.out.pop_front() { return Ok(Some(Tuple { vals: r, rid: None })); }
            if let Some(table) = self.inmem.take() {
                let r = match self.left.next()? { Some(l) => { let mut o = VecDeque::new(); self.probe(&l.vals, &table, &mut o)?; self.out = o; true } None => false };
                self.inmem = Some(table);
                if r { continue } else { return Ok(None) }
            }
            let Some((l, r)) = self.parts.pop_front() else { return Ok(None) };
            self.join_partition(l, r, 1)?;
        }
    }
}
```
:::

```text title="the same query at shrinking work_mem (rows) · 4000-row probe side, 200-row build side · includes pages through the BPM"
hash join 4000 ⋈ 200   work_mem          ∞:    0 pages written,    0 read    (in-memory)
hash join 4000 ⋈ 200   work_mem       2000:    0 pages written,    0 read    (build side fits: no spill)
hash join 4000 ⋈ 200   work_mem        400:   99 pages written,  105 read
hash join 4000 ⋈ 200   work_mem        100:  211 pages written,  235 read    (build > 100: partition both sides)
hash join 4000 ⋈ 200   work_mem         20:  600 pages written,  719 read    (partitions still too big: re-partition)
```
