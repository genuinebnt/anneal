[[sections]]
heading = "Tests"
body = """
<p><code>spilled_equals_in_memory</code> runs four join shapes (inner, left, inner with a residual predicate, left with an ON-clause filter) and two sorts under budgets of 3, 50, 400 and 1500 rows, on tables with <strong>~20% of keys equal to one hot value</strong> and <strong>5% NULL keys</strong>, behind a <strong>64-frame</strong> buffer pool, so spill files are larger than the pool. Each result must equal the in-memory result, and a second run must not grow the database file: if <code>free</code> is forgotten, <code>disk.num_pages()</code> increases on every query.</p>

<aside data-call="warning"><b>What the hot-key case teaches</b><p>With a budget of 3 and 20% of 200 build rows on one key, no amount of re-partitioning helps: all those rows hash to the same bucket at every depth. A naive Grace join recurses until stack overflow. The detection (<code>rfiles.iter().all(|f| f.rows &lt; r.rows)</code> fails ⇒ one sub-partition holds everything) turns that into a bounded number of sequential passes via block nested loop. BusTub's spec calls out the same edge case.</p></aside>

<aside data-call="performance"><b>Hybrid and adaptive improvements</b><ul> <li><strong>Hybrid hash join</strong>: while partitioning, keep partition 0 as an in-memory hash table and join it immediately instead of spilling. It saves a write and a read of 1/fanout of the data.</li> <li><strong>Bloom filter</strong>: build one over the build keys during the build scan; probe rows that fail it are dropped <em>before</em> being written to a partition (<a href="/cookbook/p/filters-tries-inverted-and-vector-indexes">L09</a>). BusTub's leaderboard Query 3 is exactly this.</li> <li><strong>Skew-aware partitioning</strong>: sample the probe side's heavy hitters (<a href="/cookbook/p/count-min-sketch">count-min</a>) and broadcast those keys instead of hashing them.</li> <li><strong>Output streaming</strong>: the reference collects one partition's output into a queue. A streaming version emits as it probes, bounding memory by the build table, not by the join's fan-out.</li> </ul></aside>
"""
