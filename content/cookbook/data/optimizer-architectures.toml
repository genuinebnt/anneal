heading = "Measured"
body = """
```text title="1. join order by architecture: cost ÷ optimal bushy cost, p50 / p90, n = 8"
shape          listed order     smallest table System R (left-deep)   cost-based bushy
Chain         5.88 / 383.23        1.24 / 8.96          1.01 / 3.43        1.00 / 1.00
Star         11.50 / 234.90        1.00 / 1.03          1.00 / 1.00        1.00 / 1.00
Cycle      125.85 / 5272.93        2.25 / 9.65          1.49 / 3.77        1.00 / 1.00
Clique   5748.91 / 743822.74        1.73 / 5.32          1.02 / 1.79        1.00 / 1.00
Random   14586.59 / 16539425.92   29.83 / 27274.00          1.00 / 1.40        1.00 / 1.00
```

```text title="2. value of interesting orders: cost without merge joins ÷ cost with them (p50 / p90 / max)"
shape                   no ORDER BY        ORDER BY a join key
Chain          1.000 / 1.000 / 1.00       1.000 / 1.375 / 3.70
Star           1.000 / 1.000 / 1.00       1.000 / 1.441 / 4.10
Clique         1.000 / 1.000 / 1.00       1.000 / 1.000 / 1.11
Random         1.000 / 1.000 / 1.00       1.000 / 1.000 / 2.51
```

```text title="3. convergence of pruned top-down search: alternatives costed (median of 30 queries, n = 9)"
shape      first plan   within 25%    within 5%      optimal   total costed first plan cost/opt
Chain              97          108          113          116            127           1.15
Star               98          103          117          117            117           1.16
Cycle              94          135          142          142            163          58.74
Clique            318          370          387          387            396           7.45
```

<ul> <li><strong>No statistics, no chance</strong>: a rule-based "listed order" plan is <strong>5.9× (chain) to 14 586× (random graphs) worse at the median</strong>, and its p90 reaches millions: without cardinalities the optimizer can't tell a selective join from an explosive one. A magic-constant rule ("smallest table next") is far better (median 1.0–2.3× on the four regular shapes) but still <strong>30× worse at the median on random graphs</strong> and 27 000× at p90, because table size alone says nothing about join selectivity. This is the quantitative case for cost-based search and for <em>good statistics</em>.</li> <li><strong>System R's restriction is mostly harmless but not free</strong>: cost-based left-deep DP is within 1.5× at the median everywhere and 1.4–3.8× at p90 (stars: always optimal, p90 1.00). Bushy plans matter on chains and cycles (<a href="/cookbook/p/join-ordering">Q4</a>).</li> <li><strong>Interesting orders pay off only when someone wants the order</strong>: without <code>ORDER BY</code> merge joins and orders never helped under this cost model (a sort costs more than the hash build it avoids, and indexed inputs are rare), so keeping ordered sub-plans around did <strong>nothing</strong> (every ratio 1.000). With <code>ORDER BY</code> on a join key, <strong>1 query in 10 gains ≥ 1.37×</strong> on chains and stars and the best case is <strong>4.1×</strong> (the ordered result comes from an index scan feeding merge joins, with no final sort). A property-aware search costs more bookkeeping; whether it pays depends on the workload's <code>ORDER BY</code>/<code>GROUP BY</code> mix and on how much of the data is clustered.</li> <li><strong>Top-down search finds a plan late, and the first plan can be terrible</strong>: nearly all the work is spent descending to the leaves before the root has <em>any</em> plan (94–98 of ~120–160 alternatives on chains, stars, cycles); on chains and stars that first plan is already within 1.2× of optimal. On <strong>cycles the first plan is 58× worse</strong> than the optimum and on cliques 7.5×: the first plan follows the <em>seed</em> join order the memo started from, and the best plan only appears at <strong>87% (cycles) to 98% (cliques)</strong> of the total effort. So a <strong>cost-threshold or "stop at the first plan" termination is dangerous on cyclic queries</strong>; a transformation-count budget with a good heuristic seed (SQL Server pre-fills the memo with a join order chosen by heuristic analysis) is safer.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A heuristic is a function from a graph to an order</strong>: <code>pick(g, listed, score)</code> is one generic routine parameterised by a scoring closure (<code>impl Fn(&amp;Graph, u64, usize) -&gt; f64</code>); "listed order" is the constant-zero score, "smallest table" scores base cardinality. Real rule-based planners are <em>ordered lists of such functions</em> (<a href="/cookbook/p/plan-transformations-and-rule-soundness">Q3</a>, <a href="/cookbook/p/query-planning-and-rewriting">L15</a>); keeping each a pure function over the plan makes them testable in isolation.</li> <li><strong>Verification by oracle ratio</strong>: every experiment divides by a cost from an algorithm already verified elsewhere; an architecture comparison is only as trustworthy as its reference plan.</li> <li><strong><code>total_cmp</code> for floats</strong>: sorting estimates with <code>partial_cmp().unwrap()</code> would panic on a NaN; <code>f64::total_cmp</code> orders every value.</li> <li><strong>Deterministic seeds</strong> (<code>Rng(77)</code>) make every printed table reproducible; changing the generator changes the absolute ratios, never the ordering of the architectures.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>"Optimal" means optimal under the model</strong>: all of the above optimize <em>estimated</em> cost. A cost model that underestimates systematically (as production models do) can make the "optimal" plan slower than a simpler one (<a href="/cookbook/p/cardinality-estimation">Q8</a>, <a href="/cookbook/p/cost-models">Q9</a>).</li> <li><strong>Magic constants rot</strong>: PostgreSQL's cost constants assume a disk-resident database with little memory (in-memory tuple processing 400× cheaper than a disk read; sequential I/O 4× cheaper than random); DuckDB falls back to a fixed 20% selectivity without HyperLogLog statistics. Heuristics encode the hardware and workload of the year they were written.</li> <li><strong>Time-based termination makes plans non-deterministic</strong>: the same query gets different plans on a loaded machine; budget by <em>work</em> (transformations, alternatives costed) instead.</li> <li><strong>First plan ≠ good plan</strong>: see measurement 3; never ship an optimizer whose early-exit path returns the seed plan unchecked.</li> <li><strong>Stratified vs unified is also an engineering decision</strong>: a staged optimizer (rewrite, then cost-based) is easier to reason about and to debug, but rules in an early stage can't be undone by cost; a unified memo can, at the price of a much larger search and subtler bugs.</li> </ul></aside>
"""

