[[sections]]
heading = "Overview"
body = """
<p>The last lecture of the course is a showcase: practitioners from several vendors describe how a real system differs from the textbook one. There is no reading from the course for it, so this section records the <strong>public design ideas of each system</strong> (with papers and docs to confirm details) and then turns the whole of Part I into a map of what to study next.</p>

### Key ideas

<ul> <li><strong>Real systems are the textbook components, specialised.</strong> Every system below is a different answer to <em>the same five questions</em>: how is data laid out, how is it indexed, how is a query executed, how are updates made safe, how does it scale out.</li> <li><strong>Lakehouse</strong>: keep data in <strong>open columnar files</strong> (Parquet) on cheap <strong>object storage</strong>, and add a <strong>transaction log / table format</strong> (Delta Lake, Apache Iceberg, Apache Hudi) so it behaves like a database table: ACID commits by atomically appending a log entry, snapshot reads, time travel, schema evolution, and data skipping via per-file min/max statistics.</li> <li><strong>Photon-style engines</strong>: a <strong>vectorized, native (C++) execution engine</strong> under a Spark-compatible planner: batch-at-a-time operators, SIMD-friendly kernels, adaptive runtime decisions: the course's "vectorization vs compilation" trade-off, settled for vectorization on operational grounds (easier to build, profile and debug).</li> <li><strong>ClickHouse</strong>: <strong>MergeTree</strong> tables are sets of immutable, <strong>sorted parts</strong> merged in the background (an LSM-style write path), each column stored and compressed separately with a <strong>sparse primary index</strong> (one entry per granule of ~8 192 rows), vectorized execution, and aggressive pre-aggregation (materialized views, projections).</li> <li><strong>Warehouse engines built for flash and large memories</strong>: tune the buffer/cache hierarchy to NVMe bandwidth, scan columnar data with SIMD, and keep the PostgreSQL wire protocol and dialect for compatibility.</li> <li><strong>Relational knowledge graphs / relational AI</strong>: use the relational model as the single abstraction for graph, logic and analytics, with <strong>worst-case optimal joins</strong>, incremental view maintenance and a declarative language over relations.</li> <li><strong>Takeaway</strong>: the winning designs <strong>separate storage from compute</strong>, keep <strong>open formats</strong>, make <strong>the execution engine vectorized and the optimizer adaptive</strong>, and treat <strong>the log</strong> as the source of truth.</li> </ul>
"""

