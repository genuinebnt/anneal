[[sections]]
heading = "A table format in one picture"
body = """
```text
object store:   table/
                  _log/00000.json   add file a.parquet(min,max,rows) add file b.parquet(...)
                  _log/00001.json   remove a.parquet, add c.parquet            ← a "commit"
                  _log/00002.json   ...
                  a.parquet  b.parquet  c.parquet                              ← immutable data files

commit protocol:  write data files (anywhere), then atomically create _log/N+1 if it doesn't exist
                  (put-if-absent / rename). If it exists, another writer won: re-read the new log entries,
                  check conflicts (did they touch files I read or rewrote?), retry or abort.
snapshot read:    pick a log version V, replay actions ≤ V ⇒ the exact file list; prune files by min/max.
time travel:      read version V−k. Vacuum deletes files no retained version references (garbage collection, [L20](#l20)).
```

<p>Every box is a concept from Part I: <strong>MVCC</strong> (versions of the file list), <strong>OCC</strong> (validate at commit), <strong>WAL</strong> (the log <em>is</em> the database), <strong>zone maps/data skipping</strong> (min/max per file), <strong>garbage collection</strong> with a retention horizon.</p>
"""

