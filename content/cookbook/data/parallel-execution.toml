[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Why parallelism</strong>: data bigger than one machine, higher performance, redundancy. <strong>Parallel DBMS</strong>: nodes close together, fast, cheap, reliable interconnect. <strong>Distributed DBMS</strong>: nodes far apart, slow and unreliable links, failures can't be ignored. Either way the application sees one logical database, and a query must return the same result.</li> <li><strong>Process models</strong>: <strong>process per worker</strong> (each worker an OS process; the OS schedules; shared memory for global structures; a crash is contained; PostgreSQL, Oracle, DB2 originally, because <code>fork()</code> predated portable threads). <strong>Thread per worker</strong> (one process, many threads; the DBMS controls scheduling; cheaper context switches; a bad thread can kill the process; nearly every system of the last 20 years). <strong>Embedded</strong> (the DBMS runs in the application's address space and the app schedules; DuckDB, SQLite, RocksDB).</li> <li><strong>Scheduling</strong> decisions: how many tasks and cores, which cores, where to put output. The DBMS knows more than the OS, so it decides.</li> <li><strong>Inter-query parallelism</strong>: different queries run concurrently: more throughput, lower latency. Read-only queries need little coordination; concurrent writers need concurrency control (L17+).</li> <li><strong>Intra-query parallelism</strong> (one query on many workers) as a producer/consumer pipeline: <strong>intra-operator (horizontal)</strong>: the same operator on disjoint data fragments, combined by an <strong>exchange</strong>; <strong>inter-operator (vertical, pipelined)</strong>: operators overlap, passing data between workers without materializing (stream processing); <strong>bushy</strong>: different subtrees of the plan run at once, joined by exchanges.</li> <li><strong>Exchange operator kinds</strong>: <strong>gather</strong> (many streams → one, the most common), <strong>distribute</strong> (one → many), <strong>repartition</strong> (many → many, re-hashing on a different key).</li> <li><strong>I/O parallelism</strong>: threads don't help if the disk is the bottleneck. <strong>Multi-disk</strong> (RAID/appliances; transparent to the DBMS) or <strong>database partitioning</strong> (disjoint subsets on different devices; logical table partitioning that's transparent to the application; the log is usually shared).</li> </ul>
"""

