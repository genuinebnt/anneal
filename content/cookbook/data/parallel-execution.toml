[[sections]]
heading = "Morsel-driven scheduling"
body = """
<p>Static partitioning (thread <em>i</em> gets pages <em>i</em>, <em>i + n</em>, …) fails when some pages are slower (cache misses, skew, a noisy neighbour): the whole query waits for the slowest thread. The <strong>morsel-driven</strong> model (Leis et al., SIGMOD 2014; HyPer, DuckDB, Velox) cuts the input into small <strong>morsels</strong> (~10–100k rows) and lets every worker take the next one from a <strong>shared atomic counter</strong>. Fast workers simply take more morsels, so load balances itself and the scheduler is one <code>fetch_add</code>. Each worker owns <strong>thread-local state</strong> (a partial aggregate, a local hash table) that nobody else touches, and the pipeline's <strong>sink</strong> combines the local states when the input is exhausted.</p>

:::deeper Reference: morsel-driven scan, gather exchange, three parallel GROUP BY strategies, radix-partitioned hash join
```rust title="src/execution/parallel.rs"
//! L14: intra-query parallelism over in-memory columns. Work is cut into morsels that threads pull
//! from a shared atomic counter (dynamic load balancing); results meet at an exchange.
use std::collections::HashMap;
use std::sync::atomic::{AtomicUsize, Ordering::Relaxed};
use std::sync::mpsc;
use std::sync::Mutex;

pub const MORSEL: usize = 16 * 1024;

/// Run `f(range)` over [0, n) in morsels on `threads` threads; each thread owns a local state `S`
/// (created by `init`) so workers never share mutable data. Returns every thread's final state.
pub fn morsel_driven<S: Send>(n: usize, threads: usize, init: impl Fn() -> S + Sync, f: impl Fn(&mut S, std::ops::Range<usize>) + Sync) -> Vec<S> {
    let next = AtomicUsize::new(0);
    std::thread::scope(|s| {
        let hs: Vec<_> = (0..threads).map(|_| s.spawn(|| {
            let mut st = init();
            loop {
                let start = next.fetch_add(MORSEL, Relaxed);          // claim the next morsel: the whole scheduler
                if start >= n { break; }
                f(&mut st, start..(start + MORSEL).min(n));
            }
            st
        })).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    })
}

/// SELECT SUM(v) WHERE k % 3 = 0, in parallel: a partial sum per worker, combined at the end.
pub fn filter_sum(k: &[i64], v: &[i64], threads: usize) -> i64 {
    morsel_driven(k.len(), threads, || 0i64, |acc, r| for i in r { if k[i] % 3 == 0 { *acc += v[i]; } }).into_iter().sum()
}

/// Gather exchange: workers push batches into a channel; one consumer drains it.
pub fn gather_filter(k: &[i64], v: &[i64], threads: usize) -> Vec<i64> {
    let (tx, rx) = mpsc::channel::<Vec<i64>>();
    let next = AtomicUsize::new(0);
    std::thread::scope(|s| {
        for _ in 0..threads {
            let tx = tx.clone();
            let next = &next;
            s.spawn(move || loop {
                let start = next.fetch_add(MORSEL, Relaxed);
                if start >= k.len() { break; }
                let batch: Vec<i64> = (start..(start + MORSEL).min(k.len())).filter(|&i| k[i] % 3 == 0).map(|i| v[i]).collect();
                if !batch.is_empty() { tx.send(batch).unwrap(); }
            });
        }
        drop(tx);                                                      // the consumer ends when every producer drops its sender
        rx.into_iter().flatten().collect()
    })
}

// ---------------- parallel GROUP BY k: SUM(v) -----------------------------------------------------
/// Strategy 1: one shared hash table behind a mutex. Correct, and the scalability counter-example.
pub fn group_shared(k: &[i64], v: &[i64], threads: usize) -> HashMap<i64, i64> {
    let table: Mutex<HashMap<i64, i64>> = Mutex::new(HashMap::new());
    morsel_driven(k.len(), threads, || (), |_, r| for i in r { *table.lock().unwrap().entry(k[i]).or_default() += v[i]; });
    table.into_inner().unwrap()
}

/// Strategy 2: thread-local tables, then a sequential merge (the "combine" step is serial).
pub fn group_local_merge(k: &[i64], v: &[i64], threads: usize) -> HashMap<i64, i64> {
    let locals = morsel_driven(k.len(), threads, HashMap::<i64, i64>::new, |m, r| for i in r { *m.entry(k[i]).or_default() += v[i]; });
    let mut out: HashMap<i64, i64> = HashMap::new();
    for l in locals { for (g, s) in l { *out.entry(g).or_default() += s; } }
    out
}

/// Strategy 3: thread-local tables partitioned by hash; then the merge itself runs in parallel,
/// one worker per partition (a repartition exchange between the two phases).
pub fn group_partitioned(k: &[i64], v: &[i64], threads: usize) -> HashMap<i64, i64> {
    let parts = threads.next_power_of_two().max(1);
    let part_of = |g: i64| (crate::hashing::hash64(g as u64, 5) as usize) & (parts - 1);
    let locals = morsel_driven(k.len(), threads, || vec![HashMap::<i64, i64>::new(); parts], |m, r| for i in r { *m[part_of(k[i])].entry(k[i]).or_default() += v[i]; });
    let merged: Vec<HashMap<i64, i64>> = std::thread::scope(|s| {
        let locals = &locals;
        let hs: Vec<_> = (0..parts).map(|p| s.spawn(move || {
            let mut out: HashMap<i64, i64> = HashMap::new();
            for l in locals { for (g, sum) in &l[p] { *out.entry(*g).or_default() += sum; } }
            out
        })).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    });
    merged.into_iter().flatten().collect()
}

// ---------------- parallel radix-partitioned hash join ----------------------------------------------
/// Count of matching pairs in R ⋈ S on key. Phase 1: each worker partitions its slice of both inputs by
/// the low bits of the key hash. Phase 2: one partition per task, build then probe, each partition's
/// table small enough to stay cache-resident.
pub fn radix_join_count(r: &[u64], s: &[u64], threads: usize, bits: u32) -> u64 {
    let p = 1usize << bits;
    let part = |x: u64| (crate::hashing::hash64(x, 9) as usize) & (p - 1);
    let split = |data: &[u64]| -> Vec<Vec<Vec<u64>>> {
        let chunk = data.len().div_ceil(threads).max(1);
        std::thread::scope(|sc| {
            let hs: Vec<_> = data.chunks(chunk).map(|c| sc.spawn(move || {
                let mut out = vec![Vec::with_capacity(c.len() / p + 1); p];
                for &x in c { out[part(x)].push(x); }
                out
            })).collect();
            hs.into_iter().map(|h| h.join().unwrap()).collect()
        })
    };
    let (rp, sp) = (split(r), split(s));
    let next = AtomicUsize::new(0);
    std::thread::scope(|sc| {
        let hs: Vec<_> = (0..threads).map(|_| sc.spawn(|| {
            let mut total = 0u64;
            loop {
                let i = next.fetch_add(1, Relaxed);
                if i >= p { break; }
                let mut ht: HashMap<u64, u32> = HashMap::new();
                for w in &rp { for &x in &w[i] { *ht.entry(x).or_default() += 1; } }
                for w in &sp { for &y in &w[i] { total += ht.get(&y).copied().unwrap_or(0) as u64; } }
            }
            total
        })).collect();
        hs.into_iter().map(|h| h.join().unwrap()).sum()
    })
}
```
:::
"""

