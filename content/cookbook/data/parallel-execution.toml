heading = "Measured scaling"
body = """
```text title="20M rows · Apple M4 Pro (12 cores) · wall time at 1 / 2 / 4 / 8 / 12 threads · verify/tests/parallel.rs"
scan + filter + SUM                       57.8 ms   23.5   12.8    6.7    5.3     ← 11× : embarrassingly parallel
GROUP BY 1k groups, shared table + mutex  280.6 ms  447    923    2000   1700    ← 6× SLOWER with 8 threads
  … thread-local tables, serial merge     232.0 ms  116     62     32     26     ← 9×
  … local tables, parallel merge          284.0 ms  144     72     40     32     ← 9× (partitioning costs a little here)
GROUP BY 5M groups, local + serial merge  1.3 s     1.1 s  970   1100   1100    ← the serial merge is the bottleneck: 1×
  … local tables, parallel merge          1.5 s     945    594    435    358     ← 4×
hash join 4M ⋈ 20M (radix, 256 parts)     321.6 ms  165     95     52     44     ← 7×
```

<p>Three lessons, each visible in a row:</p>

<ol> <li><strong>Shared mutable state kills scaling.</strong> The mutex version gets <em>slower</em> with more threads: every update bounces the same cache line, and the lock serializes everything. The fix is structural (<strong>thread-local state + a combine step</strong>), not a faster lock.</li> <li><strong>The combine step can become the new bottleneck</strong> (Amdahl's law). With 1k groups the merge costs nothing. With 5M groups a serial merge of twelve 5M-entry tables dominates, so the merge itself has to be parallelized: <strong>repartition</strong> the partial results by hash (an exchange) and let each worker merge one partition.</li> <li><strong>Partitioning pays when state is big.</strong> The radix join splits both inputs into 256 partitions so that each build table is small and stays in cache. That's why it scales, and why the single-threaded join is also faster than one global table for large inputs.</li> </ol>

<aside data-call="rust"><b>Scoped threads make this borrow-checker-friendly</b><p><code>std::thread::scope</code> lets worker closures <strong>borrow</strong> <code>k</code>, <code>v</code> and the shared atomic counter from the caller's stack, with no <code>Arc</code> and no <code>'static</code> bound: the scope guarantees every thread is joined before it returns. Each worker returns its local state from the thread's closure (<code>h.join().unwrap()</code>), so there is no shared <code>Mutex&lt;Vec&lt;…&gt;&gt;</code> to collect results. This single API removes most of the reasons people reach for <code>Arc&lt;Mutex&lt;_&gt;&gt;</code> in parallel query code. For production, use a pool (<code>rayon</code>, or your own with a work queue) instead of spawning threads per query. Reference: <a href="https://doc.rust-lang.org/std/thread/fn.scope.html" target="_blank" rel="noreferrer"><code>std::thread::scope</code></a>.</p></aside>

<aside data-call="rust"><b>Channels as exchange operators</b><p><code>gather_filter</code> is a gather exchange in 12 lines: workers hold cloned <code>Sender</code>s, the consumer iterates the <code>Receiver</code>, and the channel closes when the last sender drops. That's the whole protocol. For a <em>repartition</em> exchange you need one channel per consumer, plus a hash on the key at the producer. For backpressure (so a fast producer can't buffer unbounded batches), use <code>mpsc::sync_channel(capacity)</code> or <code>crossbeam</code>'s bounded channels.</p></aside>

<aside data-call="performance"><b>What production engines add</b><ul> <li><strong>NUMA awareness</strong>: allocate each morsel's data on the socket of the worker that will process it (HyPer/Umbra).</li> <li><strong>Work stealing for pipeline breakers</strong>: when a hash table build finishes, the probe phase starts immediately with the same workers, and the scheduler prioritizes morsels by query to avoid starvation.</li> <li><strong>Adaptive parallelism</strong>: don't parallelize a query that processes 1,000 rows. Thread startup costs ~50 µs; the optimizer decides the degree of parallelism from cardinality estimates (PostgreSQL's <code>max_parallel_workers_per_gather</code> and per-table cost thresholds).</li> <li><strong>Parallel I/O</strong>: more workers than cores to keep the SSD's queue deep (<a href="/cookbook/p/disk-scheduler">P1.2</a>).</li> </ul></aside>

<aside data-call="production"><b>Where each model shows up</b><ul> <li><strong>PostgreSQL</strong>: process per connection; parallel query via <em>Gather</em> / <em>Gather Merge</em> nodes and background worker processes with a dynamic shared-memory segment; parallel hash join with a shared hash table.</li> <li><strong>DuckDB, Umbra, Velox</strong>: thread pools, morsel-driven pipelines, a thread-local sink state combined at the end.</li> <li><strong>SQL Server, Oracle</strong>: exchange operators (<em>Parallelism</em> / <em>Table Queue</em>), degree of parallelism (DOP) as a user-visible knob.</li> <li><strong>Distributed engines</strong> (Spark, Presto/Trino, Snowflake): the same exchange model with network shuffles instead of memory channels (<a href="/cookbook/p/distributed-databases-i">L23</a>).</li> </ul></aside>
