heading = "The module and its host"
body = """
<p>The module is a separate crate (<code>crate-type = ["cdylib"]</code>, <code>panic = "abort"</code>, <code>opt-level = "s"</code>, link-time optimization) that depends on the engine crate and exports the seven functions above. It contains no logic of its own.</p>

```rust title="the module: seven exported functions over the facade (wasm/src/lib.rs)"
//! The WebAssembly module: a handful of exported functions over `verify::facade`. The host allocates buffers inside the module's memory
//! with `alloc`, writes SQL into them, calls `db_execute`, reads the reply (a 4-byte little-endian length followed by that many bytes) and
//! returns it with `reply_free`. Nothing but integers crosses the boundary.
use std::cell::RefCell;
use verify::facade::Registry;

thread_local! {
    static REGISTRY: RefCell<Registry> = RefCell::new(Registry::default());
}

/// Allocate `len` bytes in the module's memory and return their address.
#[unsafe(no_mangle)]
pub extern "C" fn alloc(len: usize) -> *mut u8 {
    let mut v = Vec::<u8>::with_capacity(len.max(1));
    let p = v.as_mut_ptr();
    std::mem::forget(v);
    p
}

/// Free a buffer obtained from `alloc` with the same `len`.
///
/// # Safety
/// `ptr` and `len` must be exactly what `alloc` was called with, and the buffer must not be used afterwards.
#[unsafe(no_mangle)]
pub unsafe extern "C" fn dealloc(ptr: *mut u8, len: usize) {
    drop(unsafe { Vec::from_raw_parts(ptr, 0, len.max(1)) });
}

#[unsafe(no_mangle)]
pub extern "C" fn db_open() -> u32 {
    REGISTRY.with(|r| r.borrow_mut().open())
}

/// Close a database; returns 1 if the handle was open.
#[unsafe(no_mangle)]
pub extern "C" fn db_close(handle: u32) -> u32 {
    REGISTRY.with(|r| r.borrow_mut().close(handle)) as u32
}

/// Run the SQL text at `ptr..ptr+len`. Returns the address of a reply buffer: 4 bytes of length, then the reply. Free it with `reply_free`.
///
/// # Safety
/// `ptr..ptr+len` must be readable memory (typically a buffer from `alloc`).
#[unsafe(no_mangle)]
pub unsafe extern "C" fn db_execute(handle: u32, ptr: *const u8, len: usize) -> *mut u8 {
    let sql = unsafe { std::slice::from_raw_parts(ptr, len) };
    let reply = REGISTRY.with(|r| r.borrow_mut().execute(handle, sql));
    let mut framed = Vec::with_capacity(4 + reply.len());
    framed.extend((reply.len() as u32).to_le_bytes());
    framed.extend(reply);
    let mut boxed = framed.into_boxed_slice();
    let p = boxed.as_mut_ptr();
    std::mem::forget(boxed);
    p
}

/// Free a reply returned by `db_execute`.
///
/// # Safety
/// `ptr` must be a value returned by `db_execute`, not yet freed.
#[unsafe(no_mangle)]
pub unsafe extern "C" fn reply_free(ptr: *mut u8) {
    let len = u32::from_le_bytes(unsafe { std::slice::from_raw_parts(ptr, 4) }.try_into().unwrap()) as usize;
    drop(unsafe { Box::from_raw(std::ptr::slice_from_raw_parts_mut(ptr, 4 + len)) });
}

/// Number of open databases (for the host's leak checks).
#[unsafe(no_mangle)]
pub extern "C" fn db_count() -> u32 {
    REGISTRY.with(|r| r.borrow().count() as u32)
}
```

<p>The host used by the tests is a Node script. It loads the module, runs a script of operations and prints one line per operation, with SQL given in hex so that bytes that are not UTF-8 can be sent too.</p>

```text title="the host: instantiate, copy bytes in and out, free (wasm/host.mjs)"
// Host for the module built from this directory: node host.mjs MODULE.wasm SCRIPT
// The script has one operation per line, and the host prints one line per operation:
//   open               -> h<handle>
//   close <h>          -> c<0|1>
//   exec <h> <hex>     -> the reply bytes in hex (the SQL is given in hex so any bytes, valid UTF-8 or not, can be sent)
//   bench <h> <n> <hex>-> t<milliseconds> for n executions of the statement, boundary copies included
//   count              -> n<open databases>
//   mem                -> m<bytes of linear memory>
//   mark               -> k<milliseconds on the host's clock>
import fs from 'node:fs';

const [, , wasmPath, scriptPath] = process.argv;
const t0 = performance.now();
const { instance } = await WebAssembly.instantiate(fs.readFileSync(wasmPath), {});
console.log(`i${(performance.now() - t0).toFixed(2)}`);
const x = instance.exports;

function execute(handle, bytes) {
  const p = x.alloc(bytes.length);
  new Uint8Array(x.memory.buffer, p, bytes.length).set(bytes); // the buffer is re-read after alloc: memory.grow replaces it
  const r = x.db_execute(handle, p, bytes.length);
  x.dealloc(p, bytes.length);
  const len = new DataView(x.memory.buffer).getUint32(r, true);
  const out = Buffer.from(new Uint8Array(x.memory.buffer, r + 4, len)); // copy out before freeing
  x.reply_free(r);
  return out;
}

const hex = (s) => Buffer.from(s, 'hex');
for (const line of fs.readFileSync(scriptPath, 'utf8').split('\\n')) {
  const w = line.split(' ');
  switch (w[0]) {
    case 'open': console.log(`h${x.db_open()}`); break;
    case 'close': console.log(`c${x.db_close(Number(w[1]))}`); break;
    case 'exec': console.log(execute(Number(w[1]), hex(w[2] ?? '')).toString('hex')); break;
    case 'bench': {
      const bytes = hex(w[3] ?? '');
      const t = performance.now();
      for (let i = 0; i < Number(w[2]); i++) execute(Number(w[1]), bytes);
      console.log(`t${(performance.now() - t).toFixed(2)}`);
      break;
    }
    case 'count': console.log(`n${x.db_count()}`); break;
    case 'mark': console.log(`k${performance.now().toFixed(2)}`); break;
    case 'mem': console.log(`m${x.memory.buffer.byteLength}`); break;
    case '': break;
    default: throw new Error(`bad operation: ${line}`);
  }
}
```
"""

[[sections]]
heading = "Measured"
body = """
<p>The module is built with <code>cargo build --release --target wasm32-unknown-unknown</code> and run by Node 26.8.1 (V8). The native numbers are the same facade called from Rust in the same process, timing the same operations.</p>

```text title="size, start-up, and native versus WebAssembly on the same statements"
module: 541 KiB, instantiated in 0.9 ms
workload                                            native        wasm   ratio
load 51 000 rows (51 statements)                   25.1 ms     37.5 ms   1.49x
filter and aggregate over 50 000 rows               7.2 ms      9.0 ms   1.26x
group by (1 000 groups)                             7.9 ms      9.8 ms   1.25x
hash join (50 000 x 1 000)                         13.2 ms     14.7 ms   1.12x
a 5 000-row result                                  5.6 ms      7.1 ms   1.26x
SELECT 1 (the cost of the boundary)                 0.9 us      1.4 us   1.49x
```

```text title="the same statements natively and in the module (3 databases, one closed halfway, bad handles, invalid UTF-8)"
1512 statements: 279 with ORDER BY and 1233 without are byte-identical, 0 differ only in row order; 460 are errors, 1038 result tables
```

```text title="memory of the instance, read from WebAssembly.Memory"
memory (bytes): after warm-up 3801088, after 8 000 more statements (250 of them with 100 KB in and out) 3801088, 201 databases open 429981696, 200 closed and 200 opened again 429981696
```

<ul> <li><strong>The whole SQL engine is 541 KiB</strong> (197 062 bytes compressed with gzip, 192 KiB) with size optimization and link-time optimization, and instantiates in 1 to 3 milliseconds (0.9 ms in the run above, 3.0 ms in an earlier one).</li> <li><strong>WebAssembly ran 1.1 to 1.5 times slower than native</strong> on the same work: 1.12× for the hash join, 1.25× for aggregation and grouping, 1.49× for loading. These are single runs (20 repetitions of each query, 20 000 of <code>SELECT 1</code>) on one machine, one engine (V8) and one compiler setting; they say the cost is small, not what it is exactly.</li> <li><strong>A call across the boundary costs about 1.4 µs</strong> (<code>SELECT 1</code>, including allocating the input, copying it in, copying the reply out and freeing both), against 0.9 µs for the same call natively, whose execution is dominated by the engine. Batching statements into one call or returning large results as one buffer keeps the boundary negligible.</li> <li><strong>The answers are the same bytes.</strong> In 1 512 statements over three databases, with SQL errors, a database closed halfway through, handles that never existed, and input that is not UTF-8, every reply from the module equals the native reply byte for byte. The test is written to accept replies that differ only in row order when the query has no <code>ORDER BY</code>; none did.</li> <li><strong>No memory grows after warm-up.</strong> 8 000 further statements, 250 of them sending and receiving 100 KB, leave the instance at exactly the same size. Each <em>open</em> database costs about 2.1 MB (200 of them take 430 MB; the buffer pool is 1 MiB, and I did not investigate where the rest goes). Closing 200 and opening 200 more does not grow the memory: closing returns the pools to the allocator, but the memory is never returned to the host.</li> </ul>

<aside data-call="note"><b>What the target forbids</b><p>The first attempt to compile the engine for <code>wasm32-unknown-unknown</code> failed in the disk manager: <code>std::os::unix::fs::FileExt</code> does not exist there. Gating the file-backed manager with <code>#[cfg(unix)]</code> fixed the build, but the module still could not work. The buffer pool owns a disk scheduler that creates worker threads, and a version of the facade that asked for two workers trapped on its first call with <code>RuntimeError: unreachable</code>, the form a Rust panic takes with <code>panic = "abort"</code>. The scheduler now accepts zero workers and then serves every request on the calling thread. The scheduler's tests still pass with the threaded mode, and the inline mode is covered by the tests of this section.</p></aside>

<aside data-call="note"><b>Two mutants that survived because the tests were not hungry enough</b><p>The first leak test sent 30-byte statements; a mutant that never freed the input buffer leaked 240 KB in total, which fitted in the slack of the allocator, and the memory size did not change. Statements and replies of 100 KB made the same mutant grow the instance by tens of megabytes. Second, nothing in the first test suite loaded more data than the 1 MiB buffer pool holds, so mutants that dropped a write or returned zeros for a read in the inline scheduler survived; a table of 60 000 rows (3.6 MB) read back through eviction killed both. A buffer pool test that never evicts does not test the buffer pool.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>#[unsafe(no_mangle)] pub extern "C" fn</code></strong> (edition 2024 spelling) gives a function a stable exported name and the C calling convention; with <code>crate-type = ["cdylib"]</code> it becomes a WebAssembly export. Arguments and results are limited to integers, floats and pointers.</li> <li><strong><code>Vec::with_capacity</code> plus <code>mem::forget</code></strong> hands a buffer to the host without freeing it; <code>Vec::from_raw_parts(ptr, 0, cap)</code> takes it back. The capacity must be the one it was created with, so <code>alloc</code> rounds a zero length up to one and <code>dealloc</code> does the same.</li> <li><strong>A length-prefixed reply</strong> lets <code>reply_free</code> rebuild the <code>Box&lt;[u8]&gt;</code> from the address alone, <code>Box::from_raw(slice_from_raw_parts_mut(ptr, 4 + len))</code>, so the host passes one number to free it.</li> <li><strong>A self-referential struct in four lines of <code>unsafe</code></strong>: <code>Engine&lt;'a&gt;</code> borrows the buffer pool. <code>Database</code> keeps the pool in a <code>Box</code> (stable address), extends the borrow to <code>'static</code>, and implements <code>Drop</code> to drop the engine first. Field order would do the same; the explicit <code>Drop</code> states the requirement. The mutant that removes it is equivalent for that reason (see the test plan).</li> <li><strong><code>thread_local!</code> with <code>RefCell&lt;Registry&gt;</code></strong> holds the handle table without <code>static mut</code>. On this target there is one thread, so it is a global with a safe interface.</li> <li><strong><code>#[cfg(unix)]</code></strong> on the file-backed disk manager, its imports and its helper types keeps the platform layer out of the build where it cannot work; the in-memory manager is portable.</li> <li><strong><code>panic = "abort"</code></strong> removes the unwinding tables from the module and turns every panic into a trap.</li> <li><strong><code>wasm/</code> has its own <code>[workspace]</code> table</strong> so it builds with its own target directory and the engine crate's <code>cargo test</code> can start the build without a lock conflict.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Reply codec (3 000 random replies)</strong>: errors and results with up to four tables, empty and non-ASCII names, NULL, booleans, 64-bit integers, floats including <code>-0.0</code>, infinity and subnormals, text with quotes and newlines; each decodes to itself; every proper prefix is <code>Truncated</code>; one extra byte is <code>Trailing</code>; NaN survives bit for bit; an unknown reply tag, an unknown value tag, bad UTF-8 and rows for a table with no columns are each rejected.</li> <li><strong>A database in bytes</strong>: several statements in one call return one table each; four kinds of SQL error come back as replies and the database still answers; text that is not UTF-8 is refused before the parser sees it; the empty statement returns no tables.</li> <li><strong>Handles</strong>: two databases are independent; a closed handle is refused, closing twice reports failure, handle 0 never exists, a closed handle is never reissued; 100 databases opened, used and closed leave the registry as it was.</li> <li><strong>Native versus module (1 512 statements, three databases)</strong>: random queries over four tables (filters, joins, left joins, three-way joins, grouping, ordering, text and float columns), inserts, updates and deletes, constant expressions, scripts with an error in the middle, statements that are not UTF-8, handles that were never opened and a handle closed halfway. The replies are compared as bytes; the test fails unless the script has at least 100 errors, 1 000 result tables and 200 ordered and 100 unordered queries.</li> <li><strong>Data larger than the pool</strong>: 60 000 rows, 3.6 MB through a 1 MiB pool, then <code>COUNT</code>, <code>SUM</code>, <code>MIN</code>, <code>MAX</code> and six point lookups natively and in the module.</li> <li><strong>Memory</strong>: the size of the instance after warm-up equals the size after 8 000 more statements of three kinds (a 15 KB reply, a failing statement, a refused input) plus 250 statements with 100 KB in and out; 200 open databases are visible in the size, and a second 200 after closing do not enlarge it; the open-database count is checked at each step.</li> <li><strong>Mutants run against these tests</strong>: reply encoder (true tagged as false, big-endian integers, floats truncated, NULL tagged as false, error tag wrong), decoder (trailing bytes accepted, off-by-one in the length check, rows allowed with no columns, false decoded as true), facade (invalid UTF-8 treated as empty SQL, handles reused after close, close always reporting success, <code>db_count</code> counting handles ever issued, an unknown handle reporting success, the engine not dropped before its pool), module (replies never freed, inputs never freed, <code>db_close</code> always returning 0, big-endian reply length, a zero-length allocation not rounded up), inline scheduler (inline mode never taken, writes dropped, reads returning zeros). <strong>Of 23 mutants, 22 were killed and 1 is equivalent</strong>: dropping the engine explicitly is the same as field order doing it. One was killed by the memory cap (the decoder believing four billion rows) and two by a hang (a dropped write corrupts the table the engine then walks).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>SQLite</strong> ships an official WebAssembly build with a JavaScript API; persistence uses the browser's Origin Private File System through a virtual file system layer, with synchronous access handles in a worker. The file format is the same as native, so a database file moves between hosts unchanged.</li> <li><strong>DuckDB-Wasm</strong> runs the analytical engine in the browser; it returns results as Apache Arrow buffers rather than row by row, reads Parquet over HTTP range requests, and ships builds with and without threads (threads need <code>SharedArrayBuffer</code>, which needs cross-origin isolation headers).</li> <li><strong>PGlite</strong> is PostgreSQL itself compiled to WebAssembly in single-user mode, persisting to IndexedDB or the file system; it shows how much of an existing engine's global state and process model has to be reworked.</li> <li><strong>sql.js</strong> is the original SQLite-to-JavaScript port and the template for many tools that load a database file and query it in a page.</li> <li><strong>Wasm as an extension sandbox</strong>: user-defined functions and transforms compiled to WebAssembly run in the database process with memory isolation and limits on time and memory (Redpanda data transforms, ScyllaDB user-defined functions, several streaming and edge databases).</li> <li><strong>Interfaces beyond integers</strong>: <code>wasm-bindgen</code> generates JavaScript glue for strings and objects; the <strong>Component Model</strong> and WIT describe typed interfaces (strings, records, lists) between modules, replacing hand-written length-and-pointer conventions like this section's with a standard one.</li> <li><strong>WASI</strong> gives a module a file system, clock and sockets through a host interface, which would let the file-backed manager run outside the browser.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Re-read <code>memory.buffer</code> after every call that can allocate.</strong> Growing memory detaches the old <code>ArrayBuffer</code>; a view created before the call reads nothing. The host in this section creates the view after <code>alloc</code> returns and again after <code>db_execute</code>.</li> <li><strong>Copy the reply out before freeing it.</strong> A view on the module's memory is invalid once the buffer is returned to the allocator, and may point at a later reply.</li> <li><strong>A trap ends the instance.</strong> There is no unwinding with <code>panic = "abort"</code>, and an instance after a trap has inconsistent internal state. Catch <code>WebAssembly.RuntimeError</code> in the host, discard the instance and rebuild from the application's own persistent state.</li> <li><strong>Memory never shrinks.</strong> A burst of large results keeps the instance at its high-water mark; limit result sizes or stream, and recycle the instance if the host needs the memory back.</li> <li><strong>Threads are not free.</strong> They need shared memory, cross-origin isolation in browsers, and a runtime that supports them; code that spawns threads at start-up fails on first use, as the two-worker experiment above did.</li> <li><strong>No clock, no entropy by default.</strong> Code that calls <code>Instant::now()</code> or seeds a random generator from the system must be given them by the host; the engine tested here uses neither.</li> <li><strong>The module has no persistence.</strong> Everything is lost with the instance. Storing pages through a host import (IndexedDB, OPFS, a file) is the host's job and the interface to design first for a real product (<a href="/cookbook/p/a-durable-lsm-tree">M7</a> for a durable log-structured store).</li> <li><strong>32-bit address space.</strong> <code>wasm32</code> memory is at most 4 GiB, and browsers often cap well below that; a pool and a working set sized for a server will not fit.</li> <li><strong>JavaScript strings are UTF-16.</strong> Encode to UTF-8 before writing into memory, and decode replies with a decoder that rejects invalid sequences; the module also checks UTF-8 on input.</li> </ul></aside>
"""
