[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A WebAssembly module is a program with one linear memory and no operating system.</strong> It exports functions that take and return integers (and floats); it imports whatever the host chooses to give it. Anything else (a string, a result set, an error) has to be written into the module's memory as bytes and handed over as an address and a length. The design question for an embedded database is therefore the <em>boundary</em>: what the host writes, what it reads, and who frees what.</li> <li><strong>The boundary here is small.</strong> Seven functions: <code>alloc</code>/<code>dealloc</code> (the host asks the module for a buffer and returns it), <code>db_open</code>/<code>db_close</code>/<code>db_count</code> (handles are small integers), <code>db_execute(handle, ptr, len)</code> (SQL text in, an address out) and <code>reply_free</code>. The reply is one byte buffer: a success tag, the result tables (column names, then values with a one-byte type tag) or an error message. Nothing else crosses.</li> <li><strong>The target decides what must change in the engine.</strong> On <code>wasm32-unknown-unknown</code> the standard library compiles, but there is no thread creation, no file system and no clock (the first is shown below; the file system by the missing <code>FileExt</code>; the clock by the platform's documentation). Two things in the engine of Part I had to change: the file-backed disk manager uses Unix <code>pread</code>, so it is compiled only for Unix; and the buffer pool's disk scheduler spawned worker threads, so it gained a mode with zero workers that performs each request on the calling thread. With the threaded scheduler the module compiles, and the first call traps (see the measured section).</li> <li><strong>Errors are values, panics are traps.</strong> A SQL error is a reply the host can display; the engine keeps running. A Rust panic in a module built with <code>panic = "abort"</code> is a WebAssembly trap: the instance is unusable and the host must discard it and create a new one. The facade therefore turns everything it can foresee into replies (bad handle, text that is not UTF-8, a statement that fails) so that a trap means a bug.</li> <li><strong>Memory is the host's problem too.</strong> WebAssembly memory grows in 64 KiB pages and never shrinks, and growing it detaches every <code>ArrayBuffer</code> the host holds on the old memory. A host must re-read <code>memory.buffer</code> after any call that can allocate, and a module that leaks one reply per call will run until the memory limit.</li> <li><strong>What the sandbox buys is portability and isolation.</strong> The same compiled module runs in a browser, in Node, in an edge worker, or inside another database as a sandboxed extension, with the same answers. This section tests exactly that: 1 512 statements give the same bytes natively and in the module.</li> </ul>
"""

[[sections]]
heading = "The boundary"
body = """
```text
 host (JavaScript, Python, Rust …)                       module (linear memory)
 ─────────────────────────────────                       ──────────────────────
 p = alloc(n)                              ───────────►  Vec with capacity n, forgotten (ownership passes to the host)
 write SQL bytes at p                       ──────────►
 r = db_execute(h, p, n)                    ──────────►  run on the engine; reply = [u32 length][reply bytes]
 dealloc(p, n)                              ──────────►
 read length at r, copy reply bytes out     ◄─────────
 reply_free(r)                              ──────────►  rebuild the Box from the length prefix and drop it
```

```text
reply  = 0 · u32 tables · table*            success
       | 1 · u32 len · message              error
table  = u32 columns · (u32 len · name)* · u32 rows · value*     (rows × columns values, row by row)
value  = 0 NULL | 1 false | 2 true | 3 · i64 | 4 · f64 bits | 5 · u32 len · UTF-8 text
```

<p>All integers are little-endian, which is what WebAssembly uses natively and what every host of interest reads without conversion. A decoder must treat the buffer as hostile: every read is bounds-checked, an unknown tag is an error, trailing bytes are an error, and a table with no columns may not claim rows (a decoder that trusted the count would loop for four billion rows over an empty body).</p>

:::deeper Reference: the facade (reply codec, a database over an in-memory buffer pool, handles)
```rust title="src/product/facade.rs"
//! A facade for embedding the SQL engine in a host that can only exchange integers and bytes with it (a WebAssembly instance, a C caller).
//! Everything crosses the boundary as a byte buffer: the host writes SQL text into the engine's memory, calls `execute` with a database
//! handle, and gets back one buffer holding every result table, or an error message. The engine runs on the calling thread, with the
//! buffer pool in memory and its I/O performed inline, so the same code runs where there are no threads, no files and no clock.
use crate::arc::ArcReplacer;
use crate::bpm::BufferPoolManager;
use crate::disk::{DiskManager, MemDiskManager};
use crate::engine::{Engine, QueryResult};
use crate::value::Value;
use std::collections::HashMap;
use std::sync::Arc;

/// Frames in a database's buffer pool (4 KiB each).
pub const FRAMES: usize = 256;

/// One database: an engine over its own in-memory buffer pool. The engine borrows the pool, so the pool is boxed (its address is stable) and
/// the engine is dropped before it.
pub struct Database {
    engine: Option<Engine<'static>>,
    bpm: Box<BufferPoolManager<ArcReplacer>>,
}

impl Database {
    pub fn open() -> Database {
        let disk: Arc<dyn DiskManager> = Arc::new(MemDiskManager::default());
        let bpm = Box::new(BufferPoolManager::new(FRAMES, disk, ArcReplacer::new(FRAMES), 0));
        // SAFETY: the pool lives in a Box that `Database` owns and never moves out of, and `engine` is dropped first (see `Drop`), so the
        // reference never outlives the pool it points to.
        let pool: &'static BufferPoolManager<ArcReplacer> = unsafe { &*(&*bpm as *const BufferPoolManager<ArcReplacer>) };
        Database { engine: Some(Engine::new(pool)), bpm }
    }

    /// Run the statements in `sql` and return the encoded reply (see `encode_reply`).
    pub fn execute(&mut self, sql: &[u8]) -> Vec<u8> {
        let reply = match std::str::from_utf8(sql) {
            Err(_) => Err("the SQL text is not valid UTF-8".to_string()),
            Ok(text) => self.engine.as_mut().unwrap().execute(text).map_err(|e| e.0),
        };
        encode_reply(&reply)
    }

    pub fn pool_size(&self) -> usize {
        self.bpm.size()
    }
}

impl Drop for Database {
    fn drop(&mut self) {
        self.engine = None;
    }
}

/// Database handles for a host that cannot hold a Rust value: small integers that are never reused for a different database while the
/// first is open, and are refused after `close`.
#[derive(Default)]
pub struct Registry {
    next: u32,
    open: HashMap<u32, Database>,
}

impl Registry {
    pub fn open(&mut self) -> u32 {
        self.next += 1;
        self.open.insert(self.next, Database::open());
        self.next
    }
    pub fn close(&mut self, h: u32) -> bool {
        self.open.remove(&h).is_some()
    }
    pub fn execute(&mut self, h: u32, sql: &[u8]) -> Vec<u8> {
        match self.open.get_mut(&h) {
            Some(db) => db.execute(sql),
            None => encode_reply(&Err(format!("no such database handle: {h}"))),
        }
    }
    pub fn count(&self) -> usize {
        self.open.len()
    }
}

// ---- the reply format -------------------------------------------------------------------------------------------------------------------
//
//   reply  = 0 · u32 tables · table*           success
//          | 1 · u32 len · message             error
//   table  = u32 columns · (u32 len · name)* · u32 rows · value*   (rows × columns values, row by row)
//   value  = 0 NULL | 1 false | 2 true | 3 · i64 | 4 · f64 bits | 5 · u32 len · UTF-8
//
// All integers are little-endian, which is what WebAssembly and every host of interest use natively.

pub type Reply = Result<Vec<QueryResult>, String>;

fn put_u32(out: &mut Vec<u8>, n: usize) {
    out.extend((n as u32).to_le_bytes());
}
fn put_str(out: &mut Vec<u8>, s: &str) {
    put_u32(out, s.len());
    out.extend(s.as_bytes());
}

pub fn encode_reply(r: &Reply) -> Vec<u8> {
    let mut out = Vec::new();
    match r {
        Err(m) => {
            out.push(1);
            put_str(&mut out, m);
        }
        Ok(tables) => {
            out.push(0);
            put_u32(&mut out, tables.len());
            for t in tables {
                put_u32(&mut out, t.columns.len());
                for c in &t.columns {
                    put_str(&mut out, c);
                }
                put_u32(&mut out, t.rows.len());
                for row in &t.rows {
                    for v in row {
                        match v {
                            Value::Null => out.push(0),
                            Value::Bool(false) => out.push(1),
                            Value::Bool(true) => out.push(2),
                            Value::Int(i) => {
                                out.push(3);
                                out.extend(i.to_le_bytes());
                            }
                            Value::Float(f) => {
                                out.push(4);
                                out.extend(f.to_bits().to_le_bytes());
                            }
                            Value::Text(s) => {
                                out.push(5);
                                put_str(&mut out, s);
                            }
                        }
                    }
                }
            }
        }
    }
    out
}

#[derive(Debug, PartialEq)]
pub enum DecodeError {
    Truncated,
    BadTag(u8),
    BadUtf8,
    Trailing,
    RowShape,
}

struct In<'a>(&'a [u8]);
impl<'a> In<'a> {
    fn take(&mut self, n: usize) -> Result<&'a [u8], DecodeError> {
        if self.0.len() < n {
            return Err(DecodeError::Truncated);
        }
        let (a, b) = self.0.split_at(n);
        self.0 = b;
        Ok(a)
    }
    fn u8(&mut self) -> Result<u8, DecodeError> {
        Ok(self.take(1)?[0])
    }
    fn u32(&mut self) -> Result<usize, DecodeError> {
        Ok(u32::from_le_bytes(self.take(4)?.try_into().unwrap()) as usize)
    }
    fn str(&mut self) -> Result<String, DecodeError> {
        let n = self.u32()?;
        String::from_utf8(self.take(n)?.to_vec()).map_err(|_| DecodeError::BadUtf8)
    }
}

pub fn decode_reply(buf: &[u8]) -> Result<Reply, DecodeError> {
    let mut r = In(buf);
    let reply = match r.u8()? {
        1 => Err(r.str()?),
        0 => {
            let tables = r.u32()?;
            let mut out = Vec::new();
            for _ in 0..tables {
                let ncols = r.u32()?;
                let mut columns = Vec::new();
                for _ in 0..ncols {
                    columns.push(r.str()?);
                }
                let nrows = r.u32()?;
                if ncols == 0 && nrows > 0 {
                    return Err(DecodeError::RowShape);
                }
                let mut rows = Vec::new();
                for _ in 0..nrows {
                    let mut row = Vec::with_capacity(ncols);
                    for _ in 0..ncols {
                        row.push(match r.u8()? {
                            0 => Value::Null,
                            1 => Value::Bool(false),
                            2 => Value::Bool(true),
                            3 => Value::Int(i64::from_le_bytes(r.take(8)?.try_into().unwrap())),
                            4 => Value::Float(f64::from_bits(u64::from_le_bytes(r.take(8)?.try_into().unwrap()))),
                            5 => Value::Text(r.str()?.into()),
                            t => return Err(DecodeError::BadTag(t)),
                        });
                    }
                    rows.push(row);
                }
                out.push(QueryResult { columns, rows });
            }
            Ok(out)
        }
        t => return Err(DecodeError::BadTag(t)),
    };
    if !r.0.is_empty() {
        return Err(DecodeError::Trailing);
    }
    Ok(reply)
}
```
:::
"""

