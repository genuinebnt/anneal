[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>"Database job" is many jobs.</strong> Building an engine, operating a fleet of them, helping customers design for one, and researching the next are different work with different skills. The first question is not "who is hiring" but "what do I want to spend my day doing".</li> <li><strong>Employers fall into a few kinds, and each kind shapes the work.</strong> <em>Database vendors</em> (the company's product is the engine) have the deepest engine work and the narrowest set of teams. <em>Cloud providers</em> run database services at huge scale: the work is as much operations, multi-tenancy and cost as algorithms. <em>Application companies with data infrastructure teams</em> (marketplaces, social networks, fintech, observability, ad tech) run and extend one or two engines for their own workloads. <em>Data-platform and analytics vendors</em> (warehouses, lakehouses, streaming, vector search) build query engines and storage formats. <em>Consultancies, support and managed-service firms</em> put engineers in front of customers' databases. <em>Research labs and universities</em> publish the next design.</li> <li><strong>Roles are defined by the layer you work on.</strong> The layers are those of <a href="/cookbook/p/the-dbms-stack">the stack</a>: storage, indexing, execution, planning and optimization, transactions and recovery, replication and consensus, networking and protocols, security, and the operations around them. Most engine jobs sit in one or two of them and touch the neighbours.</li> <li><strong>What gets you hired is evidence, not coursework.</strong> A hiring manager for an engine team wants to know whether you can read a large C, C++, Rust or Java codebase, reason about concurrency and failure, write a test that finds a bug, and measure honestly. The artifacts that show it are a merged change to a real engine (<a href="/cookbook/p/contributing-to-a-database">Contributing</a>), a project with tests and measurements (this guide's sections are models of what to build), and writing that explains a mechanism clearly.</li> <li><strong>Everything here dates.</strong> Companies start, merge, change names and stop hiring. The categories and the skills last longer than any list of names, which is why this section names few companies and says where to look.</li> </ul>
"""

[[sections]]
heading = "Kinds of employers"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Kind</th> <th>What the work looks like</th> <th>Examples of the kind (check what is current)</th> </tr> </thead> <tbody> <tr> <td><strong>Database vendors</strong></td> <td>Engine internals: storage, execution, optimizer, transactions, replication; correctness and performance of a shipped product; long-lived code with many users</td> <td>The makers of PostgreSQL distributions and extensions, MongoDB, CockroachDB, TiDB, YugabyteDB, SingleStore, ClickHouse, DuckDB and its commercial companions, Redis, Neo4j, TimescaleDB, Couchbase, Oracle, Microsoft SQL Server</td> </tr> <tr> <td><strong>Cloud database services</strong></td> <td>Managed engines at scale: storage disaggregation, multi-tenancy, backup and restore, upgrades without downtime, cost; on-call</td> <td>The database teams of the large cloud providers (relational, key-value, document, warehouse services)</td> </tr> <tr> <td><strong>Data-platform vendors</strong></td> <td>Query engines over columnar files, lakehouse table formats, streaming systems, vector and search engines; connectors; performance on benchmarks and customers' workloads</td> <td>Snowflake, Databricks, Confluent, Starburst, Dremio, the vector-search companies, the stream-processing companies</td> </tr> <tr> <td><strong>Infrastructure teams of large product companies</strong></td> <td>Run and extend an engine for one company's workload: sharding, schema migration, online resharding, capacity, custom storage; sometimes build an internal engine</td> <td>The data-infrastructure groups of large internet companies, banks and trading firms</td> </tr> <tr> <td><strong>Hardware and systems companies</strong></td> <td>Storage controllers, SSD firmware, accelerators, kernel I/O paths, file systems; databases as the workload that drives the design</td> <td>Chip, storage and cloud-hardware companies</td> </tr> <tr> <td><strong>Consultancies and support</strong></td> <td>Diagnose slow queries and outages, migrate and tune, train; contact with many deployments</td> <td>Database support and consulting firms</td> </tr> <tr> <td><strong>Research</strong></td> <td>Papers, prototypes, students; a path through a PhD, then a lab or a faculty position, or back to industry</td> <td>University database groups; industrial research labs</td> </tr> </tbody> </table></div>
"""

