[[sections]]
heading = "Reading a job post"
body = """
<ul> <li><strong>The team's layer</strong> is the first clue: "storage engine", "SQL execution", "replication", "control plane". The title alone says little.</li> <li><strong>The language</strong> tells you what you will read: C and C++ in most mature engines, Rust in many newer ones, Go for control planes and many distributed systems, Java for the Hadoop-era and some warehouses.</li> <li><strong>"Experience with databases"</strong> usually means <em>using</em> them in production, which is fine for many roles and not enough for engine roles. "Experience with database internals" means you have read and changed one.</li> <li><strong>Concurrency and failure</strong> are almost always in the requirements: they are where the bugs are.</li> <li><strong>Look for what the post does not say</strong>: no mention of testing or on-call in an infrastructure role is a sign to ask.</li> <li><strong>Ask in the interview</strong> what the last three bugs in the area were, how they were found, and how long the test suite takes. The answers are the culture.</li> </ul>
"""

[[sections]]
heading = "Paths"
body = """
<ul> <li><strong>Straight to an engine team</strong> needs evidence you can work in a large codebase. A merged contribution and a project with real tests are the strongest.</li> <li><strong>Through operations</strong> (DBA, SRE, support) gives breadth, production experience and contact with failures; many engine engineers began there.</li> <li><strong>Through application engineering</strong> with a data-heavy product teaches workloads, which engine engineers need; the move to infrastructure usually happens when you become the person who understands the database.</li> <li><strong>Through research</strong> (a master's or PhD with a database group) is the way into optimizer, new-hardware and learned-component work; it is a long path and a good one if you like open problems.</li> <li><strong>Through open source</strong> is possible at every stage and compounds: reviewers become referees, maintainers become colleagues.</li> </ul>
"""
