, <a href="/cookbook/p/raft">M8</a>–<a href="/cookbook/p/distributed-transactions">M10</a>, <a href="/cookbook/p/deterministic-simulation">Simulation</a></td> </tr> <tr> <td><strong>Distributed systems / cloud engineer</strong></td> <td>Disaggregated storage, multi-tenant control planes, backups, upgrades, cost, availability</td> <td><a href="/cookbook/p/cloud-native-oltp">S6</a>, <a href="/cookbook/p/sharding">M9</a>, <a href="/cookbook/p/the-engine-in-webassembly">M20</a>, <a href="/cookbook/p/benchmarking">Benchmarking</a></td> </tr> <tr> <td><strong>Database reliability engineer / SRE</strong></td> <td>Run fleets, capacity, failover, backups and restores, incident response, performance diagnosis</td> <td>Part I, <a href="/cookbook/p/profiling-and-observability">Profiling</a>, <a href="/cookbook/p/disk-i-o-fsync-the-page-cache-and-queues">I/O</a>, <a href="/cookbook/p/the-postgresql-wire-protocol">M19</a></td> </tr> <tr> <td><strong>Developer-facing engineer</strong></td> <td>Drivers, protocols, SQL compatibility, tooling, connectors, extensions</td> <td><a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>, <a href="/cookbook/p/passwords-and-scram">M21</a>, <a href="/cookbook/p/roles-privileges-and-row-level-security">M22</a>, <a href="/cookbook/p/modern-sql">L02</a></td> </tr> <tr> <td><strong>Security engineer for data</strong></td> <td>Authentication, authorization, encryption, auditing, row- and column-level controls</td> <td><a href="/cookbook/p/passwords-and-scram">M21</a>, <a href="/cookbook/p/roles-privileges-and-row-level-security">M22</a></td> </tr> <tr> <td><strong>Correctness and test engineer</strong></td> <td>Fuzzers, oracles, simulation, Jepsen-style checks, benchmark infrastructure</td> <td><a href="/cookbook/p/testing-a-database">Testing</a>, <a href="/cookbook/p/deterministic-simulation">Simulation</a>, <a href="/cookbook/p/benchmarking">Benchmarking</a></td> </tr> <tr> <td><strong>Solutions / field engineer, developer advocate</strong></td> <td>Help customers choose and design; write and speak about the system</td> <td>Part V, <a href="/cookbook/p/reading-map">Reading map</a>, plus writing</td> </tr> <tr> <td><strong>Researcher</strong></td> <td>A new mechanism, an analysis, a system</td> <td><a href="/cookbook/p/reading-database-research">Reading database research</a></td> </tr> </tbody> </table></div>
