"""

[[sections]]
heading = "Measured"
body = """
<p>20 000 synthetic user records of about 240 bytes of JSON each (nine fields, a nested address, two arrays).</p>

```text title="sizes, field access, load, and queries with and without indexes"
20000 documents of about 241 bytes of JSON text
  JSON text 4.8 MB; binary with offset tables 6.5 MB (+35%); flattened into keys 11.4 MB (2.4x text: each leaf repeats the path)
  reading addr.zip: parse text 1145 ns, decode the whole binary 770 ns, jump through offsets 26 ns per document (44x faster than parsing)
  load into the key space: 16 us per document without indexes, 20 us with three (age, tags[*], addr.city)
  query (20 000 documents)                          matches    fetched    scan (ms)   index (ms)
  age = 30                                              314        314          686            6   (fetched 20000 vs 314)
  age between 30 and 34                                1695       1695          698           33   (fetched 20000 vs 1695)
  tags contains 'raft'                                 4554       4554          686           87   (fetched 20000 vs 4554)
  city = 'Oslo' and age between 20 and 29               338       2015          680           39   (fetched 20000 vs 2015)
  age between 18 and 77 (everything)                  20000      20000          683          372   (fetched 20000 vs 20000)
```

<ul> <li><strong>The offset tables cost 35% more space than text and buy a 44× faster field read</strong>: 26 ns to find <code>addr.zip</code> by jumping through two tables, against 1 145 ns to parse the text and 770 ns to decode the whole binary document. Binary formats exist for this one operation.</li> <li><strong>Flattening costs 2.4× the text</strong> (11.4 MB against 4.8 MB): each leaf carries its path, the tag bytes and a version suffix. It pays back in partial updates, in index-like scans over one field, and in using the machinery of the key space unchanged.</li> <li><strong>Three indexes add 25% to the load cost</strong> (16 → 20 µs per document), one write per indexed value, including one per array element.</li> <li><strong>Indexes make selective queries 100× faster and cost nothing when selectivity is poor</strong>: <code>age = 30</code> fetches 314 documents instead of 20 000 (6 ms against 686); the compound condition <code>city = 'Oslo' and age between 20 and 29</code> uses one index and fetches 2 015 candidates to find 338 matches; a range that selects everything is still faster (372 against 683 ms) here only because this scan implementation reads each document twice (<code>ids</code> then <code>get</code>). A planner would pick the more selective of the two indexed conditions, which is the exercise on cost.</li> <li><strong>A scan of 20 000 documents takes ~0.7 s through the transaction layer</strong>, 34 µs per document: the prefix scan, key decoding and tree rebuild dominate. A real engine decodes the binary form or scans a column of one path; this is the argument for storing both.</li> </ul>

<aside data-call="note"><b>Two bugs the tests found</b><p><code>locate</code> indexed past the end of the buffer when a path continued through a <em>scalar</em> (<code>$.name.first</code> where <code>name</code> is a string): the code read a container header from a string's bytes. The random-path test, which mixes real and nonexistent paths, found it on the first run; the fix is to return <code>None</code> unless the current value is a container. The second: the first oracle for the store compared index-assisted results with full scans and passed, yet a mutant that left stale index entries behind after a delete also passed, because a stale entry costs one wasted fetch, never a wrong answer (the fetched document is re-checked). A directed test now asserts the <em>count of index entries</em> after deletes and replacements. Correct results do not prove that an index is correct, only that it is not wrong.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>BTreeMap&lt;String, Json&gt;</code> for objects</strong> keeps keys sorted, which the binary form needs for binary search and which makes equality and printing canonical; <code>Json</code> derives <code>PartialEq</code>, so a round trip is <code>assert_eq!</code>.</li> <li><strong>A hand-written parser over <code>&amp;[u8]</code> and an index</strong>: no dependencies, error messages with positions, and <code>&#92;u</code> escapes assembled into <code>char</code>s with a check for lone surrogates. The printer escapes control characters as <code>&#92;u00XX</code>.</li> <li><strong>Varints and fixed offsets together</strong>: lengths and counts are LEB128 varints; offsets are <code>u32</code> little-endian so that <code>off(i)</code> is a constant-time read of the table.</li> <li><strong><code>Seg::{Key, Idx, Any}</code></strong> is the one path type for locating, querying and indexing; <code>values_at</code> returns <code>Vec&lt;&amp;Json&gt;</code> because <code>Any</code> fans out.</li> <li><strong>The store is generic over the transaction</strong>: every method takes <code>&amp;Db</code> and <code>&amp;mut Txn</code> like the table layer of <a href="/cookbook/p/transactions-on-the-key-space">M2</a>; nothing here knows about versions or conflicts.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Text</strong>: 3 000 random documents (nesting to depth 3; strings with quotes, backslashes, tabs, accents, emoji; integers and fractions) round-trip through the printer and the parser; an explicit input with <code>é</code>, a surrogate pair and escapes parses to the expected text; the last duplicate key wins; 13 malformed inputs are rejected.</li> <li><strong>Binary</strong>: 2 000 documents decode back; 12 000 random paths (real and nonexistent, through objects, arrays and scalars) find the same value through <code>locate</code> as <code>values_at</code> does on the tree.</li> <li><strong>Flat</strong>: 3 000 documents rebuild from their leaves, including empty arrays and objects at any depth.</li> <li><strong>Merge patch</strong>: the fifteen test vectors of RFC 7386, Appendix A.</li> <li><strong>The store (50 seeds × 120 steps)</strong>: three concurrent snapshot transactions put, patch, delete, get and query documents (25 ids; documents with indexed <code>age</code>, <code>tags[*]</code> and <code>addr.city</code>); every get equals the model's view of the transaction, every query (equality, ranges, exists, and, or, not, nested to depth 2) returns exactly the documents the predicate matches in the model, 409 of 695 queries through an index; final ids equal the model's.</li> <li><strong>Locality of updates</strong>: a patch changing one field writes one key; removing a nested object deletes its two leaves; an unchanged value writes nothing. <strong>Index hygiene</strong>: after a delete or a replacement the index holds no entry for the old values.</li> <li><strong>Mutants run against these tests</strong>: the object key search reversed; an array offset off by one; surrogate pairs combined wrongly; a patch <code>null</code> keeping the member, or merging into a non-object; empty containers lost in flattening; index entries written when removing; a patch not deleting removed leaves; an index range excluding its upper bound; candidates not checked against the full predicate; deleted documents leaving index entries; a path through a scalar reading past the end. <strong>All 12 were killed.</strong></li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>MongoDB</strong> stores BSON (length-prefixed, typed, field-ordered, with no offset table: fields are found by scanning), indexes paths including multikey arrays, and updates in place with <code>$set</code> operators; <strong>PostgreSQL</strong> <code>jsonb</code> stores a binary tree with sorted keys and offset tables, supports GIN indexes over keys and values and containment (<code>&#64;&gt;</code>); <strong>SQLite</strong> has JSON functions and, since 3.45, a binary JSONB format; <strong>MySQL</strong> has a binary JSON type with partial in-place updates.</li> <li><strong>Couchbase, Cosmos DB, DynamoDB, Firestore</strong> are document stores with per-path indexes; Cosmos DB indexes every path by default; <strong>CockroachDB</strong> and <strong>YugabyteDB</strong> support <code>JSONB</code> with inverted indexes; <strong>SurrealDB</strong> and <strong>FoundationDB's Document Layer</strong> flatten documents into ordered keys as in this section.</li> <li><strong>Columnar JSON</strong>: <strong>Snowflake VARIANT</strong>, <strong>ClickHouse JSON</strong>, <strong>DuckDB</strong> and <strong>Parquet's shredding</strong> (Dremel encoding, <a href="/cookbook/p/columnar-formats-and-nested-data">columnar formats</a>) split frequent paths into typed columns for analytics and keep the rest in binary form.</li> <li><strong>Merge patch and JSON Patch</strong> (RFC 6902) are the two standard update formats; MongoDB's update operators, Elasticsearch's partial <code>_update</code> and Firestore's field masks are the same idea.</li> <li><strong>Schema-on-read with constraints</strong>: JSON Schema validation (MongoDB <code>$jsonSchema</code>, PostgreSQL extensions) gives back some of what a relational schema enforces.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Schema-less does not mean schema-free.</strong> Queries assume field names and types; a field that is a number in one document and a string in another is two index populations. Validate on write or document the types.</li> <li><strong>Numbers</strong>: JSON has one number type; storing as 64-bit float silently rounds large integers (ids!). Store such values as strings or use an exact decimal type.</li> <li><strong>Index explosion</strong>: a multikey index writes one entry per array element; a 10 000-element array is 10 000 index writes per update. Cap array sizes or avoid indexing them.</li> <li><strong>Existential semantics surprise</strong>: <code>NOT (tags = 'x')</code> over arrays means "no element equals x", not "some element differs". Be explicit in the query language.</li> <li><strong>Large documents are one conflict domain</strong> if updates rewrite the whole document; flattened leaves and merge patches reduce conflicts to the fields actually touched (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>).</li> <li><strong>Key order is canonical here</strong> (sorted); applications that rely on insertion order of object members will be surprised, as with most binary formats.</li> <li><strong>Do not embed unbounded lists.</strong> A document that grows without limit (all comments of a post) becomes a hot, huge value; model it as a separate collection keyed by the parent.</li> </ul></aside>
