[[sections]]
heading = "Measured"
body = """
<p>100 000 documents of 30 to 70 words drawn from a Zipf distribution over 20 000 terms (a few terms in most documents, most terms in few), indexed as five segments of 20 000.</p>

```text title="index size, WAND against exhaustive scoring on two workloads, and a conjunction"
100000 documents of 30 to 70 words over a Zipf vocabulary of 20000: indexed in 2.6 s into 5 segments
postings: 54.3 MB as fixed-width fields, 15.9 MB delta-coded with variable-length integers (3.4x smaller); 19981 distinct terms
top-10 of 2-5 term disjunctions                    us/query      docs scored
terms drawn from the Zipf distribution                  677            54604   exhaustive [5 segments]
                                                        486             4810   WAND: 1.4x faster, 11.4x fewer documents scored
terms among the 40 most frequent                       1285            66864   exhaustive [5 segments]
                                                       2020            10627   WAND: 0.6x faster, 6.3x fewer documents scored
after merging into one segment (1.3 s): Zipf queries take 640 us exhaustive and 503 us with WAND; results unchanged
conjunction of the two most frequent terms: 82673 hits scored, top score 0.37
```

<ul> <li><strong>Delta coding and variable-length integers make the postings 3.4× smaller</strong> (54 MB to 16 MB), because document ids in a sorted list differ by small amounts and positions by smaller ones. Real engines add block-wise bit-packing (<code>PForDelta</code>, SIMD-BP128) for another factor of about two and fast decoding.</li> <li><strong>WAND scores 6 to 11 times fewer documents and was not always faster.</strong> On queries with Zipf-distributed terms (mostly rare terms, short lists) it scored 4 810 documents against 54 604 and ran 1.4× faster; on queries made of the most frequent terms (long lists) it scored 10 627 against 66 864 but ran 0.6× as fast, because every step re-sorts the cursors, scans for the pivot and skips by binary search. The saving only turns into time when the bookkeeping per document is cheaper than scoring one: production engines use block-max WAND (per-block score bounds so whole blocks are skipped), keep cursors ordered incrementally, and decode compressed blocks lazily.</li> <li><strong>Merging into one segment changed no result</strong> and saved little here (exhaustive 677 → 640 µs): five segments cost five sets of cursors per query. Segment counts matter more with hundreds of small segments, which is why merges are scheduled continuously.</li> <li><strong>A conjunction of the two most frequent terms</strong> has 82 673 matching documents and must score all of them; its top score is only 0.37 because both terms are everywhere (idf near zero). Frequent terms are cheap to match and nearly worthless to rank, the reason search engines treat them as stop words or give them tiny weights.</li> </ul>

<aside data-call="note"><b>Pruning bounds must be strict, and ties are part of the answer</b><p>WAND is correct only if each term's upper bound is at least any score it can contribute. <code>idf × (k1+1)</code> is such a bound because <code>tf/(tf + k1·…)</code> is always below 1. A mutant that shrinks the bound to <code>idf × 1</code> returns wrong top-k lists and the reference comparison catches it. Ties are subtler: results are ordered by score and, among equal scores, by the smaller external id, so that two runs and two modes agree. The random corpus almost never produces exact ties; a directed test with identical documents spread over two segments does, and a mutant that orders ties by the larger id is killed by it. A mutant that prunes documents <em>equal</em> to the threshold (<code>&gt;</code> instead of <code>≥</code>) is equivalent here: the bound is strictly above any real score, so a tie is never pruned.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Segments as <code>BTreeMap&lt;String, Vec&lt;Posting&gt;&gt;</code></strong>: sorted terms (useful for prefix queries) and posting vectors sorted by document id, so intersection and <code>partition_point</code> skipping work on slices.</li> <li><strong>A <code>Hit(score, id)</code> with a hand-written <code>Ord</code></strong> (<code>total_cmp</code> on the score, then the reversed id) makes "greater" mean "better". The top-k is a <code>BinaryHeap&lt;Reverse&lt;Hit&gt;&gt;</code>, whose root is the worst kept hit and is replaced when something better arrives.</li> <li><strong>The same walk with pruning on or off</strong>: <code>wand(.., prune: bool)</code> is both the exhaustive disjunction (a threshold of −∞ makes every first cursor the pivot) and WAND, so the comparison measures pruning rather than two different loops. Independent checking comes from a separate naive reference.</li> <li><strong>Global statistics across segments</strong> (<code>N</code>, average length, document frequency) are computed over live documents only; per-segment statistics would make scores depend on how documents are partitioned into segments.</li> <li><strong><code>encoded_bytes</code> computes what a file would hold</strong> without writing one: variable-length integer sizes of document deltas, frequencies and position deltas.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Reference comparison (80 seeds × 40 steps × 3 queries, both modes)</strong>: random adds (with replacement), deletes, refreshes, partial and full merges over a 16-word Zipf vocabulary; a naive implementation computes BM25 from the live documents from scratch and the evaluated query forms (optional terms, required terms, excluded terms, a phrase of two or three words, each combined) must give identical top-k lists, up to floating-point rounding of the sums. 9 600 queries; the live document count always equals the model's.</li> <li><strong>WAND exactness</strong>: on 3 000 documents and 200 random disjunctions the pruned and exhaustive top-10 lists are identical and WAND scores fewer documents.</li> <li><strong>Directed</strong>: deleted documents never appear and merging changes no result; replacing a document removes its old terms; a phrase must be adjacent and in order; the tokenizer lower-cases and splits on every non-alphanumeric character; identical documents spread over two segments come back ordered by id for every <code>k</code> and both modes.</li> <li><strong>Mutants run against these tests</strong>: WAND thresholds too high or bounds too small; BM25 without length normalization or with a wrong idf; deleted documents counted in the statistics or returned; excluded terms ignored; phrases matching in any order; conjunctions as disjunctions; merges keeping deleted documents; a replaced document keeping its old text; ties ordered the other way; case-sensitive tokens. <strong>All 13 non-equivalent mutants were killed</strong>; the tie-pruning mutant is equivalent for the reason above.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Lucene</strong> (and with it <strong>Elasticsearch, OpenSearch, Solr</strong>) builds immutable segments with block-compressed postings (FOR/PFOR), skip data, and per-block maximum impacts for block-max WAND; a <em>refresh</em> makes buffered documents searchable (every second by default), a tiered <em>merge policy</em> combines segments in the background, deletes are bitsets applied at query time. <strong>Tantivy</strong> (Rust) and <strong>Bleve</strong> (Go) follow the design.</li> <li><strong>PostgreSQL</strong> offers <code>tsvector</code> with GIN indexes (a pending list absorbs updates and is merged into the main structure) and ranking by <code>ts_rank</code>; <strong>SQLite FTS5</strong> stores an inverted index in its own tables with segment merges and BM25; <strong>MySQL</strong> has InnoDB full-text indexes; <strong>ClickHouse</strong> and <strong>Vespa</strong> add inverted indexes and hybrid ranking.</li> <li><strong>Hybrid search</strong> combines BM25 with vector similarity (<a href="/cookbook/p/the-vector-store">M12</a>), by reciprocal-rank fusion or learned weights; the planner of <a href="/cookbook/p/one-planner-for-many-models">M18</a> is where the two retrieval paths and the relational filters are combined.</li> <li><strong>Analyzers</strong> (stemming, stop words, synonyms, n-grams, language-specific tokenization, ICU for CJK and Thai) decide what a "term" is, and the same analyzer must run at index and query time.</li> <li><strong>Learned sparse retrieval</strong> (SPLADE) and dense retrieval replace or extend BM25, but still use inverted indexes with WAND-like top-k over learned term weights.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Tokenization is the model.</strong> Query and index must use the same analyzer; changing it means reindexing. Case, accents, apostrophes, numbers and hyphenated words are decisions, not details.</li> <li><strong>Statistics drift with segments</strong>: document frequencies including deleted documents (what Lucene does until a merge) change scores slightly; exact scores need exact live counts, as computed here at a cost.</li> <li><strong>Phrase queries over long position lists are slow</strong>; engines add bigram or shingle indexes for the common phrases.</li> <li><strong>Deletes are not free</strong>: a segment full of deleted documents is scanned and scored (then discarded) until a merge removes them; a high delete rate needs aggressive merging.</li> <li><strong>Merging is I/O heavy</strong> and competes with queries and ingest; throttle it, and avoid merging the largest segments often.</li> <li><strong>Top-k is only exact if pruning bounds are valid</strong>: approximate bounds (for speed) change the answer; label such modes as approximate.</li> <li><strong>Short queries of frequent terms are the hard case</strong> for ranking and for speed alike.</li> </ul></aside>
"""
