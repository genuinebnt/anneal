[[sections]]
heading = "Measured"
body = """
<p>2 000 000 rows <code>(id, g, v)</code> with <code>g</code> in 0 to 99 and <code>v</code> in 0 to 999 are loaded and merged into the column store; then random keys are updated until the delta holds a given number of distinct keys. The query is <code>SUM(v) WHERE g &lt; 10</code>. The <em>row-store scan</em> column iterates an in-memory ordered map of rows as an OLTP-only system would: an idealized baseline with no locking, no pages, no MVCC. The HTAP answer is checked equal to the row-store answer at every delta size, before and after the merge.</p>

```text title="the cost of a delta: query time, a row-store scan, the same query after a merge, and the merge"
2000000 rows loaded and merged into the column store in 0.82 s (408 ns per row)
SUM(v) WHERE g < 10, 2000000 rows; the delta holds updates to random keys (ms, best of 3)
  delta keys HTAP query row-store scan  after merge merge (ms, us/key)   update txn/s
           0       0.9            5.3          0.9          0     0.0            NaN
        1000       1.2            5.3          0.9          1     0.8           9004
       10072       1.6            5.3          1.0          4     0.4          15698
      100057      16.5            6.0          0.9         54     0.5          19109
      500053      65.4           11.0          1.1        277     0.6          16080
```

<ul> <li><strong>With an empty delta the analytical query takes 0.9 ms</strong> against 5.3 ms for scanning rows: the column store reads two columns as byte lanes (<a href="/cookbook/p/a-column-store">M3</a>).</li> <li><strong>Compensation costs about 0.16 µs per delta key</strong>: 1.2 ms at 1 000 keys, 1.6 ms at 10 000, 16.5 ms at 100 000 (5% of the table), 65 ms at 500 000. The curve is linear in the delta, as designed, and, interpolating between the 10 000 and 100 000 rows, the HTAP query stays faster than a row scan until the delta reaches about <strong>30 000 keys, 1.5% of the table</strong>. Beyond that, merge.</li> <li><strong>A merge costs about 0.5 µs per changed key</strong> (54 ms for 100 057 keys) and brings the query back to 0.9 to 1.1 ms. Merging whenever the delta passes about 0.5% of the table (10 000 keys) keeps the query within 1.8× of the best case (1.6 ms against 0.9 ms) with zero lag.</li> <li><strong>The delta absorbs 9 000 to 19 000 commits of 100 updates per second</strong> on one thread (0.9 to 1.9 million row writes per second), because a write is a hash lookup and a push; the rate varies with how many of the keys are new to the delta.</li> <li><strong>Reading the main rows by key is the expensive part of a compensation.</strong> The first version of the table looked segments up with a linear scan and fetched whole rows: it cost 0.31 µs per delta key (31.6 ms at 100 000 keys). A binary search over segment starts and fetching only the needed columns halved it.</li> </ul>

<aside data-call="note"><b>One structure, two consistency stories</b><p>The column store knows nothing about transactions: it holds the table as of <code>main_ts</code>. All the isolation work (which version of a row a snapshot sees) is in the delta, which stores versions with commit timestamps. The merge is the only place the two meet, and its contract is a single sentence: <em>for every <code>t ≥ main_ts</code>, a query at <code>t</code> returns the same rows before and after the merge.</em> The test checks that sentence directly, for all readable snapshots, at every merge.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>HashMap&lt;i64, Vec&lt;(u64, Option&lt;Row&gt;)&gt;&gt;</code></strong> is the delta: <code>Option&lt;Row&gt;</code> makes a delete a version like any other, and <code>iter().rev().find(|(t, _)| *t &lt;= ts)</code> finds the visible version.</li> <li><strong>The main store is reused unchanged</strong> from <a href="/cookbook/p/a-column-store">M3</a>: <code>ColTable::sum</code> for the scan, <code>delete</code> and <code>insert</code> for the merge; the only additions were a <code>starts</code> index for <code>O(log segments)</code> row-id lookup and <code>value(id, col)</code> to fetch one column of one row.</li> <li><strong><code>assert!(ts &gt;= self.main_ts)</code></strong> makes the contract part of the type's behaviour: asking for a snapshot older than the merged state is a bug in the caller (a reader the merge should have waited for), not a quietly wrong answer; a <code>#[should_panic]</code> test pins it.</li> <li><strong>Borrowing in the compensation loop</strong>: it iterates <code>&amp;self.delta</code> while calling <code>self.main.value</code> and reading <code>self.index</code>, all shared borrows; the aggregate state is local. Splitting the structure into separate fields (rather than one lock) is what lets a real implementation run the merge on another thread against a frozen delta.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Against a full history</strong>: 60 seeds × 120 steps of random commits (batches of puts and deletes over 60 keys), merges to a random timestamp, compactions, and queries at random readable snapshots (<code>SUM</code> of a random column under 0 to 2 range or equality predicates, and point reads); each result equals a model that keeps every version of every key and evaluates the query at timestamp <code>t</code> directly.</li> <li><strong>A merge changes nothing</strong>: before every merge, the query result for every snapshot from <code>upto</code> to <code>now</code> is recorded; after the merge the same snapshots return the same results (1 436 merges checked).</li> <li><strong>Final merge</strong>: after merging everything the delta holds no versions and the sum equals the model's.</li> <li><strong>Refusal</strong>: a read at a timestamp older than the last merge panics with an explanation.</li> <li><strong>Mutants run against these tests</strong>: the old value not subtracted, or not counted out; the new value added without its predicates; a query not seeing a version committed at its own timestamp; a merge leaving the old main row alive, applying the oldest version, dropping the next timestamp's version, or not advancing <code>main_ts</code>; compaction losing the key index; point reads ignoring the delta; deletes not recorded; the first of two writes in a commit winning. <strong>All 12 were killed.</strong> The row-id lookup added to the column store was checked with four more mutants (a segment found one early, deleted rows readable by id, double deletes accepted, segment starts not recorded); the column store now has 24 mutants, all killed.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>SAP HANA</strong> is the canonical delta/main design: a read-optimized dictionary-compressed main store and a write-optimized delta store per column, merged by an online "delta merge" that builds a new main store in the background and swaps it in.</li> <li><strong>SQL Server</strong> columnstore indexes: compressed row groups plus a delta store (a B-tree of rows) and a delete bitmap, with a tuple mover that compresses full delta groups; a nonclustered columnstore on an OLTP table gives HTAP in one engine.</li> <li><strong>TiDB</strong> replicates each Raft group's log to <strong>TiFlash</strong> column replicas (learners), which apply changes into a delta-tree plus stable columnar files; queries read a consistent snapshot from either side. <strong>SingleStore</strong> keeps an in-memory rowstore segment per columnstore table and flushes it into column segments.</li> <li><strong>Oracle Database In-Memory</strong> keeps a columnar copy of tables in memory, kept in sync with the row store; <strong>AlloyDB</strong> has a columnar engine cache; <strong>CockroachDB</strong> and <strong>Yugabyte</strong> have no columnar replica and rely on vectorized row scans.</li> <li><strong>Snowflake Hybrid Tables (Unistore)</strong> and <strong>Databricks Lakebase</strong> add row-oriented transactional stores next to column files; <strong>Greenplum/ClickHouse</strong>-style pairs use CDC to separate systems instead (Debezium-style change data capture).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>The delta must stay small.</strong> Compensation cost is linear; a merge that cannot keep up lets analytics degrade slowly until someone notices. Alert on delta size and merge lag.</li> <li><strong>Non-subtractable aggregates</strong> (<code>MIN</code>, <code>MAX</code>, <code>COUNT DISTINCT</code>, medians) cannot be compensated; they need the changed keys excluded from the scan, or a scan over a merged copy.</li> <li><strong>Merge versus long readers</strong>: a merge to timestamp <code>u</code> makes snapshots older than <code>u</code> unservable; either wait for those readers, or keep the previous main store alive until they finish.</li> <li><strong>Write amplification of an update</strong> is high in the main store (delete one row, insert another, eventually compact); wide tables with frequent updates favour smaller segments or a row store.</li> <li><strong>Hot keys</strong>: a key updated thousands of times has thousands of versions in the delta; trim versions no snapshot can read.</li> <li><strong>Consistency across the two copies</strong> in an architecture with a replica (TiFlash) depends on the replication timestamp: a query must wait until the replica has applied everything up to its snapshot.</li> <li><strong>The main store's key index</strong> (key → row id) costs memory proportional to the table; engines keep it only for the columns that need it or rebuild it per segment.</li> </ul></aside>
"""
