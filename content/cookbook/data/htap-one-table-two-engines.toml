[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Transactions want rows, analytics wants columns.</strong> An OLTP workload updates a few rows by key; an analytical query scans millions of rows of a few columns. One layout cannot be best at both, and running two systems with ETL between them means the analytics are hours stale and the two copies disagree.</li> <li><strong>HTAP keeps both layouts in one table.</strong> The <em>main</em> store is columnar and immutable-ish: it holds the table as of an older timestamp. The <em>delta</em> is a small, write-optimized structure that holds every row version committed since. Writers touch only the delta; readers combine both. This is SAP HANA's delta/main design, SQL Server's columnstore with a delta store, and Vertica's WOS/ROS.</li> <li><strong>A query does not have to wait for a merge.</strong> To aggregate at snapshot <code>t</code>: run the column scan over the main store, then <em>compensate</em> for the keys the delta has changed: subtract the old value of each changed row (read from main by key) and add its new value (from the delta) if it satisfies the predicates. The compensation costs one main lookup and one delta lookup per changed key, so a query is <code>O(main scan + delta keys)</code>. This works for aggregates you can subtract (<code>SUM</code>, <code>COUNT</code>, <code>AVG</code>); <code>MIN</code> and <code>MAX</code> need the changed keys excluded from the scan instead.</li> <li><strong>A merge changes nothing visible.</strong> It folds all delta versions up to a timestamp into the main store (delete the old row, insert the new one) and drops them from the delta. Every query at a timestamp not older than the merge must return the same result before and after; the tests check exactly that, for every readable snapshot.</li> <li><strong>The merge threshold is a trade-off.</strong> A large delta makes queries slower (more compensation); frequent merges cost CPU and write amplification. The right point is where compensation cost equals merge cost, which the measurements below locate.</li> <li><strong>Snapshots older than the last merge cannot be served</strong> from this structure, so a merge must wait for (or invalidate) older readers: the same watermark rule as garbage collection (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>).</li> <li><strong>Freshness is the product</strong>: an analytical query sees every committed transaction, immediately, without a lag, at the price of reading the delta.</li> </ul>
"""

[[sections]]
heading = "The structure"
body = """
```text
OLTP writes ─►  delta:  key → [(ts₁, row₁), (ts₂, row₂), …]      (newest last)        small, in memory
                                   │ merge(upto): fold versions ≤ upto into main
                                   ▼
analytic scan ─► main: column store (segments, zone maps, delete bitmaps)  + key → row id   as of main_ts

SUM(v) WHERE g < 10  at snapshot t
  = main scan(preds)                                              (columns only, encoded)
  − Σ over delta keys with a version ≤ t:  old main row, if it matches
  + Σ over delta keys with a version ≤ t:  newest version ≤ t, if it matches
```

<ul> <li><strong><code>commit</code></strong> appends versions to the delta at the next timestamp; several writes in one commit are atomic (same timestamp) and the later write to a key wins.</li> <li><strong><code>get(pk, t)</code></strong> looks at the delta's newest version <code>≤ t</code>, then falls back to the main row.</li> <li><strong><code>sum_count(col, preds, t)</code></strong> is the compensated aggregate.</li> <li><strong><code>merge(upto)</code></strong> applies, per key, its newest version <code>≤ upto</code>, deleting the old main row; versions after <code>upto</code> stay.</li> <li><strong><code>compact()</code></strong> rebuilds the main store from its live rows, reclaiming deleted space.</li> </ul>

:::deeper Reference: delta versions, compensated aggregates, merge and compaction over the column store
```rust title="src/multimodel/htap.rs"
//! Hybrid transactional and analytical processing on one table: a column store ("main") that holds the table as of an older timestamp,
//! and a small write-optimized "delta" of versioned row changes made since. Writes go to the delta. A query at snapshot `t` aggregates
//! over the main store and then *compensates* for the rows the delta changed (subtract their old values, add their new ones), so its
//! cost is the main scan plus the size of the delta. A merge folds the delta into the main store without changing any query result.
use crate::colstore::{ColTable, Pred, Ty};
use crate::mmkey::Val;
use std::collections::HashMap;

pub type Row = Vec<i64>;
#[derive(Clone, Debug)]
pub enum Write { Put(Row), Delete(i64) }

pub struct Htap {
    pub main: ColTable,
    index: HashMap<i64, usize>,                       // primary key → row id in `main`
    pub main_ts: u64,
    now: u64,
    delta: HashMap<i64, Vec<(u64, Option<Row>)>>,     // primary key → versions after `main_ts`, oldest first
    ncols: usize,
    pub merged_rows: u64,
}

fn vals(r: &Row) -> Vec<Val> { r.iter().map(|&x| Val::Int(x)).collect() }
fn matches(r: &Row, preds: &[(usize, Pred)]) -> bool { preds.iter().all(|(c, p)| p.matches(&Val::Int(r[*c]))) }

impl Htap {
    /// Column 0 is the primary key.
    pub fn new(ncols: usize, seg_rows: usize) -> Htap {
        Htap { main: ColTable::new(vec![Ty::Int; ncols], seg_rows), index: HashMap::new(), main_ts: 0, now: 0, delta: HashMap::new(), ncols, merged_rows: 0 }
    }
    pub fn now(&self) -> u64 { self.now }
    pub fn delta_keys(&self) -> usize { self.delta.len() }
    pub fn delta_versions(&self) -> usize { self.delta.values().map(|v| v.len()).sum() }

    /// Apply a batch atomically at the next timestamp.
    pub fn commit(&mut self, writes: &[Write]) -> u64 {
        self.now += 1;
        for w in writes {
            match w {
                Write::Put(r) => { assert_eq!(r.len(), self.ncols); self.delta.entry(r[0]).or_default().push((self.now, Some(r.clone()))); }
                Write::Delete(k) => self.delta.entry(*k).or_default().push((self.now, None)),
            }
        }
        self.now
    }

    fn main_row(&self, pk: i64) -> Option<Row> {
        let id = *self.index.get(&pk)?;
        self.main.get(id).map(|r| r.iter().map(|v| if let Val::Int(x) = v { *x } else { unreachable!() }).collect())
    }
    /// The row with this key as of timestamp `ts` (which must not be older than the last merge).
    pub fn get(&self, pk: i64, ts: u64) -> Option<Row> {
        assert!(ts >= self.main_ts, "snapshot {ts} is older than the merged state {}", self.main_ts);
        if let Some(vs) = self.delta.get(&pk) {
            if let Some((_, v)) = vs.iter().rev().find(|(t, _)| *t <= ts) { return v.clone(); }
        }
        self.main_row(pk)
    }

    /// `(SUM(col), COUNT(*))` over the rows that satisfy `preds` at snapshot `ts`.
    pub fn sum_count(&mut self, col: usize, preds: &[(usize, Pred)], ts: u64) -> (i128, usize) {
        assert!(ts >= self.main_ts);
        let (mut sum, mut n) = self.main.sum(col, preds);
        // compensation: every key with a version at or before `ts` is read from the delta instead of the main store
        for (&pk, vs) in &self.delta {
            let Some((_, new)) = vs.iter().rev().find(|(t, _)| *t <= ts) else { continue };
            if let Some(&id) = self.index.get(&pk) {
                let int = |c: usize| match self.main.value(id, c) { Some(Val::Int(x)) => x, other => panic!("main row {id} column {c}: {other:?}") };
                if preds.iter().all(|(c, p)| p.matches(&Val::Int(int(*c)))) { sum -= int(col) as i128; n -= 1; }
            }
            if let Some(new) = new { if matches(new, preds) { sum += new[col] as i128; n += 1; } }
        }
        (sum, n)
    }

    /// Fold every change up to `upto` into the main store; later versions stay in the delta. Returns the number of keys merged.
    pub fn merge(&mut self, upto: u64) -> usize {
        assert!(upto >= self.main_ts && upto <= self.now);
        let mut merged = 0;
        let keys: Vec<i64> = self.delta.iter().filter(|(_, vs)| vs.iter().any(|(t, _)| *t <= upto)).map(|(&k, _)| k).collect();
        for pk in keys {
            let vs = self.delta.get_mut(&pk).unwrap();
            let latest = vs.iter().rev().find(|(t, _)| *t <= upto).unwrap().1.clone();
            vs.retain(|(t, _)| *t > upto);
            if vs.is_empty() { self.delta.remove(&pk); }
            if let Some(id) = self.index.remove(&pk) { self.main.delete(id); }
            if let Some(row) = latest { let id = self.main.insert(vals(&row)); self.index.insert(pk, id); }
            merged += 1;
        }
        self.main_ts = upto;
        self.merged_rows += merged as u64;
        merged
    }

    /// Rebuild the main store from its live rows, dropping the space of deleted ones.
    pub fn compact(&mut self) {
        let rows = self.main.scan(&[], &(0..self.ncols).collect::<Vec<_>>());
        let mut fresh = ColTable::new(vec![Ty::Int; self.ncols], self.main.seg_rows);
        self.index.clear();
        for r in rows { let pk = if let Val::Int(x) = r[0] { x } else { unreachable!() }; let id = fresh.insert(r); self.index.insert(pk, id); }
        fresh.seal();
        self.main = fresh;
    }
}
```
