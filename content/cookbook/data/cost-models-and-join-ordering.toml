[[sections]]
heading = "Join ordering by dynamic programming"
body = """
<p><strong>Problem.</strong> Given leaves with estimated cardinalities and a join graph (edges annotated with selectivities), choose the order that minimizes the total size of the intermediate results (the cost model <strong>C_out</strong>: Σ |intermediate join results|).</p>

<p><strong>System R's insight.</strong> The best plan for a set <em>S</em> of relations is the best plan for some <em>S∖{j}</em> extended by <em>j</em>, and the <strong>size of a join result depends only on which relations it contains, not on the order they were joined in</strong>. So the optimal substructure holds:</p>

```text title="left-deep dynamic programming"
best[{i}]  = (cost 0, plan: scan i)
best[S]    = min over j ∈ S of  best[S ∖ {j}].cost + |⋈ S|        (|⋈ S| = Π cards × Π selectivities of edges inside S)
answer     = best[all relations]
```

<p>2ⁿ states with n transitions each: O(n·2ⁿ), practical to about 12–15 relations. Beyond that, systems switch to greedy or randomized search (PostgreSQL's GEQO above <code>geqo_threshold</code> = 12; Neumann &amp; Radke's adaptive optimization of very large join queries, SIGMOD 2018). <strong>Bushy</strong> trees (both inputs are joins) need subset-pair enumeration (DPsub/DPccp, O(3ⁿ)) but can beat the best left-deep plan; System R restricted itself to left-deep because the right input is then always a base table, which can use an index.</p>

<aside data-call="testing"><b>The DP is checked against brute force</b><p>The property test generates random join graphs (2–6 relations, random cardinalities, random edge selectivities), runs <code>best_order</code>, then evaluates the cost of <strong>every one of the n! permutations</strong> and requires the DP's cost to equal the minimum. A DP that is "obviously correct" is exactly the kind that has an off-by-one in its subset iteration.</p></aside>
"""

[[sections]]
heading = "Wired into the optimizer"
body = """
<p><code>reorder</code> flattens each tree of inner joins into <strong>leaves</strong> and <strong>conjuncts</strong>, pushes single-leaf conjuncts into their leaf, estimates each leaf from statistics (selectivity of its pushed filters), derives each join condition's selectivity (<code>1 / max(NDV, NDV)</code> for equalities, 0.33 otherwise), runs the DP, rebuilds a left-deep tree in the chosen order (each conjunct attached at the first join whose inputs contain all its columns), and adds a <strong>projection to restore the original column order</strong>, so the rest of the plan is unaffected. Outer joins are opaque: reordering across them changes results (<a href="/cookbook/p/relational-model-algebra">L01</a>).</p>

:::deeper Join reordering in the optimizer (flatten → estimate → DP → rebuild)
```rust title="src/optimizer/join_order.rs"
// ---------------- cost-based join ordering (System R: dynamic programming over left-deep trees) -------------
const MAX_DP_RELS: usize = 12;

/// Estimated rows and per-column NDV of a join input, from ANALYZE statistics (defaults without them).
fn leaf_estimate(p: &Plan, cat: &Catalog) -> (f64, Vec<f64>) {
    let (table, filter) = match p {
        Plan::SeqScan { table, filter, .. } => (Some(table), filter.clone()),
        Plan::Filter { pred, child } => match &**child { Plan::SeqScan { table, filter, .. } => (Some(table), Some(and(filter.clone(), pred.clone()))), _ => (None, None) },
        _ => (None, None),
    };
    let width = p.schema().len();
    let Some(st) = table.and_then(|t| cat.stats.get(&t.to_lowercase())) else { return (1000.0, vec![10.0; width]) };
    let card = (st.rows as f64 * filter.map_or(1.0, |f| selectivity(&f, st))).max(1.0);
    (card, st.cols.iter().map(|c| (c.ndv as f64).min(card).max(1.0)).collect())
}

/// Collect the leaves of a tree of INNER joins and every conjunct, with columns renumbered globally
/// (leaf 0's columns first, then leaf 1's, ...). Outer joins and everything else are opaque leaves.
fn flatten(p: Plan, base: usize, leaves: &mut Vec<Plan>, conj: &mut Vec<Expr>) {
    match p {
        Plan::NestedLoopJoin { left, right, pred, kind: JoinKind::Inner } => {
            let lw = left.schema().len();
            if let Some(pr) = pred { conj.extend(pr.shift(base as isize).conjuncts()); }
            flatten(*left, base, leaves, conj);
            flatten(*right, base + lw, leaves, conj);
        }
        leaf => leaves.push(leaf),
    }
}

fn add_filter(p: Plan, f: Expr) -> Plan {
    match p {
        Plan::Filter { pred, child } => Plan::Filter { pred: and(Some(pred), f), child },
        Plan::SeqScan { table, schema, filter } => Plan::SeqScan { table, schema, filter: Some(and(filter, f)) },
        other => Plan::Filter { pred: f, child: Box::new(other) },
    }
}

fn reorder(p: Plan, cat: &Catalog) -> Plan {
    if !matches!(&p, Plan::NestedLoopJoin { kind: JoinKind::Inner, .. }) { return map_children(p, &mut |c| reorder(c, cat)); }
    let schema = p.schema();
    let (mut leaves, mut conj) = (vec![], vec![]);
    flatten(p, 0, &mut leaves, &mut conj);
    let leaves: Vec<Plan> = leaves.into_iter().map(|l| reorder(l, cat)).collect();      // optimize inside opaque leaves too
    let n = leaves.len();
    let widths: Vec<usize> = leaves.iter().map(|l| l.schema().len()).collect();
    let offs: Vec<usize> = widths.iter().scan(0, |a, w| { let o = *a; *a += w; Some(o) }).collect();
    let total: usize = widths.iter().sum();
    let leaf_of = |g: usize| offs.iter().rposition(|&o| o <= g).unwrap();
    let leaves_of = |e: &Expr| { let mut c = vec![]; e.cols(&mut c); let mut ls: Vec<usize> = c.into_iter().map(leaf_of).collect(); ls.sort_unstable(); ls.dedup(); ls };

    // Classify conjuncts: constants, single-leaf (pushed into the leaf), multi-leaf (join conditions).
    let (mut single, mut multi, mut consts): (Vec<Vec<Expr>>, Vec<(Expr, Vec<usize>)>, Vec<Expr>) = (vec![vec![]; n], vec![], vec![]);
    for c in conj {
        let ls = leaves_of(&c);
        match ls.len() { 0 => consts.push(c), 1 => single[ls[0]].push(c.shift(-(offs[ls[0]] as isize))), _ => multi.push((c, ls)) }
    }
    let leaves: Vec<Plan> = leaves.into_iter().zip(single).map(|(l, fs)| match Expr::and_all(fs) { Some(f) => add_filter(l, f), None => l }).collect();

    // Cost model inputs: leaf cardinalities and a selectivity for every join condition.
    let est: Vec<(f64, Vec<f64>)> = leaves.iter().map(|l| leaf_estimate(l, cat)).collect();
    let one_leaf = |e: &Expr| { let ls = leaves_of(e); (ls.len() == 1).then(|| ls[0]) };
    let ndv = |e: &Expr, l: usize| match e { Expr::Col(g) => est[l].1[g - offs[l]], _ => est[l].0 };
    let edges: Vec<(usize, usize, f64)> = multi.iter().map(|(c, ls)| {
        let sel = match c {
            Expr::Bin(BinOp::Eq, a, b) => match (one_leaf(a), one_leaf(b)) {
                (Some(la), Some(lb)) if la != lb => 1.0 / ndv(a, la).max(ndv(b, lb)).max(1.0),    // 1 / max(V(A,R), V(A,S))
                _ => 0.33,
            },
            _ => 0.33,
        };
        (ls[0], ls[1], sel)
    }).collect();
    let graph = JoinGraph { card: est.iter().map(|e| e.0).collect(), edges };
    let order: Vec<usize> = if (3..=MAX_DP_RELS).contains(&n) { graph.best_order().0 } else { (0..n).collect() };

    // Rebuild a left-deep tree in the chosen order; renumber columns to the new concatenation order.
    let new_off: Vec<usize> = { let mut o = vec![0; n]; let mut a = 0; for &l in &order { o[l] = a; a += widths[l]; } o };
    let new_of_old: Vec<usize> = (0..total).map(|g| { let l = leaf_of(g); new_off[l] + (g - offs[l]) }).collect();
    let mut slots: Vec<Option<Plan>> = leaves.into_iter().map(Some).collect();
    let (mut acc, mut mask, mut used) = (None::<Plan>, 0u32, vec![false; multi.len()]);
    for &j in &order {
        let leaf = slots[j].take().unwrap();
        mask |= 1 << j;
        acc = Some(match acc {
            None => leaf,
            Some(a) => {
                let mut ps: Vec<Expr> = consts.drain(..).collect();
                for (k, (c, ls)) in multi.iter().enumerate() {
                    if !used[k] && ls.iter().all(|l| mask >> l & 1 == 1) { used[k] = true; ps.push(c.map_cols(&|g| new_of_old[g])); }
                }
                Plan::NestedLoopJoin { left: Box::new(a), right: Box::new(leaf), pred: Expr::and_all(ps), kind: JoinKind::Inner }
            }
        });
    }
    let tree = acc.unwrap();
    if order.iter().enumerate().all(|(i, &l)| i == l) { return tree; }
    // The new tree emits columns in the new order; restore the order the rest of the plan expects.
    Plan::Projection { exprs: (0..total).map(|g| Expr::Col(new_of_old[g])).collect(), schema: Schema::new(schema.cols.iter().map(|c| Column { ..c.clone() }).collect()), child: Box::new(tree) }
}
```
:::

```text title="SELECT COUNT(*), SUM(big.v + mid.w) FROM big, mid, tiny WHERE big.k = mid.k AND mid.k = tiny.k AND tiny.flag = 1"
        big: 40,000 rows · mid: 40,000 rows · tiny: 2,000 rows, 3 with flag = 1

FROM-clause order (no statistics):                                57.3 ms
  HashJoin tiny.k = …
    HashJoin big.k = mid.k           ← 40k ⋈ 40k on k with 2,000 distinct values: 800,000 intermediate rows
      SeqScan big
      SeqScan mid
    SeqScan tiny filter=(flag = 1)

DP order (after ANALYZE):                                         13.1 ms     (4.4×, identical result)
  Projection [...restore original column order...]
    HashJoin big.k = tiny.k
      HashJoin tiny.k = mid.k        ← the 3 flagged tiny rows first: 60 intermediate rows
        SeqScan tiny filter=(flag = 1)
        SeqScan mid
      SeqScan big
```

<p>The plan's <em>shape</em> is the whole difference: the same three scans and two hash joins, in a different order. And it only happens with statistics: without <code>ANALYZE</code> the estimator sees three tables of 1,000 rows and has no reason to move anything.</p>
"""

[[sections]]
heading = "Where it breaks"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Failure</th> <th>Cause</th> <th>What production systems do</th> </tr> </thead> <tbody> <tr> <td>Correlated predicates</td> <td>independence assumption</td> <td>multi-column stats, column groups, sampling</td> </tr> <tr> <td>Skewed join keys</td> <td>uniformity and containment</td> <td>MCV-aware join estimates (join the two MCV lists first), histogram-histogram joins</td> </tr> <tr> <td>Errors compounding up a deep plan</td> <td>each estimate multiplies the previous error</td> <td>re-optimize mid-query when actual cardinalities diverge (adaptive execution: Spark AQE, SQL Server adaptive joins), robust plan choice</td> </tr> <tr> <td>Stale statistics</td> <td>data changed since <code>ANALYZE</code></td> <td>auto-analyze triggered by modification counters (PostgreSQL's autovacuum analyze at 10% + 50 rows), sampling at plan time</td> </tr> <tr> <td>Expensive-to-estimate functions (<code>UDF(x) &gt; 3</code>)</td> <td>no statistics exist</td> <td>default constants, user hints, learned models</td> </tr> </tbody> </table></div>

<p>Leis et al.'s <a href="https://www.vldb.org/pvldb/vol9/p204-leis.pdf" target="_blank" rel="noreferrer"><em>How Good Are Query Optimizers, Really?</em></a> (VLDB 2015) ran the Join Order Benchmark on five systems: cardinality estimates were off by <strong>orders of magnitude</strong> after a few joins in all of them, yet plan quality was acceptable when indexes were scarce, and catastrophic otherwise. Their conclusion: the cost model matters far less than the cardinality estimates, and a perfect cardinality oracle improves PostgreSQL's plans dramatically. Part III is built around that observation.</p>
"""

