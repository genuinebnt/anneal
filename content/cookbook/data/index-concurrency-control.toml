heading = "Latch crabbing, and why optimism wins"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Protocol</th> <th>Readers</th> <th>Writers</th> <th>Root contention</th> </tr> </thead> <tbody> <tr> <td>Global RW latch</td> <td>shared</td> <td>exclusive on the whole tree</td> <td>total</td> </tr> <tr> <td>Pessimistic crabbing</td> <td>read latches, parent released after child</td> <td><strong>write</strong> latches from the root, released when a node is safe</td> <td>every writer write-latches the root</td> </tr> <tr> <td>Optimistic crabbing (Bayer &amp; Schkolnick 1977)</td> <td>same</td> <td>read latches down, write latch on the leaf only; restart pessimistically if the leaf is unsafe</td> <td>readers still bump the root's reader count</td> </tr> <tr> <td>B-link tree (Lehman &amp; Yao 1981)</td> <td><strong>no</strong> latch coupling; follow right-links if a split moved the key</td> <td>latch only the node being changed</td> <td>low</td> </tr> <tr> <td><strong>Optimistic lock coupling</strong> (Leis et al. 2016)</td> <td><strong>no writes at all</strong>: read version, read node, validate</td> <td>latch only the nodes being changed</td> <td>none for readers</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Leaf scans and deadlock"
body = """
<p>Crabbing is deadlock-free because every thread acquires latches <strong>top-down</strong>. A forward leaf scan acquires them <strong>left to right</strong>. A delete that merges a leaf into its <em>left</em> sibling holds the right leaf and wants the left one, while the scan holds the left one and wants the right: deadlock. Latches have no deadlock detector. The fix is <strong>no-wait</strong>: acquire sibling latches with <code>try_lock</code>, and on failure release everything and restart. <code>RwLock::try_read</code> exists for exactly this purpose. The reference iterator (<a href="/cookbook/p/index-iterator">P2.4</a>) avoids the whole issue by never holding a leaf latch while acquiring the next one.</p>

<aside data-call="production"><b>What production trees do</b><ul> <li><strong>PostgreSQL nbtree</strong>: Lehman–Yao B-link tree. Readers hold one page latch at a time and move right via the right-link and high key if a concurrent split moved their key. Page deletion is a two-phase process to keep scans safe.</li> <li><strong>InnoDB</strong>: an index-level RW latch (SX mode) plus page latches; pessimistic operations take the index latch in SX mode.</li> <li><strong>LeanStore, Umbra, HyPer</strong>: optimistic lock coupling with version counters, plus epoch-based memory reclamation for deleted nodes.</li> <li><strong>Bw-tree</strong> (SQL Server Hekaton): latch-free, with delta records and CAS on a mapping table (Part II).</li> </ul></aside>
"""

