[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Four generations of analytics systems</strong>: <strong>1990s data cubes</strong> (pre-aggregated multidimensional arrays, specified up front, refreshed periodically, bolted onto OLTP systems); <strong>2000s data warehouses</strong> (monolithic, shared-nothing, columnar, often Postgres forks with proprietary formats, fed by ETL); <strong>2010s shared-disk engines</strong> (compute separated from third-party distributed or object storage); <strong>2020s lakehouses</strong> (middleware on data lakes adding schema, versioning and transactional CRUD to open files; changes land in row-oriented log-structured files and are periodically compacted into read-only columnar files). The lakehouse bets on three observations: people want more than SQL (procedural and ML code), decoupling the store from the DBMS removes ingest/egress barriers, and most data is semi- or unstructured.</li> <li><strong>Components are becoming reusable services and libraries</strong> (parsers, catalogs, IRs, optimizers like Calcite, file formats, access libraries, execution engines like Velox/DataFusion): <em>The Composable Data Management System Manifesto</em>. The engineering challenge is making them interoperate <em>and</em> perform.</li> <li><strong>Anatomy of an OLAP DBMS</strong>: front-end (parser → IR), planner (binder, rewriter, optimizer, cost model), scheduler (breaks the plan into fragments), execution engine, <strong>I/O service</strong> (block requests to the object store), catalog (data locations and metadata). A plan is a DAG of physical operators; data is either <strong>persistent</strong> (immutable files, updated by rewriting) or <strong>intermediate</strong> (short-lived, unrelated in size to input or runtime).</li> <li><strong>Push query to data</strong> (shared-nothing; filter where it lives) vs <strong>pull data to query</strong> (shared-disk; needed when storage has no compute). <strong>Object stores</strong> (S3, Azure Blob, GCS) hold large immutable <strong>PAX</strong> files (all columns of a row group together, columnar inside) with a header/footer carrying column offsets, compression, indexes and zone maps; the engine fetches the footer first, then only the <strong>byte ranges</strong> it needs, through a cloud-specific <code>GET/PUT/DELETE</code> API.</li> <li><strong>Case-study lessons</strong> (details below): disaggregate compute, storage, even memory (Dremel's shuffle service, Snowflake's cache); get statistics from the <em>storage layer</em> because files written elsewhere have none; make planning <strong>adaptive</strong> at stage boundaries (broadcast vs shuffle, partition coalescing, skew handling); prefer <strong>precompiled vectorized primitives</strong> over JIT for maintainability (Photon, Velox, DuckDB) except where compile latency can be hidden by caching (Redshift, Yellowbrick); invest in the <strong>boring systems layers</strong> (allocators, caches, network paths) since they decide real-world speed.</li> </ul>
"""

