[[sections]]
heading = "BtrBlocks-style cascade with sampling"
body = """
<p><code>encode</code> tries the candidate schemes on a <strong>sample</strong> (10 runs of 64 values spread over the block), picks the smallest, then encodes the <em>full</em> block with that scheme, recursively compressing the scheme's outputs (RLE's values and lengths, the dictionary and its codes, Frequency's exceptions, the deltas) up to a depth limit. <code>Pick::Exhaustive</code> tries each scheme on all the data, as the yardstick.</p>

:::deeper Reference: scheme set, sampling selector, cascading encode/decode, and pseudodecimal doubles
```rust title="src/storage/btr.rs"
//! BtrBlocks-style cascading compression: pick a scheme per block by *sampling*, then recursively compress
//! the scheme's outputs (run lengths, dictionary codes, exceptions) the same way.
use crate::fmtlib::*;

#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]
pub enum Scheme { Plain = 0, OneValue = 1, For = 2, DeltaFor = 3, Rle = 4, Dict = 5, Frequency = 6 }

const ALL: [Scheme; 7] = [Scheme::Plain, Scheme::OneValue, Scheme::For, Scheme::DeltaFor, Scheme::Rle, Scheme::Dict, Scheme::Frequency];

#[derive(Clone, Copy, PartialEq, Eq)]
pub enum Pick { Sample, Exhaustive }

fn put_block(out: &mut Vec<u8>, b: &[u8]) { put_varint(b.len() as u64, out); out.extend(b); }
fn get_block<'a>(b: &'a [u8], p: &mut usize) -> &'a [u8] { let l = get_varint(b, p) as usize; let s = &b[*p..*p + l]; *p += l; s }

/// Encode with one specific scheme; nested streams are compressed again while `depth > 0`.
pub fn encode_with(v: &[i64], s: Scheme, depth: u8, pick: Pick) -> Option<Vec<u8>> {
    let sub = |x: &[i64]| -> Vec<u8> { if depth == 0 { let mut o = vec![]; encode_with_plain(x, &mut o); o } else { encode(x, depth - 1, pick) } };
    let mut o = vec![s as u8];
    match s {
        Scheme::Plain => { for x in v { o.extend(x.to_le_bytes()); } }
        Scheme::OneValue => { if v.is_empty() || v.iter().any(|x| *x != v[0]) { return None; } o.extend(v[0].to_le_bytes()); }
        Scheme::For => {
            let min = *v.iter().min()?;
            let w = bits_for(v.iter().map(|x| x.wrapping_sub(min) as u64).max()?);
            o.extend(min.to_le_bytes()); o.push(w as u8);
            pack_bits(&v.iter().map(|x| x.wrapping_sub(min) as u64).collect::<Vec<_>>(), w, &mut o);
        }
        Scheme::DeltaFor => {
            if v.len() < 2 { return None; }
            let d: Vec<i64> = v.windows(2).map(|p| p[1].wrapping_sub(p[0])).collect();
            o.extend(v[0].to_le_bytes());
            put_block(&mut o, &sub(&d));
        }
        Scheme::Rle => {
            let (mut vals, mut lens) = (vec![], vec![]);
            let mut i = 0;
            while i < v.len() { let mut j = i; while j < v.len() && v[j] == v[i] { j += 1; } vals.push(v[i]); lens.push((j - i) as i64); i = j; }
            if vals.len() * 2 > v.len() { return None; }               // not run-heavy: skip
            put_varint(vals.len() as u64, &mut o);
            put_block(&mut o, &sub(&vals)); put_block(&mut o, &sub(&lens));
        }
        Scheme::Dict => {
            let mut d: Vec<i64> = v.to_vec(); d.sort_unstable(); d.dedup();
            if d.len() * 2 > v.len() { return None; }
            let codes: Vec<i64> = v.iter().map(|x| d.binary_search(x).unwrap() as i64).collect();
            put_varint(d.len() as u64, &mut o);
            put_block(&mut o, &sub(&d)); put_block(&mut o, &sub(&codes));
        }
        Scheme::Frequency => {
            // the most common value + a bitmap of "is the top value" + the exceptions in order
            let mut counts = std::collections::HashMap::new();
            for x in v { *counts.entry(*x).or_insert(0usize) += 1; }
            let (&top, &n) = counts.iter().max_by_key(|(k, c)| (**c, std::cmp::Reverse(**k)))?;
            if n * 10 < v.len() * 6 { return None; }                       // needs a clearly dominant value (≥ 60%)
            let exc: Vec<i64> = v.iter().copied().filter(|x| *x != top).collect();
            o.extend(top.to_le_bytes());
            let mut bm = vec![]; pack_bits(&v.iter().map(|x| (*x != top) as u64).collect::<Vec<_>>(), 1, &mut bm);
            put_block(&mut o, &bm);
            put_block(&mut o, &sub(&exc));
        }
    }
    Some(o)
}

fn encode_with_plain(v: &[i64], o: &mut Vec<u8>) { o.push(Scheme::Plain as u8); for x in v { o.extend(x.to_le_bytes()); } }

/// A sample of `runs` runs of `len` values from evenly spread, non-overlapping positions.
fn sample(v: &[i64], runs: usize, len: usize) -> Vec<i64> {
    if v.len() <= runs * len { return v.to_vec(); }
    let stride = v.len() / runs;
    (0..runs).flat_map(|i| v[i * stride..i * stride + len].iter().copied()).collect()
}

pub fn encode(v: &[i64], depth: u8, pick: Pick) -> Vec<u8> {
    let probe: Vec<i64>;
    let basis: &[i64] = match pick { Pick::Exhaustive => v, Pick::Sample => { probe = sample(v, 10, 64); &probe } };
    let best = ALL.iter().filter_map(|&s| encode_with(basis, s, depth.min(1), Pick::Exhaustive).map(|b| (b.len(), s))).min().map(|x| x.1).unwrap_or(Scheme::Plain);
    encode_with(v, best, depth, pick).or_else(|| encode_with(v, Scheme::Plain, 0, pick)).unwrap()
}

pub fn decode(b: &[u8], n: usize) -> Vec<i64> {
    let (tag, body) = (b[0], &b[1..]);
    match tag {
        0 => body.chunks_exact(8).take(n).map(|c| i64::from_le_bytes(c.try_into().unwrap())).collect(),
        1 => vec![i64::from_le_bytes(body[..8].try_into().unwrap()); n],
        2 => { let min = i64::from_le_bytes(body[..8].try_into().unwrap()); unpack_bits(&body[9..], body[8] as u32, n).into_iter().map(|x| min.wrapping_add(x as i64)).collect() }
        3 => {
            let first = i64::from_le_bytes(body[..8].try_into().unwrap());
            let mut p = 8; let d = decode(get_block(body, &mut p), n.saturating_sub(1));
            let mut out = Vec::with_capacity(n); let mut cur = first; if n > 0 { out.push(cur); }
            for x in d { cur = cur.wrapping_add(x); out.push(cur); }
            out
        }
        4 => {
            let mut p = 0; let runs = get_varint(body, &mut p) as usize;
            let vals = decode(get_block(body, &mut p), runs); let lens = decode(get_block(body, &mut p), runs);
            vals.iter().zip(&lens).flat_map(|(v, l)| std::iter::repeat_n(*v, *l as usize)).collect()
        }
        5 => {
            let mut p = 0; let k = get_varint(body, &mut p) as usize;
            let d = decode(get_block(body, &mut p), k);
            decode(get_block(body, &mut p), n).iter().map(|c| d[*c as usize]).collect()
        }
        6 => {
            let top = i64::from_le_bytes(body[..8].try_into().unwrap());
            let mut p = 8; let bm = get_block(body, &mut p);
            let flags = unpack_bits(bm, 1, n);
            let n_exc = flags.iter().filter(|&&f| f == 1).count();
            let exc = decode(get_block(body, &mut p), n_exc);
            let mut it = exc.into_iter();
            flags.iter().map(|&f| if f == 1 { it.next().unwrap() } else { top }).collect()
        }
        _ => unreachable!(),
    }
}

/// Which scheme was chosen at the top level.
pub fn top_scheme(b: &[u8]) -> Scheme { ALL[b[0] as usize] }

// ---------------- doubles: pseudodecimal ----------------

/// A double becomes (integer digits, decimal exponent) if some e ≤ 15 reproduces it exactly; otherwise it is an exception.
pub fn encode_f64(v: &[f64]) -> Vec<u8> {
    let (mut digits, mut exps, mut exc_pos, mut exc_val) = (vec![], vec![], vec![], vec![]);
    for (i, &x) in v.iter().enumerate() {
        let hit = (0..=15i32).find_map(|e| { let s = (x * 10f64.powi(e)).round(); (s.abs() < 9.0e15 && s / 10f64.powi(e) == x && !(x == 0.0 && x.is_sign_negative())).then_some((s as i64, e as i64)) });
        match hit { Some((d, e)) => { digits.push(d); exps.push(e); } None => { exc_pos.push(i as i64); exc_val.push(x.to_bits() as i64); digits.push(0); exps.push(0); } }
    }
    let mut o = vec![];
    put_varint(exc_pos.len() as u64, &mut o);
    put_block(&mut o, &encode(&digits, 2, Pick::Sample));
    put_block(&mut o, &encode(&exps, 2, Pick::Sample));
    put_block(&mut o, &encode(&exc_pos, 2, Pick::Sample));
    put_block(&mut o, &encode(&exc_val, 0, Pick::Sample));
    o
}

pub fn decode_f64(b: &[u8], n: usize) -> Vec<f64> {
    let mut p = 0;
    let n_exc = get_varint(b, &mut p) as usize;
    let digits = decode(get_block(b, &mut p), n);
    let exps = decode(get_block(b, &mut p), n);
    let pos = decode(get_block(b, &mut p), n_exc);
    let val = decode(get_block(b, &mut p), n_exc);
    let mut out: Vec<f64> = digits.iter().zip(&exps).map(|(d, e)| *d as f64 / 10f64.powi(*e as i32)).collect();
    for (p, v) in pos.iter().zip(&val) { out[*p as usize] = f64::from_bits(*v as u64); }
    out
}
```
