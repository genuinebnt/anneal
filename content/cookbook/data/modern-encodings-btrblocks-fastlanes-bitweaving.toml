[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Parquet-style decoding is CPU-bound.</strong> Variable-length runs and sequential dependencies (delta encoding: each value needs the previous one) waste cycles in both scalar and vectorized code and cannot use SIMD lanes. Three research formats attack this: <strong>BtrBlocks</strong> (better encodings and a smarter way to <em>choose</em> them), <strong>FastLanes</strong> (a layout that makes decoding data-parallel), <strong>BitWeaving</strong> (scan predicates directly on bit-sliced compressed data).</li> <li><strong>BtrBlocks</strong> (TU Munich): an open columnar format for data lakes minimizing <em>total cost</em> = storage + fast decompression. <strong>Seven existing schemes plus one new one for doubles</strong>, applied in a <strong>cascade</strong> (RLE, then bit-pack the run lengths; dictionary, then bit-pack the codes). Choice per column chunk by a <strong>greedy sampling algorithm</strong>: take a sample made of <em>several small runs from non-overlapping random positions</em> (so the sample captures both <strong>locality</strong> and <strong>distribution</strong>; runs of ≥ 16 tuples all work about equally), try every viable scheme on it, keep the best, and recurse on its outputs for up to three rounds. Reported: scans <strong>2.2× faster and 1.8× cheaper</strong> than Parquet on real data. Metadata is stored <em>separately</em> from data so a reader can prune before touching a high-latency object.</li> <li><strong>BtrBlocks' schemes</strong>: <strong>RLE and One-Value</strong>; <strong>Frequency</strong> (store the top value, a bitmap of "is the top value", and the <em>exceptions</em>: for skewed data); <strong>FOR + bit-packing</strong>; <strong>dictionary</strong>; <strong>FSST</strong> (Fast Static Symbol Table: replaces frequent substrings of up to 8 bytes with 1-byte codes from a table of ≤ 255 symbols built by an evolutionary, gain-driven algorithm; keeps <strong>random access</strong> to each string, unlike LZ4 blocks, and handles many unique-but-similar strings that a dictionary can't); <strong>Roaring bitmaps</strong> for NULLs and exceptions (dense 2¹⁶-value chunks as bitmaps, sparse chunks as sorted 16-bit arrays); <strong>pseudodecimals</strong> (a double as <em>(sign·digits, exponent)</em> when some power of ten maps it exactly to an integer, e.g. 3.25 → (+325, 2); exceptions for −0, ±∞, NaN and values like 5.5×10⁻⁴²; useless for few-unique or exception-heavy columns).</li> <li><strong>FastLanes</strong> (CWI): <strong>delta encoding</strong> has a serial dependency chain; FastLanes splits the values into runs (16 runs of 8, or here 32 of 32), gives <strong>each run its own base</strong>, and <strong>transposes</strong> the layout (the <em>Unified Transposed Layout</em>, UTL) so that a SIMD register holds one value <em>from each run</em>: resolving the deltas takes a few vector adds instead of a long chain. It exploits that relational algebra is over unordered sets, so tuple order inside a block is free to change. It is defined over a <strong>virtual 1024-bit instruction set (FLMM1024)</strong> of simple loops over 16 <code>u64</code> words, which optimizing compilers auto-vectorize to whatever the hardware offers, so it is <strong>portable</strong> across register widths and ISAs, and decodes &gt; 100 G integers/s with scalar-written code.</li> <li><strong>BitWeaving</strong> (Wisconsin, in Quickstep): traditional encodings process one value per operation and cannot short-circuit a comparison, because CPUs work on whole words, and codes narrower than 32 bits waste most of each SIMD lane. <strong>Bit-sliced</strong> layouts store <em>bit 15 of many values together, then bit 14, …</em>; a predicate walks planes from the <strong>most significant bit</strong> with word-wide AND/OR/XOR and can <strong>stop as soon as every tuple is decided</strong> (<em>early pruning</em>); SUM falls out of <strong>popcount</strong> per plane. <strong>BitWeaving/V</strong> (vertical: plane = one bit of many tuples; fast scans, slow to reassemble a value) and <strong>BitWeaving/H</strong> (horizontal: all bits of a value together plus a delimiter bit; fast value fetch, no early pruning, up to 2× slower scans). Result bit vectors feed the next predicate and are converted to positions via a <strong>pre-computed positions table</strong>. Reported: <strong>20× faster than SIMD-scan at 4-bit codes, 4× faster above 12 bits</strong>.</li> <li><strong>Take-away</strong>: pick encodings <em>by measuring the data</em> (sampling), keep decode loops <strong>branch-free and dependency-free</strong> (transposed layouts), and evaluate predicates <strong>on the encoded form</strong> when you can.</li> </ul>
"""

[[sections]]
heading = "The encoding library"
body = """
<p>All the lightweight encodings in this part (the chooser in <a href="/cookbook/p/networking-protocols">A9</a>, the PAX writer in <a href="/cookbook/p/columnar-formats-and-nested-data">A12</a>) sit on one small library: variable-length integers, zigzag, a <strong>bit-packer</strong> (a <code>u128</code> accumulator that streams <code>w</code>-bit fields into bytes), and the integer and dictionary encoders. Round-trip tests run <strong>every bit width from 1 to 64</strong> at lengths straddling 8 and 64, and check that the scheme chooser picks the expected scheme for constant, sorted, small-range, random and run-heavy data (4 bytes for 1 000 equal values, 21 bytes for 1 000 values in ten runs, plain for random 64-bit values).</p>

:::deeper Reference: bit-packing, varints, FOR / delta / RLE integer encoding and dictionary strings
```rust title="src/storage/fmtlib.rs"
//! Lightweight columnar encodings (bit-packing, frame of reference, delta, RLE, dictionary) with a tiny
//! "pick the smallest" scheme chooser: the building blocks of Parquet-like formats and compact wire protocols.

pub fn bits_for(max: u64) -> u32 { (64 - max.leading_zeros()).max(1) }

pub fn put_varint(mut v: u64, out: &mut Vec<u8>) {
    while v >= 0x80 { out.push((v as u8) | 0x80); v >>= 7; }
    out.push(v as u8);
}
pub fn get_varint(b: &[u8], pos: &mut usize) -> u64 {
    let (mut v, mut s) = (0u64, 0);
    loop { let x = b[*pos]; *pos += 1; v |= ((x & 0x7F) as u64) << s; if x < 0x80 { return v; } s += 7; }
}
pub fn zigzag(v: i64) -> u64 { ((v << 1) ^ (v >> 63)) as u64 }
pub fn unzigzag(v: u64) -> i64 { ((v >> 1) as i64) ^ -((v & 1) as i64) }

/// Pack `vals` (each < 2^w) into a little-endian bit stream.
pub fn pack_bits(vals: &[u64], w: u32, out: &mut Vec<u8>) {
    let (mut acc, mut nb) = (0u128, 0u32);
    for &v in vals {
        acc |= (v as u128) << nb;
        nb += w;
        while nb >= 8 { out.push(acc as u8); acc >>= 8; nb -= 8; }
    }
    if nb > 0 { out.push(acc as u8); }
}

pub fn packed_len(n: usize, w: u32) -> usize { (n * w as usize).div_ceil(8) }

pub fn unpack_bits(buf: &[u8], w: u32, n: usize) -> Vec<u64> {
    let mask = if w == 64 { u64::MAX } else { (1u64 << w) - 1 };
    let (mut acc, mut nb, mut pos) = (0u128, 0u32, 0usize);
    let mut out = Vec::with_capacity(n);
    for _ in 0..n {
        while nb < w { acc |= (buf[pos] as u128) << nb; pos += 1; nb += 8; }
        out.push((acc as u64) & mask);
        acc >>= w;
        nb -= w;
    }
    out
}

#[derive(Debug, PartialEq, Eq, Clone, Copy)]
pub enum IntScheme { Plain = 0, For = 1, DeltaFor = 2, Rle = 3 }

/// Encode with the smallest of: plain 8-byte, frame-of-reference + bit-packing, delta + zigzag + FOR, run-length.
pub fn encode_ints(v: &[i64], out: &mut Vec<u8>) -> IntScheme {
    let mut best: (IntScheme, Vec<u8>) = (IntScheme::Plain, v.iter().flat_map(|x| x.to_le_bytes()).collect());
    let mut consider = |s: IntScheme, buf: Vec<u8>| if buf.len() < best.1.len() { best = (s, buf); };
    if !v.is_empty() {
        let (min, max) = (*v.iter().min().unwrap(), *v.iter().max().unwrap());
        let w = bits_for(max.wrapping_sub(min) as u64);
        let mut b = vec![]; b.extend(min.to_le_bytes()); b.push(w as u8);
        pack_bits(&v.iter().map(|&x| x.wrapping_sub(min) as u64).collect::<Vec<_>>(), w, &mut b);
        consider(IntScheme::For, b);

        let d: Vec<u64> = v.windows(2).map(|p| zigzag(p[1].wrapping_sub(p[0]))).collect();
        let dw = bits_for(d.iter().copied().max().unwrap_or(0));
        let mut b = vec![]; b.extend(v[0].to_le_bytes()); b.push(dw as u8);
        pack_bits(&d, dw, &mut b);
        consider(IntScheme::DeltaFor, b);

        let mut b = vec![]; let mut i = 0;
        while i < v.len() { let mut j = i; while j < v.len() && v[j] == v[i] { j += 1; } put_varint(zigzag(v[i]), &mut b); put_varint((j - i) as u64, &mut b); i = j; }
        consider(IntScheme::Rle, b);
    }
    out.push(best.0 as u8);
    out.extend(&best.1);
    best.0
}

pub fn decode_ints(b: &[u8], n: usize) -> Vec<i64> {
    let (tag, b) = (b[0], &b[1..]);
    match tag {
        0 => b[..n * 8].chunks_exact(8).map(|c| i64::from_le_bytes(c.try_into().unwrap())).collect(),
        1 => {
            let min = i64::from_le_bytes(b[..8].try_into().unwrap());
            unpack_bits(&b[9..], b[8] as u32, n).into_iter().map(|x| min.wrapping_add(x as i64)).collect()
        }
        2 => {
            let first = i64::from_le_bytes(b[..8].try_into().unwrap());
            let d = unpack_bits(&b[9..], b[8] as u32, n.saturating_sub(1));
            let mut out = Vec::with_capacity(n);
            let mut cur = first;
            if n > 0 { out.push(cur); }
            for x in d { cur = cur.wrapping_add(unzigzag(x)); out.push(cur); }
            out
        }
        3 => {
            let (mut out, mut pos) = (Vec::with_capacity(n), 0);
            while out.len() < n { let v = unzigzag(get_varint(b, &mut pos)); let run = get_varint(b, &mut pos) as usize; out.extend(std::iter::repeat_n(v, run)); }
            out
        }
        _ => unreachable!(),
    }
}

/// Dictionary encoding: sorted distinct values + bit-packed codes. Returns bytes written.
pub fn encode_dict(vals: &[&str], out: &mut Vec<u8>) {
    let mut d: Vec<&str> = vals.to_vec();
    d.sort_unstable(); d.dedup();
    put_varint(d.len() as u64, out);
    for s in &d { put_varint(s.len() as u64, out); out.extend(s.as_bytes()); }
    let codes: Vec<u64> = vals.iter().map(|v| d.binary_search(v).unwrap() as u64).collect();
    let w = bits_for(d.len().saturating_sub(1) as u64);
    out.push(w as u8);
    pack_bits(&codes, w, out);
}

pub fn decode_dict(b: &[u8], n: usize) -> Vec<String> {
    let mut pos = 0;
    let k = get_varint(b, &mut pos) as usize;
    let mut d = Vec::with_capacity(k);
    for _ in 0..k { let l = get_varint(b, &mut pos) as usize; d.push(String::from_utf8(b[pos..pos + l].to_vec()).unwrap()); pos += l; }
    let w = b[pos] as u32;
    unpack_bits(&b[pos + 1..], w, n).into_iter().map(|c| d[c as usize].clone()).collect()
}
