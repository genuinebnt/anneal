<p>Capacity 7. Notation from the test: <code>(page, frame)</code>; <code>p(…)</code> is pinned; <code>(n,_)</code> is a ghost.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Step</th> <th>Operation</th> <th>State after <code>[B1][T1]![T2][B2]</code></th> <th>p</th> <th>Size</th> </tr> </thead> <tbody> <tr> <td>1</td> <td>access pages 1–6 on frames 1–6; 1–5 evictable, 6 pinned</td> <td><code>[][1,2,3,4,5,p6]![][]</code></td> <td>0</td> <td>5</td> </tr> <tr> <td>2</td> <td>access page 1 again (case 1)</td> <td><code>[][2,3,4,5,p6]![1][]</code></td> <td>0</td> <td>5</td> </tr> <tr> <td>3</td> <td>evict ×3: |T1|=5 ≥ p=0 ⇒ MRU side, oldest first</td> <td><code>[2,3,4][5,p6]![1][]</code> → returns 2, 3, 4</td> <td>0</td> <td>2</td> </tr> <tr> <td>4</td> <td>page 7 on frame 2 (new, case 4c)</td> <td><code>[2,3,4][5,p6,7]![1][]</code></td> <td>0</td> <td>3</td> </tr> <tr> <td>5</td> <td>page 2 on frame 3: <strong>B1 hit</strong>; |B1|=3 ≥ |B2|=0 ⇒ p+1</td> <td><code>[3,4][5,p6,7]![2,1][]</code></td> <td>1</td> <td>4</td> </tr> <tr> <td>6</td> <td>page 3 on frame 4, page 4 on frame 7: two more B1 hits</td> <td><code>[][5,p6,7]![4,3,2,1][]</code></td> <td>3</td> <td>6</td> </tr> <tr> <td>7</td> <td>evict: |T1|=3 ≥ p=3 ⇒ MRU side ⇒ page 5</td> <td><code>[5][p6,7]![4,3,2,1][]</code></td> <td>3</td> <td>5</td> </tr> <tr> <td>8</td> <td>evict: |T1|=2 &lt; p=3 ⇒ <strong>MFU side</strong> ⇒ oldest is page 1 (frame 1)</td> <td><code>[5][p6,7]![4,3,2][1]</code></td> <td>3</td> <td>4</td> </tr> <tr> <td>9</td> <td>page 1 on frame 5: <strong>B2 hit</strong>; |B2|=1 ≥ |B1|=1 ⇒ p−1</td> <td><code>[5][p6,7]![1,4,3,2][]</code></td> <td>2</td> <td>5</td> </tr> <tr> <td>10</td> <td>evict: |T1|=2 ≥ p=2 ⇒ MRU; page 6 is pinned, so skip it ⇒ page 7 (frame 2)</td> <td><code>[5,7][p6]![1,4,3,2][]</code></td> <td>2</td> <td>4</td> </tr> </tbody> </table></div>

<p>Note step 10: T1's <em>length</em> still counts pinned page 6 when comparing against <em>p</em>, but the victim search skips it.</p>
"""

[[sections]]
heading = "Invariants"
body = """
<p>Write <code>check_invariants()</code> before <code>record_access</code>, and call it after every operation in tests:</p>

<ol> <li>0 ≤ <em>p</em> ≤ <em>c</em>.</li> <li>|T1| + |T2| ≤ <em>c</em>: never more alive entries than frames.</li> <li>|T1| + |T2| + |B1| + |B2| ≤ 2<em>c</em>.</li> <li>A page id appears in at most one list, alive or ghost, and a frame id in at most one alive list.</li> <li><code>Size()</code> equals the number of alive entries with <code>evictable = true</code>.</li> <li>Every list's forward and backward links agree, and its stored length matches a walk.</li> </ol>

<p>(The paper also maintains |T1| + |B1| ≤ <em>c</em>. BusTub's version only restores that lazily, through case 4(a), so don't assert it.)</p>
"""

[[sections]]
heading = "Data structure"
body = """
<p>Every operation needs O(1) <strong>move-to-front</strong> and <strong>remove-from-middle</strong> on four lists, plus lookup by <strong>frame id</strong> (alive entries) and by <strong>page id</strong> (ghosts). BusTub's performance test fills 262,144 frames and then calls <code>RecordAccess</code> 2.6 million times on entries in the <em>middle</em> of MFU, with a 3-second limit. Any O(n) list removal fails it.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Option</th> <th>Remove from middle</th> <th>Rust ergonomics</th> <th>Verdict</th> </tr> </thead> <tbody> <tr> <td><code>VecDeque</code> + <code>position()</code></td> <td>O(n)</td> <td>trivial</td> <td>fails the perf test; good as the <em>model</em> in a differential test</td> </tr> <tr> <td><code>std::collections::LinkedList</code></td> <td>needs cursors (unstable)</td> <td>no handle to a node</td> <td>unusable</td> </tr> <tr> <td><code>Rc&lt;RefCell&lt;Node&gt;&gt;</code> doubly-linked list</td> <td>O(1)</td> <td>verbose, runtime borrow checks, <code>Weak</code> back-links, cycles to break</td> <td>works; slow and painful</td> </tr> <tr> <td><code>HashMap&lt;Id, (prev, next)&gt;</code> "linked hash map"</td> <td>O(1) amortised, with hashing on every link update</td> <td>simple</td> <td>fine; what most student solutions do</td> </tr> <tr> <td><strong>arena <code>Vec&lt;Node&gt;</code> + <code>u32</code> links</strong> (intrusive list)</td> <td>O(1), no hashing on the hot path</td> <td>a little index bookkeeping</td> <td>best: cache-friendly, <code>Copy</code> nodes, no <code>unsafe</code></td> </tr> </tbody> </table></div>

<p>The reference below uses <strong>two arenas behind one list abstraction</strong>. Alive nodes are indexed directly by frame id: BusTub's frames are small dense integers, so a frame never needs a hash lookup. Ghost nodes are allocated from a second arena with a free list, found by page id through a <code>HashMap</code>, and <strong>tagged with the high bit of their id</strong>, so the list code treats both kinds of node uniformly.</p>

:::deeper Reference ArcReplacer
```rust title="src/buffer/arc_replacer.rs"
//! ARC replacer with BusTub's Fall 2025 semantics.
//!
//! Four intrusive lists over two arenas. Alive nodes are indexed directly by
//! frame id (no hash lookup on the hot path); ghost nodes live in a second
//! arena, tagged with the high bit, and are found by page id through
//! `ghost_of`. Links are u32 ids; head = most recent, tail = eviction end.
use std::collections::HashMap;

use crate::common::config::{FrameId, PageId};
use crate::buffer::replacer::Replacer;

const NIL: u32 = u32::MAX;
const GHOST: u32 = 1 << 31;          // id tag: set = index into `ghosts`

#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Which { Mru = 0, Mfu = 1, MruGhost = 2, MfuGhost = 3 }

#[derive(Clone, Copy, Debug)]
struct Node { prev: u32, next: u32, page: PageId, list: Option<Which>, evictable: bool }

#[derive(Clone, Copy, Debug)]
struct List { head: u32, tail: u32, len: usize }

impl List { const EMPTY: List = List { head: NIL, tail: NIL, len: 0 }; }

#[derive(Debug)]
pub struct ArcReplacer {
    cap: usize,
    target: usize,                 // p: MRU target size, 0..=cap
    evictable: usize,              // Size()
    alive: Vec<Node>,              // indexed by frame id; grows on demand
    ghosts: Vec<Node>,             // ghost slots; at most 2·cap ever live
    lists: [List; 4],
    ghost_of: HashMap<PageId, u32>,
    free_ghost: Vec<u32>,
}

impl ArcReplacer {
    pub fn new(capacity: usize) -> Self {
        let blank = Node { prev: NIL, next: NIL, page: PageId::INVALID, list: None, evictable: false };
        ArcReplacer {
            cap: capacity,
            target: 0,
            evictable: 0,
            alive: vec![blank; capacity],
            ghosts: Vec::with_capacity(2 * capacity),
            lists: [List::EMPTY; 4],
            ghost_of: HashMap::with_capacity(2 * capacity),
            free_ghost: Vec::new(),
        }
    }

    #[inline]
    fn n(&mut self, id: u32) -> &mut Node {
        if id & GHOST != 0 { &mut self.ghosts[(id & !GHOST) as usize] } else { &mut self.alive[id as usize] }
    }
    #[inline]
    fn r(&self, id: u32) -> &Node {
        if id & GHOST != 0 { &self.ghosts[(id & !GHOST) as usize] } else { &self.alive[id as usize] }
    }

    fn new_ghost(&mut self, page: PageId) -> u32 {
        let node = Node { prev: NIL, next: NIL, page, list: None, evictable: false };
        match self.free_ghost.pop() {
            Some(g) => { *self.n(g) = node; g }
            None => { self.ghosts.push(node); (self.ghosts.len() as u32 - 1) | GHOST }
        }
    }

    // ---- intrusive list primitives --------------------------------------
    fn push_front(&mut self, w: Which, id: u32) {
        let head = self.lists[w as usize].head;
        { let n = self.n(id); n.prev = NIL; n.next = head; n.list = Some(w); }
        if head != NIL { self.n(head).prev = id; } else { self.lists[w as usize].tail = id; }
        let l = &mut self.lists[w as usize];
        l.head = id;
        l.len += 1;
    }

    fn unlink(&mut self, id: u32) {
        let Node { prev, next, list, .. } = *self.r(id);
        let w = list.expect("unlink of a node that is in no list") as usize;
        if prev != NIL { self.n(prev).next = next; } else { self.lists[w].head = next; }
        if next != NIL { self.n(next).prev = prev; } else { self.lists[w].tail = prev; }
        self.lists[w].len -= 1;
        let n = self.n(id);
        n.prev = NIL;
        n.next = NIL;
        n.list = None;
    }

    fn len(&self, w: Which) -> usize { self.lists[w as usize].len }

    fn drop_ghost_tail(&mut self, w: Which) {
        let t = self.lists[w as usize].tail;
        if t == NIL { return; }
        self.unlink(t);
        let page = self.r(t).page;
        self.ghost_of.remove(&page);
        self.free_ghost.push(t);
    }

    /// LRU-most evictable node of an alive list, scanning past pinned frames.
    fn victim_in(&self, w: Which) -> Option<u32> {
        let mut id = self.lists[w as usize].tail;
        while id != NIL {
            if self.r(id).evictable { return Some(id); }
            id = self.r(id).prev;
        }
        None
    }

    /// Frame ids index `alive` directly. BusTub's tests use 1-based ids, so grow on demand.
    fn frame_idx(&mut self, f: FrameId) -> u32 {
        assert!(f.0 & GHOST == 0, "frame id {f:?} too large");
        let i = f.0 as usize;
        if i >= self.alive.len() {
            self.alive.resize(i + 1, Node { prev: NIL, next: NIL, page: PageId::INVALID, list: None, evictable: false });
        }
        f.0
    }

    pub fn target(&self) -> usize { self.target }

    /// O(n) structural check, for tests.
    pub fn check_invariants(&self) {
        let (t1, t2, b1, b2) = (self.len(Which::Mru), self.len(Which::Mfu), self.len(Which::MruGhost), self.len(Which::MfuGhost));
        assert!(self.target <= self.cap);
        assert!(t1 + t2 <= self.cap, "alive entries exceed capacity");
        assert!(t1 + t2 + b1 + b2 <= 2 * self.cap, "total exceeds 2c");
        assert_eq!(self.ghost_of.len(), b1 + b2);
        let ev = self.alive.iter().filter(|n| n.list.is_some() && n.evictable).count();
        assert_eq!(ev, self.evictable);
        for w in [Which::Mru, Which::Mfu, Which::MruGhost, Which::MfuGhost] {
            let (mut id, mut n, mut prev) = (self.lists[w as usize].head, 0, NIL);
            while id != NIL {
                assert_eq!(self.r(id).list, Some(w));
                assert_eq!(self.r(id).prev, prev);
                prev = id; id = self.r(id).next; n += 1;
            }
            assert_eq!(n, self.lists[w as usize].len);
            assert_eq!(prev, self.lists[w as usize].tail);
        }
    }
}

impl Replacer for ArcReplacer {
    fn size(&self) -> usize { self.evictable }

    fn record_access(&mut self, frame: FrameId, page: PageId) {
        let fi = self.frame_idx(frame);
        // Case 1: the frame is alive (MRU or MFU): move to the front of MFU.
        if self.r(fi).list.is_some() {
            debug_assert_eq!(self.r(fi).page, page, "frame {frame:?} re-accessed with a different page");
            self.unlink(fi);
            self.push_front(Which::Mfu, fi);
            return;
        }
        // Cases 2 and 3: ghost hit. Adapt p, drop the ghost, page returns to MFU.
        if let Some(&g) = self.ghost_of.get(&page) {
            let (b1, b2) = (self.len(Which::MruGhost), self.len(Which::MfuGhost));
            match self.r(g).list {
                Some(Which::MruGhost) => {
                    let delta = if b1 >= b2 { 1 } else { b2 / b1 };
                    self.target = (self.target + delta).min(self.cap);
                }
                Some(Which::MfuGhost) => {
                    let delta = if b2 >= b1 { 1 } else { b1 / b2 };
                    self.target = self.target.saturating_sub(delta);
                }
                other => unreachable!("ghost map points at {other:?}"),
            }
            self.unlink(g);
            self.ghost_of.remove(&page);
            self.free_ghost.push(g);
            *self.n(fi) = Node { prev: NIL, next: NIL, page, list: None, evictable: false };
            self.push_front(Which::Mfu, fi);
            return;
        }
        // Case 4: brand new page. Trim a ghost list if the directory is full.
        let (t1, b1) = (self.len(Which::Mru), self.len(Which::MruGhost));
        let total = t1 + b1 + self.len(Which::Mfu) + self.len(Which::MfuGhost);
        if t1 + b1 == self.cap {
            self.drop_ghost_tail(Which::MruGhost);            // 4(a)
        } else if total == 2 * self.cap {
            self.drop_ghost_tail(Which::MfuGhost);            // 4(b)
        }                                                      // 4(c): nothing to trim
        *self.n(fi) = Node { prev: NIL, next: NIL, page, list: None, evictable: false };
        self.push_front(Which::Mru, fi);
    }

    fn set_evictable(&mut self, frame: FrameId, evictable: bool) {
        let fi = self.frame_idx(frame);
        let n = self.n(fi);
        if n.list.is_none() || n.evictable == evictable { return; }
        n.evictable = evictable;
        if evictable { self.evictable += 1 } else { self.evictable -= 1 }
    }

    fn evict(&mut self) -> Option<FrameId> {
        let order = if self.len(Which::Mru) < self.target { [Which::Mfu, Which::Mru] } else { [Which::Mru, Which::Mfu] };
        let (w, f) = order.into_iter().find_map(|w| self.victim_in(w).map(|f| (w, f)))?;
        let page = self.r(f).page;
        self.unlink(f);
        self.n(f).evictable = false;
        self.evictable -= 1;
        // The evicted page's history survives as a ghost at the front of the matching ghost list.
        let g = self.new_ghost(page);
        self.push_front(if w == Which::Mru { Which::MruGhost } else { Which::MfuGhost }, g);
        self.ghost_of.insert(page, g);
        Some(FrameId(f))
    }

    fn remove(&mut self, frame: FrameId) {
        let fi = self.frame_idx(frame);
        let n = *self.r(fi);
        if n.list.is_none() { return; }
        assert!(n.evictable, "remove() on a pinned frame {frame:?}");
        self.unlink(fi);
        self.n(fi).evictable = false;
        self.evictable -= 1;                       // removed pages leave no ghost: they were deleted
    }
}
```
:::

<aside data-call="rust"><b>Borrowing two nodes at once</b><p>In <code>push_front</code>, you need to write the new node <em>and</em> the old head, and both live in the same <code>Vec</code>. <code>let a = &amp;mut v[i]; let b = &amp;mut v[j];</code> doesn't compile, because two <code>&amp;mut</code> borrows of <code>v</code> overlap. The reference sidesteps this by <strong>copying the few fields it needs first</strong> (<code>let head = self.lists[w].head;</code>), then doing one short-lived <code>self.n(id)</code> borrow at a time. <code>Node</code> is <code>Copy</code>, so <code>let Node { prev, next, list, .. } = *self.r(id);</code> reads everything in one move. When you genuinely need two <code>&amp;mut</code> into one slice at once, use <a href="https://doc.rust-lang.org/std/primitive.slice.html#method.get_disjoint_mut" target="_blank" rel="noreferrer"><code>slice::get_disjoint_mut</code></a> (stable since 1.86), <code>split_at_mut</code>, or restructure the code so you don't need both.</p></aside>

<aside data-call="rust"><b>Tagging ids with a high bit</b><p><code>GHOST = 1 &lt;&lt; 31</code> gives one <code>u32</code> id namespace for two arenas. <code>id &amp; GHOST != 0</code> picks the arena, and <code>id &amp; !GHOST</code> gives the index. It's the same trick as NaN-boxing and pointer tagging, but without <code>unsafe</code>: the ids are plain integers. Put the tag logic in exactly two functions (<code>n</code>, <code>r</code>), assert that frame ids never collide with the tag, and nothing else in the file needs to know. The alternative is a <code>enum NodeId { Alive(u32), Ghost(u32) }</code>: clearer, 8 bytes instead of 4, and a <code>match</code> on every link hop. Both are fine, so measure if you care.</p></aside>
"""

