[[sections]]
heading = "Overview"
body = """
<p>The buffer pool asks the replacer one question: <em>which frame should I give up?</em> L04 showed that LRU answers it badly under scans, and that LRU-K needs a tuning parameter plus history for pages that are no longer cached. <strong>ARC</strong>, the Adaptive Replacement Cache (Megiddo &amp; Modha, IBM, FAST 2003), keeps two lists, one for recency and one for frequency, and <em>learns</em> how to split the cache between them from its own mistakes. It does this with <strong>ghost lists</strong>: the page ids of recently evicted pages, with no data. A hit on a ghost means "I shouldn't have evicted that", and the ghost list it's found in says which side to grow.</p>

<figure class="cb-g-fig"><svg viewBox="0 0 820 170" role="img" aria-label="ARC lists"> <g font-size="12"> <rect x="10" y="40" width="190" height="44" rx="4" class="cb-g-box"></rect><text x="20" y="66">B1 · MRU ghost (ids only)</text> <rect x="210" y="40" width="190" height="44" rx="4" class="cb-g-boxa"></rect><text x="220" y="66">T1 · MRU (seen once)</text> <rect x="420" y="40" width="190" height="44" rx="4" class="cb-g-boxa"></rect><text x="430" y="66">T2 · MFU (seen ≥ twice)</text> <rect x="620" y="40" width="190" height="44" rx="4" class="cb-g-box"></rect><text x="630" y="66">B2 · MFU ghost (ids only)</text> <line x1="410" y1="26" x2="410" y2="100" class="cb-g-lna" stroke-dasharray="4 3"></line><text x="398" y="20" class="cb-g-acc">!</text> <text x="210" y="112" class="cb-g-mut">← older      fresher →</text><text x="420" y="112" class="cb-g-mut">← fresher      older →</text> <text x="10" y="136">cache = T1 ∪ T2 (≤ c frames) · directory = T1 ∪ T2 ∪ B1 ∪ B2 (≤ 2c entries) · p = target size of T1, 0 ≤ p ≤ c</text> <text x="10" y="158" class="cb-g-mut">hit in B1 ⇒ recency was undervalued ⇒ p↑ · hit in B2 ⇒ frequency was undervalued ⇒ p↓</text> </g></svg><figcaption class="cb-g-figcap">BusTub's test comments draw exactly this picture: <code>[&lt;-mru_ghost-][&lt;-mru-]![-mfu-&gt;][-&gt;mfu_ghost-&gt;] p=x</code>, with the freshest entries next to the <code>!</code>.</figcaption></figure>
"""

[[sections]]
heading = "Spec"
body = """
<p>BusTub's ARC differs from the paper in one important way. In the paper, <code>REPLACE</code> runs <em>inside</em> the access, because the cache owns its own contents. In a buffer pool, the <strong>BPM</strong> decides when a frame is needed and calls <code>Evict()</code>, and frames can be <strong>pinned</strong>. So BusTub splits the algorithm: <code>Evict()</code> picks a victim and moves it to a ghost list, and <code>RecordAccess()</code> classifies the access and trims ghost lists.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Call</th> <th>Rule (verbatim semantics from the P1 writeup)</th> </tr> </thead> <tbody> <tr> <td><code>RecordAccess(f, p)</code>, <strong>case 1</strong>: frame alive in MRU or MFU</td> <td>move it to the front of MFU</td> </tr> <tr> <td><strong>case 2</strong>: page <code>p</code> in MRU ghost</td> <td>if |B1| ≥ |B2|: p += 1, else p += ⌊|B2| / |B1|⌋; cap at c. Remove the ghost, insert (f, p) at the front of MFU</td> </tr> <tr> <td><strong>case 3</strong>: page <code>p</code> in MFU ghost</td> <td>if |B2| ≥ |B1|: p −= 1, else p −= ⌊|B1| / |B2|⌋; floor at 0. Remove the ghost, insert at the front of MFU</td> </tr> <tr> <td><strong>case 4</strong>: page never seen</td> <td><strong>(a)</strong> if |T1| + |B1| = c: drop B1's last element; <strong>(b)</strong> else if |T1|+|T2|+|B1|+|B2| = 2c: drop B2's last element; <strong>(c)</strong> else nothing. Then insert at the front of MRU</td> </tr> <tr> <td><code>Evict()</code></td> <td>if |T1| &lt; p: try MFU first, else MRU first. In the chosen list, take the <em>last</em> (oldest) <strong>evictable</strong> entry; if none, try the other list. Move the victim's page id to the front of the matching ghost list. Return its frame, or <code>None</code></td> </tr> <tr> <td><code>SetEvictable(f, b)</code></td> <td>toggle; <code>Size()</code> counts alive evictable frames only</td> </tr> <tr> <td><code>Remove(f)</code></td> <td>drop a frame entirely, with <strong>no ghost</strong> (the page was deleted); only for evictable frames</td> </tr> <tr> <td><code>Size()</code></td> <td>number of alive, evictable frames</td> </tr> </tbody> </table></div>

<p>Five sizes are easy to confuse, and the writeup lists them explicitly. <strong>Capacity</strong> <em>c</em> (the number of frames). <strong>Total list size</strong> (up to 2c, because of ghosts). <strong>Current evictable size</strong> (<code>Size()</code>). <strong>MRU target size</strong> <em>p</em>. <strong>MRU actual size</strong> |T1|, which counts pinned entries too. The eviction test compares |T1| (actual, pinned included) with <em>p</em>.</p>

<aside data-call="why"><b>Why ghost hits are the right signal</b><p>A B1 hit means a page seen <em>once</em> came back soon after being evicted from T1. A bigger T1 would have kept it, so grow <em>p</em>. A B2 hit means a <em>frequent</em> page was evicted from T2 and came back, so a bigger T2 would have kept it, and <em>p</em> shrinks. The step size ⌊|B2|/|B1|⌋ makes the adjustment larger when the <em>other</em> ghost list is bigger. The rarer kind of mistake carries more information per occurrence. In a pure scan, every page enters T1 once and is never re-referenced, so no ghost hits happen, <em>p</em> stays put, and T2 (the hot set) is never disturbed. That's scan resistance with no tuning knob.</p></aside>
"""

