<aside data-call="testing"><b>What the differential test caught while this guide was written</b><p>The first version of the reference indexed alive nodes as <code>frame_id &lt; capacity</code>. BusTub's sample tests use <strong>1-based</strong> frame ids (capacity 7, frames 1–7), so frame 7 was out of range. The real BPM uses 0-based frames, so the assumption held in production and broke the spec tests. The fix was to let the alive arena grow on demand. The lesson: <em>port the upstream tests verbatim before you "clean them up"</em>, because they encode assumptions you won't think to test.</p></aside>
"""

