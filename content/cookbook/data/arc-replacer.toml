body = """
```text title="cargo test --release --test arc -- --nocapture (Apple M-series; BusTub's limit is 3 s)"
10 rounds of 262144 record_access: 20.24ms        ← ~8 ns per call, 150× under the limit
```

<p>On hit rate, see the table in <a href="/cookbook/p/buffer-pools">L04</a>. The same reference replacers were run on a Zipf workload with and without cold scans. ARC and LRU-2 keep their hit rate under scans, while LRU and CLOCK lose about 30%. ARC edges LRU-2 once scans are frequent because ghost hits move <em>p</em>, and it needs no <em>K</em> parameter.</p>

<aside data-call="performance"><b>Beyond the tests: the P1 leaderboard</b><p>The leaderboard runs 8 scan threads plus 8 Zipfian point-lookup threads, then repeats with injected disk latency. Replacer ideas that help there:</p> <ul> <li><strong>Use the <code>AccessType</code> hint.</strong> BusTub passes <code>AccessType::Scan</code> for sequential scans. A scan access should <em>not</em> promote a page from T1 to T2, since a scan revisiting a page isn't evidence of frequency. Option: record scan pages at the <em>tail</em> of T1, so they're the next victims. DB2 and SQL Server both do versions of this.</li> <li><strong>Keep the replacer out of the hit path.</strong> Most accesses are hits on pages already in T2. With CLOCK-style reference bits, a hit is an atomic store, and the list surgery can be batched, applied when the latch is next taken. That's how Caffeine's buffered reads work.</li> <li><strong>Shard.</strong> 16 replacers, each covering <code>frame % 16</code> with its own latch, cut contention by about 16×. The price is that each shard adapts its own <em>p</em>.</li> </ul></aside>

<aside data-call="production"><b>ARC in the wild</b><ul> <li><strong>PostgreSQL 8.0</strong> (2005) shipped ARC. It was ripped out in 8.0.2, replaced with 2Q in the same release series and then with clock-sweep in 8.1, because of <strong>IBM's ARC patent</strong> (US 6,996,676). That patent has since expired. Clock-sweep stayed, because it's cheaper on hits under concurrency.</li> <li><strong>ZFS</strong> uses ARC (with a pinning-aware variant) as its main memory cache, and "L2ARC" for SSD caching.</li> <li><strong>IBM DS6000/DS8000</strong> storage controllers were ARC's original deployment.</li> <li><strong>CAR</strong> (Clock with Adaptive Replacement, Bansal &amp; Modha, FAST 2004) keeps ARC's adaptivity with CLOCK's cheap hits. It's worth reading once this version works.</li> </ul></aside>
"""

