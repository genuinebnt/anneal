heading = "Tests"
body = """
<p><strong>The two BusTub sample tests, ported.</strong> These are the spec, so they're shown in the open. <code>check_invariants()</code> runs after every call.</p>

```rust title="tests/arc_replacer.rs (BusTub's arc_replacer_test.cpp, line for line)"
//! BusTub's test/buffer/arc_replacer_test.cpp, ported line for line.
use relational::buffer::{arc_replacer::ArcReplacer, replacer::Replacer};
use relational::common::config::{FrameId, PageId};

fn acc(r: &mut ArcReplacer, f: u32, p: u32) { r.record_access(FrameId(f), PageId(p)); r.check_invariants(); }
fn ev(r: &mut ArcReplacer, f: u32, e: bool) { r.set_evictable(FrameId(f), e); r.check_invariants(); }
fn evict(r: &mut ArcReplacer) -> Option<u32> { let v = r.evict().map(|f| f.0); r.check_invariants(); v }

#[test]
fn sample_test() {
    let mut r = ArcReplacer::new(7);
    for i in 1..=6 { acc(&mut r, i, i); }
    for i in 1..=5 { ev(&mut r, i, true); }
    ev(&mut r, 6, false);
    assert_eq!(r.size(), 5);
    acc(&mut r, 1, 1);
    assert_eq!(evict(&mut r), Some(2));
    assert_eq!(evict(&mut r), Some(3));
    assert_eq!(evict(&mut r), Some(4));
    assert_eq!(r.size(), 2);
    acc(&mut r, 2, 7); ev(&mut r, 2, true);
    acc(&mut r, 3, 2); ev(&mut r, 3, true);
    assert_eq!(r.target(), 1);
    assert_eq!(r.size(), 4);
    acc(&mut r, 4, 3); ev(&mut r, 4, true);
    acc(&mut r, 7, 4); ev(&mut r, 7, true);
    assert_eq!(r.target(), 3);
    assert_eq!(r.size(), 6);
    assert_eq!(evict(&mut r), Some(5));
    assert_eq!(evict(&mut r), Some(1));
    acc(&mut r, 5, 1); ev(&mut r, 5, true);
    assert_eq!(r.target(), 2);
    assert_eq!(r.size(), 5);
    assert_eq!(evict(&mut r), Some(2));
}

#[test]
fn sample_test_2() {
    let mut r = ArcReplacer::new(3);
    for i in 1..=3 { acc(&mut r, i, i); ev(&mut r, i, true); }
    assert_eq!(r.size(), 3);
    assert_eq!(evict(&mut r), Some(1));
    assert_eq!(evict(&mut r), Some(2));
    assert_eq!(evict(&mut r), Some(3));
    assert_eq!(r.size(), 0);
    acc(&mut r, 3, 4); ev(&mut r, 3, true);
    acc(&mut r, 2, 1); ev(&mut r, 2, true);
    assert_eq!(r.size(), 2);
    acc(&mut r, 1, 3); ev(&mut r, 1, true);
    assert_eq!(r.target(), 1);
    assert_eq!(evict(&mut r), Some(3));
    assert_eq!(evict(&mut r), Some(2));
    assert_eq!(evict(&mut r), Some(1));
    acc(&mut r, 1, 1); ev(&mut r, 1, true);
    acc(&mut r, 2, 4); ev(&mut r, 2, true);
    assert_eq!(r.target(), 3);
    acc(&mut r, 3, 5); ev(&mut r, 3, true);
    assert_eq!(evict(&mut r), Some(1));
    acc(&mut r, 1, 6); ev(&mut r, 1, true);
    assert_eq!(evict(&mut r), Some(2));
    acc(&mut r, 2, 7); ev(&mut r, 2, true);
    assert_eq!(evict(&mut r), Some(3));
    acc(&mut r, 3, 5); ev(&mut r, 3, true);
    assert_eq!(evict(&mut r), Some(3));
    acc(&mut r, 3, 2); ev(&mut r, 3, true);
    // Now [][(6,f1),(7,f2),(2,f3)]![][(5,_),(4,_),(1,_)] p=3
}

#[test]
fn record_access_performance() {
    let n = 256 << 10;
    let mut r = ArcReplacer::new(n);
    for i in 0..n as u32 { r.record_access(FrameId(i), PageId(i)); r.set_evictable(FrameId(i), true); }
    let t = std::time::Instant::now();
    let mut f = (n / 2) as u32;
    for _ in 0..10 { for _ in 0..n { r.record_access(FrameId(f), PageId(f)); f = (f + 1) % n as u32; } }
    eprintln!("10 rounds of {n} record_access: {:?}", t.elapsed());
    assert!(t.elapsed().as_secs_f64() < 3.0);
}
```

<p><strong>A differential test against the spec itself.</strong> The naive model is a direct transcription of the table above using <code>VecDeque</code>s and linear searches. It's too slow to ship and too simple to get wrong. A simulated buffer pool drives both implementations with random page requests, pins, unpins and deletes, so every sequence of calls is one a real BPM could make.</p>

:::deeper Naive model + BPM-driven differential proptest (2,000 histories per run)
```rust title="tests/arc_model.rs"
//! Differential test: the arena ARC vs a naive VecDeque transcription of the spec,
//! driven by a simulated buffer pool so every call sequence is one a BPM could make.
use proptest::prelude::*;
use std::collections::{HashMap, VecDeque};
use relational::buffer::{arc_replacer::ArcReplacer, replacer::Replacer};
use relational::common::config::{FrameId, PageId};

#[derive(Default)]
struct Naive { cap: usize, p: usize, mru: VecDeque<(u32, u32, bool)>, mfu: VecDeque<(u32, u32, bool)>, bg1: VecDeque<u32>, bg2: VecDeque<u32> }
impl Naive {
    fn find(l: &VecDeque<(u32, u32, bool)>, f: u32) -> Option<usize> { l.iter().position(|e| e.0 == f) }
    fn access(&mut self, f: u32, pg: u32) {
        if let Some(i) = Self::find(&self.mru, f) { let e = self.mru.remove(i).unwrap(); self.mfu.push_front(e); return; }
        if let Some(i) = Self::find(&self.mfu, f) { let e = self.mfu.remove(i).unwrap(); self.mfu.push_front(e); return; }
        let (b1, b2) = (self.bg1.len(), self.bg2.len());
        if let Some(i) = self.bg1.iter().position(|&x| x == pg) {
            self.p = (self.p + if b1 >= b2 { 1 } else { b2 / b1 }).min(self.cap);
            self.bg1.remove(i); self.mfu.push_front((f, pg, false)); return;
        }
        if let Some(i) = self.bg2.iter().position(|&x| x == pg) {
            self.p = self.p.saturating_sub(if b2 >= b1 { 1 } else { b1 / b2 });
            self.bg2.remove(i); self.mfu.push_front((f, pg, false)); return;
        }
        let total = self.mru.len() + self.mfu.len() + b1 + b2;
        if self.mru.len() + b1 == self.cap { self.bg1.pop_back(); } else if total == 2 * self.cap { self.bg2.pop_back(); }
        self.mru.push_front((f, pg, false));
    }
    fn set_ev(&mut self, f: u32, e: bool) {
        for l in [&mut self.mru, &mut self.mfu] { if let Some(x) = l.iter_mut().find(|x| x.0 == f) { x.2 = e; } }
    }
    fn size(&self) -> usize { self.mru.iter().chain(&self.mfu).filter(|e| e.2).count() }
    fn evict(&mut self) -> Option<u32> {
        let mru_first = self.mru.len() >= self.p;
        for pass in 0..2 {
            let use_mru = mru_first == (pass == 0);
            let (l, g) = if use_mru { (&mut self.mru, &mut self.bg1) } else { (&mut self.mfu, &mut self.bg2) };
            if let Some(i) = l.iter().rposition(|e| e.2) { let e = l.remove(i).unwrap(); g.push_front(e.1); return Some(e.0); }
        }
        None
    }
    fn remove(&mut self, f: u32) {
        for l in [&mut self.mru, &mut self.mfu] { if let Some(i) = l.iter().position(|x| x.0 == f) { l.remove(i); } }
    }
}

#[derive(Debug, Clone)]
enum Op { Get(u32), Unpin(u32), Pin(u32), Delete(u32) }

proptest! {
    #![proptest_config(ProptestConfig { cases: 2000, ..ProptestConfig::default() })]
    #[test]
    fn arc_matches_naive(cap in 1usize..6, ops in prop::collection::vec(prop_oneof![
        6 => (0u32..16).prop_map(Op::Get), 3 => (0u32..16).prop_map(Op::Unpin),
        1 => (0u32..16).prop_map(Op::Pin), 1 => (0u32..16).prop_map(Op::Delete)], 0..300)) {
        let (mut fast, mut slow) = (ArcReplacer::new(cap), Naive { cap, ..Default::default() });
        let mut table: HashMap<u32, u32> = HashMap::new();         // page -> frame
        let mut owner: Vec<Option<u32>> = vec![None; cap];
        let mut free: Vec<u32> = (0..cap as u32).rev().collect();
        for op in ops {
            match op {
                Op::Get(pg) => {
                    let f = if let Some(&f) = table.get(&pg) { f } else {
                        let f = match free.pop() { Some(f) => f, None => {
                            let (a, b) = (fast.evict().map(|f| f.0), slow.evict());
                            prop_assert_eq!(a, b);
                            let Some(f) = a else { continue };             // everything pinned: BPM returns error
                            if let Some(old) = owner[f as usize].take() { table.remove(&old); }
                            f
                        }};
                        table.insert(pg, f); owner[f as usize] = Some(pg); f
                    };
                    fast.record_access(FrameId(f), PageId(pg)); slow.access(f, pg);
                }
                Op::Unpin(pg) | Op::Pin(pg) => if let Some(&f) = table.get(&pg) {
                    let e = matches!(op, Op::Unpin(_));
                    fast.set_evictable(FrameId(f), e); slow.set_ev(f, e);
                },
                Op::Delete(pg) => if let Some(&f) = table.get(&pg) {
                    fast.set_evictable(FrameId(f), true); slow.set_ev(f, true);
                    fast.remove(FrameId(f)); slow.remove(f);
                    table.remove(&pg); owner[f as usize] = None; free.push(f);
                },
            }
            fast.check_invariants();
            prop_assert_eq!(fast.size(), slow.size());
            prop_assert_eq!(fast.target(), slow.p);
        }
    }
}
```
