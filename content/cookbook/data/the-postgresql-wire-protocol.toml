"""

[[sections]]
heading = "Measured"
body = """
<p>Tests drive the server three ways: a codec test that feeds random messages in and out, a hand-written client that speaks the protocol over a real socket, and the real <code>psql</code> 14 binary as a subprocess (password supplied through <code>PGPASSWORD</code>). Measurements are in release mode on the machine that built this guide.</p>

```text title="the codec, a round trip over a socket, streaming a result, and eight connections at once"
codec: 200000 DataRow messages (8.2 MB): encode 243 MB/s (168 ns per row), decode 505 MB/s (81 ns per row)
server: simple query round trip 34 us; streaming 100000 rows of a table scan in 68 ms (1471 thousand rows/s)
point lookup in a 100 000-row table (scan): extended protocol 10.1 ms, simple query 10.5 ms per statement
8 connections x 500 trivial queries: 81 thousand queries/s in total (statements are serialized by the engine thread)
```

<ul> <li><strong>The codec is not the bottleneck.</strong> A <code>DataRow</code> of four columns costs 168 ns to encode and 81 ns to decode; a table scan streams at 1.47 million rows per second including the engine, the codec and the socket.</li> <li><strong>A round trip costs 34 µs</strong> for <code>SELECT 1</code> on a loopback socket, which is mostly two system calls and two thread wake-ups.</li> <li><strong>The extended protocol bought nothing here, and the reason is the engine, not the protocol.</strong> A point lookup in 100 000 rows takes 10.1 ms prepared and 10.5 ms as text, because the engine scans the table in both cases. Preparing saves parsing, a few microseconds, and only an index or a cached plan would change the picture. A prepared statement is not faster by itself.</li> <li><strong>Eight connections reach 81 thousand trivial queries per second in total</strong>, against 1 / 34 µs ≈ 29 thousand for one connection. The engine thread is shared, so the gain is overlap of the socket work of different clients with the engine work, not parallel execution.</li> </ul>

<aside data-call="note"><b>What the real client found</b><p>The hand-written client in the tests and the server were written together, so they can share a misreading of the specification. <code>psql</code> cannot. Running it was a check on the <em>protocol</em>, not on the code: the startup handshake, the <code>ParameterStatus</code> messages it expects, the format of <code>RowDescription</code> and <code>CommandComplete</code>, and the way it reports a wrong password (<code>password authentication failed</code>) and an error (<code>ERROR:</code>) all had to come out right for the test to pass. One detail the test records: for a multi-statement <code>-c</code> string <code>psql</code> prints only the tag of the last statement, although the server sent one <code>CommandComplete</code> per statement. The first versions of the server also hung on shutdown: connection threads were blocked reading from clients that were still connected, and later a registry of open sockets kept them open after a connection ended. <code>stop()</code> now closes every registered socket, and each connection thread shuts its own socket down when it exits.</p></aside>

<aside data-call="note"><b>Two defects found by reading the code against the tests</b><p><code>Describe</code> of a prepared statement needs the result columns, and the first implementation obtained them by running the statement with NULL parameters. Describing <code>INSERT INTO t VALUES ($1, $2)</code> would insert a row. It now runs the statement only if it is a <code>SELECT</code>, and a test asserts that describing an <code>INSERT</code> leaves the table unchanged. Second, <code>Bind</code> accepted binary parameter format codes and read the bytes as text; it now refuses binary parameter and result formats with SQLSTATE <code>0A000</code>.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Decoding returns <code>Result&lt;Option&lt;(Message, usize)&gt;, ProtoError&gt;</code></strong>: <code>Ok(None)</code> means "wait for more bytes", <code>Ok(Some((m, used)))</code> consumes <code>used</code> bytes from the front of the buffer, <code>Err</code> is a violation. The caller owns the buffer and drains it; the decoder is a pure function, which makes the prefix test (every proper prefix of a message returns <code>Ok(None)</code>) one loop.</li> <li><strong>A small <code>Reader</code> over <code>&amp;[u8]</code></strong> with <code>u8</code>, <code>i16</code>, <code>i32</code>, <code>u32</code>, <code>take</code>, <code>cstr</code> and <code>done</code> (no trailing bytes) keeps every body parser three lines long, and every short read returns <code>Err</code> instead of panicking on an index.</li> <li><strong>Enums for both directions</strong> (<code>Frontend</code>, <code>Backend</code>) make every message a value that can be compared, printed and generated at random in tests. The same types serve the server and the test client; the encoder and decoder of each direction exist on both sides so each can check the other.</li> <li><strong>Threads and channels instead of async</strong>: the engine thread owns the buffer pool and engine (neither is <code>Sync</code>); <code>std::sync::mpsc</code> carries <code>Request { sql, reply }</code> to it, and each connection thread waits on its own reply channel. The model is small enough to read in one page, and async would be a change of runtime, not of design.</li> <li><strong>A <code>Handler</code> trait for the back end</strong>: <code>credential(user)</code> says how a user may log in (<code>Trust</code>, <code>Cleartext</code>, or <code>Scram(verifier)</code>, <a href="/cookbook/p/passwords-and-scram">M21</a>) and <code>execute(user, sql)</code> runs a statement for a logged-in user. The handler is built on the engine thread (the engine is not <code>Send</code>), so the same server runs an unrestricted database, a password-protected one, or one with roles and row-level security (<a href="/cookbook/p/roles-privileges-and-row-level-security">M22</a>).</li> <li><strong><code>TcpStream::shutdown</code> and a registry of cloned sockets</strong> make <code>stop()</code> deterministic: closing the sockets wakes every blocked read with an error.</li> <li><strong><code>std::net::TcpListener::bind("127.0.0.1:0")</code></strong> asks the operating system for a free port; tests run in parallel without port clashes.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Codec round trip</strong>: 3 000 random frontend and 3 000 random backend messages (empty strings, non-ASCII, quotes, NULL values, binary bodies) encode and decode to themselves; every proper prefix of every message returns "need more"; two messages back to back are read one at a time; the startup message and <code>SSLRequest</code> are decoded in startup mode.</li> <li><strong>Malformed input</strong>: 30 000 random byte strings, biased towards <code>Q</code>, decode without panicking in every mode; a claimed length of <code>i32::MAX</code> is refused as too large before allocation; a length below 4, a string without its zero byte, a <code>Sync</code> with a body and bytes after the query string are each rejected with the right error; an unknown tag is reported.</li> <li><strong>Parameters</strong>: <code>$1</code>, <code>$2</code> become literals; quotes are doubled so <code>1'; DROP TABLE t; --</code> stays a string; <code>$1</code> inside a string literal is left alone; <code>$10</code> is not read as <code>$1</code> followed by <code>0</code>; a missing parameter is NULL; numbers are not quoted and <code>1e</code> is.</li> <li><strong>End to end over a socket</strong>: <code>SSLRequest</code> is answered <code>N</code>; DDL, DML and queries return the right messages and tags (<code>CREATE TABLE</code>, <code>INSERT 0 3</code>, <code>SELECT 3</code>); NULL arrives as length −1; an error is followed by <code>ReadyForQuery</code> and the session continues; an empty query returns <code>EmptyQueryResponse</code>; prepare once and bind twice; a parameter containing a quote and a <code>DROP TABLE</code> is stored as data; a failed <code>Bind</code> skips the rest of the batch until <code>Sync</code>, and the extended protocol works again afterwards; <code>Describe</code> does not run an <code>INSERT</code>; binary formats are refused; <code>Terminate</code> closes the connection; garbage from one client does not disturb another.</li> <li><strong>Authentication and concurrency</strong>: a wrong password is refused with <code>password authentication failed for user "u"</code>; eight clients, each inserting 25 rows into one table, see their own 25 rows and the total of 200.</li> <li><strong>The real <code>psql</code></strong>: wrong password; <code>SELECT 1 + 1</code>; <code>CREATE TABLE</code>; two inserts; <code>-At -F ,</code> output; aligned output with <code>(2 rows)</code>; an error exits non-zero with <code>ERROR:</code>; an aggregate query.</li> <li><strong>Mutants run against these tests</strong>: a length below the header size accepted; the size limit removed; a string without its zero byte accepted; trailing bytes after a query ignored; NULL sent as an empty string (encoder and row conversion); a one-digit parameter number; parameters replaced inside string literals; quotes not doubled; the failed state not cleared by <code>Sync</code>; any password accepted; <code>SSLRequest</code> answered <code>S</code>; a wrong <code>INSERT</code> count; no <code>ReadyForQuery</code> after an error; <code>Describe</code> running every statement; binary parameter formats accepted; binary result formats accepted. <strong>All 17 were killed</strong>; one of them (no <code>ReadyForQuery</code> after an error) by timeout, because the client waits forever for it.</li> <li><strong>Two mutants survived at first, and both were weak tests.</strong> A test of <code>$10</code> used the values 1 to 10, so <code>$1</code> followed by <code>0</code> also gave <code>10</code>; the values are now chosen so that the two readings differ. No test ran an extended-protocol statement after a failed batch, so a <code>Sync</code> that left the session in the failed state went unnoticed; one now does.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL's protocol is the lingua franca.</strong> Besides PostgreSQL itself: CockroachDB, YugabyteDB, Materialize, RisingWave, QuestDB, CedarDB, Neon's proxy, PgBouncer and Amazon Aurora PostgreSQL speak it. Compatibility is graded by the clients, not by the message layout: drivers issue catalog queries (<code>pg_type</code>, <code>pg_catalog.pg_class</code>, <code>SHOW</code>) at connect time, and a server that lacks them fails in the driver, not in the protocol.</li> <li><strong>Authentication in production is SCRAM-SHA-256 over TLS</strong>, not cleartext (see <a href="/cookbook/p/passwords-and-scram">M21</a>). TLS starts with the <code>SSLRequest</code> handshake used here; the server answers <code>S</code> and upgrades the socket.</li> <li><strong>Binary formats</strong> (format code 1) exchange values in their internal representation. Drivers use them for integers, timestamps and arrays when they can, and <code>COPY</code> uses its own sub-protocol for bulk loads. A server that supports the extended protocol but not binary formats works with most clients that default to text.</li> <li><strong>Portals and cursors</strong>: <code>Execute</code> takes a maximum row count and a portal can be resumed (<code>PortalSuspended</code>). This implementation returns all rows at once; a real server streams rows from the executor and keeps the portal open.</li> <li><strong>Cancellation</strong>: <code>BackendKeyData</code> carries a process id and a secret; a client cancels a running query by opening a second connection that sends a <code>CancelRequest</code> with those values. It is delivered out of band, so the engine must check a flag between batches.</li> <li><strong>Connection pooling</strong> (PgBouncer, pgcat, Odyssey) works at the protocol level, which is why session state such as prepared statements and <code>SET</code> is the thing poolers must track.</li> <li><strong>Thread per connection versus async</strong>: PostgreSQL uses a process per connection; most newer servers use an async runtime (Tokio) and a fixed pool of worker threads. At tens of thousands of connections the cost of threads shows; the codec in this section is the same either way.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Substituting parameters into SQL text is the weak point of this design.</strong> It is safe here because the substitution knows about string literals and quotes every non-numeric value, and a test tries an injection. A production engine binds parameter values into the plan, so no SQL text is ever built from client data. Do not copy this design where the engine can bind.</li> <li><strong>Trust no length.</strong> Check the claimed length against a limit before allocating, and reject lengths smaller than the header. Closing the connection on a protocol violation is correct; resynchronizing after one is not possible.</li> <li><strong>After an error in the extended protocol, skip to <code>Sync</code>.</strong> If the server keeps processing, a pipelined <code>Bind</code>/<code>Execute</code> after a failed <code>Parse</code> can run against the wrong statement.</li> <li><strong><code>Describe</code> must have no side effects.</strong> A way to find the result columns by running the statement is wrong for anything but a query.</li> <li><strong>Cleartext passwords are for tests.</strong> They cross the wire as sent. Use SCRAM over TLS.</li> <li><strong>A blocking read ends only when the peer sends or the socket closes.</strong> A shutdown path must close sockets, not wait for clients.</li> <li><strong>One engine thread serializes everything</strong>, including long queries; one slow <code>SELECT</code> stalls every client. Real servers run statements on a pool and use the transaction layer (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>) for isolation.</li> <li><strong>Tags are part of the contract</strong>: <code>INSERT 0 n</code> (the zero is a legacy object id field) and <code>SELECT n</code> are parsed by drivers to report row counts.</li> </ul></aside>
"""
