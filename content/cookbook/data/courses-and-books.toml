td><a href="https://15721.courses.cs.cmu.edu/spring2020/" target="_blank" rel="noreferrer">spring2020</a></td> <td>Part II, OLTP half</td> </tr> <tr> <td>15-721, Spring 2019 (OLTP indexes, tries, latch-free)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXja7K1hjZ01UTVDnGQdx5v5U" target="_blank" rel="noreferrer">YouTube (26)</a></td> <td><a href="https://15721.courses.cs.cmu.edu/spring2019/" target="_blank" rel="noreferrer">spring2019</a></td> <td>Part II, index lectures</td> </tr> <tr> <td>15-721, Spring 2023</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjYzlLMbX3cR0sxWnRM7CLFn" target="_blank" rel="noreferrer">YouTube (23)</a></td> <td><a href="https://15721.courses.cs.cmu.edu/spring2023/" target="_blank" rel="noreferrer">spring2023</a></td> <td>Part II, vectorization vs compilation, sort-merge</td> </tr> <tr> <td>15-799 Special Topics: <strong>Query Optimization</strong>, Spring 2025</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjYCZfIbmEWH7f6MnYqyPwCE" target="_blank" rel="noreferrer">YouTube (14)</a></td> <td><a href="https://15799.courses.cs.cmu.edu/spring2025/" target="_blank" rel="noreferrer">15799.courses.cs.cmu.edu/spring2025</a></td> <td>Part III</td> </tr> </tbody> </table></div>
