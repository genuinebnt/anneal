[[sections]]
heading = "CMU seminar series"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Series</th> <th>Playlist</th> <th>What it's for</th> </tr> </thead> <tbody> <tr> <td>ML⇄DB Seminar Series (Fall 2023)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjYVdJKka5g3xTKfPBITrxOu" target="_blank" rel="noreferrer">YouTube (12)</a></td> <td>Vector databases (Qdrant, Weaviate, Milvus, pgvector, Chroma), learned tuning (OtterTune, Akamas), Lance, feature stores</td> </tr> <tr> <td>Hardware Accelerated Database Lectures (Fall 2018)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbjOyrcqgE6_lCV6xvzffSN" target="_blank" rel="noreferrer">YouTube (6)</a></td> <td>GPU databases: Kinetica, MapD/HeavyDB, SQream, BlazingDB, Brytlyt, Swarm64</td> </tr> <tr> <td>Time Series Database Lectures (Fall 2017)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjY0GMWN4X8FIkYNfiu8_Wl9" target="_blank" rel="noreferrer">YouTube (6)</a></td> <td>InfluxDB, Streamlio/Heron, Two Sigma, kdb+, QuasarDB, TimescaleDB</td> </tr> <tr> <td>Database Building Blocks (Fall 2024)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjZc2AdXq_Lc1JS62R48UX2L" target="_blank" rel="noreferrer">YouTube (10)</a></td> <td>The Rust data stack: DataFusion, Comet, ParadeDB, InfluxDB 3 (FDAP), GlareDB, OpenDAL, GreptimeDB</td> </tr> <tr> <td>Database Query Optimizers</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjYPyrUG_YxqYPS7wjWY6gYN" target="_blank" rel="noreferrer">YouTube (10)</a></td> <td>SQL Server Cascades, MySQL, Catalyst, CockroachDB, Snowflake, PostgreSQL, Dremio, Stardog, Trino, Orca</td> </tr> <tr> <td>Future Data Systems (Fall 2025)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbEeW_bOCZ8c_nx_Jhoz-GW" target="_blank" rel="noreferrer">YouTube (12)</a></td> <td>Lakehouse: Iceberg, Hudi, DuckLake, Vortex, ADBC, Polaris, Fluss, XTDB</td> </tr> <tr> <td>SQL or Death? (Spring 2025)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbpOIrZheFWxkYG8HD87xW1" target="_blank" rel="noreferrer">YouTube (10)</a></td> <td>Query languages: pipe syntax, PRQL, Malloy, Gel, optimizers of Pinot/StarRocks/MariaDB</td> </tr> <tr> <td>PostgreSQL vs. The World (Spring 2026)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjZEVnVTtgDWw6P3wA_gDwj4" target="_blank" rel="noreferrer">YouTube (9)</a></td> <td>Aurora DSQL, turbopuffer, TopK, HorizonDB, Pixeltable (multimodal AI), SpacetimeDB</td> </tr> <tr> <td>Quarantine Tech Talks (2020)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjagqlf1NxuBQwaMkrHXi-iz" target="_blank" rel="noreferrer">YouTube (29)</a></td> <td>DuckDB, ClickHouse, Materialize, SQLancer, Elle/Jepsen, FoundationDB, ScyllaDB, Vitess</td> </tr> <tr> <td>Vaccination Tech Talks: <a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbeqnfuvp30VrI7VXiFuOXS" target="_blank" rel="noreferrer">First Dose</a> · <a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbDOFN4U4-Uv95-N8sgzs5D" target="_blank" rel="noreferrer">Second Dose</a> · <a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjZdLET4InoSZ3App6WSQHXE" target="_blank" rel="noreferrer">Booster</a></td> <td>19 + 14 + 13</td> <td>LeanStore, FASTER, Druid, Citus, InfluxDB IOx (Rust), rqlite, Pinecone, RavenDB, Velox, QuestDB, Andres Freund on PG I/O</td> </tr> <tr> <td>¡Databases! (Fall 2022)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjZKp-oX_75aBnznulk7nubu" target="_blank" rel="noreferrer">YouTube (12)</a></td> <td>Umbra, Neon, TigerBeetle, SplinterDB, RisingWave, Litestream, OceanBase</td> </tr> <tr> <td>The Databaseology Lectures (Fall 2015)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjakeQR57ZdN5slUu2oPUr1Y" target="_blank" rel="noreferrer">YouTube (6)</a></td> <td>Storage engines by their authors: WiredTiger, SQLite, LMDB, RocksDB, BerkeleyDB</td> </tr> <tr> <td>Seven Databases in Seven Weeks (Fall 2014)</td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjY2xvwxuKjZT5qFH0sQga8_" target="_blank" rel="noreferrer">YouTube (6)</a></td> <td>MemSQL, Hekaton, NuoDB, MongoDB, TokuDB (fractal trees), VoltDB</td> </tr> <tr> <td>CMU Database Seminar (ongoing) · Intro Flash Talks <a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjbLo46aPmZk4Ak-2CDTM-vI" target="_blank" rel="noreferrer">2025</a> / <a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjZXnK27gpm5icC403EPfl5b" target="_blank" rel="noreferrer">2026</a></td> <td><a href="https://www.youtube.com/playlist?list=PLSE8ODhjZXjYaHQP-kZcZSCv3bYWV3ZfD" target="_blank" rel="noreferrer">YouTube</a></td> <td>Aurora DSQL transactions, DBSP, Oracle 23ai transactions; short vendor talks</td> </tr> </tbody> </table></div>

<aside data-call="note"><b>Finding any single video</b><p>The unofficial index <a href="https://github.com/tamnd/cmu-database-group-videos-index" target="_blank" rel="noreferrer">tamnd/cmu-database-group-videos-index</a> lists all 585 channel videos and 35 playlists with descriptions and, for many, transcripts. Transcripts can be grepped: search for "pointer swizzling" and you land on the minute Andy explains it.</p></aside>
"""

[[sections]]
heading = "Books"
body = """
<ul class="cb-g-reading"><li><a href="https://db-book.com/" target="_blank" rel="noreferrer">Database System Concepts, 7th ed.</a> (Silberschatz, Korth, Sudarshan)<span>The 15-445 textbook. Chapter numbers in each Part I header refer to it.</span></li><li><a href="https://www.databass.dev/" target="_blank" rel="noreferrer">Database Internals</a> (Alex Petrov, O'Reilly 2019)<span>Storage engines and distributed systems from an implementer's view: B-tree variants, LSM, Bw-tree, consensus. The best companion to Parts I–II.</span></li><li><a href="https://dsf.berkeley.edu/papers/fntdb07-architecture.pdf" target="_blank" rel="noreferrer">Architecture of a Database System</a> (Hellerstein, Stonebraker, Hamilton, 2007)<span>120 free pages on how the pieces fit: process models, admission control, shared components. Read it before Part I.</span></li><li><a href="http://www.redbook.io/" target="_blank" rel="noreferrer">Readings in Database Systems (the Red Book), 5th ed.</a> (Bailis, Hellerstein, Stonebraker)<span>Free. Short commentaries on the papers that matter.</span></li><li><a href="https://www.microsoft.com/en-us/research/people/philbe/book/" target="_blank" rel="noreferrer">Concurrency Control and Recovery in Database Systems</a> (Bernstein, Hadzilacos, Goodman)<span>Free. The theory behind serializability, 2PL, T/O, MVCC and recovery.</span></li><li><a href="https://www.elsevier.com/books/transaction-processing/gray/978-0-08-051955-5" target="_blank" rel="noreferrer">Transaction Processing: Concepts and Techniques</a> (Gray &amp; Reuter)<span>The implementation bible for locks, logs, and recovery. Large; read it by chapter.</span></li><li><a href="https://dataintensive.net/" target="_blank" rel="noreferrer">Designing Data-Intensive Applications, 2nd ed.</a> (Kleppmann &amp; Riccomini)<span>The distributed and data-systems overview. Read it for Part V's distributed stages.</span></li><li><a href="https://www.nowpublishers.com/article/Details/DBS-077" target="_blank" rel="noreferrer">Extensible Query Optimizers in Practice</a> (Ding, Narasayya, Chaudhuri, FnT Databases 2024)<span>The 15-799 textbook ("EQOP"): Cascades as it is actually built at Microsoft.</span></li><li><a href="https://marabos.nl/atomics/" target="_blank" rel="noreferrer">Rust Atomics and Locks</a> (Mara Bos)<span>Free online. Memory ordering, building your own locks, and exactly what you need for latches and lock-free structures.</span></li><li><a href="https://rust-for-rustaceans.com/" target="_blank" rel="noreferrer">Rust for Rustaceans</a> (Jon Gjengset)<span>Unsafe code, variance, API design, and the level just past the Rust book.</span></li><li><a href="https://doc.rust-lang.org/nomicon/" target="_blank" rel="noreferrer">The Rustonomicon</a><span>Free. Read it before writing the first <code>unsafe</code> page cast.</span></li><li><a href="https://www.interdb.jp/pg/" target="_blank" rel="noreferrer">The Internals of PostgreSQL</a> (Hironobu Suzuki)<span>Free. Heap tuples, MVCC, the buffer manager, WAL: one production system, all the way down.</span></li><li><a href="https://postgrespro.com/community/books/internals" target="_blank" rel="noreferrer">PostgreSQL 14 Internals</a> (Egor Rogov)<span>Free PDF. Deeper on MVCC and vacuum, locks, and the planner.</span></li><li><a href="https://www.brendangregg.com/systems-performance-2nd-edition-book.html" target="_blank" rel="noreferrer">Systems Performance, 2nd ed.</a> (Brendan Gregg)<span>Methodology for Part VI: USE method, off-CPU analysis, disk I/O.</span></li></ul>
"""

[[sections]]
heading = "Codebases to read"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Project</th> <th>Why read it</th> <th>Start at</th> </tr> </thead> <tbody> <tr> <td><a href="https://github.com/erikgrinaker/toydb" target="_blank" rel="noreferrer">toydb</a> (Erik Grinaker)</td> <td>A complete distributed SQL database in Rust, written to be read: Raft, MVCC over a KV store, SQL planner and executor. The closest thing to Cairn systems 1+2 in one repo.</td> <td><code>docs/architecture/</code>, <code>src/storage/mvcc.rs</code>, <code>src/raft/</code></td> </tr> <tr> <td><a href="https://github.com/skyzh/mini-lsm" target="_blank" rel="noreferrer">mini-lsm</a> (Alex Chi Z.)</td> <td>A three-week course building an LSM engine in Rust, with MVCC. Use it directly for System 2's storage engine.</td> <td><a href="https://skyzh.github.io/mini-lsm/" target="_blank" rel="noreferrer">skyzh.github.io/mini-lsm</a></td> </tr> <tr> <td><a href="https://github.com/risinglightdb/risinglight" target="_blank" rel="noreferrer">RisingLight</a></td> <td>An educational OLAP database in Rust: columnar storage, vectorized executor, egg-based optimizer.</td> <td><code>src/planner/</code>, <code>src/storage/secondary/</code></td> </tr> <tr> <td><a href="https://github.com/apache/datafusion" target="_blank" rel="noreferrer">Apache DataFusion</a></td> <td>A production query engine on Arrow: logical and physical plans, optimizer rules, streaming execution. Used by InfluxDB 3, GreptimeDB, Comet, and others.</td> <td><code>datafusion/optimizer/src/</code>, <code>datafusion/physical-plan/src/joins/</code></td> </tr> <tr> <td><a href="https://github.com/tursodatabase/turso" target="_blank" rel="noreferrer">Limbo / Turso</a></td> <td>SQLite rewritten in Rust with async I/O and deterministic simulation testing.</td> <td><code>core/storage/btree.rs</code>, <code>simulator/</code></td> </tr> <tr> <td><a href="https://github.com/tikv/tikv" target="_blank" rel="noreferrer">TiKV</a> · <a href="https://github.com/tikv/raft-rs" target="_blank" rel="noreferrer">raft-rs</a></td> <td>Production Multi-Raft KV store with Percolator transactions, in Rust.</td> <td><code>components/raftstore/</code>, <code>src/storage/txn/</code></td> </tr> <tr> <td><a href="https://github.com/qdrant/qdrant" target="_blank" rel="noreferrer">Qdrant</a> · <a href="https://github.com/lancedb/lance" target="_blank" rel="noreferrer">LanceDB/Lance</a></td> <td>Vector search engine; columnar format for ML data.</td> <td><code>lib/segment/src/index/hnsw_index/</code></td> </tr> <tr> <td><a href="https://github.com/spacejam/sled" target="_blank" rel="noreferrer">sled</a> · <a href="https://github.com/fjall-rs/fjall" target="_blank" rel="noreferrer">fjall</a> · <a href="https://github.com/cberner/redb" target="_blank" rel="noreferrer">redb</a></td> <td>Embedded KV engines: Bw-tree-inspired, LSM, copy-on-write B-tree.</td> <td><code>redb/src/tree_store/</code></td> </tr> <tr> <td><a href="https://github.com/risingwavelabs/risingwave" target="_blank" rel="noreferrer">RisingWave</a> · <a href="https://github.com/MaterializeInc/materialize" target="_blank" rel="noreferrer">Materialize</a></td> <td>Streaming SQL / incremental view maintenance in Rust.</td> <td><code>src/stream/</code>, <code>src/compute/</code></td> </tr> <tr> <td><a href="https://github.com/GreptimeTeam/greptimedb" target="_blank" rel="noreferrer">GreptimeDB</a> · <a href="https://github.com/datafuselabs/databend" target="_blank" rel="noreferrer">Databend</a> · <a href="https://github.com/neondatabase/neon" target="_blank" rel="noreferrer">Neon</a></td> <td>Time series on DataFusion; cloud warehouse; separated storage for Postgres.</td> <td><code>src/mito2/</code>, <code>pageserver/</code></td> </tr> <tr> <td>BusTub · <a href="https://sqlite.org/src/" target="_blank" rel="noreferrer">SQLite</a> · <a href="https://github.com/postgres/postgres" target="_blank" rel="noreferrer">PostgreSQL</a> · <a href="https://github.com/duckdb/duckdb" target="_blank" rel="noreferrer">DuckDB</a></td> <td>The C/C++ references.</td> <td><code>src/backend/storage/buffer/README</code>, <code>src/execution/</code></td> </tr> </tbody> </table></div>
"""
