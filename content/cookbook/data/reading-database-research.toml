[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>The field has three kinds of paper, and they should be read differently.</strong> A <em>mechanism</em> paper (ARIES, the Bw-tree, Raft) describes a design you could build; read it with a pencil and write the data structure down. A <em>measurement or analysis</em> paper (How Good Are Query Optimizers, Really?; An Empirical Evaluation of In-Memory MVCC) tells you which of several designs wins and why; read the setup before the result. A <em>system</em> paper (Spanner, Aurora, Snowflake, FoundationDB) describes a whole product after the fact; read it for the decisions and the numbers the authors chose to show.</li> <li><strong>Venues tell you what to expect.</strong> The database community publishes mostly in <strong>SIGMOD</strong> (conference of the ACM special interest group, with the PODS theory conference alongside), <strong>VLDB</strong> (the <em>Proceedings of the VLDB Endowment</em>, PVLDB, whose papers are presented at the annual VLDB conference), <strong>ICDE</strong>, <strong>CIDR</strong> (the Conference on Innovative Data Systems Research, short and opinionated papers about directions) and <strong>EDBT</strong>. Systems papers that touch databases appear at <strong>OSDI</strong>, <strong>SOSP</strong>, <strong>NSDI</strong>, <strong>EuroSys</strong>, <strong>FAST</strong> (storage) and <strong>USENIX ATC</strong>. Journals: <strong>TODS</strong> (ACM Transactions on Database Systems), <strong>VLDB Journal</strong>. Preprints on arXiv often precede the proceedings.</li> <li><strong>A paper is a claim with evidence. Read it as one.</strong> What exactly is claimed? Against what baseline? On what workload, hardware and data size? What would have to be true for the claim to fail? An hour is enough to answer these for most papers; a day is enough to reproduce a small result, which is what the rest of this guide does.</li> <li><strong>Old papers are not obsolete papers.</strong> The design of a buffer pool, a lock manager, a log, an optimizer's search space or a consensus protocol was settled by papers from 1970 to 2014 and has changed little since; what changed is the hardware around it. Reading the original usually explains why the textbook version looks as it does.</li> <li><strong>Check one number.</strong> The most useful habit in reading research is to take one reported number (a speed-up, a latency, a ratio) and ask whether you could reproduce its order of magnitude with a program of a hundred lines. This guide's sections do that for many of them, and where a measured result differed from the paper's (for example the cost of a WebAssembly build against native, <a href="/cookbook/p/the-engine-in-webassembly">M20</a>), the section says so.</li> </ul>
"""

[[sections]]
heading = "A method for an hour"
body = """
<ol> <li><strong>Minutes 0–10, the skeleton.</strong> Read the title, abstract, introduction's contribution list, the figures and their captions, the conclusion. Write one sentence: <em>this paper claims X by doing Y, evaluated on Z.</em></li> <li><strong>Minutes 10–25, the mechanism.</strong> Read the design section with paper and pencil. Draw the data structure or the message diagram. Write the invariant the design maintains. If you cannot, you have not understood it; go back.</li> <li><strong>Minutes 25–40, the evidence.</strong> Read the evaluation: hardware, data, workload, baselines, what is <em>not</em> compared. Look for the number that the abstract's claim rests on and find it in a table. Note any baseline that is configured by the authors but not tuned.</li> <li><strong>Minutes 40–50, the neighbours.</strong> Read the related-work section and mark two papers you would read next. A paper's bibliography is the cheapest search engine for its field.</li> <li><strong>Minutes 50–60, one thing to try.</strong> Write down the smallest experiment that would test one claim: a data structure to code, a query to run, a number to reproduce.</li> </ol>
"""

[[sections]]
heading = "Thirty papers the guide stands on"
body = """
<p>Each line says which section of this guide builds the same thing. Years and venues are those of the original publication.</p>

<p><strong>Foundations</strong></p>

<ul> <li>E. F. Codd, <em>A Relational Model of Data for Large Shared Data Banks</em>, CACM 1970 — <a href="/cookbook/p/relational-model-algebra">L01</a>.</li> <li>P. Selinger et al., <em>Access Path Selection in a Relational Database Management System</em>, SIGMOD 1979 — <a href="/cookbook/p/cost-models-and-join-ordering">L16</a>, <a href="/cookbook/p/join-ordering">Q4</a>.</li> <li>J. Gray, <em>The Transaction Concept: Virtues and Limitations</em>, VLDB 1981; T. Härder and A. Reuter, <em>Principles of Transaction-Oriented Database Recovery</em>, ACM Computing Surveys 1983 — <a href="/cookbook/p/concurrency-control-theory">L17</a>, <a href="/cookbook/p/logging">L21</a>.</li> <li>C. Mohan et al., <em>ARIES: A Transaction Recovery Method Supporting Fine-Granularity Locking and Partial Rollbacks Using Write-Ahead Logging</em>, TODS 1992 — <a href="/cookbook/p/crash-recovery-aries">L22</a>, <a href="/cookbook/p/build-wal-and-aries">22b</a>.</li> <li>H. Berenson et al., <em>A Critique of ANSI SQL Isolation Levels</em>, SIGMOD 1995 — <a href="/cookbook/p/concurrency-control-theory">L17</a>, <a href="/cookbook/p/mvcc-protocols-compared">A3</a>.</li> <li>J. M. Hellerstein, M. Stonebraker and J. Hamilton, <em>Architecture of a Database System</em>, Foundations and Trends in Databases 2007 — the whole of Part I, in one document.</li> </ul>

<p><strong>Access methods and storage</strong></p>

<ul> <li>R. Bayer and E. McCreight, <em>Organization and Maintenance of Large Ordered Indexes</em>, Acta Informatica 1972 — <a href="/cookbook/p/b-trees">L08</a>.</li> <li>P. O'Neil et al., <em>The Log-Structured Merge-Tree (LSM-Tree)</em>, Acta Informatica 1996 — <a href="/cookbook/p/log-structured-storage">L05</a>, <a href="/cookbook/p/a-durable-lsm-tree">M7</a>.</li> <li>J. Levandoski, D. Lomet and S. Sengupta, <em>The Bw-Tree: A B-tree for New Hardware Platforms</em>, ICDE 2013 — <a href="/cookbook/p/latch-free-indexes-and-the-bw-tree">A5</a>.</li> <li>V. Leis, A. Kemper and T. Neumann, <em>The Adaptive Radix Tree: ARTful Indexing for Main-Memory Databases</em>, ICDE 2013 — <a href="/cookbook/p/tries-and-the-adaptive-radix-tree">A6</a>.</li> <li>V. Leis et al., <em>The ART of Practical Synchronization</em>, DaMoN 2016 — optimistic lock coupling, <a href="/cookbook/p/concurrent-memory">Concurrent memory</a>.</li> </ul>

<p><strong>Query processing and optimization</strong></p>

<ul> <li>G. Graefe, <em>Query Evaluation Techniques for Large Databases</em>, ACM Computing Surveys 1993; <em>Volcano: An Extensible and Parallel Query Evaluation System</em>, TKDE 1994 — <a href="/cookbook/p/query-execution">L13</a>.</li> <li>G. Graefe, <em>The Cascades Framework for Query Optimization</em>, IEEE Data Engineering Bulletin 1995 — <a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>.</li> <li>P. Boncz, M. Zukowski and N. Nes, <em>MonetDB/X100: Hyper-Pipelining Query Execution</em>, CIDR 2005 — <a href="/cookbook/p/a-vectorized-engine">M4</a>.</li> <li>T. Neumann, <em>Efficiently Compiling Efficient Query Plans for Modern Hardware</em>, PVLDB 2011 — <a href="/cookbook/p/query-compilation-and-code-generation">A15</a>.</li> <li>V. Leis et al., <em>Morsel-Driven Parallelism: A NUMA-Aware Query Evaluation Framework for the Many-Core Age</em>, SIGMOD 2014 — <a href="/cookbook/p/parallel-execution">L14</a>.</li> <li>V. Leis et al., <em>How Good Are Query Optimizers, Really?</em>, PVLDB 2015 — <a href="/cookbook/p/cardinality-estimation">Q8</a>.</li> <li>T. Kersten et al., <em>Everything You Always Wanted to Know About Compiled and Vectorized Queries But Were Afraid to Ask</em>, PVLDB 2018 — <a href="/cookbook/p/a-vectorized-engine">M4</a>, <a href="/cookbook/p/a-bytecode-virtual-machine">M5</a>.</li> </ul>

<p><strong>Transactions and distribution</strong></p>

<ul> <li>C. Diaconu et al., <em>Hekaton: SQL Server's Memory-Optimized OLTP Engine</em>, SIGMOD 2013; Y. Wu et al., <em>An Empirical Evaluation of In-Memory Multi-Version Concurrency Control</em>, PVLDB 2017 — <a href="/cookbook/p/mvcc-protocols-compared">A3</a>.</li> <li>D. Ongaro and J. Ousterhout, <em>In Search of an Understandable Consensus Algorithm</em>, USENIX ATC 2014 — <a href="/cookbook/p/raft">M8</a>.</li> <li>J. Corbett et al., <em>Spanner: Google's Globally-Distributed Database</em>, OSDI 2012; A. Thomson et al., <em>Calvin: Fast Distributed Transactions for Partitioned Database Systems</em>, SIGMOD 2012 — <a href="/cookbook/p/distributed-transactions">M10</a>.</li> <li>D. Peng and F. Dabek, <em>Large-scale Incremental Processing Using Distributed Transactions and Notifications</em> (Percolator), OSDI 2010 — <a href="/cookbook/p/distributed-transactions">M10</a>.</li> <li>M. Shapiro et al., <em>Conflict-free Replicated Data Types</em>, SSS 2011 — <a href="/cookbook/p/crdts">M11</a>.</li> <li>A. Verbitski et al., <em>Amazon Aurora: Design Considerations for High Throughput Cloud-Native Relational Databases</em>, SIGMOD 2017 — <a href="/cookbook/p/cloud-native-oltp">S6</a>.</li> </ul>

<p><strong>Analytics and columns</strong></p>

<ul> <li>M. Stonebraker et al., <em>C-Store: A Column-oriented DBMS</em>, VLDB 2005 — <a href="/cookbook/p/storage-models-and-compression">L06</a>, <a href="/cookbook/p/a-column-store">M3</a>.</li> <li>S. Melnik et al., <em>Dremel: Interactive Analysis of Web-Scale Datasets</em>, VLDB 2010 — <a href="/cookbook/p/columnar-formats-and-nested-data">A12</a>.</li> <li>B. Dageville et al., <em>The Snowflake Elastic Data Warehouse</em>, SIGMOD 2016; M. Armbrust et al., <em>Lakehouse: A New Generation of Open Platforms that Unify Data Warehousing and Advanced Analytics</em>, CIDR 2021 — <a href="/cookbook/p/lakehouses-and-table-formats">S5</a>.</li> <li>M. Raasveldt and H. Mühleisen, <em>DuckDB: an Embeddable Analytical Database</em>, SIGMOD 2019 (demonstration) — <a href="/cookbook/p/embedded-engines">S10</a>.</li> </ul>
"""

[[sections]]
heading = "Papers for Part VI"
body = """
<ul> <li>M. Herlihy and J. Wing, <em>Linearizability: A Correctness Condition for Concurrent Objects</em>, TOPLAS 1990; J. Wing and C. Gong, <em>Testing and Verifying Concurrent Objects</em>, JPDC 1993; G. Lowe, <em>Testing for Linearizability</em>, Concurrency and Computation 2017 — <a href="/cookbook/p/testing-a-database">Testing</a>.</li> <li>M. Rigger and Z. Su, <em>Testing Database Engines via Pivoted Query Synthesis</em>, OSDI 2020; <em>Finding Bugs in Database Systems via Query Partitioning</em>, OOPSLA 2020; <em>Detecting Optimization Bugs in Database Engines via Non-Optimizing Reference Engine Construction</em>, ESEC/FSE 2020 — <a href="/cookbook/p/testing-a-database">Testing</a>.</li> <li>K. Kingsbury and P. Alvaro, <em>Elle: Inferring Isolation Anomalies from Experimental Observations</em>, PVLDB 2020 — <a href="/cookbook/p/testing-a-database">Testing</a>.</li> <li>H. Attiya, A. Bar-Noy and D. Dolev, <em>Sharing Memory Robustly in Message-Passing Systems</em>, JACM 1995 — the register of <a href="/cookbook/p/deterministic-simulation">Simulation</a>.</li> <li>J. Zhou et al., <em>FoundationDB: A Distributed Unbundled Transactional Key Value Store</em>, SIGMOD 2021 — <a href="/cookbook/p/deterministic-simulation">Simulation</a>.</li> <li>B. Cooper et al., <em>Benchmarking Cloud Serving Systems with YCSB</em>, SoCC 2010; P. Boncz, T. Neumann and O. Erling, <em>TPC-H Analyzed: Hidden Messages and Lessons Learned from an Influential Benchmark</em>, TPCTC 2013; T. Mytkowicz et al., <em>Producing Wrong Data Without Doing Anything Obviously Wrong!</em>, ASPLOS 2009 — <a href="/cookbook/p/benchmarking">Benchmarking</a>.</li> <li>T. Pillai et al., <em>All File Systems Are Not Created Equal: On the Complexity of Crafting Crash-Consistent Applications</em>, OSDI 2014 — <a href="/cookbook/p/disk-i-o-fsync-the-page-cache-and-queues">I/O</a>.</li> </ul>
"""

[[sections]]
heading = "Books"
body = """
<ul> <li><em>Database System Concepts</em> (Silberschatz, Korth, Sudarshan) and <em>Database Management Systems</em> (Ramakrishnan, Gehrke): the textbooks of Part I.</li> <li><em>Transaction Processing: Concepts and Techniques</em> (Gray, Reuter): the classic on logging, locking and recovery.</li> <li><em>Designing Data-Intensive Applications</em> (Kleppmann): the modern tour of replication, partitioning, transactions and streams, the best companion to Part V.</li> <li><em>Database Internals</em> (Petrov): storage engines and distributed systems, close to Parts I and V.</li> <li><em>Readings in Database Systems</em> (the "Red Book", Bailis, Hellerstein, Stonebraker): short commentaries and a reading list; free online.</li> </ul>
"""
