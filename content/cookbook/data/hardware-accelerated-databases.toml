```

<ul> <li><strong>A scan is a bandwidth test, and it saturates early.</strong> One thread reads <strong>92 GB/s</strong> (this machine has unusually high unified-memory bandwidth), 8 threads <strong>232 GB/s</strong>, and 12 threads add nothing (the extra threads run on efficiency cores). The ceiling, not the thread count, sets the speed: a GPU scan kernel is the same program with 20 000 lanes and a 1.5 TB/s ceiling.</li> <li><strong>Scan, compaction and partition cost multiples of a scan.</strong> The prefix sum reaches 58.6 GB/s (two passes plus a write per element). Order-preserving compaction needs three passes (flags, scan, scatter): on one thread it is 1.4–6× slower than a plain loop, yet the plain loop is <em>not</em> constant: it runs at <strong>24 GB/s when 1% of rows survive</strong> and collapses to <strong>2.9 GB/s at 50%</strong> because the branch becomes unpredictable. The parallel version is flat in selectivity (12–20 GB/s at 8–12 threads) and wins by 4× at 50%, loses at 1% (20.8 against 23.5 GB/s) where the branch predictor does the compaction's work for free. On a GPU there is no branch predictor and divergence is expensive, so the branch-free three-pass form is the one used.</li> <li><strong>Partitioning beats sorting by a wide margin</strong>: radix partition on 8 bits runs at <strong>15.4 GB/s</strong> at 8 threads (2.5 on one) and on 4 bits at <strong>20.9 GB/s</strong>, against 0.35 GB/s for <code>sort_unstable</code> of the same keys (388 ms): partitioning a join input on a few bits first is far cheaper than sorting it, and fewer partitions are faster because the scatter has fewer write streams (cache lines and TLB entries).</li> <li><strong>Contention decides the aggregation strategy.</strong> With 8 threads, a shared atomic table does <strong>62 M rows/s with 1 group and 47 M/s with 64 groups</strong> (every thread hits the same few cache lines), while private tables do <strong>3 817 M and 18 887 M rows/s</strong>: 62× and 400× faster. As the number of groups grows the atomic table recovers (169 M rows/s at 65 536 groups) while private tables degrade (1 959 M rows/s at 1 M groups: each thread's table no longer fits in cache and the merge grows), narrowing the gap to 13×. GPU engines therefore aggregate few groups in per-block shared memory, many groups with global atomics, and huge group counts by sorting.</li> <li><strong>The offload model says residency is everything.</strong> With this machine's 232 GB/s as the CPU: a GPU with 1.5 TB/s of HBM is <strong>6.5× faster if all data is resident</strong> (the ratio of bandwidths), <strong>0.9× at 90% resident</strong> (already slower than the CPU), and <strong>0.11× (9× slower) when nothing is resident</strong> and every byte crosses PCIe 4 at 25 GB/s. PCIe 5 with 3.3 TB/s HBM: 14.2× resident, 1.9× at 90%, 0.22× cold. A coherent link such as NVLink-C2C (400 GB/s) changes the picture completely: 5.1× at 90% resident and still 1.7× with nothing resident. The break-even residency for the PCIe 4 case is <code>f* = (1/25 − 1/232) / (1/25 − 1/1500) ≈ 0.91</code>: the GPU pays off only if more than about nine tenths of the bytes a query reads are already in HBM.</li> </ul>

<aside data-call="note"><b>Reading the model</b><p>The model prices only the scan bandwidth, which is where GPU databases are strongest. It ignores kernel launch and synchronization (microseconds each), the cost of loading data into HBM in the first place, compression (which multiplies effective bandwidth on both the link and the HBM), overlap of transfer and compute (which hides the smaller of the two), and the price per GB of HBM against DRAM. Put your own numbers into <code>speedup = 1 / (B_cpu × (f / B_gpu + (1 − f) / B_link))</code> before believing any vendor chart, and measure <code>B_cpu</code> on the server you would actually use.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Disjoint writes in safe Rust</strong> need either disjoint slices or atomics. <code>exclusive_scan</code> and <code>compact</code> hand each block its own <code>&amp;mut [u64]</code> with <code>split_at_mut</code> (the output is cut where the scan says each block's results start), so every thread writes only its own memory. <code>radix_partition</code> scatters to interleaved positions that no slice split can express, so it stores into <code>Vec&lt;AtomicU32&gt;</code> with <code>Relaxed</code> ordering: each slot is written exactly once, which the type system cannot prove but the algorithm guarantees. This is the same obligation a CUDA kernel's scatter carries.</li> <li><strong><code>std::thread::scope</code></strong> lets workers borrow the input slices and the output chunks without <code>Arc</code>, and joins them before returning; a kernel launch is a <code>scope</code> and the barrier between kernels is its end.</li> <li><strong>Real GPU code from Rust</strong> uses <code>wgpu</code> (portable compute shaders over Metal, Vulkan, DX12), <code>cudarc</code> (CUDA driver API) or <code>rust-gpu</code>/<code>cuda-std</code> (kernels written in Rust); the host side is ordinary Rust with explicit buffer allocation, upload, dispatch and readback, which are exactly the link costs the model prices.</li> <li><strong>Contention as a measurable property</strong>: <code>group_sum_atomic</code> uses <code>fetch_add(…, Relaxed)</code>; its poor scaling with few groups is cache-line ping-pong, visible with no GPU. Padding each counter to its own cache line fixes the false sharing but not the true sharing of one counter.</li> <li><strong>Two-level structure everywhere</strong>: per-block work plus a tiny global combine step (scan of block sums, merge of private tables) is how work scales on any parallel machine; it is also the shape of tests: compare against the sequential definition for sizes 0, 1, fewer than the thread count, and random.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Property tests against sequential definitions</strong> (random inputs, 1–8 threads): the exclusive scan equals a running sum and its total; compaction equals <code>filter</code> (order and content); radix partition is a <em>stable</em> permutation: partition <code>p</code> holds, in input order, exactly the keys with low bits <code>p</code>, with correct start offsets; both group-by strategies equal a plain sum per group.</li> <li><strong>Edge sizes</strong>: 0, 1, 2, 3 and 7 elements with 1, 4 and 16 threads (more threads than elements); an empty scan sum.</li> <li><strong>Measurement cross-check</strong>: the harness asserts that the atomic and private group-by agree on 100 000 rows for every group count in the experiment.</li> <li><strong>Mutants run against these tests</strong> (all killed): block offsets not accumulated; an inclusive instead of exclusive scan; compaction keeping rejected elements; block-major offsets in the radix partition (breaking stability); a mask one bit too wide; the atomic group-by overwriting instead of adding; the private-table merge dropping a table; overlapping blocks.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>MapD → OmniSci → HEAVY.AI (HeavyDB)</strong>: a columnar SQL engine that compiles queries with LLVM to GPU (and CPU) code, keeps hot columns cached in GPU memory, and renders results on the GPU for interactive visual analytics.</li> <li><strong>Kinetica</strong>: a distributed, GPU-accelerated analytics database for time-series, geospatial and streaming workloads, with vectorized execution over in-memory columns.</li> <li><strong>SQream DB</strong>: a GPU database aimed at very large (petabyte-scale) analytics: columnar compressed storage streamed from disk through the GPU in chunks, so memory capacity is not the limit and the GPU is used as a throughput engine.</li> <li><strong>BlazingDB / BlazingSQL</strong>: SQL on the RAPIDS stack (cuDF, cuIO) reading Parquet and CSV straight into GPU memory, built on library kernels; its approach was absorbed into the RAPIDS ecosystem.</li> <li><strong>Brytlyt</strong>: a GPU-accelerated PostgreSQL (extension and storage), joins and aggregations offloaded.</li> <li><strong>Swarm64</strong>: PostgreSQL acceleration with an FPGA for scans, filters and aggregation plus parallel-query improvements.</li> <li><strong>Current practice</strong>: GPU acceleration of established engines (Spark with RAPIDS, plugins for DuckDB/Velox-style engines, research systems for out-of-core GPU joins) and hardware with coherent CPU–GPU memory (Grace Hopper) that moves the break-even point in the model above.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Benchmarking with resident data.</strong> A speedup measured with the table already in HBM says nothing about a query on cold data; always report the cold run, the load time, and the working-set size against device memory.</li> <li><strong>Counting only the kernel.</strong> End-to-end time includes the host-to-device copy, the launch, the result copy back, and the wait for the slowest stage; use a profiler that shows the whole timeline.</li> <li><strong>Atomics on few keys.</strong> The same contention that costs 60× on CPU threads costs far more on thousands of lanes; aggregate few groups in local memory.</li> <li><strong>Divergence and skew</strong>: branchy predicates and skewed join keys leave most lanes idle; prefer predication, sort or partition by key, and balance work per block.</li> <li><strong>Precision and semantics</strong>: floating-point sums depend on summation order (parallel results differ from sequential ones in the last bits); decimal, NULL and string semantics must match the host engine exactly.</li> <li><strong>Memory capacity</strong>: a join build side that does not fit in HBM forces partitioning and out-of-core processing; plan for it from the start instead of discovering it at scale.</li> <li><strong>Operational cost</strong>: GPUs mean drivers, firmware, special instances, and per-GB prices well above DRAM; the speedup must pay for the dollar-per-query, not only the seconds-per-query.</li> <li><strong>Don't trust assumed numbers</strong>: the table above uses spec-sheet bandwidths; sustained throughput on real kernels is lower (50–80% of peak is typical), and links are shared.</li> </ul></aside>
"""
