[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from GPU database research and the systems' documentation, not a summary of any speaker. This machine has no discrete GPU, and nothing below pretends it does: the primitives run on CPU threads, and every GPU figure is labelled as an assumption.)</em></p>

<ul> <li><strong>A GPU is a bandwidth machine.</strong> Thousands of lanes execute the same instruction on different data (SIMT: groups of 32 lanes, <em>warps</em>, in lockstep), attached to very high-bandwidth memory (HBM at 1–3+ TB/s, 5–15× a CPU socket) with high latency, hidden by running many warps at once. A column scan, a filter or an aggregation over data <em>already in GPU memory</em> runs at memory speed. Everything else is a penalty: <strong>divergent branches</strong> serialize a warp, <strong>uncoalesced access</strong> wastes bandwidth, <strong>small kernels</strong> do not cover the launch overhead (~10 µs), and <strong>data not in GPU memory</strong> must cross a link.</li> <li><strong>The link is the bottleneck.</strong> The GPU sits behind PCIe (about 25 GB/s usable on PCIe 4 ×16, ~50 on PCIe 5) or a faster coherent link (NVLink, NVLink-C2C on Grace Hopper-class systems: hundreds of GB/s). A modern CPU reads its own memory at 100–300+ GB/s. So for a bandwidth-bound scan of data that is <strong>not already resident</strong>, the CPU wins by the ratio of those two numbers; the GPU wins only if the working set lives in GPU memory (the "all resident" speedup is roughly <code>B_gpu / B_cpu</code>). Capacity is the second wall: 16–80 GB of HBM against terabytes of host memory.</li> <li><strong>So GPU databases are caching and streaming designs.</strong> <em>Cache</em> the hot columns in HBM (MapD/OmniSci's interactive dashboards and geospatial maps on a few hundred GB of hot data; Kinetica's in-GPU-memory analytics), or <em>stream</em> cold data through the device in chunks with compression and overlap of transfer and compute so the device sees the data once at link speed (SQream DB's large-data design), or avoid the host entirely with <strong>GPUDirect Storage</strong> (NVMe straight to device memory). Compressed columns reduce both the link and the HBM footprint; decompression runs on the device.</li> <li><strong>The operator toolbox is data-parallel primitives.</strong> <em>Filter</em> = flags, an <strong>exclusive prefix sum</strong>, and a scatter (<strong>stream compaction</strong>) that writes survivors contiguously and in order. <em>Partitioning</em> (for joins and group-bys) = per-block histograms, a scan over (partition, block), scatter (<strong>radix partition</strong>). <em>Sort</em> = LSD radix sort, where GPUs are strong. <em>Aggregation</em> = atomics into a table when there are many groups, <strong>shared-memory local aggregation</strong> when there are few, sort plus segmented reduction when there are very many. <em>Hash join</em> = build with atomic compare-and-swap, probe with coalesced reads, partitioned first when the table exceeds the cache or device memory. BlazingDB and RAPIDS-based engines assemble queries from library kernels (cuDF); MapD compiled each query to GPU code with LLVM.</li> <li><strong>Strings, variable-length data, branchy code and OLTP are poor fits.</strong> Point lookups and tiny scans do not amortize launch and transfer; skewed joins and groups cause load imbalance and atomic contention; correctness details (collation, NULLs, exceptions) cost more on a device with no exceptions.</li> <li><strong>FPGAs and offload engines are a different point in the design space.</strong> Swarm64 accelerated PostgreSQL by offloading scans, filters and aggregation to an FPGA and by adding parallel query machinery. A reconfigurable pipeline processes data as it streams from storage or the network with deterministic latency and low power, but is harder to program and to evolve; the same idea appears as smart NICs, DPUs and computational storage.</li> <li><strong>Brytlyt, Kinetica and others took the GPU into a familiar interface</strong>: a PostgreSQL extension, an SQL engine with a distributed layer. The adoption lesson: speed on resident analytics is easy to demonstrate; operations (loading, updates, failure, multi-tenancy, cost per GB of HBM) decide whether it survives.</li> </ul>
"""

[[sections]]
heading = "What is built"
body = """
<p><code>dpar.rs</code> implements the primitives from the list above, written the way a GPU kernel decomposes the work (blocks do local work, a small global step combines them) and run on <code>std::thread::scope</code> threads, each checked against the sequential definition:</p>

<ul> <li><strong><code>exclusive_scan</code></strong>: pass 1 sums each block, a short sequential scan turns block sums into offsets, pass 2 scans each block locally and adds its offset.</li> <li><strong><code>compact</code></strong>: write a 0/1 flag per element, scan the flags (the scan result at element <code>i</code> is its output position), and let every block copy its survivors into its own slice of the output. Order is preserved.</li> <li><strong><code>radix_partition</code></strong>: each block builds a histogram of the low <code>bits</code> of its keys; offsets are assigned partition-major, block-minor, so the result is <strong>stable</strong>; blocks scatter independently.</li> <li><strong><code>group_sum_atomic</code></strong> (one shared array of atomic counters, every thread adds into it) and <strong><code>group_sum_local</code></strong> (a private table per thread, merged at the end): the two ways GPU engines aggregate.</li> <li><strong><code>scan_sum</code></strong>: a column scan, used as the memory-bandwidth benchmark.</li> </ul>

<p>Then a model turns the measured CPU bandwidth and <strong>assumed</strong> GPU and link numbers into the speedup of a bandwidth-bound scan as a function of how much of the data is already in GPU memory.</p>

:::deeper Reference: exclusive scan, stream compaction, stable radix partition, atomic and private group-by, bandwidth benchmark
```rust title="src/gpu/primitives.rs"
//! The data-parallel building blocks of GPU-style query engines, written for CPU threads: exclusive prefix sum, order-preserving stream
//! compaction (flags + scan + scatter), stable radix partitioning (per-block histograms, a scan over (partition, block), scatter), and
//! two group-by strategies (atomic updates to one shared table versus private tables merged at the end). On a GPU the "blocks" are
//! thread blocks and the "threads" are lanes; the structure of the algorithms is the same.
use std::sync::atomic::{AtomicU64, Ordering::Relaxed};

fn blocks(n: usize, threads: usize) -> Vec<std::ops::Range<usize>> {
    let t = threads.max(1);
    let size = n.div_ceil(t).max(1);
    (0..t).map(|i| (i * size).min(n)..((i + 1) * size).min(n)).collect()
}

/// Exclusive prefix sum in two passes: per-block sums, a scan over the block sums, then per-block local scans offset by the result.
/// Returns the scanned vector and the total.
pub fn exclusive_scan(v: &[u64], threads: usize) -> (Vec<u64>, u64) {
    let bs = blocks(v.len(), threads);
    let sums: Vec<u64> = std::thread::scope(|s| {
        let hs: Vec<_> = bs.iter().map(|r| { let part = &v[r.clone()]; s.spawn(move || part.iter().sum::<u64>()) }).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    });
    let mut offs = vec![0u64; bs.len()];
    let mut acc = 0;
    for (i, &x) in sums.iter().enumerate() { offs[i] = acc; acc += x; }
    let mut out = vec![0u64; v.len()];
    std::thread::scope(|s| {
        let mut rest = out.as_mut_slice();
        for (r, &off) in bs.iter().zip(&offs) {
            let (mine, tail) = rest.split_at_mut(r.len());
            rest = tail;
            let part = &v[r.clone()];
            s.spawn(move || { let mut a = off; for (o, &x) in mine.iter_mut().zip(part) { *o = a; a += x; } });
        }
    });
    (out, acc)
}

/// Keep the elements satisfying `pred`, in order: write 0/1 flags, scan them to get each survivor's output position, scatter.
pub fn compact(v: &[u64], pred: &(dyn Fn(u64) -> bool + Sync), threads: usize) -> Vec<u64> {
    let flags: Vec<u64> = par_map_chunks(v, threads, |x| pred(x) as u64);
    let (pos, total) = exclusive_scan(&flags, threads);
    let mut out = vec![0u64; total as usize];
    // every survivor owns a distinct output slot, so blocks can scatter independently; safe code needs disjoint slices per block
    let bs = blocks(v.len(), threads);
    let mut cuts: Vec<usize> = bs.iter().map(|r| if r.start < v.len() { pos[r.start] as usize } else { total as usize }).collect();
    cuts.push(total as usize);
    std::thread::scope(|s| {
        let mut rest = out.as_mut_slice();
        for (i, r) in bs.iter().enumerate() {
            let (mine, tail) = rest.split_at_mut(cuts[i + 1] - cuts[i]);
            rest = tail;
            let (part, fl) = (&v[r.clone()], &flags[r.clone()]);
            s.spawn(move || { let mut k = 0; for (x, &f) in part.iter().zip(fl) { if f == 1 { mine[k] = *x; k += 1; } } });
        }
    });
    out
}

fn par_map_chunks(v: &[u64], threads: usize, f: impl Fn(u64) -> u64 + Sync) -> Vec<u64> {
    let mut out = vec![0u64; v.len()];
    let f = &f;
    std::thread::scope(|s| {
        let mut rest = out.as_mut_slice();
        for r in blocks(v.len(), threads) {
            let (mine, tail) = rest.split_at_mut(r.len());
            rest = tail;
            let part = &v[r];
            s.spawn(move || for (o, &x) in mine.iter_mut().zip(part) { *o = f(x); });
        }
    });
    out
}

/// Stable partition of `keys` by their low `bits` bits: every block builds a histogram, a scan over (partition-major, block-minor)
/// gives each block its write offsets, blocks scatter. Returns the permuted keys and the start offset of each partition.
pub fn radix_partition(keys: &[u32], bits: u32, threads: usize) -> (Vec<u32>, Vec<usize>) {
    let parts = 1usize << bits;
    let mask = (parts - 1) as u32;
    let bs = blocks(keys.len(), threads);
    let hist: Vec<Vec<usize>> = std::thread::scope(|s| {
        let hs: Vec<_> = bs.iter().map(|r| { let part = &keys[r.clone()]; s.spawn(move || { let mut h = vec![0usize; parts]; for &k in part { h[(k & mask) as usize] += 1; } h }) }).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    });
    // offsets[block][partition] = where this block writes its first key of this partition
    let mut offsets = vec![vec![0usize; parts]; bs.len()];
    let mut starts = vec![0usize; parts + 1];
    let mut acc = 0;
    for p in 0..parts { starts[p] = acc; for b in 0..bs.len() { offsets[b][p] = acc; acc += hist[b][p]; } }
    starts[parts] = acc;
    // every key has its own output slot, computed from the offsets, so blocks scatter independently (atomic stores keep this safe Rust)
    let out: Vec<std::sync::atomic::AtomicU32> = (0..keys.len()).map(|_| std::sync::atomic::AtomicU32::new(0)).collect();
    std::thread::scope(|s| {
        for (r, mut off) in bs.iter().zip(offsets) {
            let (part, out) = (&keys[r.clone()], &out);
            s.spawn(move || for &k in part { let p = (k & mask) as usize; out[off[p]].store(k, Relaxed); off[p] += 1; });
        }
    });
    let out: Vec<u32> = out.into_iter().map(|a| a.into_inner()).collect();
    (out, starts)
}

/// GROUP BY key (keys in `0..groups`) SUM(value) with one shared table of atomic counters: every thread adds directly into it.
/// With few groups all threads hit the same cache lines (contention); with many groups it scales.
pub fn group_sum_atomic(keys: &[u32], vals: &[u64], groups: usize, threads: usize) -> Vec<u64> {
    let table: Vec<AtomicU64> = (0..groups).map(|_| AtomicU64::new(0)).collect();
    std::thread::scope(|s| {
        for r in blocks(keys.len(), threads) {
            let (k, v, t) = (&keys[r.clone()], &vals[r], &table);
            s.spawn(move || for (&k, &x) in k.iter().zip(v) { t[k as usize].fetch_add(x, Relaxed); });
        }
    });
    table.into_iter().map(|a| a.into_inner()).collect()
}

/// The same aggregation with a private table per thread (the GPU's shared-memory local aggregation), merged at the end.
pub fn group_sum_local(keys: &[u32], vals: &[u64], groups: usize, threads: usize) -> Vec<u64> {
    let locals: Vec<Vec<u64>> = std::thread::scope(|s| {
        let hs: Vec<_> = blocks(keys.len(), threads).into_iter().map(|r| { let (k, v) = (&keys[r.clone()], &vals[r]); s.spawn(move || { let mut t = vec![0u64; groups]; for (&k, &x) in k.iter().zip(v) { t[k as usize] += x; } t }) }).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    });
    let mut out = vec![0u64; groups];
    for l in locals { for (o, x) in out.iter_mut().zip(l) { *o += x; } }
    out
}

/// Sum of a column read once with all threads: the bandwidth benchmark (bytes per second a scan can possibly achieve).
pub fn scan_sum(v: &[u64], threads: usize) -> u64 {
    std::thread::scope(|s| {
        let hs: Vec<_> = blocks(v.len(), threads).into_iter().map(|r| { let part = &v[r]; s.spawn(move || part.iter().fold(0u64, |a, &x| a.wrapping_add(x))) }).collect();
        hs.into_iter().map(|h| h.join().unwrap()).fold(0u64, |a, x| a.wrapping_add(x))
    })
}
```
:::
"""

