body = """
<p>32 M elements (268 MB of <code>u64</code>, 134 MB of <code>u32</code> keys), best of three runs. "Threads" play the role of thread blocks. The last table is a <strong>model</strong>: only the CPU bandwidth in it is measured here; the GPU and link figures are assumptions taken from vendor specifications (A100- and H100-class HBM, PCIe 4/5, NVLink-C2C), and real systems vary.</p>

