[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>One transaction layer serves every model.</strong> Rows, index entries, edges, document leaves and vector cells are all keys (<a href="/cookbook/p/one-key-space">M1</a>). A transaction that reads and writes keys therefore gives a row, its secondary indexes and a graph edge to the same account the same atomicity and isolation, without each model implementing its own.</li> <li><strong>Versions live in the key.</strong> A write of <code>k</code> at timestamp <code>ts</code> stores <code>escape(k) | (MAX − ts)</code>. The newest version sorts first, a snapshot read at <code>r</code> is a single seek to <code>escape(k) | (MAX − r)</code>, and old versions need no chain walk. A scan skips from one user key to the next with <code>prefix_end</code>. This is the layout of CockroachDB's MVCC keys and of TiKV's write column family.</li> <li><strong>Snapshot isolation is cheap to validate.</strong> A transaction reads the committed state as of its start timestamp and buffers its writes. At commit it aborts if any key it wrote has a version newer than its snapshot (<em>first committer wins</em>). That one check prevents lost updates and dirty reads and gives repeatable reads. It does not prevent <em>write skew</em>: two transactions that read overlapping data and write disjoint keys can both commit and break an invariant neither saw broken.</li> <li><strong>Serializable adds the reads.</strong> If a committing transaction's snapshot differs from the state at its commit point <em>on anything it read</em> (a point read, or a scanned range, which covers phantoms), it could not have been run at the commit point, so it aborts. This is optimistic backward validation: simple and correct, at the price of more aborts than Postgres's SSI, which aborts only on a dangerous structure of read-write dependencies.</li> <li><strong>A read-only transaction needs no validation.</strong> Its reads come from one consistent snapshot, which is a prefix of the commit order; it can be placed at its snapshot point in the serial order.</li> <li><strong>Constraints are reads.</strong> A unique-index check is a range scan of the index prefix; under serializable, the scan is validated, so two concurrent inserts of the same email cannot both commit. Under snapshot isolation they both see "no entry" and write different keys (the primary keys differ), so uniqueness fails; the layer has to take a write on the <em>unique key itself</em> to make first-committer-wins catch it (see the pitfalls).</li> <li><strong>Garbage collection is a watermark.</strong> Versions older than the oldest active snapshot, except the newest of them, can never be read again. A tombstone that is that newest version can go too. One long reader holds the watermark and everything above it.</li> </ul>
"""

[[sections]]
heading = "The structure"
body = """
<ul> <li><strong>Keys</strong>: <code>escape(user key) | (MAX − commit_ts)</code>. The escape is the bytes codec of <a href="/cookbook/p/one-key-space">M1</a>, self-delimiting and order-preserving, so the versions of one key are adjacent and sorted newest first, and different keys never interleave.</li> <li><strong>Reads</strong>: <code>get(k)</code> returns the transaction's own buffered write if there is one; otherwise it records <code>k</code> in the read set and seeks for the newest version with <code>ts ≤ read_ts</code>. A tombstone is a version with no value.</li> <li><strong>Scans</strong>: iterate <code>[lo, hi)</code> by seeking to the next user key after each one, read the visible version of each, then overlay the transaction's own writes. The range is recorded for validation.</li> <li><strong>Commit</strong>: validate (below), take <code>commit_ts = clock + 1</code>, insert all versions. A transaction with no writes commits without touching the clock.</li> <li><strong>Validation</strong>: <em>snapshot</em>: every written key's newest version has <code>ts ≤ read_ts</code>. <em>Serializable and writing</em>: additionally every read key, and every key version inside every scanned range, has <code>ts ≤ read_ts</code>.</li> <li><strong>Tables</strong>: a row is <code>row_key(table, pk)</code>; each index entry is <code>index_key(table, index, cols, pk)</code>; insert, update and delete write or tombstone the row and all its index entries in the same transaction; a unique index is checked by a range scan.</li> </ul>

:::deeper Reference: versioned keys, transactions, validation, garbage collection, and the table layer with unique and secondary indexes
```rust title="src/multimodel/mmtxn.rs"
//! A multi-version transaction layer over an ordered key-value map, and a relational table layer on top of it.
//!
//! Every write creates a *version*: the stored key is the user key (self-delimiting, order-preserving) followed by `u64::MAX - ts`, so
//! the newest version of a key sorts first and a snapshot read at timestamp `r` is one seek to `key | (MAX - r)`. Transactions read a
//! snapshot, buffer their writes, and validate at commit: snapshot isolation aborts a transaction whose written keys changed since its
//! snapshot (first committer wins); serializable adds validation of everything it read, point reads and scanned ranges.
use crate::mmkey::*;
use std::collections::{BTreeMap, BTreeSet};

#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Isolation { Snapshot, Serializable }

#[derive(Debug, PartialEq, Eq, Clone)]
pub enum TxnError { WriteConflict, ReadConflict, Duplicate, UniqueViolation(u16), NotFound }

fn esc(user: &[u8]) -> Vec<u8> { let mut o = vec![]; encode_val(&Val::Bytes(user.to_vec()), false, &mut o); o }
fn vkey(user: &[u8], ts: u64) -> Vec<u8> { let mut o = esc(user); o.extend((u64::MAX - ts).to_be_bytes()); o }
fn split(vk: &[u8]) -> (Vec<u8>, u64) {
    let n = vk.len() - 8;
    let mut pos = 0;
    let user = match decode_val(&vk[..n], &mut pos, false) { Ok(Val::Bytes(b)) => b, _ => unreachable!("corrupt versioned key") };
    (user, u64::MAX - u64::from_be_bytes(vk[n..].try_into().unwrap()))
}

#[derive(Default)]
pub struct Db {
    pub kv: BTreeMap<Vec<u8>, Option<Vec<u8>>>,
    clock: u64,
    active: BTreeMap<u64, usize>,
    pub commits: u64,
    pub aborts: u64,
}

pub struct Txn {
    pub read_ts: u64,
    pub iso: Isolation,
    writes: BTreeMap<Vec<u8>, Option<Vec<u8>>>,
    reads: BTreeSet<Vec<u8>>,
    ranges: Vec<(Vec<u8>, Vec<u8>)>,
}

impl Db {
    pub fn new() -> Db { Db::default() }
    pub fn now(&self) -> u64 { self.clock }
    pub fn versions(&self) -> usize { self.kv.len() }

    pub fn begin(&mut self, iso: Isolation) -> Txn {
        *self.active.entry(self.clock).or_insert(0) += 1;
        Txn { read_ts: self.clock, iso, writes: BTreeMap::new(), reads: BTreeSet::new(), ranges: vec![] }
    }
    fn release(&mut self, ts: u64) { if let Some(c) = self.active.get_mut(&ts) { *c -= 1; if *c == 0 { self.active.remove(&ts); } } }
    pub fn abort(&mut self, t: Txn) { self.release(t.read_ts); self.aborts += 1; }

    /// The value of `key` as of `ts`, and the timestamp of the version that holds it.
    fn read_at(&self, key: &[u8], ts: u64) -> Option<(u64, Option<&Vec<u8>>)> {
        let prefix = esc(key);
        let (k, v) = self.kv.range(vkey(key, ts)..).next()?;
        if !k.starts_with(&prefix) { return None; }   // the escaped key is prefix-free, so this is a version of `key`
        Some((split(k).1, v.as_ref()))
    }
    fn newest_ts(&self, key: &[u8]) -> Option<u64> {
        let prefix = esc(key);
        let (k, _) = self.kv.range(vkey(key, u64::MAX)..).next()?;
        if k.starts_with(&prefix) { Some(split(k).1) } else { None }
    }

    pub fn get(&self, t: &mut Txn, key: &[u8]) -> Option<Vec<u8>> {
        if let Some(w) = t.writes.get(key) { return w.clone(); }
        t.reads.insert(key.to_vec());
        self.read_at(key, t.read_ts).and_then(|(_, v)| v.cloned())
    }
    pub fn put(&self, t: &mut Txn, key: &[u8], val: &[u8]) { t.writes.insert(key.to_vec(), Some(val.to_vec())); }
    pub fn delete(&self, t: &mut Txn, key: &[u8]) { t.writes.insert(key.to_vec(), None); }

    /// Keys in `[lo, hi)` visible to the transaction (its snapshot plus its own writes), in key order.
    pub fn scan(&self, t: &mut Txn, lo: &[u8], hi: &[u8]) -> Vec<(Vec<u8>, Vec<u8>)> {
        t.ranges.push((lo.to_vec(), hi.to_vec()));
        let mut out: BTreeMap<Vec<u8>, Option<Vec<u8>>> = BTreeMap::new();
        let mut from = esc(lo);
        let end = esc(hi);
        while let Some((k, _)) = self.kv.range(from.clone()..end.clone()).next() {
            let (user, _) = split(k);
            if user.as_slice() >= hi { break; }
            if let Some((_, v)) = self.read_at(&user, t.read_ts) { out.insert(user.clone(), v.cloned()); }
            from = prefix_end(&esc(&user)).unwrap();
        }
        for (k, v) in t.writes.range(lo.to_vec()..hi.to_vec()) { out.insert(k.clone(), v.clone()); }
        out.into_iter().filter_map(|(k, v)| v.map(|v| (k, v))).collect()
    }

    pub fn commit(&mut self, t: Txn) -> Result<u64, TxnError> {
        let r = self.validate(&t);
        self.release(t.read_ts);
        if let Err(e) = r { self.aborts += 1; return Err(e); }
        if t.writes.is_empty() { self.commits += 1; return Ok(t.read_ts); }
        self.clock += 1;
        let ts = self.clock;
        for (k, v) in t.writes { self.kv.insert(vkey(&k, ts), v); }
        self.commits += 1;
        Ok(ts)
    }
    fn validate(&self, t: &Txn) -> Result<(), TxnError> {
        for k in t.writes.keys() { if self.newest_ts(k).is_some_and(|ts| ts > t.read_ts) { return Err(TxnError::WriteConflict); } }
        if t.iso == Isolation::Serializable && !t.writes.is_empty() {
            for k in &t.reads { if self.newest_ts(k).is_some_and(|ts| ts > t.read_ts) { return Err(TxnError::ReadConflict); } }
            for (lo, hi) in &t.ranges {
                for (k, _) in self.kv.range(esc(lo)..esc(hi)) { if split(k).1 > t.read_ts { return Err(TxnError::ReadConflict); } }
            }
        }
        Ok(())
    }

    /// Drop versions no reader can see: for every key keep the versions newer than the oldest active snapshot and the newest older one
    /// (unless it is a tombstone, which only hides versions that are being dropped too). Returns the number of versions removed.
    pub fn gc(&mut self) -> usize {
        let w = self.active.keys().next().copied().unwrap_or(self.clock);
        let mut drop = vec![];
        let mut current: Option<Vec<u8>> = None;
        let mut kept_old = false;
        for (k, v) in &self.kv {
            let (user, ts) = split(k);
            if current.as_ref() != Some(&user) { current = Some(user); kept_old = false; }
            if ts > w { continue; }
            if kept_old || v.is_none() { drop.push(k.clone()); if v.is_none() { kept_old = true; } } else { kept_old = true; }
        }
        let n = drop.len();
        for k in drop { self.kv.remove(&k); }
        n
    }
}

// ---- relational tables on the transaction layer ---------------------------------------------------------------------------------

#[derive(Clone, Debug)]
pub struct IndexDef { pub id: u16, pub cols: Vec<usize>, pub unique: bool }
#[derive(Clone, Debug)]
pub struct Table { pub id: u32, pub ncols: usize, pub pk: Vec<usize>, pub indexes: Vec<IndexDef> }

impl Table {
    fn pk_of(&self, row: &[Val]) -> Vec<Val> { self.pk.iter().map(|&c| row[c].clone()).collect() }
    fn cols_of(row: &[Val], cols: &[usize]) -> Vec<Val> { cols.iter().map(|&c| row[c].clone()).collect() }

    pub fn get(&self, db: &Db, t: &mut Txn, pk: &[Val]) -> Option<Vec<Val>> {
        db.get(t, &row_key(self.id, pk)).map(|v| decode_tuple(&v, &[]).unwrap())
    }
    pub fn insert(&self, db: &Db, t: &mut Txn, row: &[Val]) -> Result<(), TxnError> {
        assert_eq!(row.len(), self.ncols);
        let pk = self.pk_of(row);
        if db.get(t, &row_key(self.id, &pk)).is_some() { return Err(TxnError::Duplicate); }
        for ix in self.indexes.iter().filter(|i| i.unique) {
            let cols = Self::cols_of(row, &ix.cols);
            // a NULL in a unique column never conflicts (SQL semantics)
            if !cols.iter().any(|v| *v == Val::Null) && !db.scan(t, &index_prefix(self.id, ix.id, &cols), &prefix_end(&index_prefix(self.id, ix.id, &cols)).unwrap()).is_empty() {
                return Err(TxnError::UniqueViolation(ix.id));
            }
        }
        self.write_row(db, t, row, &pk);
        Ok(())
    }
    fn write_row(&self, db: &Db, t: &mut Txn, row: &[Val], pk: &[Val]) {
        db.put(t, &row_key(self.id, pk), &key(row));
        for ix in &self.indexes { db.put(t, &index_key(self.id, ix.id, &Self::cols_of(row, &ix.cols), pk), &[]); }
    }
    fn erase_row(&self, db: &Db, t: &mut Txn, row: &[Val], pk: &[Val]) {
        db.delete(t, &row_key(self.id, pk));
        for ix in &self.indexes { db.delete(t, &index_key(self.id, ix.id, &Self::cols_of(row, &ix.cols), pk)); }
    }
    pub fn delete(&self, db: &Db, t: &mut Txn, pk: &[Val]) -> Result<(), TxnError> {
        let old = self.get(db, t, pk).ok_or(TxnError::NotFound)?;
        self.erase_row(db, t, &old, pk);
        Ok(())
    }
    /// Replace the row with this primary key; the primary key itself cannot change.
    pub fn update(&self, db: &Db, t: &mut Txn, row: &[Val]) -> Result<(), TxnError> {
        let pk = self.pk_of(row);
        let old = self.get(db, t, &pk).ok_or(TxnError::NotFound)?;
        self.erase_row(db, t, &old, &pk);
        for ix in self.indexes.iter().filter(|i| i.unique) {
            let cols = Self::cols_of(row, &ix.cols);
            if !cols.iter().any(|v| *v == Val::Null) && !db.scan(t, &index_prefix(self.id, ix.id, &cols), &prefix_end(&index_prefix(self.id, ix.id, &cols)).unwrap()).is_empty() {
                return Err(TxnError::UniqueViolation(ix.id));
            }
        }
        self.write_row(db, t, row, &pk);
        Ok(())
    }
    pub fn scan_all(&self, db: &Db, t: &mut Txn) -> Vec<Vec<Val>> {
        let p = { let mut k = vec![ns::ROW]; k.extend(self.id.to_be_bytes()); k };
        db.scan(t, &p, &prefix_end(&p).unwrap()).into_iter().map(|(_, v)| decode_tuple(&v, &[]).unwrap()).collect()
    }
    /// Rows whose index columns lie in `[lo, hi)` (compared as tuples), fetched through the index.
    pub fn index_range(&self, db: &Db, t: &mut Txn, index: u16, lo: &[Val], hi: &[Val]) -> Vec<Vec<Val>> {
        let ix = self.indexes.iter().find(|i| i.id == index).expect("no such index");
        let n = ix.cols.len();
        let entries = db.scan(t, &index_prefix(self.id, index, lo), &index_prefix(self.id, index, hi));
        let head = 1 + 4 + 2;
        entries.into_iter().filter_map(|(k, _)| {
            let vals = decode_tuple(&k[head..], &[]).unwrap();
            self.get(db, t, &vals[n..])
        }).collect()
    }
    /// Every index entry points at a live row and every live row has all its entries: the consistency a transaction must preserve.
    pub fn check_consistency(&self, db: &Db) -> Result<(), String> {
        let mut t = db.clone_reader();
        let rows = self.scan_all(db, &mut t);
        for ix in &self.indexes {
            let p = { let mut k = vec![ns::INDEX]; k.extend(self.id.to_be_bytes()); k.extend(ix.id.to_be_bytes()); k };
            let entries = db.scan(&mut t, &p, &prefix_end(&p).unwrap());
            if entries.len() != rows.len() { return Err(format!("index {} has {} entries for {} rows", ix.id, entries.len(), rows.len())); }
            for (k, _) in entries {
                let vals = decode_tuple(&k[7..], &[]).unwrap();
                let n = ix.cols.len();
                match self.get(db, &mut t, &vals[n..]) {
                    Some(r) if Self::cols_of(&r, &ix.cols) == vals[..n] => {}
                    other => return Err(format!("index {} entry {:?} does not match row {:?}", ix.id, vals, other)),
                }
            }
        }
        Ok(())
    }
}

impl Db {
    /// A throwaway read transaction at the current time, for checks.
    pub fn clone_reader(&self) -> Txn { Txn { read_ts: self.clock, iso: Isolation::Snapshot, writes: BTreeMap::new(), reads: BTreeSet::new(), ranges: vec![] } }
}
