[[sections]]
heading = "Measured"
body = """
<p>The harness runs random interleavings of up to three open transactions, with reads, writes, deletes, scans, commits and aborts on 12 keys, and compares every operation with an independent model: the committed state after each commit, and for each key the timestamp of its newest version. The model predicts what every read and scan returns, and whether each commit succeeds, and with which error. For serializable runs it also checks, without using the validation code, that everything a committed transaction read is unchanged between its snapshot and its commit point.</p>

```text title="throughput on 200 000 keys, the cost of old versions, and contention"
200 000 keys of 100 bytes, one thread, interleaving simulated:
  read-only transaction of 10 point reads:    170571 txn/s (586 ns per read)
  transaction of 5 reads and 2 writes:        216757 txn/s
  transaction scanning 100 keys:               14385 txn/s (695 ns per key)
scan of 1000 keys: 649 us with one version each; 704 us with 101 versions each for the scanned keys (499999 versions in the store, a reader holding the old ones); 618 us after garbage collection (299999 versions removed in 0.07 s)
contention: 4 interleaved transactions, each reads 3 keys and writes 2, keys drawn from a skewed distribution
      keys  isolation            commits             aborts
     10000   Snapshot              19692         308 ( 1.5%)
     10000 Serializable              19236         764 ( 3.8%)
      1000   Snapshot              18738        1262 ( 6.3%)
      1000 Serializable              17272        2728 (13.6%)
       100   Snapshot              15498        4502 (22.5%)
       100 Serializable              12199        7801 (39.0%)
        20   Snapshot              11184        8816 (44.1%)
        20 Serializable               8025       11975 (59.9%)
```

<ul> <li><strong>300 + 300 random runs agreed with the model</strong>: 12 979 commits and 1 975 aborts under snapshot isolation; 12 341 commits and 2 805 aborts under serializable. Every abort was predicted, with the right error (<code>WriteConflict</code> or <code>ReadConflict</code>), and every commit was predicted to succeed.</li> <li><strong>Old versions are cheap to skip</strong>: scanning 1 000 keys takes 649 µs with one version each and 704 µs with 101 versions each (+8%), because the scan seeks past a key's older versions instead of walking them; garbage collection removed 299 999 versions in 0.07 s and the scan is back to 618 µs. What old versions cost is space (499 999 versions for 200 000 live keys) and GC work, not read latency.</li> <li><strong>Point reads cost about 0.6 µs and a 7-operation read-write transaction about 4.6 µs</strong> on one thread, over an in-memory <code>BTreeMap</code> with 200 000 keys; the layers above (a real storage engine, replication) will dominate.</li> <li><strong>Serializable costs aborts, and the cost grows with contention</strong>: 3.8% versus 1.5% when conflicts are rare, 39% versus 22.5% at 100 hot keys, 60% versus 44% at 20. Validating reads aborts every transaction whose reads were overwritten, whether or not the result would have been wrong; it is the price of a check that needs no dependency tracking.</li> </ul>

<aside data-call="note"><b>Write skew, in three lines</b><p>Two doctors are on call and each may go off call if the other stays. Both transactions read both rows (2 on call), each writes only its own row, the write sets are disjoint, and snapshot isolation commits both: <strong>zero doctors on call</strong>. Under serializable the second transaction's read of the first's row is stale at commit time: <code>ReadConflict</code>, one doctor stays. The test asserts both outcomes.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>Db::get(&amp;self, &amp;mut Txn, …)</code></strong>: the database is shared immutably while each transaction is a separate value holding its own read set, write buffer and ranges. Several <code>Txn</code>s coexist, and <code>commit(&amp;mut self, Txn)</code> consumes the transaction, so a transaction cannot be committed twice or used afterwards.</li> <li><strong><code>BTreeMap::range</code> seeks</strong> for point reads and for skipping to the next key; <code>prefix_end(&amp;esc(user))</code> is the seek target that jumps over every version of <code>user</code>.</li> <li><strong><code>Option&lt;Vec&lt;u8&gt;&gt;</code> as a version value</strong>: <code>None</code> is a tombstone, so deletes are ordinary writes and need no special structure.</li> <li><strong>Errors as data</strong>: <code>TxnError</code> is <code>Clone + PartialEq</code>, so the test compares the whole result, including which conflict, with the model's prediction.</li> <li><strong>A watermark from a <code>BTreeMap&lt;u64, usize&gt;</code></strong> of active read timestamps and counts gives the oldest snapshot in O(log n); <code>begin</code> and <code>commit</code> or <code>abort</code> maintain it, which is why a forgotten transaction pins garbage.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Model-based random interleavings (600 runs)</strong>: up to three open transactions over 12 keys; every <code>get</code>, <code>scan</code>, and commit result matches the model; commit timestamps are consecutive and read-only commits do not advance the clock.</li> <li><strong>Serial equivalence check</strong> for serializable runs, independent of the validation code: for each committed writer, every read key and every scanned range is identical at its snapshot and just before its commit.</li> <li><strong>Scenarios</strong>: lost update (second committer aborts, the counter is 11); write skew (allowed under snapshot, <code>ReadConflict</code> under serializable); phantom (a repeated scan returns the same rows in both modes; the writer based on the stale count commits under snapshot and aborts under serializable); a unique-index race (two concurrent inserts of the same email both commit under snapshot and one aborts under serializable).</li> <li><strong>Garbage collection</strong>: with a long-lived reader open, 40 rounds of random writes and deletes with GC every ten rounds leave the reader's whole view unchanged; with no readers, exactly one version per live key remains and deleted keys leave nothing.</li> <li><strong>Table layer (40 seeds × 150 transactions)</strong>: random inserts, updates and deletes with a nullable unique email index and a non-unique age index; duplicates, unique violations (NULLs never conflict) and missing rows return the model's errors; after every transaction the table equals the model, every index entry points at a row with matching columns, and the number of entries equals the number of rows; an index range scan returns what a filter does.</li> <li><strong>Mutants run against these tests</strong>: versions sorting oldest first; conflicts on versions at the transaction's own snapshot; no write validation; no point-read validation; no range validation; read-only transactions validated; scans or reads ignoring the transaction's own writes; GC ignoring readers, keeping tombstones or dropping the version a reader needs; read-only commits advancing the clock; rows written without index entries; deletes leaving index entries; duplicate keys accepted; NULLs conflicting in unique indexes; unique indexes not enforced. <strong>All 18 were killed.</strong> A 19th mutant removed a length check in the point read and survived: the key escape is prefix-free, so the check was redundant; the code now relies on that property and says so.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>CockroachDB</strong> stores MVCC versions as <code>key | timestamp</code> (newest first) in Pebble, runs serializable by default with timestamp-ordered reads that are <em>refreshed</em> (re-validated) when a transaction's timestamp has to move, and uses intents (provisional writes) to resolve write-write conflicts.</li> <li><strong>TiKV</strong> (Percolator) stores a lock column, a write column and a data column in RocksDB; snapshot isolation is the default and <code>SELECT … FOR UPDATE</code> takes locks. See distributed transactions for the protocol that replaces the single-node validation above.</li> <li><strong>PostgreSQL</strong> keeps versions in the heap with <code>xmin</code>/<code>xmax</code> and offers snapshot isolation as REPEATABLE READ and <strong>serializable snapshot isolation (SSI)</strong>, which tracks read-write dependencies and aborts on dangerous structures; it needs less aborting than backward read validation. <strong>MySQL/InnoDB</strong> uses locks plus MVCC reads; <strong>Oracle</strong>'s "serializable" is snapshot isolation.</li> <li><strong>FoundationDB</strong> validates read ranges against writes committed since the read version (optimistic, strictly serializable) and has a five-second transaction limit so its conflict history stays small.</li> <li><strong>Spanner</strong> uses two-phase locking with TrueTime commit timestamps for read-write transactions and lock-free snapshot reads at a timestamp for read-only ones.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Snapshot isolation is not serializable.</strong> Write skew on an invariant over several rows is the standard failure; either run serializable, or turn the invariant into a write on a shared key (<code>SELECT … FOR UPDATE</code>, a materialized conflict row).</li> <li><strong>Unique constraints under snapshot isolation need a unique key to write.</strong> Two concurrent inserts of the same email write different primary keys. Make the unique index entry's key <code>index | email</code> (without the primary key) so that the two inserts write the <em>same</em> key and first-committer-wins sees the conflict, as production systems do. The layer here checks by range scan, which the serializable validation covers; under snapshot it leaves the gap.</li> <li><strong>A forgotten transaction pins garbage.</strong> Show the oldest active transaction age in monitoring and set a timeout.</li> <li><strong>Validation cost grows with the read set.</strong> A transaction that scans a million keys validates a million versions at commit (the range check iterates the versions in range); production systems keep a timestamp cache or track ranges.</li> <li><strong>Time must be monotonic across nodes.</strong> One counter is fine on a single node; across nodes use a timestamp oracle or hybrid logical clocks (distributed transactions).</li> <li><strong>Aborts are normal.</strong> Clients must retry transactions that fail with a conflict; test the retry path, and retry with a new snapshot, not the old one.</li> <li><strong>Deletes are writes.</strong> A tombstone conflicts like any version, and an unbounded delete of a million rows is a million tombstones until GC.</li> </ul></aside>
