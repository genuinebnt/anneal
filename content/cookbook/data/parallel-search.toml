 14      2391484 |  2.54 ms 1.0x  1.92 ms 1.4x  1.40 ms 1.8x  1.73 ms 1.5x  1.88 ms 1.4x
 16     21523360 | 23.67 ms 1.0x 13.29 ms 1.8x  8.27 ms 2.9x  7.23 ms 3.3x  6.88 ms 3.4x
 18    193710244 |219.30 ms 1.0x120.41 ms 1.8x 70.20 ms 3.1x 57.20 ms 3.8x 49.86 ms 4.4x
```

<ul> <li><strong>Small problems get slower with threads</strong>: for 10 relations the sequential search takes 0.04 ms and 2 threads take 0.31 ms, 12 threads 1.05 ms: roughly 0.1 ms of thread start-up and join per layer, times nine layers. At 12 relations the sequential run (0.33 ms) still beats every parallel one. The break-even is near 14 relations (2.5 ms sequential, 1.4–1.9 ms with 2–4 threads).</li> <li><strong>Larger problems scale better</strong> (speedup at 12 threads: 1.4× at n = 14, 3.4× at n = 16, 4.4× at n = 18), as fixed per-layer costs get amortized. The practical rule: choose the thread count from the estimated work (<code>3&#94;n</code>-ish), and use one thread below a threshold.</li> </ul>

<aside data-call="note"><b>The break-even rule</b><p>Estimate the sequential time from the number of connected subsets (the lab's <code>prep</code> already counts them) and multiply by a measured cost per subset; use <code>min(cores, estimated_ms / 0.3)</code> threads, so a layer carries at least a few hundred microseconds of work per thread. Re-measure the constants when the hardware changes (<a href="/cookbook/p/cost-models">Q9</a>).</p></aside>
"""

[[sections]]
heading = "Parallel pruning"
body = """
<p>What the lab leaves open, and where the research is:</p>

<ul> <li><strong>Shared bounds.</strong> Threads publish the best complete plan cost found so far in an atomic; every thread prunes against it. The result is the optimum whatever the schedule, but the amount of work and the discovery order vary run to run.</li> <li><strong>Determinism.</strong> Resolve ties by a canonical order (lowest left mask, then lowest rule id) and never prune with <code>&lt;</code> against a bound found by another thread when <code>=</code> would change the chosen plan.</li> <li><strong>Job-based search.</strong> Decompose the memo search into jobs with dependencies (explore group G, apply rule R to expression E, optimize G under properties P) and run them on a pool, as Orca does. Parallelism comes from many independent groups, not from a single recursion, and duplicate jobs are avoided by marking groups as "being explored".</li> <li><strong>Distributed or GPU search.</strong> Layered DP maps naturally to a GPU (every subset of a layer is a thread block) and to a cluster (partition subsets by hash); the research systems show speedups for 20–30 relation joins where sequential DP takes minutes.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>std::thread::scope</code> for borrowed parallelism.</strong> Workers borrow the read-only cost table and graph tables (<code>&amp;Prep</code>, <code>&amp;[f64]</code>) with no <code>Arc</code>, no <code>'static</code>, and are all joined before the scope ends, so a layer is a few lines. <code>scope</code> is the idiomatic way to parallelize a computation over local data without a runtime.</li> <li><strong>Collect, then write.</strong> Each worker returns a <code>Vec&lt;(subset, cost)&gt;</code>; the main thread applies them after the barrier. That avoids shared mutable state during the layer entirely: no atomics, no locks, no <code>unsafe</code>, and the borrow checker proves it (the read-only borrow of <code>cost</code> ends before the writes). The alternative, writing disjoint entries through a raw pointer, saves a memcpy-sized merge and costs a proof obligation.</li> <li><strong>Atomics for the top-down memo</strong>: <code>AtomicU8</code> states and <code>AtomicU64</code> cost bits (<code>f64::to_bits</code>), claims by <code>compare_exchange(0, 1, AcqRel, Acquire)</code>, publication by a <code>Release</code> store of the state after the cost is written, and <code>Acquire</code> loads before reading it. The cost itself can be <code>Relaxed</code> because the state flag orders it.</li> <li><strong>Spinning with <code>yield_now</code></strong> keeps the lab simple; a production system parks the thread on a condition variable per bucket or uses a work-stealing pool (Rayon) that runs other jobs while one waits.</li> <li><strong>Rayon</strong> would reduce the layer to <code>sets.par_iter().map(best_split).collect()</code> with a work-stealing pool that is <em>reused</em> between layers; the lab spawns threads per layer on purpose, so that the per-layer start-up cost is visible and measurable (exercise 2).</li> <li><strong>Dense arrays beat hash maps</strong> for <code>n ≤ 24</code>: <code>Vec&lt;f64&gt;</code> indexed by the subset bitmask is a cache-friendly table with no hashing; <code>Vec&lt;bool&gt;</code> for connectivity. Past 24 relations use a hash map or a different algorithm.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>All variants agree with DPccp</strong>: for 60 random graphs (3–11 relations, every shape) and thread counts 1, 2, 3, 4 and 8, the layered search with and without work-sharing and the top-down search with and without claiming return the DPccp optimum (to 1e-9, relative).</li> <li><strong>Work accounting</strong>: the number of valid subsets equals the number of connected subsets; with claiming, the top-down search computes each connected subset of size ≥ 2 exactly once (the root is not stored); without it, never fewer.</li> <li><strong>Edge cases</strong>: two relations; thread counts larger than the number of subsets in a layer; threads that get no work.</li> <li><strong>Mutants run against these tests</strong>: skip the empty rest (the split <code>a = low</code>) in the enumeration (killed); skip the last submask (killed); the worker starts one pattern late (killed); the pattern bits are ignored (killed); the claim never reserves a subset (killed by the exactly-once assertion); the right side's connectivity is not checked (killed); the layer writes results to the wrong set (killed). Two plausible mutants were <em>equivalent</em> and survived for good reasons: stepping through patterns by <code>2 × threads</code> (when there are at most <code>threads</code> patterns it changes nothing) and using one pattern bit fewer (the free bits then cover the same splits). The explicit "an edge exists between the halves" check was removed as redundant, since both halves being connected inside a connected set implies it.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Most optimizers are single-threaded per query</strong> and parallel across queries: to our knowledge PostgreSQL, MySQL, SQL Server and Oracle plan each statement on the calling session's thread. The cost of a big plan is handled by <em>limits</em> (join collapse limits, search timeouts, GEQO, linearized fallbacks) rather than by more threads.</li> <li><strong>Orca</strong> (Greenplum/Cloudberry) runs its Cascades-style search as a <strong>multi-threaded job scheduler</strong>: jobs for exploring groups, implementing expressions and optimizing under properties, with explicit dependencies, a thread pool and group-level locking; the paper reports speedups from the scheduler on many-core machines.</li> <li><strong>Research on parallel dynamic programming</strong> (shared-memory and shared-nothing) parallelizes DPsize/DPsub/DPccp by layer or by size-pair, with load balancing by skip vectors, and on GPUs; report good speedups on many cores for large joins; the curve above shows the same pattern in miniature: nothing to gain below about a dozen relations.</li> <li><strong>Compile-time budgets</strong> are the real production constraint: an optimizer that spends 200 ms to save 20 ms on a 30 ms query is a regression, so engines choose the strategy (full DP, linearized DP, greedy) from the query's join count before choosing a thread count.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Thread start-up per layer</strong> (as in the lab) is a cost of 0.05–0.1 ms; below about 14 relations the parallel search loses. Reuse a pool and fall back to one thread for small queries.</li> <li><strong>Nondeterministic plans</strong> are a correctness problem for the <em>product</em> (cached plans differ between nodes, a test fails once a week). Break ties canonically and test with different thread counts.</li> <li><strong>Parallel results must equal sequential ones</strong>: make "same cost as the sequential run for every thread count" a test, not a hope.</li> <li><strong>Shared-memo contention hides in the counters</strong>: the <code>waits</code> and <code>computed</code> counters show what the clock cannot; report them next to the speedup.</li> <li><strong>Efficiency cores and hyperthreads</strong>: going from 8 to 12 threads added nothing here (3.6× against 3.5×); measure on the target machine and do not read a core count as a capacity.</li> <li><strong>Do not parallelize what a better algorithm shortcuts</strong>: DPccp finds the same optimum for a clique-16 in a fraction of the time (<a href="/cookbook/p/join-ordering">Q4</a>); a connected-pairs enumerator beats 12 threads of subset enumeration for sparse graphs.</li> <li><strong>False sharing and write contention</strong>: per-thread output vectors that are later merged avoid both; a shared <code>Vec&lt;AtomicU64&gt;</code> indexed by subset puts neighbouring subsets on one cache line.</li> </ul></aside>
"""
