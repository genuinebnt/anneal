[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(These two lectures have no published notes; the ideas below are the problem's own, not a summary of what was said in them.)</em></p>

<ul> <li><strong>Why parallelize the optimizer at all?</strong> For most queries it does not pay: planning a 5-table query takes microseconds, a thread start costs more, and a server already runs many queries in parallel (one optimizer thread per query <em>is</em> the parallelism). It matters for <strong>one big query</strong>: BI tools and ORMs generate 20–100-table joins, where exhaustive dynamic programming takes seconds, the user is waiting, and the cores are idle. The measurements below put the break-even near 14 relations.</li> <li><strong>Bottom-up dynamic programming parallelizes by layers.</strong> The best plan for a set of relations depends only on the best plans of its <em>smaller</em> subsets, so all sets of the same size are independent: a parallel loop per size, a barrier between sizes. No locks are needed during a layer if the table is read-only inside it; results are collected and written after the barrier.</li> <li><strong>Work per subset grows as 2&#94;k</strong>, but the number of subsets of size k is C(n, k): the middle layers hold most of the work, and the top layers have a handful of subsets each. That is the Amdahl worry (few parallel tasks at the end) and the reason to consider splitting <em>one</em> subset's split enumeration across workers. Whether that matters is an empirical question; here it does not.</li> <li><strong>Top-down (memoized, Cascades-style) search is harder to parallelize.</strong> All threads want the same memo entries: if each computes any missing entry it needs, the same subset is computed several times (<strong>duplicated work</strong>); if an entry is <em>claimed</em> by the first thread and the others wait for it, work is not duplicated but threads <strong>stall</strong>. Waiting cannot deadlock here because a thread computing a set only waits on strictly smaller sets, so wait chains end.</li> <li><strong>Branch-and-bound pruning fights parallelism.</strong> The reason to search top-down is to prune: a bound from a plan found early cuts the rest of the space. Threads exploring different branches find bounds at different times, so the amount of work depends on the schedule and, worse, <strong>which plan is returned can depend on timing</strong> unless ties and bounds are resolved canonically. An optimizer that returns different plans on different runs is a debugging nightmare.</li> <li><strong>Granularity and overhead decide.</strong> Starting threads per layer costs on the order of 50–100 µs; a layer must carry far more than that in work. Production designs use a thread pool, a job queue with dependencies (Orca's search is a scheduler running jobs such as "explore group", "implement expression", each declaring its prerequisites), and fall back to one thread for small queries.</li> <li><strong>Cheaper than parallelism</strong>: for very large joins the right answer is rarely more cores but a smaller space: linearized DP, iterative DP and greedy heuristics (<a href="/cookbook/p/join-ordering">Q4</a>) turn <code>3&#94;n</code> into a polynomial.</li> </ul>
"""

[[sections]]
heading = "The lab"
body = """
<p>A cross-product-free DPsub over connected subsets with <code>C_out</code>, in four variants, all returning the same optimum as the sequential algorithm and DPccp (<a href="/cookbook/p/join-ordering">Q4</a>):</p>

<ol> <li><strong>Bottom-up layers.</strong> Precompute dense tables over all <code>2&#94;n</code> subsets (cardinality, connectivity). For each size <code>k</code>, split that layer's connected subsets into one chunk per thread (<code>std::thread::scope</code>), compute each subset's best split from the read-only cost table, then write the layer's results.</li> <li><strong>Layers + split big subsets.</strong> When a layer has fewer than <code>2 × threads</code> subsets, share each subset between the workers instead: the lowest relation is fixed on the left side, the top <code>log2(threads)</code> of the remaining bits select a pattern, and each worker enumerates the submasks for its patterns.</li> <li><strong>Top-down, shared memo, duplicates allowed.</strong> Per subset an atomic state and the cost bits; each thread takes every <code>threads</code>-th valid split of the full set and recurses into both sides through the shared memo, computing whatever it finds missing.</li> <li><strong>Top-down, claim and wait.</strong> The first thread to compare-and-swap a subset's state from <code>unseen</code> to <code>computing</code> computes it; any other thread yields and retries until the state is <code>done</code>.</li> </ol>

:::deeper Reference: dense preparation, sequential and layered DPsub, work-sharing inside a subset, shared-memo top-down with and without claiming
```rust title="src/opt/pdp.rs"
//! Parallel join-order search over connected subsets (DPsub), cross-product free, `C_out` cost.
//!   * bottom-up, layer by layer: all subsets of size k depend only on smaller subsets, so a layer is a parallel loop; the top layers
//!     have fewer subsets than threads, so the *hybrid* variant also splits one subset's split enumeration across threads;
//!   * top-down with a shared memo: every thread recurses from the root; with `claim` a subset is computed by exactly one thread
//!     (others wait for it), without it threads may compute the same subset twice.
use std::sync::atomic::{AtomicU64, AtomicU8, Ordering::*};
use crate::joinorder::Graph;

/// Dense tables over all 2^n subsets: cardinality of the join of the subset and whether it is connected.
pub struct Prep { pub n: usize, pub card: Vec<f64>, pub conn: Vec<bool> }
pub fn prep(g: &Graph) -> Prep {
    let n = g.n;
    assert!(n <= 24);
    let full = 1usize << n;
    let mut card = vec![1.0; full];
    let mut conn = vec![false; full];
    for s in 1..full {
        let low = s & s.wrapping_neg();
        let rest = s ^ low;
        let i = low.trailing_zeros() as usize;
        card[s] = if rest == 0 { g.card[i] } else { card[rest] * g.card[i] * g.cross_sel(1 << i, rest as u64) };
        conn[s] = g.connected(s as u64);
    }
    Prep { n, card, conn }
}
impl Prep {
    /// Is `a ⋈ (s \\ a)` a valid split of the connected set `s`? Both sides must be connected; an edge between them then exists
    /// automatically (otherwise `s` would be disconnected), so no further check is needed.
    #[inline] fn valid(&self, a: u32, b: u32) -> bool { self.conn[a as usize] && self.conn[b as usize] }
}

/// Best split of `s` over the submasks `a` of `s` with fixed bits `fixed` and any subset of `free` (always containing the lowest bit of s).
fn best_split(p: &Prep, cost: &[f64], s: u32, fixed: u32, free: u32) -> (f64, u32) {
    let mut best = (f64::INFINITY, 0u32);
    let mut sub = free;
    loop {
        let a = fixed | sub;
        if a != 0 && a != s {
            let b = s ^ a;
            if p.valid(a, b) {
                let c = cost[a as usize] + cost[b as usize] + p.card[s as usize];
                if c < best.0 { best = (c, a); }
            }
        }
        if sub == 0 { break; }
        sub = (sub - 1) & free;
    }
    best
}

/// Sequential reference.
pub fn dpsub_seq(g: &Graph) -> f64 { dpsub_layers(&prep(g), 1, false).0 }

/// Bottom-up by layers with `threads` workers. With `hybrid`, a layer that has fewer subsets than `2 * threads` splits the work
/// inside each subset instead (the lowest bit is fixed in `a`; the other bits are divided between workers by their top bits).
/// Returns (cost of the full set, number of valid subsets).
pub fn dpsub_layers(p: &Prep, threads: usize, hybrid: bool) -> (f64, usize) {
    let n = p.n;
    let full = (1u32 << n) - 1;
    let mut cost = vec![f64::INFINITY; 1 << n];
    for i in 0..n { cost[1 << i] = 0.0; }
    let mut by_size: Vec<Vec<u32>> = vec![vec![]; n + 1];
    for s in 1..=full { if p.conn[s as usize] { by_size[s.count_ones() as usize].push(s); } }
    let mut valid_sets = n;
    for k in 2..=n {
        let sets = &by_size[k];
        valid_sets += sets.len();
        let mut results: Vec<(u32, f64)> = Vec::with_capacity(sets.len());
        if threads == 1 {
            for &s in sets { let low = s & s.wrapping_neg(); results.push((s, best_split(p, &cost, s, low, s ^ low).0)); }
        } else if hybrid && sets.len() < 2 * threads {
            // few, expensive subsets: share each one between the workers
            let r = (threads as f64).log2().floor() as u32;
            for &s in sets {
                let low = s & s.wrapping_neg();
                let rest = s ^ low;
                // the top r bits of `rest` select a pattern; each worker takes patterns round-robin
                let mut hi_bits: Vec<u32> = vec![];
                let mut x = rest;
                while x != 0 && (hi_bits.len() as u32) < r { let b = 31 - x.leading_zeros(); hi_bits.push(1 << b); x ^= 1 << b; }
                let patterns = 1u32 << hi_bits.len();
                let lo_free = x;
                let cost_ref = &cost;
                let best = std::thread::scope(|sc| {
                    let hs: Vec<_> = (0..threads).map(|t| {
                        let hb = hi_bits.clone();
                        sc.spawn(move || {
                            let mut best = f64::INFINITY;
                            let mut pat = t as u32;
                            while pat < patterns {
                                let fixed = low | hb.iter().enumerate().filter(|(i, _)| pat >> i & 1 == 1).fold(0, |m, (_, b)| m | b);
                                best = best.min(best_split(p, cost_ref, s, fixed, lo_free).0);
                                pat += threads as u32;
                            }
                            best
                        })
                    }).collect();
                    hs.into_iter().map(|h| h.join().unwrap()).fold(f64::INFINITY, f64::min)
                });
                results.push((s, best));
            }
        } else {
            let chunk = sets.len().div_ceil(threads).max(1);
            let cost_ref = &cost;
            std::thread::scope(|sc| {
                let hs: Vec<_> = sets.chunks(chunk).map(|part| sc.spawn(move || {
                    part.iter().map(|&s| { let low = s & s.wrapping_neg(); (s, best_split(p, cost_ref, s, low, s ^ low).0) }).collect::<Vec<_>>()
                })).collect();
                for h in hs { results.extend(h.join().unwrap()); }
            });
        }
        for (s, c) in results { cost[s as usize] = c; }
    }
    (cost[full as usize], valid_sets)
}

/// Shared memo for the top-down search: per subset a state (0 unseen, 1 being computed, 2 done), the cost bits and the left side.
pub struct Memo { state: Vec<AtomicU8>, cost: Vec<AtomicU64>, pub computed: AtomicU64, pub waits: AtomicU64 }
impl Memo {
    fn new(n: usize) -> Self {
        let m = Memo { state: (0..1usize << n).map(|_| AtomicU8::new(0)).collect(), cost: (0..1usize << n).map(|_| AtomicU64::new(0)).collect(), computed: AtomicU64::new(0), waits: AtomicU64::new(0) };
        for i in 0..n { m.cost[1 << i].store(0f64.to_bits(), Relaxed); m.state[1 << i].store(2, Relaxed); }
        m
    }
}
fn solve(p: &Prep, m: &Memo, s: u32, claim: bool) -> f64 {
    loop {
        match m.state[s as usize].load(Acquire) {
            2 => return f64::from_bits(m.cost[s as usize].load(Relaxed)),
            1 if claim => { m.waits.fetch_add(1, Relaxed); std::thread::yield_now(); continue; }
            0 if claim => { if m.state[s as usize].compare_exchange(0, 1, AcqRel, Acquire).is_err() { continue; } }
            _ => {}
        }
        break;
    }
    // compute (without `claim`, several threads may get here for the same subset)
    let low = s & s.wrapping_neg();
    let free = s ^ low;
    let mut best = f64::INFINITY;
    let mut sub = free;
    loop {
        let a = low | sub;
        if a != s {
            let b = s ^ a;
            if p.valid(a, b) { best = best.min(solve(p, m, a, claim) + solve(p, m, b, claim) + p.card[s as usize]); }
        }
        if sub == 0 { break; }
        sub = (sub - 1) & free;
    }
    m.computed.fetch_add(1, Relaxed);
    m.cost[s as usize].store(best.to_bits(), Relaxed);
    m.state[s as usize].store(2, Release);
    best
}

/// Top-down with `threads` workers sharing one memo. The root's valid splits are dealt out to the workers round-robin; each worker
/// recurses into its splits' two sides through the shared memo. Returns (cost, subsets computed (> the number of distinct
/// subsets means duplicated work), spin waits).
pub fn topdown(p: &Prep, threads: usize, claim: bool) -> (f64, u64, u64) {
    let n = p.n;
    let full = (1u32 << n) - 1;
    let memo = Memo::new(n);
    let low = full & full.wrapping_neg();
    let mut splits = vec![];
    let free = full ^ low;
    let mut sub = free;
    loop {
        let a = low | sub;
        if a != full && p.valid(a, full ^ a) { splits.push(a); }
        if sub == 0 { break; }
        sub = (sub - 1) & free;
    }
    let mins: Vec<f64> = std::thread::scope(|sc| {
        let hs: Vec<_> = (0..threads).map(|t| {
            let (memo, splits) = (&memo, &splits);
            sc.spawn(move || {
                let mut best = f64::INFINITY;
                for &a in splits.iter().skip(t).step_by(threads) { best = best.min(solve(p, memo, a, claim) + solve(p, memo, full ^ a, claim) + p.card[full as usize]); }
                best
            })
        }).collect();
        hs.into_iter().map(|h| h.join().unwrap()).collect()
    });
    (mins.into_iter().fold(f64::INFINITY, f64::min), memo.computed.load(Relaxed), memo.waits.load(Relaxed))
}

/// Number of connected subsets of size >= 2 (the number of subsets a duplicate-free search computes, besides the root).
pub fn connected_subsets(p: &Prep) -> usize { (1..(1usize << p.n)).filter(|&s| p.conn[s] && s.count_ones() >= 2).count() }

/// Sequential time per layer: (size k, number of subsets, seconds). Shows where the work is.
pub fn layer_profile(p: &Prep) -> Vec<(usize, usize, f64)> {
    let n = p.n;
    let full = (1u32 << n) - 1;
    let mut cost = vec![f64::INFINITY; 1 << n];
    for i in 0..n { cost[1 << i] = 0.0; }
    let mut by_size: Vec<Vec<u32>> = vec![vec![]; n + 1];
    for s in 1..=full { if p.conn[s as usize] { by_size[s.count_ones() as usize].push(s); } }
    let mut out = vec![];
    for k in 2..=n {
        let t0 = std::time::Instant::now();
        for &s in &by_size[k] { let low = s & s.wrapping_neg(); cost[s as usize] = best_split(p, &cost, s, low, s ^ low).0; }
        out.push((k, by_size[k].len(), t0.elapsed().as_secs_f64()));
    }
    out
}
```
