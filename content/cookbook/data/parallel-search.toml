<ul> <li><strong>Layer-parallel DP speeds up 1.8–1.9× with 2 threads, 3.3× with 4 and about 3.5× with 8 and 12 on a 16-relation clique (23 ms to 7 ms), 4.3× on an 18-relation star (85 ms to 20 ms).</strong> It is correct at every thread count: all variants return the same cost as DPccp for 60 random graphs.</li> <li><strong>It does not scale past about 4× on this machine, and Amdahl is not the reason</strong>: the top three layers (sizes <code>n−2…n</code>) hold only 4–5% of the work, so a serial tail cannot cap the speedup near 4. The evidence below points at fixed costs per layer and at the mix of core types (12 threads are no faster than 8 here); we did not isolate which dominates.</li> <li><strong>Splitting big subsets inside a layer buys nothing</strong>: 3.5× against 3.5× at 8 threads, and slightly worse at 12 (2.9×, more threads to start for no more work). The idea is sound where the last layers dominate (a cost structure with few huge subsets); for DPsub's work distribution they do not.</li> <li><strong>Top-down with a shared memo is slower than sequential bottom-up at every thread count here</strong> (0.3–0.7× on the clique, 1.0–3.0× on the star; the speedups are relative to the sequential bottom-up baseline, and sequential top-down is about 4× slower than it on the clique (93 ms against 23 ms) but equal on the star (82 ms against 85 ms). Recursion and an atomic load or store on every memo access are the suspects; we did not isolate the cause). Against its own single-thread time it speeds up 2.4× at 12 threads on the clique (93 ms to 39 ms) and 2.8× on the star (82 ms to 29 ms).</li> <li><strong>Without claiming, threads duplicate 1.2–1.7× of the work</strong> (clique: 80 223 to 109 034 subset computations instead of 65 518 as more threads race to the same missing entries). <strong>With claiming, every subset is computed exactly once at every thread count</strong> (the test asserts it), but threads spend their time spinning: up to 327 000 waits at 4 threads for 65 518 subsets. Neither version wins: the time saved by not duplicating is spent waiting.</li> <li><strong>Branch-and-bound is absent, and that is the point.</strong> This top-down search has no pruning, so it computes the same set of subsets as the bottom-up one, and parallelizing it only adds coordination. Top-down is worth its cost when pruning cuts the space; parallel pruning is the unsolved part (below).</li> </ul>

```text title="bottom-up speedup as the problem grows"
bottom-up layers (time, speedup) as the problem grows: clique
  n   work 3^n/2 |         1 thr         2 thr         4 thr         8 thr        12 thr
 10        29524 |  0.04 ms 1.1x  0.31 ms 0.2x  0.46 ms 0.1x  0.71 ms 0.1x  1.05 ms 0.0x
