[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Index vs filter</strong>: an index answers <em>where</em> the data is; a filter answers <em>whether</em> it exists. A cheap "no" saves an expensive search (a filter per hash bucket, per SSTable, per partition).</li> <li><strong>Bloom filter</strong>: a bit array plus k hash functions. Insert sets k bits; a lookup checks them. There are <strong>no false negatives</strong>, and the false-positive rate is tunable with m and k. You can't delete. Variants: <strong>counting Bloom</strong> (counters, supports delete), <strong>cuckoo filter</strong> (fingerprints in cuckoo buckets, supports delete), <strong>succinct range filters</strong> (an immutable compact trie that also answers range queries, e.g. SuRF).</li> <li><strong>Skip list</strong>: layered linked lists, each level about half the size of the one below. O(log n) expected, ordered, no rebalancing. Insert bottom-up (so readers never see a half-linked node; a single CAS per level suffices), and delete by marking first and unlinking top-down later. It's the classic <strong>memtable</strong> structure. The downsides: poor cache and disk locality, and awkward reverse scans.</li> <li><strong>Trie</strong>: keys as sequences of digits (bits or bytes). The shape depends only on the key set, not insertion order; there's no rebalancing; operations are O(key length); and a trie can answer "no such key" early, unlike a B+Tree, which must reach a leaf. <strong>Span</strong> = bits per level = fan-out. <strong>Horizontal compression</strong> stores nodes as arrays; <strong>vertical compression</strong> (a <em>radix tree</em>) collapses single-child chains, so matches must be verified against the tuple.</li> <li><strong>Inverted index</strong>: term → <strong>posting list</strong> of record ids, for keyword search. Lucene stores the term dictionary as an immutable <strong>finite state transducer</strong> (merged in the background), with delta-compressed and bit-packed postings. PostgreSQL's <strong>GIN</strong> uses a B+Tree of terms, with a posting list or posting tree per term and a <em>pending list</em> that batches inserts. Enhancements: ranking (term frequency), tokenizers and n-grams for fuzzy search and autocomplete.</li> <li><strong>Vector index</strong>: embeddings (float arrays) where semantic similarity is geometric closeness. Nearest-neighbour queries have <strong>no single correct answer</strong>, and filtering before or after the search matters. <strong>IVF</strong> (k-means centroids plus inverted lists; probe the nearest lists; quantize to shrink them) and <strong>graph indexes</strong> (a neighbour graph with greedy search; <strong>HNSW</strong> adds skip-list-like layers). Implementations: FAISS, hnswlib, pgvector.</li> <li><strong>Index optimizations</strong>: <strong>partial indexes</strong> (<code>CREATE INDEX … WHERE …</code>) index a subset; <strong>include columns</strong> store extra non-key columns in the leaves for <strong>index-only scans</strong>.</li> </ul>
"""

