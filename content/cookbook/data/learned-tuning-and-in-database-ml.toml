<ul> <li><strong>The knobs that matter are few and data-dependent.</strong> By main-effect variance: for IVF <code>nprobe</code> explains 36–75% of the variation in (penalized) cost and <code>nlist</code> 7–20%; for HNSW <code>M</code> explains 39–51%, <code>ef</code> 28–43% and <code>efConstruction</code> only 2–9% (it governs build time and quality, not query cost, so a cost-only tuner would wrongly ignore it; tune build cost as a second objective). This is OtterTune's knob-ranking step, computed here by exact ANOVA instead of Lasso.</li> <li><strong>The optimum moves with the data</strong>: IVF is best at <code>nlist=256, nprobe=8</code> on dataset A (1 280 distance computations per query), at <code>nlist=128, nprobe=3</code> on B (971), and needs <code>nlist=512, nprobe=128</code> on C (9 661, a third of the collection scanned). HNSW: <code>M=8, efC=50, ef=50</code> (429) on A, <code>M=16, efC=100, ef=20</code> (364) on B, <code>M=16, efC=200, ef=80</code> (1 803) on C.</li> <li><strong>A random feasible configuration is 6–7× worse than the best for IVF on A and B, 1.8–1.9× for HNSW</strong>: IVF is unforgiving, HNSW is flat near its optimum.</li> <li><strong>Rules of thumb are fine on easy data and fail on hard data.</strong> <code>nlist 128, nprobe 8</code> is 1.7× the optimum on A, 2.2× on B, and <strong>misses the recall target on C (recall 0.516)</strong>; the HNSW setting <code>M 16, efC 200, ef 50</code> is 1.8× and 1.6× the optimum on A and B and misses on C (0.879). A default that meets its target on the data it was developed on silently fails on a harder collection.</li> <li><strong>Bayesian optimization needs a fraction of the evaluations.</strong> With 20 evaluations out of 91 to 112 configurations, BO is within 5% of the optimum in <strong>99–100%</strong> of 200 seeds on five of the six spaces (74% on HNSW dataset A, 100% at 40), against <strong>14–43%</strong> for random search and 12–64% for hill climbing. At 10 evaluations BO is still within 1.2× of the optimum on average on most spaces (1.14×–1.36×), where random search averages 1.4×–2.4×.</li> <li><strong>Hill climbing is fragile under a hard constraint</strong>: at small budgets it averages 6.9×–11× the optimum on IVF dataset A (restarts land in infeasible regions and the penalty gradient is flat), is competitive at 40 evaluations on A and B (1.03×–1.04×), and is the <em>worst</em> strategy on dataset C's IVF space (1.62× at 40), where the feasible region is small (20 of 91) and plateaus trap it.</li> <li><strong>Transfer helps only between similar workloads.</strong> Dataset A's optimum applied to B costs 1.30× the optimum for IVF and <strong>misses the recall target</strong> for HNSW (0.940); on C it misses badly (IVF 0.405, HNSW 0.645). Warm-starting BO with A's three best configurations improves the five-evaluation result on B (1.30× against 1.94× cold for IVF, 1.22× against 1.54× for HNSW) but makes it <strong>worse on C</strong> (3.12× against 2.34×, 3.16× against 1.86×): the prior points sit in the wrong region. This is why OtterTune first <em>maps</em> the new workload to the most similar known one by its metrics and only then reuses data.</li> <li><strong>Feature leakage inflates the offline score by 23 points</strong>: a classifier trained and evaluated with the future-leaking join reaches accuracy 0.813; with the point-in-time (as-of) join the same task gives 0.585; served online, where only past features exist, the leaky model scores 0.582, no better than the honest one. The as-of join of <a href="/cookbook/p/time-series-databases">S1</a> is the fix, and the test checks that it never returns a value from after the label time or from another user.</li> </ul>

<aside data-call="note"><b>The tabular-benchmark trick</b><p>Measuring every configuration is only possible because the spaces are small. The point is methodological: it makes strategies comparable across hundreds of random seeds at zero cost, with a known optimum, and it separates <em>tuner quality</em> from <em>evaluation noise</em>. In production the opposite holds (large space, few noisy evaluations), so use the tabular result to choose and configure the tuner, then validate it on the real system with repeated measurements.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A GP in ~60 lines of safe Rust</strong>: <code>Vec&lt;Vec&lt;f64&gt;&gt;</code> kernel matrix, a hand-written Cholesky (<code>Option</code> return, <code>None</code> when not positive definite) and two triangular solves; the posterior variance is <code>1 − vᵀv</code> with <code>v = L⁻¹ k*</code>. A small noise term (<code>1e-4</code> on standardized targets) keeps the factorization stable. Production code would use <code>nalgebra</code> or <code>faer</code>, but the algebra fits in a page and is easy to test.</li> <li><strong>Float discipline</strong>: <code>f64::total_cmp</code> for every comparison and sort (NaNs get a place instead of a panic), explicit tie-breaks (<code>then(b.cmp(&amp;a))</code>) so tuners are deterministic for a seed, and <code>max_by</code>/<code>min_by</code> on iterators instead of manual loops.</li> <li><strong>Mixed-radix indexing</strong> (<code>encode</code>/<code>decode</code>) turns a multi-knob configuration into one <code>usize</code>, so visited-sets are <code>Vec&lt;bool&gt;</code> and results are plain index vectors; neighbours are computed by changing one digit.</li> <li><strong>Lazy, shared tables with <code>OnceLock</code></strong>: building six real tables takes 44 s, so the tests compute them once (<code>static T: OnceLock&lt;…&gt;</code>) and every test reads them; <code>par_map</code> from <a href="/cookbook/p/vector-databases">S2</a> parallelizes ground truth.</li> <li><strong>Closures as surfaces</strong>: <code>synth(|knobs| (cost, recall), values, target)</code> builds a table from a function, which is how the tuners are tested against surfaces with known optima (a smooth bowl, a trap where the cheapest configurations are infeasible) without touching the expensive real tables.</li> <li><strong>No global state in tuners</strong>: every strategy takes <code>&amp;Table</code>, a budget and an <code>&amp;mut Rng</code> and returns the visited configurations in order; comparing them is a loop over seeds.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Numerics</strong>: Cholesky factors reproduce the matrix and solve <code>A x = b</code> for random SPD matrices of sizes 1–12, and refuse an indefinite matrix; the normal CDF matches reference values (to 2e-6), the density matches; expected improvement is never negative, grows with uncertainty and with a better mean, equals the certain gain when the deviation is zero, and agrees with a 200 000-sample Monte Carlo estimate.</li> <li><strong>The GP</strong>: it interpolates six training points to within 0.01 with near-zero deviation there, is moderately confident between them, and is far less confident at a distant point; the length scale chosen by marginal likelihood is larger for smooth data than for rapidly oscillating data.</li> <li><strong>Tables</strong>: encode/decode round trip; scaled knob values lie in [0, 1] and geometric knob values are evenly spaced on the log scale; the optimum is feasible and minimal among feasible configurations; every infeasible configuration scores worse than every feasible one; neighbour counts at corners and interior; knob importance gives a dominant additive knob more than 95% and an irrelevant one under 2%.</li> <li><strong>Strategies</strong>: lengths equal <code>min(budget, n)</code> for budgets 1–500, no configuration is evaluated twice, every strategy finds the optimum when the budget covers the table, warm-start configurations are used first and in order.</li> <li><strong>Performance properties</strong>: on a smooth 144-configuration surface BO lands within 25% of the optimum in 12 evaluations in at least 60 of 100 seeds and beats random search by at least 20; on a table where the cheapest configurations are infeasible, constrained BO finds the boundary optimum with 6 evaluations in at least 70% of 200 seeds, 40 more than random search.</li> <li><strong>Real tables</strong>: an IVF probing every list scans every vector and has recall 1.0.</li> <li><strong>Leakage</strong>: the as-of join never returns a feature after the label time or for another user, and the leaky join inflates offline accuracy by more than 0.15 while the online score of the leaky model stays within 0.03 of the honest one.</li> <li><strong>Mutants run against these tests</strong>: EI with the wrong sign; the normal CDF flipped for negative arguments; Cholesky without the division; posterior variance with the wrong sign; the length scale of lowest marginal likelihood chosen; BO choosing the lowest acquisition value; BO ignoring the probability of feasibility (<strong>survived the unconstrained smooth-surface test; killed by the trap table</strong>); linear instead of logarithmic knob scaling; importance not normalized; random search repeating configurations; the optimum ignoring the constraint; neighbours missing (all killed). One mutant (hill climbing with a loop bound of <code>budget + 1</code>) is equivalent because the result is truncated to the budget.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>OtterTune</strong> (CMU spin-off; Van Aken et al., SIGMOD 2017) collects the DBMS's internal metrics, prunes them (factor analysis and clustering), ranks knobs (Lasso), maps the target workload to a similar past one, and recommends configurations with a GP, with a repository of past tuning sessions as the transferable asset; later work added deep-learning variants and safety.</li> <li><strong>CDBTune, QTune</strong> (deep reinforcement learning on cloud databases) and <strong>BestConfig, iTuned</strong> (search and sampling) are the other published families; evaluations of them (Zhang et al., VLDB 2022, "An Experimental Evaluation of Database Knob Tuning") find that surrogate-model-based methods with good knob selection are the most sample-efficient and that most of the gain comes from a few knobs.</li> <li><strong>Akamas</strong> applies the same loop across the stack (database, JVM, containers, OS) with explicit goals and constraints and a staging environment; <strong>Alibaba</strong> describes domain-knowledge-augmented tuning, combining DBA rules (bounds, dependencies, known good regions) with learning to cut the search space and guard safety.</li> <li><strong>Cloud databases</strong> increasingly tune automatically (Aurora and Azure SQL auto-tuning of indexes and some parameters, Oracle autonomous databases), usually conservatively: bounded knob ranges, shadow testing, and rollback on regression.</li> <li><strong>PostgresML</strong> exposes <code>pgml.train</code>, <code>pgml.predict</code> and embedding functions inside PostgreSQL, with models loaded in the database process or a companion service, trading data movement for operational coupling; <strong>feature stores</strong> (Feast, Tecton, FeatureForm, Databricks Feature Store) define features once, materialize them offline (warehouse) and online (key-value store) and join them <strong>point-in-time</strong>; <strong>FeatureBase</strong> pursues fast feature analytics with bitmap indexes.</li> <li><strong>Index advisors</strong> (PostgreSQL's <code>hypopg</code>, SQL Server's Database Engine Tuning Advisor, Db2's Design Advisor, research systems such as AutoAdmin and Dexter) are the older, rule-and-cost-based form of automated physical design; they evaluate candidate indexes with <em>what-if</em> optimizer calls instead of real runs.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Never tune on production.</strong> An unproven configuration can crash or stall the system. Tune on a clone with a replayed workload, then roll out gradually with automatic rollback.</li> <li><strong>Noise masks the signal.</strong> Repeat measurements, report the median and an interval, and warm up caches; a tuner that chases noise will "find" configurations that are not better. The lab's deterministic cost metric avoids this; real latency does not.</li> <li><strong>Optimizing one metric moves another</strong>: lowering latency by raising <code>ef</code> or <code>nprobe</code> raises CPU; a bigger buffer pool lowers I/O and raises restart time. State constraints explicitly (as the recall target here) and track the secondary metrics.</li> <li><strong>A tuned configuration can be fragile</strong>: the best point sits at the edge of the feasible region (recall 0.951 against a target of 0.95 for several optima above). Leave a safety margin or tune against a held-out query set, because tomorrow's queries will differ.</li> <li><strong>Transfer can hurt.</strong> Reusing data from a dissimilar workload (negative transfer: 3.1× against 2.3× above) is worse than starting cold. Measure workload similarity before reuse, and fall back to cold start when it is low.</li> <li><strong>Knob dependencies and hard limits</strong>: some settings multiply (memory per connection × connections), some need restarts, some are bounded by hardware. Encode them as constraints or as a feasibility oracle, not as penalties the optimizer discovers by crashing.</li> <li><strong>Don't tune a moving target once</strong>: workloads drift; schedule re-tuning, detect drift (query mix, data distribution) and keep the previous configuration as a rollback.</li> <li><strong>Rules of thumb are defaults, not guarantees</strong>: verify every default against the recall (or latency) target on your own data (the <code>nlist 128, nprobe 8</code> default missed the target on the hardest dataset).</li> <li><strong>Feature joins must be point-in-time.</strong> Any join of labels with "the latest" features, aggregates computed after the label time, or training windows that overlap the evaluation window leaks the future. Test pipelines with a time-shifted holdout and check that every feature timestamp precedes its label timestamp.</li> </ul></aside>
