[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from the tuning and feature-store literature, not a summary of any speaker.)</em></p>

<ul> <li><strong>Configuration is a hidden part of performance.</strong> A database exposes hundreds of <strong>knobs</strong> (PostgreSQL and MySQL each have several hundred): buffer sizes, parallelism, cost constants, checkpoint intervals, index parameters. A few dominate; they interact; the best setting depends on the <strong>workload</strong>, the <strong>data</strong> and the <strong>hardware</strong>; and defaults are chosen to be safe everywhere, hence rarely good anywhere. Human tuning is rules of thumb plus trial and error.</li> <li><strong>Tuning is constrained black-box optimization.</strong> Minimize a cost (latency, resource use) or maximize throughput <strong>subject to constraints</strong> (recall at least 0.95, memory under a budget, p99 under an SLA), where each evaluation means <em>running the workload</em>, which takes seconds to hours and is noisy. So the metric that matters is <strong>evaluations to reach a good configuration</strong>, not compute per evaluation.</li> <li><strong>The standard ML recipe (OtterTune, SIGMOD 2017)</strong>: <em>characterize the workload</em> by the system's own internal metrics, <em>prune</em> redundant metrics and <em>rank knobs</em> by importance (feature selection such as Lasso), <em>map</em> a new workload to the most similar previously seen one to reuse its observations, and <em>recommend</em> the next configuration with a <strong>Gaussian process</strong> (a model of the cost surface that also says how unsure it is) and an <strong>acquisition function</strong> such as expected improvement. Other families: search heuristics, reinforcement learning over knob settings (CDBTune, QTune), and <strong>domain-knowledge</strong> methods that restrict the space with rules and bounds before learning.</li> <li><strong>Why a GP?</strong> Evaluations are scarce, so the model must be sample-efficient and calibrated. A GP predicts a mean and an uncertainty at every untried configuration; expected improvement picks the configuration with the best trade-off between <em>exploiting</em> a promising region and <em>exploring</em> an unknown one; with a second GP for each constraint, <strong>constrained EI</strong> multiplies by the probability of being feasible.</li> <li><strong>Practical obstacles</strong> decide whether tuning works in production: <strong>noise</strong> (benchmark variance can exceed the effect being measured), <strong>safety</strong> (never try an untested configuration on the production database; tune on a clone or replica), <strong>restart-required knobs</strong>, <strong>dependent knobs</strong> (memory per connection times connections must fit), <strong>dynamic workloads</strong> (the optimum moves; tune online or re-tune), <strong>transfer</strong> (observations from another workload help only if it is similar), and <strong>what to optimize</strong> (throughput versus tail latency versus cost).</li> <li><strong>In-database ML</strong> moves the model to the data: PostgresML trains and serves models with SQL inside PostgreSQL; <strong>feature stores</strong> (FeatureForm, FeatureBase and others) compute features once and serve them consistently for training (offline) and prediction (online). Their hardest problem is <strong>correctness over time</strong>: the training set must contain, for each example, the feature values <em>known at that example's timestamp</em>. A "latest value" join leaks the future, and the model looks excellent offline and fails in production (<strong>training/serving skew</strong>).</li> <li><strong>Learned components in the rest of the book</strong>: learned cardinality estimators (<a href="/cookbook/p/cardinality-estimation">Q8</a>), learned cost models and optimizers with execution feedback (<a href="/cookbook/p/cost-models">Q9</a>, <a href="/cookbook/p/adaptive-and-robust">Q10</a>), and learned index structures; the lab here is the part with the clearest payoff: tuning.</li> </ul>
"""

[[sections]]
heading = "The tuning problem, made measurable"
body = """
<p>To compare tuners fairly, the lab measures the <strong>entire configuration space once</strong>, so an "evaluation" in an experiment is a counted table lookup and the true optimum is known (this is how hyperparameter-optimization research builds <em>tabular benchmarks</em>). The spaces are real knobs of the indexes of <a href="/cookbook/p/vector-databases">S2</a>, on three datasets of 30 000 vectors × 32 dimensions that differ in cluster structure:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>space</th> <th>knobs</th> <th>configurations</th> <th>cost</th> <th>constraint</th> </tr> </thead> <tbody> <tr> <td>IVF</td> <td><code>nlist</code> ∈ {16 … 1 024}, <code>nprobe</code> ∈ {1 … 128}</td> <td>91</td> <td>centroid distances + vectors scanned per query</td> <td>recall&#64;10 ≥ 0.95</td> </tr> <tr> <td>HNSW</td> <td><code>M</code> ∈ {4, 8, 16, 32}, <code>efConstruction</code> ∈ {20 … 200}, <code>ef</code> ∈ {10 … 200}</td> <td>112</td> <td>distance computations per query</td> <td>recall&#64;10 ≥ 0.95</td> </tr> </tbody> </table></div>

<p>Cost is the deterministic count of distance computations (proportional to query time), so the tables are reproducible. Each configuration was built and measured on 300 queries; the whole set of six tables took 44 seconds to compute here.</p>

<p><strong>Tuners compared</strong> (all pick distinct configurations, never repeat one):</p>

<ul> <li><strong>Random search</strong>: <code>b</code> configurations uniformly at random.</li> <li><strong>Hill climbing</strong> on the knob lattice with random restarts: move to the best neighbour (one knob one step up or down) until none improves; infeasible configurations score worse than any feasible one.</li> <li><strong>Constrained Bayesian optimization</strong>: three random configurations, then repeatedly fit a GP (RBF kernel on log-scaled knob values; the length scale chosen from a grid by marginal likelihood) to the observed <strong>log cost</strong> and another to the observed <strong>recall</strong>, and evaluate the untried configuration with the highest <code>EI(log cost over the best feasible so far) × P(recall ≥ 0.95)</code>; while nothing feasible is known, maximize the probability of feasibility.</li> </ul>

:::deeper Reference: the tuning table, random search, hill climbing, Cholesky and a Gaussian process, expected improvement, constrained Bayesian optimization, knob importance
```rust title="src/tune/mod.rs"
//! Configuration tuning as black-box optimization. A `Table` holds the exhaustively measured cost and recall of every configuration of
//! a small knob space, so strategies can be compared fairly (an "evaluation" is a lookup that is counted); strategies: random search,
//! hill climbing with restarts, and Gaussian-process Bayesian optimization with expected improvement.
use crate::joinorder::Rng;

pub struct Space { pub names: Vec<String>, pub values: Vec<Vec<f64>> }

pub struct Table { pub space: Space, pub cost: Vec<f64>, pub recall: Vec<f64>, pub target: f64 }
impl Table {
    pub fn n(&self) -> usize { self.cost.len() }
    pub fn dims(&self) -> usize { self.space.values.len() }
    /// Mixed-radix decode of a configuration index into one position per knob.
    pub fn decode(&self, mut idx: usize) -> Vec<usize> {
        let mut pos = vec![0; self.dims()];
        for d in (0..self.dims()).rev() { let l = self.space.values[d].len(); pos[d] = idx % l; idx /= l; }
        pos
    }
    pub fn encode(&self, pos: &[usize]) -> usize { pos.iter().enumerate().fold(0, |a, (d, &p)| a * self.space.values[d].len() + p) }
    pub fn values_of(&self, idx: usize) -> Vec<f64> { self.decode(idx).iter().enumerate().map(|(d, &p)| self.space.values[d][p]).collect() }
    /// Knob values mapped to [0, 1] on a log scale (knobs span orders of magnitude).
    pub fn unit(&self, idx: usize) -> Vec<f64> {
        self.values_of(idx).iter().enumerate().map(|(d, v)| {
            let (lo, hi) = (self.space.values[d].first().unwrap().ln(), self.space.values[d].last().unwrap().ln());
            if hi > lo { (v.ln() - lo) / (hi - lo) } else { 0.0 }
        }).collect()
    }
    pub fn feasible(&self, idx: usize) -> bool { self.recall[idx] >= self.target }
    /// Objective to minimize: log cost for configurations that meet the recall target; anything infeasible is worse than every feasible one.
    pub fn score(&self, idx: usize) -> f64 {
        let worst = self.cost.iter().cloned().fold(0.0, f64::max).ln();
        if self.feasible(idx) { self.cost[idx].ln() } else { worst + 1.0 + 20.0 * (self.target - self.recall[idx]) }
    }
    pub fn optimum(&self) -> usize { (0..self.n()).filter(|&i| self.feasible(i)).min_by(|&a, &b| self.cost[a].total_cmp(&self.cost[b])).expect("some configuration is feasible") }
    /// Best feasible cost among the evaluated configurations (infinity if none is feasible).
    pub fn best_feasible(&self, evaluated: &[usize]) -> f64 { evaluated.iter().filter(|&&i| self.feasible(i)).map(|&i| self.cost[i]).fold(f64::INFINITY, f64::min) }
    pub fn neighbours(&self, idx: usize) -> Vec<usize> {
        let pos = self.decode(idx);
        let mut out = vec![];
        for d in 0..self.dims() {
            if pos[d] > 0 { let mut q = pos.clone(); q[d] -= 1; out.push(self.encode(&q)); }
            if pos[d] + 1 < self.space.values[d].len() { let mut q = pos.clone(); q[d] += 1; out.push(self.encode(&q)); }
        }
        out
    }
}

// ----------------------------------------------------------------------------------------------- strategies

/// `budget` distinct configurations chosen uniformly at random.
pub fn random_search(t: &Table, budget: usize, rng: &mut Rng) -> Vec<usize> {
    let mut all: Vec<usize> = (0..t.n()).collect();
    for i in (1..all.len()).rev() { all.swap(i, rng.next(i as u64 + 1) as usize); }
    all.truncate(budget);
    all
}

/// Steepest-descent hill climbing on the knob lattice with random restarts. Never evaluates a configuration twice.
pub fn hill_climb(t: &Table, budget: usize, rng: &mut Rng) -> Vec<usize> {
    let mut seen: Vec<usize> = vec![];
    let mut has = vec![false; t.n()];
    let mut eval = |i: usize, seen: &mut Vec<usize>| { if !has[i] { has[i] = true; seen.push(i); } };
    while seen.len() < budget && seen.len() < t.n() {
        let mut cur = rng.next(t.n() as u64) as usize;
        eval(cur, &mut seen);
        loop {
            if seen.len() >= budget { break; }
            let mut best = (t.score(cur), cur);
            for nb in t.neighbours(cur) {
                if seen.len() >= budget && !seen.contains(&nb) { break; }
                eval(nb, &mut seen);
                if t.score(nb) < best.0 { best = (t.score(nb), nb); }
            }
            if best.1 == cur { break; }
            cur = best.1;
        }
    }
    seen.truncate(budget);
    seen
}

// ----------------------------------------------------------------------------------------------- Gaussian process

/// Lower-triangular Cholesky factor of a symmetric positive-definite matrix (row-major `Vec<Vec<f64>>`).
pub fn cholesky(a: &[Vec<f64>]) -> Option<Vec<Vec<f64>>> {
    let n = a.len();
    let mut l = vec![vec![0.0; n]; n];
    for i in 0..n {
        for j in 0..=i {
            let s: f64 = (0..j).map(|k| l[i][k] * l[j][k]).sum();
            if i == j { let d = a[i][i] - s; if d <= 1e-12 { return None; } l[i][j] = d.sqrt(); } else { l[i][j] = (a[i][j] - s) / l[j][j]; }
        }
    }
    Some(l)
}
/// Solve `L Lᵀ x = b`.
pub fn chol_solve(l: &[Vec<f64>], b: &[f64]) -> Vec<f64> {
    let n = l.len();
    let mut y = vec![0.0; n];
    for i in 0..n { y[i] = (b[i] - (0..i).map(|k| l[i][k] * y[k]).sum::<f64>()) / l[i][i]; }
    let mut x = vec![0.0; n];
    for i in (0..n).rev() { x[i] = (y[i] - (i + 1..n).map(|k| l[k][i] * x[k]).sum::<f64>()) / l[i][i]; }
    x
}
fn forward(l: &[Vec<f64>], b: &[f64]) -> Vec<f64> {
    let mut y = vec![0.0; l.len()];
    for i in 0..l.len() { y[i] = (b[i] - (0..i).map(|k| l[i][k] * y[k]).sum::<f64>()) / l[i][i]; }
    y
}

pub fn norm_pdf(z: f64) -> f64 { (-0.5 * z * z).exp() / (2.0 * std::f64::consts::PI).sqrt() }
/// Standard normal CDF (Abramowitz and Stegun 7.1.26 for the error function; absolute error below 1.5e-7).
pub fn norm_cdf(z: f64) -> f64 {
    let x = z.abs() / std::f64::consts::SQRT_2;
    let t = 1.0 / (1.0 + 0.3275911 * x);
    let poly = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
    let erf = 1.0 - poly * (-x * x).exp();
    if z >= 0.0 { 0.5 * (1.0 + erf) } else { 0.5 * (1.0 - erf) }
}
/// Expected improvement for minimization over the incumbent `best`, given a Gaussian posterior (mean `mu`, standard deviation `sd`).
pub fn expected_improvement(mu: f64, sd: f64, best: f64) -> f64 {
    if sd <= 1e-12 { return (best - mu).max(0.0); }
    let z = (best - mu) / sd;
    (best - mu) * norm_cdf(z) + sd * norm_pdf(z)
}

/// A GP with an RBF kernel on standardized targets.
pub struct Gp { x: Vec<Vec<f64>>, l: Vec<Vec<f64>>, alpha: Vec<f64>, mean: f64, scale: f64, ls: f64, /// log marginal likelihood of the standardized targets
    pub lml: f64 }
fn rbf(a: &[f64], b: &[f64], ls: f64) -> f64 { (-a.iter().zip(b).map(|(p, q)| (p - q) * (p - q)).sum::<f64>() / (2.0 * ls * ls)).exp() }
impl Gp {
    pub fn fit(x: &[Vec<f64>], y: &[f64], ls: f64, noise: f64) -> Option<Gp> {
        let n = y.len();
        let mean = y.iter().sum::<f64>() / n as f64;
        let var = y.iter().map(|v| (v - mean) * (v - mean)).sum::<f64>() / n as f64;
        let scale = var.sqrt().max(1e-9);
        let ys: Vec<f64> = y.iter().map(|v| (v - mean) / scale).collect();
        let k: Vec<Vec<f64>> = (0..n).map(|i| (0..n).map(|j| rbf(&x[i], &x[j], ls) + if i == j { noise } else { 0.0 }).collect()).collect();
        let l = cholesky(&k)?;
        let alpha = chol_solve(&l, &ys);
        let lml = -0.5 * ys.iter().zip(&alpha).map(|(a, b)| a * b).sum::<f64>() - (0..n).map(|i| l[i][i].ln()).sum::<f64>() - 0.5 * n as f64 * (2.0 * std::f64::consts::PI).ln();
        Some(Gp { x: x.to_vec(), l, alpha, mean, scale, ls, lml })
    }
    /// Fit with the length scale (from a small grid) that maximizes the marginal likelihood of the data.
    pub fn fit_best(x: &[Vec<f64>], y: &[f64], noise: f64) -> Option<Gp> {
        [0.1, 0.2, 0.35, 0.6, 1.0].iter().filter_map(|&ls| Gp::fit(x, y, ls, noise)).max_by(|a, b| a.lml.total_cmp(&b.lml))
    }
    pub fn length_scale(&self) -> f64 { self.ls }
    /// Posterior mean and standard deviation (in the original units of `y`).
    pub fn predict(&self, q: &[f64]) -> (f64, f64) {
        let ks: Vec<f64> = self.x.iter().map(|xi| rbf(xi, q, self.ls)).collect();
        let mu = ks.iter().zip(&self.alpha).map(|(a, b)| a * b).sum::<f64>();
        let v = forward(&self.l, &ks);
        let var = (1.0 - v.iter().map(|a| a * a).sum::<f64>()).max(0.0);
        (self.mean + mu * self.scale, var.sqrt() * self.scale)
    }
}

/// Constrained Bayesian optimization over the discrete table. One GP models log cost, another models recall (both observed for every
/// evaluated configuration, feasible or not). The next configuration maximizes `EI(log cost over the best feasible) × P(recall >= target)`;
/// while nothing feasible is known it maximizes the probability of feasibility. `warm` configurations (else random ones) come first.
pub fn bayes_opt(t: &Table, budget: usize, warm: &[usize], rng: &mut Rng) -> Vec<usize> {
    let mut seen: Vec<usize> = vec![];
    let mut has = vec![false; t.n()];
    for &w in warm.iter().take(budget) { if !has[w] { has[w] = true; seen.push(w); } }
    while seen.len() < 3.min(budget).min(t.n()) {
        let i = rng.next(t.n() as u64) as usize;
        if !has[i] { has[i] = true; seen.push(i); }
    }
    while seen.len() < budget.min(t.n()) {
        let xs: Vec<Vec<f64>> = seen.iter().map(|&i| t.unit(i)).collect();
        let cost_y: Vec<f64> = seen.iter().map(|&i| t.cost[i].ln()).collect();
        let rec_y: Vec<f64> = seen.iter().map(|&i| t.recall[i]).collect();
        let best = seen.iter().filter(|&&i| t.feasible(i)).map(|&i| t.cost[i].ln()).fold(f64::INFINITY, f64::min);
        let (gc, gr) = (Gp::fit_best(&xs, &cost_y, 1e-4), Gp::fit_best(&xs, &rec_y, 1e-4));
        let pick = match (gc, gr) {
            (Some(gc), Some(gr)) => (0..t.n()).filter(|&i| !has[i]).map(|i| {
                let u = t.unit(i);
                let (mc, sc) = gc.predict(&u);
                let (mr, sr) = gr.predict(&u);
                let pf = if sr <= 1e-9 { (mr >= t.target) as u8 as f64 } else { norm_cdf((mr - t.target) / sr) };
                let acq = if best.is_finite() { expected_improvement(mc, sc, best) * pf } else { pf };
                (i, acq, mc)
            }).max_by(|a, b| a.1.total_cmp(&b.1).then(b.2.total_cmp(&a.2)).then(b.0.cmp(&a.0))).unwrap().0,
            _ => (0..t.n()).find(|&i| !has[i]).unwrap(),
        };
        has[pick] = true;
        seen.push(pick);
    }
    seen
}

/// Share of the variance of the score that each knob's main effect explains (a one-way ANOVA per knob over the whole table).
pub fn knob_importance(t: &Table) -> Vec<f64> {
    let scores: Vec<f64> = (0..t.n()).map(|i| t.score(i)).collect();
    let mean = scores.iter().sum::<f64>() / scores.len() as f64;
    let total: f64 = scores.iter().map(|s| (s - mean) * (s - mean)).sum();
    (0..t.dims()).map(|d| {
        let levels = t.space.values[d].len();
        let mut sum = vec![0.0; levels]; let mut cnt = vec![0usize; levels];
        for i in 0..t.n() { let p = t.decode(i)[d]; sum[p] += scores[i]; cnt[p] += 1; }
        (0..levels).map(|p| cnt[p] as f64 * (sum[p] / cnt[p] as f64 - mean).powi(2)).sum::<f64>() / total
    }).collect()
}
