[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from the Iceberg, Delta Lake and Hudi specifications and papers, not a summary of any talk.)</em></p>

<ul> <li><strong>The lakehouse claim</strong>: warehouse semantics (ACID transactions, schema, consistent reads, <code>UPDATE</code>/<code>DELETE</code>/<code>MERGE</code>) on <strong>cheap object storage</strong>, with many engines reading and writing the same tables. Object stores give you immutable objects, ranged reads, listing and (now) conditional writes, and nothing else; a <strong>table format</strong> is the metadata protocol that turns a directory of files into a table.</li> <li><strong>Immutable files + a metadata tree + one atomic pointer swap.</strong> Data files are never modified. A table's state is a <strong>snapshot</strong>: a list of data files, recorded in <strong>manifests</strong> (which also carry per-file statistics), referenced from a <strong>manifest list</strong>, referenced from the <strong>table metadata</strong>. Every change writes new files and a new snapshot, then <strong>atomically replaces the pointer</strong> to the current metadata. Readers load one metadata version and see a consistent snapshot no matter what writers do afterwards: <strong>snapshot isolation and time travel come for free</strong>.</li> <li><strong>The commit is the hard part.</strong> Several writers race to produce version <code>N+1</code>. The protocol is <strong>optimistic concurrency control</strong> on a single atomic primitive: <em>create version N+1 only if it does not exist</em> (Delta Lake: the next <code>_delta_log/N+1.json</code>; Iceberg: the catalog's compare-and-swap of the metadata pointer; the lab: <code>put_if_absent</code>). A loser re-reads, re-validates or re-executes its operation against the new latest version, and tries again. Without the conditional primitive, concurrent writers silently overwrite one another.</li> <li><strong>Commits do not scale like database transactions.</strong> Every commit is several sequential object-store round trips (read the latest metadata, read the manifest list, write new manifest, write the new list, conditional-put the metadata), tens of milliseconds each; one table can therefore sustain only a handful to a few dozen commits per second, and contention multiplies the wasted work. The remedies are <strong>bigger commits</strong> (micro-batches, not one commit per row), <strong>partitioned or sharded tables</strong>, a <strong>database-backed catalog</strong> (DuckLake keeps the metadata in a SQL database, so a commit is a transaction), and coordinated commits through a service.</li> <li><strong>Metadata is a cost.</strong> Planning a query reads manifests: with thousands of tiny manifests, planning dominates. Table formats <strong>merge manifests</strong>, <strong>checkpoint</strong> the log (Delta writes a checkpoint every few commits so readers do not replay the whole log), and keep statistics so files can be skipped without opening them.</li> <li><strong>Small files and deletes drive maintenance.</strong> Streaming ingestion creates many small files; deletes and updates either <strong>rewrite files</strong> (<em>copy-on-write</em>) or write <strong>delete files / deletion vectors</strong> that readers apply (<em>merge-on-read</em>, Hudi's and Iceberg's second mode). <strong>Compaction</strong> merges small files (and re-sorts them, restoring min/max pruning), <strong>snapshot expiry</strong> shortens history, and <strong>orphan removal</strong> deletes unreferenced objects, with a grace period so that files of in-flight commits are never deleted.</li> <li><strong>Beyond the basics in the seminar</strong>: <strong>bitemporal</strong> history (XTDB: valid time and system time, not just snapshot time), <strong>multi-statement and multi-table transactions</strong> (needs commit coordination beyond a single pointer), <strong>catalogs as services</strong> (Polaris, the REST catalog: access control, credential vending, commit arbitration), <strong>streaming storage as the lake's front door</strong> (Fluss, Mooncake), <strong>file formats with cheaper random access</strong> (Vortex, Lance) and <strong>driver protocols</strong> that move Arrow instead of rows (ADBC).</li> </ul>
"""

[[sections]]
heading = "The format in miniature"
body = """
```text
t/meta/v00000007          table metadata version 7 (created with put_if_absent)
   version 7 / current 7 / snap 7 parent 6 list=t/list/w3-12 / earlier snapshots …
t/list/w3-12              manifest list of snapshot 7: one manifest path per line
t/manifest/w3-12 …        manifest: "A path rows min max" (file added) / "D path" (file removed)
t/data/w3-11              data file: rows "key value", with min/max recorded in the manifest
```

<ul> <li><strong>Live files of a snapshot</strong> = replay its manifests in order: <code>A</code> adds a file, <code>D</code> removes it.</li> <li><strong>Append</strong>: write one data file and one manifest; the new snapshot's list is the parent's list plus the new manifest. An append never needs to know the existing files.</li> <li><strong>Delete range</strong>: for each live file overlapping the range, read it, drop the matching rows, write the remainder as a new file (copy-on-write), and record <code>D old</code>, <code>A new</code> in one manifest. Files entirely inside the range simply get a <code>D</code>.</li> <li><strong>Compaction</strong>: merge live files smaller than a target into sorted files of the target size (<code>D</code> all old, <code>A</code> all new): the multiset of rows is unchanged, the file count drops, and the new files have disjoint key ranges.</li> <li><strong>Commit</strong>: compute the new metadata version from the latest one; <code>put_if_absent("meta/v{N+1}")</code>. On failure (another writer won <code>N+1</code>), count a conflict, back off briefly, and <strong>re-run the operation against the new latest snapshot</strong>. Because the operation is planned against exactly the snapshot it replaces, the history is the serial execution of the committed operations in version order.</li> <li><strong>Maintenance</strong>: <code>rewrite_manifests</code> (one manifest listing the live files; a metadata-only commit), <code>expire_snapshots(keep)</code>, and <code>remove_orphans(cutoff)</code> (delete data, manifest and list objects that no retained snapshot references and that were created before the cutoff).</li> <li><strong>The DuckLake variant</strong> keeps the file list in a transactional catalog: upload the data file, then one catalog transaction appends the file entry; the database serializes writers and there is no metadata object chain to race on.</li> </ul>

:::deeper Reference: conditional-put object store, metadata encodings, table with scan / append / delete / compact / commit, unsafe commit, manifest rewrite, expiry, orphan removal, catalog variant
```rust title="src/lake/mod.rs"
//! A miniature lakehouse table format over an object store. Data files and manifests are immutable objects; a table version is the
//! object `meta/v{N}` and a commit is `put_if_absent(meta/v{N+1})`, so exactly one of several concurrent writers wins each
//! version. Snapshots form a linear history (time travel); a writer that loses re-executes its operation on the new latest
//! snapshot. Includes copy-on-write deletes, compaction, snapshot expiry with orphan removal, and a catalog-in-a-database variant.
use std::collections::{BTreeMap, BTreeSet, HashSet};
use std::sync::atomic::{AtomicU64, Ordering::*};
use std::sync::{Arc, Mutex};
use std::time::Duration;

// ----------------------------------------------------------------------------------------------- store

pub trait Store: Send + Sync {
    fn get(&self, key: &str) -> Option<Vec<u8>>;
    /// Unconditional overwrite (what a naive commit would use).
    fn put(&self, key: &str, bytes: Vec<u8>);
    /// Atomic create-if-absent: returns false and changes nothing if the key exists (S3 `If-None-Match`, GCS preconditions).
    fn put_if_absent(&self, key: &str, bytes: Vec<u8>) -> bool;
    /// Keys with the prefix, sorted.
    fn list(&self, prefix: &str) -> Vec<String>;
    fn delete(&self, key: &str);
    /// Logical creation order of an object (for orphan removal grace periods).
    fn created(&self, key: &str) -> Option<u64>;
    fn clock(&self) -> u64;
}

/// In-memory store with a fixed latency per operation (slept outside the lock) and operation counters.
pub struct MemObjects { map: Mutex<BTreeMap<String, (Vec<u8>, u64)>>, latency: Duration, seq: AtomicU64, pub ops: AtomicU64 }
impl MemObjects {
    pub fn new(latency: Duration) -> Arc<Self> { Arc::new(MemObjects { map: Mutex::new(BTreeMap::new()), latency, seq: AtomicU64::new(1), ops: AtomicU64::new(0) }) }
    fn delay(&self) { self.ops.fetch_add(1, Relaxed); if !self.latency.is_zero() { std::thread::sleep(self.latency); } }
    pub fn object_count(&self) -> usize { self.map.lock().unwrap().len() }
}
impl Store for MemObjects {
    fn get(&self, key: &str) -> Option<Vec<u8>> { self.delay(); self.map.lock().unwrap().get(key).map(|x| x.0.clone()) }
    fn put(&self, key: &str, bytes: Vec<u8>) { self.delay(); let s = self.seq.fetch_add(1, Relaxed); self.map.lock().unwrap().insert(key.into(), (bytes, s)); }
    fn put_if_absent(&self, key: &str, bytes: Vec<u8>) -> bool {
        self.delay();
        let mut m = self.map.lock().unwrap();
        if m.contains_key(key) { return false; }
        let s = self.seq.fetch_add(1, Relaxed);
        m.insert(key.into(), (bytes, s));
        true
    }
    fn list(&self, prefix: &str) -> Vec<String> { self.delay(); self.map.lock().unwrap().range(prefix.to_string()..).take_while(|(k, _)| k.starts_with(prefix)).map(|(k, _)| k.clone()).collect() }
    fn delete(&self, key: &str) { self.delay(); self.map.lock().unwrap().remove(key); }
    fn created(&self, key: &str) -> Option<u64> { self.map.lock().unwrap().get(key).map(|x| x.1) }
    fn clock(&self) -> u64 { self.seq.load(Relaxed) }
}

// ----------------------------------------------------------------------------------------------- metadata

pub type Row = (i64, i64);

#[derive(Clone, Debug, PartialEq)]
pub struct FileMeta { pub path: String, pub rows: u64, pub min: i64, pub max: i64 }

#[derive(Clone, Debug, PartialEq)]
pub enum Entry { Added(FileMeta), Deleted(String) }

#[derive(Clone, Debug, PartialEq)]
pub struct Snapshot { pub id: u64, pub parent: Option<u64>, /// object holding the snapshot's manifest paths, one per line
    pub list: String }

#[derive(Clone, Debug, PartialEq)]
pub struct TableMeta { pub version: u64, pub current: Option<u64>, pub snapshots: Vec<Snapshot> }

fn enc_rows(rows: &[Row]) -> Vec<u8> { rows.iter().map(|(k, v)| format!("{k} {v}\\n")).collect::<String>().into_bytes() }
fn dec_rows(b: &[u8]) -> Vec<Row> {
    String::from_utf8_lossy(b).lines().filter(|l| !l.is_empty()).map(|l| { let mut it = l.split(' '); (it.next().unwrap().parse().unwrap(), it.next().unwrap().parse().unwrap()) }).collect()
}
fn enc_manifest(es: &[Entry]) -> Vec<u8> {
    es.iter().map(|e| match e { Entry::Added(f) => format!("A {} {} {} {}\\n", f.path, f.rows, f.min, f.max), Entry::Deleted(p) => format!("D {p}\\n") }).collect::<String>().into_bytes()
}
fn dec_manifest(b: &[u8]) -> Vec<Entry> {
    String::from_utf8_lossy(b).lines().filter(|l| !l.is_empty()).map(|l| {
        let p: Vec<&str> = l.split(' ').collect();
        if p[0] == "A" { Entry::Added(FileMeta { path: p[1].into(), rows: p[2].parse().unwrap(), min: p[3].parse().unwrap(), max: p[4].parse().unwrap() }) } else { Entry::Deleted(p[1].into()) }
    }).collect()
}
impl TableMeta {
    fn encode(&self) -> Vec<u8> {
        let mut s = format!("version {}\\ncurrent {}\\n", self.version, self.current.map_or("-".into(), |c| c.to_string()));
        for sn in &self.snapshots { s += &format!("snap {} {} {}\\n", sn.id, sn.parent.map_or("-".into(), |p| p.to_string()), sn.list); }
        s.into_bytes()
    }
    fn decode(b: &[u8]) -> TableMeta {
        let text = String::from_utf8_lossy(b);
        let mut m = TableMeta { version: 0, current: None, snapshots: vec![] };
        for l in text.lines() {
            let p: Vec<&str> = l.split(' ').collect();
            match p[0] {
                "version" => m.version = p[1].parse().unwrap(),
                "current" => m.current = p[1].parse().ok(),
                "snap" => m.snapshots.push(Snapshot { id: p[1].parse().unwrap(), parent: p[2].parse().ok(), list: p[3].to_string() }),
                _ => {}
            }
        }
        m
    }
}

// ----------------------------------------------------------------------------------------------- table

#[derive(Clone, Debug)]
pub enum Op { Append(Vec<Row>), DeleteRange { lo: i64, hi: i64 }, Compact { target_rows: usize } }

#[derive(Clone, Copy, Debug, Default)]
pub struct CommitStats { pub attempts: u32, pub conflicts: u32 }

#[derive(Clone, Copy, Debug, Default)]
pub struct ScanStats { pub manifests_read: usize, pub files_total: usize, pub files_read: usize }

pub struct Table<S: Store> { pub store: Arc<S>, pub name: String, writer: String, counter: AtomicU64 }

impl<S: Store> Table<S> {
    pub fn create(store: Arc<S>, name: &str) -> Table<S> {
        store.put_if_absent(&format!("{name}/meta/v{:08}", 0), TableMeta { version: 0, current: None, snapshots: vec![] }.encode());
        Table::open(store, name, "w0")
    }
    /// A handle for one writer; writers must use distinct ids so that their object names never collide.
    pub fn open(store: Arc<S>, name: &str, writer: &str) -> Table<S> { Table { store, name: name.into(), writer: writer.into(), counter: AtomicU64::new(0) } }
    fn fresh(&self, kind: &str) -> String { format!("{}/{kind}/{}-{}", self.name, self.writer, self.counter.fetch_add(1, Relaxed)) }

    pub fn latest(&self) -> TableMeta {
        let keys = self.store.list(&format!("{}/meta/", self.name));
        TableMeta::decode(&self.store.get(keys.last().expect("table exists")).expect("metadata object"))
    }
    fn meta_key(&self, v: u64) -> String { format!("{}/meta/v{:08}", self.name, v) }

    fn manifests_of(&self, meta: &TableMeta, snap: Option<u64>) -> (Vec<FileMeta>, usize) {
        let Some(id) = snap.or(meta.current) else { return (vec![], 0) };
        let sn = meta.snapshots.iter().find(|s| s.id == id).expect("snapshot exists");
        let manifests = self.read_list(&sn.list);
        let mut live: Vec<FileMeta> = vec![];
        for m in &manifests {
            for e in dec_manifest(&self.store.get(m).expect("manifest object")) {
                match e { Entry::Added(f) => live.push(f), Entry::Deleted(p) => live.retain(|f| f.path != p) }
            }
        }
        (live, manifests.len())
    }
    fn read_list(&self, key: &str) -> Vec<String> { String::from_utf8_lossy(&self.store.get(key).expect("manifest list object")).lines().filter(|l| !l.is_empty()).map(String::from).collect() }
    fn write_list(&self, manifests: &[String]) -> String { let k = self.fresh("list"); self.store.put(&k, manifests.join("\\n").into_bytes()); k }

    /// Rows with `lo <= key <= hi` in a snapshot (the current one by default). Files whose min/max cannot match are not read.
    pub fn scan(&self, snap: Option<u64>, lo: i64, hi: i64) -> (Vec<Row>, ScanStats) {
        let meta = self.latest();
        let (files, nm) = self.manifests_of(&meta, snap);
        let mut stats = ScanStats { manifests_read: nm, files_total: files.len(), files_read: 0 };
        let mut out = vec![];
        for f in &files {
            if f.max < lo || f.min > hi { continue; }
            stats.files_read += 1;
            out.extend(dec_rows(&self.store.get(&f.path).expect("data object")).into_iter().filter(|r| r.0 >= lo && r.0 <= hi));
        }
        (out, stats)
    }
    pub fn files(&self) -> Vec<FileMeta> { self.manifests_of(&self.latest(), None).0 }

    fn write_file(&self, rows: &[Row]) -> FileMeta {
        let path = self.fresh("data");
        self.store.put(&path, enc_rows(rows));
        FileMeta { path, rows: rows.len() as u64, min: rows.iter().map(|r| r.0).min().unwrap_or(0), max: rows.iter().map(|r| r.0).max().unwrap_or(0) }
    }

    /// Plan the operation against `files` (the live set of the base snapshot): which entries to add and delete.
    fn plan(&self, op: &Op, files: &[FileMeta], precomputed: &mut Option<Vec<Entry>>) -> Vec<Entry> {
        match op {
            Op::Append(rows) => precomputed.get_or_insert_with(|| if rows.is_empty() { vec![] } else { vec![Entry::Added(self.write_file(rows))] }).clone(),
            Op::DeleteRange { lo, hi } => {
                let mut es = vec![];
                for f in files {
                    if f.max < *lo || f.min > *hi { continue; }
                    let rows = dec_rows(&self.store.get(&f.path).expect("data object"));
                    let keep: Vec<Row> = rows.iter().copied().filter(|r| r.0 < *lo || r.0 > *hi).collect();
                    if keep.len() == rows.len() { continue; }
                    es.push(Entry::Deleted(f.path.clone()));
                    if !keep.is_empty() { es.push(Entry::Added(self.write_file(&keep))); }
                }
                es
            }
            Op::Compact { target_rows } => {
                let small: Vec<&FileMeta> = files.iter().filter(|f| (f.rows as usize) < *target_rows).collect();
                if small.len() < 2 { return vec![]; }
                let mut rows: Vec<Row> = vec![];
                let mut es = vec![];
                for f in &small { rows.extend(dec_rows(&self.store.get(&f.path).expect("data object"))); es.push(Entry::Deleted(f.path.clone())); }
                rows.sort();
                for chunk in rows.chunks(*target_rows) { es.push(Entry::Added(self.write_file(chunk))); }
                es
            }
        }
    }

    /// Commit an operation with optimistic concurrency. Returns the committed version.
    pub fn commit(&self, op: &Op) -> (u64, CommitStats) {
        let mut stats = CommitStats::default();
        let mut precomputed: Option<Vec<Entry>> = None;           // appends write their data file and manifest once, not once per attempt
        let mut manifest_key: Option<String> = None;
        loop {
            stats.attempts += 1;
            let base = self.latest();
            // an append needs no knowledge of the existing files; deletes and compactions read the live file list of the base snapshot
            let files = if matches!(op, Op::Append(_)) { vec![] } else { self.manifests_of(&base, None).0 };
            let entries = self.plan(op, &files, &mut precomputed);
            let new_manifest = if entries.is_empty() { None } else if matches!(op, Op::Append(_)) && manifest_key.is_some() { manifest_key.clone() } else {
                let k = self.fresh("manifest");
                self.store.put(&k, enc_manifest(&entries));
                if matches!(op, Op::Append(_)) { manifest_key = Some(k.clone()); }
                Some(k)
            };
            let mut meta = base.clone();
            meta.version = base.version + 1;
            let parent = base.current;
            let id = base.snapshots.iter().map(|s| s.id).max().unwrap_or(0) + 1;
            let mut manifests = parent.and_then(|p| base.snapshots.iter().find(|s| s.id == p)).map_or(vec![], |s| self.read_list(&s.list));
            manifests.extend(new_manifest);
            let list = self.write_list(&manifests);
            meta.snapshots.push(Snapshot { id, parent, list });
            meta.current = Some(id);
            if self.store.put_if_absent(&self.meta_key(meta.version), meta.encode()) { return (meta.version, stats); }
            stats.conflicts += 1;
            if matches!(op, Op::DeleteRange { .. } | Op::Compact { .. }) { precomputed = None; }
            std::thread::sleep(Duration::from_micros(50 * (1 + (stats.conflicts as u64).min(8))));     // small backoff
        }
    }

    /// The naive commit: read the latest metadata, write version+1 *unconditionally*. Concurrent writers silently overwrite each other.
    pub fn commit_unsafe(&self, rows: Vec<Row>) -> u64 {
        let base = self.latest();
        let file = self.write_file(&rows);
        let k = self.fresh("manifest");
        self.store.put(&k, enc_manifest(&[Entry::Added(file)]));
        let mut meta = base.clone();
        meta.version += 1;
        let id = base.snapshots.iter().map(|s| s.id).max().unwrap_or(0) + 1;
        let mut manifests = base.current.and_then(|p| base.snapshots.iter().find(|s| s.id == p)).map_or(vec![], |s| self.read_list(&s.list));
        manifests.push(k);
        let list = self.write_list(&manifests);
        meta.snapshots.push(Snapshot { id, parent: base.current, list });
        meta.current = Some(id);
        self.store.put(&self.meta_key(meta.version), meta.encode());
        meta.version
    }

    /// Replace all manifests of the current snapshot by one manifest listing only the live files (a metadata-only commit).
    pub fn rewrite_manifests(&self) -> u64 {
        loop {
            let base = self.latest();
            let (files, n) = self.manifests_of(&base, None);
            if n <= 1 { return base.version; }
            let k = self.fresh("manifest");
            self.store.put(&k, enc_manifest(&files.iter().cloned().map(Entry::Added).collect::<Vec<_>>()));
            let mut meta = base.clone();
            meta.version += 1;
            let id = base.snapshots.iter().map(|s| s.id).max().unwrap() + 1;
            let list = self.write_list(&[k]);
            meta.snapshots.push(Snapshot { id, parent: base.current, list });
            meta.current = Some(id);
            if self.store.put_if_absent(&self.meta_key(meta.version), meta.encode()) { return meta.version; }
        }
    }

    /// Keep only the newest `keep` snapshots in a new metadata version (history is shortened; data stays until orphans are removed).
    pub fn expire_snapshots(&self, keep: usize) -> u64 {
        loop {
            let base = self.latest();
            let mut meta = base.clone();
            meta.version += 1;
            let cut = meta.snapshots.len().saturating_sub(keep.max(1));
            meta.snapshots.drain(..cut);
            if let Some(first) = meta.snapshots.first_mut() { first.parent = None; }
            if self.store.put_if_absent(&self.meta_key(meta.version), meta.encode()) { return meta.version; }
        }
    }

    /// Delete data and manifest objects that no retained snapshot of the latest metadata references and that were created before
    /// `cutoff` (a logical clock value; objects of in-flight commits are newer and survive). Metadata versions are never deleted here.
    pub fn remove_orphans(&self, cutoff: u64) -> usize {
        let meta = self.latest();
        let mut live: HashSet<String> = HashSet::new();
        for sn in &meta.snapshots {
            live.insert(sn.list.clone());
            for m in self.read_list(&sn.list) {
                for e in dec_manifest(&self.store.get(&m).expect("manifest")) { if let Entry::Added(f) = e { live.insert(f.path); } }
                live.insert(m);
            }
        }
        let mut removed = 0;
        for prefix in ["data/", "manifest/", "list/"] {
            for k in self.store.list(&format!("{}/{prefix}", self.name)) {
                if !live.contains(&k) && self.store.created(&k).is_some_and(|c| c < cutoff) { self.store.delete(&k); removed += 1; }
            }
        }
        removed
    }

    /// All rows of every historical snapshot, for tests: snapshot id -> sorted rows.
    pub fn history(&self) -> BTreeMap<u64, Vec<Row>> {
        let meta = self.latest();
        meta.snapshots.iter().map(|s| { let (files, _) = self.manifests_of(&meta, Some(s.id)); let mut rows: Vec<Row> = files.iter().flat_map(|f| dec_rows(&self.store.get(&f.path).unwrap())).collect(); rows.sort(); (s.id, rows) }).collect()
    }
    pub fn referenced_objects(&self) -> BTreeSet<String> {
        let meta = self.latest();
        let mut s = BTreeSet::new();
        for sn in &meta.snapshots { s.insert(sn.list.clone()); for m in self.read_list(&sn.list) { for e in dec_manifest(&self.store.get(&m).unwrap()) { if let Entry::Added(f) = e { s.insert(f.path); } } s.insert(m); } }
        s
    }
}

// ----------------------------------------------------------------------------------------------- catalog in a database

/// The DuckLake idea: keep table metadata (snapshots, file lists) in a transactional database instead of in manifest objects. A commit
/// is one database transaction after the data files are uploaded; there is no metadata chain to race on, and the database serializes
/// writers (here a mutex stands in for a SQL transaction with a round trip of `catalog_latency`).
pub struct Catalog { state: Mutex<(u64, Vec<FileMeta>)>, latency: Duration }
impl Catalog {
    pub fn new(latency: Duration) -> Arc<Catalog> { Arc::new(Catalog { state: Mutex::new((0, vec![])), latency }) }
    pub fn commit_append(&self, store: &impl Store, writer: &str, n: u64, rows: &[Row]) -> u64 {
        let path = format!("data/{writer}-{n}");
        store.put(&path, enc_rows(rows));
        let f = FileMeta { path, rows: rows.len() as u64, min: rows.iter().map(|r| r.0).min().unwrap_or(0), max: rows.iter().map(|r| r.0).max().unwrap_or(0) };
        if !self.latency.is_zero() { std::thread::sleep(self.latency); }
        let mut st = self.state.lock().unwrap();
        st.0 += 1;
        st.1.push(f);
        st.0
    }
    pub fn files(&self) -> Vec<FileMeta> { self.state.lock().unwrap().1.clone() }
}
