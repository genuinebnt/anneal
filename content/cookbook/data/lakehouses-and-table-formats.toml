heading = "Measured"
body = """
<p>Object store with a fixed latency per operation (1 ms, slept outside the store's lock; the absolute rates scale with latency, the shapes do not). Writers are threads; every writer commits 40 appends of 10 rows.</p>

```text title="concurrent commits, lost updates, and metadata growth"
concurrent appenders on an object store with 1 ms per operation; 40 commits of 10 rows per writer
 writers |  optimistic metadata chain |   attempts    p50 ms    p99 ms   max try |    catalog in a database
       1 |               95 commits/s |       1.00      10.6      10.6         1 |               332 commits/s
       2 |              110 commits/s |       1.99      18.2      26.1         3 |               665 commits/s
       4 |              120 commits/s |       3.94      33.2      49.5         6 |              1326 commits/s
       8 |              124 commits/s |       7.31      47.5     274.8        71 |              2661 commits/s
      16 |              134 commits/s |      12.74      45.2     749.7       190 |              5423 commits/s
the same workload with an unconditional commit (read latest, write version + 1): 8 writers x 40 commits of 10 rows
rows committed: 3200, rows in the table afterwards: 400 (88% of the commits were lost)
metadata growth: N appends of 10 rows with random keys 0..1M; a range query touching 0.1% of the keys, then a manifest rewrite, then a compaction into 8 files (planning reads = metadata, list and manifest objects fetched before any data file)
     N | range query: files   manifests  planning reads |     after rewrite | files left range query: files
   100 |          100 of 100         100             103 |                 4 |          8               1
   500 |          497 of 500         500             503 |                 4 |          8               1
  2000 |         1985 of 2000       2000            2003 |                 4 |          8               1
```

<ul> <li><strong>One writer is limited by sequential round trips</strong>: 95 commits/s, p50 10.6 ms, i.e. about ten operations in a row (list, get metadata, get the parent manifest list, put data, put manifest, put list, conditional put, plus scheduling). At real object-store latencies (10–30 ms per operation) the same chain of about ten operations gives roughly 3 to 10 commits per second per table.</li> <li><strong>More writers do not give more commits</strong>: from 1 to 16 writers the rate rises only from <strong>95 to 134 commits/s</strong> (1.4×), while <strong>attempts per commit climb from 1.0 to 12.7</strong>: each winner invalidates every other in-flight attempt, so most of the work is thrown away. The tail is worse than the average: at 16 writers p99 commit latency is <strong>750 ms</strong>, and one commit needed <strong>190 attempts</strong> (the protocol has no fairness).</li> <li><strong>Without the conditional put, writers destroy each other's work</strong>: with 8 writers the unconditional "write version + 1" commit lost <strong>88% of the commits</strong> (400 rows survive out of 3 200), silently. Nothing fails; the table is just wrong. The conditional create is the one primitive the whole design rests on (S3 added <code>If-None-Match</code>/<code>If-Match</code> conditional writes in 2024; before that Delta Lake on S3 needed an external lock service).</li> <li><strong>A database catalog scales where the object chain cannot</strong>: with the same per-operation latency, committing through a transactional catalog gives <strong>332 commits/s with one writer and 5 423 with sixteen</strong> (linear), because the data file uploads proceed in parallel and the only serialized step is a short transaction. This is the case DuckLake and database-backed catalogs make; the price is operating a database and having it be the source of truth.</li> <li><strong>Metadata scales with the number of commits, not with the query.</strong> With <code>N</code> single-file commits, planning a range query reads <code>N + 3</code> metadata objects (<code>N</code> manifests, the manifest list, the metadata version and the listing) before any data file; with 2 000 commits that is 2 003 reads, about 3 s at 16 parallel connections of 25 ms each. <code>rewrite_manifests</code> (a metadata-only commit) cuts it to <strong>4</strong>.</li> <li><strong>Small files hurt reads twice.</strong> The range query touching 0.1% of the keys has to open <strong>1 985 of 2 000 files</strong> because each small file spans the whole key range; after compacting into 8 sorted files it opens <strong>1</strong>. Compaction here both reduces the file count and <em>re-clusters</em> the data, which is what makes the min/max statistics useful again (<a href="/cookbook/p/building-blocks">S4</a>).</li> </ul>

<aside data-call="note"><b>Reading the commit protocol as a proof</b><p>Every successful commit created <code>meta/v{N+1}</code> while <code>meta/vN</code> was the latest object, and planned its changes against exactly the snapshot of <code>vN</code>; the conditional put guarantees at most one commit per version. So the history is a chain (<code>snapshot k+1</code> has parent <code>k</code>) and snapshot <code>k</code> equals the serial application of the first <code>k</code> committed operations. The concurrent test checks this literally: it replays the operations in version order on a model and compares <em>every</em> historical snapshot, not just the last one.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>One trait, one atomic method</strong>: <code>Store::put_if_absent</code> is the only synchronization primitive; everything else (thread-safety of the table, the history chain) follows from it. <code>Store: Send + Sync</code> and <code>Arc&lt;S&gt;</code> let many writer threads share one store; each writer gets its own <code>Table</code> handle with a distinct writer id so that generated object names (<code>{writer}-{counter}</code>) never collide.</li> <li><strong>Sleep outside the lock</strong>: the in-memory store simulates latency with <code>thread::sleep</code> <em>before</em> taking its <code>Mutex</code>, so the lock protects only the map operation; sleeping inside it would serialize all operations and hide the very concurrency being studied.</li> <li><strong>Retry loops with bounded backoff</strong>: <code>commit</code> loops until the conditional put succeeds, counting attempts and conflicts, with a short sleep that grows to a cap (<code>50 µs × (1 + min(conflicts, 8))</code>). Unbounded retries without jitter or fairness are the reason for the 190-attempt tail; production clients add jitter and a retry budget.</li> <li><strong>Do the work once when you can</strong>: an append writes its data file and manifest on the first attempt and reuses them on retries (<code>precomputed</code>, <code>manifest_key</code>); deletes and compactions depend on the base snapshot and must re-plan on every attempt. Wasted writes become orphans.</li> <li><strong>Line-oriented text formats</strong> (<code>A path rows min max</code>) make the metadata readable in tests and in <code>cat</code>; production formats are Avro (Iceberg manifests), JSON (Delta log) or Parquet checkpoints, with schemas for evolution.</li> <li><strong><code>BTreeMap</code> for the store</strong> gives sorted <code>list(prefix)</code> with a range scan, the same ordering guarantee object stores provide and the property the "latest version = last key" trick relies on (zero-padded version numbers sort numerically).</li> <li><strong>Linearizability checking in tests</strong> without a checker library: collect <code>(version, op)</code> from every thread, sort by version, replay on a model, compare every historical snapshot; any lost or duplicated commit shows up as a mismatch at a specific version.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Round trips (property test)</strong>: arbitrary <code>(i64, i64)</code> rows written through the table read back as the same multiset.</li> <li><strong>Sequential history against a model</strong>: 6 seeds × 60 random operations (appends, range deletes, compactions); after each commit the scan equals the model; every historical snapshot, read by time travel, equals the model state at that version; range scans return exactly the rows in range.</li> <li><strong>Concurrent linearizability</strong>: 3 rounds × 6 writers × 25 random operations with 150 µs store latency; versions are exactly <code>1..=150</code> with no gaps or duplicates; <strong>every snapshot equals the serial replay of the committed operations up to its version</strong>; the final table equals the model; snapshot parents form a chain.</li> <li><strong>Unconditional commits lose updates</strong>: 8 writers × 15 commits through <code>commit_unsafe</code> end with fewer rows than were committed.</li> <li><strong>Pruning</strong>: min/max pruning reads one file for a range inside it, includes both boundaries, and reads none for a range between files.</li> <li><strong>Compaction</strong>: 40 small files become 4 files of exactly 50 rows, all rows survive, key ranges are disjoint, and a second compaction does nothing.</li> <li><strong>Maintenance</strong>: after expiry to two snapshots and orphan removal, live data and every referenced object are intact, an object newer than the cutoff survives, a second removal removes nothing, and only after the grace period is the stray object deleted. <code>rewrite_manifests</code> changes no data file, reduces the manifests read to one, and old snapshots remain readable.</li> <li><strong>Catalog variant</strong>: 8 writers × 30 appends produce versions <code>1..=240</code> and 240 files.</li> <li><strong>Mutants run against these tests</strong>: the metadata put without the condition; versions skipping a number; the new snapshot forgetting its parent's manifests; deletes dropping partially matching files; compaction keeping the files it merged; deleted entries ignored when reading; expiry removing every snapshot; orphan removal ignoring references or ignoring the grace period; pruning off by one at the bound; the manifest rewrite losing a file; catalog versions not advancing; time travel reading the current snapshot.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Apache Iceberg</strong>: <code>metadata.json</code> (schema, partition specs, snapshots, snapshot log) → manifest list per snapshot → manifests of data and delete files with column statistics, partition values and counts. The <strong>catalog</strong> (Hive metastore, JDBC, Glue, Nessie, the REST catalog implemented by Polaris and others) performs the atomic compare-and-swap of the metadata pointer. Commits validate according to the isolation level (snapshot or serializable) and fail only on real conflicts (for example, the same data files rewritten twice). Manifests are merged when their number passes a threshold; hidden partitioning and partition evolution avoid rewriting data; v2 adds position and equality delete files, v3 deletion vectors.</li> <li><strong>Delta Lake</strong>: <code>_delta_log/00000000000000000042.json</code> holds <em>actions</em> (<code>add</code>, <code>remove</code>, <code>metaData</code>, <code>txn</code>); a commit is the atomic creation of the next log file (put-if-absent, historically needing an external lock store on S3); <strong>checkpoints</strong> (Parquet snapshots of the log state, by default every 10 commits) bound replay; deletion vectors, <code>MERGE</code>, change data feed, and, as the seminar's Databricks talk addresses, coordinated commits and multi-statement transactions.</li> <li><strong>Apache Hudi</strong>: a <em>timeline</em> of instants (requested, inflight, completed), copy-on-write and merge-on-read table types, record-level indexes for upserts, and streaming-friendly incremental queries; designed around frequent small updates.</li> <li><strong>DuckLake</strong>: stores the table metadata (snapshots, file lists, statistics) in an ordinary SQL database (DuckDB, PostgreSQL, SQLite) and only the data in Parquet files; the commit is a SQL transaction and the metadata can be queried and joined with SQL.</li> <li><strong>XTDB</strong>: bitemporal tables (valid time and system time), so a query can ask for the data as it was valid at one time as known at another.</li> <li><strong>Polaris and REST catalogs</strong>: access control, credential vending for the object store, and commit arbitration as a service, so engines need not each speak to a metastore.</li> <li><strong>File formats</strong>: Parquet remains the default; Lance and Vortex target faster random access, cascaded lightweight encodings and wide or vector columns.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Never commit without a conditional primitive.</strong> "Read latest, write latest + 1" on a plain object store loses commits (88% here). If the store lacks conditional writes, an external lock or a database must arbitrate.</li> <li><strong>One commit per row.</strong> At 10–30 ms per object-store operation, commit rates are tens per second per table; ingest in micro-batches, and watch the conflict rate (attempts per commit above 2 means writers are fighting).</li> <li><strong>Starvation</strong>: optimistic retry has no fairness; add jitter, a retry budget and, for hot tables, a single writer or a service that serializes commits.</li> <li><strong>Metadata growth</strong>: thousands of manifests turn planning into the bottleneck; merge manifests, expire snapshots, and checkpoint logs on a schedule.</li> <li><strong>Orphan removal races</strong>: deleting "unreferenced" files while a writer has uploaded but not yet committed them destroys data. Use a conservative age threshold (days, not seconds) and never remove files created after the oldest in-flight operation started.</li> <li><strong>Copy-on-write write amplification</strong>: updating one row rewrites a whole file; with large files and frequent updates prefer merge-on-read with deletion vectors and compact later.</li> <li><strong>Statistics need clustering</strong> (<a href="/cookbook/p/building-blocks">S4</a>): compaction that re-sorts is what keeps range pruning effective; compaction that merely concatenates restores the file count and not the skipping.</li> <li><strong>Time travel is not free</strong>: old snapshots pin old files; retention policies decide how long deleted data stays recoverable (and, for privacy deletion requests, how long it stays <em>stored</em>).</li> <li><strong>Cross-engine compatibility</strong>: every engine implements a subset of the spec; features such as delete files, column mapping or deletion vectors can make a table unreadable by an older reader. Pin protocol versions and test with every engine in use.</li> <li><strong>Conditional writes are not transactions across tables</strong>: a single pointer swap makes one table atomic; atomically changing two tables needs a catalog-level commit or a log shared by both.</li> </ul></aside>
"""

[[sources]]
title = "Delta Lake: High-Performance ACID Table Storage over Cloud Object Stores"
url = "https://www.vldb.org/pvldb/vol13/p3411-armbrust.pdf"
