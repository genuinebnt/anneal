[[sections]]
heading = "Selectivity formulas"
body = """
<p>How a planner turns the summaries into a row estimate, per predicate shape (<code>n</code> = rows, <code>d</code> = NDV, <code>nf</code> = null fraction):</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>predicate</th> <th>estimate</th> </tr> </thead> <tbody> <tr> <td><code>col = v</code></td> <td>MCV hit: its frequency. Otherwise <code>(1 - Σ mcv freq - nf) / (d - #mcv)</code> (PostgreSQL), or <code>bucket count / bucket distinct</code> with a histogram</td> </tr> <tr> <td><code>col &lt; v</code>, <code>col BETWEEN a AND b</code></td> <td>whole buckets below the bound plus the linear fraction of the boundary bucket, plus MCVs inside the range</td> </tr> <tr> <td><code>col IN (v1, …, vk)</code></td> <td>sum of the equality estimates, capped at 1 (duplicates removed first)</td> </tr> <tr> <td><code>col IS NULL</code></td> <td><code>nf</code></td> </tr> <tr> <td><code>col LIKE 'abc%'</code></td> <td>the range <code>['abc', 'abd')</code> on the histogram, times a fudge factor for the remaining pattern</td> </tr> <tr> <td><code>p AND q</code></td> <td><code>sel(p) × sel(q)</code> <strong>under independence</strong> (wrong when columns correlate: <a href="/cookbook/p/cardinality-estimation">Q8</a>)</td> </tr> <tr> <td><code>p OR q</code></td> <td><code>sel(p) + sel(q) - sel(p) × sel(q)</code></td> </tr> <tr> <td><code>NOT p</code></td> <td><code>1 - sel(p) - nf</code> for comparisons (NULL rows satisfy neither side)</td> </tr> <tr> <td><code>f(col) = v</code>, unknown function</td> <td>a <strong>default</strong> selectivity; PostgreSQL uses 0.005 for equality and 1/3 for an open inequality</td> </tr> <tr> <td>join <code>R.a = S.b</code></td> <td><code>1 / max(d_R, d_S)</code> per output pair, refined by histogram/MCV overlap (<a href="/cookbook/p/cardinality-estimation">Q8</a>)</td> </tr> </tbody> </table></div>

<aside data-call="note"><b>Defaults are the failure mode</b><p>Every row of that table has a fallback for "no statistics available", and the fallback is a constant. Wrapping a column in an expression, comparing it to a parameter whose value is unknown at plan time, or reading a table that was never analyzed all land on the constant. When a plan is mysteriously bad, the first question is: did the estimate come from a statistic or from a default?</p></aside>
"""

[[sections]]
heading = "Measured"
body = """
<p><strong>Workload.</strong> 1 M rows, 10 007 distinct values, Zipf with θ ∈ {0, 0.5, 1, 1.5} (θ = 0 uniform; at θ = 1 the hottest value holds 10% of the table; at θ = 1.5, 38%). Hot values are scattered across the domain, not clustered at the low end. 4 000 equality predicates drawn <strong>from rows</strong> (so frequent values dominate), 4 000 drawn <strong>from the distinct values</strong> (so rare values dominate), and 4 000 ranges of random width. Each estimator gets about 2–3 KB; the sample gets 80 KB (10 000 values).</p>

```text title="q-error (median / p99 / max) per estimator and skew"
Zipf theta = 0: 10007 distinct values, hottest value has 138 rows (0.0%)
estimator                       bytes | = (row-weighted) med/p99/max | = (value-weighted) med/p99/max |          range med/p99/max
uniform (min/max/ndv)              32 |     1.07     1.30     1.45 |     1.07     1.31     1.59 |     1.00     1.01     1.08
equi-width x100                  3200 |     1.07     1.30     1.45 |     1.07     1.30     1.57 |     1.00     1.01     1.07
equi-depth x100                  3200 |     1.07     1.30     1.44 |     1.07     1.31     1.57 |     1.00     1.01     1.07
MCV 50 + equi-depth x50          2400 |     1.07     1.28     1.45 |     1.07     1.30     1.59 |     1.00     1.01     1.09
sample of 10000                 80000 |     2.11      119      138 |     2.15      117      135 |     1.01     1.14     3.19
Zipf theta = 0.5: 10007 distinct values, hottest value has 5102 rows (0.5%)
estimator                       bytes | = (row-weighted) med/p99/max | = (value-weighted) med/p99/max |          range med/p99/max
uniform (min/max/ndv)              32 |     1.58    25.00    51.06 |     1.55     5.93    34.84 |     1.00     1.09     3.73
equi-width x100                  3200 |     1.58    21.68    35.78 |     1.54     5.97    26.56 |     1.00     1.06     3.70
equi-depth x99                   3168 |     1.58    20.40    27.01 |     1.54     6.11    24.25 |     1.00     1.06     3.73
MCV 50 + equi-depth x50          2400 |     1.46     6.62     7.38 |     1.48     4.47     7.38 |     1.00     1.05     1.59
sample of 10000                 80000 |     1.94      191      432 |     2.94      150      264 |     1.02     1.15      199
Zipf theta = 1: 10007 distinct values, hottest value has 102082 rows (10.2%)
estimator                       bytes | = (row-weighted) med/p99/max | = (value-weighted) med/p99/max |          range med/p99/max
uniform (min/max/ndv)              32 |    13.77     1022     1022 |     4.83    19.99      512 |     1.13     2.01    15.20
equi-width x100                  3200 |    19.80    96.15    96.15 |     3.66    56.17      212 |     1.00     1.49    15.76
equi-depth x70                   2240 |     8.10    78.11    78.11 |     3.57    40.04    78.11 |     1.01     1.55    20.13
MCV 50 + equi-depth x49          2368 |     1.22    32.35    34.11 |     2.87    14.99    34.11 |     1.00     1.13     3.68
sample of 10000                 80000 |     1.18      135      377 |    13.00      124      377 |     1.01     1.18    71.00
Zipf theta = 1.5: 6820 distinct values, hottest value has 385337 rows (38.5%)
estimator                       bytes | = (row-weighted) med/p99/max | = (value-weighted) med/p99/max |          range med/p99/max
uniform (min/max/ndv)              32 |      931     2628     2628 |    73.31      147     2628 |     1.74    10.11      300
equi-width x100                  3200 |    65.86    71.48     1102 |    13.12     1910     5851 |     1.00     3.55      261
equi-depth x25                    800 |    27.57      281      281 |    25.28      486      486 |     1.05     5.88      111
MCV 50 + equi-depth x47          2304 |     1.00    42.93    62.15 |     6.77    32.39    58.12 |     1.00     1.33    40.81
sample of 10000                 80000 |     1.02    47.00      267 |     2.00    78.00      195 |     1.01     1.38      225
```

<ul> <li><strong>On uniform data nothing matters</strong>: every summary is within 1.3× at p99, and the sample is <em>worse</em> (p99 119×: it simply has not seen most values). That is why the System R model survived for a decade.</li> <li><strong>Skew breaks the uniform model quickly</strong>: at θ = 1 the p99 equality error of <code>uniform</code> is <strong>1 022×</strong> (it says every value has 100 rows, the hottest has 102 082) and at θ = 1.5 even the <em>median</em> is 931×.</li> <li><strong>Equi-width and equi-depth are not enough on heavy skew</strong>: at θ = 1 they still have p99 errors of 96× and 78×, and at θ = 1.5 an equi-depth histogram asked for 100 buckets produced only <strong>25</strong>, because the hot values each fill a bucket on their own. They do fix <em>ranges</em> (median 1.0 and p99 ≈ 1.5 at θ = 1).</li> <li><strong>MCV + histogram wins on every skewed column at the same space</strong>: row-weighted equality has median <strong>1.22</strong> at θ = 1 (from 8.1 for equi-depth) and 1.00 at θ = 1.5, and ranges drop to p99 1.13 and 1.33. The remaining tail is the first values <em>past</em> the MCV list: rank 51 in a Zipf(1) column still has 2 000 rows, and the histogram spreads the rest evenly (p99 32).</li> <li><strong>A raw sample is a good estimator of frequent values and a poor one of rare values</strong> (median row-weighted error 1.18, value-weighted 13, p99 above 100): sampling noise on counts of a few rows is huge in relative terms, and a value that did not make it into the sample is estimated at zero.</li> </ul>

```text title="bucket budget: how many buckets does it take? (Zipf 1.0, p99 q-error)"
bucket budget, Zipf 1.0 (p99 q-error)
 buckets |       depth: =   depth: range |   MCV+depth: = MCV+depth: range
      10 |            287           1.88 |            208           1.59
      25 |            278           2.02 |          99.87           1.39
      50 |            138           1.82 |          57.78           1.21
     100 |          84.67           1.63 |          31.04           1.14
     250 |          71.74           1.52 |          14.63           1.07
    1000 |          15.40           1.06 |           5.04           1.02
```

<p>Giving the MCV layout half its space as exact counts and half as buckets dominates a pure histogram at <strong>every</strong> budget; with 100 slots (50 MCVs + 50 buckets) the equality p99 is 31 against 85 for 100 equi-depth buckets, and range errors are below 1.15. Past roughly 250 slots returns diminish for ranges (they are already within 7%) while the equality tail keeps shrinking, because each extra MCV removes one more value from the "assume uniform" region.</p>

```text title="statistics built from a sample (MCV 50 + equi-depth x50, Zipf 1.0, 1M rows)"
histograms built from a sample (equi-depth x100 / MCV 50 + x50), Zipf 1.0, 1M rows
   sample  build ms |     = row-w. med/p99 |   = value-w. med/p99 |        range med/p99
     1000       2.0 |      1.80        299 |     47.83        200 |      1.06       1.53
    10000       2.4 |      1.29      19.53 |      9.02      35.00 |      1.01       1.22
    30000       3.1 |      1.25      17.73 |      4.99      18.62 |      1.01       1.19
   100000       4.4 |      1.20      26.12 |      3.23      14.50 |      1.00       1.14
  1000000       6.5 |      1.22      29.49 |      2.88      15.74 |      1.00       1.16
```

<ul> <li><strong>A 30 000-row sample builds statistics as good as a full scan</strong> for ranges (p99 1.19 against 1.16) and for equality on frequent values (p99 17.7 against 29.5: the difference is noise). In this in-memory release-build benchmark the sample costs 3.1 ms to sort and summarize against 6.5 ms for all 1 M rows (the full-scan row includes copying the column; sorting is cheap here because the column has only 10 007 distinct values). The real saving is not the sort but <strong>not reading the table</strong>: a sample touches 30 000 rows (or the pages that hold them) where a full scan reads every page. That is why PostgreSQL's default is 300 × <code>default_statistics_target</code> = 30 000 rows regardless of table size.</li> <li><strong>Sampling hurts where counts are small</strong>: value-weighted equality medians fall from 48 (1 000 rows) to 9 (10 000) to 3 (100 000). Rare values are the part of the distribution a sample resolves worst, which is also where NDV estimates come from.</li> </ul>

```text title="distinct-count estimates from a sample"
distinct-count estimates from a 1% sample (ratio estimate/true; 1.00 is perfect), N = 1M
column                                 true |  scale-up      GEE     Chao     Duj1 |  HLL scan
near-unique (domain 10M, uniform)    951537 |      1.05     0.10     1.05     0.89 |     0.985
uniform, 100k values                  99998 |      9.52     0.91     1.00     0.92 |     0.998
uniform, 1k values                     1009 |    100.00     1.00     1.00     1.00 |     1.010
Zipf 1.0, 100k values                 80791 |      5.37     0.45     0.25     0.08 |     1.004
Zipf 1.5, 100k values                 11814 |      5.54     0.38     0.15     0.06 |     0.987
same, uniform 100k values, as the sample grows
  sample |  scale-up      GEE     Chao     Duj1
    1000 |      9.95     0.31     0.99     0.91
   10000 |      9.52     0.91     1.00     0.91
  100000 |      6.33     1.43     1.01     0.95
  500000 |      1.99     1.01     1.00     1.00
```

<ul> <li><strong>Scaling the sample's NDV up by <code>N/m</code> is wrong by up to 100×</strong>: it is correct only for a nearly unique column (1.05) and says 9.5× too many for a 100 k-value column. Never use it.</li> <li><strong>No estimator is good everywhere.</strong> On uniform columns Chao and Duj1 land within 11% at a 1% sample. On a skewed long tail all three (GEE, Chao, Duj1) are 2× to 17× <strong>too low</strong> (Duj1 0.08 and 0.06 on Zipf), and on a near-unique column GEE sits at 0.10, exactly its guaranteed √(N/m) = 10× worst case. Charikar et al. prove that no estimator based on a sample alone can be accurate on all distributions.</li> <li><strong>HyperLogLog over the full data is within 1.5% on every column</strong> (p = 14, 16 KB). If you can afford to read every row (a column store scan, a bulk load, a compaction), use a sketch; keep sampled estimators for the case where you cannot.</li> <li><strong>Larger samples help very non-linearly</strong>: scale-up goes 9.95 → 9.52 → 6.33 → 1.99 as the sample grows from 1 k to 500 k rows, while Duj1 improves from 0.91 to 1.00.</li> </ul>

```text title="block sampling vs row sampling on a clustered table"
block vs row sampling, 1M rows, 20k values, 100 rows/page, ~1% of rows
layout                 true ndv |  row Duj1 page Duj1 | page range p99
random order              20011 |      0.71      0.74 |         1.13
clustered by value        20011 |      0.72      0.01 |        11020
```

<p><strong>Block sampling is biased on clustered data.</strong> If the table is stored in value order, a sampled page holds 100 copies of one or two values; a 1% page sample sees only 1% of the <em>values</em>, so its NDV is <strong>100× too low</strong> (0.01) and range estimates are wrong by <strong>11 020×</strong> at p99. On randomly ordered data page sampling is as good as row sampling (range p99 1.13). Production systems either sample pages and then rows from each page (PostgreSQL's two-stage <code>ANALYZE</code>) and correct for page-level correlation, or ignore physical layout by sampling rows directly when the storage allows it.</p>

```text title="stale statistics: new rows arrive after ANALYZE"
stale statistics: built once on 1M rows, then new rows are appended (the new rows' values are shifted up by 2000, i.e. a growing key)
  new rows |       = row-w. med/p99 |          range med/p99 | range above old max: est vs true
        0% |       1.17       32.06 |       1.00        1.13 |            0 vs         0
        1% |       1.25       31.15 |       1.00         745 |            0 vs      1704
       10% |       1.53         167 |       1.01        7954 |            0 vs     16222
       50% |       2.26        3228 |       1.03       38419 |            0 vs     81644
      100% |       3.42        9271 |       1.05       80735 |            0 vs    162819
```

<ul> <li><strong>Statistics tolerate growth but not drift.</strong> With 1% new rows the median error stays at 1.00 for ranges; the damage is in the <strong>tail</strong>: ranges that touch the new key range have p99 errors of 745 at 1%, 7 954 at 10%, and 80 735 when the table has doubled.</li> <li><strong>The "above the old maximum" row is the common production bug</strong>: an <code>ORDER BY ts DESC LIMIT 10</code>, a "rows since the last hour" filter, or a join with the newest orders asks for the part of the domain the statistics have never seen, so the estimate is <strong>0 rows</strong> (clamped to 1) while the truth is 162 819. The planner then picks a nested loop. PostgreSQL's selectivity code (<code>get_actual_variable_range</code>) probes the index for the current minimum or maximum when a constant falls outside the histogram; most systems need an equivalent patch for exactly this reason.</li> </ul>
"""

[[sections]]
heading = "Collecting statistics"
body = """
<ol> <li><strong>Trigger</strong>: count row modifications per table; when the number exceeds a threshold (<code>50 + 10% × rows</code> in PostgreSQL autovacuum; roughly <code>√(1000 × rows)</code> for large tables in newer SQL Server), schedule a background analyze. Also analyze after a bulk load and after a <code>CREATE INDEX</code>.</li> <li><strong>Sample</strong>: draw a row sample of fixed size (~30 000) with block-then-row sampling (above), or, in an LSM or column store, use a <strong>full scan folded into compaction</strong> and keep a sketch per file.</li> <li><strong>Summarize</strong>: sort the sample once; build runs; take the MCV list, then the equi-depth histogram of the remainder, then NDV (sampled estimator, or a sketch if available), null fraction, correlation.</li> <li><strong>Publish atomically</strong>: write the new statistics in a transaction, version them, and let running plans keep the old ones.</li> <li><strong>Merge, don't rebuild, in partitioned or distributed tables</strong>: HLL sketches merge exactly (register-wise max), counts and null fractions add; histograms need a common bucket boundary or re-bucketing from samples.</li> <li><strong>Feedback closes the loop</strong>: after execution, compare estimated and actual rows per operator; large q-errors mark the columns whose statistics are worth refreshing or extending (<a href="/cookbook/p/adaptive-and-robust">Q10</a>).</li> </ol>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A trait object per estimator</strong>: <code>Vec&lt;Box&lt;dyn Estimator&gt;&gt;</code> makes the comparison table a loop, and the property test applies the same invariants to every implementation. The trait is object-safe because it has no generic methods and no <code>Self</code> in return position.</li> <li><strong><code>partition_point</code> is the whole search layer</strong>: bucket lookup, sample counts and exact ranges are all <code>slice::partition_point</code> on sorted data (<code>O(log n)</code>, no manual binary-search off-by-ones). <code>Exact::range</code> is two calls and a subtraction.</li> <li><strong>One builder, two inputs</strong>: every builder takes <code>&amp;[(i64, u64)]</code> runs and a <code>scale: f64</code>, not the raw column. The same code builds from a full scan, a sample (scale <code>N/m</code>), or a merged set of per-partition runs, and the MCV step can <em>remove</em> runs before the histogram sees them with a plain <code>filter</code>.</li> <li><strong><code>f64</code> for counts</strong>: a scaled-up count is a real number, a bucket's <code>distinct</code> is an estimate, and the arithmetic mixes them; storing everything as <code>f64</code> and converting at the edges avoids overflow and truncation bugs in <code>count * (z - a + 1) / (hi - lo + 1)</code>.</li> <li><strong><code>iter().enumerate()</code> for reservoir sampling</strong>: Algorithm R needs only the running index, so the sampler takes <code>impl Iterator&lt;Item = i64&gt;</code> and works on a table scan, a file reader or a network stream without knowing the length.</li> <li><strong>Deterministic generators in tests</strong>: the <code>Rng</code> is a seeded xorshift, so every number in this chapter reproduces; a statistical test that can fail 1 run in 1 000 is a flaky test, so tolerances are set from the seeded run, not from theory.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Invariants (proptest on random small columns, all three histogram types)</strong>: total mass equals <code>n</code>; the sum of equality estimates over all distinct values equals <code>n</code>; range estimates are non-negative and monotone in the upper bound; the full-domain range returns <code>n</code>.</li> <li><strong>Exactness</strong>: when every value is at least as heavy as a bucket's target share, each value gets its own bucket and equality estimates are exact.</li> <li><strong>Bucket structure</strong>: buckets are sorted and disjoint, and no equi-depth bucket exceeds its target by more than the heaviest single value.</li> <li><strong>Sampler uniformity</strong>: 40 000 runs of Algorithm R over 20 items with <code>k = 5</code> must put every item in the reservoir within 5% of <code>k/n</code> of the runs.</li> <li><strong>Estimator bounds</strong>: every NDV estimate lies in <code>[distinct in sample, N]</code>; HLL is within 3% on a 5 003-value column.</li> <li><strong>Interpolation</strong>: one bucket over 100 values × 10 rows must give 250 rows for <code>[0, 24]</code> and 10 for a single value. The mass properties alone do not catch a range estimator that ignores the partial bucket, because they only ask for the full range.</li> <li><strong>Mutants run against these tests</strong>: drop the <code>scale</code> on the last equi-depth bucket (caught by the mass property: it generates scales from 1 to 40); divide equality by the value range instead of the distinct count (caught); leave the MCVs in the histogram input (double counting; caught); return the whole bucket for a partial range (<strong>survived the mass properties</strong>, killed by the interpolation test).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong>: <code>ANALYZE</code> samples 300 × <code>default_statistics_target</code> rows (30 000 at the default 100), stores per column an MCV list and an equi-depth histogram of the remaining values (up to <code>default_statistics_target</code> entries each), <code>n_distinct</code> (Haas–Stokes Duj1 from the sample), null fraction and physical <code>correlation</code>. Autovacuum runs analyze after <code>autovacuum_analyze_threshold</code> (50) plus <code>autovacuum_analyze_scale_factor</code> (0.1) × rows have changed. <code>CREATE STATISTICS</code> adds multi-column <code>ndistinct</code>, functional <code>dependencies</code> and joint MCV lists (<a href="/cookbook/p/cardinality-estimation">Q8</a>).</li> <li><strong>SQL Server</strong>: one histogram per statistics object of up to <strong>200 steps</strong> (each with <code>EQ_ROWS</code>, <code>RANGE_ROWS</code>, <code>DISTINCT_RANGE_ROWS</code>, <code>AVG_RANGE_ROWS</code>: a bucket plus the exact count of its upper bound, which is MCV-ish by construction), plus a density vector for multi-column prefixes; auto-update thresholds that tighten with table size; incremental statistics for partitions.</li> <li><strong>Oracle</strong>: frequency, top-frequency, hybrid and (older) height-balanced histograms chosen by the number of distinct values; extended statistics for column groups and expressions.</li> <li><strong>MySQL 8</strong>: histograms are opt-in (<code>ANALYZE TABLE … UPDATE HISTOGRAM ON col WITH N BUCKETS</code>), singleton or equi-height, and matter mainly for columns without an index; for indexed columns the optimizer can use index dives (probing the B-tree) instead.</li> <li><strong>Column stores and lakehouses</strong> (Parquet, Iceberg, Delta): min/max, null count and sometimes an NDV sketch <strong>per row group or file</strong>, written at load time and merged for the table: statistics come free with the data, and zone maps double as an execution-time filter (<a href="/cookbook/p/storage-models-and-compression">L06</a>, <a href="/cookbook/p/columnar-formats-and-nested-data">A12</a>).</li> <li><strong>DuckDB, ClickHouse</strong>: lean on per-block min/max and, in DuckDB, on sampling at plan time rather than classical histograms; check the current source, this area moves quickly.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>A wrong NDV poisons everything downstream</strong>: join selectivity, <code>GROUP BY</code> output size and <code>rows / NDV</code> equality all divide by it. If you must choose, spend your budget on a good NDV (HLL on a scan) before more histogram buckets.</li> <li><strong>Statistics describe the data at analyze time, not at plan time</strong>: when plans flip after a deploy or a bulk load, check <code>last_analyze</code> before checking the optimizer.</li> <li><strong>Parameterized queries and prepared statements</strong> plan without seeing the parameter, so the estimate for <code>col = $1</code> is <code>1/NDV</code>, wrong by orders of magnitude for a hot value; systems either re-plan per execution for skewed columns or build custom and generic plans and pick the cheaper after a few runs.</li> <li><strong>Never return 0 rows</strong> from an estimator. Zero multiplies through every join above it and makes a nested loop look free; clamp to at least 1.</li> <li><strong>Equality outside every bucket</strong> (<code>col = 5</code> where all histogram buckets lie above 100): the estimate is 0 and the planner's clamp makes it one row; that is right for a value that does not exist and wrong for a value inserted after the analyze.</li> <li><strong>Do not trust a tail you did not measure</strong>: report p99, not the mean, in every estimator test. On uniform data every estimator has the same median and p99; under skew the medians of <code>uniform</code> and the plain histograms already diverge (13.8 and 8.1 for row-weighted equality at θ = 1), but the largest differences between layouts are in the p99.</li> <li><strong>A bigger sample is not the first lever</strong>: going from 30 000 to 1 M rows changes no accuracy metric above by more than noise but multiplies the I/O by 30 or more; raise the MCV count first (the budget table), the sample size second.</li> </ul></aside>
"""

