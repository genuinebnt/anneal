[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Every plan choice is a bet on row counts.</strong> The cost of a join order, an access path or a join algorithm is a function of how many rows each operator will see, and nothing is known about intermediate results except what <strong>statistics</strong> say about the base tables. Wrong statistics do not make a plan a little slower, they make it the wrong shape (a nested loop where a hash join belongs), and errors <strong>multiply</strong> through joins.</li> <li><strong>A statistic is a tiny summary of a column</strong> that is cheap to keep and answers "what fraction of rows satisfies this predicate?" Three layers, in the order a planner uses them: <strong>table level</strong> (row count, pages), <strong>column level</strong> (null fraction, number of distinct values <strong>NDV</strong>, min, max, average width), and <strong>distribution level</strong> (a histogram, a most-common-values list, a sketch or a sample).</li> <li><strong>Skew is what makes statistics hard.</strong> With a uniform column, <code>rows / NDV</code> answers every equality predicate. Real columns are Zipf-like: a few values hold most rows and a long tail holds a handful each, so one number for "rows per value" is wrong by orders of magnitude for both ends.</li> <li><strong>Histograms trade space for resolution.</strong> <em>Equi-width</em> buckets are trivial to build and useless on skew (one bucket swallows the hot values). <em>Equi-depth</em> (equal rows per bucket) bounds the error per bucket but cannot isolate a heavy hitter. <em>Compressed</em> layouts keep the <strong>most common values exactly</strong> and bucket the rest, which is what PostgreSQL does and what wins the measurements below. <em>V-optimal / MaxDiff</em> histograms minimize the within-bucket variance, at a much higher build cost.</li> <li><strong>Inside a bucket, assume uniformity.</strong> Range predicates interpolate linearly across the partial bucket at the boundary; equality predicates divide the bucket count by the bucket's distinct values. These two assumptions are the whole model.</li> <li><strong>Sampling replaces a full scan, with limits.</strong> A uniform sample of a few tens of thousands of rows predicts frequent values and wide ranges well at any table size, because error depends on the sample, not the table. It cannot see rare values, and <strong>estimating NDV from a sample is fundamentally hard</strong> (a guarantee of error better than about √(N/m) is impossible in the worst case).</li> <li><strong>Sketches summarize a full scan in one pass</strong>: HyperLogLog for NDV (±1% in 16 KB), Count-Min for frequencies, quantile sketches for histograms. They are mergeable, so per-partition statistics combine without rescanning, and they update incrementally as data arrives.</li> <li><strong>Statistics go stale.</strong> A table that grew by a few percent is fine; one that grew a new key range is not, because the old histogram says "no rows there". Collection is triggered by the volume of changes (PostgreSQL's autovacuum analyzes after 50 rows plus 10% of the table changed), and a good estimator <strong>degrades gracefully</strong> (never returns 0 rows, clamps at one).</li> <li><strong>Measure with q-error, not absolute error.</strong> Planner decisions are sensitive to <em>ratios</em> of cardinalities, so the right metric is <code>max(est/true, true/est)</code> (clamped to ≥ 1 row). Report its median <strong>and</strong> its tail: the p99 is where bad plans come from.</li> </ul>
"""

