heading = "What to store"
body = """
<p>The catalog entry a planner needs for one column, with the PostgreSQL <code>pg_stats</code> name where it exists and the size you should expect:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>statistic</th> <th>what it answers</th> <th>PostgreSQL</th> <th>typical size</th> </tr> </thead> <tbody> <tr> <td>row count, page count</td> <td>cost of a scan, scale of everything</td> <td><code>reltuples</code>, <code>relpages</code></td> <td>16 B per table</td> </tr> <tr> <td>null fraction</td> <td><code>IS NULL</code>, outer-join padding</td> <td><code>null_frac</code></td> <td>8 B</td> </tr> <tr> <td>distinct count (NDV)</td> <td><code>col = ?</code>, <code>GROUP BY</code> output, join selectivity</td> <td><code>n_distinct</code> (negative = fraction of rows)</td> <td>8 B</td> </tr> <tr> <td>min / max</td> <td>range-edge checks, "value out of range"</td> <td>first / last histogram bound</td> <td>2 values</td> </tr> <tr> <td>most common values + frequencies</td> <td>skewed equality, hot keys</td> <td><code>most_common_vals</code>, <code>most_common_freqs</code></td> <td>up to 100 × (value, 8 B)</td> </tr> <tr> <td>equi-depth histogram</td> <td>ranges, inequality, <code>&lt;</code>/<code>&gt;</code>, <code>LIKE 'abc%'</code></td> <td><code>histogram_bounds</code></td> <td>up to 101 bounds</td> </tr> <tr> <td>physical correlation</td> <td>index scan I/O (sequential or random)</td> <td><code>correlation</code></td> <td>8 B</td> </tr> <tr> <td>average width</td> <td>memory for sorts, hash tables, network</td> <td><code>avg_width</code></td> <td>8 B</td> </tr> <tr> <td>multi-column NDV, dependencies, joint MCV</td> <td>correlated predicates (<a href="/cookbook/p/cardinality-estimation">Q8</a>)</td> <td><code>CREATE STATISTICS</code></td> <td>per statistics object</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Summaries, executable"
body = """
<p>The module builds the same summaries a real system keeps, behind one <code>Estimator</code> trait (<code>eq</code>, <code>range</code>, <code>bytes</code>) so they can be compared on one workload:</p>

<ol> <li><strong><code>Uniform</code></strong>: min, max and NDV (the System R model), the baseline.</li> <li><strong><code>Histogram</code></strong>: <em>equi-width</em> and <em>equi-depth</em> builders over the column's <code>(value, count)</code> runs. The equi-depth builder never splits a value across buckets, so a heavy hitter makes its bucket bigger instead of corrupting two neighbours; the result is that you may get fewer buckets than you asked for on skewed data.</li> <li><strong><code>Compressed</code></strong>: the top-<code>k</code> values above 1.25× the average frequency are stored exactly, the rest go into an equi-depth histogram. Predicates add the exact part and the histogram part.</li> <li><strong><code>SampleEst</code></strong>: keep a uniform sample and scale predicate counts up.</li> <li><strong>Samplers</strong>: Bernoulli (each row with probability <code>p</code>), <strong>reservoir</strong> (Algorithm R, exact size, one pass, unknown table length) and <strong>block</strong> sampling (whole pages).</li> <li><strong>NDV estimators over a sample's frequency profile</strong>: naive scale-up, GEE, Chao, Haas–Stokes Duj1, plus a HyperLogLog full-scan estimate.</li> <li><strong><code>q_error</code></strong> and a small percentile summarizer.</li> </ol>

<p>All builders accept a <code>scale</code> factor so the same code builds a histogram from a full scan (<code>scale = 1</code>) or from a sample (<code>scale = N / m</code>).</p>

:::deeper Reference: Zipf generator, exact oracle, uniform / equi-width / equi-depth / MCV estimators, samplers, NDV estimators, q-error
```rust title="src/opt/stats.rs"
//! Column statistics for cardinality estimation: equi-width and equi-depth histograms, most-common-values (MCV)
//! lists, row/block/reservoir sampling, distinct-count estimators from a sample, and the q-error metric.
use std::collections::HashMap;
use crate::hll::HyperLogLog;
use crate::joinorder::Rng;

// ---------- data generation and ground truth ----------

/// `n` values from a Zipf(theta) distribution over `domain` distinct values (theta = 0 is uniform).
/// Rank r is mapped to `r * 7919 mod domain`, a bijection when `domain` is not a multiple of 7919 (use a prime),
/// so the hot values are scattered over the domain instead of sitting at its low end.
pub fn zipf(r: &mut Rng, n: usize, domain: u64, theta: f64) -> Vec<i64> {
    let mut cdf = Vec::with_capacity(domain as usize);
    let mut s = 0.0;
    for k in 1..=domain { s += 1.0 / (k as f64).powf(theta); cdf.push(s); }
    (0..n).map(|_| {
        let u = r.unit() * s;
        let rank = cdf.partition_point(|&c| c < u).min(domain as usize - 1) as u64;
        ((rank * 7919) % domain) as i64
    }).collect()
}

/// Exact answers, the oracle every estimator is judged against.
pub struct Exact { pub sorted: Vec<i64>, pub freq: HashMap<i64, u64> }
impl Exact {
    pub fn new(v: &[i64]) -> Self {
        let mut sorted = v.to_vec();
        sorted.sort_unstable();
        let mut freq = HashMap::new();
        for &x in v { *freq.entry(x).or_insert(0) += 1; }
        Exact { sorted, freq }
    }
    pub fn eq(&self, v: i64) -> f64 { *self.freq.get(&v).unwrap_or(&0) as f64 }
    pub fn range(&self, lo: i64, hi: i64) -> f64 {
        if lo > hi { return 0.0; }
        (self.sorted.partition_point(|&x| x <= hi) - self.sorted.partition_point(|&x| x < lo)) as f64
    }
    pub fn ndv(&self) -> usize { self.freq.len() }
}

/// (value, multiplicity) pairs of a sorted slice.
pub fn runs(sorted: &[i64]) -> Vec<(i64, u64)> {
    let mut out: Vec<(i64, u64)> = Vec::new();
    for &x in sorted {
        match out.last_mut() { Some(l) if l.0 == x => l.1 += 1, _ => out.push((x, 1)) }
    }
    out
}

// ---------- the estimator interface ----------

pub trait Estimator {
    fn name(&self) -> String;
    /// Estimated rows with `col = v`.
    fn eq(&self, v: i64) -> f64;
    /// Estimated rows with `lo <= col <= hi`.
    fn range(&self, lo: i64, hi: i64) -> f64;
    /// Size of the statistic if stored on disk (8 bytes per number).
    fn bytes(&self) -> usize;
}

/// The System R baseline: min, max, number of distinct values, and a uniformity assumption.
pub struct Uniform { pub n: f64, pub min: i64, pub max: i64, pub ndv: f64 }
impl Uniform {
    pub fn new(sorted: &[i64]) -> Self {
        let ndv = runs(sorted).len() as f64;
        Uniform { n: sorted.len() as f64, min: sorted[0], max: *sorted.last().unwrap(), ndv }
    }
}
impl Estimator for Uniform {
    fn name(&self) -> String { "uniform (min/max/ndv)".into() }
    fn eq(&self, v: i64) -> f64 { if v < self.min || v > self.max { 0.0 } else { self.n / self.ndv } }
    fn range(&self, lo: i64, hi: i64) -> f64 {
        let (a, b) = (lo.max(self.min), hi.min(self.max));
        if a > b { return 0.0; }
        self.n * (b - a + 1) as f64 / (self.max - self.min + 1) as f64
    }
    fn bytes(&self) -> usize { 32 }
}

// ---------- histograms ----------

/// `[lo, hi]` holds `count` rows with `distinct` distinct values, assumed uniform inside the bucket.
#[derive(Clone, Debug)]
pub struct Bucket { pub lo: i64, pub hi: i64, pub count: f64, pub distinct: f64 }

/// Buckets sorted by value and pairwise disjoint (gaps between them hold no rows).
pub struct Histogram { pub kind: &'static str, pub buckets: Vec<Bucket> }

impl Histogram {
    /// Equal value ranges, unequal row counts. `scale` multiplies counts when built from a sample.
    pub fn equi_width(runs: &[(i64, u64)], nb: usize, scale: f64) -> Self {
        let (lo, hi) = (runs[0].0, runs.last().unwrap().0);
        let w = ((hi - lo + 1) as f64 / nb as f64).ceil() as i64;
        let mut buckets: Vec<Bucket> = (0..nb as i64)
            .map(|i| Bucket { lo: lo + i * w, hi: (lo + (i + 1) * w - 1).min(hi), count: 0.0, distinct: 0.0 }).collect();
        for &(v, c) in runs {
            let b = &mut buckets[((v - lo) / w) as usize];
            b.count += c as f64 * scale;
            b.distinct += 1.0;
        }
        buckets.retain(|b| b.count > 0.0);
        Histogram { kind: "equi-width", buckets }
    }

    /// Equal row counts, unequal value ranges. A value never straddles two buckets, so a heavy hitter
    /// simply makes its bucket larger (and `distinct` small): equality estimates stay honest.
    pub fn equi_depth(runs: &[(i64, u64)], nb: usize, scale: f64) -> Self {
        let total: u64 = runs.iter().map(|r| r.1).sum();
        let target = total as f64 / nb as f64;
        let mut buckets: Vec<Bucket> = Vec::new();
        let mut cur: Option<Bucket> = None;
        for &(v, c) in runs {
            let b = cur.get_or_insert(Bucket { lo: v, hi: v, count: 0.0, distinct: 0.0 });
            b.hi = v;
            b.count += c as f64;
            b.distinct += 1.0;
            if b.count >= target && buckets.len() + 1 < nb {
                let mut done = cur.take().unwrap();
                done.count *= scale;
                buckets.push(done);
            }
        }
        if let Some(mut b) = cur { b.count *= scale; buckets.push(b); }
        Histogram { kind: "equi-depth", buckets }
    }

    fn find(&self, v: i64) -> Option<&Bucket> {
        let i = self.buckets.partition_point(|b| b.hi < v);
        self.buckets.get(i).filter(|b| b.lo <= v)
    }
    pub fn eq(&self, v: i64) -> f64 { self.find(v).map_or(0.0, |b| b.count / b.distinct) }
    pub fn range(&self, lo: i64, hi: i64) -> f64 {
        let mut sum = 0.0;
        for b in &self.buckets {
            let (a, z) = (lo.max(b.lo), hi.min(b.hi));
            if a <= z { sum += b.count * (z - a + 1) as f64 / (b.hi - b.lo + 1) as f64; }
        }
        sum
    }
    pub fn total(&self) -> f64 { self.buckets.iter().map(|b| b.count).sum() }
}

impl Estimator for Histogram {
    fn name(&self) -> String { format!("{} x{}", self.kind, self.buckets.len()) }
    fn eq(&self, v: i64) -> f64 { Histogram::eq(self, v) }
    fn range(&self, lo: i64, hi: i64) -> f64 { Histogram::range(self, lo, hi) }
    fn bytes(&self) -> usize { self.buckets.len() * 32 }
}

/// The PostgreSQL / "compressed histogram" layout: exact counts for the `k` most common values,
/// an equi-depth histogram for everything else.
pub struct Compressed { pub mcv: HashMap<i64, f64>, pub rest: Histogram }
impl Compressed {
    pub fn build(runs: &[(i64, u64)], k: usize, nb: usize, scale: f64) -> Self {
        let total: u64 = runs.iter().map(|r| r.1).sum();
        let avg = total as f64 / runs.len() as f64;
        let mut by_count: Vec<(i64, u64)> = runs.to_vec();
        by_count.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));
        // only values clearly above average frequency earn a slot (PostgreSQL uses 1.25x)
        let mcv: HashMap<i64, f64> = by_count.iter().take(k)
            .filter(|r| r.1 as f64 > 1.25 * avg).map(|r| (r.0, r.1 as f64 * scale)).collect();
        let rest_runs: Vec<(i64, u64)> = runs.iter().filter(|r| !mcv.contains_key(&r.0)).copied().collect();
        let rest = if rest_runs.is_empty() { Histogram { kind: "equi-depth", buckets: vec![] } }
                   else { Histogram::equi_depth(&rest_runs, nb, scale) };
        Compressed { mcv, rest }
    }
}
impl Estimator for Compressed {
    fn name(&self) -> String { format!("MCV {} + equi-depth x{}", self.mcv.len(), self.rest.buckets.len()) }
    fn eq(&self, v: i64) -> f64 { self.mcv.get(&v).copied().unwrap_or_else(|| self.rest.eq(v)) }
    fn range(&self, lo: i64, hi: i64) -> f64 {
        let hot: f64 = self.mcv.iter().filter(|(v, _)| **v >= lo && **v <= hi).map(|(_, c)| c).sum();
        hot + self.rest.range(lo, hi)
    }
    fn bytes(&self) -> usize { self.mcv.len() * 16 + self.rest.buckets.len() * 32 }
}

/// Keep the sample itself as the statistic: answer predicates by counting inside it and scaling up.
pub struct SampleEst { pub sorted: Vec<i64>, pub scale: f64 }
impl SampleEst {
    pub fn new(mut sample: Vec<i64>, population: usize) -> Self {
        sample.sort_unstable();
        let scale = population as f64 / sample.len() as f64;
        SampleEst { sorted: sample, scale }
    }
}
impl Estimator for SampleEst {
    fn name(&self) -> String { format!("sample of {}", self.sorted.len()) }
    fn eq(&self, v: i64) -> f64 {
        (self.sorted.partition_point(|&x| x <= v) - self.sorted.partition_point(|&x| x < v)) as f64 * self.scale
    }
    fn range(&self, lo: i64, hi: i64) -> f64 {
        if lo > hi { return 0.0; }
        (self.sorted.partition_point(|&x| x <= hi) - self.sorted.partition_point(|&x| x < lo)) as f64 * self.scale
    }
    fn bytes(&self) -> usize { self.sorted.len() * 8 }
}

// ---------- sampling ----------

/// Each row independently with probability `p`: one pass, no need to know the table size, variable sample size.
pub fn bernoulli(r: &mut Rng, v: &[i64], p: f64) -> Vec<i64> { v.iter().copied().filter(|_| r.unit() < p).collect() }

/// Algorithm R: a uniform sample of exactly `k` items from a stream of unknown length, one pass, O(k) memory.
/// After item `i` (0-based) is seen, every item so far is in the reservoir with probability `k / (i + 1)`.
pub fn reservoir(r: &mut Rng, items: impl Iterator<Item = i64>, k: usize) -> Vec<i64> {
    let mut res = Vec::with_capacity(k);
    for (i, x) in items.enumerate() {
        if i < k { res.push(x); } else {
            let j = r.next(i as u64 + 1) as usize;
            if j < k { res[j] = x; }
        }
    }
    res
}

/// Whole pages with probability `p` (what a disk-based ANALYZE can afford): cheap, but biased when values
/// are clustered by page, because rows on a page are not independent draws.
pub fn block_sample(r: &mut Rng, v: &[i64], rows_per_page: usize, p: f64) -> Vec<i64> {
    v.chunks(rows_per_page).filter(|_| r.unit() < p).flatten().copied().collect()
}

// ---------- distinct-value estimators ----------

/// The sample's frequency profile: `f[j]` = number of values that appear exactly `j` times (`f[0]` unused).
pub struct Profile { pub m: f64, pub d: f64, pub f: Vec<f64> }
pub fn profile(sample: &[i64]) -> Profile {
    let mut cnt: HashMap<i64, usize> = HashMap::new();
    for &x in sample { *cnt.entry(x).or_insert(0) += 1; }
    let maxf = cnt.values().copied().max().unwrap_or(0);
    let mut f = vec![0.0; maxf + 1];
    for &c in cnt.values() { f[c] += 1.0; }
    Profile { m: sample.len() as f64, d: cnt.len() as f64, f }
}
impl Profile {
    fn f(&self, j: usize) -> f64 { self.f.get(j).copied().unwrap_or(0.0) }
    fn clamp(&self, e: f64, population: f64) -> f64 { e.clamp(self.d, population) }
    /// "Multiply by N/m": right for unique columns, absurd for anything with repeated values.
    pub fn scale_up(&self, n: f64) -> f64 { self.clamp(self.d * n / self.m, n) }
    /// Guaranteed-Error Estimator (Charikar et al.): singletons stand for many unseen values, the rest are seen.
    pub fn gee(&self, n: f64) -> f64 {
        let rest: f64 = self.d - self.f(1);
        self.clamp((n / self.m).sqrt() * self.f(1) + rest, n)
    }
    /// Chao's lower bound from the singletons and doubletons.
    pub fn chao(&self, n: f64) -> f64 {
        let (f1, f2) = (self.f(1), self.f(2));
        let extra = if f2 > 0.0 { f1 * f1 / (2.0 * f2) } else { f1 * (f1 - 1.0) / 2.0 };
        self.clamp(self.d + extra, n)
    }
    /// Haas & Stokes' smoothed jackknife (the first-order form, "Duj1"), used by PostgreSQL's ANALYZE.
    pub fn duj1(&self, n: f64) -> f64 {
        let q = self.m / n;
        self.clamp(self.d / (1.0 - (1.0 - q) * self.f(1) / self.m), n)
    }
}

/// Full-scan sketch: ±1% with 16 KB, mergeable, the estimator to use when you can see every row.
pub fn ndv_hll(v: &[i64]) -> f64 {
    let mut h = HyperLogLog::new(14);
    for &x in v { h.add_hash(mix(x as u64)); }
    h.estimate()
}
fn mix(mut z: u64) -> u64 {
    z = (z ^ (z >> 30)).wrapping_mul(0xbf58476d1ce4e5b9);
    z = (z ^ (z >> 27)).wrapping_mul(0x94d049bb133111eb);
    z ^ (z >> 31)
}

// ---------- error metric ----------

/// q-error = max(est/true, true/est), with both clamped to at least one row (an estimate of 0 rows is never
/// safe for a planner, and a true count of 0 means "any estimate close to 1 is right").
pub fn q_error(est: f64, truth: f64) -> f64 {
    let (e, t) = (est.max(1.0), truth.max(1.0));
    (e / t).max(t / e)
}

#[derive(Clone, Copy, Debug)]
pub struct QDist { pub median: f64, pub p90: f64, pub p99: f64, pub max: f64 }
pub fn summarize(mut q: Vec<f64>) -> QDist {
    q.sort_by(|a, b| a.partial_cmp(b).unwrap());
    let at = |p: f64| q[(((q.len() - 1) as f64) * p).round() as usize];
    QDist { median: at(0.5), p90: at(0.9), p99: at(0.99), max: *q.last().unwrap() }
}
```
