body = """
<p>The workload has three tables, <code>docs(id, owner, level, body)</code>, <code>tags(doc, tag)</code> and <code>orgs(owner, region)</code>, four roles with every privilege, and the policies <code>docs: owner = current_user OR level &gt;= 3</code>, <code>tags: tag &lt;&gt; 'secret'</code>, <code>orgs: owner = current_user</code>. About one document in fifteen has a NULL owner and one in fifteen a NULL level, and the levels include the values that make <code>100 / (level - k)</code> fail. 600 random queries per role (single-table filters with the dangerous divisions, grouping with <code>HAVING</code>, <code>DISTINCT</code>, <code>ORDER BY … LIMIT</code>, inner and left joins with conditions in <code>ON</code> and in <code>WHERE</code>, three-table joins, a self-join under two aliases, aggregates without a <code>GROUP BY</code>) are run twice: as the role on the full database, and as an administrator on the copy that holds only the rows the role may see.</p>

```text title="the same queries under the policy and on a database with only the visible rows"
1735 queries answered the same, 665 failed the same way; 37734 rows compared
```

```text title="a long run of statements that change data, compared with the copy after each one"
182 updates and deletes matched the copy, 129 inserts accepted, 169 statements refused; hidden rows never changed
```

```text title="the cost of the policy on 100 000 documents, and the plan the engine runs"
query                                            admin      role ann   admin saw     ann saw   ratio
scan, filter, aggregate                        17.2 ms       22.4 ms count 66739 count 54270   1.30x
group by                                       17.5 ms       22.6 ms      4 rows      4 rows   1.29x
join with a table that has no policy           34.3 ms       38.8 ms count 50000 count 31117   1.13x
point lookup (a scan)                          13.0 ms       13.0 ms      1 rows      1 rows   1.00x
authorize + rewrite of a join query: 1.9 us per statement
plan for ann's SELECT id FROM docs WHERE 100 / (level - 1) > 2:
  Projection [Col(0)]
    SeqScan docs filter=Bin(And, Func(Coalesce, [Bin(Or, Bin(Eq, Col(1), Lit(Text("ann"))), Bin(Ge, Col(2), Lit(Int(3)))), Lit(Bool(false))]), Bin(Gt, Bin(Div, Lit(Int(100)), Bin(Sub, Col(2), Lit(Int(1)))), Lit(Int(2))))
```

<ul> <li><strong>Under the policy, every answer equals the answer on the visible rows</strong>: 1 735 results (37 734 rows) are equal as multisets, or in the same order when the query orders by a unique key, and 665 queries fail with the same message in both worlds. The failures are the point of the test: a role that owns a document at the dangerous level legitimately gets <em>division by zero</em>, and a role that does not own it must not.</li> <li><strong>Changes touch only visible rows.</strong> After each of 480 random statements the test checks two things: the rows of <code>docs</code> that the role cannot see are unchanged, and the rows it can see equal the copy to which the same statement was applied. 129 inserts that satisfy the policy were accepted; 169 statements were refused (an insert that violates it, an update of a policy column).</li> <li><strong>The rewrite costs 1.9 µs; the policy costs 0% to 30% of a scan.</strong> The policy is evaluated for every row, before the user's condition: a query that is mostly decoding rows pays little (13.0 ms in both columns for the scan with <code>id = …</code>), one that is mostly evaluating pays more (1.30× for filter plus aggregate). The plan shows the rewrite as an ordinary scan filter: the policy under <code>COALESCE</code>, then the user's condition.</li> <li><strong>The policy is a scan filter, and no index helped it here.</strong> None of the measured queries uses an index. Whether a policy can use one depends on its shape (an equality on an indexed column such as a tenant id can; an <code>OR</code> of a comparison and a range cannot), and the policy is evaluated for every row that is fetched either way.</li> </ul>

<aside data-call="note"><b>The leak the tests found, and the two fixes</b><p>The first version of the rewrite put the policy first and passed the first test run on queries without errors. The test that asks ann for <code>WHERE 100 / (level - 1) &gt; 1</code> while bob owns a hidden document of level 1 failed: <code>division by zero</code>. Reading the plan showed the filter was <code>policy AND condition</code>, correctly ordered, so the engine itself evaluated both sides of every <code>AND</code> (before the change the same experiment, <code>WHERE owner = 'alice' AND 10 / x &gt; 1</code>, raised <em>division by zero</em> for another user's row). <code>AND</code> and <code>OR</code> now evaluate the right side only when the left side does not decide the answer, which is allowed by the standard because the order of evaluation is unspecified. The part of the Part III listing that evaluates expressions was updated accordingly. That was not enough. The random oracle test then failed for a query whose hidden row had a <strong>NULL owner</strong>: the policy was NULL, not FALSE, and <code>NULL AND x</code> has to evaluate <code>x</code>. <code>COALESCE(policy, FALSE)</code> fixed it. The first fix needed the targeted test; the second needed the random one, because no one thinks of NULL owners when writing the targeted test.</p></aside>

<aside data-call="note"><b>Policies that could not be checked this way</b><p>Two restrictions are deliberate. <code>INSERT … SELECT</code> into a table with a policy is refused, because the rows that would be inserted are known only after the query runs, and without transactions there is no way to undo an insert that violates <code>WITH CHECK</code>. <code>UPDATE</code> may not assign a column that the policy (or its <code>WITH CHECK</code>) reads, because that could move a row out of view, or into another role's view; PostgreSQL allows it and checks the new row afterwards. A rule that refuses is correct but less useful; a rule that guesses is an incident.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>One generic expression walker.</strong> <code>map_ast(&amp;Ast, &amp;mut dyn FnMut(&amp;Ast) -&gt; Option&lt;Ast&gt;) -&gt; Ast</code> rebuilds a tree, letting the callback replace any node it recognizes. Binding <code>current_user</code>, qualifying columns with an alias and collecting the columns a policy reads are each a ten-line closure over it; none of them repeats the match over the node kinds.</li> <li><strong><code>Option::or</code> for optional conditions</strong>: <code>guard(policy, rest)</code> is <code>match (policy, rest) { (Some(p), Some(r)) =&gt; Some(p AND r), (p, r) =&gt; p.or(r) }</code>.</li> <li><strong>Statements as data</strong>: <code>authorize</code> takes the parsed <code>Vec&lt;Stmt&gt;</code> and returns another one. The executor needs no change, the rewritten statement can be run, explained or printed, and a test can compare it with what was meant.</li> <li><strong><code>Result&lt;_, String&gt;</code> for permission errors</strong> at the boundary, converted to a SQLSTATE-bearing error by the wire server (<a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>).</li> <li><strong>A trait object boundary</strong>: <code>SecureHandler</code> implements the wire server's <code>Handler</code>, so the server knows about neither roles nor policies; the same server runs an open database, a password-protected one or this one.</li> <li><strong>Case-insensitive names</strong> are normalized once, at the catalog boundary (<code>to_lowercase</code> on role and table names), not at each comparison.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>The oracle (2 400 queries)</strong>: for each of four roles, 600 random queries from 14 shapes with random conjunctions of conditions of 12 kinds (comparisons, <code>IS NULL</code>, <code>IN</code>, <code>%</code>, constants, and the divisions that fail on particular levels); answers and errors compared with the copy that holds only the visible rows. The test insists on more than 1 500 answers, 60 errors and 5 000 rows compared.</li> <li><strong>The leak</strong>: ann runs <code>WHERE 100 / (level - 1) &gt; 1</code> while bob owns a level-1 document; ann gets an answer, bob gets the error. The same in a join's <code>ON</code>, in an <code>UPDATE</code>'s and a <code>DELETE</code>'s <code>WHERE</code>; bob's document is untouched afterwards.</li> <li><strong>Changes</strong>: 120 random statements per role (updates of a non-policy column, deletes, updates of policy columns, inserts of rows that do and do not satisfy the check). After each: the rows the role cannot see are identical to before; the rows it can see equal the copy; refused statements say why.</li> <li><strong>Privileges</strong>: a matrix of 14 statements by four roles with different grants (select only, insert and update, select and delete, delete only), with the expectation written out by hand: the right-hand table of a join, <code>INSERT … SELECT</code>, an <code>UPDATE</code> that reads columns, a <code>DELETE</code> with and without a <code>WHERE</code>, DDL, <code>EXPLAIN</code>, <code>ANALYZE</code>; administration statements refused to non-administrators; grants and revokes effective at once; unknown roles refused; nine malformed administration statements rejected.</li> <li><strong>Names and clauses</strong>: one table under two aliases, an alias equal to another table's name, upper-case names, <code>current_user</code> in every clause of a <code>SELECT</code> (select list, <code>WHERE</code>, <code>GROUP BY</code>, <code>HAVING</code>, <code>ORDER BY</code>, a join condition) giving the same answer as the name written out, in <code>UPDATE … SET</code>, in <code>INSERT</code> values and in <code>DELETE</code>; a policy with an unknown column or a type error is refused and leaves the old policy in force; replacing, dropping and a <code>WITH CHECK</code> different from <code>USING</code>; a column read only by <code>WITH CHECK</code> is protected from <code>UPDATE</code>.</li> <li><strong>The engine</strong>: <code>AND</code> and <code>OR</code> stop at the deciding side; <code>NULL AND x</code> and <code>NULL OR x</code> still evaluate <code>x</code>; all eight three-valued combinations unchanged.</li> <li><strong>The real <code>psql</code></strong>: roles and a policy created over the wire; ann sees two of four notes, bob one; bob's <code>DELETE</code> is refused with <em>permission denied for table notes</em>; ann's forged insert is refused; a condition that would divide by zero on bob's hidden row does not fail for ann; unknown users and roles without a password cannot log in.</li> <li><strong>Mutants run against these tests</strong>: the user's condition placed before the policy; a NULL policy not turned into FALSE, or into TRUE; the policy of a joined table or of the first table dropped; the alias ignored; <code>current_user</code> not bound in <code>UPDATE</code>'s policy, in select items, <code>HAVING</code>, <code>ORDER BY</code>, <code>GROUP BY</code>, <code>WHERE</code> or <code>INSERT</code> values; the policy not applied to <code>DELETE</code> or <code>UPDATE</code>; an administrator restricted; DDL allowed; no <code>INSERT</code> privilege needed; <code>UPDATE</code> needing <code>DELETE</code>; no <code>SELECT</code> needed for an <code>UPDATE</code> that reads or a <code>DELETE</code> with a condition; the privilege of a joined table unchecked; inserts not checked, or a NULL check passing; <code>INSERT … SELECT</code> allowed; a policy column updatable, or only the columns of <code>USING</code> protected; an unknown role allowed to connect; a role created twice; <code>REVOKE</code> doing nothing; <code>GRANT ALL</code> granting one privilege; an unchecked policy stored; administration allowed to anyone; and in the engine <code>AND</code>/<code>OR</code> evaluating both sides or <code>AND</code> stopping on NULL. <strong>All 36 were killed</strong>; one (the <code>SELECT</code> privilege for a <code>DELETE</code> with a condition) survived until a role with <code>DELETE</code> only was added to the matrix.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong>: <code>ALTER TABLE … ENABLE ROW LEVEL SECURITY</code> and <code>CREATE POLICY name ON t FOR SELECT|INSERT|UPDATE|DELETE|ALL TO role USING (…) WITH CHECK (…)</code>. Several policies on a table are combined with OR (permissive) or AND (restrictive). Policy expressions may contain subqueries and functions such as <code>current_setting('app.tenant')</code>. The planner treats the policy quals as a <strong>security barrier</strong>: they run before any user qual unless the user's function is marked <code>LEAKPROOF</code>. Table owners and superusers bypass policies unless <code>FORCE ROW LEVEL SECURITY</code> is set, and <code>BYPASSRLS</code> is a role attribute. Views run with their owner's rights unless declared <code>security_invoker</code> (PostgreSQL 15), which is a classic way to bypass a policy by accident.</li> <li><strong>Supabase and similar services</strong> expose PostgreSQL to browsers and put the user's identity into the session (<code>auth.uid()</code> from a JWT claim), with policies as the only access control for the tables.</li> <li><strong>SQL Server</strong>: security policies with filter predicates (hide rows) and block predicates (refuse writes). <strong>Oracle</strong>: Virtual Private Database (<code>DBMS_RLS</code>) adds a predicate returned by a function. <strong>Snowflake</strong> row access policies and <strong>BigQuery</strong> row-level access policies attach to tables or views; <strong>ClickHouse</strong> has row policies. <strong>MySQL</strong> has no native row-level security; views and stored procedures play that role.</li> <li><strong>Multi-tenant SaaS</strong> usually means a <code>tenant_id</code> column on every table, a policy <code>tenant_id = current_setting('app.tenant')::int</code> and a pool that sets the setting per transaction; the failure mode is a pooled connection that carries the previous tenant's setting.</li> <li><strong>Column-level and masking policies</strong> (hide or mask a column per role), <strong>attribute-based access control</strong> and <strong>auditing</strong> sit beside row-level security; they are different mechanisms with the same rewrite-or-wrap structure.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Evaluation order is a security property.</strong> If any predicate of the user's can run before the policy, or on a row that fails it, errors, timing and side effects reveal hidden rows. Test with conditions that fail for a particular hidden value, as this section's oracle does; PostgreSQL's <code>LEAKPROOF</code> exists for the same reason.</li> <li><strong>A NULL policy is not a FALSE one</strong> where evaluation continues. Normalize policy results to a definite boolean.</li> <li><strong>Absence of a policy means no restriction here.</strong> Dropping a policy opens the table to every role with the privilege (one of the tests does it). PostgreSQL's <code>ENABLE ROW LEVEL SECURITY</code> with no policy denies everything, which is the safer default; <code>USING (FALSE)</code> gives it here.</li> <li><strong>Unique keys and foreign keys leak.</strong> A second row with an existing key is rejected by the uniqueness check, which sees all rows; the error tells the inserting role that a hidden row exists. This engine has no constraints, but production policies must be designed around them.</li> <li><strong>Statistics, plans, <code>EXPLAIN</code> and error messages show data.</strong> They are administrator-only here; in production, check what each diagnostic output contains for a user who may not see everything.</li> <li><strong>Policies are code that runs on every row.</strong> A policy with a subquery or a function call is evaluated per row; measure the plan under the role, not as an administrator.</li> <li><strong>Identity must be right all the way down.</strong> <code>current_user</code> is only as trustworthy as the login (<a href="/cookbook/p/passwords-and-scram">M21</a>); with connection pools the identity must be set for each transaction and reset at its end.</li> <li><strong>Admin bypass is a feature and a risk</strong>: the account used for migrations and reports sees everything. Keep it out of the application's connection string.</li> <li><strong>Privilege and policy are separate checks</strong>, and both must pass. A role with a policy and no <code>SELECT</code> grant cannot read anything.</li> </ul></aside>
