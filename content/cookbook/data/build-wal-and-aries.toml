"""

[[sections]]
heading = "Results"
body = """
```text title="3000 seeds × 4 crash/recover cycles, correct implementation"
3000 seeds × 4 crash/recover cycles = 12000 recoveries (about a third crashed again mid-recovery): 0 failures
across them: 59116 updates redone, 257633 redo records skipped by the DPT/recLSN/pageLSN tests, 23754 loser transactions, 51387 CLRs written
```

<p>The workload exercises every phase: 59 116 redos, 257 633 skips by the three tests, 23 754 losers rolled back, 51 387 CLRs.</p>

```text title="each rule broken in turn (seeds out of 3000 on which the harness reported a violation)"
log not forced at commit      : caught in 1603 of 3000 seeds  (first: seed 0: acknowledged commit of txn 87 is not in the durable log)
WAL rule off (page before log): caught in 1492 of 3000 seeds  (first: seed 1: state mismatch after recovery at slots [0, 14, 27])
checkpoint DPT ignored        : caught in 1108 of 3000 seeds  (first: seed 2: state mismatch after recovery at slots [7, 16])
```

<p>Each rule is <em>necessary</em>: break any one and more than a third of random runs expose it, usually within the first seed.</p>

<aside data-call="why"><b>Bugs the harness found while this was being built</b><ol> <li><strong>Transaction ids reused after restart.</strong> The first version restarted ids at 1 after every recovery; old log records with the same ids were then taken for the new transactions' (analysis put a stale COMMIT on a live transaction, and the model disagreed). Fix: the checkpoint-end record stores <code>next_txn</code>, and analysis takes <code>max(that, every id seen) + 1</code>.</li> <li><strong>Redo decided from a shrinking DPT.</strong> Redo flushed pages as it went (to test partial progress) and removed them from the DPT; the next record for that page, a CLR from before the crash, was skipped as "not dirty", so a page that had been flushed <em>with</em> the loser's update never got its undo redone. Fix: redo decides from a copy of the DPT as analysis left it.</li> </ol> <p>Neither shows up in a scripted test. Both appeared within the first few seeds of the randomized one.</p></aside>
"""

[[sections]]
heading = "Measurements"
body = """
```text title="recovery work vs checkpoint interval (crash halfway between checkpoints)"
checkpoint every  analysis recs   redo scanned   redo applied       log MB
           never          59999          59998          21547         1.81
       5000 txns          15001          14998           6727         2.26
       1000 txns           3001           2998           1479         1.90
        200 txns            601            598            300         1.83
```

<p>Recovery time is dominated by the log records scanned (analysis + redo) plus the <strong>page reads</strong> redo triggers, so it grows linearly with the checkpoint interval. At production log rates (hundreds of MB/s) the same law turns a few minutes of log into long restarts, which is why checkpoint intervals are tuned from a recovery-time objective.</p>
"""

[[sections]]
heading = "From simulator to production"
body = """
<p>What changes when the single-threaded simulator becomes a real engine:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Concern</th> <th>Simulator</th> <th>Production</th> </tr> </thead> <tbody> <tr> <td>Log append</td> <td><code>Vec&lt;u8&gt;</code> push</td> <td><strong>reserve LSN range with an atomic fetch-add</strong>, copy into a ring buffer, mark filled; a flusher thread writes contiguous filled ranges (PostgreSQL WAL insert locks, InnoDB log buffer)</td> </tr> <tr> <td>Commit wait</td> <td>direct flush</td> <td><strong>group commit</strong> (<a href="/cookbook/p/logging">L21</a>): queue the LSN, sleep until <code>flushed_lsn ≥ lsn</code></td> </tr> <tr> <td>pageLSN update</td> <td>assignment</td> <td>under the <strong>page's exclusive latch</strong>, in the same critical section that logs the change and modifies the page</td> </tr> <tr> <td>Flush a page</td> <td><code>flush_page</code></td> <td>background writer + checkpointer; hold the page's <em>shared</em> latch while copying, flush log to pageLSN first</td> </tr> <tr> <td>Torn pages</td> <td>assumed atomic</td> <td><strong>full-page images</strong> after each checkpoint, or double-write buffer; page checksums</td> </tr> <tr> <td>Log growth</td> <td>one file</td> <td><strong>segments</strong>, recycled when older than <code>min(checkpoint, oldest recLSN, oldest active txn start)</code>; optional archive for point-in-time recovery</td> </tr> <tr> <td>ATT / DPT</td> <td>maps</td> <td>per-transaction records in the txn manager; DPT maintained by the buffer pool (recLSN set when a clean page is first dirtied)</td> </tr> <tr> <td>Undo</td> <td>in-line</td> <td>for abort: per-transaction log chain; for recovery: <strong>parallel redo</strong> by page partition, background undo</td> </tr> <tr> <td>Transaction ids</td> <td>counter</td> <td>persisted in the checkpoint; 64-bit or epoch to avoid wraparound</td> </tr> </tbody> </table></div>

<p><strong>Testing beyond the simulator:</strong> run the real engine under a <em>fault-injecting file layer</em> (every <code>write</code>, <code>fsync</code>, <code>rename</code> can fail or tear), kill -9 processes mid-workload on a loop and verify invariants, and use <code>dm-log-writes</code> or <code>CrashMonkey</code>-style replay to check that your fsync/ordering assumptions hold on a real filesystem.</p>
"""

