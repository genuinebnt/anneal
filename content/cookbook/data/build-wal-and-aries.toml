[[sections]]
heading = "Overview"
body = """
<p>Recovery code is the part of a DBMS you cannot test by running it. The bugs only show when the machine dies at exactly the wrong instruction, possibly <em>twice</em>. So this stage is built <strong>test-first around a crash simulator</strong>: stable storage is an explicit value (<code>Durable</code>: pages, log bytes, master record), everything else is volatile and thrown away at a crash, and a <strong>fuel counter</strong> makes any durable-effect step (log append, log flush, page write, master update) fail on demand.</p>

### Key ideas

<ul> <li><strong>Model the crash as data.</strong> <code>Db::into_durable(torn)</code> returns what survives; <code>Db::recover(durable, fuel, …)</code> starts from it. Every durable step calls <code>tick()</code>, which returns <code>Err(Crashed)</code> when the fuel is spent. Rust's <code>?</code> makes every operation crash-aware for free.</li> <li><strong>Frame the log</strong>: <code>[len][crc32][payload]</code>. A torn tail fails its CRC; recovery <strong>truncates to the last good record</strong> before appending anything.</li> <li><strong>LSN = byte offset + header</strong>, so records are found by seeking and the log needs no index.</li> <li><strong>Page = (pageLSN, slots)</strong>. A page write is the only way data reaches disk, and <code>flush_page</code> enforces the WAL rule by flushing the log first.</li> <li><strong>Oracle without recovery logic.</strong> The test model replays the driver's own writes, applying only transactions whose COMMIT is in the <em>durable log</em>, so it checks recovery against an independent definition of correct.</li> <li><strong>Crash during recovery</strong> is part of the protocol: recovery runs with fuel too, crashes, runs again, and must still converge to the same state.</li> <li><strong>Mutation testing</strong> proves the harness has teeth: disable one rule at a time and the harness must fail.</li> </ul>
"""

