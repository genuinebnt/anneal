<div class="cb-g-tt"><table> <thead> <tr> <th>Technique</th> <th>Idea</th> <th>Who does it</th> </tr> </thead> <tbody> <tr> <td>Multiple buffer pools</td> <td>per table, per page type, or hash-partitioned by page id, so each pool has its own latch and policy</td> <td>InnoDB <code>innodb_buffer_pool_instances</code>; DB2 per-tablespace pools; SQL Server buffer partitions</td> </tr> <tr> <td>Pre-fetching</td> <td>a sequential scan requests the next N pages before it needs them; an index scan requests the leaves it will visit</td> <td>PostgreSQL read streams (v17+); every commercial system</td> </tr> <tr> <td>Scan sharing (synchronized scans)</td> <td>a second scan of the same table attaches to the in-progress one, then wraps around for the part it missed</td> <td>PostgreSQL <code>synchronize_seqscans</code>; SQL Server "merry-go-round" scans; DB2</td> </tr> <tr> <td>Buffer pool bypass</td> <td>large sequential scans use a small private ring instead of polluting the main pool</td> <td>PostgreSQL ring buffers (<code>BAS_BULKREAD</code>, 256 KiB); Informix "light scans"</td> </tr> <tr> <td>Background writer</td> <td>flushes dirty pages ahead of eviction, so evictions don't wait for writes</td> <td>PostgreSQL <code>bgwriter</code> + checkpointer; InnoDB page cleaners</td> </tr> <tr> <td>Huge pages</td> <td>map frames with 2 MiB pages: fewer TLB misses</td> <td>PostgreSQL <code>huge_pages</code>, Oracle SGA</td> </tr> <tr> <td>Pointer swizzling</td> <td>replace page ids in parents with direct pointers while both are resident; no hash lookup</td> <td>LeanStore, Umbra (<a href="/cookbook/p/larger-than-memory-databases">Part II</a>)</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Replacement policies"
body = """
<p>When a page must be read and there's no free frame, the pool has to evict something. A good policy maximizes the hit rate for the <em>workload the database actually sees</em>, which mixes point lookups (skewed and hot), index traversals (the upper tree levels are very hot) and large scans (each page touched once).</p>

<h4>LRU</h4>

<p>Evict the least recently used page. It's exact, simple, and O(1) with a hash map plus a doubly-linked list. Its failure is <strong>sequential flooding</strong>: one full scan of a table larger than the pool touches every page once, and each of those pages becomes "most recently used", so the scan evicts the entire hot working set. Every point lookup afterwards misses. For a scan, the <em>most</em> recently used page is the one least likely to be needed again, which is exactly backwards for LRU.</p>

<h4>CLOCK</h4>

<p>An approximation of LRU that needs no list maintenance on a hit. Each frame gets a reference bit, which a hit sets. The clock hand sweeps the frames: if the bit is set, clear it and move on; if it's clear and the frame is evictable, evict it. A hit costs one atomic store, with no latch and no list surgery. That's why PostgreSQL uses a variant: <strong>clock-sweep with a usage count</strong> from 0 to 5, incremented on each pin and decremented as the hand passes.</p>

```rust title="src/buffer/clock_replacer.rs — CLOCK with usage counts (PostgreSQL-style)"
use crate::buffer::replacer::Replacer;
use crate::common::config::{FrameId, PageId};

const MAX_USAGE: u8 = 5;        // PostgreSQL's BM_MAX_USAGE_COUNT

pub struct ClockReplacer {
    usage: Vec<u8>,
    evictable: Vec<bool>,
    present: Vec<bool>,          // frame is tracked (holds a page)
    hand: usize,
    size: usize,                 // number of evictable frames
}

impl ClockReplacer {
    pub fn new(num_frames: usize) -> Self {
        Self { usage: vec![0; num_frames], evictable: vec![false; num_frames], present: vec![false; num_frames], hand: 0, size: 0 }
    }
}

impl Replacer for ClockReplacer {
    fn size(&self) -> usize { self.size }

    fn record_access(&mut self, f: FrameId, _page: PageId) {
        let i = f.0 as usize;
        self.present[i] = true;
        self.usage[i] = (self.usage[i] + 1).min(MAX_USAGE);
    }

    fn set_evictable(&mut self, f: FrameId, ev: bool) {
        let i = f.0 as usize;
        assert!(self.present[i], "set_evictable on untracked frame {f:?}");
        if self.evictable[i] != ev { self.evictable[i] = ev; if ev { self.size += 1 } else { self.size -= 1 } }
    }

    fn evict(&mut self) -> Option<FrameId> {
        if self.size == 0 { return None; }
        // Bounded: after MAX_USAGE+1 full sweeps every evictable frame's count is 0.
        for _ in 0..(MAX_USAGE as usize + 1) * self.usage.len() + 1 {
            let i = self.hand;
            self.hand = (self.hand + 1) % self.usage.len();
            if !self.present[i] || !self.evictable[i] { continue; }
            if self.usage[i] == 0 {
                self.present[i] = false;
                self.evictable[i] = false;
                self.size -= 1;
                return Some(FrameId(i as u32));
            }
            self.usage[i] -= 1;
        }
        unreachable!("size > 0 but no victim found")
    }

    fn remove(&mut self, f: FrameId) {
        let i = f.0 as usize;
        if !self.present[i] { return; }
        assert!(self.evictable[i], "remove on pinned frame {f:?}");
        self.present[i] = false;
        self.evictable[i] = false;
        self.usage[i] = 0;
        self.size -= 1;
    }
}
```

<h4>LRU-K</h4>

<p>O'Neil, O'Neil and Weikum (SIGMOD 1993) proposed tracking the last <em>K</em> access times of each page and evicting the page with the largest <strong>backward K-distance</strong>: now minus the time of its K-th most recent access. Pages with fewer than K accesses have infinite distance and go first, with ties broken by earliest first access (plain LRU among them). With K=2, a page touched once by a scan has infinite distance and is evicted before any page that has been used twice. That largely solves sequential flooding.</p>

<p>The textbook implementation scans every frame on each eviction, which is O(n). That's fine for 128 frames and painful for 100,000. The O(log n) version keeps evictable frames in an ordered set keyed by eviction priority:</p>

:::deeper LRU-K in O(log n): an ordered set of (priority, frame) instead of a scan
```rust title="src/buffer/lru_k_replacer.rs (fast version)"
use std::collections::{BTreeSet, HashMap, VecDeque};
use crate::buffer::replacer::Replacer;
use crate::common::config::{FrameId, PageId};

/// Eviction order key: smaller = evict first.
/// Frames with < K accesses: (0, first_access)   → infinite k-distance, LRU among them.
/// Frames with   K accesses: (1, kth_recent_ts)  → larger k-distance = older kth access = smaller ts.
type Key = (u8, u64, FrameId);

struct Node { hist: VecDeque<u64>, evictable: bool }

pub struct LruKReplacer {
    k: usize,
    now: u64,
    nodes: HashMap<FrameId, Node>,
    order: BTreeSet<Key>,          // only evictable frames live here
}

impl LruKReplacer {
    pub fn new(_num_frames: usize, k: usize) -> Self {
        assert!(k >= 1);
        Self { k, now: 0, nodes: HashMap::new(), order: BTreeSet::new() }
    }

    fn key(&self, f: FrameId, n: &Node) -> Key { key_of(self.k, f, n) }
}

fn key_of(k: usize, f: FrameId, n: &Node) -> Key {
    // hist[0] is the earliest retained access: the first access if < k, else the k-th most recent.
    (u8::from(n.hist.len() >= k), n.hist[0], f)
}

impl Replacer for LruKReplacer {
    fn size(&self) -> usize { self.order.len() }

    fn record_access(&mut self, f: FrameId, _p: PageId) {
        self.now += 1;
        let (k, now) = (self.k, self.now);
        let n = self.nodes.entry(f).or_insert_with(|| Node { hist: VecDeque::with_capacity(k + 1), evictable: false });
        let old = n.evictable.then(|| key_of(k, f, n));     // evictable frames are in `order`
        n.hist.push_back(now);
        if n.hist.len() > k { n.hist.pop_front(); }
        if let Some(old) = old {
            let new = key_of(k, f, n);                        // `n` borrows self.nodes; self.order is a
            self.order.remove(&old);                          // disjoint field, so this borrow is fine
            self.order.insert(new);
        }
    }

    fn set_evictable(&mut self, f: FrameId, ev: bool) {
        let Some(n) = self.nodes.get(&f) else { return };
        if n.evictable == ev { return; }
        let key = self.key(f, n);
        if ev { self.order.insert(key); } else { self.order.remove(&key); }
        self.nodes.get_mut(&f).unwrap().evictable = ev;
    }

    fn evict(&mut self) -> Option<FrameId> {
        let (_, _, f) = self.order.pop_first()?;
        self.nodes.remove(&f);
        Some(f)
    }

    fn remove(&mut self, f: FrameId) {
        if let Some(n) = self.nodes.get(&f) {
            assert!(n.evictable, "remove on non-evictable frame {f:?}");
            let key = self.key(f, n);
            self.order.remove(&key);
            self.nodes.remove(&f);
        }
    }
}
```
:::

<aside data-call="rust"><b>Keep the priority key derivable, never stored twice</b><p>The only way an ordered-set replacer goes wrong is if the key stored in the set drifts from the key you'd compute from the node. The rule: <strong>remove with the old key, mutate, insert with the new key</strong>, with all three inside one <code>&amp;mut self</code> method so no other code can interleave. <code>BTreeSet::pop_first</code> (stable since 1.66) gives the minimum in O(log n). A binary heap can't do this, because it has no <code>remove(key)</code>. An indexed heap or a lazy-deletion heap (push new keys, skip stale ones on pop) are the alternatives, and the lazy heap is usually fastest.</p></aside>

<h4>Other policies</h4>

<div class="cb-g-tt"><table> <thead> <tr> <th>Policy</th> <th>Mechanism</th> <th>Scan-resistant?</th> <th>Adapts?</th> <th>Used by</th> </tr> </thead> <tbody> <tr> <td>LRU</td> <td>recency list</td> <td>✗</td> <td>✗</td> <td>textbook, many caches</td> </tr> <tr> <td>CLOCK / clock-sweep</td> <td>reference bit / usage count</td> <td>partly</td> <td>✗</td> <td>PostgreSQL, OS page caches</td> </tr> <tr> <td>LRU-K</td> <td>K-th access time</td> <td>✓ (K ≥ 2)</td> <td>✗</td> <td>SQL Server (LRU-2 variant); BusTub ≤ S2025</td> </tr> <tr> <td>2Q (Johnson &amp; Shasha, VLDB 1994)</td> <td>FIFO probation queue A1in, ghost queue A1out, main LRU Am; promote on a second hit</td> <td>✓</td> <td>fixed split</td> <td>PostgreSQL 8.0.x briefly, some caches</td> </tr> <tr> <td>InnoDB midpoint LRU</td> <td>new pages enter at the 3/8 point ("old" sublist); promote only if re-accessed after <code>innodb_old_blocks_time</code> ms</td> <td>✓</td> <td>✗</td> <td>MySQL InnoDB</td> </tr> <tr> <td><strong>ARC</strong> (Megiddo &amp; Modha, FAST 2003)</td> <td>T1 (seen once), T2 (seen twice or more), ghost lists B1/B2; target size <em>p</em> adapts on ghost hits</td> <td>✓</td> <td><strong>✓</strong></td> <td>ZFS ARC, IBM DS8000; <strong>BusTub Fall 2025 P1</strong></td> </tr> <tr> <td>LIRS (Jiang &amp; Zhang, SIGMETRICS 2002)</td> <td>inter-reference recency</td> <td>✓</td> <td>✓</td> <td>MySQL NDB, Infinispan</td> </tr> <tr> <td>TinyLFU / W-TinyLFU</td> <td>admission filter by frequency sketch (a count-min sketch!) + windowed LRU</td> <td>✓</td> <td>✓</td> <td>Caffeine (Java), Moka (Rust)</td> </tr> </tbody> </table></div>

<p>ARC gets its own slice next (<a href="/cookbook/p/arc-replacer">P1 · ARC</a>).</p>
"""

[[sections]]
heading = "Experiment: sequential flooding"
body = """
<p>Before writing the ARC replacer, <em>watch</em> LRU lose. Build a small lab in <code>crates/scratch/</code>: a <code>Policy</code> trait whose only question is "was that a hit?", a runner, a table printer, and trace generators (Zipf lookups, cyclic scans, hot-then-scan, shifting working sets). Two pieces make it trustworthy: Belady's offline optimum as the ceiling, and an adapter so that any real <code>Replacer</code> can run in the same lab.</p>

```rust title="crates/scratch/src/lab/opt.rs — Belady's OPT: the offline ceiling every policy is measured against"
use std::collections::{BTreeSet, HashMap};
use super::harness::{PageId, Policy};   // PageId = usize; Policy { name, access(page) -> hit, resident }

/// Evicts the resident page whose next use is furthest in the future. Needs the whole
/// trace up front, so it's a benchmark, never a policy you can deploy.
pub struct Opt { next_use: Vec<usize>, pos: usize, cap: usize,
                 resident: HashMap<PageId, usize>,          // page -> its next-use position
                 by_next: BTreeSet<(usize, PageId)> }       // ordered by next use

impl Opt {
    pub fn new(trace: &[PageId], cap: usize) -> Self {
        let mut next_use = vec![usize::MAX; trace.len()];
        let mut last: HashMap<PageId, usize> = HashMap::new();
        for (i, &p) in trace.iter().enumerate().rev() {
            next_use[i] = last.get(&p).copied().unwrap_or(usize::MAX);
            last.insert(p, i);
        }
        Opt { next_use, pos: 0, cap, resident: HashMap::new(), by_next: BTreeSet::new() }
    }
}

impl Policy for Opt {
    fn name(&self) -> String { "OPT (Belady)".into() }
    fn access(&mut self, page: PageId) -> bool {
        let nu = self.next_use[self.pos];
        self.pos += 1;
        let hit = if let Some(old) = self.resident.insert(page, nu) {
            self.by_next.remove(&(old, page));
            true
        } else {
            if self.resident.len() > self.cap {
                let &(far, victim) = self.by_next.iter().next_back().unwrap();   // furthest next use
                self.by_next.remove(&(far, victim));
                self.resident.remove(&victim);
            }
            false
        };
        self.by_next.insert((nu, page));
        hit
    }
    fn resident(&self) -> usize { self.resident.len() }
}
```

```rust title="crates/scratch/src/lab/adapter.rs — run any Replacer inside the lab"
use std::collections::HashMap;
use relational::buffer::replacer::Replacer;
use relational::common::config::{FrameId, PageId};
use super::harness::Policy;

/// Plays buffer pool around a Replacer: page table + free frames, unpin immediately.
pub struct AsPolicy<R> { r: R, name: String, table: HashMap<u32, u32>, owner: Vec<Option<u32>>, free: Vec<u32> }

impl<R: Replacer> AsPolicy<R> {
    pub fn new(name: &str, r: R, frames: usize) -> Self {
        AsPolicy { r, name: name.into(), table: HashMap::new(), owner: vec![None; frames],
                   free: (0..frames as u32).rev().collect() }
    }
}

impl<R: Replacer> Policy for AsPolicy<R> {
    fn name(&self) -> String { self.name.clone() }
    fn access(&mut self, page: usize) -> bool {
        let p = page as u32;
        if let Some(&f) = self.table.get(&p) { self.r.record_access(FrameId(f), PageId(p)); return true; }
        let f = self.free.pop().or_else(|| self.r.evict().map(|f| f.0)).expect("no evictable frame");
        if let Some(old) = self.owner[f as usize].replace(p) { self.table.remove(&old); }
        self.table.insert(p, f);
        self.r.record_access(FrameId(f), PageId(p));
        self.r.set_evictable(FrameId(f), true);           // the lab never pins; a BPM does
        false
    }
    fn resident(&self) -> usize { self.table.len() }
}
```

