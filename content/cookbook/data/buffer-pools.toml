[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>The buffer pool makes disk look like memory.</strong> It is a write-back cache of fixed-size frames. Optimize <strong>where</strong> pages live (spatial) and <strong>when</strong> they move (temporal).</li> <li><strong>Page table ≠ page directory.</strong> The page table maps page id → frame, in memory only. The directory maps page id → disk location and is persistent.</li> <li><strong>Per-frame state</strong>: dirty flag (write before reuse), <strong>pin count</strong> (never evict while &gt; 0), and access history for the policy. Pinning doesn't block concurrent readers.</li> <li><strong>Locks vs latches.</strong> Locks protect logical contents from other transactions, last long, and support rollback. Latches protect in-memory structures from other threads, are short, and have no rollback.</li> <li><strong>Why not the OS</strong>: unordered flushes (breaks WAL), fault stalls, SIGBUS on errors, TLB shootdowns. The DBMS wants to control flush order, prefetching, replacement and scheduling.</li> <li><strong>LRU</strong> is costly to maintain exactly. <strong>CLOCK</strong> approximates it with a reference bit and a sweeping hand.</li> <li><strong>Sequential flooding.</strong> A single scan evicts the hot working set under LRU or CLOCK. For scans, the most recently used page is often the best victim.</li> <li><strong>Fixes</strong>: LRU-K (evict by K-th most recent access, with a ghost history for evicted pages); MySQL's two-segment LRU (young/old lists); per-query localization; priority hints; <strong>ARC</strong> (recency list T1 plus frequency list T2, with ghost lists steering an adaptive split <em>p</em>).</li> <li><strong>Dirty pages.</strong> Clean eviction is free; dirty eviction needs a write. Background writers clean pages ahead of time.</li> <li><strong>I/O scheduling.</strong> The DBMS prioritizes by sequential vs random, foreground vs background, table/index/log, and transaction importance. Most systems use <code>O_DIRECT</code> to skip the OS page cache (PostgreSQL is the exception). <code>fsync</code> failures can be silent and mark pages clean.</li> </ul>
"""

[[sections]]
heading = "Purpose"
body = """
<p>The buffer pool is the DBMS's own page cache: a fixed array of <strong>frames</strong> in memory, each able to hold one page. It makes three promises to every layer above it:</p>

<ol> <li><strong>Access by page id.</strong> <code>fetch(page_id)</code> returns a frame holding that page, reading it from disk if needed. Callers never deal with file offsets.</li> <li><strong>No eviction while in use.</strong> A page is <em>pinned</em> while someone holds it, and a pinned page's frame is never reused.</li> <li><strong>Dirty pages are written back before their frame is reused.</strong> Later, with the WAL, it adds a fourth promise: <em>never before the log records describing the change are durable</em>.</li> </ol>

<p>The DBMS does this itself rather than leaving it to the OS for the reasons in <a href="/cookbook/p/disk-i-o">L03a</a>: it knows its access patterns (a scan is not a point lookup), it has to control <em>when</em> pages are written (WAL), and it wants to schedule I/O rather than stall on page faults.</p>

<figure class="cb-g-fig"><svg viewBox="0 0 800 250" role="img" aria-label="Buffer pool structure"> <g font-size="12"> <text x="10" y="20" class="cb-g-mut">page table: HashMap&lt;PageId, FrameId&gt;</text> <rect x="10" y="30" width="200" height="120" rx="4" class="cb-g-box"></rect> <text x="24" y="54">p7 → f2</text><text x="24" y="78">p3 → f0</text><text x="24" y="102">p9 → f3</text><text x="24" y="126">p1 → f1</text> <text x="300" y="20" class="cb-g-mut">frames (Box&lt;[Frame]&gt;), each: latch · pin · dirty · page_id · 8 KiB</text> <rect x="300" y="30" width="110" height="120" rx="4" class="cb-g-boxa"></rect><text x="312" y="54">f0: p3</text><text x="312" y="78" class="cb-g-mut">pin 2</text><text x="312" y="102" class="cb-g-mut">dirty</text> <rect x="420" y="30" width="110" height="120" rx="4" class="cb-g-box"></rect><text x="432" y="54">f1: p1</text><text x="432" y="78" class="cb-g-mut">pin 0</text><text x="432" y="102" class="cb-g-mut">clean</text> <rect x="540" y="30" width="110" height="120" rx="4" class="cb-g-boxa"></rect><text x="552" y="54">f2: p7</text><text x="552" y="78" class="cb-g-mut">pin 1</text><text x="552" y="102" class="cb-g-mut">clean</text> <rect x="660" y="30" width="110" height="120" rx="4" class="cb-g-box"></rect><text x="672" y="54">f3: p9</text><text x="672" y="78" class="cb-g-mut">pin 0</text><text x="672" y="102" class="cb-g-mut">dirty</text> <text x="10" y="190">free list: [ ]   (all frames hold pages)</text> <text x="10" y="214">replacer tracks evictable frames: {f1, f3}  →  evict picks one by policy; f3 dirty ⇒ write back first</text> <text x="10" y="238" class="cb-g-mut">highlighted = pinned (not evictable)</text> </g></svg></figure>
"""

