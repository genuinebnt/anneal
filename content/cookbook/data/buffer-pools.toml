OPT (Belady)           0.734         0.733                              0.729    ← offline ceiling
```

<p>These are real numbers from <code>~/dbms-guide/verify/tests/hitrates.rs</code>, running the reference replacers in this guide. Each scan reads pages that are never touched again (cold data), so the lookup-only hit rate isolates the damage the scans do to the hot set. Two things stand out. LRU and CLOCK lose about 30% of their hits once scans are frequent. And ARC gets <em>better</em> with scans than without them: the ghost hits push <em>p</em> toward the frequency side, and the scan pages flow through T1 without disturbing T2.</p>

<aside data-call="testing"><b>Implement Belady's OPT as the ceiling</b><p>The offline-optimal policy (Belady, 1966) evicts the page whose next use is furthest in the future. It's impossible online, but trivial on a recorded trace: precompute each position's next use, then keep a max-heap by next use. Report every policy as a <em>fraction of OPT's hit rate</em>. That tells you how much room is left, and it catches simulator bugs, because a policy that "beats" OPT means the simulator is wrong.</p></aside>

<aside data-call="performance"><b>What actually limits a buffer pool</b><p>On a many-core machine running an in-memory-resident workload, the bottleneck is <strong>not</strong> the policy but the <strong>pool latch</strong>: every fetch takes a global mutex for the page-table lookup and the replacer update. Fixes, in order of effort: (1) hash-partition the page table, e.g. 64 shards by <code>page_id % 64</code>, each with its own mutex; (2) use CLOCK, where a hit is just an atomic store with no replacer latch; (3) make the fast path lock-free with optimistic reads, as LeanStore and Umbra do with pointer swizzling (Part II); (4) use per-core pools. Measure first: <code>perf lock contention</code> on Linux, or a criterion bench at 1, 2, 4, 8 and 16 threads that plots throughput. BusTub's P1 leaderboard is exactly this benchmark.</p></aside>

<aside data-call="production"><b>How production systems pick</b><ul> <li><strong>PostgreSQL</strong>: clock-sweep with <code>usage_count</code> capped at 5, plus ring buffers for bulk reads, VACUUM and <code>COPY</code>. <code>src/backend/storage/buffer/README</code> is short and excellent.</li> <li><strong>InnoDB</strong>: LRU with midpoint insertion (the old sublist is the last 3/8), <code>innodb_old_blocks_time</code> (1000 ms) against scans, and multiple instances.</li> <li><strong>SQL Server</strong>: an LRU-2-style policy (it tracks the last two reference times), plus a lazywriter.</li> <li><strong>Oracle</strong>: touch-count-based LRU with hot and cold halves.</li> <li><strong>LeanStore/Umbra</strong>: no LRU at all. Random sampling picks candidates, which go into a "cooling" FIFO stage; a page accessed during cooling is re-swizzled. Near-zero overhead on hits.</li> </ul></aside>
"""

