[[sections]]
heading = "Locks vs latches"
body = """
<p>This distinction runs through the rest of the course, so learn it here:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th></th> <th>Lock</th> <th>Latch</th> </tr> </thead> <tbody> <tr> <td>Protects</td> <td>logical database contents (tuples, tables, key ranges) from other <strong>transactions</strong></td> <td>in-memory data structures (a frame, a B+Tree node, a hash bucket) from other <strong>threads</strong></td> </tr> <tr> <td>Held for</td> <td>the transaction's duration (or until commit under strict 2PL)</td> <td>a critical section: microseconds</td> </tr> <tr> <td>Modes</td> <td>S, X, IS, IX, SIX… (lock compatibility matrix)</td> <td>read, write</td> </tr> <tr> <td>Deadlock</td> <td>detected (waits-for graph) or prevented (wound-wait)</td> <td>avoided by <strong>coding discipline</strong>: fixed acquisition order</td> </tr> <tr> <td>Rollback</td> <td>changes undone on abort</td> <td>nothing to undo</td> </tr> <tr> <td>Lives in</td> <td>the lock manager's hash table</td> <td>inside the protected structure</td> </tr> <tr> <td>In Rust</td> <td>a <code>LockManager</code> with a request queue per resource</td> <td><code>Mutex</code>, <code>RwLock</code>, <code>parking_lot</code>, atomics, OLC version counters</td> </tr> </tbody> </table></div>

<p>The buffer pool uses only latches. Transactions and locks come in <a href="/cookbook/p/concurrency-control-theory">L17–L20</a>.</p>
"""

