heading = "Measured"
body = """
<p>A table of 1 000 000 orders with a sequential <code>id</code>, a roughly sorted <code>ts</code>, five distinct <code>status</code> strings, <code>region</code> strings in long runs, and a random <code>amount</code>. The queries run four ways. <em>Columnar</em> is this section's scan. <em>Struct</em> is an idealized row store: a fixed 32-byte struct with the strings already replaced by one-byte codes, scanned by a hand-written loop. <em>Val rows</em> is the generic row representation (a <code>Vec&lt;Val&gt;</code> per row, as the Part I engine uses). <em>Decode first</em> decodes each predicate column into values before filtering. All four return the same sum.</p>

```text title="1 000 000 rows: sizes by column, and four ways to run three queries"
1000000 rows, 5 columns, segments of 65 536 rows
raw 49.0 MB, encoded 10.0 MB (4.9x smaller)
  id        2.00 bytes/row  {"for"}
  ts        4.00 bytes/row  {"for"}
  status    1.00 bytes/row  {"dict"}
  region    1.00 bytes/row  {"dict"}
  amount    2.00 bytes/row  {"for"}
query (1 000 000 rows, best of 5)                                columnar     struct   Val rows decode 1st
SUM(amount) WHERE status = 'shipped'            (20%)              0.57ms     1.27ms     6.29ms    26.50ms
SUM(amount) WHERE ts BETWEEN .. (1%, sorted col)                   0.04ms     0.33ms    12.10ms     4.92ms
SUM(amount) WHERE region = 'region-07' AND amount < 200            0.47ms     0.30ms     9.52ms    23.77ms
zone maps: 75 of 240 segment visits skipped
```

<ul> <li><strong>Size</strong>: 49.0 MB of raw values become <strong>10.0 MB (4.9×)</strong> with byte-aligned lanes. Every column picked the encoding you would pick by eye: frame of reference for the numbers, dictionary for the strings. Exact bit-packing would reach about 7 MB; the lanes are the price of a branch-free compare.</li> <li><strong>Selective filter on an encoded column</strong>: <code>status = 'shipped'</code> is <strong>2.2× faster than the idealized row struct</strong> and <strong>11× faster than generic rows</strong> (0.57 ms against 1.27 and 6.29), because it reads one byte per row of one column.</li> <li><strong>Zone maps</strong>: the range query on the sorted timestamp touches 1 segment of 16 and takes 0.04 ms, <strong>8× faster than the struct scan</strong> and 300× faster than generic rows. Over the run, 75 of 240 segment visits were skipped, all by this query.</li> <li><strong>A conjunction is where this kernel loses</strong>: <code>region = … AND amount &lt; 200</code> takes 0.47 ms against 0.30 ms for the struct. Each predicate is evaluated over <em>all</em> rows and the bitmaps are ANDed, while the row loop evaluates the second condition only for rows that passed the first. This is the reason vectorized engines pass <strong>selection vectors</strong> between predicates (<a href="/cookbook/p/a-vectorized-engine">M4</a>): the second predicate then looks at only the survivors.</li> <li><strong>Decode-first is the anti-pattern</strong>: materializing values before filtering is about 45 to 120 times slower than evaluating on the encoding, which is why every columnar engine pushes predicates into the scan.</li> </ul>

<aside data-call="note"><b>A bug in the first version</b><p>The first encoder wrote 0 into the slot of a NULL. In a column whose values are 1 000 000, 1 000 003, …, the frame of reference is the minimum, so the delta of that 0 wrapped around and, in the bit-packed layout of the time, overflowed into the neighbouring values: reads of rows <em>next to</em> a NULL returned wrong numbers. The property test (every encoding against the row semantics, 400 columns with NULLs) found it in the first run. The fix is to fill a NULL slot with the previous value (the first with the minimum): it stays in the frame and it extends a run. With lanes the stray bits can no longer hit a neighbour, and the run-length test keeps the other half of the reason alive: with the old filler a run column with a NULL in every tenth row had about 2 000 runs instead of 10.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A <code>Data</code> enum per column segment</strong> (<code>Plain</code>, <code>For</code>, <code>Rle</code>, <code>Dict</code>, <code>Strs</code>) keeps each encoding's predicate kernel a plain function over a slice. <code>Lanes</code> is a second enum over <code>Vec&lt;u8&gt;</code>, <code>Vec&lt;u16&gt;</code> and <code>Vec&lt;u32&gt;</code> with one generic helper, <code>in_range&lt;T: Copy + Into&lt;u32&gt;&gt;</code>, that builds 64 result bits per chunk in a loop the compiler can vectorize.</li> <li><strong>Bitmaps as <code>Vec&lt;u64&gt;</code></strong> with <code>iter_ones</code> (a <code>from_fn</code> over <code>trailing_zeros</code>) give selection as an iterator of row numbers without allocating; <code>mask_tail</code> clears bits past the segment end, and a test counts ones to prove it.</li> <li><strong>Translate the predicate, not the data</strong>: <code>Eq(Text)</code> becomes a code range through <code>partition_point</code> on the sorted dictionary; <code>Between</code> on a frame of reference clamps its bounds to the lane domain with <code>i128</code> arithmetic so no bound can overflow. A text bound against an integer column matches nothing (the type error belongs to the planner).</li> <li><strong><code>Option&lt;Bits&gt;</code> for NULLs</strong>: a segment with no NULLs stores nothing and <code>eval</code> skips the masking step.</li> <li><strong><code>is_none_or</code></strong> (stable since Rust 1.82) is the clearest way to write "no minimum yet, or smaller than it".</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Every encoding against the row semantics</strong>: 400 random columns (integers: low cardinality, runs, sorted, too wide for frame of reference, negative; text: few and many distinct values; lengths 0, 1, 2, 63, 64, 65, 200, 1000; about one value in nine NULL), each built with every applicable forced encoding; every value reads back, and for 12 random predicates (<code>Eq</code>, <code>Between</code>, <code>IsNull</code>, <code>IsNotNull</code>, bounds taken from the data and from outside it) the bitmap equals the set of rows for which the predicate holds, has no bits past the end, and the zone map never rules out a segment that has a match.</li> <li><strong>The choice is the smallest</strong>: sorted ids pick frame of reference, runs pick run-length (also with a NULL in every tenth row), 64-bit random values stay plain, few strings pick the dictionary, unique strings stay plain; the automatic size is never above a forced alternative.</li> <li><strong>Updatable table against a row model</strong>: 60 seeds × 500 steps of inserts, deletes, seals and scans over segment sizes 1, 7, 64 and 100, with random predicate conjunctions; <code>scan</code>, <code>sum</code>, <code>live</code>, <code>get</code> and delete results equal the model after every step, including rows still in the tail.</li> <li><strong>Zone maps</strong>: a range of 1 000 rows in a sorted column of 100 000 skips at least 98 of 100 segments and decodes exactly 1 000 values.</li> <li><strong>Mutants run against these tests</strong>: the NULL filler stored as 0 (survives as a result-neutral change that only costs run-length space, so a dedicated test now pins the space), frame bounds allowed to go negative, dictionary range bounds off by one on either end, a run setting only its first row, NULLs matching, bits past the end set, zone-map comparisons wrong at the maximum or the minimum, the minimum tracked as a maximum, deleted rows returned, deletes before sealing lost, the largest encoding chosen, run lookup off by one, a sum missing the frame minimum or counting NULLs, the tail ignored by a scan, deleted tail rows matching, an unsorted dictionary, a wrong lane width. <strong>All 20 were killed</strong>, and four more for the row-id lookup added later for the HTAP section (a segment found one early, deleted rows readable by id, double deletes accepted, segment starts not recorded) are killed too.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>ClickHouse</strong> (MergeTree) writes immutable <em>parts</em> sorted by the table's sort key, one file per column with a sparse primary index and per-granule marks, and merges parts in the background; deletes and updates are asynchronous mutations.</li> <li><strong>DuckDB</strong> stores row groups of about 120 000 rows with per-segment compression (constant, RLE, dictionary, FOR, bit-packing, FSST for strings, ALP for floats) chosen by analysis, zone maps per segment, and a vectorized engine that scans compressed data into vectors.</li> <li><strong>Vertica and C-Store</strong> introduced the write-store/read-store split (a row-ish WOS and a sorted columnar ROS, merged by a tuple mover); <strong>SQL Server columnstore</strong> keeps a delta store of rows and compressed row groups with a delete bitmap, as here; <strong>Parquet</strong> and <strong>Arrow</strong> are the interchange formats on disk and in memory (see <a href="/cookbook/p/columnar-formats-and-nested-data">columnar formats</a>).</li> <li><strong>Snowflake</strong>, <strong>Redshift</strong> and <strong>BigQuery</strong> store immutable micro-partitions or blocks with per-column min/max metadata used for pruning.</li> <li><strong>Compressed execution</strong> appears in SQL Server's batch mode, DuckDB's dictionary vectors, and the research on operating directly on encoded data (<a href="/cookbook/p/modern-encodings-btrblocks-fastlanes-bitweaving">BtrBlocks, FastLanes</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Small segments waste the format</strong>: a segment needs thousands of rows to amortize its dictionary, zone map and headers. Seal on size or age, and merge undersized segments.</li> <li><strong>Updates in place are not possible.</strong> A workload that updates a hot row thousands of times piles up deletes; compaction has to rewrite segments, and an HTAP design needs a delta store (<a href="/cookbook/p/htap-one-table-two-engines">M6</a>).</li> <li><strong>Zone maps only help sorted-ish data.</strong> On a random column every segment spans the whole range and nothing is skipped; sorting or clustering by the filter column is a physical design choice.</li> <li><strong>Order of predicates</strong>: evaluating the cheapest and most selective first, on the survivors, beats evaluating all of them on everything (the conjunction row above).</li> <li><strong>Dictionaries per segment</strong> make cross-segment joins and group-bys decode or re-map codes; a global or shared dictionary has its own costs.</li> <li><strong>High-cardinality text</strong> gains nothing from a dictionary and wastes build time; the one-half rule is a heuristic, measure on real data.</li> <li><strong>Do not forget NULL semantics</strong>: <code>NOT (a = 1)</code> is also false for NULL <code>a</code>; the bitmap result of <code>NOT</code> must be masked by validity, which is why the NULL bitmap is part of every kernel.</li> </ul></aside>
"""

