[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A multi-model database has three possible shapes.</strong> <em>Polyglot</em>: one engine per model (a relational database, a graph database, a vector store) and application code to keep them consistent. <em>Extensions</em>: one mature engine with the other models bolted on through its extension API (pgvector, Apache AGE, TimescaleDB). <em>One substrate</em>: a single ordered key-value store with a transaction layer, and each model a thin layer that maps its operations to key ranges (FoundationDB's Record Layer, CockroachDB and TiDB over their KV layers, SurrealDB, ArangoDB over RocksDB). Cairn takes the third shape, because it is the only one where one transaction can touch a row, an edge, a document and a vector and commit or fail as a whole.</li> <li><strong>The substrate's contract is small.</strong> An ordered map from byte strings to byte strings; point reads and writes; range scans in key order; atomic multi-key transactions with snapshot reads. Everything else is a layer above. Replication, sharding and the storage engine change under that contract without any model noticing.</li> <li><strong>The key layout <em>is</em> the data model.</strong> In a B-tree or an LSM tree, what is stored next to what is decided by the key bytes. If a row's index entries, a vertex's edges, a document's fields and a series' samples sit next to each other in key order, each access pattern becomes one range scan: sequential I/O, one seek, one Raft range, one shard.</li> <li><strong>That requires an encoding whose byte order is the value order</strong> (a <em>memcomparable</em> encoding). Comparing keys is then <code>memcmp</code>; no schema is needed to order them; the same bytes serve as the B-tree key, the LSM key and the shard boundary; composite keys are concatenations. The costs: integers take a fixed width, strings need an escape, and decoding is needed to read a key.</li> <li><strong>Order and prefix are two separate properties and both matter.</strong> Order makes range scans work. Prefix-freedom (one encoded value is never a byte prefix of a different one) makes <em>prefix scans</em> work: "all keys that start with this tuple" must return exactly the keys whose tuple starts with it. The first design in this section had the first property and not the second.</li> <li><strong>Every model needs the same machinery from below</strong>: MVCC timestamps in the key suffix (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>), a replicated log per key range, range splits at key boundaries. Putting the models in one key space means building these once.</li> </ul>
"""

[[sections]]
heading = "One map, many shapes"
body = """
```text
key =  [ model tag ][ id ][ the model's own tuple ]                        value
row         10 | table | pk columns                                        the other columns
index       11 | table | index | indexed columns | pk columns              (empty)
edge out    20 | graph | src | label | dst                                  properties
edge in     21 | graph | dst | label | src                                  (empty)
document    30 | collection | doc id | path components                      a scalar leaf
series      40 | series id | timestamp                                      sample
vector      50 | index | cell | vector id                                   the vector
```

<p>Reading it as access patterns:</p>

<ul> <li>A <strong>table scan</strong> is the prefix <code>10 | table</code>. A primary-key lookup is a point read. An <strong>index range scan</strong> is a range inside <code>11 | table | index</code>, and the primary key comes out of the <em>key</em>, so a covering index never touches the row.</li> <li>A vertex's <strong>out-neighbours</strong> are the prefix <code>20 | graph | src</code>; its <strong>in-neighbours</strong> are the prefix <code>21 | graph | dst</code>. The reverse index is a second copy written in the same transaction; the substrate has no foreign keys to maintain it.</li> <li>A <strong>document</strong> is stored flattened, one key per scalar leaf, path components in order, array indexes as integers. Reading the document is one prefix scan; reading <code>tags[2]</code> is one point read; an index over a path is another key family in the index namespace.</li> <li>A <strong>time range of a series</strong> is a range scan; a <strong>vector cell</strong> (an IVF list) is a prefix scan. Both are the same shape as the others.</li> </ul>
"""

[[sections]]
heading = "The codec"
body = """
<p>Each value is a type tag, then its bytes:</p>

<ul> <li><strong>Integers</strong>: the 64-bit two's complement with the sign bit flipped, big-endian. Negatives then sort before positives, and 9 bytes per integer is the price.</li> <li><strong>Floats</strong>: the IEEE bits, with the sign bit set for non-negatives and all bits inverted for negatives. <code>-0.0</code> and every NaN are canonicalized (SQL treats <code>-0 = 0</code>; NaN sorts after <code>+inf</code>).</li> <li><strong>Text and bytes</strong>: the bytes with each <code>0x00</code> written as <code>0x00 0xFF</code>, ended by <code>0x00 0x01</code>. The ending is smaller than any escape continuation, so <code>"ab" &lt; "ab&#92;0" &lt; "abc"</code>, and it is not a prefix of the escape, so one encoded string is never a prefix of another.</li> <li><strong>Descending columns</strong>: the bytewise complement of the whole component.</li> <li><strong>Type order</strong>: NULL, false, true, integers, floats, text, bytes. The tag byte decides.</li> </ul>

:::deeper Reference: typed tuple codec, key layouts for every model, prefix_end and the shared substrate
```rust title="src/multimodel/mmkey.rs"
//! The key space of a multi-model database: one ordered byte-string store, and a typed tuple encoding whose byte order equals the
//! value order. Every model (rows, secondary indexes, graph edges, document paths, time series, vector cells) is a *prefix* of that
//! key space, so each access pattern is one range scan and one transaction layer serves them all.
use std::cmp::Ordering;
use std::collections::BTreeMap;

#[derive(Clone, Debug)]
pub enum Val { Null, Bool(bool), Int(i64), Float(f64), Text(String), Bytes(Vec<u8>) }

const T_NULL: u8 = 0x01;
const T_FALSE: u8 = 0x02;
const T_TRUE: u8 = 0x03;
const T_INT: u8 = 0x04;
const T_FLOAT: u8 = 0x05;
const T_TEXT: u8 = 0x06;
const T_BYTES: u8 = 0x07;

fn canon(f: f64) -> u64 { if f.is_nan() { 0x7ff8_0000_0000_0000 } else if f == 0.0 { 0 } else { f.to_bits() } }
fn rank(v: &Val) -> u8 { match v { Val::Null => T_NULL, Val::Bool(false) => T_FALSE, Val::Bool(true) => T_TRUE, Val::Int(_) => T_INT, Val::Float(_) => T_FLOAT, Val::Text(_) => T_TEXT, Val::Bytes(_) => T_BYTES } }

impl Val {
    /// The order the encoding must reproduce: NULL < false < true < integers < floats (NaN last, -0 = +0) < text < bytes.
    pub fn cmp_typed(&self, o: &Val) -> Ordering {
        match (self, o) {
            (Val::Int(a), Val::Int(b)) => a.cmp(b),
            (Val::Float(a), Val::Float(b)) => { let (a, b) = (f64::from_bits(canon(*a)), f64::from_bits(canon(*b))); a.total_cmp(&b) }
            (Val::Text(a), Val::Text(b)) => a.as_bytes().cmp(b.as_bytes()),
            (Val::Bytes(a), Val::Bytes(b)) => a.cmp(b),
            (a, b) => rank(a).cmp(&rank(b)),
        }
    }
}
impl PartialEq for Val { fn eq(&self, o: &Val) -> bool { self.cmp_typed(o) == Ordering::Equal } }

/// Typed order of whole tuples: lexicographic by component, a proper prefix first.
pub fn cmp_tuple(a: &[Val], b: &[Val], desc: &[bool]) -> Ordering {
    for (i, (x, y)) in a.iter().zip(b).enumerate() {
        let c = x.cmp_typed(y);
        let c = if desc.get(i).copied().unwrap_or(false) { c.reverse() } else { c };
        if c != Ordering::Equal { return c; }
    }
    a.len().cmp(&b.len())
}

/// 0x00 is escaped as 0x00 0xFF and the string ends with 0x00 0x01. The ending is not a prefix of any escape, so one encoded
/// string is a byte prefix of another only when they are equal, and a shorter string still sorts before its extensions
/// (0x01 < 0xFF). Descending order is the bytewise complement of all of it.
fn put_escaped(b: &[u8], out: &mut Vec<u8>) {
    for &x in b { out.push(x); if x == 0 { out.push(0xFF); } }
    out.extend([0, 1]);
}

/// Append one value. A component is self-delimiting, so concatenations of components sort component by component.
pub fn encode_val(v: &Val, desc: bool, out: &mut Vec<u8>) {
    let start = out.len();
    out.push(rank(v));
    match v {
        Val::Null | Val::Bool(_) => {}
        Val::Int(i) => out.extend(((*i as u64) ^ (1 << 63)).to_be_bytes()),
        Val::Float(f) => { let b = canon(*f); out.extend((if b >> 63 == 1 { !b } else { b | (1 << 63) }).to_be_bytes()) }
        Val::Text(s) => put_escaped(s.as_bytes(), out),
        Val::Bytes(b) => put_escaped(b, out),
    }
    if desc { for x in &mut out[start..] { *x = !*x; } }
}

pub fn encode_tuple(vs: &[Val], desc: &[bool], out: &mut Vec<u8>) {
    for (i, v) in vs.iter().enumerate() { encode_val(v, desc.get(i).copied().unwrap_or(false), out); }
}
pub fn key(vs: &[Val]) -> Vec<u8> { let mut o = vec![]; encode_tuple(vs, &[], &mut o); o }

#[derive(Debug, PartialEq)]
pub enum DecodeError { Truncated, BadTag(u8), BadEscape, BadUtf8 }

fn take_escaped(buf: &[u8], pos: &mut usize, desc: bool) -> Result<Vec<u8>, DecodeError> {
    let g = |p: usize| buf.get(p).map(|&b| if desc { !b } else { b });
    let mut out = vec![];
    loop {
        match g(*pos) {
            None => return Err(DecodeError::Truncated),
            Some(0) => match g(*pos + 1) {
                Some(0xFF) => { out.push(0); *pos += 2; }
                Some(1) => { *pos += 2; return Ok(out); }
                Some(_) => return Err(DecodeError::BadEscape),
                None => return Err(DecodeError::Truncated),
            },
            Some(b) => { out.push(b); *pos += 1; }
        }
    }
}

pub fn decode_val(buf: &[u8], pos: &mut usize, desc: bool) -> Result<Val, DecodeError> {
    let g = |p: usize| buf.get(p).map(|&b| if desc { !b } else { b }).ok_or(DecodeError::Truncated);
    let tag = g(*pos)?; *pos += 1;
    let eight = |pos: &mut usize| -> Result<u64, DecodeError> {
        let mut a = [0u8; 8];
        for i in 0..8 { a[i] = g(*pos + i)?; }
        *pos += 8; Ok(u64::from_be_bytes(a))
    };
    Ok(match tag {
        T_NULL => Val::Null, T_FALSE => Val::Bool(false), T_TRUE => Val::Bool(true),
        T_INT => Val::Int((eight(pos)? ^ (1 << 63)) as i64),
        T_FLOAT => { let e = eight(pos)?; Val::Float(f64::from_bits(if e >> 63 == 1 { e & !(1 << 63) } else { !e })) }
        T_TEXT => Val::Text(String::from_utf8(take_escaped(buf, pos, desc)?).map_err(|_| DecodeError::BadUtf8)?),
        T_BYTES => Val::Bytes(take_escaped(buf, pos, desc)?),
        t => return Err(DecodeError::BadTag(t)),
    })
}

pub fn decode_tuple(buf: &[u8], desc: &[bool]) -> Result<Vec<Val>, DecodeError> {
    let (mut pos, mut out) = (0, vec![]);
    while pos < buf.len() { let d = desc.get(out.len()).copied().unwrap_or(false); out.push(decode_val(buf, &mut pos, d)?); }
    Ok(out)
}

// ---- the layout: a one-byte model tag, then ids, then the model's own tuple -----------------------------------------------------

pub mod ns {
    pub const ROW: u8 = 0x10;
    pub const INDEX: u8 = 0x11;
    pub const EDGE_OUT: u8 = 0x20;
    pub const EDGE_IN: u8 = 0x21;
    pub const DOC: u8 = 0x30;
    pub const SERIES: u8 = 0x40;
    pub const VECTOR: u8 = 0x50;
}

fn head(tag: u8, id: u32) -> Vec<u8> { let mut k = vec![tag]; k.extend(id.to_be_bytes()); k }
fn with(mut k: Vec<u8>, vs: &[Val]) -> Vec<u8> { encode_tuple(vs, &[], &mut k); k }

pub fn row_key(table: u32, pk: &[Val]) -> Vec<u8> { with(head(ns::ROW, table), pk) }
pub fn index_key(table: u32, index: u16, cols: &[Val], pk: &[Val]) -> Vec<u8> {
    let mut k = head(ns::INDEX, table); k.extend(index.to_be_bytes()); with(with(k, cols), pk)
}
pub fn index_prefix(table: u32, index: u16, cols: &[Val]) -> Vec<u8> { let mut k = head(ns::INDEX, table); k.extend(index.to_be_bytes()); with(k, cols) }
pub fn out_edge(graph: u32, src: u64, label: &str, dst: u64) -> Vec<u8> { with(head(ns::EDGE_OUT, graph), &[Val::Int(src as i64), Val::Text(label.into()), Val::Int(dst as i64)]) }
pub fn in_edge(graph: u32, dst: u64, label: &str, src: u64) -> Vec<u8> { with(head(ns::EDGE_IN, graph), &[Val::Int(dst as i64), Val::Text(label.into()), Val::Int(src as i64)]) }
pub fn doc_key(coll: u32, id: u64, path: &[Val]) -> Vec<u8> { let mut p = vec![Val::Int(id as i64)]; p.extend_from_slice(path); with(head(ns::DOC, coll), &p) }
pub fn series_key(series: u64, ts: i64) -> Vec<u8> { let mut k = vec![ns::SERIES]; k.extend(series.to_be_bytes()); with(k, &[Val::Int(ts)]) }
pub fn vector_key(index: u32, cell: u32, id: u64) -> Vec<u8> { with(head(ns::VECTOR, index), &[Val::Int(cell as i64), Val::Int(id as i64)]) }

/// The smallest key greater than every key with this prefix (the end of a prefix range scan).
pub fn prefix_end(p: &[u8]) -> Option<Vec<u8>> {
    let mut e = p.to_vec();
    while let Some(last) = e.pop() { if last < 0xFF { e.push(last + 1); return Some(e); } }
    None
}

/// The ordered store every model shares. A real engine puts the LSM or B-tree and the transaction layer here.
#[derive(Default)]
pub struct Substrate { pub kv: BTreeMap<Vec<u8>, Vec<u8>>, pub scans: u64, pub keys_read: u64 }
impl Substrate {
    pub fn put(&mut self, k: Vec<u8>, v: Vec<u8>) { self.kv.insert(k, v); }
    pub fn del(&mut self, k: &[u8]) { self.kv.remove(k); }
    pub fn get(&mut self, k: &[u8]) -> Option<&Vec<u8>> { self.keys_read += 1; self.kv.get(k) }
    pub fn scan_prefix(&mut self, p: &[u8]) -> Vec<(Vec<u8>, Vec<u8>)> {
        self.scans += 1;
        let r: Vec<_> = match prefix_end(p) {
            Some(e) => self.kv.range(p.to_vec()..e).map(|(k, v)| (k.clone(), v.clone())).collect(),
            None => self.kv.range(p.to_vec()..).map(|(k, v)| (k.clone(), v.clone())).collect(),
        };
        self.keys_read += r.len() as u64; r
    }
}
```
