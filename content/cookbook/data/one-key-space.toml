[[sections]]
heading = "Measured"
body = """
<p>The seven rows below are keys built by the layout functions; the integers are visibly <code>04</code> followed by eight bytes with the top bit flipped (<code>80 00 … 07</code> is 7), the strings <code>06 … 00 01</code>.</p>

```text title="the key layouts, and 1 000 000 composite keys encoded, decoded and sorted"
model        key (hex)                                                      meaning
row          10 00 00 00 01 04 80 00 00 00 00 00 00 07                      users(id=7)
index        11 00 00 00 01 00 01 04 80 00 00 00 00 00 00 1f 04 80 00 00 00 00 00 00 07 users by age=31, id=7
edge out     20 00 00 00 01 04 80 00 00 00 00 00 00 07 06 66 6f 6c 6c 6f 77 73 00 01 04 80 00 00 00 00 00 00 0c 7 -follows-> 12
edge in      21 00 00 00 01 04 80 00 00 00 00 00 00 0c 06 66 6f 6c 6c 6f 77 73 00 01 04 80 00 00 00 00 00 00 07 12 <-follows- 7
document     30 00 00 00 01 04 80 00 00 00 00 00 00 07 06 74 61 67 73 00 01 04 80 00 00 00 00 00 00 02 doc 7, path tags[2]
series       40 00 00 00 00 00 00 00 03 04 80 00 00 00 00 00 03 e8          series 3 at t=1000
vector       50 00 00 00 01 04 80 00 00 00 00 00 00 04 04 80 00 00 00 00 00 00 09 cell 4, vector 9
tuples of (int, text, float): 1000000 keys of 32.0 bytes on average
encode 69 ns per key, decode 74 ns per key (checksum 3000000)
sort of 1000000 keys: typed comparator 0.34 s, memcmp on encoded bytes 0.13 s (2.7x faster)
```

<ul> <li><strong>Comparison is where the encoding pays</strong>: sorting a million three-column keys takes 0.34 s with a typed comparator and 0.13 s with <code>memcmp</code> on the encoded bytes, <strong>2.7× faster</strong>, and both orders agree for all one million keys. The comparator is also the same function everywhere (B-tree page search, LSM merge, shard routing) and needs no schema.</li> <li><strong>Encoding is cheap, decoding is a cost</strong>: about 70 ns per three-column key each way. A scan that only needs the key's order never decodes; one that returns column values decodes them from the key or the value, and the layouts above keep the decoded part small.</li> <li><strong>Integers are wide</strong>: the 9-byte integer is 4 to 8 bytes more than a varint, and every key in an index repeats the primary key. Engines that care use variable-length integer encodings that keep the order (FoundationDB's tuple layer does); the exercises build one.</li> </ul>

<aside data-call="note"><b>A bug the property test found</b><p>The first terminator for strings was a single <code>0x00</code>, as in the Part II key encodings. Order came out right in 200 000 random pairs. A separate property, "the bytes of A are a prefix of the bytes of B exactly when the tuple A is a prefix of the tuple B", failed on <code>[""]</code> against <code>["&#92;0é…"]</code>: the empty string's <code>00</code> is also the first byte of the escape <code>00 ff</code>, so a prefix scan for <code>""</code> would have returned documents whose first field starts with a NUL. Changing the ending to <code>00 01</code> fixed it. Order tests alone would not have found this; the model layouts depend on prefix scans.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A closed <code>enum Val</code></strong> with a hand-written <code>cmp_typed</code> is the specification; the encoder is checked against it, not the other way round. <code>PartialEq</code> is defined through the same comparison so <code>-0.0 == 0.0</code> and <code>NaN == NaN</code> hold for keys, unlike <code>f64</code>'s own <code>==</code>.</li> <li><strong><code>f64::total_cmp</code></strong> gives the IEEE total order on bits; the codec canonicalizes <code>-0.0</code> and NaN <em>before</em> comparing, so the oracle and the encoding agree on the two values where total order and SQL disagree.</li> <li><strong>Escapes in a <code>Vec&lt;u8&gt;</code> out-parameter</strong>: encoding appends to a caller-provided buffer, so building a row key, an index key and an edge key in one transaction reuses one allocation. <code>decode_tuple</code> returns <code>Result&lt;_, DecodeError&gt;</code> and never indexes unchecked; the garbage test runs 50 000 random byte strings through both directions.</li> <li><strong><code>BTreeMap::range</code> with an exclusive upper bound from <code>prefix_end</code></strong>: the smallest key above every key with the prefix. An all-<code>0xFF</code> prefix has no upper bound, so the function returns <code>Option</code> and the scan falls back to an open range.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Order</strong>: 200 000 random pairs of tuples (0 to 3 components over an adversarial alphabet: NUL, <code>0x01</code>, <code>0xC3 0xBF</code>, <code>-0.0</code>, NaN, infinities, <code>i64::MIN</code>, bytes with <code>0xFF</code>) with random ascending/descending flags; the encoded bytes compare as the typed values do.</li> <li><strong>Round trip</strong>: 100 000 tuples decode to equal tuples in both directions.</li> <li><strong>Prefix property</strong>: 200 000 pairs; <code>bytes(A)</code> is a prefix of <code>bytes(B)</code> exactly when <code>A</code> is a prefix of <code>B</code>.</li> <li><strong>Robustness</strong>: random byte strings never panic the decoder; every truncation of a valid key is an error; an unknown tag is <code>BadTag</code>.</li> <li><strong>Cross-type ladder</strong>: NULL &lt; false &lt; true &lt; ints &lt; floats &lt; text &lt; bytes, with neighbours like <code>"a" &lt; "a&#92;0"</code> and <code>[] &lt; [0]</code>.</li> <li><strong>Layouts</strong>: a table of 200 users with an age index, a 400-edge graph with both directions, 50 documents, 4 series and 8 vector cells in one map; each access pattern (table scan, index range, neighbours both ways, one document, a time range, a cell) returns exactly what a plain filter over the source data returns, and every model's tag range holds only its own keys.</li> <li><strong>Mutants run against these tests</strong>: sign bit not flipped; negative floats not inverted; NaN or <code>-0.0</code> not canonical; NUL not escaped; ending a prefix of the escape; descending flipping nothing; a prefix not sorting first; <code>prefix_end</code> not incrementing; float decode mixing up its cases; the in-edge tag equal to the out-edge tag; NULL or <code>true</code> retagged; index keys without the primary key or the index id; a prefix scan without its upper bound. <strong>All 16 were killed.</strong> One mutant (retagging NULL) survived the first suite, because the oracle used the same tag table; the cross-type ladder test fixes the order independently.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>FoundationDB's tuple layer</strong> is this codec (type codes, escaped <code>0x00</code>, order-preserving integers, variable-length for small ones) and its Record Layer builds indexes and queries on it. <strong>CockroachDB</strong>'s key encoding writes table id, index id and column values into one ordered key space and splits ranges at key boundaries; <strong>TiDB</strong> does the same over TiKV, with <code>t{table}_r{rowid}</code> and <code>t{table}_i{index}</code> prefixes.</li> <li><strong>SurrealDB</strong> and <strong>ArangoDB</strong> map documents, graph edges and records onto an embedded key-value engine (RocksDB, TiKV, FoundationDB); edge documents carry source and target ids with an index in each direction, as above.</li> <li><strong>PostgreSQL</strong> is the extension route: <code>pgvector</code> stores vectors as a column type with its own index access methods, <strong>Apache AGE</strong> adds graphs on top of tables, <strong>TimescaleDB</strong> partitions tables by time. The transaction is Postgres's; the layout is Postgres's.</li> <li><strong>DuckDB</strong> and <strong>ClickHouse</strong> order by <em>sort keys</em> with their own comparators on columnar data; the memcomparable trick matters most where one byte-ordered store serves many schemas.</li> <li><strong>Cloud multi-model services</strong> (Azure Cosmos DB) expose several APIs over one replicated, partitioned store with one resource model.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Prefix-freedom is a separate requirement from ordering.</strong> Test both, with strings that end in the terminator's bytes.</li> <li><strong>Never change an encoding after data exists.</strong> Keys are the storage format and the shard boundary; version the tag or the namespace if a layout must change.</li> <li><strong>Floats in keys</strong>: decide on <code>-0.0</code> and NaN once; SQL equality and bit equality differ, and an index lookup for <code>0.0</code> must find <code>-0.0</code>.</li> <li><strong>Collations</strong>: a memcomparable text key orders by bytes (code point order). A locale-aware order needs a collation key (a sort key from ICU) in place of the raw bytes, and then you cannot decode the original string from the key.</li> <li><strong>Large keys</strong>: a vertex with a million edges is a million adjacent keys, fine for a scan and bad for a "count" without a stored degree; a document with a 10 MB string is one huge value, not a key problem.</li> <li><strong>Namespace growth</strong>: the one-byte model tag has 256 values; reserve ranges for system tables and future models.</li> <li><strong>Reverse indexes cost writes</strong>: every edge insert writes two keys; every row writes one per index. Count them when you estimate write amplification.</li> </ul></aside>
"""

