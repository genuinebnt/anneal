<aside data-call="testing"><b>Test plan</b><ul> <li><code>all_strategies_agree_on_random_loop_free_programs</code>: 400 <strong>randomly generated programs</strong> (nested ifs, early returns, assignments, all eleven operators, including division by zero) × 300 random rows: interpreter vs batched vs inlined-per-row vs inlined-vectorized, all equal.</li> <li><code>batching_agrees_on_random_programs_with_loops_and_early_returns</code>: 300 random programs that include bounded <code>while</code> loops and <code>return</code> inside loops and branches (over 30 had loops); batching equals the interpreter; <code>inline</code> refuses exactly the programs that contain a loop.</li> <li><code>the_real_udfs_match_native_code</code> and <code>subquery_strategies_agree</code> (including customers with no orders, empty tables, and one customer only).</li> <li><strong>Mutation checks</strong> (run once, reverted): making <code>return</code> ignore the <em>done</em> flag makes the first test fail on inlined rows; making a <code>while</code> loop leave lanes in the wrong mask makes the second fail. The harness can see both bug classes.</li> </ul></aside>
"""

[[sections]]
heading = "Measured"
body = """
```text title="shipping(weight, dist) — 8M rows, ns per row"
  interpreter, row at a time           34.6
  inlined expression, row at a time    33.7
  inlined expression, vectorized       10.5
  batched statements with masks        25.0
  native Rust function                 0.55
```

```text title="collatz(n): a data-dependent loop — 500k rows, 108 loop iterations on average, ns per row"
  interpreter, row at a time           2553
  batched statements with masks        3007   lane-iterations executed / needed = 2.76
  same, input sorted by step count     1159   lane-iterations executed / needed = 1.00
  native Rust function                   77
```

```text title="total_spent(c): a UDF containing a query, ms"
customers    orders   scan per row  index per row     decorrelated
     500     50000            2.5           0.43             0.06
    1000    100000           10.7           0.99             0.11
    2000    200000           42.3           2.21             0.22
    4000    400000          171.9           4.83             0.57
 1000000  10000000              -             94               72   (index build 367 ms not included)
```

<ul> <li><strong>Inlining by itself is not a speedup</strong>: the inlined expression evaluated row by row costs the same as the interpreter (33.7 vs 34.6 ns). What inlining buys is <strong>visibility</strong>: once the logic is an expression, the engine can evaluate it column-at-a-time (<strong>3.3×</strong>: 10.5 ns), estimate its cost, push predicates into it, parallelize it, and compile it.</li> <li><strong>Compilation is the end of the road for scalar logic</strong>: the native function is <strong>63×</strong> faster than the interpreter and <strong>19×</strong> faster than even the vectorized expression, whose kernels allocate a vector per node. The lecture lists compilation as the first remedy for a reason.</li> <li><strong>Batching with masks is 1.4× here</strong>, held back by naive allocation (a mask and a result vector per statement) and by evaluating <em>both</em> sides of every branch for all lanes. It is the only fast path for a UDF with a loop, but <strong>divergence kills it</strong>: with a data-dependent loop, a batch runs until its <em>slowest</em> lane finishes, so 2.76× more lane-iterations are executed than needed and the result is slower than the interpreter (3007 vs 2553 ns). Sorting the input by iteration count (or grouping similar rows) brings the waste to 1.00 and the time to 1159 ns (2.2× faster than the interpreter), yet still 15× behind native code.</li> <li><strong>The query inside a UDF is the real killer</strong>: the per-row scan is <strong>quadratic</strong>, 4× per step when customers and orders both double, and at 4000 customers × 400 K orders it takes 172 ms vs <strong>0.57 ms decorrelated (300×)</strong>. An index makes each call cheap (4.8 ms, 36× better than scanning) but it stays per row; at 1 M customers × 10 M orders the decorrelated plan (72 ms, <em>including</em> building its hash table) matches the index plan (94 ms) without needing an index (building one took 367 ms).</li> <li><strong>What these numbers don't contain</strong>: a real engine adds a <em>per-call boundary</em> (switching into the language runtime, setting up a frame, planning or locating the nested statement). Row-at-a-time gaps in a real DBMS are therefore larger than the 34 ns here, which is why inlining and batching pay off even more in practice.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Control flow as a value</strong>: <code>exec</code> returns <code>Option&lt;i64&gt;</code>; <code>Some</code> means a <code>return</code> fired, and every loop and <code>if</code> propagates it with <code>if let Some(r) = ... { return Some(r) }</code>, the same shape as <code>?</code>. No exceptions, no flags in the interpreter.</li> <li><strong>A symbolic state that clones for free</strong>: the inliner's <code>Sym</code> holds <code>Vec&lt;Rc&lt;Expr&gt;&gt;</code>; cloning it at an <code>if</code> copies pointers, not trees, and <code>Rc::ptr_eq</code> skips emitting a <code>CASE</code> when both branches left a variable unchanged. The expression is a <strong>DAG</strong>, which is also why naive printing or evaluation without common-subexpression elimination can blow up.</li> <li><strong>Total operators</strong> (<code>x / 0 = 0</code>, wrapping arithmetic) make it safe to evaluate both arms of a <code>CASE</code> eagerly in vector code; a SQL engine must keep <code>CASE</code>'s lazy guarantee (errors in the unchosen arm must not fire), usually by evaluating arms under a selection vector or mask.</li> <li><strong><code>bool</code> as a lane mask</strong> is simple but allocates; the production form is a bitmap or a <strong>selection vector</strong> (<a href="/cookbook/p/vectorized-execution-with-simd">A14</a>); and the <code>eval_vec</code> allocation per node becomes a pool of reusable vectors or a fused, generated kernel.</li> <li><strong><code>[i64; 8]</code> frame on the stack</strong> for the interpreter: no heap, <code>copy_from_slice</code> for arguments; sizing it at compile time is a typical trade between generality and speed.</li> <li><strong>Writing real UDFs in Rust</strong>: <a href="https://github.com/pgcentralfoundation/pgrx" target="_blank" rel="noreferrer"><code>pgrx</code></a> for PostgreSQL extensions and <a href="https://docs.rs/datafusion" target="_blank" rel="noreferrer">DataFusion</a>'s <code>ScalarUDF</code>/<code>AggregateUDF</code> for engines in Rust show the vectorized UDF interface (<code>&amp;[ArrayRef] -&gt; ArrayRef</code>), which gets batching for free.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Inlining must preserve semantics</strong>: only <strong>pure/deterministic</strong> bodies can be inlined; a UDF with side effects (writes, <code>random()</code>, <code>now()</code>, sequence calls) or exceptions changes meaning when duplicated, reordered, or evaluated for rows a filter would have removed. Engines require volatility labels (<code>IMMUTABLE</code>, <code>STABLE</code>, <code>VOLATILE</code>) and parallel-safety labels (<code>PARALLEL SAFE</code>/<code>UNSAFE</code>) for exactly this reason; the optimizer trusts them.</li> <li><strong>Lazy <code>CASE</code></strong>: eager evaluation of both arms (as the vector kernels here do) is valid only with total operators; with SQL's partial operators (division, casts, array access) evaluate arms under masks.</li> <li><strong>Expression blowup</strong>: nested ifs with merged variables multiply expression sizes; Froid breaks the body into <strong>regions</strong> joined by lateral joins and derived tables so the optimizer sees a bounded tree.</li> <li><strong>Loops don't inline</strong>: Froid does not handle them; the options are the recursive-CTE route (APFEL), batching with masks (watch divergence), or compilation.</li> <li><strong>Triggers and procedures change transactions</strong>: a UDF runs inside the caller's snapshot; a procedure that commits mid-way, or a trigger that writes, interacts with locking, MVCC visibility and logging (<a href="/cookbook/p/concurrency-control-theory">L17-L25</a>); document and test those paths.</li> <li><strong>Sandboxing</strong>: user code can loop forever, allocate without bound, crash the process or read what it shouldn't; run foreign code in a sandbox (process or WebAssembly isolation, Part V) with <strong>fuel/time limits, memory limits</strong> and a capability-restricted API.</li> <li><strong>Plan caching and statistics</strong>: a UDF the optimizer can't see gets a default cardinality; after inlining, estimates change and so do plans, so re-test plan stability across versions.</li> </ul></aside>
"""

