```text title="Output"
480 random queries × 2 optimizer settings match SQLite
```

<aside data-call="testing"><b>What the fuzzer found while this was written</b><p>Nothing, on the first run: the earlier hand-written differential suite had already pinned the semantics (NULL grouping, <code>NOT IN</code>, left-join filter placement). The <em>plan-shape</em> test found the pushdown ordering bug. The lesson is that result-based tests can't see a <strong>missed optimization</strong>: a plan that returns the right rows slowly is a pass. Performance regressions need plan assertions or benchmarks, and any serious optimizer keeps both.</p></aside>
