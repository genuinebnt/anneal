[[sections]]
heading = "Overview"
body = """
<p>BusTub's P3 asks for two optimizer rules (<code>NLJ → HashJoin</code>, <code>SeqScan → IndexScan</code>) and three leaderboard queries that reward more. The reference optimizer has five rules in two passes, each a small local rewrite on the plan tree. Two more stages sit in front of them and are built in the next two lectures: <strong>expression simplification</strong> (<a href="/cookbook/p/query-planning-and-rewriting">L15</a>) and <strong>cost-based join ordering</strong> (<a href="/cookbook/p/cost-models-and-join-ordering">L16</a>). The full pipeline is <code>simplify → pushdown → reorder joins → bottom-up rewrites</code>. Heavier machinery (Cascades, parallel search) is Part III.</p>
"""

