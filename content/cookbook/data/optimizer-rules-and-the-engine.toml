[[sections]]
heading = "BusTub's optimizer switch: the starter rules"
body = """
<p>BusTub's tests are run in two optimizer configurations, and a solution that only implements the second fails the first.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th></th> <th><code>set force_optimizer_starter_rule=yes</code></th> <th>default</th> </tr> </thead> <tbody> <tr> <td>merge projection / filter into scans and joins</td> <td>yes</td> <td>yes</td> </tr> <tr> <td><code>NestedLoopJoin</code> with an equality → <code>NestedIndexJoin</code></td> <td><strong>yes</strong></td> <td>your rules</td> </tr> <tr> <td><code>NestedLoopJoin</code> → <code>HashJoin</code></td> <td><strong>no</strong></td> <td>yes (task 3)</td> </tr> <tr> <td><code>Sort</code> over an indexed column → ordered <code>IndexScan</code></td> <td><strong>yes</strong></td> <td>in BusTub's custom list too; the reference engine runs it only in starter mode (NULL caveat below)</td> </tr> <tr> <td><code>SeqScan</code> → <code>IndexScan</code></td> <td><strong>strict</strong>: the <em>whole</em> predicate is <code>col = k</code> or an OR of those, on an indexed column</td> <td>your rule</td> </tr> <tr> <td><code>Sort</code> + <code>Limit</code> → <code>TopN</code></td> <td>no</td> <td>yes</td> </tr> <tr> <td>predicate simplification, join reordering</td> <td>no</td> <td>yours</td> </tr> </tbody> </table></div>

<p>The tests that check the plain nested-loop and index-join executors (<code>nlj_init_check</code>, <code>index_join</code>) turn the switch on so that those executors are what runs; with the hash join rule active they would never be exercised. The reference engine has the switch as <code>Catalog::starter_rules</code>, set by <code>SET force_optimizer_starter_rule = yes</code>.</p>

<p><strong>The strict index rule is a test requirement, not good optimization.</strong> <code>index-scan-hash.slt</code> has <code>+ensure:seq_scan</code> on <code>WHERE v2 = 50 AND v3 = 645</code> even though <code>v2</code> is indexed: the starter rule does not fire on a predicate with an extra conjunct, and the test fails if you use the index anyway. The default-mode rule here is smarter (probe the index, keep <code>v3 = 645</code> as a residual filter), so the strictness lives behind the switch.</p>

<p><code>+ensure:&lt;what&gt;</code> works by running <code>EXPLAIN (O) &lt;query&gt;</code> and looking for operator names in the text: <code>IndexScan</code>, <code>NestedIndexJoin</code>, <code>HashJoin</code> (exactly one, or two, or three, unless a <code>Filter</code> node remains), <code>TopN</code>, <code>NestedLoopJoin</code>; <code>seq_scan</code> fails if there is an <code>IndexScan</code> or a <code>Filter</code> left. <strong>Name your plan nodes exactly that way.</strong> (<code>nlj_init_check</code> and <code>topn</code> also enable counters in BusTub's executors that fail the test if <code>Init()</code> is called too often; that half has no equivalent in this engine.)</p>

<p><code>ORDER BY</code> over an indexed column becomes a full ordered scan of the index and the sort disappears:</p>

```rust title="optimizer: OrderByAsIndexScan (src/optimizer/order_by_index_scan.rs)"
/// BusTub's OrderByAsIndexScan: a `Sort` by one ascending plain column over a bare scan of a table that has an
/// index on that column becomes an ordered scan of the index, and the sort disappears. Only starter mode runs it:
/// an index holds no entry for a NULL key, so on a nullable column the rewrite would silently drop those rows
/// (BusTub's tests never have NULLs there; we do not assume that of everyone's data). For the same reason the
/// `expr IS NULL` guard keys that NULLS FIRST/LAST adds are dropped here: no NULL can reach them.
fn order_by_as_index_scan(p: Plan, cat: &Catalog) -> Plan {
    let p = map_children(p, &mut |c| order_by_as_index_scan(c, cat));
    let Plan::Sort { order_by, child } = p else { return p };
    let unchanged = |order_by, child| Plan::Sort { order_by, child };
    // Look through one projection (it may add hidden sort-key columns) to the scan.
    let (exprs, scan): (Option<&Vec<Expr>>, &Plan) = match &*child {
        Plan::Projection { exprs, child: c, .. } => (Some(exprs), &**c),
        other => (None, other),
    };
    let resolve = |e: &Expr| -> Option<Expr> {
        match (e, exprs) {
            (Expr::Col(j), Some(ex)) => ex.get(*j).cloned(),
            (Expr::Col(_), None) => Some(e.clone()),
            _ => None,
        }
    };
    let mut keys = vec![];
    for (e, asc) in &order_by {
        match resolve(e) {
            Some(Expr::IsNull(inner, false)) if matches!(*inner, Expr::Col(_)) => {}
            Some(Expr::Col(c)) if *asc => keys.push(c),
            _ => return unchanged(order_by, child),
        }
    }
    let [src_col] = keys[..] else { return unchanged(order_by, child) };
    let Plan::SeqScan { table, schema, filter: None } = scan else { return unchanged(order_by, child) };
    let Some(ix) = cat.indexes_on(table).find(|i| i.col == src_col) else {
        return unchanged(order_by, child);
    };
    let ordered = Plan::IndexScan {
        table: table.clone(),
        index: ix.name.clone(),
        schema: schema.clone(),
        lookup: IndexLookup::Ordered,
        filter: None,
    };
    match *child {
        Plan::Projection { exprs, schema, .. } => Plan::Projection { exprs, schema, child: Box::new(ordered) },
        _ => ordered,
    }
}
```

<aside data-call="warning"><b>An ordered index scan silently drops NULL-keyed rows</b><p>An index has no entry for a NULL key, so scanning it in order returns only the rows whose key is not NULL. BusTub's tests never put NULLs in an indexed column, which is why the rewrite is safe there and is what the course asks for. In an engine that you also want to be correct on other data, either refuse the rewrite for nullable columns, add the NULL-keyed rows from a heap scan, or (as here) restrict it to the mode that exists to reproduce BusTub's plans. The <code>expr IS NULL</code> guard keys that <code>NULLS FIRST/LAST</code> adds to a sort (<a href="/cookbook/p/sql-front-end">P3.2</a>) are dropped by this rule for the same reason.</p></aside>

<p><code>tests/engine_dialect.rs::starter_rules_change_the_plan_not_the_answer</code> checks the contract: ten queries, the plan node that must (or must not) appear in each mode, and identical answers in both.</p>
"""

