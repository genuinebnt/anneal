heading = "The rules"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>#</th> <th>Rule</th> <th>Pattern → result</th> <th>Why it's safe</th> </tr> </thead> <tbody> <tr> <td>1</td> <td><strong>Predicate pushdown</strong></td> <td><code>Filter(NestedLoopJoin(L, R))</code> → conjuncts that touch only <code>L</code> go below on the left, only <code>R</code> below on the right; conjuncts spanning both fold into the join predicate</td> <td>filtering earlier never changes an inner join's result</td> </tr> <tr> <td>1b</td> <td>…for <code>LEFT</code> joins</td> <td>only <strong>left-side</strong> conjuncts move; right-side <code>WHERE</code> conjuncts stay above</td> <td>a right-side filter <em>above</em> the join also removes the NULL-padded rows; below it would let them through</td> </tr> <tr> <td>2</td> <td><strong>Scan filter merge</strong></td> <td><code>Filter(SeqScan)</code> → <code>SeqScan{filter}</code></td> <td>one fewer operator and no tuple copy</td> </tr> <tr> <td>3</td> <td><strong>Index scan</strong></td> <td><code>SeqScan{ col = k  [OR col = k2 …] }</code> with an index on <code>col</code> → <code>IndexScan(Points)</code> + residual filter. A range <code>col &gt;= lo AND col &lt;= hi</code> over fewer than 16 integers is the same thing: the simplifier turns <code>col = 3 OR col = 4</code> into exactly that range, and probing beats scanning</td> <td>an equality on a unique index returns ≤ 1 row per key</td> </tr> <tr> <td>4</td> <td><strong>Join algorithm</strong></td> <td><code>NLJ</code> with <code>a = b</code> conjuncts (each side referencing one input) → <code>NestedIndexJoin</code> if the right side is a bare indexed scan, else <code>HashJoin</code>; non-equality conjuncts become the <strong>residual</strong></td> <td>equality is exactly what hashing and indexes answer</td> </tr> <tr> <td>5</td> <td><strong>Top-N</strong></td> <td><code>Limit(Sort(x))</code> → <code>Limit(TopN(x))</code></td> <td>the limit needs only the first n of the sorted order</td> </tr> </tbody> </table></d