heading = "The engine entry point"
body = """
:::deeper Engine: parse → plan (per statement kind) → optimize → execute
```rust title="src/lib.rs (engine facade)"
//! A small relational engine over the buffer pool, table heap and B+Tree built earlier.
pub mod catalog;
pub mod exec;
pub mod exec_spill;
pub mod spill;
pub mod expr;
pub mod optimizer;
pub mod plan;
pub mod sql;

use crate::buffer::buffer_pool_manager::BpmError;
use crate::types::value::Value;
use catalog::{coerce, Catalog, Column, Schema};
use expr::Expr;
use plan::{Binder, Plan};
use sql::{Ast, Stmt};

#[derive(Debug, Clone, PartialEq)]
pub struct Error(pub String);
pub type Result<T, E = Error> = std::result::Result<T, E>;
pub fn err<T>(s: String) -> Result<T> { Err(Error(s)) }
impl From<BpmError> for Error { fn from(e: BpmError) -> Self { Error(format!("storage: {e:?}")) } }

#[derive(Debug, Clone, PartialEq)]
pub struct QueryResult { pub columns: Vec<String>, pub rows: Vec<Vec<Value>> }

pub struct Engine<'a> { pub cat: Catalog<'a>, pub optimize: bool }

impl<'a> Engine<'a> {
    pub fn new(bpm: &'a catalog::Bpm) -> Self { Engine { cat: Catalog::new(bpm), optimize: true } }

    pub fn execute(&mut self, sql: &str) -> Result<Vec<QueryResult>> {
        sql::parse(sql)?.into_iter().map(|s| self.stmt(s)).collect()
    }

    pub fn query(&mut self, sql: &str) -> Result<Vec<Vec<Value>>> {
        Ok(self.execute(sql)?.pop().map(|r| r.rows).unwrap_or_default())
    }

    fn plan_for(&self, s: &Stmt) -> Result<Plan> {
        let b = Binder { cat: &self.cat };
        let plan = match s {
            Stmt::Select(sel) => b.plan_select(sel)?,
            Stmt::Insert { table, cols, rows, select } => {
                let ti = self.cat.table(table)?;
                let width = ti.schema.len();
                let targets: Vec<usize> = match cols {
                    Some(cs) => cs.iter().map(|c| ti.schema.resolve(None, c)).collect::<Result<_>>()?,
                    None => (0..width).collect(),
                };
                let child = if let Some(rows) = rows {
                    let empty = Schema::default();
                    let rows: Vec<Vec<Expr>> = rows.iter().map(|r| r.iter().map(|e| b.bind(e, &empty)).collect::<Result<_>>()).collect::<Result<_>>()?;
                    if rows.iter().any(|r| r.len() != targets.len()) { return err(format!("INSERT has {} target columns but a row with a different number of values", targets.len())); }
                    let schema = Schema::new(targets.iter().map(|&i| Column { name: ti.schema.cols[i].name.clone(), ty: ti.schema.cols[i].ty, table: None }).collect());
                    Plan::Values { rows, schema }
                } else {
                    let p = b.plan_select(select.as_ref().unwrap())?;
                    if p.schema().len() != targets.len() { return err("INSERT ... SELECT column count mismatch".into()); }
                    p
                };
                // Reorder into table layout; unlisted columns become NULL.
                let exprs: Vec<Expr> = (0..width).map(|i| targets.iter().position(|&t| t == i).map_or(Expr::Lit(Value::Null), Expr::Col)).collect();
                let proj = Plan::Projection { exprs, schema: ti.schema.clone(), child: Box::new(child) };
                Plan::Insert { table: ti.name.clone(), child: Box::new(proj) }
            }
            Stmt::Update { table, sets, filter } => {
                let ti = self.cat.table(table)?;
                let schema = ti.schema.with_qualifier(&ti.name);
                let mut child = Plan::SeqScan { table: ti.name.clone(), schema: schema.clone(), filter: None };
                if let Some(f) = filter { child = Plan::Filter { pred: b.bind(f, &schema)?, child: Box::new(child) }; }
                let sets = sets.iter().map(|(c, e)| Ok((schema.resolve(None, c)?, b.bind(e, &schema)?))).collect::<Result<_>>()?;
                Plan::Update { table: ti.name.clone(), sets, child: Box::new(child) }
            }
            Stmt::Delete { table, filter } => {
                let ti = self.cat.table(table)?;
                let schema = ti.schema.with_qualifier(&ti.name);
                let mut child = Plan::SeqScan { table: ti.name.clone(), schema: schema.clone(), filter: None };
                if let Some(f) = filter { child = Plan::Filter { pred: b.bind(f, &schema)?, child: Box::new(child) }; }
                Plan::Delete { table: ti.name.clone(), child: Box::new(child) }
            }
            _ => return err("not a plannable statement".into()),
        };
        Ok(if self.optimize { optimizer::optimize(plan, &self.cat) } else { plan })
    }

    fn stmt(&mut self, s: Stmt) -> Result<QueryResult> {
        match s {
            Stmt::CreateTable { name, cols } => { self.cat.create_table(&name, cols)?; Ok(QueryResult { columns: vec![], rows: vec![] }) }
            Stmt::CreateIndex { name, table, col } => { self.cat.create_index(&name, &table, &col)?; Ok(QueryResult { columns: vec![], rows: vec![] }) }
            Stmt::Explain(inner) => {
                let text = self.plan_for(&inner)?.explain();
                Ok(QueryResult { columns: vec!["plan".into()], rows: text.lines().map(|l| vec![Value::Text(l.into())]).collect() })
            }
            s => {
                let plan = self.plan_for(&s)?;
                let columns = plan.schema().cols.iter().map(|c| c.name.clone()).collect();
                Ok(QueryResult { columns, rows: exec::run(&plan, &self.cat)? })
            }
        }
    }
}

