"""

[[sections]]
heading = "Pass ordering is part of the design"
body = """
<p>The first version applied everything in one bottom-up pass. <code>EXPLAIN</code> showed the failure:</p>

```text title="SELECT … FROM emp e LEFT JOIN dept d ON e.dept = d.id WHERE d.city = 'Pune' AND e.salary > 50 (single bottom-up pass)"
Projection [Col(1)]
  Filter (d.city = 'Pune') AND (e.salary > 50)        ← both stuck above the join
    NestedIndexJoin Left dept via dept_id key=Col(2)
      SeqScan emp                                      ← no filter: scans every employee
```

<p>Bottom-up processing had already turned the join into a <code>NestedIndexJoin</code> before the <code>Filter</code> above it was examined, and nothing knows how to push a filter through <em>that</em> node. The fix is two passes: <strong>top-down pushdown first</strong> (filters sink while joins are still plain <code>NestedLoopJoin</code>s), then <strong>bottom-up rewrites</strong> (merge, index, join algorithm, top-N). The rule applies to every rule engine: if rule B enables rule A's pattern, A must run before B, or the engine needs a fixpoint loop. Cascades-style optimizers (Part III) solve this in general by exploring all rewrites together.</p>

```text title="the same query after the fix"
Projection [Col(1)]
  Filter (d.city = 'Pune')                             ← stays above: right-side predicate over a LEFT join
    NestedIndexJoin Left dept via dept_id key=Col(2)
      SeqScan emp  filter=(salary > 50)                ← pushed into the scan
```

:::deeper The optimizer: pushdown pass, bottom-up rewrite pass, join selection, index selection
```rust title="src/optimizer/optimizer.rs"
//! Rule-based optimizer: each rule is a local rewrite; the driver applies them bottom-up.
//!   1. predicate pushdown (Filter through joins; ON conjuncts into join inputs)
//!   2. scan filter merge
//!   3. SeqScan + `col = const` / OR of them  ->  IndexScan (point lookups)
//!   4. NestedLoopJoin + equality  ->  NestedIndexJoin (inner side has an index) or HashJoin
//!   5. Limit over Sort  ->  TopN
use super::catalog::Catalog;
use super::expr::{BinOp, Expr};
use super::plan::{IndexLookup, Plan};
use super::simplify::simplify_filter;
use super::stats::{selectivity, JoinGraph};
use super::catalog::{Column, Schema};
use super::sql::JoinKind;
use crate::types::value::Value;

/// Two passes. Pass 1 (top-down) moves filters toward the leaves; it must run first, because pass 2
/// (bottom-up) turns joins into hash/index joins, and a Filter sitting above one of those can no longer
/// be pushed through it.
pub fn optimize(p: Plan, cat: &Catalog) -> Plan {
    let p = pushdown(simplify_plan(p));
    let p = if cat.reorder_joins { reorder(p, cat) } else { p };
    bottom_up(p, cat)
}

/// Expression rewriting: simplify every filter predicate; an impossible one replaces its subtree with an empty relation.
fn simplify_plan(p: Plan) -> Plan {
    let p = map_children(p, &mut simplify_plan);
    match p {
        Plan::Filter { pred, child } => {
            let pred = simplify_filter(pred);
            match &pred {
                Expr::Lit(Value::Bool(true)) => *child,
                Expr::Lit(Value::Bool(false) | Value::Null) => Plan::Values { rows: vec![], schema: child.schema() },
                _ => Plan::Filter { pred, child },
            }
        }
        Plan::NestedLoopJoin { left, right, pred: Some(pr), kind } => Plan::NestedLoopJoin { left, right, pred: Some(simplify_filter(pr)), kind },
        other => other,
    }
}

fn bottom_up(p: Plan, cat: &Catalog) -> Plan {
    let p = map_children(p, &mut |c| bottom_up(c, cat));
    rewrite(p, cat)
}

fn pushdown(p: Plan) -> Plan {
    match p {
        Plan::Filter { pred, child } => match *child {
            Plan::Filter { pred: inner, child } => pushdown(Plan::Filter { pred: and(Some(inner), pred), child }),
            Plan::NestedLoopJoin { left, right, pred: jp, kind } => {
                let l = left.schema().len();
                let (mut lf, mut rf, mut stay, mut both) = (vec![], vec![], vec![], vec![]);
                for c in pred.conjuncts() {
                    match (side(&c, l), kind) {
                        (Side::Left | Side::None, _) => lf.push(c),
                        (Side::Right, JoinKind::Inner) => rf.push(c.shift(-(l as isize))),
                        (Side::Both, JoinKind::Inner) => both.push(c),
                        _ => stay.push(c),                   // right-side filters above a LEFT join must stay above it
                    }
                }
                let wrap = |p: Plan, fs: Vec<Expr>| pushdown(match Expr::and_all(fs) { Some(f) => Plan::Filter { pred: f, child: Box::new(p) }, None => p });
                let (left, right) = (wrap(*left, lf), wrap(*right, rf));
                let jp = Expr::and_all(jp.into_iter().flat_map(|e| e.conjuncts()).chain(both).collect());
                let join = Plan::NestedLoopJoin { left: Box::new(left), right: Box::new(right), pred: jp, kind };
                match Expr::and_all(stay) { Some(f) => Plan::Filter { pred: f, child: Box::new(join) }, None => join }
            }
            other => Plan::Filter { pred, child: Box::new(pushdown(other)) },
        },
        other => map_children(other, &mut pushdown),
    }
}

fn map_children(p: Plan, f: &mut dyn FnMut(Plan) -> Plan) -> Plan {
    let mut b = |c: Box<Plan>| Box::new(f(*c));
    match p {
        Plan::Filter { pred, child } => Plan::Filter { pred, child: b(child) },
        Plan::Projection { exprs, schema, child } => Plan::Projection { exprs, schema, child: b(child) },
        Plan::NestedLoopJoin { left, right, pred, kind } => { let l = b(left); Plan::NestedLoopJoin { left: l, right: b(right), pred, kind } }
        Plan::HashJoin { left, right, left_keys, right_keys, residual, kind } => { let l = b(left); Plan::HashJoin { left: l, right: b(right), left_keys, right_keys, residual, kind } }
        Plan::NestedIndexJoin { left, table, index, key, inner_schema, residual, kind } => Plan::NestedIndexJoin { left: b(left), table, index, key, inner_schema, residual, kind },
        Plan::Aggregation { group_by, aggs, schema, child } => Plan::Aggregation { group_by, aggs, schema, child: b(child) },
        Plan::Window { calls, schema, child } => Plan::Window { calls, schema, child: b(child) },
        Plan::Sort { order_by, child } => Plan::Sort { order_by, child: b(child) },
        Plan::TopN { order_by, n, child } => Plan::TopN { order_by, n, child: b(child) },
        Plan::Limit { limit, offset, child } => Plan::Limit { limit, offset, child: b(child) },
        Plan::Insert { table, child } => Plan::Insert { table, child: b(child) },
        Plan::Update { table, sets, child } => Plan::Update { table, sets, child: b(child) },
        Plan::Delete { table, child } => Plan::Delete { table, child: b(child) },
        leaf => leaf,
    }
}

fn max_col(e: &Expr) -> Option<usize> { let mut v = vec![]; e.cols(&mut v); v.into_iter().max() }
fn min_col(e: &Expr) -> Option<usize> { let mut v = vec![]; e.cols(&mut v); v.into_iter().min() }
/// Which side(s) of a join with `l` left columns does this expression reference?
fn side(e: &Expr, l: usize) -> Side {
    match (min_col(e), max_col(e)) {
        (None, _) => Side::None,
        (Some(_), Some(mx)) if mx < l => Side::Left,
        (Some(mn), _) if mn >= l => Side::Right,
        _ => Side::Both,
    }
}
#[derive(PartialEq, Clone, Copy)]
enum Side { None, Left, Right, Both }

fn and(a: Option<Expr>, b: Expr) -> Expr { match a { Some(a) => Expr::Bin(BinOp::And, Box::new(a), Box::new(b)), None => b } }

fn rewrite(p: Plan, cat: &Catalog) -> Plan {
    match p {
        Plan::Filter { pred, child } => match *child {
            Plan::SeqScan { table, schema, filter } => try_index(Plan::SeqScan { table, schema, filter: Some(and(filter, pred)) }, cat),
            Plan::IndexScan { table, index, schema, lookup, filter } => Plan::IndexScan { table, index, schema, lookup, filter: Some(and(filter, pred)) },
            Plan::Filter { pred: inner, child } => rewrite(Plan::Filter { pred: and(Some(inner), pred), child }, cat),
            other => Plan::Filter { pred, child: Box::new(other) },
        },
        Plan::SeqScan { .. } => try_index(p, cat),
        Plan::NestedLoopJoin { left, right, pred, kind } => rewrite_join(*left, *right, pred, kind, cat),
        Plan::Limit { limit: Some(n), offset, child } => match *child {
            Plan::Sort { order_by, child } => Plan::Limit { limit: Some(n), offset, child: Box::new(Plan::TopN { order_by, n: n + offset, child }) },
            other => Plan::Limit { limit: Some(n), offset, child: Box::new(other) },
        },
        other => other,
    }
}

fn rewrite_join(left: Plan, right: Plan, pred: Option<Expr>, kind: JoinKind, cat: &Catalog) -> Plan {
    let l = left.schema().len();
    let conj: Vec<Expr> = pred.map(|p| p.conjuncts()).unwrap_or_default();
    let (mut lpush, mut rpush, mut keep) = (vec![], vec![], vec![]);
    for c in conj {
        match (side(&c, l), kind) {
            (Side::Left, JoinKind::Inner) => lpush.push(c),               // ON-clause filters on one side can move below an inner join
            (Side::Right, _) => rpush.push(c.shift(-(l as isize))),       // and right-only ones are safe below a LEFT join too
            _ => keep.push(c),
        }
    }
    let wrap = |p: Plan, fs: Vec<Expr>| match Expr::and_all(fs) { Some(f) => rewrite(Plan::Filter { pred: f, child: Box::new(p) }, cat), None => p };
    let (left, right) = (wrap(left, lpush), wrap(right, rpush));
    // Equi-keys: conjuncts `a = b` where a references only the left and b only the right (either order).
    let (mut lk, mut rk, mut rest) = (vec![], vec![], vec![]);
    for c in keep {
        if let Expr::Bin(BinOp::Eq, a, b) = &c {
            match (side(a, l), side(b, l)) {
                (Side::Left, Side::Right) => { lk.push((**a).clone()); rk.push(b.shift(-(l as isize))); continue; }
                (Side::Right, Side::Left) => { lk.push((**b).clone()); rk.push(a.shift(-(l as isize))); continue; }
                _ => {}
            }
        }
        rest.push(c);
    }
    if lk.is_empty() {
        return Plan::NestedLoopJoin { left: Box::new(left), right: Box::new(right), pred: Expr::and_all(rest), kind };
    }
    // Index nested-loop join: one key, inner side is a bare scan of a table indexed on that key column.
    if lk.len() == 1 {
        if let (Plan::SeqScan { table, schema, filter: None }, Expr::Col(j)) = (&right, &rk[0]) {
            if let Some(ix) = cat.indexes_on(table).find(|i| i.col == *j) {
                return Plan::NestedIndexJoin { left: Box::new(left), table: table.clone(), index: ix.name.clone(), key: lk.remove(0),
                    inner_schema: schema.clone(), residual: Expr::and_all(rest), kind };
            }
        }
    }
    Plan::HashJoin { left: Box::new(left), right: Box::new(right), left_keys: lk, right_keys: rk, residual: Expr::and_all(rest), kind }
}

fn points(e: &Expr) -> Option<(usize, Vec<i64>)> {
    match e {
        Expr::Bin(BinOp::Eq, a, b) => match (&**a, &**b) {
            (Expr::Col(i), Expr::Lit(Value::Int(k))) | (Expr::Lit(Value::Int(k)), Expr::Col(i)) => Some((*i, vec![*k])),
            _ => None,
        },
        Expr::Bin(BinOp::Or, a, b) => {
            let ((c1, mut k1), (c2, k2)) = (points(a)?, points(b)?);
            (c1 == c2).then(|| { k1.extend(k2); k1.sort_unstable(); k1.dedup(); (c1, k1) })
        }
        _ => None,
    }
}

fn try_index(p: Plan, cat: &Catalog) -> Plan {
    let Plan::SeqScan { table, schema, filter: Some(f) } = &p else { return p };
    let mut conj = f.clone().conjuncts();
    for pos in 0..conj.len() {
        let Some((col, keys)) = points(&conj[pos]) else { continue };
        let Some(ix) = cat.indexes_on(table).find(|i| i.col == col) else { continue };
        conj.remove(pos);
        return Plan::IndexScan { table: table.clone(), index: ix.name.clone(), schema: schema.clone(), lookup: IndexLookup::Points(keys), filter: Expr::and_all(conj) };
    }
    p
}
```
