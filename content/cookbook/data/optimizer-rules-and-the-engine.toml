heading = "Testing an optimizer"
body = """
<p>Three layers, from cheapest to strongest:</p>

<ol> <li><strong>Plan-shape tests</strong>: assert on <code>EXPLAIN</code> text. They pin down <em>which</em> rule fired (<code>IndexScan</code>, <code>NestedIndexJoin</code>, no <code>NestedLoopJoin</code>, a filter <em>below</em> the join). BusTub's <code>.slt</code> files do this with <code>query +ensure:index_scan</code>; the Rust test above uses substring checks. Brittle if overused, essential for the few rules that must fire.</li> <li><strong>Optimizer on vs off</strong>: every query must return the same multiset of rows with the optimizer enabled and disabled. It needs no reference database, and it catches every rewrite that changes semantics.</li> <li><strong>Differential fuzzing against SQLite</strong>: generate random queries over random tables with NULLs, run them through both engines, and compare as multisets.</li> </ol>

:::deeper The fuzzer: 480 random queries × optimizer on/off against SQLite
```rust title="tests/engine_fuzz.rs"
//! Random queries, run through Cairn-style engine (optimizer on and off) and the system SQLite.
use std::io::Write;
use std::process::{Command, Stdio};
use std::sync::Arc;
use relational::{buffer::{arc_replacer::ArcReplacer, buffer_pool_manager::BufferPoolManager}, storage::disk::disk_manager::{DiskManager, MemDiskManager}, engine::{expr::display, Engine}};

struct Rng(u64);
impl Rng {
    fn n(&mut self, m: u64) -> u64 { self.0 ^= self.0 << 13; self.0 ^= self.0 >> 7; self.0 ^= self.0 << 17; self.0 % m }
    fn pick<'a>(&mut self, xs: &[&'a str]) -> &'a str { xs[self.n(xs.len() as u64) as usize] }
}

fn lit(r: &mut Rng) -> String { if r.n(12) == 0 { "NULL".into() } else { r.n(8).to_string() } }

fn pred(r: &mut Rng, cols: &[&str]) -> String {
    let c = r.pick(cols);
    match r.n(9) {
        0 => format!("{c} = {}", lit(r)),
        1 => format!("{c} < {}", r.n(8)),
        2 => format!("{c} >= {}", r.n(8)),
        3 => format!("{c} IS NULL"),
        4 => format!("{c} IS NOT NULL"),
        5 => format!("{c} BETWEEN {} AND {}", r.n(4), 4 + r.n(4)),
        6 => format!("{c} IN ({}, {}, {})", lit(r), r.n(8), r.n(8)),
        7 => format!("NOT ({c} <> {})", r.n(8)),
        _ => format!("{c} + {} > {}", r.n(3), r.n(8)),
    }
}
fn where_clause(r: &mut Rng, cols: &[&str]) -> String {
    if r.n(4) == 0 { return String::new(); }
    let mut s = pred(r, cols);
    for _ in 0..r.n(3) { s = format!("{s} {} {}", r.pick(&["AND", "OR"]), pred(r, cols)); }
    format!(" WHERE {s}")
}

fn gen_query(r: &mut Rng) -> String {
    let a = ["a.x", "a.y", "a.k"];
    let all = ["a.x", "a.y", "a.k", "b.x", "b.y", "b.k"];
    match r.n(7) {
        0 => format!("SELECT x, y, k FROM a{}", where_clause(r, &["x", "y", "k"])),
        1 => format!("SELECT y, COUNT(*), COUNT(x), SUM(x), MIN(x), MAX(x), AVG(x) FROM a{} GROUP BY y", where_clause(r, &["x", "y", "k"])),
        2 => format!("SELECT a.k, b.k FROM a JOIN b ON a.x = b.x{}", where_clause(r, &all)),
        3 => format!("SELECT a.k, b.k FROM a LEFT JOIN b ON a.x = b.x{}", where_clause(r, &a)),
        4 => format!("SELECT a.k, b.k FROM a LEFT JOIN b ON a.x = b.x AND {}", pred(r, &["b.y", "b.k"])),
        5 => format!("SELECT a.k, b.k FROM a, b WHERE a.y = b.y AND {}", pred(r, &all)),
        _ => format!("SELECT a.y, COUNT(b.k), SUM(b.x) FROM a LEFT JOIN b ON a.k = b.k{} GROUP BY a.y HAVING COUNT(*) > {}", where_clause(r, &a), r.n(3)),
    }
}

fn setup(r: &mut Rng) -> String {
    let mut s = String::from("CREATE TABLE a(x INTEGER, y INTEGER, k INTEGER); CREATE TABLE b(x INTEGER, y INTEGER, k INTEGER);\\n");
    for t in ["a", "b"] {
        let rows: Vec<String> = (0..30).map(|i| format!("({}, {}, {})", lit(r), lit(r), if t == "a" { i } else { 100 + i })).collect();
        s += &format!("INSERT INTO {t} VALUES {};\\n", rows.join(","));
    }
    s
}

fn sqlite(sql: &str) -> Vec<String> {
    let mut c = Command::new("sqlite3").args(["-separator", "|", "-nullvalue", "NULL"]).stdin(Stdio::piped()).stdout(Stdio::piped()).stderr(Stdio::piped()).spawn().unwrap();
    c.stdin.take().unwrap().write_all(sql.as_bytes()).unwrap();
    let o = c.wait_with_output().unwrap();
    assert!(o.stderr.is_empty(), "sqlite: {}\\n{sql}", String::from_utf8_lossy(&o.stderr));
    String::from_utf8(o.stdout).unwrap().lines().map(|l| l.split('|').map(|f| match f.parse::<f64>() { Ok(x) if f.contains('.') => format!("{x:.6}"), _ => f.to_string() }).collect::<Vec<_>>().join("|")).collect()
}

#[test]
fn fuzz_against_sqlite() {
    let mut r = Rng(0x2545F4914F6CDD1D);
    let mut compared = 0;
    for round in 0..12 {
        let setup = setup(&mut r);
        let disk: Arc<dyn DiskManager> = Arc::new(MemDiskManager::default());
        let bpm = BufferPoolManager::new(128, disk, ArcReplacer::new(128), 2);
        let mut e = Engine::new(&bpm);
        e.execute(&setup).unwrap();
        if round % 2 == 1 { e.execute("CREATE INDEX a_k ON a(k); CREATE INDEX b_k ON b(k)").unwrap(); }   // exercises IndexScan / NestedIndexJoin
        for _ in 0..40 {
            let q = gen_query(&mut r);
            let mut want = sqlite(&format!("{setup}{q};"));
            want.sort();
            for opt in [true, false] {
                e.optimize = opt;
                let mut got: Vec<String> = e.query(&q).unwrap_or_else(|er| panic!("`{q}` (optimize={opt}): {er:?}")).iter()
                    .map(|row| row.iter().map(display).collect::<Vec<_>>().join("|"))
                    .map(|l| l.split('|').map(|f| match f.parse::<f64>() { Ok(x) if f.contains('.') => format!("{x:.6}"), _ => f.to_string() }).collect::<Vec<_>>().join("|")).collect();
                got.sort();
                assert_eq!(got, want, "round {round}, optimize={opt}\\nquery: {q}");
            }
            compared += 1;
        }
    }
    eprintln!("{compared} random queries × 2 optimizer settings match SQLite");
}
