[[sections]]
heading = "Measured"
body = """
<p>All times are wall-clock, single-threaded, in memory, on one laptop-class machine, best of 2–3 runs. The plan timings change by a few percent between runs; every conclusion below held in three complete runs, and ranges across the three runs are quoted where they matter. The tables are the third run.</p>

```text title="calibration: fitted prices and held-out operator accuracy"
fitted cost per event, nanoseconds (microbenchmarks of 660 operator runs)
  hash join   flat: build row 0.84, probe row 1.49, output row 1.26
              sized: small build (<32768 rows) build 0.69, probe 1.46; large build 0.81, probe 4.15; output 1.28
  sort-merge  n·log n (left) 0.56, n·log n (right) 0.55, merge row 1.50, output row 3.83
  index NL    outer row 0.00, outer·log2(inner) 2.76, output row 0.25
  block NL    comparison 0.24, output row 8.14
held-out operator predictions: relative error |pred - measured| / measured, median / p90
operator         calibrated (flat)   calibrated (+sizes)
hash join             28%     57%          17%     54%
sort-merge            12%     26%          12%     26%
index NL              18%     49%          18%     49%
block NL               4%     11%           4%     11%
```

<ul> <li><strong>The prices are the hardware, and some are surprising.</strong> A hash-table <em>probe</em> costs more per row (1.5 ns) than an insert (0.8 ns): this table is a chained one, so a probe follows <code>head → row → next</code> (two dependent loads) while an insert needs only the head. Sorting costs 0.55 ns per <code>n log n</code>. An index descent costs 2.8 ns per level, so one probe of a 100 000-row inner is about 45 ns, <strong>thirty hash probes</strong>.</li> <li><strong>Held-out operators are predicted to 4–28% (median)</strong>, with the 90th percentile at 11–57%: noisy micro-timings and cache effects the linear features cannot express. Splitting hash joins by build-table size (+ sizes) lowers the hash join error from 28% to 17% at the median, and shows the cache effect directly: <strong>probing a large table costs 4.2 ns per row against 1.5 ns for a small one</strong> (the large build prices are 0.8 and 4.2).</li> </ul>

```text title="the plan space"
36 random chain queries (tables of 2 000 to 120 000 rows), 40–55 plans each, every plan timed (best of 2 runs)
slowest plan / fastest plan: median 53.2x, p90 246.9x, max 479x
fastest plan uses: hash join in both joins 92% | an index NL somewhere 8% | sort-merge somewhere 0% | block NL somewhere 0% | ST joined first 61%
```

<ul> <li><strong>The plan space is wide</strong>: the slowest plan of a query is a median 53× (p90 247×, max 479×) slower than the fastest. Choosing is worth a lot.</li> <li><strong>Hash joins win nearly everywhere</strong>: the fastest plan uses hash joins for both joins in 92% of the queries and an index join in the other 8%; sort-merge and block nested-loop never win on these inputs. That matches the lecture's summary of Leis et al.: a hash-join-and-scan engine is robust.</li> </ul>

```text title="how well each model ranks plans and how slow its pick is (true cardinalities)"
cost models with TRUE cardinalities: how well they rank the plans, and how slow the plan they pick is (vs the fastest)
model                              Spearman |  median     p90      max | within 1.2x
C_out                                  0.19 |    1.84    2.78     4.05 |         0%
C_mm-style                             0.49 |    6.42   10.10    15.25 |         0%
textbook constants                     0.86 |    2.07    2.97     4.85 |         3%
calibrated (flat)                      0.97 |    1.00    1.31     1.60 |        89%
calibrated (+cache size classes)       0.97 |    1.00    1.42     2.19 |        78%
```

<ul> <li><strong><code>C_out</code> ranks plans barely better than chance (Spearman 0.19) but picks the right join order</strong>: its chosen plan has the same join order as the fastest plan in 89–97% of the queries (all five models do, in all three runs). This is why <code>C_out</code> is a sound objective for the <em>join-order</em> search of <a href="/cookbook/p/join-ordering">Q4</a>. It cannot tell algorithms apart, so every hash-join variant ties and the first one wins: it never picks the fastest plan (0%), and the plan it picks is a median <strong>1.8–2.0× slower</strong>.</li> <li><strong>Textbook constants rank well (0.85–0.86) and pick poorly</strong>: the picked plan is a median 2.1–2.2× slower, within 1.2× of the best in 3–6% of the queries. It does choose hash joins everywhere (right), but it is the <strong>build side</strong> it gets wrong, below.</li> <li><strong>A C_mm-style model with λ = 2 is the worst of all (6.3–6.6×)</strong> and picks the index join in 100% of the queries. Its λ says an index probe costs two hash-join rows; the measured cost here is about thirty. See the sweep below.</li> <li><strong>The calibrated model picks the fastest plan's speed in the median query (1.00×), is within 1.2× of the best in 86–92% of queries, and its worst case is 1.44–1.60×.</strong> It picks exactly the fastest plan in 61–69% of the queries. Rank correlation is 0.97.</li> <li><strong>More features did not help the plan choice here</strong>: the cache-size-class model has the same median and better operator accuracy, but its tail is worse in every run (p90 1.37–1.42, max 2.2–2.8 against 1.17–1.31 and 1.44–1.60). One plausible reason is that two coefficients fit on a third of the samples each extrapolate worse; we did not investigate further. Add features when they fix a decision, not an error.</li> </ul>

```text title="what each model picks, and the build side"
what each model picks (share of the 36 queries), against the fastest plan
model                              hash/hash index NL   merge   block  ST first  same order   same plan
C_out                                   100%       0%      0%      0%       58%         97%          0%
C_mm-style                                0%     100%      0%      0%       58%         97%          0%
textbook constants                      100%       0%      0%      0%       58%         97%          3%
calibrated (flat)                        89%      11%      0%      0%       58%         97%         67%
calibrated (+cache size classes)         89%      11%      0%      0%       56%         89%         53%
build side of the first hash join (share of queries where the model builds on the LARGER input; fastest plan for comparison)
  fastest plan: 81%
  C_out                             61%
  C_mm-style                        0%
  textbook constants                0%
  calibrated (flat)                 100%
  calibrated (+cache size classes)  94%
```

<p><strong>The build side is a measured fact, not a rule.</strong> Textbook wisdom says build the hash table on the smaller input; the textbook-constants model does exactly that (it builds on the larger input in 0% of the first hash joins) and is wrong: in this implementation the fastest plan builds on the <strong>larger</strong> input in 75–81% of its hash joins, because a probe costs more than an insert. A hash table with keys stored in the slot (open addressing) would shift the balance; a compressed or radix-partitioned one would shift it again. The calibrated model learns the right side (100%) from its own microbenchmarks.</p>

```text title="the price of an index probe (C_mm-style lambda)"
C_mm-style cost of an index probe (lambda, in units of one hash-join row): the right value depends on the index structure
model                              Spearman |  median     p90      max | within 1.2x
C_mm-style, lambda = 1                 0.09 |    6.43   10.64    15.25 |         0%
C_mm-style, lambda = 2                 0.49 |    6.42   10.10    15.25 |         0%
C_mm-style, lambda = 8                 0.79 |    1.92    4.56     5.40 |         6%
C_mm-style, lambda = 32                0.80 |    1.60    2.51     2.78 |         8%
C_mm-style, lambda = 128               0.79 |    1.60    2.69     3.61 |         3%
```

<p>One constant decides whether the model is useful: from λ = 1 to 128 the median slowdown goes 6.4×, 6.4×, 1.9×, 1.6×, 1.6× and rank correlation from 0.09 to 0.80. The right value (about 30 here) follows from the index's structure (a binary search over a sorted array); a hash index would call for a much smaller one, a B+tree on cold pages for a larger one. <strong>A model's constants describe a particular index and a particular machine.</strong></p>

```text title="how much calibration is enough"
how much calibration is enough: runs per operator type used to fit the flat model
model                              Spearman |  median     p90      max | within 1.2x
calibrated with 4 runs per operator     0.98 |    1.00    1.12     1.60 |        92%
calibrated with 8 runs per operator     0.98 |    1.00    1.12     1.60 |        92%
calibrated with 16 runs per operator     0.97 |    1.00    1.12     1.60 |        92%
calibrated with 32 runs per operator     0.97 |    1.00    1.31     1.60 |        89%
calibrated with 110 runs per operator     0.97 |    1.00    1.31     1.60 |        89%
```

<p><strong>Calibration is cheap.</strong> Four timed runs per operator type already give the same plan quality as 110 (median 1.00, p90 1.12–1.32 across runs), because the decisions are driven by constant-factor differences of 10–50× between algorithms, not by getting each price to 5%.</p>

```text title="chosen plan's slowdown under cardinality noise"
slowdown of the chosen plan when every intermediate cardinality is multiplied by exp(sigma * N(0,1)) (median / p90 / max, share within 1.2x)
model                                            sigma = 0                              sigma = 0.5                              sigma = 1                               sigma = 2                
C_out                                1.84    2.78     4.05      0%         1.88    2.78     4.05      0%         1.92    2.96     4.97      0%         2.13    3.00     5.10      0%      
C_mm-style                           6.42   10.10    15.25      0%         6.31   10.64    23.54      0%         6.31   10.84    35.54      0%         6.31   12.61    37.92      0%      
textbook constants                   2.07    2.97     4.85      3%         2.07    2.97     4.85      4%         2.18    3.16     4.97      4%         2.29    3.26     5.42      4%      
calibrated (flat)                    1.00    1.31     1.60     89%         1.00    1.34     3.00     84%         1.00    1.98     6.27     69%         1.31    4.29    32.92     46%      
calibrated (+cache size classes)     1.00    1.42     2.19     78%         1.00    1.51     6.27     74%         1.04    2.20     6.27     62%         1.36    4.29    32.92     41%      
```

<ul> <li><strong>Uncalibrated models are insensitive to noise because they are already wrong</strong>: <code>C_out</code> goes from a median 1.84× to 2.13× as σ grows to 2, the textbook model from 2.07× to 2.29×, <code>C_mm</code> stays near 6.3×. Their errors are structural, not driven by the cardinalities.</li> <li><strong>The calibrated model degrades smoothly and then sharply.</strong> Multiplying each intermediate cardinality by <code>exp(σ·N(0,1))</code> (σ = 0.5 is a typical 1.4× error, σ = 1 a typical 2×, σ = 2 a typical 4×): at σ = 0.5 it is within 1.2× in 84% of queries (max 3.0); at σ = 1 in 69% (p90 2.0, max 6.3); at σ = 2 only 46% and the tail is long (p90 4.3, max 33).</li> <li><strong>A good model with moderate estimation error beats a bad model with perfect estimates, but only up to a point.</strong> The textbook model with <em>exact</em> cardinalities has median 2.1× and p90 3.0×. The calibrated model with σ = 1 noise has median 1.00× and p90 2.0×: better. With σ = 2 noise its p90 is 4.3× — worse. This is the useful reading of "improve the cardinality estimates instead of the model": cardinality errors with q-error up to about 2–3× are tolerable if the model is right about the machine; errors of 4× and up, which <a href="/cookbook/p/cardinality-estimation">Q8</a> shows are routine after two or three joins, are not, whatever the model.</li> </ul>
"""

[[sections]]
heading = "Calibration"
body = """
<p>The procedure used above, which is also the one to ship:</p>

<ol> <li><strong>List the primitives</strong> your executor has: each join algorithm and build side, scans (sequential, index), sorts, aggregations (hash, sort), exchanges, spills. A primitive is anything whose time is not a constant multiple of another's.</li> <li><strong>Choose events (features) per primitive</strong> from its algorithm: rows in, rows out, <code>n log n</code>, probes × depth. Add a feature only when a decision depends on it.</li> <li><strong>Generate inputs</strong> over the size and selectivity ranges the optimizer will see (log-uniform sizes, output sizes from 0.1× to 10× of the inputs) and time each primitive in isolation, warm, taking the best of a few runs (the minimum is the noise floor).</li> <li><strong>Fit non-negative prices</strong> by NNLS with each row divided by its measured time, so the fit minimizes <em>relative</em> error (a 5 ms operator should not outweigh a 50 µs one by 100×). Non-negativity matters: a negative price makes bigger inputs cheaper.</li> <li><strong>Validate on held-out operators</strong> (error per primitive) and, more importantly, <strong>on plans</strong>: rank correlation and the slowdown of the chosen plan against the fastest, as above.</li> <li><strong>Store the prices in the catalog</strong> with the hardware identity and a version, re-run on new hardware, and treat a drift in a price as an alert (a kernel upgrade, a noisy neighbor, a changed allocator).</li> </ol>

<aside data-call="note"><b>The minimum, not the mean</b><p>For calibration use the <strong>minimum</strong> of a few runs: it estimates the cost of the work itself, free of scheduler noise. For <em>validation</em> against real query workloads, report the full distribution, since the optimizer must perform in the noisy world.</p></aside>
"""

[[sections]]
heading = "What this model leaves out"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>omitted</th> <th>consequence</th> <th>how production systems add it</th> </tr> </thead> <tbody> <tr> <td>parallelism</td> <td>the best plan at 8 threads differs from the best at 1 (hash joins scale, sorts less)</td> <td>cost per thread plus an exchange cost, divide by an efficiency factor (<a href="/cookbook/p/parallel-execution">L14</a>)</td> </tr> <tr> <td>memory limits</td> <td>a hash table bigger than its grant spills and a plan's cost jumps by an I/O multiple</td> <td>piecewise cost with a spill branch (Grace/hybrid hash)</td> </tr> <tr> <td>pipelining</td> <td>a blocking operator (build, sort) delays the first row; <code>LIMIT</code> and <code>EXISTS</code> care</td> <td>a <code>(startup, total)</code> cost pair per plan, compared lexicographically or by fraction fetched</td> </tr> <tr> <td>interesting orders</td> <td>an input already sorted by the join key makes sort-merge nearly free</td> <td>the memo keeps the best plan per (relation set, order) (<a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>)</td> </tr> <tr> <td>caching</td> <td>repeated accesses to a hot index cost memory, not I/O</td> <td>an <code>effective_cache_size</code>-style parameter, or measured hit rates</td> </tr> <tr> <td>concurrency</td> <td>other queries steal cache, bandwidth and memory</td> <td>ignored, or a utilization parameter</td> </tr> <tr> <td>variance</td> <td>the plan with the best expected cost may have a terrible worst case</td> <td>robust plan selection, runtime adaptation (<a href="/cookbook/p/adaptive-and-robust">Q10</a>)</td> </tr> </tbody> </table></div>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>One trait, five models</strong>: <code>CostModel::op(alg, nl, nr, nout)</code> is the only required method; <code>plan()</code> is a default method that sums two operators. A <code>Vec&lt;Box&lt;dyn CostModel&gt;&gt;</code> makes the comparison a loop, and the calibrated models are just data (<code>coef: [Vec&lt;f64&gt;; 4]</code>).</li> <li><strong>Features as <code>Vec&lt;f64&gt;</code></strong> keep the cost formula and the fit in one place: the model multiplies <code>features(...)</code> by <code>coef</code>, the calibration builds a matrix of <code>features(...)</code> rows. Changing a feature definition changes both together, so they cannot drift apart.</li> <li><strong>A flat chained hash table</strong> (<code>head: Vec&lt;u32&gt;</code>, <code>next: Vec&lt;u32&gt;</code>, rows borrowed as <code>&amp;'a [Row]</code>) has no per-bucket allocation, borrows the build side instead of copying it, and probes with a closure <code>impl FnMut(Row)</code>, which the compiler monomorphizes and inlines. Multiplying by an odd constant and keeping the high bits (<code>(k * 0x9E3779B1) &gt;&gt; shift</code>) is the fast multiplicative hash for 32-bit keys.</li> <li><strong><code>slice::partition_point</code></strong> is the index: two calls delimit the run of equal keys, with no hand-written binary search.</li> <li><strong>Sort by key with <code>sort_unstable_by_key</code></strong>: stability buys nothing for a join, and the unstable sort is faster; duplicate groups are delimited by <code>partition_point</code> again.</li> <li><strong>Coordinate descent for NNLS</strong> is ten lines and converges for the handful of coefficients here (columns normalized first so the step is well scaled); for hundreds of features use Lawson–Hanson or a projected gradient method.</li> <li><strong><code>Instant</code> and the minimum of several runs</strong>: <code>(0..reps).map(|_| run()).fold(f64::INFINITY, f64::min)</code> is the idiom for the least noisy time; run benchmark tests with <code>cargo test --release</code>, since a debug build changes the <em>relative</em> prices of operators.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Operators against the definition</strong>: all six join algorithms, both output orientations, on empty inputs, single rows, one key with many duplicates, low- and high-selectivity random inputs, compared with a double-loop reference (as sorted multisets).</li> <li><strong>Plan space</strong>: every plan of random chains returns exactly the true final cardinality; the first-join and second-join <code>(nl, nr, nout)</code> shapes the cost models see match the sizes of the joins actually executed, for both join orders.</li> <li><strong>Features</strong>: the hash-join features for "build left" equal those for "build right with the inputs swapped" (with and without size classes); the index-join features and the models' costs are symmetric under the same swap.</li> <li><strong>Calibration</strong>: build a synthetic machine with known exact prices, generate operator samples from it, fit, and require that the fit reproduces every sample to 0.1%.</li> <li><strong>NNLS and ranking</strong>: recovers known coefficients to 1e-6; clamps a negative true coefficient to zero; Spearman is exactly ±1 on monotone data and handles ties by average ranks.</li> <li><strong>Mutants run against these tests</strong>: forget to swap build and probe in the build-right features (killed); give the ST-first plan the wrong intermediate size (killed); collapse duplicate-key groups in sort-merge (killed); price the left-indexed nested loop with the right-indexed formula (killed); drop the key check in the hash chain (killed). One mutant (use <code>&lt;=</code> instead of <code>==</code> in the index range end) is equivalent: all rows after the start already have keys at least <code>k</code>.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong>: costs in arbitrary units anchored by <code>seq_page_cost = 1.0</code>; defaults <code>random_page_cost = 4.0</code>, <code>cpu_tuple_cost = 0.01</code>, <code>cpu_index_tuple_cost = 0.005</code>, <code>cpu_operator_cost = 0.0025</code>, <code>parallel_tuple_cost = 0.1</code>; <code>effective_cache_size</code> tells the planner how much of the data to expect in cache; every plan carries a <strong>startup cost and a total cost</strong>. The constants are for a spinning disk; on SSD the usual advice is to lower <code>random_page_cost</code> to about 1.1. The cost formulas live in <code>src/backend/optimizer/path/costsize.c</code>.</li> <li><strong>MySQL</strong>: costs come from tables (<code>mysql.server_cost</code>, <code>mysql.engine_cost</code>) holding per-operation constants such as the cost of evaluating a row condition or reading a block from memory or disk, which an administrator can change.</li> <li><strong>Oracle</strong>: <em>system statistics</em> (<code>DBMS_STATS.GATHER_SYSTEM_STATS</code>) measure single- and multi-block read times and CPU speed on the actual machine and feed the CPU-aware cost model: calibration as a command.</li> <li><strong>IBM Db2</strong>: hardware, storage and network characteristics in the catalog, measured by microbenchmarks (the lecture's example).</li> <li><strong>SQL Server</strong>: the cost unit is commonly described as originating from an estimated duration on a fixed reference machine, and it is not calibrated per installation; adaptive features (adaptive joins, memory-grant feedback) correct at run time what the model gets wrong.</li> <li><strong>DuckDB, HyPer, Umbra</strong>: join ordering is driven mainly by (estimated) cardinalities, a <code>C_out</code>-like objective, because a vectorized or compiled hash-join engine makes the algorithm choice almost uniform; this is consistent with the measurement that <code>C_out</code> picks the right join order here.</li> <li><strong>Learned cost models</strong> (cost from plan features with a neural or tree model, trained on executed plans) are active research and appear in some cloud systems; surveys such as Siddiqui et al. (SIGMOD 2020) report that they help most when the training workload repeats and that they struggle with new operators and data.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Constants from another era.</strong> <code>random_page_cost = 4</code> on NVMe or in-memory data makes index scans look four times more expensive than they are. Re-measure when the storage changes, and keep the constants per tablespace or device.</li> <li><strong>A tie is a decision.</strong> <code>C_out</code> cannot separate algorithms, so the plan it returns among ties is whichever the enumerator saw first: here, always the same (wrong) build side. Break ties with a secondary cost, never by enumeration order.</li> <li><strong>Costs have different units in different places.</strong> Rows, pages, nanoseconds and "units" must never be added without a conversion; keep the unit in the type or the variable name.</li> <li><strong>Non-linearities hide in the tails.</strong> A hash table that fits in cache and one that does not differ 3× per probe; a spilling hash join is 10× slower. A linear model fits the middle and mis-ranks the extremes: use piecewise features where decisions flip.</li> <li><strong>Model what you execute.</strong> The textbook model assumed a disk-era "build the smaller input" and the measured implementation builds the larger one; a vectorized engine, a compiled one and a row-at-a-time one each need their own prices.</li> <li><strong>Do not calibrate on the benchmark and report on the benchmark.</strong> Fit on microbenchmarks (single operators, random inputs) and validate on whole plans of a different generator, as here.</li> <li><strong>Extrapolation.</strong> Prices fitted on 300–300 000 rows say nothing about 300 million; check that the optimizer's plans stay inside the calibrated ranges or recalibrate at scale.</li> <li><strong>Ranking is not accuracy.</strong> A model with Spearman 0.86 (textbook constants) still picked a 2× slower plan in most queries, because the mistakes were in the <em>top</em> of the ranking where it matters; evaluate the chosen plan, not the average rank.</li> <li><strong>Compare the right baselines.</strong> A cost model must be judged with <em>true</em> cardinalities first (as here), so that cost errors and cardinality errors are not blamed on each other.</li> </ul></aside>
"""

