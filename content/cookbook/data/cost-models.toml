[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A cost model turns a plan plus cardinalities into one comparable number.</strong> It estimates the cost of running a plan against the <em>current</em> state of the database; the number is only meaningful internally (to rank alternatives) and is independent of the search strategy that proposed the plans. It consumes the output sizes from <a href="/cookbook/p/statistics">Q7</a> and <a href="/cookbook/p/cardinality-estimation">Q8</a> and produces the thing <a href="/cookbook/p/optimizer-architectures">Q1</a>'s enumerators minimize.</li> <li><strong>Three kinds of cost, in increasing detail.</strong> <em>Logical</em> costs are result sizes per operator, independent of the algorithm (<code>C_out</code> is the sum of intermediate sizes). <em>Algorithmic</em> costs add the complexity of the algorithm implementing each operator (n log n for a sort, one probe per outer row for an index join). <em>Physical</em> costs predict CPU cycles, I/O, cache misses and memory use; they are the most accurate and depend on the hardware.</li> <li><strong>Cost = events × price.</strong> Every practical model is a sum over operators of (count of some event) × (cost of that event): tuples hashed, pages read, comparisons made. The <em>events</em> come from the algorithm and the cardinalities; the <em>prices</em> are constants. Most of the engineering is in the prices.</li> <li><strong>Where the prices come from decides the model.</strong> PostgreSQL uses fixed weights tuned for a disk-resident database (the lecture's summary: processing a tuple in memory is 400× cheaper than reading one from disk, sequential I/O 4× cheaper than random). DB2 stores hardware, storage, network and memory characteristics, measured by microbenchmarks, in the catalog. <strong>Smallbase</strong> automates it in two phases: enumerate the <em>execution primitives</em> (evaluate a predicate, probe an index, sort), then <strong>microbenchmark them at start-up</strong> and plug the measurements into formulas of the table sizes. DuckDB, which may see a file for the first time, has no statistics to rely on: it falls back to distinct counts for worst-case join sizes and to a magic 20% selectivity when it has no HyperLogLog.</li> <li><strong>The classic result and its limit.</strong> Leis et al. found that all optimizers they tested (on the IMDB-based Join Order Benchmark) show serious underestimation, that a good join order matters more than a fast engine, that <strong>hash joins plus sequential scans are a robust execution model</strong> (more indexes make plans brittle), and that "working on accurate cost models is a waste of time; improve cardinality estimation instead". The measurements below show <em>when</em> that holds: once the model is not wrong about the machine. A model that is wrong about it (a disk-era constant, an index cost of the wrong order of magnitude) loses a factor of 2–7 with <strong>perfect</strong> cardinalities.</li> <li><strong>What a model leaves out is part of its definition.</strong> Parallelism and thread scaling, pipelining versus materialization, memory limits and spilling, buffer-pool hit rates, sort order reuse (interesting orders), startup versus total cost for <code>LIMIT</code>, concurrent queries, and variance. Each can be added as features; none is free.</li> </ul>
"""

[[sections]]
heading = "Anatomy"
body = """
<p>For each operator, the algorithm fixes <em>which events happen</em>, and the cardinalities fix <em>how many</em>. The lab's six joins, with the events a model counts (<code>nl</code>, <code>nr</code> = input sizes, <code>nout</code> = output size):</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>algorithm</th> <th>events</th> <th>notes</th> </tr> </thead> <tbody> <tr> <td>hash join, build left (or right)</td> <td><code>build</code> rows inserted, <code>probe</code> rows looked up, <code>nout</code> rows emitted</td> <td>the build side is a <em>choice</em>: the model must price it, see below</td> </tr> <tr> <td>sort-merge join</td> <td><code>nl log nl</code> + <code>nr log nr</code> comparisons to sort, <code>nl + nr</code> merged, <code>nout</code> emitted</td> <td>sort cost vanishes if an input is already ordered</td> </tr> <tr> <td>index nested-loop join</td> <td>one index descent per outer row (<code>log</code> of the inner size) and <code>nout</code> emitted</td> <td>outer must be the non-indexed side; the inner must be a base table</td> </tr> <tr> <td>block nested-loop join</td> <td><code>nl · nr</code> comparisons, <code>nout</code> emitted</td> <td>only competitive on tiny inputs</td> </tr> </tbody> </table></div>

<p>On top of the events, a <em>disk</em> model counts pages (the join cost formulas of <a href="/cookbook/p/join-algorithms">L12</a>: nested loop, block nested loop, sort-merge, Grace hash join) and adds CPU terms; an <em>in-memory</em> model counts rows and cache misses; a <em>distributed</em> model adds bytes shipped; a <em>cloud warehouse</em> model may count bytes scanned. The structure is always the same: <strong>features</strong> (counts) times <strong>coefficients</strong> (prices).</p>
"""

[[sections]]
heading = "The lab"
body = """
<p>One module (below) with:</p>

<ol> <li><strong>Six join operators</strong> on <code>(key, payload)</code> rows: hash join (flat chained table: <code>head[]</code>, <code>next[]</code>, build on either side), sort-merge, index nested-loop (a sorted array with binary search as the "index", on either side), and block nested-loop. A reference implementation by definition (a double loop) validates all of them.</li> <li><strong>A three-table chain</strong> <code>R(a,p) ⋈ S(a,b) ⋈ T(b,q)</code> with controllable sizes and join selectivities, whose <strong>true</strong> cardinalities are computed exactly. Every join order (RS first or ST first) × every algorithm for each join is a <strong>plan</strong>: 40 to 55 plans per query once the invalid ones (an index on an intermediate result) and the hopeless ones (a block nested loop on two big inputs) are removed.</li> <li><strong>Five cost models</strong>, all fed the same true cardinalities: <code>C_out</code>; a <strong>C_mm-style</strong> model after Leis et al.; a <strong>textbook constants</strong> model (CPU cost per tuple 0.01, per operator 0.0025, each index probe a random page read of 4.0); and two <strong>calibrated</strong> models whose per-event prices are fitted by <strong>non-negative least squares</strong> to microbenchmarks of single operators (660 timed runs), one with extra features that split hash joins by whether the build table exceeds 32 768 rows (cache-size classes).</li> <li><strong>A runner</strong> that times every plan of 36 random queries (tables of 2 000 to 120 000 rows) and scores each model by rank correlation and by the <strong>slowdown of the plan it picks</strong> relative to the fastest plan.</li> </ol>

:::deeper Reference: join operators, chain generator and plan space, event features, five cost models, NNLS calibration, Spearman
```rust title="src/opt/cost.rs"
//! Cost-model lab. Six physical join algorithms over (key, payload) rows, a three-table chain `R(a,p) ⋈ S(a,b) ⋈ T(b,q)`
//! with every join order x algorithm combination as a plan, and several cost models that predict plan run time from
//! cardinalities: C_out, a C_mm-style model, a textbook-constants model, and models whose per-event costs are
//! *calibrated* by non-negative least squares on operator microbenchmarks.
use std::time::Instant;
use crate::joinorder::Rng;

pub type Row = (u32, u32);

// ----------------------------------------------------------------------------------------------- operators

#[derive(Clone, Copy, PartialEq, Eq, Debug, Hash)]
pub enum Alg { HashBuildL, HashBuildR, SortMerge, IndexNlR, IndexNlL, Bnl }
pub const ALGS: [Alg; 6] = [Alg::HashBuildL, Alg::HashBuildR, Alg::SortMerge, Alg::IndexNlR, Alg::IndexNlL, Alg::Bnl];

/// Which two payload columns the join emits: `RL` = (r.1, l.1), `LR` = (l.1, r.1). The emitted first column is the
/// next join's key.
#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Out { RL, LR }
#[inline] fn emit(o: Out, l: Row, r: Row) -> Row { match o { Out::RL => (r.1, l.1), Out::LR => (l.1, r.1) } }

/// A sorted copy with binary-search lookups: the stand-in for a B-tree index on a base table (built once, outside the timed region).
pub struct Index { pub rows: Vec<Row> }
impl Index {
    pub fn new(rows: &[Row]) -> Self { let mut v = rows.to_vec(); v.sort_unstable(); Index { rows: v } }
    fn range(&self, k: u32) -> &[Row] {
        let lo = self.rows.partition_point(|r| r.0 < k);
        let hi = lo + self.rows[lo..].partition_point(|r| r.0 == k);
        &self.rows[lo..hi]
    }
}

/// Chained hash table in three flat arrays (no per-bucket allocation): `head[h]` is the newest row with hash `h`, `next` links the rest.
struct HashTable<'a> { rows: &'a [Row], head: Vec<u32>, next: Vec<u32>, shift: u32 }
impl<'a> HashTable<'a> {
    fn build(rows: &'a [Row]) -> Self {
        let bits = (rows.len().max(1) * 2).next_power_of_two().trailing_zeros().max(1);
        let shift = 32 - bits;
        let mut head = vec![u32::MAX; 1 << bits];
        let mut next = vec![u32::MAX; rows.len()];
        for (i, r) in rows.iter().enumerate() {
            let h = (r.0.wrapping_mul(0x9E37_79B1) >> shift) as usize;
            next[i] = head[h];
            head[h] = i as u32;
        }
        HashTable { rows, head, next, shift }
    }
    #[inline] fn probe(&self, k: u32, mut f: impl FnMut(Row)) {
        let mut i = self.head[(k.wrapping_mul(0x9E37_79B1) >> self.shift) as usize];
        while i != u32::MAX {
            let r = self.rows[i as usize];
            if r.0 == k { f(r); }
            i = self.next[i as usize];
        }
    }
}

/// Equi-join on the first column. `idx_l` / `idx_r` are the indexes of the inputs when they are base tables.
pub fn join(l: &[Row], r: &[Row], alg: Alg, out: Out, idx_l: Option<&Index>, idx_r: Option<&Index>) -> Vec<Row> {
    let mut res = Vec::new();
    match alg {
        Alg::HashBuildL => {
            let ht = HashTable::build(l);
            for &y in r { ht.probe(y.0, |x| res.push(emit(out, x, y))); }
        }
        Alg::HashBuildR => {
            let ht = HashTable::build(r);
            for &x in l { ht.probe(x.0, |y| res.push(emit(out, x, y))); }
        }
        Alg::SortMerge => {
            let (mut a, mut b) = (l.to_vec(), r.to_vec());
            a.sort_unstable_by_key(|x| x.0);
            b.sort_unstable_by_key(|x| x.0);
            let (mut i, mut j) = (0, 0);
            while i < a.len() && j < b.len() {
                if a[i].0 < b[j].0 { i += 1; } else if a[i].0 > b[j].0 { j += 1; } else {
                    let k = a[i].0;
                    let (ie, je) = (i + a[i..].partition_point(|x| x.0 == k), j + b[j..].partition_point(|x| x.0 == k));
                    for x in &a[i..ie] { for y in &b[j..je] { res.push(emit(out, *x, *y)); } }
                    i = ie; j = je;
                }
            }
        }
        Alg::IndexNlR => { let ix = idx_r.expect("index on the right input"); for &x in l { for &y in ix.range(x.0) { res.push(emit(out, x, y)); } } }
        Alg::IndexNlL => { let ix = idx_l.expect("index on the left input"); for &y in r { for &x in ix.range(y.0) { res.push(emit(out, x, y)); } } }
        Alg::Bnl => {
            for block in l.chunks(1024) {
                for &y in r { for &x in block { if x.0 == y.0 { res.push(emit(out, x, y)); } } }
            }
        }
    }
    res
}

// ----------------------------------------------------------------------------------------------- the workload

pub struct Chain {
    pub r: Vec<Row>,       // (a, p)
    pub s_ab: Vec<Row>,    // (a, b)
    pub s_ba: Vec<Row>,    // (b, a)
    pub t: Vec<Row>,       // (b, q)
    pub ix_r: Index, pub ix_s_ab: Index, pub ix_s_ba: Index, pub ix_t: Index,
    /// true cardinalities: |R⋈S|, |S⋈T|, |R⋈S⋈T|
    pub card_rs: f64, pub card_st: f64, pub card_rst: f64,
}

fn counts(rows: &[Row], dom: usize) -> Vec<u64> { let mut c = vec![0u64; dom]; for r in rows { c[r.0 as usize] += 1; } c }

impl Chain {
    /// Sizes `nr, ns, nt`; `da` and `db` are the key domains (a join of `x` and `y` rows over domain `d` yields about `x·y/d` rows).
    pub fn generate(rng: &mut Rng, nr: usize, ns: usize, nt: usize, da: usize, db: usize) -> Chain {
        let r: Vec<Row> = (0..nr).map(|i| (rng.next(da as u64) as u32, i as u32)).collect();
        let s_ab: Vec<Row> = (0..ns).map(|_| (rng.next(da as u64) as u32, rng.next(db as u64) as u32)).collect();
        let t: Vec<Row> = (0..nt).map(|i| (rng.next(db as u64) as u32, i as u32)).collect();
        let s_ba: Vec<Row> = s_ab.iter().map(|&(a, b)| (b, a)).collect();
        let (cr, ct) = (counts(&r, da), counts(&t, db));
        let cs_a = counts(&s_ab, da);
        let cs_b = counts(&s_ba, db);
        let card_rs = (0..da).map(|k| (cr[k] * cs_a[k]) as f64).sum();
        let card_st = (0..db).map(|k| (cs_b[k] * ct[k]) as f64).sum();
        let card_rst = s_ab.iter().map(|&(a, b)| (cr[a as usize] * ct[b as usize]) as f64).sum();
        Chain { ix_r: Index::new(&r), ix_s_ab: Index::new(&s_ab), ix_s_ba: Index::new(&s_ba), ix_t: Index::new(&t), r, s_ab, s_ba, t, card_rs, card_st, card_rst }
    }
    pub fn sizes(&self) -> (f64, f64, f64) { (self.r.len() as f64, self.s_ab.len() as f64, self.t.len() as f64) }
}

/// First join RS (then T) or ST (then R), and an algorithm for each join. The second join has the intermediate on the left and
/// the base table on the right, so only `IndexNlR` (outer = intermediate) and the non-index algorithms are valid there.
#[derive(Clone, Copy, Debug, PartialEq)]
pub struct Plan { pub st_first: bool, pub a1: Alg, pub a2: Alg }

pub fn plans(c: &Chain) -> Vec<Plan> {
    let (nr, ns, nt) = c.sizes();
    let mut v = Vec::new();
    for st_first in [false, true] {
        let (n1l, n1r, n2r) = if st_first { (ns, nt, nr) } else { (nr, ns, nt) };
        let mid = if st_first { c.card_st } else { c.card_rs };
        for a1 in ALGS {
            if a1 == Alg::Bnl && n1l * n1r > 3e7 { continue; }
            for a2 in [Alg::HashBuildL, Alg::HashBuildR, Alg::SortMerge, Alg::IndexNlR, Alg::Bnl] {
                if a2 == Alg::Bnl && mid * n2r > 3e7 { continue; }
                v.push(Plan { st_first, a1, a2 });
            }
        }
    }
    v
}

/// Per-join (nl, nr, nout) of a plan from the table sizes and the three intermediate cardinalities `[|R⋈S|, |S⋈T|, |R⋈S⋈T|]`
/// (true values, or estimates).
pub fn shapes_of(sizes: (f64, f64, f64), p: &Plan, cards: &[f64; 3]) -> [(f64, f64, f64); 2] {
    let (nr, ns, nt) = sizes;
    if p.st_first { [(ns, nt, cards[1]), (cards[1], nr, cards[2])] } else { [(nr, ns, cards[0]), (cards[0], nt, cards[2])] }
}
pub fn plan_shapes(c: &Chain, p: &Plan, cards: &[f64; 3]) -> [(f64, f64, f64); 2] { shapes_of(c.sizes(), p, cards) }

/// Run a plan; returns (seconds, number of result rows).
pub fn execute(c: &Chain, p: &Plan) -> (f64, usize) {
    let t0 = Instant::now();
    let n = if p.st_first {
        let x = join(&c.s_ba, &c.t, p.a1, Out::LR, Some(&c.ix_s_ba), Some(&c.ix_t)); // (a, q)
        join(&x, &c.r, p.a2, Out::RL, None, Some(&c.ix_r)).len()
    } else {
        let x = join(&c.r, &c.s_ab, p.a1, Out::RL, Some(&c.ix_r), Some(&c.ix_s_ab)); // (b, p)
        join(&x, &c.t, p.a2, Out::RL, None, Some(&c.ix_t)).len()
    };
    (t0.elapsed().as_secs_f64(), n)
}

/// Best of `reps` runs (the minimum is the least noisy estimate of the cost of the work itself).
pub fn time_plan(c: &Chain, p: &Plan, reps: usize) -> f64 {
    (0..reps).map(|_| execute(c, p).0).fold(f64::INFINITY, f64::min)
}

/// Time one operator on its own (for calibration). Inputs are generated by the caller.
pub fn time_op(l: &[Row], r: &[Row], alg: Alg, il: &Index, ir: &Index, reps: usize) -> (f64, usize) {
    let mut best = f64::INFINITY;
    let mut n = 0;
    for _ in 0..reps {
        let t0 = Instant::now();
        n = join(l, r, alg, Out::RL, Some(il), Some(ir)).len();
        best = best.min(t0.elapsed().as_secs_f64());
    }
    (best, n)
}

// ----------------------------------------------------------------------------------------------- cost models

fn lg(x: f64) -> f64 { (x + 1.0).log2() }
/// Hash tables bigger than this many build rows no longer fit in the core-private caches.
pub const BIG_BUILD: f64 = 32768.0;

/// Features of one operator invocation: the event counts a cost formula multiplies by per-event costs.
pub fn features(alg: Alg, nl: f64, nr: f64, nout: f64, size_classes: bool) -> Vec<f64> {
    match alg {
        Alg::HashBuildL | Alg::HashBuildR => {
            let (b, p) = if alg == Alg::HashBuildL { (nl, nr) } else { (nr, nl) };
            if size_classes {
                let big = (b >= BIG_BUILD) as u8 as f64;
                vec![b * (1.0 - big), p * (1.0 - big), b * big, p * big, nout]
            } else { vec![b, p, nout] }
        }
        Alg::SortMerge => vec![nl * lg(nl), nr * lg(nr), nl + nr, nout],
        Alg::IndexNlR => vec![nl, nl * lg(nr), nout],
        Alg::IndexNlL => vec![nr, nr * lg(nl), nout],
        Alg::Bnl => vec![nl * nr, nout],
    }
}
/// Operator families that share a coefficient vector (build side and probe side are already swapped in the features).
pub fn family(alg: Alg) -> usize { match alg { Alg::HashBuildL | Alg::HashBuildR => 0, Alg::SortMerge => 1, Alg::IndexNlR | Alg::IndexNlL => 2, Alg::Bnl => 3 } }

pub trait CostModel {
    fn name(&self) -> String;
    fn op(&self, alg: Alg, nl: f64, nr: f64, nout: f64) -> f64;
    fn plan(&self, shapes: &[(f64, f64, f64); 2], p: &Plan) -> f64 {
        self.op(p.a1, shapes[0].0, shapes[0].1, shapes[0].2) + self.op(p.a2, shapes[1].0, shapes[1].1, shapes[1].2)
    }
}

/// Sum of intermediate result sizes; blind to the algorithm.
pub struct COut;
impl CostModel for COut {
    fn name(&self) -> String { "C_out".into() }
    fn op(&self, _: Alg, _: f64, _: f64, nout: f64) -> f64 { nout }
}

/// In the spirit of the main-memory cost function of Leis et al.: a hash join costs its inputs plus its output; an index
/// nested-loop join costs `lambda` per outer row (at least one per output row); no I/O terms.
pub struct CMm { pub lambda: f64 }
impl CostModel for CMm {
    fn name(&self) -> String { "C_mm-style".into() }
    fn op(&self, alg: Alg, nl: f64, nr: f64, nout: f64) -> f64 {
        match alg {
            Alg::HashBuildL | Alg::HashBuildR | Alg::SortMerge => nl + nr + nout,
            Alg::IndexNlR => self.lambda * nl.max(nout),
            Alg::IndexNlL => self.lambda * nr.max(nout),
            Alg::Bnl => nl * nr,
        }
    }
}

/// Disk-era constants: CPU cost per tuple 0.01, per operator 0.0025, and each index probe pays a random page read of 4.0.
/// (A textbook parametrization in the style of PostgreSQL's defaults, not PostgreSQL's exact formulas.)
pub struct Textbook { pub cpu_tuple: f64, pub cpu_op: f64, pub random_page: f64 }
impl Default for Textbook { fn default() -> Self { Textbook { cpu_tuple: 0.01, cpu_op: 0.0025, random_page: 4.0 } } }
impl CostModel for Textbook {
    fn name(&self) -> String { "textbook constants".into() }
    fn op(&self, alg: Alg, nl: f64, nr: f64, nout: f64) -> f64 {
        let (ct, co, rp) = (self.cpu_tuple, self.cpu_op, self.random_page);
        match alg {
            Alg::HashBuildL | Alg::HashBuildR => {
                let (b, p) = if alg == Alg::HashBuildL { (nl, nr) } else { (nr, nl) };
                b * (co + ct) + p * co + nout * ct
            }
            Alg::SortMerge => 2.0 * co * (nl * lg(nl) + nr * lg(nr)) + (nl + nr) * co + nout * ct,
            Alg::IndexNlR => nl * (rp + co * lg(nr)) + nout * ct,
            Alg::IndexNlL => nr * (rp + co * lg(nl)) + nout * ct,
            Alg::Bnl => nl * nr * co + nout * ct,
        }
    }
}

/// Per-family coefficients fitted to microbenchmarks (nanoseconds per event).
pub struct Calibrated { pub coef: [Vec<f64>; 4], pub size_classes: bool, pub label: String }
impl CostModel for Calibrated {
    fn name(&self) -> String { self.label.clone() }
    fn op(&self, alg: Alg, nl: f64, nr: f64, nout: f64) -> f64 {
        let f = features(alg, nl, nr, nout, self.size_classes);
        f.iter().zip(&self.coef[family(alg)]).map(|(a, b)| a * b).sum()
    }
}

/// Non-negative least squares by cyclic coordinate descent on column-normalized data: min ||A x - b||^2, x >= 0.
pub fn nnls(a: &[Vec<f64>], b: &[f64], sweeps: usize) -> Vec<f64> {
    let (m, n) = (a.len(), a[0].len());
    let norm: Vec<f64> = (0..n).map(|j| a.iter().map(|r| r[j] * r[j]).sum::<f64>().sqrt().max(1e-300)).collect();
    let an: Vec<Vec<f64>> = a.iter().map(|r| (0..n).map(|j| r[j] / norm[j]).collect()).collect();
    let mut x = vec![0.0; n];
    let mut res: Vec<f64> = b.to_vec();
    for _ in 0..sweeps {
        let mut moved = 0.0f64;
        for j in 0..n {
            let g: f64 = (0..m).map(|i| an[i][j] * res[i]).sum();
            let nx = (x[j] + g).max(0.0);
            let d = nx - x[j];
            if d != 0.0 { for i in 0..m { res[i] -= an[i][j] * d; } x[j] = nx; moved = moved.max(d.abs()); }
        }
        if moved < 1e-12 { break; }
    }
    (0..n).map(|j| x[j] / norm[j]).collect()
}

/// One operator measurement: family, features, seconds.
pub struct Sample { pub alg: Alg, pub nl: f64, pub nr: f64, pub nout: f64, pub secs: f64 }

/// Fit one coefficient vector per family, minimizing *relative* error (each row divided by its measured time).
pub fn calibrate(samples: &[Sample], size_classes: bool, label: &str) -> Calibrated {
    let mut coef: [Vec<f64>; 4] = [vec![], vec![], vec![], vec![]];
    for fam in 0..4 {
        let rows: Vec<&Sample> = samples.iter().filter(|s| family(s.alg) == fam).collect();
        let a: Vec<Vec<f64>> = rows.iter().map(|s| features(s.alg, s.nl, s.nr, s.nout, size_classes).iter().map(|v| v / s.secs).collect()).collect();
        let b = vec![1.0; rows.len()];
        coef[fam] = nnls(&a, &b, 20000);
    }
    Calibrated { coef, size_classes, label: label.into() }
}

// ----------------------------------------------------------------------------------------------- ranking metrics

/// Spearman rank correlation (ties get the average rank).
pub fn spearman(x: &[f64], y: &[f64]) -> f64 {
    fn ranks(v: &[f64]) -> Vec<f64> {
        let mut idx: Vec<usize> = (0..v.len()).collect();
        idx.sort_by(|&a, &b| v[a].partial_cmp(&v[b]).unwrap());
        let mut r = vec![0.0; v.len()];
        let mut i = 0;
        while i < idx.len() {
            let mut j = i;
            while j + 1 < idx.len() && v[idx[j + 1]] == v[idx[i]] { j += 1; }
            for k in i..=j { r[idx[k]] = (i + j) as f64 / 2.0; }
            i = j + 1;
        }
        r
    }
    let (rx, ry) = (ranks(x), ranks(y));
    let n = x.len() as f64;
    let (mx, my) = (rx.iter().sum::<f64>() / n, ry.iter().sum::<f64>() / n);
    let (mut sxy, mut sxx, mut syy) = (0.0, 0.0, 0.0);
    for i in 0..x.len() { sxy += (rx[i] - mx) * (ry[i] - my); sxx += (rx[i] - mx).powi(2); syy += (ry[i] - my).powi(2); }
    sxy / (sxx * syy).sqrt().max(1e-300)
}

// ----------------------------------------------------------------------------------------------- shared experiment helpers

fn log_uniform(r: &mut Rng, lo: f64, hi: f64) -> f64 { (lo.ln() + r.unit() * (hi.ln() - lo.ln())).exp() }
fn gen_rows(r: &mut Rng, n: usize, dom: u64) -> Vec<Row> { (0..n).map(|i| (r.next(dom) as u32, i as u32)).collect() }

/// Microbenchmark every operator on random inputs: the training data for `calibrate`.
pub fn micro_samples(r: &mut Rng, per_alg: usize) -> Vec<Sample> {
    let mut out = vec![];
    for alg in ALGS {
        let mut got = 0;
        while got < per_alg {
            let (lo, hi) = if alg == Alg::Bnl { (100.0, 6000.0) } else { (300.0, 300_000.0) };
            let (nl, nr) = (log_uniform(r, lo, hi) as usize, log_uniform(r, lo, hi) as usize);
            let dom = ((nl.max(nr) as f64) * 10f64.powf(-0.7 + 1.7 * r.unit())).max(2.0) as u64;
            if nl as f64 * nr as f64 / dom as f64 > 3e6 { continue; }
            let (l, rr) = (gen_rows(r, nl, dom), gen_rows(r, nr, dom));
            let (il, ir) = (Index::new(&l), Index::new(&rr));
            let (secs, n) = time_op(&l, &rr, alg, &il, &ir, 3);
            out.push(Sample { alg, nl: nl as f64, nr: nr as f64, nout: n as f64, secs });
            got += 1;
        }
    }
    out
}

/// A random chain query with every plan timed: the ground truth the strategies are scored against.
pub struct TimedQuery { pub sizes: (f64, f64, f64), pub cards: [f64; 3], pub plans: Vec<(Plan, f64)> }
impl TimedQuery {
    pub fn fastest(&self) -> f64 { self.plans.iter().map(|x| x.1).fold(f64::INFINITY, f64::min) }
    pub fn secs(&self, p: &Plan) -> Option<f64> { self.plans.iter().find(|x| &x.0 == p).map(|x| x.1) }
    pub fn slowdown(&self, p: &Plan) -> f64 { self.secs(p).expect("plan was timed") / self.fastest() }
    pub fn plan_list(&self) -> Vec<Plan> { self.plans.iter().map(|x| x.0).collect() }
}

/// `n` random queries (tables of 2 000 to 120 000 rows, join selectivities from 0.1x to 10x); `extra` sees each chain once, while it exists.
pub fn timed_queries(rng: &mut Rng, n: usize, reps: usize, extra: &mut dyn FnMut(&Chain, &TimedQuery)) -> Vec<TimedQuery> {
    let mut qs = vec![];
    while qs.len() < n {
        let (nr, ns, nt) = (log_uniform(rng, 2000.0, 120_000.0) as usize, log_uniform(rng, 2000.0, 120_000.0) as usize, log_uniform(rng, 2000.0, 120_000.0) as usize);
        let (u, v) = (-0.8 + 1.8 * rng.unit(), -0.8 + 1.8 * rng.unit());
        let (da, db) = ((nr.max(ns) as f64 * 10f64.powf(u)).max(2.0) as usize, (ns.max(nt) as f64 * 10f64.powf(v)).max(2.0) as usize);
        let c = Chain::generate(rng, nr, ns, nt, da, db);
        if c.card_rs.max(c.card_st).max(c.card_rst) > 3e6 || c.card_rst < 1.0 { continue; }
        let plans = plans(&c).into_iter().map(|p| { let t = time_plan(&c, &p, reps); (p, t) }).collect();
        let q = TimedQuery { sizes: c.sizes(), cards: [c.card_rs, c.card_st, c.card_rst], plans };
        extra(&c, &q);
        qs.push(q);
    }
    qs
}
```
