[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Slotted pages have three costs</strong>: fragmentation after deletes, reading a whole page to change one tuple, and random I/O when updates touch many pages.</li> <li><strong>Log-structured storage never updates in place.</strong> Writes go to an in-memory <strong>MemTable</strong>. When it fills, it's sorted and written sequentially as an immutable <strong>SSTable</strong>. Each record is (key, PUT value | DELETE), and the newest record per key wins.</li> <li><strong>It fits append-only storage</strong> (HDFS, Colossus, object stores) and turns random writes into sequential ones.</li> <li><strong>Reads get harder.</strong> Check the MemTable, then SSTables from newest to oldest. Per-table <strong>min/max keys</strong> and <strong>Bloom filters</strong> let most tables be skipped.</li> <li><strong>Compaction</strong> merges SSTables (a sort-merge), keeps the newest version per key, and reclaims space. <strong>Universal (tiered)</strong>: merge runs of similar size. <strong>Leveled</strong>: L0 may overlap, while each deeper level is one sorted, non-overlapping run about T× larger than the one above.</li> <li><strong>Trade-offs</strong>: fast sequential writes; slower reads; expensive compaction; <strong>write amplification</strong> (one logical write becomes many physical writes as data moves down the levels).</li> <li><strong>Index-organized storage</strong>: the table <em>is</em> an index (B+Tree, skip list, trie) with tuples stored in key order in the leaves, instead of a heap plus a separate index.</li> <li><strong>Buffer pool optimizations</strong> from the same lecture: multiple pools (by object or by hash of page id), prefetching (including the next <em>logical</em> leaf in an index scan), and scan sharing (a second scan attaches to a running one and wraps around).</li> </ul>
"""

