[[sections]]
heading = "The RUM trade-off"
body = """
<p>Every access method trades <strong>R</strong>ead, <strong>U</strong>pdate (write) and <strong>M</strong>emory (space) amplification (Athanassoulis et al., EDBT 2016). You can optimize two at the cost of the third. For an LSM with size ratio <em>T</em> and <em>L</em> levels:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Compaction</th> <th>Write amp</th> <th>Point read (no Bloom)</th> <th>Space amp</th> <th>Used by</th> </tr> </thead> <tbody> <tr> <td><strong>Leveled</strong></td> <td>≈ T · L</td> <td>≈ L tables</td> <td>≈ 1.1×</td> <td>RocksDB default, LevelDB, Pebble</td> </tr> <tr> <td><strong>Tiered / universal</strong></td> <td>≈ L</td> <td>≈ T · L tables</td> <td>up to ≈ T× (temporarily)</td> <td>Cassandra STCS, ScyllaDB, RocksDB universal</td> </tr> <tr> <td><strong>B+Tree (in place)</strong></td> <td>≈ page size / record size per update (plus WAL)</td> <td>≈ tree height</td> <td>≈ 1.3–1.5× (half-full pages)</td> <td>everything else</td> </tr> </tbody> </table></div>

<p>The toy LSM below measures <strong>9.7× write amplification</strong> for 200k random 100-byte puts. Every byte is written roughly 10 times on its way to the bottom level. That's why LSM engines compress SSTables, and why WiscKey separates large values from keys.</p>
"""

[[sections]]
heading = "Toy LSM in Rust"
body = """
<p>This is a complete (but small) LSM: SSTables use a real layout (data blocks, block index, Bloom filter, footer), reads use fence pointers and Bloom checks, and compaction is a k-way merge that drops tombstones only at the bottom. It's verified against a <code>BTreeMap</code> model. The production engine (WAL, manifest, concurrency, block cache) is System 2 in Part V.</p>

:::deeper Toy LSM: SSTable format, Bloom filter, k-way merge, leveled compaction
```rust title="src/lsm.rs"
//! A toy LSM tree: memtable -> immutable sorted runs (SSTables) -> compaction.
//! SSTables are byte blobs with the real layout (blocks, index, bloom, footer),
//! kept in memory so the logic is testable without files.
use std::cmp::Reverse;
use std::collections::{BTreeMap, BinaryHeap};
use std::ops::Bound;

pub type Key = Vec<u8>;
pub type Val = Option<Vec<u8>>;               // None = tombstone

const BLOCK: usize = 4096;
const BLOOM_BITS_PER_KEY: usize = 10;         // ≈1% false positives with k = 7

// ---------------- SSTable ----------------------------------------------------
// [data block]* [index block] [bloom] [footer: index_off u32 | bloom_off u32 | n u32]
// entry: key_len u16 | key | tag u8 (1 = put, 0 = delete) | val_len u32 | val
pub struct SsTable { bytes: Vec<u8>, index: Vec<(Key, u32, u32)>, bloom: Bloom, pub min: Key, pub max: Key }

pub fn build_sst(entries: impl IntoIterator<Item = (Key, Val)>) -> SsTable {
    let (mut bytes, mut index, mut keys) = (Vec::new(), Vec::new(), Vec::new());
    let mut block = Vec::new();
    let mut first: Option<Key> = None;
    let flush = |block: &mut Vec<u8>, first: &mut Option<Key>, bytes: &mut Vec<u8>, index: &mut Vec<(Key, u32, u32)>| {
        if block.is_empty() { return; }
        index.push((first.take().unwrap(), bytes.len() as u32, block.len() as u32));
        bytes.append(block);
    };
    for (k, v) in entries {
        if first.is_none() { first = Some(k.clone()); }
        block.extend_from_slice(&(k.len() as u16).to_le_bytes());
        block.extend_from_slice(&k);
        match &v {
            Some(v) => { block.push(1); block.extend_from_slice(&(v.len() as u32).to_le_bytes()); block.extend_from_slice(v); }
            None => { block.push(0); block.extend_from_slice(&0u32.to_le_bytes()); }
        }
        keys.push(k);
        if block.len() >= BLOCK { flush(&mut block, &mut first, &mut bytes, &mut index); }
    }
    flush(&mut block, &mut first, &mut bytes, &mut index);
    let bloom = Bloom::build(&keys);
    let index_off = bytes.len() as u32;
    for (k, off, len) in &index {
        bytes.extend_from_slice(&(k.len() as u16).to_le_bytes()); bytes.extend_from_slice(k);
        bytes.extend_from_slice(&off.to_le_bytes()); bytes.extend_from_slice(&len.to_le_bytes());
    }
    let bloom_off = bytes.len() as u32;
    bytes.extend_from_slice(&bloom.bits);
    bytes.extend_from_slice(&index_off.to_le_bytes());
    bytes.extend_from_slice(&bloom_off.to_le_bytes());
    bytes.extend_from_slice(&(index.len() as u32).to_le_bytes());
    let (min, max) = (keys.first().cloned().unwrap_or_default(), keys.last().cloned().unwrap_or_default());
    SsTable { bytes, index, bloom, min, max }
}

fn decode_block(b: &[u8]) -> Vec<(Key, Val)> {
    let (mut i, mut out) = (0, Vec::new());
    while i < b.len() {
        let kl = u16::from_le_bytes([b[i], b[i + 1]]) as usize; i += 2;
        let k = b[i..i + kl].to_vec(); i += kl;
        let tag = b[i]; i += 1;
        let vl = u32::from_le_bytes(b[i..i + 4].try_into().unwrap()) as usize; i += 4;
        let v = (tag == 1).then(|| b[i..i + vl].to_vec()); i += vl;
        out.push((k, v));
    }
    out
}

impl SsTable {
    /// Some(Some(v)) = found, Some(None) = tombstone, None = not in this table.
    pub fn get(&self, key: &[u8]) -> Option<Val> {
        if key < self.min.as_slice() || key > self.max.as_slice() || !self.bloom.may_contain(key) { return None; }
        // Fence pointers: the last block whose first key <= key.
        let i = self.index.partition_point(|(first, _, _)| first.as_slice() <= key).checked_sub(1)?;
        let (_, off, len) = &self.index[i];
        let block = decode_block(&self.bytes[*off as usize..(*off + *len) as usize]);
        block.binary_search_by(|(k, _)| k.as_slice().cmp(key)).ok().map(|j| block[j].1.clone())
    }
    pub fn iter(&self) -> impl Iterator<Item = (Key, Val)> + '_ {
        self.index.iter().flat_map(|(_, off, len)| decode_block(&self.bytes[*off as usize..(*off + *len) as usize]))
    }
    pub fn size(&self) -> usize { self.bytes.len() }
}

// ---------------- Bloom filter ----------------------------------------------
pub struct Bloom { bits: Vec<u8>, k: u32 }
fn h64(key: &[u8], seed: u64) -> u64 {
    let mut h = 0xcbf2_9ce4_8422_2325u64 ^ seed;
    for &b in key { h ^= b as u64; h = h.wrapping_mul(0x0100_0000_01b3); }
    h ^= h >> 33; h = h.wrapping_mul(0xff51_afd7_ed55_8ccd); h ^ (h >> 33)
}
impl Bloom {
    pub fn build(keys: &[Key]) -> Self {
        let nbits = (keys.len() * BLOOM_BITS_PER_KEY).max(64);
        let k = ((BLOOM_BITS_PER_KEY as f64) * std::f64::consts::LN_2).round() as u32;   // optimal k = (m/n)·ln2
        let mut b = Bloom { bits: vec![0; nbits.div_ceil(8)], k };
        for key in keys { b.probe(key, |bits, i| bits[i / 8] |= 1 << (i % 8)); }
        b
    }
    fn probe(&mut self, key: &[u8], mut f: impl FnMut(&mut [u8], usize)) {
        let (h1, h2, m) = (h64(key, 0), h64(key, 0x9e37) | 1, self.bits.len() * 8);
        for i in 0..self.k as u64 { f(&mut self.bits, (h1.wrapping_add(i.wrapping_mul(h2)) % m as u64) as usize); }
    }
    pub fn may_contain(&self, key: &[u8]) -> bool {
        let (h1, h2, m) = (h64(key, 0), h64(key, 0x9e37) | 1, self.bits.len() * 8);
        (0..self.k as u64).all(|i| { let b = (h1.wrapping_add(i.wrapping_mul(h2)) % m as u64) as usize; self.bits[b / 8] & (1 << (b % 8)) != 0 })
    }
}

// ---------------- The tree ----------------------------------------------------
pub struct Lsm {
    mem: BTreeMap<Key, Val>,
    mem_bytes: usize,
    mem_limit: usize,
    l0: Vec<SsTable>,              // newest last; key ranges may overlap
    levels: Vec<Vec<SsTable>>,     // L1..: each a sorted, non-overlapping run
    l0_limit: usize,
    ratio: usize,                  // size ratio T between levels
    pub bytes_written: usize,      // for write-amplification measurement
    pub user_bytes: usize,
}

impl Lsm {
    pub fn new(mem_limit: usize) -> Self {
        Lsm { mem: BTreeMap::new(), mem_bytes: 0, mem_limit, l0: vec![], levels: vec![], l0_limit: 4, ratio: 10, bytes_written: 0, user_bytes: 0 }
    }

    pub fn put(&mut self, k: &[u8], v: &[u8]) { self.write(k.to_vec(), Some(v.to_vec())) }
    pub fn delete(&mut self, k: &[u8]) { self.write(k.to_vec(), None) }

    fn write(&mut self, k: Key, v: Val) {
        let sz = k.len() + v.as_ref().map_or(0, |v| v.len()) + 8;
        self.user_bytes += sz;
        self.mem_bytes += sz;
        self.mem.insert(k, v);                     // a real engine appends to the WAL first
        if self.mem_bytes >= self.mem_limit { self.flush(); }
    }

    pub fn flush(&mut self) {
        if self.mem.is_empty() { return; }
        let sst = build_sst(std::mem::take(&mut self.mem));
        self.bytes_written += sst.size();
        self.mem_bytes = 0;
        self.l0.push(sst);
        if self.l0.len() > self.l0_limit { self.compact(0); }
    }

    pub fn get(&self, k: &[u8]) -> Option<Vec<u8>> {
        if let Some(v) = self.mem.get(k) { return v.clone(); }
        for t in self.l0.iter().rev() { if let Some(v) = t.get(k) { return v; } }   // newest first
        for level in &self.levels {
            // Non-overlapping: at most one table per level can hold k.
            let i = level.partition_point(|t| t.max.as_slice() < k);
            if let Some(t) = level.get(i) { if let Some(v) = t.get(k) { return v; } }
        }
        None
    }

    /// Merge `src` (level index: 0 = L0) into the next level.
    fn compact(&mut self, src: usize) {
        let inputs: Vec<SsTable> = if src == 0 { std::mem::take(&mut self.l0) } else { std::mem::take(&mut self.levels[src - 1]) };
        if self.levels.len() <= src { self.levels.push(vec![]); }
        let target = std::mem::take(&mut self.levels[src]);
        let is_last = self.levels.len() == src + 1;
        // Sources in priority order: newer data first. L0 tables: newest last, so reverse.
        let merged: Vec<(Key, Val)> = {
            let mut sources: Vec<Box<dyn Iterator<Item = (Key, Val)> + '_>> = Vec::new();
            for t in inputs.iter().rev() { sources.push(Box::new(t.iter())); }
            for t in target.iter() { sources.push(Box::new(t.iter())); }
            merge(sources).filter(|(_, v)| !(is_last && v.is_none())).collect()   // drop tombstones only at the bottom
        };
        // Cut into ~64 KiB tables.
        let mut run = Vec::new();
        let mut chunk = Vec::new();
        let mut sz = 0;
        for (k, v) in merged {
            sz += k.len() + v.as_ref().map_or(0, |v| v.len()) + 7;
            chunk.push((k, v));
            if sz >= 64 * 1024 { let t = build_sst(std::mem::take(&mut chunk)); self.bytes_written += t.size(); run.push(t); sz = 0; }
        }
        if !chunk.is_empty() { let t = build_sst(chunk); self.bytes_written += t.size(); run.push(t); }
        self.levels[src] = run;
        let level_bytes: usize = self.levels[src].iter().map(|t| t.size()).sum();
        let limit = self.mem_limit * self.l0_limit * self.ratio.pow(src as u32 + 1);
        if level_bytes > limit { self.compact(src + 1); }
    }

    pub fn scan(&self, lo: &[u8], hi: &[u8]) -> Vec<(Key, Vec<u8>)> {
        let mut sources: Vec<Box<dyn Iterator<Item = (Key, Val)> + '_>> = Vec::new();
        sources.push(Box::new(self.mem.range::<[u8], _>((Bound::Included(lo), Bound::Included(hi))).map(|(k, v)| (k.clone(), v.clone()))));
        for t in self.l0.iter().rev() { sources.push(Box::new(t.iter())); }
        for level in &self.levels { for t in level { sources.push(Box::new(t.iter())); } }
        merge(sources).filter(|(k, _)| k.as_slice() >= lo && k.as_slice() <= hi)
            .filter_map(|(k, v)| v.map(|v| (k, v))).collect()
    }

    pub fn shape(&self) -> (usize, Vec<usize>) { (self.l0.len(), self.levels.iter().map(|l| l.len()).collect()) }
}

/// K-way merge of sorted sources; for equal keys the source with the lowest index wins.
pub fn merge<'a>(mut sources: Vec<Box<dyn Iterator<Item = (Key, Val)> + 'a>>) -> impl Iterator<Item = (Key, Val)> + 'a {
    let mut heap = BinaryHeap::new();
    let mut heads: Vec<Option<(Key, Val)>> = sources.iter_mut().map(|s| s.next()).collect();
    for (i, h) in heads.iter().enumerate() { if let Some((k, _)) = h { heap.push(Reverse((k.clone(), i))); } }
    std::iter::from_fn(move || {
        let Reverse((key, i)) = heap.pop()?;
        let (_, val) = heads[i].take().unwrap();
        if let Some(n) = sources[i].next() { heap.push(Reverse((n.0.clone(), i))); heads[i] = Some(n); }
        // Skip older versions of the same key from other sources.
        while let Some(Reverse((k2, j))) = heap.peek().cloned() {
            if k2 != key { break; }
            heap.pop();
            heads[j].take();
            if let Some(n) = sources[j].next() { heap.push(Reverse((n.0.clone(), j))); heads[j] = Some(n); }
        }
        Some((key, val))
    })
}
```
