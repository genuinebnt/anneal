```rust title="tests: model-based + write amplification"
use proptest::prelude::*;
use std::collections::BTreeMap;
use scratch::lsm::Lsm;

proptest! {
    #![proptest_config(ProptestConfig { cases: 64, ..ProptestConfig::default() })]
    #[test]
    fn lsm_matches_model(ops in prop::collection::vec((0u8..3, 0u16..400, prop::collection::vec(any::<u8>(), 0..40)), 0..3000)) {
        let mut lsm = Lsm::new(2048);                        // tiny memtable: many flushes and compactions
        let mut model = BTreeMap::new();
        for (op, k, v) in ops {
            let key = format!("k{k:05}").into_bytes();
            match op {
                0 | 1 => { lsm.put(&key, &v); model.insert(key, v); }
                _ => { lsm.delete(&key); model.remove(&key); }
            }
        }
        for k in 0u16..400 { let key = format!("k{k:05}").into_bytes(); prop_assert_eq!(lsm.get(&key), model.get(&key).cloned()); }
        let want: Vec<_> = model.range(b"k00100".to_vec()..=b"k00300".to_vec()).map(|(k, v)| (k.clone(), v.clone())).collect();
        prop_assert_eq!(lsm.scan(b"k00100", b"k00300"), want);
    }
}

#[test]
fn write_amplification() {
    for &(n, val) in &[(200_000usize, 100usize)] {
        let mut lsm = Lsm::new(64 * 1024);
        let mut x = 42u64;
        for _ in 0..n { x ^= x << 13; x ^= x >> 7; x ^= x << 17; lsm.put(format!("{:016x}", x % 1_000_000).as_bytes(), &vec![7u8; val]); }
        lsm.flush();
        eprintln!("{n} random puts, {val}B values: shape L0={} levels={:?}, write amplification = {:.1}×",
            lsm.shape().0, lsm.shape().1, lsm.bytes_written as f64 / lsm.user_bytes as f64);
    }
}
