<aside data-call="rust"><b><code>Box&lt;dyn Iterator + 'a&gt;</code> for heterogeneous sources</b><p>The merge takes iterators of <em>different</em> types: a <code>BTreeMap</code> range, SSTable block decoders, and so on. <code>Vec&lt;Box&lt;dyn Iterator&lt;Item = …&gt; + 'a&gt;&gt;</code> erases the type, at the cost of one virtual call per item. The <code>'a</code> says that each source borrows the tree. The borrow checker caught a real bug while this was written: the <code>Vec</code> of sources was declared <em>before</em> the tables it borrows from, so it would have outlived them. Declaring it inside the block that owns the tables fixes that. For the hot path, write an enum over the known source types instead. It's static dispatch and lets the calls inline. Reference: <a href="https://doc.rust-lang.org/book/ch18-02-trait-objects.html" target="_blank" rel="noreferrer">trait objects</a>.</p></aside>

<aside data-call="rust"><b><code>BinaryHeap</code> is a max-heap</b><p>The merge wants the <em>smallest</em> key first, so it pushes <code>Reverse((key, source_index))</code>. Using the source index as the tiebreaker makes "newest wins" fall out of the ordering: newer sources get lower indices, so they pop first for equal keys, and the loop skips the older duplicates. Reference: <a href="https://doc.rust-lang.org/std/cmp/struct.Reverse.html" target="_blank" rel="noreferrer"><code>std::cmp::Reverse</code></a>.</p></aside>
"""

[[sections]]
heading = "Bloom filters in one paragraph"
body = """
<p><em>m</em> bits, <em>k</em> hash functions, <em>n</em> keys. Insert sets <em>k</em> bits; a lookup checks them. False positives are possible, false negatives never. The optimal <em>k</em> = (<em>m</em>/<em>n</em>)·ln 2, and the false-positive rate ≈ (1 − e<sup>−kn/m</sup>)<sup>k</sup>. At 10 bits per key that's about 1% with <em>k</em> = 7. Double hashing (h₁ + i·h₂) replaces <em>k</em> independent hashes. <a href="/cookbook/p/filters-tries-inverted-and-vector-indexes">L09</a> covers the variants: blocked Bloom (one cache line per key), Cuckoo and Ribbon filters, and the Monkey result that deeper levels deserve fewer bits per key.</p>

<aside data-call="production"><b>LSM engines in the wild</b><ul> <li><strong>RocksDB</strong> (Meta): leveled by default, with universal and FIFO options. Column families, block cache, prefix Bloom filters, rate-limited compaction, <code>DeleteRange</code> tombstones. It underneath MyRocks, CockroachDB (before Pebble), TiKV, Kafka Streams and many more.</li> <li><strong>Pebble</strong> (CockroachDB): a RocksDB-compatible Go engine with range keys and better flush scheduling.</li> <li><strong>Cassandra / ScyllaDB</strong>: size-tiered, leveled and time-window compaction. Time-window compaction is ideal for TTL'd time series (Part IV).</li> <li><strong>WiscKey</strong> (FAST 2016): keep only keys in the LSM and values in a separate log. Write amplification falls sharply for large values. Used by Badger, TiKV's Titan, and RocksDB BlobDB.</li> <li><strong>Index-organized tables</strong>: InnoDB, SQLite (rowid tables), SQL Server clustered indexes and Oracle IOTs store rows inside a B+Tree. Secondary indexes then point to the <em>primary key</em>, not a physical RID.</li> </ul></aside>
"""

