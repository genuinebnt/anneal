<ul class="cb-g-uses"><li>zone maps (min/max per block) are Netezza "zone maps"</li><li>Parquet/<strong>orc</strong> row-group statistics</li><li>Delta/Iceberg file statistics</li><li>Snowflake micro-partition pruning</li><li>ClickHouse sparse primary index and skip indexes</li><li>PostgreSQL <strong>brin</strong></li><li>Oracle storage indexes</li><li>column imprints came out of MonetDB</li><li>database cracking was prototyped in MonetDB and its adaptive-indexing descendants. Course: CMU 15-721 (storage/scans)</li><li>the CIDR 2007 cracking paper below</li></ul>
