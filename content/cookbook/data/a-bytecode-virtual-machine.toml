hand-written loop (no NULL support)        4.2        4.3
```

<ul> <li><strong>24 instructions, 3 registers, 1.6 µs to compile.</strong> The <code>JumpIfFalse(0, 10)</code> at 6 is the short circuit of the <code>AND</code>: when <code>a*2 + b &gt; 100</code> is false the <code>c &lt; 50</code> test is skipped. The <code>Norm</code> at 10 turns the left side of the <code>OR</code> into 0, 1 or NULL before the <code>JumpIfTrue</code>.</li> <li><strong>The ranking</strong>: tree walking 28.9 ns per row, bytecode 24.0, closures 19.0, hand-written 4.2. The VM is <strong>17% faster than walking the tree</strong> and <strong>26% slower than closures</strong>. NULLs add 5% to 13% to the interpretive engines and nothing to the loop that ignores them.</li> <li><strong>Why the hand-written loop is 6× faster</strong>: it works on <code>i64</code>s the compiler keeps in registers, with no NULL check, no dispatch and a compiled-in constant. The three general engines carry a validity flag with every value (<code>Option&lt;i64&gt;</code> is 16 bytes), re-dispatch on node or opcode kind, and read register memory between operations. The vectorized engine of <a href="/cookbook/p/a-vectorized-engine">M4</a> removes the dispatch by amortizing it over a batch; compilation to machine code removes it by not interpreting at all (<a href="/cookbook/p/query-compilation-and-code-generation">code generation</a>).</li> <li><strong>The superinstructions helped a little</strong>: replacing a <code>Lit</code> and a binary operation by <code>BinK</code>/<code>CmpK</code> removed four instructions from the program (28 to 24) and 3% from the run time (25.2 to 24.4 ns before the final run). Dispatch is not the only cost, so shortening the program gains less than its length suggests.</li> <li><strong>Compilation is cheap</strong>: 1.6 µs for the bytecode and 0.8 µs for the closures, against milliseconds for an LLVM-based JIT. That is why PostgreSQL and SQLite compile every statement and only JIT the long-running ones.</li> </ul>

<aside data-call="note"><b>A subtle point the tests pin</b><p><code>a OR b</code> must return 0, 1 or NULL, not <code>a</code>. With the short-circuit jump <code>JumpIfTrue</code>, a true left side such as 7 would stay in the destination register and the machine would return 7 where the tree interpreter returns 1. The compiler emits <code>Norm</code> after the left side to prevent this; it was added when the jump was designed, and nothing in the random queries would have missed its absence: the mutant without it is killed by the directed test (<code>7 OR 0</code> must give 1) and by the differential test.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>#[derive(Clone, Copy)] enum Op</code></strong> with at most one <code>i64</code> payload keeps an instruction at 16 bytes; the program is a <code>Vec&lt;Op&gt;</code> the interpreter indexes with a <code>usize</code> program counter. Jump targets are <code>u32</code> indexes patched by <code>Gen::patch</code>, never pointers.</li> <li><strong>One <code>match</code> in a <code>loop</code></strong> is the whole interpreter; the compiler turns it into a jump table. <code>continue</code> after a taken jump skips the <code>pc += 1</code> at the bottom.</li> <li><strong>Register allocation as a stack discipline</strong>: <code>Gen::expr(e, dst)</code> records <code>mark = next_reg</code>, allocates temporaries above it and restores <code>next_reg = mark</code> at the end, so register numbers are an invariant of tree shape and the test can assert how many a chain needs.</li> <li><strong>Boxed closures</strong> (<code>Box&lt;dyn Fn(&amp;Table, usize) -&gt; Val&gt;</code>) capture their children by move; the closure tree has one allocation per node and a virtual call per node per row. It is the cheapest way to avoid re-matching on the tree and is how many embedded query engines are written.</li> <li><strong>Sharing semantic helpers</strong>: <code>and3</code>, <code>or3</code>, <code>cmp3</code> and <code>bin3</code> are used by all three engines, so the differential test cannot check them; the truth-table test does (exhaustively over <code>{NULL, 0, 1, 5}</code>), as the aggregate lesson of <a href="/cookbook/p/a-vectorized-engine">M4</a> requires.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Truth tables</strong>: <code>AND</code>, <code>OR</code>, <code>NOT</code>, comparisons and arithmetic over every combination of NULL, 0, 1 and 5, against an independent table written as a three-valued enum; results are normalized; division by zero and <code>i64::MIN / -1</code> are NULL.</li> <li><strong>Differential</strong>: 6 000 random queries (0 to 30 rows with 20% NULLs; random filters and projections or aggregates; expression trees up to depth 4 with every operator, <code>CASE</code> and <code>IS NULL</code>) run by the tree interpreter, the bytecode and, for projections, the closures; results are identical, with 16 322 result rows, 23 322 conditional and 7 036 unconditional jumps compiled in the process.</li> <li><strong>Compiler properties</strong>: a constant subtree folds into a literal and becomes an immediate operand; NULL stays NULL through folding; a left-deep chain of 20 additions needs at most 3 registers, a right-deep chain between 20 and 23.</li> <li><strong>Short circuits and edge cases</strong>: <code>x = 0 OR 100 / x &gt; 5</code> over <code>{0, 10, 50, NULL}</code> gives <code>{1, 1, 0, NULL}</code>; <code>7 OR 0</code> is 1; aggregates over an empty table give <code>COUNT = 0</code> and NULL; a NULL filter selects nothing.</li> <li><strong>Mutants run against these tests</strong>: <code>AND</code> as <code>OR</code>; unknown <code>AND</code> true as true; <code>NOT NULL</code> as false; division by zero without NULL; a wrong short-circuit jump in <code>AND</code>; no <code>Norm</code> in <code>OR</code>; <code>CASE</code> taking the <code>THEN</code> branch on unknown; a filter letting NULL through; constants not folded; a swapped <code>BinK</code> operand; an empty table running the body; the loop stopping one row early; temporaries never released; <code>COUNT(*)</code> not counting; <code>MAX</code> keeping the smallest; a <code>Result</code> reading the wrong registers. <strong>All 16 were killed.</strong></li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>SQLite's VDBE</strong> is a register bytecode with cursors for tables and indexes; the whole statement (loops, index seeks, aggregation) is one program, visible with <code>EXPLAIN</code>. It is the closest model to the one here.</li> <li><strong>PostgreSQL</strong> compiles each expression to an <code>ExprState</code> array of steps run by a threaded interpreter (<code>ExecInterpExpr</code>), with specialized steps for common shapes (the superinstruction idea); with <code>jit = on</code> it translates the same steps to LLVM IR for expensive queries.</li> <li><strong>MySQL</strong> historically walked item trees; <strong>MariaDB</strong>, <strong>Oracle</strong> and <strong>SQL Server</strong> run compiled or interpreted expression programs. <strong>Spark</strong> compiles stages to Java bytecode (whole-stage code generation); <strong>DuckDB</strong> and <strong>ClickHouse</strong> evaluate expressions vector-at-a-time rather than row-at-a-time.</li> <li><strong>Wasm</strong> is used as a portable, sandboxed program format for user-defined functions and for pushing compute to the data (see <a href="/cookbook/p/the-engine-in-webassembly">Wasm in Cairn</a>).</li> <li><strong>Lua</strong>, <strong>eBPF</strong> and <strong>JVM</strong> bytecodes show the same pattern: a verifiable, bounded program format.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>A VM that needs a JIT to be fast is a design smell only if you needed fast.</strong> Measure before adding machine-code generation; this section's 6× gap to the hand loop is mostly NULL handling and dispatch, which vectorization attacks more cheaply.</li> <li><strong>Jump patching bugs are silent</strong>: a wrong target produces wrong results, not a crash. Compare against a reference interpreter on random programs (as here) and add a verifier that every target is in range and every register is initialized before use.</li> <li><strong>Short-circuit evaluation changes which errors happen.</strong> A language with run-time errors (division by zero, overflow) must define whether <code>x = 0 OR 100 / x &gt; 5</code> may evaluate the right side. Here division returns NULL, and the test still checks that the jump skips the operand.</li> <li><strong>Stack versus register VMs</strong>: stack machines are smaller to generate for; register machines execute fewer instructions. Wasm is a stack machine with structured control flow; the JVM too; Lua and SQLite use registers.</li> <li><strong>Don't let bytecode leak into the planner.</strong> The plan decides <em>what</em> to compute; the VM executes. If planning decisions depend on how the VM behaves, cost estimates will be wrong (<a href="/cookbook/p/cost-models">cost models</a>).</li> <li><strong>Unbounded programs</strong>: a user-supplied program needs a step budget and a memory limit; the exercises add fuel.</li> </ul></aside>
"""

