[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A query can be compiled to a program.</strong> SQLite compiles every statement to bytecode for its VDBE (<code>EXPLAIN</code> prints the program); PostgreSQL compiles expressions to a flat array of steps; Wasm is a bytecode that databases now run. The idea: turn the plan into a linear list of simple instructions over registers, with the scan loop and the row filter as instructions too, and run it with one <code>match</code> loop.</li> <li><strong>Registers beat a stack for this job.</strong> An expression <code>a * 2 + b &gt; 100</code> becomes <code>Col r0 ← a; BinK Mul r0, r0, 2; Col r1 ← b; Bin Add r0, r0, r1; CmpK Gt r0, r0, 100</code>: the result goes in the destination register the parent chose, temporaries are allocated above it and released when the subtree is done. A left-deep chain of any length uses two registers.</li> <li><strong>Three-valued logic needs care in the instruction set.</strong> NULL is "unknown": <code>NULL AND false</code> is false, <code>NULL AND true</code> is NULL; a <code>WHERE</code> keeps a row only if the condition is <em>true</em>, so the filter jump is "if not true" (false or NULL). Short-circuit jumps are valid for <code>AND</code> (a false left side decides) and <code>OR</code> (a true left side decides) but a NULL left side decides nothing.</li> <li><strong>Normalize booleans at the boundary.</strong> In SQL a <code>WHERE</code> accepts any non-zero value as true, but <code>OR</code> must <em>return</em> 1, not the left operand. One <code>Norm</code> instruction after the left side of <code>OR</code> does it; without it the machine returns the raw left operand (7, say) where SQL gives 1, and the tests kill the mutant that removes it.</li> <li><strong>Folding and superinstructions shorten the program.</strong> Subtrees without columns are evaluated at compile time with the same operators the machine uses. A comparison or arithmetic operation with a constant right operand gets its own instruction (<code>CmpK</code>, <code>BinK</code>), saving a load per row.</li> <li><strong>A VM is not automatically faster than the alternatives.</strong> The measurements below put the VM between tree walking and closure compilation, 6× behind a hand-written loop. Its value is elsewhere: a program is <em>data</em>. It can be printed, cached, serialized and sent to another node, interrupted and resumed, run with a step budget in a sandbox, checked by a verifier, and later translated to machine code by a JIT that starts from the same instruction list.</li> </ul>
"""

[[sections]]
heading = "The machine"
body = """
```sql
SELECT SUM(a*b + c) FROM t WHERE (a*2 + b > 100 AND c < 50) OR d = 7

 Rewind end                    ; empty table → halt
loop:
   filter code → r0            ; with jumps that skip the right side of AND / OR
   JumpIfNotTrue r0, next      ; false or NULL → skip the row
   aggregate input → r0 ; AggStep slot, Sum, r0
next:
   Next loop                   ; row += 1; jump back while there are rows
 Halt
```

<ul> <li><strong>Instructions</strong>: loads (<code>Col</code>, <code>Lit</code>, <code>Null</code>), arithmetic and comparison with a register or an immediate right operand, <code>And</code>, <code>Or</code>, <code>Not</code>, <code>IsNull</code>, <code>Norm</code>, conditional and unconditional jumps, <code>Rewind</code>/<code>Next</code> for the scan, <code>AggStep</code>, <code>Result</code> for projections, <code>Halt</code>.</li> <li><strong>The compiler</strong> (<code>compile</code>) folds constants, generates code for the filter then for the outputs or aggregates, and patches jump targets once their destination is known.</li> <li><strong>Three engines for comparison</strong>: <code>eval_tree</code> walks the expression tree for each row; <code>compile_closure</code> turns each node into a boxed closure once; <code>run</code> executes the bytecode. All three call the same <code>and3</code>/<code>or3</code>/<code>cmp3</code>/<code>bin3</code> helpers, which a separate exhaustive test checks against the truth tables.</li> </ul>

:::deeper Reference: expression trees, three-valued logic, folding, register code generation, the interpreter, closures and a disassembler
```rust title="src/multimodel/vm.rs"
//! A register bytecode virtual machine for scalar expressions and single-table queries, in the style of SQLite's VDBE: an expression
//! tree is compiled to a flat program of three-address instructions over a small register file (with constant folding and short-circuit
//! jumps), the scan loop is part of the program, and one `match` loop runs it. Also a tree-walking interpreter (the reference) and a
//! closure compiler (the other common way to avoid re-dispatching on the tree for every row).
use crate::vexec::{AggFn, Cmp, Table, Val};

#[derive(Clone, Copy, Debug, PartialEq)]
pub enum B { Add, Sub, Mul, Div }

/// Expressions over integer columns with NULL. Booleans are 0 and 1; any non-zero value is true; NULL is "unknown".
#[derive(Clone, Debug)]
pub enum Ex {
    Col(usize), Lit(Val),
    Bin(B, Box<Ex>, Box<Ex>), Cmp(Cmp, Box<Ex>, Box<Ex>),
    And(Box<Ex>, Box<Ex>), Or(Box<Ex>, Box<Ex>), Not(Box<Ex>), IsNull(Box<Ex>),
    /// `CASE WHEN cond THEN a ELSE b END`; an unknown condition takes the ELSE branch.
    Case(Box<Ex>, Box<Ex>, Box<Ex>),
}

// ---- three-valued logic, in one place -----------------------------------------------------------------------------------------------

pub fn and3(a: Val, b: Val) -> Val {
    if a == Some(0) || b == Some(0) { return Some(0); }
    if a.is_none() || b.is_none() { None } else { Some(1) }
}
pub fn or3(a: Val, b: Val) -> Val {
    if a.is_some_and(|x| x != 0) || b.is_some_and(|x| x != 0) { return Some(1); }
    if a.is_none() || b.is_none() { None } else { Some(0) }
}
pub fn not3(a: Val) -> Val { a.map(|x| (x == 0) as i64) }
pub fn cmp3(op: Cmp, a: Val, b: Val) -> Val {
    let (a, b) = (a?, b?);
    Some(match op { Cmp::Lt => a < b, Cmp::Le => a <= b, Cmp::Eq => a == b, Cmp::Ne => a != b, Cmp::Ge => a >= b, Cmp::Gt => a > b } as i64)
}
pub fn bin3(op: B, a: Val, b: Val) -> Val {
    let (a, b) = (a?, b?);
    match op { B::Add => Some(a.wrapping_add(b)), B::Sub => Some(a.wrapping_sub(b)), B::Mul => Some(a.wrapping_mul(b)), B::Div => a.checked_div(b) }
}
fn truthy(v: Val) -> bool { v.is_some_and(|x| x != 0) }

// ---- the tree-walking reference ------------------------------------------------------------------------------------------------------

pub fn eval_tree(e: &Ex, t: &Table, row: usize) -> Val {
    match e {
        Ex::Col(c) => t.cols[*c].at(row), Ex::Lit(v) => *v,
        Ex::Bin(op, a, b) => bin3(*op, eval_tree(a, t, row), eval_tree(b, t, row)),
        Ex::Cmp(op, a, b) => cmp3(*op, eval_tree(a, t, row), eval_tree(b, t, row)),
        Ex::And(a, b) => and3(eval_tree(a, t, row), eval_tree(b, t, row)),
        Ex::Or(a, b) => or3(eval_tree(a, t, row), eval_tree(b, t, row)),
        Ex::Not(a) => not3(eval_tree(a, t, row)),
        Ex::IsNull(a) => Some(eval_tree(a, t, row).is_none() as i64),
        Ex::Case(c, a, b) => if truthy(eval_tree(c, t, row)) { eval_tree(a, t, row) } else { eval_tree(b, t, row) },
    }
}

// ---- closure compilation -----------------------------------------------------------------------------------------------------------

pub type Compiled = Box<dyn Fn(&Table, usize) -> Val>;
pub fn compile_closure(e: &Ex) -> Compiled {
    match e {
        Ex::Col(c) => { let c = *c; Box::new(move |t, r| t.cols[c].at(r)) }
        Ex::Lit(v) => { let v = *v; Box::new(move |_, _| v) }
        Ex::Bin(op, a, b) => { let (op, a, b) = (*op, compile_closure(a), compile_closure(b)); Box::new(move |t, r| bin3(op, a(t, r), b(t, r))) }
        Ex::Cmp(op, a, b) => { let (op, a, b) = (*op, compile_closure(a), compile_closure(b)); Box::new(move |t, r| cmp3(op, a(t, r), b(t, r))) }
        Ex::And(a, b) => { let (a, b) = (compile_closure(a), compile_closure(b)); Box::new(move |t, r| { let x = a(t, r); if x == Some(0) { x } else { and3(x, b(t, r)) } }) }
        Ex::Or(a, b) => { let (a, b) = (compile_closure(a), compile_closure(b)); Box::new(move |t, r| { let x = a(t, r); if truthy(x) { Some(1) } else { or3(x, b(t, r)) } }) }
        Ex::Not(a) => { let a = compile_closure(a); Box::new(move |t, r| not3(a(t, r))) }
        Ex::IsNull(a) => { let a = compile_closure(a); Box::new(move |t, r| Some(a(t, r).is_none() as i64)) }
        Ex::Case(c, a, b) => { let (c, a, b) = (compile_closure(c), compile_closure(a), compile_closure(b)); Box::new(move |t, r| if truthy(c(t, r)) { a(t, r) } else { b(t, r) }) }
    }
}

// ---- bytecode ----------------------------------------------------------------------------------------------------------------------

pub type Reg = u16;
#[derive(Clone, Copy, Debug)]
pub enum Op {
    Col(Reg, u16), Lit(Reg, i64), Null(Reg), Move(Reg, Reg),
    Bin(B, Reg, Reg, Reg), Cmp(Cmp, Reg, Reg, Reg), And(Reg, Reg, Reg), Or(Reg, Reg, Reg), Not(Reg, Reg), IsNull(Reg, Reg),
    /// Superinstructions: the right operand is an integer constant, so no register is loaded for it.
    BinK(B, Reg, Reg, i64), CmpK(Cmp, Reg, Reg, i64),
    /// Normalize a truth value to 0, 1 or NULL.
    Norm(Reg),
    /// Jump if the register holds a definite false / a definite true / anything but true (false or NULL).
    JumpIfFalse(Reg, u32), JumpIfTrue(Reg, u32), JumpIfNotTrue(Reg, u32), Jump(u32),
    /// Start the scan: jump to the first operand if the table is empty.
    Rewind(u32),
    /// Advance to the next row and jump back to the loop body if there is one.
    Next(u32),
    AggStep(u16, AggFn, Reg),
    /// Emit a result row from `n` consecutive registers starting at the first.
    Result(Reg, u16),
    Halt,
}

#[derive(Debug, Clone)]
pub struct Program { pub ops: Vec<Op>, pub nregs: usize, pub aggs: Vec<AggFn> }

/// `SELECT outputs FROM t WHERE filter`, or `SELECT aggregates FROM t WHERE filter` (outputs and aggregates are not mixed).
#[derive(Clone, Debug)]
pub struct Query { pub filter: Option<Ex>, pub outputs: Vec<Ex>, pub aggs: Vec<(AggFn, Ex)> }

/// Fold subtrees without columns into literals (using the same three-valued operators the machine uses).
pub fn fold(e: &Ex) -> Ex {
    let is_const = |x: &Ex| matches!(x, Ex::Lit(_));
    let e2 = match e {
        Ex::Col(_) | Ex::Lit(_) => return e.clone(),
        Ex::Bin(o, a, b) => Ex::Bin(*o, Box::new(fold(a)), Box::new(fold(b))),
        Ex::Cmp(o, a, b) => Ex::Cmp(*o, Box::new(fold(a)), Box::new(fold(b))),
        Ex::And(a, b) => Ex::And(Box::new(fold(a)), Box::new(fold(b))),
        Ex::Or(a, b) => Ex::Or(Box::new(fold(a)), Box::new(fold(b))),
        Ex::Not(a) => Ex::Not(Box::new(fold(a))),
        Ex::IsNull(a) => Ex::IsNull(Box::new(fold(a))),
        Ex::Case(c, a, b) => Ex::Case(Box::new(fold(c)), Box::new(fold(a)), Box::new(fold(b))),
    };
    let all_const = match &e2 {
        Ex::Bin(_, a, b) | Ex::Cmp(_, a, b) | Ex::And(a, b) | Ex::Or(a, b) => is_const(a) && is_const(b),
        Ex::Not(a) | Ex::IsNull(a) => is_const(a),
        Ex::Case(c, a, b) => is_const(c) && is_const(a) && is_const(b),
        _ => false,
    };
    if all_const { Ex::Lit(eval_tree(&e2, &Table { cols: vec![], n: 0 }, 0)) } else { e2 }
}

struct Gen { ops: Vec<Op>, next_reg: u16, max_reg: u16 }
impl Gen {
    fn alloc(&mut self) -> Reg { let r = self.next_reg; self.next_reg += 1; self.max_reg = self.max_reg.max(self.next_reg); r }
    fn emit(&mut self, op: Op) -> usize { self.ops.push(op); self.ops.len() - 1 }
    fn here(&self) -> u32 { self.ops.len() as u32 }
    fn patch(&mut self, at: usize, target: u32) {
        match &mut self.ops[at] { Op::JumpIfFalse(_, t) | Op::JumpIfTrue(_, t) | Op::JumpIfNotTrue(_, t) | Op::Jump(t) | Op::Rewind(t) | Op::Next(t) => *t = target, o => panic!("not a jump: {o:?}") }
    }
    /// Emit code that leaves the value of `e` in `dst`. Temporaries are released when the subtree is done.
    fn expr(&mut self, e: &Ex, dst: Reg) {
        let mark = self.next_reg;
        match e {
            Ex::Col(c) => { self.emit(Op::Col(dst, *c as u16)); }
            Ex::Lit(Some(v)) => { self.emit(Op::Lit(dst, *v)); }
            Ex::Lit(None) => { self.emit(Op::Null(dst)); }
            Ex::Bin(op, a, b) => match **b {
                Ex::Lit(Some(k)) => { let ra = self.operand(a, dst); self.emit(Op::BinK(*op, dst, ra, k)); }
                _ => { let (ra, rb) = (self.operand(a, dst), self.operand_tmp(b)); self.emit(Op::Bin(*op, dst, ra, rb)); }
            },
            Ex::Cmp(op, a, b) => match **b {
                Ex::Lit(Some(k)) => { let ra = self.operand(a, dst); self.emit(Op::CmpK(*op, dst, ra, k)); }
                _ => { let (ra, rb) = (self.operand(a, dst), self.operand_tmp(b)); self.emit(Op::Cmp(*op, dst, ra, rb)); }
            },
            Ex::Not(a) => { let ra = self.operand(a, dst); self.emit(Op::Not(dst, ra)); }
            Ex::IsNull(a) => { let ra = self.operand(a, dst); self.emit(Op::IsNull(dst, ra)); }
            Ex::And(a, b) => {
                // a false left side decides the result: skip the right side
                self.expr(a, dst);
                let j = self.emit(Op::JumpIfFalse(dst, 0));
                let rb = self.operand_tmp(b);
                self.emit(Op::And(dst, dst, rb));
                let end = self.here(); self.patch(j, end);
            }
            Ex::Or(a, b) => {
                self.expr(a, dst);
                self.emit(Op::Norm(dst));
                let j = self.emit(Op::JumpIfTrue(dst, 0));
                let rb = self.operand_tmp(b);
                self.emit(Op::Or(dst, dst, rb));
                let end = self.here(); self.patch(j, end);
            }
            Ex::Case(c, a, b) => {
                let rc = self.operand_tmp(c);
                let jelse = self.emit(Op::JumpIfNotTrue(rc, 0));
                self.expr(a, dst);
                let jend = self.emit(Op::Jump(0));
                let else_at = self.here(); self.patch(jelse, else_at);
                self.expr(b, dst);
                let end = self.here(); self.patch(jend, end);
            }
        }
        self.next_reg = mark;
    }
    /// The left operand is computed in the destination itself.
    fn operand(&mut self, e: &Ex, dst: Reg) -> Reg { self.expr(e, dst); dst }
    fn operand_tmp(&mut self, e: &Ex) -> Reg { let r = self.alloc(); self.expr(e, r); r }
}

pub fn compile(q: &Query) -> Program {
    let mut g = Gen { ops: vec![], next_reg: 0, max_reg: 0 };
    let rewind = g.emit(Op::Rewind(0));
    let body = g.here();
    let mut skip = None;
    if let Some(f) = &q.filter {
        let r = g.alloc();
        g.expr(&fold(f), r);
        skip = Some(g.emit(Op::JumpIfNotTrue(r, 0)));
        g.next_reg = 0;
    }
    if q.aggs.is_empty() {
        let base = g.next_reg;
        let regs: Vec<Reg> = (0..q.outputs.len()).map(|_| g.alloc()).collect();
        for (e, r) in q.outputs.iter().zip(&regs) { g.expr(&fold(e), *r); }
        g.emit(Op::Result(base, q.outputs.len() as u16));
    } else {
        for (i, (f, e)) in q.aggs.iter().enumerate() {
            let r = g.alloc();
            g.expr(&fold(e), r);
            g.emit(Op::AggStep(i as u16, *f, r));
            g.next_reg = 0;
        }
    }
    let next = g.here();
    if let Some(s) = skip { g.patch(s, next); }
    g.emit(Op::Next(body));
    let end = g.here();
    g.patch(rewind, end);
    g.emit(Op::Halt);
    Program { nregs: g.max_reg as usize + 1, aggs: q.aggs.iter().map(|a| a.0).collect(), ops: g.ops }
}

#[derive(Clone, Copy, Default)]
struct Acc { sum: i64, cnt: u64, min: i64, max: i64, seen: bool }

/// Run a program over a table. Returns the result rows (for a projection) or one row of aggregates.
pub fn run(p: &Program, t: &Table) -> Vec<Vec<Val>> {
    let mut regs: Vec<Val> = vec![None; p.nregs];
    let mut accs = vec![Acc::default(); p.aggs.len()];
    let mut out = vec![];
    let (mut pc, mut row) = (0usize, 0usize);
    loop {
        match p.ops[pc] {
            Op::Col(d, c) => regs[d as usize] = t.cols[c as usize].at(row),
            Op::Lit(d, v) => regs[d as usize] = Some(v),
            Op::Null(d) => regs[d as usize] = None,
            Op::Move(d, s) => regs[d as usize] = regs[s as usize],
            Op::Bin(o, d, a, b) => regs[d as usize] = bin3(o, regs[a as usize], regs[b as usize]),
            Op::Cmp(o, d, a, b) => regs[d as usize] = cmp3(o, regs[a as usize], regs[b as usize]),
            Op::BinK(o, d, a, k) => regs[d as usize] = bin3(o, regs[a as usize], Some(k)),
            Op::CmpK(o, d, a, k) => regs[d as usize] = cmp3(o, regs[a as usize], Some(k)),
            Op::And(d, a, b) => regs[d as usize] = and3(regs[a as usize], regs[b as usize]),
            Op::Or(d, a, b) => regs[d as usize] = or3(regs[a as usize], regs[b as usize]),
            Op::Not(d, a) => regs[d as usize] = not3(regs[a as usize]),
            Op::IsNull(d, a) => regs[d as usize] = Some(regs[a as usize].is_none() as i64),
            Op::Norm(d) => regs[d as usize] = regs[d as usize].map(|x| (x != 0) as i64),
            Op::JumpIfFalse(r, to) => if regs[r as usize] == Some(0) { pc = to as usize; continue; },
            Op::JumpIfTrue(r, to) => if truthy(regs[r as usize]) { pc = to as usize; continue; },
            Op::JumpIfNotTrue(r, to) => if !truthy(regs[r as usize]) { pc = to as usize; continue; },
            Op::Jump(to) => { pc = to as usize; continue; }
            Op::Rewind(end) => if t.n == 0 { pc = end as usize; continue; },
            Op::Next(body) => { row += 1; if row < t.n { pc = body as usize; continue; } }
            Op::AggStep(slot, f, r) => {
                let a = &mut accs[slot as usize];
                match f {
                    AggFn::CountStar => a.cnt += 1,
                    _ => if let Some(x) = regs[r as usize] { a.sum = a.sum.wrapping_add(x); a.cnt += 1; if !a.seen || x < a.min { a.min = x; } if !a.seen || x > a.max { a.max = x; } a.seen = true; },
                }
            }
            Op::Result(base, n) => out.push(regs[base as usize..(base + n) as usize].to_vec()),
            Op::Halt => break,
        }
        pc += 1;
    }
    if !p.aggs.is_empty() {
        out.push(accs.iter().zip(&p.aggs).map(|(a, f)| match f {
            AggFn::CountStar | AggFn::Count => Some(a.cnt as i64),
            AggFn::Sum => a.seen.then_some(a.sum), AggFn::Min => a.seen.then_some(a.min), AggFn::Max => a.seen.then_some(a.max),
        }).collect());
    }
    out
}

/// The reference: the same query run row by row on the expression trees.
pub fn run_tree(q: &Query, t: &Table) -> Vec<Vec<Val>> {
    let mut accs = vec![Acc::default(); q.aggs.len()];
    let mut out = vec![];
    for row in 0..t.n {
        if let Some(f) = &q.filter { if !truthy(eval_tree(f, t, row)) { continue; } }
        if q.aggs.is_empty() { out.push(q.outputs.iter().map(|e| eval_tree(e, t, row)).collect()); }
        for (a, (f, e)) in accs.iter_mut().zip(&q.aggs) {
            match f {
                AggFn::CountStar => a.cnt += 1,
                _ => if let Some(x) = eval_tree(e, t, row) { a.sum = a.sum.wrapping_add(x); a.cnt += 1; if !a.seen || x < a.min { a.min = x; } if !a.seen || x > a.max { a.max = x; } a.seen = true; },
            }
        }
    }
    if !q.aggs.is_empty() {
        out.push(accs.iter().zip(&q.aggs).map(|(a, (f, _))| match f {
            AggFn::CountStar | AggFn::Count => Some(a.cnt as i64),
            AggFn::Sum => a.seen.then_some(a.sum), AggFn::Min => a.seen.then_some(a.min), AggFn::Max => a.seen.then_some(a.max),
        }).collect());
    }
    out
}

/// A readable listing, like SQLite's `EXPLAIN`.
pub fn disassemble(p: &Program) -> String {
    p.ops.iter().enumerate().map(|(i, o)| format!("{i:>3}  {o:?}")).collect::<Vec<_>>().join("\\n")
}
