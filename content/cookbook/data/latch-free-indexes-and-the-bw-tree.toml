[[sections]]
heading = "Tests that can fail"
body = """
<ul> <li><strong>Sequential model test</strong>: random inserts, removes, gets and range scans against <code>BTreeMap</code>, with chain thresholds 2, 4, 8 and 16 and key spaces from 100 to 50 000 (so both tiny trees with constant consolidation and trees with hundreds of leaves are covered).</li> <li><strong>Concurrent oracle test</strong>: 8 threads, each owning the keys ≡ <em>w</em> (mod 8) so its private <code>BTreeMap</code> is an exact oracle for <em>its</em> keys even while other threads split and consolidate the shared leaves; each thread checks every <code>get</code> against its model (a lost update fails immediately), then the final scan must equal the union of all models. A <strong>scanner thread runs throughout</strong> and asserts every range it reads is strictly sorted with no duplicates.</li> <li><strong>Contended inserts</strong>: 8 threads insert the <em>same</em> 30 000 ascending keys with different values; the result must contain each key exactly once with a value from some thread.</li> </ul>

```text title="structure after the tests"
seed 3: 23053 keys, 128 leaves, 127 splits, 2803 consolidations, longest chain 15
8 writers × 100k ops: 117553 keys, 614 leaves, 613 splits, 75645 consolidations, longest chain 7
8 threads inserting the same 30k ascending keys: 136 leaves after 135 splits
```
"""

[[sections]]
heading = "Measured"
body = """
<p>200 000 pre-loaded keys, uniform random keys, 300 000 operations per thread, million operations per second (whole machine):</p>

```text title="Bw-tree vs one RwLock<BTreeMap> vs 64 mutex-protected shards"
workload        threads      Bw-tree  RwLock<BTree>      64 shards
95% reads             1        15.43          13.70          16.91   (M ops/s)
95% reads             2        23.78          12.66          23.48   (M ops/s)
95% reads             4        41.35           6.91          31.18   (M ops/s)
95% reads             8        75.97           5.11          43.02   (M ops/s)
50% writes            1         6.85          13.50          16.23   (M ops/s)
50% writes            2        11.76          12.58          21.85   (M ops/s)
50% writes            4        19.67           7.25          28.58   (M ops/s)
50% writes            8        30.17           4.34          23.77   (M ops/s)
```

<ul> <li><strong>Reads scale</strong>: the Bw-tree reaches 76 M ops/s on 8 threads, <strong>5× the single-thread rate</strong> and 15× the one-lock design, which <em>gets slower</em> with threads (13.7 → 5.1) as readers fight over one reader-count word.</li> <li><strong>Writes: not the best at low thread counts.</strong> One thread inserts at 6.9 M/s versus 13–16 for the lock-based maps, since every update <strong>allocates a delta</strong> and later a consolidated page; the single-lock map collapses at 8 threads (4.3) and the Bw-tree overtakes the 64-shard map (30.2 vs 23.8) once contention appears.</li> <li>A <strong>well-sharded plain B-tree is a strong baseline</strong>: it wins on both workloads at 1–4 threads, which is the kind of finding the OpenBw-Tree paper reports.</li> </ul>

```text title="chain-length threshold (4 threads)"
 threshold   read M ops/s  write M ops/s
         2          35.57           5.28
         4          45.46           9.94
         8          48.47          16.25
        16          41.82          19.92
        32          29.53          18.20
        64          23.01          12.16
```

<p>The threshold is a <strong>read–write trade-off</strong>: short chains read fast but consolidate (and allocate) constantly; long chains make writes cheap but force every read to walk them. Reads peak near 8, writes near 16; 8–16 is the usual compromise (the paper's default is similar).</p>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Raw pointers and <code>unsafe</code> are the honest tool here.</strong> The CAS target is a pointer in an <code>AtomicPtr&lt;Node&gt;</code>; Rust's ownership can't express "this node is shared by readers until nobody can see it". Confine every <code>unsafe</code> to <strong>five small operations</strong> (deref, CAS-publish, retire, drop) and document the invariant for each: <em>every node reachable from the table stays allocated until the tree drops</em>.</li> <li><strong>Ordering</strong>: publish with <code>AcqRel</code> on the successful CAS (so the node's contents are visible to any thread that loads the pointer with <code>Acquire</code>); a failed CAS needs only <code>Acquire</code>. Plain <code>Relaxed</code> would let a reader see a node whose fields aren't initialized yet on ARM.</li> <li><strong>Allocate then CAS then maybe free</strong>: on CAS failure the new node is still exclusively yours, so reclaiming it with <code>Box::from_raw</code> is safe; on success never touch it again except through the structure.</li> <li><strong><code>Send</code>/<code>Sync</code> by hand</strong> (<code>unsafe impl</code>) is a promise: the type must really be safe to share. Test it with ThreadSanitizer (<code>RUSTFLAGS=-Zsanitizer=thread</code>), Miri (single-threaded UB), and <strong>loom</strong> (exhaustive interleavings of a small model).</li> <li><strong>Preallocate the mapping table</strong> (<code>Vec&lt;AtomicPtr&lt;_&gt;&gt;</code> of fixed size). Growing it concurrently is a design problem of its own; real implementations use a chunked or paged table.</li> <li><strong>A double-free</strong> appeared during development: a lost split race retired the right page <em>and</em> left it in the table, so <code>Drop</code> freed it twice. Rule: a node must have <strong>exactly one owner list</strong> (table or retired), never both.</li> </ul></aside>

<aside data-call="warning"><b>Latch-free pitfalls</b><ul> <li><strong>ABA</strong>: a CAS succeeds when the pointer value is the same, even if the object behind it was freed and reallocated. Here retired nodes are never reused, which sidesteps it; with a freelist you need tagged pointers or epochs.</li> <li><strong>Safe memory reclamation is the hard part</strong>: epoch-based reclamation (a thread announces the epoch it entered; garbage retired in epoch <em>e</em> is freed when all threads have reached <em>e + 2</em>), hazard pointers (publish what you're about to dereference), or reference counts (slow). Pick one <em>before</em> writing the data structure.</li> <li><strong>Starvation</strong>: lock-free ≠ wait-free; a thread can retry indefinitely under extreme contention. Bound retries and fall back (help, back off, or lock).</li> <li><strong>Readers and long chains</strong>: if consolidation falls behind (one slow thread, high write rate), chains grow and <em>all</em> reads pay.</li> <li><strong>Range scans are not snapshots</strong>: the scan above reads each leaf consistently, but concurrent updates can appear in later leaves and not earlier ones. Transactional isolation comes from MVCC on top (<a href="/cookbook/p/mvcc-protocols-compared">A3</a>).</li> <li><strong>Debugging</strong>: heisenbugs. Add counters (retries, consolidations), assertions on structure invariants, and a deterministic single-threaded replay mode.</li> </ul></aside>

<aside data-call="production"><b>Latch-free and lock-free indexes in practice</b><ul> <li><strong>Hekaton (SQL Server)</strong>: latch-free hash indexes and the <strong>Bw-tree</strong> for range indexes; <strong>Azure Cosmos DB</strong> uses a Bw-tree-based engine; <strong>Peloton / NoisePage</strong> (CMU) used the OpenBw-Tree.</li> <li><strong>MemSQL / SingleStore</strong>: lock-free <strong>skip lists</strong>; <strong>RocksDB/LevelDB memtables</strong> use (concurrent) skip lists; <strong>Redis</strong> sorted sets use skip lists.</li> <li><strong>Most B+Tree engines</strong> (LMDB: copy-on-write with a single writer; InnoDB, PostgreSQL: latch crabbing; HyPer/Umbra/DuckDB: <strong>OLC</strong> with ART) <em>don't</em> go fully latch-free.</li> <li><strong>Lock-free hash tables</strong> (split-ordered lists, Cliff Click's NBHM, libcuckoo) are widely used for point lookups where order isn't needed.</li> </ul></aside>
"""

