[[sections]]
heading = "Where you would use it"
body = """
query operators that must work when the data does not fit in memory (**order by**, **group by**, **distinct**).
"""

[[sections]]
heading = "Common uses"
body = """
the external sort behind **order by** and sort-merge join in PostgreSQL (tuplesort: quicksorted runs or replacement selection historically, then a tape merge), spilling hash aggregation in PostgreSQL 13+, DuckDB and Spark, LSM-tree compaction and MapReduce shuffle (both are k-way merges of sorted runs), and top-N ('ORDER BY ..

**Limit** n') planned as a bounded heap instead of a sort. Course: CMU 15-445 Intro to Database Systems, Lecture 11 (External sorting, aggregations).
"""

[[sections]]
heading = "Design notes"
body = """
**Model**: pages are 256 bytes; a tuple `(key u64, val i64)` is 16 bytes (16 per page), an aggregate state `(key, count, sum, min, max)` is 40 bytes (6 per page). A memory budget is B pages. Every file access is counted in **pages**, the unit the textbook cost formulas use.

Files are `Vec`s; no real IO is needed to see the algorithms and their costs. **External merge sort**: pass 0 makes sorted **runs** of at most B pages (quicksort the buffer), then each merge pass merges up to B-1 runs at a time (B-1 input buffers + 1 output buffer) with a heap-based k-way merge (a loser tree does about half the comparisons; the IO is the same).

Number of passes = 1 + ceil(log&#95;{B-1}(ceil(N/B))), and each pass reads and writes all N pages, so IO = 2N &#42; passes (asserted exactly).

**Replacement selection** instead keeps a heap of B-2 pages: emit the smallest key not below the last emitted one, else park the tuple for the next run; runs average 2x the memory on random input (fewer runs, sometimes a pass less), one run for sorted input, and degrade to memory-sized runs on reverse-sorted input.

**Double buffering** prefetches the next page of every input run while the CPU merges the current one, hiding IO latency (we count blocking "exposed" reads) at the price of halving the fan-in, hence possibly more passes. TOP-N: `ORDER BY key LIMIT n` keeps a bounded max-heap of n tuples: one sequential read of the input and no writes.

**Hash aggregation** with a memory budget of (B-1)&#42;6 groups: **phase** 1 partitions by hash into B-1 partition files, **phase** 2 aggregates each partition in memory with a different hash; a partition that still has too many distinct groups is **re-partitioned** recursively with a new hash seed (skew), and after a depth cap it falls back to **sort-based** aggregation (always terminates, even if the hash is adversarial).

**Early/partial aggregation** keeps a table during phase 1 and spills partial states only when it fills, so if the groups fit in memory nothing is written at all, and duplicates are combined before they hit the disk. **Sort-based** aggregation sorts then combines neighbours and delivers sorted output for free.
"""

[[sections]]
heading = "Verification"
body = """
300 random relations (uniform, skewed, single hot key, all-equal, sorted, reverse, all-distinct; sizes 0..3000; budgets of 3 to 32 pages) are sorted by 4 variants and compared with `sort`; the passes formula and the exact IO are asserted; top-N equals the sort prefix; COUNT/SUM/MIN/MAX/AVG from grace-hash, early-hash and sort aggregation equal a `HashMap` oracle, as do both **distinct** variants.

Targeted cases assert replacement-selection run lengths (about 2M on random data, 1 run sorted, M reverse), forced recursion and forced sort fallback, and that early aggregation does zero spill IO when the groups fit.
"""

