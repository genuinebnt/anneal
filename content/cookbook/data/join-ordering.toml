[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>The problem</strong>: given a query graph (relations as nodes, join predicates as edges) pick the join <strong>tree</strong> (and later the algorithms) with the lowest estimated cost. The space is huge: for <em>n</em> relations there are <em>n!</em> left-deep orders and (2n−2)!/(n−1)! bushy trees with cross products (<strong>17.6 billion for n = 10</strong>).</li> <li><strong>Dynamic programming works because the cost is additive</strong>: the best plan for a <em>set</em> of relations is built from the best plans of two disjoint subsets, so each set is solved once (the principle of optimality; true for <code>C_out</code>, the sum of join output sizes). Restricting to <strong>cross-product-free</strong> plans removes most of the space and is what real optimizers do (a query with no predicate between two parts is the exception).</li> <li><strong>Three bottom-up enumerators</strong>, same answers, different work: <strong>DPsize</strong> (combine plans by increasing size; most pairs it tries are overlapping or unconnected), <strong>DPsub</strong> (for each subset try every split; always examines ~3ⁿ/2 pairs even for a chain), <strong>DPccp</strong> (Moerkotte &amp; Neumann) enumerates <strong>exactly the connected-subgraph/connected-complement pairs</strong> and nothing else: its work equals the number of <em>valid</em> pairs: (n³−n)/6 for a chain, (n−1)·2ⁿ⁻² for a star, (n³−2n²+n)/2 for a cycle, (3ⁿ−2ⁿ⁺¹+1)/2 for a clique.</li> <li><strong>Left-deep vs bushy</strong>: left-deep (System R) keeps the right input a base relation: a smaller space, plans that pipeline well and suit index nested-loop joins, but it can be arbitrarily worse than the best bushy plan on chains and cycles. Hash-join engines also use right-deep shapes.</li> <li><strong>Beyond inner joins</strong>: outer, semi and anti joins are not freely commutative or associative, and predicates over three or more relations are <strong>hyperedges</strong>; <strong>DPhyp</strong> extends DPccp to hypergraphs, and <em>conflict detection</em> (CD-A/B/C) decides which reorderings are legal for non-inner joins.</li> <li><strong>Top-down enumeration</strong> (Cascades, <a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>): a memo of groups plus a <strong>partitioning algorithm</strong> that, given a set, produces each valid split once (MinCutLazy, MinCutBranch), with branch-and-bound pruning from a cost bound. A <strong>transformational</strong> approach (apply commutativity/associativity rules) generates the same plans many times unless the rule set is designed to avoid duplicates.</li> <li><strong>Large queries</strong> (dozens to hundreds of relations) break exact DP (a clique of 20 has 1.7 billion pairs): use <strong>polynomial heuristics</strong>: <strong>IKKBZ</strong> (the <em>optimal</em> left-deep order for tree queries under an ASI cost, polynomial), <strong>GOO</strong> (greedy: join the pair with the smallest result), <strong>randomized search</strong> (iterative improvement, simulated annealing, PostgreSQL's genetic GEQO), or <strong>adaptive</strong> schemes (Neumann &amp; Radke): use DP while it fits a budget, otherwise <strong>linearize</strong> the query with a good order and run <strong>DP restricted to intervals of that order</strong>, which stays polynomial (O(n³)) and finds bushy plans.</li> <li><strong>Properties multiply states</strong>: interesting orders (<a href="/cookbook/p/optimizer-architectures">Q1</a>) and distribution make the DP table <code>|sets| × |properties|</code>.</li> </ul>
"""

[[sections]]
heading = "A join-order lab"
body = """
<p>The experiment bench is a <strong>query graph</strong> (≤ 64 relations; chains, stars, cycles, cliques, random trees, random cyclic graphs) with base cardinalities between 10² and 10⁶ and selectivities chosen so the full result has ~10⁵ rows, and the <strong><code>C_out</code></strong> cost (sum of the cardinalities of all join outputs, assuming independence). The module implements:</p>

<ol> <li><strong>DPsize, DPsub, DPccp</strong>: bushy, cross-product-free, with counters for <em>pairs tested</em> and <em>pairs valid</em>.</li> <li><strong>Left-deep DP</strong> (System R's restriction) and an <strong>exhaustive oracle</strong> that enumerates every tree without any DP (for n ≤ 8).</li> <li><strong>GOO</strong>, <strong>simulated annealing</strong> over left-deep orders (swap moves, geometric cooling; cross products allowed but expensive), <strong>IKKBZ</strong> (spanning tree for cyclic graphs; rank = (T−1)/C, module merging), and <strong>interval DP</strong> over any linear order.</li> </ol>

:::deeper Reference: query graph generator, DPsize / DPsub / DPccp, left-deep DP, GOO, annealing, IKKBZ, linearized DP, exhaustive oracle
