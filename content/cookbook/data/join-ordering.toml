//! Join enumeration over query graphs: DPsize, DPsub, DPccp (bushy, no cross products), left-deep DP,
//! greedy operator ordering, simulated annealing over left-deep orders, and linearized (interval) DP.
//! Cost model: C_out = sum of the cardinalities of all join results (base scans are free).
use std::collections::HashMap;
use std::hash::BuildHasherDefault;
use crate::wcoj::Fx;

pub struct Rng(pub u64);
impl Rng {
    pub fn next(&mut self, m: u64) -> u64 { self.0 ^= self.0 << 13; self.0 ^= self.0 >> 7; self.0 ^= self.0 << 17; self.0 % m }
    pub fn unit(&mut self) -> f64 { self.next(1 << 53) as f64 / (1u64 << 53) as f64 }
}

/// Relations 0..n (n <= 64), base cardinalities, and a selectivity matrix (1.0 where there is no join predicate).
pub struct Graph { pub n: usize, pub card: Vec<f64>, pub sel: Vec<f64>, pub adj: Vec<u64> }

#[derive(Clone, Copy, PartialEq, Debug)]
pub enum Shape { Chain, Star, Cycle, Clique, Tree, Random }

impl Graph {
    pub fn from_edges(n: usize, edges: &[(usize, usize)], rng: &mut Rng) -> Graph {
        assert!(n >= 1 && n <= 64);
        let card: Vec<f64> = (0..n).map(|_| (10.0f64).powf(2.0 + 4.0 * rng.unit())).collect();      // 1e2 .. 1e6
        // pick selectivities so the full join is about 1e5 rows, then jitter each by a factor in [0.4, 2.5]
        let total_ln: f64 = card.iter().map(|c| c.ln()).sum();
        let per_edge = if edges.is_empty() { 0.0 } else { (1e5f64.ln() - total_ln) / edges.len() as f64 };
        let mut sel = vec![1.0; n * n];
        let mut adj = vec![0u64; n];
        for &(u, v) in edges {
            let s = (per_edge + (rng.unit() * 2.0 - 1.0) * 0.9).exp().min(1.0);
            sel[u * n + v] = s; sel[v * n + u] = s;
            adj[u] |= 1 << v; adj[v] |= 1 << u;
        }
        Graph { n, card, sel, adj }
    }
    pub fn new(shape: Shape, n: usize, rng: &mut Rng) -> Graph {
        let mut e: Vec<(usize, usize)> = vec![];
        match shape {
            Shape::Chain => for i in 1..n { e.push((i - 1, i)) },
            Shape::Star => for i in 1..n { e.push((0, i)) },
            Shape::Cycle => { for i in 1..n { e.push((i - 1, i)) } if n > 2 { e.push((n - 1, 0)) } }
            Shape::Clique => for i in 0..n { for j in i + 1..n { e.push((i, j)) } },
            Shape::Tree => for i in 1..n { e.push((rng.next(i as u64) as usize, i)) },
            Shape::Random => {
                for i in 1..n { e.push((rng.next(i as u64) as usize, i)) }                       // a random tree...
                for _ in 0..n { let (a, b) = (rng.next(n as u64) as usize, rng.next(n as u64) as usize); // ...plus extra edges
                    if a != b && !e.contains(&(a.min(b), a.max(b))) && !e.contains(&(a.max(b), a.min(b))) { e.push((a.min(b), a.max(b))) } }
            }
        }
        Graph::from_edges(n, &e, rng)
    }
    #[inline] pub fn neighbors(&self, set: u64) -> u64 { let mut m = 0; let mut s = set; while s != 0 { m |= self.adj[s.trailing_zeros() as usize]; s &= s - 1; } m & !set }
    pub fn connected(&self, set: u64) -> bool {
        if set == 0 { return false; }
        let mut seen = set & set.wrapping_neg();
        loop { let next = (seen | self.neighbors(seen)) & set; if next == seen { break; } seen = next; }
        seen == set
    }
    /// Product of the selectivities of all predicates between two disjoint sets.
    pub fn cross_sel(&self, a: u64, b: u64) -> f64 {
        let mut s = 1.0; let mut x = a;
        while x != 0 { let u = x.trailing_zeros() as usize; x &= x - 1;
            let mut y = b & self.adj[u];
            while y != 0 { let v = y.trailing_zeros() as usize; y &= y - 1; s *= self.sel[u * self.n + v]; } }
        s
    }
    /// Cardinality of joining the relations in `set` (independence assumption; depends only on the set).
    pub fn card_of(&self, set: u64) -> f64 {
        let mut c = 1.0; let mut s = set; let mut done = 0u64;
        while s != 0 { let u = s.trailing_zeros() as usize; s &= s - 1; c *= self.card[u] * self.cross_sel(1 << u, done); done |= 1 << u; }
        c
    }
}

#[derive(Clone, Debug)]
pub enum Tree { Leaf(usize), Join(Box<Tree>, Box<Tree>) }

impl Tree {
    pub fn set(&self) -> u64 { match self { Tree::Leaf(i) => 1 << i, Tree::Join(a, b) => a.set() | b.set() } }
    /// Recompute the C_out of a tree from scratch; None if some join is a cross product or the sides overlap.
    pub fn cost(&self, g: &Graph) -> Option<f64> {
        match self {
            Tree::Leaf(_) => Some(0.0),
            Tree::Join(a, b) => {
                let (sa, sb) = (a.set(), b.set());
                if sa & sb != 0 || g.neighbors(sa) & sb == 0 { return None; }
                Some(a.cost(g)? + b.cost(g)? + g.card_of(sa | sb))
            }
        }
    }
    pub fn show(&self) -> String { match self { Tree::Leaf(i) => format!("R{i}"), Tree::Join(a, b) => format!("({} ⋈ {})", a.show(), b.show()) } }
}

#[derive(Clone, Copy)]
struct Entry { cost: f64, card: f64, left: u64 }
type Table = HashMap<u64, Entry, BuildHasherDefault<Fx>>;

pub struct Solution { pub cost: f64, pub tree: Tree, pub pairs_tested: u64, pub pairs_valid: u64 }

fn init(g: &Graph) -> Table {
    let mut t = Table::default();
    for i in 0..g.n { t.insert(1 << i, Entry { cost: 0.0, card: g.card[i], left: 0 }); }
    t
}
fn build(t: &Table, set: u64) -> Tree {
    let e = t[&set];
    if e.left == 0 { Tree::Leaf(set.trailing_zeros() as usize) } else { Tree::Join(Box::new(build(t, e.left)), Box::new(build(t, set ^ e.left))) }
}
fn relax(g: &Graph, t: &mut Table, a: u64, b: u64) {
    let (ea, eb) = (t[&a], t[&b]);
    let card = ea.card * eb.card * g.cross_sel(a, b);
    let cost = ea.cost + eb.cost + card;
    let e = t.entry(a | b).or_insert(Entry { cost: f64::INFINITY, card, left: 0 });
    if cost < e.cost { *e = Entry { cost, card, left: a }; }
}
fn finish(g: &Graph, t: Table, tested: u64, valid: u64) -> Solution {
    let all = if g.n == 64 { u64::MAX } else { (1u64 << g.n) - 1 };
    Solution { cost: t[&all].cost, tree: build(&t, all), pairs_tested: tested, pairs_valid: valid }
}

/// DPsize: combine plans by increasing size; most (a, b) combinations are rejected (overlap or not connected).
pub fn dp_size(g: &Graph) -> Solution {
    let mut t = init(g);
    let mut by_size: Vec<Vec<u64>> = vec![vec![]; g.n + 1];
    for i in 0..g.n { by_size[1].push(1 << i); }
    let (mut tested, mut valid) = (0u64, 0u64);
    for s in 2..=g.n {
        for s1 in 1..=s / 2 {
            let s2 = s - s1;
            for (ia, &a) in by_size[s1].clone().iter().enumerate() {
                for (ib, &b) in by_size[s2].clone().iter().enumerate() {
                    if s1 == s2 && ib <= ia { continue; }           // unordered pairs once
                    tested += 1;
                    if a & b != 0 || g.neighbors(a) & b == 0 { continue; }
                    valid += 1;
                    let known = t.contains_key(&(a | b));
                    relax(g, &mut t, a, b);
                    if !known { by_size[s].push(a | b); }
                }
            }
        }
    }
    finish(g, t, tested, valid)
}

/// DPsub: for every subset in numeric order, try all splits into two parts.
pub fn dp_sub(g: &Graph) -> Solution {
    assert!(g.n <= 24);
    let mut t = init(g);
    let (mut tested, mut valid) = (0u64, 0u64);
    for set in 1u64..(1 << g.n) {
        if set.count_ones() < 2 { continue; }
        let low = set & set.wrapping_neg();
        let mut sub = (set - 1) & set;                               // enumerate proper non-empty subsets
        while sub != 0 {
            if sub & low != 0 {                                      // each unordered split once
                tested += 1;
                let other = set ^ sub;
                if t.contains_key(&sub) && t.contains_key(&other) && g.neighbors(sub) & other != 0 { valid += 1; relax(g, &mut t, sub, other); }
            }
            sub = (sub - 1) & set;
        }
    }
    finish(g, t, tested, valid)
}

/// DPccp (Moerkotte & Neumann 2006): enumerates exactly the connected-subgraph / connected-complement pairs.
pub fn dp_ccp(g: &Graph) -> Solution {
    struct St<'a> { g: &'a Graph, t: Table, pairs: u64 }
    fn subsets(n: u64, mut f: impl FnMut(u64)) { if n == 0 { return; } let mut s = n & n.wrapping_neg(); loop { f(s); if s == n { break; } s = (s.wrapping_sub(n)) & n; } }
    fn emit(st: &mut St, a: u64, b: u64) { st.pairs += 1; relax(st.g, &mut st.t, a, b); }
    fn enum_csg_rec(st: &mut St, s: u64, x: u64) {
        let n = st.g.neighbors(s) & !x;
        subsets(n, |sub| emit_csg(st, s | sub));
        subsets(n, |sub| enum_csg_rec(st, s | sub, x | n));
    }
    fn emit_csg(st: &mut St, s1: u64) {
        let min = s1.trailing_zeros();
        let x = s1 | ((1u64 << (min + 1)) - 1);                      // S1 and all relations with index <= min(S1)
        let n = st.g.neighbors(s1) & !x;
        let mut rest = n;
        while rest != 0 {                                            // neighbours in descending order
            let v = 63 - rest.leading_zeros();
            rest &= !(1u64 << v);
            let s2 = 1u64 << v;
            emit(st, s1, s2);
            let below = n & ((1u64 << (v + 1)) - 1);
            enum_cmp_rec(st, s1, s2, x | below);
        }
    }
    fn enum_cmp_rec(st: &mut St, s1: u64, s2: u64, x: u64) {
        let n = st.g.neighbors(s2) & !x;
        subsets(n, |sub| { if st.g.neighbors(s1) & (s2 | sub) != 0 { emit(st, s1, s2 | sub); } });
        subsets(n, |sub| enum_cmp_rec(st, s1, s2 | sub, x | n));
    }
    let mut st = St { g, t: init(g), pairs: 0 };
    for i in (0..g.n).rev() {
        emit_csg(&mut st, 1 << i);
        enum_csg_rec(&mut st, 1 << i, (1u64 << (i + 1)) - 1);
    }
    let pairs = st.pairs;
    finish(g, st.t, pairs, pairs)
}

/// System R style: left-deep trees only (the right input of every join is a base relation), no cross products.
pub fn left_deep(g: &Graph) -> Solution {
    assert!(g.n <= 24);
    let mut t = init(g);
    let (mut tested, mut valid) = (0u64, 0u64);
    for set in 1u64..(1 << g.n) {
        if set.count_ones() < 2 { continue; }
        let mut s = set;
        while s != 0 {
            let r = 1u64 << s.trailing_zeros(); s &= s - 1;
            tested += 1;
            let rest = set ^ r;
            if t.contains_key(&rest) && g.neighbors(rest) & r != 0 { valid += 1; relax(g, &mut t, rest, r); }
        }
    }
    finish(g, t, tested, valid)
}

/// Greedy Operator Ordering: repeatedly join the two connected components with the smallest result.
pub fn goo(g: &Graph) -> (f64, Tree) {
    let mut comps: Vec<(u64, f64, Tree)> = (0..g.n).map(|i| (1u64 << i, g.card[i], Tree::Leaf(i))).collect();
    let mut cost = 0.0;
    while comps.len() > 1 {
        let mut best: Option<(usize, usize, f64)> = None;
        for i in 0..comps.len() { for j in i + 1..comps.len() {
            if g.neighbors(comps[i].0) & comps[j].0 == 0 { continue; }
            let c = comps[i].1 * comps[j].1 * g.cross_sel(comps[i].0, comps[j].0);
            if best.map_or(true, |b| c < b.2) { best = Some((i, j, c)); }
        } }
        let (i, j, c) = best.expect("connected graph");
        let (sj, _, tj) = comps.remove(j);
        let (si, _, ti) = comps.remove(i);
        cost += c;
        comps.push((si | sj, c, Tree::Join(Box::new(ti), Box::new(tj))));
    }
    (cost, comps.pop().unwrap().2)
}

fn order_cost(g: &Graph, order: &[usize]) -> f64 {
    let (mut set, mut card, mut cost) = (1u64 << order[0], g.card[order[0]], 0.0);
    for &r in &order[1..] { card *= g.card[r] * g.cross_sel(1 << r, set); set |= 1 << r; cost += card; }
    cost
}

/// Simulated annealing over left-deep join orders (cross products allowed but expensive). Returns the best cost seen.
pub fn anneal(g: &Graph, iters: usize, seed: u64) -> f64 {
    let mut rng = Rng(seed | 1);
    let mut cur: Vec<usize> = (0..g.n).collect();
    for i in (1..g.n).rev() { cur.swap(i, rng.next(i as u64 + 1) as usize); }
    let mut cur_cost = order_cost(g, &cur);
    let mut best = cur_cost;
    let t0 = cur_cost.ln().max(1.0) * 0.25;
    for it in 0..iters {
        let temp = t0 * (1.0 - it as f64 / iters as f64) + 1e-9;
        let (i, j) = (rng.next(g.n as u64) as usize, rng.next(g.n as u64) as usize);
        if i == j { continue; }
        cur.swap(i, j);
        let c = order_cost(g, &cur);
        let accept = c <= cur_cost || rng.unit() < (-((c.ln() - cur_cost.ln()) / temp)).exp();
        if accept { cur_cost = c; best = best.min(c); } else { cur.swap(i, j); }
    }
    best
}

/// Greedy order: start from the smallest relation, always append the connected relation that keeps the prefix smallest.
pub fn linearize_greedy(g: &Graph) -> Vec<usize> {
    let start = (0..g.n).min_by(|&a, &b| g.card[a].partial_cmp(&g.card[b]).unwrap()).unwrap();
    let (mut order, mut set, mut card) = (vec![start], 1u64 << start, g.card[start]);
    while order.len() < g.n {
        let cand = g.neighbors(set);
        let mut best = (usize::MAX, f64::INFINITY);
        let mut c = cand;
        while c != 0 { let r = c.trailing_zeros() as usize; c &= c - 1;
            let next = card * g.card[r] * g.cross_sel(1 << r, set);
            if next < best.1 { best = (r, next); } }
        order.push(best.0); set |= 1 << best.0; card = best.1;
    }
    order
}

/// IKKBZ (Ibaraki-Kameda, Krishnamurthy-Boral-Zaniolo): the optimal left-deep order for tree queries under an ASI cost
/// such as C_out. For a cyclic graph it runs on the spanning tree of the most selective predicates.
pub fn ikkbz(g: &Graph) -> Vec<usize> {
    // spanning tree: Kruskal over predicates, most selective (smallest selectivity) first
    let mut edges: Vec<(f64, usize, usize)> = vec![];
    for u in 0..g.n { for v in u + 1..g.n { if g.adj[u] >> v & 1 == 1 { edges.push((g.sel[u * g.n + v], u, v)); } } }
    edges.sort_by(|a, b| a.0.partial_cmp(&b.0).unwrap());
    let mut comp: Vec<usize> = (0..g.n).collect();
    fn find(c: &mut Vec<usize>, x: usize) -> usize { let mut r = x; while c[r] != r { r = c[r]; } let mut y = x; while c[y] != r { let n = c[y]; c[y] = r; y = n; } r }
    let mut tree: Vec<Vec<usize>> = vec![vec![]; g.n];
    for (_, u, v) in edges { let (a, b) = (find(&mut comp, u), find(&mut comp, v)); if a != b { comp[a] = b; tree[u].push(v); tree[v].push(u); } }

    #[derive(Clone)] struct Module { seq: Vec<usize>, t: f64, c: f64 }
    impl Module { fn rank(&self) -> f64 { (self.t - 1.0) / self.c } }
    fn solve(g: &Graph, tree: &[Vec<usize>], v: usize, parent: Option<usize>) -> Vec<Module> {
        // merge the children's (rank-ascending) chains, then normalise v against the head of the merged chain
        let mut merged: Vec<Module> = vec![];
        for &c in &tree[v] { if Some(c) == parent { continue; } merged.extend(solve(g, tree, c, Some(v))); }
        merged.sort_by(|a, b| a.rank().partial_cmp(&b.rank()).unwrap());
        let Some(p) = parent else { return merged };
        let t = g.sel[p * g.n + v] * g.card[v];
        let mut me = Module { seq: vec![v], t, c: t };
        while !merged.is_empty() && merged[0].rank() < me.rank() {
            let next = merged.remove(0);
            me = Module { seq: [me.seq, next.seq].concat(), t: me.t * next.t, c: me.c + me.t * next.c };
        }
        merged.insert(0, me);
        merged
    }
    let mut best: Option<(f64, Vec<usize>)> = None;
    for root in 0..g.n {
        let mut order = vec![root];
        for m in solve(g, &tree, root, None) { order.extend(m.seq); }
        let c = order_cost(g, &order);
        if best.as_ref().map_or(true, |b| c < b.0) { best = Some((c, order)); }
    }
    best.unwrap().1
}

/// Linearized DP: optimal bushy plan among those whose every subtree covers a contiguous interval of `order`. O(n^3).
pub fn linear_dp(g: &Graph, order: &[usize]) -> Option<(f64, Tree)> {
    let n = order.len();
    let mut mask = vec![vec![0u64; n]; n];
    let mut card = vec![vec![0f64; n]; n];
    let mut cost = vec![vec![f64::INFINITY; n]; n];
    let mut split = vec![vec![0usize; n]; n];
    for i in 0..n { mask[i][i] = 1 << order[i]; card[i][i] = g.card[order[i]]; cost[i][i] = 0.0; }
    for len in 2..=n { for i in 0..=n - len {
        let j = i + len - 1;
        mask[i][j] = mask[i][j - 1] | (1 << order[j]);
        card[i][j] = card[i][j - 1] * g.card[order[j]] * g.cross_sel(1 << order[j], mask[i][j - 1]);
        for k in i..j {
            if g.neighbors(mask[i][k]) & mask[k + 1][j] == 0 || cost[i][k].is_infinite() || cost[k + 1][j].is_infinite() { continue; }
            let c = cost[i][k] + cost[k + 1][j] + card[i][j];
            if c < cost[i][j] { cost[i][j] = c; split[i][j] = k; }
        }
    } }
    fn rebuild(order: &[usize], split: &[Vec<usize>], i: usize, j: usize) -> Tree {
        if i == j { Tree::Leaf(order[i]) } else { let k = split[i][j]; Tree::Join(Box::new(rebuild(order, split, i, k)), Box::new(rebuild(order, split, k + 1, j))) }
    }
    cost[0][n - 1].is_finite().then(|| (cost[0][n - 1], rebuild(order, &split, 0, n - 1)))
}

/// Exhaustive search over every cross-product-free bushy tree, written without any DP (only for tiny n; the test oracle).
pub fn exhaustive(g: &Graph) -> f64 {
    fn all_trees(g: &Graph, set: u64) -> Vec<(f64, f64)> {      // (cost, card) of every tree over `set`
        if set.count_ones() == 1 { return vec![(0.0, g.card[set.trailing_zeros() as usize])]; }
        let mut out = vec![];
        let low = set & set.wrapping_neg();
        let mut sub = (set - 1) & set;
        while sub != 0 {
            if sub & low != 0 && g.neighbors(sub) & (set ^ sub) != 0 {
                let other = set ^ sub;
                for &(c1, k1) in &all_trees(g, sub) { for &(c2, k2) in &all_trees(g, other) { let k = k1 * k2 * g.cross_sel(sub, other); out.push((c1 + c2 + k, k)); } }
            }
            sub = (sub - 1) & set;
        }
        out
    }
    let all = (1u64 << g.n) - 1;
    all_trees(g, all).into_iter().map(|x| x.0).fold(f64::INFINITY, f64::min)
}

/// Cheap portfolio for queries too big for DP: the best of GOO, IKKBZ + interval DP and greedy + interval DP.
/// Each member is polynomial and they fail on different shapes (IKKBZ on dense cyclic graphs, GOO on long chains).
pub fn portfolio(g: &Graph) -> f64 {
    let a = goo(g).0;
    let b = linear_dp(g, &ikkbz(g)).map_or(f64::INFINITY, |x| x.0);
    let c = linear_dp(g, &linearize_greedy(g)).map_or(f64::INFINITY, |x| x.0);
    a.min(b).min(c)
}
```
:::

<aside data-call="testing"><b>Test plan</b><ul> <li><code>csg_cmp_pair_counts_match_the_closed_forms</code>: DPccp's number of valid pairs equals (n³−n)/6, (n−1)2ⁿ⁻², (n³−2n²+n)/2 and (3ⁿ−2ⁿ⁺¹+1)/2 for chain, star, cycle and clique for every n from 2 to 12. A generator that emitted a pair twice or missed one would break an equation.</li> <li><code>all_enumerators_find_the_same_optimum_as_brute_force</code>: 300 random queries (n = 2…8, all six shapes): DPsize, DPsub and DPccp equal the brute-force optimum; the returned tree's cost is <strong>recomputed from scratch</strong> by an independent evaluator (it also rejects cross products and overlapping inputs); DPccp's valid-pair count equals DPsub's.</li> <li><code>restricted_and_heuristic_searches_are_valid_and_never_beat_the_optimum</code>: left-deep, GOO and linearized DP return valid trees whose recomputed cost equals what they report and is never below the bushy optimum. (Annealing is excluded from that bound: it may use cross products, which can win.)</li> <li><code>ikkbz_is_the_optimal_left_deep_order_on_tree_queries</code>: on 300 random chains, stars and trees, IKKBZ's order is a cross-product-free permutation whose cost <strong>equals the DP optimum over all left-deep orders</strong>. IKKBZ's correctness proof rests on a delicate rank/merge argument, and this is the test that would catch an off-by-one in it.</li> </ul></aside>
"""

