<ul> <li><strong>The enumerators differ in how much they waste, not in what they find</strong>: at n = 12 on a chain DPsub examines <strong>261 625</strong> splits for the <strong>286</strong> that are valid (DPccp: 286, 60× less time); DPsize tests 2 331 pairs on a chain but <strong>894 278 on a star</strong> because nearly every pair of subsets overlaps or is disconnected. On the clique, where <em>every</em> pair is valid, all three do the same ~262 K useful pairs (DPsub is even a little faster: its loop is simpler than DPccp's recursion). The practical limits follow the formulas: a chain of 60 or a cycle of 40 takes single-digit milliseconds, a star of 20 takes 93 ms, but a <strong>clique of 14 already costs 43 ms and each extra relation triples it</strong>.</li> <li><strong>Left-deep is not good enough for chains and cycles</strong>: the best left-deep plan is a median 2.0× worse than the best bushy plan on cycles, and on 10% of chains it is <strong>12.6×</strong> worse (58× at worst); on stars it is always optimal (a star's centre must be joined with everything anyway).</li> <li><strong>Annealing over left-deep orders behaves like the left-deep optimum</strong> (same ratios to two digits): it finds the best order it <em>can express</em>, and it cannot express the bushy plan. A bigger search budget doesn't fix a search space that is too small. On the 60-relation cycle it gets <strong>3 108× worse</strong> than the best known plan: 200 K random swaps are no match for a space of 60! ≈ 8·10⁸¹ orders.</li> <li><strong>IKKBZ + interval DP is excellent exactly where its theory applies</strong>: on chains and trees it is within 1.31× of the <em>optimal bushy</em> plan at worst and finds the best plan for 50–60 relations in under a millisecond (GOO is 3.9× off on the 60-chain). <strong>On dense cyclic graphs it fails badly</strong>: the spanning tree ignores the predicates that make intermediate results small (clique p50 12.5×, random-graph max 4 204×; on a 40-relation random graph IKKBZ's order is 10¹¹× worse than the best).</li> <li><strong>A portfolio is robust</strong>: taking the best of GOO, IKKBZ + DP and greedy-order + DP (all polynomial, ~1 ms for 60 relations) gives <strong>median 1.00</strong> everywhere and p90 ≤ 1.41, worst case 2.69. This is the engineering lesson of adaptive join-order optimization: no heuristic is uniformly good, so run several cheap ones (and DP when the query is small enough) and keep the best by <em>estimated</em> cost.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Relation sets are <code>u64</code> bitmasks</strong>: <code>s &amp; s.wrapping_neg()</code> is the lowest member, <code>s.trailing_zeros()</code> its index, <code>s &amp;= s - 1</code> removes it, and <strong><code>(sub - 1) &amp; set</code></strong> iterates every subset of <code>set</code> in decreasing order (<code>(s - n) &amp; n</code> in increasing order); DPsub and DPccp are almost entirely these four expressions. Limits (≤ 64 relations) are a deliberate choice; use <code>u128</code> or a <code>bitvec</code> for more.</li> <li><strong>Pass the DP table through the recursion by <code>&amp;mut</code></strong>: DPccp's four mutually recursive functions share a <code>St { g, t, pairs }</code> struct; the subset iterator takes <code>impl FnMut(u64)</code> so the callback can mutably borrow the state while the loop owns only the mask. A closure that captured <code>st</code> mutably <em>and</em> the iterator held it would not compile; passing <code>st</code> explicitly keeps the borrow checker happy without <code>RefCell</code>.</li> <li><strong>Sets as keys with a cheap hasher</strong>: <code>HashMap&lt;u64, Entry, BuildHasherDefault&lt;Fx&gt;&gt;</code> (the hasher of <a href="/cookbook/p/multi-way-and-worst-case-optimal-joins">A18</a>); for n ≤ 24 a <code>Vec&lt;Option&lt;Entry&gt;&gt;</code> indexed by the mask is faster still.</li> <li><strong>Trees are <code>Box</code> enums and the oracle recomputes</strong>: <code>Tree::cost(&amp;Graph)</code> recomputes the cost <em>and</em> checks that no join is a cross product; every algorithm is verified against it, so a bug in an algorithm's own cost bookkeeping cannot hide.</li> <li><strong>Sorting floats</strong>: <code>partial_cmp(..).unwrap()</code> panics on NaN; production code uses <code>f64::total_cmp</code>. A NaN cost is a real failure mode (0 × ∞ from an estimate), better caught loudly than silently mis-sorted.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Cost-model dependence</strong>: all of this optimizes <em>estimated</em> cost. A plan that is optimal for <code>C_out</code> can lose under a model that charges for hash-table builds, memory spills or pipeline breaks; and every estimation error (<a href="/cookbook/p/cardinality-estimation">Q8</a>) moves the optimum. DP finds the optimum of the model, not of the machine.</li> <li><strong>Cross products</strong> are sometimes required (disconnected query graphs, or a tiny dimension table that is cheaper to cross first in a star-schema plan); production optimizers allow them under conditions instead of banning them.</li> <li><strong>Outer, semi and anti joins</strong>: associativity and commutativity fail, and ignoring that gives <em>wrong results</em>, not just bad plans. Use DPhyp with hyperedges built from the join's SES/TES (conflict detection), and test rewrites against the oracle (<a href="/cookbook/p/plan-transformations-and-rule-soundness">Q3</a>).</li> <li><strong>Exponential blow-up is shape-dependent</strong>: a planner needs a <strong>budget</strong> (count the connected pairs first, which is cheap relative to costing them, and fall back to heuristics above a threshold), not a fixed relation-count cutoff: a 40-relation chain is trivial, a 15-relation clique is not.</li> <li><strong>Determinism and ties</strong>: equal-cost plans can flip with hash-map iteration order, making plans unstable across runs; sort candidates or break ties by a canonical key.</li> <li><strong>Physical properties</strong>: this lab has none. Real DP keeps the best plan <em>per interesting property</em> (sort order, partitioning), so the table is <code>|sets| × |orders|</code> and pruning must compare plans only within one property class.</li> </ul></aside>
