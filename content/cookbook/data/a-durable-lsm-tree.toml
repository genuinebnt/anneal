[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>An LSM tree turns random writes into sequential ones.</strong> A write is appended to a log and inserted into an in-memory sorted map (the <em>memtable</em>). When the memtable is full it is written out as an immutable sorted file (a <em>table</em>). Reads look in the memtable, then in tables from newest to oldest. Background <em>compaction</em> merges tables so that the number a read must visit stays small. (<a href="/cookbook/p/log-structured-storage">Part I</a> built the idea; this section makes it survive crashes.)</li> <li><strong>Durability comes from the log; atomicity from one record per batch.</strong> A batch of writes is one checksummed log record, appended and <code>fsync</code>ed before the write is acknowledged. After a crash, replay stops at the first record that is torn or fails its checksum, so the recovered state is always a <em>prefix</em> of the batches, and every acknowledged batch is in it.</li> <li><strong>The manifest is the commit point for the file set.</strong> A table is written and synced first; only then does a record in the manifest add it (and name the new log). A file the manifest does not mention is debris from an interrupted flush or compaction, and recovery deletes it. Compaction swaps its inputs for its outputs in one manifest record, so a crash leaves either the old tables or the new ones, never a mix.</li> <li><strong>Leveled compaction trades write amplification for read and space amplification.</strong> Level 0 holds tables flushed straight from the memtable (their key ranges overlap). Levels 1 and up each hold non-overlapping tables and are <code>T</code> times bigger than the one above. A read visits every level-0 table that covers the key but at most one table in each deeper level; the price is that each byte is rewritten by about one compaction per level.</li> <li><strong>Bloom filters make a miss cheap.</strong> A table stores a filter over its keys; a read that the filter rules out skips the table without reading a data block. At 10 bits per key the false-positive rate is about 1%, so a lookup of an absent key reads almost no blocks.</li> <li><strong>Snapshots are sequence numbers.</strong> Every write gets a sequence number; a snapshot is the number at the time it was taken; a read at a snapshot returns the newest version at or below it. Compaction must keep the versions a live snapshot can see and may drop the rest, and may drop a deletion marker only when no deeper level holds an older version of the key.</li> <li><strong>Recovery has to be tested by breaking things.</strong> A simulated disk that loses power after any chosen write and keeps a random prefix of the unsynced bytes finds the bugs that argument misses. The first run of the crash test found one in the manifest.</li> </ul>
"""

[[sections]]
heading = "The pieces"
body = """
```text
write(batch, sync) ─► WAL record [len|crc|first seq, ops…] ─fsync─► memtable (sorted by (key, newest first))
                                                                        │ full
                                                                        ▼ flush: table file, fsync; then MANIFEST edit (+ new WAL); delete old WAL
  L0   t7 t6 t5 t4            (overlapping ranges, newest first)
  L1   [a..f] [g..m] [n..z]   (≤ 4 MB, disjoint)           get(k): memtable → every covering L0 table → one table per level,
  L2   [a..c] [d..h] …        (× T)                          each guarded by its Bloom filter, then one 4 KB block read
```

<ul> <li><strong>Table format</strong>: data blocks of about 4 KB (entries <code>key | seq | kind | value</code>, versions of one key never split across blocks), each followed by a CRC-32; then an index of <code>(last key, offset, length)</code>, the Bloom filter and a footer with its own checksum and magic number.</li> <li><strong>Manifest</strong>: a log of edits (<code>add</code> files, <code>delete</code> files, current log number, last sequence number, next file number), each a checksummed record. On open it is replayed and then <strong>rewritten as a single record</strong>, so the next incarnation never appends behind a torn tail.</li> <li><strong>Compaction</strong>: level 0 into level 1 when it holds four tables; level <code>i</code> into <code>i+1</code> when it exceeds <code>level1 × T&#94;(i−1)</code>, one file at a time with the next level's overlapping files. Output files are cut at user-key boundaries.</li> <li><strong>Garbage collection rule</strong> (<code>keep_versions</code>): keep the newest version of each key and any older version that some live snapshot can see; drop a trailing deletion marker only if nothing deeper can hold older data.</li> </ul>

