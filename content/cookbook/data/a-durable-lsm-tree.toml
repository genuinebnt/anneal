//! A durable log-structured merge tree over a simulated file system that can lose power at any write: a write-ahead log with checksums,
//! a memtable, sorted tables with block checksums and Bloom filters, a manifest of versions, leveled compaction, snapshot reads by
//! sequence number, and crash recovery. Every operation returns `Err(Crashed)` once the simulated power has failed.
use crate::fmtlib::{get_varint, put_varint};
use std::collections::{BTreeMap, HashMap};

#[derive(Debug, PartialEq, Clone)]
pub enum KvError {
    Crashed,
    Corrupt(String),
}
pub type R<T> = Result<T, KvError>;

pub fn crc32(data: &[u8]) -> u32 {
    const T: [u32; 256] = {
        let mut t = [0u32; 256];
        let mut i = 0;
        while i < 256 {
            let mut c = i as u32;
            let mut k = 0;
            while k < 8 {
                c = if c & 1 == 1 {
                    0xEDB88320 ^ (c >> 1)
                } else {
                    c >> 1
                };
                k += 1;
            }
            t[i] = c;
            i += 1;
        }
        t
    };
    !data.iter().fold(!0u32, |c, &b| {
        T[((c ^ b as u32) & 0xFF) as usize] ^ (c >> 8)
    })
}
fn hash64(data: &[u8], seed: u64) -> u64 {
    let mut h = 0xcbf29ce484222325u64 ^ seed.wrapping_mul(0x9e3779b97f4a7c15);
    for &b in data {
        h = (h ^ b as u64).wrapping_mul(0x100000001b3);
    }
    h ^ (h >> 29)
}

// ---- the simulated file system -----------------------------------------------------------------------------------------------------

#[derive(Default, Clone)]
struct F {
    data: Vec<u8>,
    synced: usize,
}
/// Files are append-only byte vectors. Bytes become durable at `sync`; at a power failure every file keeps its synced bytes plus a
/// random prefix of the rest (so a record can be torn anywhere). Creating, renaming and removing files are durable at once.
pub struct SimFs {
    files: BTreeMap<String, F>,
    budget: Option<usize>,
    pub crashed: bool,
    seed: u64,
    pub bytes_written: u64,
    pub bytes_read: u64,
    pub reads: u64,
}
impl SimFs {
    pub fn new() -> SimFs {
        SimFs {
            files: BTreeMap::new(),
            budget: None,
            crashed: false,
            seed: 1,
            bytes_written: 0,
            bytes_read: 0,
            reads: 0,
        }
    }
    /// Fail the power after `events` more file-system operations.
    pub fn crash_after(&mut self, events: usize, seed: u64) {
        self.budget = Some(events);
        self.seed = seed.max(1);
    }
    pub fn restart(&mut self) {
        self.crashed = false;
        self.budget = None;
    }
    fn rnd(&mut self) -> u64 {
        self.seed ^= self.seed << 13;
        self.seed ^= self.seed >> 7;
        self.seed ^= self.seed << 17;
        self.seed
    }
    fn tick(&mut self) -> R<()> {
        if self.crashed {
            return Err(KvError::Crashed);
        }
        if let Some(b) = self.budget.as_mut() {
            if *b == 0 {
                self.crashed = true;
                let names: Vec<String> = self.files.keys().cloned().collect();
                for n in names {
                    let pending = self.files[&n].data.len() - self.files[&n].synced;
                    let keep = if pending == 0 {
                        0
                    } else {
                        (self.rnd() % (pending as u64 + 1)) as usize
                    };
                    let f = self.files.get_mut(&n).unwrap();
                    f.data.truncate(f.synced + keep);
                    f.synced = f.data.len();
                }
                return Err(KvError::Crashed);
            }
            *b -= 1;
        }
        Ok(())
    }
    pub fn append(&mut self, name: &str, b: &[u8]) -> R<()> {
        self.tick()?;
        self.files
            .entry(name.to_string())
            .or_default()
            .data
            .extend_from_slice(b);
        self.bytes_written += b.len() as u64;
        Ok(())
    }
    pub fn sync(&mut self, name: &str) -> R<()> {
        self.tick()?;
        if let Some(f) = self.files.get_mut(name) {
            f.synced = f.data.len();
        }
        Ok(())
    }
    /// Atomically replace `to` by `from` (durable at once, like a rename after an fsync).
    pub fn rename(&mut self, from: &str, to: &str) -> R<()> {
        self.tick()?;
        if let Some(f) = self.files.remove(from) {
            self.files.insert(to.to_string(), f);
        }
        Ok(())
    }
    pub fn remove(&mut self, name: &str) -> R<()> {
        self.tick()?;
        self.files.remove(name);
        Ok(())
    }
    pub fn read(&mut self, name: &str, off: usize, len: usize) -> R<Vec<u8>> {
        if self.crashed {
            return Err(KvError::Crashed);
        }
        let f = self
            .files
            .get(name)
            .ok_or_else(|| KvError::Corrupt(format!("missing file {name}")))?;
        if off + len > f.data.len() {
            return Err(KvError::Corrupt(format!("{name}: read past the end")));
        }
        self.bytes_read += len as u64;
        self.reads += 1;
        Ok(f.data[off..off + len].to_vec())
    }
    pub fn size(&self, name: &str) -> usize {
        self.files.get(name).map_or(0, |f| f.data.len())
    }
    pub fn list(&self) -> Vec<String> {
        self.files.keys().cloned().collect()
    }
    pub fn total_bytes(&self) -> usize {
        self.files.values().map(|f| f.data.len()).sum()
    }
    /// Cut a file to `len` bytes (for torn-write tests).
    pub fn truncate(&mut self, name: &str, len: usize) { if let Some(f) = self.files.get_mut(name) { f.data.truncate(len); f.synced = f.synced.min(len); } }
    /// Flip one byte of a file (for corruption tests).
    pub fn corrupt(&mut self, name: &str, at: usize) {
        if let Some(f) = self.files.get_mut(name) {
            f.data[at] ^= 0x55;
        }
    }
}

// ---- Bloom filter -------------------------------------------------------------------------------------------------------------------

#[derive(Clone, Debug)]
pub struct Bloom {
    bits: Vec<u8>,
    k: u32,
}
impl Bloom {
    pub fn build(keys: &[&[u8]], bits_per_key: usize) -> Bloom {
        let m = (keys.len() * bits_per_key).max(64).div_ceil(8) * 8;
        let k = ((bits_per_key as f64 * 0.69) as u32).clamp(1, 30);
        let mut b = Bloom {
            bits: vec![0; m / 8],
            k,
        };
        for key in keys {
            b.add(key);
        }
        b
    }
    fn probes(&self, key: &[u8]) -> impl Iterator<Item = usize> {
        let (h1, h2) = (hash64(key, 1), hash64(key, 2) | 1);
        let m = self.bits.len() * 8;
        (0..self.k as u64).map(move |i| (h1.wrapping_add(i.wrapping_mul(h2)) % m as u64) as usize)
    }
    fn add(&mut self, key: &[u8]) {
        let ps: Vec<usize> = self.probes(key).collect();
        for p in ps {
            self.bits[p / 8] |= 1 << (p % 8);
        }
    }
    pub fn may_contain(&self, key: &[u8]) -> bool {
        self.probes(key)
            .all(|p| self.bits[p / 8] >> (p % 8) & 1 == 1)
    }
}

// ---- tables ---------------------------------------------------------------------------------------------------------------------------

/// One version of a user key: `(key, sequence number, value)`; `None` is a deletion marker.
pub type Entry = (Vec<u8>, u64, Option<Vec<u8>>);
const MAGIC: u32 = 0x4b565431;

fn enc_entry(e: &Entry, out: &mut Vec<u8>) {
    put_varint(e.0.len() as u64, out);
    out.extend_from_slice(&e.0);
    out.extend_from_slice(&e.1.to_le_bytes());
    match &e.2 {
        Some(v) => {
            out.push(1);
            put_varint(v.len() as u64, out);
            out.extend_from_slice(v);
        }
        None => out.push(0),
    }
}
fn dec_entries(b: &[u8]) -> Vec<Entry> {
    let (mut pos, mut out) = (0, vec![]);
    while pos < b.len() {
        let kl = get_varint(b, &mut pos) as usize;
        let key = b[pos..pos + kl].to_vec();
        pos += kl;
        let seq = u64::from_le_bytes(b[pos..pos + 8].try_into().unwrap());
        pos += 8;
        let kind = b[pos];
        pos += 1;
        let val = if kind == 1 {
            let vl = get_varint(b, &mut pos) as usize;
            let v = b[pos..pos + vl].to_vec();
            pos += vl;
            Some(v)
        } else {
            None
        };
        out.push((key, seq, val));
    }
    out
}

#[derive(Clone, Debug)]
pub struct TableInfo {
    pub index: Vec<(Vec<u8>, u64, u32)>,
    pub bloom: Option<Bloom>,
    pub entries: u64,
}

/// Serialize entries (sorted by key, newest version first; the versions of a key stay in one block) into a table file.
pub fn build_table(
    entries: &[Entry],
    block_bytes: usize,
    bloom_bits: usize,
) -> (Vec<u8>, TableInfo) {
    let mut file = vec![];
    let mut index = vec![];
    let mut block = vec![];
    let mut last_key: Option<&Vec<u8>> = None;
    let flush = |file: &mut Vec<u8>,
                 block: &mut Vec<u8>,
                 index: &mut Vec<(Vec<u8>, u64, u32)>,
                 last: &Vec<u8>| {
        let crc = crc32(block);
        block.extend_from_slice(&crc.to_le_bytes());
        index.push((last.clone(), file.len() as u64, block.len() as u32));
        file.extend_from_slice(block);
        block.clear();
    };
    for (i, e) in entries.iter().enumerate() {
        if !block.is_empty() && block.len() >= block_bytes && last_key.is_some_and(|k| *k != e.0) {
            flush(&mut file, &mut block, &mut index, last_key.unwrap());
        }
        enc_entry(e, &mut block);
        last_key = Some(&entries[i].0);
    }
    if !block.is_empty() {
        flush(&mut file, &mut block, &mut index, last_key.unwrap());
    }
    let index_off = file.len() as u64;
    for (k, off, len) in &index {
        put_varint(k.len() as u64, &mut file);
        file.extend_from_slice(k);
        file.extend_from_slice(&off.to_le_bytes());
        file.extend_from_slice(&len.to_le_bytes());
    }
    let index_len = file.len() as u64 - index_off;
    let bloom_off = file.len() as u64;
    let bloom = (bloom_bits > 0).then(|| {
        let mut keys: Vec<&[u8]> = entries.iter().map(|e| e.0.as_slice()).collect();
        keys.dedup();
        Bloom::build(&keys, bloom_bits)
    });
    if let Some(b) = &bloom {
        file.extend_from_slice(&b.k.to_le_bytes());
        file.extend_from_slice(&b.bits);
    }
    let bloom_len = file.len() as u64 - bloom_off;
    let mut footer = vec![];
    for x in [
        index_off,
        index_len,
        bloom_off,
        bloom_len,
        entries.len() as u64,
    ] {
        footer.extend_from_slice(&x.to_le_bytes());
    }
    let crc = crc32(&footer);
    footer.extend_from_slice(&crc.to_le_bytes());
    footer.extend_from_slice(&MAGIC.to_le_bytes());
    file.extend_from_slice(&footer);
    (
        file,
        TableInfo {
            index,
            bloom,
            entries: entries.len() as u64,
        },
    )
}
const FOOTER: usize = 5 * 8 + 8;

pub fn open_table(fs: &mut SimFs, name: &str) -> R<TableInfo> {
    let size = fs.size(name);
    if size < FOOTER {
        return Err(KvError::Corrupt(format!("{name}: too short")));
    }
    let f = fs.read(name, size - FOOTER, FOOTER)?;
    if u32::from_le_bytes(f[44..48].try_into().unwrap()) != MAGIC
        || crc32(&f[..40]) != u32::from_le_bytes(f[40..44].try_into().unwrap())
    {
        return Err(KvError::Corrupt(format!("{name}: bad footer")));
    }
    let x = |i: usize| u64::from_le_bytes(f[i * 8..i * 8 + 8].try_into().unwrap());
    let (io, il, bo, bl, n) = (
        x(0) as usize,
        x(1) as usize,
        x(2) as usize,
        x(3) as usize,
        x(4),
    );
    let ib = fs.read(name, io, il)?;
    let (mut pos, mut index) = (0, vec![]);
    while pos < ib.len() {
        let kl = get_varint(&ib, &mut pos) as usize;
        let k = ib[pos..pos + kl].to_vec();
        pos += kl;
        let off = u64::from_le_bytes(ib[pos..pos + 8].try_into().unwrap());
        let len = u32::from_le_bytes(ib[pos + 8..pos + 12].try_into().unwrap());
        pos += 12;
        index.push((k, off, len));
    }
    let bloom = if bl > 0 {
        let b = fs.read(name, bo, bl)?;
        Some(Bloom {
            k: u32::from_le_bytes(b[..4].try_into().unwrap()),
            bits: b[4..].to_vec(),
        })
    } else {
        None
    };
    Ok(TableInfo {
        index,
        bloom,
        entries: n,
    })
}
/// Read a block and verify its checksum; returns the entries' bytes.
fn read_block_bytes(fs: &mut SimFs, name: &str, off: u64, len: u32) -> R<Vec<u8>> {
    let mut b = fs.read(name, off as usize, len as usize)?;
    let crc = u32::from_le_bytes(b[b.len() - 4..].try_into().unwrap());
    b.truncate(b.len() - 4);
    if crc32(&b) != crc {
        return Err(KvError::Corrupt(format!("{name}: block checksum mismatch at {off}")));
    }
    Ok(b)
}
fn read_block(fs: &mut SimFs, name: &str, off: u64, len: u32) -> R<Vec<Entry>> {
    Ok(dec_entries(&read_block_bytes(fs, name, off, len)?))
}
/// Find the newest version of `key` with sequence number <= `seq` without decoding the whole block.
fn lookup_in_block(b: &[u8], key: &[u8], seq: u64) -> Option<Option<Vec<u8>>> {
    let mut pos = 0;
    while pos < b.len() {
        let kl = get_varint(b, &mut pos) as usize;
        let k = &b[pos..pos + kl];
        pos += kl;
        let s = u64::from_le_bytes(b[pos..pos + 8].try_into().unwrap());
        pos += 8;
        let kind = b[pos];
        pos += 1;
        let (val, next) = if kind == 1 {
            let vl = get_varint(b, &mut pos) as usize;
            (Some(&b[pos..pos + vl]), pos + vl)
        } else {
            (None, pos)
        };
        if k == key && s <= seq {
            return Some(val.map(|v| v.to_vec()));
        }
        if k > key {
            return None;
        }
        pos = next;
    }
    None
}

