#[derive(Clone, Debug)]
pub struct Options {
    pub memtable_bytes: usize,
    pub file_bytes: usize,
    pub block_bytes: usize,
    pub l0_trigger: usize,
    pub level1_bytes: usize,
    pub size_ratio: usize,
    pub bloom_bits: usize,
}
impl Default for Options {
    fn default() -> Self {
        Options {
            memtable_bytes: 4 << 20,
            file_bytes: 2 << 20,
            block_bytes: 4096,
            l0_trigger: 4,
            level1_bytes: 10 << 20,
            size_ratio: 10,
            bloom_bits: 10,
        }
    }
}

#[derive(Clone, Debug, PartialEq)]
pub struct FileMeta {
    pub id: u64,
    pub level: u32,
    pub smallest: Vec<u8>,
    pub largest: Vec<u8>,
    pub size: u64,
}
#[derive(Default, Clone, Debug)]
struct Edit {
    add: Vec<FileMeta>,
    del: Vec<(u32, u64)>,
    log_number: Option<u64>,
    last_seq: u64,
    next_file: u64,
}

fn enc_edit(e: &Edit) -> Vec<u8> {
    let mut o = vec![];
    for x in [
        e.last_seq,
        e.next_file,
        e.log_number.map_or(0, |n| n + 1),
        e.add.len() as u64,
        e.del.len() as u64,
    ] {
        put_varint(x, &mut o);
    }
    for f in &e.add {
        put_varint(f.id, &mut o);
        put_varint(f.level as u64, &mut o);
        put_varint(f.size, &mut o);
        put_varint(f.smallest.len() as u64, &mut o);
        o.extend_from_slice(&f.smallest);
        put_varint(f.largest.len() as u64, &mut o);
        o.extend_from_slice(&f.largest);
    }
    for (l, id) in &e.del {
        put_varint(*l as u64, &mut o);
        put_varint(*id, &mut o);
    }
    o
}
fn dec_edit(b: &[u8]) -> Edit {
    let mut p = 0;
    let g = |p: &mut usize| get_varint(b, p);
    let (last_seq, next_file, ln, na, nd) = (g(&mut p), g(&mut p), g(&mut p), g(&mut p), g(&mut p));
    let mut e = Edit {
        last_seq,
        next_file,
        log_number: ln.checked_sub(1),
        ..Default::default()
    };
    for _ in 0..na {
        let (id, level, size) = (g(&mut p), g(&mut p) as u32, g(&mut p));
        let sl = g(&mut p) as usize;
        let smallest = b[p..p + sl].to_vec();
        p += sl;
        let ll = g(&mut p) as usize;
        let largest = b[p..p + ll].to_vec();
        p += ll;
        e.add.push(FileMeta {
            id,
            level,
            smallest,
            largest,
            size,
        });
    }
    for _ in 0..nd {
        let l = g(&mut p) as u32;
        let id = g(&mut p);
        e.del.push((l, id));
    }
    e
}
fn frame(payload: &[u8]) -> Vec<u8> {
    let mut r = vec![];
    r.extend_from_slice(&(payload.len() as u32).to_le_bytes());
    r.extend_from_slice(&crc32(payload).to_le_bytes());
    r.extend_from_slice(payload);
    r
}
/// Records until the first torn or corrupt one.
fn unframe(b: &[u8]) -> Vec<&[u8]> {
    let (mut pos, mut out) = (0, vec![]);
    while pos + 8 <= b.len() {
        let len = u32::from_le_bytes(b[pos..pos + 4].try_into().unwrap()) as usize;
        let crc = u32::from_le_bytes(b[pos + 4..pos + 8].try_into().unwrap());
        if pos + 8 + len > b.len() || crc32(&b[pos + 8..pos + 8 + len]) != crc {
            break;
        }
        out.push(&b[pos + 8..pos + 8 + len]);
        pos += 8 + len;
    }
    out
}

#[derive(Default, Clone, Debug)]
pub struct Stats {
    pub user_bytes: u64,
    pub wal_bytes: u64,
    pub flush_bytes: u64,
    pub compaction_read: u64,
    pub compaction_written: u64,
    pub manifest_bytes: u64,
    pub flushes: u64,
    pub compactions: u64,
    pub tables_probed: u64,
    pub bloom_skips: u64,
    pub blocks_read: u64,
}

type MemKey = (Vec<u8>, u64); // (user key, u64::MAX - seq): newest first within a key
const MANIFEST: &str = "MANIFEST";
fn wal_name(n: u64) -> String {
    format!("wal-{n:06}")
}
fn sst_name(n: u64) -> String {
    format!("sst-{n:06}")
}

pub struct Db {
    pub fs: SimFs,
    pub opts: Options,
    mem: BTreeMap<MemKey, Option<Vec<u8>>>,
    mem_bytes: usize,
    seq: u64,
    wal: u64,
    next_file: u64,
    pub levels: Vec<Vec<FileMeta>>,
    tables: HashMap<u64, TableInfo>,
    snapshots: Vec<u64>,
    ptr: Vec<usize>,
    pub stats: Stats,
}

const LEVELS: usize = 7;

impl Db {
    /// Open (or create) the database stored in `fs`, recovering from whatever a crash left behind.
    pub fn open(mut fs: SimFs, opts: Options) -> R<Db> {
        fs.restart();
        let mut db = Db {
            fs,
            opts,
            mem: BTreeMap::new(),
            mem_bytes: 0,
            seq: 0,
            wal: 0,
            next_file: 1,
            levels: vec![vec![]; LEVELS],
            tables: HashMap::new(),
            snapshots: vec![],
            ptr: vec![0; LEVELS],
            stats: Stats::default(),
        };
        let mut log_number = 0;
        if db.fs.size(MANIFEST) > 0 {
            let all = db.fs.read(MANIFEST, 0, db.fs.size(MANIFEST))?;
            for rec in unframe(&all) {
                let e = dec_edit(rec);
                for (l, id) in &e.del {
                    db.levels[*l as usize].retain(|f| f.id != *id);
                }
                for f in &e.add {
                    db.levels[f.level as usize].push(f.clone());
                }
                db.seq = db.seq.max(e.last_seq);
                db.next_file = db.next_file.max(e.next_file);
                if let Some(n) = e.log_number {
                    log_number = n;
                }
            }
            for l in 1..LEVELS {
                db.levels[l].sort_by(|a, b| a.smallest.cmp(&b.smallest));
            }
        }
        // Start a clean manifest holding the whole state in one record. Appending to the old one would put new records behind a torn tail
        // that the next recovery stops at, and lose them.
        db.fs.remove("MANIFEST.new")?;
        if db.fs.size(MANIFEST) > 0 {
            let all: Vec<FileMeta> = db.levels.iter().flatten().cloned().collect();
            let snap = Edit { add: all, del: vec![], log_number: Some(log_number), last_seq: db.seq, next_file: db.next_file };
            let rec = frame(&enc_edit(&snap));
            db.fs.append("MANIFEST.new", &rec)?;
            db.fs.sync("MANIFEST.new")?;
            db.fs.rename("MANIFEST.new", MANIFEST)?;
        }
        // anything on disk that the manifest does not reference is the debris of an interrupted flush or compaction
        let live: std::collections::HashSet<String> =
            db.levels.iter().flatten().map(|f| sst_name(f.id)).collect();
        let mut wals = vec![];
        for name in db.fs.list() {
            if name.starts_with("sst-") && !live.contains(&name) {
                db.fs.remove(&name)?;
            } else if let Some(n) = name.strip_prefix("wal-") {
                let n: u64 = n.parse().unwrap();
                if n < log_number {
                    db.fs.remove(&name)?;
                } else {
                    wals.push(n);
                }
            }
        }
        let files: Vec<FileMeta> = db.levels.iter().flatten().cloned().collect();
        for f in files {
            let info = open_table(&mut db.fs, &sst_name(f.id))?;
            db.tables.insert(f.id, info);
        }
        wals.sort();
        let manifest_seq = db.seq;
        for n in &wals {
            let name = wal_name(*n);
            let all = db.fs.read(&name, 0, db.fs.size(&name))?;
            for rec in unframe(&all) {
                let first = u64::from_le_bytes(rec[..8].try_into().unwrap());
                let count = u32::from_le_bytes(rec[8..12].try_into().unwrap()) as u64;
                if first + count - 1 <= manifest_seq {
                    continue;
                }
                let batch = dec_batch(&rec[12..]);
                for (i, (k, v)) in batch.into_iter().enumerate() {
                    db.mem_put(k, first + i as u64, v);
                }
                db.seq = db.seq.max(first + count - 1);
            }
            db.next_file = db.next_file.max(n + 1);
        }
        db.wal = db.next_file;
        db.next_file += 1;
        db.rotate_wal()?;
        Ok(db)
    }

    /// Start a fresh WAL, flush whatever the old ones replayed into the memtable, and record the new log number.
    fn rotate_wal(&mut self) -> R<()> {
        let new = self.wal;
        self.fs.append(&wal_name(new), &[])?;
        if self.mem.is_empty() {
            let e = Edit {
                log_number: Some(new),
                last_seq: self.seq,
                next_file: self.next_file,
                ..Default::default()
            };
            self.log_edit(&e)?;
            for n in self.fs.list() {
                if let Some(x) = n.strip_prefix("wal-") {
                    if x.parse::<u64>().unwrap() < new {
                        self.fs.remove(&n)?;
                    }
                }
            }
            Ok(())
        } else {
            self.flush_to(new)
        }
    }

    fn log_edit(&mut self, e: &Edit) -> R<()> {
        let rec = frame(&enc_edit(e));
        self.stats.manifest_bytes += rec.len() as u64;
        self.fs.append(MANIFEST, &rec)?;
        self.fs.sync(MANIFEST)
    }

    fn mem_put(&mut self, k: Vec<u8>, seq: u64, v: Option<Vec<u8>>) {
        self.mem_bytes += k.len() + 16 + v.as_ref().map_or(0, |v| v.len());
        self.mem.insert((k, u64::MAX - seq), v);
    }

    pub fn seq(&self) -> u64 {
        self.seq
    }
    /// Shut down without flushing: what is left is exactly what is on the (simulated) disk.
    pub fn into_fs(self) -> SimFs {
        self.fs
    }
    /// Pin the current state for reads and for garbage collection.
    pub fn snapshot(&mut self) -> u64 {
        self.snapshots.push(self.seq);
        self.seq
    }
    pub fn release(&mut self, s: u64) {
        if let Some(i) = self.snapshots.iter().position(|&x| x == s) {
            self.snapshots.swap_remove(i);
        }
    }

    /// Apply a batch atomically. With `sync` the batch is durable when this returns.
    pub fn write(&mut self, batch: &[(Vec<u8>, Option<Vec<u8>>)], sync: bool) -> R<()> {
        if batch.is_empty() {
            return Ok(());
        }
        let first = self.seq + 1;
        let mut payload = vec![];
        payload.extend_from_slice(&first.to_le_bytes());
        payload.extend_from_slice(&(batch.len() as u32).to_le_bytes());
        enc_batch(batch, &mut payload);
        let rec = frame(&payload);
        self.stats.wal_bytes += rec.len() as u64;
        self.stats.user_bytes += batch
            .iter()
            .map(|(k, v)| (k.len() + v.as_ref().map_or(0, |v| v.len())) as u64)
            .sum::<u64>();
        self.fs.append(&wal_name(self.wal), &rec)?;
        if sync {
            self.fs.sync(&wal_name(self.wal))?;
        }
        for (i, (k, v)) in batch.iter().enumerate() {
            self.mem_put(k.clone(), first + i as u64, v.clone());
        }
        self.seq += batch.len() as u64;
        if self.mem_bytes >= self.opts.memtable_bytes {
            self.flush()?;
            self.compact()?;
        }
        Ok(())
    }
    pub fn put(&mut self, k: &[u8], v: &[u8]) -> R<()> {
        self.write(&[(k.to_vec(), Some(v.to_vec()))], true)
    }
    pub fn delete(&mut self, k: &[u8]) -> R<()> {
        self.write(&[(k.to_vec(), None)], true)
    }

    pub fn get(&mut self, key: &[u8]) -> R<Option<Vec<u8>>> {
        let s = self.seq;
        self.get_at(key, s)
    }
    pub fn get_at(&mut self, key: &[u8], seq: u64) -> R<Option<Vec<u8>>> {
        if let Some((_, v)) = self
            .mem
            .range((key.to_vec(), u64::MAX - seq)..=(key.to_vec(), u64::MAX))
            .next()
        {
            return Ok(v.clone());
        }
        let mut l0: Vec<FileMeta> = self.levels[0]
            .iter()
            .filter(|f| f.smallest.as_slice() <= key && key <= f.largest.as_slice())
            .cloned()
            .collect();
        l0.sort_by(|a, b| b.id.cmp(&a.id));
        for f in l0 {
            if let Some(v) = self.table_get(&f, key, seq)? {
                return Ok(v);
            }
        }
        for l in 1..LEVELS {
            let i = self.levels[l].partition_point(|f| f.largest.as_slice() < key);
            if let Some(f) = self.levels[l].get(i).cloned() {
                if f.smallest.as_slice() <= key {
                    if let Some(v) = self.table_get(&f, key, seq)? {
                        return Ok(v);
                    }
                }
            }
        }
        Ok(None)
    }
    fn table_get(&mut self, f: &FileMeta, key: &[u8], seq: u64) -> R<Option<Option<Vec<u8>>>> {
        self.stats.tables_probed += 1;
        let info = &self.tables[&f.id];
        if let Some(b) = &info.bloom {
            if !b.may_contain(key) {
                self.stats.bloom_skips += 1;
                return Ok(None);
            }
        }
        let i = info
            .index
            .partition_point(|(last, _, _)| last.as_slice() < key);
        let Some((_, off, len)) = info.index.get(i).cloned() else {
            return Ok(None);
        };
        self.stats.blocks_read += 1;
        let body = read_block_bytes(&mut self.fs, &sst_name(f.id), off, len)?;
        Ok(lookup_in_block(&body, key, seq))
    }

    /// Live keys in `[lo, hi)` as of `seq`, in key order.
    pub fn scan_at(&mut self, lo: &[u8], hi: &[u8], seq: u64) -> R<Vec<(Vec<u8>, Vec<u8>)>> {
        let mut all: Vec<Entry> = self
            .mem
            .range((lo.to_vec(), 0)..(hi.to_vec(), 0))
            .map(|((k, s), v)| (k.clone(), u64::MAX - s, v.clone()))
            .collect();
        let files: Vec<FileMeta> = self
            .levels
            .iter()
            .flatten()
            .filter(|f| f.smallest.as_slice() < hi && f.largest.as_slice() >= lo)
            .cloned()
            .collect();
        for f in files {
            let blocks: Vec<(u64, u32)> = {
                let info = &self.tables[&f.id];
                let start = info
                    .index
                    .partition_point(|(last, _, _)| last.as_slice() < lo);
                info.index[start..]
                    .iter()
                    .map(|(_, o, l)| (*o, *l))
                    .collect()
            };
            for (off, len) in blocks {
                self.stats.blocks_read += 1;
                let es = read_block(&mut self.fs, &sst_name(f.id), off, len)?;
                let past = es.first().is_some_and(|e| e.0.as_slice() >= hi);
                all.extend(
                    es.into_iter()
                        .filter(|e| e.0.as_slice() >= lo && e.0.as_slice() < hi),
                );
                if past {
                    break;
                }
            }
        }
        all.retain(|e| e.1 <= seq);
        all.sort_by(|a, b| a.0.cmp(&b.0).then(b.1.cmp(&a.1)));
        all.dedup_by(|b, a| a.0 == b.0);
        Ok(all
            .into_iter()
            .filter_map(|(k, _, v)| v.map(|v| (k, v)))
            .collect())
    }
    pub fn scan(&mut self, lo: &[u8], hi: &[u8]) -> R<Vec<(Vec<u8>, Vec<u8>)>> {
        let s = self.seq;
        self.scan_at(lo, hi, s)
    }

    /// Which versions of one key (newest first) must survive: those a snapshot, or the present, can see.
    fn keep_versions(&self, versions: &[Entry], bottom: bool) -> Vec<Entry> {
        let mut snaps = self.snapshots.clone();
        snaps.sort_unstable();
        let mut out: Vec<Entry> = vec![];
        for e in versions {
            let keep = match out.last() {
                None => true,
                // visible to a reader at `s` iff e.seq <= s < newer.seq
                Some(newer) => snaps.iter().any(|&s| e.1 <= s && s < newer.1),
            };
            if keep {
                out.push(e.clone());
            }
        }
        // at the bottom nothing older exists, so a trailing deletion marker hides nothing: a reader finds the key absent either way
        if bottom {
            while out.last().is_some_and(|e| e.2.is_none()) {
                out.pop();
            }
        }
        out
    }
    fn gc(&self, sorted: Vec<Entry>, bottom: bool) -> Vec<Entry> {
        let mut out = vec![];
        let mut i = 0;
        while i < sorted.len() {
            let mut j = i;
            while j < sorted.len() && sorted[j].0 == sorted[i].0 {
                j += 1;
            }
            out.extend(self.keep_versions(&sorted[i..j], bottom));
            i = j;
        }
        out
    }

    fn write_tables(&mut self, entries: Vec<Entry>, level: u32) -> R<Vec<FileMeta>> {
        let mut metas = vec![];
        let mut i = 0;
        while i < entries.len() {
            let mut j = i;
            let mut bytes = 0;
            while j < entries.len() {
                bytes += entries[j].0.len() + 17 + entries[j].2.as_ref().map_or(0, |v| v.len());
                j += 1;
                if bytes >= self.opts.file_bytes {
                    while j < entries.len() && entries[j].0 == entries[j - 1].0 {
                        j += 1;
                    }
                    break;
                }
            }
            let (file, info) =
                build_table(&entries[i..j], self.opts.block_bytes, self.opts.bloom_bits);
            let id = self.next_file;
            self.next_file += 1;
            let name = sst_name(id);
            self.fs.append(&name, &file)?;
            self.fs.sync(&name)?;
            metas.push(FileMeta {
                id,
                level,
                smallest: entries[i].0.clone(),
                largest: entries[j - 1].0.clone(),
                size: file.len() as u64,
            });
            self.tables.insert(id, info);
            i = j;
        }
        Ok(metas)
    }

    pub fn flush(&mut self) -> R<()> {
        let new = self.next_file;
        self.next_file += 1;
        self.fs.append(&wal_name(new), &[])?;
        self.flush_to(new)
    }
    fn flush_to(&mut self, new_wal: u64) -> R<()> {
        let entries: Vec<Entry> = self
            .mem
            .iter()
            .map(|((k, s), v)| (k.clone(), u64::MAX - s, v.clone()))
            .collect();
        let entries = self.gc(entries, false);
        let metas = if entries.is_empty() {
            vec![]
        } else {
            self.write_tables(entries, 0)?
        };
        let e = Edit {
            add: metas.clone(),
            log_number: Some(new_wal),
            last_seq: self.seq,
            next_file: self.next_file,
            ..Default::default()
        };
        self.stats.flush_bytes += metas.iter().map(|m| m.size).sum::<u64>();
        self.log_edit(&e)?;
        self.levels[0].extend(metas);
        self.mem.clear();
        self.mem_bytes = 0;
        self.wal = new_wal;
        self.stats.flushes += 1;
        for n in self.fs.list() {
            if let Some(x) = n.strip_prefix("wal-") {
                if x.parse::<u64>().unwrap() < new_wal {
                    self.fs.remove(&n)?;
                }
            }
        }
        Ok(())
    }

    fn level_limit(&self, l: usize) -> u64 {
        (self.opts.level1_bytes as u64) * (self.opts.size_ratio as u64).pow(l as u32 - 1)
    }
    fn level_size(&self, l: usize) -> u64 {
        self.levels[l].iter().map(|f| f.size).sum()
    }

    /// Compact until no level is over its limit.
    pub fn compact(&mut self) -> R<()> {
        loop {
            let inputs: Option<(usize, Vec<FileMeta>)> =
                if self.levels[0].len() >= self.opts.l0_trigger {
                    Some((0, self.levels[0].clone()))
                } else {
                    (1..LEVELS - 1)
                        .find(|&l| self.level_size(l) > self.level_limit(l))
                        .map(|l| {
                            let i = self.ptr[l] % self.levels[l].len();
                            self.ptr[l] = i + 1;
                            (l, vec![self.levels[l][i].clone()])
                        })
                };
            let Some((level, from)) = inputs else {
                return Ok(());
            };
            self.compact_files(level, from, level + 1)?;
        }
    }
    /// Merge `from` (files of `level`) with the overlapping files of `out` (the next level, or `level` itself for an in-place rewrite).
    fn compact_files(&mut self, level: usize, from: Vec<FileMeta>, out: usize) -> R<()> {
        let lo = from.iter().map(|f| f.smallest.clone()).min().unwrap();
        let hi = from.iter().map(|f| f.largest.clone()).max().unwrap();
        let next: Vec<FileMeta> = if out == level {
            vec![]
        } else {
            self.levels[out].iter().filter(|f| f.smallest <= hi && f.largest >= lo).cloned().collect()
        };
        let mut entries: Vec<Entry> = vec![];
        for f in from.iter().chain(&next) {
            let blocks = self.tables[&f.id].index.clone();
            for (_, off, len) in blocks {
                let es = read_block(&mut self.fs, &sst_name(f.id), off, len)?;
                self.stats.compaction_read += len as u64;
                entries.extend(es);
            }
        }
        entries.sort_by(|a, b| a.0.cmp(&b.0).then(b.1.cmp(&a.1)));
        // a deletion marker may be dropped only if no deeper level could hold an older version of the key
        let rlo = std::iter::once(lo.clone())
            .chain(next.iter().map(|f| f.smallest.clone()))
            .min()
            .unwrap();
        let rhi = std::iter::once(hi.clone())
            .chain(next.iter().map(|f| f.largest.clone()))
            .max()
            .unwrap();
        let bottom = (out + 1..LEVELS).all(|l| {
            self.levels[l]
                .iter()
                .all(|f| f.largest < rlo || f.smallest > rhi)
        });
        let entries = self.gc(entries, bottom);
        let outs = self.write_tables(entries, out as u32)?;
        self.stats.compaction_written += outs.iter().map(|m| m.size).sum::<u64>();
        let e = Edit {
            add: outs.clone(),
            del: from.iter().chain(&next).map(|f| (f.level, f.id)).collect(),
            log_number: None,
            last_seq: self.seq,
            next_file: self.next_file,
        };
        self.log_edit(&e)?;
        for (l, id) in &e.del {
            self.levels[*l as usize].retain(|f| f.id != *id);
            self.tables.remove(id);
        }
        self.levels[out].extend(outs);
        self.levels[out].sort_by(|a, b| a.smallest.cmp(&b.smallest));
        for (_, id) in &e.del {
            self.fs.remove(&sst_name(*id))?;
        }
        self.stats.compactions += 1;
        Ok(())
    }

    /// Number of stored versions (entries) across all tables, including shadowed ones and deletion markers.
    pub fn version_count(&self) -> u64 {
        self.levels.iter().flatten().map(|f| self.tables[&f.id].entries).sum()
    }
    /// Manual full compaction: push every level into the next until all data is in one level, then rewrite that level so that shadowed
    /// versions and deletion markers are dropped.
    pub fn compact_all(&mut self) -> R<()> {
        self.flush()?;
        let deepest = self.levels.iter().rposition(|l| !l.is_empty());
        let Some(d) = deepest else { return Ok(()) };
        for l in 0..d {
            if !self.levels[l].is_empty() {
                let all = self.levels[l].clone();
                self.compact_files(l, all, l + 1)?;
            }
        }
        let last = self.levels.iter().rposition(|l| !l.is_empty()).unwrap();
        let all = self.levels[last].clone();
        self.compact_files(last, all, last)
    }
    /// Structural invariants: levels 1.. hold sorted, disjoint files; every referenced file exists with a loaded index.
    pub fn check(&self) -> Result<(), String> {
        for (l, files) in self.levels.iter().enumerate() {
            for f in files {
                if f.smallest > f.largest {
                    return Err(format!("file {} has an inverted range", f.id));
                }
                if !self.tables.contains_key(&f.id) {
                    return Err(format!("file {} has no loaded index", f.id));
                }
                if self.fs.size(&sst_name(f.id)) as u64 != f.size {
                    return Err(format!("file {} size mismatch", f.id));
                }
            }
            if l >= 1 {
                for w in files.windows(2) {
                    if w[0].largest >= w[1].smallest {
                        return Err(format!(
                            "level {l}: files {} and {} overlap",
                            w[0].id, w[1].id
                        ));
                    }
                }
            }
        }
        Ok(())
    }
    pub fn files(&self) -> usize {
        self.levels.iter().map(|l| l.len()).sum()
    }
    pub fn disk_bytes(&self) -> u64 {
        self.levels.iter().flatten().map(|f| f.size).sum()
    }
}

fn enc_batch(b: &[(Vec<u8>, Option<Vec<u8>>)], o: &mut Vec<u8>) {
    for (k, v) in b {
        put_varint(k.len() as u64, o);
        o.extend_from_slice(k);
        match v {
            Some(v) => {
                o.push(1);
                put_varint(v.len() as u64, o);
                o.extend_from_slice(v);
            }
            None => o.push(0),
        }
    }
}
fn dec_batch(b: &[u8]) -> Vec<(Vec<u8>, Option<Vec<u8>>)> {
    let (mut p, mut out) = (0, vec![]);
    while p < b.len() {
        let kl = get_varint(b, &mut p) as usize;
        let k = b[p..p + kl].to_vec();
        p += kl;
        let kind = b[p];
        p += 1;
        let v = if kind == 1 {
            let vl = get_varint(b, &mut p) as usize;
            let v = b[p..p + vl].to_vec();
            p += vl;
            Some(v)
        } else {
            None
        };
        out.push((k, v));
    }
    out
}
