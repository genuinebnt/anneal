versions stored with the snapshot held: 60; after releasing it and compacting everything: 20 (20 live keys)
```

<ul> <li><strong>All 1 000 recoveries were a committed prefix containing every acknowledged batch.</strong> 993 of the 1 000 incarnations ended in a power failure during a write (the other seven ran out of work first); 959 of those had already completed a flush or compaction, and in 412 recoveries one or more unacknowledged batches were lost, as allowed.</li> <li><strong>The Bloom filters hit their theory</strong>: 0.82% false positives at 10 bits per key (theory 0.84%), 9.2% at 5 (9.2%), 39% at 2 (39%); there are no false negatives.</li> <li><strong>Snapshots hold garbage</strong>: with a snapshot taken before 4 overwrites of 30 keys and 10 deletions, 60 versions remain (30 old, 20 live, 10 deletion markers); once the snapshot is released, one full compaction leaves exactly the 20 live versions.</li> </ul>

<p>The second measurement loads 1 000 000 keys (16 bytes, 100-byte values) in random order, overwrites 1 000 000 random keys, and probes 50 000 present and 50 000 absent keys, with a 4 MB memtable, 2 MB files and a 4 MB first level:</p>

```text title="write, read and space amplification on 1 000 000 keys"
1000000 keys of 16 bytes with 100-byte values, loaded in random order, then 1000000 random overwrites; memtable 4 MB, files 2 MB, level 1 = 4 MB
 ratio    bloom   load s    WA load   WA +over  levels  space amp        get hit       get miss
    10  10 bits      4.8       10.1       10.7       4      1.49x  8327ns 3.49t 1.02b   760ns 3.92t 0.03b
     4  10 bits      5.0       10.6       10.8       5      1.60x  8430ns 3.83t 1.02b   924ns 4.47t 0.04b
    10      off      4.5       10.0       10.6       4      1.48x 27725ns 3.52t 3.52b 30713ns 3.94t 3.94b
(t = tables probed per get, b = data blocks read per get)
```

<ul> <li><strong>Write amplification is about 10</strong>: every byte the user writes is written about ten times in all (log, flush, and compaction through four or five levels). It did not move with the size ratio (10.1 against 10.6 for the load) in this range; the depth did (4 against 5 levels).</li> <li><strong>Space amplification is 1.5×</strong> after a million overwrites: stale versions wait for compaction.</li> <li><strong>Bloom filters cut a miss from 3.94 block reads to 0.03</strong>: <strong>760 ns against 30.7 µs, 40× faster</strong>. A hit reads one block (1.02 per get) with the filters and 3.5 without, because it also has to look into tables that do not hold the key.</li> <li><strong>A hit probes 3.5 tables</strong> (level-0 tables that cover the key plus one per level); only the filter keeps that to one block. Times are CPU time on an in-memory simulated disk, about 8 µs per block read (copy, checksum, scan); the counts are what a real disk would charge for.</li> </ul>

<aside data-call="note"><b>The bug that the crash test found</b><p>The first run failed at seed 6, round 1: <code>recovery failed: Corrupt("sst-000080: too short")</code>. After a crash the manifest ended in a torn record. Recovery ignored it, correctly, but then <strong>appended new edits after the torn bytes</strong>. The next recovery stopped reading at the torn record and never saw the later edits, so it referenced a file that a later (unseen) edit had replaced, and the file had been deleted. The fix is the rewrite at open: after reading the valid prefix, write the whole state as one record to a new file, sync it, and rename it over the manifest. The mutant that removes the rewrite is killed by the same test. A log that can end torn must never be appended to without first cutting off the tail.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Errors as a type</strong>: every file-system call returns <code>R&lt;T&gt; = Result&lt;T, KvError&gt;</code>; <code>Crashed</code> propagates with <code>?</code> from the deepest write to the caller, which is how a power failure unwinds a flush in the middle of a compaction. A test drops the <code>Db</code> and reopens from the <code>SimFs</code>, exactly what a restart would see.</li> <li><strong><code>SimFs</code> is the oracle for durability</strong>: files are <code>Vec&lt;u8&gt;</code> with a <code>synced</code> mark; at the crash each file keeps <code>synced + rand(0..=pending)</code> bytes. The same trick as the meta-page test of <a href="/cookbook/p/embedded-engines">S10</a>, now with a log, a manifest and many files.</li> <li><strong>Ordered keys with a reversed sequence</strong>: the memtable is a <code>BTreeMap&lt;(Vec&lt;u8&gt;, u64), Option&lt;Vec&lt;u8&gt;&gt;&gt;</code> keyed by <code>(user key, u64::MAX − seq)</code>, so the newest version of a key sorts first and a snapshot read is one <code>range</code> seek, as in <a href="/cookbook/p/transactions-on-the-key-space">M2</a>.</li> <li><strong><code>Option&lt;Vec&lt;u8&gt;&gt;</code> for tombstones</strong>, <code>Entry = (key, seq, Option&lt;value&gt;)</code> for tables; <code>lookup_in_block</code> scans a block's bytes for a point read without allocating its entries.</li> <li><strong>A <code>const fn</code>-built CRC table</strong> (<code>const T: [u32; 256] = { … }</code>) needs no crate and no lazy initialization; a known-answer test (<code>crc32(b"123456789") == 0xCBF43926</code>) pins it.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Against a map</strong>: 40 seeds × 400 steps of batched writes (with and without sync), gets, scans, snapshots, clean restarts and forced flush-and-compact on tiny files (memtable 600 bytes, 128-byte blocks, ratio 3) that reach level 2 and beyond; after every step the structural check passes (levels 1 and up are sorted and disjoint, files exist with their recorded sizes), every live snapshot's full scan and a point read equal the map as it was when the snapshot was taken, and after a restart the contents equal the map.</li> <li><strong>Crashes</strong>: 500 scenarios × 2 incarnations. Each opens the database (recovering whatever the last crash left), arms a power failure after a random number of file-system operations, and writes batches until it fires; the unsynced tail of every file is torn at a random byte. The recovered contents must equal the first <em>k</em> batches for some <em>k</em> ≥ the number acknowledged by synced writes; the next incarnation continues from that state.</li> <li><strong>Directed</strong>: a torn log tail loses exactly the last record; a flipped byte inside the fourth of six log records ends replay after the third; a flipped byte in a data block is reported as a checksum failure on read, and in the footer on open; files the manifest does not mention are deleted on open; <code>crc32("123456789")</code> has its standard value; Bloom filters have no false negatives and their false-positive rates fall in the expected bands; snapshots keep exactly the old versions they can see and a full compaction after the release leaves one version per live key.</li> <li><strong>Mutants run against these tests</strong>: a wrong checksum polynomial; a Bloom filter accepting on any probe; blocks splitting a key's versions; log records without checksums; the manifest rewrite removed; the current log deleted on recovery; writes acknowledged without <code>fsync</code>; snapshot reads of the memtable ignoring the sequence; level 0 searched oldest first; the per-level file search off by one; scans ignoring the snapshot; garbage collection forgetting snapshots; deletion markers dropped above older data; compaction missing an overlapping file; a key's versions split across output files; the newest version dropped. <strong>All 16 were killed</strong>; the first run left one alive (snapshot point reads served from the memtable), which a point-read check at each snapshot now kills.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>LevelDB</strong> (Google, C++) introduced this structure: log, memtable, immutable tables, manifest, leveled compaction, sequence numbers for snapshots. <strong>RocksDB</strong> (Meta) adds column families, universal and FIFO compaction, rate limiting, a block cache, prefix Bloom filters, and parallel compaction; it is the engine under TiKV, CockroachDB's earlier storage layer, MyRocks and many streaming systems.</li> <li><strong>Pebble</strong> (Go, CockroachDB) is a RocksDB-compatible design with a stricter test strategy: metamorphic tests and fault-injecting file systems like the one here. <strong>WiredTiger</strong> has an LSM option next to its B-tree. <strong>Cassandra</strong>, <strong>ScyllaDB</strong>, <strong>HBase</strong> and <strong>Bigtable</strong> use tiered or leveled variants with a commit log and SSTables.</li> <li><strong>Fjall</strong> (an LSM tree) and <strong>redb</strong> (a copy-on-write B-tree, see <a href="/cookbook/p/embedded-engines">S10</a>) are embedded engines written in Rust.</li> <li><strong>Beyond leveled</strong>: size-tiered compaction (fewer rewrites, more space and more tables per read), Monkey/Dostoevsky tuning of filter bits per level, key-value separation (WiscKey, Titan, BlobDB) to avoid rewriting large values, and learned indexes inside tables.</li> <li><strong>Fsync and the file system</strong>: production engines call <code>fdatasync</code>, sync the directory after creating or renaming a file, use <code>O_DIRECT</code> for table reads and the <code>io_uring</code> interface for parallel I/O (<a href="/cookbook/p/disk-i-o-fsync-the-page-cache-and-queues">I/O</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Never append behind a possibly torn tail.</strong> Cut the log to its valid prefix, or start a new file, before writing again. This section's bug.</li> <li><strong><code>fsync</code> the file, then the directory.</strong> Creating a file, renaming it or deleting it is only durable once the directory is synced; the simulated file system makes those operations durable at once, which a real one does not.</li> <li><strong>Write stalls</strong>: if flushes or compactions fall behind, the memtable fills and writes must slow or stop. Real engines throttle writers when level 0 grows; this one compacts synchronously.</li> <li><strong>Tombstones live a long time</strong>: a deletion marker has to travel to the bottom level before it can be dropped, and range deletes make that worse. A queue-like workload can fill a level with markers.</li> <li><strong>Compaction fights the foreground for I/O</strong>: rate-limit it, schedule it away from peaks, and watch the backlog.</li> <li><strong>Bloom filters are per table, per key</strong>: they do not help range scans; prefix filters or fences do.</li> <li><strong>Space amplification can double briefly</strong> during a compaction (inputs and outputs coexist) and larger when a long snapshot pins old versions; size the disk for the peak, not the average.</li> <li><strong>Opening a database is recovery</strong>: the time to replay the log and load every index is a start-up cost that grows with the log size; flush on shutdown, and cap the log.</li> </ul></aside>
"""

