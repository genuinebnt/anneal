<ul> <li><strong>Independence picks a plan more than 10% worse than the best in 52% of the queries and more than 2× worse in 47%</strong>, with a worst case of 38×, even though the plan space has only six join orders. It joins customers first in 68% of the queries, where the best plan does in 50%: it believes the customer filter is far more selective than it is (343 orders instead of 92 370 in the example above), so it puts that join first even when the product or shipment join is the better first step.</li> <li><strong>Join sampling makes the plan optimal almost everywhere</strong>: 1 000 orders give regret 1.00 at the median, 6% of queries above 1.1 and none above 2; 20 000 orders leave under 1% of queries above 1.1 (worst 1.35).</li> <li><strong>Noise tolerance</strong>: perturbing the <em>true</em> cardinalities by an independent log-normal factor shows how much error a plan survives. At σ = 0.5 (typical factor 1.4×) 14% of plans are more than 10% worse; at σ = 1 (typical 2×) 28% and 6% above 2×; at σ = 3 (typical 8×) one query in four is more than twice as slow and the worst is <strong>949×</strong>. A 5-table star is a gentle test; with 10 tables the plan space is millions of plans, and the same noise finds the bad ones.</li> </ul>
