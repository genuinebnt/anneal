<ul> <li><strong>Independence: median error 3× after one join, 48× after two, 124× after three; underestimates in 45%, 72% and 80% of the estimates.</strong> That is the "errors grow exponentially with joins" result, reproduced on a schema small enough to read.</li> <li><strong>Join sampling with 1 000 sampled orders is within 1.02× (1 join), 1.11× (2) and 1.34× (3) at the median</strong>, and with 20 000 sampled orders within 1.01×, 1.02× and 1.06×. The tail is where it still fails: p90 of 11 (1 000 orders, 3 joins) and max over 100 come from queries where few sample tuples qualify.</li> <li><strong>With random predicate values (many empty results) the picture changes</strong>: over both workloads, 21% of the estimates for the 1 000-order sample and 7% for the 20 000-order sample found no qualifying sample tuple, and the estimator <strong>falls back to the independence model</strong>. After three joins the median q-error is still 16.9 (sample) against 17.7 (independence). This is the <strong>0-tuple problem</strong>: a sample cannot say how small a tiny result is, only that it is smaller than 1/m of the hub. Index-based join sampling reduces the problem by spending more of the budget on the selective predicates first (the paper's idea; not implemented here), or by falling back to a better model than independence (the Chow–Liu tree, a sketch, an upper bound).</li> </ul>

