[[sections]]
heading = "Choosing what to build"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>need</th> <th>build</th> <th>why</th> </tr> </thead> <tbody> <tr> <td>a correlation you know about (country/city, make/model)</td> <td>column-group counts or an <code>ndistinct</code>/MCV extended statistic</td> <td>exact, cheap, predictable</td> </tr> <tr> <td>correlation you cannot enumerate, ranges, ad hoc predicates</td> <td>a data-driven model (tree, sum-product network, autoregressive)</td> <td>one model for every predicate combination</td> </tr> <tr> <td>selective filters on a hot table, joins with skew</td> <td>plan-time sampling with index lookups</td> <td>handles join-crossing effects, no statistics to maintain; fails when nothing qualifies</td> </tr> <tr> <td>no tolerance for underestimates</td> <td>pessimistic bound (degree-sequence / Count-Min based)</td> <td>never believes a tiny result; may overestimate by a lot</td> </tr> <tr> <td>long-running workload that repeats</td> <td>execution feedback</td> <td>the true counts of the plans you actually run</td> </tr> </tbody> </table></div>

<p>A pragmatic production stack is: single-column MCV + histogram (<a href="/cookbook/p/statistics">Q7</a>), a handful of declared extended statistics, plan-time sampling for base-table filters, an <strong>exponential backoff</strong> combination instead of a pure product (below), and feedback or runtime adaptation as the safety net (<a href="/cookbook/p/adaptive-and-robust">Q10</a>).</p>

<aside data-call="note"><b>Exponential backoff</b><p>When selectivities <code>s1 ≤ s2 ≤ s3 ≤ s4</code> of conjuncts are combined, instead of <code>s1·s2·s3·s4</code> use <code>s1 · s2&#94;(1/2) · s3&#94;(1/4) · s4&#94;(1/8)</code>. SQL Server's 2014 estimator does this: it assumes the predicates are partly dependent, trusts the most selective one fully and each next one less. It is wrong in both directions, but it is wrong by much less than the product on positively correlated data (exercise 1), and it needs no statistics.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Subsets as <code>u8</code> masks</strong>: <code>const C: u8 = 1; O = 2; P = 4; S = 8;</code> and <code>m.count_ones()</code>. Enumerating the splits of a subset is the three-line loop <code>let mut a = (m - 1) &amp; m; while a &gt; 0 { …; a = (a - 1) &amp; m; }</code>, and <code>card: [f64; 16]</code> indexes by mask with no hashing.</li> <li><strong>Estimators are views over data</strong>: <code>RowSample&lt;'a&gt;</code> and <code>JoinSample&lt;'a&gt;</code> hold <code>&amp;'a Table</code> / <code>&amp;'a Shop</code>, so the borrow checker proves the data outlives the estimator, and a <code>Vec&lt;Box&lt;dyn TableEst + '_&gt;&gt;</code> carries them side by side with the owned ones.</li> <li><strong><code>Cell</code> for counters behind <code>&amp;self</code></strong>: the estimator trait takes <code>&amp;self</code> (an optimizer calls it from many places and threads would need atomics), but the experiment wants "how often did you fall back?". <code>Cell&lt;u32&gt;</code> is the cheapest interior mutability for single-threaded counters; switch to <code>AtomicU32</code> when the estimator is shared.</li> <li><strong>Flat conditional tables</strong>: <code>cpt[v][parent_value * dom_v + x]</code> is a single <code>Vec&lt;f64&gt;</code> per column, so the inner loop of message passing is a linear scan with no pointer chasing. The model is 143 KB and fits in L2.</li> <li><strong>Topological order for free</strong>: Prim's algorithm appends nodes in an order where each node's parent already appeared, so the <code>order</code> vector is a valid topological order and the upward pass is <code>order.iter().rev()</code>; no recursion, no stack.</li> <li><strong><code>Option::is_none_or</code></strong> (stable since Rust 1.82) expresses "no predicate, or it holds": <code>q.seg.is_none_or(|g| s.cust_seg[c] == g)</code>.</li> <li><strong>Edition 2024 reserves <code>gen</code></strong>: a function named <code>gen</code> stops compiling (<code>r#gen</code> or a different name; here <code>generate</code>).</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Inference against enumeration</strong>: for a 4-column table, enumerate all assignments, sum the tree's point probabilities for those matching random predicates (equalities and ranges), and require <code>prob</code> to agree to 1e-12. Run it on a <strong>chain</strong> and on a <strong>star</strong> (a hub with three children): the chain alone does not exercise "combine the messages of several children".</li> <li><strong>Structure recovery</strong>: the learned tree must link the columns that were generated dependent.</li> <li><strong>Closed forms</strong>: column-group counts are exact for the pair they cover; the independence model must satisfy <code>|O⋈C'⋈P'⋈S'| = |O⋈C'|·|O⋈P'|·|O⋈S'| / |O|²</code> and <code>|O⋈S'| = |S'|</code> exactly.</li> <li><strong>True cardinalities against a second implementation</strong>: explicit nested-loop enumeration of every join subset on a tiny shop, with and without the optional <code>seg</code> predicate, for row-derived and random predicates.</li> <li><strong>Unbiasedness</strong>: the mean of 300 independently drawn join-sample estimates must be within 6% of the truth for three subsets.</li> <li><strong>Plan DP</strong>: its cost must be at most that of all six dimension orders for 200 random cardinality assignments, and the plan must never contain a cross product.</li> <li><strong>Mutants run against these tests</strong>: replace (not multiply) the child messages in the upward pass (survived the first chain-only test, <strong>killed by the star test</strong>); ignore the shipment multiplicity in the join sample (killed); drop the <code>seg</code> predicate in the truth (killed); forget the smoothing in a parent count (killed); flip the sign of mutual information (killed); drop the FK fan-out from the independence model (survived, <strong>killed by the closed-form test</strong>). A mutant that removed a connectivity guard in the DP survived because the second guard made it equivalent, so the redundant guard was deleted.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong>: per-column MCV + histogram; <code>CREATE STATISTICS</code> for <code>ndistinct</code>, functional <code>dependencies</code> (the formula measured above) and multi-column <code>mcv</code> lists (PG 12+); <code>eqjoinsel</code> matches the two MCV lists and assumes uniformity for the rest; conjuncts are multiplied unless a matching extended statistic exists; <strong>no cross-table correlation statistics</strong> and no plan-time sampling.</li> <li><strong>SQL Server</strong>: the 2014 "new cardinality estimator" replaced independence with <strong>exponential backoff</strong> for conjunctions and changed join containment assumptions; Query Store and adaptive joins (batch-mode hash join that switches to nested loop at run time) are the safety nets.</li> <li><strong>Oracle</strong>: <strong>dynamic sampling</strong> at parse time when statistics are missing or the predicates are complex, column-group and expression statistics, <strong>SQL plan directives</strong> that remember a misestimate and request extended statistics or sampling on the next run, cardinality feedback.</li> <li><strong>IBM Db2</strong>: column-group statistics and the <strong>LEO</strong> learning optimizer (monitor actual counts, store adjustments), a historic example of feedback.</li> <li><strong>HyPer / Umbra</strong>: evaluate base-table predicates on a materialized <strong>sample</strong> during optimization (the idea behind index-based join sampling); Umbra adds adaptive optimization for very large join queries (Neumann and Radke, SIGMOD 2018).</li> <li><strong>MySQL</strong>: index dives for indexed predicates, optional histograms; no correlation handling.</li> <li><strong>Learned estimators in practice</strong>: widely benchmarked (MSCN, DeepDB, NeuroCard, FLAT, BayesCard; Han et al., VLDB 2022, find that data-driven models are most accurate but have high training and update cost, and that accuracy gains translate unevenly into end-to-end speedups), integrated in research prototypes and a few cloud systems, <strong>not</strong> the default in any major open-source engine.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Independence is not "unbiased", it is biased low.</strong> Correlation in real predicates is positive, so the product underestimates, and underestimates are the dangerous direction (nested loops, tiny hash tables, too few partitions). When you cannot model the correlation, prefer a damped combination (backoff) over the product.</li> <li><strong>Per-table statistics cannot see join-crossing correlation.</strong> The popular customers in this lab all buy the popular products; no single-table histogram contains that fact. Fixing it needs statistics or samples <strong>over the join</strong>.</li> <li><strong>The 0-tuple problem</strong>: a sample with no qualifying row says nothing about how rare the result is. Decide the fallback on purpose (a model, a bound, a constant), never "0 rows", and report how often it triggers.</li> <li><strong>Never trust a q-error table without the plan</strong>: a fix that lowers the median q-error and raises the tail can make plans worse. Report the regret distribution next to q-error, and look at the worst 1%.</li> <li><strong>Do not train on the benchmark's query templates and test on the same templates</strong>: learned estimators look excellent on templates they saw and degrade on new ones and on shifted data; evaluate on held-out templates and after inserting data.</li> <li><strong>Inference time is a budget</strong>: an optimizer asks for 10³–10⁶ estimates per query, mostly for subsets of the same relations; memoize per relation set, batch the model calls, and keep a microsecond-scale fast path.</li> <li><strong>Keep estimates consistent across join orders</strong>: derive the cardinality of a relation set once (the memo group does it) and let every plan inherit it, or two equivalent plans will be costed from two different numbers.</li> <li><strong>NULL join keys never match</strong>: they disappear from <code>|R ⋈ S|</code>; use the non-null fraction, not the row count, in the join formulas.</li> </ul></aside>
