[[sections]]
heading = "A learned model, in 60 lines"
body = """
<p>The Chow–Liu tree is the smallest model worth calling "learned", and everything it does is what the neural estimators do, with a lookup table in place of a network:</p>

<ol> <li><strong>Count</strong> pairwise joint frequencies for every pair of columns (one pass; <code>m²/2</code> count tables).</li> <li><strong>Score</strong> each pair by <strong>mutual information</strong> <code>I(X;Y) = Σ p(x,y) ln [p(x,y) / (p(x) p(y))]</code>: zero for independent columns, large for dependent ones.</li> <li><strong>Tree</strong>: the maximum spanning tree on those scores (Prim) is the best tree-shaped approximation to the joint distribution in KL divergence (Chow and Liu, 1968). Each column gets one parent.</li> <li><strong>Tables</strong>: for each column store <code>P(x | parent)</code> (additively smoothed), the root stores its marginal. The model is the product of these conditionals.</li> <li><strong>Inference</strong>: for a conjunction of predicates, each column has an <em>allowed set</em> of values (a point for <code>=</code>, an interval for ranges). A <strong>sum-product pass from the leaves up</strong> computes, for each node, <code>msg(parent value) = Σ_{x allowed} P(x | parent value) · Π_{children} msg_child(x)</code>; the root sums its own allowed values. Cost is linear in the number of columns times the product of two domain sizes, microseconds.</li> </ol>

<p>Properties that matter in a database:</p>

<ul> <li><strong>Any predicate combination</strong> is answered from the same model: equalities, ranges, <code>IN</code> lists, columns that appear in no declared statistic. Extended statistics answer only what was declared.</li> <li><strong>Counts are additive</strong>, so the model is updated incrementally: add the new rows' pair counts, recompute the MST, rebuild the touched tables. No retraining, and the updates parallelize and merge across partitions.</li> <li><strong>Limits</strong>: a tree captures only pairwise dependencies (three-way effects such as XOR are invisible), continuous columns need discretization, multi-table queries need a model over the <strong>join</strong> (NeuroCard trains on samples of the full outer join and corrects with fanout columns), and domain sizes make the tables large (100 × 100 doubles = 80 KB for one edge).</li> </ul>
"""

