[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Cardinality estimation (CE) is the weakest part of every optimizer.</strong> Join ordering, join algorithm, access path, memory grants and parallelism are all functions of estimated row counts, and the measurements in the literature (Leis et al., "How good are query optimizers, really?") are blunt: estimates are off by orders of magnitude on real data, the error <strong>grows exponentially with the number of joins</strong>, it is mostly <strong>underestimation</strong>, and fixing estimates helps plans more than refining the cost model does.</li> <li><strong>Three assumptions hold the classic model together, and real data breaks each.</strong> <em>Uniformity</em>: values inside a bucket are equally frequent. <em>Independence</em>: <code>P(a ∧ b) = P(a) × P(b)</code>, and predicates on different tables are independent of the join. <em>Inclusion</em> (containment): every join key of the smaller side finds a partner on the other side, so <code>|R ⋈ S| = |R|·|S| / max(d_R, d_S)</code>. A column pair like (country, city) violates independence; a skewed foreign key violates uniformity; a filter on a table that the join already filtered violates both.</li> <li><strong>Why underestimation dominates.</strong> Predicates in real queries are <strong>positively correlated</strong> (the city really is in that country), so multiplying selectivities gives a number that is too small, and the more predicates and joins, the smaller the product. A too-small estimate makes a nested-loop join or an index scan look free, which is the plan that blows up.</li> <li><strong>Four families of fixes</strong>, in increasing order of effort and cost: (1) <strong>extended statistics</strong> for the correlations a human declares (column groups, functional dependencies, joint MCV lists); (2) <strong>sampling</strong> at plan time, where the sample answers the question directly, including <em>across joins</em> when it is a sample of the hub table joined through indexes (<strong>index-based join sampling</strong>); (3) <strong>learned models</strong> of the data distribution (data-driven: Naru, DeepDB, BayesCard, NeuroCard) or of the workload (query-driven: MSCN), which learn the correlations instead of being told; (4) <strong>feedback and bounds</strong>: use true counts from earlier executions (LEO), re-plan mid-query, or return <strong>pessimistic upper bounds</strong> so the planner never believes in a tiny join result (<a href="/cookbook/p/adaptive-and-robust">Q10</a>).</li> <li><strong>A join's size is a statement about both key distributions.</strong> Exactly, <code>|R ⋈ S| = Σ_v f_R(v)·f_S(v)</code> over the shared key values. Uniform keys collapse that to the <code>max(d)</code> formula; skewed keys (a popular customer is also the one with the most shipments) make the real answer larger by factors the formula cannot see, which is why per-table statistics <strong>cannot</strong> fix join-crossing correlations.</li> <li><strong>Judge an estimator by the plan it produces, not by its error alone.</strong> Many large errors are harmless (they do not change the plan), a few small ones are fatal. For a sum-of-cardinalities cost such as <code>C_out</code>, if every estimate is within a factor <code>q</code> of the truth then every plan's estimated cost is within <code>q</code> of its true cost, so the chosen plan is at most <code>q²</code> worse than the best one (Moerkotte, Neumann and Steidl give the general result). The bound is loose in practice and tells you what to measure: <strong>q-error</strong> per estimate, <strong>regret</strong> per plan.</li> <li><strong>Estimates must be consistent.</strong> The size of <code>A ⋈ B ⋈ C</code> must not depend on the order in which the optimizer derives it. A memo group (<a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>) therefore stores <strong>one</strong> cardinality per set of relations, computed once, and every plan in the group shares it.</li> </ul>
"""

[[sections]]
heading = "The lab"
body = """
<p>Three experiments, one module (code below):</p>

<ul> <li><strong>A. One table, five estimators.</strong> A 500 000-row table with two correlated pairs (<code>b</code> is a function of <code>a</code> with 10% noise; <code>d</code> equals a function of <code>c</code> 70% of the time), one independent column, Zipf-skewed values. Estimators: <strong>independence</strong> over MCV + histogram statistics from <a href="/cookbook/p/statistics">Q7</a>; <strong>column-group counts</strong> (exact joint counts for chosen pairs); a <strong>functional-dependency</strong> model (PostgreSQL's formula); a <strong>row sample</strong> of 2 000 rows; a <strong>Chow–Liu tree</strong>, a Bayesian network learned from the data with no hints.</li> <li><strong>B. A star schema with skew and join-crossing correlation.</strong> <code>customers</code>, <code>products</code>, <code>orders</code> (hub) and <code>shipments</code>. Customers and products are numbered by popularity. The popular customers (1% of all) live in country 0 and buy half of their orders from the top-1% category-0 products and have more shipments with carriers tied to their country. Every one of these is invisible to per-table statistics. Estimators: independence plus uniform FK joins (the System R model), and <strong>index-based join sampling</strong> over a uniform sample of orders.</li> <li><strong>C. Plans from estimates.</strong> The estimates for all 11 connected subsets of the four tables go into a bushy dynamic program that minimizes <code>C_out</code> (<a href="/cookbook/p/join-ordering">Q4</a>); the chosen plan is then scored with the <strong>true</strong> cardinalities and divided by the cost of the truly best plan: its <strong>regret</strong>.</li> </ul>

:::deeper Reference: correlated-table generator, independence / column-group / FD / row-sample / Chow–Liu estimators, star-schema generator, true cardinalities, independence and join-sampling estimators, plan DP and regret
```rust title="src/opt/card.rs"
//! Cardinality estimation lab. Part A: one table with correlated columns and five estimators for conjunctions
//! (independence, column-group counts, functional-dependency degree, row sample, a Chow-Liu tree). Part B: a star
//! schema with FK skew and cross-join correlation, estimated with the independence/uniformity model and with
//! index-based join sampling. Part C: choosing a join order from estimates and scoring it with true cardinalities.
use std::collections::HashMap;
use crate::joinorder::Rng;
use crate::stats::{runs, zipf, Compressed, Estimator};

// =====================================================================================================
// Part A: predicates on one table
// =====================================================================================================

#[derive(Clone, Copy, Debug)]
pub enum Pred { Eq(usize, u32), Range(usize, u32, u32) }
impl Pred {
    pub fn col(&self) -> usize { match *self { Pred::Eq(c, _) | Pred::Range(c, _, _) => c } }
    pub fn holds(&self, v: u32) -> bool { match *self { Pred::Eq(_, x) => v == x, Pred::Range(_, lo, hi) => v >= lo && v <= hi } }
}

/// Dense columns: values of column `c` lie in `0..doms[c]`.
pub struct Table { pub cols: Vec<Vec<u32>>, pub doms: Vec<usize> }
impl Table {
    pub fn n(&self) -> usize { self.cols[0].len() }
    pub fn count(&self, preds: &[Pred]) -> usize {
        (0..self.n()).filter(|&i| preds.iter().all(|p| p.holds(self.cols[p.col()][i]))).count()
    }
}

/// Columns: 0 `a` (Zipf, 53 values), 1 `b` (a function of `a` with 10% noise), 2 `c` (Zipf, 101 values),
/// 3 `d` (equals a function of `c` 70% of the time), 4 `e` (uniform, 10 values, independent of everything).
pub fn gen_table(r: &mut Rng, n: usize) -> Table {
    let a: Vec<u32> = zipf(r, n, 53, 0.8).into_iter().map(|x| x as u32).collect();
    let c: Vec<u32> = zipf(r, n, 101, 1.0).into_iter().map(|x| x as u32).collect();
    let b = a.iter().map(|&x| if r.unit() < 0.9 { (x * 7 + 3) % 23 } else { r.next(23) as u32 }).collect();
    let d = c.iter().map(|&x| if r.unit() < 0.7 { (x * 5 + 1) % 101 } else { r.next(101) as u32 }).collect();
    let e = (0..n).map(|_| r.next(10) as u32).collect();
    Table { cols: vec![a, b, c, d, e], doms: vec![53, 23, 101, 101, 10] }
}

pub trait TableEst {
    fn name(&self) -> String;
    fn est(&self, preds: &[Pred]) -> f64;
    fn bytes(&self) -> usize;
}

/// Per-column MCV + histogram, predicates multiplied: the model of every optimizer before extended statistics.
pub struct Indep { n: f64, cols: Vec<Compressed> }
impl Indep {
    pub fn new(t: &Table) -> Self {
        let cols = t.cols.iter().map(|col| {
            let mut v: Vec<i64> = col.iter().map(|&x| x as i64).collect();
            v.sort_unstable();
            Compressed::build(&runs(&v), 20, 20, 1.0)
        }).collect();
        Indep { n: t.n() as f64, cols }
    }
    pub fn sel(&self, p: &Pred) -> f64 {
        match *p {
            Pred::Eq(c, v) => Estimator::eq(&self.cols[c], v as i64) / self.n,
            Pred::Range(c, lo, hi) => Estimator::range(&self.cols[c], lo as i64, hi as i64) / self.n,
        }
    }
}
impl TableEst for Indep {
    fn name(&self) -> String { "independence".into() }
    fn est(&self, preds: &[Pred]) -> f64 { self.n * preds.iter().map(|p| self.sel(p)).product::<f64>() }
    fn bytes(&self) -> usize { self.cols.iter().map(|c| c.bytes()).sum() }
}

/// Exact joint counts for chosen column pairs (`CREATE STATISTICS … (mcv)` over two columns, all combinations kept);
/// a query uses a pair only when it has an equality on both columns, and independence for everything else.
pub struct ColGroup { base: Indep, pairs: Vec<((usize, usize), HashMap<(u32, u32), f64>)> }
impl ColGroup {
    pub fn new(t: &Table, pairs: &[(usize, usize)]) -> Self {
        let pairs = pairs.iter().map(|&(x, y)| {
            let mut m = HashMap::new();
            for i in 0..t.n() { *m.entry((t.cols[x][i], t.cols[y][i])).or_insert(0.0) += 1.0; }
            ((x, y), m)
        }).collect();
        ColGroup { base: Indep::new(t), pairs }
    }
}
impl TableEst for ColGroup {
    fn name(&self) -> String { "column-group counts".into() }
    fn est(&self, preds: &[Pred]) -> f64 {
        let mut used = vec![false; preds.len()];
        let mut sel = 1.0;
        for ((x, y), m) in &self.pairs {
            let fx = preds.iter().position(|p| matches!(p, Pred::Eq(c, _) if c == x));
            let fy = preds.iter().position(|p| matches!(p, Pred::Eq(c, _) if c == y));
            if let (Some(i), Some(j)) = (fx, fy) {
                if let (Pred::Eq(_, vx), Pred::Eq(_, vy)) = (preds[i], preds[j]) {
                    sel *= m.get(&(vx, vy)).copied().unwrap_or(0.0) / self.base.n;
                    used[i] = true; used[j] = true;
                }
            }
        }
        for (i, p) in preds.iter().enumerate() { if !used[i] { sel *= self.base.sel(p); } }
        sel * self.base.n
    }
    fn bytes(&self) -> usize { self.base.bytes() + self.pairs.iter().map(|(_, m)| m.len() * 16).sum::<usize>() }
}

/// Functional-dependency degree `f(x -> y)` in [0, 1] (here: the share of rows that agree with the most common `y`
/// of their `x`), applied as `P(x=u, y=v) = P(x=u) * (f + (1 - f) * P(y=v))`, the formula PostgreSQL uses.
pub struct FdEst { base: Indep, deps: Vec<(usize, usize, f64)> }
impl FdEst {
    pub fn new(t: &Table, deps: &[(usize, usize)]) -> Self {
        let deps = deps.iter().map(|&(x, y)| {
            let mut m: HashMap<(u32, u32), f64> = HashMap::new();
            for i in 0..t.n() { *m.entry((t.cols[x][i], t.cols[y][i])).or_insert(0.0) += 1.0; }
            let mut best: HashMap<u32, f64> = HashMap::new();
            for (&(xv, _), &c) in &m { let e = best.entry(xv).or_insert(0.0); if c > *e { *e = c; } }
            (x, y, best.values().sum::<f64>() / t.n() as f64)
        }).collect();
        FdEst { base: Indep::new(t), deps }
    }
}
impl TableEst for FdEst {
    fn name(&self) -> String { "functional dependency".into() }
    fn est(&self, preds: &[Pred]) -> f64 {
        let mut used = vec![false; preds.len()];
        let mut sel = 1.0;
        for &(x, y, f) in &self.deps {
            let fx = preds.iter().position(|p| matches!(p, Pred::Eq(c, _) if *c == x));
            let fy = preds.iter().position(|p| matches!(p, Pred::Eq(c, _) if *c == y));
            if let (Some(i), Some(j)) = (fx, fy) {
                sel *= self.base.sel(&preds[i]) * (f + (1.0 - f) * self.base.sel(&preds[j]));
                used[i] = true; used[j] = true;
            }
        }
        for (i, p) in preds.iter().enumerate() { if !used[i] { sel *= self.base.sel(p); } }
        sel * self.base.n
    }
    fn bytes(&self) -> usize { self.base.bytes() + self.deps.len() * 24 }
}

/// Count matches in a uniform row sample and scale up; with zero matches there is no information, so fall back
/// to independence (the "0-tuple problem" every sampling estimator has).
pub struct RowSample<'a> { rows: Vec<usize>, t: &'a Table, scale: f64, fallback: Indep, pub zero_hits: std::cell::Cell<u32> }
impl<'a> RowSample<'a> {
    pub fn new(t: &'a Table, r: &mut Rng, m: usize) -> Self {
        let rows = (0..m).map(|_| r.next(t.n() as u64) as usize).collect();
        RowSample { rows, t, scale: t.n() as f64 / m as f64, fallback: Indep::new(t), zero_hits: Default::default() }
    }
}
impl TableEst for RowSample<'_> {
    fn name(&self) -> String { format!("row sample ({})", self.rows.len()) }
    fn est(&self, preds: &[Pred]) -> f64 {
        let hits = self.rows.iter().filter(|&&i| preds.iter().all(|p| p.holds(self.t.cols[p.col()][i]))).count();
        if hits == 0 { self.zero_hits.set(self.zero_hits.get() + 1); return self.fallback.est(preds); }
        hits as f64 * self.scale
    }
    /// The sampled rows themselves: m rows x (columns) x 4 bytes.
    fn bytes(&self) -> usize { self.rows.len() * self.t.cols.len() * 4 }
}

/// A Chow-Liu tree: the best tree-shaped Bayesian network by mutual information. Learned from data, stores one
/// conditional table per column, answers any conjunction of equality/range predicates by message passing.
pub struct ChowLiu { n: f64, parent: Vec<Option<usize>>, order: Vec<usize>, cpt: Vec<Vec<f64>>, doms: Vec<usize> }
impl ChowLiu {
    pub fn fit(t: &Table) -> Self {
        let (m, n) = (t.cols.len(), t.n());
        let joint = |x: usize, y: usize| {
            let mut c = vec![0.0f64; t.doms[x] * t.doms[y]];
            for i in 0..n { c[t.cols[x][i] as usize * t.doms[y] + t.cols[y][i] as usize] += 1.0; }
            c
        };
        let marg: Vec<Vec<f64>> = (0..m).map(|x| {
            let mut c = vec![0.0; t.doms[x]];
            for &v in &t.cols[x] { c[v as usize] += 1.0; }
            c
        }).collect();
        // pairwise mutual information
        let mut mi = vec![vec![0.0f64; m]; m];
        for x in 0..m { for y in x + 1..m {
            let j = joint(x, y);
            let mut s = 0.0;
            for u in 0..t.doms[x] { for v in 0..t.doms[y] {
                let p = j[u * t.doms[y] + v] / n as f64;
                if p > 0.0 { s += p * (p * n as f64 * n as f64 / (marg[x][u] * marg[y][v])).ln(); }
            } }
            mi[x][y] = s; mi[y][x] = s;
        } }
        // maximum spanning tree (Prim) from column 0
        let (mut parent, mut order, mut in_tree) = (vec![None; m], vec![0usize], vec![false; m]);
        in_tree[0] = true;
        while order.len() < m {
            let mut best = (-1.0, 0, 0);
            for &u in &order { for v in 0..m { if !in_tree[v] && mi[u][v] > best.0 { best = (mi[u][v], u, v); } } }
            parent[best.2] = Some(best.1);
            in_tree[best.2] = true;
            order.push(best.2);
        }
        // conditional tables with a small additive smoothing
        let alpha = 0.1;
        let cpt = (0..m).map(|v| match parent[v] {
            None => { let tot: f64 = marg[v].iter().sum::<f64>() + alpha * t.doms[v] as f64; marg[v].iter().map(|&c| (c + alpha) / tot).collect() }
            Some(p) => {
                let j = joint(p, v);
                let mut out = vec![0.0; t.doms[p] * t.doms[v]];
                for px in 0..t.doms[p] {
                    let tot = marg[p][px] + alpha * t.doms[v] as f64;
                    for x in 0..t.doms[v] { out[px * t.doms[v] + x] = (j[px * t.doms[v] + x] + alpha) / tot; }
                }
                out
            }
        }).collect();
        ChowLiu { n: n as f64, parent, order, cpt, doms: t.doms.clone() }
    }

    /// P(all predicates hold): sum-product on the tree, children before parents.
    pub fn prob(&self, preds: &[Pred]) -> f64 {
        let mut allowed: Vec<Vec<bool>> = self.doms.iter().map(|&d| vec![true; d]).collect();
        for p in preds { for x in 0..self.doms[p.col()] { if !p.holds(x as u32) { allowed[p.col()][x] = false; } } }
        let mut below: Vec<Vec<f64>> = self.doms.iter().map(|&d| vec![1.0; d]).collect();
        for &v in self.order.iter().rev() {
            match self.parent[v] {
                Some(p) => {
                    for px in 0..self.doms[p] {
                        let mut s = 0.0;
                        for x in 0..self.doms[v] { if allowed[v][x] { s += self.cpt[v][px * self.doms[v] + x] * below[v][x]; } }
                        below[p][px] *= s;
                    }
                }
                None => return (0..self.doms[v]).filter(|&x| allowed[v][x]).map(|x| self.cpt[v][x] * below[v][x]).sum(),
            }
        }
        unreachable!("the root is always in the order")
    }
    /// Probability the model assigns to one full row (the product of the conditional tables).
    pub fn point(&self, x: &[u32]) -> f64 {
        (0..x.len()).map(|v| match self.parent[v] {
            None => self.cpt[v][x[v] as usize],
            Some(p) => self.cpt[v][x[p] as usize * self.doms[v] + x[v] as usize],
        }).product()
    }
    pub fn tree(&self) -> Vec<(usize, Option<usize>)> { self.order.iter().map(|&v| (v, self.parent[v])).collect() }
}
impl TableEst for ChowLiu {
    fn name(&self) -> String { "Chow-Liu tree".into() }
    fn est(&self, preds: &[Pred]) -> f64 { self.n * self.prob(preds) }
    fn bytes(&self) -> usize { self.cpt.iter().map(|c| c.len() * 8).sum() }
}

// =====================================================================================================
// Part B: a star schema with skew and correlation across joins
// =====================================================================================================

/// customers(id, country, seg) <- orders(cust, prod) -> products(id, cat);  shipments(order, carrier) -> orders.
/// Customers and products are numbered by popularity (id 0 is the most ordered). The popular customers all live in
/// country 0 or 1 and buy mostly category-0 products; their orders have more shipments, with country-specific
/// carriers. Every one of those facts is invisible to per-table statistics.
pub struct Shop {
    pub cust_country: Vec<u32>, pub cust_seg: Vec<u32>, pub prod_cat: Vec<u32>,
    pub ord_cust: Vec<u32>, pub ord_prod: Vec<u32>,
    pub ship_carrier: Vec<u32>, pub ships_of: Vec<Vec<u32>>,
}
fn zipf_ranks(r: &mut Rng, n: usize, domain: usize, theta: f64) -> Vec<u32> {
    let mut cdf = Vec::with_capacity(domain);
    let mut s = 0.0;
    for k in 1..=domain { s += 1.0 / (k as f64).powf(theta); cdf.push(s); }
    (0..n).map(|_| { let u = r.unit() * s; cdf.partition_point(|&c| c < u).min(domain - 1) as u32 }).collect()
}
impl Shop {
    pub fn generate(r: &mut Rng, customers: usize, products: usize, orders: usize) -> Shop {
        let cust_country: Vec<u32> = (0..customers).map(|rank| {
            if rank < customers / 100 { 0 } else if rank < customers / 20 { 1 } else { 2 + r.next(18) as u32 }
        }).collect();
        let cust_seg = cust_country.iter().map(|&c| if r.unit() < 0.8 { c % 5 } else { r.next(5) as u32 }).collect();
        let prod_cat: Vec<u32> = (0..products).map(|rank| {
            if rank < products / 100 { 0 } else if rank < products / 20 { 1 } else { 2 + (rank % 14) as u32 }
        }).collect();
        let ord_cust = zipf_ranks(r, orders, customers, 1.0);
        let mut ord_prod = zipf_ranks(r, orders, products, 0.8);
        for (o, p) in ord_prod.iter_mut().enumerate() {
            if cust_country[ord_cust[o] as usize] == 0 && r.unit() < 0.5 { *p = r.next((products / 100).max(1) as u64) as u32; }
        }
        let mut ship_carrier = Vec::new();
        let mut ships_of = vec![Vec::new(); orders];
        for o in 0..orders {
            let country = cust_country[ord_cust[o] as usize];
            let k = if country == 0 { 1 + r.next(6) } else { r.next(3) };
            for _ in 0..k {
                let carrier = if r.unit() < 0.6 { (country * 3 + r.next(2) as u32) % 8 } else { r.next(8) as u32 };
                ships_of[o].push(ship_carrier.len() as u32);
                ship_carrier.push(carrier);
            }
        }
        Shop { cust_country, cust_seg, prod_cat, ord_cust, ord_prod, ship_carrier, ships_of }
    }
    pub fn n_orders(&self) -> usize { self.ord_cust.len() }
}

/// SELECT … FROM customers C, orders O, products P, shipments S WHERE (joins) AND C.country = ? [AND C.seg = ?]
/// AND P.cat = ? AND S.carrier = ?
#[derive(Clone, Copy, Debug)]
pub struct ShopQuery { pub country: u32, pub seg: Option<u32>, pub cat: u32, pub carrier: u32 }
pub const C: u8 = 1; pub const O: u8 = 2; pub const P: u8 = 4; pub const S: u8 = 8;

/// Predicates drawn from one random order (its customer, product and a shipment), the way a real workload
/// looks (the query asks about something that exists), or at random with `from_row = false`.
pub fn shop_query(s: &Shop, r: &mut Rng, from_row: bool) -> ShopQuery {
    if from_row {
        let o = r.next(s.n_orders() as u64) as usize;
        let carrier = s.ships_of[o].first().map_or(r.next(8) as u32, |&i| s.ship_carrier[i as usize]);
        let seg = if r.unit() < 0.5 { Some(s.cust_seg[s.ord_cust[o] as usize]) } else { None };
        ShopQuery { country: s.cust_country[s.ord_cust[o] as usize], seg, cat: s.prod_cat[s.ord_prod[o] as usize], carrier }
    } else {
        ShopQuery { country: r.next(20) as u32, seg: if r.unit() < 0.5 { Some(r.next(5) as u32) } else { None }, cat: r.next(16) as u32, carrier: r.next(8) as u32 }
    }
}

/// True cardinality of every connected subset of {C, O, P, S}: the joins are FK-PK around the hub O.
pub fn shop_truth(s: &Shop, q: &ShopQuery) -> [f64; 16] {
    let cpass = |c: u32| s.cust_country[c as usize] == q.country && q.seg.is_none_or(|g| s.cust_seg[c as usize] == g);
    let ppass = |p: u32| s.prod_cat[p as usize] == q.cat;
    let mut t = [0.0f64; 16];
    t[C as usize] = s.cust_country.iter().enumerate().filter(|(i, _)| cpass(*i as u32)).count() as f64;
    t[P as usize] = s.prod_cat.iter().filter(|&&c| c == q.cat).count() as f64;
    t[S as usize] = s.ship_carrier.iter().filter(|&&c| c == q.carrier).count() as f64;
    t[O as usize] = s.n_orders() as f64;
    for o in 0..s.n_orders() {
        let c = cpass(s.ord_cust[o]) as u8 as f64;
        let p = ppass(s.ord_prod[o]) as u8 as f64;
        let k = s.ships_of[o].iter().filter(|&&i| s.ship_carrier[i as usize] == q.carrier).count() as f64;
        t[(C | O) as usize] += c;
        t[(O | P) as usize] += p;
        t[(O | S) as usize] += k;
        t[(C | O | P) as usize] += c * p;
        t[(C | O | S) as usize] += c * k;
        t[(O | P | S) as usize] += p * k;
        t[(C | O | P | S) as usize] += c * p * k;
    }
    t
}

pub trait ShopEst {
    fn name(&self) -> String;
    fn est(&self, q: &ShopQuery, mask: u8) -> f64;
}

/// Per-table exact single-column frequencies, selectivities multiplied, FK joins assumed uniform:
/// |O ⋈ C'| = |O| · |C'| / |C|. What a System R-style optimizer does.
pub struct ShopIndep {
    nc: f64, np: f64, no: f64, ns: f64,
    country: Vec<f64>, seg: Vec<f64>, cat: Vec<f64>, carrier: Vec<f64>,
}
impl ShopIndep {
    pub fn new(s: &Shop) -> Self {
        let freq = |v: &[u32], d: usize| { let mut f = vec![0.0; d]; for &x in v { f[x as usize] += 1.0; } f };
        ShopIndep {
            nc: s.cust_country.len() as f64, np: s.prod_cat.len() as f64, no: s.n_orders() as f64, ns: s.ship_carrier.len() as f64,
            country: freq(&s.cust_country, 20), seg: freq(&s.cust_seg, 5), cat: freq(&s.prod_cat, 16), carrier: freq(&s.ship_carrier, 8),
        }
    }
    fn fractions(&self, q: &ShopQuery) -> (f64, f64, f64) {
        let fc = self.country[q.country as usize] / self.nc * q.seg.map_or(1.0, |g| self.seg[g as usize] / self.nc);
        let fp = self.cat[q.cat as usize] / self.np;
        let fs = self.carrier[q.carrier as usize] / self.ns;
        (fc, fp, fs)
    }
}
impl ShopEst for ShopIndep {
    fn name(&self) -> String { "independence + uniform joins".into() }
    fn est(&self, q: &ShopQuery, mask: u8) -> f64 {
        let (fc, fp, fs) = self.fractions(q);
        let mut rows = if mask & O != 0 { self.no } else { 1.0 };
        let mut base = |present: bool, n: f64, f: f64, fk_fanout: f64| {
            if !present { return; }
            if mask & O != 0 { rows *= f * fk_fanout; } else { rows = n * f; }
        };
        base(mask & C != 0, self.nc, fc, 1.0);
        base(mask & P != 0, self.np, fp, 1.0);
        base(mask & S != 0, self.ns, fs, self.ns / self.no); // each order has ns/no shipments on average
        rows
    }
}

/// Index-based join sampling: keep a uniform sample of the hub `orders`, and evaluate every predicate on the sampled
/// order's customer, product and shipments through the primary-key / foreign-key indexes. Correlations and skew
/// across joins are captured; selective queries return zero sample hits and fall back to the independence model.
pub struct JoinSample<'a> { s: &'a Shop, sample: Vec<u32>, fallback: ShopIndep, pub fell_back: std::cell::Cell<u32>, pub asked: std::cell::Cell<u32> }
impl<'a> JoinSample<'a> {
    pub fn new(s: &'a Shop, r: &mut Rng, m: usize) -> Self {
        JoinSample { s, sample: (0..m).map(|_| r.next(s.n_orders() as u64) as u32).collect(), fallback: ShopIndep::new(s), fell_back: Default::default(), asked: Default::default() }
    }
}
impl ShopEst for JoinSample<'_> {
    fn name(&self) -> String { format!("join sample ({} orders)", self.sample.len()) }
    fn est(&self, q: &ShopQuery, mask: u8) -> f64 {
        if mask & O == 0 { return self.fallback.est(q, mask); }
        let s = self.s;
        let mut hits = 0.0;
        for &o in &self.sample {
            let o = o as usize;
            let mut w = 1.0;
            if mask & C != 0 {
                let c = s.ord_cust[o] as usize;
                if !(s.cust_country[c] == q.country && q.seg.is_none_or(|g| s.cust_seg[c] == g)) { continue; }
            }
            if mask & P != 0 && s.prod_cat[s.ord_prod[o] as usize] != q.cat { continue; }
            if mask & S != 0 { w = s.ships_of[o].iter().filter(|&&i| s.ship_carrier[i as usize] == q.carrier).count() as f64; }
            hits += w;
        }
        self.asked.set(self.asked.get() + 1);
        if hits == 0.0 { self.fell_back.set(self.fell_back.get() + 1); return self.fallback.est(q, mask); }
        hits * s.n_orders() as f64 / self.sample.len() as f64
    }
}

// =====================================================================================================
// Part C: plans chosen from estimates
// =====================================================================================================

fn connected(m: u8) -> bool { m.count_ones() == 1 || m & O != 0 }

/// Best plan (minimum C_out = sum of the cardinalities of all join results) under a cardinality function.
/// A subset can be a join result only if it is connected (a single table, or the hub plus anything); disconnected
/// subsets keep infinite cost, so no cross product is ever chosen.
/// Returns the chosen split (left submask) for every connected subset.
pub fn plan(card: &dyn Fn(u8) -> f64) -> [u8; 16] {
    let mut cost = [f64::INFINITY; 16];
    let mut split = [0u8; 16];
    for m in 1u8..16 {
        if m.count_ones() == 1 { cost[m as usize] = 0.0; continue; }
        let mut a = (m - 1) & m;
        while a > 0 {
            let b = m ^ a;
            if connected(a) && connected(b) {
                let c = cost[a as usize] + cost[b as usize] + card(m);
                if c < cost[m as usize] { cost[m as usize] = c; split[m as usize] = a; }
            }
            a = (a - 1) & m;
        }
    }
    split
}

/// Cost of an already-chosen plan under a (different) cardinality function.
pub fn plan_cost(split: &[u8; 16], m: u8, card: &dyn Fn(u8) -> f64) -> f64 {
    if m.count_ones() == 1 { return 0.0; }
    let a = split[m as usize];
    plan_cost(split, a, card) + plan_cost(split, m ^ a, card) + card(m)
}

/// The order in which dimensions join the hub (for display): e.g. "C P S".
pub fn plan_order(split: &[u8; 16]) -> String {
    let mut m = C | O | P | S;
    let mut out = Vec::new();
    while m.count_ones() > 1 {
        let a = split[m as usize];
        let (hub_side, other) = if a & O != 0 { (a, m ^ a) } else { (m ^ a, a) };
        out.push(match other { C => 'C', P => 'P', S => 'S', _ => '?' });
        m = hub_side;
    }
    out.reverse();
    out.iter().map(|c| c.to_string()).collect::<Vec<_>>().join(" ")
}

/// Standard normal from two uniforms (Box-Muller), for multiplicative estimation noise.
pub fn gauss(r: &mut Rng) -> f64 {
    let (u, v) = (r.unit().max(1e-12), r.unit());
    (-2.0 * u.ln()).sqrt() * (2.0 * std::f64::consts::PI * v).cos()
}
