<p>The graph is an R-MAT graph: each edge picks a quadrant of the adjacency matrix recursively, which gives the skewed degrees of a social network. 2 000 000 random edges over 131 072 vertices leave 1 858 058 distinct ones; the largest vertex has 9 574 out-edges while the median vertex has one.</p>

```text title="BFS in three modes, shortest paths, triangles three ways, pattern matching, and key space against CSR"
R-MAT graph: 131072 vertices, 1858058 distinct edges, built in 0.32 s; maximum out-degree 9574, median 1
BFS from the hub       edges examined           ms    reached
TopDown                       1838809          2.2      76609
BottomUp                       727797          2.4      76609
Hybrid                          90516          1.0      76609
shortest path between random connected pairs (90 of 200): one-directional search examines 1924950 edges on average, bidirectional 4472
triangles in a graph of 16384 vertices and 167467 edges: 1700025; adjacency intersection 128 ms; intersection on the degree-ordered DAG 30 ms; edge-join-edge then probe 44 ms with 29273867 intermediate 2-paths (175x the 167467 edges)
transitive triangles by variable-at-a-time extension in a graph with 23784 edges: 305283 matches, 4151602 adjacency entries read, 20 ms
160000 edges in the key space (both directions stored): load 1439 ns per edge; out-neighbours by prefix scan 9537 ns; CSR snapshot built in 187 ms; out-neighbours from CSR 2 ns (6150x faster) [1760000]
```

<ul> <li><strong>Direction-optimizing BFS examines 20× fewer edges</strong>: from the hub, top-down looks at 1 838 809 edges to reach 76 609 vertices, pure bottom-up at 727 797, the hybrid at <strong>90 516</strong>, and takes 1.0 ms against 2.2. Almost every edge a top-down search examines in the middle levels points back at an already reached vertex.</li> <li><strong>Bidirectional search examines 430× fewer edges</strong>: between random connected pairs, a one-directional search examines 1.9 million edges on average (essentially the whole component), the bidirectional one 4 472.</li> <li><strong>The relational plan builds 175 times more rows than there are edges</strong>: pairing every edge with every edge that continues it creates 29.3 million two-edge paths in a graph of 167 467 edges, to find 1.7 million triangles. A naive intersection of the two neighbour lists of each edge is <em>slower</em> here (128 ms) than that join plan with a binary-search probe (44 ms), because the hubs' lists are long; with degree-ordered orientation it is the fastest (<strong>30 ms</strong>, no intermediate rows), as the theory says.</li> <li><strong>Variable-at-a-time matching</strong> of the transitive-triangle pattern in a smaller graph reads 4.2 million adjacency entries for 305 283 matches in 20 ms without a pairwise intermediate relation.</li> <li><strong>Key space against CSR</strong>: out-neighbours of a vertex cost 9.5 µs through the transaction layer (a prefix scan, a key decode per edge, versions and the write overlay) and 2 ns from the CSR snapshot, which takes 187 ms to build for 160 000 edges. The key space is for transactional access and small traversals; analytics run on a snapshot.</li> </ul>

<aside data-call="note"><b>A bug of duplicates, and a bound that was only true in theory</b><p>The first triangle count disagreed with brute force on the very first seed (27 against 21). The CSR kept one edge per <code>(source, target, label)</code>, so a pair that exists under two labels appeared twice in a vertex's neighbour list and every intersection counted it twice. The undirected algorithms now run on a symmetrized graph that forgets labels and keeps each neighbour once, and a test asserts that such lists are strictly sorted. The second surprise is in the table above: the <em>textbook-optimal</em> intersection plan lost to the join plan until edges were oriented by degree. Worst-case optimality is a statement about the best ordering; a plan that ignores skew does not get it.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>CSR as two <code>Vec&lt;u32&gt;</code>s</strong> and an <code>adj(v) -&gt; &amp;[u32]</code> returning a slice: every algorithm is a loop over slices, which the compiler optimizes well and which the borrow checker keeps free of aliasing questions. Labels live in a parallel array and are zipped when needed.</li> <li><strong>Direction-optimizing BFS needs the reverse graph</strong>: <code>bfs(g, rev, src, mode)</code> takes both; <code>Csr::reverse</code> builds one by re-sorting the edge list.</li> <li><strong><code>intersect</code> chooses its algorithm by the size ratio</strong>: a merge for similar lengths and an exponential-then-binary search from the last position for very different ones; the result is pushed into a caller-provided buffer, so the triangle loops allocate nothing per edge.</li> <li><strong>Pattern matching recursion</strong>: <code>count_matches</code> recurses over variables; at each depth it builds the sorted, distinct neighbour list for every pattern edge to a bound variable, intersects them, and loops over the survivors. Labels are optional (<code>Option&lt;u8&gt;</code>), and a self-loop pattern edge is checked once its variable is bound.</li> <li><strong>The store keeps edges as <code>()</code>-valued keys</strong>: all information is in the key, so an edge costs one small key per direction and nothing in the value.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Search algorithms (200 random graphs of 2 to 31 vertices)</strong>: all three BFS modes from every source equal Floyd–Warshall distances; the bidirectional distance equals the matrix for every pair, including unreachable ones; components agree with reachability in the symmetrized graph; reversing a graph twice restores it; symmetrized lists are sorted, distinct and without self loops.</li> <li><strong>Intersection</strong>: 3 000 pairs of sorted lists with size ratios from 1 to over 50 equal the naive intersection, covering both the merge and the galloping branch.</li> <li><strong>Triangles and patterns (100 random graphs)</strong>: the three triangle counters equal a triple loop; six patterns (a transitive triangle, a labelled two-path, an out-star, a four-cycle, a mutual edge, a self loop with an out-edge) equal full enumeration of all vertex assignments over the directed, labelled graph.</li> <li><strong>The key-space store (60 seeds × 120 steps)</strong>: three concurrent snapshot transactions add and remove edges and read out- and in-neighbours (with and without a label); every read equals the model's view of the transaction including its own writes; the committed CSR snapshot equals the model's edge set.</li> <li><strong>Direction optimization</strong>: on a skewed graph the hybrid search returns the same distances as top-down while examining under a third of the edges.</li> <li><strong>Mutants run against these tests</strong>: bottom-up search over out-edges; a bidirectional path one hop short; components never merging; a pattern ignoring labels, not intersecting its candidates or not checking a self loop; the ordered triangle count intersecting the wrong lists; an edge stored without its in-edge, or removed without it; duplicates kept in the CSR; the symmetrized graph keeping self loops; the hybrid search never switching direction. <strong>All 12 were killed</strong>; two further mutants (the galloping step re-examining a matched element, and counting <code>w ≥ v</code> in a graph that has no self loops) change nothing observable and are equivalent.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Neo4j</strong> stores records with direct pointers (index-free adjacency) and compiles Cypher to expand-style operators; <strong>Kùzu</strong> (embedded, columnar) uses CSR-like storage with worst-case-optimal multiway joins; <strong>TigerGraph</strong>, <strong>JanusGraph</strong> (over Cassandra/HBase), <strong>Dgraph</strong> (over a key-value store, posting lists of sorted ids) and <strong>ArangoDB</strong> (documents plus edge collections) show the range of designs. <strong>Apache AGE</strong> and <strong>SQL/PGQ</strong> (SQL:2023) add graph patterns to relational engines; <strong>DuckPGQ</strong> compiles them to joins and CSR.</li> <li><strong>Graph analytics frameworks</strong>: <strong>GraphBLAS</strong> (linear-algebra BFS, direction optimization built in), <strong>Ligra</strong>, <strong>GAP Benchmark Suite</strong>, <strong>Pregel/Giraph</strong> and <strong>GraphX</strong> for distributed vertex-centric computation.</li> <li><strong>Worst-case-optimal joins</strong> (Leapfrog Triejoin, Generic Join) are in <strong>LogicBlox/RelationalAI</strong>, <strong>Umbra</strong> and <strong>Kùzu</strong>, and are the subject of the Part II section on multi-way joins; the degree-ordering trick is the standard preprocessing for triangle counting everywhere.</li> <li><strong>Property graphs on key-value stores</strong> use the layout of <a href="/cookbook/p/one-key-space">M1</a>: both adjacency directions as ordered keys, as <strong>SurrealDB</strong> does for its <code>RELATE</code> edges.</li> <li><strong>Path queries</strong> (shortest, k-shortest, reachability under regular expressions) are bidirectional or index-assisted in production; reachability indexes (2-hop labels, interval labels) answer the question without traversal.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Hubs are the norm.</strong> A vertex with millions of edges makes a naive expansion a denial of service; cap fan-out in traversals, use degree-aware algorithms, and store hub adjacency in several chunks.</li> <li><strong>Edge direction and double storage</strong> double the write cost and the space; a consistent pair of keys depends on the transaction layer, so bulk loads that bypass it must write both.</li> <li><strong>Counting versus enumerating</strong>: homomorphism counts (what <code>count_matches</code> returns) differ from subgraph isomorphism counts (distinct vertices); <code>MATCH</code> semantics require declaring which one you mean (Cypher forbids repeating an edge; SQL/PGQ has path modes).</li> <li><strong>Cycles and path explosion</strong>: unbounded variable-length paths over a cyclic graph never end; require a bound, a visited set, or a path mode that forbids repeated vertices.</li> <li><strong>Snapshots are stale the moment they are built.</strong> An analytics snapshot at timestamp <em>t</em> must be labelled with <em>t</em>, and incremental maintenance of derived results is a different problem (<a href="/cookbook/p/streams-and-windows">M17</a>).</li> <li><strong>Degree skew defeats partitioning</strong>: hash-partitioned graphs put a hub's edges on one machine or cut almost every edge; vertex-cut partitioning and replication of hubs are the usual answers (<a href="/cookbook/p/sharding">M9</a>).</li> </ul></aside>
