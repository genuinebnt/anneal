[[sections]]
heading = "Design notes"
body = """
**Input**: for each query, a ranked list of document ids, and judgements that give some documents a grade. Grade 0 means judged and not relevant. A document with no grade is UNJUDGED, which is not the same as 0.

The metrics count it as 0 unless you ask otherwise, so this file also reports how many results were unjudged.

**Conventions**: precision@k always divides by k, also for a short list. Recall, average precision and nDCG have no value for a query with no relevant document. nDCG builds its ideal list from every judged document, not only the returned ones. A list that repeats a document is refused.

**Ties**: when scores are equal, the order is an accident. For DCG the average over all tie orders has a short form: each place in a tied group gets the group's mean gain.

**Comparing two RANKERS**: use the same queries and take the difference per query. A sign-flip randomisation test and a bootstrap interval work on those differences. The simulations here measure their false alarms and coverage, and what happens when the best of twenty equal rankers is reported.
"""

