[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from their papers and documentation, not a summary of what any speaker said.)</em></p>

<ul> <li><strong>The workload</strong>: store millions to billions of <strong>embeddings</strong> (arrays of 128 to 3 072 floats produced by a model) and answer <em>k-nearest-neighbour</em> queries: "the 10 stored vectors closest to this one", usually combined with <strong>filters</strong> ("…among documents of this tenant, newer than last month") and often with <strong>keyword search</strong> (hybrid retrieval). Distances are Euclidean, cosine (normalize, then it is Euclidean) or inner product.</li> <li><strong>Exact search is <code>O(n·d)</code> per query.</strong> At 200 000 vectors of 64 floats a scan takes 0.9 ms; at 100 million vectors of 768 floats it is a 300 GB read per query. Everything in a vector database exists to avoid that, by <strong>approximate nearest-neighbour (ANN)</strong> search that trades a little <strong>recall</strong> (the fraction of the true top-k found) for orders of magnitude in speed.</li> <li><strong>Four families of index</strong>: <em>partitioning</em> (IVF: cluster the vectors with k-means, scan only the lists nearest to the query), <em>graph</em> (HNSW, DiskANN/Vamana: walk a neighbourhood graph greedily toward the query), <em>quantization</em> (scalar, product and binary quantization: shrink each vector to bytes or bits and compare approximately), and <em>hashing/trees</em> (LSH, random-projection forests; mostly displaced). Production systems combine them: IVF with PQ codes, HNSW over quantized vectors, graph on disk with PQ in memory and full vectors on SSD.</li> <li><strong>The three-way trade-off is recall, speed and memory</strong> (and a fourth axis: build time and update cost). There is no best index; there is a Pareto front per dataset, and the measurements below draw one.</li> <li><strong>Quantization is mostly about memory, and re-ranking buys back accuracy.</strong> Product quantization splits a vector into <code>m</code> sub-vectors and replaces each by the id of its nearest of 256 centroids: <code>m</code> bytes per vector, distances from a lookup table. At 16 bytes per vector the codes alone have mediocre recall; fetching the best few hundred candidates' full vectors and re-scoring exactly restores it. That makes the design asymmetric: <strong>codes in RAM, full vectors on slower storage</strong>.</li> <li><strong>HNSW</strong> (Malkov and Yashunin): a hierarchy of proximity graphs; upper layers are sparse long-range shortcuts, layer 0 holds every vector. A query descends greedily to layer 0, then runs a best-first search with a beam of width <code>ef</code>. <code>M</code> (links per node) and <code>ef</code> are the recall/speed knobs; inserting needs no training and is incremental, deleting is hard (tombstones, repair, or rebuild).</li> <li><strong>Filters are the hard part in practice.</strong> A filter changes the problem: results must satisfy a predicate that the index knows nothing about. Strategies: <strong>post-filter</strong> (search, then discard; fails when the filter is selective), <strong>pre-filter</strong> (scan the matching rows exactly; fine when few match), <strong>in-graph filtering</strong> (walk the whole graph but return only matching nodes; slows down as selectivity drops and can fail to reach matching nodes in a far region), and <strong>filter-aware indexes</strong> (extra links per payload value). A <strong>query planner</strong> picks among them from an estimate of the filter's selectivity: the same cardinality-estimation problem as <a href="/cookbook/p/cardinality-estimation">Q8</a>.</li> <li><strong>Storage shapes the index.</strong> On local disk and object storage, <em>random reads cost milliseconds</em>: a graph walk of a thousand dependent hops is slow, while an IVF probe reads a few large contiguous lists. This is why object-storage-native designs favour clustered layouts and why on-disk graph indexes (DiskANN) keep compressed vectors in memory and read full vectors for the final candidates only.</li> </ul>
"""

[[sections]]
heading = "Exact, and what it costs"
body = """
<p>A scan with a bounded max-heap of size <code>k</code>: for 200 000 vectors of 64 <code>f32</code> the lab measures <strong>1 136 queries per second</strong> on one core (0.9 ms per query), reading 51 MB per query. A vectorizable distance loop is the baseline every index must beat; the loop below keeps eight independent accumulators so the compiler can use SIMD lanes.</p>
"""

[[sections]]
heading = "IVF"
body = """
<p>Train k-means on a sample to get <code>nlist</code> centroids, assign every vector to its nearest centroid (an <em>inverted file</em>: centroid → list of vectors). A query computes its distance to every centroid (<code>nlist</code> of them), picks the <code>nprobe</code> nearest lists and scans only those. Recall rises with <code>nprobe</code>; the cost is <code>nlist</code> centroid distances plus the vectors in the probed lists. IVF needs training (a few seconds here), is incremental only until the data distribution drifts from the centroids, and has contiguous lists, which is why it is friendly to disk and object storage.</p>
"""

[[sections]]
heading = "Product quantization"
body = """
<p>Split a <code>d</code>-dimensional vector into <code>m</code> sub-vectors of <code>d/m</code> dimensions; learn 256 centroids per sub-space (k-means on each); store the vector as <code>m</code> bytes. For a query build a <strong>distance table</strong> <code>T[j][c]</code> = squared distance from the query's j-th sub-vector to centroid <code>c</code>; the approximate distance to a stored code is <code>Σ_j T[j][code[j]]</code>: <code>m</code> lookups and additions per vector (<em>asymmetric distance computation</em>, ADC: the query stays exact, only the data is quantized). <strong>IVF-PQ</strong> quantizes the <em>residual</em> (vector minus its list centroid) so the codes spend their bits on what distinguishes vectors within a list; the table is then built per probed list from the query's residual against that centroid. Candidates are re-scored with full vectors.</p>
"""

[[sections]]
heading = "HNSW"
body = """
<p>Insert a vector at a random top layer <code>l = ⌊−ln(U)·m_L⌋</code> (so layer sizes shrink geometrically); descend greedily from the entry point through layers above <code>l</code>; at each layer from <code>l</code> down to 0 run a beam search of width <code>efConstruction</code>, pick up to <code>M</code> neighbours with a <strong>heuristic</strong> (keep a candidate only if it is closer to the new node than to every neighbour already kept, so links point in different directions and bridge clusters), link both ways, and if a neighbour exceeds its degree bound (<code>2M</code> on layer 0, <code>M</code> above) re-run the heuristic on its links. A query descends greedily to layer 0 and runs the beam search with width <code>ef</code>, using a <strong>visited set</strong> (a stamp per node, bumped per query so clearing is free).</p>

