//! Vector search indexes over `f32` vectors with squared L2 distance: exact scan, IVF (k-means partitions), product
//! quantization (PQ) with asymmetric distance tables, IVF-PQ with residuals and exact re-ranking, and HNSW (a hierarchy of
//! navigable small-world graphs), plus filtered search strategies.
use std::cmp::{Ordering, Reverse};
use std::collections::BinaryHeap;
use crate::card::gauss;
use crate::joinorder::Rng;

// ----------------------------------------------------------------------------------------------- basics

#[derive(Clone, Copy, PartialEq, Debug)]
pub struct Cand(pub f32, pub u32);
impl Eq for Cand {}
impl Ord for Cand { fn cmp(&self, o: &Self) -> Ordering { self.0.total_cmp(&o.0).then(self.1.cmp(&o.1)) } }
impl PartialOrd for Cand { fn partial_cmp(&self, o: &Self) -> Option<Ordering> { Some(self.cmp(o)) } }

/// Squared Euclidean distance, eight independent accumulators so the compiler can vectorize the loop.
#[inline]
pub fn l2(a: &[f32], b: &[f32]) -> f32 {
    let mut acc = [0f32; 8];
    let (ca, cb) = (a.chunks_exact(8), b.chunks_exact(8));
    let (ra, rb) = (ca.remainder(), cb.remainder());
    for (x, y) in ca.zip(cb) { for i in 0..8 { let d = x[i] - y[i]; acc[i] += d * d; } }
    let mut s: f32 = acc.iter().sum();
    for (x, y) in ra.iter().zip(rb) { let d = x - y; s += d * d; }
    s
}

pub struct Data { pub dim: usize, pub n: usize, pub v: Vec<f32> }
impl Data {
    #[inline] pub fn row(&self, i: u32) -> &[f32] { &self.v[i as usize * self.dim..(i as usize + 1) * self.dim] }
}

/// A Gaussian mixture: `clusters` centers drawn from N(0, center_scale²) per coordinate, points scattered around them with standard deviation `spread`. Returns the data and each point's cluster.
pub struct Mixture { pub dim: usize, pub centers: Vec<f32>, pub spread: f32 }
impl Mixture {
    pub fn new(rng: &mut Rng, dim: usize, clusters: usize, center_scale: f32, spread: f32) -> Self {
        Mixture { dim, centers: (0..clusters * dim).map(|_| center_scale * gauss(rng) as f32).collect(), spread }
    }
    pub fn sample(&self, rng: &mut Rng, n: usize) -> (Data, Vec<u32>) {
        let k = self.centers.len() / self.dim;
        let mut v = Vec::with_capacity(n * self.dim);
        let mut cl = Vec::with_capacity(n);
        for _ in 0..n {
            let c = rng.next(k as u64) as usize;
            cl.push(c as u32);
            for d in 0..self.dim { v.push(self.centers[c * self.dim + d] + self.spread * gauss(rng) as f32); }
        }
        (Data { dim: self.dim, n, v }, cl)
    }
}

/// Exact `k` nearest neighbours (ascending), over all rows or over a given subset of ids.
pub fn brute_topk(data: &Data, q: &[f32], k: usize, ids: Option<&[u32]>) -> Vec<Cand> {
    let mut heap: BinaryHeap<Cand> = BinaryHeap::with_capacity(k + 1);
    let mut visit = |i: u32| {
        let d = l2(q, data.row(i));
        if heap.len() < k { heap.push(Cand(d, i)); } else if d < heap.peek().unwrap().0 { heap.pop(); heap.push(Cand(d, i)); }
    };
    match ids { Some(s) => s.iter().for_each(|&i| visit(i)), None => (0..data.n as u32).for_each(&mut visit) }
    heap.into_sorted_vec()
}

pub fn recall(truth: &[Cand], got: &[Cand]) -> f64 {
    if truth.is_empty() { return 1.0; }
    let t: std::collections::HashSet<u32> = truth.iter().map(|c| c.1).collect();
    got.iter().filter(|c| t.contains(&c.1)).count() as f64 / truth.len() as f64
}

/// Run `f` for every item on `threads` threads (used for ground truth only).
pub fn par_map<T: Sync, R: Send>(items: &[T], threads: usize, f: impl Fn(&T) -> R + Sync) -> Vec<R> {
    let chunk = items.len().div_ceil(threads).max(1);
    let f = &f;
    std::thread::scope(|s| {
        let hs: Vec<_> = items.chunks(chunk).map(|part| s.spawn(move || part.iter().map(f).collect::<Vec<R>>())).collect();
        hs.into_iter().flat_map(|h| h.join().unwrap()).collect()
    })
}

// ----------------------------------------------------------------------------------------------- k-means

pub fn nearest(cents: &[f32], dim: usize, x: &[f32]) -> (usize, f32) {
    let mut best = (0usize, f32::INFINITY);
    for (i, c) in cents.chunks_exact(dim).enumerate() { let d = l2(x, c); if d < best.1 { best = (i, d); } }
    best
}

/// Lloyd's algorithm from `k` random distinct points; an emptied cluster is re-seeded with a random point.
pub fn kmeans(points: &[f32], dim: usize, k: usize, iters: usize, rng: &mut Rng) -> Vec<f32> {
    let n = points.len() / dim;
    assert!(n >= k);
    let mut picked = std::collections::HashSet::new();
    let mut cents = Vec::with_capacity(k * dim);
    while picked.len() < k { let i = rng.next(n as u64) as usize; if picked.insert(i) { cents.extend_from_slice(&points[i * dim..(i + 1) * dim]); } }
    for _ in 0..iters {
        let mut sum = vec![0f32; k * dim];
        let mut cnt = vec![0u32; k];
        for p in points.chunks_exact(dim) {
            let (c, _) = nearest(&cents, dim, p);
            cnt[c] += 1;
            for d in 0..dim { sum[c * dim + d] += p[d]; }
        }
        for c in 0..k {
            if cnt[c] == 0 { let i = rng.next(n as u64) as usize; cents[c * dim..(c + 1) * dim].copy_from_slice(&points[i * dim..(i + 1) * dim]); }
            else { for d in 0..dim { cents[c * dim + d] = sum[c * dim + d] / cnt[c] as f32; } }
        }
    }
    cents
}
pub fn inertia(points: &[f32], dim: usize, cents: &[f32]) -> f64 { points.chunks_exact(dim).map(|p| nearest(cents, dim, p).1 as f64).sum() }

// ----------------------------------------------------------------------------------------------- IVF

/// Inverted file: vectors grouped by nearest centroid; a query scans only the `nprobe` closest lists.
pub struct Ivf { pub dim: usize, pub cents: Vec<f32>, pub ids: Vec<Vec<u32>>, pub vecs: Vec<Vec<f32>> }
impl Ivf {
    pub fn build(data: &Data, nlist: usize, train: usize, iters: usize, rng: &mut Rng) -> Ivf {
        let dim = data.dim;
        let sample: Vec<f32> = (0..train.min(data.n)).flat_map(|_| data.row(rng.next(data.n as u64) as u32).to_vec()).collect();
        let cents = kmeans(&sample, dim, nlist, iters, rng);
        let assign = par_map(&(0..data.n as u32).collect::<Vec<_>>(), 8, |&i| nearest(&cents, dim, data.row(i)).0);
        let (mut ids, mut vecs) = (vec![vec![]; nlist], vec![vec![]; nlist]);
        for (i, &c) in assign.iter().enumerate() { ids[c].push(i as u32); vecs[c].extend_from_slice(data.row(i as u32)); }
        Ivf { dim, cents, ids, vecs }
    }
    pub fn nlist(&self) -> usize { self.ids.len() }
    /// The `nprobe` closest list ids to `q`.
    pub fn probe(&self, q: &[f32], nprobe: usize) -> Vec<usize> {
        let mut d: Vec<(f32, usize)> = self.cents.chunks_exact(self.dim).enumerate().map(|(i, c)| (l2(q, c), i)).collect();
        d.sort_by(|a, b| a.0.total_cmp(&b.0));
        d.into_iter().take(nprobe).map(|x| x.1).collect()
    }
    /// Returns the top-k and the number of vectors whose distance was computed (the I/O proxy).
    pub fn search(&self, q: &[f32], k: usize, nprobe: usize) -> (Vec<Cand>, usize) {
        let mut heap: BinaryHeap<Cand> = BinaryHeap::new();
        let mut scanned = 0;
        for l in self.probe(q, nprobe) {
            for (j, v) in self.vecs[l].chunks_exact(self.dim).enumerate() {
                scanned += 1;
                let d = l2(q, v);
                if heap.len() < k { heap.push(Cand(d, self.ids[l][j])); } else if d < heap.peek().unwrap().0 { heap.pop(); heap.push(Cand(d, self.ids[l][j])); }
            }
        }
        (heap.into_sorted_vec(), scanned)
    }
    pub fn memory_bytes(&self) -> usize { (self.cents.len() + self.vecs.iter().map(|v| v.len()).sum::<usize>()) * 4 + self.ids.iter().map(|v| v.len()).sum::<usize>() * 4 }
}

// ----------------------------------------------------------------------------------------------- product quantization

/// `m` sub-quantizers of 256 centroids each over consecutive `dim/m` coordinates: a vector becomes `m` bytes.
pub struct Pq { pub dim: usize, pub m: usize, pub dsub: usize, pub books: Vec<f32> }
impl Pq {
    pub fn train(sample: &[f32], dim: usize, m: usize, iters: usize, rng: &mut Rng) -> Pq {
        assert!(dim % m == 0);
        let dsub = dim / m;
        let n = sample.len() / dim;
        let mut books = Vec::with_capacity(m * 256 * dsub);
        for j in 0..m {
            let sub: Vec<f32> = (0..n).flat_map(|i| sample[i * dim + j * dsub..i * dim + (j + 1) * dsub].to_vec()).collect();
            books.extend(kmeans(&sub, dsub, 256, iters, rng));
        }
        Pq { dim, m, dsub, books }
    }
    fn book(&self, j: usize) -> &[f32] { &self.books[j * 256 * self.dsub..(j + 1) * 256 * self.dsub] }
    pub fn encode(&self, x: &[f32]) -> Vec<u8> { (0..self.m).map(|j| nearest(self.book(j), self.dsub, &x[j * self.dsub..(j + 1) * self.dsub]).0 as u8).collect() }
    pub fn decode(&self, code: &[u8]) -> Vec<f32> {
        let mut out = Vec::with_capacity(self.dim);
        for (j, &c) in code.iter().enumerate() { out.extend_from_slice(&self.book(j)[c as usize * self.dsub..(c as usize + 1) * self.dsub]); }
        out
    }
    /// Asymmetric distance table: `table[j * 256 + c]` = squared distance from the query's j-th sub-vector to centroid `c`.
    pub fn table(&self, q: &[f32]) -> Vec<f32> {
        let mut t = Vec::with_capacity(self.m * 256);
        for j in 0..self.m { for c in self.book(j).chunks_exact(self.dsub) { t.push(l2(&q[j * self.dsub..(j + 1) * self.dsub], c)); } }
        t
    }
    #[inline] pub fn adc(table: &[f32], code: &[u8]) -> f32 { code.iter().enumerate().map(|(j, &c)| table[j * 256 + c as usize]).sum() }
}

/// PQ over the whole collection (no partitioning): scan all codes with table lookups, keep `rerank` candidates, re-score exactly.
pub struct PqFlat { pub pq: Pq, pub codes: Vec<u8> }
impl PqFlat {
    pub fn build(data: &Data, m: usize, train: usize, iters: usize, rng: &mut Rng) -> PqFlat {
        let sample: Vec<f32> = (0..train.min(data.n)).flat_map(|_| data.row(rng.next(data.n as u64) as u32).to_vec()).collect();
        let pq = Pq::train(&sample, data.dim, m, iters, rng);
        let codes = par_map(&(0..data.n as u32).collect::<Vec<_>>(), 8, |&i| pq.encode(data.row(i))).concat();
        PqFlat { pq, codes }
    }
    pub fn search(&self, data: &Data, q: &[f32], k: usize, rerank: usize) -> Vec<Cand> {
        let table = self.pq.table(q);
        let mut heap: BinaryHeap<Cand> = BinaryHeap::new();
        let r = rerank.max(k);
        for (i, code) in self.codes.chunks_exact(self.pq.m).enumerate() {
            let d = Pq::adc(&table, code);
            if heap.len() < r { heap.push(Cand(d, i as u32)); } else if d < heap.peek().unwrap().0 { heap.pop(); heap.push(Cand(d, i as u32)); }
        }
        rescore(data, q, heap.into_vec(), k, rerank > 0)
    }
    pub fn memory_bytes(&self) -> usize { self.codes.len() + self.pq.books.len() * 4 }
}

fn rescore(data: &Data, q: &[f32], cands: Vec<Cand>, k: usize, exact: bool) -> Vec<Cand> {
    let mut v: Vec<Cand> = if exact { cands.into_iter().map(|c| Cand(l2(q, data.row(c.1)), c.1)).collect() } else { cands };
    v.sort();
    v.truncate(k);
    v
}

/// IVF with product-quantized *residuals* (vector minus its list centroid): the standard FAISS "IVF-PQ" layout.
pub struct IvfPq { pub ivf_cents: Vec<f32>, pub dim: usize, pub pq: Pq, pub ids: Vec<Vec<u32>>, pub codes: Vec<Vec<u8>> }
impl IvfPq {
    pub fn build(data: &Data, nlist: usize, m: usize, train: usize, iters: usize, rng: &mut Rng) -> IvfPq {
        let dim = data.dim;
        let sample: Vec<f32> = (0..train.min(data.n)).flat_map(|_| data.row(rng.next(data.n as u64) as u32).to_vec()).collect();
        let cents = kmeans(&sample, dim, nlist, iters, rng);
        let resid: Vec<f32> = sample.chunks_exact(dim).flat_map(|p| { let (c, _) = nearest(&cents, dim, p); p.iter().zip(&cents[c * dim..(c + 1) * dim]).map(|(a, b)| a - b).collect::<Vec<_>>() }).collect();
        let pq = Pq::train(&resid, dim, m, iters, rng);
        let enc = par_map(&(0..data.n as u32).collect::<Vec<_>>(), 8, |&i| {
            let x = data.row(i);
            let (c, _) = nearest(&cents, dim, x);
            let r: Vec<f32> = x.iter().zip(&cents[c * dim..(c + 1) * dim]).map(|(a, b)| a - b).collect();
            (c, pq.encode(&r))
        });
        let (mut ids, mut codes) = (vec![vec![]; nlist], vec![vec![]; nlist]);
        for (i, (c, code)) in enc.into_iter().enumerate() { ids[c].push(i as u32); codes[c].extend(code); }
        IvfPq { ivf_cents: cents, dim, pq, ids, codes }
    }
    /// The distance table for list `l`: the query's residual against that list's centroid, so that `adc(table, code)` is the squared
    /// distance from `q` to `centroid + decode(code)`.
    pub fn list_table(&self, q: &[f32], l: usize) -> Vec<f32> {
        let res: Vec<f32> = q.iter().zip(&self.ivf_cents[l * self.dim..(l + 1) * self.dim]).map(|(a, b)| a - b).collect();
        self.pq.table(&res)
    }
    /// Returns (results, codes scanned).
    pub fn search(&self, data: &Data, q: &[f32], k: usize, nprobe: usize, rerank: usize) -> (Vec<Cand>, usize) {
        let mut d: Vec<(f32, usize)> = self.ivf_cents.chunks_exact(self.dim).enumerate().map(|(i, c)| (l2(q, c), i)).collect();
        d.sort_by(|a, b| a.0.total_cmp(&b.0));
        let r = rerank.max(k);
        let mut heap: BinaryHeap<Cand> = BinaryHeap::new();
        let mut scanned = 0;
        for &(_, l) in d.iter().take(nprobe) {
            let table = self.list_table(q, l);
            for (j, code) in self.codes[l].chunks_exact(self.pq.m).enumerate() {
                scanned += 1;
                let dist = Pq::adc(&table, code);
                if heap.len() < r { heap.push(Cand(dist, self.ids[l][j])); } else if dist < heap.peek().unwrap().0 { heap.pop(); heap.push(Cand(dist, self.ids[l][j])); }
            }
        }
        (rescore(data, q, heap.into_vec(), k, rerank > 0), scanned)
    }
    pub fn memory_bytes(&self) -> usize { self.codes.iter().map(|c| c.len()).sum::<usize>() + self.ids.iter().map(|v| v.len()).sum::<usize>() * 4 + (self.pq.books.len() + self.ivf_cents.len()) * 4 }
}

// ----------------------------------------------------------------------------------------------- HNSW

/// Reusable visited set: a stamp per node, bumped per search so clearing is free.
pub struct Scratch { stamp: Vec<u32>, epoch: u32, pub visits: u64 }
impl Scratch {
    pub fn new(n: usize) -> Self { Scratch { stamp: vec![0; n], epoch: 0, visits: 0 } }
    fn begin(&mut self, n: usize) { if self.stamp.len() < n { self.stamp.resize(n, 0); } self.epoch += 1; }
    #[inline] fn seen(&mut self, i: u32) -> bool { let s = &mut self.stamp[i as usize]; if *s == self.epoch { true } else { *s = self.epoch; false } }
}

pub struct Hnsw {
    pub dim: usize, pub m: usize, pub m0: usize, pub ef_c: usize, ml: f64,
    pub vecs: Vec<f32>, pub level: Vec<u8>,
    /// links[node][layer] = neighbour ids
    pub links: Vec<Vec<Vec<u32>>>,
    pub entry: Option<u32>, pub max_level: usize,
}

impl Hnsw {
    pub fn new(dim: usize, m: usize, ef_c: usize) -> Self {
        Hnsw { dim, m, m0: 2 * m, ef_c, ml: 1.0 / (m as f64).ln(), vecs: vec![], level: vec![], links: vec![], entry: None, max_level: 0 }
    }
    pub fn len(&self) -> usize { self.level.len() }
    #[inline] fn vec(&self, i: u32) -> &[f32] { &self.vecs[i as usize * self.dim..(i as usize + 1) * self.dim] }

    /// Best-first search of one layer. Candidates are expanded in order of distance; the result keeps the `ef` closest nodes that
    /// pass `filter` (every node is still traversed, so a filter cannot disconnect the walk, it only makes it longer).
    fn search_layer(&self, q: &[f32], entries: &[Cand], ef: usize, layer: usize, sc: &mut Scratch, filter: Option<&dyn Fn(u32) -> bool>, max_visits: u64) -> Vec<Cand> {
        sc.begin(self.len());
        let pass = |i: u32| filter.is_none_or(|f| f(i));
        let mut cand: BinaryHeap<Reverse<Cand>> = BinaryHeap::new();
        let mut res: BinaryHeap<Cand> = BinaryHeap::new();
        for &e in entries { if !sc.seen(e.1) { cand.push(Reverse(e)); if pass(e.1) { res.push(e); } } }
        let start = sc.visits;
        while let Some(Reverse(c)) = cand.pop() {
            if res.len() >= ef && c.0 > res.peek().unwrap().0 { break; }
            if sc.visits - start > max_visits { break; }
            for &nb in &self.links[c.1 as usize][layer] {
                if sc.seen(nb) { continue; }
                sc.visits += 1;
                let d = l2(q, self.vec(nb));
                if res.len() < ef || d < res.peek().unwrap().0 {
                    cand.push(Reverse(Cand(d, nb)));
                    if pass(nb) { res.push(Cand(d, nb)); if res.len() > ef { res.pop(); } }
                }
            }
        }
        res.into_sorted_vec()
    }

    /// The neighbour-selection heuristic (Malkov and Yashunin, Algorithm 4): walk candidates nearest first and keep one only if it
    /// is closer to the base node than to every neighbour already kept, so the links point in different directions.
    fn select(&self, cands: &[Cand], m: usize) -> Vec<u32> {
        let mut out: Vec<u32> = Vec::with_capacity(m);
        for c in cands {
            if out.len() >= m { break; }
            if out.iter().all(|&r| l2(self.vec(c.1), self.vec(r)) > c.0) { out.push(c.1); }
        }
        out
    }

    pub fn insert(&mut self, x: &[f32], rng: &mut Rng, sc: &mut Scratch) -> u32 {
        let id = self.len() as u32;
        let level = (-(rng.unit().max(1e-12)).ln() * self.ml).floor() as usize;
        self.vecs.extend_from_slice(x);
        self.level.push(level as u8);
        self.links.push(vec![vec![]; level + 1]);
        let Some(ep) = self.entry else { self.entry = Some(id); self.max_level = level; return id; };
        let mut cur = Cand(l2(x, self.vec(ep)), ep);
        for lc in (level + 1..=self.max_level).rev() {                   // greedy descent through the layers above the node's own
            loop {
                let mut moved = false;
                for &nb in &self.links[cur.1 as usize][lc] { let d = l2(x, self.vec(nb)); if d < cur.0 { cur = Cand(d, nb); moved = true; } }
                if !moved { break; }
            }
        }
        let mut eps = vec![cur];
        for lc in (0..=level.min(self.max_level)).rev() {
            let w = self.search_layer(x, &eps, self.ef_c, lc, sc, None, u64::MAX);
            let neigh = self.select(&w, self.m);
            let maxc = if lc == 0 { self.m0 } else { self.m };
            self.links[id as usize][lc] = neigh.clone();
            for nb in neigh {
                self.links[nb as usize][lc].push(id);
                if self.links[nb as usize][lc].len() > maxc {            // over-full: re-select among its links by the same heuristic
                    let base = self.vec(nb).to_vec();
                    let mut cs: Vec<Cand> = self.links[nb as usize][lc].iter().map(|&o| Cand(l2(&base, self.vec(o)), o)).collect();
                    cs.sort();
                    self.links[nb as usize][lc] = self.select_for(&base, &cs, maxc);
                }
            }
            eps = w;
        }
        if level > self.max_level { self.entry = Some(id); self.max_level = level; }
        id
    }
    fn select_for(&self, _base: &[f32], cands: &[Cand], m: usize) -> Vec<u32> { self.select(cands, m) }

    pub fn build(data: &Data, m: usize, ef_c: usize, rng: &mut Rng) -> Hnsw {
        let mut h = Hnsw::new(data.dim, m, ef_c);
        let mut sc = Scratch::new(data.n);
        for i in 0..data.n as u32 { h.insert(data.row(i), rng, &mut sc); }
        h
    }

    /// Top-k with beam width `ef` (>= k). With a filter, only passing nodes are returned; `max_visits` bounds the layer-0 walk.
    pub fn search(&self, q: &[f32], k: usize, ef: usize, sc: &mut Scratch, filter: Option<&dyn Fn(u32) -> bool>, max_visits: u64) -> Vec<Cand> {
        let Some(ep) = self.entry else { return vec![] };
        let mut cur = Cand(l2(q, self.vec(ep)), ep);
        sc.visits += 1;
        for lc in (1..=self.max_level).rev() {
            loop {
                let mut moved = false;
                for &nb in &self.links[cur.1 as usize][lc] { sc.visits += 1; let d = l2(q, self.vec(nb)); if d < cur.0 { cur = Cand(d, nb); moved = true; } }
                if !moved { break; }
            }
        }
        let mut r = self.search_layer(q, &[cur], ef.max(k), 0, sc, filter, max_visits);
        r.truncate(k);
        r
    }
    pub fn memory_bytes(&self) -> usize { self.vecs.len() * 4 + self.links.iter().flat_map(|n| n.iter()).map(|l| l.len() * 4 + 24).sum::<usize>() }
    /// Nodes reachable from the entry point on layer 0.
    pub fn reachable(&self) -> usize {
        let Some(ep) = self.entry else { return 0 };
        let mut seen = vec![false; self.len()];
        let mut stack = vec![ep];
        seen[ep as usize] = true;
        let mut c = 1;
        while let Some(x) = stack.pop() { for &nb in &self.links[x as usize][0] { if !seen[nb as usize] { seen[nb as usize] = true; c += 1; stack.push(nb); } } }
        c
    }
}
```
