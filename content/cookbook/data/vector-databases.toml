<ul> <li><strong>Partitioning is very strong on clustered data</strong>: IVF-Flat with <code>nprobe = 4</code> reaches recall <strong>0.993</strong> while scanning 0.9% of the vectors, at <strong>57 515 QPS</strong>, 50× faster than the exact scan; <code>nprobe = 2</code> already gives 0.912. The cost is training (0.8 s) and the probe list of 512 centroid distances per query.</li> <li><strong>PQ alone saves memory, not time.</strong> With 16 bytes per vector the index is <strong>3.3 MB against 51 MB</strong> (15× smaller), but recall from the codes alone is only <strong>0.463</strong>, and the table-lookup scan runs at the same ~1 000 QPS as the exact SIMD scan: 16 lookups and additions per vector cost about as much as 64 fused subtract-multiply-adds. Re-ranking the best 100 by exact distance gives <strong>0.970</strong> (and 400 gives 1.000) at the price of keeping full vectors available. Real systems speed the scan with SIMD shuffles over 4-bit codes (FAISS "fast scan") or by partitioning, which is IVF-PQ.</li> <li><strong>IVF-PQ combines the two</strong>: <code>nprobe = 8</code> with 100 re-ranked candidates reaches <strong>0.996 recall at 13 156 QPS</strong> with 4.2 MB of codes in memory (the full vectors, 51 MB, are touched only for 100 candidates per query). Without re-ranking the same setting has recall 0.595: at 16 bytes per vector the quantization error is too large to rank the true neighbours.</li> <li><strong>HNSW needs no training and gives smooth control</strong>: <code>M = 16</code> reaches <strong>0.969 at 29 149 QPS (<code>ef = 40</code>)</strong> and <strong>0.994 at 18 003 QPS (<code>ef = 80</code>)</strong>. <code>M = 8</code> needs <code>ef = 320</code> for 0.990 (7 582 QPS); <code>M = 32</code> reaches 0.989 at <code>ef = 40</code> (25 469 QPS) but costs more per hop and more memory. At the same recall the number of distance computations per query is ~750 to 1 000 for <code>M = 16</code> against 1 700 to 3 500 vectors scanned by IVF-Flat and 200 000 by the exact scan.</li> <li><strong>On this data IVF-Flat beats HNSW at equal recall</strong> (57 515 against 18 003 QPS at ≥ 0.99) because the overlapping-cluster structure partitions well and a probe is a few contiguous scans, which a CPU does at memory bandwidth; HNSW's ~1 000 distance computations are dependent random accesses. That ranking is a property of this synthetic mixture: ANN-Benchmarks (Aumüller et al.) report graph indexes leading on many real embedding sets at high recall. <strong>Measure on your own vectors.</strong></li> <li><strong>Build time is the price of a graph</strong>: HNSW takes 9.1 s (<code>M = 8</code>), 16.7 s (<code>M = 16</code>) and 19.5 s (<code>M = 32</code>), 45 to 98 µs per vector, against 0.8 s for IVF-Flat; and <strong>memory grows</strong>: links add 15 to 27 MB on top of the 51 MB of vectors (<code>M = 16</code>: 72 MB in total, +41%). In exchange, inserts are incremental.</li> </ul>

