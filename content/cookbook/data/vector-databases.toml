<ul> <li><strong>Selective filters break the graph.</strong> For a random 1% filter (1 985 matching vectors) the in-graph search needs 30 103 distance computations (the visit cap) and runs at <strong>554 QPS</strong> against <strong>71 818/s</strong> for the plain scan of the matching ids, and at 0.1% (198 matches) the capped walk finds only 0.749 of the true neighbours. A pre-filter scan is exact and fast whenever few vectors match.</li> <li><strong>Post-filtering needs a wider net as the filter narrows</strong>: it is the fastest strategy for a 50% filter (20 856/s, recall 0.988) and degrades to 90/s at 0.1% (it searched 20 000 candidates to find 10 matches).</li> <li><strong>Correlation between the filter and the query decides everything.</strong> If the filter selects the query's own cluster (0.5% of the data), in-graph search is excellent (0.993 recall, 927 distance computations, 18 808/s) and post-filtering still returns 1.000 but at 431/s. If the filter selects a <em>far</em> cluster of the same size, the graph walk reaches only <strong>0.457</strong> of the true neighbours before the visit cap and post-filtering <strong>0.337</strong> (the matching vectors are nowhere near the top 4 150 candidates), while the pre-filter scan stays exact at 38 127/s. A selectivity estimate alone cannot detect this; the planner also needs to know where the matches are.</li> <li><strong>The planner rule that works here</strong>: scan the matching ids when at most ~4 000 match, else walk the graph with the filter. It returns recall ≥ 0.998 in all six cases, at 4 929/s (10% filter) to 429 446/s (0.1% filter). This is the shape of the planners in production vector databases (a full-scan threshold chosen from a cardinality estimate over payload indexes).</li> </ul>

<aside data-call="note"><b>Disk and object storage</b><p>Count what each index reads from storage, not CPU time. IVF: <code>nprobe</code> contiguous lists, a handful of large range reads (the layout object-storage-native systems favour). HNSW on disk: ~1 000 dependent small reads, each a round trip. DiskANN-style designs cut the round trips by keeping PQ codes and the upper graph in memory and fetching full vectors only for the last candidates; SPANN-style designs keep centroids in memory and posting lists on disk. The lab's "work per query" column is the proxy: scans and visits correspond to reads when the data is not in cache.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>Cand(f32, u32)</code> with a total order</strong> (<code>total_cmp</code> then id) makes <code>BinaryHeap</code> usable for both result sets (max-heap, worst on top) and candidate queues (<code>Reverse</code> for a min-heap); <code>into_sorted_vec()</code> returns ascending order. Ties are broken by id, so results are deterministic.</li> <li><strong>Vectorizable distance</strong>: <code>chunks_exact(8)</code> with an <code>[f32; 8]</code> accumulator array compiles to SIMD adds without <code>unsafe</code> or intrinsics; the remainder loop handles dimensions that are not multiples of eight.</li> <li><strong>Visited set by epoch stamps</strong> (<code>Vec&lt;u32&gt;</code> plus a counter) beats clearing a bitset per query and a <code>HashSet</code> by a wide margin; wrapping the <code>u32</code> epoch needs a reset every 4 billion queries, which is worth a <code>debug_assert!</code> in production code.</li> <li><strong>Flat vectors, nested links</strong>: vectors live in one <code>Vec&lt;f32&gt;</code> (<code>row(i) = &amp;v[i*d..(i+1)*d]</code>), but links are <code>Vec&lt;Vec&lt;Vec&lt;u32&gt;&gt;&gt;</code>, easy to write and slow to chase. Production HNSW stores layer 0 as a fixed-width block per node (<code>[count, neighbours…]</code>) next to the vector to make a hop touch one or two cache lines (exercise 3).</li> <li><strong><code>std::thread::scope</code> + <code>par_map</code></strong> parallelizes ground truth and index construction without a thread-pool dependency; the search path stays single-threaded so QPS numbers are per core.</li> <li><strong>Determinism</strong>: the only randomness is the seeded <code>Rng</code> (level draws, k-means seeds, samples), so two builds with the same seed produce identical graphs (a test asserts it); non-determinism in concurrent HNSW builds is a real production concern.</li> <li><strong><code>Option::is_none_or</code></strong> expresses "no filter, or it passes": <code>filter.is_none_or(|f| f(i))</code>.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Distance</strong> equals the definition for every dimension from 1 to 69 (the SIMD loop and its remainder).</li> <li><strong>Brute force</strong> equals the sorted prefix of all distances, with and without an id subset.</li> <li><strong>k-means</strong> reduces inertia by more than 20% from its initialization.</li> <li><strong>PQ</strong>: the ADC distance of any stored code equals the exact distance to its decoded vector (to 1e-3 relative); quantization error is below 35% of the data's spread.</li> <li><strong>Exhaustive settings are exact</strong>: IVF with every list probed returns the brute-force result and scans every vector; flat PQ and IVF-PQ with re-ranking over all candidates do too.</li> <li><strong>Probing</strong>: <code>probe(q, 1)</code> is the nearest centroid and the lists come nearest first; <code>nprobe = 1</code> scans exactly that list, for IVF and IVF-PQ alike; the IVF-PQ residual table scores a code as the distance to <code>centroid + decoded residual</code>.</li> <li><strong>HNSW structure</strong>: degree bounds per layer, no self links, no duplicates, every layer-<code>l</code> link points to a node present on layer <code>l</code>, the entry point is on the top layer, at least 99% of nodes are reachable on layer 0, and two builds with the same seed are identical.</li> <li><strong>HNSW search</strong>: recall at <code>ef = 200</code> is at least 0.95; an exhaustive beam on a connected graph is exact; a beam of 60 on overlapping clusters evaluates well over 120 nodes and has recall above 0.9 (a search that stops at the first full result set fails this).</li> <li><strong>Filters</strong>: results always satisfy the filter; a filter passing everything changes nothing; filtered recall against the exact filtered answer is above 0.9 (50%) and 0.5 (2%); a visit cap bounds the work.</li> <li><strong>Mutants run against these tests</strong> (all killed): the neighbour heuristic keeping the wrong side; no reverse links; degree bound not enforced; entry point never moving up; filter ignored for neighbours; ADC reading the wrong table row; brute force keeping the farthest; PQ re-ranking skipped; layer links beyond a node's level; the visited set forgetting (killed by non-termination). Four mutants <strong>survived the first tests and each was killed by a test written for it</strong>: the beam stopping too early (exhaustive and easy-data tests hide it; killed by the harder-data visit count), IVF-PQ forgetting the residual (exact re-ranking hid it; killed by the table identity), and IVF and IVF-PQ probing the farthest lists (probing every list hid it; killed by the probe-order and nprobe-1 tests).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Qdrant</strong> (Rust): HNSW with a <em>filterable</em> variant that adds links per indexed payload value so that filtered traversal stays connected, payload indexes feeding a <strong>query planner</strong> that chooses between a full scan of the matching points and graph search by estimated cardinality, scalar, product and binary quantization with oversampling and re-scoring, and memory-mapped or on-disk storage of vectors.</li> <li><strong>Weaviate</strong> (Go): HNSW (and a flat index, and a dynamic index that starts flat and converts) with product and binary quantization, LSM-style storage of objects, and hybrid search that fuses BM25 and vector scores.</li> <li><strong>Milvus</strong> (distributed, Go/C++): data in <em>segments</em> (growing in memory, sealed on object storage) indexed independently, many index types (IVF-Flat, IVF-PQ, HNSW, DiskANN, GPU graph indexes), storage and compute separated, and filtered search with scalar indexes.</li> <li><strong>pgvector</strong> (Postgres extension): <code>vector</code> type with IVFFlat and HNSW index access methods inside Postgres, so filters, joins, transactions and backups come with the database; the planner chooses between index scan and sequential scan from ordinary statistics; recent versions add iterative index scans to keep walking when a filter discards too many results.</li> <li><strong>Chroma</strong>: an embedded HNSW (hnswlib) per collection, evolving to a distributed design with object storage.</li> <li><strong>Lance</strong>: a columnar file format with random access and versioning whose vector indexes (IVF-PQ, HNSW variants) live next to the data, so the same files serve scans and nearest-neighbour search.</li> <li><strong>turbopuffer, TopK</strong>: object-storage-native search engines: data and indexes on object storage with a memory and SSD cache in front, designs where the cost of an index is its number of storage round trips; clustered layouts follow naturally.</li> <li><strong>Common architecture</strong>: an LSM-like split into a mutable in-memory part searched by brute force or a small graph and immutable sealed segments with real indexes, merged in the background; deletes as tombstones filtered at query time; recall measured continuously on a held-out query set.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Benchmarking on easy data.</strong> Well-separated synthetic blobs let almost any index look excellent (the first run here reached recall 0.998 at 1.8% scanned and was thrown away). Use real embeddings, with the real dimensionality, and report recall at fixed targets with the full speed–recall curve.</li> <li><strong>Recall is per query, not an average you can hide behind</strong>: look at the lowest percentile of recall; a mean of 0.97 can hide queries that return nothing useful (for example the filtered ones above).</li> <li><strong>Distance and normalization</strong>: cosine similarity needs normalized vectors (then L2 ordering equals cosine ordering); inner product is not a metric and breaks graph and triangle-inequality assumptions without a transformation. Check what your model was trained for.</li> <li><strong>Filters change the problem.</strong> Post-filtering silently returns fewer than <code>k</code> results; in-graph filtering without a visit cap scans the graph; any strategy needs a cardinality estimate and a fallback to exact scan. Test with filters correlated and anti-correlated with the query.</li> <li><strong>Updates and deletes</strong>: IVF centroids go stale as data drifts (retrain and re-assign periodically); HNSW deletions leave holes and degrade connectivity (tombstone and rebuild, or use a repair algorithm); sealed immutable segments make this tractable.</li> <li><strong>Quantization needs re-ranking and a held-out check.</strong> PQ codes alone at 16 bytes per 64 dimensions gave recall 0.46; any lossy format must be validated against exact search on your data, per dimension count and metric.</li> <li><strong>Memory is more than the vectors</strong>: HNSW links added 41% here, IVF-PQ adds ids and codebooks, and the visited set, heap and caches add per-query and per-thread state.</li> <li><strong>Build time and recovery</strong>: a graph that takes hours to build must be persisted and loaded, not rebuilt on restart; parallel builds change the graph (non-deterministic), so tests should compare recall, not links.</li> <li><strong>Hybrid search is a ranking problem</strong>: fusing a vector ranking with a keyword ranking (reciprocal rank fusion, weighted scores) needs its own evaluation; neither score is calibrated.</li> </ul></aside>
"""

[[sources]]
title = "Efficient and Robust Approximate Nearest Neighbor Search Using Hierarchical Navigable Small World Graphs"
url = "https://arxiv.org/abs/1603.09320"
