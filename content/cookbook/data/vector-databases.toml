<ul> <li><strong>The Pareto table</strong>: for recall ≥ 0.95, IVF-Flat (57.5 k QPS) &gt; HNSW M=16 (29.1 k) &gt; IVF-PQ with re-ranking (13.2 k) &gt; exact (1.1 k). If memory is the constraint, IVF-PQ's <em>resident</em> footprint is 4.2 MB for 200 000 vectors (21 bytes per vector with ids and codebooks), the only entry here that scales to billions on one machine, provided the full vectors sit on SSD or object storage and the re-ranking reads are cheap.</li> </ul>

