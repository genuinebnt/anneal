title = "Passing BusTub's tests"
module = "Databases"
module_order = 8
chapter = "Building complete engines"
chapter_order = 9
order = 459
kind = "guide"
lede = "Fall 2025 public tests, project by project: which guide section teaches the code, what each test actually checks, and the places where a reasonable implementation still fails it"
origin = "Database systems guide"

[[sections]]
heading = "Overview"
body = """
<p>This page is a map from BusTub's public C++ tests to the sections of this guide, plus the <strong>traps</strong> each test sets. It was written by porting every public Fall 2025 test (<code>cmu-db/bustub</code> at <code>d49b823</code>, the last Fall 2025 commit) to Rust and running it against the reference code of this guide. Where a port failed, the fix went into the guide's code and the reason is below.</p>

<aside data-call="warning"><b>What this does and does not prove</b><p>The public tests are <code>DISABLED_</code> stubs (remove the prefix to run them). The graded tests are hidden and may differ. Passing every public test is necessary, not sufficient. The ports exercise the same scenarios and assertions through a Rust API; C++-only behaviour (raw page pointers, the exact <code>Tuple</code> class, double <code>Drop()</code>) cannot be ported and is listed as such.</p></aside>
"""

[[sections]]
heading = "How the checking was done"
body = """
<ul> <li><strong>Ported tests</strong> live in a separate repository (<code>bustub-rs</code>, one test file per C++ test file, same test names in snake_case), with a table (<code>PARITY.md</code>) mapping each C++ test to its Rust test or to the reason it has none.</li> <li><strong>SQL tests</strong> (<code>test/sql/*.slt</code>, 38 files, 468 records) are run unmodified by a small sqllogictest runner against the engine in-process. Result at the time of writing (rows <em>and</em> the <code>+ensure</code> plan checks): 453 records pass, 12 are skipped (BusTub shell meta-commands such as <code>&#92;dt</code>, and 1M-10M-row built-in tables), 1 is a deliberate difference (<code>count(col)</code> on an empty table), 2 fail (a composite <code>(x, y)</code> index, which the single-column B+Tree cannot serve).</li> <li>The guide's own reference code is the <strong>verified</strong> version (<code>verify/</code>); <code>bustub-rs</code> keeps the optimistic-only variant that BusTub's tests assume.</li> </ul>
"""

[[sections]]
heading = "Project 0: count-min sketch (P0)"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>C++ test</th> <th>What it checks</th> <th>Trap</th> </tr> </thead> <tbody> <tr> <td><code>BasicTest1/2</code>, <code>EdgeTest1/2</code>, <code>ClearTest</code>, <code>MergeTest</code>, <code>MoveTest</code></td> <td>exact counts for a few keys; width 1 and depth 1; <code>Clear</code>; <code>Merge</code> including mismatched dimensions (an exception in C++, an <code>Err</code> here); counters survive a move</td> <td>with <em>few</em> distinct keys the tests assert <strong>exact</strong> counts, which is only true when no cell collides: use the seeded hash functions BusTub supplies (<code>SEED_BASE</code> in the header) so the outcome is deterministic</td> </tr> <tr> <td><code>ParallelTest</code>, <code>ComplexParallelTest</code></td> <td>8-16 threads inserting, then exact <code>TopK</code>/<code>Count</code></td> <td><code>Insert</code> must be thread-safe and lose no increment</td> </tr> <tr> <td><code>TopKBasic/Dynamic/Comprehensive</code></td> <td>descending order by estimate, <code>Dynamic</code> reuses one sketch across six rounds, <code>Comprehensive</code> merges four sketches filled by 20 threads</td> <td>the expected orders have no ties; the sketch is reused, so <code>Count</code> must reflect <em>all</em> earlier rounds</td> </tr> <tr> <td><code>ContentionRatioTest</code></td> <td>lock-free insert must be <strong>&gt; 1.2x faster than a mutex-wrapped one</strong> (two threads, ten hot keys)</td> <td><strong>A single shared atomic matrix fails this</strong>: 0.15 on an Apple M4 Pro. Stripe the counters per thread. See <a href="/cookbook/p/count-min-sketch">P0, Contention</a></td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Project 1: buffer pool (P1.1, P1.2, P1.3)"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>C++ test</th> <th>What it checks</th> <th>Trap</th> </tr> </thead> <tbody> <tr> <td><code>ArcReplacerTest.SampleTest/SampleTest2</code>, <code>ArcReplacerPerformanceTest</code></td> <td>exact eviction order across the four ARC lists, ghost hits adapting the target <code>p</code>, <code>SetEvictable</code> size accounting</td> <td>compare the full eviction sequence, not just the first victim: ghost lists and the target <code>p</code> only show up several evictions later</td> </tr> <tr> <td><code>BufferPoolManagerTest.VeryBasic</code>, <code>PagePinEasy</code>, <code>PagePinMedium</code></td> <td><code>GetPinCount</code> is <code>nullopt</code> for a page that is <strong>not resident</strong>, 0 for resident-but-unpinned; <code>CheckedReadPage</code>/<code>CheckedWritePage</code> return <code>nullopt</code> when every frame is pinned; evicted pages come back from disk</td> <td><code>GetPinCount</code> of a page that was evicted is <code>nullopt</code>, not 0 (<code>PagePinEasy</code> asserts it); 0 means resident and unpinned</td> </tr> <tr> <td><code>PageAccessTest</code>, <code>ContentionTest</code></td> <td>a reader holding a read guard sees stable bytes while a writer waits; four threads x 100,000 write-guard cycles on one page</td> <td>a reader's bytes must not change while it holds the guard; a typical bug is releasing the pin before the latch, so an eviction can reuse the frame under a live guard</td> </tr> <tr> <td><code>DeadlockTest</code></td> <td>with one thread holding page 0's <strong>write</strong> guard and another blocked on it, a third request for page 1 must succeed</td> <td>never wait for a page latch while holding the buffer pool latch</td> </tr> <tr> <td><code>EvictableTest</code></td> <td>with one frame, while any thread holds a guard on page A, a request for page B must fail every time (1,000 rounds)</td> <td>a typical cause of failure: the frame becomes evictable while a guard still holds it; pin before releasing the pool latch and keep the pin until the guard is dropped</td> </tr> <tr> <td><code>PageGuardTest.DropTest/MoveTest</code></td> <td><code>Drop()</code> unpins and unlatches; a second <code>Drop()</code> is a no-op; move-assign over a live guard releases the old page; moved-from guards are inert</td> <td>Rust cannot express double-drop or use-after-move, so these two cases are <em>absent</em> in the Rust port; in C++ they are most of the test</td> </tr> <tr> <td><code>DiskSchedulerTest</code></td> <td>write then read of the same page through the scheduler returns the data</td> <td>requests for one page must be served in order</td> </tr> <tr> <td><code>DiskManagerTest.ReadWritePage</code>, <code>ThrowBadFile</code>, <code>DeletePage</code></td> <td>round trip; opening an impossible path throws; after deleting pages the <strong>file does not grow</strong></td> <td>BusTub's <code>DiskManager</code> maps <code>page_id</code> to a file offset through a table with a free-slot list; a design that is <code>page_id * PAGE_SIZE</code> needs to recycle <em>ids</em> instead</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Project 2: B+Tree (P2.1 to P2.5)"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>C++ test</th> <th>What it checks</th> <th>Trap</th> </tr> </thead> <tbody> <tr> <td><code>Insert*</code>, <code>Delete*</code>, <code>SequentialEdgeMix</code>, <code>BasicScale</code></td> <td>contents and iterator order for tiny nodes (leaf max 2, internal max 3) and 5,000 shuffled keys</td> <td><code>SequentialEdgeMix</code> uses <strong>negative keys</strong> (-1, -2): compare signed, not as raw bytes</td> </tr> <tr> <td><code>OptimisticInsertTest</code>, <code>OptimisticDeleteTest</code></td> <td>an insert into a non-full leaf and a delete from a leaf above its minimum take <strong>exactly one write guard</strong> (<code>GetWrites()</code> delta is 1, <code>GetReads()</code> delta &gt; 0)</td> <td><strong>Pessimistic crabbing only fails these.</strong> Implement the optimistic descent for <code>Remove</code> as well as <code>Insert</code> (<a href="/cookbook/p/delete-and-tombstones">P2.3</a>), and have the buffer pool count guards</td> </tr> <tr> <td><code>Tombstone{Basic,Split,Borrow,Coalesce}</code></td> <td>the pending-deletion buffer: order (oldest first), what <code>Insert</code> of a tombstoned key does, how tombstones move on split, borrow and merge, and that lookups and iterators skip them</td> <td>the order in which pending tombstones are applied (oldest first) and how they travel with their entries on split, borrow and merge; <code>TombstoneSplit</code>'s expectation is written in descending key order, so read the assertion before choosing a representation</td> </tr> <tr> <td><code>BPlusTreeConcurrentTest</code> x <code>Tombs</code> = 0 and 3</td> <td>Insert1/2, Delete1/2, Mix1/2 with 2-10 threads, 50 iterations each</td> <td>duplicate inserts by two threads must return <code>false</code>, not corrupt; mixed insert/delete/lookup must keep keys that nobody deletes</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Project 3: query execution (P3.1 to P3.8)"
body = """
<p>Run the <code>.slt</code> files; they are the spec. The runner needs a few things that are not in the C++ tests:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Need</th> <th>Why</th> <th>Where</th> </tr> </thead> <tbody> <tr> <td><code>__mock_*</code> and <code>test_simple_seq_*</code>, <code>empty_table</code> tables</td> <td>BusTub preloads them (<code>MockScan</code>, <code>TableGenerator</code>); the tests refer to them by name</td> <td>generated rows are defined in <code>mock_scan_executor.cpp</code> and <code>table_generator.cpp</code>; tables above ~200k rows were skipped</td> </tr> <tr> <td><code>integer_null</code> in expected output</td> <td>BusTub prints a NULL result with a type name in some files</td> <td>treat <code>*_null</code> as NULL</td> </tr> <tr> <td><code>rowsort</code>, <code>+ensure:</code>, <code>+explain</code>, <code>+timing:</code></td> <td><code>+ensure:&lt;what&gt;</code> runs <code>EXPLAIN (O)</code> on the query and looks for operator names (<code>IndexScan</code>, <code>HashJoin</code>, <code>TopN</code>, <code>NestedIndexJoin</code>, <code>NestedLoopJoin</code>) in the text; <code>+timing</code> is leaderboard-only</td> <td>a runner that compares rows only passes the results; the <code>ensure</code> lines are where an optimizer rule that does nothing gets caught. <strong>Name your plan nodes exactly that way</strong></td> </tr> <tr> <td><code>set force_optimizer_starter_rule=yes</code></td> <td>restricts the optimizer to the starter rules: <strong>no hash join</strong>, no top-N, a <em>strict</em> seq-scan-to-index-scan rule, and an <code>ORDER BY</code> → ordered index scan rule</td> <td>the tests for the nested-loop and index-join executors run in this mode; a solution whose only join is a hash join fails them. See <a href="/cookbook/p/optimizer-rules-and-the-engine">P3.6</a></td> </tr> </tbody> </table></div>

<p>SQL features the tests need beyond a basic engine are collected in <a href="/cookbook/p/sql-front-end">P3.2, "Beyond the basics"</a>: derived tables, parenthesised join groups, <code>NULLS FIRST/LAST</code> and BusTub's NULL-is-smallest ordering, <code>INSERT INTO t (SELECT …)</code>, <code>USING</code> in <code>CREATE INDEX</code>, trailing commas, window output order, and the <code>VECTOR</code> type. The one result the engine does <strong>not</strong> reproduce is <code>count(col)</code> over an empty table (BusTub: NULL; SQL: 0); decide before you submit which one your graded implementation returns, since the hidden tests follow BusTub.</p>
"""

[[sections]]
heading = "Project 4: MVCC (P4)"
body = """
<p>28 public tests in <code>test/txn/</code> (<code>TxnTsTest</code>, <code>TxnScanTest</code>, <code>TxnExecutorTest</code>, <code>TxnIndexTest</code>, <code>TxnAbortTest</code>, <code>TxnSerializableTest</code>). They drive BusTub's own classes (<code>BusTubInstance</code>, <code>TransactionManager</code>, <code>UndoLog</code>, <code>TableHeap::UpdateTupleInPlace</code>, <code>GetWatermark</code>, <code>GarbageCollection</code>) and run SQL through a transaction the test begins, commits and aborts itself (<code>ExecuteSqlTxn</code>), so a port needs the whole engine to run transactions. The reference engine does (<code>verify/src/txn/</code>, <code>verify/src/engine/txn_exec.rs</code>); all 28 pass, and the concurrent ones were run repeatedly. The test-by-test table, the code, and the places where the <em>tests</em> overrule the textbook (garbage collection of insert-only transactions, validation of read-only transactions, <code>UPDATE SET pk = pk + 1</code>) are in <a href="/cookbook/p/project-4-mvocc">P4, "Passing BusTub's 28 P4 tests"</a>. Four public tests end with "test continues on Gradescope": the hidden half is not covered.</p>
"""

[[sections]]
heading = "When a port fails: what that tells you"
body = """
<p>Every failure found while porting was a real defect in the reference code or the docs, not a test quirk: pessimistic-only <code>Remove</code>; a GC rule in the P4 text that BusTub's <code>GarbageCollection</code> test contradicts; a contention-prone sketch that the guide had described as working; a stack overflow from deeply nested join groups; a SQL front end without derived tables; a security checker that a derived table could bypass. If a public test fails on your implementation, assume the same: read the assertion before suspecting the test.</p>
"""
