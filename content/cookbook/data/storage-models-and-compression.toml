```text title="SUM(c3) WHERE c5 < 100 · 2M rows × 32 BIGINT columns (256 B rows) · Apple M4 Pro, in memory"
NSM (row) scan:     8.60 ms      ← drags ≥ 64 B per row through the cache: 128+ MB of 512 MB
DSM (column) scan:  0.68–1.77 ms ← reads exactly two 16 MB columns
```

<p>That's 5–12× from layout alone, in memory. On disk, the ratio is the fraction of bytes read: 32 MB vs 512 MB, or 16×. Add compression and the column store reads far less again.</p>
"""

