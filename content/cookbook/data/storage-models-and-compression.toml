[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Workloads decide layout.</strong> OLTP: short, repetitive queries touching one entity, write-heavy. OLAP: long queries scanning much of the database, read-heavy, with aggregates. HTAP: both on one system.</li> <li><strong>NSM (row store)</strong>: all attributes of a tuple together. Fast inserts, updates and deletes and whole-tuple reads; wasteful for scans over a few columns, and hard to compress (mixed value domains in each page).</li> <li><strong>DSM (column store)</strong>: each attribute stored contiguously. Reads only the needed columns, gets better cache locality, and compresses far better. Point queries and updates are slow, because tuples must be split and stitched back together.</li> <li><strong>Reconstructing tuples</strong>: <em>fixed-length offsets</em> (the i-th value of every column belongs to tuple i; the common approach) or embedded tuple ids (a large overhead).</li> <li><strong>PAX</strong>: rows split into <strong>row groups</strong>, and columns stored within each group. Columnar scans with row-ish locality. This is Parquet's and ORC's layout.</li> <li><strong>Compression trades CPU for I/O</strong>, and disk I/O is almost always the bottleneck. Good schemes give <strong>fixed-length</strong> values (so offsets still work), allow <strong>late materialization</strong> (operate on compressed data as long as possible), and are <strong>lossless</strong>.</li> <li><strong>Granularity</strong>: block, tuple (NSM), attribute, or column (DSM, which enables the best schemes).</li> <li><strong>Naive compression</strong> (LZ4, Snappy, Zstd on pages) must decompress before any read, and it ignores data semantics, so no late materialization is possible.</li> <li><strong>Columnar encodings</strong>: <strong>RLE</strong> (value, start, length; sort first to lengthen runs); <strong>bit-packing</strong> (fewer bits when values are small); <strong>patching / mostly</strong> encoding (bit-pack, with outliers kept in a side table); <strong>bitmaps</strong> (one bit-vector per distinct value; only for low cardinality; use Roaring for sparse data); <strong>delta</strong> (differences between neighbours, often combined with RLE); <strong>dictionary</strong> (the most common: codes plus a dictionary, <strong>order-preserving</strong> so range predicates can run on codes).</li> </ul>
"""

