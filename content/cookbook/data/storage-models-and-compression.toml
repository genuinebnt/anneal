body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Scheme</th> <th>Best for</th> <th>Decode</th> <th>Operate on compressed?</th> </tr> </thead> <tbody> <tr> <td><strong>RLE</strong></td> <td>sorted or clustered low-cardinality columns</td> <td>sequential</td> <td>yes: <code>SUM</code> = Σ value·length; filters per run</td> </tr> <tr> <td><strong>Bit-packing</strong></td> <td>small integers</td> <td>random access by index</td> <td>yes: SIMD compares on packed lanes (BitWeaving, FastLanes)</td> </tr> <tr> <td><strong>Frame of reference (FOR)</strong></td> <td>values clustered around a base</td> <td>random access</td> <td>yes: shift the predicate by the base</td> </tr> <tr> <td><strong>Delta</strong> (+ bit-pack or RLE)</td> <td>sorted ids, timestamps</td> <td>sequential (prefix sum)</td> <td>partially</td> </tr> <tr> <td><strong>Dictionary</strong> (order-preserving)</td> <td>strings, low/medium cardinality</td> <td>random access</td> <td>yes: <code>=</code> and <code>&lt;</code> become integer compares on codes</td> </tr> <tr> <td><strong>Bitmap</strong> (+ Roaring)</td> <td>very low cardinality, many predicates</td> <td>per value</td> <td>yes: AND/OR of bitmaps</td> </tr> <tr> <td><strong>Patched / PFOR</strong></td> <td>mostly small with rare outliers</td> <td>random access + exception list</td> <td>yes</td> </tr> <tr> <td><strong>General-purpose</strong> (LZ4, Zstd, Snappy)</td> <td>anything, as a last layer</td> <td>whole block</td> <td>no</td> </tr> </tbody> </table></div>

:::deeper Reference encodings: RLE, bit-packing, FOR, delta, order-preserving dictionary
```rust title="src/columnar/encodings.rs"
//! Lightweight columnar encodings. Each one works on a whole column segment and
//! keeps values fixed-width or random-accessible, so scans can run on codes.

// ---------- Run-length encoding --------------------------------------------------
/// (value, run length) pairs. Start offsets are implied by prefix sums.
pub fn rle_encode<T: PartialEq + Copy>(col: &[T]) -> Vec<(T, u32)> {
    let mut out: Vec<(T, u32)> = Vec::new();
    for &v in col {
        match out.last_mut() {
            Some((last, n)) if *last == v => *n += 1,
            _ => out.push((v, 1)),
        }
    }
    out
}
pub fn rle_decode<T: Copy>(runs: &[(T, u32)]) -> Vec<T> {
    runs.iter().flat_map(|&(v, n)| std::iter::repeat_n(v, n as usize)).collect()
}
/// Aggregates run on runs directly: SUM over RLE is Σ value·length, no decoding.
pub fn rle_sum(runs: &[(i64, u32)]) -> i64 { runs.iter().map(|&(v, n)| v * n as i64).sum() }

// ---------- Bit-packing ------------------------------------------------------------
/// Pack each value into `bits` bits (values must fit). Little-endian bit order.
pub fn bitpack(vals: &[u32], bits: u32) -> Vec<u64> {
    assert!((1..=32).contains(&bits));
    let mut out = vec![0u64; (vals.len() * bits as usize).div_ceil(64)];
    for (i, &v) in vals.iter().enumerate() {
        debug_assert!(bits == 32 || v < (1 << bits), "value {v} does not fit in {bits} bits");
        let bit = i * bits as usize;
        let (w, o) = (bit / 64, bit % 64);
        out[w] |= (v as u64) << o;
        if o + bits as usize > 64 { out[w + 1] |= (v as u64) >> (64 - o); }   // straddles two words
    }
    out
}
/// Random access into a packed array: the property that makes it usable by scans.
#[inline]
pub fn bitunpack_one(packed: &[u64], bits: u32, i: usize) -> u32 {
    let bit = i * bits as usize;
    let (w, o) = (bit / 64, bit % 64);
    let mask = if bits == 32 { u32::MAX as u64 } else { (1u64 << bits) - 1 };
    let mut v = packed[w] >> o;
    if o + bits as usize > 64 { v |= packed[w + 1] << (64 - o); }
    (v & mask) as u32
}
pub fn bits_needed(max: u32) -> u32 { (32 - max.leading_zeros()).max(1) }

// ---------- Frame of reference + delta ------------------------------------------------
/// Frame-of-reference: store min once, then bit-pack (v - min).
pub struct For { pub min: i64, pub bits: u32, pub packed: Vec<u64>, pub len: usize }
pub fn for_encode(col: &[i64]) -> For {
    let min = col.iter().copied().min().unwrap_or(0);
    let offs: Vec<u32> = col.iter().map(|&v| u32::try_from(v - min).expect("range fits 32 bits")).collect();
    let bits = bits_needed(offs.iter().copied().max().unwrap_or(0));
    For { min, bits, packed: bitpack(&offs, bits), len: col.len() }
}
pub fn for_get(f: &For, i: usize) -> i64 { f.min + bitunpack_one(&f.packed, f.bits, i) as i64 }

/// Delta: first value, then successive differences (good for sorted ids, timestamps).
pub fn delta_encode(col: &[i64]) -> (i64, Vec<i64>) {
    let first = col.first().copied().unwrap_or(0);
    (first, col.windows(2).map(|w| w[1] - w[0]).collect())
}
pub fn delta_decode(first: i64, deltas: &[i64]) -> Vec<i64> {
    let mut out = Vec::with_capacity(deltas.len() + 1);
    out.push(first);
    let mut acc = first;
    for &d in deltas { acc += d; out.push(acc); }
    out
}

// ---------- Order-preserving dictionary ---------------------------------------------
/// Codes are ranks in the sorted distinct values, so code order == value order.
pub struct Dict { pub values: Vec<String>, pub codes: Vec<u32> }
pub fn dict_encode(col: &[&str]) -> Dict {
    let mut values: Vec<String> = col.iter().map(|s| s.to_string()).collect();
    values.sort_unstable();
    values.dedup();
    let codes = col.iter().map(|s| values.binary_search_by(|v| v.as_str().cmp(s)).unwrap() as u32).collect();
    Dict { values, codes }
}
impl Dict {
    /// Rewrite `col < lit` into `code < k` once, then filter integers: no string compares per row.
    pub fn filter_lt(&self, lit: &str) -> Vec<usize> {
        let k = self.values.partition_point(|v| v.as_str() < lit) as u32;
        self.codes.iter().enumerate().filter(|&(_, &c)| c < k).map(|(i, _)| i).collect()
    }
    pub fn filter_eq(&self, lit: &str) -> Vec<usize> {
        match self.values.binary_search_by(|v| v.as_str().cmp(lit)) {
            Ok(k) => self.codes.iter().enumerate().filter(|&(_, &c)| c == k as u32).map(|(i, _)| i).collect(),
            Err(_) => vec![],                  // literal not in the dictionary: no row can match
        }
    }
    pub fn decode(&self, i: usize) -> &str { &self.values[self.codes[i] as usize] }
}
```
:::

```text title="compression on typical columns (5M rows, i64 = 64 bits uncompressed)"
status (4 values, clustered):   RLE → 500 runs                      ≈ 6,667×
timestamps (≈1 s apart):        delta + bit-pack → 10 bits/value    ≈ 6×
small ints 0..999:              FOR / bit-pack → 10 bits/value      ≈ 6.4×
```

<aside data-call="rust"><b>Bit tricks worth knowing</b><ul> <li><code>x.leading_zeros()</code> gives the bit width in one instruction: <code>32 - max.leading_zeros()</code> is the number of bits needed.</li> <li>A value that straddles two <code>u64</code> words needs the high part shifted in from the next word. Handle that with the <code>o + bits &gt; 64</code> branch, or pad each block so values never straddle (FastLanes' "interleaved" layout removes the branch entirely).</li> <li><code>std::iter::repeat_n(v, n)</code> (stable since 1.82) makes RLE decoding allocation-free when chained into <code>flat_map</code>.</li> <li>For real speed, decode 1024 values at a time into a stack buffer with a width-specialized function (one monomorphized function per bit width via <code>const</code> generics: <code>fn unpack&lt;const B: u32&gt;(…)</code>). LLVM will vectorize it.</li> </ul></aside>
"""

[[sections]]
heading = "Late materialization"
body = """
<p>A column-store query plan passes <strong>positions</strong> (row ids or selection bitmaps) between operators instead of tuples, and fetches ("materializes") other columns only when a later operator needs them. <code>SELECT name FROM t WHERE age &gt; 30 AND city = 'Pune'</code> filters <code>age</code> (on FOR-encoded values), then filters <code>city</code> only at the surviving positions (on dictionary codes), and decodes <code>name</code> only for the final positions. Early materialization builds full tuples first and loses most of the benefit. Part II covers this in depth (Abadi et al., ICDE 2007).</p>
"""

