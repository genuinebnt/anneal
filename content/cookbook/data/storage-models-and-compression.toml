<div class="cb-g-tt"><table> <thead> <tr> <th>System</th> <th>Layout</th> </tr> </thead> <tbody> <tr> <td>PostgreSQL, MySQL/InnoDB, SQLite, Oracle (default)</td> <td>NSM</td> </tr> <tr> <td>DuckDB, ClickHouse, Snowflake, BigQuery, Redshift, Vertica</td> <td>DSM / PAX with heavy encoding</td> </tr> <tr> <td>Parquet, ORC (file formats)</td> <td>PAX: row groups → column chunks → pages, with dictionary + RLE + bit-packing + general-purpose compression</td> </tr> <tr> <td>SQL Server (columnstore indexes), Oracle In-Memory, SAP HANA, TiDB (TiFlash), SingleStore</td> <td><strong>HTAP</strong>: a row store for writes plus a column copy or delta for analytics</td> </tr> </tbody> </table></div>
