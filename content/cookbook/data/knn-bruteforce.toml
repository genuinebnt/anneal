[[sections]]
heading = "Design notes"
body = """
Pattern: score every vector, keep only the best k in a **min**-heap of size k (pop the worst when it grows past k). O(n log k), O(k) memory. Recall of any approximate index (HNSW, IVF) is judged against this exact answer.
"""

