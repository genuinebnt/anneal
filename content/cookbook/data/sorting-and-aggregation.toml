[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Query plans</strong> are trees or DAGs of operators. Disk-oriented operators spill through the buffer pool; minimize I/O and prefer sequential I/O.</li> <li><strong>Why sort</strong>: the relational model is unordered, so <code>ORDER BY</code> needs it, and <code>GROUP BY</code>, <code>JOIN</code> and <code>DISTINCT</code> can use it. In memory: quicksort, pdqsort, vergesort. Too big for memory: <strong>external</strong> sort. Sort (key, value) pairs, where the value is the whole tuple (<strong>early</strong> materialization) or a record id (<strong>late</strong>).</li> <li><strong>Top-N heap sort</strong>: <code>ORDER BY … LIMIT n [WITH TIES]</code> needs one pass with a bounded priority queue. With ties, the queue grows on demand.</li> <li><strong>External merge sort</strong>: <strong>pass 0</strong> sorts chunks of B pages and writes runs; <strong>merge passes</strong> combine up to <strong>B−1</strong> runs using one output page. Passes = <strong>1 + ⌈log<sub>B−1</sub> ⌈N/B⌉⌉</strong>, and I/O = <strong>2N × passes</strong>. (Two-way merge with 3 buffers: 1 + ⌈log₂ N⌉ passes.)</li> <li><strong>Double buffering</strong>: prefetch the next page of each run in the background while processing the current one. It halves the effective buffers, but keeps the disk busy (needs a second thread or async I/O).</li> <li><strong>Comparison optimizations</strong>: <strong>code specialization</strong> (a comparator per key type, not a function pointer), <strong>suffix truncation</strong> (compare binary prefixes of long strings first) and <strong>key normalization</strong> (encode keys into fixed-length, byte-comparable strings).</li> <li><strong>Using a B+Tree to sort</strong>: a <strong>clustered</strong> index is always better (a sequential leaf walk with no computation). An <strong>unclustered</strong> one is almost always worse (one random I/O per record), except for small top-N.</li> <li><strong>Aggregation</strong> by <strong>sorting</strong> (sort on the group keys, then one scan; filter first to sort less) or by <strong>hashing</strong> (an in-memory hash table of key → running value). If it spills: <strong>partition</strong> with h₁ into B−1 partitions on disk, then <strong>rehash</strong> each partition with h₂ ≠ h₁ in memory, recursing if a partition is still too big. Running values depend on the function (<code>AVG</code> keeps (sum, count)).</li> <li><strong>Hash usually beats sort</strong> for aggregation, unless the input is already sorted or the output must be sorted.</li> </ul>
"""

