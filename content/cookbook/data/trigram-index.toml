[[sections]]
heading = "Design notes"
body = """
Pattern: map every 3-byte window to the documents containing it. A query's trigrams must **all** appear in a matching document, so intersect their posting lists to get candidates, then confirm each candidate with a real substring check (trigrams give false positives, never false negatives).
"""

