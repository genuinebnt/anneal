[[sections]]
heading = "Design notes"
body = """
Source records are never changed. The program makes canonical keys, picks candidate pairs by blocking, scores each pair with named reasons, and groups the strong ones. Two records with different valid ISBNs, or that a person marked as different, never share a group, however they are linked.

Groups are computed again from the records and a log of decisions, so a wrong merge is undone by adding to it. A later entry about a pair replaces the earlier one; withdrawing a pair gives it back to the rules. "Different" always holds.

"Same" decisions apply newest first, and one that cannot hold is reported. A valid ISBN check digit does not prove that the number is real or that it belongs to the record. One thing here is a printed ISBN edition in one binding.

The weights and limits are made up for the example: tune real ones against pairs that people have labelled.
"""

[[sections]]
heading = "Not covered"
body = """
