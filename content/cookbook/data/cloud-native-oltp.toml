heading = "Measured"
body = """
<p>400 000 small updates (1 to 24 bytes) on 1 000 pages of 512 bytes with Zipf(1.0) popularity (the hottest pages receive tens of thousands of updates), in memory, one thread. The page-server round trip in the compute table is an assumption (0.3 ms); everything else is measured.</p>

```text title="image policy, branches, compute cache, reading the past, safekeeper commits"
400000 small updates (1-24 bytes) over 1000 pages of 512 bytes, page popularity Zipf(1.0); WAL volume 11.4 MB
image every N deltas     stored MB  amplification  deltas applied (now)  deltas applied (any LSN)      get_page
never                         11.4           1.0x               11491.1                    5976.0      190.2 us   (ingest 120 ns/record)
64                            14.3           1.2x                  36.9                      30.9        0.7 us   (ingest 146 ns/record)
16                            23.6           2.1x                   7.5                       7.6        0.3 us   (ingest 154 ns/record)
4                             60.8           5.3x                   1.8                       1.5        0.2 us   (ingest 205 ns/record)
1                            209.6          18.4x                   0.0                       0.0        0.2 us   (ingest 378 ns/record)
branching: main holds 100 000 records (5.7 MB); 100 branches created in 3 us total, each then writes 1 000 records
storage with sharing: 5.7 MB (main) + 3.9 MB (all branches' own records) = 9.6 MB; copying main into every branch would take 578 MB
branch depth      get_page of a page untouched since the fork
0                              0.23 us
1                              0.21 us
2                              0.22 us
4                              0.22 us
8                              0.27 us
16                             0.27 us
compute node: 200000 operations (80% updates, 20% reads), 2000 pages, Zipf(1.0); page server round trip assumed 0.3 ms
   cache |   hit rate     fetches/op |  WAL sent (MB) page writes (MB)    ratio |     stall per op
      16 |      24.4%          0.756 |           4.55            63.48    13.9x |           227 us
      64 |      44.2%          0.558 |           4.55            47.27    10.4x |           167 us
     256 |      65.2%          0.348 |           4.55            30.02     6.6x |           104 us
    1024 |      88.1%          0.119 |           4.55            10.82     2.4x |            36 us
    2000 |      99.0%          0.010 |           4.55             1.02     0.2x |             3 us
reading the database as of record 300 000: replaying the whole log into memory (without the cost of copying a base backup, which is not modelled) takes 3.8 ms for this small database; the page server serves the first 10 pages as of that LSN in 15 us, because an old version is read exactly like the current one
safekeepers: 100 000 appends with random node crashes and recoveries: 73230 committed (73.23%); every committed record was on at least 2 of 3 nodes at all times
```

<ul> <li><strong>Without images, reconstruction cost grows with the history of the page</strong>: an average of 11 491 deltas applied for the latest version of a randomly chosen update's page and <strong>190 µs</strong> per <code>get_page</code>. Storing a full image every 16 deltas cuts that to <strong>7.5 deltas and 0.3 µs</strong> (630× faster) for <strong>2.1×</strong> the storage; every 4 deltas gives 1.8 deltas and 5.3× storage; an image for every record is <strong>18.4×</strong> the log volume. Image frequency is a straight trade of space for read latency, and the knee is around 16 here. Ingest cost per record rises from 120 to 154 ns (K = 16) because some records trigger a materialization.</li> <li><strong>Branching is metadata</strong>: 100 branches off a 100 000-record main were created in <strong>4 µs</strong> in total; after each wrote 1 000 records the whole set takes <strong>9.6 MB</strong> (5.7 MB shared plus 3.9 MB of branch-private records) where copying the database into every branch would take <strong>578 MB</strong>. Reading a page untouched since the fork through up to 16 ancestors costs 0.22–0.27 µs here (in memory; a real layer map pays an index probe, and perhaps an I/O, per level).</li> <li><strong>The log is much smaller than the pages it replaces, until the cache holds everything.</strong> The 200 000-operation compute workload sends <strong>4.55 MB</strong> of WAL (28 bytes per update). A page-writing engine with the same cache would write each dirty page on eviction: <strong>63 MB</strong> (14× more) with a 16-page cache, 47 MB with 64 pages, 30 MB with 256, 11 MB with 1 024; only when the cache holds all 2 000 pages does writing every page once (1 MB) cost less than logging every update. Small, frequent updates to a larger-than-cache database is the log-structured design's good case.</li> <li><strong>Cache hit rate is the throughput knob.</strong> With 16 cached pages the hit rate is 24% and each operation stalls 227 µs on average waiting for page fetches (at the assumed 0.3 ms round trip); with 1 024 pages the hit rate is 88% and the stall 36 µs; with all pages 99% and 3 µs. A miss costs ~100× a hit, so the buffer pool (and a local SSD tier) must hold the hot set.</li> <li><strong>Reading the past is the same operation as reading the present</strong>: the first 10 pages as of record 300 000 take <strong>15 µs</strong>, with no restore step. (The comparison with replaying the log, 3.8 ms for this tiny database, omits the cost of copying a base backup, which dominates in practice and is not modelled.)</li> <li><strong>The safekeeper rule that matters</strong>: in the quorum model 73% of 100 000 appends committed under random crashes and recoveries (appends need two of three nodes up), and every committed record was on at least two nodes at all times, so any single further failure loses nothing. The first version of the model let a returning, stale node <em>alone</em> accept records; the test showed it forking its log away from the committed one. A node (or a minority) must never make progress by itself.</li> </ul>

<aside data-call="note"><b>Why a stale read is silent</b><p><code>get_page(page, lsn)</code> with an LSN older than the page's last change returns a perfectly valid <em>older</em> page; nothing fails. That is why <code>Compute</code> tracks the last LSN it wrote to each page and requests exactly that, and why the test <code>compute_with_a_tiny_cache_equals_a_plain_database</code> (cache of 1 to 5 pages against a plain in-memory database) is the most valuable one: with a small cache every operation exercises the fetch path.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>BTreeMap&lt;(u32, u64), Rec&gt;</code> is a multi-version index</strong>: <code>range((page, 0)..=(page, lsn)).rev()</code> visits a page's versions at or before <code>lsn</code>, newest first, which is exactly "find the newest image and the deltas after it". Tuple keys sort by page then LSN, so one structure serves every page.</li> <li><strong><code>Arc&lt;Timeline&gt;</code> parent pointers</strong> express copy-on-write branching: a child holds an <code>Arc</code> to its parent and a fork LSN, nothing is copied, and reads recurse upward. <code>RwLock</code> around the maps lets many readers reconstruct pages while one writer ingests.</li> <li><strong>Replacing a record in place</strong> (<code>insert</code> of the image at the delta's key) keeps history addressable: reads at older LSNs still find earlier records, and a read at exactly that LSN gets the image, which equals the page after the delta.</li> <li><strong>A cache that does not write back</strong>: <code>Compute::load</code> evicts with <code>HashMap::remove</code> and a <code>VecDeque</code> LRU; the "dirty page" bookkeeping exists only to count what a page-writing engine would have written, so the comparison in the table is measured on the same run.</li> <li><strong>Simple <code>O(n)</code> LRU</strong> (<code>position</code> on a <code>VecDeque</code>) is fine for a lab cache of at most 2 000 pages; production code uses an intrusive list or CLOCK (<a href="/cookbook/p/buffer-pools">L04</a>).</li> <li><strong>State machines as plain structs</strong>: <code>Safekeepers</code> is data plus three methods, which makes the property test (random crashes, recoveries and appends, with invariants checked after every step) trivial to write and the bug (a lone node diverging) trivial to see.</li> <li><strong>No unsafe, no async</strong>: the real systems are asynchronous (tokio in Neon's page server) with layer files on disk and in S3; the lab shows the algorithms, not the I/O.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Reconstruction at every LSN</strong>: for <code>image_every</code> 0, 1, 2, 3 and 8, 600 random deltas on 12 pages, 300 random <code>(page, LSN)</code> reads (including LSNs before the first record and after the last) equal a reference that keeps every historical page; with <code>image_every = K</code> at most <code>K − 1</code> deltas are applied, and with 1 none.</li> <li><strong>Image policy counting</strong>: an explicit image restarts the delta count; no extra image appears before <code>K</code> deltas have followed it, one appears at the <code>K</code>-th, and the page read there applies zero deltas.</li> <li><strong>Branches</strong>: branching copies no bytes; the branch reads the parent as of the fork; 300 interleaved writes to both sides do not leak in either direction; the history before the fork is shared; a branch of a branch reads through two levels.</li> <li><strong>Compute against a plain database</strong>: caches of 1, 2, 5 and 64 pages, 1 500 random reads and updates, every read equal to the reference, all pages equal at the end, the page server alone has the final state, and a one-page cache fetches constantly. A restarted compute with an empty cache sees everything that was logged.</li> <li><strong>Safekeepers (randomized)</strong>: 40 rounds of 300 appends with random crashes, recoveries and catch-ups; after every step all logs are prefixes of the longest and every recently committed record is on a majority; at the end losing any single node loses no committed record; one node alone cannot commit and stores nothing, and a second node joining then commits.</li> <li><strong>Mutants run against these tests</strong> (all killed): a branch reading its parent beyond the fork; a materialized image that misses the record it replaces; a miss fetching at the start LSN instead of the last written; deltas applied at offset zero; reconstruction scanning past the newest image; an update that does not log; appending without a quorum; skipping the catch-up; counting a minority as a majority; a branch that loses its parent; and the delta counter not resetting at an image (<strong>survived until the policy-counting test</strong>).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Amazon Aurora</strong> (Verbitski et al., SIGMOD 2017) introduced "the log is the database": the engine sends redo records to a six-way replicated storage fleet (writes acknowledged by 4 of 6) that applies them to pages in the background; the engine never writes data pages, so there are no checkpoints or full-page writes, and crash recovery is the storage layer's job.</li> <li><strong>Neon</strong> (open source, Rust): Postgres compute with a storage-manager hook that fetches pages remotely; <strong>safekeepers</strong> (a Paxos-based WAL service, three nodes) acknowledge commits; the <strong>pageserver</strong> ingests WAL into <em>layer files</em> (image layers and delta layers, an LSM-like layout) uploaded to object storage, serves <code>get_page&#64;LSN</code>, garbage-collects beyond the PITR window, and supports <strong>timelines/branches</strong>; compute nodes scale to zero and are started on demand.</li> <li><strong>Litestream</strong> replicates a SQLite database by shipping its WAL frames to object storage (roughly every second) with periodic snapshots; restore is the latest snapshot plus WAL replay up to the chosen time; it protects a single-writer database with no storage service.</li> <li><strong>Aurora DSQL</strong> and <strong>Azure HorizonDB</strong> (cloud-native PostgreSQL variants described in the seminar): DSQL separates query processing, a journal and storage, uses optimistic concurrency with time-based snapshots to avoid cross-region locks; HorizonDB co-designs Postgres with Azure's storage. Consult their documentation for current architecture.</li> <li><strong>YugabyteDB</strong> runs the PostgreSQL query layer over <em>DocDB</em>, a distributed RocksDB-based store with a Raft group per tablet and hybrid logical clocks for transactions; <strong>OceanBase</strong> replicates partitions with Paxos over an LSM-tree engine and runs distributed transactions with two-phase commit and global timestamps.</li> <li><strong>Umbra</strong> keeps the buffer manager but changes the page: variable-size pages and pointer swizzling give in-memory speed for disk-resident data (<a href="/cookbook/p/larger-than-memory-databases">A-LTM</a>).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Stale reads are silent</strong>: always request a page at (or after) the last LSN you wrote to it; replicas must wait until the storage service has replayed up to the requested LSN. Test with a cache smaller than the working set.</li> <li><strong>Reconstruction cost is unbounded without images</strong>: a hot page with a million deltas takes milliseconds to rebuild (190 µs for 11 000 here); materialize in the background, driven by chain length and read frequency.</li> <li><strong>History costs space</strong>: PITR windows, branches and replicas pin layers; garbage collection must respect the oldest branch point and the oldest LSN any reader may still ask for.</li> <li><strong>Network round trips replace disk reads</strong>: size the cache from the miss penalty, not from habit, and prefetch (sequential scans can request page ranges).</li> <li><strong>Commit latency is a quorum round trip</strong>: cross-zone log servers add milliseconds to every commit; group commit and batching matter more than in a single-node engine.</li> <li><strong>A minority must not progress</strong>: quorum logic needs terms/epochs, catch-up before append, and truncation of uncommitted suffixes; the lab's simplified model omits terms and leader election, which real protocols (Paxos, Raft) require.</li> <li><strong>Full-page images and hint bits</strong>: engines that modify pages without logging (hint bits, some index updates) break "the log is the database"; Neon had to log or ignore such changes. Audit every page-modifying path.</li> <li><strong>Don't confuse branches with backups</strong>: a branch shares the parent's storage; losing the storage loses both. Durability still needs replicated or object-store copies of layers.</li> <li><strong>Cold starts</strong>: scale-to-zero trades cost for a cold cache and a slow first query; keep warm pools or fast cache restore.</li> </ul></aside>
"""

