[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(No notes exist for these talks and I have not transcribed them. The points below are the design space the systems share, from their papers and documentation, not a summary of what any speaker said.)</em></p>

<ul> <li><strong>Separate compute from storage, and let the log be the storage protocol.</strong> A conventional engine writes the log <em>and</em> dirty pages (checkpoints, full-page writes, double-write buffers) to local disks. A cloud-native engine (Amazon Aurora, 2017; Neon; Azure's HorizonDB; Aurora DSQL's journal) ships <strong>only the log</strong> from a stateless compute node to a storage service that <strong>materializes pages itself</strong>. The compute node's cache is a cache, not a database: evicting a page costs nothing because the log can rebuild it.</li> <li><strong>The storage service has three jobs</strong>: make the log <strong>durable</strong> (a quorum of log servers, Neon's <em>safekeepers</em>, Aurora's 4-of-6 storage quorum), <strong>ingest</strong> it into per-page version chains (full images plus deltas, in LSM-style layer files, with cold layers in object storage), and <strong>serve <code>get_page(page, LSN)</code></strong>, reconstructing a page <em>as of any LSN</em> from the newest image at or before it plus the later deltas. A background process writes new images so reconstruction stays short.</li> <li><strong>Versions in the storage layer buy features for free</strong>: <strong>point-in-time recovery</strong> is a read at an older LSN; <strong>branches</strong> (copy-on-write forks of the database at an LSN, O(1) to create) give instant clones for testing and previews; <strong>read replicas</strong> read at a consistent LSN; <strong>scale to zero</strong> is possible because compute holds no durable state. The price is a <strong>retention horizon</strong>: history costs space, and garbage collection decides how far back you can go.</li> <li><strong>Consistency of a read depends on the LSN you ask for.</strong> A compute node must request each page at <strong>at least the LSN of the last change it made to it</strong> (Neon tracks this per page in a "last-written LSN" cache); asking for an older LSN returns a stale page. Replicas use the primary's replay position. Getting this wrong silently returns old data.</li> <li><strong>Latency moves from the disk to the network.</strong> A cache miss becomes a round trip to the page server (hundreds of microseconds in the same availability zone) instead of a local read; throughput is governed by the <strong>cache hit rate</strong>, so cloud-native engines keep large buffer pools and use local SSDs as a second-level cache. Commit latency is the quorum round trip to the log servers, not a local <code>fsync</code>.</li> <li><strong>A durable, ordered log needs a consensus-style protocol.</strong> Log servers are replicated with Paxos or Raft-like rules: a record is committed when a majority stores it, a lagging server must catch up before it takes new records, and <strong>a node that is alone must not make progress</strong> (it may have missed committed records and would fork the log).</li> <li><strong>Other points in the same design space.</strong> <em>Litestream</em> streams SQLite's WAL to object storage and restores a snapshot plus the WAL (point-in-time recovery for a single-node embedded database). <em>YugabyteDB</em> and <em>OceanBase</em> shard data into replicated tablets (a Raft/Paxos group per shard over an LSM engine) and provide distributed SQL by running transactions across groups with hybrid logical clocks or global timestamps. <em>Aurora DSQL</em> uses optimistic concurrency so that no lock is held across wide-area round trips and conflicts are detected at commit. <em>Umbra</em> gets in-memory speed on disk-resident data with variable-size pages and a pointer-swizzling buffer manager (<a href="/cookbook/p/larger-than-memory-databases">A-LTM</a>).</li> </ul>
"""

[[sections]]
heading = "The model"
body = """
```text
compute ──WAL record (lsn, page, delta)──▶ safekeepers (3, majority = 2)
   │                                          │
   │ get_page(page, lsn)                      ▼
   └──────────────────────────────────▶ page server: (page, lsn) → image | delta   (+ parent timeline for branches)
```

<ul> <li><strong><code>Rec</code></strong>: a full page <code>Image</code> or a byte-range <code>Delta</code>. A page is <code>PAGE</code> bytes; all-zero before its first record.</li> <li><strong><code>Timeline</code></strong>: the page server's store for one history, a <code>BTreeMap&lt;(page, lsn), Rec&gt;</code>. <code>get_page(page, lsn)</code> scans the page's records backwards from <code>lsn</code> to the newest image, then applies the deltas after it. A <strong>branch</strong> is a <code>Timeline</code> with a parent and a fork LSN; reads that find no image in the branch continue in the parent, never past the fork. <code>ingest</code> can <strong>replace a delta by an image of the page it produced</strong> once <code>image_every</code> deltas have accumulated, bounding reconstruction.</li> <li><strong><code>Compute</code></strong>: a bounded LRU cache. <code>update</code> loads the page (a miss asks the page server for the page at the last LSN written to it, or at the node's start LSN if untouched), applies the change, emits a WAL record, and remembers its LSN. Eviction just drops the page. The counters record log bytes and, for comparison, the bytes a page-writing engine would have written for the same dirty evictions.</li> <li><strong><code>Safekeepers</code></strong>: three logs; an append needs a majority up; the up nodes first catch up to the longest log among them; a record is committed when a majority stored it.</li> </ul>

:::deeper Reference: page records, timelines with branches and image policy, a stateless compute node with a page cache, the safekeeper quorum
```rust title="src/pageserver/mod.rs"
//! "The log is the database": a compute node that only emits WAL records, a page server that keeps versions of every page as
//! full images plus deltas and reconstructs any page at any LSN, copy-on-write branches, and safekeepers that make the log durable
//! by quorum. Pages are `PAGE` bytes; a record either replaces a page (an image) or overwrites a byte range (a delta).
use std::collections::{BTreeMap, HashMap, VecDeque};
use std::sync::{Arc, RwLock};

pub const PAGE: usize = 512;

#[derive(Clone, Debug, PartialEq)]
pub enum Rec { Image(Vec<u8>), Delta { off: u16, data: Vec<u8> } }
impl Rec {
    pub fn bytes(&self) -> usize { match self { Rec::Image(v) => v.len(), Rec::Delta { data, .. } => 4 + data.len() } }
    pub fn apply(&self, page: &mut Vec<u8>) {
        match self {
            Rec::Image(v) => { page.clear(); page.extend_from_slice(v); }
            Rec::Delta { off, data } => page[*off as usize..*off as usize + data.len()].copy_from_slice(data),
        }
    }
}

/// One timeline of page versions: records keyed by `(page, lsn)`. A branch has a parent timeline and the LSN at which it forked; it
/// stores only its own records and reads through to the parent for anything older.
pub struct Timeline {
    parent: Option<(Arc<Timeline>, u64)>,
    recs: RwLock<BTreeMap<(u32, u64), Rec>>,
    chain: RwLock<HashMap<u32, usize>>,       // deltas since the last image, per page
    /// Store a full image once this many deltas follow the previous image of a page (0 = never).
    pub image_every: usize,
}

impl Timeline {
    pub fn new(image_every: usize) -> Arc<Timeline> { Arc::new(Timeline { parent: None, recs: RwLock::new(BTreeMap::new()), chain: RwLock::new(HashMap::new()), image_every }) }
    /// Fork at `lsn`: O(1), nothing is copied.
    pub fn branch(self: &Arc<Self>, lsn: u64, image_every: usize) -> Arc<Timeline> {
        Arc::new(Timeline { parent: Some((self.clone(), lsn)), recs: RwLock::new(BTreeMap::new()), chain: RwLock::new(HashMap::new()), image_every })
    }
    pub fn depth(&self) -> usize { self.parent.as_ref().map_or(0, |(p, _)| 1 + p.depth()) }

    /// Reconstruct `page` as of `lsn`: find the newest image at or before `lsn` (own records first, then the ancestors, capped at the
    /// fork point), then apply the deltas after it in order. Returns the page and the number of records applied.
    pub fn get_page(&self, page: u32, lsn: u64) -> (Vec<u8>, usize) {
        let recs = self.recs.read().unwrap();
        let mut deltas: Vec<&Rec> = vec![];
        let mut base: Option<Vec<u8>> = None;
        for (_, r) in recs.range((page, 0)..=(page, lsn)).rev() {
            match r { Rec::Image(v) => { base = Some(v.clone()); break; } d => deltas.push(d) }
        }
        let (mut buf, mut applied) = match base {
            Some(b) => (b, 0),
            None => match &self.parent { Some((p, fork)) => p.get_page(page, lsn.min(*fork)), None => (vec![0u8; PAGE], 0) },
        };
        for d in deltas.iter().rev() { d.apply(&mut buf); applied += 1; }
        (buf, applied)
    }

    /// Ingest a WAL record; LSNs must increase per page. May store a materialized image to bound reconstruction cost.
    pub fn ingest(&self, page: u32, lsn: u64, rec: Rec) {
        let is_delta = matches!(rec, Rec::Delta { .. });
        self.recs.write().unwrap().insert((page, lsn), rec);
        let mut ch = self.chain.write().unwrap();
        let c = ch.entry(page).or_insert(0);
        if is_delta { *c += 1; } else { *c = 0; }
        if self.image_every > 0 && *c >= self.image_every {
            *c = 0;
            drop(ch);
            let (img, _) = self.get_page(page, lsn);
            self.recs.write().unwrap().insert((page, lsn), Rec::Image(img));      // replaces the delta with the page it produced
        }
    }
    pub fn stored_bytes(&self) -> usize { self.recs.read().unwrap().values().map(|r| r.bytes() + 12).sum() }
    pub fn record_count(&self) -> usize { self.recs.read().unwrap().len() }
}

/// A compute node: a bounded page cache, no local data files. Every update emits a WAL record to the page server; eviction just drops
/// the page, because the log already contains everything needed to rebuild it. A miss asks the page server for the page at the
/// *last LSN this node wrote to it* (or at the node's start LSN for pages it never touched).
pub struct Compute {
    ps: Arc<Timeline>,
    cap: usize,
    cache: HashMap<u32, Vec<u8>>,
    lru: VecDeque<u32>,
    dirty: HashMap<u32, bool>,
    lw_lsn: HashMap<u32, u64>,
    start_lsn: u64,
    pub next_lsn: u64,
    pub fetches: u64, pub wal_bytes: u64, pub page_write_bytes: u64,
}
impl Compute {
    pub fn new(ps: Arc<Timeline>, cap: usize, start_lsn: u64) -> Self {
        Compute { ps, cap, cache: HashMap::new(), lru: VecDeque::new(), dirty: HashMap::new(), lw_lsn: HashMap::new(), start_lsn, next_lsn: start_lsn + 1, fetches: 0, wal_bytes: 0, page_write_bytes: 0 }
    }
    fn touch(&mut self, page: u32) {
        if let Some(i) = self.lru.iter().position(|&p| p == page) { self.lru.remove(i); }
        self.lru.push_back(page);
    }
    fn load(&mut self, page: u32) {
        if !self.cache.contains_key(&page) {
            let lsn = self.lw_lsn.get(&page).copied().unwrap_or(self.start_lsn);
            let (p, _) = self.ps.get_page(page, lsn);
            self.fetches += 1;
            self.cache.insert(page, p);
            while self.cache.len() > self.cap {
                let victim = self.lru.pop_front().expect("cache is non-empty");
                if victim == page { self.lru.push_back(victim); continue; }
                self.cache.remove(&victim);
                if self.dirty.remove(&victim).unwrap_or(false) { self.page_write_bytes += PAGE as u64; }   // what a page-writing engine would flush
            }
        }
        self.touch(page);
    }
    pub fn read(&mut self, page: u32) -> Vec<u8> { self.load(page); self.cache[&page].clone() }
    pub fn update(&mut self, page: u32, off: u16, data: &[u8]) {
        self.load(page);
        self.cache.get_mut(&page).unwrap()[off as usize..off as usize + data.len()].copy_from_slice(data);
        self.dirty.insert(page, true);
        let lsn = self.next_lsn;
        self.next_lsn += 1;
        let rec = Rec::Delta { off, data: data.to_vec() };
        self.wal_bytes += 8 + 4 + rec.bytes() as u64;
        self.ps.ingest(page, lsn, rec);
        self.lw_lsn.insert(page, lsn);
    }
    pub fn flush_page_bytes(&mut self) -> u64 { self.page_write_bytes + self.dirty.values().filter(|&&d| d).count() as u64 * PAGE as u64 }
}

/// Three safekeepers: a record is acknowledged when a majority has stored it. Logs are *contiguous prefixes* of one sequence: before
/// each append the nodes that are up first catch up from the longest log among them (what a new leader does when it syncs a quorum),
/// then every up node stores the record; with fewer than a majority up nothing happens. A node that was down simply stays behind until it is up again at the next append.
pub struct Safekeepers { logs: Vec<Vec<u64>>, pub up: Vec<bool> }
impl Safekeepers {
    pub fn new(n: usize) -> Self { Safekeepers { logs: vec![vec![]; n], up: vec![true; n] } }
    pub fn majority(&self) -> usize { self.logs.len() / 2 + 1 }
    /// Returns whether a majority stored the record (it is then committed).
    pub fn append(&mut self, lsn: u64) -> bool {
        // Without a majority up nothing is stored: a lone node may be stale (it can have missed committed records while it was down),
        // and appending after its stale log would make it diverge from the committed one. Any two nodes include a holder of every
        // committed record, so with a majority up the longest log is complete.
        if self.up.iter().filter(|&&u| u).count() < self.majority() { return false; }
        self.catch_up();
        let mut stored = 0;
        for (i, l) in self.logs.iter_mut().enumerate() { if self.up[i] { l.push(lsn); stored += 1; } }
        stored >= self.majority()
    }
    /// Bring every up node to the longest log among the up nodes.
    pub fn catch_up(&mut self) {
        let best = (0..self.logs.len()).filter(|&i| self.up[i]).max_by_key(|&i| self.logs[i].len());
        if let Some(b) = best { let src = self.logs[b].clone(); for i in 0..self.logs.len() { if self.up[i] { self.logs[i] = src.clone(); } } }
    }
    pub fn log(&self, i: usize) -> &Vec<u64> { &self.logs[i] }
}
```
