3 left joins               165981           1787            93.7x       119.4x
```

<ul> <li><strong>Correct and wrong rules separate cleanly</strong>: seven rules, thousands of applications each, no counterexample; five wrong rules, each caught (7% to 28% of their applications are wrong; eager aggregation only 4 of 36, a rare shape, which is exactly why the minimum-coverage assertion exists). The counterexamples are small enough to read: the <strong>left-associativity</strong> mutant dies on <code>((T0 ⟕ T1) ⟕[IS NULL] T2)</code>, the textbook case where a null-padded B row satisfies <code>B.x IS NULL</code> before reordering and cannot after.</li> <li><strong>Pushdown is worth 24× to 96× in rows processed</strong>, growing with the number of joins (each filter applied below a join shrinks every later join's input). The left-join queries do just as well because the filter on the <em>last</em> table rejects NULLs there, so <code>outer_to_inner</code> turns them into inner joins and unlocks pushdown to <strong>both</strong> sides: the two rules together are worth more than either.</li> <li><strong>Eager aggregation applies rarely and carries its own bug class</strong>: the mutant that recounts rows instead of summing partial counts is only exposed by plans with duplicate join matches; random testing found it in 4 of 36 applications.</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Rules as plain functions</strong>: <code>type Rule = fn(&amp;Plan) -&gt; Option&lt;Plan&gt;</code>; a rule set is an array of function pointers, a rule is testable in isolation, and <code>rewrites(plan, rule)</code> (apply at exactly one node, return every result) is the only traversal machinery: no visitor trait, no mutation, so a failing rewrite is a value you can print.</li> <li><strong>Boxed enums for plans</strong>: <code>Plan</code> and <code>Pred</code> are recursive enums with <code>Box</code>; <code>Clone</code> is derived (rules clone the parts they keep); pattern matching with <code>let Join(Kind::Left, on, l, r) = &amp;**inner else { return None };</code> states each rule's <em>pattern</em> in one line, and the <code>Option</code> return is the rule's guard.</li> <li><strong>Three-valued logic is <code>Option&lt;bool&gt;</code></strong>: <code>eval</code> returns <code>None</code> for <em>unknown</em>; <code>Filter</code> keeps <code>Some(true)</code> only. NULL is <code>Option&lt;i64&gt;</code> and the derived ordering of <code>Vec&lt;Option&lt;i64&gt;&gt;</code> (None first) is enough to canonicalize bags.</li> <li><strong>Bag equality without hashing</strong>: reorder each row's columns by column id, sort the rows, compare vectors; plans that emit columns in different orders (a commuted join) compare equal.</li> <li><strong>Make the executor count work</strong>: <code>run_counting</code> adds each operator's output rows to a counter; an optimization claim ("pushdown saves work") is then a number, independent of machine speed.</li> <li><strong>A reserved word</strong>: <code>gen</code> is a keyword in the 2024 edition; the generator functions are named <code>make_*</code>.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>NULL is the source of almost every wrong rule</strong>: <code>NOT IN</code> with a NULL in the list, <code>&lt;&gt; ALL</code>, outer joins, <code>COUNT</code> vs <code>SUM</code> over empty groups. A rule validated only on NULL-free data is untested; the harness makes NULL a quarter of all values.</li> <li><strong>Bag vs set</strong>: a rule that is right for sets may duplicate or drop rows in bags (<code>DISTINCT</code> elimination needs a key; semi-joins must not multiply rows). Include duplicates in every test database.</li> <li><strong>Errors and side effects</strong>: pushing a filter below a join (or reordering predicates) can evaluate an expression on rows that previously never reached it (<code>x / y</code> with <code>y = 0</code>, a cast that can fail, a function with side effects); production engines restrict pushdown of fallible and volatile expressions and rely on <code>CASE</code>'s guarantee.</li> <li><strong>Expensive predicates</strong>: pushing a filter down is not always cheaper if the filter is a costly UDF applied to more rows than a join would let through (<em>predicate migration</em>): the cost model must be consulted for non-trivial predicates.</li> <li><strong>Non-terminating rule sets</strong>: push-down and pull-up together, or commute applied unconditionally, cycle forever; guard with a canonical form or apply in strata.</li> <li><strong>Testing is part of the optimizer</strong>: this harness's mutants are the bugs production optimizers actually shipped; fuzz the full engine the same way in practice (<a href="/cookbook/p/deterministic-simulation">Part VI</a>: SQLancer's ternary-logic partitioning, NoREC and pivoted-query synthesis find optimizer bugs by comparing equivalent queries).</li> </ul></aside>
"""

