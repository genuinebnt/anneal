<p>(<code>253.0</code> is the pseudo-column ONE: <code>SUM(ONE)</code> is <code>COUNT(*)</code>.)</p>

<p><strong>Effect of the always-good rules</strong> on executor work (rows produced by all operators; 250-row tables over 30 values, a selective equality filter on the first and on the last table above the joins; median of 120 queries): the rules <code>outer_to_inner</code>, <code>filter_through_join</code> and <code>filter_merge</code> applied to a fixpoint, with results checked equal to the original plan's:</p>

