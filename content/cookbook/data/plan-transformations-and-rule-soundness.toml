<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Random plans</strong>: 2–4 tables of 2 integer columns over the domain {0, 1, 2, NULL}, 0–5 rows each (tiny domains and sizes make <em>every</em> edge case—duplicates, empty inputs, all-NULL columns, unmatched rows—likely within a few thousand trials); plans are random join trees (inner or left, equality, inequality, <code>OR … IS NULL</code> predicates), filters (stacked, mixed <code>AND</code>/<code>OR</code>/<code>IS NULL</code>) and an optional aggregate on top.</li> <li><strong><code>correct_rules_preserve_results_on_random_plans_and_data</code></strong>: for each correct rule, every plan on which the rule applies <em>at any node</em> is rewritten at <em>every</em> applicable node and compared on 4 random databases; <strong>zero counterexamples</strong> and a <strong>minimum application count</strong> (so a generator that never produces the pattern can't make a rule look sound). Associativity gets a targeted <code>(A ⋈ B) ⋈ C</code> generator where the second predicate is sometimes <code>IS NULL</code> or <code>… OR IS NULL</code>, the non-null-rejecting forms that break outer-join reordering.</li> <li><strong><code>wrong_rules_are_caught_with_small_counterexamples</code></strong>: every mutant must produce at least one counterexample; the smallest plan found is printed. The mutants double as the proof that the harness is able to fail.</li> <li>Every rewrite must also <strong>preserve the output columns</strong> (a rule that silently drops one is wrong even if the remaining columns match).</li> </ul></aside>
"""

