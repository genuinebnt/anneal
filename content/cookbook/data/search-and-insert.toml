"""

[[sections]]
heading = "Tests"
body = """
<p>The model test from <a href="/cookbook/p/toolchain">Toolchain</a> is the spec: random inserts, deletes, lookups and range scans against a <code>BTreeMap</code>, with <code>check_invariants()</code> after <strong>every</strong> operation, run with tiny nodes (leaf max 2–5, inner max 3–5) and a 24-frame pool so pages are evicted mid-operation.</p>

```rust title="tests/b_plus_tree.rs"
use proptest::prelude::*;
use std::collections::BTreeMap;
use std::sync::Arc;
use relational::buffer::{arc_replacer::ArcReplacer, buffer_pool_manager::BufferPoolManager};
use relational::storage::{disk::disk_manager::{DiskManager, MemDiskManager}, index::b_plus_tree::{BPlusTree, Latching}};

fn bpm(frames: usize) -> BufferPoolManager<ArcReplacer> {
    let disk: Arc<dyn DiskManager> = Arc::new(MemDiskManager::default());
    BufferPoolManager::new(frames, disk, ArcReplacer::new(frames), 2)
}

#[derive(Debug, Clone)]
enum Op { Ins(u64, u64), Del(u64), Get(u64), Scan(u64) }

fn ops() -> impl Strategy<Value = Vec<Op>> {
    prop::collection::vec(prop_oneof![
        5 => (0u64..300, any::<u64>()).prop_map(|(k, v)| Op::Ins(k, v)),
        4 => (0u64..300).prop_map(Op::Del),
        1 => (0u64..300).prop_map(Op::Get),
        1 => (0u64..300).prop_map(Op::Scan),
    ], 0..1500)
}

proptest! {
    #![proptest_config(ProptestConfig { cases: 400, ..ProptestConfig::default() })]
    #[test]
    fn btree_matches_model(leaf_max in 2usize..6, int_max in 3usize..6, k in prop_oneof![Just(0usize), Just(1), Just(3)], mode in prop_oneof![Just(Latching::Optimistic), Just(Latching::Pessimistic)], ops in ops()) {
        let bpm = bpm(24);                                   // small pool: evictions mid-operation
        let t = BPlusTree::new(&bpm, leaf_max, int_max, k).unwrap().with_latching(mode);
        let mut m = BTreeMap::new();
        for op in ops {
            match op {
                Op::Ins(key, v) => { let fresh = !m.contains_key(&key); prop_assert_eq!(t.insert(key, v).unwrap(), fresh); m.entry(key).or_insert(v); }
                Op::Del(key) => { t.remove(key).unwrap(); m.remove(&key); }
                Op::Get(key) => prop_assert_eq!(t.get(key).unwrap(), m.get(&key).copied()),
                Op::Scan(from) => {
                    let got: Vec<(u64, u64)> = t.iter_from(Some(from)).unwrap().map(|r| r.unwrap()).collect();
                    let want: Vec<(u64, u64)> = m.range(from..).map(|(a, b)| (*a, *b)).collect();
                    prop_assert_eq!(got, want);
                }
            }
            t.check_invariants().unwrap();
        }
        let all: Vec<(u64, u64)> = t.iter_from(None).unwrap().map(|r| r.unwrap()).collect();
        prop_assert_eq!(all, m.iter().map(|(a, b)| (*a, *b)).collect::<Vec<_>>());
        prop_assert_eq!(t.is_empty().unwrap(), m.is_empty());
    }
}

#[test]
fn sequential_and_reverse_scale() {
    let bpm = bpm(64);
    let t = BPlusTree::new(&bpm, 8, 8, 0).unwrap();
    for k in 0..20_000u64 { assert!(t.insert(k, k * 10).unwrap()); }
    let depth = t.check_invariants().unwrap();
    for k in (0..20_000u64).rev().step_by(2) { t.remove(k).unwrap(); }
    t.check_invariants().unwrap();
    assert_eq!(t.iter_from(None).unwrap().count(), 10_000);
    for k in 0..20_000u64 { assert_eq!(t.get(k).unwrap(), (k % 2 == 0).then_some(k * 10)); }
    eprintln!("20k sequential keys, max 8/8: depth {depth}");
}

#[test]
fn bulk_load_shapes() {
    for n in [0usize, 1, 2, 3, 5, 17, 100, 1000, 12345] {
        for (lm, im) in [(2usize, 3usize), (3, 3), (4, 5), (8, 8), (255, 255)] {
            for fill in [50usize, 70, 100] {
                let bpm = bpm(32);
                let entries: Vec<(u64, u64)> = (0..n as u64).map(|k| (k * 3, k)).collect();
                let t = BPlusTree::bulk_load(&bpm, lm, im, 0, &entries, fill).unwrap();
                t.check_invariants().unwrap();
                let got: Vec<(u64, u64)> = t.iter_from(None).unwrap().map(|r| r.unwrap()).collect();
                assert_eq!(got, entries, "n={n} lm={lm} im={im} fill={fill}");
                if n > 0 { assert_eq!(t.get(3 * (n as u64 / 2)).unwrap(), Some(n as u64 / 2)); }
                for k in 0..50u64 { t.insert(k * 3 + 1, k).unwrap(); t.remove(k * 3).unwrap(); }
                t.check_invariants().unwrap();
            }
        }
    }
    let bpm = bpm(32);
    let t = BPlusTree::new(&bpm, 3, 3, 1).unwrap();
    for k in [5u64, 1, 9, 3, 7, 2, 8] { t.insert(k, k).unwrap(); }
    t.remove(9).unwrap();
    println!("{}", t.to_dot().unwrap());
}

/// Why both modes exist, measured: a change that stays inside one leaf takes exactly one write latch
/// optimistically, and several (header + path, released as nodes prove safe) pessimistically; the final
/// contents are identical. Mirrors BusTub's OptimisticInsertTest / OptimisticDeleteTest.
#[test]
fn optimistic_takes_one_write_latch_pessimistic_more() {
    let mut seen = Vec::new();
    for mode in [Latching::Optimistic, Latching::Pessimistic] {
        let bpm = bpm(50);
        let t = BPlusTree::new(&bpm, 4, 3, 0).unwrap().with_latching(mode);
        for i in 0..25u64 {
            assert!(t.insert(2 * i, i).unwrap());
        }
        // Pick keys that provably stay inside one leaf: a leaf with room to insert, one above its minimum to delete.
        let leaves = t.leaves().unwrap();
        let ins_key = leaves.iter().find(|l| l.keys.len() + 1 < l.max_size).unwrap().keys[0] + 1;
        let del_key = leaves.iter().find(|l| l.keys.len() > l.min_size).unwrap().keys[0];
        let (r0, w0) = (bpm.get_reads(), bpm.get_writes());
        assert!(t.insert(ins_key, 0).unwrap());
        let (r1, w1) = (bpm.get_reads(), bpm.get_writes());
        t.remove(del_key).unwrap();
        let (r2, w2) = (bpm.get_reads(), bpm.get_writes());
        let all: Vec<u64> = t.iter_from(None).unwrap().map(|r| r.unwrap().0).collect();
        seen.push(((r1 - r0, w1 - w0), (r2 - r1, w2 - w1), all));
        t.check_invariants().unwrap();
    }
    let (opt, pes) = (&seen[0], &seen[1]);
    assert_eq!(opt.2, pes.2, "the modes must agree on the contents");
    assert_eq!((opt.0.1, opt.1.1), (1, 1), "optimistic: one write latch each");
    assert!(opt.0.0 > 0 && opt.1.0 > 0, "optimistic descends with read latches");
    assert!(pes.0.1 > 1 && pes.1.1 > 1, "pessimistic: write latches on the way down, got {:?}", (pes.0, pes.1));
}
```

:::deeper The invariant checker used after every operation
```rust title="src/storage/index/b_plus_tree.rs (invariants)"
    // ---- structural checks (tests) -------------------------------------------------------------
    pub fn check_invariants(&self) -> Res<usize> {
        let h = self.bpm.read_page(self.header)?;
        let root = root_of(h.data());
        drop(h);
        if !root.is_valid() { return Ok(0); }
        let mut leaves = Vec::new();
        let depth = self.check_node(root, None, None, true, &mut leaves)?;
        // Sibling chain visits exactly the leaves, in order.
        for w in leaves.windows(2) {
            let g = self.bpm.read_page(w[0])?;
            assert_eq!(next_leaf(g.data()), w[1], "broken sibling chain");
        }
        let g = self.bpm.read_page(*leaves.last().unwrap())?;
        assert!(!next_leaf(g.data()).is_valid(), "last leaf has a successor");
        Ok(depth)
    }

    fn check_node(&self, pid: PageId, lo: Option<u64>, hi: Option<u64>, is_root: bool, leaves: &mut Vec<PageId>) -> Res<usize> {
        let (b, kids) = { let g = self.bpm.read_page(pid)?; let b = *g.data(); let kids = if is_leaf(&b) { vec![] } else { int_read(&b).1 }; (b, kids) };
        let n = size(&b);
        if is_leaf(&b) {
            assert!(n <= self.leaf_max, "leaf overflow");
            if !is_root { assert!(n >= self.leaf_min(), "leaf underflow: {n} < {}", self.leaf_min()); }
            let t = tombs(&b);
            assert!(t.len() <= self.k_tombs, "too many tombstones");
            let mut s = t.clone(); s.sort(); s.dedup(); assert_eq!(s.len(), t.len(), "duplicate tombstone");
            assert!(t.iter().all(|&x| x < n), "tombstone out of range");
            for i in 0..n {
                let k = lkey(&b, i);
                if i > 0 { assert!(lkey(&b, i - 1) < k, "leaf keys not sorted"); }
                if let Some(lo) = lo { assert!(k >= lo, "key below separator"); }
                if let Some(hi) = hi { assert!(k < hi, "key above separator"); }
            }
            leaves.push(pid);
            return Ok(1);
        }
        assert!(n <= self.int_max, "internal overflow");
        if is_root { assert!(n >= 2, "root internal with < 2 children"); } else { assert!(n >= self.int_min(), "internal underflow"); }
        let mut depth = None;
        for i in 0..n {
            if i > 1 { assert!(ikey(&b, i - 1) < ikey(&b, i), "internal keys not sorted"); }
            let clo = if i == 0 { lo } else { Some(ikey(&b, i)) };
            let chi = if i + 1 < n { Some(ikey(&b, i + 1)) } else { hi };
            let d = self.check_node(kids[i], clo, chi, false, leaves)?;
            assert_eq!(*depth.get_or_insert(d), d, "leaves at different depths");
            let cg = self.bpm.read_page(kids[i])?;
            let expect_lvl = if is_leaf(cg.data()) { 1 } else { level(cg.data()) + 1 };
            assert_eq!(level(&b), expect_lvl, "level byte wrong");
        }
        Ok(depth.unwrap() + 1)
    }
}
