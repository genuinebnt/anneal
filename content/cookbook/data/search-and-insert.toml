<aside data-call="testing"><b>What each invariant catches</b><ul> <li><strong>Keys sorted within a node</strong>: a bad insert position (off-by-one in <code>leaf_lower_bound</code>).</li> <li><strong>Keys within the parent's separators</strong>: a split that copied up the wrong key, or a redistribution that forgot to update the parent.</li> <li><strong>Sizes within [min, max]</strong>: missing split or merge; the wrong <code>min</code> formula.</li> <li><strong>All leaves at the same depth</strong>: a merge that dropped a level incorrectly, or a root collapse that went wrong.</li> <li><strong>Sibling chain = in-order leaves</strong>: a split or merge that didn't fix <code>next</code>. Range scans break silently without this check.</li> <li><strong>The level byte matches the height</strong>: needed by optimistic descents (<a href="/cookbook/p/b-tree-concurrency">P2.5</a>).</li> <li><strong>Tombstones valid</strong> (≤ K, unique, in range): index shifting bugs in insert and remove.</li> </ul></aside>
