[[sections]]
heading = "Testing a rewriter: the property that matters"
body = """
<p>The only requirement of a rewrite rule is <strong>semantic preservation</strong>. That's directly testable: generate random predicates over a small column domain <em>including NULL</em>, simplify them, and require that both versions keep exactly the same rows from an exhaustive grid of inputs. 50,000 random predicates per run:</p>

```rust title="tests/simplify.rs (the semantic-preservation property)"
proptest! {
    #![proptest_config(ProptestConfig { cases: 3000, ..ProptestConfig::default() })]
    /// The simplified filter must keep exactly the same rows as the original, over every row of a grid
    /// that includes NULLs and boundary values.
    #[test]
    fn simplify_preserves_filter_semantics(p in pred()) {
        let s = simplify_filter(p.clone());
        for r in rows() { prop_assert_eq!(kept(&p, &r), kept(&s, &r), "original {:?}\\nsimplified {:?}\\nrow {:?}", p, s, r); }
        // and folding alone is exactly value-preserving, even for NULL results
        let f = fold(p.clone());
        for r in rows() { prop_assert_eq!(p.eval(&r).ok(), f.eval(&r).ok()); }
    }
}
```

<aside data-call="testing"><b>The first run found a real bug</b><p><code>x &lt; 0 OR x = 0 OR x &gt; 0</code> merges into one range covering <em>every</em> integer, and the first version emitted <code>TRUE</code> for it. For <code>x = NULL</code> the original is UNKNOWN (row dropped) and <code>TRUE</code> keeps it. The shrunk counterexample the property test printed was <code>Or(Or(Gt(0, x), Eq(0, x)), Lt(0, x))</code> on the row <code>(NULL, NULL)</code>. The fix: a range with no bounds must emit <code>x IS NOT NULL</code>, not <code>TRUE</code>: NULL belongs to no range. A hand-written test suite would have needed someone to think of NULL <em>in this particular rewrite</em>. The property test needed one line (<code>Just(Expr::Lit(Value::Null))</code> in the strategy).</p></aside>
"""

[[sections]]
heading = "Rule ordering is the hard part of heuristic optimizers"
body = """
<p>Rules interact. <a href="/cookbook/p/optimizer-rules-and-the-engine">P3.6</a> shows a real case: converting a join into an index join <em>before</em> pushing the filters above it made the filters unpushable. Three standard answers:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Approach</th> <th>How</th> <th>Used by</th> </tr> </thead> <tbody> <tr> <td><strong>Fixed phases</strong></td> <td>simplify → pushdown → join selection, in a hand-chosen order</td> <td>this engine, MySQL, SQLite's query planner</td> </tr> <tr> <td><strong>Fixpoint rule sets</strong></td> <td>apply a batch of rules repeatedly until no rule changes the plan</td> <td>Spark Catalyst (rule batches with <code>FixedPoint(100)</code>), Calcite's HepPlanner</td> </tr> <tr> <td><strong>Memo-based search</strong></td> <td>keep <em>all</em> equivalent forms, so no rule ever blocks another</td> <td>Volcano/Cascades: SQL Server, CockroachDB, Greenplum Orca, Calcite's VolcanoPlanner (Part III)</td> </tr> </tbody> </table></div>
"""

[[sections]]
heading = "Subqueries"
body = """
<p>A correlated subquery is a function called once per outer row, the worst case for performance. Optimizers rewrite them away:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Form</th> <th>Rewrite</th> </tr> </thead> <tbody> <tr> <td><code>WHERE x IN (SELECT y FROM t)</code></td> <td><strong>semi-join</strong> (output each outer row at most once)</td> </tr> <tr> <td><code>WHERE EXISTS (SELECT … WHERE t.k = outer.k)</code></td> <td>semi-join on the correlation predicate (the lecture's <code>sailors/reserves</code> example)</td> </tr> <tr> <td><code>WHERE NOT EXISTS (…)</code></td> <td><strong>anti-join</strong></td> </tr> <tr> <td><code>WHERE x NOT IN (SELECT y …)</code></td> <td><strong>null-aware</strong> anti-join: any NULL in the subquery makes the result empty (<a href="/cookbook/p/join-algorithms">L12</a>)</td> </tr> <tr> <td><code>SELECT (SELECT MAX(r) FROM t WHERE t.k = o.k)</code></td> <td>left join against a pre-aggregated <code>GROUP BY k</code> result</td> </tr> <tr> <td>deeply correlated or lateral</td> <td><strong>dependent join</strong> + general decorrelation (Neumann &amp; Kemper, Part III)</td> </tr> </tbody> </table></div>

<p>The engine's join operators from <a href="/cookbook/p/aggregation-and-nested-loop-joins">P3</a> and <a href="/cookbook/p/join-algorithms">L12</a> already contain everything the rewritten plans need (inner, left, semi and anti variants exist in the L12 reference). What's missing is the binder support for subquery syntax.</p>
"""

