```rust title="tests/schedule.rs"
use relational::concurrency::schedule::*;
use Op::*;

#[test]
fn the_lecture_bank_example() {
    // T1: A -= 100; B += 100      T2: A *= 1.06; B *= 1.06      (each reads then writes)
    let t1 = vec![R(1, 'A'), W(1, 'A'), R(1, 'B'), W(1, 'B')];
    let t2 = vec![R(2, 'A'), W(2, 'A'), R(2, 'B'), W(2, 'B')];
    let all = interleavings(&[t1.clone(), t2.clone()]);
    let serial: Vec<_> = all.iter().filter(|s| is_serial(s)).collect();
    let csr = all.iter().filter(|s| is_conflict_serializable(s)).count();
    let vsr = all.iter().filter(|s| is_view_serializable(s)).count();
    eprintln!("{} interleavings: {} serial, {} conflict-serializable, {} view-serializable, {} NOT serializable", all.len(), serial.len(), csr, vsr, all.len() - vsr);
    assert_eq!(all.len(), 70);
    assert_eq!(serial.len(), 2);

    // THE theorem, checked by execution: every conflict-serializable schedule produces exactly the
    // database and the read values of the serial schedule its dependency graph orders.
    for s in &all {
        match serial_order(s) {
            Some(order) => assert_eq!(run(s), run(&serial_schedule(s, &order)), "{s:?}"),
            None => {
                // not conflict-serializable: no serial order reproduces it (for this deterministic interpreter)
                let r = run(s);
                assert!([vec![1u8, 2], vec![2, 1]].iter().all(|o| run(&serial_schedule(s, o)) != r), "{s:?}");
            }
        }
    }
    // The lecture's bad schedule: T1 touches A, T2 does both, T1 touches B afterwards.
    let bad = parse("R1(A) W1(A) R2(A) W2(A) R2(B) W2(B) R1(B) W1(B)");
    assert!(!is_conflict_serializable(&bad));
    let g = dependency_graph(&bad);
    assert!(g[&1].contains(&2) && g[&2].contains(&1), "cycle T1 <-> T2");
}

#[test]
fn universe_of_schedules() {
    // serial ⊂ conflict-serializable ⊂ view-serializable ⊂ all, and each inclusion is strict:
    let blind = parse("R1(A) W2(A) W1(A) W3(A)");                 // the classic blind-write schedule
    assert!(!is_conflict_serializable(&blind));                    // cycle T1 -> T2 -> T1 in the dependency graph
    assert!(is_view_serializable(&blind));                         // but equivalent to T1 T2 T3: the final write is T3's either way
    assert!(!is_serial(&parse("R1(A) R2(A) W1(A) W2(A)")) && !is_view_serializable(&parse("R1(A) R2(A) W1(A) W2(A)")));   // lost update
    let ser = parse("R1(A) W1(A) R2(A) W2(A)");
    assert!(is_serial(&ser) && is_conflict_serializable(&ser));
    let interleaved = parse("R1(A) R2(B) W1(A) W2(B)");            // not serial, but conflict-serializable
    assert!(!is_serial(&interleaved) && is_conflict_serializable(&interleaved));
    // over every interleaving of three small transactions, the inclusions hold
    let ts = vec![vec![R(1, 'A'), W(1, 'B')], vec![R(2, 'B'), W(2, 'A')], vec![W(3, 'A'), W(3, 'B')]];
    let all = interleavings(&ts);
    let (mut s, mut c, mut v) = (0, 0, 0);
    for x in &all {
        let (is_s, is_c, is_v) = (is_serial(x), is_conflict_serializable(x), is_view_serializable(x));
        assert!(!is_s || is_c, "serial => CSR"); assert!(!is_c || is_v, "CSR => VSR");
        s += is_s as usize; c += is_c as usize; v += is_v as usize;
    }
    eprintln!("3 txns × 2 ops: {} interleavings → {s} serial ⊂ {c} conflict-serializable ⊂ {v} view-serializable", all.len());
}

#[test]
fn recoverability_hierarchy() {
    // strict ⊂ ACA ⊂ recoverable ⊂ all
    let dirty_read_commit_first = parse("W1(A) R2(A) C2 C1");      // T2 commits after reading T1's uncommitted write, before T1
    assert!(!is_recoverable(&dirty_read_commit_first));
    let cascading = parse("W1(A) R2(A) W2(B) C1 C2");              // recoverable, but if T1 aborts T2 must abort too
    assert!(is_recoverable(&cascading) && !avoids_cascading_aborts(&cascading));
    let aca_not_strict = parse("W1(A) W2(A) C1 C2");               // overwrites uncommitted data: no cascading abort, but not strict
    assert!(avoids_cascading_aborts(&aca_not_strict) && !is_strict(&aca_not_strict));
    let strict = parse("W1(A) C1 R2(A) W2(A) C2");
    assert!(is_strict(&strict) && avoids_cascading_aborts(&strict) && is_recoverable(&strict));
    let abort_after_read = parse("W1(A) R2(A) A1 C2");              // T2 committed data derived from an aborted txn
    assert!(!is_recoverable(&abort_after_read));
}
```

```text title="3 transactions of 2 operations each: 90 interleavings"
6 serial ⊂ 10 conflict-serializable ⊂ 10 view-serializable      (the inclusions are strict only with blind writes, below)
```
