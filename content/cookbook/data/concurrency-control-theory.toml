[[sections]]
heading = "Why view serializability exists and why nobody uses it"
body = """
```text
R1(A) W2(A) W1(A) W3(A)       T1 reads A, T2 and T1 write it, T3 blind-writes it
  dependency graph:  R1(A) → W2(A) gives T1 → T2;   W2(A) → W1(A) gives T2 → T1   ⇒ cycle ⇒ NOT conflict-serializable
  but it's view-equivalent to  T1 T2 T3: T1 reads the initial A (same), and T3's write is last (same), so every value anyone can observe is the same.
```

<p>Blind writes (a write that overwrites a value without reading it) are what separate the two. Recognizing view serializability is NP-complete (Papadimitriou 1979), and it requires knowing the transactions in advance. Conflict serializability is a graph-cycle check, which is why it's the criterion every real protocol implements.</p>
"""

[[sections]]
heading = "Recoverability: surviving aborts"
body = """
<p>Serializability talks about committed transactions. It says nothing about what happens when one <strong>aborts</strong> after others have read its writes:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Class</th> <th>Rule</th> <th>Failure when violated</th> </tr> </thead> <tbody> <tr> <td><strong>Recoverable</strong></td> <td>if Tᵢ reads from Tⱼ, Tⱼ commits before Tᵢ does</td> <td>Tᵢ commits data derived from a write that Tⱼ later aborts: unrecoverable</td> </tr> <tr> <td><strong>Avoids cascading aborts (ACA)</strong></td> <td>transactions read only <em>committed</em> writes</td> <td>one abort drags down every transaction that read its data (a <em>cascade</em>)</td> </tr> <tr> <td><strong>Strict</strong></td> <td>no read <em>or write</em> of an object until its last writer has committed or aborted</td> <td>undo needs the <strong>before-image</strong>, which a later overwrite would destroy; strict schedules let abort restore old values simply</td> </tr> </tbody> </table></div>

```text
strict ⊂ avoids cascading aborts ⊂ recoverable ⊂ all
W1(A) R2(A) C2 C1        not recoverable   (T2 committed after reading T1's uncommitted write)
W1(A) R2(A) W2(B) C1 C2  recoverable, but T1's abort would cascade to T2
W1(A) W2(A) C1 C2        no cascades, not strict (T2 overwrites uncommitted data)
W1(A) C1 R2(A) W2(A) C2  strict
```

<p>Strict two-phase locking (<a href="/cookbook/p/two-phase-locking">L18</a>) produces exactly the strict schedules, and that's why it is the textbook protocol: serializable <strong>and</strong> trivially recoverable.</p>
"""

[[sections]]
heading = "Anomalies and isolation levels"
body = """
<p>Full serializability costs concurrency, so SQL lets applications choose weaker <strong>isolation levels</strong>, each defined by the anomalies it permits. The ANSI definitions (1992) were ambiguous, and the standard is usually supplemented by Berenson et al.'s critique (1995) and Adya's formalization (1999):</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Anomaly</th> <th>What happens</th> </tr> </thead> <tbody> <tr> <td><strong>Dirty read</strong></td> <td>read another transaction's uncommitted write</td> </tr> <tr> <td><strong>Non-repeatable read</strong></td> <td>read X twice and see different committed values</td> </tr> <tr> <td><strong>Lost update</strong></td> <td>two read-modify-write cycles interleave; one update vanishes</td> </tr> <tr> <td><strong>Phantom</strong></td> <td>the same range or predicate query returns different <em>sets of rows</em></td> </tr> <tr> <td><strong>Write skew</strong></td> <td>two transactions read overlapping data, each writes a <em>different</em> item, and together violate an invariant (two on-call doctors both go off call)</td> </tr> </tbody> </table></div>

<div class="cb-g-tt"><table> <thead> <tr> <th>Isolation level</th> <th>Dirty read</th> <th>Non-repeatable</th> <th>Lost update</th> <th>Phantom</th> <th>Write skew</th> </tr> </thead> <tbody> <tr> <td>Read Uncommitted</td> <td>possible</td> <td>possible</td> <td>possible</td> <td>possible</td> <td>possible</td> </tr> <tr> <td>Read Committed</td> <td>–</td> <td>possible</td> <td>possible</td> <td>possible</td> <td>possible</td> </tr> <tr> <td>Repeatable Read (ANSI, lock-based)</td> <td>–</td> <td>–</td> <td>–</td> <td>possible</td> <td>possible</td> </tr> <tr> <td><strong>Snapshot Isolation</strong> (PostgreSQL's "Repeatable Read", Oracle's "Serializable")</td> <td>–</td> <td>–</td> <td>– (first-committer-wins)</td> <td>– (for snapshot reads)</td> <td><strong>possible</strong></td> </tr> <tr> <td><strong>Serializable</strong></td> <td>–</td> <td>–</td> <td>–</td> <td>–</td> <td>–</td> </tr> </tbody> </table></div>

<p>Two traps worth memorizing: <strong>snapshot isolation is not serializable</strong> (write skew survives it, see <a href="/cookbook/p/multi-version-concurrency-control">L20</a>), and the same <em>name</em> means different things in different systems. PostgreSQL's <code>REPEATABLE READ</code> is snapshot isolation; its <code>SERIALIZABLE</code> is SSI (serializable snapshot isolation, Cahill et al. 2008); Oracle's <code>SERIALIZABLE</code> is snapshot isolation. Kyle Kingsbury's <a href="https://jepsen.io/consistency" target="_blank" rel="noreferrer">Jepsen</a> and Martin Kleppmann's <a href="https://github.com/ept/hermitage" target="_blank" rel="noreferrer">Hermitage</a> test what each product really provides.</p>

<aside data-call="production"><b>What systems actually offer</b><ul> <li><strong>PostgreSQL</strong>: read committed (default), repeatable read (= SI), serializable (SSI with predicate locks).</li> <li><strong>MySQL/InnoDB</strong>: repeatable read (default, with next-key/gap locks, so it prevents most phantoms), serializable (turns plain reads into shared locks).</li> <li><strong>SQL Server</strong>: read committed (locking by default, or snapshot-based with RCSI), snapshot, serializable.</li> <li><strong>Oracle</strong>: read committed (default), "serializable" (= SI), read-only.</li> <li><strong>CockroachDB, Spanner, FoundationDB</strong>: serializable by default; <strong>TiDB</strong>: SI by default. The trend the lecture mentions: away from weak and eventual consistency, because developers cannot reason about the anomalies.</li> </ul></aside>
