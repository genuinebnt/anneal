heading = "Does it work? Verification"
body = """
<aside data-call="testing"><b>How the implementation was checked</b><ul> <li><strong>Unit scenarios</strong>: watermark pinned and released by readers; delta contains only changed columns; three updates by one transaction yield exactly one log; five old snapshots each see their own version; delete visible to older snapshots; write-write conflicts against uncommitted <em>and</em> newly committed writers; abort restores the exact chain; duplicate keys; PK change; GC with and without a long reader.</li> <li><strong>Reference model (the most valuable test)</strong>: random operations from 4 interleaved transactions on 6 keys (read, update, insert, delete, commit, abort, GC), compared at every step with a trivial model: a per-key list of <code>(commit_ts, row)</code> plus per-transaction write buffers. Every read, every conflict decision and every full scan must agree. 30 seeds × 600 steps pass.</li> <li><strong>Invariant workloads</strong>: bank totals with concurrent snapshot audits; "doctors on call" pairs for write skew.</li> <li><strong>Hang detection</strong>: the first concurrent run <em>hung</em> instead of failing: <code>rollback</code> held the transaction's log latch while taking tuple latches, while a reader held a tuple latch and wanted that same log latch (<code>slot → logs</code> vs <code>logs → slot</code>). Fix: one global <strong>lock order</strong> (<code>slot → txn.logs</code>) written in a comment next to every acquisition, and copying <code>write_set</code> before touching slots. Run concurrent tests under a watchdog (<code>perl -e 'alarm 60; exec &#64;ARGV'</code>, or <code>cargo nextest</code> timeouts) so a deadlock becomes a failure.</li> </ul></aside>

```text title="invariants under concurrency (4 writers, 20 000 transactions each; Snapshot vs Serializable)"
bank: 20422 transfers committed while 3000 snapshot audits all saw 16000; undo logs retained after final GC: 0
Snapshot: transactions that observed a pair with nobody on call: 1331
Serializable: transactions that observed a pair with nobody on call: 0
30 seeds × 600 random steps (4 interleaved transactions, GC, aborts) agree with the model
```

```text title="leaderboard-style workload: 4 threads, 32 000 transfers over 1 000 rows"
isolation      GC            txn/s    peak undo logs held
Snapshot       every 2ms     763813                     36
Snapshot       never        796023                  62932
Serializable   every 2ms     178762                     22
```

<p>Reading the numbers (the real leaderboard ranks <strong>throughput and space</strong>):</p>

<ul> <li><strong>GC is nearly free in time and decisive in space</strong>: peak retained undo logs fall from <strong>62 932 to 36</strong> with a background stop-the-world pass every 2 ms, at ~4% throughput cost. A stop-the-world collector scales badly with data size; production systems collect incrementally (per-transaction lists, vacuum by page).</li> <li><strong>Serializable costs 4.3×</strong> here: every commit takes the single validator slot and replays other transactions' images against predicates. Cheaper validation = fewer predicates (index point reads record one equality predicate), batching validators, or SSI-style tracking of only rw-antidependencies (<a href="/cookbook/p/multi-version-concurrency-control">L20</a>).</li> <li>Readers: 3 000 snapshot audits over 16 hot rows never aborted and always saw the exact total.</li> </ul>

<aside data-call="warning"><b>P4 pitfalls</b><ul> <li><strong>Reading the base tuple without the slot latch</strong> gives a torn tuple/chain pair. Copy both under one latch.</li> <li><strong>Forgetting the own-write case</strong> in <code>collect_undo_logs</code>: a transaction must see its own uncommitted writes (base timestamp equals its temporary timestamp) with no logs applied.</li> <li><strong>Creating a second undo log for the same transaction/tuple</strong>: the chain then has two logs with the same timestamp and any code that assumes one per transaction breaks.</li> <li><strong>Committing before stamping everything</strong>: set <code>last_commit</code> only after every write-set tuple carries the new timestamp.</li> <li><strong>GC deleting what validation needs</strong>: a committed transaction must stay while a running serializable transaction began before it committed. Keeping <em>every</em> committed transaction above the watermark, though, fails BusTub's <code>GarbageCollection</code> test.</li> <li><strong>Returning a deleted marker as a row</strong>: scans and index lookups must treat <code>is_deleted</code> as absent after reconstruction, not just on the base tuple.</li> <li><strong>Tainted transactions</strong>: don't let them continue silently; make every operation return an error until the caller aborts. <code>Commit</code> of a tainted transaction returns false and leaves it tainted; <code>Abort</code> accepts it.</li> <li><strong>Validating a read-only transaction</strong>: BusTub's <code>SerializableTest</code> commits a read-only serializable transaction after conflicting writers; only transactions with a write set are validated.</li> <li><strong>Key-changing updates done row by row</strong>: <code>UPDATE t SET k = k + 1</code> collides with itself; delete every target first, then insert.</li> </ul></aside>
"""

