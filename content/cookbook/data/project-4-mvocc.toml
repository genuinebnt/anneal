[[sections]]
heading = "Overview"
body = """
<p>Project 4 turns the table heap into an <strong>optimistic multi-version</strong> store. Everything in <a href="/cookbook/p/timestamp-ordering-and-occ">L19</a> and <a href="/cookbook/p/multi-version-concurrency-control">L20</a> shows up: temporary timestamps, <strong>delta storage</strong> with N2O undo chains, watermark GC, first-writer-wins, and OCC backward validation for SERIALIZABLE. The code you write sits in the transaction manager, the scan/insert/update/delete executors and the index path.</p>

### Key ideas

<ul> <li><strong>Two timestamps per transaction</strong>: <code>read_ts</code> = last committed timestamp when it began; <code>commit_ts</code> = next monotonic value, assigned at commit under a single commit latch. <strong>Transaction ids ≠ timestamps</strong>.</li> <li><strong>Temporary timestamps</strong>: an uncommitted write stamps the tuple with <code>TXN_START + txn_id</code> (<code>1 &lt;&lt; 62</code> sets the second-highest bit), so "committed" = below <code>TXN_START</code>, "mine" = equals my temporary timestamp, "someone else's uncommitted write" = at or above <code>TXN_START</code> and not mine.</li> <li><strong>Heap holds the newest version; undo logs hold deltas.</strong> <code>UndoLog = {is_deleted, modified_fields, partial tuple, ts, prev_version}</code>; <code>ts</code> is the commit timestamp <strong>of the version the log restores</strong>. The chain is singly linked and N2O. Each transaction owns its undo logs; a link is <code>(txn_id, index)</code>.</li> <li><strong>Watermark</strong> = lowest <code>read_ts</code> of any transaction still running (or the last commit when none run). Keep read timestamps in a <code>BTreeMap&lt;ts, count&gt;</code> for O(log n) add/remove/min.</li> <li><strong>Reconstruct = apply logs backward, no timestamp checks</strong>; <strong>collect = decide which logs</strong>: ① base committed at or before <code>read_ts</code> → none; ② base is newer or another transaction's uncommitted write → follow the chain collecting logs until one has <code>ts ≤ read_ts</code> (chain ends first ⇒ the tuple didn't exist); ③ base is my own write → none.</li> <li><strong>Writes</strong>: abort (<strong>taint</strong> the transaction) if the head is another transaction's temporary timestamp or a commit timestamp after my <code>read_ts</code>; first modification creates an undo log; later modifications <strong>consolidate into the same log</strong>; inserts create no log; deletes store the whole tuple.</li> <li><strong>Abort</strong> puts back the pre-transaction version (from the log) or turns a fresh insert into an old deletion marker (<code>ts = 0</code>); <strong>commit</strong> stamps the write set with the commit timestamp under the latch.</li> <li><strong>GC (stop the world)</strong>: free finished transactions whose undo logs are <strong>below the watermark</strong>; leave dangling links, since no snapshot can reach them.</li> <li><strong>Primary-key index</strong>: entries are <em>never removed</em>; a key keeps its RID forever, so <em>insert after delete reuses the slot</em>, turning the deletion marker back into a tuple. A key change is delete + insert. Unique-key races are decided at the index.</li> <li><strong>SERIALIZABLE</strong> = remember every scan <strong>predicate</strong>; at commit (single validator at a time) look at all transactions committed after <code>read_ts</code>, rebuild each modified tuple's <strong>before and after images</strong>, and abort if any image satisfies a predicate. Insert-then-delete by the other transaction is a no-op and doesn't conflict.</li> </ul>
"""

[[sections]]
heading = "Layout"
body = """
```text
table heap slot (one latch)                undo logs, owned by the writing transaction
┌──────────────────────────────┐
│ ts = T3 (commit) or TXN_START+id         txn 7: [ log0 ]   log0 = {ts: T2, modified: [0,1,0], tuple: [10], prev: (txn 4, 0)}
│ deleted?, tuple (newest)     │           txn 4: [ log0 ]   log0 = {ts: T1, …,                      prev: none}
│ undo link → (txn 7, 0) ──────┼──────────────────▲
└──────────────────────────────┘
read at snapshot R:  base.ts ≤ R ? base : apply log0 if log0.ts ≤ R else continue to prev …
```

<p>Rust note: the tuple, its timestamp and the chain head live in <strong>one <code>Mutex&lt;Slot&gt;</code></strong>. BusTub needs special <code>UpdateTupleAndUndoLink</code> helpers with check callbacks, because the tuple (in a page) and the link (in a side table) are separate objects; holding one latch around both makes "check, then update tuple and link atomically" the obvious thing to write. The price is that readers also take the slot latch for the few nanoseconds needed to copy the tuple and walk its chain.</p>
"""

[[sections]]
heading = "Task 1: timestamps and watermark"
body = """
<p><code>begin</code> registers <code>read_ts</code> in the watermark map under the same latch that reads <code>last_commit</code>, so GC can't compute a watermark newer than a transaction that is starting. <code>commit</code> and <code>abort</code> deregister. The only subtle rule: use <code>last_commit + 1</code> for the commit timestamp, then <code>store</code> it <em>after</em> stamping the write set; nobody can start with a read timestamp that sees a half-stamped commit.</p>
"""

[[sections]]
heading = "Task 2: undo logs, reconstruction, sequential scan"
body = """
:::deeper Reference: generating logs, applying them, collecting the logs a snapshot needs
```rust title="src/concurrency/mvocc.rs (excerpt)"
fn make_log(before: Option<&Row>, after: Option<&Row>, ts: u64, prev: Option<UndoLink>) -> UndoLog {
    match (before, after) {
        (None, _) => UndoLog { is_deleted: true, modified: vec![], tuple: vec![], ts, prev },
        (Some(b), None) => UndoLog { is_deleted: false, modified: vec![true; b.len()], tuple: b.clone(), ts, prev },
        (Some(b), Some(a)) => {
            let modified: Vec<bool> = b.iter().zip(a).map(|(x, y)| x != y).collect();
            let tuple = b.iter().zip(&modified).filter(|(_, m)| **m).map(|(x, _)| *x).collect();
            UndoLog { is_deleted: false, modified, tuple, ts, prev }
        }
    }
}

fn apply_logs(mut cur: Option<Row>, arity: usize, logs: &[UndoLog]) -> Option<Row> {
    for l in logs {
        if l.is_deleted { cur = None; continue; }
        let r = cur.get_or_insert_with(|| vec![0; arity]);       // a deletion's log carries the whole tuple
        let mut k = 0;
        for i in 0..arity { if l.modified[i] { r[i] = l.tuple[k]; k += 1; } }
    }
    cur
}

    fn collect_undo_logs(&self, s: &Slot, ts: u64, me: Option<&Txn>) -> Option<Vec<UndoLog>> {
        if me.is_some_and(|m| s.ts == m.temp_ts()) { return Some(vec![]); }        // our own write
        if s.ts < TXN_START && s.ts <= ts { return Some(vec![]); }                  // base is old enough
        let (mut out, mut link) = (vec![], s.undo.clone());
        while let Some(l) = link {
            let log = self.get_log(&l)?;                  // dangling ⇒ below the watermark ⇒ never reached
            let done = log.ts <= ts;
            link = log.prev.clone();
            out.push(log);
            if done { return Some(out); }
        }
        None
    }

    fn view(&self, s: &Slot, ts: u64, me: Option<&Txn>) -> Option<Row> {
        let logs = self.collect_undo_logs(s, ts, me)?;
        apply_logs(if s.deleted { None } else { Some(s.row.clone()) }, self.arity, &logs)
    }
```
:::

<p>Things that bite:</p>

<ul> <li>A <strong>delete</strong> log must carry the <em>whole</em> tuple (all <code>modified = true</code>), otherwise a snapshot before the delete has nothing to rebuild from; <code>apply_logs</code> starts from a zeroed row when the current version is a deletion marker.</li> <li>A log whose <em>previous</em> version was a deletion marker has <code>is_deleted = true</code> and no columns. That happens when an insert reuses a deleted slot.</li> <li>Keep the <strong>scan order and the log order identical</strong>: logs are collected newest first and applied in that order.</li> <li>If the chain runs out before any <code>ts ≤ read_ts</code>, the tuple <strong>did not exist</strong> for this snapshot: skip it. This is the case for rows inserted after the snapshot.</li> </ul>
"""

[[sections]]
heading = "Task 3: executors, commit, abort, GC"
body = """
:::deeper Reference: write path (conflict check and modify), commit, abort, stop-the-world GC
```rust title="src/concurrency/mvocc.rs (excerpt)"
    fn check_write(&self, s: &Slot, t: &Txn) -> Result<(), Error> {
        let conflict = s.ts != t.temp_ts() && (s.ts >= TXN_START || s.ts > t.read_ts);
        if conflict { t.set(State::Tainted); Err(Error::WriteConflict) } else { Ok(()) }
    }

    fn modify(&self, t: &Txn, rid: Rid, s: &mut Slot, target: Option<Row>) {
        let mut lg = t.logs.lock().unwrap();
        let mine = s.ts == t.temp_ts();
        if mine {
            // regenerate our one log from the pre-transaction image, so repeated writes consolidate
            if let Some(&i) = lg.by_rid.get(&rid) {
                let old = lg.logs[i].clone();
                let pre = apply_logs(if s.deleted { None } else { Some(s.row.clone()) }, self.arity, std::slice::from_ref(&old));
                lg.logs[i] = make_log(pre.as_ref(), target.as_ref(), old.ts, old.prev);
            }                                             // else: we inserted it ourselves, no previous version exists
        } else {
            let pre = if s.deleted { None } else { Some(s.row.clone()) };
            let log = make_log(pre.as_ref(), target.as_ref(), s.ts, s.undo.take());
            lg.logs.push(log);
            let idx = lg.logs.len() - 1;
            lg.by_rid.insert(rid, idx);
            s.undo = Some(UndoLink { txn: t.id, idx });
        }
        s.ts = t.temp_ts();
        match target { Some(r) => { s.row = r; s.deleted = false; } None => s.deleted = true }
        t.write_set.lock().unwrap().insert(rid);
    }

    pub fn commit(&self, t: &Txn) -> Result<(), Error> {
        let _w = self.world.read().unwrap();
        if t.state() != State::Running { return Err(Error::Tainted); }
        let _c = self.commit_latch.lock().unwrap();       // one committer at a time
        if t.iso == Isolation::Serializable && !self.validate(t) {
            self.rollback(t);
            return Err(Error::Validation);
        }
        let ts = self.last_commit.load(Acquire) + 1;      // load + 1, not fetch_add: nobody sees ts until it's published
        let rids: Vec<Rid> = t.write_set.lock().unwrap().iter().copied().collect();
        for rid in rids { self.slot(rid).lock().unwrap().ts = ts; }
        t.commit_ts.store(ts, Release);
        t.set(State::Committed);
        self.last_commit.store(ts, Release);
        self.end(t);
        Ok(())
    }

    fn rollback(&self, t: &Txn) {
        let rids: Vec<Rid> = t.write_set.lock().unwrap().iter().copied().collect();
        for rid in rids {
            let slot = self.slot(rid);
            let mut s = slot.lock().unwrap();                 // lock order everywhere: slot → txn.logs
            let lg = t.logs.lock().unwrap();
            match lg.by_rid.get(&rid) {
                Some(&i) => {
                    let log = &lg.logs[i];
                    let pre = apply_logs(if s.deleted { None } else { Some(s.row.clone()) }, self.arity, std::slice::from_ref(log));
                    s.ts = log.ts;
                    s.undo = log.prev.clone();
                    match pre { Some(r) => { s.row = r; s.deleted = false; } None => s.deleted = true }
                }
                None => { s.deleted = true; s.ts = 0; s.undo = None; }   // a fresh insert becomes an old deletion marker
            }
        }
        t.set(State::Aborted);
        self.end(t);
    }

    pub fn gc(&self) -> usize {
        let _w = self.world.write().unwrap();
        let wm = self.watermark();
        let mut needed: HashSet<(u64, usize)> = HashSet::new();
        for slot in self.table.read().unwrap().iter() {
            let s = slot.lock().unwrap();
            if s.ts < TXN_START && s.ts <= wm { continue; }                 // everyone sees the base tuple
            let mut link = s.undo.clone();
            while let Some(l) = link {
                needed.insert((l.txn, l.idx));
                let Some(log) = self.get_log(&l) else { break };
                if log.ts <= wm { break; }                                  // first version visible at the watermark
                link = log.prev;
            }
        }
        let mut txns = self.txns.write().unwrap();
        let before = txns.len();
        txns.retain(|id, c| match c.state() {
            State::Running | State::Tainted => true,
            State::Committed => c.commit_ts() > wm || needed.iter().any(|(t, _)| t == id),
            State::Aborted => needed.iter().any(|(t, _)| t == id),
        });
        before - txns.len()
    }
```
:::

<p>The <strong>consolidation trick</strong>: when a transaction touches a tuple it already modified, don't patch the existing log; recompute the <strong>pre-transaction image</strong> (<code>base</code> with that one log applied) and regenerate the log as <code>make_log(pre, target)</code>. One code path serves update after update, delete after update, and re-insert after delete. A column changed and changed back simply drops out of <code>modified</code>.</p>

<p>Other decisions:</p>

<ul> <li><strong>Update is a pipeline breaker</strong> in BusTub: buffer the child's rows, then modify. Otherwise the scan can see its own writes (the Halloween problem from <a href="/cookbook/p/table-heap">the table heap</a>).</li> <li><strong>Conflicts taint</strong> the transaction (<code>State::Tainted</code>) and return an error; every later call fails fast with <code>Tainted</code>, and the caller aborts. Aborting from deep inside an executor is hard to unwind; flagging is easy.</li> <li><strong>Abort needs no global lock</strong>: each tuple is restored under its own slot latch, so aborts run in parallel.</li> <li><strong>GC rule</strong>: for each tuple, walk the chain from the head until the first log with <code>ts ≤ watermark</code>; that log (and everything newer) is <em>needed</em>. A finished transaction is freed when it owns no needed log. A committed one must also stay while a running SERIALIZABLE transaction that began before its commit could still validate against it. (An earlier version of this guide said "and <code>commit_ts ≤ watermark</code>"; BusTub's <code>GarbageCollection</code> test fails that rule: see "Garbage collection, as the tests define it" below.)</li> </ul>
"""

[[sections]]
heading = "Task 4: primary-key index and serializable verification"
body = """
:::deeper Reference: insert (index decides uniqueness, deleted slots are reused), update/delete by key, commit-time validation
```rust title="src/concurrency/mvocc.rs (excerpt)"
    pub fn insert(&self, t: &Txn, row: Row) -> Result<(), Error> {
        let _w = self.world.read().unwrap();
        self.live(t)?;
        assert_eq!(row.len(), self.arity);
        let key = row[0];
        let mut idx = self.index.write().unwrap();       // serializes concurrent inserts of the same key
        match idx.get(&key).copied() {
            None => {
                let mut tab = self.table.write().unwrap();
                tab.push(Arc::new(Mutex::new(Slot { ts: t.temp_ts(), deleted: false, row, undo: None })));
                let rid = tab.len() - 1;
                idx.insert(key, rid);
                t.write_set.lock().unwrap().insert(rid);
                Ok(())
            }
            Some(rid) => {
                drop(idx);
                let slot = self.slot(rid);
                let mut s = slot.lock().unwrap();
                self.check_write(&s, t)?;
                if !s.deleted { t.set(State::Tainted); return Err(Error::DuplicateKey); }
                self.modify(t, rid, &mut s, Some(row));   // reuse the RID: the index entry still points here
                Ok(())
            }
        }
    }

    fn write_existing(&self, t: &Txn, key: i64, target: Option<Row>) -> Result<bool, Error> {
        let _w = self.world.read().unwrap();
        self.live(t)?;
        if t.iso == Isolation::Serializable { t.preds.lock().unwrap().push(Arc::new(move |r: &Row| r[0] == key)); }
        let Some(rid) = self.index.read().unwrap().get(&key).copied() else { return Ok(false) };
        let slot = self.slot(rid);
        let mut s = slot.lock().unwrap();
        if self.view(&s, t.read_ts, Some(t)).is_none() { return Ok(false); }
        self.check_write(&s, t)?;
        self.modify(t, rid, &mut s, target);
        Ok(true)
    }

    fn validate(&self, t: &Txn) -> bool {
        let others: Vec<Arc<Txn>> = self.txns.read().unwrap().values()
            .filter(|c| c.state() == State::Committed && c.commit_ts() > t.read_ts).cloned().collect();
        let preds = t.preds.lock().unwrap().clone();
        for c in others {
            let rids: Vec<Rid> = c.write_set.lock().unwrap().iter().copied().collect();
            for rid in rids {
                let slot = self.slot(rid);
                let s = slot.lock().unwrap();
                let after = self.view(&s, c.commit_ts(), None);
                let clog = { let g = c.logs.lock().unwrap(); g.by_rid.get(&rid).map(|&i| g.logs[i].clone()) };
                let before = match clog {
                    Some(l) => apply_logs(after.clone(), self.arity, &[l]),
                    None => None,                         // C inserted it
                };
                if preds.iter().any(|p| after.as_ref().is_some_and(|r| p(r)) || before.as_ref().is_some_and(|r| p(r))) {
                    return false;
                }
            }
        }
        true
    }
```
:::

<ul> <li><strong>Insert</strong> holds the index write latch while it either finds the key or allocates the slot and publishes the index entry, so two concurrent inserts of one key can't both succeed. If the key exists, it's a duplicate unless the slot is a deletion marker and the write-write check passes.</li> <li><strong>Index entries are never deleted.</strong> An index scan returns the RID; the visibility check on the slot decides whether the row exists at your snapshot. That's the <em>duplicate-key problem</em> of <a href="/cookbook/p/multi-version-concurrency-control">L20</a> solved by keeping one entry per key for life.</li> <li><strong>Validation images</strong>: after-image = the tuple as of the other transaction's commit timestamp (collect logs with that timestamp as the "read time"); before-image = after-image with that transaction's own log applied. An insert has no log, so before = nothing; a delete has after = nothing.</li> <li><strong>Failing validation</strong> is a normal abort (<code>State::Aborted</code>), not a taint: the transaction is already in its commit phase.</li> <li>Validation cost is proportional to the number of transactions committed since your snapshot, so GC matters for SERIALIZABLE too (see the numbers below).</li> </ul>
"""

