origin = "Database systems guide"

[[sections]]
heading = "Overview"
body = """
### Key ideas

<p><em>(I have not watched these talks and no notes exist for them. The table entries describe each system from its public documentation and papers and from the title of its talk; check the talk before relying on a detail.)</em></p>

<ul> <li><strong>A tech talk is a design review you can watch for free.</strong> The speaker is usually the engineer who made the trade-offs, and the questions at the end are from people who study databases for a living. The useful part is rarely the benchmark slide; it is the sentence that begins "we tried X and it did not work because…".</li> <li><strong>Read a system by its signature.</strong> Four questions place any database: <em>what is the unit of storage</em> (page, log segment, immutable file, array tile), <em>how does an update become durable</em> (log, copy-on-write, replicate to a quorum), <em>where does coordination happen</em> (one writer, one thread per partition, consensus, none), and <em>what is the execution model</em> (iterator, vectorized, compiled, dataflow). The map below gives each system one line; the full answers are in Parts I to IV.</li> <li><strong>Systems repeat ideas.</strong> DuckDB and SQLite use the library model; ClickHouse, Druid and Pinot differ mainly in how they organize immutable parts and pre-aggregates; CockroachDB, Orca and SQL Server share the Cascades search; Materialize, Noria and RisingWave maintain results incrementally. Once you know the idea, a new system is a list of departures from it.</li> <li><strong>Beware survivorship.</strong> Talks are given by systems that shipped. The failures and the abandoned designs, which teach more, show up in the Q&amp;A, in postmortems and in papers like the "what goes around" series.</li> <li><strong>Product talks are marketing with engineering inside.</strong> Separate the claims you can check (a data structure, a protocol, a plan shape) from those you cannot (a benchmark on unknown hardware). When a claim matters to you, reproduce it at small scale; every lab in this guide is built that way.</li> </ul>
"""

[[sections]]
heading = "How to watch a talk"
body = """
<ol> <li>Write the four signature answers before you press play, from the system's documentation, and check them against the talk.</li> <li>Note one <em>decision</em> (a thing they chose not to do), one <em>number</em> (a latency, a size, a ratio) and one <em>failure</em> (a bug, an outage, a rewrite).</li> <li>After the talk, find where the idea lives in this guide and write down a test that would show whether the system really does it. That test is the exercise.</li> </ol>
"""

