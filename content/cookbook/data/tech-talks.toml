heading = "A watching order"
body = """
<ul> <li><strong>Start with three that cover the map</strong>: FoundationDB (how to build a database you can trust), CockroachDB's optimizer (how a cost-based planner is organized) and Materialize or DBSP (how a result stays correct as data changes).</li> <li><strong>For Cairn</strong>: Anna and Fauna (coordination-free versus deterministic distribution), TiDB (HTAP), Neon (separating storage), SQLancer and Elle (testing), SpiceDB (authorization as data).</li> <li><strong>For interviews and reading groups</strong>: pick the talk whose system you can already describe by signature and find the departures.</li> </ul>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Treating a talk as documentation.</strong> Versions move; the system today differs from the system in the talk. Check the release notes.</li> <li><strong>Believing a comparison you cannot reproduce.</strong> Benchmarks in talks are usually run by the system's authors on the workload that flatters it.</li> <li><strong>Collecting instead of building.</strong> Watching twelve talks on LSM trees teaches less than writing one compaction policy and measuring its write amplification (<a href="/cookbook/p/log-structured-storage">log-structured storage</a>).</li> </ul></aside>
"""
