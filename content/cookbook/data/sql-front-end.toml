<aside data-call="warning"><b>A derived table must not bypass security</b><p>If your engine has privileges or row-level security (see <a href="/cookbook/p/passwords-and-scram">Security</a>), <code>FROM (SELECT * FROM secret)</code> is a way to name <code>secret</code> without the checker seeing it unless the checker recurses into the subquery. <code>verify/src/security.rs</code> secures the inner <code>SELECT</code> as a statement of its own (privileges, policies, <code>current_user</code>), and refuses a join group on the <em>right</em> of a join because there is no obvious place for its policies. <code>tests/security.rs::derived_tables_do_not_bypass_privileges_or_policies</code> compares every derived-table form against the plain query for four roles; with the recursion removed it fails on the first role.</p></aside>

<h4><code>ORDER BY … NULLS FIRST | LAST</code>, and where NULL sorts</h4>

<p>SQL leaves the position of NULLs under <code>ORDER BY</code> to the implementation. Postgres treats NULL as the <em>greatest</em> value (last under <code>ASC</code>, first under <code>DESC</code>); SQLite, MySQL and <strong>BusTub</strong> treat it as the <em>smallest</em>. BusTub's <code>p3.16-sort-limit.slt</code> expects the second, and also uses explicit <code>NULLS FIRST</code> and <code>NULLS LAST</code>. The engine here keeps the Postgres default and has a catalog switch, <code>nulls_smallest</code>, for the other; an explicit clause overrides either.</p>

<p>The implementation needs no change to the sort, top-N or external-sort executors. <code>Value</code>'s total order already puts NULL last, so where the requested placement differs from where the plain sort would put NULLs, the binder adds a leading sort key <code>expr IS NULL</code> (ascending to push NULLs last, descending to push them first):</p>

```rust title="parser: ORDER BY with NULLS (excerpt)"
    /// `ORDER BY e [ASC|DESC] [NULLS FIRST|LAST], ...`
    fn select_order_list(&mut self) -> Result<(Vec<(Ast, bool)>, Vec<Option<bool>>)> {
        let (mut keys, mut nulls) = (vec![], vec![]);
        loop {
            let e = self.expr()?;
            let asc = if self.eat_kw("DESC") {
                false
            } else {
                self.eat_kw("ASC");
                true
            };
            let n = if self.eat_word("nulls") {
                if self.eat_word("first") {
                    Some(true)
                } else if self.eat_word("last") {
                    Some(false)
                } else {
                    return err("expected FIRST or LAST after NULLS".into());
                }
            } else {
                None
            };
            keys.push((e, asc));
            nulls.push(n);
            if !self.eat_sym(",") {
                break;
            }
        }
        Ok((keys, nulls))
    }
```

