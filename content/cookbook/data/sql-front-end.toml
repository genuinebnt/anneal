<h4>Subqueries in expressions</h4>

<p><code>(SELECT …)</code> as a value, <code>EXISTS (SELECT …)</code> and <code>x IN (SELECT …)</code> are what the SQLite corpus asked for most: 2,923 of its 2,978 failures were <code>unexpected SELECT in expression</code> before this existed (<a href="/cookbook/p/testing-a-database">Outside suites</a>). With them, <code>select1.test</code>, <code>select2.test</code> and <code>select3.test</code> (5,413 records, many of them compared by MD5) pass in full.</p>

<p><strong>Design: parameters, not outer-row access.</strong> A correlated subquery needs the enclosing row. The obvious design, giving the inner plan a pointer to the outer row, ties the inner plan to the outer one's column numbering, so the optimizer cannot move or renumber the outer expression (predicate pushdown does exactly that) without rewriting plans inside expressions. Instead the binder turns every reference from inside a subquery to an enclosing column into <code>Param(i)</code> and records, next to the subquery, the expression over the <em>enclosing</em> row that supplies it. At run time the parameter values are pushed on a stack, the plan is run, the stack is popped. The inner plan is closed; only the list of parameter expressions refers to the outer query, and that list is an ordinary expression to the optimizer (<code>cols()</code> reports its columns, <code>map_cols</code> renumbers it). A column of the <em>grandparent</em> is threaded down: the middle query receives it as its own parameter and passes it on.</p>

```rust title="binder: resolving a name from an enclosing query (src/planner/plan.rs, excerpt)"
    /// A name that is not in the subquery's own schema: look for it in the enclosing queries. Returns an expression valid
    /// inside the subquery's plan (`Param(i)`), after recording in the frame what supplies it. A name found two levels up
    /// is first made a parameter of the middle query, then passed down from there.
    fn resolve_outer(&self, depth: usize, q: Option<&str>, n: &str) -> Option<Expr> {
        let mut frames = self.frames.borrow_mut();
        // climb to the nearest enclosing query that has the column
        let mut at = depth;
        let (mut expr, found_at) = loop {
            match frames[at].enclosing.resolve(q, n) {
                Ok(i) => break (Expr::Col(i), at),
                Err(_) if at == 0 => return None,
                Err(_) => at -= 1,
            }
        };
        // then thread it back down: every frame between passes it on as a parameter of its own
        for f in found_at..=depth {
            let params = &mut frames[f].params;
            let idx = params.iter().position(|p| *p == expr).unwrap_or_else(|| {
                params.push(expr.clone());
                params.len() - 1
            });
            expr = Expr::Param(idx);
        }
        Some(expr)
    }

    /// Bind a subquery: a fresh frame whose enclosing schema is the row the expression will be evaluated against.
    fn bind_subquery(&self, sel: &Select, enclosing: &Schema, columns: Option<usize>) -> Result<super::subq::SubqRef> {
        self.frames.borrow_mut().push(Frame { enclosing: enclosing.clone(), params: vec![] });
        let plan = self.plan_select(sel);
        let frame = self.frames.borrow_mut().pop().unwrap();
        let plan = plan?;
        if let Some(n) = columns {
            if plan.schema().len() != n {
                return err(format!("subquery must return {n} column{}, not {}", if n == 1 { "" } else { "s" }, plan.schema().len()));
            }
        }
        Ok(super::subq::SubqRef::new(plan, frame.params))
    }
```

<p><strong>Strategy: nested loops, cached when uncorrelated.</strong> A correlated subquery runs once per outer row; one with no parameters runs once per statement and its rows are cached. Turning correlated subqueries into joins (decorrelation) is the optimization this does not do, and it is the standard next step: the corpus does not need it for correctness, only for speed.</p>

```rust title="running a subquery, and IN with NULLs (src/execution/subquery.rs, excerpt)"
impl SubqRef {
    pub fn new(plan: Plan, params: Vec<Expr>) -> Self {
        SubqRef { plan: Arc::new(plan), params, cache: Arc::new(Cache { optimized: OnceLock::new(), rows: OnceLock::new() }) }
    }

    /// The subquery's rows for the enclosing row `row`.
    pub fn run(&self, row: &[Value]) -> Result<Vec<Row>> {
        if self.params.is_empty() {
            if let Some(r) = self.cache.rows.get() {
                return Ok(r.clone());
            }
        }
        let vals = self.params.iter().map(|p| p.eval(row)).collect::<Result<Vec<_>>>()?;
        let ptr = CATALOG.with(|c| c.get());
        if ptr.is_null() {
            return err("a subquery needs a statement context to run in".into());
        }
        // SAFETY: the pointer was set by `with_catalog` from a live `&Catalog` further up this same thread's stack, and is
        // restored before that frame returns; we are executing inside it.
        let cat: &Catalog = unsafe { &*(ptr as *const Catalog) };
        let plan = self.cache.optimized.get_or_init(|| optimizer::optimize((*self.plan).clone(), cat));
        struct Pop;
        impl Drop for Pop {
            fn drop(&mut self) {
                PARAMS.with(|p| {
                    p.borrow_mut().pop();
                });
            }
        }
        PARAMS.with(|p| p.borrow_mut().push(vals));
        let _pop = Pop;
        let rows = exec::run(plan, cat)?;
        if self.params.is_empty() {
            let _ = self.cache.rows.set(rows.clone());
        }
        Ok(rows)
    }

/// `lhs IN (rows of one column)` with SQL's three-valued logic: true if any equals; else NULL if `lhs` is NULL or any
/// element is NULL (and the set is non-empty); else false. An empty set is false whatever `lhs` is.
pub fn in_rows(lhs: &Value, rows: &[Row]) -> Value {
    if rows.is_empty() {
        return Value::Bool(false);
    }
    if lhs.is_null() {
        return Value::Null;
    }
    let mut saw_null = false;
    for r in rows {
        match lhs.sql_cmp(&r[0]) {
            Some(std::cmp::Ordering::Equal) => return Value::Bool(true),
            None => saw_null = true,
            _ => {}
        }
    }
    if saw_null { Value::Null } else { Value::Bool(false) }
}
```

<p>Semantics the tests pin down:</p>

<ul> <li><strong>Scalar</strong>: zero rows is NULL; more than one row is an error (SQLite returns the first; the standard and Postgres raise), and more than one column is a bind-time error.</li> <li><strong><code>IN</code> is three-valued.</strong> True if any element equals; otherwise NULL if the left side is NULL or any element is NULL; otherwise false. An empty set is false for every left side, NULL included, and <code>NOT IN</code> an empty set is true. Hence <code>x NOT IN (SELECT …)</code> over a set containing a NULL keeps <em>no</em> row that is absent from it: the classic surprise, written down in <code>in_follows_three_valued_logic</code>.</li> <li><strong>A parameter is not a constant.</strong> Constant folding evaluates column-free subtrees at plan time; <code>Param(0)</code> mentions no column, so it must be excluded explicitly, or the planner evaluates it with no parameter stack and fails (or, worse, caches a value).</li> <li><strong>The catalog reaches an expression through a thread-local pointer</strong> set by <code>exec::run</code> for the duration of the call. That is the one <code>unsafe</code> in the feature (a lifetime erased and restored within one stack frame) and the price of keeping <code>Expr::eval(&amp;self, row)</code> free of an execution context.</li> <li><strong>Nesting is bounded</strong> like derived tables: a hundred thousand nested <code>(SELECT …)</code> is an error at parse time.</li> <li><strong>A new arm in a recursive function costs every level of the recursion.</strong> The first version of this feature put the <code>CASE</code> and subquery arms straight into <code>primary</code>, <code>bind</code> and <code>eval</code>. A function's stack frame is sized for its largest arm, so each level of a nested expression got bigger, and the depth limit (1,000 levels, chosen when the frames were small) no longer fit in a 2 MiB test thread: <code>deep_expressions_are_errors_and_long_lists_are_fine</code> aborted with a stack overflow, found only by the full regression, not by the subquery tests. The rare arms now live in <code>#[inline(never)]</code> helpers (<code>case_expr</code>, <code>subquery_value</code>, <code>bind_rare</code>, <code>eval_rare</code>), which keeps the hot path's frame as it was.</li> </ul>

<aside data-call="warning"><b>A subquery is another way to name a table</b><p><code>WHERE x IN (SELECT secret FROM hidden)</code> reads <code>hidden</code> without the checker seeing a table in <code>FROM</code>. The security layer secures every subquery in an expression as a statement of its own: privileges on its tables, their row-level policies, and <code>current_user</code> inside it, in <code>SELECT</code> items, <code>WHERE</code>, <code>ON</code>, <code>GROUP BY</code>, <code>HAVING</code>, <code>ORDER BY</code>, <code>UPDATE … SET</code>/<code>WHERE</code>, <code>DELETE … WHERE</code> and <code>INSERT … VALUES</code>. A policy may not itself contain a subquery (it would run with the caller's rights and no check of its own). <code>tests/security.rs::subqueries_do_not_bypass_privileges_or_policies</code> fails with the securing step removed: a user then counts 70 documents instead of the 36 the policy lets them see.</p></aside>

<p>Verification: seven hand-written cases (NULL and empty-set semantics, two levels of correlation, subqueries in <code>ORDER BY</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>INSERT … VALUES</code>, the error cases) and a differential run: 40 random databases with NULLs, ten query shapes each (<code>IN</code>, <code>NOT IN</code>, <code>EXISTS</code>, <code>NOT EXISTS</code>, correlated scalars with aggregates, three levels, <code>CASE</code> over <code>IN</code>), results identical to SQLite's.</p>

