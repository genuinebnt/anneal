                let p = self.plan_select(select)?;
                match alias {
                    // The derived table's columns belong to the alias, not to the tables inside it.
                    Some(a) => {
                        let schema = p.schema().with_qualifier(a);
                        Plan::Projection {
                            exprs: (0..schema.len()).map(Expr::Col).collect(),
                            schema,
                            child: Box::new(p),
                        }
