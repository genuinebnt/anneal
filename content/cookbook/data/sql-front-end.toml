body = """
<p>The parser and planner above handle the core subset. BusTub's public <code>.slt</code> files (the P3 tests) go further, and a handful of features account for almost every remaining failure when you run them. Each is small. All the code below is excerpted from <code>verify/src/engine/</code> and is exercised by <code>tests/engine_dialect.rs</code>, <code>engine_like.rs</code>, <code>engine_vector.rs</code> and, for the security side, <code>tests/security.rs</code>.</p>

<h4>Derived tables and parenthesised join groups</h4>

<p><code>SELECT … FROM (SELECT …) [alias]</code> and <code>FROM (a JOIN b ON …) JOIN c ON …</code> both appear throughout the join and integration tests. The AST gets one new <code>FROM</code> variant (<code>From::Subquery { select, alias }</code>). A parenthesised join group needs no variant at all: parse the inner <code>FROM</code> expression recursively and return it.</p>

```rust title="parser: FROM items (src/sql/parser.rs, excerpt)"
    fn from_item(&mut self) -> Result<From> {
        if self.eat_sym("(") {
            // Each open parenthesis here is one more level of recursion in the parser, the planner and the executor.
            self.subs += 1;
            if self.subs > MAX_SUBQUERY_DEPTH {
                return err(format!("FROM clauses nested more than {MAX_SUBQUERY_DEPTH} levels deep"));
            }
            let f = if self.eat_kw("SELECT") {
                let select = Box::new(self.select_body()?);
                self.expect_sym(")")?;
                let alias = if self.eat_kw("AS") {
                    Some(self.ident()?)
                } else if let Tok::Ident(_) = self.peek() {
                    Some(self.ident()?)
                } else {
                    None
                };
                From::Subquery { select, alias }
            } else {
                let inner = self.from_expr()?; // a parenthesised join group
                self.expect_sym(")")?;
                inner
            };
            self.subs -= 1;
            return Ok(f);
        }
        let name = self.ident()?;
        let alias = if self.eat_kw("AS") {
            Some(self.ident()?)
        } else if let Tok::Ident(_) = self.peek() {
            Some(self.ident()?)
        } else {
            None
        };
        Ok(From::Table { name, alias })
    }
```

<p>Three rules that the tests depend on:</p>

<ol> <li><strong>Qualifiers.</strong> With an alias, every column of the derived table is qualified by the alias. <em>Without</em> one, BusTub's tests still write <code>result.dst</code> for a column that came out of <code>(SELECT * FROM result WHERE …)</code>, so a plain column keeps the qualifier of the column it reads (the projection copies <code>table</code> from its input column).</li> <li><strong><code>*</code> is positional.</strong> <code>SELECT * FROM (SELECT 1, 1)</code> has two columns with the same name, and <code>*</code> expanded into names would be ambiguous. Expand <code>*</code> into <code>Ast::Col(i)</code> (the i-th input column) instead of into identifiers.</li> <li><strong>Nesting is bounded.</strong> The planner and executor recurse once per level through large frames. A statement of 100,000 nested parentheses must be an error, not a stack overflow, so the parser counts open parenthesised <code>FROM</code> items (<code>MAX_SUBQUERY_DEPTH</code>, 64). <code>tests/engine_dialect.rs::nesting_is_bounded</code> found this: with only the expression-depth limit of 1,000, 999 nested join groups overflowed the stack.</li> </ol>

```rust title="planner: the derived-table arm of plan_from (src/planner/plan.rs, excerpt)"
