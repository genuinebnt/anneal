<h4><code>LIKE</code> and <code>ILIKE</code></h4>

<p>Not part of BusTub's curriculum (its string functions are only <code>lower</code> and <code>upper</code>), but it is the first thing anyone types, and it makes a good small exercise in matching. <code>%</code> matches any run of characters (including none), <code>_</code> exactly one character, <code>&#92;</code> escapes the next character. Postgres semantics: case-sensitive <code>LIKE</code>, case-insensitive <code>ILIKE</code>; any NULL operand gives NULL; non-text operands are an error. The parser adds <code>LIKE</code>/<code>ILIKE</code> next to <code>IN</code>/<code>BETWEEN</code> at comparison precedence, and <code>NOT LIKE</code> is <code>NOT (a LIKE b)</code>, so NULL stays NULL.</p>

<p>The matcher must not be a naive recursive one: <code>'aaaa…a' LIKE '%a%a%a%a%b'</code> is exponential if each <code>%</code> tries every split. The standard fix remembers only the <em>last</em> <code>%</code> and, on a mismatch, lets it swallow one more character. That is O(text × pattern) in the worst case, and no backtracking stack is needed:</p>

```rust title="expr: LIKE matching (src/execution/expr.rs, excerpt)"
/// SQL LIKE matching. Linear-time greedy matching with a single backtrack point (the last `%`), so a
/// pattern like `%a%a%a%b` cannot go exponential on a long run of `a`s.
pub fn like(text: &str, pattern: &str, ignore_case: bool) -> bool {
    let fold = |s: &str| -> Vec<char> {
        if ignore_case { s.chars().flat_map(|c| c.to_lowercase()).collect() } else { s.chars().collect() }
    };
    let (t, p) = (fold(text), fold(pattern));
    // Parse the pattern once into tokens so an escaped `\\%` is a literal and not a wildcard.
    #[derive(PartialEq, Clone, Copy)]
    enum Tk { Any, One, Lit(char) }
    let mut toks = Vec::with_capacity(p.len());
    let mut i = 0;
    while i < p.len() {
        match p[i] {
            '%' => toks.push(Tk::Any),
            '_' => toks.push(Tk::One),
            '\\\\' if i + 1 < p.len() => {
                i += 1;
                toks.push(Tk::Lit(p[i]));
            }
            c => toks.push(Tk::Lit(c)),
        }
        i += 1;
    }
    let (mut ti, mut pi) = (0usize, 0usize);
    let (mut star_p, mut star_t) = (usize::MAX, 0usize);
    while ti < t.len() {
        match toks.get(pi) {
            Some(Tk::Any) => {
                star_p = pi;
                star_t = ti;
                pi += 1;
            }
            Some(Tk::One) => {
                ti += 1;
                pi += 1;
            }
            Some(Tk::Lit(c)) if *c == t[ti] => {
                ti += 1;
                pi += 1;
            }
            _ if star_p != usize::MAX => {
                star_t += 1; // let the last % swallow one more character
                ti = star_t;
                pi = star_p + 1;
            }
            _ => return false,
        }
    }
    toks[pi..].iter().all(|k| *k == Tk::Any)
}
```

<p><code>tests/engine_like.rs</code> checks it three ways: hand-picked cases (escapes, multi-byte characters, the exponential pattern), three-valued logic through SQL, and a differential run against SQLite on 3,000 random text/pattern pairs for both <code>LIKE</code> and <code>ILIKE</code> (SQLite with <code>case_sensitive_like=ON</code> and <code>ESCAPE '&#92;'</code> means the same thing).</p>

<h4><code>VECTOR(n)</code></h4>

<p><code>vector.slt</code> creates a <code>VECTOR(3)</code> column and inserts <code>ARRAY [1.0, 1.0, 1.0]</code> literals. Supporting it end to end touches every layer that knows about types, which makes it a good checklist:</p>

<ul> <li><strong>Value</strong>: <code>Value::Vector(Arc&lt;[f64]&gt;)</code>, compared lexicographically; hashed and ordered with the same canonical-float rule as <code>Float</code>, so <code>DISTINCT</code>, <code>GROUP BY</code> and <code>ORDER BY</code> work.</li> <li><strong>Column type</strong>: <code>ColType::Vector(n)</code>; the dimension is part of the type, capped (<code>MAX_VECTOR_DIM</code> = 400 here so that a row fits a 4 KiB page). Stored in the tuple's variable region as <code>n</code> little-endian <code>f64</code>s, like a <code>VARCHAR</code>.</li> <li><strong>Parser</strong>: <code>VECTOR(n)</code> in <code>CREATE TABLE</code>; <code>ARRAY[e, …]</code> as an expression whose elements must be numeric constants (a leading <code>-</code> is fine), folded to a constant at bind time.</li> <li><strong>Coercion</strong>: storing a vector of the wrong dimension is an error (<code>expected 3 dimensions, not 2</code>), not a truncation.</li> <li><strong>Spill and wire formats</strong>: the external sort writes rows to buffer-pool pages with its own value encoding, and the wire/facade protocol has its own tags; both need a new case, or <code>ORDER BY</code> over a big vector table, or a client, hits an <code>unreachable</code>.</li> <li><strong>Functions</strong>: <code>l2_dist(a, b)</code>, <code>inner_product(a, b)</code>, <code>cosine_similarity(a, b)</code>, all returning a float; mismatched dimensions are an error, and the cosine of a zero vector is NULL.</li> </ul>

<p><code>SELECT id FROM pts ORDER BY l2_dist(v, ARRAY[7, 3]) LIMIT 1</code> is a complete exact nearest-neighbour search. An index for it is the subject of <a href="/cookbook/p/vector-databases">Vector search</a>.</p>
