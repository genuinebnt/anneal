//! Plan nodes and the binder/planner: AST -> bound logical plan.
use std::fmt::Write;
use crate::storage::table::tuple_codec::ColType;
use crate::types::value::Value;
use super::catalog::{Catalog, Column, Schema};
use super::expr::{BinOp, Expr, ScalarFn};
use super::sql::{scalar_fn, Ast, From, Item, JoinKind, Select};
use super::{err, Result};

#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum AggFn { CountStar, Count, Sum, Min, Max, Avg }

#[derive(Clone, Debug, PartialEq)]
pub struct Agg { pub f: AggFn, pub arg: Option<Expr>, pub distinct: bool }

#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum WinFn { RowNumber, Rank, DenseRank, Agg(AggFn) }

#[derive(Clone, Debug, PartialEq)]
pub struct WinCall { pub f: WinFn, pub arg: Option<Expr>, pub partition_by: Vec<Expr>, pub order_by: Vec<(Expr, bool)> }

#[derive(Clone, Debug, PartialEq)]
pub enum IndexLookup { Points(Vec<i64>), Ordered }

#[derive(Clone, Debug, PartialEq)]
pub enum Plan {
    Values { rows: Vec<Vec<Expr>>, schema: Schema },
    SeqScan { table: String, schema: Schema, filter: Option<Expr> },
    IndexScan { table: String, index: String, schema: Schema, lookup: IndexLookup, filter: Option<Expr> },
    Filter { pred: Expr, child: Box<Plan> },
    Projection { exprs: Vec<Expr>, schema: Schema, child: Box<Plan> },
    NestedLoopJoin { left: Box<Plan>, right: Box<Plan>, pred: Option<Expr>, kind: JoinKind },
    HashJoin { left: Box<Plan>, right: Box<Plan>, left_keys: Vec<Expr>, right_keys: Vec<Expr>, residual: Option<Expr>, kind: JoinKind },
    NestedIndexJoin { left: Box<Plan>, table: String, index: String, key: Expr, inner_schema: Schema, residual: Option<Expr>, kind: JoinKind },
    Aggregation { group_by: Vec<Expr>, aggs: Vec<Agg>, schema: Schema, child: Box<Plan> },
    Window { calls: Vec<WinCall>, schema: Schema, child: Box<Plan> },
    Sort { order_by: Vec<(Expr, bool)>, child: Box<Plan> },
    TopN { order_by: Vec<(Expr, bool)>, n: u64, child: Box<Plan> },
    Limit { limit: Option<u64>, offset: u64, child: Box<Plan> },
    Insert { table: String, child: Box<Plan> },
    Update { table: String, sets: Vec<(usize, Expr)>, child: Box<Plan> },
    Delete { table: String, child: Box<Plan> },
}

impl Plan {
    pub fn schema(&self) -> Schema {
        match self {
            Plan::Values { schema, .. } | Plan::SeqScan { schema, .. } | Plan::IndexScan { schema, .. } | Plan::Projection { schema, .. }
            | Plan::Aggregation { schema, .. } | Plan::Window { schema, .. } => schema.clone(),
            Plan::Filter { child, .. } | Plan::Sort { child, .. } | Plan::TopN { child, .. } | Plan::Limit { child, .. } => child.schema(),
            Plan::NestedLoopJoin { left, right, .. } | Plan::HashJoin { left, right, .. } => left.schema().join(&right.schema()),
            Plan::NestedIndexJoin { left, inner_schema, .. } => left.schema().join(inner_schema),
            Plan::Insert { .. } | Plan::Update { .. } | Plan::Delete { .. } => Schema::new(vec![Column { name: "count".into(), ty: ColType::BigInt, table: None }]),
        }
    }

    pub fn explain(&self) -> String { let mut s = String::new(); self.fmt_into(&mut s, 0); s }
    fn fmt_into(&self, s: &mut String, d: usize) {
        let pad = "  ".repeat(d);
        let line = match self {
            Plan::Values { rows, .. } => format!("Values rows={}", rows.len()),
            Plan::SeqScan { table, filter, .. } => format!("SeqScan {table}{}", filter.as_ref().map(|f| format!(" filter={f:?}")).unwrap_or_default()),
            Plan::IndexScan { table, index, lookup, filter, .. } => format!("IndexScan {table} via {index} {lookup:?}{}", filter.as_ref().map(|f| format!(" filter={f:?}")).unwrap_or_default()),
            Plan::Filter { pred, .. } => format!("Filter {pred:?}"),
            Plan::Projection { exprs, .. } => format!("Projection {exprs:?}"),
            Plan::NestedLoopJoin { pred, kind, .. } => format!("NestedLoopJoin {kind:?} {pred:?}"),
            Plan::HashJoin { left_keys, right_keys, kind, residual, .. } => format!("HashJoin {kind:?} {left_keys:?} = {right_keys:?}{}", residual.as_ref().map(|r| format!(" residual={r:?}")).unwrap_or_default()),
            Plan::NestedIndexJoin { table, index, key, kind, .. } => format!("NestedIndexJoin {kind:?} {table} via {index} key={key:?}"),
            Plan::Aggregation { group_by, aggs, .. } => format!("Aggregation group_by={group_by:?} aggs={aggs:?}"),
            Plan::Window { calls, .. } => format!("Window {}", calls.len()),
            Plan::Sort { order_by, .. } => format!("Sort {order_by:?}"),
            Plan::TopN { order_by, n, .. } => format!("TopN n={n} {order_by:?}"),
            Plan::Limit { limit, offset, .. } => format!("Limit {limit:?} offset {offset}"),
            Plan::Insert { table, .. } => format!("Insert {table}"),
            Plan::Update { table, .. } => format!("Update {table}"),
            Plan::Delete { table, .. } => format!("Delete {table}"),
        };
        writeln!(s, "{pad}{line}").unwrap();
        for c in self.children() { c.fmt_into(s, d + 1); }
    }
    pub fn children(&self) -> Vec<&Plan> {
        match self {
            Plan::Values { .. } | Plan::SeqScan { .. } | Plan::IndexScan { .. } => vec![],
            Plan::NestedLoopJoin { left, right, .. } | Plan::HashJoin { left, right, .. } => vec![left, right],
            Plan::Filter { child, .. } | Plan::Projection { child, .. } | Plan::Aggregation { child, .. } | Plan::Window { child, .. }
            | Plan::Sort { child, .. } | Plan::TopN { child, .. } | Plan::Limit { child, .. } | Plan::Insert { child, .. }
            | Plan::Update { child, .. } | Plan::Delete { child, .. } | Plan::NestedIndexJoin { left: child, .. } => vec![child],
        }
    }
}

// ---------------- binder / planner -----------------------------------------------------------
pub struct Binder<'c, 'a> { pub cat: &'c Catalog<'a> }

fn types(s: &Schema) -> Vec<ColType> { s.cols.iter().map(|c| c.ty).collect() }
fn anon(name: &str, ty: ColType) -> Column { Column { name: name.to_string(), ty, table: None } }

impl<'c, 'a> Binder<'c, 'a> {
    /// Bind an expression with no aggregates or windows against `schema`.
    pub fn bind(&self, e: &Ast, schema: &Schema) -> Result<Expr> {
        Ok(match e {
            Ast::Ident(q, n) => Expr::Col(schema.resolve(q.as_deref(), n)?),
            Ast::Lit(v) => Expr::Lit(v.clone()),
            Ast::Bin(op, a, b) => Expr::Bin(*op, Box::new(self.bind(a, schema)?), Box::new(self.bind(b, schema)?)),
            Ast::Not(a) => Expr::Not(Box::new(self.bind(a, schema)?)),
            Ast::Neg(a) => match &**a { Ast::Lit(Value::Int(i)) => Expr::Lit(Value::Int(-i)), a => Expr::Neg(Box::new(self.bind(a, schema)?)) },
            Ast::IsNull(a, not) => Expr::IsNull(Box::new(self.bind(a, schema)?), *not),
            // Desugar: x BETWEEN a AND b  =>  x >= a AND x <= b ;  x IN (a, b)  =>  x = a OR x = b
            Ast::Between(x, lo, hi, not) => {
                let x = self.bind(x, schema)?;
                let e = Expr::Bin(BinOp::And, Box::new(Expr::Bin(BinOp::Ge, Box::new(x.clone()), Box::new(self.bind(lo, schema)?))),
                                  Box::new(Expr::Bin(BinOp::Le, Box::new(x), Box::new(self.bind(hi, schema)?))));
                if *not { Expr::Not(Box::new(e)) } else { e }
            }
            Ast::InList(x, list, not) => {
                let x = self.bind(x, schema)?;
                let alternatives = list.iter().map(|v| Ok(Expr::Bin(BinOp::Eq, Box::new(x.clone()), Box::new(self.bind(v, schema)?)))).collect::<Result<Vec<Expr>>>()?;
                let e = Expr::or_balanced(alternatives);       // a balanced tree: an IN list of 100 000 values must not be 100 000 levels deep
                if *not { Expr::Not(Box::new(e)) } else { e }
            }
            Ast::Call { name, args, over: None, .. } if scalar_fn(name).is_some() => {
                Expr::Func(scalar_fn(name).unwrap(), args.iter().map(|a| self.bind(a, schema)).collect::<Result<_>>()?)
            }
            Ast::Call { name, .. } => return err(format!("{name}() is not allowed here")),
        })
    }

    pub fn plan_select(&self, s: &Select) -> Result<Plan> {
        // FROM
        let mut plan = match &s.from {
            None => Plan::Values { rows: vec![vec![]], schema: Schema::default() },
            Some(f) => self.plan_from(f)?,
        };
        if let Some(w) = &s.filter {
            if contains_agg(w) { return err("aggregate functions are not allowed in WHERE".into()); }
            let pred = self.bind(w, &plan.schema())?;
            plan = Plan::Filter { pred, child: Box::new(plan) };
        }
        let input = plan.schema();
        // Expand * and collect (ast, name) for the select list.
        let mut items: Vec<(Ast, String)> = vec![];
        for it in &s.items {
            match it {
                Item::Star => for c in &input.cols { items.push((Ast::Ident(c.table.clone(), c.name.clone()), c.name.clone())) },
                Item::Expr(e, alias) => items.push((e.clone(), alias.clone().unwrap_or_else(|| default_name(e)))),
            }
        }
        // ORDER BY may reference select aliases: substitute the aliased expression.
        let order_asts: Vec<(Ast, bool)> = s.order_by.iter().map(|(e, asc)| {
            if let Ast::Ident(None, n) = e { if let Some((ast, _)) = items.iter().find(|(_, name)| name == n) { return (ast.clone(), *asc); } }
            (e.clone(), *asc)
        }).collect();

        // Aggregation
        let has_agg = !s.group_by.is_empty() || items.iter().any(|(e, _)| contains_agg(e)) || s.having.as_ref().is_some_and(contains_agg)
            || order_asts.iter().any(|(e, _)| contains_agg(e));
        let mut scope = AggScope::default();
        if has_agg {
            let group_by: Vec<Expr> = s.group_by.iter().map(|g| self.bind(g, &input)).collect::<Result<_>>()?;
            scope.group_asts = s.group_by.clone();
            for (e, _) in &items { self.collect_aggs(e, &input, &mut scope)?; }
            if let Some(h) = &s.having { self.collect_aggs(h, &input, &mut scope)?; }
            for (e, _) in &order_asts { self.collect_aggs(e, &input, &mut scope)?; }
            let it = types(&input);
            let mut cols: Vec<Column> = group_by.iter().zip(&s.group_by).map(|(g, a)| Column { name: default_name(a), ty: g.ty(&it), table: match a { Ast::Ident(q, _) => q.clone().or_else(|| input.cols[match g { Expr::Col(i) => *i, _ => 0 }].table.clone()), _ => None } }).collect();
            for a in &scope.aggs { cols.push(anon("agg", agg_type(a, &it))); }
            plan = Plan::Aggregation { group_by, aggs: scope.aggs.iter().map(|(a, _)| a.clone()).collect(), schema: Schema::new(cols), child: Box::new(plan) };
            if let Some(h) = &s.having {
                let pred = self.bind_post_agg(h, &input, &scope)?;
                plan = Plan::Filter { pred, child: Box::new(plan) };
            }
        }
        let post = plan.schema();
        // Window functions
        let mut wins: Vec<(Ast, WinCall)> = vec![];
        for (e, _) in &items { self.collect_windows(e, &post, has_agg, &input, &scope, &mut wins)?; }
        if !wins.is_empty() {
            let mut cols = post.cols.clone();
            let pt = types(&post);
            for (_, w) in &wins { cols.push(anon("win", match w.f { WinFn::Agg(f) => agg_type(&(Agg { f, arg: w.arg.clone(), distinct: false }, Ast::Lit(Value::Null)), &pt), _ => ColType::BigInt })); }
            plan = Plan::Window { calls: wins.iter().map(|w| w.1.clone()).collect(), schema: Schema::new(cols), child: Box::new(plan) };
        }
        let pre = plan.schema();
        let bind_final = |e: &Ast| -> Result<Expr> {
            if let Some(i) = wins.iter().position(|(w, _)| w == e) { return Ok(Expr::Col(post.len() + i)); }
            if has_agg { self.bind_post_agg_win(e, &input, &scope, &wins, post.len()) } else { self.bind_with_windows(e, &pre, &wins, post.len()) }
        };
        let mut exprs: Vec<Expr> = items.iter().map(|(e, _)| bind_final(e)).collect::<Result<_>>()?;
        let pt = types(&pre);
        let mut cols: Vec<Column> = items.iter().zip(&exprs).map(|((e, name), x)| Column {
            name: name.clone(), ty: x.ty(&pt), table: match e { Ast::Ident(q, _) => q.clone(), _ => None } }).collect();
        // ORDER BY expressions not in the select list become hidden trailing columns.
        let visible = exprs.len();
        let mut order: Vec<(Expr, bool)> = vec![];
        for (e, asc) in &order_asts {
            let b = bind_final(e)?;
            let idx = match exprs.iter().position(|x| *x == b) {
                Some(i) => i,
                None => {
                    if s.distinct { return err("for SELECT DISTINCT, ORDER BY expressions must appear in select list".into()); }
                    exprs.push(b.clone()); cols.push(anon("__order", b.ty(&pt))); exprs.len() - 1
                }
            };
            order.push((Expr::Col(idx), *asc));
        }
        plan = Plan::Projection { exprs, schema: Schema::new(cols.clone()), child: Box::new(plan) };
        if s.distinct {
            let n = cols.len();
            plan = Plan::Aggregation { group_by: (0..n).map(Expr::Col).collect(), aggs: vec![], schema: Schema::new(cols.clone()), child: Box::new(plan) };
        }
        if !order.is_empty() { plan = Plan::Sort { order_by: order, child: Box::new(plan) }; }
        if s.limit.is_some() || s.offset.is_some() { plan = Plan::Limit { limit: s.limit, offset: s.offset.unwrap_or(0), child: Box::new(plan) }; }
        if cols.len() > visible {
            plan = Plan::Projection { exprs: (0..visible).map(Expr::Col).collect(), schema: Schema::new(cols[..visible].to_vec()), child: Box::new(plan) };
        }
        Ok(plan)
    }

    fn plan_from(&self, f: &From) -> Result<Plan> {
        Ok(match f {
            From::Table { name, alias } => {
                let t = self.cat.table(name)?;
                Plan::SeqScan { table: t.name.clone(), schema: t.schema.with_qualifier(alias.as_deref().unwrap_or(&t.name)), filter: None }
            }
            From::Join { left, right, kind, on } => {
                let (l, r) = (self.plan_from(left)?, self.plan_from(right)?);
                let both = l.schema().join(&r.schema());
                let pred = on.as_ref().map(|e| self.bind(e, &both)).transpose()?;
                Plan::NestedLoopJoin { left: Box::new(l), right: Box::new(r), pred, kind: *kind }
            }
        })
    }

    fn collect_aggs(&self, e: &Ast, input: &Schema, sc: &mut AggScope) -> Result<()> {
        match e {
            Ast::Call { over: Some(_), args, .. } => { for a in args { self.collect_aggs(a, input, sc)?; } }
            Ast::Call { name, args, star, distinct, over: None } if agg_fn(name, *star).is_some() => {
                if sc.aggs.iter().any(|(_, a)| a == e) { return Ok(()); }
                if args.iter().any(contains_agg) { return err("aggregate calls cannot be nested".into()); }
                let f = agg_fn(name, *star).unwrap();
                let arg = if *star { None } else { Some(self.bind(args.first().ok_or_else(|| super::Error(format!("{name}() needs an argument")))?, input)?) };
                sc.aggs.push((Agg { f, arg, distinct: *distinct }, e.clone()));
            }
            Ast::Bin(_, a, b) => { self.collect_aggs(a, input, sc)?; self.collect_aggs(b, input, sc)?; }
            Ast::Not(a) | Ast::Neg(a) | Ast::IsNull(a, _) => self.collect_aggs(a, input, sc)?,
            Ast::Between(a, b, c, _) => { for x in [a, b, c] { self.collect_aggs(x, input, sc)?; } }
            Ast::InList(a, l, _) => { self.collect_aggs(a, input, sc)?; for x in l { self.collect_aggs(x, input, sc)?; } }
            Ast::Call { args, .. } => { for a in args { self.collect_aggs(a, input, sc)?; } }
            _ => {}
        }
        Ok(())
    }

    /// Bind over the aggregation output: group-by expressions and aggregate calls become column refs.
    fn bind_post_agg(&self, e: &Ast, input: &Schema, sc: &AggScope) -> Result<Expr> {
        if let Some(i) = sc.group_asts.iter().position(|g| same_ast(g, e, input)) { return Ok(Expr::Col(i)); }
        if let Some(i) = sc.aggs.iter().position(|(_, a)| a == e) { return Ok(Expr::Col(sc.group_asts.len() + i)); }
        Ok(match e {
            Ast::Ident(q, n) => return err(format!("column {}{n} must appear in the GROUP BY clause or be used in an aggregate function", q.as_ref().map(|q| format!("{q}.")).unwrap_or_default())),
            Ast::Lit(v) => Expr::Lit(v.clone()),
            Ast::Bin(op, a, b) => Expr::Bin(*op, Box::new(self.bind_post_agg(a, input, sc)?), Box::new(self.bind_post_agg(b, input, sc)?)),
            Ast::Not(a) => Expr::Not(Box::new(self.bind_post_agg(a, input, sc)?)),
            Ast::Neg(a) => Expr::Neg(Box::new(self.bind_post_agg(a, input, sc)?)),
            Ast::IsNull(a, n) => Expr::IsNull(Box::new(self.bind_post_agg(a, input, sc)?), *n),
            Ast::Call { name, args, over: None, .. } if scalar_fn(name).is_some() => Expr::Func(scalar_fn(name).unwrap(), args.iter().map(|a| self.bind_post_agg(a, input, sc)).collect::<Result<_>>()?),
            other => { let s = Schema::default(); return self.bind(other, &s).or_else(|_| err(format!("unsupported expression after GROUP BY: {other:?}"))); }
        })
    }
    fn bind_post_agg_win(&self, e: &Ast, input: &Schema, sc: &AggScope, wins: &[(Ast, WinCall)], base: usize) -> Result<Expr> {
        if let Some(i) = wins.iter().position(|(w, _)| w == e) { return Ok(Expr::Col(base + i)); }
        self.bind_post_agg(e, input, sc)
    }
    fn bind_with_windows(&self, e: &Ast, pre: &Schema, wins: &[(Ast, WinCall)], base: usize) -> Result<Expr> {
        if let Some(i) = wins.iter().position(|(w, _)| w == e) { return Ok(Expr::Col(base + i)); }
        Ok(match e {
            Ast::Bin(op, a, b) => Expr::Bin(*op, Box::new(self.bind_with_windows(a, pre, wins, base)?), Box::new(self.bind_with_windows(b, pre, wins, base)?)),
            Ast::Call { name, .. } if agg_fn(name, false).is_some() || agg_fn(name, true).is_some() => return err(format!("aggregate {name}() without GROUP BY context")),
            e => self.bind(e, pre)?,
        })
    }

    fn collect_windows(&self, e: &Ast, post: &Schema, has_agg: bool, input: &Schema, sc: &AggScope, out: &mut Vec<(Ast, WinCall)>) -> Result<()> {
        match e {
            Ast::Call { name, args, star, over: Some(w), .. } => {
                if out.iter().any(|(a, _)| a == e) { return Ok(()); }
                let b = |x: &Ast| if has_agg { self.bind_post_agg(x, input, sc) } else { self.bind(x, post) };
                let f = match name.as_str() { "row_number" => WinFn::RowNumber, "rank" => WinFn::Rank, "dense_rank" => WinFn::DenseRank,
                    n => WinFn::Agg(agg_fn(n, *star).ok_or_else(|| super::Error(format!("unknown window function {n}")))?) };
                let arg = if *star || args.is_empty() { None } else { Some(b(&args[0])?) };
                let call = WinCall { f, arg, partition_by: w.partition_by.iter().map(&b).collect::<Result<_>>()?, order_by: w.order_by.iter().map(|(x, a)| Ok((b(x)?, *a))).collect::<Result<_>>()? };
                out.push((e.clone(), call));
            }
            Ast::Bin(_, a, b) => { self.collect_windows(a, post, has_agg, input, sc, out)?; self.collect_windows(b, post, has_agg, input, sc, out)?; }
            _ => {}
        }
        Ok(())
    }
}

#[derive(Default)]
struct AggScope { group_asts: Vec<Ast>, aggs: Vec<(Agg, Ast)> }

fn same_ast(a: &Ast, b: &Ast, input: &Schema) -> bool {
    // `t.a` and `a` name the same group key if they resolve to the same column.
    match (a, b) {
        (Ast::Ident(q1, n1), Ast::Ident(q2, n2)) => match (input.resolve(q1.as_deref(), n1), input.resolve(q2.as_deref(), n2)) { (Ok(x), Ok(y)) => x == y, _ => false },
        _ => a == b,
    }
}

pub fn agg_fn(name: &str, star: bool) -> Option<AggFn> {
    Some(match (name, star) { ("count", true) => AggFn::CountStar, ("count", false) => AggFn::Count, ("sum", _) => AggFn::Sum,
        ("min", _) => AggFn::Min, ("max", _) => AggFn::Max, ("avg", _) => AggFn::Avg, _ => return None })
}
fn contains_agg(e: &Ast) -> bool {
    match e {
        Ast::Call { over: Some(_), .. } => false,
        Ast::Call { name, star, args, .. } => agg_fn(name, *star).is_some() || args.iter().any(contains_agg),
        Ast::Bin(_, a, b) => contains_agg(a) || contains_agg(b),
        Ast::Not(a) | Ast::Neg(a) | Ast::IsNull(a, _) => contains_agg(a),
        Ast::Between(a, b, c, _) => contains_agg(a) || contains_agg(b) || contains_agg(c),
        Ast::InList(a, l, _) => contains_agg(a) || l.iter().any(contains_agg),
        _ => false,
    }
}
fn agg_type((a, _): &(Agg, Ast), input: &[ColType]) -> ColType {
    match a.f { AggFn::CountStar | AggFn::Count => ColType::BigInt, AggFn::Avg => ColType::Float,
        _ => a.arg.as_ref().map_or(ColType::BigInt, |e| match e.ty(input) { ColType::Int => ColType::BigInt, t => t }) }
}
fn default_name(e: &Ast) -> String {
    match e { Ast::Ident(_, n) => n.clone(), Ast::Call { name, .. } => name.clone(), _ => "?column?".into() }
}

pub fn lower_fn(f: ScalarFn) -> ScalarFn { f }
```
