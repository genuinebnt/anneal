[[sections]]
heading = "Overview"
body = """
<p>BusTub avoids this layer by linking PostgreSQL's real parser. A Rust engine has three options: wrap <a href="https://github.com/apache/datafusion-sqlparser-rs" target="_blank" rel="noreferrer"><code>sqlparser-rs</code></a> (DataFusion and many others do), generate a parser, or hand-write one. A hand-written recursive-descent parser for a SQL subset is about 330 lines, gives the best error messages, and is the best way to understand what the binder consumes.</p>
"""

[[sections]]
heading = "The pipeline"
body = """
<div class="cb-g-ladder"><div><b>Lexer</b><span>text → tokens (keywords, identifiers, literals, symbols)</span></div><i>→</i><div><b>Parser</b><span>tokens → AST (syntax only: no catalog)</span></div><i>→</i><div><b>Binder</b><span>AST + catalog → resolved names, types, desugaring</span></div><i>→</i><div><b>Planner</b><span>bound AST → logical plan tree</span></div></div>
"""

[[sections]]
heading = "Lexer"
body = """
<p>One pass over the bytes. Details that matter: identifiers fold to lowercase and keywords to uppercase (SQL is case-insensitive); <code>''</code> inside a string is an escaped quote; <code>--</code> starts a comment; two-character operators (<code>&lt;=</code>, <code>&gt;=</code>, <code>&lt;&gt;</code>, <code>!=</code>, <code>||</code>) are matched before one-character ones; an integer literal that overflows <code>i64</code> is a lex <strong>error</strong>, not a wrap.</p>
"""

[[sections]]
heading = "Parser: precedence climbing"
body = """
<p>Expression grammar, lowest to highest binding:</p>

```text
expr       → or
or         → and ( "OR" and )*
and        → not ( "AND" not )*
not        → "NOT" not | comparison
comparison → additive ( ("=" | "<>" | "<" | "<=" | ">" | ">=") additive
                       | "IS" ["NOT"] "NULL"
                       | ["NOT"] "BETWEEN" additive "AND" additive
                       | ["NOT"] "IN" "(" expr ("," expr)* ")" )?
additive   → term ( ("+" | "-" | "||") term )*
term       → unary ( ("*" | "/" | "%") unary )*
unary      → "-" unary | primary
primary    → literal | column | func "(" args ")" [ "OVER" "(" window ")" ] | "(" expr ")"
```

<p>The implementation uses a single <code>binary(min_prec)</code> loop instead of one function per level: read a left operand, then while the next operator's precedence ≥ <code>min_prec</code>, consume it and parse the right side with <code>prec + 1</code> (left-associative). <code>BETWEEN … AND …</code> is the classic trap: its <code>AND</code> is part of the construct, so the bounds are parsed at additive precedence, which stops them from swallowing the boolean <code>AND</code>.</p>

:::deeper Lexer, AST and recursive-descent parser for the supported SQL subset
```rust title="src/sql/parser.rs"
//! SQL front end: lexer + recursive-descent parser with precedence climbing for expressions.
use crate::storage::table::tuple_codec::ColType;
use crate::types::value::Value;
use super::expr::{BinOp, ScalarFn};
use super::{err, Result};

#[derive(Clone, Debug, PartialEq)]
pub enum Tok { Ident(String), Kw(String), Int(i64), Float(f64), Str(String), Sym(&'static str), Eof }

const KEYWORDS: &[&str] = &["SELECT", "FROM", "WHERE", "AND", "OR", "NOT", "INSERT", "INTO", "VALUES", "CREATE", "TABLE",
    "INDEX", "ON", "UPDATE", "SET", "DELETE", "JOIN", "INNER", "LEFT", "OUTER", "CROSS", "GROUP", "BY", "HAVING", "ORDER", "ASC",
    "DESC", "LIMIT", "OFFSET", "AS", "NULL", "IS", "TRUE", "FALSE", "DISTINCT", "BETWEEN", "IN", "EXPLAIN", "INTEGER", "INT",
    "BIGINT", "VARCHAR", "TEXT", "BOOLEAN", "FLOAT", "DOUBLE", "DECIMAL", "OVER", "PARTITION"];

pub fn lex(src: &str) -> Result<Vec<Tok>> {
    let b = src.as_bytes();
    let (mut i, mut out) = (0, Vec::new());
    while i < b.len() {
        let c = b[i] as char;
        if c.is_whitespace() { i += 1; continue; }
        if c == '-' && b.get(i + 1) == Some(&b'-') { while i < b.len() && b[i] != b'\\n' { i += 1; } continue; }
        if c.is_ascii_alphabetic() || c == '_' {
            let s = i;
            while i < b.len() && (b[i].is_ascii_alphanumeric() || b[i] == b'_') { i += 1; }
            let w = &src[s..i];
            let up = w.to_ascii_uppercase();
            out.push(if KEYWORDS.contains(&up.as_str()) { Tok::Kw(up) } else { Tok::Ident(w.to_ascii_lowercase()) });
            continue;
        }
        if c.is_ascii_digit() {
            let s = i;
            while i < b.len() && b[i].is_ascii_digit() { i += 1; }
            if i < b.len() && b[i] == b'.' && b.get(i + 1).is_some_and(|d| d.is_ascii_digit()) {
                i += 1;
                while i < b.len() && b[i].is_ascii_digit() { i += 1; }
                out.push(Tok::Float(src[s..i].parse().unwrap()));
            } else {
                out.push(Tok::Int(src[s..i].parse().map_err(|_| super::Error(format!("integer literal too large: {}", &src[s..i])))?));
            }
            continue;
        }
        if c == '\\'' {
            let mut s = String::new();
            i += 1;
            loop {
                match b.get(i) {
                    None => return err("unterminated string literal".into()),
                    Some(b'\\'') if b.get(i + 1) == Some(&b'\\'') => { s.push('\\''); i += 2; }   // '' escapes a quote
                    Some(b'\\'') => { i += 1; break; }
                    Some(_) => { let ch = src[i..].chars().next().unwrap(); s.push(ch); i += ch.len_utf8(); }
                }
            }
            out.push(Tok::Str(s));
            continue;
        }
        let two = src.get(i..i + 2).unwrap_or("");
        let sym: &'static str = match two { "<=" => "<=", ">=" => ">=", "<>" => "<>", "!=" => "<>", "||" => "||", _ => "" };
        if !sym.is_empty() { out.push(Tok::Sym(sym)); i += 2; continue; }
        let sym: &'static str = match c { '(' => "(", ')' => ")", ',' => ",", ';' => ";", '*' => "*", '+' => "+", '-' => "-",
            '/' => "/", '%' => "%", '=' => "=", '<' => "<", '>' => ">", '.' => ".", _ => return err(format!("unexpected character '{c}'")) };
        out.push(Tok::Sym(sym));
        i += 1;
    }
    out.push(Tok::Eof);
    Ok(out)
}

// ---------------- AST -------------------------------------------------------------------------
#[derive(Clone, Debug, PartialEq)]
pub enum Ast {
    Ident(Option<String>, String),
    Lit(Value),
    Bin(BinOp, Box<Ast>, Box<Ast>),
    Not(Box<Ast>),
    Neg(Box<Ast>),
    IsNull(Box<Ast>, bool),
    Between(Box<Ast>, Box<Ast>, Box<Ast>, bool),
    InList(Box<Ast>, Vec<Ast>, bool),
    Call { name: String, args: Vec<Ast>, star: bool, distinct: bool, over: Option<WindowSpec> },
}

#[derive(Clone, Debug, PartialEq)]
pub struct WindowSpec { pub partition_by: Vec<Ast>, pub order_by: Vec<(Ast, bool)> }

#[derive(Clone, Copy, Debug, PartialEq)]
pub enum JoinKind { Inner, Left }

#[derive(Clone, Debug, PartialEq)]
pub enum From { Table { name: String, alias: Option<String> }, Join { left: Box<From>, right: Box<From>, kind: JoinKind, on: Option<Ast> } }

#[derive(Clone, Debug, PartialEq)]
pub enum Item { Star, Expr(Ast, Option<String>) }

#[derive(Clone, Debug, PartialEq, Default)]
pub struct Select {
    pub distinct: bool, pub items: Vec<Item>, pub from: Option<From>, pub filter: Option<Ast>,
    pub group_by: Vec<Ast>, pub having: Option<Ast>, pub order_by: Vec<(Ast, bool)>, pub limit: Option<u64>, pub offset: Option<u64>,
}

#[derive(Clone, Debug, PartialEq)]
pub enum Stmt {
    CreateTable { name: String, cols: Vec<(String, ColType)> },
    CreateIndex { name: String, table: String, col: String },
    Insert { table: String, cols: Option<Vec<String>>, rows: Option<Vec<Vec<Ast>>>, select: Option<Box<Select>> },
    Select(Box<Select>),
    Update { table: String, sets: Vec<(String, Ast)>, filter: Option<Ast> },
    Delete { table: String, filter: Option<Ast> },
    Explain(Box<Stmt>),
}

pub fn parse(src: &str) -> Result<Vec<Stmt>> {
    let mut p = Parser { t: lex(src)?, i: 0, depth: 0 };
    let mut out = Vec::new();
    while p.peek() != &Tok::Eof {
        if p.eat_sym(";") { continue; }
        out.push(p.stmt()?);
        if p.peek() != &Tok::Eof { p.expect_sym(";")?; }
    }
    Ok(out)
}

/// Depth of the expression tree the parser will build: nested parentheses, chains of unary operators, and the length of a left-associative
/// chain such as `a + b + c + …`. Every later stage (binding, simplifying, evaluating, dropping) walks the tree recursively, so the depth
/// is bounded here: a statement of a million nested parentheses must be an error, not a stack overflow that ends the process.
pub const MAX_EXPR_DEPTH: usize = 1000;

struct Parser { t: Vec<Tok>, i: usize, depth: usize }

impl Parser {
    fn peek(&self) -> &Tok { &self.t[self.i] }
    fn bump(&mut self) -> Tok { let t = self.t[self.i].clone(); if t != Tok::Eof { self.i += 1; } t }
    fn is_kw(&self, k: &str) -> bool { matches!(self.peek(), Tok::Kw(w) if w == k) }
    fn eat_kw(&mut self, k: &str) -> bool { if self.is_kw(k) { self.i += 1; true } else { false } }
    fn eat_sym(&mut self, s: &str) -> bool { if matches!(self.peek(), Tok::Sym(x) if *x == s) { self.i += 1; true } else { false } }
    fn expect_kw(&mut self, k: &str) -> Result<()> { if self.eat_kw(k) { Ok(()) } else { err(format!("expected {k}, found {:?}", self.peek())) } }
    fn expect_sym(&mut self, s: &str) -> Result<()> { if self.eat_sym(s) { Ok(()) } else { err(format!("expected '{s}', found {:?}", self.peek())) } }
    fn ident(&mut self) -> Result<String> { match self.bump() { Tok::Ident(s) => Ok(s), t => err(format!("expected identifier, found {t:?}")) } }
    fn uint(&mut self) -> Result<u64> { match self.bump() { Tok::Int(n) if n >= 0 => Ok(n as u64), t => err(format!("expected a number, found {t:?}")) } }

    fn stmt(&mut self) -> Result<Stmt> {
        if self.eat_kw("EXPLAIN") { return Ok(Stmt::Explain(Box::new(self.stmt()?))); }
        if self.eat_kw("SELECT") { return Ok(Stmt::Select(Box::new(self.select_body()?))); }
        if self.eat_kw("CREATE") {
            if self.eat_kw("TABLE") {
                let name = self.ident()?;
                self.expect_sym("(")?;
                let mut cols = vec![];
                loop {
                    let c = self.ident()?;
                    let ty = match self.bump() {
                        Tok::Kw(k) if k == "INTEGER" || k == "INT" => ColType::Int,
                        Tok::Kw(k) if k == "BIGINT" => ColType::BigInt,
                        Tok::Kw(k) if k == "VARCHAR" || k == "TEXT" => { if self.eat_sym("(") { self.uint()?; self.expect_sym(")")?; } ColType::Varchar }
                        Tok::Kw(k) if k == "BOOLEAN" => ColType::Bool,
                        Tok::Kw(k) if k == "FLOAT" || k == "DOUBLE" || k == "DECIMAL" => ColType::Float,
                        t => return err(format!("unknown type {t:?}")),
                    };
                    cols.push((c, ty));
                    if !self.eat_sym(",") { break; }
                }
                self.expect_sym(")")?;
                return Ok(Stmt::CreateTable { name, cols });
            }
            self.expect_kw("INDEX")?;
            let name = self.ident()?;
            self.expect_kw("ON")?;
            let table = self.ident()?;
            self.expect_sym("(")?;
            let col = self.ident()?;
            self.expect_sym(")")?;
            return Ok(Stmt::CreateIndex { name, table, col });
        }
        if self.eat_kw("INSERT") {
            self.expect_kw("INTO")?;
            let table = self.ident()?;
            let cols = if self.eat_sym("(") { let mut c = vec![self.ident()?]; while self.eat_sym(",") { c.push(self.ident()?); } self.expect_sym(")")?; Some(c) } else { None };
            if self.eat_kw("SELECT") { return Ok(Stmt::Insert { table, cols, rows: None, select: Some(Box::new(self.select_body()?)) }); }
            self.expect_kw("VALUES")?;
            let mut rows = vec![];
            loop {
                self.expect_sym("(")?;
                let mut r = vec![self.expr()?];
                while self.eat_sym(",") { r.push(self.expr()?); }
                self.expect_sym(")")?;
                rows.push(r);
                if !self.eat_sym(",") { break; }
            }
            return Ok(Stmt::Insert { table, cols, rows: Some(rows), select: None });
        }
        if self.eat_kw("UPDATE") {
            let table = self.ident()?;
            self.expect_kw("SET")?;
            let mut sets = vec![];
            loop { let c = self.ident()?; self.expect_sym("=")?; sets.push((c, self.expr()?)); if !self.eat_sym(",") { break; } }
            let filter = if self.eat_kw("WHERE") { Some(self.expr()?) } else { None };
            return Ok(Stmt::Update { table, sets, filter });
        }
        if self.eat_kw("DELETE") {
            self.expect_kw("FROM")?;
            let table = self.ident()?;
            let filter = if self.eat_kw("WHERE") { Some(self.expr()?) } else { None };
            return Ok(Stmt::Delete { table, filter });
        }
        err(format!("unexpected {:?} at start of statement", self.peek()))
    }

    fn select_body(&mut self) -> Result<Select> {
        let mut s = Select { distinct: self.eat_kw("DISTINCT"), ..Default::default() };
        loop {
            if self.eat_sym("*") { s.items.push(Item::Star); }
            else {
                let e = self.expr()?;
                let alias = if self.eat_kw("AS") { Some(self.ident()?) } else if let Tok::Ident(_) = self.peek() { Some(self.ident()?) } else { None };
                s.items.push(Item::Expr(e, alias));
            }
            if !self.eat_sym(",") { break; }
        }
        if self.eat_kw("FROM") {
            let mut f = self.from_item()?;
            loop {
                if self.eat_sym(",") { f = From::Join { left: Box::new(f), right: Box::new(self.from_item()?), kind: JoinKind::Inner, on: None }; continue; }
                let kind = if self.eat_kw("LEFT") { self.eat_kw("OUTER"); self.expect_kw("JOIN")?; JoinKind::Left }
                    else if self.eat_kw("INNER") { self.expect_kw("JOIN")?; JoinKind::Inner }
                    else if self.eat_kw("CROSS") { self.expect_kw("JOIN")?; f = From::Join { left: Box::new(f), right: Box::new(self.from_item()?), kind: JoinKind::Inner, on: None }; continue; }
                    else if self.eat_kw("JOIN") { JoinKind::Inner }
                    else { break };
                let right = self.from_item()?;
                self.expect_kw("ON")?;
                f = From::Join { left: Box::new(f), right: Box::new(right), kind, on: Some(self.expr()?) };
            }
            s.from = Some(f);
        }
        if self.eat_kw("WHERE") { s.filter = Some(self.expr()?); }
        if self.eat_kw("GROUP") { self.expect_kw("BY")?; s.group_by = self.expr_list()?; }
        if self.eat_kw("HAVING") { s.having = Some(self.expr()?); }
        if self.eat_kw("ORDER") { self.expect_kw("BY")?; s.order_by = self.order_list()?; }
        if self.eat_kw("LIMIT") { s.limit = Some(self.uint()?); }
        if self.eat_kw("OFFSET") { s.offset = Some(self.uint()?); }
        Ok(s)
    }

    fn from_item(&mut self) -> Result<From> {
        let name = self.ident()?;
        let alias = if self.eat_kw("AS") { Some(self.ident()?) } else if let Tok::Ident(_) = self.peek() { Some(self.ident()?) } else { None };
        Ok(From::Table { name, alias })
    }
    fn expr_list(&mut self) -> Result<Vec<Ast>> { let mut v = vec![self.expr()?]; while self.eat_sym(",") { v.push(self.expr()?); } Ok(v) }
    fn order_list(&mut self) -> Result<Vec<(Ast, bool)>> {
        let mut v = vec![];
        loop { let e = self.expr()?; let asc = if self.eat_kw("DESC") { false } else { self.eat_kw("ASC"); true }; v.push((e, asc)); if !self.eat_sym(",") { break; } }
        Ok(v)
    }

    // ---- expressions: precedence climbing --------------------------------------------------------
    // OR < AND < NOT < comparison / IS / BETWEEN / IN < + - || < * / % < unary - < primary
    pub fn expr(&mut self) -> Result<Ast> { self.binary(0) }

    fn enter(&mut self) -> Result<()> {
        self.depth += 1;
        if self.depth > MAX_EXPR_DEPTH { return err(format!("expression too deeply nested: more than {MAX_EXPR_DEPTH} levels")); }
        Ok(())
    }

    fn binary(&mut self, min: u8) -> Result<Ast> {
        let base = self.depth;
        let mut lhs = self.unary(min)?;
        loop {
            let (op, prec) = match self.peek() {
                Tok::Kw(k) if k == "OR" => (BinOp::Or, 1),
                Tok::Kw(k) if k == "AND" => (BinOp::And, 2),
                Tok::Sym("=") => (BinOp::Eq, 4), Tok::Sym("<>") => (BinOp::Ne, 4),
                Tok::Sym("<") => (BinOp::Lt, 4), Tok::Sym("<=") => (BinOp::Le, 4),
                Tok::Sym(">") => (BinOp::Gt, 4), Tok::Sym(">=") => (BinOp::Ge, 4),
                Tok::Sym("+") => (BinOp::Add, 5), Tok::Sym("-") => (BinOp::Sub, 5), Tok::Sym("||") => (BinOp::Concat, 5),
                Tok::Sym("*") => (BinOp::Mul, 6), Tok::Sym("/") => (BinOp::Div, 6), Tok::Sym("%") => (BinOp::Mod, 6),
                Tok::Kw(k) if (k == "IS" || k == "BETWEEN" || k == "IN" || k == "NOT") && min <= 4 => { self.enter()?; lhs = self.postfix(lhs)?; continue; }
                _ => break,
            };
            if prec < min { break; }
            self.bump();
            self.enter()?;                                            // each operator of a chain is one level deeper than the last
            let rhs = self.binary(prec + 1)?;                         // left-associative
            lhs = Ast::Bin(op, Box::new(lhs), Box::new(rhs));
        }
        self.depth = base;
        Ok(lhs)
    }

    fn postfix(&mut self, lhs: Ast) -> Result<Ast> {
        if self.eat_kw("IS") { let not = self.eat_kw("NOT"); self.expect_kw("NULL")?; return Ok(Ast::IsNull(Box::new(lhs), not)); }
        let not = self.eat_kw("NOT");
        if self.eat_kw("BETWEEN") {
            let lo = self.binary(5)?;
            self.expect_kw("AND")?;
            let hi = self.binary(5)?;
            return Ok(Ast::Between(Box::new(lhs), Box::new(lo), Box::new(hi), not));
        }
        self.expect_kw("IN")?;
        self.expect_sym("(")?;
        let list = self.expr_list()?;
        self.expect_sym(")")?;
        Ok(Ast::InList(Box::new(lhs), list, not))
    }

    fn unary(&mut self, min: u8) -> Result<Ast> {
        if min <= 3 && self.eat_kw("NOT") { self.enter()?; let e = self.binary(3)?; self.depth -= 1; return Ok(Ast::Not(Box::new(e))); }
        if self.eat_sym("-") { self.enter()?; let e = self.unary(7)?; self.depth -= 1; return Ok(Ast::Neg(Box::new(e))); }
        self.primary()
    }

    fn primary(&mut self) -> Result<Ast> {
        Ok(match self.bump() {
            Tok::Int(i) => Ast::Lit(Value::Int(i)),
            Tok::Float(f) => Ast::Lit(Value::Float(f)),
            Tok::Str(s) => Ast::Lit(Value::Text(s.into())),
            Tok::Kw(k) if k == "NULL" => Ast::Lit(Value::Null),
            Tok::Kw(k) if k == "TRUE" => Ast::Lit(Value::Bool(true)),
            Tok::Kw(k) if k == "FALSE" => Ast::Lit(Value::Bool(false)),
            Tok::Sym("(") => { self.enter()?; let e = self.expr()?; self.expect_sym(")")?; self.depth -= 1; e }
            Tok::Ident(name) => {
                if self.eat_sym(".") { return Ok(Ast::Ident(Some(name), self.ident()?)); }
                if !self.eat_sym("(") { return Ok(Ast::Ident(None, name)); }
                let distinct = self.eat_kw("DISTINCT");
                let (args, star) = if self.eat_sym("*") { (vec![], true) } else if matches!(self.peek(), Tok::Sym(")")) { (vec![], false) } else { (self.expr_list()?, false) };
                self.expect_sym(")")?;
                let over = if self.eat_kw("OVER") {
                    self.expect_sym("(")?;
                    let mut w = WindowSpec { partition_by: vec![], order_by: vec![] };
                    if self.eat_kw("PARTITION") { self.expect_kw("BY")?; w.partition_by = self.expr_list()?; }
                    if self.eat_kw("ORDER") { self.expect_kw("BY")?; w.order_by = self.order_list()?; }
                    self.expect_sym(")")?;
                    Some(w)
                } else { None };
                Ast::Call { name, args, star, distinct, over }
            }
            t => return err(format!("unexpected {t:?} in expression")),
        })
    }
}

pub fn scalar_fn(name: &str) -> Option<ScalarFn> {
    Some(match name { "upper" => ScalarFn::Upper, "lower" => ScalarFn::Lower, "length" => ScalarFn::Length, "abs" => ScalarFn::Abs, "coalesce" => ScalarFn::Coalesce, _ => return None })
}
```
:::

<aside data-call="rust"><b>Error messages as part of the design</b><p>Every <code>expect_*</code> returns <code>err(format!("expected {k}, found {:?}", self.peek()))</code>. That one line gives <code>expected ON, found Ident("x")</code>, which beats a generic "syntax error". Production parsers add <strong>spans</strong> (byte offsets) to tokens so a renderer can underline the problem, and <strong>recovery</strong> to report several errors per statement. The same techniques as in any compiler front end apply: recovery sets and a lossless token stream.</p></aside>
"""

[[sections]]
heading = "Binder and planner"
body = """
<p>The binder turns names into positions and checks semantics. The planner builds the operator tree in <strong>logical evaluation order</strong> (<a href="/cookbook/p/modern-sql">L02</a>). The decisions embedded in the reference:</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Step</th> <th>What it does</th> <th>Why</th> </tr> </thead> <tbody> <tr> <td><code>FROM</code></td> <td>builds scans (schema re-qualified by alias) and left-deep join nodes</td> <td>self-joins; <code>ON</code> conjuncts stay on the join</td> </tr> <tr> <td><code>WHERE</code></td> <td><code>Filter</code> over the <code>FROM</code> tree; aggregates are rejected</td> <td>aggregates aren't defined per row</td> </tr> <tr> <td><code>*</code> expansion</td> <td>replaced by every input column</td> <td>needs the schema</td> </tr> <tr> <td><code>BETWEEN</code>, <code>IN</code>, <code>NOT BETWEEN</code></td> <td><strong>desugared</strong> to comparisons and <code>OR</code>/<code>AND</code></td> <td>executors and the optimizer see fewer node kinds</td> </tr> <tr> <td>aggregates</td> <td>collected from <code>SELECT</code>/<code>HAVING</code>/<code>ORDER BY</code>, deduplicated, evaluated by one <code>Aggregation</code> node</td> <td><code>SUM(x)</code> used twice is computed once</td> </tr> <tr> <td>post-aggregation binding</td> <td>a column is legal only if it's a <code>GROUP BY</code> expression; aggregate calls become references to the aggregation output</td> <td>the "must appear in GROUP BY" rule falls out of the binding order</td> </tr> <tr> <td>window functions</td> <td>collected into a <code>Window</code> node <em>after</em> aggregation, appending one column per call</td> <td>windows are computed over post-<code>HAVING</code> rows</td> </tr> <tr> <td><code>ORDER BY</code></td> <td>may use select-list aliases; expressions not in the select list become <strong>hidden trailing columns</strong> dropped by a final projection</td> <td><code>SELECT a FROM t ORDER BY b</code></td> </tr> <tr> <td><code>DISTINCT</code></td> <td><code>Aggregation</code> grouping on every output column, no aggregates</td> <td>one mechanism for dedup and grouping</td> </tr> <tr> <td><code>LIMIT</code>/<code>OFFSET</code></td> <td><code>Limit</code> over <c