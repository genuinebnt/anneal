<aside data-call="testing"><b>Test plan</b><ul> <li><code>the_memo_holds_exactly_the_connected_pairs_of_dpccp</code>: for 120 random queries (n = 2…9, all shapes) the number of logical expressions in the fully explored memo equals <strong>2 × the number of connected-subgraph/complement pairs that DPccp (<a href="/cookbook/p/join-ordering">Q4</a>) enumerates</strong>. This says the rule set is <strong>complete</strong> (reaches every cross-product-free tree) and <strong>duplicate-free</strong> (never stores one twice), checked against an algorithm that shares no code with the memo.</li> <li><code>cascades_equals_the_reference_dp_for_every_required_order</code>: 300 random queries (n = 1…9) and, for each, <code>Any</code> and a random <code>ORDER BY</code> predicate: the Cascades plan's cost equals the bottom-up DP's, with pruning on <strong>and</strong> off, and the returned plan really delivers the requested order.</li> <li><code>pruning_never_changes_the_answer_and_saves_work</code>: identical optimal costs with and without pruning on 60 queries; pruning never costs more alternatives and costs strictly fewer on most.</li> <li><code>broken_rule_sets_and_missing_enforcers_are_detected</code>: <strong>mutations</strong>: removing associativity, removing commutativity and removing the sort enforcer are each caught on all 200 queries (wrong cost, no plan, or a memo with the wrong number of expressions). Removing <em>right</em> associativity is caught on <strong>0 of 200</strong>: with commutativity present it is <strong>derivable</strong> (commute, left-associate, commute), a redundant rule: the harness is able to tell a missing rule from a redundant one.</li> </ul></aside>
"""

[[sections]]
heading = "Measured"
body = """
<p>An optimal plan found for a five-relation tree query with <code>ORDER BY</code> on predicate 0's attribute (it uses an index scan for order, a merge join, a hash-join pipeline and a <code>Sort</code> enforcer; its cost equals the reference DP's):</p>

```text title="example plan"
MergeJoin[e0](IndexScan(R1), Sort[e0](HashJoin(HashJoin(Scan(R4), HashJoin(Scan(R2), Scan(R0))), Scan(R3))))
cost 1608288, reference 1608288
```

```text title="memo size and search effort, n = 9, no required order"
shape      groups logical exprs alts (no prune)  alts (pruned)   pruned away    memo ms   DPccp ms
Chain          45           240            589            131        77.8%        0.2       0.01
Star          264          2048           5161            234        95.5%        2.3       0.02
Cycle          73           576           1416            236        83.3%        0.5       0.01
Clique        511         18660         185466            421        99.8%       33.7       0.12
```

```text title="effect of ORDER BY, pruned, n = 9, median of 20 random queries"
shape      alts: no order   alts: ORDER BY plan cost: ORDER BY / none
Chain                 117              112                  1.310
Star                  160              165                  1.065
Clique                521              460                  1.005
```

<ul> <li><strong>The memo's size is the number of connected subgraphs, and its expressions are the join pairs</strong>: 45 groups for a 9-chain (n(n+1)/2), 264 for a star (2⁸ + 8), 73 for a cycle (n(n−1)+1), 511 for a clique (2⁹ − 1); and 240, 2 048, 576, 18 660 logical expressions: exactly <strong>2 × (n³−n)/6, 2 × (n−1)2ⁿ⁻², 2 × (n³−2n²+n)/2, 2 × (3ⁿ−2ⁿ⁺¹+1)/2</strong>, the formulas of <a href="/cookbook/p/join-ordering">Q4</a>. The memo <em>is</em> the DP table plus both orientations of every split.</li> <li><strong>Branch-and-bound is where Cascades earns its keep</strong>: without pruning the search costs <strong>185 466 physical alternatives</strong> on the 9-clique; with it, <strong>421</strong> (99.8% fewer), and 78–96% fewer on the other shapes, always returning the same plan cost. The first good plan (a hash-join pipeline) sets a bound that cuts nearly everything else, and failed searches are cached.</li> <li><strong>Generality has a price</strong>: the memo takes 34 ms on the 9-clique where DPccp's specialised enumeration takes 0.12 ms (≈280×), and 20× on the chain. The memo does exploration to a fixpoint (re-scanning child expression lists when they grow), hashing and <code>Rc</code> bookkeeping that a join-specific DP doesn't need. What the memo buys is <em>extensibility</em>: new operators, properties and rules don't change the search; DPccp can't add a <code>Sort</code> enforcer.</li> <li><strong>Required order costs search nothing and the plan something</strong>: asking for <code>ORDER BY</code> leaves the number of alternatives costed unchanged (112–165 vs 117–160) because the order is just another key in the winner table; the <em>plan</em> is 31% costlier on chains (the cheap plan wasn't naturally ordered) and 0.5% on cliques (many plans end in a merge join anyway).</li> </ul>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Arena + indices, no <code>Rc</code> cycles</strong>: <code>groups: Vec&lt;Group&gt;</code> and <code>by_set: HashMap&lt;u64, usize&gt;</code>; groups and expressions refer to each other by <code>usize</code>. A DAG of <code>Rc&lt;RefCell&lt;..&gt;&gt;</code> groups would fight the borrow checker and the allocator; indices make the memo <code>Clone</code>-able, serializable (for Orca-style dumps) and cache-friendly.</li> <li><strong>Copy the small thing out, then mutate</strong>: <code>MExpr</code> is <code>Copy</code> (four <code>usize</code>s), so the rule loop does <code>let e = self.groups[g].exprs[i];</code> and is free to call <code>self.group(..)</code>/<code>self.add_expr(..)</code> (which push to the same vectors) without a live borrow. The loop is <code>while i &lt; len</code> because the vector <strong>grows while it is being iterated</strong>: the fixpoint is simply "no new expression was added".</li> <li><strong>A counter instead of a dirty flag</strong>: <code>epoch</code> increments on every new expression; a group remembers the epoch it was last explored at, so <code>explore</code> returns instantly when nothing changed anywhere. Per-expression <code>l_seen</code>/<code>r_seen</code> cursors make each (expression, child expression) pair get processed once.</li> <li><strong>Plans are <code>Rc&lt;Plan&gt;</code></strong>: the winners table and the parent plans share subtrees; cloning a winner is a pointer copy.</li> <li><strong>A macro for the "offer a candidate" step</strong>: <code>offer!</code> updates <code>best</code> and <code>bound</code> in place; a closure would need to borrow them mutably while <code>self</code> is also borrowed. (The <code>prune</code> flag decides whether <code>bound</code> tightens: with pruning off, <code>bound</code> stays infinite while <code>best</code> still tracks the cheapest plan, which is what makes the "no prune" row an honest baseline; an earlier version pruned locally anyway and understated the unpruned work 26×.)</li> <li><strong>The failure cache stores its bound</strong>: <code>Win::Failed(limit)</code> is reused only if the new limit is ≤ the stored one: "no plan costs ≤ 10" says nothing about a budget of 20.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Exploration explodes even when costing is pruned</strong>: the logical space is the DP table (2⁹ groups, 18 660 expressions for a 9-clique; the clique of 14 would be millions). Production optimizers bound it: rule <em>promise</em>, staged rule sets, transformation-count and time budgets, and heuristic seeding of the memo with a good initial join order (SQL Server).</li> <li><strong>Cached failures and cached winners depend on the bound and on the properties</strong>: a bug here yields suboptimal plans that no single test notices; compare against a bottom-up oracle on thousands of random queries (as this section does).</li> <li><strong>Cardinality is a group property, not an expression property</strong>: all expressions of a group must see the same row count or the cost of equivalent plans diverges. Derive statistics once per group (the first expression that arrives) and keep them fixed.</li> <li><strong>Group merging</strong>: here a group is <em>identified</em> by its relation set, so equivalent groups never need merging. General logical equivalences (predicate pushdown, aggregation rewrites, subquery unnesting) can discover that two existing groups are equal; the memo then needs a <strong>union-find</strong> merge of groups and re-canonicalization of every expression that references them.</li> <li><strong>Cost lower bounds must be admissible</strong>: the pruning bound here is "every plan scans every relation once"; an over-eager bound silently discards the optimum. Test bounds against the unpruned search, as <code>pruning_never_changes_the_answer</code> does.</li> <li><strong>Enforcers must be rule-driven and costed</strong>: a <code>Sort</code> inserted without a cost, or an enforcer that can loop (sort of a sort), breaks the search; here the enforcer asks for the same group under <code>Any</code>, which strictly weakens the requirement and so terminates.</li> <li><strong>Debuggability</strong>: a bug in a memo search appears only for one query shape in a production workload. Orca's two lessons apply directly: <strong>dump the optimizer's input and state</strong> on any assertion so the failure replays offline, and <strong>verify the cost model</strong> by running both plans occasionally and checking the order.</li> </ul></aside>
"""

