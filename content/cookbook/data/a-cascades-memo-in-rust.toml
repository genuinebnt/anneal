[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Optimizer generators</strong>: the search algorithm is decoupled from the <strong>rules</strong>, which are written declaratively, so new operators and rewrites plug in without touching the engine. <strong>EXODUS</strong> introduced the idea, <strong>Volcano</strong> made it efficient and top-down, <strong>Cascades</strong> (Graefe 1995) reorganized it as an object-oriented framework. SQL Server, Orca, CockroachDB and Snowflake are Cascades-style.</li> <li><strong>Unified search</strong>: one search covers logical-to-logical <em>and</em> logical-to-physical transformations (no separate heuristic phase). Stratified optimizers (Starburst, CockroachDB's phases) run rule subsets in stages; Cascades folds everything into one memoized search.</li> <li><strong>Expressions and groups</strong>: a <em>logical</em> expression says <em>what</em> (<code>(A ⋈ B) ⋈ C</code>), a <em>physical</em> one says <em>how</em> (<code>(A SeqScan ⋈HJ B SeqScan) ⋈NL C IndexScan</code>). A <strong>group</strong> holds all logically equivalent expressions (same output) and their physical implementations. To avoid materializing every tree, expressions reference <strong>child groups</strong>, not child expressions: a <strong>multi-expression</strong>.</li> <li><strong>Rules</strong> have a <strong>pattern</strong> (what to match) and a <strong>substitute</strong> (what to produce). <strong>Transformation rules</strong> map logical → logical (commutativity, associativity, predicate pushdown); <strong>implementation rules</strong> map logical → physical (join → hash join / merge join; get → scan / index scan).</li> <li><strong>The memo</strong> is the compact graph of groups: it memoizes work, detects duplicate expressions and equivalent groups, and caches the <strong>best plan per (group, required properties)</strong>. Correctness rests on the <strong>principle of optimality</strong>: every sub-plan of an optimal plan is optimal for its own properties.</li> <li><strong>Physical properties and enforcers</strong>: required properties (sort order, partitioning) flow <strong>down</strong> from the parent; a sub-plan satisfies them either natively (merge join delivers its key's order, an index scan its clustering) or via an <strong>enforcer</strong> operator (<code>Sort</code>, <code>Exchange</code>) that the search inserts on demand. Bottom-up optimizers had to carry "interesting orders" in the DP table; top-down search asks only for what a parent needs.</li> <li><strong>Top-down search with branch-and-bound</strong>: start at the root with an unbounded cost limit; cost a candidate operator, <strong>pass the remaining budget to its children</strong>, and abandon a branch the moment it can't beat the best plan found. Memoized lower/upper bounds make failure results reusable.</li> <li><strong>Task structure</strong>: optimization is a stack of tasks (optimize group → explore group → apply rule → optimize inputs) so rules can be <strong>prioritized by promise</strong> and the search can stop on a time, transformation-count or cost-threshold limit.</li> <li><strong>In practice</strong> (S2024 #14): SQL Server uses a staged search (simplification, trivial-plan check, exploration phases of increasing breadth, post-optimization), implements most scalar transformations procedurally rather than as rules, and bounds optimization by <em>transformation count</em> so plans don't depend on machine load; <strong>Orca</strong> is a standalone C++ Cascades service with multi-threaded search, <strong>remote debugging</strong> (a dump of optimizer state and inputs that replays the bug) and a <strong>cost-model verifier</strong> (execute two plans, check that the cheaper estimate really ran faster); <strong>CockroachDB</strong> writes rules in a DSL (OptGen) compiled to Go and optimizes scalar and relational operators together.</li> </ul>
"""

[[sections]]
heading = "The memo, built from scratch"
body = """
<p>The implementation optimizes <strong>inner-join queries</strong> with real physical choices, so every Cascades idea has something to do:</p>

<ol> <li><strong>Logical space</strong>: one <strong>group per relation set</strong>; a logical expression is a pair of child groups <code>(L, R)</code>. The rules are <strong>commutativity</strong> and <strong>left/right associativity</strong> (<code>(A⋈B)⋈C → A⋈(B⋈C)</code>), applied to a fixpoint with duplicate detection in a <code>HashSet</code>; associativity only fires when the new inner group is connected (no cross products).</li> <li><strong>Physical operators and prices</strong>: <code>Scan</code> (cost = rows), <code>IndexScan</code> (1.2×, delivers the relation's clustered order), <code>HashJoin</code> (builds on the left), <code>MergeJoin</code> (on a predicate's attribute, needs both inputs sorted on it, delivers that order), and a <code>Sort</code> <strong>enforcer</strong> (¼·n·log₂ n).</li> <li><strong>Properties</strong>: <code>Any</code> or <code>Order(predicate)</code>; the search asks each child group for the order the join needs and each group caches its best plan <strong>per required property</strong>.</li> <li><strong>Branch-and-bound</strong>: each operator is costed, the remaining budget is passed to the child searches, and a <strong>failed search is cached together with the bound it failed under</strong> (valid only for budgets no larger than that bound).</li> <li><strong>A reference optimizer</strong> that shares <em>only</em> the price list: bottom-up DP over (relation set, order) with no memo, rules or pruning.</li> </ol>

:::deeper Reference: memo groups and multi-expressions, transformation rules to a fixpoint, implementation rules, properties and enforcers, branch-and-bound top-down search, reference DP oracle
```rust title="src/opt/cascades.rs"
//! A small Cascades-style optimizer for inner-join queries: a memo of groups (one per relation set), transformation
//! rules (commutativity, left/right associativity), implementation rules (scan, index scan, hash join, merge join),
//! physical properties (sort order) with a Sort enforcer, and top-down search with branch-and-bound pruning.
use std::collections::{HashMap, HashSet};
use std::rc::Rc;
use crate::joinorder::{Graph, Rng};

#[derive(Clone, Copy, PartialEq, Eq, Hash, Debug)]
pub enum Prop { Any, Order(usize) }          // Order(e): sorted on the join attribute of predicate (edge) e

/// Query + physical design: the join graph, an id per predicate, and which relations are clustered on which attribute.
pub struct Catalog { pub g: Graph, pub edges: Vec<(usize, usize)>, pub eid: Vec<usize>, pub clustered: Vec<Option<usize>> }

impl Catalog {
    pub fn new(g: Graph, rng: &mut Rng) -> Catalog {
        let n = g.n;
        let (mut edges, mut eid) = (vec![], vec![usize::MAX; n * n]);
        for u in 0..n { for v in u + 1..n { if g.adj[u] >> v & 1 == 1 { eid[u * n + v] = edges.len(); eid[v * n + u] = edges.len(); edges.push((u, v)); } } }
        let clustered = (0..n).map(|r| {
            let inc: Vec<usize> = (0..n).filter(|&o| g.adj[r] >> o & 1 == 1).map(|o| eid[r * n + o]).collect();
            if !inc.is_empty() && rng.next(2) == 0 { Some(inc[rng.next(inc.len() as u64) as usize]) } else { None }
        }).collect();
        Catalog { g, edges, eid, clustered }
    }
    /// Does relation set `set` contain an endpoint of predicate `e` (so a result over `set` can be sorted on it)?
    pub fn has_attr(&self, set: u64, e: usize) -> bool { let (u, v) = self.edges[e]; set >> u & 1 == 1 || set >> v & 1 == 1 }
    /// Predicates connecting two disjoint relation sets.
    pub fn connecting(&self, a: u64, b: u64) -> Vec<usize> {
        (0..self.edges.len()).filter(|&e| { let (u, v) = self.edges[e]; (a >> u & 1 == 1 && b >> v & 1 == 1) || (a >> v & 1 == 1 && b >> u & 1 == 1) }).collect()
    }
}

// cost formulas shared by the optimizer and the reference DP (they must agree on prices to be comparable)
pub fn scan_cost(c: f64) -> f64 { c }
pub fn index_scan_cost(c: f64) -> f64 { 1.2 * c }
pub fn sort_cost(c: f64) -> f64 { 0.25 * c * (c + 1.0).log2() }
pub fn hash_cost(build: f64, probe: f64, out: f64) -> f64 { 2.0 * build + probe + out }
pub fn merge_cost(l: f64, r: f64, out: f64) -> f64 { l + r + out }

#[derive(Debug, Clone, PartialEq)]
pub enum Op { Scan(usize), IndexScan(usize), Sort(usize), HashJoin, MergeJoin(usize) }
#[derive(Debug)]
pub struct Plan { pub op: Op, pub cost: f64, pub order: Prop, pub kids: Vec<Rc<Plan>> }
impl Plan {
    pub fn show(&self) -> String {
        let k: Vec<String> = self.kids.iter().map(|c| c.show()).collect();
        match &self.op { Op::Scan(r) => format!("Scan(R{r})"), Op::IndexScan(r) => format!("IndexScan(R{r})"), Op::Sort(a) => format!("Sort[e{a}]({})", k[0]),
            Op::HashJoin => format!("HashJoin({}, {})", k[0], k[1]), Op::MergeJoin(e) => format!("MergeJoin[e{e}]({}, {})", k[0], k[1]) }
    }
}

#[derive(Clone, Copy)]
pub struct Config { pub commute: bool, pub assoc_left: bool, pub assoc_right: bool, pub prune: bool, pub enforcers: bool }
impl Config { pub fn full() -> Config { Config { commute: true, assoc_left: true, assoc_right: true, prune: true, enforcers: true } } }

#[derive(Clone, Copy)] struct MExpr { l: usize, r: usize, l_seen: usize, r_seen: usize }
enum Win { Found(Rc<Plan>), Failed(f64) }       // Failed(x): no plan of cost <= x exists for this (group, property)
struct Group { set: u64, card: f64, exprs: Vec<MExpr>, explored_at: u64, win: HashMap<Prop, Win>, lb: f64 }

#[derive(Default, Clone, Debug)]
pub struct Stats { pub groups: usize, pub logical_exprs: usize, pub alts_costed: u64, pub opt_calls: u64 }

pub struct Memo<'a> { cat: &'a Catalog, cfg: Config, groups: Vec<Group>, by_set: HashMap<u64, usize>, seen: HashSet<(usize, usize, usize)>, epoch: u64, pub stats: Stats }

impl<'a> Memo<'a> {
    pub fn new(cat: &'a Catalog, cfg: Config) -> Self {
        let mut m = Memo { cat, cfg, groups: vec![], by_set: HashMap::new(), seen: HashSet::new(), epoch: 1, stats: Stats::default() };
        // seed with one left-deep join order (breadth-first from relation 0): the "initial plan" the rules start from
        let g = &cat.g;
        let (mut order, mut set) = (vec![0usize], 1u64);
        while order.len() < g.n { let next = (g.neighbors(set)).trailing_zeros() as usize; order.push(next); set |= 1 << next; }
        let mut cur = m.group(1 << order[0]);
        let mut acc = 1u64 << order[0];
        for &r in &order[1..] { let rg = m.group(1 << r); acc |= 1 << r; let ng = m.group(acc); m.add_expr(ng, cur, rg); cur = ng; }
        m
    }
    fn group(&mut self, set: u64) -> usize {
        if let Some(&i) = self.by_set.get(&set) { return i; }
        let lb: f64 = (0..self.cat.g.n).filter(|&r| set >> r & 1 == 1).map(|r| self.cat.g.card[r]).sum();   // every plan scans each relation
        self.groups.push(Group { set, card: self.cat.g.card_of(set), exprs: vec![], explored_at: 0, win: HashMap::new(), lb });
        self.by_set.insert(set, self.groups.len() - 1);
        self.stats.groups += 1;
        self.groups.len() - 1
    }
    fn add_expr(&mut self, g: usize, l: usize, r: usize) -> bool {
        if !self.seen.insert((g, l, r)) { return false; }                 // duplicate detection: the memo's whole point
        self.groups[g].exprs.push(MExpr { l, r, l_seen: 0, r_seen: 0 });
        self.stats.logical_exprs += 1;
        self.epoch += 1;
        true
    }

    /// Apply transformation rules to a fixpoint for `g` and everything below it.
    fn explore(&mut self, g: usize) {
        if self.groups[g].explored_at == self.epoch { return; }
        loop {
            let before = self.epoch;
            let mut i = 0;
            while i < self.groups[g].exprs.len() {
                let e = self.groups[g].exprs[i];
                self.explore(e.l);
                self.explore(e.r);
                let (gl, gr) = (self.groups[e.l].set, self.groups[e.r].set);
                if self.cfg.commute { self.add_expr(g, e.r, e.l); }
                if self.cfg.assoc_left {            // (A ⋈ B) ⋈ C  →  A ⋈ (B ⋈ C)
                    let upto = self.groups[e.l].exprs.len();
                    for k in e.l_seen..upto {
                        let inner = self.groups[e.l].exprs[k];
                        let (sa, sb) = (self.groups[inner.l].set, self.groups[inner.r].set);
                        let bc = sb | gr;
                        if self.cat.g.connected(bc) && self.cat.g.neighbors(sa) & bc != 0 { let n = self.group(bc); let r2 = e.r; self.add_expr(n, inner.r, r2); self.add_expr(g, inner.l, n); }
                    }
                    self.groups[g].exprs[i].l_seen = upto;
                }
                if self.cfg.assoc_right {           // A ⋈ (B ⋈ C)  →  (A ⋈ B) ⋈ C
                    let upto = self.groups[e.r].exprs.len();
                    for k in e.r_seen..upto {
                        let inner = self.groups[e.r].exprs[k];
                        let (sb, sc) = (self.groups[inner.l].set, self.groups[inner.r].set);
                        let ab = gl | sb;
                        if self.cat.g.connected(ab) && self.cat.g.neighbors(ab) & sc != 0 { let n = self.group(ab); let l2 = e.l; self.add_expr(n, l2, inner.l); self.add_expr(g, n, inner.r); }
                    }
                    self.groups[g].exprs[i].r_seen = upto;
                }
                i += 1;
            }
            if self.epoch == before { break; }
        }
        self.groups[g].explored_at = self.epoch;
    }

    fn mk(&mut self, op: Op, cost: f64, order: Prop, kids: Vec<Rc<Plan>>) -> Rc<Plan> { self.stats.alts_costed += 1; Rc::new(Plan { op, cost, order, kids }) }

    /// Cheapest plan for group `g` that delivers `req` and costs at most `limit` (None if there is none).
    #[allow(unused_assignments)]
    pub fn optimize(&mut self, g: usize, req: Prop, limit: f64) -> Option<Rc<Plan>> {
        self.stats.opt_calls += 1;
        let limit = if self.cfg.prune { limit } else { f64::INFINITY };
        match self.groups[g].win.get(&req) {
            Some(Win::Found(p)) => return (p.cost <= limit).then(|| p.clone()),
            Some(Win::Failed(l)) if limit <= *l => return None,
            _ => {}
        }
        self.explore(g);
        let (set, card) = (self.groups[g].set, self.groups[g].card);
        let mut best: Option<Rc<Plan>> = None;
        let mut bound = limit;
        // `bound` only drives pruning (it stays infinite when pruning is off); `best` is always the cheapest plan seen
        let prune = self.cfg.prune;
        macro_rules! offer { ($p:expr) => {{
            let p: Rc<Plan> = $p;
            if (p.order == req || req == Prop::Any) && best.as_ref().map_or(p.cost <= limit, |b| p.cost < b.cost) { if prune { bound = p.cost; } best = Some(p); }
        }}; }
        if set.count_ones() == 1 {
            let r = set.trailing_zeros() as usize;
            let p = self.mk(Op::Scan(r), scan_cost(card), Prop::Any, vec![]); offer!(p);
            if let Some(a) = self.cat.clustered[r] { let p = self.mk(Op::IndexScan(r), index_scan_cost(card), Prop::Order(a), vec![]); offer!(p); }
        } else {
            for i in 0..self.groups[g].exprs.len() {
                let e = self.groups[g].exprs[i];
                let (lc, rc) = (self.groups[e.l].card, self.groups[e.r].card);
                let (llb, rlb) = (self.groups[e.l].lb, self.groups[e.r].lb);
                if req == Prop::Any {
                    let op = hash_cost(lc, rc, card);
                    if op + llb + rlb <= bound {
                        if let Some(pl) = self.optimize(e.l, Prop::Any, bound - op - rlb) {
                            if let Some(pr) = self.optimize(e.r, Prop::Any, bound - op - pl.cost) { let p = self.mk(Op::HashJoin, op + pl.cost + pr.cost, Prop::Any, vec![pl, pr]); offer!(p); }
                        }
                    }
                }
                for k in self.cat.connecting(self.groups[e.l].set, self.groups[e.r].set) {
                    if req != Prop::Any && req != Prop::Order(k) { continue; }       // a merge join delivers exactly its key's order
                    let op = merge_cost(lc, rc, card);
                    if op + llb + rlb <= bound {
                        if let Some(pl) = self.optimize(e.l, Prop::Order(k), bound - op - rlb) {
                            if let Some(pr) = self.optimize(e.r, Prop::Order(k), bound - op - pl.cost) { let p = self.mk(Op::MergeJoin(k), op + pl.cost + pr.cost, Prop::Order(k), vec![pl, pr]); offer!(p); }
                        }
                    }
                }
            }
        }
        // enforcer: sort the cheapest unordered plan
        if let (Prop::Order(a), true) = (req, self.cfg.enforcers) {
            if self.cat.has_attr(set, a) {
                let sc = sort_cost(card);
                if sc <= bound {
                    if let Some(inner) = self.optimize(g, Prop::Any, bound - sc) { let p = self.mk(Op::Sort(a), inner.cost + sc, Prop::Order(a), vec![inner]); offer!(p); }
                }
            }
        }
        let w = match &best { Some(p) => Win::Found(p.clone()), None => Win::Failed(limit) };
        // a bounded failure is only valid for that bound; an unbounded search that found a plan is exact
        self.groups[g].win.insert(req, w);
        best
    }

    pub fn root(&mut self) -> usize { let all = (1u64 << self.cat.g.n) - 1; self.group(all) }
}

/// Optimize the whole query for a required output order.
pub fn plan(cat: &Catalog, req: Prop, cfg: Config) -> (Option<Rc<Plan>>, Stats) {
    let mut m = Memo::new(cat, cfg);
    let root = m.root();
    let p = m.optimize(root, req, f64::INFINITY);
    (p, m.stats.clone())
}

/// Reference optimizer: bottom-up dynamic programming over (relation set, order) with the same prices and no memo,
/// no rules and no pruning. The oracle the Cascades implementation is checked against.
pub fn reference(cat: &Catalog, req: Prop) -> f64 {
    let n = cat.g.n;
    let g = &cat.g;
    let ne = cat.edges.len();
    let size = 1usize << n;
    let (mut any, mut ord) = (vec![f64::INFINITY; size], vec![f64::INFINITY; size * ne.max(1)]);
    for set in 1u64..size as u64 {
        if !g.connected(set) { continue; }
        let s = set as usize;
        let card = g.card_of(set);
        let mut merge_best = vec![f64::INFINITY; ne];
        if set.count_ones() == 1 {
            let r = set.trailing_zeros() as usize;
            any[s] = scan_cost(card);
            if let Some(a) = cat.clustered[r] { any[s] = any[s].min(index_scan_cost(card)); merge_best[a] = index_scan_cost(card); }
        } else {
            let mut sub = (set - 1) & set;
            while sub != 0 {
                let other = set ^ sub;
                if g.connected(sub) && g.connected(other) && g.neighbors(sub) & other != 0 {
                    let (cs, co) = (g.card_of(sub), g.card_of(other));
                    any[s] = any[s].min(any[sub as usize] + any[other as usize] + hash_cost(cs, co, card));       // `sub` builds, `other` probes
                    for e in cat.connecting(sub, other) {
                        let c = ord[sub as usize * ne + e] + ord[other as usize * ne + e] + merge_cost(cs, co, card);
                        merge_best[e] = merge_best[e].min(c);
                        any[s] = any[s].min(c);
                    }
                }
                sub = (sub - 1) & set;
            }
        }
        for e in 0..ne { if cat.has_attr(set, e) { ord[s * ne + e] = merge_best[e].min(any[s] + sort_cost(card)); } }
    }
    let all = size - 1;
    match req { Prop::Any => any[all], Prop::Order(e) => ord[all * ne + e] }
}
```
