heading = "Units at each boundary"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Boundary</th> <th>Unit</th> <th>Rust type (Cairn)</th> <th>BusTub type</th> </tr> </thead> <tbody> <tr> <td>Disk manager ↔ buffer pool</td> <td>8 KiB page</td> <td><code>[u8; PAGE_SIZE]</code>, <code>PageId(u32)</code></td> <td><code>char[BUSTUB_PAGE_SIZE]</code>, <code>page_id_t</code></td> </tr> <tr> <td>Buffer pool ↔ access methods</td> <td>pinned, latched frame</td> <td><code>ReadPageGuard&lt;'_&gt;</code>, <code>WritePageGuard&lt;'_&gt;</code></td> <td><code>ReadPageGuard</code>, <code>WritePageGuard</code></td> </tr> <tr> <td>Access methods ↔ executor</td> <td>tuple + record id</td> <td><code>Tuple { data: Vec&lt;u8&gt; }</code>, <code>Rid { page, slot }</code></td> <td><code>Tuple</code>, <code>RID</code></td> </tr> <tr> <td>Executor ↔ executor</td> <td>one tuple, or a batch</td> <td><code>Option&lt;Result&lt;(Tuple, Rid)&gt;&gt;</code> / <code>RecordBatch</code></td> <td><code>bool Next(Tuple*, RID*)</code></td> </tr> <tr> <td>Planner ↔ optimizer ↔ executor</td> <td>plan node tree</td> <td><code>Arc&lt;PlanNode&gt;</code> enum</td> <td><code>AbstractPlanNodeRef</code></td> </tr> <tr> <td>Client ↔ server</td> <td>rows over the wire</td> <td>pgwire <code>DataRow</code> messages</td> <td>—</td> </tr> </tbody> </table></div>
