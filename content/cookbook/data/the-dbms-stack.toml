title = "The DBMS stack"
module = "Databases"
module_order = 8
chapter = "Foundations and SQL"
chapter_order = 1
order = 311
kind = "guide"
lede = "One query's path from SQL text to bytes on disk, and back · the map every later section refers to"
origin = "Database systems guide"

[[sections]]
heading = "Overview"
body = """
<p>A disk-oriented relational DBMS is a stack of layers. Each layer offers the one above it an abstraction that hides a hard problem. The executor thinks in tuples and doesn't know about pages. The access methods think in pages and don't know whether a page is in memory. The buffer pool thinks in frames and doesn't know what a page contains. Transactions and recovery cut across all of them.</p>

<figure class="cb-g-fig"><svg viewBox="0 0 880 560" role="img" aria-label="DBMS layer diagram"> <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cb-g-acc"></path></marker></defs> <g font-size="13"> <rect x="20" y="14" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="41">SQL text  →  Parser  →  AST</text><text x="430" y="41" class="cb-g-mut" font-size="11">sql_parser / hand-written</text> <rect x="20" y="70" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="97">Binder  →  bound AST (names → catalog OIDs, types)</text> <rect x="20" y="126" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="153">Planner  →  logical plan tree</text> <rect x="20" y="182" width="560" height="44" rx="6" class="cb-g-boxa"></rect><text x="36" y="209">Optimizer  →  physical plan (rules + cost + join order)</text> <rect x="20" y="238" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="265">Execution engine  (Volcano iterators / vectors / pipelines)</text> <rect x="20" y="294" width="270" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="321">Table heap (slotted pages)</text> <rect x="310" y="294" width="270" height="44" rx="6" class="cb-g-box"></rect><text x="326" y="321">Indexes (B+Tree, hash)</text> <rect x="20" y="350" width="560" height="44" rx="6" class="cb-g-boxa"></rect><text x="36" y="377">Buffer pool manager  (page table · replacer · page guards)</text> <rect x="20" y="406" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="433">Disk scheduler  →  Disk manager  (pread/pwrite · io_uring)</text> <rect x="20" y="462" width="560" height="44" rx="6" class="cb-g-box"></rect><text x="36" y="489">Files on disk  (db file · WAL file)</text> <rect x="610" y="182" width="250" height="100" rx="6" class="cb-g-box"></rect><text x="626" y="206">Transaction manager</text><text x="626" y="228" class="cb-g-mut" font-size="11">timestamps · watermark</text><text x="626" y="246" class="cb-g-mut" font-size="11">2PL lock manager or MVCC</text><text x="626" y="264" class="cb-g-mut" font-size="11">undo logs · validation</text> <rect x="610" y="294" width="250" height="100" rx="6" class="cb-g-box"></rect><text x="626" y="318">Log manager</text><text x="626" y="340" class="cb-g-mut" font-size="11">WAL records · LSNs</text><text x="626" y="358" class="cb-g-mut" font-size="11">group commit · flushedLSN</text><text x="626" y="376" class="cb-g-mut" font-size="11">pageLSN ≤ flushedLSN rule</text> <rect x="610" y="406" width="250" height="100" rx="6" class="cb-g-box"></rect><text x="626" y="430">Recovery (ARIES)</text><text x="626" y="452" class="cb-g-mut" font-size="11">analysis · redo · undo</text><text x="626" y="470" class="cb-g-mut" font-size="11">fuzzy checkpoints · CLRs</text> <rect x="610" y="14" width="250" height="156" rx="6" class="cb-g-box"></rect><text x="626" y="38">Catalog</text><text x="626" y="60" class="cb-g-mut" font-size="11">tables · schemas · indexes</text><text x="626" y="78" class="cb-g-mut" font-size="11">statistics (histograms,</text><text x="626" y="96" class="cb-g-mut" font-size="11">NDV sketches, MCVs)</text><text x="626" y="126" class="cb-g-mut" font-size="11">used by binder, planner,</text><text x="626" y="144" class="cb-g-mut" font-size="11">optimizer, executors</text> <line x1="580" y1="260" x2="608" y2="232" class="cb-g-lna" marker-end="url(#ah)"></line> <line x1="580" y1="372" x2="608" y2="344" class="cb-g-lna" marker-end="url(#ah)"></line> <line x1="735" y1="394" x2="735" y2="404" class="cb-g-lna" marker-end="url(#ah)"></line> </g></svg><figcaption class="cb-g-figcap">Highlighted: the two layers everything else leans on most. The optimizer decides how much work there is; the buffer pool decides how much of it becomes I/O.</figcaption></figure>
"""

[[sections]]
heading = "Test oracles by layer"
body = """
<p>Every layer has a natural oracle, a way to know the right answer without trusting your own code. Tests attach there.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Layer</th> <th>Oracle</th> <th>Test style</th> <th>Cairn location</th> </tr> </thead> <tbody> <tr> <td>Parser</td> <td>Round-trip: <code>parse(print(parse(s))) == parse(s)</code>; sqlparser-rs as a differential reference</td> <td>Golden files (<code>insta</code>), proptest over generated ASTs</td> <td><code>crates/relational/src/sql/</code></td> </tr> <tr> <td>Binder / planner</td> <td>Expected plan text (<code>EXPLAIN</code>)</td> <td>Golden plan snapshots</td> <td><code>binder/</code>, <code>planner/</code></td> </tr> <tr> <td>Optimizer</td> <td>The unoptimized plan's <em>results</em>; the optimized plan must return the same rows</td> <td>Differential: every query runs with rules on and off</td> <td><code>optimizer/</code></td> </tr> <tr> <td>Executors</td> <td>SQLite / DuckDB / PostgreSQL results for the same query and data</td> <td>sqllogictest <code>.slt</code> files, same format as BusTub's <code>test/sql/</code></td> <td><code>tests/sql/*.slt</code></td> </tr> <tr> <td>B+Tree / hash index</td> <td><code>std::collections::BTreeMap</code> / <code>HashMap</code> as the model</td> <td>Model-based proptest: random op sequences, compare after each</td> <td><code>storage/index/</code></td> </tr> <tr> <td>Buffer pool</td> <td>A map of page contents you wrote; nothing read back may differ</td> <td>Stress threads + checksums in page bodies; <code>loom</code> for the latch protocol</td> <td><code>buffer/</code></td> </tr> <tr> <td>Replacer</td> <td>A brute-force reference policy (O(n) scan)</td> <td>Differential proptest over random access traces</td> <td><code>buffer/</code></td> </tr> <tr> <td>Disk manager</td> <td>A <code>Vec&lt;[u8; PAGE]&gt;</code> in memory</td> <td>Crash injection: a fault-injecting <code>DiskManager</code> behind a trait</td> <td><code>storage/disk/</code></td> </tr> <tr> <td>Transactions</td> <td>A serial execution of the same history</td> <td>History checkers (Elle-style) for anomalies; deterministic schedulers</td> <td><code>concurrency/</code></td> </tr> <tr> <td>Recovery</td> <td>The committed-transaction set at crash time</td> <td>Kill at every log-write point, recover, compare</td> <td><code>recovery/</code></td> </tr> </tbody> </table></div>

<aside data-call="testing"><b>Testing</b><p>Design every component around a <strong>trait at its I/O boundary</strong> from the start: <code>DiskManager</code>, <code>Clock</code>, <code>Rng</code>, <code>Network</code>. That one decision gives you in-memory tests, crash injection, deterministic simulation (Part VI), and the WebAssembly build (Track W) at no extra cost. It is the same discipline FoundationDB and TigerBeetle credit for their reliability.</p></aside>
"""

