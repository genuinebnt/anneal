heading = "Window functions"
body = """
<p>The BusTub spec: <code>PARTITION BY</code>, <code>ORDER BY</code>, aggregates as window functions, and <code>RANK()</code>; no explicit frames. Implementation (per window call):</p>

<ol> <li>Compute each row's <strong>partition key</strong> and <strong>order key</strong>.</li> <li>Sort row <em>indices</em> by (partition, order keys), stably: the input rows themselves are not moved.</li> <li>Walk each partition, grouping <strong>peers</strong> (rows with equal order keys):<ul> <li><code>ROW_NUMBER</code>: position in the partition (1-based). <code>RANK</code>: 1 + the number of rows <em>before</em> the peer group. <code>DENSE_RANK</code>: the peer group's ordinal.</li> <li><strong>Aggregates with <code>ORDER BY</code></strong>: the default frame is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>, so a running aggregate where <strong>peers share the value</strong> (include all peers before reporting). <code>SUM(x) OVER (ORDER BY t)</code> with ties on <code>t</code> shows the <em>same</em> running total on all tied rows.</li> <li><strong>Aggregates without <code>ORDER BY</code></strong>: the whole partition's value on every row.</li> </ul> </li> <li>Write each result back by the row's <strong>original index</strong>, then append one column per window call to the input row.</li> </ol>

:::deeper Window executor: partition, peer groups, rank, running aggregates
```rust title="src/execution/window.rs"
// ---------------- window functions ---------------------------------------------------------------------
pub fn window(calls: &[WinCall], rows: Vec<Row>) -> Result<Vec<Row>> {
    let mut extra: Vec<Vec<Value>> = vec![];
    for c in calls {
        let pk: Vec<Vec<Value>> = rows.iter().map(|r| c.partition_by.iter().map(|e| e.eval(r)).collect::<Result<_>>()).collect::<Result<_>>()?;
        let ok: Vec<Vec<Value>> = rows.iter().map(|r| c.order_by.iter().map(|(e, _)| e.eval(r)).collect::<Result<_>>()).collect::<Result<_>>()?;
        let mut order: Vec<usize> = (0..rows.len()).collect();
        order.sort_by(|&a, &b| {                                   // stable: ties keep input order
            pk[a].cmp(&pk[b]).then_with(|| {
                for (i, (_, asc)) in c.order_by.iter().enumerate() {
                    let o = ok[a][i].cmp(&ok[b][i]);
                    if o != std::cmp::Ordering::Equal { return if *asc { o } else { o.reverse() }; }
                }
                std::cmp::Ordering::Equal
            })
        });
        let mut out = vec![Value::Null; rows.len()];
        let agg = match c.f { WinFn::Agg(f) => Some(Agg { f, arg: c.arg.clone(), distinct: false }), _ => None };
        let mut i = 0;
        while i < order.len() {
            let mut j = i;
            while j < order.len() && pk[order[j]] == pk[order[i]] { j += 1; }          // partition [i, j)
            let mut st = agg.as_ref().map(AggState::new);
            let (mut k, mut dense) = (i, 0i64);
            if c.order_by.is_empty() {
                if let (Some(a), Some(s)) = (&agg, &mut st) {
                    for &r in &order[i..j] { s.update(a, &rows[r])?; }
                    let v = s.finish(a);
                    for &r in &order[i..j] { out[r] = v.clone(); }
                } else { return err("ranking window functions require ORDER BY".into()); }
            } else {
                while k < j {
                    let mut l = k;
                    while l < j && ok[order[l]] == ok[order[k]] { l += 1; }              // peer group [k, l)
                    dense += 1;
                    if let (Some(a), Some(s)) = (&agg, &mut st) { for &r in &order[k..l] { s.update(a, &rows[r])?; } }
                    for (pos, &r) in order[k..l].iter().enumerate() {
                        out[r] = match c.f {
                            WinFn::RowNumber => Value::Int((k + pos - i + 1) as i64),
                            WinFn::Rank => Value::Int((k - i + 1) as i64),
                            WinFn::DenseRank => Value::Int(dense),
                            WinFn::Agg(_) => st.as_ref().unwrap().finish(agg.as_ref().unwrap()),   // RANGE frame: peers share the value
                        };
                    }
                    k = l;
                }
            }
            i = j;
        }
        extra.push(out);
    }
    Ok(rows.into_iter().enumerate().map(|(i, mut r)| { for e in &extra { r.push(e[i].clone()); } r }).collect())
}
```
:::

```text title="SQLite agrees (differential test, NULL-free partition/order keys)"
SELECT name, RANK() OVER (PARTITION BY dept ORDER BY salary DESC), DENSE_RANK() OVER (...)
SELECT name, SUM(salary) OVER (PARTITION BY dept ORDER BY id), SUM(salary) OVER (PARTITION BY dept)
RANK() OVER over 20k rows, 100 partitions: 5.1 ms
```

<aside data-call="warning"><b>The classic window bugs</b><ul> <li>Computing <code>RANK</code> as the row's position instead of the position of its <strong>peer group's first row</strong>: ties must share a rank and leave a gap after.</li> <li>Applying <code>ROWS</code> semantics where <code>RANGE</code> is the default: with ties, a running sum differs between the two.</li> <li>Sorting rows themselves and forgetting the original order: a window function must not reorder the query's output rows (the result is a <em>relation</em>, but users still expect to see their <code>ORDER BY</code> applied last, and <code>ORDER BY</code> runs after windows).</li> <li><code>PARTITION BY</code> NULLs: all NULLs form one partition (grouping equality).</li> </ul></aside>
"""
