```rust title="src/execution/sort.rs"
// ---------------- blocking operators (pipeline breakers) -------------------------------------------
struct Blocking<'e> { child: Option<Boxed<'e>>, f: Option<Box<dyn FnOnce(Vec<Row>) -> Result<Vec<Row>> + 'e>>, out: std::vec::IntoIter<Row> }
fn blocking<'e>(child: Boxed<'e>, f: impl FnOnce(Vec<Row>) -> Result<Vec<Row>> + 'e) -> Boxed<'e> {
    Box::new(Blocking { child: Some(child), f: Some(Box::new(f)), out: vec![].into_iter() })
}
impl Exec for Blocking<'_> {
    fn next(&mut self) -> Result<Option<Tuple>> {
        if let Some(mut c) = self.child.take() {
            let mut rows = vec![];
            while let Some(tp) = c.next()? { rows.push(tp.vals); }
            self.out = (self.f.take().unwrap())(rows)?.into_iter();
        }
        Ok(self.out.next().map(t))
    }
}

pub fn sort_rows(order: &[(Expr, bool)], rows: Vec<Row>, top: Option<usize>) -> Result<Vec<Row>> {
    let mut keyed: Vec<(Vec<Value>, Row)> = rows.into_iter().map(|r| Ok((order.iter().map(|(e, _)| e.eval(&r)).collect::<Result<_>>()?, r))).collect::<Result<_>>()?;
    let cmp = |a: &(Vec<Value>, Row), b: &(Vec<Value>, Row)| {
        for (i, (_, asc)) in order.iter().enumerate() {
            let o = a.0[i].cmp(&b.0[i]);                       // NULL sorts as the largest value (PostgreSQL semantics)
            if o != std::cmp::Ordering::Equal { return if *asc { o } else { o.reverse() }; }
        }
        std::cmp::Ordering::Equal
    };
    match top {
        None => keyed.sort_by(cmp),                            // stable
        Some(n) => {
            // Top-N: keep a buffer of ≤ 2n candidates, trimming by sort. O(N log n) overall.
            let mut buf: Vec<(Vec<Value>, Row)> = Vec::with_capacity(2 * n + 1);
            for item in keyed { buf.push(item); if buf.len() >= 2 * n.max(1) { buf.sort_by(cmp); buf.truncate(n); } }
            buf.sort_by(cmp);
            buf.truncate(n);
            keyed = buf;
        }
    }
    Ok(keyed.into_iter().map(|(_, r)| r).collect())
}
```
:::

<aside data-call="rust"><b>Reverse ordering for a min-heap, with a tie-break</b><p><code>BinaryHeap</code> pops the <strong>largest</strong> item, so <code>Ord</code> for the merge item is <code>cmp(...).then(src.cmp(...)).reverse()</code>: the smallest key, then the earliest run, pops first. Writing a custom <code>Ord</code> for a struct that borrows its comparison data (<code>order: &amp;'o [(Expr, bool)]</code>) needs a lifetime on the struct, and <code>PartialEq</code>/<code>PartialOrd</code> implemented <em>in terms of</em> <code>Ord</code> to keep the four traits consistent. (An inconsistent <code>PartialOrd</code> and <code>Ord</code> silently breaks <code>BinaryHeap</code> and <code>sort</code>.) Reference: <a href="https://doc.rust-lang.org/std/cmp/trait.Ord.html" target="_blank" rel="noreferrer"><code>std::cmp::Ord</code></a>.</p></aside>
"""

[[sections]]
heading = "Limit and top-N"
body = """
<p><code>Limit</code> skips <code>offset</code> rows and stops pulling from its child after <code>limit</code>, so a <code>LIMIT 10</code> over a scan reads about ten tuples, which is the biggest single benefit of the pull model (<a href="/cookbook/p/query-execution">L13</a>). The optimizer rewrites <code>Limit(Sort(x))</code> into <code>Limit(TopN(x))</code>: the top-N keeps at most <code>n = limit + offset</code> rows. The reference buffers up to <code>2n</code> candidates and trims by sorting, giving O(N log n) time and O(n) memory; a binary heap of size n is the textbook version. For N = 20 000 and n = 10:</p>

```text title="ORDER BY v DESC, id LIMIT 10 over 20k rows"
Sort + Limit   3.83 ms
TopN           2.80 ms     (and O(10) memory instead of O(20,000))
```
"""

