heading = "Sort"
body = """
<p>Two implementations behind one plan node, chosen by <code>work_mem</code>:</p>

<ul> <li><strong>In-memory sort</strong> (<code>sort_rows</code>): compute the sort keys once per row, stable sort with a comparator that applies <code>ASC</code>/<code>DESC</code> per key. <strong>NULL sorts as the largest value</strong> (PostgreSQL: last for <code>ASC</code>, first for <code>DESC</code>). SQLite and MySQL treat NULL as smallest; a differential test against them must avoid sorting on nullable columns or normalize.</li> <li><strong>External merge sort</strong> (<a href="/cookbook/p/sorting-and-aggregation">L11</a>): pass 0 sorts <code>budget</code> rows at a time and writes each as a <strong>run</strong> (a spill file); each merge pass combines up to <code>fanin</code> runs through a heap of one row per run, writing a longer run; stop at one run. Runs carry their sort keys in front of the row so merging doesn't re-evaluate expressions, and the keys are stripped at the end.</li> </ul>

<p>Stability matters: SQL doesn't promise it, but an engine whose <code>ORDER BY</code> output changes between runs is painful to test. Stable sort within runs, plus <strong>ties broken by run index</strong> in the merge heap (runs are produced in input order), makes the external sort produce <em>exactly</em> the same sequence as the in-memory one, which the tests rely on.</p>

:::deeper External merge sort: run generation, k-way merge with a heap, page freeing
```rust title="src/execution/external_merge_sort.rs"
// ---------------- external merge sort -----------------------------------------------------------------------
pub struct ExternalSort<'e> { out: std::vec::IntoIter<Row>, child: Option<Boxed<'e>>, bpm: &'e Bpm, order: Vec<(Expr, bool)>, budget: usize, fanin: usize }

impl<'e> ExternalSort<'e> {
    pub fn new(bpm: &'e Bpm, child: Boxed<'e>, order: Vec<(Expr, bool)>, budget: usize) -> Self {
        ExternalSort { out: vec![].into_iter(), child: Some(child), bpm, order, budget: budget.max(2), fanin: 8 }
    }
    fn cmp(order: &[(Expr, bool)], a: &[Value], b: &[Value]) -> Ordering {
        for (i, (_, asc)) in order.iter().enumerate() {
            let o = a[i].cmp(&b[i]);
            if o != Ordering::Equal { return if *asc { o } else { o.reverse() }; }
        }
        Ordering::Equal
    }
    /// Sort rows as (sort keys ++ row) so spilled runs carry their keys; strip them at the end.
    fn sort_chunk(&self, chunk: Vec<Row>) -> Result<Vec<Row>> {
        let mut keyed: Vec<Row> = chunk.into_iter().map(|r| { let mut k = keys(&self.order.iter().map(|o| o.0.clone()).collect::<Vec<_>>(), &r)?; k.extend(r); Ok(k) }).collect::<Result<_>>()?;
        let n = self.order.len();
        keyed.sort_by(|a, b| Self::cmp(&self.order, &a[..n], &b[..n]));                  // stable
        Ok(keyed)
    }
    fn run(&mut self) -> Result<()> {
        let mut child = self.child.take().unwrap();
        let n = self.order.len();
        // Pass 0: sorted runs of `budget` rows.
        let mut runs: Vec<SpillFile> = vec![];
        let mut chunk: Vec<Row> = vec![];
        let mut first_run_only: Option<Vec<Row>> = None;
        while let Some(t) = child.next()? {
            chunk.push(t.vals);
            if chunk.len() >= self.budget {
                let sorted = self.sort_chunk(std::mem::take(&mut chunk))?;
                let mut w = SpillWriter::new(self.bpm);
                for r in &sorted { w.push(r)?; }
                runs.push(w.finish()?);
            }
        }
        if runs.is_empty() { first_run_only = Some(self.sort_chunk(chunk)?); }       // everything fit: no I/O at all
        else if !chunk.is_empty() {
            let sorted = self.sort_chunk(chunk)?;
            let mut w = SpillWriter::new(self.bpm);
            for r in &sorted { w.push(r)?; }
            runs.push(w.finish()?);
        }
        if let Some(rows) = first_run_only { self.out = rows.into_iter().map(|r| r[n..].to_vec()).collect::<Vec<_>>().into_iter(); return Ok(()); }
        // Merge passes: combine up to `fanin` runs into one until a single run remains.
        while runs.len() > 1 {
            let mut next = vec![];
            let mut it = runs.into_iter().peekable();
            while it.peek().is_some() {
                let group: Vec<SpillFile> = it.by_ref().take(self.fanin).collect();
                next.push(self.merge(group)?);
            }
            runs = next;
        }
        let last = runs.pop().unwrap();
        let rows: Vec<Row> = last.iter(self.bpm).map(|r| r.map(|r| r[n..].to_vec())).collect::<Result<_>>()?;
        last.free(self.bpm);
        self.out = rows.into_iter();
        Ok(())
    }
    fn merge(&self, group: Vec<SpillFile>) -> Result<SpillFile> {
        struct Item<'o> { row: Row, src: usize, order: &'o [(Expr, bool)] }
        impl PartialEq for Item<'_> { fn eq(&self, o: &Self) -> bool { self.cmp(o) == Ordering::Equal } }
        impl Eq for Item<'_> {}
        impl PartialOrd for Item<'_> { fn partial_cmp(&self, o: &Self) -> Option<Ordering> { Some(self.cmp(o)) } }
        impl Ord for Item<'_> {
            fn cmp(&self, o: &Self) -> Ordering {
                let n = self.order.len();
                // BinaryHeap is a max-heap: reverse so the smallest key (then the earliest run) pops first.
                ExternalSort::cmp(self.order, &self.row[..n], &o.row[..n]).then(self.src.cmp(&o.src)).reverse()
            }
        }
        let mut iters: Vec<_> = group.iter().map(|f| f.iter(self.bpm)).collect();
        let mut heap = BinaryHeap::new();
        for (i, it) in iters.iter_mut().enumerate() { if let Some(r) = it.next() { heap.push(Item { row: r?, src: i, order: &self.order }); } }
        let mut w = SpillWriter::new(self.bpm);
        while let Some(Item { row, src, .. }) = heap.pop() {
            w.push(&row)?;
            if let Some(r) = iters[src].next() { heap.push(Item { row: r?, src, order: &self.order }); }
        }
        drop(iters);
        for f in group { f.free(self.bpm); }
        w.finish()
    }
}

impl Exec for ExternalSort<'_> {
    fn next(&mut self) -> Result<Option<Tuple>> {
        if self.child.is_some() { self.run()?; }
        Ok(self.out.next().map(|vals| Tuple { vals, rid: None }))
    }
}
```
