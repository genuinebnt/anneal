"""

[[sections]]
heading = "Nested index join"
body = """
<p>If the right side is a base table with an <strong>index on the join column</strong>, skip the scan: for each left row, evaluate the key expression and probe the index, then fetch the matching heap tuple by RID. Cost: <code>M + m × C</code> with C ≈ one tree descent (<a href="/cookbook/p/join-algorithms">L12</a>). Because the index is <strong>unique</strong>, a probe returns at most one row, so one left row produces at most one output row. A non-unique index would loop over a posting list.</p>

<p>The optimizer produces this plan only when the pattern fits (one equality key, a bare scan of an indexed column on the right); otherwise a hash join takes over. NULL keys must not probe: <code>index_key(NULL)</code> is <code>None</code> and falls straight to the unmatched path.</p>

:::deeper Nested index join
```rust title="src/execution/nested_index_join.rs"
struct NijExec<'e, 'a> { left: Boxed<'e>, heap: &'e crate::storage::table::table_heap::TableHeap<'a, ArcReplacer>, layout: &'e Layout, tree: &'e crate::storage::index::b_plus_tree::BPlusTree<'a, ArcReplacer>,
    key: Expr, residual: Option<Expr>, kind: JoinKind, rw: usize }
impl Exec for NijExec<'_, '_> {
    fn next(&mut self) -> Result<Option<Tuple>> {
        // One output row per call is enough because the inner side is a UNIQUE index: ≤ 1 match per probe.
        loop {
            let Some(l) = self.left.next()? else { return Ok(None) };
            let kv = self.key.eval(&l.vals)?;
            let mut hit: Option<Row> = None;
            if let Some(k) = index_key(&kv) {
                if let Some(v) = self.tree.get(k)? {
                    if let Some((meta, bytes)) = self.heap.get(unpack(v))? {
                        if !meta.deleted {
                            let joined: Row = l.vals.iter().cloned().chain(self.layout.decode(&bytes)).collect();
                            if ok_pred(&self.residual, &joined)? { hit = Some(joined); }
                        }
                    }
                }
            }
            match hit {
                Some(j) => return Ok(Some(t(j))),
                None if self.kind == JoinKind::Left => return Ok(Some(t(l.vals.into_iter().chain(nulls(self.rw)).collect()))),
                None => continue,
            }
        }
    }
}
```
:::

```text title="join strategies on the same query · 3k ⋈ 3k equijoin · Apple M4 Pro"
NestedLoopJoin      281.9 ms
HashJoin              0.98 ms     ← ~290×: O(m·n) became O(m + n)
NestedIndexJoin       0.93 ms     ← same as hash here: both tables are tiny and in memory
```
"""
