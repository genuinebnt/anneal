title = "Contributing to a database"
module = "Appendices"
module_order = 15
chapter = "Courses, reading and glossary"
chapter_order = 1
order = 690
kind = "guide"
lede = "Choosing a project · the first contribution · what each project asks of you (read from their own pages) · reviews, tests and the cost of a patch to a maintainer · a six-week plan"
origin = "Database systems guide"

[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A contribution is a cost to the maintainers before it is a benefit.</strong> Someone must read it, run it, think about its edge cases and carry it for years. The patches that are accepted are small, tested, explain themselves, and fix something the project has said it wants. The sections of this guide that end with "found by mutation" or "killed by the oracle" are practice for exactly the discipline maintainers ask for: a test that fails without your change and passes with it.</li> <li><strong>Start by using and reading, not by writing.</strong> Run the project's tests. Build it from source. Read the code path of one query. Read recent merged pull requests (or committed patches) to see what a reviewer asks for. Read open issues to see what the project wants. Most first contributions that succeed are a fixed bug with a regression test, a missing test, a documentation correction, or a small feature that was already agreed in an issue.</li> <li><strong>Projects differ more in process than in code.</strong> Some take pull requests on GitHub with a bot checking a license agreement; one reviews patches on a mailing list in rounds called commitfests; one does not accept outside patches at all. Reading the project's own contribution page first saves a rejected patch and a bruised afternoon.</li> <li><strong>Review is a contribution, and the best way in.</strong> Reading someone else's patch, running it and reporting what you found is welcome in every project and teaches the code faster than writing your own. PostgreSQL goes further: its patch guide says that submitters should review other patches in return.</li> <li><strong>Say what you used.</strong> Several projects now state a policy on machine-generated code (DuckDB asks not to submit pull requests generated by AI; DataFusion requires that the author understands the change end to end). Read the policy, follow it, and be able to explain every line you send.</li> </ul>
"""

[[sections]]
heading = "What each project says about itself"
body = """
<p>The notes below were read from each project's own contribution page when this section was written. They are a starting point, not a substitute for the page; the projects change their processes.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Project</th> <th>Language</th> <th>How changes are submitted</th> <th>What the page asks for</th> </tr> </thead> <tbody> <tr> <td><strong>PostgreSQL</strong></td> <td>C</td> <td>Patches by e-mail to the <code>pgsql-hackers</code> mailing list; added to a <strong>CommitFest</strong> that is a periodic review round; no pull requests</td> <td>Discuss a non-trivial design first on the list; follow the coding conventions; send <code>git format-patch</code> output, versioned (v1, v2…), with tests and documentation, and a note whether it is work in progress; expect several versions; the guide asks submitters to review other patches in return</td> </tr> <tr> <td><strong>SQLite</strong></td> <td>C</td> <td><strong>Not open to outside patches</strong></td> <td>The project states that it is "open-source, not open-contribution": it does not accept patches from people who have not submitted an affidavit dedicating the contribution to the public domain, and may rewrite a patch from scratch. Read the code; report bugs</td> </tr> <tr> <td><strong>DuckDB</strong></td> <td>C++</td> <td>Pull requests from a fork</td> <td>Search the issues, discuss intended changes with the core team on GitHub; keep pull requests small; tests in the <strong>sqllogictest</strong> format are strongly preferred; <code>make format-fix</code>; all unit tests and CI must pass; a stated policy against pull requests generated by AI</td> </tr> <tr> <td><strong>Apache DataFusion</strong></td> <td>Rust</td> <td>Pull requests to <code>main</code></td> <td>Start from issues labelled <code>good-first-issue</code>; comment <code>take</code> on an issue to claim it; run <code>./dev/rust_lint.sh</code>; end-to-end sqllogictest-style tests preferred; a committer triggers CI for new contributors; Conventional Commits; keep PRs focused (under about 500 lines where possible); AI-assisted contributions require that the author understands the change</td> </tr> <tr> <td><strong>RocksDB</strong></td> <td>C++</td> <td>Pull requests</td> <td>A <strong>Contributor License Agreement</strong> with Facebook (now Meta), signed once for all its open-source projects; the page itself says little else, so read <code>README</code>, <code>DEVELOPMENT.md</code> and the wiki</td> </tr> <tr> <td><strong>TiKV</strong></td> <td>Rust</td> <td>Pull requests linked to an issue</td> <td>"Help wanted" issues by difficulty; open an issue to discuss before a large change; <code>make dev</code> for format, lint and tests; <strong>sign every commit</strong> (<code>git commit -s</code>, a Developer Certificate of Origin check); Slack for questions</td> </tr> <tr> <td><strong>ClickHouse</strong></td> <td>C++</td> <td>Pull requests</td> <td>First-time contributors accept the ClickHouse <strong>Individual CLA</strong>; follow the C++ style guide and testing documentation; read the project's AI policy</td> </tr> </tbody> </table></div>

<p>Other projects worth reading through the same lens, whose pages were not checked for this section: Apache Arrow, CockroachDB, TimescaleDB, Vitess, Velox, Polars, SurrealDB, Qdrant, Milvus, LanceDB, Materialize. Check each page before you act.</p>
"""

[[sections]]
heading = "A first contribution, step by step"
body = """
<ol> <li><strong>Pick the project by what you can run.</strong> You need to build it and run its tests on your machine in under an hour. Prefer a project in a language you already read.</li> <li><strong>Find a task that the project wants.</strong> An issue with a maintainer's comment is better than an idea of yours. Good first tasks: a failing edge case in a query with an error message that is wrong; a test for behaviour that is documented but untested; a missing case in a <code>match</code>; a documentation example that does not run; a benchmark that regressed.</li> <li><strong>Reproduce it before you change anything.</strong> Write the failing test first. A pull request that begins with a failing test and ends with it passing is half-reviewed already.</li> <li><strong>Make the smallest change that fixes it.</strong> Resist cleanups in the same change. Match the surrounding style rather than yours.</li> <li><strong>Run the project's full checks locally</strong>: formatting, lints, the tests, and any benchmark that the change could move.</li> <li><strong>Write the description for a reader who has not seen the issue</strong>: what was wrong, how you know (the test), what you changed, what you did not.</li> <li><strong>Respond to review the same week.</strong> A review comment is a gift of attention. Answer every one, even to say you disagree and why.</li> <li><strong>When it is merged, take the next one.</strong> The second contribution is faster than the first, and the third is trusted.</li> </ol>
"""

[[sections]]
heading = "What this guide gives you for it"
body = """
<ul> <li><strong>Reading code with a mental model.</strong> The buffer pool, B+Tree, MVCC, recovery, optimizer and Raft sections each build the mechanism small enough to hold in your head; the same mechanism in a production engine is the same structure with more cases.</li> <li><strong>Testing habits.</strong> Oracles (<a href="/cookbook/p/testing-a-database">Testing</a>), a seed-replayable simulation (<a href="/cookbook/p/deterministic-simulation">Simulation</a>), mutation runs, and measurements that name the machine, are the practices that maintainers of a database most want from a patch.</li> <li><strong>A way to find something real.</strong> In this guide's own engine, fuzzing found that a deeply nested expression crashed the process by overflowing the stack, and a long <code>IN</code> list did the same; a differential test against SQLite found nothing. Both outcomes are what contributors to production engines meet: some tools find bugs, some do not, and the report is the same either way, a minimal reproduction.</li> </ul>
"""

[[sections]]
heading = "Six weeks, a plan"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Week</th> <th>Do</th> <th>Done when</th> </tr> </thead> <tbody> <tr> <td>1</td> <td>Build the project, run its tests, read <code>CONTRIBUTING</code>, read ten merged changes</td> <td>you can say what a good change looks like here</td> </tr> <tr> <td>2</td> <td>Follow one query (or one write) through the code with a debugger or logging; write down the path</td> <td>a diagram you could explain to someone</td> </tr> <tr> <td>3</td> <td>Pick an issue; reproduce it; comment on the issue with your finding</td> <td>the issue has your reproduction</td> </tr> <tr> <td>4</td> <td>Write the failing test, then the fix</td> <td>a branch with a test that fails before and passes after</td> </tr> <tr> <td>5</td> <td>Open the pull request; answer review</td> <td>all comments answered</td> </tr> <tr> <td>6</td> <td>Review someone else's change, with a result you ran</td> <td>one useful review posted</td> </tr> </tbody> </table></div>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Do not start with a large feature.</strong> A project that has not agreed to it will not merge it, and a month of work is lost. Propose in an issue or on the list first.</li> <li><strong>Do not argue style.</strong> Follow the formatter and the conventions of the file.</li> <li><strong>Do not hide test failures.</strong> Say what fails and what you tried.</li> <li><strong>Do not claim a benchmark win without the method.</strong> State hardware, data, repetitions and variance (<a href="/cookbook/p/benchmarking">Benchmarking</a>).</li> <li><strong>Respect licences and agreements.</strong> A CLA or DCO sign-off is a legal statement about your right to contribute the code; do not contribute code you copied from elsewhere or wrote for an employer without permission.</li> <li><strong>Do not send code you cannot explain.</strong> Whatever tools helped, you are the one asked in review.</li> </ul></aside>
"""
