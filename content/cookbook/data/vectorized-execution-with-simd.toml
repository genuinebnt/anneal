[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Vectorization (data parallelism)</strong> turns a scalar loop that processes one pair of operands into one that processes many at once with <strong>SIMD</strong> (single instruction, multiple data) registers. Ideal speedup is large (32 cores × 4-wide = 128×), real end-to-end gains are far smaller: only part of a query is vectorizable and materialization costs remain. Still essential for OLAP.</li> <li><strong>SIMD basics</strong>: keep data <strong>in registers as long as possible</strong>, use data-movement (load/store, even cache-bypassing), arithmetic/logic/comparison ops, and flush only when necessary. <strong>Vertical</strong> vectorization (the same operation on different elements per lane) is the common and widely useful form; <strong>horizontal</strong> (reducing across lanes, e.g. SUM) is rarer.</li> <li><strong>Three implementation routes</strong>: <strong>auto-vectorization</strong> (the compiler recognizes simple loops; conservative: possible pointer overlap or data-dependent control flow stops it); <strong>compiler hints</strong> (<code>restrict</code>, ignore-dependency pragmas: <em>you</em> guarantee safety); <strong>explicit intrinsics</strong> (portable only through a layer such as Google Highway; usually fastest but not the fewest lines). Kersten et al. (VLDB 2018): <strong>hand-written SIMD beats scalar by 10–130% for individual operators, but end to end it is barely 10% faster</strong> because only a small part of a query vectorizes. The pragmatic middle: let the compiler auto-vectorize with hints, hand-tune what is left.</li> <li><strong>AVX-512 added the primitives that make database kernels natural</strong>: <strong>masking</strong> (almost every op can be predicated per lane), <strong>permute</strong>, <strong>selective load/store</strong> (move only the mask-selected lanes), <strong>compress</strong> (pack selected lanes contiguously: a selection vector in one instruction), <strong>expand</strong>, <strong>selective gather/scatter</strong> (index-vector loads and stores). Caveats: the extension is <strong>split into groups</strong> that CPUs implement partially (check exactly what exists), and some CPUs <strong>downclock</strong> under heavy AVX-512, so some systems stay on AVX2.</li> <li><strong>Vectorized DBMS algorithms</strong> (Polychroniou et al., SIGMOD 2015): favour <strong>vertical</strong> vectorization; <strong>maximize lane utilization</strong>: process unique data items per lane and avoid computing on tuples already known invalid. <strong>Selection scans</strong>: compare, get a mask, update the selection, stop early if the whole vector is dead.</li> <li><strong>Relaxed Operator Fusion (ROF)</strong> (Menon, Mowry, Pavlo, VLDB 2017): inside a compiled pipeline some lanes carry tuples disqualified earlier, so SIMD is under-used. ROF <strong>splits the pipeline into stages with artificial pipeline breakers</strong> and cache-resident buffers: a stage runs until its buffer is full of <em>valid</em> tuples before the next stage starts. Also makes <strong>software prefetching</strong> simple (operators that prefetch start a new stage; group prefetching fits naturally).</li> <li><strong>Vector refill</strong> (AVX-512): <em>buffered</em> (stage results in extra registers within the operator and keep looping until lanes are full) vs <em>partial</em> (buffer under-utilized vectors and return to the previous operator for the next vector; needs careful bookkeeping). Few systems do either: complexity and overhead.</li> <li><strong>Hash tables</strong>: linear probing needs arbitrary memory accesses. <strong>Horizontal</strong>: several keys per bucket, compare one probe key against all with one SIMD compare (empty slots waste lanes). <strong>Vertical</strong>: one probe key <em>per lane</em>, <strong>gather</strong> the table slots, replace lanes that matched, advance the others by one (nearly full utilization). Vertical wins mostly, but <strong>both degrade to scalar speed when the table exceeds the cache</strong>.</li> <li><strong>Histogram/partitioning</strong>: scatter-increment conflicts when two lanes hit the same bucket, so <strong>replicate the histogram per lane</strong> and add the replicas afterwards.</li> </ul>
"""

