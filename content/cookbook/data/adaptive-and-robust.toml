```

<ul> <li><strong>Minimax buys the tail and pays in the middle.</strong> At σ = 2 (typical error 4×) the worst case drops from 14.2× to 6.1× and p90 from 2.43× to 2.17×; the median rises from 1.08× to 1.19× and the share within 1.2× falls from 57% to 52%. At σ = 1 the tail improves (max 4.07× to 2.70×) at a small cost (within 1.2×: 71% against 74%); at σ = 0.5 it changes almost nothing.</li> <li><strong>Averaging scenarios is not robust</strong>: the mean-cost choice stays close to the point estimate (the largest difference is p90 2.15× against 2.43× at σ = 2, with the same 14.2× worst case), plausibly because a mean is dominated by the central scenarios while the damage sits in the corners.</li> <li><strong>Paranoia has a price.</strong> Minimax with <code>u = 1</code> when the estimates are exact loses 11 points of "within 1.2×" (75% against 86%): it avoids plans that are best in the central scenario but risky at the corners. The uncertainty <code>u</code> has to come from measurements of the estimator's error (<a href="/cookbook/p/cardinality-estimation">Q8</a>), not from fear.</li> <li><strong>Reading</strong>: robust choice is worth it when the cost of a bad plan is far larger than the cost of a slightly worse typical plan (interactive dashboards with an SLA, queries that can run for hours), and not for a workload of cheap queries.</li> </ul>

