[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>If estimates cannot be fixed ahead of time, move the decision to when the information exists.</strong> <a href="/cookbook/p/statistics">Q7</a> and <a href="/cookbook/p/cardinality-estimation">Q8</a> showed that errors of 10× to 1000× survive any estimator that stays in the optimizer. There are three moments to act on that: <strong>before</strong> execution (choose a plan that tolerates the error), <strong>during</strong> execution (observe the truth and change course), and <strong>after</strong> (remember what happened for the next query).</li> <li><strong>The lecture's taxonomy</strong> (15-721 S2024 #15): <em>static</em> optimization picks the plan before execution and lives or dies by the cost model; <em>dynamic</em> optimization chooses as the query runs (flexible, hard to debug, non-deterministic); <em>adaptive</em> optimization compiles a plan, detects bad estimates during execution, and then either <strong>modifies future invocations</strong> (plan correction, feedback into the statistics catalog, <strong>reversion</strong> to an earlier plan that was faster, <strong>plan stitching</strong> of the best sub-plans of past plans), <strong>replans the current invocation</strong> (start over, or keep the intermediates already computed; Quickstep's lookahead information passing computes Bloom filters on dimension tables first and probes them with fact tuples to decide the join order), or inserts <strong>plan pivot points</strong> (a <code>CHOOSE</code> node that switches a nested-loop join to a hash join when the data turns out larger, or <em>proactive re-optimization</em> with bounding boxes on the uncertainty). The experiments below measure one tool from each group.</li> <li><strong>A materialized intermediate result is a free checkpoint.</strong> At a <strong>pipeline breaker</strong> (a hash build, a sort, a shuffle) the operator already holds all of its input, so its exact size is known at no extra cost. Mid-query re-optimization (Kabra and DeWitt 1998; progressive optimization, POP, in DB2: Markl et al. 2004) compares the observed size with the estimate and, if the plan chosen is no longer sensible, re-plans the <em>rest</em> of the query with the exact number, reusing the materialized result.</li> <li><strong>A validity range makes the check cheap.</strong> POP annotates each checkpoint with the range of cardinalities in which the chosen plan stays optimal (computed by a sensitivity analysis of the plan's cost against its alternatives). Staying inside the range costs nothing; leaving it triggers re-optimization. The threshold trades the benefit of a better plan against the cost of re-planning and of throwing away pipelined work.</li> <li><strong>Adaptive operators decide at the last moment, inside one plan.</strong> An <em>adaptive join</em> buffers the first rows of its build side and chooses hash join or index nested-loop join according to how many rows arrive (SQL Server, Oracle adaptive plans); a <em>runtime broadcast switch</em> turns a shuffle join into a broadcast join when a side turns out to be small (Spark's adaptive query execution, which re-optimizes at every stage boundary). <em>Eddies</em> route every tuple through the operators individually, the ultimate adaptivity at a per-tuple price few systems pay.</li> <li><strong>Robust plans are chosen for the worst case, not the average.</strong> Instead of the plan with the lowest estimated cost, pick the one whose cost is acceptable across a <em>set</em> of plausible cardinalities (minimax regret), run a <strong>bouquet</strong> of plans with a cost budget doubling each round, or use an operator that degrades gracefully (a <em>smooth scan</em> that morphs from an index probe to a sequential scan as the number of matches grows). Robustness has a price: a slightly worse plan when the estimates are right.</li> <li><strong>Feedback learns the systematic part of the error.</strong> LEO (DB2) compares estimated and observed cardinalities of executed plans and stores adjustment factors; Oracle's SQL plan directives remember a misestimate and request sampling next time. This repairs a consistent <em>bias</em> (the optimizer is always 8× low on this predicate) but not random noise, and it suffers from <strong>selection bias</strong>: the plan you run is the one whose estimate was too optimistic, so you only learn about the intermediates of plans you chose.</li> <li><strong>Make the plan space flatter instead.</strong> <em>Lookahead information passing</em> (LIP; also <em>sideways information passing</em>, <em>runtime filters</em>, <em>predicate transfer</em>) builds a Bloom filter from each small input and applies it to the large inputs before the joins, so intermediate results shrink whatever the join order. The best order matters less because the worst order is not so bad. Yannakakis' algorithm does the same exactly for acyclic queries: semijoin-reduce first, then join, for a running time linear in input plus output.</li> </ul>
"""

[[sections]]
heading = "The lab"
body = """
<p>The chain-join lab of <a href="/cookbook/p/cost-models">Q9</a> again, with the same calibrated cost model and measured plan times: 36 random queries, 40–55 plans each, every plan timed. A strategy chooses a plan from <em>noisy</em> estimates (the true cardinalities times <code>exp(bias + σ·N(0,1))</code>), the plan it ends up running is looked up in the timing table, and the score is its slowdown against the fastest plan of that query. Four experiments:</p>

<ul> <li><strong>E1 · Re-optimization.</strong> Choose with the estimates, run the first join, observe its true output size, and if the estimate was off by more than a threshold, re-choose the algorithm of the second join with the observed size (and the final estimate rescaled by the same factor). Threshold ∞ is "never", 1 is an adaptive join.</li> <li><strong>E2 · Robust choice.</strong> Evaluate every plan in all 27 combinations of {÷e&#94;u, ×1, ×e&#94;u} for the three intermediate sizes and pick the plan with the lowest <em>worst</em> cost (minimax) or <em>mean</em> cost.</li> <li><strong>E3 · Feedback.</strong> Learn, from the first <code>k</code> executions, the mean log ratio of observed to estimated size per intermediate and multiply later estimates by it. Compare two executors: one that reports only the intermediates its plan computed, and one that reports all three.</li> <li><strong>E4 · Lookahead filters.</strong> Build Bloom filters of <code>R.a</code> and <code>T.b</code>, drop the rows of <code>S</code> that cannot match, then run the hash-only plans, with the filter construction inside the timed region. First on the random queries, then on <strong>adversarial</strong> chains where one join order explodes.</li> </ul>

:::deeper Reference: plan choice, mid-query re-optimization, robust choice, execution feedback, Bloom filter, lookahead-filtered hash plans
```rust title="src/opt/adaptive.rs"
//! Adaptive and robust query execution, on the chain-join lab of `cost`: mid-query re-optimization at a pipeline breaker,
//! robust plan choice over a set of cardinality scenarios, learning a multiplicative correction from execution feedback,
//! and lookahead information passing (Bloom-filter pre-filtering) that makes the join order matter less.
use std::time::Instant;
use crate::cost::*;

// ----------------------------------------------------------------------------------------------- plan choice

/// The plan with the lowest model cost for the given cardinalities.
pub fn choose(model: &dyn CostModel, sizes: (f64, f64, f64), plans: &[Plan], cards: &[f64; 3]) -> Plan {
    *plans.iter().min_by(|a, b| model.plan(&shapes_of(sizes, a, cards), a).partial_cmp(&model.plan(&shapes_of(sizes, b, cards), b)).unwrap()).unwrap()
}

/// q-error of an estimate against what was observed (both clamped to one row).
pub fn q_err(est: f64, obs: f64) -> f64 { let (e, o) = (est.max(1.0), obs.max(1.0)); (e / o).max(o / e) }

/// Mid-query re-optimization. The first join runs as planned and is materialized, so its true output size is known. If
/// the estimate was off by more than `threshold` (a q-error), the remaining decision (the algorithm of the second join) is
/// re-made with the observed size, and the final-result estimate is rescaled by the same factor. Returns the plan that
/// actually executes. `threshold = 1.0` re-plans always (an *adaptive join*); `f64::INFINITY` never.
pub fn reoptimize(model: &dyn CostModel, sizes: (f64, f64, f64), plans: &[Plan], est: &[f64; 3], observed_first: f64, chosen: Plan, threshold: f64) -> Plan {
    let first = if chosen.st_first { 1 } else { 0 };
    if q_err(est[first], observed_first) <= threshold { return chosen; }
    let scale = observed_first.max(1.0) / est[first].max(1.0);
    let mut cards = *est;
    cards[first] = observed_first;
    cards[2] = (est[2] * scale).max(1.0);
    let rest: Vec<Plan> = plans.iter().copied().filter(|p| p.st_first == chosen.st_first && p.a1 == chosen.a1).collect();
    choose(model, sizes, &rest, &cards)
}

#[derive(Clone, Copy, Debug, PartialEq)]
pub enum Robust { /// minimize the worst cost over the scenarios
    Minimax, /// minimize the average cost over the scenarios
    Mean }

/// Robust choice: every cardinality may be off by a factor `exp(±u)`; evaluate each plan in all 27 combinations of
/// {÷e^u, 1, ×e^u} for the three intermediate sizes and take the worst or the mean.
pub fn choose_robust(model: &dyn CostModel, sizes: (f64, f64, f64), plans: &[Plan], est: &[f64; 3], u: f64, mode: Robust) -> Plan {
    let f = [(-u).exp(), 1.0, u.exp()];
    let mut scenarios = vec![];
    for a in f { for b in f { for c in f { scenarios.push([(est[0] * a).max(1.0), (est[1] * b).max(1.0), (est[2] * c).max(1.0)]); } } }
    let score = |p: &Plan| {
        let costs = scenarios.iter().map(|c| model.plan(&shapes_of(sizes, p, c), p));
        match mode { Robust::Minimax => costs.fold(0.0, f64::max), Robust::Mean => costs.sum::<f64>() / scenarios.len() as f64 }
    };
    *plans.iter().min_by(|a, b| score(a).partial_cmp(&score(b)).unwrap()).unwrap()
}

/// Execution feedback: after each run the executor reports the observed cardinalities; the optimizer keeps the running mean
/// of `ln(observed / estimated)` per intermediate and multiplies later estimates by its exponential. This corrects a
/// *systematic* bias (the estimator is always 8x low) and cannot correct noise (it is 8x low or 8x high at random).
#[derive(Default, Clone)]
pub struct Feedback { sum: [f64; 3], n: [u32; 3] }
impl Feedback {
    /// `seen[i]` says whether the executed plan produced intermediate `i` (a plan computes only one of RS, ST and the final result).
    pub fn observe(&mut self, est: &[f64; 3], obs: &[f64; 3], seen: [bool; 3]) {
        for i in 0..3 { if seen[i] { self.sum[i] += obs[i].max(1.0).ln() - est[i].max(1.0).ln(); self.n[i] += 1; } }
    }
    pub fn correct(&self, est: &[f64; 3]) -> [f64; 3] {
        [0, 1, 2].map(|i| if self.n[i] == 0 { est[i] } else { (est[i].max(1.0) * (self.sum[i] / self.n[i] as f64).exp()).max(1.0) })
    }
    pub fn runs(&self) -> u32 { self.n.iter().copied().max().unwrap_or(0) }
}

// ----------------------------------------------------------------------------------------------- lookahead information passing

/// A Bloom filter over `u32` keys with two probes per key: no false negatives, false positives about
/// `(1 - e^(-2n/m))^2`. Sized at 16 bits per key (about 1.4% false positives).
pub struct Bloom { bits: Vec<u64>, mask: u64 }
fn mix(k: u32) -> u64 { let z = (k as u64 ^ 0x9E37_79B9_7F4A_7C15).wrapping_mul(0xBF58_476D_1CE4_E5B9); z ^ (z >> 31) }
impl Bloom {
    pub fn new(keys: usize) -> Self {
        let nbits = (keys.max(1) * 16).next_power_of_two().max(64);
        Bloom { bits: vec![0; nbits / 64], mask: nbits as u64 - 1 }
    }
    #[inline] fn positions(&self, k: u32) -> (u64, u64) { let h = mix(k); (h & self.mask, (h >> 32) & self.mask) }
    pub fn insert(&mut self, k: u32) { let (a, b) = self.positions(k); self.bits[(a >> 6) as usize] |= 1 << (a & 63); self.bits[(b >> 6) as usize] |= 1 << (b & 63); }
    #[inline] pub fn contains(&self, k: u32) -> bool {
        let (a, b) = self.positions(k);
        self.bits[(a >> 6) as usize] >> (a & 63) & 1 == 1 && self.bits[(b >> 6) as usize] >> (b & 63) & 1 == 1
    }
}

/// The rows of `S` that survive Bloom filters built from the keys of `R` (on `a`) and `T` (on `b`): a row that cannot match both
/// neighbours is dropped before any join sees it. `ab_order` = rows as `(a, b)`, otherwise as `(b, a)`.
pub fn lip_filter(c: &Chain, ab_order: bool) -> Vec<Row> {
    let (mut fr, mut ft) = (Bloom::new(c.r.len()), Bloom::new(c.t.len()));
    for r in &c.r { fr.insert(r.0); }
    for t in &c.t { ft.insert(t.0); }
    if ab_order { c.s_ab.iter().copied().filter(|&(a, b)| fr.contains(a) && ft.contains(b)).collect() }
    else { c.s_ba.iter().copied().filter(|&(b, a)| ft.contains(b) && fr.contains(a)).collect() }
}

/// Run a hash-only plan on the pre-filtered `S`. The filters are built and applied inside the timed region.
pub fn execute_lip(c: &Chain, p: &Plan) -> (f64, usize) {
    let hash = |a: Alg| matches!(a, Alg::HashBuildL | Alg::HashBuildR);
    assert!(hash(p.a1) && hash(p.a2), "lookahead passing is shown with hash joins");
    let t0 = Instant::now();
    let n = if p.st_first {
        let s = lip_filter(c, false);
        let x = join(&s, &c.t, p.a1, Out::LR, None, None);
        join(&x, &c.r, p.a2, Out::RL, None, None).len()
    } else {
        let s = lip_filter(c, true);
        let x = join(&c.r, &s, p.a1, Out::RL, None, None);
        join(&x, &c.t, p.a2, Out::RL, None, None).len()
    };
    (t0.elapsed().as_secs_f64(), n)
}

/// Fraction of `S` that survives both Bloom filters (how selective the pre-filter is for this query).
pub fn lip_retained(c: &Chain) -> f64 { lip_filter(c, true).len() as f64 / c.s_ab.len() as f64 }
```
:::
"""

