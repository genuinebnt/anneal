<ul> <li><strong>Feedback fixes bias.</strong> For the 8×-too-low estimator, the first three executions already bring the median from 1.17× to 1.00× and p90 from 2.27× to 1.28–1.55×; with ten executions 85–86% of the plans are within 1.2×.</li> <li><strong>It does nothing for noise.</strong> With an unbiased estimator of σ = 1.5, feedback from all three intermediates leaves the plan quality where it started (median 1.00×, p90 2.0×, 65–70% against 71%), and a run reports random errors that average out only slowly. Expect nothing from feedback on a predicate whose estimate is wrong in both directions.</li> <li><strong>Partial observations make it worse, in every scenario with noise.</strong> An executor that reports only what the executed plan computed (two of the three intermediates) gets <em>worse</em> with feedback than without it: for σ = 1.5 the median goes from 1.00× to 1.18–1.28× and the share within 1.2× from 71% to 49–54%, and for the mixed case (4.5× low, σ = 1) it stays worse until about 20 executions. Reporting all three intermediates removes most of the damage. This is consistent with selection bias: the plan that runs is the one whose estimates were optimistic, so the observed/estimated ratios are measured only where the estimator looked too good, and correcting some intermediates and not their competitors tilts every later comparison. We did not isolate the mechanism further.</li> <li><strong>One observation is the worst number of observations.</strong> For every scenario, <code>k = 1</code> with partial reporting is worse than <code>k = 0</code> (p90 up to 3.3×): a single noisy ratio is a bad correction. Feedback needs a floor on the number of observations or a shrinkage towards no correction.</li> </ul>

```text title="E4 · lookahead information passing, random queries"
