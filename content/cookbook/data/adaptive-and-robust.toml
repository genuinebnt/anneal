<ul> <li><strong>On typical queries the pre-filter is a loss.</strong> In 31 of 36 queries the filters keep under a quarter of <code>S</code>, yet the best plan with filters is a median <strong>1.87× slower</strong> than the best plan without (never faster: 0% of the queries) because the Bloom filter construction and the extra pass cost as much as the small joins they save. The spread between the slowest and fastest join order shrinks (3.0× to 2.0×) only because the fastest plan got slower, and the slowest plan with filters is 1.25× <em>slower</em> than without: plausibly this is because the blow-ups of a bad order on these queries come from many-to-many joins whose duplicates a semijoin filter cannot remove.</li> </ul>

```text title="E4b · lookahead information passing, adversarial chains"
E4b adversarial chains: each S row matches ~20 R rows but only 10% of S rows match any T row (RS-first builds a 20x intermediate; ST-first is cheap)
                                                  median     p90      max
slowest / fastest hash plan, no LIP                15.00   15.71    16.41
slowest / fastest hash plan, with LIP               2.06    2.14     2.14
fastest plan with LIP / fastest without             1.18    1.49     1.51
median plan with LIP / median plan without          0.17    0.28     0.28
slowest plan with LIP / slowest without             0.17    0.20     0.21
(fastest plain plan 0.4 ms median, fastest LIP plan 0.5 ms median)
```

<ul> <li><strong>On the shape the technique is made for, it is insurance with a small premium.</strong> When every <code>S</code> row matches about 20 <code>R</code> rows but only 10% of <code>S</code> rows match any <code>T</code> row, joining <code>R ⋈ S</code> first builds an intermediate 20× the size of <code>S</code>. Without filters the slowest join order is <strong>15.0×</strong> slower than the fastest; with filters 2.06×. The slowest plan is <strong>6× faster</strong> (0.17), and the premium is 1.18× on the best plan. The pre-filter turns "I must pick the right join order" into "any join order is acceptable".</li> <li><strong>Reading</strong>: use runtime filters where the join graph has selective, hash-joinable edges and the estimates are not trusted (star and snowflake schemas, large fact tables); skip them when joins are cheap and results are small. Systems make this decision with costs and with a cheap-to-check estimate of the filter's selectivity.</li> </ul>

<aside data-call="note"><b>Four moments, four tools</b><div class="cb-g-tt"><table> <thead> <tr> <th>moment</th> <th>tool</th> <th>fixes</th> <th>cannot fix</th> </tr> </thead> <tbody> <tr> <td>before</td> <td>robust choice, bouquets, upper-bound estimates</td> <td>variance of the error</td> <td>systematic bias; the typical plan gets slower</td> </tr> <tr> <td>during</td> <td>re-optimization at checkpoints, adaptive joins</td> <td>any error that shows up at a checkpoint</td> <td>decisions already executed; pipelined work thrown away</td> </tr> <tr> <td>during</td> <td>runtime filters, semijoin reduction</td> <td>the blow-up of a bad join order</td> <td>cheap queries (the filters cost more than they save)</td> </tr> <tr> <td>after</td> <td>feedback, plan directives</td> <td>consistent bias on repeated shapes</td> <td>noise; new query shapes; partial observations</td> </tr> </tbody> </table></div></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A strategy is a function from estimates to a plan</strong>: <code>choose</code>, <code>choose_robust</code> and <code>reoptimize</code> all take <code>&amp;dyn CostModel</code> and slices of <code>Plan</code>, so a strategy is a few lines over <code>shapes_of</code> and the model, and the experiments just loop. Keeping the plan space as a plain <code>Vec&lt;Plan&gt;</code> (not a tree of references) made "re-plan among the plans with the same first join" a one-line <code>filter</code>.</li> <li><strong><code>[bool; 3]</code> for "which intermediates did this run observe"</strong>: a fixed-size array copies for free, indexes by the same <code>0..3</code> as the cardinality array, and the feedback accumulators are plain <code>[f64; 3]</code> and <code>[u32; 3]</code>. Per-index counts matter: dividing by a global run count was a bug the tests found.</li> <li><strong>Scenario enumeration with nested loops over a <code>[f64; 3]</code></strong> of factors is more readable than a recursive product for three variables, and evaluates in microseconds; for a dozen variables sample scenarios instead of enumerating them.</li> <li><strong>A Bloom filter in 30 lines</strong>: <code>Vec&lt;u64&gt;</code> of bits, size a power of two so the position is <code>hash &amp; mask</code>, two positions from the high and low halves of one 64-bit mixed hash. <code>x &gt;&gt; (a &amp; 63) &amp; 1 == 1</code> reads a bit; the sizing rule of 16 bits per key gives about 1.4% false positives with two probes.</li> <li><strong><code>&amp;mut dyn FnMut(&amp;Chain, &amp;TimedQuery)</code></strong> lets the timing harness hand each generated chain to an extra measurement (the lookahead timing) while it exists, and then drop it: 36 chains never live in memory at once.</li> <li><strong>Seeds, not randomness, in strategies</strong>: every noise draw is an <code>Rng(seed)</code>; the results of E1–E3 can be reproduced exactly, and only the wall-clock plan timings vary between runs.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Bloom filter</strong>: every inserted key is found (no false negatives) among 100 000, and the false positive rate over keys never inserted is under 3%.</li> <li><strong>Lookahead filter against the exact semijoin</strong>: for random chains the filtered <code>S</code> contains every row that has partners on both sides and at most 5% more; every hash-only plan on the filtered input returns the true final cardinality.</li> <li><strong>Re-optimization with toy models</strong>: a model in which the winner flips with the intermediate's size shows that (1) threshold ∞ never changes the plan, (2) threshold 1 changes only the second join, (3) an estimate within the threshold keeps the plan, (4) an exact estimate keeps the plan even at threshold 1; a second model in which the cost is the <em>output size</em> shows that the final estimate is rescaled by the observed/estimated ratio of the first join and that a first join that already ran cannot change.</li> <li><strong>Robust choice</strong>: with <code>u = 0</code> it equals the point choice; for random cardinalities the minimax plan's worst-case cost is no larger than that of any other plan over the 27 scenarios.</li> <li><strong>Feedback</strong>: a biased estimator (always ÷8, small noise) is corrected to within 3% after 200 runs; a noisy unbiased one leaves the correction near 1; separate observation counts per intermediate give exact corrections for unequal counts; no observations means no correction.</li> <li><strong>Mutants run against these tests</strong>: minimax takes the best case instead of the worst (killed); feedback divides by the global run count (<strong>survived the first tests, killed by the unequal-count test</strong>); the Bloom filter tests with OR instead of AND, or sets only one bit (killed); the pre-filter ignores one of its two filters, in either row order (a filter changes only speed, so the cardinality test alone cannot see it; <strong>killed by the comparison with the exact semijoin</strong>); re-optimization forgets to rescale the final estimate, or re-plans the first join too (<strong>both survived the first toy model, killed by the output-size model</strong>).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Spark</strong> (3.0+): <em>adaptive query execution</em> re-optimizes at every shuffle-stage boundary using the actual shuffle statistics: coalesces small partitions, switches a sort-merge join to a broadcast join when a side turns out to be small, and splits skewed partitions. Materialized stages are the checkpoints.</li> <li><strong>SQL Server</strong>: <em>adaptive joins</em> (batch mode) buffer the build side and choose hash or nested loops at run time by row count; <em>memory grant feedback</em> adjusts the memory of a repeated query from its last execution; <em>interleaved execution</em> pauses to execute a part of the plan whose estimate is hardest (multi-statement table functions) and re-plans with the true count.</li> <li><strong>Oracle</strong>: <em>adaptive plans</em> put statistics collectors in the plan and switch nested loops to hash joins (and back) at run time; <em>automatic reoptimization</em> re-plans the next execution using what the first learned; <em>SQL plan directives</em> store a misestimate so the next parse samples or creates extended statistics.</li> <li><strong>IBM Db2</strong>: LEO (the original feedback optimizer) and progressive optimization with validity ranges and CHECK operators.</li> <li><strong>PostgreSQL</strong>: no mid-query re-planning in the core; plan quality is fixed by statistics (<a href="/cookbook/p/statistics">Q7</a>, <a href="/cookbook/p/cardinality-estimation">Q8</a>) and by extensions such as pg_hint_plan and learned-feedback extensions.</li> <li><strong>Runtime filters</strong> are everywhere in analytical engines: Bloom and min/max filters built from the hash-join build side and pushed to the probe-side scan (Impala, Trino's dynamic filtering, Spark's bloom-filter joins, SQL Server's bitmap filters in batch mode, Oracle's join filters). Zone maps (<a href="/cookbook/p/columnar-formats-and-nested-data">A12</a>) make a pushed-down min/max range skip whole row groups.</li> <li><strong>Research prototypes</strong> with strong results: plan bouquets (robust execution by repeated budgeted plans), smooth scan (a robust access path), predicate transfer (a Yannakakis-style reduction pass before joins), and learned query optimizers with execution feedback (Bao, Neo).</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Plan instability.</strong> Re-optimizing and feedback change plans between runs; users and test suites that expect a fixed plan will report it as a bug. Log every re-plan with the reason, and offer a way to pin plans.</li> <li><strong>Wasted work.</strong> Abandoning a pipeline mid-execution discards what it has done; place checkpoints where the intermediate is materialized anyway, and charge the restart cost in the threshold.</li> <li><strong>Selection bias in feedback.</strong> You only observe what the chosen plan computes, and that plan is the one the estimator liked. Observe the intermediates of competing plans cheaply (a sample, a sketch) or shrink the correction.</li> <li><strong>Feedback on one query is a guess.</strong> A single observation corrects noise as eagerly as bias (the <code>k = 1</code> rows). Aggregate over query templates and weigh by the number of observations.</li> <li><strong>Robustness is not free.</strong> Minimax with too wide an uncertainty (<code>u = 1</code> at zero error) cost 11 points of near-optimal plans. Estimate <code>u</code> from the observed q-error distribution of the estimator.</li> <li><strong>Filters have a break-even point.</strong> A Bloom filter pass costs about as much as a small hash join; apply runtime filters when the probe side is large and the filter is selective, and measure the filter's actual selectivity at run time to turn it off when it keeps most rows.</li> <li><strong>Adaptive operators need their own tests</strong>: the interesting inputs are the ones at the switch point (the row count where the adaptive join changes algorithm); test just below, at, and just above it, and prove both branches return the same bag.</li> <li><strong>Re-optimization must preserve semantics</strong>: a re-planned remainder must read the materialized intermediate with the same ordering and duplicate semantics the old plan promised, and side effects (writes, sequence values) must not run twice.</li> </ul></aside>
