sigma = 1                   never                1.00    1.56     3.32     71%            0%
sigma = 1                   4                    1.00    1.55     2.65     76%            8%
sigma = 1                   2                    1.00    1.37     2.65     78%           16%
sigma = 1                   always (adaptive join)   1.00    1.37     2.65     79%           22%
sigma = 2                   never                1.17    2.43     9.01     56%            0%
sigma = 2                   4                    1.03    2.01     6.08     68%           27%
sigma = 2                   2                    1.03    2.01     6.08     71%           37%
sigma = 2                   always (adaptive join)   1.00    2.01     6.08     71%           40%
8x too low + sigma 0.5      never                1.27    2.52     7.06     45%            0%
8x too low + sigma 0.5      4                    1.00    1.36     2.52     78%           49%
8x too low + sigma 0.5      2                    1.00    1.32     2.49     80%           51%
8x too low + sigma 0.5      always (adaptive join)   1.00    1.32     2.49     80%           51%
true cardinalities          (oracle)             1.00    1.26     1.55     86%
```

<ul> <li><strong>Re-optimization repairs a biased estimator almost completely.</strong> When the optimizer is 8× too low (the Q8 pattern), the static choice has median 1.27× and p90 2.52×, within 1.2× in 45% of the cases; re-planning the second join after seeing the first join's true size gives median 1.00×, p90 1.32× and 80% within 1.2×, close to the 86% of an optimizer with true cardinalities. It changes the plan in about half of the runs.</li> <li><strong>With random errors it helps less but never hurts</strong>: at σ = 2 the median goes from 1.17× to 1.00–1.03×, p90 from 2.43× to 2.01×, max from 9.0× to 6.1×. It re-plans in 27–40% of the runs.</li> <li><strong>The gap that remains is the first decision.</strong> After the first join only the second join's algorithm can still change; the join order and the first algorithm are sunk. At σ = 2 the p90 stays at 2.0× (true cardinalities: 1.26×). Re-optimization is a safety net for later decisions, which is why systems place checkpoints early and often.</li> <li><strong>Threshold: 2 behaves like "always".</strong> A threshold of 4 gives up some of the benefit (σ = 1: p90 1.55× against 1.37×). Here re-planning is free because every intermediate is materialized anyway; in a pipelined engine each re-plan can discard work, which is what the threshold is for.</li> </ul>

