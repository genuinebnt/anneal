heading = "Measured"
body = """
<p>The oracle is independent of the compiler: a small interpreter evaluates the same random pipeline directly on in-memory rows with SQL's three-valued logic (NULL comparisons, <code>AND</code>/<code>OR</code>, aggregates over NULLs, a group for the empty input of a keyless aggregate). Each random pipeline (a join of <code>t(a,b,c)</code> with <code>u(k,v)</code>, <code>WHERE</code>/<code>EXTEND</code> steps, an optional aggregation with <code>GROUP BY</code> and later filters, an optional projection, a total <code>ORDER BY</code>, sometimes a <code>LIMIT</code>) is compiled and executed three ways: the flat SQL on the Part I engine, and the flat and the nested SQL on SQLite; all three must equal the oracle.</p>

```text title="one query three ways, 600 random pipelines, compile speed, and a dialect difference"
the same query, three ways
pipe:   FROM t |> JOIN u ON a = k |> WHERE b > 0 |> EXTEND a * v AS av |> AGGREGATE SUM(av) AS total, COUNT(*) AS n GROUP BY c |> WHERE total > 20 |> ORDER BY total DESC, c |> LIMIT 3
flat:   SELECT (c) AS c, SUM(((a) * (v))) AS total, COUNT(*) AS n FROM t JOIN u ON (a) = (k) WHERE ((b) > 0) GROUP BY (c) HAVING ((SUM(((a) * (v)))) > 20) ORDER BY (SUM(((a) * (v)))) DESC, ((c)) LIMIT 3
nested: SELECT c, total, n FROM (SELECT c, total, n FROM (SELECT (c) AS c, SUM((av)) AS total, COUNT(*) AS n FROM (SELECT a, b, c, k, v, (a) * (v) AS av FROM (SELECT a, b, c, k, v FROM (SELECT a, b, c, k, v FROM (SELECT a, b, c FROM t) AS s2 JOIN u ON (a) = (k)) AS s3 WHERE (b) > 0) AS s4) AS s5 GROUP BY (c)) AS s6 WHERE (total) > 20) AS s7 ORDER BY (total) DESC, (c) LIMIT 3
engine returned 2 row(s) for it; sqlite returned 2 row(s)
2000 of 2000 generated pipelines (mean 5.5 stages) parse and compile both ways in 15.2 us each; the flat SQL averages 204 characters, the nested form 314 characters with 4.1 subquery levels
ORDER BY a over (1, NULL, 0): engine [Some(0), Some(1), None], sqlite [None, Some(0), Some(1)]
600 random pipelines agreed on all three executions (129 used HAVING, 207 LIMIT, 185 JOIN)
```

<ul> <li><strong>600 random pipelines agreed on all three executions</strong> (129 used <code>HAVING</code>, 207 <code>LIMIT</code>, 185 <code>JOIN</code>), run on fresh random data in 150 data sets. The checks cover the engine's SQL support, SQLite's, the substitution logic and the three-valued-logic corner cases at once; an error in any of them would fail a specific pipeline, which the test prints.</li> <li><strong>The flat form is shorter and the nested form deeper</strong>: over 2 000 generated pipelines of 5.5 stages on average, the flat SQL averages <strong>204 characters</strong>, the nested form <strong>314</strong> with <strong>4.1 subquery levels</strong>. The Part I engine cannot run the nested form at all (it has no derived tables), which is why the flat back end exists; production engines flatten nested forms with subquery-merging rewrites (<a href="/cookbook/p/plan-transformations-and-rule-soundness">Q3</a>), and the flat form is what they would produce.</li> <li><strong>Compilation is cheap</strong>: 15 µs per pipeline for both forms (parse, scope check, substitution); a front end is not a performance concern, the plan's quality is.</li> <li><strong>A dialect difference surfaced</strong>: <code>ORDER BY a</code> over <code>(1, NULL, 0)</code> returns <code>[0, 1, NULL]</code> on the Part I engine and <code>[NULL, 0, 1]</code> on SQLite (PostgreSQL also places NULLs last for ascending order, SQLite and MySQL first). The oracle takes the NULL placement as a parameter; a transpiler has to emit <code>NULLS FIRST</code>/<code>NULLS LAST</code> (or avoid depending on the order) to be portable.</li> <li><strong>Refusals are part of the design</strong>: <code>… |&gt; ORDER BY a |&gt; LIMIT 3 |&gt; WHERE b &gt; 0</code>, a second <code>AGGREGATE</code>, and a <code>JOIN</code> after <code>AGGREGATE</code> have no single-block form; the compiler says why (a subquery is needed) instead of generating wrong SQL, and the nested back end expresses them.</li> </ul>

<aside data-call="note"><b>Why the constant guard exists</b><p><code>EXTEND 7 AS seven |&gt; ORDER BY seven</code> substitutes to <code>ORDER BY (7)</code>. In standard SQL an integer literal in <code>ORDER BY</code> or <code>GROUP BY</code> is a <em>position in the select list</em>, so the generated query sorted by column 7 (and SQLite reported "2nd ORDER BY term out of range"). The compiler now emits <code>((7) + 0)</code>, an expression that is not a bare literal. It is the kind of bug a transpiler has and a hand-written query never has, found only because the random pipelines included constant definitions.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A tiny tokenizer instead of a regex</strong>: <code>Tok::Ident</code> and <code>Tok::Other</code> are enough to substitute names without touching string literals, function names or keywords; the compiler never needs a full expression parser because it only rewrites <em>identifiers</em>.</li> <li><strong><code>Result&lt;String, String&gt;</code> for compiler errors with context</strong>: each error names the stage or the identifier and lists what is in scope; tests assert on substrings (<code>"not in scope"</code>, <code>"subquery"</code>), which keeps messages free to improve.</li> <li><strong>Environments as <code>HashMap&lt;String, String&gt;</code></strong> (name → definition text) rebuilt per stage by <code>env(&amp;cols)</code>; the <code>cols: Vec&lt;(String, String)&gt;</code> keeps the visible columns in order, which <code>SELECT *</code>-style output relies on. <code>iter_mut().find</code> updates a redefined column in place.</li> <li><strong>Scoped helper closures</strong> (<code>let env = |cols: &amp;[(String, String)]| …</code>) avoid borrowing <code>self</code> and keep the compiler a free function over a <code>Vec&lt;Stage&gt;</code>; stages are a plain enum, so the two back ends are two <code>match</code>es over it.</li> <li><strong>Differential testing as a Rust test</strong>: random pipelines are an enum (<code>Op</code>) that prints to pipe text <em>and</em> evaluates directly, so the oracle and the system under test share nothing but the generator; <code>std::process::Command</code> pipes a script to <code>sqlite3</code> and the harness parses its output.</li> <li><strong>Batching external processes</strong>: one <code>sqlite3</code> invocation runs four queries separated by <code>SELECT '--'</code> marker lines, an order of magnitude faster than a process per query.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Parser and compiler (unit)</strong>: the typical pipeline parses to nine stages and the flat SQL contains <code>JOIN</code>, <code>WHERE</code>, <code>GROUP BY</code>, <code>HAVING</code>, <code>ORDER BY … DESC</code>, <code>LIMIT</code> and no subquery, the nested form at least seven; out-of-scope columns, unknown tables, a pipeline not starting with <code>FROM</code> and unknown stages are errors; stages the flat form cannot express return the reason while the nested form compiles them.</li> <li><strong>Substitution</strong>: definitions are parenthesized, function names and keywords and string literals are untouched, qualified names are rejected, splitting at commas ignores commas inside parentheses and strings.</li> <li><strong>Constants</strong>: bare integers in <code>ORDER BY</code>/<code>GROUP BY</code> are rewritten to expressions; expressions are not.</li> <li><strong>Limits, strings, blocks</strong>: two limits give the smaller; <code>|&gt;</code> inside a literal does not split; <code>ORDER BY</code> and its <code>LIMIT</code> stay in one nested block while <code>LIMIT</code> followed by <code>ORDER BY</code> becomes two.</li> <li><strong>Random differential test</strong>: 150 data sets × 4 pipelines = 600 pipelines, each compared with the oracle on the engine (flat), SQLite (flat) and SQLite (nested), with coverage floors on <code>HAVING</code>, <code>LIMIT</code> and <code>JOIN</code>.</li> <li><strong>Mutants run against these tests</strong>: <code>WHERE</code> after <code>AGGREGATE</code> staying a <code>WHERE</code>; substituted definitions losing their parentheses; the constant guard removed; <code>ORDER BY</code> direction inverted; the <code>GROUP BY</code> clause dropped; <code>JOIN</code> columns not entering scope; <code>SELECT</code> not narrowing the scope; a second <code>AGGREGATE</code> or a <code>WHERE</code> after <code>LIMIT</code> silently allowed; the nested <code>EXTEND</code> dropping its column (all killed). Three mutants <strong>survived the random pipelines</strong> and were killed by dedicated tests: <code>LIMIT</code> taking the larger of two limits and <code>|&gt;</code> splitting inside a string (the generator emits neither), and the nested form separating <code>ORDER BY</code> from its <code>LIMIT</code> (SQLite happens to keep the order, so only a structural assertion can see it).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Google (BigQuery/GoogleSQL, ZetaSQL)</strong> introduced the <code>|&gt;</code> pipe operator inside SQL (VLDB 2024): any query can continue with <code>|&gt; WHERE</code>, <code>|&gt; EXTEND</code>, <code>|&gt; AGGREGATE … GROUP BY</code>, <code>|&gt; JOIN</code> and so on, interoperating with ordinary SQL; implemented in the parser and analyzer so it shares the optimizer. Other engines (Apache Spark / Databricks SQL) have since added a pipe operator.</li> <li><strong>PRQL</strong> (Rust compiler, <code>prqlc</code>) compiles a pipelined language to many SQL dialects; <strong>KQL</strong> (Kusto / Azure Data Explorer, Sentinel) is a pipe-based language with its own engine; <strong>Malloy</strong> compiles semantic models and nested queries to SQL for several databases; <strong>OxQL</strong> is Oxide's time-series query language, translated to ClickHouse SQL.</li> <li><strong>Gel</strong> (formerly EdgeDB, Python and Rust) provides a graph-relational data model and EdgeQL over PostgreSQL, compiling queries with nested result shapes to SQL; <strong>Convex</strong> runs TypeScript query and mutation functions as deterministic transactions inside the database with reactive subscriptions.</li> <li><strong>Optimizers behind the languages</strong>: Apache Pinot's multi-stage query engine (a Calcite-based planner on top of its single-stage engine), StarRocks's cost-based Cascades-style optimizer, and MariaDB's optimizer (its own long-standing engineering: histograms, subquery strategies) are the planners that receive the generated SQL; see <a href="/cookbook/p/production-optimizers">Q11</a>.</li> <li><strong>Standards</strong>: SQL/PGQ (property graph queries) and SQL:2023 additions bring some of these ideas (graph patterns, JSON) into the standard.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Generated SQL must be portable or targeted.</strong> NULL ordering, integer division, string concatenation, quoting and <code>LIMIT</code> syntax differ per dialect; pick a target dialect explicitly and test on it.</li> <li><strong>Identifier capture and scope</strong>: substitution must respect parentheses and precedence, and a name that disappeared after <code>SELECT</code> must stay an error; test with expressions that mix operators of different precedence.</li> <li><strong>Positional constants</strong> in <code>ORDER BY</code>/<code>GROUP BY</code>, aliases that shadow base columns, and ambiguous names after joins are classic transpiler bugs.</li> <li><strong>Do not promise what the backend cannot do</strong>: reject unsupported combinations at compile time with an explanation, or generate subqueries; never silently change semantics.</li> <li><strong>Ordering is not preserved by subqueries</strong> in SQL: a pipeline <code>ORDER BY … |&gt; WHERE …</code> has no standard meaning when compiled to nested SQL unless the compiler restates the ordering at the end.</li> <li><strong>Error messages</strong> should be in the user's language (pipeline stage, column), not the generated SQL's; map positions back to the source.</li> <li><strong>Debugging needs the SQL</strong>: always offer <code>EXPLAIN</code>/"show generated SQL"; users diagnose performance in the plan, not in the front end.</li> <li><strong>Semantic layers add a second source of truth</strong>: measures defined once are great until the definition is wrong; version and test them like code.</li> <li><strong>New syntax is a migration cost</strong>: adoption needs tooling (formatters, editors, linters) and coexistence with existing SQL; the pipe operator succeeded partly because it can be mixed into ordinary queries.</li> </ul></aside>
"""

[[sources]]
title = "SQL Has Problems. We Can Fix Them: Pipe Syntax In SQL"
url = "https://research.google/pubs/sql-has-problems-we-can-fix-them-pipe-syntax-in-sql/"
