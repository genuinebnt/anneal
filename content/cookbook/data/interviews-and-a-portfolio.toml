[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Interviews for database roles test four things</strong>: whether you know how the mechanisms work (B-trees, logging, MVCC, joins, consensus), whether you can reason about failure and concurrency, whether you can write correct code under time pressure, and whether you can design a system and defend the trade-offs. The questions repeat; the answers are what separate people.</li> <li><strong>The strongest answer names the invariant and the failure.</strong> "A B+Tree split keeps all leaves at one depth and every node at least half full, and a crash between writing the new sibling and updating the parent is why we log the split" beats a description of what a split does. Every section of this guide states an invariant and tests it; practise saying it.</li> <li><strong>Trade-offs have numbers.</strong> "LSM trees write faster than B-trees" is a claim; "an LSM tree turns random writes into sequential ones at the cost of read and space amplification; with size ratio 10 and 5 levels a point read may check 5 sorted runs, which bloom filters reduce" is an answer. The measured sections give you numbers from running the mechanism.</li> <li><strong>Say what you do not know, then reason.</strong> Interviewers often push past what you have memorized. A candidate who says "I haven't seen that; let me think about what must be true" and derives something close is rated above one who bluffs.</li> <li><strong>A portfolio is the answer to "show me"</strong>: a few projects with tests and measurements that a reader can run, a merged contribution, and writing that explains one mechanism. Quantity does not help; depth and honesty do.</li> </ul>
"""

[[sections]]
heading = "Forty questions, and where the answers are"
body = """
<p><strong>Storage and indexing</strong></p>

<ol> <li>Why does a database not use the operating system's page cache, and what does it use instead? — <a href="/cookbook/p/buffer-pools">L04</a>, <a href="/cookbook/p/buffer-pool-manager">P1.3</a>.</li> <li>Describe the replacement policies LRU, Clock, LRU-K and ARC; when does LRU fail? — <a href="/cookbook/p/buffer-pools">L04</a>, <a href="/cookbook/p/arc-replacer">P1.1</a>.</li> <li>How does a slotted page store variable-length tuples, and what happens on delete and update? — <a href="/cookbook/p/pages-and-tuples">L03b</a>, <a href="/cookbook/p/table-heap">1b</a>.</li> <li>B+Tree: what are the invariants, how does a split propagate, what happens on delete? — <a href="/cookbook/p/b-trees">L08</a>, <a href="/cookbook/p/search-and-insert">P2.2</a>, <a href="/cookbook/p/delete-and-tombstones">P2.3</a>.</li> <li>How do you make a B+Tree concurrent? Compare latch crabbing and optimistic lock coupling. — <a href="/cookbook/p/index-concurrency-control">L10</a>, <a href="/cookbook/p/b-tree-concurrency">P2.5</a>, <a href="/cookbook/p/concurrent-memory">Concurrent memory</a>.</li> <li>LSM tree versus B-tree: write, read and space amplification; how does compaction choose? — <a href="/cookbook/p/log-structured-storage">L05</a>, <a href="/cookbook/p/a-durable-lsm-tree">M7</a>.</li> <li>What does a Bloom filter buy, and what is its false positive rate? — <a href="/cookbook/p/filters-tries-inverted-and-vector-indexes">L09</a>.</li> <li>Row store versus column store; PAX; when is each right? — <a href="/cookbook/p/storage-models-and-compression">L06</a>, <a href="/cookbook/p/a-column-store">M3</a>.</li> <li>What is the adaptive radix tree and why is it faster than a B+Tree in memory? — <a href="/cookbook/p/tries-and-the-adaptive-radix-tree">A6</a>.</li> <li>Why is <code>fsync</code> hard, and what did PostgreSQL learn about it? — <a href="/cookbook/p/disk-i-o-fsync-the-page-cache-and-queues">I/O</a>.</li> </ol>

<p><strong>Query processing and optimization</strong> 11. Volcano versus vectorized versus compiled execution. — <a href="/cookbook/p/query-execution">L13</a>, <a href="/cookbook/p/a-vectorized-engine">M4</a>, <a href="/cookbook/p/query-compilation-and-code-generation">A15</a>. 12. Hash join, sort-merge join, nested-loop join: costs and when each wins. — <a href="/cookbook/p/join-algorithms">L12</a>, <a href="/cookbook/p/grace-hash-join-and-spilling">P3.4</a>. 13. How does a hash join spill when the build side does not fit? — <a href="/cookbook/p/grace-hash-join-and-spilling">P3.4</a>. 14. What are the steps from SQL text to results? — <a href="/cookbook/p/sql-front-end">P3.1</a>, <a href="/cookbook/p/optimizer-rules-and-the-engine">P3.6</a>. 15. How does a cost-based optimizer choose a join order, and why does it get cardinalities wrong? — <a href="/cookbook/p/cost-models-and-join-ordering">L16</a>, <a href="/cookbook/p/join-ordering">Q4</a>, <a href="/cookbook/p/cardinality-estimation">Q8</a>. 16. What is a Cascades memo and why does it help? — <a href="/cookbook/p/a-cascades-memo-in-rust">Q2</a>. 17. How do you unnest a correlated subquery? — <a href="/cookbook/p/unnesting-subqueries">Q6</a>. 18. What is a worst-case optimal join? — <a href="/cookbook/p/multi-way-and-worst-case-optimal-joins">A18</a>. 19. How would you find a wrong-result bug in an optimizer without a reference system? — <a href="/cookbook/p/testing-a-database">Testing</a>. 20. How would you detect a performance regression between two versions? — <a href="/cookbook/p/benchmarking">Benchmarking</a>.</p>

<p><strong>Transactions, recovery and distribution</strong> 21. Explain ACID and the isolation levels with the anomaly each permits. — <a href="/cookbook/p/concurrency-control-theory">L17</a>. 22. How does MVCC work, and what is garbage collection's problem? — <a href="/cookbook/p/multi-version-concurrency-control">L20</a>, <a href="/cookbook/p/mvcc-protocols-compared">A3</a>, <a href="/cookbook/p/mvcc-garbage-collection">A4</a>. 23. Snapshot isolation versus serializability: what is write skew? — <a href="/cookbook/p/transactions-on-the-key-space">M2</a>. 24. Two-phase locking: why strict, and how does a lock manager avoid or detect deadlocks? — <a href="/cookbook/p/two-phase-locking">L18</a>. 25. Describe ARIES: what do the log, the dirty page table and the transaction table do in the three recovery phases? — <a href="/cookbook/p/crash-recovery-aries">L22</a>, <a href="/cookbook/p/build-wal-and-aries">22b</a>. 26. What is group commit and why does it matter? — <a href="/cookbook/p/logging">L21</a>. 27. Explain Raft: terms, elections, log matching, commitment, and why a leader cannot commit an old-term entry by counting replicas. — <a href="/cookbook/p/raft">M8</a>. 28. How do you shard a key space, and what happens when a shard splits during a transaction? — <a href="/cookbook/p/sharding">M9</a>. 29. How does a distributed transaction commit across shards? Compare two-phase commit, Percolator and Spanner. — <a href="/cookbook/p/distributed-transactions">M10</a>, <a href="/cookbook/p/distributed-databases-i">L23</a>. 30. What does linearizable mean, and how would you test a store for it? — <a href="/cookbook/p/testing-a-database">Testing</a>. 31. What is a CRDT and what does it give up? — <a href="/cookbook/p/crdts">M11</a>.</p>

<p><strong>Systems and engineering</strong> 32. What is false sharing, and how would you see it? — <a href="/cookbook/p/rust-for-systems-code">Rust for systems</a>. 33. Explain acquire and release, and what could go wrong with a relaxed store. — <a href="/cookbook/p/rust-for-systems-code">Rust for systems</a>. 34. How do you reclaim memory in a lock-free structure? — <a href="/cookbook/p/concurrent-memory">Concurrent memory</a>. 35. How would you profile a slow query in an engine you do not know? — <a href="/cookbook/p/profiling-and-observability">Profiling</a>. 36. What is coordinated omission? — <a href="/cookbook/p/benchmarking">Benchmarking</a>. 37. How does a deterministic simulation find a distributed bug, and what must the code avoid? — <a href="/cookbook/p/deterministic-simulation">Simulation</a>. 38. What does <code>O_DIRECT</code> change, and when would you use <code>io_uring</code>? — <a href="/cookbook/p/disk-i-o-fsync-the-page-cache-and-queues">I/O</a>. 39. How do you authenticate a client without sending its password, and how do you hide rows from a user? — <a href="/cookbook/p/passwords-and-scram">M21</a>, <a href="/cookbook/p/roles-privileges-and-row-level-security">M22</a>. 40. What are the layers of a database, and where would you put a new feature, say vector search? — <a href="/cookbook/p/the-dbms-stack">The stack</a>, <a href="/cookbook/p/the-vector-store">M12</a>, <a href="/cookbook/p/one-planner-for-many-models">M18</a>.</p>
"""

[[sections]]
heading = "A design question, worked through"
body = """
<p><em>Design a key-value store that survives machine failures and scales to a billion keys.</em></p>

<ol> <li><strong>Clarify</strong>: reads versus writes, value sizes, consistency required (linearizable per key? transactions across keys?), latency target, durability on a crash.</li> <li><strong>Single node first</strong>: an LSM tree with a write-ahead log gives sequential writes and recovery by replay (<a href="/cookbook/p/a-durable-lsm-tree">M7</a>); bloom filters and a block cache protect reads. State the write, read and space amplification and what compaction costs.</li> <li><strong>Replicate</strong>: a consensus group per shard so that a majority holds each write (<a href="/cookbook/p/raft">M8</a>); say what is lost when the leader fails and how long an election takes.</li> <li><strong>Shard</strong>: split the key space by range, so scans work; the shard map is itself replicated; splits and moves happen while writes continue (<a href="/cookbook/p/sharding">M9</a>). Say what a client does with a stale map.</li> <li><strong>Transactions across shards</strong> if asked: timestamps and two-phase commit through a primary key (<a href="/cookbook/p/distributed-transactions">M10</a>); say what happens when the coordinator fails.</li> <li><strong>Test it</strong>: a simulation with message loss and crashes, a linearizability check of the client histories (<a href="/cookbook/p/deterministic-simulation">Simulation</a>, <a href="/cookbook/p/testing-a-database">Testing</a>).</li> <li><strong>Operate it</strong>: backups, upgrades, hot-spot handling, metrics (<a href="/cookbook/p/profiling-and-observability">Profiling</a>).</li> </ol>

<p>The shape matters more than the details: a clarifying question, a simple core, then one concern at a time, each with its failure and its test.</p>
"""

[[sections]]
heading = "Coding and concurrency exercises"
body = """
<ul> <li>Implement an <strong>LRU cache</strong> with <code>O(1)</code> operations, then make it thread-safe; then make it fast under contention (sharding, per-shard locks).</li> <li>Write a <strong>hash table</strong> with open addressing and deletion, and say what a tombstone costs (<a href="/cookbook/p/hash-tables">L07</a>).</li> <li>Implement <strong>merge of k sorted runs</strong> with a heap and say how you would use it in an external sort or an LSM compaction (<a href="/cookbook/p/sorting-and-aggregation">L11</a>).</li> <li>Write a <strong>bounded blocking queue</strong> and prove it cannot deadlock; then do it without locks for one producer and one consumer (<a href="/cookbook/p/rust-for-systems-code">Rust for systems</a>).</li> <li>Implement a <strong>rate limiter</strong> (token bucket), and say what clock it uses and why.</li> <li>Given a <strong>history of reads and writes with times</strong>, decide whether it is linearizable (<a href="/cookbook/p/testing-a-database">Testing</a>); then say what is hard about it.</li> <li>Given a <strong>log of operations</strong>, write the recovery that rebuilds the state; then say what you do with a torn last record (<a href="/cookbook/p/a-durable-lsm-tree">M7</a>).</li> <li>Write a <strong>SQL query</strong> with a window function, a correlated subquery and an outer join, and explain its plan (<a href="/cookbook/p/modern-sql">L02</a>, <a href="/cookbook/p/optimizer-rules-and-the-engine">P3.6</a>).</li> </ul>
"""

[[sections]]
heading = "A portfolio that is evidence"
body = """
<ol> <li><strong>One project that works end to end</strong>, small and tested: a storage engine, a query engine, a consensus implementation, a simulator. The sections of Part V show the shape: a model to test against, a property test, a measurement on named hardware, a mutation run, and a note on the bugs found.</li> <li><strong>One merged contribution</strong> to a real engine (<a href="/cookbook/p/contributing-to-a-database">Contributing</a>).</li> <li><strong>One piece of writing</strong> that explains a mechanism to someone who does not know it, with a diagram or a measurement of your own.</li> <li><strong>A README that says what was measured, on what, and what is not claimed.</strong> The most persuasive sentence in a portfolio is an honest limitation.</li> <li><strong>Something that broke and what you learned</strong>: a bug your test found in your own code, with the test that found it.</li> </ol>
"""
