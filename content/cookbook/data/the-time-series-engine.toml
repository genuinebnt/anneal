[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A time-series table is a key layout plus an index.</strong> Samples are keys <code>series | timestamp</code> (<a href="/cookbook/p/one-key-space">M1</a>), so a series' time range is a range scan, a write at any timestamp (late, duplicated, out of order) is an ordinary put, and a later write at the same timestamp replaces the earlier. Everything the earlier parts say about compression and chunking (<a href="/cookbook/p/time-series-databases">S1</a>) applies to how those keys are stored below; this section is about the model above them.</li> <li><strong>The series is the unit of cardinality.</strong> A series is one combination of tags (<code>host=web-1, metric=cpu</code>). Its id here is a hash of the canonical tag string, so writers need no shared counter and no coordination; a collision is detected by comparing the stored tag string. Cardinality, the number of distinct tag combinations, is what limits time-series databases; the number of <em>samples</em> is easy by comparison.</li> <li><strong>Tags are indexed by posting lists.</strong> For every <code>(tag, value)</code> there is a sorted list of the series that have it, stored as keys <code>(tag, value, series id)</code>. A query's matchers become set operations: equality and <code>in</code> are lists (a union for <code>in</code>), existence is the union over all values, several matchers intersect, and negation subtracts (<code>dc != "eu"</code> also matches series with no <code>dc</code> tag, the Prometheus rule). Starting from the smallest list keeps the work proportional to the answer.</li> <li><strong>A query is selection, scan, bucket, group.</strong> Select series by matchers, scan <code>[from, to)</code> of each, assign each sample to a bucket (<code>ts − ts mod step</code>, with floor semantics for negative times), combine per bucket with a mergeable state (count, sum, min, max, latest), and merge series that fall in the same group (the <code>group_by</code> tags). <code>avg</code> is sum over count across the whole group, not an average of averages.</li> <li><strong>Rollups trade space for speed.</strong> A rollup stores, for each series and each fixed-width bucket, the state needed to answer coarser queries; a query whose step is a multiple of the rollup width reads rollup entries instead of raw samples. The hazard is staleness: a late sample landing in an already rolled-up bucket would be missed. A per-series <strong>watermark</strong> says "buckets before this are rolled up"; a late write pulls the watermark back to the start of its bucket, so queries read raw samples again exactly where the rollup might be wrong, and the next roll-up recomputes from there. Retention does the same: deleting old samples invalidates the rollups it touches.</li> <li><strong>Retention is a delete.</strong> In an MVCC key space deleting a sample writes a tombstone, which costs about a write (<a href="/cookbook/p/transactions-on-the-key-space">M2</a>); engines with time-partitioned files drop a whole partition instead. The tombstone version is garbage-collected later.</li> </ul>
"""

[[sections]]
heading = "The pieces"
body = """
<ul> <li><strong>Keys</strong>: samples <code>series_key(id, ts)</code> → 8-byte float; registry <code>id → canonical tags</code>; postings <code>(tag, value, id)</code>; rollups <code>(id, bucket)</code> → <code>(count, sum, min, max, last ts, last value)</code>; watermark per series.</li> <li><strong><code>write</code></strong> registers a new series and its postings the first time, puts the sample, and pulls the watermark back for a late sample.</li> <li><strong><code>select</code></strong> evaluates matchers into a set of series ids.</li> <li><strong><code>query</code></strong> takes <code>from</code>, <code>to</code>, <code>step</code>, an aggregate and <code>group_by</code> tags, and a flag for rollups; it returns <code>group → bucket → value</code> and statistics (samples read, rollup buckets read, posting entries).</li> <li><strong><code>roll_up(upto)</code></strong> computes the rollup of every complete bucket below <code>upto</code> for every series (idempotent) and advances watermarks; <strong><code>delete_before(cutoff)</code></strong> removes old samples and invalidates rollups.</li> </ul>

:::deeper Reference: series identity, posting lists, bucketed grouped aggregation, rollups with watermarks, retention
```rust title="src/multimodel/tsdb.rs"
//! A time-series table on the shared key space. A series is identified by its tag set (the id is a hash of the canonical form, so writers
//! need no shared counter); samples are keys `series | timestamp`, so out-of-order and duplicate writes are ordinary puts; tags are
//! indexed by *posting lists* stored as keys; queries select series by tag matchers, scan a time range, bucket and aggregate, and group by
//! tags. Rollups (per-bucket count, sum, min, max) answer coarse queries, with a per-series watermark that late writes pull back so that a
//! rollup is never trusted past the data it covers.
use crate::mmkey::{decode_tuple, key, prefix_end, series_key, Val};
use crate::mmtxn::{Db, Txn};
use std::collections::{BTreeMap, BTreeSet};

pub type Tags = BTreeMap<String, String>;
pub type SeriesId = u64;

const REGISTRY: u8 = 0x44;
const POSTING: u8 = 0x43;
const ROLLUP: u8 = 0x41;
const WATERMARK: u8 = 0x45;

fn fnv64(s: &str) -> u64 {
    let mut h = 0xcbf29ce484222325u64;
    for b in s.bytes() {
        h = (h ^ b as u64).wrapping_mul(0x100000001b3);
    }
    h
}
pub fn canonical(tags: &Tags) -> String {
    tags.iter().map(|(k, v)| format!("{k}={v}")).collect::<Vec<_>>().join(",")
}
pub fn series_id(tags: &Tags) -> SeriesId {
    fnv64(&canonical(tags))
}
fn registry_key(id: SeriesId) -> Vec<u8> {
    let mut k = vec![REGISTRY];
    k.extend(key(&[Val::Int(id as i64)]));
    k
}
fn posting_key(tk: &str, tv: &str, id: SeriesId) -> Vec<u8> {
    let mut k = vec![POSTING];
    k.extend(key(&[Val::Text(tk.into()), Val::Text(tv.into()), Val::Int(id as i64)]));
    k
}
fn posting_prefix(tk: &str, tv: Option<&str>) -> Vec<u8> {
    let mut k = vec![POSTING];
    match tv {
        Some(v) => k.extend(key(&[Val::Text(tk.into()), Val::Text(v.into())])),
        None => k.extend(key(&[Val::Text(tk.into())])),
    }
    k
}
fn rollup_key(id: SeriesId, bucket: i64) -> Vec<u8> {
    let mut k = vec![ROLLUP];
    k.extend(key(&[Val::Int(id as i64), Val::Int(bucket)]));
    k
}
fn watermark_key(id: SeriesId) -> Vec<u8> {
    let mut k = vec![WATERMARK];
    k.extend(key(&[Val::Int(id as i64)]));
    k
}
fn bucket_of(ts: i64, step: i64) -> i64 {
    ts - ts.rem_euclid(step)
}
fn f64_bytes(v: f64) -> Vec<u8> {
    v.to_le_bytes().to_vec()
}
fn bytes_f64(b: &[u8]) -> f64 {
    f64::from_le_bytes(b.try_into().unwrap())
}

#[derive(Clone, Debug)]
pub enum Matcher {
    Eq(String, String),
    Ne(String, String),
    In(String, Vec<String>),
    Exists(String),
}
#[derive(Clone, Copy, Debug, PartialEq)]
pub enum Agg {
    Count,
    Sum,
    Min,
    Max,
    Avg,
    Last,
}
#[derive(Clone, Debug)]
pub struct Query {
    pub matchers: Vec<Matcher>,
    pub from: i64,
    pub to: i64,
    pub step: i64,
    pub agg: Agg,
    pub group_by: Vec<String>,
}
pub type Result_ = BTreeMap<Vec<String>, BTreeMap<i64, f64>>;

#[derive(Default, Debug, Clone)]
pub struct QueryStats {
    pub series_matched: usize,
    pub samples_read: usize,
    pub rollup_buckets: usize,
    pub posting_entries: usize,
}

/// Mergeable per-bucket state.
#[derive(Clone, Copy, Debug)]
struct Acc {
    count: f64,
    sum: f64,
    min: f64,
    max: f64,
    last: (i64, SeriesId, f64),
}
impl Acc {
    fn new() -> Acc {
        Acc { count: 0.0, sum: 0.0, min: f64::INFINITY, max: f64::NEG_INFINITY, last: (i64::MIN, 0, 0.0) }
    }
    fn add(&mut self, ts: i64, id: SeriesId, v: f64) {
        self.count += 1.0;
        self.sum += v;
        self.min = self.min.min(v);
        self.max = self.max.max(v);
        if (ts, id) > (self.last.0, self.last.1) {
            self.last = (ts, id, v);
        }
    }
    fn merge(&mut self, o: &Acc) {
        self.count += o.count;
        self.sum += o.sum;
        self.min = self.min.min(o.min);
        self.max = self.max.max(o.max);
        if (o.last.0, o.last.1) > (self.last.0, self.last.1) {
            self.last = o.last;
        }
    }
    fn value(&self, a: Agg) -> f64 {
        match a {
            Agg::Count => self.count,
            Agg::Sum => self.sum,
            Agg::Min => self.min,
            Agg::Max => self.max,
            Agg::Avg => self.sum / self.count,
            Agg::Last => self.last.2,
        }
    }
}

pub struct Tsdb {
    /// Width of the rollup buckets; 0 disables rollups.
    pub rollup: i64,
}

impl Tsdb {
    pub fn new(rollup: i64) -> Tsdb {
        Tsdb { rollup }
    }

    /// Write one sample, registering the series and its tag postings the first time it is seen. A second write at the same timestamp
    /// replaces the first. A write behind the series' rollup watermark pulls the watermark back to the start of its bucket.
    pub fn write(&self, db: &Db, t: &mut Txn, tags: &Tags, ts: i64, v: f64) -> SeriesId {
        let id = series_id(tags);
        let rk = registry_key(id);
        match db.get(t, &rk) {
            Some(existing) => assert_eq!(existing, canonical(tags).into_bytes(), "series id collision"),
            None => {
                db.put(t, &rk, canonical(tags).as_bytes());
                for (k, val) in tags {
                    db.put(t, &posting_key(k, val, id), &[]);
                }
            }
        }
        db.put(t, &series_key(id, ts), &f64_bytes(v));
        if self.rollup > 0 {
            if let Some(w) = db.get(t, &watermark_key(id)) {
                let w = i64::from_le_bytes(w.try_into().unwrap());
                if ts < w {
                    db.put(t, &watermark_key(id), &bucket_of(ts, self.rollup).to_le_bytes());
                }
            }
        }
        id
    }

    pub fn tags_of(&self, db: &Db, t: &mut Txn, id: SeriesId) -> Option<Tags> {
        let b = db.get(t, &registry_key(id))?;
        Some(String::from_utf8(b).unwrap().split(',').filter(|s| !s.is_empty()).map(|kv| { let (k, v) = kv.split_once('=').unwrap(); (k.to_string(), v.to_string()) }).collect())
    }

    fn posting(&self, db: &Db, t: &mut Txn, tk: &str, tv: Option<&str>, st: &mut QueryStats) -> BTreeSet<SeriesId> {
        let p = posting_prefix(tk, tv);
        let entries = db.scan(t, &p, &prefix_end(&p).unwrap());
        st.posting_entries += entries.len();
        entries.into_iter().map(|(k, _)| match decode_tuple(&k[1..], &[]).unwrap().last() { Some(Val::Int(i)) => *i as u64, o => panic!("{o:?}") }).collect()
    }
    fn all_series(&self, db: &Db, t: &mut Txn) -> BTreeSet<SeriesId> {
        let p = vec![REGISTRY];
        db.scan(t, &p, &prefix_end(&p).unwrap()).into_iter().map(|(k, _)| match &decode_tuple(&k[1..], &[]).unwrap()[0] { Val::Int(i) => *i as u64, o => panic!("{o:?}") }).collect()
    }
    /// Series ids satisfying every matcher: intersect the posting lists of the positive matchers, then subtract the negative ones.
    pub fn select(&self, db: &Db, t: &mut Txn, ms: &[Matcher], st: &mut QueryStats) -> BTreeSet<SeriesId> {
        let mut cur: Option<BTreeSet<SeriesId>> = None;
        let mut negatives = vec![];
        for m in ms {
            let set = match m {
                Matcher::Eq(k, v) => self.posting(db, t, k, Some(v), st),
                Matcher::In(k, vs) => vs.iter().flat_map(|v| self.posting(db, t, k, Some(v), st)).collect(),
                Matcher::Exists(k) => self.posting(db, t, k, None, st),
                Matcher::Ne(k, v) => { negatives.push((k, v)); continue; }
            };
            cur = Some(match cur { None => set, Some(c) => c.intersection(&set).copied().collect() });
        }
        let mut cur = cur.unwrap_or_else(|| self.all_series(db, t));
        for (k, v) in negatives {
            for id in self.posting(db, t, k, Some(v), st) {
                cur.remove(&id);
            }
        }
        cur
    }

    /// Run a range query. Buckets are `step` wide, aligned to multiples of `step`; the result maps each group (the values of the
    /// `group_by` tags) to its bucket → aggregate series.
    pub fn query(&self, db: &Db, t: &mut Txn, q: &Query, use_rollups: bool) -> (Result_, QueryStats) {
        let mut st = QueryStats::default();
        let ids = self.select(db, t, &q.matchers, &mut st);
        st.series_matched = ids.len();
        let mut groups: BTreeMap<Vec<String>, BTreeMap<i64, Acc>> = BTreeMap::new();
        for id in ids {
            let tags = self.tags_of(db, t, id).unwrap();
            let g: Vec<String> = q.group_by.iter().map(|k| tags.get(k).cloned().unwrap_or_default()).collect();
            let acc = groups.entry(g).or_default();
            // buckets entirely below the watermark and aligned to the rollup width come from the rollup; the rest from raw samples
            let mut raw_from = q.from;
            if use_rollups && self.rollup > 0 && q.step % self.rollup == 0 {
                if let Some(w) = db.get(t, &watermark_key(id)) {
                    let w = i64::from_le_bytes(w.try_into().unwrap());
                    let first = bucket_of(q.from, q.step) + if q.from % q.step == 0 { 0 } else { q.step };
                    let mut b = first;
                    // rollup buckets are used per query bucket, only for query buckets fully inside [from, min(to, watermark))
                    while b + q.step <= q.to.min(w) {
                        let mut sum = Acc::new();
                        let mut r = b;
                        while r < b + q.step {
                            if let Some(v) = db.get(t, &rollup_key(id, r)) {
                                st.rollup_buckets += 1;
                                let f: Vec<f64> = v.chunks_exact(8).map(bytes_f64).collect();
                                let mut part = Acc::new();
                                part.count = f[0]; part.sum = f[1]; part.min = f[2]; part.max = f[3]; part.last = (f[4] as i64, id, f[5]);
                                if part.count > 0.0 { sum.merge(&part); }
                            }
                            r += self.rollup;
                        }
                        if sum.count > 0.0 { acc.entry(b).or_insert_with(Acc::new).merge(&sum); }
                        b += q.step;
                    }
                    // raw samples before `first` and from `b` on
                    if b > first {
                        self.scan_raw(db, t, id, q.from, first, q.step, acc, &mut st);
                        raw_from = b;
                    }
                }
            }
            self.scan_raw(db, t, id, raw_from, q.to, q.step, acc, &mut st);
        }
        let out = groups.into_iter().filter(|(_, b)| !b.is_empty()).map(|(g, b)| (g, b.into_iter().map(|(k, a)| (k, a.value(q.agg))).collect())).collect();
        (out, st)
    }
    fn scan_raw(&self, db: &Db, t: &mut Txn, id: SeriesId, from: i64, to: i64, step: i64, acc: &mut BTreeMap<i64, Acc>, st: &mut QueryStats) {
        if from >= to {
            return;
        }
        for (k, v) in db.scan(t, &series_key(id, from), &series_key(id, to)) {
            let ts = match &decode_tuple(&k[9..], &[]).unwrap()[0] { Val::Int(i) => *i, o => panic!("{o:?}") };
            st.samples_read += 1;
            acc.entry(bucket_of(ts, step)).or_insert_with(Acc::new).add(ts, id, bytes_f64(&v));
        }
    }

    /// Compute rollups for every complete bucket of every series below `upto` and advance the watermarks. Idempotent.
    pub fn roll_up(&self, db: &Db, t: &mut Txn, upto: i64) -> usize {
        assert!(self.rollup > 0);
        let mut written = 0;
        for id in self.all_series(db, t) {
            let from = db.get(t, &watermark_key(id)).map_or(i64::MIN / 2, |w| i64::from_le_bytes(w.try_into().unwrap()));
            let to = bucket_of(upto, self.rollup);
            if to <= from {
                continue;
            }
            let mut buckets: BTreeMap<i64, Acc> = BTreeMap::new();
            self.scan_raw(db, t, id, from, to, self.rollup, &mut buckets, &mut QueryStats::default());
            // drop stale rollup entries of buckets that have lost all their samples, then write the current ones
            let mut b = bucket_of(from.max(i64::MIN / 4), self.rollup);
            let _ = &mut b;
            for (b, a) in &buckets {
                let mut v = vec![];
                for x in [a.count, a.sum, a.min, a.max, a.last.0 as f64, a.last.2] { v.extend(f64_bytes(x)); }
                db.put(t, &rollup_key(id, *b), &v);
                written += 1;
            }
            db.put(t, &watermark_key(id), &to.to_le_bytes());
        }
        written
    }

    /// Delete every sample older than `cutoff` (and the rollups below it). Returns the number of samples removed.
    pub fn delete_before(&self, db: &Db, t: &mut Txn, cutoff: i64) -> usize {
        let mut n = 0;
        for id in self.all_series(db, t) {
            for (k, _) in db.scan(t, &series_key(id, i64::MIN / 2), &series_key(id, cutoff)) {
                db.delete(t, &k);
                n += 1;
            }
            if self.rollup > 0 {
                // buckets below the cutoff lost their samples and the bucket holding it is partial: every rollup of the series is stale.
                // Forget them all; the watermark moves back to the cutoff's bucket so that the next roll-up recomputes from there.
                let from = bucket_of(cutoff, self.rollup);
                for (k, _) in db.scan(t, &rollup_key(id, i64::MIN / 2), &rollup_key(id, i64::MAX / 2)) {
                    db.delete(t, &k);
                }
                if let Some(w) = db.get(t, &watermark_key(id)) {
                    if i64::from_le_bytes(w.try_into().unwrap()) > from {
                        db.put(t, &watermark_key(id), &from.to_le_bytes());
                    }
                }
            }
        }
        n
    }
}
```
