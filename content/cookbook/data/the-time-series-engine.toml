[[sections]]
heading = "Measured"
body = """
<p>1 000 series (200 hosts × 5 metrics) with 1 000 samples each at 10-second intervals, 2.8 hours, 1 000 000 samples in all.</p>

```text title="ingest, roll-up, queries raw and with rollups, tag selection, and retention"
1000 series (200 hosts x 5 metrics), 1000000 samples at 10 s intervals (2.8 hours): ingested in 2.2 s (458048 samples/s, 100 per transaction batch of 1000 series)
roll-up of 1-minute buckets: 166000 rollup entries in 1.1 s
query                                                            series   raw (ms)    samples rollup (ms)    samples
one series, whole range, 1-minute average                             1          1       1000          0          4  (rollup buckets read: 166)
metric = cpu, 10-minute max per dc                                  200        178     200000         29       8000  (rollup buckets read: 32000)
everything, 1-hour sum per metric                                  1000        888    1000000        326     280000  (rollup buckets read: 120000)
dc != us and metric = disk, 5-minute count                          133        117     133000         16       1330  (rollup buckets read: 21945)
selecting host = host-042 reads 5 posting entries and yields 5 series in 10 us; host != host-042 reads the registry and 5 entries and yields 995 series in 0.7 ms
retention: deleting the older half removed 500000 samples in 1.0 s (2 us per sample: one tombstone each)
```

<ul> <li><strong>Ingest at 458 000 samples per second</strong> into the transactional key space (batches of one sample from each of 1 000 series), with series registration and posting writes amortized to the first sample of each series.</li> <li><strong>Rollups cut the work in proportion to the ratio of step to sample interval</strong>: the 10-minute maximum per datacentre reads 8 000 samples instead of 200 000 (the edges of the range) plus 32 000 rollup entries, and takes 29 ms instead of 178 (6×); the five-minute count of one metric: 117 ms to 16 ms (7×). Where the answer is one series (the first row), a millisecond becomes immeasurable. The hour-level query is only 2.7× faster because the range ends in a partial hour (280 000 samples are still read raw) and because the rollup entries themselves are 120 000 key reads.</li> <li><strong>Tag selection is a handful of reads</strong>: <code>host = host-042</code> reads 5 posting entries and finds its five series in 10 µs. Negation needs the universe: <code>host != host-042</code> reads the registry (1 000 series) and takes 0.7 ms.</li> <li><strong>Retention costs a write per sample</strong>: deleting 500 000 samples took 1.0 s (2 µs each), one tombstone per sample. Time-partitioned storage makes expiry free; this key layout trades that for uniformity.</li> <li><strong>The correctness checks are more demanding than the numbers</strong>: 14 400 random queries over 60 runs (out-of-order and duplicate writes with negative timestamps too; random roll-ups at random watermarks; random retention cutoffs; matchers of all four kinds; six aggregates; three groupings; steps that do and do not divide the rollup width) equal a brute-force model both with and without rollups; 42 586 rollup buckets were read in place of raw samples along the way.</li> </ul>

<aside data-call="note"><b>The rollup invariant, and the bug it prevents</b><p>A rollup is a cache, and a cache needs an invalidation rule. The rule here is a single comparison: <em>a rollup bucket may be used only if it lies below the series' watermark, and any write below the watermark lowers it</em>. The late-write test (a sample written into bucket 30–40 after the roll-up) shows the three states: before, the whole range is served from rollups with zero raw reads; after the write, buckets below the new watermark still come from rollups while the affected bucket and those after it are read raw; after another roll-up the range is served from rollups again. The retention path needed the same care: deleting samples below a cutoff leaves the bucket that contains the cutoff partial, so all of the series' rollups are dropped and the watermark moves back. A mutant that skipped that step was caught only by the random test that mixes retention with rollup queries.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A mergeable accumulator</strong> (<code>Acc</code>: count, sum, min, max, and the latest <code>(ts, series id, value)</code>) is the whole aggregation algebra: <code>add</code> folds a sample, <code>merge</code> combines two accumulators (a rollup entry with a raw bucket, one series with another), and <code>value(agg)</code> projects. Average is derived, never stored.</li> <li><strong>Queries return <code>BTreeMap&lt;Vec&lt;String&gt;, BTreeMap&lt;i64, f64&gt;&gt;</code></strong>: group-by values in tuple order, then buckets in time order, which is what the tests compare directly.</li> <li><strong>Floor division for buckets</strong>: <code>ts − ts.rem_euclid(step)</code>; <code>ts % step</code> is wrong for negative timestamps, and a mutant that uses it is killed.</li> <li><strong>Canonical tag strings and <code>fnv64</code></strong>: tags live in a <code>BTreeMap</code> so iteration order is canonical; the hash is a few lines; the registry value is the canonical string so the collision check is a byte comparison.</li> <li><strong>Posting lists as sets</strong>: <code>BTreeSet&lt;u64&gt;</code> with <code>intersection</code>, <code>remove</code>, extension; merge-based on sorted ids, like the graph store's adjacency intersection (<a href="/cookbook/p/the-graph-store">M13</a>).</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Against a model (60 seeds × 60 steps × 4 queries)</strong>: ten tag sets over three tag keys (some series lack <code>dc</code> or <code>svc</code>); writes at random timestamps from −100 to 600 with duplicates; random roll-ups at random times; random retention; random queries with 0 to 2 matchers (equality, inequality, <code>in</code>, exists, on a key some series lack and one nobody has), random ranges (including negative starts), steps 5, 7, 10, 20, 50, 100, all six aggregates and three groupings. Each result must equal the model both from raw samples and with rollups; the number of samples deleted equals the model's.</li> <li><strong>Tag semantics</strong>: <code>dc != eu</code> matches the series with no <code>dc</code>; existence, combined existence and inequality, <code>in</code> with an unknown value, an empty matcher list selecting everything; tags round-trip through the registry.</li> <li><strong>Late data</strong>: a sample overwritten inside a rolled-up bucket changes that bucket's result at once, buckets below keep coming from rollups, and a further roll-up restores rollup-only answers.</li> <li><strong>Mutants run against these tests</strong>: postings united instead of intersected; negatives subtracting nothing; an all-negative query selecting nothing; negative timestamps bucketed toward zero; the latest-sample tie broken the other way; rollups used for steps they do not divide; queries ignoring the watermark; late writes not pulling it back; an unaligned watermark; retention leaving rollups behind; the first full query bucket miscomputed; new series without postings. <strong>All 12 were killed.</strong></li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Prometheus</strong> identifies series by label sets, indexes them with an inverted index of postings (sorted ids, intersected and subtracted exactly as above, with the same <code>!=</code> semantics), stores samples in 2-hour blocks with delta-of-delta timestamps and XOR floats (<a href="/cookbook/p/time-series-databases">S1</a>), and expires by deleting whole blocks. <strong>VictoriaMetrics, Mimir, Thanos and Cortex</strong> keep the model and shard it.</li> <li><strong>InfluxDB</strong> (TSM, then IOx on Arrow and DataFusion), <strong>TimescaleDB</strong> (hypertables of time chunks over PostgreSQL, with continuous aggregates, the rollups of this section, refreshed incrementally and with a materialization watermark for real-time views), <strong>QuestDB</strong>, <strong>ClickHouse</strong> (a MergeTree sorted by series and time, with materialized views for rollups) and <strong>Druid/Pinot</strong> (segments by time with pre-aggregation at ingest) are the main alternatives.</li> <li><strong>Late data</strong> is handled by watermarks in streaming systems too (Flink, Beam): the same idea of a boundary behind which results are final until a late event pulls it back; Timescale's continuous aggregates invalidate regions on late writes in the same way (<a href="/cookbook/p/streams-and-windows">M17</a>).</li> <li><strong>High cardinality</strong> is the production problem: millions of series make the postings and the registry the memory hog; systems cap labels, shard postings and keep per-series state small.</li> <li><strong>Downsampling</strong> with retention tiers (raw for days, 1-minute for weeks, 1-hour for years) is a standard policy built from rollups and <code>delete_before</code>.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Cardinality explosions</strong> come from putting unbounded values (user ids, URLs, request ids) into tags. Each distinct combination is a series with its own postings and registry entry.</li> <li><strong>Rollups of non-decomposable aggregates are wrong</strong>: percentiles and distinct counts cannot be combined from per-bucket values; store sketches (t-digest, HyperLogLog) instead, and say so in the schema.</li> <li><strong>Average of averages</strong>: combine counts and sums, not averages.</li> <li><strong>Alignment</strong>: buckets aligned to multiples of the step in UTC; a query whose range cuts a bucket gets partial buckets at the edges; define whether they are returned.</li> <li><strong>Time zones and daylight saving</strong> change bucket widths for day-level aggregates; do day buckets in the zone of the question, not in UTC.</li> <li><strong>Clock skew and future timestamps</strong> from bad producers poison a series' range; clamp or reject timestamps far from now.</li> <li><strong>A watermark that never advances</strong> (a roll-up job that stopped) silently turns every query into a raw scan; export the watermark lag as a metric.</li> <li><strong>Delete-heavy retention in an LSM</strong> produces tombstones that compaction must work through (<a href="/cookbook/p/a-durable-lsm-tree">M7</a>); partition by time when expiry is the norm.</li> </ul></aside>
"""
