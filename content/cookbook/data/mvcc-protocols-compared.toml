[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>MVCC is four decisions, not one</strong> (Wu et al., VLDB 2017): ① the <strong>concurrency-control protocol</strong>, ② <strong>version storage</strong> (append-only, time-travel, delta; chain order O2N/N2O), ③ <strong>garbage collection</strong> (<a href="/cookbook/p/mvcc-garbage-collection">A4</a>), ④ <strong>index management</strong> (logical vs physical pointers, the duplicate-key problem). The first-order lesson of that study: on many cores the <strong>version storage and GC choices matter as much as the protocol</strong>. L20 (<a href="/cookbook/p/multi-version-concurrency-control">L20</a>) introduced all four; this section compares the <em>protocols</em>.</li> <li><strong>MVTO (multi-version timestamp ordering)</strong>: a transaction's <strong>begin timestamp is its serial position</strong>. Every version carries <code>wts</code> (who wrote it) and <code>rts</code> (largest timestamp that read it). Read: take the version with the largest <code>wts ≤ ts</code> and <strong>raise its <code>rts</code></strong>. Write: legal only if the version being superseded has <code>rts ≤ ts</code> (no younger transaction has read what you'd overwrite) and no newer version exists. Serializable by construction; <strong>reads write metadata</strong>.</li> <li><strong>MVOCC (multi-version optimistic)</strong>: read from a snapshot, buffer writes, <strong>validate at commit</strong> that nothing read has been replaced (and, for phantom protection, that scans would return the same rows), then install under a commit timestamp. Hekaton validates in a pre-commit phase; Silo-style systems validate per tuple.</li> <li><strong>MV2PL</strong>: readers take shared locks on versions and writers exclusive locks, so reads <em>write</em> the lock word too; deadlock handling as in <a href="/cookbook/p/two-phase-locking">L18</a>. In exchange conflicts wait instead of abort.</li> <li><strong>Snapshot isolation (SI)</strong>: reads from a snapshot, <strong>first-committer-wins</strong> on write–write conflicts, <strong>not serializable</strong> (write skew). <strong>SSI</strong> (Cahill, PostgreSQL) makes it serializable by tracking read–write antidependencies between concurrent transactions and aborting a <em>pivot</em> in a dangerous structure (two consecutive rw edges), so it aborts far less than read-set validation.</li> <li><strong>HyPer's MVCC</strong> keeps the newest version in place with <strong>undo buffers</strong> behind it (delta, N2O), validates serializability with <strong>precision locking</strong> (re-check each committed transaction's write set against the <em>predicates</em> of concurrent readers), and gives read-only transactions snapshot speed. <strong>Hekaton</strong>: append-only versions with begin/end timestamps, latch-free hash and Bw-tree indexes, optimistic validation. <strong>Cicada</strong>: per-thread loosely synchronized clocks (no shared counter), best-effort inlining of the newest version, contention-aware backoff.</li> <li><strong>Costs to watch</strong>: timestamp allocation (a shared atomic counter is a bottleneck at scale), <strong>read-induced writes</strong> (MVTO <code>rts</code>, MV2PL lock words), version-chain traversal for old snapshots, validation cost proportional to read set, and what happens to <strong>long read-only transactions</strong> (starve under OCC, pin garbage everywhere).</li> </ul>
"""

