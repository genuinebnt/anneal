body = """
<ul class="cb-g-uses"><li>TiDB/TiKV (Percolator-style, with additions)</li><li>Google Percolator's incremental indexing</li><li>FaunaDB described a Calvin-inspired design</li><li>deterministic execution reappears in many replicated state machines and blockchains</li></ul>
"""

