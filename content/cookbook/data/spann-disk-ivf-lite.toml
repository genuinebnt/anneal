heading = "Common uses"
body = """
<ul class="cb-g-uses"><li><strong>Spann</strong> (Microsoft SPTAG, Bing-scale)</li><li>Pinecone/Turbopuffer-style object-storage IVF layouts (a posting list = one object range-<strong>get</strong>)</li><li>DiskANN/Vamana in Azure and in Milvus</li><li>Lucene on SSD</li><li>Faiss IVF with on-disk inverted lists (<code>OnDiskInvertedLists</code>)</li></ul>
"""

