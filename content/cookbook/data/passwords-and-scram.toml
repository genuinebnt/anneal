[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A server should never hold a password it could replay.</strong> Storing the password, or a plain hash of it, means a stolen table logs in everywhere that password was reused, and a stolen <em>hash</em> in some protocols logs in directly. PostgreSQL's modern answer stores a <strong>verifier</strong>: a random salt, an iteration count and two derived keys (<code>StoredKey</code> and <code>ServerKey</code>). From the verifier the server can check a login, and cannot compute what the client sends.</li> <li><strong>The slow hash is the defence against guessing.</strong> <code>SaltedPassword = PBKDF2-HMAC-SHA256(password, salt, 4096)</code>. Each guess an attacker makes against a stolen verifier costs 4 096 iterations of HMAC; each login costs the client the same once. The salt makes every user's verifier unrelated, so one table of guesses does not serve all.</li> <li><strong>SCRAM is a challenge and response.</strong> The client sends a nonce; the server adds its own and sends back the salt and iteration count; the client computes <code>ClientProof = ClientKey XOR HMAC(StoredKey, AuthMessage)</code> where <code>AuthMessage</code> is the transcript so far, and sends it; the server recovers <code>ClientKey</code> from the proof, hashes it, and compares with <code>StoredKey</code>. The password never crosses the wire, the proof is useless for any other transcript (a <strong>replay</strong> fails), and the server then sends <code>HMAC(ServerKey, AuthMessage)</code> so the client knows the server also holds the verifier (<strong>mutual</strong> authentication).</li> <li><strong>The server's work per login is a few hashes.</strong> PBKDF2 runs on the client (and once when the verifier is created). A server under many logins pays microseconds each, an attacker guessing offline pays 4 096 iterations per guess.</li> <li><strong>The login must not say why it failed.</strong> A wrong password, an unknown user and a malformed exchange all end with the same error after the same number of steps. For a name that does not exist the server invents a verifier from the name and a server secret, so the exchange looks like any other until the last message, and asking twice gives the same salt.</li> <li><strong>Nothing here is encrypted.</strong> SCRAM protects the password, not the session: without TLS an eavesdropper sees the transcript and can guess passwords offline against the captured proof, and anyone on the path can read and change the queries. SCRAM with channel binding (<code>SCRAM-SHA-256-PLUS</code>) ties the exchange to a TLS session; this implementation declines it.</li> </ul>
"""

[[sections]]
heading = "The exchange"
body = """
```text
 client                                                         server (holds: salt, i, StoredKey, ServerKey)
 ──────                                                         ───────────────────────────────────────────
 client-first   n,,n=<user>,r=<client nonce>              ───►
                                                          ◄───  server-first   r=<client nonce><server nonce>,s=<salt>,i=<iterations>
 SaltedPassword = PBKDF2(password, salt, i)
 ClientKey      = HMAC(SaltedPassword, "Client Key")
 StoredKey      = SHA256(ClientKey)
 AuthMessage    = client-first-bare , server-first , client-final-without-proof
 ClientProof    = ClientKey XOR HMAC(StoredKey, AuthMessage)
 client-final   c=biws,r=<both nonces>,p=<ClientProof>    ───►  ClientKey' = ClientProof XOR HMAC(StoredKey, AuthMessage)
                                                                accept iff SHA256(ClientKey') = StoredKey
                                                          ◄───  server-final   v=HMAC(ServerKey, AuthMessage)
 accept iff v matches
```

<p><code>biws</code> is the base64 of <code>n,,</code>, the header saying the client does not use channel binding. In PostgreSQL's wire protocol the three messages ride inside <code>AuthenticationSASL</code> (the server offers the mechanism <code>SCRAM-SHA-256</code>), <code>SASLInitialResponse</code>, <code>AuthenticationSASLContinue</code>, <code>SASLResponse</code> and <code>AuthenticationSASLFinal</code>, all tagged <code>R</code> or <code>p</code> (<a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>). The server's side in the connection handler is one short function:</p>

```text
send AuthSasl(["SCRAM-SHA-256"])
read p  → (mechanism, client-first)           refuse unless the mechanism is SCRAM-SHA-256
scram = ScramServer(verifier, fresh random nonce)
send AuthSaslContinue(scram.first(client-first))
read p  → client-final
send AuthSaslFinal(scram.finish(client-final))        any error anywhere → the same "password authentication failed" error
```

:::deeper Reference: SHA-256, HMAC, PBKDF2, base64, verifiers, the SCRAM server and client
```rust title="src/auth/scram.rs"
//! Password authentication as PostgreSQL does it: SCRAM-SHA-256 (RFC 5802, RFC 7677), built from SHA-256, HMAC and PBKDF2 written out
//! in full. A server stores a *verifier* (salt, iteration count, `StoredKey`, `ServerKey`), never the password; a login is a challenge
//! and response in which the client proves it knows the password without sending it, and the server proves it knows the verifier.
//! Passwords are used as the bytes given (no SASLprep normalization), so non-ASCII passwords interoperate only if both sides agree.

// ---- SHA-256 (FIPS 180-4) --------------------------------------------------------------------------------------------------------------

const K: [u32; 64] = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe,
    0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7,
    0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
    0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
];

#[derive(Clone)]
pub struct Sha256 {
    h: [u32; 8],
    block: [u8; 64],
    filled: usize,
    total: u64,
}

impl Default for Sha256 {
    fn default() -> Self {
        Sha256 { h: [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19], block: [0; 64], filled: 0, total: 0 }
    }
}

impl Sha256 {
    pub fn update(&mut self, mut data: &[u8]) {
        self.total += data.len() as u64;
        if self.filled > 0 {
            let take = (64 - self.filled).min(data.len());
            self.block[self.filled..self.filled + take].copy_from_slice(&data[..take]);
            self.filled += take;
            data = &data[take..];
            if self.filled < 64 {
                return;
            }
            let b = self.block;
            self.compress(&b);
            self.filled = 0;
        }
        while data.len() >= 64 {
            let (b, rest) = data.split_at(64);
            self.compress(b.try_into().unwrap());
            data = rest;
        }
        self.block[..data.len()].copy_from_slice(data);
        self.filled = data.len();
    }

    pub fn finish(mut self) -> [u8; 32] {
        let bits = self.total * 8;
        let mut pad = vec![0x80u8];
        pad.resize(1 + (119 - self.filled) % 64, 0);
        pad.extend(bits.to_be_bytes());
        let total = self.total;
        self.update(&pad);
        debug_assert!(self.filled == 0);
        self.total = total;
        let mut out = [0u8; 32];
        for (i, w) in self.h.iter().enumerate() {
            out[4 * i..4 * i + 4].copy_from_slice(&w.to_be_bytes());
        }
        out
    }

    fn compress(&mut self, b: &[u8; 64]) {
        let mut w = [0u32; 64];
        for i in 0..16 {
            w[i] = u32::from_be_bytes(b[4 * i..4 * i + 4].try_into().unwrap());
        }
        for i in 16..64 {
            let s0 = w[i - 15].rotate_right(7) ^ w[i - 15].rotate_right(18) ^ (w[i - 15] >> 3);
            let s1 = w[i - 2].rotate_right(17) ^ w[i - 2].rotate_right(19) ^ (w[i - 2] >> 10);
            w[i] = w[i - 16].wrapping_add(s0).wrapping_add(w[i - 7]).wrapping_add(s1);
        }
        let [mut a, mut b_, mut c, mut d, mut e, mut f, mut g, mut h] = self.h;
        for i in 0..64 {
            let s1 = e.rotate_right(6) ^ e.rotate_right(11) ^ e.rotate_right(25);
            let ch = (e & f) ^ (!e & g);
            let t1 = h.wrapping_add(s1).wrapping_add(ch).wrapping_add(K[i]).wrapping_add(w[i]);
            let s0 = a.rotate_right(2) ^ a.rotate_right(13) ^ a.rotate_right(22);
            let maj = (a & b_) ^ (a & c) ^ (b_ & c);
            let t2 = s0.wrapping_add(maj);
            h = g;
            g = f;
            f = e;
            e = d.wrapping_add(t1);
            d = c;
            c = b_;
            b_ = a;
            a = t1.wrapping_add(t2);
        }
        for (x, y) in self.h.iter_mut().zip([a, b_, c, d, e, f, g, h]) {
            *x = x.wrapping_add(y);
        }
    }
}

pub fn sha256(data: &[u8]) -> [u8; 32] {
    let mut s = Sha256::default();
    s.update(data);
    s.finish()
}

// ---- HMAC (RFC 2104) and PBKDF2 (RFC 8018) ---------------------------------------------------------------------------------------------

pub fn hmac_sha256(key: &[u8], msg: &[u8]) -> [u8; 32] {
    let mut k = [0u8; 64];
    if key.len() > 64 {
        k[..32].copy_from_slice(&sha256(key));
    } else {
        k[..key.len()].copy_from_slice(key);
    }
    let mut inner = Sha256::default();
    inner.update(&k.map(|b| b ^ 0x36));
    inner.update(msg);
    let mut outer = Sha256::default();
    outer.update(&k.map(|b| b ^ 0x5c));
    outer.update(&inner.finish());
    outer.finish()
}

pub fn pbkdf2_hmac_sha256(password: &[u8], salt: &[u8], iterations: u32, len: usize) -> Vec<u8> {
    assert!(iterations >= 1);
    let mut out = Vec::with_capacity(len);
    let mut block = 1u32;
    while out.len() < len {
        let mut s = salt.to_vec();
        s.extend(block.to_be_bytes());
        let mut u = hmac_sha256(password, &s);
        let mut t = u;
        for _ in 1..iterations {
            u = hmac_sha256(password, &u);
            for (x, y) in t.iter_mut().zip(u) {
                *x ^= y;
            }
        }
        out.extend(t);
        block += 1;
    }
    out.truncate(len);
    out
}

/// Compare without stopping at the first difference, so the time taken does not say how many leading bytes matched.
pub fn ct_eq(a: &[u8], b: &[u8]) -> bool {
    a.len() == b.len() && a.iter().zip(b).fold(0u8, |acc, (x, y)| acc | (x ^ y)) == 0
}

// ---- base64 (RFC 4648, with padding) ---------------------------------------------------------------------------------------------------

const B64: &[u8; 64] = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

pub fn b64_encode(data: &[u8]) -> String {
    let mut out = String::new();
    for c in data.chunks(3) {
        let n = (c[0] as u32) << 16 | (*c.get(1).unwrap_or(&0) as u32) << 8 | *c.get(2).unwrap_or(&0) as u32;
        for i in 0..4 {
            if i <= c.len() {
                out.push(B64[(n >> (18 - 6 * i) & 63) as usize] as char);
            } else {
                out.push('=');
            }
        }
    }
    out
}

pub fn b64_decode(s: &str) -> Option<Vec<u8>> {
    let b = s.as_bytes();
    if b.len() % 4 != 0 {
        return None;
    }
    let mut out = Vec::new();
    for (ci, c) in b.chunks(4).enumerate() {
        let last = (ci + 1) * 4 == b.len();
        let pad = c.iter().rev().take_while(|&&x| x == b'=').count();
        if pad > 2 || (pad > 0 && !last) {
            return None;
        }
        let mut n = 0u32;
        for &x in &c[..4 - pad] {
            n = n << 6 | B64.iter().position(|&y| y == x)? as u32;
        }
        n <<= 6 * pad as u32;
        // the bits that padding discards must be zero, or two different strings would decode alike
        if pad > 0 && n & ((1 << (8 * pad)) - 1) != 0 {
            return None;
        }
        out.extend(&n.to_be_bytes()[1..4 - pad]);
    }
    Some(out)
}

// ---- SCRAM-SHA-256 ---------------------------------------------------------------------------------------------------------------------

#[derive(Debug, PartialEq)]
pub enum ScramError {
    /// The message is not a well-formed SCRAM message of the expected kind.
    Malformed(&'static str),
    /// Channel binding or an extension was requested that this implementation does not provide.
    Unsupported(&'static str),
    /// The proof or the nonce does not match: wrong password.
    Failed,
}

/// What a server stores in place of a password.
#[derive(Clone, Debug, PartialEq)]
pub struct Verifier {
    pub iterations: u32,
    pub salt: Vec<u8>,
    pub stored_key: [u8; 32],
    pub server_key: [u8; 32],
}

impl Verifier {
    pub fn new(password: &str, salt: &[u8], iterations: u32) -> Verifier {
        let salted = pbkdf2_hmac_sha256(password.as_bytes(), salt, iterations, 32);
        let client_key = hmac_sha256(&salted, b"Client Key");
        Verifier { iterations, salt: salt.to_vec(), stored_key: sha256(&client_key), server_key: hmac_sha256(&salted, b"Server Key") }
    }

    /// PostgreSQL's text form, as stored in `pg_authid.rolpassword`: `SCRAM-SHA-256$<iterations>:<salt>$<StoredKey>:<ServerKey>`.
    pub fn encode(&self) -> String {
        format!("SCRAM-SHA-256${}:{}${}:{}", self.iterations, b64_encode(&self.salt), b64_encode(&self.stored_key), b64_encode(&self.server_key))
    }

    pub fn parse(s: &str) -> Option<Verifier> {
        let rest = s.strip_prefix("SCRAM-SHA-256$")?;
        let (head, keys) = rest.split_once('$')?;
        let (iter, salt) = head.split_once(':')?;
        let (stored, server) = keys.split_once(':')?;
        let iterations: u32 = iter.parse().ok().filter(|&i| i >= 1)?;
        Some(Verifier {
            iterations,
            salt: b64_decode(salt)?,
            stored_key: b64_decode(stored)?.try_into().ok()?,
            server_key: b64_decode(server)?.try_into().ok()?,
        })
    }
}

/// Attributes `a=value,b=value` of a SCRAM message, in order.
fn attrs(msg: &str) -> Vec<(char, &str)> {
    msg.split(',').filter_map(|p| { let mut c = p.chars(); let k = c.next()?; (c.next()? == '=').then(|| (k, &p[2..])) }).collect()
}

/// The server's half of one login. Created with the verifier of the user (or a made-up one, see `Verifier::mock`) and a fresh nonce.
pub struct ScramServer {
    verifier: Verifier,
    nonce: String,
    state: ServerState,
}
enum ServerState {
    Start,
    Sent { combined: String, client_first_bare: String, server_first: String },
    Done,
}

impl ScramServer {
    pub fn new(verifier: Verifier, server_nonce: &str) -> ScramServer {
        ScramServer { verifier, nonce: server_nonce.to_string(), state: ServerState::Start }
    }

    /// Consume `client-first-message` (`n,,n=<user>,r=<nonce>`), produce `server-first-message`.
    pub fn first(&mut self, client_first: &[u8]) -> Result<Vec<u8>, ScramError> {
        if !matches!(self.state, ServerState::Start) {
            return Err(ScramError::Malformed("unexpected message"));
        }
        let msg = std::str::from_utf8(client_first).map_err(|_| ScramError::Malformed("not UTF-8"))?;
        // gs2-header: "n,," (no channel binding, not supported by the client) or "y,," (supported but unused). "p=" asks for binding.
        let bare = match msg.strip_prefix("n,,").or_else(|| msg.strip_prefix("y,,")) {
            Some(b) => b,
            None if msg.starts_with("p=") => return Err(ScramError::Unsupported("channel binding")),
            None => return Err(ScramError::Malformed("bad gs2 header")),
        };
        let a = attrs(bare);
        match a.first() {
            Some(('m', _)) => return Err(ScramError::Unsupported("extension")),
            Some(('n', _)) => {}
            _ => return Err(ScramError::Malformed("missing user name")),
        }
        let client_nonce = match a.get(1) {
            Some(('r', n)) if !n.is_empty() && !n.contains(',') => *n,
            _ => return Err(ScramError::Malformed("missing nonce")),
        };
        let combined = format!("{client_nonce}{}", self.nonce);
        let server_first = format!("r={combined},s={},i={}", b64_encode(&self.verifier.salt), self.verifier.iterations);
        self.state = ServerState::Sent { combined, client_first_bare: bare.to_string(), server_first: server_first.clone() };
        Ok(server_first.into_bytes())
    }

    /// Consume `client-final-message`, check the proof, produce `server-final-message` (`v=<server signature>`).
    pub fn finish(&mut self, client_final: &[u8]) -> Result<Vec<u8>, ScramError> {
        let ServerState::Sent { combined, client_first_bare, server_first } = std::mem::replace(&mut self.state, ServerState::Done) else {
            return Err(ScramError::Malformed("unexpected message"));
        };
        let msg = std::str::from_utf8(client_final).map_err(|_| ScramError::Malformed("not UTF-8"))?;
        let (without_proof, proof) = msg.rsplit_once(",p=").ok_or(ScramError::Malformed("missing proof"))?;
        let a = attrs(without_proof);
        // channel binding data: base64 of the gs2 header the client sent ("n,," -> "biws", "y,," -> "eSws")
        match a.first() {
            Some(('c', c)) if *c == "biws" || *c == "eSws" => {}
            Some(('c', _)) => return Err(ScramError::Unsupported("channel binding")),
            _ => return Err(ScramError::Malformed("missing channel binding")),
        }
        match a.get(1) {
            Some(('r', n)) if *n == combined => {}
            Some(('r', _)) => return Err(ScramError::Failed),
            _ => return Err(ScramError::Malformed("missing nonce")),
        }
        if a.len() != 2 {
            return Err(ScramError::Unsupported("extension"));
        }
        let proof = b64_decode(proof).filter(|p| p.len() == 32).ok_or(ScramError::Malformed("bad proof"))?;
        let auth_message = format!("{client_first_bare},{server_first},{without_proof}");
        let signature = hmac_sha256(&self.verifier.stored_key, auth_message.as_bytes());
        let client_key: Vec<u8> = proof.iter().zip(signature).map(|(p, s)| p ^ s).collect();
        if !ct_eq(&sha256(&client_key), &self.verifier.stored_key) {
            return Err(ScramError::Failed);
        }
        let server_signature = hmac_sha256(&self.verifier.server_key, auth_message.as_bytes());
        Ok(format!("v={}", b64_encode(&server_signature)).into_bytes())
    }
}

impl Verifier {
    /// A verifier for a user that does not exist, derived from the name and a server secret: the login runs exactly as for a real user and
    /// fails at the end, so the exchange does not tell an attacker which names exist. The same name always gets the same salt.
    pub fn mock(user: &str, secret: &[u8], iterations: u32) -> Verifier {
        let salt = hmac_sha256(secret, user.as_bytes());
        Verifier::new(&b64_encode(&hmac_sha256(secret, &salt)), &salt[..16], iterations)
    }
}

/// The client's half, used by tests and tools.
pub struct ScramClient {
    password: String,
    nonce: String,
    client_first_bare: String,
    expected_server_signature: Option<Vec<u8>>,
}

impl ScramClient {
    pub fn new(password: &str, client_nonce: &str) -> ScramClient {
        ScramClient { password: password.into(), nonce: client_nonce.into(), client_first_bare: String::new(), expected_server_signature: None }
    }
    pub fn first(&mut self, user: &str) -> Vec<u8> {
        self.client_first_bare = format!("n={},r={}", user.replace('=', "=3D").replace(',', "=2C"), self.nonce);
        format!("n,,{}", self.client_first_bare).into_bytes()
    }
    /// Consume `server-first-message`, produce `client-final-message` with the proof.
    pub fn next(&mut self, server_first: &[u8]) -> Result<Vec<u8>, ScramError> {
        let sf = std::str::from_utf8(server_first).map_err(|_| ScramError::Malformed("not UTF-8"))?;
        let a = attrs(sf);
        let (r, s, i) = match (a.first(), a.get(1), a.get(2)) {
            (Some(('r', r)), Some(('s', s)), Some(('i', i))) => (*r, *s, *i),
            _ => return Err(ScramError::Malformed("server-first")),
        };
        if !r.starts_with(&self.nonce) || r.len() == self.nonce.len() {
            return Err(ScramError::Failed);
        }
        let salt = b64_decode(s).ok_or(ScramError::Malformed("salt"))?;
        let iterations: u32 = i.parse().ok().filter(|&n| n >= 1).ok_or(ScramError::Malformed("iteration count"))?;
        let salted = pbkdf2_hmac_sha256(self.password.as_bytes(), &salt, iterations, 32);
        let client_key = hmac_sha256(&salted, b"Client Key");
        let stored_key = sha256(&client_key);
        let without_proof = format!("c=biws,r={r}");
        let auth_message = format!("{},{sf},{without_proof}", self.client_first_bare);
        let signature = hmac_sha256(&stored_key, auth_message.as_bytes());
        let proof: Vec<u8> = client_key.iter().zip(signature).map(|(k, s)| k ^ s).collect();
        self.expected_server_signature = Some(hmac_sha256(&hmac_sha256(&salted, b"Server Key"), auth_message.as_bytes()).to_vec());
        Ok(format!("{without_proof},p={}", b64_encode(&proof)).into_bytes())
    }
    /// Check `server-final-message`: the server proves it holds the verifier.
    pub fn verify(&self, server_final: &[u8]) -> Result<(), ScramError> {
        let msg = std::str::from_utf8(server_final).map_err(|_| ScramError::Malformed("not UTF-8"))?;
        let v = msg.strip_prefix("v=").and_then(b64_decode).ok_or(ScramError::Malformed("server-final"))?;
        match &self.expected_server_signature {
            Some(e) if ct_eq(e, &v) => Ok(()),
            _ => Err(ScramError::Failed),
        }
    }
}

/// Random bytes for salts and nonces from the operating system (`/dev/urandom`); a host without it must supply its own.
pub fn random_bytes(n: usize) -> Vec<u8> {
    use std::io::Read;
    let mut v = vec![0u8; n];
    std::fs::File::open("/dev/urandom").and_then(|mut f| f.read_exact(&mut v)).expect("the operating system's random source");
    v
}

/// A printable nonce: base64 without the characters SCRAM reserves (`,` never occurs in base64).
pub fn random_nonce() -> String {
    b64_encode(&random_bytes(18))
}
