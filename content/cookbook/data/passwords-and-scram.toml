heading = "Measured"
body = """
<p>Three kinds of evidence, because an implementation of a cryptographic primitive that passes its own tests proves little. First, the <strong>published test vectors</strong> (FIPS 180-4 for SHA-256 including the million-<code>a</code> message, RFC 4231 for HMAC, the PBKDF2-HMAC-SHA256 vectors, RFC 4648 for base64). Second, <strong>Python's <code>hashlib</code>, <code>hmac</code> and <code>base64</code></strong> (an independent implementation, written in C) on 600 random messages of 0 to 3 000 bytes, keys of 0 to 200 bytes, 40 PBKDF2 calls, and 60 complete logins: for each login Python computes the client's final message and the signature the server must return, the Rust client must produce the same bytes, and the Rust server must accept Python's message. Third, the real <strong><code>psql</code> 14</strong> (libpq): it performs SCRAM against this server, checks the server's signature, and runs queries (<a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>'s test file).</p>

```text title="SHA-256, PBKDF2, a whole login, and logins over the wire"
sha-256: 370 MB/s (checksum 0)
pbkdf2-hmac-sha256, 4096 iterations: 3.26 ms (to create a verifier, or for a client to log in)
one complete login: 3.23 ms for both sides; the server's share (parse, check the proof, sign): 3.3 us
reference, Python hashlib pbkdf2 with 4096 iterations: 0.36 ms
login with no password: 0.16 ms per connection (connect, authenticate, first ReadyForQuery, close)
login with a cleartext password: 0.15 ms per connection (connect, authenticate, first ReadyForQuery, close)
login with SCRAM-SHA-256 (4096 iterations): 3.63 ms per connection (connect, authenticate, first ReadyForQuery, close)
the server's part of a SCRAM login (from the client's proof to the server's signature, including the round trip): 91 us
```

<ul> <li><strong>The server's share of a login is 3.3 µs of computation</strong> (91 µs with the socket round trip), and the client's PBKDF2 is the other 3.2 ms. A login with SCRAM costs a connection 3.6 ms against 0.15 ms with a cleartext password; the difference is the client doing the work an attacker would have to repeat per guess.</li> <li><strong>The portable implementation is 9× slower than Python's <code>hashlib</code></strong> (3.26 ms against 0.36 ms for the same PBKDF2). This one is scalar code at 370 MB/s; the C library very likely uses the processor's SHA instructions, though I did not check which implementation it calls. That is fine for a server (its share is a few hashes) and wrong for an attacker's model: a real guessing rig is faster than anything measured here, which is why the iteration count matters more than the implementation.</li> <li><strong>A name that does not exist and a wrong password are indistinguishable on the wire</strong>: the test compares the whole exchange (the mechanism list, the nonce extension length, the salt length and the iteration count in the challenge, and the final error up to the user's name) for a user with the wrong password and for a name that was never created, and asks twice for the same missing name to check that the salt is stable.</li> </ul>

<aside data-call="note"><b>The RFC example I could not reproduce from memory</b><p>The RFC 7677 example (user <code>user</code>, password <code>pencil</code>) gives the messages up to the client's proof, and the test reproduces them exactly. I also tried to compare the proof against the value I remembered from the RFC, and it did not match. Python computing the same transcript independently agreed with this implementation, libpq accepted it and verified the server's signature, so the remembered literal is the thing that is wrong; but I had no copy of the RFC to check, so that test asserts the structure of the proof and not its value. The vectors that are compared with published values are the ones in the first paragraph above.</p></aside>

<aside data-call="note"><b>Four checks that no test can tell from the proof</b><p>Four mutants survive by design: not comparing the nonce in the client's final message, accepting any channel-binding value, not checking the proof's length, and accepting extra attributes. Each check is also enforced indirectly, because the proof is computed over the whole transcript (<code>AuthMessage</code> contains the nonces, the channel-binding field and every attribute), so a changed message yields a wrong proof and the login fails the same way. They are kept as the explicit checks the RFC asks for, with the clearer error, and counted as equivalent mutants.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A hash as a small state machine</strong>: <code>Sha256 { h: [u32; 8], block: [u8; 64], filled, total }</code> with <code>update(&amp;mut self, &amp;[u8])</code> and <code>finish(self)</code> (consuming, so a finished hasher cannot be reused). <code>update</code> fills a partial block, compresses whole blocks straight from the input slice, and keeps the remainder.</li> <li><strong><code>u32::rotate_right</code>, <code>wrapping_add</code></strong> are the primitives of the compression function; overflow is the algorithm, so arithmetic must be explicitly wrapping, not left to debug-build panics.</li> <li><strong>Constant arrays and <code>map</code></strong>: <code>k.map(|b| b &#94; 0x36)</code> builds the HMAC pads from the key block in one expression.</li> <li><strong><code>ct_eq</code> with a fold</strong>: <code>a.iter().zip(b).fold(0, |acc, (x, y)| acc | (x &#94; y)) == 0</code> has no early exit. Whether the compiler keeps it free of branches is not guaranteed; production code uses a vetted crate (<code>subtle</code>) for that reason.</li> <li><strong>An enum for the server's state</strong>: <code>ServerState::{Start, Sent{…}, Done}</code> makes out-of-order messages a pattern-match failure; <code>std::mem::replace(&amp;mut self.state, Done)</code> consumes the state so a second <code>finish</code> cannot see the first one's data.</li> <li><strong><code>Result&lt;_, ScramError&gt;</code> with three kinds</strong>: <code>Malformed</code> (not SCRAM), <code>Unsupported</code> (channel binding), <code>Failed</code> (wrong password). The wire layer maps all of them to one error; callers inside the process can still tell them apart for logs.</li> <li><strong>Randomness from the operating system</strong>: <code>/dev/urandom</code> read through <code>std::fs::File</code>; a host without it (the WebAssembly build of <a href="/cookbook/p/the-engine-in-webassembly">M20</a>) must provide bytes by an import, as the engine itself needs none.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Published vectors</strong>: SHA-256 of <code>abc</code>, the empty message, the 448-bit and 896-bit NIST messages, and one million <code>a</code> fed in 997-byte pieces; HMAC test cases 1, 2, 6 and 7 of RFC 4231 (the last two with a key longer than the block); PBKDF2 with 1, 2 and 4 096 iterations and the 40-byte output; the seven strings of RFC 4648.</li> <li><strong>Against Python on random inputs</strong>: SHA-256 for every length from 0 to 199 and 400 random lengths up to 3 000; HMAC with keys of nine lengths around the block size; base64; 40 PBKDF2 calls with random passwords, salts, iterations and output lengths; hashing the same message in pieces ending one byte before, on and one byte after a block boundary gives the one-shot digest.</li> <li><strong>Base64 strictness</strong>: ten strings that are not the canonical encoding of any byte string are refused (wrong padding, padding in the middle, non-zero discarded bits, whitespace, two encoded strings joined).</li> <li><strong>60 complete logins against Python's implementation</strong>: the Rust client's final message equals Python's, the Rust server accepts Python's message and returns the signature Python computed, and a client with the password plus one extra character is refused.</li> <li><strong>Damaged and replayed messages</strong>: a final message answering another session's challenge, a changed proof, a flipped bit in the proof, a changed nonce, a changed channel-binding field, a missing proof, an extra attribute, a short proof; first messages that ask for channel binding, have no header, no nonce, an empty nonce, an extension or are not UTF-8; messages out of order; a client that rejects a server that does not extend its nonce, extends it by nothing, signs with another verifier or sends <code>v=AAAA</code>.</li> <li><strong>Users that do not exist</strong>: the exchange for a missing name has the same shape as for a wrong password and ends in the same failure; the same name always gets the same salt, different names get different salts.</li> <li><strong>Verifier text</strong>: round trip, the exact text <code>SCRAM-SHA-256$4096:…$…:…</code>, and refusal of zero iterations (with otherwise valid keys), a wrong prefix and missing parts.</li> <li><strong>On the wire</strong> (<a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>): SCRAM logins of two users into one database; the mechanism offered; the whole exchange for a wrong password and for a missing user; a query sent in place of the response, a mechanism that was not offered, channel binding requested, five malformed initial responses (including one with a byte after the data), a replayed proof and garbage in place of the proof — each ends with <code>28P01</code> and a closed connection, and a table that the first client tried to create does not exist afterwards; the real <code>psql</code> logs in, is refused with a wrong password, and runs DDL and queries.</li> <li><strong>Mutants run against these tests</strong>: in SHA-256 a rotation off by one, the first and last round constants, padding one byte long, the length counted in bytes, a block filled exactly; in HMAC a key of exactly one block and the inner pad; in PBKDF2 one iteration fewer, no accumulation and a skipped block counter; <code>ct_eq</code> ignoring lengths; base64 with the wrong padding character, padding accepted before the end and non-zero discarded bits accepted; in SCRAM the key label, zero iterations in a verifier, the nonces joined in the wrong order, a second first message accepted, the proof combined with OR, any proof accepted, one salt for all missing users, a client that accepts any server signature or a server nonce that adds nothing, the server signature made with the wrong key, user names not escaped; on the wire any cleartext password accepted, the terminator missing, a failed login not refused or refused with another code, any mechanism accepted, a fixed verifier for missing users, a fixed server nonce, no server signature sent, an empty mechanism list and a truncated initial response accepted. <strong>All 36 were killed</strong> except four equivalent mutants (previous note); three of the 36 survived until a streaming test, a zero-iteration verifier with valid keys and a user name containing <code>=</code> and <code>,</code> were added.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong> uses <code>SCRAM-SHA-256</code> as the default password method since version 14 (<code>password_encryption</code>), stores the verifier in the same text format used here, and has <code>scram_iterations</code> (default 4 096) since version 16. Its <code>md5</code> method is deprecated: the stored hash is the credential and a stolen hash can be used to log in. The server runs a <strong>mock authentication</strong> for roles that do not exist, as implemented here, so that <code>pg_hba.conf</code> and the exchange do not reveal them. <code>SCRAM-SHA-256-PLUS</code> adds channel binding with <code>tls-server-end-point</code>.</li> <li><strong>MongoDB</strong> uses SCRAM-SHA-256 by default; <strong>Kafka</strong> offers SCRAM-SHA-256 and SCRAM-SHA-512; <strong>MySQL 8</strong> uses <code>caching_sha2_password</code> (SHA-256 with a cache and an RSA or TLS channel for the first login).</li> <li><strong>Memory-hard hashes</strong> (<code>scrypt</code>, <code>bcrypt</code>, <code>argon2id</code>) are the choice for application passwords because PBKDF2 is cheap on GPUs. SCRAM's structure fixes PBKDF2 for the protocol's interoperability; newer mechanisms such as OPAQUE (an augmented password-authenticated key exchange) move the password hashing so that even a captured transcript cannot be attacked offline.</li> <li><strong>Cloud databases</strong> often replace passwords with tokens: RDS IAM authentication and Cloud SQL IAM sign a short-lived token that the client sends as the password; Kerberos (<code>GSSAPI</code>), client certificates and OIDC/OAuth bearer tokens (PostgreSQL 18's <code>oauth</code>) are the other usual methods.</li> <li><strong>Connection poolers</strong> (PgBouncer, pgcat) either keep the verifiers and complete SCRAM themselves or pass the exchange through, which is why a pooler needs access to the credentials.</li> <li><strong>Brute force protections</strong>: <code>auth_delay</code>, connection rate limits, lockouts and <code>fail2ban</code> sit around the protocol, not in it.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>No TLS means no confidentiality</strong>: a captured SCRAM transcript supports offline guessing of the password, and everything after the login is in the clear. Run the protocol inside TLS and bind to it where the server supports it.</li> <li><strong>No rate limiting here.</strong> Nothing slows a client that tries a million passwords; production servers add delays, limits per address and per user, and logging that does not include the password or the proof.</li> <li><strong>The client accepts any iteration count.</strong> A hostile server can send <code>i=4294967295</code> and keep a client busy for hours. Clients cap the count they accept.</li> <li><strong>Salt reuse and nonce reuse</strong>: salts must be random per verifier and nonces random per login; <code>random_nonce</code> reads the operating system's source and a test double that fixes the nonce must never reach a deployment.</li> <li><strong>Timing</strong>: comparing proofs and keys must not stop at the first difference (<code>ct_eq</code>), and an unknown user must cost the same as a known one — the mock verifier does that for the exchange, but not for any database lookup that is slower for missing names.</li> <li><strong>Passwords are bytes.</strong> SCRAM specifies SASLprep normalization of the password so that different Unicode spellings of one password agree; this implementation hashes the bytes it is given. Non-ASCII passwords interoperate only if both sides agree on the normalization.</li> <li><strong>A verifier is still a secret.</strong> It cannot log in, but with the salt and iteration count it allows offline guessing, and <code>ServerKey</code> lets whoever holds it impersonate the server to that user. Protect the table of verifiers like a table of passwords.</li> <li><strong>Changing a password</strong> means producing a new verifier with a new salt, on the server or from a client that sends the password over a protected channel; sending a verifier chosen by the client is allowed by PostgreSQL and moves the guessing target to the client's machine.</li> </ul></aside>
"""
