[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A benchmark answers a question; write the question first.</strong> "Which index structure serves this read-heavy workload with the least memory?" is a question. "How fast is it?" is not. The question decides the workload, the data size, the hardware, the metric and the baseline.</li> <li><strong>A benchmark is a program, and programs have bugs.</strong> Before measuring a system, check the instrument: the key generator really has the skew it claims, the latency histogram is within its error bound of the exact quantiles, the operation mix has the stated proportions, the results of the benchmark queries are <em>correct</em>. Every instrument below is tested against an exact computation, and one of them (the Zipfian generator of YCSB) turned out to be approximate in a way worth knowing.</li> <li><strong>Report a distribution, not a number.</strong> Throughput is a mean; users feel the tail. Record every latency in a histogram with bounded error (here 1.6%), report p50, p99, p99.9 and the maximum, and never average percentiles.</li> <li><strong>A closed-loop client measures the wrong thing during a stall.</strong> A client that sends the next request when the previous one returns stops sending when the server stalls, so the requests that <em>would</em> have arrived during the stall are never made and never charged. This is <strong>coordinated omission</strong>. Measure latency from when the request was <em>meant</em> to be sent (an open loop with a schedule), or correct a closed-loop histogram for the missing waits.</li> <li><strong>Two runs of the same program differ.</strong> Frequency scaling, thermal state, other processes, memory layout and caches move a result by percent. A claim of "10% faster" from one run each is a coin flip; repeat, report the median with a confidence interval, and compare with an interval for the <em>ratio</em>.</li> <li><strong>Check the answer before the time.</strong> A fast wrong answer is not a result. The comparison with SQLite below asserts that both systems return the same numbers before it prints a time.</li> </ul>
"""

