[[sections]]
heading = "Design notes"
body = """
Rules: (1) **always** benchmark with --release; (2) run the code several times and report the **median** (not one run); (3) wrap inputs/outputs in `black_box` so the optimiser cannot delete the work; (4) change one thing at a time; (5) measure before optimising.

For statistical rigour use criterion <https://github.com/bheisler/criterion.rs> and divan <https://github.com/nvzqz/divan> ; to see **where** time goes use flamegraphs (cargo flamegraph).
"""

