heading = "Official test folders by slice"
body = """
<div class="cb-g-tt"><table class="cb-g-map"> <thead><tr><th>Slice</th><th>Enable these folders in <code>tests/lox/official</code></th></tr></thead> <tbody> <tr><td>1–2</td><td>None. Use unit tests. <code>scanning/</code> and <code>expressions/</code> expect the book's debug output modes, so skip them unless you add those modes</td></tr> <tr><td>3</td><td><code>assignment/ bool/ comments/ nil/ number/ operator/ print/ string/ variable/</code>, <code>precedence.lox</code>, <code>empty_file.lox</code>, <code>unexpected_character.lox</code></td></tr> <tr><td>4</td><td><code>block/</code></td></tr> <tr><td>5</td><td><code>if/ while/ for/ logical_operator/</code></td></tr> <tr><td>6</td><td><code>function/ call/ closure/ return/</code></td></tr> <tr><td>7</td><td>The resolver-error files in <code>variable/</code>, <code>closure/</code> and <code>return/</code></td></tr> <tr><td>8</td><td><code>class/ field/ method/ constructor/ this/ inheritance/ super/ regression/</code></td></tr> <tr><td>never</td><td><code>limit/</code> (clox limits), <code>benchmark/</code> (use with hyperfine)</td></tr> </tbody> </table></div>

<p>The book's runner in <code>tool/bin/test.dart</code> lists exactly which files each chapter includes and skips. When a folder mixes features from different slices, use that list to decide which files to enable.</p>
