[[sections]]
heading = "Overview"
body = """
```text title="Cargo.toml"
[dev-dependencies]
insta = "1"
pretty_assertions = "1"
proptest = "1"

[profile.release]
debug = true          # symbols for samply / Instruments
```

```sh title="shell"
cargo install bacon cargo-insta cargo-nextest cargo-llvm-cov hyperfine samply

bacon test                                   # re-run tests on save
cargo insta test --review                    # accept or reject parser snapshots
LOX_FILTER=closure cargo test --test lang    # one golden folder
cargo llvm-cov --html                        # which match arms never ran

cargo build --release
hyperfine --warmup 3 'target/release/rlox bench/fib.lox'
samply record target/release/rlox bench/fib.lox

# official suite
git clone https://github.com/munificent/craftinginterpreters /tmp/ci
cp -r /tmp/ci/test tests/lox/official
```
"""

[[sections]]
heading = "Property test: the lexer never panics and spans cover the source in order"
body = """
```rust title="src/lexer.rs, tests"
use proptest::prelude::*;

proptest! {
    #[test]
    fn lexer_total(src in "\\\\PC*") {
        let mut prev = 0;
        for t in Lexer::new(&src) {
            prop_assert!(t.span.start >= prev);
            prop_assert!(t.span.end > t.span.start);
            prop_assert!(src.is_char_boundary(t.span.start as usize));
            prop_assert!(src.is_char_boundary(t.span.end as usize));
            prev = t.span.end;
        }
    }
}
```
"""

[[sections]]
heading = "Fuzz the front end"
body = """
<p>Fuzz the parser, not the interpreter. A fuzzer will quickly find <code>while (true) {}</code> and stall on it.</p>

```rust title="fuzz/fuzz_targets/parse.rs (cargo +nightly fuzz run parse)"
#![no_main]
use libfuzzer_sys::fuzz_target;

fuzz_target!(|data: &[u8]| {
    if let Ok(src) = std::str::from_utf8(data) {
        let _ = rlox::parse(src);
    }
});
```
"""

