[[sections]]
heading = "Overview"
body = """
<p>BusTub gives you CMake, GoogleTest, AddressSanitizer and clang-tidy. The Rust equivalents are better in most respects, but you have to assemble them yourself. Set them up before stage 1. Adding a model checker after a concurrency bug has already shipped is much harder than having one from the start.</p>
"""

[[sections]]
heading = "Install"
body = """
```sh title="one-time setup"
rustup component add clippy rustfmt llvm-tools-preview miri rust-src
rustup toolchain install nightly --component miri rust-src   # miri + sanitizers need nightly
cargo install cargo-nextest cargo-llvm-cov cargo-fuzz flamegraph cargo-criterion \\
              cargo-expand cargo-asm cargo-udeps cargo-deny cargo-machete
cargo install sqllogictest-bin        # the `sqllogictest` runner binary
brew install hyperfine                 # CLI benchmarking (macOS)
# Linux boxes for perf work: perf, bpftrace, valgrind (cachegrind), heaptrack
```
"""

[[sections]]
heading = "Workspace config"
body = """
```rust title="Cargo.toml (workspace root)"
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]          # pin versions once, inherit with `dep.workspace = true`
proptest = "1"
loom = "0.7"
shuttle = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
parking_lot = "0.12"
crossbeam = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rand = "0.9"
bytes = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"   # every `unsafe {}` needs a // SAFETY: comment
cast_possible_truncation = "warn"     # page offsets: u16 <- usize truncation is a classic bug
dbg_macro = "warn"

[profile.release]
debug = "line-tables-only"            # symbolized flame graphs without bloat
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.dev.package."*"]
opt-level = 2                          # deps optimized even in debug: tests run faster
```

<aside data-call="rust"><b>Lints as a contract</b><p><code>clippy::undocumented_unsafe_blocks</code> is the cheapest safety process there is. It makes every <code>unsafe</code> block carry a <code>// SAFETY:</code> comment stating the invariant it relies on, and code review then checks the invariant, not the code. <code>cast_possible_truncation</code> catches <code>offset as u16</code> in slot arrays. That bug corrupts pages silently once they grow past 64 KiB, or once a test uses a larger page. Each crate opts in with <code>[lints] workspace = true</code>. Reference: <a href="https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section" target="_blank" rel="noreferrer">Cargo book, <code>[lints]</code></a>.</p></aside>
"""

