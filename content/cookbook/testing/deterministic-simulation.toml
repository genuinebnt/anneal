<ul> <li><strong>The correct register passes 6 000 seeds in all weathers.</strong> 116 686 operations, 2.4 million events, 2 471 virtual seconds (41 minutes of cluster time) in 0.1 s of wall time on this machine, with 205 014 messages dropped (in 4 109 runs), duplicated messages in 2 992 runs, 10 678 replica crashes (2 936 runs), 6 072 partitions (2 992 runs), 305 operations given up on and 619 disk writes lost to a crash, 13 of which would have finished after the replica came back. The test insists that these happen in many runs: a simulator that stops injecting faults still passes.</li> <li><strong>Every planted bug is found within the first seeds.</strong> The first failing seed is between 0 and 6, and the fraction of failing seeds among the first 2 000 ranges from 1% (<code>no_write_back</code>, which needs a read to overlap a write that reached only some replicas) to 99% (<code>early_write_ack</code>). Rarer bugs need more seeds; the rate is the number to watch when you change the fault model.</li> <li><strong>A failing seed replays exactly</strong>, with the same trace hash, and the bug-free system passes the same seed.</li> <li><strong>Shrinking reduces 18 to 27 operations to 3 to 6.</strong> The shrinker (deleting stretches, zeroing stretches, lowering single choices, within a budget of 60 000 replays) reduced, for example, <code>ack_before_persist</code> from 21 operations and 987 choices to 3 operations and 55 choices; <code>no_write_back</code> from 27 operations, 101 drops and 5 crashes to 4 operations.</li> <li><strong>The smallest failure is readable.</strong> For reads without write-back it is the classic new/old inversion: two writes that never completed (their messages reached some replicas), a read that returned the newer value, and a later read of the same client that returned the initial value <code>0</code>. No sequential register explains it, since a write takes effect once.</li> <li><strong>Iterating a hash map breaks determinism.</strong> Forty runs of one seed gave 1 distinct trace when the retransmission order came from a sorted range and 6 when it came from a <code>HashMap</code>, whose iteration order is randomized per map. One such line and "reproduce from the seed" is gone. The same applies to reading the clock, spawning threads, and any use of addresses or thread ids as data.</li> </ul>

<aside data-call="note"><b>What the mutants of the simulator found</b><p>The simulator has its own bugs, and the way to find them is to plant some. 16 mutants of the code (a majority of half the replicas; applying every store; reads taking the first reply; no <code>+ 1</code> on write timestamps; no writer id; the network never dropping, duplicating or cutting; crashed replicas never restarting; clients giving up at once; duplicate replies counted twice; an operation returning at the time it was called; …) were killed by the tests, 15 of 16. Two of them mattered because they were first <em>not</em> killed. A crash that did not lose writes already in flight to the disk survived at first, because with a downtime of at least 5 ms and a disk delay of at most 5 ms a write could never finish after the restart, so the epoch check was never exercised. The downtime now starts at 0.5 ms, the run counts writes lost to crashes and, among them, those that would have finished after a restart (13 of 619), and the test requires both. The surviving mutant, ignoring the phase number of a reply, is equivalent: a late reply of the wrong kind is already ignored by its message type.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>One tape for every random decision.</strong> <code>Tape::next(m)</code> returns a value in <code>0..m</code> from the recorded or replayed choices. The simulator never calls any other source of randomness, which is what makes "the tape is the scenario" true.</li> <li><strong>An event queue ordered by <code>(time, sequence)</code>.</strong> <code>BinaryHeap&lt;Reverse&lt;(u64, u64, usize)&gt;&gt;</code> with the event bodies in a <code>Vec</code>: two events at the same virtual time run in the order they were scheduled, so ties never depend on memory addresses.</li> <li><strong>History times from the event counter.</strong> The call and return times in the history are the number of events processed so far, not the virtual time: events at the same virtual time are still ordered, which the linearizability check needs.</li> <li><strong><code>Config</code> and <code>Bugs</code> as plain data</strong>, with <code>Bugs::only(i)</code>: a test iterates over the bugs by index, and a table in a report is a loop.</li> <li><strong>No <code>HashMap</code> iteration, no <code>Instant::now</code>, no threads</strong> anywhere in the simulation path. The one deliberate exception is behind <code>hazard_hash_order</code>, to show what happens.</li> <li><strong>Replays are pure.</strong> <code>run(&amp;Config, Tape)</code> returns a <code>Run</code> and shares nothing, so shrinking runs it tens of thousands of times and a test can run the same seed on four threads and compare.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Determinism</strong>: 200 seeds run twice give equal trace hashes, event counts, virtual times, histories and tapes; 200 seeds give at least 195 different traces; one seed on four threads at once, and again after other seeds, gives one trace.</li> <li><strong>The hazard</strong>: with <code>hazard_hash_order</code> off, 40 runs of a seed give one trace; on, more than one.</li> <li><strong>The correct register</strong>: 6 000 seeds, all linearizable; the run must also inject drops in more than a third of the runs, duplicates in more than a quarter, crashes in more than a quarter, partitions in more than a sixth, lose more than 100 disk writes to crashes (more than 10 that would have completed after the restart), give up on some operations but fewer than 2%.</li> <li><strong>The bugs</strong>: each is found in the first 3 000 seeds, fails the same way on replay, and the bug-free system passes the same seed.</li> <li><strong>Shrinking</strong>: the shrunk run still fails, is no larger, and for reads without write-back has at most 8 operations.</li> <li><strong>Mutants run against these tests</strong> (16): the correct register with a majority of half, every store applied, first reply read, write timestamps not incremented, no writer id, a crash that does not lose in-flight writes, the network that never drops, never duplicates or never cuts, a replica that never restarts, clients that give up at once, duplicate replies and acks counted twice, an operation that returns when it was called, late replies of an earlier phase accepted, and an acknowledgement sent before the write even when the bug is off. <strong>Killed: 15 of 16</strong> (the other is equivalent, see the note).</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>FoundationDB</strong> was built on a deterministic simulator from the first day: the database is written in a language extension (Flow) whose actors can run on a simulated network and disk, with a "buggify" mechanism that makes rare paths common in simulation. Simulation is the main way the database is tested before release. The paper (<em>FoundationDB: A Distributed Unbundled Transactional Key Value Store</em>, SIGMOD 2021) describes it.</li> <li><strong>TigerBeetle</strong> runs the real server code in a simulator (the VOPR) with a simulated network and storage that inject faults.</li> <li><strong>Antithesis</strong> sells a deterministic hypervisor that runs unmodified software in a reproducible environment and explores faults and schedules, extending the idea to systems that were not written for it.</li> <li><strong>In Rust</strong>: <code>madsim</code>, <code>turmoil</code> (for Tokio programs) and <code>shuttle</code> (randomized scheduling of threads) bring the approach to async and concurrent code; <code>loom</code> explores all interleavings of a small concurrent program under the C++ memory model.</li> <li><strong>Jepsen</strong> tests real clusters with real nemeses and checks histories (<a href="/cookbook/p/testing-a-database">Testing</a>); it finds bugs in the shipped binary that a simulator of a model cannot, and cannot replay them.</li> <li><strong>Shrinking</strong> comes from property-based testing (QuickCheck, Hypothesis, <code>proptest</code>); Hypothesis's design, where the data are generated from a byte stream that is then shrunk, is the same idea as the tape here.</li> <li><strong><code>rr</code></strong> records and replays a real execution, deterministically, for debugging a failure that has happened.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Every escape from the simulator is a lost seed.</strong> Real time, real threads, hash-table iteration order, addresses, <code>thread_local</code> state shared between runs, system randomness, a library that spawns a thread: each makes the next failure irreproducible. Test for it (run a seed twice and compare traces), as the first test here does.</li> <li><strong>A fault model is a claim.</strong> If the simulator never reorders messages of a connection, never corrupts a disk page, never skews a clock, the system is untested against them. List what is not injected next to what is.</li> <li><strong>Faults must be common enough to matter and rare enough to let the system make progress.</strong> Tune the world by measuring: the fraction of operations that complete, the fraction of runs with each kind of fault.</li> <li><strong>The checker is part of the test.</strong> A checker that accepts too much (concurrent when it should be ordered) hides bugs; one that rejects correct histories wastes time. Check it against known-good and known-bad histories (<a href="/cookbook/p/testing-a-database">Testing</a>).</li> <li><strong>Shrinking changes the story.</strong> The shrunk scenario is the <em>smallest</em>, not the <em>original</em>: the original might have failed for a different reason too. Fix the shrunk bug and run the seed again.</li> <li><strong>Simulating a model is not simulating the code.</strong> A protocol that is right in the model can be wrong in the implementation (a missing <code>fsync</code>, an integer overflow). Run the real code under the simulator where you can.</li> <li><strong>Deterministic does not mean complete.</strong> A million seeds explore a million schedules out of astronomically many; the point is to find the common bugs fast and to make the rare ones reproducible when they appear.</li> </ul></aside>
