[[sections]]
heading = "Outside suites: other people's tests"
body = """
<p>Everything above is a test the same author wrote, and shares the author's blind spots. Three suites written by other people size what is missing. They are in <code>verify/</code> and re-run with one command each.</p>

<div class="cb-g-tt"><table> <thead> <tr> <th>Suite</th> <th>What it checks</th> <th>Run</th> <th>Result</th> </tr> </thead> <tbody> <tr> <td>SQLite's <strong>sqllogictest</strong> corpus (<code>select1-3.test</code>, eight <code>evidence/</code> files; 5,679 records, vendored unmodified)</td> <td>the SQL surface and its answers, row for row or by MD5 of the result</td> <td><code>cargo test --release --test slt_ext -- --nocapture</code></td> <td><strong>2,701 / 5,679 pass</strong>; the output ends with the failures grouped by error</td> </tr> <tr> <td><strong>Hermitage</strong>'s scenarios (Kleppmann), re-implemented against the MVCC layer</td> <td>the isolation anomalies G0, G1a/b/c, OTV, PMP (read and write predicates), P4, G-single (three forms), G2-item, G2 and Fekete's two-edge example, at snapshot isolation and serializable</td> <td><code>cargo test --release --test hermitage</code></td> <td>8 tests pass; the expected outcomes are PostgreSQL's "repeatable read" and "serializable" columns</td> </tr> <tr> <td><strong>Maelstrom</strong> (Jepsen), the linearizable key-value workload with network partitions</td> <td>the Raft implementation, as a real process exchanging JSON over a simulated network</td> <td><code>tools/maelstrom_raft.sh</code></td> <td>5 nodes, 60 s, partitions every 10 s: 4,586 operations (2,270 ok, 2,208 definitely failed, 108 indeterminate), <strong>linearizable</strong></td> </tr> </tbody> </table></div>

<p>What the SQLite corpus found. The first run passed 1,764 of 5,679 records. Two features were missing that no author-written test had asked for: <code>CASE</code> expressions and <code>ORDER BY 2</code> (an ordinal, which the engine had read as the constant 2 and therefore silently did not sort). Both were small; they brought the count to 2,701. <strong>What was left was almost one thing</strong>: 2,923 of the 2,978 failures were <code>unexpected SELECT in expression</code>, i.e. scalar subqueries, <code>IN (SELECT …)</code> and <code>EXISTS</code>, correlated and not. Implementing them (<a href="/cookbook/p/sql-front-end">P3.2</a>, "Subqueries in expressions") took the corpus to <strong>5,642 / 5,679</strong>: <code>select1.test</code>, <code>select2.test</code> and <code>select3.test</code> pass <strong>every</strong> record (5,413 records, many compared by MD5), including three-level correlated subqueries and <code>NOT IN</code> over NULLs. Adding <code>UNIQUE</code> column constraints lifted <code>in1.test</code> from 58 to 128 of 132. The 37 that remain are SQLite-specific (<code>DROP VIEW</code>, <code>INSERT OR REPLACE</code>, blob literals <code>x'…'</code>, triggers). The ratchet (<code>SQLITE_BASELINE.txt</code>) holds the per-file counts.</p>

<p>What Hermitage checks that the earlier tests did not. The model test compares the MVCC layer with a model written from the same understanding of the rules; Hermitage is somebody else's list of the situations that go wrong. The scenarios passed on the first run, and the serializable ones are not vacuous: the write-skew, predicate-cycle and Fekete tests <em>fail</em> when the commit-time validation is removed. Two differences from PostgreSQL are deliberate and written next to the tests: a blocked write is a first-writer-wins conflict here (the second writer's statement fails and taints its transaction instead of waiting), and serializable conflicts are found when the transaction commits, not at the statement that completes the cycle.</p>

<p>What Maelstrom checks, and its negative control. <code>src/bin/maelstrom_raft.rs</code> wraps the guide's <code>raft::Node</code> in Maelstrom's protocol (JSON on stdin and stdout; a follower forwards a client request to the leader it knows, and the leader answers the client directly once the entry is applied; <strong>reads go through the log</strong>). The checker (Knossos-style linearizability over the whole history, per key) said the run is valid. A passing run proves little unless the checker can fail, so the node has a switch, <code>MAELSTROM_UNSAFE_LOCAL_READS</code>, that answers reads from whatever the node has applied: the same workload then ends with <code>Analysis invalid!</code> (<code>tools/maelstrom_raft.sh --unsafe</code>). Raft needed one addition for the workload: a compare-and-set command in the replicated state machine (<code>Cmd::Cas</code>, with "no such key" and "mismatch" outcomes), which exactly-once suppression covers like the other commands.</p>

<p>Not done: DuckDB's sqllogictest files (they test DuckDB's extensions as much as SQL), Jepsen's own database tests, sharding under Maelstrom, process crashes (Maelstrom does not kill processes; the simulator's crash tests remain the evidence there), and a pgwire-level run, which would size the driver gap rather than the SQL gap.</p>
"""

[[sections]]
heading = "Measured"
body = """
<p><strong>The oracles on the engine of Parts I and III</strong>, 40 to 80 seeds each of random tables (10 to 30 rows with NULLs, duplicates and boundary values), random <code>FROM</code> clauses (one table, inner and left joins of two and three tables, cross joins), random predicates of depth 3:</p>

```text title="how many checks each oracle made on the unmodified engine"
TLP (scans, joins, aggregates, GROUP BY, DISTINCT, HAVING): 8775 checks passed, 225 skipped because a query raised an error; 4.5 s
NoREC: 3135 checks passed, 65 skipped; 0.4 s
differential (optimizer on/off, with/without indexes): 6302 checks passed, 94 skipped, 4 where one plan raised an error the other avoided; 1.6 s
row-wise expression evaluation: 3159 checks passed, 41 skipped; 0.5 s
SQLite as the reference: 2400 queries returned the same rows, 0 skipped because the engine raised an error; 1.1 s
360000 inputs in 0.8 s: 4402 parsed, 295598 rejected with an error, 622 damaged queries still ran; 0 panics
```

<p>No oracle found a wrong result. That is a result, not a failure of the method: the engine had been compared with SQLite and mutation-tested already. What the oracles are worth is measured the other way, by planting bugs.</p>

<p><strong>The detection matrix.</strong> 21 plausible bugs were planted one at a time in the engine (in the evaluator, the simplifier, the optimizer's predicate pushdown, the lowering of <code>BETWEEN</code> and <code>IN</code>, the aggregates and the joins). Each row below says which test suites fail. <em>TLP</em>, <em>NoREC</em>, <em>diff</em> (optimizer and index differential), <em>row</em> (row-wise evaluation) and <em>SQLite</em> are the five oracles of this section; <em>fuzz</em> is the older random-query comparison with SQLite from Part III; <em>unit</em> the engine's own tests; <em>simp</em> the property test of the simplifier against the evaluator.</p>

```text title="which test suites catch each seeded engine bug (X = the suite fails)"
seeded engine bug                                                     TLP  NoREC   diff    row SQLite   fuzz   unit   simp
a comparison with one NULL operand is not NULL                          X      X      X      .      X      X      X      X
IS NULL and IS NOT NULL are swapped                                     X      .      .      .      X      X      X      X
NOT NULL is true                                                        X      X      X      .      X      X      X      X
FALSE OR NULL is FALSE                                                  .      .      .      .      X      .      .      .
<= behaves as <                                                         X      X      X      .      X      X      .      X
the remainder of a negative number takes the divisor's sign             .      .      .      .      X      .      .      .
NOT (a < b) becomes a > b                                               X      X      X      .      X      .      .      X
a range covering every integer is TRUE, forgetting NULL                 .      .      .      .      .      .      .      X
x < k becomes x <= k when ranges are merged                             .      X      X      .      X      X      .      X
merging two upper bounds takes the larger                               X      X      X      .      X      X      X      X
ranges two apart are merged as adjacent                                 X      X      X      .      X      X      .      .
a filter on the right of a LEFT JOIN is pushed into the right input      X      X      X      .      X      .      X      .
a filter on both sides of a LEFT JOIN becomes part of its condition      X      X      X      .      X      .      .      .
BETWEEN excludes its upper bound                                        .      .      .      .      X      X      .      .
NOT IN ignores the NOT                                                  .      .      .      .      X      .      X      .
COUNT(x) counts NULLs                                                   .      .      .      .      X      X      X      .
SUM of no rows is 0                                                     .      .      .      .      X      X      X      .
MIN keeps the largest                                                   X      .      .      .      X      X      X      .
COUNT(DISTINCT x) counts repeats                                        .      .      .      .      X      .      X      .
a hash LEFT JOIN drops unmatched rows                                   .      .      X      .      X      X      X      .
a nested-loop LEFT JOIN null-extends matched rows                       .      .      X      .      X      X      .      .
caught (of 21)                                                         10      9     11      0     20     13     11      8
```

<ul> <li><strong>Every bug was caught by something; SQLite caught 20 of 21.</strong> The one it missed (a range that covers every integer simplified to <code>TRUE</code>, forgetting that NULL is in no range) is caught only by the simplifier's property test, which compares simplified and unsimplified predicates on random rows including NULLs. A reference system is not enough on its own.</li> <li><strong>The consistency oracles caught 9 to 11 of 21 each</strong>, together 13. They catch exactly the bugs that make the engine <em>disagree with itself</em>: pushing a filter through a left join, merging ranges wrongly, evaluating <code>NOT</code> incorrectly in one place. They cannot catch a bug that is wrong in the same way everywhere: <code>FALSE OR NULL</code> giving FALSE, <code>%</code> taking the wrong sign, <code>BETWEEN</code> excluding its upper bound, <code>COUNT(x)</code> counting NULLs, <code>SUM</code> of nothing being 0, <code>NOT IN</code> ignoring the NOT. Seven of the 21 were found by the SQLite oracle and by no consistency oracle.</li> <li><strong>The row-wise oracle caught nothing.</strong> The idea (compare the evaluator with the constant folder) is sound, but the folder calls the evaluator, so they cannot disagree; the bugs that matter live elsewhere. It stays in the table as a measured negative result.</li> <li><strong>Old tests missed bugs the new ones found, and the other way round</strong>: the Part III fuzz against SQLite did not notice <code>COUNT(DISTINCT x)</code> counting repeats, nor <code>NOT IN</code> ignoring the NOT; the new SQLite oracle (which draws <code>COUNT(DISTINCT …)</code> and <code>GROUP BY</code> queries) did. The fuzz test caught <code>BETWEEN</code> and the aggregate bugs that the consistency oracles could not. Different generators reach different shapes.</li> <li><strong>One category is not a bug:</strong> in 4 of the 6 302 differential queries one plan raised <em>division by zero</em> where the other returned rows, because a plan that evaluated a condition on a row the other plan had already excluded failed. SQL leaves the order of evaluation unspecified, so these are counted separately and not as wrong results; the same effect is what <a href="/cookbook/p/roles-privileges-and-row-level-security">row-level security</a> must defend against.</li> </ul>

<p><strong>Fuzzing the front end.</strong> 360 000 inputs (150 000 random strings biased towards SQL characters, 150 000 sequences of real tokens, and 60 000 valid queries damaged in one to three places and then executed) produced 4 402 statements that parsed, 295 598 rejected with an error, 622 damaged queries that still ran, and <strong>no panic</strong>. The inputs were then widened to the shapes that random generation cannot build:</p>

<ul> <li><strong>10 000 nested parentheses overflowed the stack</strong> and aborted the process. The parser is recursive and so are binding, simplification, evaluation and the drop of the expression tree. The same happens for <code>NOT NOT NOT …</code>, <code>- - - …</code>, and a chain of <code>a + b + c + …</code>, since a left-associative chain is a left-deep tree.</li> <li><strong>An <code>IN (…)</code> list of 10 000 values overflowed the stack</strong>, although the parser is iterative over the list: the binder turned it into <code>x = 1 OR x = 2 OR …</code>, a left-deep tree of 10 000 levels. Lists of 1 000 and 2 000 worked; 100 000 values is an ordinary generated query.</li> </ul>

<p>Both are denial-of-service bugs if a network client can send the query: connection threads of the wire server (<a href="/cookbook/p/the-postgresql-wire-protocol">M19</a>) are ordinary threads with the default stack size of 2 MiB, so such a statement would end the server process. I did not test that over a socket; the stack overflow in a 2 MiB thread was reproduced in-process. The fixes: the parser bounds the depth of the tree it builds (1 000 levels, counting nesting, unary chains and the length of operator chains) and answers with an error; the binder and the simplifier build the OR of an <code>IN</code> list as a balanced tree, whose depth is the logarithm of the list. A regression test now runs each shape at 900 levels (it must run), at 1 500, 100 000 and 1 000 000 levels (it must fail with an error, not abort), and <code>IN</code>/<code>NOT IN</code> lists of 10, 1 000, 10 000 and 100 000 values on a 2 MiB stack. Random fuzzing alone would not have found either; the lesson is the one in the notes.</p>

<p><strong>The linearizability checker.</strong></p>

```text title="the checker on recorded histories and on the worst case for the search"
history                                          ops        time           verdict
2 clients on a mutex-protected store            1000      0.7 ms      Linearizable
4 clients on a mutex-protected store            2000      3.4 ms      Linearizable
8 clients on a mutex-protected store            4000     14.6 ms      Linearizable
16 clients on a mutex-protected store           8000     71.3 ms      Linearizable
4 overlapping writes, impossible read              5      0.0 ms   NotLinearizable
8 overlapping writes, impossible read              9      0.2 ms   NotLinearizable
12 overlapping writes, impossible read            13      7.3 ms   NotLinearizable
14 overlapping writes, impossible read            15     42.9 ms   NotLinearizable
16 overlapping writes, impossible read            17    272.0 ms   NotLinearizable
mutex-protected store: 40 of 40 histories (24000 operations) linearizable; store with a racy compare-and-swap: 40 of 40 histories rejected
2723 linearizable and 1277 not linearizable histories agree with the brute force; 1222 have pending operations
```

<ul> <li><strong>It agrees with trying every order.</strong> On 4 000 random histories of up to 7 operations (2 723 linearizable, 1 277 not, 1 222 with operations that never returned) the verdict equals that of a brute-force search over all orders.</li> <li><strong>It accepts correct code and catches a racy compare-and-swap.</strong> Four threads of 150 operations each on a mutex-protected map gave 40 histories (24 000 operations), all linearizable; the same workload on a map whose compare-and-swap reads, pauses for 40 µs and writes without holding the lock gave 40 of 40 histories rejected.</li> <li><strong>Checking many keys is cheap, one wide moment is not.</strong> 16 clients and 8 000 operations take 70 ms because each key is checked alone. But 16 writes that all overlap and a read of an impossible value take 272 ms, and each 2 more writes multiply the time by about 6: the number of states is exponential in the concurrency width, and the checker's step limit exists for that.</li> </ul>

<aside data-call="note"><b>What the matrix says about how to test</b><p>The cheapest oracle is not the best one. TLP and NoREC need no reference and found real inconsistencies; SQLite found more bugs (20 of 21) with the same generator because it knows what the answer is. Use both: consistency oracles when there is no second system (a new dialect, a new type), a reference when there is one, and a property test of every rewrite against the evaluator. Then measure your tests the way this table does: plant the bugs your engine could have, and count.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>A trait for the sequential specification.</strong> <code>Model { type State; type Input; type Output; fn init; fn step }</code> is the whole interface to the checker: a register, a map, a queue are 20 lines each. <code>step</code> takes <code>Option&lt;&amp;Output&gt;</code>, with <code>None</code> for an operation that never returned, so one function handles both.</li> <li><strong>Memoization keyed by a bit set and the state.</strong> <code>(Vec&lt;u64&gt;, State)</code> in a <code>HashSet</code> makes the search polynomial in the number of distinct (placed, state) pairs; <code>State: Clone + Eq + Hash</code> is all it needs.</li> <li><strong>A recursive search with an explicit step budget</strong> returns <code>Option&lt;bool&gt;</code>: <code>None</code> means "gave up", and the caller turns it into <code>Verdict::Unknown</code> rather than guessing.</li> <li><strong>Expressions as a small enum with a renderer.</strong> <code>E</code> has <code>sql(Option&lt;&amp;row&gt;)</code>, which renders the same tree either with column names or with a row's values as literals; the row-wise oracle needs both and the generator needs neither to know SQL.</li> <li><strong><code>catch_unwind</code> with <code>AssertUnwindSafe</code></strong> turns a panic in the system under test into data for the fuzz loop, and a silent panic hook keeps the output readable. A stack overflow is not a panic: it aborts, which is why the depth test runs on a thread with a fixed stack and lets the abort fail the test.</li> <li><strong>Hash-free comparison keys.</strong> Rows are compared as multisets by sorting on a key built with <code>-0.0</code> normalized to <code>0.0</code>, because SQL treats them as equal and a debug string does not.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Linearizability checker</strong>: textbook histories (stale read, new/old inversion, concurrent write and read, a value nobody wrote); operations that never returned (took effect, did not, took effect late, cannot take effect and vanish and take effect again, cannot take effect before its call); key-value histories with compare-and-swap of unknown outcome; keys independent; the step limit gives <code>Unknown</code>; 4 000 random histories against brute force; real threads on a correct and a racy store.</li> <li><strong>Oracles on the engine</strong>: 60 seeds of TLP (scans, joins, aggregates, <code>GROUP BY</code>, <code>DISTINCT</code>, <code>HAVING</code>), 80 of NoREC, 40 of differential, 80 of row-wise, 40 of SQLite (60 queries each); each asserts a minimum number of checks so that a generator that stops producing valid queries fails.</li> <li><strong>Fuzzing</strong>: 360 000 inputs, no panic; the depth and length shapes described above.</li> <li><strong>Mutants of the checker</strong> (12): real-time order ignored; operations that never returned must be placed; the memo ignoring the state; the next-operation bound taken from calls instead of returns; a register read returning anything; a never-returned write having no effect; a never-returned compare-and-swap never applying; an undecided key counted as linearizable; the search stopping when any operation is placed; failed states not remembered; a <code>Get</code> returning anything; a <code>Put</code> returning a value. <strong>All 12 were killed</strong> (one by the memory cap, the search without real-time order running away); one survived until a history with a <code>Put</code> that returns a value was added.</li> <li><strong>Mutants of the engine</strong> (21, the matrix above): every one is caught by at least one suite.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>SQLancer</strong> (Rigger) implements TLP, NoREC and pivoted query synthesis for SQLite, PostgreSQL, MySQL, MariaDB, CockroachDB, TiDB, DuckDB and others, and has reported hundreds of confirmed bugs; it is the model for the oracles here. Companies run it in CI against their own engines.</li> <li><strong>Jepsen</strong> (Kingsbury) tests databases from the outside under network partitions and clock skew, with checkers for linearizability (Knossos), and with <strong>Elle</strong> for transactional isolation levels, which infers anomalies from the structure of a history without searching all orders.</li> <li><strong>Differential and metamorphic testing</strong>: engines compare against PostgreSQL or SQLite using their <code>sqllogictest</code> suites (millions of statements); DuckDB's tests are sqllogictest files; DataFusion runs the same files against its engine.</li> <li><strong>Fuzzers</strong> are coverage-guided in production (libFuzzer, AFL, <code>cargo-fuzz</code>, OSS-Fuzz) and grammar-aware for SQL (SQLsmith, Squirrel); they report crashes and sanitizer findings. Memory-safe languages remove one class of finding (corruption) and keep the others (panics, aborts on overflow, hangs).</li> <li><strong>Crash and fault testing</strong>: failpoints inserted in the engine (TiKV's <code>fail-rs</code>, FoundationDB's simulation), disk-fault injection, and kill-9 loops; see <a href="/cookbook/p/deterministic-simulation">Simulation</a> and <a href="/cookbook/p/a-durable-lsm-tree">M7</a>.</li> <li><strong>Plan regression testing</strong>: the optimizer's plans for a corpus of queries are stored and any change is reviewed, and tools such as APOLLO look for performance regressions between versions automatically.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>A passing oracle proves little by itself.</strong> Count the checks, count the skips, and plant bugs. A generator that mostly produces queries the engine rejects has tested nothing.</li> <li><strong>Errors depend on evaluation order.</strong> Treat "one plan failed, the other did not" as a separate category, and decide deliberately whether it is a bug for your engine.</li> <li><strong>Floating point makes equality fuzzy.</strong> Sums added in a different order differ in the last bits; compare with a tolerance, and normalize <code>-0.0</code>.</li> <li><strong>Text is not portable between systems.</strong> SQLite changes the case of ASCII letters only; Unicode <code>upper</code> differs. The SQLite oracle leaves such functions out on purpose.</li> <li><strong>A linearizability check is only as good as the timestamps.</strong> Take the call time before sending and the return time after receiving, from a clock that does not go backwards; ties must be broken in favor of the permissive reading (concurrent), not the strict one.</li> <li><strong>Checking is exponential in the worst case.</strong> Partition the history by key, bound the steps, and shorten histories (many short runs find more than one long one).</li> <li><strong>A fuzzer needs the dangerous shapes.</strong> Add generators for depth, width and size, and for boundaries (empty, one, the largest integer, a string with a NUL).</li> </ul></aside>
"""

