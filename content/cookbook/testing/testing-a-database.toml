[[sections]]
heading = "Linearizability from the outside"
body = """
<p>A history is a list of operations, each with the client, the input, the output (or none if it never returned), and the times of the call and the return. The checker searches for an order. At each step it may linearize any operation that no unplaced, completed operation precedes in real time; it applies it to the sequential model; it recurses; it remembers the (placed-set, state) pairs that failed so that the search does not repeat itself (Lowe's refinement of Wing and Gong). A history is linearizable when all completed operations can be placed. Two models are included, a register and a key-value map with compare-and-swap; the map is checked key by key, because linearizability is <em>local</em>: a history is linearizable exactly when the history of each object is.</p>

:::deeper Reference: the linearizability checker, a register and a key-value model
```rust title="src/test/lin.rs"
//! A linearizability checker (Wing and Gong 1993, with Lowe's memoization of visited states). Given what clients observed of a concurrent
//! object, a history of operations with the times they were called and returned, it decides whether some total order of the operations
//! exists that respects real time (an operation that returned before another was called comes first) and in which every operation
//! returns what a sequential object would. It needs only the history, never the implementation, which is why it can check a database
//! from outside. Operations that never returned (a timeout, a crash) may or may not have taken effect, and may take effect at any time
//! after their call.
use std::collections::{BTreeMap, HashSet};
use std::hash::Hash;

/// A sequential specification: how the object behaves when operations are applied one at a time.
pub trait Model {
    type State: Clone + Eq + Hash;
    type Input: Clone;
    type Output: Clone + PartialEq;
    fn init(&self) -> Self::State;
    /// Apply `input`. `output` is what the client saw, or `None` when the operation never returned. Returns the next state, or `None`
    /// if the object could not have produced that output in this state.
    fn step(&self, state: &Self::State, input: &Self::Input, output: Option<&Self::Output>) -> Option<Self::State>;
}

#[derive(Clone, Debug)]
pub struct Op<I, O> {
    pub client: usize,
    pub input: I,
    /// `None` when the operation never returned.
    pub output: Option<O>,
    /// Logical or physical times; only their order matters. `call < ret`.
    pub call: u64,
    pub ret: u64,
}

#[derive(Debug, PartialEq, Eq, Clone, Copy)]
pub enum Verdict {
    Linearizable,
    NotLinearizable,
    /// The search was stopped after `limit` steps without an answer.
    Unknown,
}

/// Check one history. `limit` bounds the number of search steps (the problem is NP-complete).
pub fn check<M: Model>(model: &M, history: &[Op<M::Input, M::Output>], limit: u64) -> Verdict {
    let n = history.len();
    let words = n.div_ceil(64).max(1);
    let completed: Vec<usize> = (0..n).filter(|&i| history[i].output.is_some()).collect();
    let mut cache: HashSet<(Vec<u64>, M::State)> = HashSet::new();
    let mut steps = 0u64;
    let mut done = vec![0u64; words];
    let initial = model.init();
    match search(model, history, &completed, &mut done, &initial, &mut cache, &mut steps, limit) {
        Some(true) => Verdict::Linearizable,
        Some(false) => Verdict::NotLinearizable,
        None => Verdict::Unknown,
    }
}

fn bit(v: &[u64], i: usize) -> bool {
    v[i / 64] >> (i % 64) & 1 == 1
}

#[allow(clippy::too_many_arguments)]
fn search<M: Model>(model: &M, h: &[Op<M::Input, M::Output>], completed: &[usize], done: &mut Vec<u64>, state: &M::State, cache: &mut HashSet<(Vec<u64>, M::State)>, steps: &mut u64, limit: u64) -> Option<bool> {
    // success: every operation that returned has been placed in the order (pending ones may be left out)
    if completed.iter().all(|&i| bit(done, i)) {
        return Some(true);
    }
    if *steps >= limit {
        return None;
    }
    *steps += 1;
    if cache.contains(&(done.clone(), state.clone())) {
        return Some(false);
    }
    // an operation can go next if no unplaced operation had already returned before it was called
    let first_return = (0..h.len()).filter(|&i| !bit(done, i) && h[i].output.is_some()).map(|i| h[i].ret).min().unwrap();
    for i in 0..h.len() {
        if bit(done, i) || h[i].call > first_return {
            continue;
        }
        if let Some(next) = model.step(state, &h[i].input, h[i].output.as_ref()) {
            done[i / 64] |= 1 << (i % 64);
            let r = search(model, h, completed, done, &next, cache, steps, limit);
            done[i / 64] &= !(1 << (i % 64));
            match r {
                Some(true) => return Some(true),
                None => return None,
                Some(false) => {}
            }
        }
    }
    cache.insert((done.clone(), state.clone()));
    Some(false)
}

// ---- two models ------------------------------------------------------------------------------------------------------------------------

/// A single read/write register, initially 0.
pub struct Register;
#[derive(Clone, Debug, PartialEq)]
pub enum RegIn {
    Write(i64),
    Read,
}
#[derive(Clone, Debug, PartialEq)]
pub enum RegOut {
    Ack,
    Value(i64),
}
impl Model for Register {
    type State = i64;
    type Input = RegIn;
    type Output = RegOut;
    fn init(&self) -> i64 {
        0
    }
    fn step(&self, s: &i64, input: &RegIn, output: Option<&RegOut>) -> Option<i64> {
        match (input, output) {
            (RegIn::Write(v), None | Some(RegOut::Ack)) => Some(*v),
            (RegIn::Read, None) => Some(*s),
            (RegIn::Read, Some(RegOut::Value(v))) if v == s => Some(*s),
            _ => None,
        }
    }
}

/// A map from keys to values with `put`, `get` and compare-and-swap; absent keys read as `None`.
pub struct KvModel;
#[derive(Clone, Debug, PartialEq)]
pub enum KvIn {
    Put(u32, i64),
    Get(u32),
    Cas(u32, Option<i64>, i64),
}
#[derive(Clone, Debug, PartialEq)]
pub enum KvOut {
    Ack,
    Value(Option<i64>),
    Swapped(bool),
}
impl Model for KvModel {
    type State = BTreeMap<u32, i64>;
    type Input = KvIn;
    type Output = KvOut;
    fn init(&self) -> Self::State {
        BTreeMap::new()
    }
    fn step(&self, s: &Self::State, input: &KvIn, output: Option<&KvOut>) -> Option<Self::State> {
        let mut next = s.clone();
        match input {
            KvIn::Put(k, v) => {
                if !matches!(output, None | Some(KvOut::Ack)) {
                    return None;
                }
                next.insert(*k, *v);
            }
            KvIn::Get(k) => match output {
                None => {}
                Some(KvOut::Value(v)) if *v == s.get(k).copied() => {}
                _ => return None,
            },
            KvIn::Cas(k, expect, new) => {
                let ok = s.get(k).copied() == *expect;
                match output {
                    None => {}
                    Some(KvOut::Swapped(b)) if *b == ok => {}
                    _ => return None,
                }
                // a CAS whose result is unknown may or may not have applied; the search tries it as applied here and as dropped by leaving it out
                if ok {
                    next.insert(*k, *new);
                }
            }
        }
        Some(next)
    }
}

/// Check a key-value history one key at a time. Linearizability is local: a history is linearizable if and only if the history of each
/// object (here each key) is, so the search is over many small problems instead of one large one.
pub fn check_kv(history: &[Op<KvIn, KvOut>], limit: u64) -> Verdict {
    let key = |op: &Op<KvIn, KvOut>| match op.input {
        KvIn::Put(k, _) | KvIn::Get(k) | KvIn::Cas(k, _, _) => k,
    };
    let mut by_key: BTreeMap<u32, Vec<Op<KvIn, KvOut>>> = BTreeMap::new();
    for op in history {
        by_key.entry(key(op)).or_default().push(op.clone());
    }
    let mut unknown = false;
    for ops in by_key.values() {
        match check(&KvModel, ops, limit) {
            Verdict::NotLinearizable => return Verdict::NotLinearizable,
            Verdict::Unknown => unknown = true,
            Verdict::Linearizable => {}
        }
    }
    if unknown { Verdict::Unknown } else { Verdict::Linearizable }
}
