[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>A database can return a wrong answer without crashing.</strong> A wrong row count, a lost NULL, a join that keeps a row it should drop: nothing fails, the application just believes the result. Testing for this is the <em>oracle problem</em>: to know that a result is wrong you need an independent way to know what it should be. For SQL there is rarely a second implementation of the same dialect, so the practice is to find <strong>properties that must hold for any query on any data</strong>.</li> <li><strong>Ternary logic partitioning (TLP).</strong> For any predicate <code>p</code>, a row makes <code>p</code> true, false or NULL, and no row is two of those. So <code>SELECT … FROM t</code> must equal the union of <code>… WHERE p</code>, <code>… WHERE NOT p</code> and <code>… WHERE p IS NULL</code>. The identity extends to aggregates (counts and sums add, minimums and maximums combine), <code>GROUP BY</code>, <code>DISTINCT</code>, <code>HAVING</code> and joins. A bug that evaluates <code>p</code> or <code>NOT p</code> or <code>p IS NULL</code> inconsistently breaks the identity.</li> <li><strong>Non-optimizing reference engine construction (NoREC).</strong> <code>SELECT COUNT(*) FROM t WHERE p</code> goes through filter pushdown, index selection and simplification. <code>SELECT p FROM t</code> evaluates <code>p</code> as a projection and can be optimized almost not at all. The count of rows kept must equal the number of true values.</li> <li><strong>Differential execution.</strong> The same query with the optimizer on and off, with and without indexes, and (best of all) on a different system. SQLite is a free second opinion for the common subset of SQL.</li> <li><strong>Oracles based on consistency find inconsistent bugs.</strong> If the engine is wrong in the same way everywhere, TLP and NoREC and plan comparisons all agree with each other. Such bugs need a reference or a model. The detection matrix below measures how much that matters.</li> <li><strong>Concurrent systems are tested from the outside by their histories.</strong> Record what each client called and what it got back, with times, then ask whether <em>some</em> sequential order of the operations, consistent with real time, explains every result: this is <strong>linearizability</strong>. The checker needs no access to the system, which is why it can test a database across a network. Operations that never returned may or may not have happened, and the checker must allow both.</li> <li><strong>Fuzzing finds what authors do not think of, but only the shapes it can generate.</strong> Random bytes find parser panics quickly; they cannot build an expression nested ten thousand levels, a list of a hundred thousand values, or a string of a billion characters. Those are chosen on purpose.</li> </ul>
"""

[[sections]]
heading = "The oracles"
body = """
```text
TLP, for a predicate p and a FROM clause F
   bag( SELECT *  FROM F )  =  bag( SELECT * FROM F WHERE p )  ⊎  bag( … WHERE NOT p )  ⊎  bag( … WHERE p IS NULL )
   COUNT(*), COUNT(e)       add over the three partitions          SUM(e) adds the non-NULL sums (NULL if all are)
   MIN(e), MAX(e)           the extreme of the extremes             GROUP BY k: counts of equal keys add
   DISTINCT e               the union of the three DISTINCTs        HAVING h: the groups kept by h, NOT h, h IS NULL
NoREC       COUNT(*) … WHERE p                 =  number of true values in  SELECT p …
differential   optimizer on  =  optimizer off      indexes  =  no indexes      engine  =  SQLite
row-wise    SELECT e FROM t (row by row)  =  SELECT e with that row's values written in as constants
```

:::deeper Reference: the oracles (a typed random generator of schemas, data and expressions; TLP, NoREC, the differential checks, SQLite as a reference)
```rust title="src/test/qa.rs"
//! Finding wrong query results without a reference system. A *test oracle* is a property that must hold for any query on any data; the
//! tests generate random schemas, data and predicates, evaluate the property, and report a counterexample when it fails. Four oracles:
//!
//! * **TLP, ternary logic partitioning** (Rigger and Su 2020): for any predicate `p`, every row satisfies exactly one of `p`, `NOT p`,
//!   `p IS NULL`, so a query without a `WHERE` equals the union of the three queries with those conditions. It applies to plain scans,
//!   aggregates (`COUNT`, `SUM`, `MIN`, `MAX` combine across partitions), `GROUP BY`, `DISTINCT`, `HAVING` and joins.
//! * **NoREC, non-optimizing reference engine construction** (Rigger and Su 2020): `SELECT COUNT(*) FROM t WHERE p` goes through filter
//!   pushdown, index selection and simplification; `SELECT p FROM t` evaluates `p` as an ordinary projection. The number of true values
//!   must equal the count.
//! * **Differential execution**: the same query with the optimizer on and off, and with and without indexes, must agree.
//! * **Row-by-row evaluation**: an expression evaluated over a table must equal the expression with the row's values written in as
//!   constants (which the simplifier folds).
use crate::engine::Engine;
use crate::facade::Database;
use crate::value::Value;
use std::collections::BTreeMap;

pub struct Rng(pub u64);
impl Rng {
    pub fn n(&mut self, m: u64) -> u64 {
        self.0 ^= self.0 << 13;
        self.0 ^= self.0 >> 7;
        self.0 ^= self.0 << 17;
        self.0 % m
    }
    pub fn chance(&mut self, num: u64, den: u64) -> bool {
        self.n(den) < num
    }
    pub fn pick<'a, T>(&mut self, xs: &'a [T]) -> &'a T {
        &xs[self.n(xs.len() as u64) as usize]
    }
}

// ---- schemas, data, expressions --------------------------------------------------------------------------------------------------------

#[derive(Clone, Copy, PartialEq, Debug)]
pub enum Ty {
    Int,
    Float,
    Text,
    Bool,
}

/// The columns every generated table has: a unique integer `id`, two more integers, a float, a text and a boolean.
pub const COLUMNS: [(&str, Ty, &str); 6] = [("id", Ty::Int, "INTEGER"), ("i1", Ty::Int, "INTEGER"), ("i2", Ty::Int, "INTEGER"), ("f", Ty::Float, "FLOAT"), ("s", Ty::Text, "TEXT"), ("b", Ty::Bool, "BOOLEAN")];

#[derive(Clone, Debug)]
pub enum E {
    Col(String, Ty),
    Lit(String, Ty),
    Not(Box<E>),
    Neg(Box<E>),
    Bin(&'static str, Box<E>, Box<E>),
    Call(&'static str, Vec<E>),
    IsNull(Box<E>, bool),
    Between(Box<E>, Box<E>, Box<E>, bool),
    In(Box<E>, Vec<E>, bool),
}

impl E {
    /// SQL text. With `row`, every column reference is replaced by the literal for its value in that row (keyed by the column's text).
    pub fn sql(&self, row: Option<&BTreeMap<String, String>>) -> String {
        match self {
            E::Col(c, _) => row.map_or(c.clone(), |r| r[c].clone()),
            E::Lit(l, _) => l.clone(),
            E::Not(e) => format!("(NOT {})", e.sql(row)),
            E::Neg(e) => format!("(- {})", e.sql(row)),
            E::Bin(op, a, b) => format!("({} {op} {})", a.sql(row), b.sql(row)),
            E::Call(f, args) => format!("{f}({})", args.iter().map(|a| a.sql(row)).collect::<Vec<_>>().join(", ")),
            E::IsNull(e, not) => format!("({} IS {}NULL)", e.sql(row), if *not { "NOT " } else { "" }),
            E::Between(e, lo, hi, not) => format!("({} {}BETWEEN {} AND {})", e.sql(row), if *not { "NOT " } else { "" }, lo.sql(row), hi.sql(row)),
            E::In(e, list, not) => format!("({} {}IN ({}))", e.sql(row), if *not { "NOT " } else { "" }, list.iter().map(|x| x.sql(row)).collect::<Vec<_>>().join(", ")),
        }
    }
    pub fn ty(&self) -> Ty {
        match self {
            E::Col(_, t) | E::Lit(_, t) => *t,
            E::Not(_) | E::IsNull(..) | E::Between(..) | E::In(..) => Ty::Bool,
            E::Neg(e) => e.ty(),
            E::Bin(op, a, b) => match *op {
                "AND" | "OR" | "=" | "<>" | "<" | "<=" | ">" | ">=" => Ty::Bool,
                "||" => Ty::Text,
                _ if a.ty() == Ty::Float || b.ty() == Ty::Float => Ty::Float,
                _ => Ty::Int,
            },
            E::Call(f, args) => match *f {
                "length" => Ty::Int,
                "upper" | "lower" => Ty::Text,
                _ => args[0].ty(),
            },
        }
    }
}

pub struct Gen<'a> {
    pub rng: &'a mut Rng,
    /// Column names as they appear in queries (`t1.i1`), with their types.
    pub cols: Vec<(String, Ty)>,
    /// Allow division and remainder by an expression, which can raise an error.
    pub risky: bool,
    /// Leave out `upper` and `lower`: SQLite changes the case of ASCII letters only, so the two systems differ on purpose.
    pub sqlite_safe: bool,
}

impl Gen<'_> {
    fn col(&mut self, ty: Ty) -> Option<E> {
        let c: Vec<_> = self.cols.iter().filter(|(_, t)| *t == ty).collect();
        (!c.is_empty()).then(|| {
            let (n, t) = self.rng.pick(&c);
            E::Col(n.clone(), *t)
        })
    }

    pub fn expr(&mut self, ty: Ty, depth: usize) -> E {
        let leaf = depth == 0 || self.rng.chance(1, 4);
        match ty {
            Ty::Int => {
                if leaf {
                    return if self.rng.chance(2, 3) { self.col(Ty::Int).unwrap_or(E::Lit("1".into(), Ty::Int)) } else { E::Lit(self.rng.pick(&["0", "1", "2", "3", "-1", "7", "100"]).to_string(), Ty::Int) };
                }
                match self.rng.n(8) {
                    0 | 1 => E::Bin(self.rng.pick(&["+", "-", "*"]), Box::new(self.expr(Ty::Int, depth - 1)), Box::new(self.expr(Ty::Int, depth - 1))),
                    2 => {
                        let divisor = if self.risky { self.expr(Ty::Int, depth - 1) } else { E::Lit(self.rng.pick(&["2", "3", "-4", "7"]).to_string(), Ty::Int) };
                        E::Bin(self.rng.pick(&["/", "%"]), Box::new(self.expr(Ty::Int, depth - 1)), Box::new(divisor))
                    }
                    3 => E::Call("abs", vec![self.expr(Ty::Int, depth - 1)]),
                    4 => E::Call("coalesce", vec![self.expr(Ty::Int, depth - 1), self.expr(Ty::Int, depth - 1)]),
                    5 => E::Neg(Box::new(self.expr(Ty::Int, depth - 1))),
                    6 => E::Call("length", vec![self.expr(Ty::Text, depth - 1)]),
                    _ => self.col(Ty::Int).unwrap_or(E::Lit("5".into(), Ty::Int)),
                }
            }
            Ty::Float => {
                if leaf {
                    return if self.rng.chance(2, 3) { self.col(Ty::Float).unwrap_or(E::Lit("1.5".into(), Ty::Float)) } else { E::Lit(self.rng.pick(&["0.0", "1.5", "-2.25", "3.0", "0.1"]).to_string(), Ty::Float) };
                }
                match self.rng.n(4) {
                    0 => {
                        let right = if self.rng.chance(1, 2) { Ty::Int } else { Ty::Float };
                        E::Bin(self.rng.pick(&["+", "-", "*"]), Box::new(self.expr(Ty::Float, depth - 1)), Box::new(self.expr(right, depth - 1)))
                    }
                    1 => E::Call("abs", vec![self.expr(Ty::Float, depth - 1)]),
                    2 => E::Call("coalesce", vec![self.expr(Ty::Float, depth - 1), self.expr(Ty::Float, depth - 1)]),
                    _ => E::Neg(Box::new(self.expr(Ty::Float, depth - 1))),
                }
            }
            Ty::Text => {
                if leaf {
                    return if self.rng.chance(2, 3) { self.col(Ty::Text).unwrap_or(E::Lit("'a'".into(), Ty::Text)) } else { E::Lit(self.rng.pick(&["''", "'a'", "'B'", "'ab'", "'it''s'", "'\\u{e9}'"]).to_string(), Ty::Text) };
                }
                match self.rng.n(4) {
                    0 if !self.sqlite_safe => E::Call(self.rng.pick(&["upper", "lower"]), vec![self.expr(Ty::Text, depth - 1)]),
                    1 => E::Bin("||", Box::new(self.expr(Ty::Text, depth - 1)), Box::new(self.expr(Ty::Text, depth - 1))),
                    2 => E::Call("coalesce", vec![self.expr(Ty::Text, depth - 1), self.expr(Ty::Text, depth - 1)]),
                    _ => self.col(Ty::Text).unwrap_or(E::Lit("'x'".into(), Ty::Text)),
                }
            }
            Ty::Bool => {
                if leaf {
                    return match self.rng.n(4) {
                        0 => self.col(Ty::Bool).unwrap_or(E::Lit("TRUE".into(), Ty::Bool)),
                        1 => E::Lit(self.rng.pick(&["TRUE", "FALSE", "NULL"]).to_string(), Ty::Bool),
                        _ => self.compare(depth),
                    };
                }
                match self.rng.n(9) {
                    0 | 1 => E::Bin(self.rng.pick(&["AND", "OR"]), Box::new(self.expr(Ty::Bool, depth - 1)), Box::new(self.expr(Ty::Bool, depth - 1))),
                    2 => E::Not(Box::new(self.expr(Ty::Bool, depth - 1))),
                    3 => {
                        let t = *self.rng.pick(&[Ty::Int, Ty::Float, Ty::Text, Ty::Bool]);
                        E::IsNull(Box::new(self.expr(t, depth - 1)), self.rng.chance(1, 2))
                    }
                    4 => E::Between(Box::new(self.expr(Ty::Int, depth - 1)), Box::new(self.expr(Ty::Int, depth - 1)), Box::new(self.expr(Ty::Int, depth - 1)), self.rng.chance(1, 3)),
                    5 => {
                        let n = 1 + self.rng.n(3) as usize;
                        let mut list: Vec<E> = (0..n).map(|_| E::Lit(self.rng.n(6).to_string(), Ty::Int)).collect();
                        if self.rng.chance(1, 3) {
                            list.push(E::Lit("NULL".into(), Ty::Int));
                        }
                        E::In(Box::new(self.expr(Ty::Int, depth - 1)), list, self.rng.chance(1, 2))
                    }
                    6 => E::Call("coalesce", vec![self.expr(Ty::Bool, depth - 1), self.expr(Ty::Bool, depth - 1)]),
                    _ => self.compare(depth),
                }
            }
        }
    }

    fn compare(&mut self, depth: usize) -> E {
        let op = *self.rng.pick(&["=", "<>", "<", "<=", ">", ">="]);
        let d = depth.saturating_sub(1);
        let (a, b) = match self.rng.n(4) {
            0 | 1 => (self.expr(Ty::Int, d), self.expr(Ty::Int, d)),
            2 => {
                let right = if self.rng.chance(1, 2) { Ty::Int } else { Ty::Float };
                (self.expr(Ty::Float, d), self.expr(right, d))
            }
            _ => (self.expr(Ty::Text, d), self.expr(Ty::Text, d)),
        };
        E::Bin(op, Box::new(a), Box::new(b))
    }
}

pub fn literal(v: &Value) -> String {
    match v {
        Value::Null => "NULL".into(),
        Value::Int(i) => i.to_string(),
        Value::Float(f) => format!("{f:?}"),
        Value::Bool(b) => if *b { "TRUE" } else { "FALSE" }.into(),
        Value::Text(s) => format!("'{}'", s.replace('\\'', "''")),
    }
}

fn random_value(rng: &mut Rng, ty: Ty) -> Value {
    if rng.chance(1, 6) {
        return Value::Null;
    }
    match ty {
        Ty::Int => Value::Int(*rng.pick(&[0, 1, 2, 3, 4, 5, -1, -2, 7, 100])),
        Ty::Float => Value::Float(*rng.pick(&[0.0, 1.5, -2.25, 3.0, 0.1, 2.0])),
        Ty::Text => Value::Text(rng.pick(&["", "a", "B", "ab", "it's", "\\u{e9}", "a b"]).to_string().into()),
        Ty::Bool => Value::Bool(rng.chance(1, 2)),
    }
}

/// A database with tables `t1`, `t2` (and `t3`) of the standard columns and 10 to 30 random rows each. The same seed gives the same data;
/// `indexes` adds an index on `id` of each table (the engine's indexes are unique).
pub struct World {
    pub db: Database,
    pub rows: Vec<Vec<Vec<Value>>>,
}
impl World {
    pub fn new(seed: u64, indexes: bool) -> World {
        let mut rng = Rng(seed * 7919 + 13);
        let mut db = Database::with_pool(256, 0);
        let mut all = vec![];
        for t in ["t1", "t2", "t3"] {
            let cols: Vec<String> = COLUMNS.iter().map(|(n, _, ty)| format!("{n} {ty}")).collect();
            db.engine().execute(&format!("CREATE TABLE {t}({})", cols.join(", "))).unwrap();
            let n = 10 + rng.n(21) as usize;
            let rows: Vec<Vec<Value>> = (0..n).map(|i| COLUMNS.iter().map(|(name, ty, _)| if *name == "id" { Value::Int(i as i64) } else { random_value(&mut rng, *ty) }).collect()).collect();
            let vals: Vec<String> = rows.iter().map(|r| format!("({})", r.iter().map(literal).collect::<Vec<_>>().join(", "))).collect();
            db.engine().execute(&format!("INSERT INTO {t} VALUES {}", vals.join(", "))).unwrap();
            if indexes {
                db.engine().execute(&format!("CREATE INDEX {t}_id ON {t}(id)")).unwrap();
            }
            all.push(rows);
        }
        World { db, rows: all }
    }
    pub fn engine(&mut self) -> &mut Engine<'static> {
        self.db.engine()
    }
}

// ---- running queries -------------------------------------------------------------------------------------------------------------------

pub type Bag = Vec<Vec<Value>>;

/// A sort and grouping key for a row in which -0.0 and 0.0 are the same value, as they are for SQL equality.
pub fn row_key(row: &[Value]) -> String {
    let norm: Vec<Value> = row.iter().map(|v| if let Value::Float(f) = v { Value::Float(f + 0.0) } else { v.clone() }).collect();
    format!("{norm:?}")
}

/// Rows of the last statement of `sql`, in a canonical order, or the engine's error.
pub fn run(engine: &mut Engine, sql: &str) -> Result<Bag, String> {
    let mut r = engine.execute(sql).map_err(|e| e.0)?;
    let mut rows = r.pop().map(|t| t.rows).unwrap_or_default();
    rows.sort_by_key(|r| row_key(r));
    Ok(rows)
}

pub fn same(a: &Bag, b: &Bag) -> bool {
    a.len() == b.len() && a.iter().zip(b).all(|(x, y)| x.len() == y.len() && x.iter().zip(y).all(|(p, q)| value_eq(p, q)))
}

/// Equality that treats NULL as equal to NULL and floats as equal within rounding (sums are added in different orders).
pub fn value_eq(a: &Value, b: &Value) -> bool {
    match (a, b) {
        (Value::Float(x), Value::Float(y)) => x == y || (x - y).abs() <= 1e-9 * x.abs().max(y.abs()).max(1.0),
        (Value::Int(x), Value::Float(y)) | (Value::Float(y), Value::Int(x)) => (*x as f64 - y).abs() <= 1e-9,
        _ => a == b,
    }
}

#[derive(Debug, PartialEq)]
pub enum Outcome {
    Checked,
    /// The query failed in a way unrelated to the property (division by zero, a type error): nothing is learned.
    Skipped,
    /// One plan raised a runtime error where the other returned rows. SQL leaves the order of evaluation unspecified, so a plan that
    /// evaluates a condition on a row that the other plan has already excluded can fail; this is reported, but it is not a wrong result.
    OrderDependentError,
}

/// A counterexample: the property that failed and the queries involved.
#[derive(Debug)]
pub struct Violation(pub String);

fn concat(parts: &[Bag]) -> Bag {
    let mut all: Bag = parts.iter().flatten().cloned().collect();
    all.sort_by_key(|r| row_key(r));
    all
}

fn fail<T>(what: &str, queries: &[String], detail: String) -> Result<T, Violation> {
    Err(Violation(format!("{what}\\n{}\\n{detail}", queries.join("\\n"))))
}

/// The three queries that partition `from` by predicate `p`, given a select list and optional extra clauses after the condition.
fn partitions(select: &str, from: &str, p: &str, tail: &str) -> [String; 3] {
    [format!("SELECT {select} FROM {from} WHERE {p}{tail}"), format!("SELECT {select} FROM {from} WHERE NOT {p}{tail}"), format!("SELECT {select} FROM {from} WHERE {p} IS NULL{tail}")]
}

/// TLP on a scan, a join, or any `FROM` clause: the rows of `from` equal the union of its three partitions by `p`.
pub fn tlp_where(engine: &mut Engine, from: &str, p: &E) -> Result<Outcome, Violation> {
    let ps = p.sql(None);
    let base = format!("SELECT * FROM {from}");
    let Ok(whole) = run(engine, &base) else { return Ok(Outcome::Skipped) };
    let qs = partitions("*", from, &ps, "");
    let mut parts = vec![];
    for q in &qs {
        match run(engine, q) {
            Ok(r) => parts.push(r),
            Err(_) => return Ok(Outcome::Skipped),
        }
    }
    let union = concat(&parts);
    if !same(&whole, &union) {
        return fail("TLP: the rows of the table differ from the union of the three partitions", &[base, qs[0].clone(), qs[1].clone(), qs[2].clone()], format!("whole {} rows, union {} rows", whole.len(), union.len()));
    }
    Ok(Outcome::Checked)
}

/// TLP on aggregates: COUNT, SUM, MIN and MAX of an integer expression combine across the partitions.
pub fn tlp_aggregate(engine: &mut Engine, from: &str, p: &E, e: &E) -> Result<Outcome, Violation> {
    let es = e.sql(None);
    let select = format!("COUNT(*), COUNT({es}), SUM({es}), MIN({es}), MAX({es})");
    let base = format!("SELECT {select} FROM {from}");
    let Ok(whole) = run(engine, &base) else { return Ok(Outcome::Skipped) };
    let qs = partitions(&select, from, &p.sql(None), "");
    let mut rows = vec![];
    for q in &qs {
        match run(engine, q) {
            Ok(r) => rows.push(r.into_iter().next().unwrap()),
            Err(_) => return Ok(Outcome::Skipped),
        }
    }
    let count = |i: usize| -> i64 { rows.iter().map(|r| if let Value::Int(n) = r[i] { n } else { 0 }).sum() };
    let present = |i: usize| -> Vec<&Value> { rows.iter().map(|r| &r[i]).filter(|v| !v.is_null()).collect() };
    let num = |v: &Value| -> f64 { match v { Value::Int(i) => *i as f64, Value::Float(f) => *f, _ => 0.0 } };
    let sum = { let p = present(2); if p.is_empty() { Value::Null } else { Value::Float(p.iter().map(|v| num(v)).sum()) } };
    let extreme = |i: usize, max: bool| -> Value {
        present(i).into_iter().cloned().reduce(|a, b| if (num(&a) < num(&b)) == max { b } else { a }).unwrap_or(Value::Null)
    };
    let combined = vec![Value::Int(count(0)), Value::Int(count(1)), sum, extreme(3, false), extreme(4, true)];
    if !whole[0].iter().zip(&combined).all(|(a, b)| value_eq(a, b)) {
        return fail("TLP: aggregates over the table differ from the aggregates combined over the partitions", &[base, qs[0].clone(), qs[1].clone(), qs[2].clone()], format!("whole {:?}, combined {combined:?}", whole[0]));
    }
    Ok(Outcome::Checked)
}

/// TLP on `GROUP BY`: the groups of the table equal the groups of the partitions after adding up the counts of equal keys.
pub fn tlp_group_by(engine: &mut Engine, from: &str, p: &E, key: &E) -> Result<Outcome, Violation> {
    let ks = key.sql(None);
    let select = format!("{ks}, COUNT(*)");
    let base = format!("SELECT {select} FROM {from} GROUP BY {ks}");
    let Ok(whole) = run(engine, &base) else { return Ok(Outcome::Skipped) };
    let qs = partitions(&select, from, &p.sql(None), &format!(" GROUP BY {ks}"));
    let mut merged: BTreeMap<String, (Value, i64)> = BTreeMap::new();
    for q in &qs {
        let Ok(r) = run(engine, q) else { return Ok(Outcome::Skipped) };
        for row in r {
            let n = if let Value::Int(n) = row[1] { n } else { 0 };
            merged.entry(row_key(&row[..1])).or_insert((row[0].clone(), 0)).1 += n;
        }
    }
    let combined: Bag = merged.into_values().map(|(k, n)| vec![k, Value::Int(n)]).collect();
    let mut combined = combined;
    combined.sort_by_key(|r| row_key(r));
    if !same(&whole, &combined) {
        return fail("TLP: GROUP BY over the table differs from GROUP BY over the partitions", &[base, qs[0].clone(), qs[1].clone(), qs[2].clone()], format!("whole {whole:?}\\ncombined {combined:?}"));
    }
    Ok(Outcome::Checked)
}

/// TLP on `DISTINCT`: the distinct values of the table equal the distinct values of the union of the partitions.
pub fn tlp_distinct(engine: &mut Engine, from: &str, p: &E, e: &E) -> Result<Outcome, Violation> {
    let es = e.sql(None);
    let base = format!("SELECT DISTINCT {es} FROM {from}");
    let Ok(whole) = run(engine, &base) else { return Ok(Outcome::Skipped) };
    let qs = partitions(&format!("DISTINCT {es}"), from, &p.sql(None), "");
    let mut seen: BTreeMap<String, Vec<Value>> = BTreeMap::new();
    for q in &qs {
        let Ok(r) = run(engine, q) else { return Ok(Outcome::Skipped) };
        for row in r {
            seen.insert(row_key(&row), row);
        }
    }
    let mut combined: Bag = seen.into_values().collect();
    combined.sort_by_key(|r| row_key(r));
    if !same(&whole, &combined) {
        return fail("TLP: DISTINCT over the table differs from DISTINCT over the partitions", &[base, qs[0].clone(), qs[1].clone(), qs[2].clone()], format!("whole {whole:?}\\ncombined {combined:?}"));
    }
    Ok(Outcome::Checked)
}

/// TLP on `HAVING`: the groups of a query equal the union of the groups kept by `HAVING p`, `HAVING NOT p` and `HAVING p IS NULL`.
pub fn tlp_having(engine: &mut Engine, from: &str, key: &str, p: &str) -> Result<Outcome, Violation> {
    let base = format!("SELECT {key}, COUNT(*) FROM {from} GROUP BY {key}");
    let Ok(whole) = run(engine, &base) else { return Ok(Outcome::Skipped) };
    let qs = [format!("{base} HAVING {p}"), format!("{base} HAVING NOT {p}"), format!("{base} HAVING {p} IS NULL")];
    let mut parts = vec![];
    for q in &qs {
        match run(engine, q) {
            Ok(r) => parts.push(r),
            Err(_) => return Ok(Outcome::Skipped),
        }
    }
    let union = concat(&parts);
    if !same(&whole, &union) {
        return fail("TLP: groups differ from the union of the HAVING partitions", &[base, qs[0].clone(), qs[1].clone(), qs[2].clone()], format!("whole {whole:?}\\nunion {union:?}"));
    }
    Ok(Outcome::Checked)
}

/// NoREC: the number of rows that `WHERE p` keeps equals the number of true values of `SELECT p`.
pub fn norec(engine: &mut Engine, from: &str, p: &E) -> Result<Outcome, Violation> {
    let ps = p.sql(None);
    let optimized = format!("SELECT COUNT(*) FROM {from} WHERE {ps}");
    let unoptimized = format!("SELECT {ps} FROM {from}");
    let (Ok(a), Ok(b)) = (run(engine, &optimized), run(engine, &unoptimized)) else { return Ok(Outcome::Skipped) };
    let count = if let Value::Int(n) = a[0][0] { n } else { -1 };
    let trues = b.iter().filter(|r| r[0] == Value::Bool(true)).count() as i64;
    if count != trues {
        return fail("NoREC: WHERE p keeps a different number of rows than SELECT p reports as true", &[optimized, unoptimized], format!("count {count}, true values {trues}"));
    }
    Ok(Outcome::Checked)
}

/// The same query with the optimizer on and off must return the same rows.
pub fn optimizer_differential(engine: &mut Engine, sql: &str) -> Result<Outcome, Violation> {
    engine.optimize = true;
    let a = run(engine, sql);
    engine.optimize = false;
    let b = run(engine, sql);
    engine.optimize = true;
    match (a, b) {
        (Ok(a), Ok(b)) if same(&a, &b) => Ok(Outcome::Checked),
        (Ok(a), Ok(b)) => fail("optimizer differential: the optimized and unoptimized plans return different rows", &[sql.to_string()], format!("optimized {} rows, unoptimized {} rows", a.len(), b.len())),
        (Err(_), Err(_)) => Ok(Outcome::Skipped),
        (a, b) => {
            let runtime = |r: &Result<Bag, String>| matches!(r, Err(m) if m.contains("division by zero") || m.contains("type error") || m.contains("out of range") || m.contains("cannot compare"));
            if runtime(&a) || runtime(&b) { Ok(Outcome::OrderDependentError) } else { fail("optimizer differential: only one of the plans failed", &[sql.to_string()], format!("optimized {:?}, unoptimized {:?}", a.map(|r| r.len()), b.map(|r| r.len()))) }
        }
    }
}

/// The same query on a database with indexes and on one without must return the same rows.
pub fn index_differential(with: &mut Engine, without: &mut Engine, sql: &str) -> Result<Outcome, Violation> {
    match (run(with, sql), run(without, sql)) {
        (Ok(a), Ok(b)) if same(&a, &b) => Ok(Outcome::Checked),
        (Ok(a), Ok(b)) => fail("index differential: the database with indexes returns different rows", &[sql.to_string()], format!("with indexes {} rows, without {} rows", a.len(), b.len())),
        (Err(_), Err(_)) => Ok(Outcome::Skipped),
        (a, b) => {
            let runtime = |r: &Result<Bag, String>| matches!(r, Err(m) if m.contains("division by zero") || m.contains("type error") || m.contains("out of range") || m.contains("cannot compare"));
            if runtime(&a) || runtime(&b) { Ok(Outcome::OrderDependentError) } else { fail("index differential: only one of the databases failed", &[sql.to_string()], format!("with {:?}, without {:?}", a.map(|r| r.len()), b.map(|r| r.len()))) }
        }
    }
}

/// The value of `e` for each row of `table`, computed by the engine over the table and by the engine over the row written as constants.
pub fn rowwise(engine: &mut Engine, table: &str, rows: &[Vec<Value>], e: &E) -> Result<Outcome, Violation> {
    let es = e.sql(None);
    let over_table = format!("SELECT id, i1, i2, f, s, b, {es} FROM {table}");
    let Ok(mut table_rows) = engine.execute(&over_table).map(|mut r| r.pop().unwrap().rows).map_err(|e| e.0) else { return Ok(Outcome::Skipped) };
    table_rows.sort_by_key(|r| row_key(r));
    let mut by_row = vec![];
    for r in rows {
        let subst: BTreeMap<String, String> = COLUMNS.iter().zip(r).map(|((n, _, _), v)| (format!("{table}.{n}"), literal(v))).collect();
        let constant = e.sql(Some(&subst));
        let q = format!("SELECT {constant}");
        let v = match engine.execute(&q) {
            Ok(mut t) => t.pop().unwrap().rows.pop().unwrap().pop().unwrap(),
            Err(_) => return Ok(Outcome::Skipped),
        };
        let mut full = r.clone();
        full.push(v);
        by_row.push(full);
    }
    by_row.sort_by_key(|r| row_key(r));
    if !same(&table_rows, &by_row) {
        let at = table_rows.iter().zip(&by_row).position(|(a, b)| !same(&vec![a.clone()], &vec![b.clone()])).unwrap_or(0);
        return fail("row-wise: the expression over the table differs from the expression over the row as constants", &[over_table, format!("SELECT {}", e.sql(None))], format!("first difference: table {:?}, constants {:?}", table_rows.get(at), by_row.get(at)));
    }
    Ok(Outcome::Checked)
}

// ---- a reference system: SQLite ------------------------------------------------------------------------------------------------------

/// Is the `sqlite3` command-line shell installed?
pub fn sqlite_available() -> bool {
    std::process::Command::new("sqlite3").arg("--version").output().is_ok()
}

/// The statements that create `world`'s tables in SQLite (booleans become 0 and 1).
pub fn sqlite_setup(world: &World) -> String {
    let mut out = String::new();
    for (t, rows) in ["t1", "t2", "t3"].iter().zip(&world.rows) {
        let cols: Vec<String> = COLUMNS.iter().map(|(n, ty, _)| format!("{n} {}", match ty { Ty::Int | Ty::Bool => "INTEGER", Ty::Float => "REAL", Ty::Text => "TEXT" })).collect();
        out += &format!("CREATE TABLE {t}({});\\n", cols.join(", "));
        for r in rows {
            let vals: Vec<String> = r.iter().map(|v| match v { Value::Bool(b) => (*b as i32).to_string(), v => literal(v) }).collect();
            out += &format!("INSERT INTO {t} VALUES ({});\\n", vals.join(", "));
        }
    }
    out
}

/// One cell, normalized so that the two systems' renderings compare: NULL, a number, or text.
#[derive(Debug, Clone, PartialEq)]
pub enum Cell {
    Null,
    Num(f64),
    Text(String),
}
fn cell_eq(a: &Cell, b: &Cell) -> bool {
    match (a, b) {
        (Cell::Num(x), Cell::Num(y)) => x == y || (x - y).abs() <= 1e-9 * x.abs().max(y.abs()).max(1.0),
        _ => a == b,
    }
}
fn engine_cell(v: &Value) -> Cell {
    match v {
        Value::Null => Cell::Null,
        Value::Int(i) => Cell::Num(*i as f64),
        Value::Float(f) => Cell::Num(*f),
        Value::Bool(b) => Cell::Num(*b as i32 as f64),
        Value::Text(s) => Cell::Text(s.to_string()),
    }
}
fn sqlite_cell(s: &str) -> Cell {
    if s == "NULL" { Cell::Null } else if let Ok(f) = s.parse::<f64>() { Cell::Num(f) } else { Cell::Text(s.to_string()) }
}
fn cell_key(c: &Cell) -> String {
    match c { Cell::Num(f) => format!("n{:.6e}", f + 0.0), o => format!("{o:?}") }
}

/// Run the queries in one `sqlite3` process over `setup`; one result (rows of cells, or the error text) per query.
pub fn sqlite_batch(setup: &str, queries: &[String]) -> Vec<Result<Vec<Vec<Cell>>, String>> {
    use std::io::Write;
    let mut script = String::from(".mode list\\n.separator \\"\\\\t\\"\\n.nullvalue NULL\\n.bail off\\n");
    script += setup;
    for (i, q) in queries.iter().enumerate() {
        script += &format!("SELECT '@@{i}';\\n{q};\\n");
    }
    if let Ok(path) = std::env::var("QA_DUMP") {
        let _ = std::fs::write(path, &script);
    }
    let mut child = std::process::Command::new("sqlite3").stdin(std::process::Stdio::piped()).stdout(std::process::Stdio::piped()).stderr(std::process::Stdio::piped()).spawn().expect("sqlite3 starts");
    let mut stdin = child.stdin.take().unwrap();
    let writer = std::thread::spawn(move || stdin.write_all(script.as_bytes()).unwrap());
    let out = child.wait_with_output().unwrap();
    writer.join().unwrap();
    let text = String::from_utf8_lossy(&out.stdout).into_owned();
    let errs = String::from_utf8_lossy(&out.stderr).into_owned();
    let mut results: Vec<Result<Vec<Vec<Cell>>, String>> = (0..queries.len()).map(|_| Ok(vec![])).collect();
    let mut current = None;
    for line in text.lines() {
        if let Some(n) = line.strip_prefix("@@") {
            current = n.parse::<usize>().ok();
        } else if let (Some(i), Ok(rows)) = (current, &mut results[current.unwrap_or(0)]) {
            let _ = i;
            rows.push(line.split('\\t').map(sqlite_cell).collect());
        }
    }
    // errors are reported on stderr as "Error: near line N: ..."; attribute each to the query whose line it names
    for line in errs.lines() {
        if let Some(rest) = line.strip_prefix("Error: near line ") {
            if let Some(n) = rest.split(':').next().and_then(|n| n.trim().parse::<usize>().ok()) {
                let setup_lines = 4 + setup.lines().count();
                if n > setup_lines {
                    let q = (n - setup_lines - 1) / 2;
                    if q < results.len() {
                        results[q] = Err(line.to_string());
                    }
                }
            }
        }
    }
    results
}

/// Compare the engine with SQLite on each query: the same multiset of rows. A query the engine rejects is skipped; a query SQLite rejects
/// and the engine accepts is a violation.
pub fn sqlite_compare(engine: &mut Engine, setup: &str, queries: &[String]) -> Result<(usize, usize), Violation> {
    let reference = sqlite_batch(setup, queries);
    let (mut checked, mut skipped) = (0, 0);
    for (q, theirs) in queries.iter().zip(reference) {
        let Ok(rows) = engine.execute(q).map(|mut r| r.pop().map(|t| t.rows).unwrap_or_default()) else { skipped += 1; continue };
        let mut ours: Vec<Vec<Cell>> = rows.iter().map(|r| r.iter().map(engine_cell).collect()).collect();
        let Ok(mut theirs) = theirs else { return fail("SQLite rejects a query the engine accepts", &[q.clone()], "".into()) };
        let key = |r: &Vec<Cell>| r.iter().map(cell_key).collect::<Vec<_>>().join("|");
        ours.sort_by_key(key);
        theirs.sort_by_key(key);
        // SQLite prints an empty result as no lines; a query with one column of text '' prints an empty line, which is one row with one cell
        let same_rows = ours.len() == theirs.len() && ours.iter().zip(&theirs).all(|(a, b)| a.len() == b.len() && a.iter().zip(b).all(|(x, y)| cell_eq(x, y)));
        if !same_rows {
            return fail("the engine and SQLite return different rows", &[q.clone()], format!("engine {} rows: {:?}\\nSQLite {} rows: {:?}", ours.len(), ours.iter().take(4).collect::<Vec<_>>(), theirs.len(), theirs.iter().take(4).collect::<Vec<_>>()));
        }
        checked += 1;
    }
    Ok((checked, skipped))
}
