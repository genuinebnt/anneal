[[sections]]
heading = "Design notes"
body = """
**Where tests live** unit tests         -> `#[cfg(test)] mod tests` next to the code; may test private items integration tests  -> tests/&#42;.rs; public API only; each file is its own crate (share helpers via tests/support/mod.rs) doctests           -> examples in /// comments that compile and run benchmarks         -> benches/&#42;.rs with `harness = false`; see benches/crate_tour_bench.rs, which includes **this** file Run: cargo bench -p cb-crate-tour --bench crate_tour_bench -- --quick

**Property cheat sheet**: round trip (decode(encode(x)) == x) ; oracle (fast == obviously correct) ; invariant (output is sorted **and** a permutation) ; idempotence (f(f(x)) == f(x)) ; metamorphic (relation between two runs) ; never panics. **Regression files**: inside `proptest!` tests, a failing seed is saved under proptest-regressions/; **commit** those files.

The sections here disable persistence (except `regression_files`, which writes to a temporary directory) and fix the RNG so that every run is identical. **Snapshots**: review changes with `cargo insta review` (cargo-insta tool). A snapshot proves "unchanged", not "correct".
"""

