<ul class="cb-g-uses"><li>every codebase: table-driven tests</li><li>injected fakes</li><li>seeded property tests</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
`cargo test` builds the `#[cfg(test)]` module only for tests. Good tests: one behaviour each, descriptive names, failure messages that show the input, no reliance on time/network/randomness (inject fakes, seed RNGs).
"""

