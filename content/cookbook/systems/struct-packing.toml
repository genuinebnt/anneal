[[sections]]
heading = "Design notes"
body = """
Each field must sit at an address that is a multiple of its **alignment**, so the compiler inserts padding. Default `repr(Rust)` is free to **reorder** fields to minimise it; `repr(C)` keeps your order (needed for FFI/file layouts). `repr(packed)` removes padding but makes fields unaligned: you cannot take references to them (UB), only copy values out.

`repr(align(N))` raises alignment. Smaller types mean more records per cache line. Check sizes at **compile** time with `const _: () = assert!(...)` so a refactor cannot silently double your memory.

Read: <https://doc.rust-lang.org/reference/type-layout.html> and <https://nnethercote.github.io/perf-book/type-sizes.html>  (clippy lint: large_enum_variant)
"""

