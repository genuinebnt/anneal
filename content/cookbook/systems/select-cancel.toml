[[sections]]
heading = "Design notes"
body = """
Race the real work against a cancel signal. When one branch of `select!` wins, the other branches' futures are dropped. A dropped future is never polled again, so its work stops at the `.await` where it was waiting.

What it did before that stays done. A branch written as `&mut cancel_rx` drops only the reference, so the same future can be waited on again in the next turn of a loop. `timeout` is the same race with a clock.

**Limits.** A future is cancelled only where it waits. Code that blocks the thread, or loops without an `.await`, cannot be timed out. Dropping a `JoinHandle` does not cancel a spawned task (`abort` does).

Tokio docs: <https://tokio.rs/tokio/tutorial/select>
"""

