[[sections]]
heading = "Design notes"
body = """
Pattern: race the real work against a cancel signal. When one branch wins, the other future is DROPPED, which cancels it at its next `.await`. A future must therefore be "cancel-safe": dropping it midway must not lose data.

`timeout` is the same idea with a clock. Tokio docs: <https://tokio.rs/tokio/tutorial/select>
"""

