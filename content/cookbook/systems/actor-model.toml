heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>Erlang/OTP supervision trees (the original "let it crash" design)</li><li>actix and ractor are Rust actor frameworks worth reading</li><li>the same pattern appears as per-connection/per-session tasks owning their state in servers</li></ul>
"""

