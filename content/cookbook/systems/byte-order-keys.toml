[[sections]]
heading = "Design notes"
body = """
Little-endian (x86, Apple Silicon) stores the **least** significant byte first; big-endian ("network order") stores the **most** significant first.

**Consequences.** (1) file/wire formats must pick one explicitly (`to_le_bytes`/`to_be_bytes`), never `as` or transmute; (2) **big**-endian bytes compare lexicographically in numeric order, so databases encode integer **keys** big-endian and compare with plain `memcmp`. Signed ints and floats need a tweak (flip the sign bit / invert negatives) to sort correctly as bytes.

(3) Reading `u32` from an arbitrary byte offset may be unaligned: use `from_le_bytes`, `read_unaligned`, or the `bytemuck` crate <https://docs.rs/bytemuck> for safe casts. Docs: <https://doc.rust-lang.org/std/primitive.u32.html#method.swap_bytes>
"""

