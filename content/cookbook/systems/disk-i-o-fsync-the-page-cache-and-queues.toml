[[sections]]
heading = "What this machine does not tell you"
body = """
<div class="cb-g-tt"><table> <thead> <tr> <th>Topic</th> <th>On Linux (documented, not measured here)</th> </tr> </thead> <tbody> <tr> <td><code>fsync</code> and <code>fdatasync</code></td> <td>Both ask the device to flush its cache; <code>fdatasync</code> skips file metadata that is not needed to read the data back (the modification time) but still writes the file size, so it saves a journal write for an overwrite and little for an append</td> </tr> <tr> <td>Direct I/O</td> <td><code>O_DIRECT</code> requires the buffer address, the file offset and the length to be multiples of the logical block size (commonly 512 bytes or 4 KiB); misaligned requests fail with <code>EINVAL</code>; the page cache is bypassed for data but metadata still goes through it</td> </tr> <tr> <td>After creating or renaming a file</td> <td><code>fsync</code> the <strong>directory</strong> as well as the file, or the new name may not survive a crash</td> </tr> <tr> <td><code>io_uring</code></td> <td>Two ring buffers shared between the application and the kernel (submission and completion queues); entries are batched and submitted with <code>io_uring_enter</code> (or by a kernel polling thread, <code>SQPOLL</code>, with no system call at all); buffers and files can be registered once to skip per-request setup; entries can be linked so a write is followed by its <code>fsync</code>, or drained in order</td> </tr> <tr> <td>Asynchronous I/O in engines</td> <td>RocksDB uses multi-reads and optional <code>io_uring</code>; Seastar/ScyllaDB and TigerBeetle are built around asynchronous direct I/O; PostgreSQL 18 added an asynchronous I/O subsystem with a choice of backends including <code>io_uring</code></td> </tr> <tr> <td>Failure</td> <td>After a failed write-back the kernel may drop the dirty pages and report the error once; a later <code>fsync</code> can succeed; engines treat the first error as fatal (the "fsyncgate" discussion of 2018 in PostgreSQL)</td> </tr> <tr> <td>Torn writes</td> <td>A write larger than the device's atomic unit can be partly applied after a crash; engines protect pages with checksums plus a double-write buffer (InnoDB) or full-page images in the log (PostgreSQL)</td> </tr> </tbody> </table></div>

<aside data-call="note"><b>A measurement that was wrong for a good reason</b><p>The first version of the read experiment created the 1 GiB file through an ordinary descriptor, read it once sequentially to "warm" it, and then measured <code>F_NOCACHE</code> reads. They took 1 µs, which is not a flash latency. The pages of the file were in the page cache, <code>F_NOCACHE</code> did not evict them, and the "device" numbers were cache hits. The fixed experiment writes the file with the cache off, never reads it through the cache before the cold measurements, and only then warms it for the warm ones. The check that caught it was the number itself: a random 4 KiB read from an SSD does not take 1 µs.</p></aside>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong>Foreign functions without a crate.</strong> <code>unsafe extern "C" { fn fcntl(fd: i32, cmd: i32, ...) -&gt; i32; fn fsync(fd: i32) -&gt; i32; fn mmap(...) ... }</code> declares the C functions (a variadic one for <code>fcntl</code>); the constants (<code>F_FULLFSYNC = 51</code>, <code>F_NOCACHE = 48</code>) come from the system header. Each call is wrapped in a function that returns <code>io::Result</code> from <code>errno</code>.</li> <li><strong><code>std::os::unix::fs::FileExt</code></strong> gives <code>read_at</code>, <code>read_exact_at</code>, <code>write_all_at</code>: positioned I/O (<code>pread</code>/<code>pwrite</code>) that does not move a shared cursor, so many threads can use one <code>File</code>.</li> <li><strong><code>AsRawFd</code></strong> gives the descriptor for the foreign calls; the <code>File</code> keeps it open for the duration.</li> <li><strong>A leader–follower group commit with <code>Mutex</code> + <code>Condvar</code>.</strong> Followers wait on the condition variable; the leader takes the batch out of the shared state, <em>moves the sink out of the mutex</em> (<code>mem::replace</code> with a placeholder) so that it can write and sync without holding the lock, and puts it back before waking everyone.</li> <li><strong>A trait for the sink</strong> (<code>trait Sink { fn write_batch; fn sync }</code>) makes failure testable: the test sink fails its n-th write or sync.</li> <li><strong><code>Mapped</code> wraps <code>mmap</code>/<code>munmap</code></strong> with <code>Drop</code>, and exposes a <code>&amp;[u8]</code>; the safety condition (the file must not be truncated while mapped) is stated on the type, since a shrunk file makes a read a signal rather than an error.</li> <li><strong>Channels and worker threads for the ring model</strong>: a shared receiver behind a <code>Mutex</code>, <code>Chain</code> jobs for linked entries, a <code>Stop</code> message per worker joined in <code>Drop</code>.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong>Durability calls</strong> return <code>Ok</code> and the data reads back for each kind.</li> <li><strong>Cache bypass and maps</strong>: 500 random reads of random lengths (1 to 70 000 bytes) at random offsets of a 3 MiB file through the cache, through <code>F_NOCACHE</code> and through a memory map return identical bytes equal to the file's; a read past the end is an error.</li> <li><strong>Group commit</strong>: 8 threads append 300 records each; after every append returns, the record is in the file; at the end each record appears once, each thread's records are in order and intact (a check value in each 16-byte record), concurrent appenders shared syncs (fewer syncs than records), and a lone appender needs one sync per record.</li> <li><strong>Failure</strong>: a sink that fails its 4th sync, and one that fails its 4th write: the first three appends succeed, the fourth fails, every later append fails, the file does not grow after the failure, acknowledged records are in the file; with 8 appenders and a failure at the 5th sync, everyone in the failed batch gets the error and no record that returned <code>Ok</code> is missing.</li> <li><strong>The ring model</strong>: 3 000 random reads at depth 32 with 8 workers complete once each with the right bytes and fewer submit calls than entries; a full ring gives the entry back, and entries in flight count against the depth; linked writes to the same bytes run in order in 200 rounds with 8 workers; a failed read cancels the rest of its chain and not another chain.</li> <li><strong>Mutants run against these tests</strong> (9): records acknowledged before they are written; a failed sync retried as if nothing happened; the leader not waking the followers; the file position not advancing; a full ring accepting one more entry; every entry ending its chain; a failure not cancelling its chain; submitted entries not counted as in flight; a short read reported as success. <strong>All 9 were killed</strong>, five by a hang or crash. The first survived until the check "this record is in the file" was made after every append instead of every 50th.</li> <li><strong>Not testable by outcome</strong>: that <code>Full</code> really passes through <code>F_FULLFSYNC</code> and that <code>set_nocache</code> really turns the cache off. Both are visible only in latency (4.0 ms against 18 µs; 90 µs against 0.67 µs), and a test on timing would fail on a machine with a different drive. The measurements are the evidence.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>PostgreSQL</strong>: <code>wal_sync_method</code> chooses <code>fdatasync</code>, <code>fsync</code>, <code>open_datasync</code> or, on macOS, <code>fsync_writethrough</code> (which calls <code>F_FULLFSYNC</code>); <code>fsync = off</code> is documented as unsafe; a failure of <code>fsync</code> raises a <code>PANIC</code> since the 2018 discussion; group commit is built into the WAL writer (<code>commit_delay</code>, <code>commit_siblings</code>).</li> <li><strong>SQLite</strong>: <code>PRAGMA fullfsync</code> and <code>checkpoint_fullfsync</code> ask for <code>F_FULLFSYNC</code> on macOS; by default it is off, which is the trade-off measured above.</li> <li><strong>MySQL InnoDB</strong>: <code>innodb_flush_method</code> (<code>O_DIRECT</code>, <code>fsync</code>), <code>innodb_flush_log_at_trx_commit</code> (flush at each commit or once a second), a double-write buffer against torn pages.</li> <li><strong>RocksDB</strong>: <code>use_direct_reads</code>, <code>use_direct_io_for_flush_and_compaction</code>, <code>bytes_per_sync</code>, <code>wal_bytes_per_sync</code>, <code>io_uring</code> for parallel multi-gets; group commit across writers to the WAL.</li> <li><strong>LMDB</strong> and other memory-mapped engines use the page cache as the buffer pool and <code>msync</code>; they give up control of eviction and of when pages reach the disk, and the cost shows up as unpredictable latency under memory pressure.</li> <li><strong>Shared-nothing, thread-per-core engines</strong> (ScyllaDB's Seastar, TigerBeetle, Redpanda) use asynchronous direct I/O so that no thread ever blocks on a disk.</li> <li><strong>Cloud block storage</strong> adds network latency and durability of its own (the write is replicated before it is acknowledged); the same calls have different costs, and the right batch size and queue depth differ.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>Know which call you are making.</strong> <code>sync_all</code> on Apple platforms is <code>F_FULLFSYNC</code>; on Linux it is <code>fsync</code>. Two programs with the same source differ by 200 times in speed and also in what they promise.</li> <li><strong>Benchmarks that never reach the device measure the cache.</strong> Check the number against what the device can do; write test files with the cache off; do not warm a file you want to read cold.</li> <li><strong><code>F_NOCACHE</code>/<code>O_DIRECT</code> is not a fix for double caching alone.</strong> It moves the burden of read-ahead and of caching to the engine; without a buffer pool a direct-I/O engine reads the same page again and again.</li> <li><strong>Do not retry an <code>fsync</code> that failed.</strong> Treat the first error as fatal for the file (or the process).</li> <li><strong>A durable file is not a durable name.</strong> After a create or rename, sync the directory.</li> <li><strong>Group commit adds latency to the first writer</strong> in a batch, which waits for the previous sync; tune the batch with a delay only when the sync is slow relative to the arrival rate.</li> <li><strong>Deeper queues raise latency.</strong> Throughput grows to the device's limit, then each request waits longer (90 µs to 296 µs above); set the depth to the knee, not the maximum.</li> <li><strong>A memory map hides I/O errors as signals</strong> and lets the kernel decide when to write; it is convenient and hard to make safe for a transactional store.</li> </ul></aside>
"""

