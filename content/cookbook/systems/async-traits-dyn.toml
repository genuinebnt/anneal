[[sections]]
heading = "Design notes"
body = """
`async fn` in traits is stable, and returns an opaque `impl Future`. That is great for **generic** use (`S: Store`, static dispatch, zero cost) but it makes the trait **not** dyn-compatible: a vtable needs one concrete return type. For `dyn` you return `Pin<Box<dyn Future + Send + 'a>>` (one allocation per call).

A blanket impl can derive the boxed `DynStore` from any `Store`, so you write the nice async version once. Spelling the future as `impl Future + Send` in the trait lets generic code (and `tokio::spawn`) require that the future is Send. Crates automating this: <https://docs.rs/async-trait> (boxes everything) and <https://docs.rs/trait-variant>
"""

