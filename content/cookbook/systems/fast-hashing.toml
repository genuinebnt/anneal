[[sections]]
heading = "Where you would use it"
body = """
maps keyed by small ints/ids in hot loops (graph algorithms, interning).
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>graph algorithms</li><li>interning tables</li><li>compilers (rustc uses Fx hashing)</li><li>not for attacker-controlled keys</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
std's default hasher (SipHash 1-3, randomly keyed per map) is deliberately DoS-resistant but not the fastest. For trusted keys, a simple multiply-rotate hasher (the "Fx" family used inside rustc) is much faster. **Never** use it for attacker-controlled keys (hash flooding).

Production crates: rustc-hash, ahash, fxhash. Often the best fix is no hashing at all: dense `usize` ids into a Vec (see index_graph).
"""

