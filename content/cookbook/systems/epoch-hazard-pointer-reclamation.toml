[[sections]]
heading = "Design notes"
body = """
**The problem**: in a lock-free structure a thread unlinks a node, but other threads may still hold a pointer to it (they read `head`, then were preempted). Freeing at once is a use-after-free; and if the allocator reuses the address, the stale CAS in a Treiber pop can even **succeed** on a recycled node (**aba**, see lockfree_stack_aba).

A GC would solve it; Rust must do it by hand: unlinked nodes are **retired** and freed only once no thread can hold a pointer. **One trait**, **four strategies** (`Reclaim`): `enter/leave` bracket an operation, `protect` loads a shared pointer safely, `retire` hands over an unlinked node. A Treiber stack and a Michael-Scott queue are written once over it.

(a) `Leak`: never free. Correct, simplest, fastest, memory grows without bound (fine for short-lived programs). (b) `HazardDomain` (Maged Michael): each thread has 2 published hazard slots.

`protect` = publish the pointer, fence, re-read the source, retry if it changed. `retire` appends to the thread's list; at **thresh** entries a **scan** collects every hazard slot and frees the unprotected nodes. Per-thread unfreed nodes are bounded by **thresh**, even if another thread stalls forever.

**Cost.** A SeqCst fence per protect. (c) `EpochDomain` (Fraser; crossbeam-epoch): a global epoch; a thread **pins** by publishing the epoch it saw. The epoch advances only when every pinned thread has observed the current one.

A node retired in epoch e goes to limbo list e%3 and is freed when the global epoch reaches e+2 (no pinned thread can still be in epoch &lt;= e). Reads are cheap (a plain load), but **one** stalled pinned thread blocks all reclamation: memory is unbounded. (d) `Naive`: free immediately: the bug.

The scripted demo replays the interleaving with a manual scheduler. **How we prove it** (no real `free`, on purpose): freed nodes are **quarantined**, never returned to the OS until the end: `free` poisons the node (`magic = POISON`, value overwritten) and counts it; a second free of the same node is counted as a double free.

Every node read under protection checks `magic == LIVE`; a poisoned read is a use-after-free that real memory could hide. Quarantine keeps the program sound (all accesses are atomics on valid memory) while still detecting premature frees. With `recycle`, freed nodes are handed out again FIFO, which provokes **aba**.

Swap `Alloc::free` for `dealloc` for production (and use crossbeam-epoch instead of this recipe). Run `cargo +nightly miri run --example epoch_hazard_pointer_reclamation` after reducing the constants to check the unsafe code.
"""

