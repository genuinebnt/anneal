<ul class="cb-g-uses"><li>squeezing the last 2-10x out of scan/aggregate kernels (columnar databases)</li><li>image/video filters</li><li>checksum and hash loops</li><li>histogram-based sorting and compression. Course: CMU 15-418 (single-core optimisation)</li><li>Algorithmica "Algorithms for Modern Hardware"</li></ul>
