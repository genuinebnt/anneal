[[sections]]
heading = "Design notes"
body = """
Every optimisation here is a **rewrite** that must not change the answer, so every rung of every ladder is asserted to produce a bit-identical result (the data are u32/u8 with wrapping arithmetic, which is an exact ring: reassociating, factoring and reordering are all legal, unlike for floats). Timings are printed (best of several runs) and never asserted.

Rungs, in the order a performance engineer tries them:

1. remove bounds checks the right way: iterators, zip, `chunks_exact`, slicing once up front (**not** `get_unchecked`)
2. break dependency chains: several independent accumulators (also the only way for floats, see `float_demo`)
3. fuse loops that read the same memory; fission loops to enable a cheaper formulation (separable convolution)
4. strength reduction: `%` -> mask or wrapping counter, 9 multiplies -> 6
5. branch removal: data-dependent `if` -> mask/select (cmov / csel); sorted vs random input shows the predictor
6. memory layout: SoA vs AoS, 4 sub-histograms against store-forwarding stalls, alignment, software prefetch (x86_64 only; no-op elsewhere)
7. inlining control: `#[inline(always)]` vs `#[inline(never)]`, `#[cold]` for error paths Method: write the baseline, look at what limits it (latency chain? bandwidth? mispredicts? bounds checks?), change **one** thing, re-measure, keep it only if it wins. Use `cargo asm`/Godbolt to confirm the vectoriser did what you think; timing alone lies.
"""

