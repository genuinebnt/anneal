[[sections]]
heading = "Design notes"
body = """
A sparse matrix stores only its non-zeros, so SpMV (y = A x) does 2 flops per stored value but reads at least 12-16 bytes per value (value + column index + an x gather): it is memory-bound, and the whole game is (a) a layout that streams, (b) keeping the gather on x cache-friendly, (c) balancing work across threads.

Formats implemented here, all over i64 so that every comparison against the dense oracle is **exact**:

<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Coo</div><div class="cb-g-says"><p>(row, col, val) triples; duplicates allowed and summed. Easy to build, scatter-style SpMV.</p></div></div><div class="cb-g-term"><div class="cb-g-name">CSR</div><div class="cb-g-says"><p>Row pointers + column indices + values. The default; row-parallel SpMV has no write conflicts.</p></div></div><div class="cb-g-term"><div class="cb-g-name">CSC</div><div class="cb-g-says"><p>CSR of the transpose; SpMV scatters into y (column-oriented).</p></div></div><div class="cb-g-term"><div class="cb-g-name">Ell</div><div class="cb-g-says"><p>Pad every row to the longest row; regular, SIMD-friendly, wasteful when row lengths vary.</p></div></div><div class="cb-g-term"><div class="cb-g-name"></div><div class="cb-g-says"><p>SELL-C-sigma : sort rows by length inside windows of sigma, cut into chunks of C rows, pad each chunk only to <strong>its</strong> longest row, store column-major inside the chunk so C rows advance in lock-step (one SIMD lane per row).</p><p>Kernels: serial, row-parallel (thread::scope over disjoint slices of y), merge-path (Merrill &amp; Garland): split the combined sequence (row ends, non-zeros) into equal diagonals so a single dense row cannot starve one thread.</p><p>Also Gustavson SpGEMM (row-by-row with a dense accumulator and a marker array), SpTRSV with level scheduling (rows in one level are independent), and reverse Cuthill-McKee to shrink matrix bandwidth (locality of x gathers). Everything is checked against a dense oracle on 1000 random matrices, including empty rows/cols and <strong>coo</strong> duplicates.</p></div></div></div>
"""

