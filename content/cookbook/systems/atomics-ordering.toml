[[sections]]
heading = "Design notes"
body = """
Pattern 1: a shared counter needs atomicity, not ordering: `Relaxed` is enough. Pattern 2: to **publish** data, write it, then set a flag with `Release`; the reader loads the flag with `Acquire`. That pairing guarantees the reader sees the data written before the flag.

Book (free): <https://marabos.nl/atomics/>
"""

