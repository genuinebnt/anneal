[[sections]]
heading = "Where you would use it"
body = """
worker pool / service stages.
"""

[[sections]]
heading = "Common uses"
body = """
servers and workers: finish in-flight work on SIGTERM instead of dropping jobs (Kubernetes rolling deploys).
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: a `watch` channel broadcasts "shutting down". The worker `select!`s between a job and that signal; when it fires, it drains jobs already queued (`try_recv`) before returning. No job is lost.

Docs: <https://tokio.rs/tokio/topics/shutdown>
"""

