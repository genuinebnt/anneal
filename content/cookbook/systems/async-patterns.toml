[[sections]]
heading = "Design notes"
body = """
join!(a, b)        run futures **concurrently** on the same task; wait for all.

(try_join! stops on first Err) tokio::spawn(f)    run on the runtime as an independent task; JoinHandle gives the result (or panic as Err) JoinSet            a dynamic bag of spawned tasks; `join_next()` yields results as they finish spawn_blocking(f)  run blocking or CPU-heavy code on a separate thread pool so it cannot stall async tasks Never `std::thread::sleep` or heavy loops inside async code: they block the executor thread.

Docs: <https://tokio.rs/tokio/tutorial/spawning> and <https://docs.rs/tokio/latest/tokio/task/index.html>
"""

