"""

[[sections]]
heading = "Design notes"
body = """
Pattern: each unbuffered write is a syscall. `BufWriter` batches them. For stdout, also take `stdout().lock()` once instead of locking per line.

Always `flush()` (or drop) before exiting. Real code: ripgrep locks output in its message macros -> <https://github.com/BurntSushi/ripgrep/blob/master/crates/core/messages.rs>
"""

