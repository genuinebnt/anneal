heading = "Common uses"
body = """
producer/consumer queues where memory must stay bounded: backpressure is the whole point.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: a bounded `mpsc` makes producers wait (`send().await`) or fail fast (`try_send`) when the consumer is slow, so memory stays bounded. An unbounded channel just grows until the process dies. Docs: <https://docs.rs/tokio/latest/tokio/sync/mpsc/>
"""

