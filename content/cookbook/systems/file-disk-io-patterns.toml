heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>write-ahead logs (append + fdatasync)</li><li>SSTable/B-tree page reads with pread</li><li>atomic config updates</li><li><code>cp --reflink</code>-style copies</li><li>sparse VM disk images</li><li>mail/queue spools (rename into place)</li><li>backup tools using hard links</li></ul>
"""

