[[sections]]
heading = "What it is"
body = """
a tour of file IO behaviours that decide performance and crash safety, each with a small measurement. Machine-dependent numbers are printed, never asserted; behaviours (data correctness, sparse allocation, link semantics) are asserted. Temp files only, removed at the end (also on panic, via a guard).
"""

[[sections]]
heading = "Design notes"
body = """
**Key ideas**:

- `FileExt::read_at/write_at` are `pread/pwrite`: the offset is an argument, the shared file cursor is untouched, so many threads can use one `&File` without a lock. `seek` + `read` is two syscalls and a race.
- Vectored IO (`writev`/`readv`) sends several buffers in one syscall: header + payload without a copy.
- The page cache serves repeated reads from RAM; sequential access triggers kernel readahead; random 4 KiB reads on a cold file are bounded by device IOPS. We cannot drop caches without root: Linux has `posix_fadvise(DONTNEED)` (per file, after fsync), macOS has `fcntl(F_NOCACHE)` (stop caching this fd's IO).
- Durability: `write` only reaches the page cache. `fsync` asks the OS to push data+metadata to the device; `fdatasync` skips metadata that is not needed to read the data back (e.g. mtime). On macOS plain `fsync` hands the data to the drive but does **not** flush the drive's volatile cache; `fcntl(F_FULLFSYNC)` does (slower).

   Rust's `File::sync_all` uses `F_FULLFSYNC` on Apple platforms, which is why it is slow there.
- `O_DIRECT` (Linux) bypasses the page cache: buffer address, length and file offset must be aligned to the logical block size (512 B or 4 KiB). Databases use it when they manage their own buffer pool.
- Sparse files: `set_len` makes a hole; logical length != allocated blocks (`MetadataExt::blocks()` counts 512 B units).
- Atomic creation: write a temp file in the same directory, fsync, `rename` over the target (atomic on POSIX), fsync the directory; `create_new` (O_EXCL) gives atomic "create if absent" for lock files.
- `read_dir` order is unspecified: sort when you need determinism.
"""

