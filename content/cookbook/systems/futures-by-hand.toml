[[sections]]
heading = "Design notes"
body = """
A `Future` is a state machine with one method: `poll(self: Pin<&mut Self>, cx) -> Poll<Output>`. `Ready(v)` means finished. `Pending` means not yet, and then the future must arrange to be woken through `cx.waker()`.

`async fn` and `async {}` compile into such state machines. Nothing runs until something polls them. `.await` means "poll the inner future; if it is Pending, return Pending myself".

An executor such as Tokio polls a task again when its waker says it may be ready. Dropping a future cancels it at the `.await` where it is waiting.
"""

