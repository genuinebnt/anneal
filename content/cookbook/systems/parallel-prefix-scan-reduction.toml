[[sections]]
heading = "Design notes"
body = """
A scan (prefix sum) looks inherently sequential (out[i] depends on out[i-1]) but any **associative** operator can be re-bracketed, which exposes parallelism. This file implements, with std threads only:

1. Hillis-Steele scan: log2(n) rounds, each element combines with the one `d` to its left. Depth O(log n) but **work** O(n log n): wasteful when cores &lt; n (the usual CPU case).
2. Blelloch scan: up-sweep (reduce tree) + down-sweep. Work O(n), depth 2 log n. We **count** operator applications and assert the work gap (HS &#126; n log n, Blelloch &#126; 2n).
3. Blocked three-phase scan (what you actually write on a CPU): per-block local reduce, scan the few block sums, per-block local scan with an offset. 2 passes over memory, work &#126;2n, only `threads` blocks.
4. Segmented scan: restart the scan at flagged elements; trick = lift to pairs (flag, value) with an associative operator, then reuse **any** scan unchanged.
5. Reductions: float addition is **not** associative, so a reduction whose bracketing depends on the thread count changes its answer with the thread count. Fix = fixed-shape tree (fixed leaf size, pairwise combine) independent of threads.
6. Stream compaction: flags -> exclusive scan -> scatter. The scan result IS each survivor's output index.

Verification: 2000 seeded random inputs; integers (wrapping add, also max and a non-commutative operator) must match the sequential scan exactly; floats must match within tolerance; the fixed-tree float reduction must be **bit**-identical for every thread count tested. Timings are printed, never asserted.
"""

