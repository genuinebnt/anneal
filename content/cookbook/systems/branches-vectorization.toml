[[sections]]
heading = "Design notes"
body = """
(1) The **CPU guesses** which way an `if` goes. Random data = &#126;50% wrong guesses = &#126;15-20 cycles lost each. **Sorted** (or otherwise predictable) data makes the same code fast.

Compilers often turn simple `if`s into branch-free `cmov`/masks. (2) Indexing `v[i]` has a bounds check; iterators (`iter()`, `zip`, `chunks_exact`) let the compiler prove safety and drop it. (3) Floating-point addition is **not** associative, so the compiler will not reorder `sum::<f32>()` into SIMD lanes for you.

Integers can be reordered; for floats use several independent accumulators (what SIMD would do) yourself. Explicit SIMD: `std::simd` (nightly), <https://docs.rs/wide> , <https://docs.rs/pulp> ; architecture intrinsics in `std::arch`.
"""

