<ul class="cb-g-uses"><li>image/video processing farms</li><li>scraping pools</li><li>job runners: bounded queue + bounded workers + panic isolation</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Design (domain: image resizing, **not** the DAG executor): submit() --bounded mpsc--> dispatcher task --Semaphore(N permits)--> spawned job --> results channel

<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Backpressure</div><div class="cb-g-says"><p><code>submit().await</code> waits when the queue is full (producers cannot outrun workers: bounded memory)</p></div></div><div class="cb-g-term"><div class="cb-g-name">Concurrency limit</div><div class="cb-g-says"><p>The dispatcher takes a permit <strong>before</strong> spawning, so at most N jobs run</p></div></div><div class="cb-g-term"><div class="cb-g-name">Panic isolation</div><div class="cb-g-says"><p>Each job runs in its own <code>tokio::spawn</code>; a panic becomes <code>Outcome::Panicked</code>, the pool lives on</p></div></div><div class="cb-g-term"><div class="cb-g-name">Graceful shutdown</div><div class="cb-g-says"><p><code>finish()</code> closes the queue, waits for queued and running jobs, then returns every outcome The generics: <code>F: Fn(J) -&gt; Fut</code>, <code>Fut: Future&lt;Output = R&gt; + Send + 'static</code>. Study how real pools are built: <a href="https://github.com/tokio-rs/tokio/tree/master/tokio/src/runtime" target="_blank" rel="noreferrer">https://github.com/tokio-rs/tokio/tree/master/tokio/src/runtime</a> and <a href="https://docs.rs/deadpool" target="_blank" rel="noreferrer">https://docs.rs/deadpool</a></p></div></div></div>
"""

