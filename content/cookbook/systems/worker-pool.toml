[[sections]]
heading = "Design notes"
body = """
Design (domain: image resizing, **not** the DAG executor): submit() --bounded mpsc--> dispatcher task --Semaphore(N permits)--> spawned job --> results channel

<div class="cb-g-terms"><div class="cb-g-term"><div class="cb-g-name">Backpressure (jobs only)</div><div class="cb-g-says"><p><code>submit().await</code> waits when the job queue is full. While nothing finishes, exactly <code>workers + queue + 1</code> submits return: <code>workers</code> jobs run, the dispatcher holds one more while it waits for a permit, and <code>queue</code> jobs wait in the channel</p></div></div><div class="cb-g-term"><div class="cb-g-name">Not bounded</div><div class="cb-g-says"><p>Results go to an unbounded channel that only <code>finish()</code> reads, so they grow with the number of jobs, and every caller waiting in <code>submit()</code> holds its own job. Use this pool for a finite batch</p></div></div><div class="cb-g-term"><div class="cb-g-name">Concurrency limit</div><div class="cb-g-says"><p>The dispatcher takes a permit <strong>before</strong> spawning, so at most N jobs run</p></div></div><div class="cb-g-term"><div class="cb-g-name">BOOKKEEPING</div><div class="cb-g-says"><p>Finished entries leave the <code>JoinSet</code> before the next spawn, so it never holds more than N</p></div></div><div class="cb-g-term"><div class="cb-g-name">Panic isolation</div><div class="cb-g-says"><p><code>f</code> is called, and its future runs, inside the job's own <code>tokio::spawn</code>; a panic in either becomes <code>Outcome::Panicked</code> and the pool lives on (this needs unwinding panics, not <code>panic = "abort"</code>)</p></div></div><div class="cb-g-term"><div class="cb-g-name">Graceful shutdown</div><div class="cb-g-says"><p><code>finish()</code> closes the queue, waits for queued and running jobs, then returns every outcome. It has no deadline: a job that never ends makes it wait forever</p></div></div></div>

The generics: `F: Fn(J) -> Fut`, `Fut: Future<Output = R> + Send + 'static`. Study how a real runtime is built: <https://github.com/tokio-rs/tokio/tree/master/tokio/src/runtime>
"""

