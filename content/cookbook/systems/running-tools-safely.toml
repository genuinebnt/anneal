[[sections]]
heading = "Design notes"
body = """
No shell, a program named by its full path, arguments that cannot turn into options, a chosen environment and folder, a cap on output, one time limit, and the whole process group killed when the run ends.

&#42;&#42;**this is not a SANDBOX**.&#42;&#42; The tool runs as you. It can read and write your files, use the network, take memory, processor time and disk, and start more processes. A process that starts its own session leaves the group and survives.

To run code you don't trust, use an isolation boundary made for it, and still apply these limits. Unix only (Linux and macOS). Run and checked on macOS.

The checks start this same program as the "tool".
"""

