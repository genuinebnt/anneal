[[sections]]
heading = "Design notes"
body = """
Pattern: spawn everything into a `JoinSet`, but each task must hold a semaphore permit to run. The test is an invariant: track in-flight count with atomics and assert max_seen &lt;= limit. Real code: tokio's sync primitives -> <https://github.com/tokio-rs/tokio/tree/master/tokio/src/sync>
"""

