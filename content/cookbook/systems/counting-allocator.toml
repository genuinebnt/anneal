[[sections]]
heading = "Design notes"
body = """
Allocation is often the real cost in Rust code, and it is invisible in the source. A wrapper around the system allocator that counts calls lets you **assert** "this function allocates at most N times", which makes a perf test deterministic (unlike timing). Tools: dhat <https://docs.rs/dhat> , heaptrack, cargo-flamegraph.

Tactics shown: `with_capacity`, reusing a buffer (`clear()` keeps capacity), `write!` instead of `format!`, borrowing instead of `clone`. Read: <https://nnethercote.github.io/perf-book/heap-allocations.html>
"""

