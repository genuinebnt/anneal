[[sections]]
heading = "Design notes"
body = """
Send = a value can be **moved** to another thread. Sync = `&T` can be **shared** between threads. `Rc` is neither (non-atomic counter); `Arc<Mutex<T>>` is both; raw `RefCell` is Send but not Sync.

The compiler checks this for you: sharing the wrong thing across `thread::spawn` is a compile error.
"""

