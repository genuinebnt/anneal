[[sections]]
heading = "Where you would use it"
body = """
CPU-bound fork-join parallelism, understanding rayon/tokio schedulers.
"""

[[sections]]
heading = "What it is"
body = """
each worker owns a `crossbeam_deque::Worker` (LIFO for its own jobs), a global `Injector` takes jobs from outside threads, and idle workers `Stealer::steal` from the **front** of other workers' deques (the oldest job, which in a recursive split is usually a large one). Jobs are `Box<dyn FnOnce() + Send>`.
"""

[[sections]]
heading = "Why it matters"
body = """
a single `Mutex<VecDeque>` is a lock every spawn and pop must take; with many tiny recursive jobs it can become the bottleneck. In the stealing pool, pushing and popping your own deque takes no lock.

Spawning is not free of shared state: every spawn updates a shared epoch counter and reads the sleeper count, and a `Batch` spawn also updates the batch's pending count.
"""

[[sections]]
heading = "How it works"
body = """
- a worker's deque lives in a thread-local, so a job that calls `spawn_job` pushes to its own deque (no lock);
- idle workers try the other deques in index order, always starting at worker 0. That is simple and correct but does not spread thieves out (rayon and tokio's multi-thread runtime start at a random worker);
- `Batch::join` **helps**: while its jobs are pending it runs other jobs instead of blocking, so fork-join that waits through `join` does not deadlock the pool even with fewer threads than the recursion depth. The cost: helped jobs nest on the waiting thread's stack with no depth limit.

   This demo overflowed an 8 MiB main stack in some debug runs, so it now calls from a thread with a large stack. A job that blocks any other way still holds its thread;
- idle workers sleep on a condvar using an epoch counter (spawn bumps the epoch, sleeper re-checks it under the lock: no lost wakeups; a 100 ms timed wait is only a safety net);
- panics: every job runs under `catch_unwind` (unwinding panics only); a `Batch` records the message and `join` returns `Err(messages)`;
- shutdown: once Drop starts, `spawn_job` from outside the pool returns `Err(Rejected(job))`. Jobs already accepted still run, including jobs they spawn from a worker. A worker notes whether shutdown has started **before** it searches, and exits only if it had and the search found nothing; Drop then joins every worker.
"""

[[sections]]
heading = "Design notes"
body = """
Both pools implement the same tiny `Exec` trait so the identical parallel fib / merge sort runs on each.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>data-parallel CPU work (sorting, parsing, image tiles, parallel search)</li><li>game-engine job systems</li><li>build tools. Rayon and tokio's multi-thread runtime also schedule by work stealing</li><li>with far more refined queues and sleeping. For async I/O use tokio</li><li>for CPU-bound data parallelism use rayon</li><li>shown below</li></ul>
"""

