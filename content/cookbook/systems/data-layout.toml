[[sections]]
heading = "Where you would use it"
body = """
hot loops over many records (tasks, events, vectors), reducing cache misses.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>columnar engines</li><li>ECS game engines</li><li>analytics: scan one field without dragging cold data through the cache</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
The CPU reads memory in 64-byte cache lines. If a loop only needs one small field but each record is large, every cache line mostly carries data you do not use. Struct-of-arrays (SoA) stores each field in its own contiguous Vec so a scan over one field touches only that data.

`#[repr(C)]` keeps declared field order (padding follows); default `repr(Rust)` is free to reorder fields to shrink the struct.
"""

