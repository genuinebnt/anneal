[[sections]]
heading = "Where you would use it"
body = """
any loop with `select!`/`timeout` around a multi-step async operation (framing, handshakes, batching).
"""

[[sections]]
heading = "Common uses"
body = """
every select!/timeout loop: do not lose half-read frames or half-built batches.
"""

[[sections]]
heading = "Design notes"
body = """
When a `select!` branch loses, its future is DROPPED mid-way. If that future had already taken data out of a channel/socket but not yet returned it, the data is gone. `mpsc::Receiver::recv` is cancel-safe (nothing is consumed unless it returns).

A user-written `async fn` that does recv + recv is **not**: the first value lives only in the future's local variable. Fix: keep progress in state **owned by the caller** (outside the future) and only await cancel-safe primitives inside `select!`.

The demo runs on tokio's **paused** clock (one thread, virtual time that jumps to the next timer; feature `test-util`), so which side of each race wins is the same on every run, however loaded the machine is. Tokio documents the cancel-safety of every method: <https://docs.rs/tokio/latest/tokio/macro.select.html#cancellation-safety>
"""

