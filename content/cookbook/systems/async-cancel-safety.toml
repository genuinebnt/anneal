[[sections]]
heading = "Where you would use it"
body = """
any loop with `select!`/`timeout` around an operation that takes several steps (framing, handshakes, batching).
"""

[[sections]]
heading = "Common uses"
body = """
every select!/timeout loop: do not lose half-read frames or half-built batches.
"""

[[sections]]
heading = "Design notes"
body = """
When a `select!` branch loses, its future is dropped part way. If that future had already taken data out of a channel or a socket, and not yet returned it, the data is gone. `mpsc::Receiver::recv` is cancel-safe: if it loses, it has taken nothing.

An `async fn` that calls `recv` twice is not: the first value lives only in the future's local variable. The fix: keep progress in state the caller owns, outside the future, and race only cancel-safe calls in `select!`. The demo runs on Tokio's paused clock (one thread, and time that jumps to the next timer when every task waits; feature `test-util`).

So which side wins each race is the same on every run, however loaded the machine is. Tokio lists which of its methods are cancel-safe: <https://docs.rs/tokio/latest/tokio/macro.select.html#cancellation-safety>
"""

