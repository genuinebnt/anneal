[[sections]]
heading = "What it is"
body = """
`mmap(2)` maps a file into the address space. Loads and stores on the returned slice become page faults served from the OS page cache: no `read` syscalls, no copy into a user buffer, and the kernel decides what stays resident. `Mmap` is a read-only `&[u8]`; `MmapMut` is a writable `&mut [u8]`.
"""

[[sections]]
heading = "Design notes"
body = """
**Durability**: stores into an `MmapMut` only dirty page-cache pages. `flush()` is `msync(MS_SYNC)`: it blocks until the dirty pages are written to the device (like fsync). `flush_async()` is `MS_ASYNC`: it just schedules the writeback.

A crash of **your** process loses nothing already stored (the kernel owns the pages); a power loss / kernel crash can lose anything not msync'd. Order matters: write the record, flush, **then** publish it by bumping the count in the header, flush again.

**Growth**: a mapping has a fixed length. To grow: flush, `File::set_len(bigger)` (sparse zeros), drop the old map, map again. Slices from the old map must not outlive it (the borrow checker enforces that).

**Alignment**: a map starts on a page boundary, so offset `k * align_of::<T>()` is aligned for `T`. A `#[repr(C)]` struct of plain integers can be viewed in place with `align_to`, but byte order and padding make that non-portable; reading fields with `from_le_bytes` is always safe and costs nothing measurable.

**Why** `Mmap::map` IS `unsafe`: Rust requires that memory behind a `&[u8]` is not mutated while borrowed.

The OS gives no such promise for files: another process (or thread via a second map) can write to the file under you (data race, torn values), and if it **truncates** the file, touching a page beyond the new end delivers SIGBUS and kills your process: no `Result`, no unwinding.

Only map files you own exclusively (e.g. protect with an advisory lock, see file_locking_atomic_replace), never untrusted or shared-writable ones. Also: IO errors (disk failure, a network filesystem hiccup) surface as SIGBUS, not `Err`.

Compared to `read`: mmap wins for random access, repeated scans (page cache stays warm, no copies) and shared maps; plain sequential `read` into a reusable buffer is as fast for one-pass streaming and has sane error handling. Measure; the timing below is only illustrative.
"""

