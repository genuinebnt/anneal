[[sections]]
heading = "Design notes"
body = """
Record = [len: u32 LE][crc32: u32 LE][payload]. Append-only: the only operation that can be half-done by a crash is the **last** write. On startup, scan from the beginning; the first record that is truncated or fails its checksum marks the end of valid data; **truncate** the file there and continue appending.

A record is durable only after `sync_data` (fsync), so decide per workload whether to sync every record (safe, slow), or batch (group commit). The checksum catches torn writes **and** silent corruption.
"""

