[[sections]]
heading = "Design notes"
body = """
INLINING pastes a function's body into the caller. It removes call overhead **and** lets the optimiser see across the boundary (constants propagate, loops vectorise). The compiler inlines small functions in the **same** crate by itself.

Hints: #[inline]          "consider inlining, even across crates" (needed for small public lib fns, else cross-crate calls stay calls unless LTO is on). Generic functions are always available for inlining.

```text
#[inline(always)]  force (rarely right; can bloat code)       #[inline(never)]  forbid (benchmarks, cold paths, shrink binary)
```

&#35;[cold]            "rarely called": moves error/panic paths away from the hot path and biases branch layout. Dispatch cost: generic `F: Fn` = monomorphised + inlinable; `&dyn Fn`/`Box<dyn Trait>` = indirect call through a vtable, usually **not** inlinable when the callee is really unknown at compile time, so it blocks vectorisation.

(If the optimiser can **prove** the concrete type it will devirtualise; do not rely on that across module/crate boundaries.) Use dyn when you need runtime polymorphism, generics in hot loops. Inspect what the compiler did: <https://github.com/pacak/cargo-show-asm> (`cargo asm`) or <https://godbolt.org/>
"""

