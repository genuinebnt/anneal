[[sections]]
heading = "Design notes"
body = """
A `Stream` is an async iterator.

Turn a list of inputs into a stream, `map` each to a future, then: .buffer_unordered(k)  run up to k futures at once; yield results as they **complete** (fastest first) .buffered(k)          same concurrency but yield results in **input** order FuturesUnordered      a dynamic set you can keep pushing futures into These run on the **same** task (concurrent, not parallel).

To use many threads, `tokio::spawn` each future first. Docs: <https://docs.rs/futures-util/latest/futures_util/stream/trait.StreamExt.html> and <https://tokio.rs/tokio/tutorial/streams>
"""

