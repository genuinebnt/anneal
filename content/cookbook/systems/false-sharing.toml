[[sections]]
heading = "Design notes"
body = """
Cores keep their own copy of each cache line and must agree via a coherence protocol. If thread A writes variable X and thread B writes a **different** variable Y that happens to sit in the **same** 64-byte line, every write invalidates the other core's copy: the line ping-pongs although the threads share no data.

Fix: pad/align hot per-thread data to its own line (`#[repr(align(64))]`; crossbeam's `CachePadded` does this, using 128 on some CPUs where the prefetcher pairs lines).
"""

