[[sections]]
heading = "Design notes"
body = """
Rules that prevent most lock bugs:

1. Keep critical sections **small**; never do IO/sleep/await while holding a guard.
2. If code ever needs two locks, always take them in the **same** global order (or you can deadlock).
3. Prefer message passing or one owner task (shared_state) when the logic gets complicated.
4. `RwLock` helps only when reads vastly outnumber writes and critical sections are not tiny. A std `Mutex` is "poisoned" if a thread panicked while holding it; decide whether to recover. Faster/fairer locks: <https://docs.rs/parking_lot> .

   Read: <https://doc.rust-lang.org/std/sync/struct.Mutex.html>
"""

