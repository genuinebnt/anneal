[[sections]]
heading = "Design notes"
body = """
The CPU loads memory in 64-byte **cache lines** (16 u32s). Touching the next element is nearly free (same line, and the hardware prefetcher guesses sequential access). Jumping around costs a trip to L2/L3/RAM (&#126;4ns / &#126;15ns / &#126;80ns).

(On Apple Silicon the cache line is 128 bytes and the prefetcher is aggressive, so exact numbers differ from x86.) Rules: iterate in memory order; keep data that is used together close together; prefer Vec&lt;T> over linked structures; process big data in **blocks** that fit in cache. Numbers vary by machine; the **ratios** are the lesson.
"""

