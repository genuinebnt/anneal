not_checked = "No timing. Capacity and hash-count behaviour were run on aarch64 only; hashbrown's group width differs between targets. The closure, early-return and capacity behaviour is stated for 1.98.1 only. Method signatures were compared with the source by a script, leaving out the allocator parameter and stability attributes. entry_ref and the BTreeMap method list come from reading source and were not run. Stable-since values were read from attributes, not checked on old compilers. Mutation checks in a scratch copy (each made a test fail): keeping zero counts in take_one, using entry in bump, inserting before parsing in parsed, overwriting in record_best, a wrong initial count, an eager or_insert in the laziness test, a present key in the reserve test, no removals in the capacity test, and entry in place of the three-call version in the hash count."
