[[terms]]
term = "data race"
means = "Conflicting accesses, at least one non-atomic, with no happens-before between them; undefined behaviour."
section = "Happens-before in plain words"

[[terms]]
term = "publication"
means = "Writing data once and handing it to other threads through a release store."
section = "Publishing data"

[[terms]]
term = "litmus test"
means = "A tiny concurrent program whose possible results show what a memory model allows."
section = "Why Relaxed is not enough"

[[terms]]
term = "total store order"
means = "The x86 model: each core queues its stores, and all cores agree on the order they reach memory."
section = "Why Relaxed is not enough"

[[terms]]
term = "fence"
means = "An ordering operation that is not attached to one memory location."
section = "Last one out: reference counting"

[[terms]]
term = "store buffering"
means = "Both threads store, then load the other location, and both read the old value."
section = "When SeqCst matters"

