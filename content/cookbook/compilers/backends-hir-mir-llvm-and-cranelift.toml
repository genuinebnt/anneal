[[sections]]
heading = "Overview"
body = """
<p class="cb-g-deep"><b>Deep dives</b> <a href="/cookbook/p/designing-an-ir-in-rust">9 · IR design</a> <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10 · Dataflow and abstract interp.</a> <a href="/cookbook/p/dominators-loops-and-control-flow-structure">11 · Dominators and loops</a> <a href="/cookbook/p/ssa-construction-and-destruction">12 · SSA in and out</a> <a href="/cookbook/p/scalar-optimizations">13 · Scalar optimizations</a> <a href="/cookbook/p/e-graphs-and-equality-saturation">14 · E-graphs</a> <a href="/cookbook/p/instruction-selection-scheduling-and-emission">17 · Instruction selection</a> <a href="/cookbook/p/register-allocation">18 · Register allocation</a> <a href="/cookbook/p/abis-object-files-linking-and-unwinding">19 · ABI, objects, linking</a> <a href="/cookbook/p/loop-optimization-and-vectorization">16 · Loops and vectorization</a> <a href="/cookbook/p/webassembly-as-a-compilation-target">20 · WebAssembly target</a> <a href="/cookbook/p/gpu-and-accelerator-compilation">21 · GPUs and accelerators</a></p>

<div class="cb-g-ladder" aria-label="rustc lowering pipeline"> <div><b>Tokens</b><span>rustc_lexer</span></div><i>→</i> <div><b>AST</b><span>macros expanded, names resolved</span></div><i>→</i> <div><b>HIR</b><span>desugared; type checking</span></div><i>→</i> <div><b>THIR</b><span>fully typed; patterns checked</span></div><i>→</i> <div><b>MIR</b><span>CFG of basic blocks; borrowck, MIR opts</span></div><i>→</i> <div><b>LLVM IR / CLIF / GCC</b><span>SSA; instruction selection, register allocation</span></div><i>→</i> <div><b>Machine code</b><span>object files, linker</span></div> </div>

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Backend</th><th>Design</th><th>Trade-off</th><th>Use from Rust</th></tr></thead> <tbody> <tr><td>LLVM</td><td>SSA IR, hundreds of passes, many targets</td><td>Excellent code but slow to compile. A large C++ dependency</td><td><code>inkwell</code> (safe wrapper) or <code>llvm-sys</code>. Follow the Kaleidoscope tutorial</td></tr> <tr><td>Cranelift</td><td>SSA IR (CLIF) with block parameters instead of phi nodes. An e-graph (“aegraph”) mid-end, lowering rules written in the ISLE DSL, and <code>regalloc2</code></td><td>Much faster compilation, somewhat slower code. Pure Rust</td><td><code>cranelift-frontend</code>, <code>cranelift-jit</code>, <code>cranelift-object</code>. Also <code>rustc_codegen_cranelift</code> for fast debug builds</td></tr> <tr><td>WebAssembly</td><td>A structured stack machine; the host engine does the rest</td><td>The easiest first native target, and it runs in the browser</td><td><code>wasm-encoder</code>, then run with <code>wasmtime</code></td></tr> <tr><td>QBE</td><td>A small SSA backend that reads a text IR</td><td>About 70% of LLVM's performance for 10% of the code, according to its authors. Easy to read end to end</td><td>Emit text and shell out to <code>qbe</code></td></tr> <tr><td>MLIR</td><td>A framework of IR “dialects” at many levels of abstraction</td><td>Suited to ML and domain-specific compilers</td><td>Mostly C++; <code>melior</code> provides Rust bindings</td></tr> </tbody> </table></div>
"""

[[sections]]
heading = "Optimizations and what they need"
body = """
<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Pass</th><th>What it does</th><th>Built on</th><th>Where you'll see it</th></tr></thead> <tbody> <tr><td>Constant folding and propagation</td><td>Evaluates what can be computed at compile time. SCCP also removes branches whose condition is known</td><td>SSA plus a lattice (Wegman–Zadeck)</td><td>MIR GVN and const prop, LLVM SCCP</td></tr> <tr><td>Dead code elimination</td><td>Removes values nothing uses and blocks nothing reaches</td><td>Use-def chains, reachability</td><td>Everywhere, including <code>SimplifyCfg</code></td></tr> <tr><td>GVN and CSE</td><td>Computes an expression once and reuses the result</td><td>Dominator tree plus hashing of value expressions</td><td>MIR GVN, LLVM GVN, Cranelift's aegraph</td></tr> <tr><td>Inlining</td><td>Copies a callee's body into the caller, which exposes everything else to optimization</td><td>Call graph and a cost model</td><td>MIR inliner, LLVM inliner</td></tr> <tr><td>LICM</td><td>Moves loop-invariant code out of loops</td><td>Loop nesting forest, dominators</td><td>LLVM, Cranelift</td></tr> <tr><td>SROA and mem2reg</td><td>Breaks structs into scalars and promotes stack slots to SSA registers</td><td>SSA construction (Cytron or Braun)</td><td>LLVM, and assignment 2 of KAIST CS420</td></tr> <tr><td>Instruction selection</td><td>Chooses machine instructions by tiling the IR tree or DAG</td><td>Tree pattern matching, or DP over tiles</td><td>LLVM SelectionDAG and GlobalISel, Cranelift ISLE</td></tr> <tr><td>Register allocation</td><td>Maps unlimited virtual registers onto the machine's registers</td><td>Interference graph coloring, or linear scan over live ranges</td><td>LLVM greedy allocator, <code>regalloc2</code></td></tr> <tr><td>Equality saturation</td><td>Applies every rewrite at once, then extracts the cheapest equivalent program</td><td>E-graphs</td><td><code>egg</code>, Cranelift's aegraph</td></tr> </tbody> </table></div>

<p><b>Build it.</b> Define a small SSA IR for typed Lox: blocks with parameters as in Cranelift, <code>u32</code> value IDs, and a textual format. Write a parser for that format so optimization tests can be golden files: IR in, IR out. Cornell's Bril IR is a ready-made version of this, with tooling and benchmarks.</p>
"""
