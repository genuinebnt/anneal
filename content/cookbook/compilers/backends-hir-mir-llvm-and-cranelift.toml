title = "Backends: HIR, MIR, LLVM and Cranelift"
module = "Compilers and languages"
module_order = 12
chapter = "Back ends"
chapter_order = 6
order = 633
kind = "guide"
lede = "clox goes from tokens straight to bytecode. A real compiler lowers through several IRs, and each one makes a particular kind of analysis easy."
