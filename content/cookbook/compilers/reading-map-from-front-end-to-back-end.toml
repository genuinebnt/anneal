title = "Reading map, from front end to back end"
module = "Appendices"
module_order = 15
chapter = "Courses, reading and glossary"
chapter_order = 1
order = 698
kind = "guide"
lede = "Books, papers and blogs for each stage after Lox. Start with the first book in each group."
origin = "Compiler guide"

[[sections]]
heading = "Overview"
body = """
<div class="cb-g-rmap"> <div class="cb-g-rgroup"><h3>Front end and parsing</h3> <h4>Books</h4><ul> <li><em>Parsing Techniques: A Practical Guide</em>, Grune and Jacobs</li> <li><em>Engineering a Compiler</em>, Cooper and Torczon, ch. 2–3</li> <li><em>Writing an Interpreter in Go</em> and <em>Writing a Compiler in Go</em>, Ball</li></ul> <h4>Papers</h4><ul> <li>Pratt 1973, “Top Down Operator Precedence”</li> <li>Ford 2004, “Parsing Expression Grammars”</li> <li>Wagner and Graham 1998, “Efficient and Flexible Incremental Parsing”</li> <li><a href="https://arxiv.org/abs/1804.07133" target="_blank" rel="noreferrer">Diekmann and Tratt 2020, “Don't Panic! Better, Fewer, Syntax Errors for LR Parsers”</a></li></ul> <h4>Blogs</h4><ul> <li><a href="https://matklad.github.io" target="_blank" rel="noreferrer">matklad</a>: resilient parsing, rust-analyzer architecture</li> <li><a href="https://rust-analyzer.github.io/blog/2020/07/20/three-architectures-for-responsive-ide.html" target="_blank" rel="noreferrer">Three Architectures for a Responsive IDE</a></li> <li><a href="https://tratt.net/laurie/blog/" target="_blank" rel="noreferrer">Laurence Tratt</a>: LR parsing and error recovery</li> <li><a href="https://journal.stuffwithstuff.com" target="_blank" rel="noreferrer">Bob Nystrom</a>: Pratt parsing, language design</li></ul> </div> <div class="cb-g-rgroup"><h3>Types and semantics</h3> <h4>Books</h4><ul> <li><em>Types and Programming Languages</em>, Pierce</li> <li><em>Practical Foundations for Programming Languages</em>, Harper</li> <li><em>Programming Language Pragmatics</em>, Scott</li></ul> <h4>Papers</h4><ul> <li>Milner 1978, “A Theory of Type Polymorphism in Programming”</li> <li>Wadler and Blott 1989, “How to Make Ad-hoc Polymorphism Less Ad Hoc”</li> <li><a href="https://arxiv.org/abs/1306.6032" target="_blank" rel="noreferrer">Dunfield and Krishnaswami 2013, “Complete and Easy Bidirectional Typechecking”</a></li> <li><a href="http://moscova.inria.fr/~maranget/papers/ml05e-maranget.pdf" target="_blank" rel="noreferrer">Maranget 2008, “Compiling Pattern Matching to Good Decision Trees”</a></li> <li>Weiss et al. 2019, “Oxide: The Essence of Rust”</li></ul> <h4>Blogs</h4><ul> <li><a href="https://smallcultfollowing.com/babysteps/" target="_blank" rel="noreferrer">Niko Matsakis</a>: NLL, Polonius, trait solving</li> <li><a href="https://www.ralfj.de/blog/" target="_blank" rel="noreferrer">Ralf Jung</a>: unsafe Rust semantics, Stacked and Tree Borrows</li> <li><a href="https://okmij.org/ftp/ML/generalization.html" target="_blank" rel="noreferrer">Oleg Kiselyov</a>: how OCaml's type checker generalizes</li></ul> </div> <div class="cb-g-rgroup"><h3>Middle end and optimization</h3> <h4>Books</h4><ul> <li><em>Engineering a Compiler</em>, ch. 8–10</li> <li><em>SSA-based Compiler Design</em>, Rastello and Bouchez Tichadou (eds.)</li> <li><a href="https://cs.au.dk/~amoeller/spa/" target="_blank" rel="noreferrer"><em>Static Program Analysis</em></a>, Møller and Schwartzbach</li> <li><em>Advanced Compiler Design and Implementation</em>, Muchnick</li></ul> <h4>Papers</h4><ul> <li>Kildall 1973, “A Unified Approach to Global Program Optimization”</li> <li>Cousot and Cousot 1977, “Abstract Interpretation”</li> <li>Cytron et al. 1991, “Efficiently Computing Static Single Assignment Form”</li> <li><a href="https://c9x.me/compile/bib/braun13cc.pdf" target="_blank" rel="noreferrer">Braun et al. 2013, “Simple and Efficient Construction of SSA Form”</a></li> <li><a href="https://www.cs.rice.edu/~keith/EMBED/dom.pdf" target="_blank" rel="noreferrer">Cooper, Harvey and Kennedy 2001, “A Simple, Fast Dominance Algorithm”</a></li> <li>Click and Paleczny 1995, “A Simple Graph-Based Intermediate Representation”</li> <li><a href="https://arxiv.org/abs/2004.03082" target="_blank" rel="noreferrer">Willsey et al. 2021, “egg: Fast and Extensible Equality Saturation”</a></li></ul> <h4>Blogs</h4><ul> <li><a href="https://bernsteinbear.com" target="_blank" rel="noreferrer">Max Bernstein</a>: SSA, JITs, small compilers</li> <li><a href="https://c9x.me/compile/bib/" target="_blank" rel="noreferrer">QBE bibliography</a>: a curated list of compiler papers</li> <li><a href="https://rustc-dev-guide.rust-lang.org/mir/index.html" target="_blank" rel="noreferrer">rustc dev guide: MIR</a>, <a href="https://rustc-dev-guide.rust-lang.org/query.html" target="_blank" rel="noreferrer">queries</a></li></ul> </div> <div class="cb-g-rgroup"><h3>Back end and code generation</h3> <h4>Books</h4><ul> <li><em>Modern Compiler Implementation in ML</em>, Appel</li> <li><em>Compilers: Principles, Techniques, and Tools</em> (the Dragon book), ch. 8–9</li> <li><a href="https://github.com/IUCompilerCourse/Essentials-of-Compilation" target="_blank" rel="noreferrer"><em>Essentials of Compilation</em></a>, Siek (free)</li> <li><em>Computer Systems: A Programmer's Perspective</em>, Bryant and O'Hallaron</li></ul> <h4>Papers</h4><ul> <li><a href="https://llvm.org/pubs/2004-01-30-CGO-LLVM.pdf" target="_blank" rel="noreferrer">Lattner and Adve 2004, “LLVM”</a></li> <li>Chaitin 1982; Briggs, Cooper and Torczon 1994, graph-coloring register allocation</li> <li>Poletto and Sarkar 1999, “Linear Scan Register Allocation”</li> <li>Aho, Ganapathi and Tjiang 1989, “Code Generation Using Tree Matching and Dynamic Programming”</li> <li><a href="https://arxiv.org/abs/2011.13127" target="_blank" rel="noreferrer">Xu and Kjolstad 2021, “Copy-and-Patch Compilation”</a></li></ul> <h4>Blogs</h4><ul> <li><a href="https://cfallin.org/blog/" target="_blank" rel="noreferrer">Chris Fallin</a>: Cranelift, ISLE, regalloc2, aegraphs</li> <li><a href="https://llvm.org/docs/tutorial/" target="_blank" rel="noreferrer">LLVM Kaleidoscope tutorial</a></li> <li><a href="https://eli.thegreenplace.net" target="_blank" rel="noreferrer">Eli Bendersky</a>: LLVM, linkers, ABIs</li> <li><a href="https://capra.cs.cornell.edu/bril/" target="_blank" rel="noreferrer">Bril</a>: the Cornell IR for experiments</li></ul> </div> <div class="cb-g-rgroup"><h3>Runtimes, GC and VMs</h3> <h4>Books</h4><ul> <li><em>The Garbage Collection Handbook</em>, Jones, Hosking and Moss</li> <li><em>Virtual Machines</em>, Smith and Nair</li> <li><em>Lisp in Small Pieces</em>, Queinnec</li></ul> <h4>Papers</h4><ul> <li>Cheney 1970, “A Nonrecursive List Compacting Algorithm”</li> <li>Dijkstra et al. 1978, “On-the-Fly Garbage Collection”</li> <li>Bacon, Cheng and Rajan 2004, “A Unified Theory of Garbage Collection”</li> <li>Blackburn and McKinley 2008, “Immix”</li> <li>Reinking et al. 2021, “Perceus: Garbage Free Reference Counting with Reuse”</li> <li>Deutsch and Schiffman 1984 (inline caching); Hölzle et al. 1991 (polymorphic inline caches)</li> <li>Ertl and Gregg 2003, “The Structure and Performance of Efficient Interpreters”</li> <li>Bolz et al. 2009, “Tracing the Meta-Level: PyPy's Tracing JIT Compiler”</li></ul> <h4>Blogs</h4><ul> <li><a href="https://wingolog.org" target="_blank" rel="noreferrer">Andy Wingo</a>: GC, JITs, Guile, Whippet</li> <li><a href="https://manishearth.github.io/blog/2021/04/05/a-tour-of-safe-tracing-gc-designs-in-rust/" target="_blank" rel="noreferrer">Manish Goregaokar</a>: safe GC designs in Rust</li> <li><a href="https://mcyoung.xyz" target="_blank" rel="noreferrer">Miguel Young de la Sota</a>: Rust internals, codegen, performance</li></ul> </div> <div class="cb-g-rgroup"><h3>Databases and DSLs</h3> <h4>Books</h4><ul> <li><em>Database Internals</em>, Petrov</li> <li><em>How Query Engines Work</em>, Grove</li> <li><em>Designing Data-Intensive Applications</em>, Kleppmann</li></ul> <h4>Papers</h4><ul> <li>Selinger et al. 1979, “Access Path Selection in a Relational Database Management System”</li> <li>Graefe 1994, “Volcano”; Graefe 1995, “The Cascades Framework”</li> <li>Boncz et al. 2005, “MonetDB/X100: Hyper-Pipelining Query Execution”</li> <li><a href="https://www.vldb.org/pvldb/vol4/p539-neumann.pdf" target="_blank" rel="noreferrer">Neumann 2011, “Efficiently Compiling Efficient Query Plans for Modern Hardware”</a></li> <li>Leis et al. 2015, “How Good Are Query Optimizers, Really?”</li></ul> <h4>Blogs</h4><ul> <li><a href="https://notes.eatonphil.com" target="_blank" rel="noreferrer">Phil Eaton</a>: writing SQL databases and parsers from scratch</li> <li><a href="https://www.scattered-thoughts.net" target="_blank" rel="noreferrer">Jamie Brandon</a>: query languages, incremental computation</li> <li><a href="https://datafusion.apache.org" target="_blank" rel="noreferrer">Apache DataFusion</a> docs and source</li></ul> </div> <div class="cb-g-rgroup"><h3>Performance and concurrency</h3> <h4>Books</h4><ul> <li><a href="https://marabos.nl/atomics/" target="_blank" rel="noreferrer"><em>Rust Atomics and Locks</em></a>, Bos (free online)</li> <li><em>The Art of Multiprocessor Programming</em>, Herlihy and Shavit</li> <li><a href="https://en.algorithmica.org/hpc/" target="_blank" rel="noreferrer"><em>Algorithms for Modern Hardware</em></a>, Slotin</li> <li><em>Hacker's Delight</em>, Warren</li> <li><a href="https://nnethercote.github.io/perf-book/" target="_blank" rel="noreferrer"><em>The Rust Performance Book</em></a>, Nethercote</li></ul> <h4>Papers</h4><ul> <li><a href="https://people.freebsd.org/~lstewart/articles/cpumemory.pdf" target="_blank" rel="noreferrer">Drepper 2007, “What Every Programmer Should Know About Memory”</a></li> <li>Treiber 1986 (lock-free stack); Michael and Scott 1996 (lock-free queue)</li> <li>Chase and Lev 2005, “Dynamic Circular Work-Stealing Deque”</li> <li>Michael 2004, “Hazard Pointers”; Fraser 2004, “Practical Lock-Freedom”</li> <li><a href="https://arxiv.org/abs/1902.08318" target="_blank" rel="noreferrer">Langdale and Lemire 2019, “Parsing Gigabytes of JSON per Second”</a></li></ul> <h4>Blogs</h4><ul> <li><a href="https://lemire.me/blog/" target="_blank" rel="noreferrer">Daniel Lemire</a>: SIMD, parsing, fast algorithms</li> <li><a href="https://research.swtch.com" target="_blank" rel="noreferrer">Russ Cox</a>: regex engines, memory models</li> <li><a href="https://without.boats" target="_blank" rel="noreferrer">without.boats</a>: async Rust design</li></ul> </div> <div class="cb-g-rgroup"><h3>Language tooling</h3> <h4>Specs and docs</h4><ul> <li><a href="https://microsoft.github.io/language-server-protocol/" target="_blank" rel="noreferrer">Language Server Protocol specification</a></li> <li><a href="https://microsoft.github.io/debug-adapter-protocol/" target="_blank" rel="noreferrer">Debug Adapter Protocol specification</a></li> <li><a href="https://tree-sitter.github.io/tree-sitter/" target="_blank" rel="noreferrer">Tree-sitter docs</a>: grammars, queries, corpus tests</li> <li><a href="https://dwarfstd.org" target="_blank" rel="noreferrer">DWARF standard</a></li> <li><a href="https://ossf.github.io/osv-schema/" target="_blank" rel="noreferrer">OSV schema</a> for vulnerability advisories</li></ul> <h4>Papers</h4><ul> <li>Wadler 2003, “A Prettier Printer”; Oppen 1980, “Prettyprinting”</li> <li>Savage et al. 1997, “Eraser: A Dynamic Data Race Detector”</li> <li>Flanagan and Freund 2009, “FastTrack: Efficient and Precise Dynamic Race Detection”</li> <li>Flanagan and Godefroid 2005, “Dynamic Partial-Order Reduction”</li> <li>Burckhardt et al. 2010, “A Randomized Scheduler with Probabilistic Guarantees of Finding Bugs” (PCT)</li> <li>Cadar et al. 2008, “KLEE”</li></ul> <h4>Blogs and code</h4><ul> <li><a href="https://rust-analyzer.github.io/blog/" target="_blank" rel="noreferrer">rust-analyzer blog</a> and its <code>docs/dev/architecture.md</code></li> <li><a href="https://github.com/biomejs/biome" target="_blank" rel="noreferrer">Biome</a>, <a href="https://github.com/astral-sh/ruff" target="_blank" rel="noreferrer">ruff</a>, <a href="https://github.com/oxc-project/oxc" target="_blank" rel="noreferrer">oxc</a>: linters and formatters in Rust</li> <li><a href="https://rustsec.org" target="_blank" rel="noreferrer">RustSec</a> advisory database and tools</li></ul> </div> </div>
"""
