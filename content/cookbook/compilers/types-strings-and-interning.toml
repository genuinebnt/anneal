<p>This is where the heap starts. Make <code>Value</code> a <code>Copy</code> enum whose object case holds a handle, <code>Obj(ObjRef)</code>, not a pointer. The <a href="/cookbook/p/garbage-collection">GC slice</a> explains why a handle is the right choice in Rust.</p>

<p>Intern every string when you allocate it, using <code>HashMap&lt;Box&lt;str&gt;, ObjRef&gt;</code> on the heap. Equal strings then share one handle, so string equality becomes handle equality. Use <code>HashMap</code> for globals and fields for now. Chapter 20's hand-written hash table is optional and belongs in C10, once profiling shows you need it.</p>

<p>Only use <code>Value</code> through methods like <code>is_number()</code>, <code>as_number()</code> and <code>Value::NIL</code>, never by matching on its variants outside <code>value.rs</code>. Then NaN boxing in C10 is a change to one file.</p>

```rust title="crates/clox/src/value.rs"
#[derive(Clone, Copy, PartialEq)]
pub enum Value { Nil, Bool(bool), Number(f64), Obj(ObjRef) }

const _: () = assert!(std::mem::size_of::<Value>() == 16);

impl Value {
    pub fn is_falsey(self) -> bool { matches!(self, Value::Nil | Value::Bool(false)) }
    pub fn as_number(self) -> Option<f64> { if let Value::Number(n) = self { Some(n) } else { None } }
}
```
