[[sections]]
heading = "The execution model"
body = """
<p>A GPU runs thousands of lightweight threads. Threads are grouped into <b>warps</b> (NVIDIA, 32 lanes) or <b>wavefronts</b> (AMD, 32 or 64 lanes) that execute one instruction stream in lockstep: <b>SIMT</b>. Warps belong to <b>workgroups</b> (thread blocks) that share fast on-chip <b>shared memory</b> (AMD calls it LDS) and can synchronize with barriers.</p>

<p>When threads in a warp take different sides of a branch, the hardware runs both sides with lanes masked off, then <em>reconverges</em>. This is <b>divergence</b>, and it costs time proportional to the paths taken. Global memory accesses are fast when a warp's addresses are contiguous (<em>coalesced</em>) and slow when scattered.</p>

<p>Registers are divided among resident threads. Using more registers per thread means fewer warps fit on a core (<em>occupancy</em>), and fewer warps means less latency hiding. For a GPU register allocator, spilling is sometimes better than using more registers.</p>
"""

[[sections]]
heading = "Compiler pipelines"
body = """
<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Stack</th><th>Pipeline</th><th>Notes</th></tr></thead> <tbody> <tr><td>CUDA</td><td>CUDA C++ → NVVM (LLVM IR) → <b>PTX</b>, a virtual ISA → <code>ptxas</code> → SASS machine code</td><td>PTX is stable; SASS changes per architecture. The driver can JIT PTX</td></tr> <tr><td>AMD ROCm / HIP</td><td>HIP C++ → LLVM IR → AMDGPU backend → GCN / RDNA / CDNA ISA</td><td>The AMDGPU backend is open source in LLVM, which makes it the best one to read</td></tr> <tr><td>Vulkan, OpenCL</td><td>GLSL, HLSL or others → <b>SPIR-V</b>, a binary SSA IR with structured control flow → driver compiler</td><td>Like Wasm, SPIR-V requires structured merge blocks</td></tr> <tr><td>WebGPU</td><td>WGSL → browser translates to SPIR-V, MSL or HLSL</td><td>wgpu's <code>naga</code> (Rust) does these translations</td></tr> <tr><td>Apple Metal</td><td>MSL → AIR (LLVM-based) → GPU binary</td><td></td></tr> <tr><td>Rust on GPUs</td><td><code>rust-gpu</code> (Rust → SPIR-V), NVPTX target and <code>rust-cuda</code>, CubeCL (Rust kernels for CUDA, ROCm and WGPU)</td><td>A no_std subset of Rust</td></tr> </tbody> </table></div>

```rust title="A WGSL compute kernel, and translating it to SPIR-V and MSL with naga (API as of recent naga releases)"
const KERNEL: &str = r#"
@group(0) @binding(0) var<storage, read_write> data: array<f32>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id: vec3<u32>) {
    let i = id.x;
    if (i < arrayLength(&data)) {        // threads past the end diverge here
        data[i] = data[i] * 2.0;
    }
}
"#;

fn main() -> Result<(), Box<dyn std::error::Error>> {
    let module = naga::front::wgsl::parse_str(KERNEL)?;
    let info = naga::valid::Validator::new(
        naga::valid::ValidationFlags::all(),
        naga::valid::Capabilities::all(),
    ).validate(&module)?;                       // type checks and uniformity checks
    let spirv: Vec<u32> = naga::back::spv::write_vec(&module, &info, &Default::default(), None)?;
    println!("SPIR-V: {} words", spirv.len());
    // naga::back::msl / hlsl / glsl produce the other targets from the same IR.
    Ok(())
}
```
"""

[[sections]]
heading = "Divergence (uniformity) analysis"
body = """
<p>The compiler needs to know which values are the same across a warp (<em>uniform</em>) and which may differ (<em>divergent</em>). Uniform values can live in scalar registers, uniform branches need no masking, and barriers are only safe in uniform control flow. WGSL makes non-uniform barriers a compile error, which naga checks.</p>

<p>Divergence starts at thread IDs and at loads that depend on them. It spreads along data dependences, and along <em>sync dependences</em>: a value merged at the join point after a divergent branch is divergent even if each input was uniform, because different lanes took different edges. Values live out of a loop with a divergent exit are also divergent (temporal divergence).</p>

```rust title="A simplified divergence analysis on the block-parameter IR"
/// A value is divergent if lanes of one warp may disagree on it.
/// `is_source`: thread-ID builtins, atomics, loads from divergent addresses.
/// `ipdom`: immediate post-dominators, where a divergent branch reconverges.
pub fn divergent_values(f: &Function, is_source: impl Fn(Inst) -> bool, ipdom: &PostDomTree) -> HashSet<Value> {
    let mut div = HashSet::new();
    let mut work: Vec<Value> = f.all_insts().filter(|&i| is_source(i)).filter_map(|i| f.insts[i].result).collect();
    while let Some(v) = work.pop() {
        if !div.insert(v) { continue; }
        for u in f.users(v) {
            let d = &f.insts[u];
            if let Some(r) = d.result { work.push(r); }                 // data dependence
            if d.op == Opcode::Brif && d.args[0] == v {
                // Sync dependence: the parameters of the reconvergence block receive values
                // from different edges in different lanes.
                let join = ipdom.idom(f.inst_block(u));
                work.extend(f.blocks[join].params.iter().copied());
                // (A full analysis also marks params of blocks reached by disjoint paths
                // before the join, and values live out of loops with divergent exits.)
            }
        }
    }
    div
}
```
"""

[[sections]]
heading = "Tensor and array compilers"
body = """
<p>ML and image-processing compilers take a graph of array operations and produce fused, tiled, parallel kernels. The central idea, from <b>Halide</b>, is separating the <em>algorithm</em> (what to compute) from the <em>schedule</em> (loop order, tiling, vectorization, parallelism, where to store intermediates). You can then search over schedules without changing results.</p>

```text title="Halide: one algorithm, a hand-written schedule (from the Halide paper's blur example)"
Func blur_x, blur_y; Var x, y, xi, yi;

// Algorithm
blur_x(x, y) = (in(x - 1, y) + in(x, y) + in(x + 1, y)) / 3;
blur_y(x, y) = (blur_x(x, y - 1) + blur_x(x, y) + blur_x(x, y + 1)) / 3;

// Schedule: tile the output, vectorize and parallelize, compute blur_x per tile
blur_y.tile(x, y, xi, yi, 256, 32).vectorize(xi, 8).parallel(y);
blur_x.compute_at(blur_y, x).vectorize(x, 8);
```

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>System</th><th>Input</th><th>Key technique</th></tr></thead> <tbody> <tr><td>Halide</td><td>Image pipelines in a C++ DSL</td><td>Algorithm and schedule separated; autoschedulers</td></tr> <tr><td>TVM</td><td>Model graphs, tensor expressions</td><td>Schedules plus learned cost models to search them (AutoTVM, Ansor)</td></tr> <tr><td>XLA</td><td>HLO graphs from JAX and TensorFlow</td><td>Operator fusion, layout assignment, buffer planning</td></tr> <tr><td>Triton</td><td>Python kernels over blocks (tiles), not threads</td><td>The compiler handles intra-block layout, shared memory and tensor cores; TorchInductor generates Triton</td></tr> <tr><td>MLIR</td><td>Dialects: <code>linalg</code>, <code>affine</code>, <code>vector</code>, <code>gpu</code>, and others</td><td>Progressive lowering between abstraction levels; reusable passes</td></tr> <tr><td>Polyhedral tools</td><td>Affine loop nests</td><td>Pluto and Tensor Comprehensions: tiling and fusion as ILP (<a href="/cookbook/p/loop-optimization-and-vectorization">loops chapter</a>)</td></tr> </tbody> </table></div>
"""
