heading = "Overview"
body = """
<dl class="cb-g-gloss"> <dt>ABI</dt><dd>Application binary interface: calling convention, data layout and symbol naming at the machine level. <a href="/cookbook/p/abis-object-files-linking-and-unwinding">19</a></dd> <dt>Abstract interpretation</dt><dd>Running a program over an abstract domain that soundly over-approximates its concrete states. <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>ANF</dt><dd>A-normal form: every operand is a variable or constant; intermediate results are named with <code>let</code>. <a href="/cookbook/p/compiling-functional-languages">23</a></dd> <dt>Back edge</dt><dd>A CFG edge whose target dominates its source; each one defines a natural loop. <a href="/cookbook/p/dominators-loops-and-control-flow-structure">11</a></dd> <dt>Basic block</dt><dd>A straight-line sequence of instructions with one entry and one exit (the terminator). <a href="/cookbook/p/designing-an-ir-in-rust">9</a></dd> <dt>Bidirectional typing</dt><dd>Type checking split into checking and synthesis modes. <a href="/cookbook/p/bidirectional-typing-and-dependent-types">3</a></dd> <dt>Block parameters</dt><dd>SSA merge values passed as branch arguments instead of φ-nodes. <a href="/cookbook/p/designing-an-ir-in-rust">9</a></dd> <dt>Closure conversion</dt><dd>Making a function's captured variables an explicit environment argument. <a href="/cookbook/p/compiling-functional-languages">23</a></dd> <dt>Coalescing</dt><dd>Assigning a copy's source and destination the same register so the copy disappears. <a href="/cookbook/p/register-allocation">18</a></dd> <dt>Coherence</dt><dd>The rule that at most one impl applies to any type and trait; enforced by overlap and orphan checks. <a href="/cookbook/p/implementing-rust-s-hardest-features">15</a></dd> <dt>Congruence closure</dt><dd>The invariant that <code>a ≡ b</code> implies <code>f(a) ≡ f(b)</code>, maintained in e-graphs. <a href="/cookbook/p/e-graphs-and-equality-saturation">14</a></dd> <dt>CPS</dt><dd>Continuation-passing style: every function takes an explicit continuation instead of returning. <a href="/cookbook/p/compiling-functional-languages">23</a></dd> <dt>Critical edge</dt><dd>An edge from a block with several successors to a block with several predecessors. <a href="/cookbook/p/ssa-construction-and-destruction">12</a></dd> <dt>CST</dt><dd>Concrete (lossless) syntax tree, keeping every token including whitespace and errors. <a href="/cookbook/p/parsing-in-depth">5</a></dd> <dt>De Bruijn index</dt><dd>Representing a variable by the number of binders between its use and its binder. <a href="/cookbook/p/semantics-and-the-lambda-calculus">1</a></dd> <dt>Deoptimization</dt><dd>Transferring execution from optimized JIT code back to the interpreter when a speculation fails. <a href="/cookbook/p/jit-compilation">24</a></dd> <dt>Dependence distance</dt><dd>How many iterations separate two accesses to the same memory location in a loop. <a href="/cookbook/p/loop-optimization-and-vectorization">16</a></dd> <dt>Divergence</dt><dd>Lanes of one GPU warp taking different control paths or holding different values. <a href="/cookbook/p/gpu-and-accelerator-compilation">21</a></dd> <dt>Dominance frontier</dt><dd>The blocks where a block's dominance ends; the placement points for φ-nodes. <a href="/cookbook/p/dominators-loops-and-control-flow-structure">11</a></dd> <dt>Dominator</dt><dd><code>d</code> dominates <code>n</code> if every path from entry to <code>n</code> passes through <code>d</code>. <a href="/cookbook/p/dominators-loops-and-control-flow-structure">11</a></dd> <dt>DRF-SC</dt><dd>Data-race-free programs behave sequentially consistently. <a href="/cookbook/p/effects-async-and-memory-models">25</a></dd> <dt>E-graph</dt><dd>A data structure representing many equivalent expressions compactly as classes of nodes. <a href="/cookbook/p/e-graphs-and-equality-saturation">14</a></dd> <dt>Early cutoff</dt><dd>Stopping incremental recomputation when a recomputed result equals the old one. <a href="/cookbook/p/production-compiler-architecture">30</a></dd> <dt>Frame state</dt><dd>The mapping from optimized-code values to interpreter locals needed to deoptimize. <a href="/cookbook/p/jit-compilation">24</a></dd> <dt>Fuel (parser)</dt><dd>A counter that makes a parser panic in tests if it stops consuming tokens, instead of looping. <a href="/cookbook/p/fully-recoverable-parsers">6</a></dd> <dt>Generalization</dt><dd>Quantifying a type's free variables at <code>let</code> in HM. <a href="/cookbook/p/hindley-milner-type-inference">2</a></dd> <dt>Hygiene</dt><dd>Keeping macro-introduced names from capturing or being captured by user names. <a href="/cookbook/p/name-resolution-hygiene-and-modules">8</a></dd> <dt>Induction variable</dt><dd>A loop variable that changes by a fixed step each iteration: {start,+,step}. <a href="/cookbook/p/loop-optimization-and-vectorization">16</a></dd> <dt>Inline cache</dt><dd>A per-site cache of the last receiver shape and the resulting lookup. <a href="/cookbook/p/jit-compilation">24</a></dd> <dt>Landing pad</dt><dd>Code the unwinder jumps to in order to run cleanups or catch an exception. <a href="/cookbook/p/abis-object-files-linking-and-unwinding">19</a></dd> <dt>Lattice</dt><dd>A partial order with joins (and meets); the value space of a dataflow analysis. <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>Legalization</dt><dd>Rewriting operations and types the target doesn't support into ones it does. <a href="/cookbook/p/instruction-selection-scheduling-and-emission">17</a></dd> <dt>Linear memory</dt><dd>WebAssembly's bounds-checked byte array holding a module's data. <a href="/cookbook/p/webassembly-as-a-compilation-target">20</a></dd> <dt>Liveness</dt><dd>A value is live at a point if some path from there uses it before redefining it. <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>Loan</dt><dd>The borrow created by <code>&amp;x</code> or <code>&amp;mut x</code>, tracked by the borrow checker while its reference is live. <a href="/cookbook/p/implementing-rust-s-hardest-features">15</a></dd> <dt>MFP / MOP</dt><dd>Maximal fixed point (what the solver computes) vs meet over all paths (the ideal). <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>Monomorphization</dt><dd>Compiling a separate copy of generic code for each concrete type. <a href="/cookbook/p/designing-a-language">34</a></dd> <dt>NbE</dt><dd>Normalization by evaluation: evaluate into a semantic domain, then read back normal forms. <a href="/cookbook/p/bidirectional-typing-and-dependent-types">3</a></dd> <dt>Neutral term</dt><dd>A term whose evaluation is blocked by a free variable. <a href="/cookbook/p/bidirectional-typing-and-dependent-types">3</a></dd> <dt>OSR</dt><dd>On-stack replacement: switching a running frame between tiers. <a href="/cookbook/p/jit-compilation">24</a></dd> <dt>Poison</dt><dd>LLVM's value for “the result of an operation whose UB conditions were violated”. <a href="/cookbook/p/scalar-optimizations">13</a></dd> <dt>Primary label</dt><dd>The underlined span saying where an error is; secondary labels explain why. <a href="/cookbook/p/rust-quality-error-messages">7</a></dd> <dt>Progress and preservation</dt><dd>The two lemmas that make up syntactic type soundness. <a href="/cookbook/p/semantics-and-the-lambda-calculus">1</a></dd> <dt>Query system</dt><dd>A compiler organized as memoized functions with recorded dependencies. <a href="/cookbook/p/production-compiler-architecture">30</a></dd> <dt>Recovery set</dt><dd>Tokens belonging to enclosing rules, at which an inner rule stops instead of consuming. <a href="/cookbook/p/fully-recoverable-parsers">6</a></dd> <dt>Reducible CFG</dt><dd>One where every cycle has a single entry. <a href="/cookbook/p/dominators-loops-and-control-flow-structure">11</a></dd> <dt>Relocation</dt><dd>An instruction to the linker to patch an address into code or data. <a href="/cookbook/p/abis-object-files-linking-and-unwinding">19</a></dd> <dt>RPO</dt><dd>Reverse postorder: an ordering where (ignoring back edges) predecessors come first. <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>Safepoint</dt><dd>A program point where a thread can stop and have its roots enumerated. <a href="/cookbook/p/runtime-systems-and-gc-implementation">22</a></dd> <dt>Sealed block</dt><dd>In Braun's SSA construction, a block whose predecessors are all known. <a href="/cookbook/p/ssa-construction-and-destruction">12</a></dd> <dt>Shadow memory</dt><dd>Sanitizer metadata mapping each application byte range to validity or tag information. <a href="/cookbook/p/security-hardening-and-sanitizers">29</a></dd> <dt>Shape / hidden class</dt><dd>A shared layout descriptor for objects with the same properties. <a href="/cookbook/p/jit-compilation">24</a></dd> <dt>Simulation</dt><dd>A relation between source and target states preserved by steps; the core of compiler correctness proofs. <a href="/cookbook/p/formal-verification-and-mechanized-semantics">32</a></dd> <dt>Specialization (patterns)</dt><dd>Filtering a clause matrix to rows compatible with one constructor. <a href="/cookbook/p/pattern-matching-compilation-and-exhaustiveness">4</a></dd> <dt>SSA</dt><dd>Static single assignment: every variable has exactly one definition. <a href="/cookbook/p/ssa-construction-and-destruction">12</a></dd> <dt>Stack map</dt><dd>Compiler-emitted table of which stack slots and registers hold GC pointers at each safepoint. <a href="/cookbook/p/runtime-systems-and-gc-implementation">22</a></dd> <dt>Tiling</dt><dd>Splitting loops into cache-sized blocks so data is reused before eviction. <a href="/cookbook/p/loop-optimization-and-vectorization">16</a></dd> <dt>Tri-color invariant</dt><dd>No black object points to a white one; what incremental GC barriers preserve. <a href="/cookbook/p/runtime-systems-and-gc-implementation">22</a></dd> <dt>TyCtxt</dt><dd>rustc's central context; queries such as <code>type_of</code> are methods on it. <a href="/cookbook/p/reading-rustc-and-contributing-to-it">31</a></dd> <dt>Unification</dt><dd>Solving equality constraints between types (or terms) by substitution. <a href="/cookbook/p/hindley-milner-type-inference">2</a></dd> <dt>Usefulness</dt><dd>Whether a pattern matches some value that no earlier row matches. <a href="/cookbook/p/pattern-matching-compilation-and-exhaustiveness">4</a></dd> <dt>Variance</dt><dd>How subtyping of a type argument carries over to the generic type: co-, contra-, in-, or bivariant. <a href="/cookbook/p/implementing-rust-s-hardest-features">15</a></dd> <dt>Vtable</dt><dd>A per-type table of function pointers (plus drop, size, align) behind a trait object. <a href="/cookbook/p/implementing-rust-s-hardest-features">15</a></dd> <dt>Warmup</dt><dd>The period before a JIT-compiled program reaches steady-state performance. <a href="/cookbook/p/benchmarking-compilers">28</a></dd> <dt>Widening</dt><dd>An operator that forces convergence on infinite-height lattices. <a href="/cookbook/p/dataflow-analysis-and-abstract-interpretation">10</a></dd> <dt>Write barrier</dt><dd>Code run on pointer stores so the GC can track cross-generation or concurrent changes. <a href="/cookbook/p/runtime-systems-and-gc-implementation">22</a></dd> </dl>
"""
