[[sections]]
heading = "Design notes"
body = """
**The theory** (Martin-Lof style, deliberately small): terms and types are the **same** syntax. `(x : A) -> B` is the dependent function type (a Pi type: the result type may mention the argument, which is how `Vec A n` can say "n elements").

`Type : Type` keeps the rule set tiny but is **inconsistent** (Girard's paradox): fine for a teaching kernel, never for a real prover, which has a universe hierarchy `Type 0 : Type 1 : ...`. Nat has zero, suc and the eliminator `natrec` (induction principle **and** recursion). `Vec A n` is an indexed family with `nil`, `cons`, `vecrec`.

`Id A a b` is propositional equality with `refl` and the eliminator `J` (the induction principle of equality: to prove something about every `p : Id A a b` it is enough to prove it for `refl`).

All constants are **primitives** with their types written as ordinary source text and checked once; their computation rules live in one function (`reduce_elim`), so the checker has no special cases. **Why normalisation by evaluation**: type checking needs "are these two types equal up to computation?" (`Vec A (plus 2 3)` vs `Vec A 5`).

Substituting naively and reducing terms is slow and capture-prone. NbE instead **evaluates** a term into a semantic domain of host-language values (closures for lambdas, **neutrals** for stuck terms such as `natrec P z s n` with a variable `n`), compares values, and only reads back (`quote`) to syntax when printing.

Two index systems fall out naturally: terms use de Bruijn **indices** (distance to the binder: good for substitution and alpha-equivalence), values use de Bruijn **levels** (distance from the root: a variable keeps its name when it is moved under more binders, which is what makes weakening free). `quote` converts levels back to indices: `index = depth - level - 1`.

**Conversion** (definitional equality) compares values structurally and uses the **eta** rule for functions: `f` equals `\\x. f x`, checked by applying both sides to a fresh variable. It is symmetric and transitive because it equates normal forms; the tests check exactly that.

**Bidirectional elaboration**: `infer` returns a term and its type; `check` takes the expected type, which is what lets `\\x. e` omit its annotation.

**Holes**: `_` makes a **metavariable** solved by unification (so `cons Nat _ 1 xs` needs no length argument, and `cong suc _ _ ih` finds both sides from `ih`); `?name` is a **typed hole** that fails with the goal type and the context, the "what do I need here?" workflow of Agda/Lean.

Our metas are simple: a meta may be solved only by a term whose variables were all in scope where the meta was created (checked with levels) and that does not mention the meta (occurs check); metas are never applied to arguments, so there is no higher-order pattern unification (the elaboration-zoo covers that next).

**The examples**, all checked by the kernel here: plus, cong, sym, trans, transport (from J), vector append with the length index `Vec A (plus m n)`, vmap, associativity and commutativity of plus by induction (proof terms written out), plus 20 deliberately wrong programs.

**How rust differs**: Rust's const generics evaluate `N + 1` only for concrete literals; `Vec<T, N>` with N a variable and a proof that `N + M == M + N` is impossible without nightly `generic_const_exprs` precisely because the compiler has no normaliser for open terms. Everything here is the opposite design: types are values you can compute with.
"""

