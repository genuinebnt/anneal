[[sections]]
heading = "Design notes"
body = """
Stages (each is a plain function you can test alone):

```text
lex      text -> tokens                       parse     tokens -> `Expr` tree (Pratt precedence, see pratt_parser)
fold     `Expr` -> `Expr` (constant folding)  compile   `Expr` -> `Vec<Op>` by POST-ORDER traversal (operands first, then op)
```

run      a loop over `Op`s with a value stack; errors (stack underflow, divide by zero, unknown variable) are values, not panics Verification by **differential testing**: an obviously-correct tree-walking interpreter and the VM must agree on thousands of random programs, with and without the optimiser.

Study: <https://craftinginterpreters.com/a-virtual-machine.html> and <https://github.com/oxc-project/oxc/tree/main/crates/oxc_parser> and <https://github.com/bytecodealliance/wasmtime> (Cranelift IR)
"""

