[[sections]]
heading = "Design notes"
body = """
One function per grammar rule (`value`, `array`, `object`, `string`, `number`) over a byte cursor. Production concerns shown:

- errors carry a **BYTE position** (turn into line/col with diagnostics_spans)       &#42; escape sequences incl. &#92;uXXXX and surrogate pairs
- a **depth limit**: recursion on untrusted input must be bounded or `[[[[...` overflows the stack (see stage 8)
- reject trailing garbage, leading zeros, lone surrogates, control characters in strings Reference implementations: <https://github.com/serde-rs/json/blob/master/src/de.rs> and <https://www.json.org/>
"""

