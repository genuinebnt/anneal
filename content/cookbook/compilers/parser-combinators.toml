[[sections]]
heading = "Design notes"
body = """
Idea: a parser is `fn(&str) -> Option<(value, rest_of_input)>`. Tiny parsers (digits, a unit) combine with sequencing (`?` chains) and repetition (`many1`) into bigger ones. Errors: `None` = "does not match here".

This is exactly the model of the `nom` crate <https://github.com/rust-bakery/nom> and `winnow` <https://github.com/winnow-rs/winnow>  (read their docs after writing your own once).
"""

