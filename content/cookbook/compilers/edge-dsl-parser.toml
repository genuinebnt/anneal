[[sections]]
heading = "Design notes"
body = """
```text
Grammar (domain: a metro map, not tasks):   program := stmt*    stmt := name ("->" name)* (";" | newline | EOF)
```

Pipeline: text --lex--> Vec&lt;Token{kind, span}> --parse--> edges. Keeping the **span** on every token lets errors point at the exact bytes (see diagnostics_spans). Recursive descent = one function per grammar rule, a cursor over tokens.
"""

