body = """
<p class="cb-g-deep"><b>Deep dives</b> <a href="/cookbook/p/doing-pl-research">33 · PL research</a></p>

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Course</th><th>Covers</th><th>What to take from it</th></tr></thead> <tbody> <tr><td><a href="https://github.com/kaist-cp/cs420" target="_blank" rel="noreferrer">KAIST CS420</a> Compiler Design</td><td>A C compiler to RISC-V written in Rust (KECC): IR generation, mem2reg, GVN, DCE, simplify-cfg, assembly generation</td><td>The closest match to Part III's IR project, with tests in Rust. Taught by Jeehoon Kang</td></tr> <tr><td><a href="https://github.com/kaist-cp/cs431" target="_blank" rel="noreferrer">KAIST CS431</a> Concurrent Programming</td><td>Locks, lock-free data structures, memory models, hazard pointers, epoch-based reclamation</td><td>Rust assignments. The instructor maintains <code>crossbeam-epoch</code></td></tr> <tr><td><a href="https://github.com/kaist-cp/cs220" target="_blank" rel="noreferrer">KAIST CS220</a> Programming Principles</td><td>Functional programming and data structures in Rust</td><td>A warm-up for Rust's type system</td></tr> <tr><td><a href="https://ocw.mit.edu/courses/6-035-computer-language-engineering-spring-2010/" target="_blank" rel="noreferrer">MIT 6.035</a> Computer Language Engineering</td><td>A full compiler for Decaf: parsing, semantic checks, codegen, dataflow optimizations, register allocation</td><td>Lecture notes on dataflow and register allocation. The course is now numbered 6.1100</td></tr> <tr><td><a href="https://ocw.mit.edu/courses/6-172-performance-engineering-of-software-systems-fall-2018/" target="_blank" rel="noreferrer">MIT 6.172</a> Performance Engineering</td><td>Bit hacks, caches, vectorization, multicore with Cilk, profiling, memory allocators</td><td>Videos and problem sets that pair with the <a href="/cookbook/p/performance-data-layout-simd-threads-and-lock-free-structure">Performance</a> section</td></tr> <tr><td><a href="https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/" target="_blank" rel="noreferrer">MIT 6.004</a> Computation Structures</td><td>From gates to a pipelined processor, plus assembly</td><td>The hardware model a backend targets</td></tr> <tr><td><a href="https://www.cs.cornell.edu/courses/cs6120/2020fa/self-guided/" target="_blank" rel="noreferrer">Cornell CS 6120</a> Advanced Compilers</td><td>Bril IR, dataflow, SSA, loop optimizations, GC, dynamic compilation, reading papers</td><td>Self-guided, with videos. The best bridge from clox to optimizing compilers</td></tr> <tr><td><a href="https://web.stanford.edu/class/cs143/" target="_blank" rel="noreferrer">Stanford CS143</a> Compilers</td><td>The Cool language: lexing, parsing, semantic analysis, codegen, GC</td><td>Alex Aiken's lectures, available as free videos</td></tr> <tr><td><a href="https://stanford-cs242.github.io/f19/" target="_blank" rel="noreferrer">Stanford CS242</a> Programming Languages (2019)</td><td>Lambda calculus, type systems, Rust, WebAssembly</td><td>Type theory taught with Rust in mind</td></tr> <tr><td>CMU 15-411 Compiler Design</td><td>A compiler for C0 to x86-64, with SSA, register allocation and optimization labs</td><td>A demanding, lab-heavy course. Lecture notes are public</td></tr> <tr><td>CMU 15-745 Optimizing Compilers</td><td>Dataflow, SSA, loop transformations, scheduling, in LLVM</td><td>Detailed optimization lectures</td></tr> <tr><td><a href="https://15445.courses.cs.cmu.edu" target="_blank" rel="noreferrer">CMU 15-445</a> and <a href="https://15721.courses.cs.cmu.edu" target="_blank" rel="noreferrer">15-721</a> Databases</td><td>Storage, indexes, query execution, query optimization, concurrency control</td><td>Andy Pavlo's lectures are on YouTube. They support the SQL project</td></tr> <tr><td>CMU 15-418 Parallel Architecture and Programming</td><td>SIMD, GPUs, cache coherence, synchronization, lock-free structures</td><td>How the hardware behaves under concurrency</td></tr> <tr><td>UCSD CSE 131 Compiler Construction</td><td>A compiler grown one language version at a time, each adding a feature, in Rust</td><td>The same slice-by-slice approach as this guide</td></tr> <tr><td><a href="https://cs.au.dk/~amoeller/spa/" target="_blank" rel="noreferrer">Aarhus Static Program Analysis</a></td><td>Lattices, dataflow, interprocedural and pointer analysis, abstract interpretation</td><td>A free book with the course</td></tr> <tr><td><a href="https://www.nand2tetris.org" target="_blank" rel="noreferrer">Nand2Tetris</a></td><td>Gates, CPU, assembler, VM, compiler, OS</td><td>Fills in the bottom of the stack if hardware is unfamiliar</td></tr> </tbody> </table></div>
"""
