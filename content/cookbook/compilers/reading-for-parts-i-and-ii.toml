body = """
<ul class="cb-g-reading"> <li><a href="https://craftinginterpreters.com/contents.html" target="_blank" rel="noreferrer">Crafting Interpreters</a><span>The book: chapters 4–13 for jlox, 14–30 for clox</span></li> <li><a href="https://github.com/munificent/craftinginterpreters/tree/master/test" target="_blank" rel="noreferrer">Official Lox test suite</a><span>The <code>// expect:</code> files and <code>tool/bin/test.dart</code></span></li> <li><a href="https://oxc-project.github.io/javascript-parser-in-rust/" target="_blank" rel="noreferrer">Write a JavaScript Parser in Rust</a><span>oxc's tutorial: lexer, AST, parser, errors, performance</span></li> <li><a href="https://github.com/rust-lang/rust/tree/master/compiler/rustc_lexer" target="_blank" rel="noreferrer">rustc_lexer</a><span>A lexer that can't fail, with a <code>Cursor</code> API</span></li> <li><a href="https://rustc-dev-guide.rust-lang.org/tests/ui.html" target="_blank" rel="noreferrer">rustc UI tests</a><span>Annotated source files and blessed <code>.stderr</code> snapshots</span></li> <li><a href="https://github.com/swc-project/swc/tree/main/crates/swc_ecma_parser" target="_blank" rel="noreferrer">swc_ecma_parser</a><span>Iterator lexer, <code>Input</code> trait, fixture tests</span></li> <li><a href="https://matklad.github.io/2020/04/13/simple-but-powerful-pratt-parsing.html" target="_blank" rel="noreferrer">Simple but Powerful Pratt Parsing</a><span>The binding-power loop used above</span></li> <li><a href="https://matklad.github.io/2023/05/21/resilient-ll-parsing-tutorial.html" target="_blank" rel="noreferrer">Resilient LL Parsing Tutorial</a><span>Error recovery beyond <code>synchronize()</code></span></li> <li><a href="https://matklad.github.io/2020/03/22/fast-simple-rust-interner.html" target="_blank" rel="noreferrer">Fast and Simple Rust Interner</a><span>For when <code>Rc&lt;str&gt;</code> becomes the bottleneck</span></li> <li><a href="https://arzg.github.io/lang/" target="_blank" rel="noreferrer">Make A Language</a><span>The slice-at-a-time series this plan follows</span></li> <li><a href="https://insta.rs/docs/" target="_blank" rel="noreferrer">insta</a><span>Snapshot testing and <code>cargo insta review</code></span></li> <li><a href="https://github.com/rust-fuzz/cargo-fuzz" target="_blank" rel="noreferrer">cargo-fuzz</a><span>libFuzzer targets for the parser</span></li> <li><a href="https://craftinginterpreters.com/a-bytecode-virtual-machine.html" target="_blank" rel="noreferrer">Crafting Interpreters, Part III</a><span>Chapters 14–30, the clox VM</span></li> <li><a href="https://manishearth.github.io/blog/2021/04/05/a-tour-of-safe-tracing-gc-designs-in-rust/" target="_blank" rel="noreferrer">A Tour of Safe Tracing GC Designs in Rust</a><span>Handles, arenas and their trade-offs for C8</span></li> <li><a href="https://github.com/kyren/gc-arena" target="_blank" rel="noreferrer">gc-arena</a> <span>Safe GC arenas, used by the piccolo Lua VM</span></li> <li><a href="https://github.com/rust-lang/miri" target="_blank" rel="noreferrer">Miri</a><span>Catches undefined behavior if you use raw pointers</span></li> <li><a href="https://nnethercote.github.io/perf-book/" target="_blank" rel="noreferrer">The Rust Performance Book</a><span>Profiling, hashing and bounds checks for C10</span></li> </ul>
"""
