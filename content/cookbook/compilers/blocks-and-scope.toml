```rust title="src/env.rs, src/interp.rs"
pub type EnvRef = Rc<RefCell<Env>>;

pub struct Env {
    values: HashMap<Rc<str>, Value>,
    parent: Option<EnvRef>,
}

fn exec_block(&mut self, stmts: &[Stmt], env: EnvRef) -> Exec {
    let prev = std::mem::replace(&mut self.env, env);
    let result = stmts.iter().try_for_each(|s| self.exec(s));
    self.env = prev;                 // restored on error and on return
    result
}
```

<p>Use <code>Rc&lt;RefCell&lt;Env&gt;&gt;</code> now, even though blocks alone could get by with a <code>Vec</code> of scopes. Closures in slice 6 have to keep an environment alive after its block exits.</p>

<p>Don't return with <code>?</code> between the swap and the restore. If you do, an error leaves the interpreter in the inner scope, and the next REPL line runs there.</p>
