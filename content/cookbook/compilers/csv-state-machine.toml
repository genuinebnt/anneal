[[sections]]
heading = "Common uses"
body = """
CSV/TSV ingestion, any format where quoting/escaping changes the meaning of characters.
"""

[[sections]]
heading = "Design notes"
body = """
When "what does this character mean?" depends on what came before, model the parser as states + transitions (state_machine, generic_state_machine). Here: inside/outside quotes changes what a comma, a newline, and a quote mean. One pass, O(n), no backtracking, and every (state, char) pair is handled in **one** exhaustive `match`, so no case is forgotten.

The streaming-friendly structure also lets you feed chunks of input. Production-grade: <https://github.com/BurntSushi/rust-csv> (read how it uses a DFA for speed).
"""

