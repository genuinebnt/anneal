[[sections]]
heading = "Design notes"
body = """
This parser reads a **small subset** of JavaScript and refuses everything else: top-level `const` and expression statements, each ending in `;`, with names, plain numbers, quoted strings, `.name`, calls, `+`, arrays and object literals. No functions, blocks, other operators, regular expressions or template strings.

Refusing is the point: a reader that guesses reports things that are not there. It lists calls SPELLED `fetch(…)`, which is not the list of requests a script makes: finding none proves nothing. For real JavaScript use a full parser such as `oxc_parser`, `swc_ecma_parser` or tree-sitter.
"""

