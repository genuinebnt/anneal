```rust title="src/value.rs"
pub struct Class {
    pub name: Rc<str>,
    pub superclass: Option<Rc<Class>>,
    pub methods: HashMap<Rc<str>, Rc<Function>>,
}

pub struct Instance {
    pub class: Rc<Class>,
    pub fields: RefCell<HashMap<Rc<str>, Value>>,
}

pub enum Value {
    Nil, Bool(bool), Number(f64), Str(Rc<str>),
    Native(Rc<Native>), Function(Rc<Function>),
    Class(Rc<Class>), Instance(Rc<Instance>),
}
```

<p>To bind a method, create a new <code>Env</code> whose parent is the method's closure, define <code>this</code> in it, and return a new <code>Function</code>. That's why <code>a.f</code> keeps working after you store it in a variable. The resolver pushes matching <code>this</code> and <code>super</code> scopes, so the depths line up.</p>

<p>Instances compare by identity, so use <code>Rc::ptr_eq</code>.</p>
