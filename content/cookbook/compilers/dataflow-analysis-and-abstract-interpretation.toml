[[sections]]
heading = "Overview"
body = """
<p>A dataflow analysis computes a fact at every program point. The ingredients:</p>

<ul> <li>A <b>lattice</b> of facts, with a partial order ⊑, a join ⊔ and a bottom ⊥.</li> <li>A <b>transfer function</b> per block or instruction, which must be <em>monotone</em>: more input information never produces less output.</li> <li>A <b>direction</b>, forward or backward.</li> </ul>

<p>Starting from ⊥ everywhere and applying transfer functions until nothing changes reaches the least fixed point. This terminates if the lattice has finite height. The result is the <em>maximal fixed point</em> (MFP) solution. The ideal answer is the <em>meet over all paths</em> (MOP). MFP equals MOP when the transfer functions are distributive (Kam–Ullman), as bit-vector problems are. Constant propagation isn't distributive, so MFP is a safe approximation of MOP.</p>

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Analysis</th><th>Direction</th><th>Fact</th><th>Join</th><th>Used for</th></tr></thead> <tbody> <tr><td>Liveness</td><td>backward</td><td>set of values live</td><td>∪</td><td>register allocation, dead store elimination</td></tr> <tr><td>Reaching definitions</td><td>forward</td><td>set of defs</td><td>∪</td><td>use-def chains without SSA</td></tr> <tr><td>Available expressions</td><td>forward</td><td>set of exprs</td><td>∩</td><td>CSE, PRE</td></tr> <tr><td>Very busy expressions</td><td>backward</td><td>set of exprs</td><td>∩</td><td>code hoisting</td></tr> <tr><td>Constant propagation</td><td>forward</td><td>var → ⊤ | const | ⊥</td><td>pointwise</td><td>folding, branch elimination</td></tr> <tr><td>Definite initialization</td><td>forward</td><td>set of initialized vars</td><td>∩</td><td>“use of possibly uninitialized” errors</td></tr> <tr><td>Borrows in scope (rustc)</td><td>forward</td><td>set of loans</td><td>∪</td><td>borrow checking</td></tr> </tbody> </table></div>

```rust title="A generic worklist solver"
use std::collections::VecDeque;

pub trait JoinSemiLattice: Clone + PartialEq {
    fn join(&self, other: &Self) -> Self;
}

pub trait Analysis {
    type Fact: JoinSemiLattice;
    const FORWARD: bool;
    fn bottom(&self) -> Self::Fact;
    /// Fact at the entry block's start (forward) or at exit blocks' end (backward).
    fn boundary(&self) -> Self::Fact;
    fn transfer(&self, b: Block, input: &Self::Fact) -> Self::Fact;
}

/// Returns the fact flowing *into* each block (at its start for forward
/// analyses, at its end for backward ones).
pub fn solve<A: Analysis>(cfg: &Cfg, a: &A) -> Vec<A::Fact> {
    let n = cfg.num_blocks();
    let mut input = vec![a.bottom(); n];
    let mut output = vec![a.bottom(); n];
    // RPO for forward problems (predecessors first), postorder for backward ones.
    let order = if A::FORWARD { cfg.reverse_postorder() } else { cfg.postorder() };
    let mut work: VecDeque<Block> = order.into_iter().collect();
    let mut queued = vec![true; n];

    while let Some(b) = work.pop_front() {
        queued[b.index()] = false;
        let (ins, outs) = if A::FORWARD { (cfg.preds(b), cfg.succs(b)) } else { (cfg.succs(b), cfg.preds(b)) };
        let at_boundary = if A::FORWARD { b == cfg.entry() } else { cfg.succs(b).is_empty() };
        let mut inp = if at_boundary { a.boundary() } else { a.bottom() };
        for p in ins { inp = inp.join(&output[p.index()]); }
        let out = a.transfer(b, &inp);
        input[b.index()] = inp;
        if out != output[b.index()] {
            output[b.index()] = out;
            for s in outs {
                if !queued[s.index()] { queued[s.index()] = true; work.push_back(s); }
            }
        }
    }
    input
}
```

```rust title="Liveness as an instance (bitsets from the fixedbitset crate)"
use fixedbitset::FixedBitSet;

impl JoinSemiLattice for FixedBitSet {
    fn join(&self, o: &Self) -> Self { let mut r = self.clone(); r.union_with(o); r }
}

pub struct Liveness<'f> { pub f: &'f Function }

impl Analysis for Liveness<'_> {
    type Fact = FixedBitSet;
    const FORWARD: bool = false;
    fn bottom(&self) -> FixedBitSet { FixedBitSet::with_capacity(self.f.values.len()) }
    fn boundary(&self) -> FixedBitSet { self.bottom() }            // nothing live after return
    fn transfer(&self, b: Block, live_out: &FixedBitSet) -> FixedBitSet {
        let mut live = live_out.clone();
        for &i in self.f.blocks[b].insts.iter().rev() {
            let d = &self.f.insts[i];
            if let Some(r) = d.result { live.set(r.index(), false); }          // kill the def
            for v in d.args.iter().chain(d.targets.iter().flat_map(|t| &t.args)) {
                live.insert(v.index());                                       // gen each use
            }
        }
        for p in &self.f.blocks[b].params { live.set(p.index(), false); }    // params are defs
        live
    }
}
```
