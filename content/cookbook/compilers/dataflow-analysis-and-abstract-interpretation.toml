[[sections]]
heading = "Abstract interpretation"
body = """
<p>Abstract interpretation (Cousot and Cousot) generalizes dataflow analysis. Run the program on an <em>abstract domain</em> that over-approximates sets of concrete states. A Galois connection between concrete and abstract states makes soundness a theorem. Domains trade precision for cost:</p>

<ul> <li>Signs and constants: cheap, finite height.</li> <li>Intervals: infinite height, so they need widening.</li> <li>Octagons (<code>±x ± y ≤ c</code>): cubic.</li> <li>Polyhedra: exponential in the worst case.</li> </ul>

<p>For infinite-height domains, <b>widening</b> (∇) forces convergence by jumping to a bound, usually infinity. <b>Narrowing</b> (Δ) then recovers some precision. For <code>i = 0; while (i &lt; 100) i = i + 1;</code>, the loop head's interval grows [0,0], [0,1], [0,2], and so on. Widening jumps it to [0,+∞]. Narrowing with the guard <code>i &lt; 100</code> gives [0,100] at the exit.</p>

```rust title="Interval domain with widening"
/// Bounds use i64::MIN / i64::MAX as −∞ / +∞. (Production code uses an explicit
/// infinity type so that arithmetic on infinities stays exact.)
#[derive(Clone, Copy, PartialEq, Debug)]
pub enum Itv { Bot, Range(i64, i64) }

impl Itv {
    pub fn join(self, o: Itv) -> Itv {
        match (self, o) {
            (Itv::Bot, x) | (x, Itv::Bot) => x,
            (Itv::Range(a, b), Itv::Range(c, d)) => Itv::Range(a.min(c), b.max(d)),
        }
    }
    /// Any bound that grew goes straight to infinity, so ascending chains stop.
    pub fn widen(self, next: Itv) -> Itv {
        match (self, next) {
            (Itv::Bot, x) | (x, Itv::Bot) => x,
            (Itv::Range(a, b), Itv::Range(c, d)) => Itv::Range(
                if c < a { i64::MIN } else { a },
                if d > b { i64::MAX } else { b },
            ),
        }
    }
    /// Refine with a branch condition `x < k` on the true edge.
    pub fn assume_lt(self, k: i64) -> Itv {
        match self {
            Itv::Range(a, b) if a < k => Itv::Range(a, b.min(k - 1)),
            _ => Itv::Bot,                                  // branch is unreachable
        }
    }
    pub fn add(self, o: Itv) -> Itv {
        match (self, o) {
            (Itv::Range(a, b), Itv::Range(c, d)) => Itv::Range(a.saturating_add(c), b.saturating_add(d)),
            _ => Itv::Bot,
        }
    }
}
```

<div class="cb-g-tip"><h3>Interprocedural analysis</h3> <p>There are three main approaches. <em>Inline</em> callees: exact, but it blows up. <em>Summaries</em>: analyze each function once into a transfer function over its parameters, bottom-up over the call graph's SCCs. <em>Context sensitivity</em>: analyze a function separately per call string (k-CFA) or per receiver object (object sensitivity). IFDS (Reps, Horwitz, Sagiv) solves distributive interprocedural problems exactly as graph reachability over an “exploded supergraph”, in O(ED³). Taint analyzers use it.</p></div>

<div class="cb-g-tip"><h3>Pointer and alias analysis</h3> <p>Andersen's analysis is inclusion-based: <code>p = &amp;x</code> gives <code>{x} ⊆ pts(p)</code>, and <code>p = q</code> gives <code>pts(q) ⊆ pts(p)</code>. It's cubic, and it scales with online cycle elimination (Hardekopf–Lin). Steensgaard's analysis is unification-based. It is almost linear, using union-find, and less precise. Rust's reference types give the compiler aliasing facts for free: <code>&amp;mut T</code> becomes LLVM <code>noalias</code>.</p></div>

<div class="cb-g-tip"><h3>Datalog as an analysis language</h3> <p>Many analyses are a few Datalog rules. <code>pts(P, O) :- alloc(P, O).</code> and <code>pts(P, O) :- assign(P, Q), pts(Q, O).</code> A Datalog engine does the fixpoint with semi-naive evaluation and indexes. Doop (Java points-to in Soufflé), CodeQL and Polonius (Rust's next borrow checker, using <code>datafrog</code>) work this way. In Rust, <code>ascent</code> and <code>crepe</code> embed Datalog as macros.</p></div>
"""

