[[sections]]
heading = "Design notes"
body = """
**The idea**. `(perform op v)` says **what** is wanted and nothing about how. `(handle body (return x e) (op p k e') ...)` gives the meaning: when `body` performs `op`, the clause runs with the argument `p` and the continuation `k`: the rest of `body` UP TO this handler (a **delimited** continuation).

The clause may ignore `k` (exceptions), call it once (state, generators, async) or many times (nondeterminism). Handlers here are **deep**: calling `k` puts the same handler back around the resumed code. An op the handler does not mention passes through to the next one out.

**Three implementations** of that one definition, compared on 500 random programs (result, printed output and errors): (a) CPS + METACONTINUATION. The continuation `k` is a Rust closure that runs "to the end of the current handler"; a separate linked list holds one frame per handler with the continuation outside it.

`perform` cuts that list at the handling frame; resuming pushes the cut piece onto the caller's list. Everything is trampolined. (b) **free monad**, in direct Rust.

Evaluation returns a **data** description: `Pure(v)` or `Op(name, arg, rest)`. `bind` appends to `rest`; a handler is a fold over this tree. Shortest to write.

It recurses on the host stack, and each `perform` is re-wrapped by every enclosing `bind`, so deeply left-nested code is quadratic. (c) **stack machine**. The continuation is an explicit `Vec<Frame>`.

A handler is a marker frame; `perform` splits the vector at the marker and the cut-off segment IS the continuation. Multi-shot: copy the segment on each resume. **One-shot** mode moves it instead and rejects a second resume.

The machine also reports an op nobody handles to the **host** as a suspension that Rust code can keep, copy and resume. **What rust can and cannot do** (last section). An `async fn` is compiled to a state machine, and `.await` is a suspension point; the executor is a handler that resumes it.

A future is one-shot: it is polled through `Pin<&mut Self>`, resumes by mutating itself, and in general is not `Clone`, so you cannot run "the rest of the function" twice. Nondeterminism by resuming twice is therefore not expressible with `.await`. The yield point is also fixed in the type: only the executor that polls the future "handles" it.
"""

