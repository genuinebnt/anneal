body = """
<ul class="cb-g-uses"><li>DSL/config lexers</li><li>query parsers</li><li>log parsers: tokens that borrow from the input allocate nothing</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: `Token<'a>` holds `&'a str` slices of the source, so lexing allocates nothing per token. The lexer is an `Iterator`, so you get map/filter/collect for free. Study real parsers: <https://github.com/oxc-project/oxc/tree/main/crates/oxc_parser>
"""

