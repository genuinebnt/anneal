[[sections]]
heading = "Design notes"
body = """
This is a teaching subset of the tokenizer in the HTML standard. It **reads** pages. It is not a sanitizer: never use it to decide what a browser may show.

It builds no tree, knows five named character references, refuses `<svg>`, `<math>` and `<!--` inside a script, and treats `<noscript>` as ordinary markup (a browser with scripts on does not).

In a browser, tree construction decides whether `<title>`, `<textarea>`, `<iframe>`, `<plaintext>`, `<style>`, `<script>`, `<xmp>`, `<noembed>` or `<noframes>` turns what follows into text. This reader always does, so a page can be written to **HIDE real links** from it: "no link found" proves nothing. For real pages use a full parser (html5ever).
"""

