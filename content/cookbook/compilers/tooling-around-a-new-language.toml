body = """
<p class="cb-g-deep"><b>Deep dives</b> <a href="/cookbook/p/parsing-in-depth">5 · Parsing in depth</a> <a href="/cookbook/p/production-compiler-architecture">30 · Production architecture</a> <a href="/cookbook/p/tooling-in-code">35 · Tooling in code</a> <a href="/cookbook/p/fully-recoverable-parsers">6 · Recoverable parsers</a> <a href="/cookbook/p/rust-quality-error-messages">7 · Error messages</a> <a href="/cookbook/p/benchmarking-compilers">28 · Benchmarking compilers</a> <a href="/cookbook/p/security-hardening-and-sanitizers">29 · Security and sanitizers</a> <a href="/cookbook/p/reading-rustc-and-contributing-to-it">31 · Contributing to rustc</a></p>

<div class="cb-g-hub"> <div class="cb-g-core"><b>Shared core</b><span>lexer → lossless CST with error nodes → semantic model (names, types) as salsa queries → line index (UTF-8 and UTF-16)</span></div> <ul> <li>compiler</li><li>linter</li><li>LSP server</li><li>formatter</li><li>highlighter</li><li>debugger</li><li>static analyzer</li><li>doc generator</li> </ul> </div>

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Tool</th><th>Core technique</th><th>Rust building blocks</th><th>How to test it</th></tr></thead> <tbody> <tr><td>Syntax analyzer and linter</td><td>Lossless CST, rules as visitors, fixes as text edits</td><td><code>rowan</code>, <code>logos</code>. Read oxlint, ruff and Biome</td><td>Snapshot the diagnostics and the fixed output for each rule</td></tr> <tr><td>LSP server</td><td>JSON-RPC over stdio, incremental queries, cancellation</td><td><code>lsp-server</code>, <code>tower-lsp</code>, <code>lsp-types</code>, <code>salsa</code></td><td>Fixtures with a <code>$0</code> cursor marker, snapshotted responses</td></tr> <tr><td>Formatter</td><td>Document IR with Wadler or Oppen layout; comments kept as trivia</td><td><code>pretty</code>, or your own doc IR</td><td>Golden files, an idempotence property, and an AST-equivalence property</td></tr> <tr><td>Debugger</td><td>VM hooks for breakpoints and stepping, the Debug Adapter Protocol, DWARF for native code</td><td><code>gimli</code> (reads and writes DWARF), <code>object</code></td><td>Scripted DAP sessions with an expected sequence of stops</td></tr> <tr><td>Static analysis</td><td>Dataflow over a CFG, abstract interpretation, taint tracking, Datalog queries</td><td><code>petgraph</code>, bitsets, <code>datafrog</code></td><td>Annotated source files that mark expected findings, as rustc's UI tests do</td></tr> <tr><td>Vulnerability checking</td><td>Advisory databases, lockfile scanning, fuzzing, sanitizers</td><td><code>cargo-audit</code>, <code>cargo-deny</code>, <code>cargo-vet</code>, <code>cargo-fuzz</code></td><td>Run in CI on every lockfile change, plus continuous fuzzing</td></tr> <tr><td>Race detection</td><td>Vector clocks (happens-before), locksets, systematic schedule exploration</td><td><code>loom</code>, <code>shuttle</code>, Miri, TSan</td><td>Known-racy and known-safe programs as golden cases</td></tr> <tr><td>Syntax highlighting</td><td>TextMate regex grammars, tree-sitter queries, LSP semantic tokens</td><td><code>tree-sitter</code>, <code>syntect</code>, highlight.js grammars</td><td>tree-sitter corpus tests and highlight assertion tests</td></tr> </tbody> </table></div>

<div class="cb-g-tip"><h3>Syntax analyzer and linter <span class="cb-g-src"><span>oxlint</span><span>ruff</span><span>Biome</span><span>clippy</span></span></h3> <p>Use one parser for everything. It has to accept broken code, keep comments and whitespace, and report errors as nodes rather than stopping. Write lint rules as visitors over the CST, or over a typed AST view of it. Each diagnostic carries a span, a severity, a stable rule code (<code>lox::unused-variable</code>), and optionally a fix: a list of text edits labeled “safe” or “unsafe”. Syntactic rules run on the CST. Semantic rules such as unused variables, shadowing and unreachable code run on the resolver's output. Clippy's lints go further and use HIR and types.</p> <p>Tests: for each rule, a file of cases that must be flagged and cases that must not, with the diagnostics and the post-fix source as snapshots. Also check that applying every safe fix leaves code that still parses and still passes your golden tests.</p></div>

<div class="cb-g-tip"><h3>Language server (LSP) <span class="cb-g-src"><span>rust-analyzer</span></span></h3> <p>The server speaks JSON-RPC over stdio. Start with <code>textDocument/publishDiagnostics</code>, then add hover, go-to-definition, find references, document symbols, completion, rename, semantic tokens, inlay hints, code actions and formatting. Keep open files in a virtual file system and recompute through salsa queries, so a keystroke recomputes only what depends on the edited file. Cancel stale requests when a new edit arrives.</p> <p><b>Gotcha:</b> LSP positions are line plus UTF-16 code unit by default. Negotiate <code>positionEncoding: "utf-8"</code> (LSP 3.17) when the client supports it, and convert through your <code>LineIndex</code> otherwise. A mismatch here shifts every position after an emoji or a non-ASCII character.</p> <p>Tests: rust-analyzer's fixture style. Write source with a <code>$0</code> cursor marker, run the request in process without JSON, and snapshot the result.</p></div>

```rust title="goto-definition fixture"
#[test]
fn goto_local() {
    check_goto(r#"
var count = 1;
{ print cou$0nt; }
"#, expect![["count: line 1, col 5"]]);   // expect-test style inline snapshot
}
```

<div class="cb-g-tip"><h3>Code formatter <span class="cb-g-src"><span>rustfmt</span><span>prettier</span><span>gofmt</span></span></h3> <p>Convert the CST into a document IR of text, line breaks, groups and indentation, then run a layout algorithm. Wadler's “prettier printer”, or Oppen's streaming algorithm, tries each group on one line and breaks it only if it doesn't fit the width. Comments are the hard part. Attach them to tokens as leading or trailing trivia so no layout choice can drop them. Decide early how much configuration to allow. gofmt, Black and Biome show that having almost none avoids arguments about style.</p> <p>Tests: golden input and output files, plus two property tests over your entire test corpus and fuzzed programs:</p> <ul> <li>Idempotence: <code>fmt(fmt(x)) == fmt(x)</code>.</li> <li>Semantic equivalence: <code>parse(x)</code> and <code>parse(fmt(x))</code> have the same AST once spans are ignored.</li> </ul></div>

<div class="cb-g-tip"><h3>Debugger</h3> <p><b>For your VM:</b> you already have a line per op in <code>Chunk.lines</code>. Add a debug hook to the dispatch loop that checks a breakpoint set when the line changes. Implement step-in, step-over and step-out by comparing frame depth. Expose locals from the compiler's local slot names, saved into the function object. Then implement the Debug Adapter Protocol, which is JSON over stdio like LSP, so VS Code, Neovim and Zed can step through Lox.</p> <p><b>For native code:</b> emit DWARF. That means line tables, variable locations, type descriptions, and call frame information for unwinding. <code>gimli</code> writes it, and Cranelift can produce it. Then gdb and lldb work unchanged. For bugs you can't reproduce, record-and-replay debugging with <code>rr</code> lets you step backwards through an execution.</p> <p>Tests: scripted DAP sessions (set a breakpoint, continue, step, read variables) with the expected sequence of stops and variable values as a snapshot.</p></div>

<div class="cb-g-tip"><h3>Static analysis <span class="cb-g-src"><span>CodeQL</span><span>Semgrep</span><span>Infer</span><span>Kani</span></span></h3> <p>These range from simple to deep:</p> <ul> <li>Structural pattern search over the CST, as in Semgrep.</li> <li>Intraprocedural dataflow: uninitialized reads, dead stores, nil dereference, “this branch is always taken”.</li> <li>Taint analysis from sources to sinks, such as user input reaching <code>eval</code> or a shell command.</li> <li>Abstract interpretation over value ranges.</li> <li>Datalog-based whole-program analysis: CodeQL stores code as a database and runs queries over it.</li> <li>Separation logic: Infer's bi-abduction.</li> </ul> <p>At the formal end are symbolic execution (KLEE), bounded model checking (Kani, for Rust), and deductive verifiers (Prusti, Creusot, Verus). Report findings in SARIF so GitHub and editors can display them.</p></div>

<div class="cb-g-tip"><h3>Vulnerability checkers and supply chain</h3> <p><b>Dependencies:</b> an advisory database (RustSec, which is published in the OSV format) checked against the lockfile by <code>cargo-audit</code> or <code>osv-scanner</code>. <code>cargo-deny</code> also enforces licenses, banned crates and allowed sources. <code>cargo-vet</code> and <code>cargo-crev</code> record who audited which dependency. SBOMs in CycloneDX or SPDX format list what ships. <b>Code:</b> continuous fuzzing (cargo-fuzz, AFL++, OSS-Fuzz), sanitizers (<code>-Zsanitizer=address</code>, <code>memory</code>, <code>thread</code>), and <code>cargo-geiger</code> to count <code>unsafe</code>.</p> <p>If your language gets a package manager, design for this from day one: lockfiles with checksums, advisories in OSV format, and reproducible builds. Consider capability-based or Wasm-sandboxed execution of build scripts.</p></div>

<div class="cb-g-tip"><h3>Race condition checking</h3> <p><b>Dynamic, happens-before:</b> vector clocks per thread and per variable, which flag two conflicting accesses with no ordering between them. FastTrack reduces most clocks to a single epoch. ThreadSanitizer and Miri's race detector work this way. <b>Lockset (Eraser):</b> flags variables that aren't consistently protected by the same lock. It's fast, but it reports some false positives. <b>Systematic exploration:</b> <code>loom</code> enumerates interleavings with dynamic partial-order reduction. <code>shuttle</code> samples schedules randomly with PCT. <b>Static:</b> Rust's <code>Send</code> and <code>Sync</code> rule out data races by construction, and RacerD (Infer) finds them in Java. <b>Deadlocks:</b> cycles in the lock-order graph, which <code>parking_lot</code>'s <code>deadlock_detection</code> feature checks. <b>Distributed systems:</b> deterministic simulation testing, as in FoundationDB and TigerBeetle, or <code>madsim</code> and <code>turmoil</code> in Rust.</p> <p>If you add threads to Lox, build a vector-clock race detector into the clox VM. Every <code>GetProperty</code> and <code>SetProperty</code> is an access event, and every lock or join is a synchronization edge. It's a good exercise, and it's how TSan works.</p></div>

<div class="cb-g-tip"><h3>Syntax highlighting</h3> <p>There are three levels:</p> <ul> <li><b>TextMate grammars</b> are regex-based and used by VS Code, Sublime, and <code>syntect</code> (which <code>bat</code> uses). They're quick to write but they can't see structure.</li> <li><b>Tree-sitter grammars</b> are incremental GLR parsers with <code>highlights.scm</code> query files. Neovim, Helix, Zed and GitHub's code navigation use them.</li> <li><b>LSP semantic tokens</b> are type-aware. rust-analyzer uses them to mark mutable variables and unsafe calls.</li> </ul> <p>For the web, write a highlight.js or Prism grammar. This page registers a small Lox grammar for highlight.js.</p> <p>Tests: <code>tree-sitter test</code> runs corpus files (input followed by the expected S-expression, a golden format again), and highlight tests assert the capture name under each marked token.</p></div>

<div class="cb-g-tt"><table class="cb-g-map"> <thead><tr><th>Also needed</th><th>What people expect</th></tr></thead> <tbody> <tr><td>REPL</td><td>Multi-line input, history (<code>rustyline</code> or <code>reedline</code>), and <code>:type</code> and <code>:dis</code> commands</td></tr> <tr><td>Package manager</td><td>Manifest, lockfile, registry, version resolution (PubGrub), workspaces</td></tr> <tr><td>Test runner</td><td>A built-in <code>test</code> keyword or attribute, with golden and snapshot support</td></tr> <tr><td>Doc generator</td><td>Doc comments rendered to HTML, with runnable examples checked like doctests</td></tr> <tr><td>Playground</td><td>The compiler built to Wasm, running in the browser with shareable links</td></tr> <tr><td>Editor extension</td><td>A VS Code extension that bundles the TextMate grammar, the LSP client and the DAP adapter</td></tr> </tbody> </table></div>

<p><b>Build it, in order:</b></p>

<ol> <li>A tree-sitter grammar for Lox with corpus tests and <code>highlights.scm</code>.</li> <li>A <code>lox fmt</code> command with the idempotence and AST-equivalence properties.</li> <li>An LSP server with diagnostics, go-to-definition and rename.</li> <li>A DAP adapter for clox with breakpoints and stepping.</li> <li>Two dataflow lints, unused variable and uninitialized read, with autofixes.</li> <li>Package all of it as one VS Code extension.</li> </ol>
"""
