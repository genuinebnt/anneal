[[sections]]
heading = "Design notes"
body = """
Reads and writes version 3 source maps: the base64 VLQ numbers, the `mappings` string and the lookup. A map from a stranger is hostile input, so every number, index and size is checked. It is stricter than the standard in places (it refuses where a browser may carry on), does not read index maps (`sections`), and never opens or downloads anything a map names.
"""

