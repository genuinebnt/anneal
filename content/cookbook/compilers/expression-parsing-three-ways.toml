[[sections]]
heading = "What it is"
body = """
a rich expression language: integers, variables, `+ - * / %`, `**` (right assoc), `== != < <= > >=` (**non**-associative), `&& ||`, prefix `- !`, ternary `c ? a : b` (right assoc), calls `f(a, b)`, indexing `a[i]`, member access `a.b`. The same token stream is parsed by four algorithms and the ASTs are compared as fully parenthesised strings.

**Grammar** (lowest to highest precedence; this is what recursive descent mirrors, one function per line):

```text
expr    := or ( '?' expr ':' expr )?                  -- right assoc: the else branch recurses into the same rule
or      := and ( '||' and )*     and := cmp ( '&&' cmp )*
cmp     := add ( CMPOP add )?                         -- `?` not `*`: `a < b < c` is rejected with a clear error
add     := mul ( ('+'|'-') mul )*    mul := unary ( ('*'|'/'|'%') unary )*
unary   := ('-'|'!') unary | power                    -- so `-2 ** 2` is -(2 ** 2), as in Python/maths
power   := postfix ( '**' unary )?                    -- right operand is `unary`: `2 ** -1` works and `a ** b ** c` is right assoc
postfix := primary ( '(' args ')' | '[' expr ']' | '.' ID )*      primary := NUM | ID | '(' expr ')'
```

**Left recursion**: the natural rule `add := add '+' mul | mul` recurses forever in a top-down parser. Rewrite as `mul ('+' mul)*` and build the tree **inside** the loop (`lhs = Bin(lhs, rhs)`), which keeps left associativity. **Right** associativity needs no loop, just recursion on the right operand.

Non-associative operators take `?` and then look for a second operator to reject it.

**The four methods**: (a) recursive descent: one function per level, easiest to read and to give good errors, but adding an operator means a new function; (b) precedence climbing: one function plus a table `(prec, assoc)`, the min-precedence argument replaces the per-level functions; (c) Pratt: binding powers (left, right) per operator, prefix/postfix/mixfix (ternary) are first class; (d) shunting-yard: an explicit operator stack that emits RPN.

It has NO recursion at all, so depth is unbounded. **Errors** are `Diag { span, message, expected }` rendered with a caret line; all methods report the same span for the same input (checked by 20 000 fuzzed strings).

**Recovery**: on a bad statement we record the diagnostic, skip to the next `;` (stray `)` are skipped on the way) and keep parsing, so one run reports many errors. A lexer error inside a statement suppresses the parse cascade for it.

**Safety**: recursive parsers share a depth guard (MAX_DEPTH) so `((((...` gives an error instead of a stack overflow; left-assoc chains are loops, so a 100 000-token flat expression is parsed on a 512 KiB thread; dropping a 50 000-deep tree uses an explicit worklist.

**Evaluation** is **strict** (`&&`, `||` and `?:` evaluate every operand) because RPN has no jumps; real languages compile to jumps (see toy_language_interpreter). Reference evaluator = tree walk; it must equal the RPN stack machine and the Rust oracle values.
"""

