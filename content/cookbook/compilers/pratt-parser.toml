[[sections]]
heading = "Design notes"
body = """
Pattern: each infix operator has a (left, right) binding power. Parse a prefix item, then loop: if the next operator binds tighter than the current minimum, consume it and parse its right side with **its** right power. Left-associative: right > left.

Right-associative (`^`): right &lt; left.
"""

