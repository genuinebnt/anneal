[[sections]]
heading = "Design notes"
body = """
The tree here is shallow on purpose: tokens, brackets and rough "statements" for a narrow C-like notation. It is enough to ignore layout and comments, and it knows no grammar. It REFUSES what it can't cut into tokens for certain, among it every `/` that doesn't open a comment, so no division and no regular expressions.

Line breaks are thrown away, so it is wrong for languages where they matter (Python, and JavaScript without `;`), and comments are ignored. "No change" never proves that behaviour is the same. The answer is not always the smallest possible change.

Real tools build trees with a parser for each language.
"""

