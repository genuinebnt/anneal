[[sections]]
heading = "Overview"
body = """
<p>rustc is a large compiler, over 70 crates in <code>compiler/</code>, but it's well documented and welcoming to new contributors. Everything in Parts I–IV maps onto it: tokens, AST, HIR, THIR, MIR, LLVM IR; queries; the trait solver; borrowck on MIR; monomorphization; diagnostics. The fastest way in is to <b>improve one diagnostic</b> or <b>fix one ICE</b>. Both come with a small reproducer, touch one area, and are easy to test.</p>
"""

[[sections]]
heading = "Build and test"
body = """
```rust title="Setup (commands as of 2025; see the dev guide's “How to build and run the compiler”)"
git clone https://github.com/rust-lang/rust && cd rust
./x setup                          # choose "compiler"; writes bootstrap.toml (formerly config.toml)
                                   # and editor settings for rust-analyzer
./x check                          # fastest feedback loop: type-check the compiler
./x build library                  # stage 1 compiler + std
rustup toolchain link stage1 build/host/stage1
cargo +stage1 build                # use your compiler on any project, or: rustc +stage1 foo.rs

./x test tests/ui                  # the UI test suite (source file + expected .stderr)
./x test tests/ui/borrowck         # a subdirectory
./x test tests/ui --bless          # update .stderr files after an intended change, then review the diff
./x test tidy                      # formatting and lint checks that CI runs
./x test tests/mir-opt --bless     # MIR snapshot tests for optimization passes
```

<p>Useful <code>bootstrap.toml</code> settings for development: <code>rust.debug-logging = true</code> enables <code>debug!</code>/<code>RUSTC_LOG</code> output; <code>rust.incremental = true</code>; and <code>llvm.download-ci-llvm</code> (on by default) so you never build LLVM yourself.</p>
"""

