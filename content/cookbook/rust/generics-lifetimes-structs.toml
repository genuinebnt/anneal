[[sections]]
heading = "Design notes"
body = """
Reading a signature: `impl<'a, T: Bound> Struct<'a, T>` introduces lifetime `'a` and type `T` for the whole impl. **Key insight**: a method that returns data borrowed from the **original** source should name the struct's lifetime (`&'a T`), not the shorter `&self` lifetime, so callers can keep the result after the view itself is gone.

`+ '_`                  "this impl Trait borrows from &amp;self" `for<'x> Fn(&'x str)`   higher-ranked: works for **any** lifetime (needed for closures taking references)

```text
`'a: 'b`                'a outlives 'b
```
"""

