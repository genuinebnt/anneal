[[sections]]
heading = "Design notes"
body = """
Pattern: describe the transformation (map/filter/zip/windows/fold) and let `collect` build the result. `collect::<Result<Vec<_>, _>>()` stops at the **first** error, which is great for validation. Book: <https://doc.rust-lang.org/book/ch13-02-iterators.html>
"""

