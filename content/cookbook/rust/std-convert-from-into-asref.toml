[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Accept &amp;str or String in a ctor</td><td><code>impl Into&lt;String&gt;</code></td></tr><tr><td>Accept &amp;str/String/PathBuf/&amp;Path</td><td><code>impl AsRef&lt;Path&gt;</code></td></tr><tr><td>Accept any list of strings</td><td><code>impl IntoIterator&lt;Item = impl AsRef&lt;str&gt;&gt;</code></td></tr><tr><td>Infallible widening (u8 -&gt; u32)</td><td><code>From / Into</code></td></tr><tr><td>Fallible narrowing</td><td><code>TryFrom / try_into</code></td></tr><tr><td>Truncating cast on purpose</td><td><code>as (document it)</code></td></tr><tr><td>Validated newtype</td><td><code>private field + TryFrom</code></td></tr><tr><td>Parse text to my type</td><td><code>impl FromStr (then .parse::&lt;T&gt;())</code></td></tr><tr><td>Print my type</td><td><code>impl Display (gives to_string for free)</code></td></tr><tr><td>HashMap&lt;String,_&gt; lookup by &amp;str</td><td><code>Borrow&lt;str&gt; (already implemented by String)</code></td></tr><tr><td>Build my collection from iterator</td><td><code>impl FromIterator (+ Extend)</code></td></tr><tr><td>Make a wrapper behave like inner</td><td><code>Deref (only for smart-pointer-like types!)</code></td></tr></tbody></table>
"""

