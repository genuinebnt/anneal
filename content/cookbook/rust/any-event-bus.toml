[[sections]]
heading = "Design notes"
body = """
`Any` gives every `'static` type a runtime `TypeId` and lets you downcast `&dyn Any` back to the concrete type. The bus stores, per event **type**, a list of type-erased handlers. `subscribe::<E>(closure taking &E)` wraps the typed closure in a function over `&dyn Any` that downcasts first; `publish(&event)` looks up handlers by `TypeId::of::<E>()`.

Callers never see `Any`. Combines generics, closures, trait objects, `'static` bounds and interior mutability. Real use: <https://docs.rs/anymap> , bevy's resource/event registries <https://github.com/bevyengine/bevy> , and `Box<dyn Any>` in `std::panic::catch_unwind` payloads.
"""

