title = "Smart pointers use cases (std)"
module = "Standard library and core"
module_order = 2
chapter = "Option, Result, conversions, ownership types"
chapter_order = 1
order = 71
kind = "recipe"
lede = "Box, Rc/Weak, Arc, Cell/RefCell/OnceCell/LazyCell/OnceLock/LazyLock: one real use case each."
level = "intermediate"
code = ["examples/std_tour/std_smart_pointers_use_cases.rs"]

[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>recursive types</li><li>shared ownership</li><li>trees with parent pointers</li><li>caches</li><li>lazy statics</li><li>interior mutability</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>AST nodes (<code>Box&lt;Expr&gt;</code>)</li><li>DOM/UI trees with parent links (Rc/Weak)</li><li>config snapshots swapped atomically (Arc)</li><li>memoisation (RefCell/OnceCell)</li><li>process-wide regex/config (LazyLock/OnceLock)</li><li>trait objects (<code>Box&lt;dyn Trait&gt;</code>)</li></ul>
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>Box::new</code></li><li><code>Rc::new</code></li><li><code>Rc::clone</code></li><li><code>Rc::strong_count</code></li><li><code>Arc::new</code></li><li><code>Arc::clone</code></li><li><code>RefCell::borrow</code></li><li><code>RefCell::borrow_mut</code></li><li><code>Cell::get</code></li><li><code>Cell::set</code></li></ul>

<ul class="cb-g-names"><li><code>Rc::downgrade</code></li><li><code>Weak::upgrade</code></li><li><code>Rc::weak_count</code></li><li><code>Rc::ptr_eq</code></li><li><code>Rc::try_unwrap</code></li><li><code>Rc::get_mut</code></li><li><code>Rc::make_mut</code></li><li><code>Arc::make_mut</code></li><li><code>Arc::strong_count</code></li><li><code>Arc::try_unwrap</code></li></ul>

<ul class="cb-g-names"><li><code>Box::leak</code></li><li><code>Box::into_raw</code></li><li><code>Box::from_raw</code></li><li><code>Box::into_boxed_slice</code></li><li><code>Vec::into_boxed_slice</code></li><li><code>Cell::replace</code></li><li><code>Cell::take</code></li><li><code>RefCell::try_borrow</code></li><li><code>RefCell::try_borrow_mut</code></li></ul>

<ul class="cb-g-names"><li><code>RefCell::replace</code></li><li><code>RefCell::take</code></li><li><code>RefCell::into_inner</code></li><li><code>OnceCell::get_or_init</code></li><li><code>OnceCell::set</code></li><li><code>OnceCell::get</code></li><li><code>LazyCell::new</code></li><li><code>LazyCell::force</code></li><li><code>OnceLock::get_or_init</code></li></ul>

<ul class="cb-g-names"><li><code>OnceLock::set</code></li><li><code>LazyLock::new</code></li><li><code>LazyLock::force</code></li><li><code>Mutex::lock</code></li><li><code>Mutex::into_inner</code></li><li><code>Arc::from</code></li><li><code>Rc::from</code></li><li><code>Pin::new</code></li><li><code>Box::pin</code></li><li><code>Weak::new</code></li><li><code>Weak::strong_count</code></li></ul>
"""

