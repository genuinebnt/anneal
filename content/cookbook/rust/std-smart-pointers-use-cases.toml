heading = "Documentation"
body = """
<ul class="cb-g-reading"><li><a href="https://doc.rust-lang.org/std/boxed/struct.Box.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/boxed/struct.Box.html</a></li><li><a href="https://doc.rust-lang.org/std/rc/struct.Rc.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/rc/struct.Rc.html</a></li><li><a href="https://doc.rust-lang.org/std/sync/struct.Arc.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/sync/struct.Arc.html</a></li><li><a href="https://doc.rust-lang.org/std/cell/index.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/cell/index.html</a></li></ul>
"""

[[sections]]
heading = "Where it is defined"
body = """
Box/Rc/Weak/Arc alloc; Cell/RefCell/OnceCell/LazyCell/Pin core; OnceLock/LazyLock/Mutex std (`std::sync`).
"""

[[sections]]
heading = "Not covered"
body = """
Rc::new_cyclic / Arc::new_cyclic beyond mention, UniqueRc and allocator-aware APIs (nightly), RefCell::map/Ref::map projections, Rc::into_raw/from_raw (unsafe, same shape as Box).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Recursive type / big value on the heap</td><td><code>Box&lt;T&gt;</code></td></tr><tr><td>Heterogeneous list</td><td><code>Vec&lt;Box&lt;dyn Trait&gt;&gt;</code></td></tr><tr><td>Shared ownership, single thread</td><td><code>Rc&lt;T&gt;</code></td></tr><tr><td>... across threads</td><td><code>Arc&lt;T&gt;</code></td></tr><tr><td>Parent pointer without a leak</td><td><code>Weak&lt;T&gt; (downgrade/upgrade)</code></td></tr><tr><td>Mutate through &amp;self, Copy types</td><td><code>Cell&lt;T&gt;</code></td></tr><tr><td>... non-Copy, runtime-checked</td><td><code>RefCell&lt;T&gt;</code></td></tr><tr><td>Shared AND mutable across threads</td><td><code>Arc&lt;Mutex&lt;T&gt;&gt; / Arc&lt;RwLock&lt;T&gt;&gt;</code></td></tr><tr><td>Copy-on-write shared value</td><td><code>Rc::make_mut / Arc::make_mut</code></td></tr><tr><td>Compute once, then read-only</td><td><code>OnceCell / OnceLock (set once) or LazyCell / LazyLock (init closure)</code></td></tr><tr><td>Global lazily built table</td><td><code>static X: LazyLock&lt;T&gt;</code></td></tr><tr><td>Cheap-to-clone immutable string/slice</td><td><code>Arc&lt;str&gt; / Rc&lt;[T]&gt;</code></td></tr></tbody></table>
"""

