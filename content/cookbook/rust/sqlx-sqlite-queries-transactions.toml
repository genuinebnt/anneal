body = """
sqlx = "0.8" (features runtime-tokio, sqlite, chrono, uuid, json, migrate, macros: used here only for the derives), tokio = "1", futures-util = "0.3", chrono = "0.4", uuid = "1"
"""

[[sections]]
heading = "Design notes"
body = """
**Compile-time checked queries** (described, not used here). `sqlx::query!("SELECT id FROM users WHERE name = ?", name)` connects to the database named by DATABASE_URL while **compiling**, checks the SQL and infers an anonymous record type. For builds without a database run `cargo sqlx prepare` (sqlx-cli), commit the `.sqlx/` directory and set SQLX_OFFLINE=true.

This file uses the **runtime** functions, so a typo in SQL is a test failure here, not a compile error. That is the trade-off. **Migrations**.

`sqlx::migrate!("./migrations")` embeds a directory into the binary. This file hand-writes a 20-line runner instead so that the whole example is one file and you can see what a migration tool does: a version table, ordered scripts, each applied once inside a transaction.

(The real one also stores checksums to detect edited migrations.) **POSTGRES differences** (comments only, nothing here runs against Postgres): placeholders are '$1, $2' instead of '?'; richer types (arrays, enums via '#[derive(sqlx::Type)]', NUMERIC through the bigdecimal/rust_decimal features, TIMESTAMPTZ); 'PgListener' for **listen/notify**; 'PgConnection::copy_in_raw' for **copy**; 'SELECT ...

**For update skip locked**' for job queues; a failed statement poisons the whole transaction until ROLLBACK (SQLite lets it continue), so use savepoints there.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Exactly one row</td><td><code>fetch_one (RowNotFound if none) ; maybe one -&gt; fetch_optional ; all -&gt; fetch_all ; huge -&gt; fetch (stream)</code></td></tr><tr><td>One column</td><td><code>query_scalar ; a struct -&gt; query_as + #[derive(FromRow)]</code></td></tr><tr><td>Writes</td><td><code>execute -&gt; rows_affected / last_insert_rowid ; or RETURNING + fetch_one</code></td></tr><tr><td>Atomicity</td><td><code>let mut tx = pool.begin(); ... .execute(&amp;mut *tx); tx.commit()   (drop without commit = rollback)</code></td></tr><tr><td>Partial undo</td><td><code>tx.begin() creates a SAVEPOINT</code></td></tr><tr><td>Bulk insert</td><td><code>QueryBuilder::push_values in chunks below the bind-parameter limit</code></td></tr><tr><td>User input</td><td><code>always bind; identifiers (column names) cannot be bound, so allow-list them</code></td></tr><tr><td>Id IN (...)</td><td><code>QueryBuilder::separated, one placeholder per value; handle the empty list yourself</code></td></tr><tr><td>LIKE user text</td><td><code>escape % and _ and add ESCAPE</code></td></tr><tr><td>SQLite read-then-write transaction</td><td><code>pool.begin_with("BEGIN IMMEDIATE")</code></td></tr></tbody></table>
"""

