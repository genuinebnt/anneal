<ul class="cb-g-uses"><li>tokio/futures combinators (<code>Map</code>, <code>Then</code>, <code>Select</code>)</li><li>intrusive linked lists whose nodes are pinned (e.g. tokio's timer/notify waiter lists)</li><li>generators/async state machines</li><li>FFI objects registered by address</li></ul>
