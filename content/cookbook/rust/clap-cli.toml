[[sections]]
heading = "Design notes"
body = """
Derive a struct/enum and clap generates parsing, `--help`, usage errors, and shell completions. Keep `main` thin: parse -> call a function -> map Result to an exit code (error_enum). Use `try_parse_from(args)` in tests: it returns an error instead of exiting the process.

Docs: <https://docs.rs/clap/latest/clap/_derive/index.html>
"""

