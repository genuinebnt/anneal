heading = "Crates"
body = """
itertools = "0.14"
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Group ADJACENT equal keys</td><td><code>chunk_by (sort first to group globally)</code></td></tr><tr><td>Group globally into a map</td><td><code>into_group_map / into_grouping_map_by (aggregate without building Vecs)</code></td></tr><tr><td>Count occurrences</td><td><code>counts / counts_by</code></td></tr><tr><td>Merge sorted inputs</td><td><code>merge (2), kmerge (k), merge_join_by (full outer join)</code></td></tr><tr><td>Sort in the middle of a chain</td><td><code>sorted_by / sorted_by_key (stable) ; sorted_by_cached_key if the key is costly</code></td></tr><tr><td>Best k of many</td><td><code>k_smallest / k_largest_by_key (O(n log k), O(k) memory) instead of sorted().take(k)</code></td></tr><tr><td>Neighbours</td><td><code>tuple_windows (tuple items must be Clone)</code></td></tr><tr><td>All pairs / subsets / orderings</td><td><code>combinations, powerset, permutations, cartesian_product</code></td></tr><tr><td>Results inside an iterator</td><td><code>try_collect, process_results, fold_ok</code></td></tr><tr><td>Zip of unequal lengths</td><td><code>zip_longest ; "must be equal" -&gt; zip_eq (panics)</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
`chunk_by` is lazy and **not** an Iterator by itself (iterate `&grouping`); `unique`, `counts` and `sorted` buffer or hash everything (memory is O(distinct) or O(n)); `sorted` and `permutations` on an infinite iterator never return; method names can collide with newer std methods (e.g. `intersperse`), so call `Itertools::intersperse(it, x)` if warned.
"""

