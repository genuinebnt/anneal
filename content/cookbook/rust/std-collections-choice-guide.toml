alloc: Vec, VecDeque, LinkedList, BTreeMap, BTreeSet, BinaryHeap. std only: HashMap and HashSet (their default hasher needs OS randomness). Arrays are core.
"""

[[sections]]
heading = "Not covered"
body = """
the full API of each type (this page is for **choosing**: see std_vec_vecdeque_methods and the hash map / collections look-up pages), cursor APIs (unstable), concurrent maps (not in std), memory footprint measurement (see std_alloc_layout_global_allocator), external crates such as indexmap or smallvec.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Index by position, iterate, append at the end</td><td><code>Vec          (the default; contiguous)</code></td></tr><tr><td>FIFO, or push/pop at both ends</td><td><code>VecDeque</code></td></tr><tr><td>Look up by exact key, order irrelevant</td><td><code>HashMap / HashSet</code></td></tr><tr><td>Keys in order, ranges, floor/ceiling, min and max</td><td><code>BTreeMap / BTreeSet</code></td></tr><tr><td>Repeatedly take the largest (smallest: Reverse)</td><td><code>BinaryHeap</code></td></tr><tr><td>Build once, then search many times</td><td><code>sorted Vec + binary_search</code></td></tr><tr><td>A handful of small items</td><td><code>Vec or inline array, linear search</code></td></tr><tr><td>Move whole lists in O(1)</td><td><code>LinkedList (rarely; try VecDeque or Vec first) COSTS (std::collections module docs; n = size). get(i)/insert(i)/remove(i) Vec         O(1) / O(n-i) / O(n-i)            VecDeque    O(1) / O(min(i, n-i)) both LinkedList  O(min(i, n-i)) all three, but append is O(1) HashMap     O(1) expected get/insert/remove   BTreeMap    O(log n) get/insert/remove, plus range BinaryHeap  push O(1) expected, pop O(log n), peek O(1) (BinaryHeap docs) BTreeMap detail (its docs): nodes hold B-1..2B-1 items and are searched LINEARLY, so a lookup makes more comparisons than binary search while touching few cache lines.</code></td></tr></tbody></table>
"""

