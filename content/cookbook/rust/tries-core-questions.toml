[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. Implement a Trie with insert, search, starts_with, count of words with a prefix, and delete (array children). [Medium] [asked: very common] Q2. Implement the same Trie with HashMap children so it handles any char, not just a-z. [Medium] [asked: very common] Q3.

Implement the same Trie as an arena: nodes in a Vec, children are u32 indices. Why would you? [Medium] [asked: common] Q4. Add and search words where '.' matches any single letter (LeetCode 211). [Medium] [asked: very common] Q5.

Longest common prefix of a set of words (LeetCode 14): is a trie the right tool? [Easy] [asked: very common] Q6. Replace every word in a sentence with the shortest dictionary root that prefixes it (LeetCode 648). [Medium] [asked: common] Q7.

Longest word in a dictionary that can be built one character at a time from other words (LeetCode 720). [Medium] [asked: common] Q8. Map Sum Pairs: insert(key, val) with overwrite, sum(prefix) (LeetCode 677). [Medium] [asked: common] Q9.

Count the distinct substrings of a string with a suffix trie; why are a suffix array and a suffix automaton better? [Hard] [asked: occasional] Q10. Autocomplete: top-k most frequent words for a prefix, with a per-node top-k cache versus DFS plus a heap (LeetCode 642 idea). [Hard] [asked: very common] Q11.

Search suggestions system: after each typed letter, the 3 lexicographically smallest products with that prefix (LeetCode 1268): sorted array vs trie. [Medium] [asked: very common] Q12. Word break: can a string be split into dictionary words? Use a trie to walk (LeetCode 139). [Medium] [asked: very common] Q13.

T9 phone keypad: all dictionary words that a digit sequence can spell. [Medium] [asked: occasional] Q14. Spell checker: all dictionary words within edit distance k of a typo, pruning the trie with a Levenshtein row. [Hard] [asked: occasional] Q15.

Compress a trie into a radix (Patricia) tree: split edges on insert, and prove it uses at most 2n nodes. [Hard] [asked: common] Q16. Trie vs hash set vs sorted Vec: which wins for prefix queries, and what does each cost in memory? [Medium] [asked: common] Q17. Unicode: should the trie walk bytes or chars?

What breaks with normalization and case folding? [Medium] [asked: common] Q18. Longest-prefix match for IPv4-style routing with a binary trie. [Medium] [asked: common]
"""

