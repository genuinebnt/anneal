[[sections]]
heading = "Where it is defined"
body = """
alloc (`alloc::vec::Vec`, `alloc::collections::VecDeque`, `vec!`), re-exported by std. Methods reached through Deref to slice (sort, binary_search, chunks, windows...) are core/alloc slice methods: see std_slice_search_sort_binary.
"""

[[sections]]
heading = "Not covered"
body = """
from_raw_parts / into_raw_parts (1.93) / set_len (unsafe or raw-pointer ownership: note in section 6), peek_mut, push_within_capacity, try_with_capacity, from_fn, into_chunks, recycle, try_remove, split_at_spare_mut and every `_in` allocator method (unstable in 1.98.1); VecDeque::extract_if, splice, extend_from_within, prepend, truncate_front (unstable).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Build when the size is known</td><td><code>Vec::with_capacity(n)</code></td></tr><tr><td>Remove at i, keep order (O(n))</td><td><code>remove(i)</code></td></tr><tr><td>Remove at i, order irrelevant (O(1))</td><td><code>swap_remove(i)</code></td></tr><tr><td>Delete all items matching a predicate</td><td><code>retain / retain_mut (one O(n) pass)</code></td></tr><tr><td>Same, but KEEP the deleted items</td><td><code>extract_if(.., pred)</code></td></tr><tr><td>Move a range out</td><td><code>drain(range)</code></td></tr><tr><td>Move the tail out as a new Vec</td><td><code>split_off(at)</code></td></tr><tr><td>Move everything from another Vec</td><td><code>append(&amp;mut other)   (other is left empty, keeps its capacity)</code></td></tr><tr><td>Replace a range with other items</td><td><code>splice(range, items)</code></td></tr><tr><td>Copy a slice onto the end</td><td><code>extend_from_slice</code></td></tr><tr><td>Remove consecutive duplicates</td><td><code>dedup (sort first for global uniqueness)</code></td></tr><tr><td>Pop only if the last item qualifies</td><td><code>pop_if</code></td></tr><tr><td>Take the whole Vec out of &amp;mut</td><td><code>std::mem::take</code></td></tr><tr><td>FIFO queue / pop from the front</td><td><code>VecDeque::push_back + pop_front (never Vec::remove(0) in a loop)</code></td></tr><tr><td>Need one &amp;[T] from a VecDeque</td><td><code>make_contiguous (or handle both halves of as_slices)</code></td></tr><tr><td>Allocation that may fail</td><td><code>try_reserve DESIGN NOTES: Vec is (pointer, capacity, length). push is amortised O(1); the growth factor is explicitly NOT guaranteed. capacity() &gt;= len() always holds. Operations that shorten a Vec never shrink the allocation by themselves. VecDeque is a ring buffer over one allocation, so its contents may be split into two slices.</code></td></tr></tbody></table>
"""

