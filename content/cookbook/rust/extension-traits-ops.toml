[[sections]]
heading = "Design notes"
body = """
Extension trait: define `trait IterExt: Iterator { fn my_adapter(self) -> MyAdapter<Self> }` and a blanket `impl<I: Iterator> IterExt for I {}`: now **every** iterator has `.my_adapter()`. That is exactly how `itertools` works (<https://docs.rs/itertools>). Operators are traits too: `impl Add for V2<T>`; derive nothing, implement what makes sense.
"""

