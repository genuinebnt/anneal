[[sections]]
heading = "Design notes"
body = """
Cheat sheet (I want to ... -> use ...):

```text
transform each item                      -> `map`
```

drop items                               -> `filter`; drop and transform at once: `filter_map` each item expands to many                -> `flat_map` / `map(..).flatten()`; flatten Options/Results: `flatten()` index with item                          -> `enumerate` (then `.rev()` **order** matters, see section 6) first n / all but first n                -> `take(n)` / `skip(n)`

```text
while a condition holds                  -> `take_while`; `skip_while`; and map+stop at first None: `map_while`
every k-th                               -> `step_by(k)`
```

join sequences / pair them               -> `chain` / `zip` (stops at the **shorter**) look ahead without consuming             -> `peekable()` + `peek` / `next_if` / `next_if_eq`

```text
running total / stateful map             -> `scan`
debug a pipeline                         -> `inspect(|x| eprintln!(..))`
```

repeat forever / round robin             -> `cycle` (+ `take`)

```text
use a prefix then continue               -> `by_ref()`
```

iterate references as values             -> `copied()` (Copy) / `cloned()` (Clone) overlapping / non-overlapping groups     -> slice `windows(n)` / `chunks(n)`

```text
safe after first None                    -> `fuse`
```
"""

