LinkedList cursors (`cursor_front_mut`, splicing in the middle), `LinkedList::{remove, retain}` (unstable in 1.98.1); `VecDeque::truncate_front` (unstable); `VecDeque::resize_with`, `shrink_to_fit`, `try_reserve` (same meaning as on Vec); intrusive and lock-free queues.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>FIFO queue</td><td><code>VecDeque: push_back + pop_front (never Vec::remove(0), which is O(n))</code></td></tr><tr><td>Keep the last N</td><td><code>if q.len() == n { q.pop_front(); } q.push_back(x)</code></td></tr><tr><td>Remove the head only if it is expired</td><td><code>pop_front_if(|x| ..) (1.93)</code></td></tr><tr><td>One contiguous slice (sort, write)</td><td><code>make_contiguous(); without mutation: handle BOTH halves of as_slices()</code></td></tr><tr><td>Round-robin</td><td><code>rotate_left(1), or pop front and push back</code></td></tr><tr><td>Search a sorted deque</td><td><code>binary_search / partition_point</code></td></tr><tr><td>Convert to / from Vec</td><td><code>VecDeque::from(vec) is O(1), no reallocation; back to Vec may shift data (O(n))</code></td></tr><tr><td>Join two long lists without moving items</td><td><code>LinkedList::append is O(1). split_off(at) is NOT: it walks min(at, len-at) nodes</code></td></tr><tr><td>Repeatedly take the min/max</td><td><code>BinaryHeap; also need remove/update by key: BTreeSet; build once, then drain: sort a Vec LinkedList, honestly: std's docs say a Vec or VecDeque is almost always better. Without stable cursors you cannot even splice in the middle. The remaining cases: O(1) concatenation, or elements that must never move. (Vec&lt;Box&lt;T&gt;&gt; also keeps the T in place.)</code></td></tr></tbody></table>
"""

