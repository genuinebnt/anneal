heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>"events between t1 and t2" on a sorted Vec</li><li>top-k results</li><li>p50/p99 latency</li><li>shard lookup in a sorted boundary table</li><li>in-place buffer shuffles. Everything here also works on Vec&lt;T&gt; and [T; N] through deref/coercion</li></ul>
"""

