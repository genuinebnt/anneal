[[sections]]
heading = "Where it is defined"
body = """
core (`core::slice`: access, search, copy, sort_unstable&#42;, select_nth_unstable&#42;, binary search), usable in no_std. alloc (`alloc::slice`): sort, sort_by, sort_by_key, sort_by_cached_key, to_vec, into_vec, concat, join, repeat.
"""

[[sections]]
heading = "Not covered"
body = """
sort_unstable_by, sort_unstable_by_key, is_sorted_by_key (see std_cmp_hash_default_traits), get_unchecked&#42;/swap_unchecked/split_at_unchecked (unsafe), chunking, windows and split&#42; (see std_slice_chunks_windows_split), sort_by_cached_key and float sorting (see std_cmp_hash_default_traits), the other &#42;&#95;mut twins (same shape), split_off_first/split_off_last family (shrinks a `&mut &[T]`, niche), as_ptr/as_mut_ptr.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Read index i without panicking</td><td><code>get(i)          sub-range: get(a..b)</code></td></tr><tr><td>Head + rest</td><td><code>split_first / if let [head, rest &#64; ..] = s</code></td></tr><tr><td>Fixed-size header from the front</td><td><code>first_chunk::&lt;N&gt;() / split_first_chunk::&lt;N&gt;()</code></td></tr><tr><td>Is x in a SORTED slice, and where</td><td><code>binary_search  (Err(i) = insertion point)</code></td></tr><tr><td>First index of the sorted range &gt;= x</td><td><code>partition_point(|v| v &lt; x)</code></td></tr><tr><td>First index of the sorted range &gt; x</td><td><code>partition_point(|v| v &lt;= x)</code></td></tr><tr><td>First / last match, unsorted</td><td><code>iter().position(..) / iter().rposition(..)</code></td></tr><tr><td>K-th smallest, median, top-k</td><td><code>select_nth_unstable* (average and worst case O(n))</code></td></tr><tr><td>Sort, keeping equal items in order</td><td><code>sort / sort_by / sort_by_key</code></td></tr><tr><td>Sort, order of equal items irrelevant</td><td><code>sort_unstable* (does not allocate)</code></td></tr><tr><td>Move the first k items to the back</td><td><code>rotate_left(k)</code></td></tr><tr><td>Copy bytes between buffers</td><td><code>copy_from_slice (lengths must match)</code></td></tr><tr><td>Overlapping move inside one buffer</td><td><code>copy_within</code></td></tr><tr><td>Two &amp;mut elements at once</td><td><code>get_disjoint_mut([i, j])  or split_at_mut</code></td></tr></tbody></table>
"""

