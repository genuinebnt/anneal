[[sections]]
heading = "Design notes"
body = """
Pattern: store all nodes in one `Vec`; children are `ExprId`s, not `Box<Expr>`. One allocation grows the whole tree, nodes are cache-friendly, dropping is a single free, and there are no borrow-checker fights over parent/child references. Real code: oxc's bump arena -> <https://github.com/oxc-project/oxc/tree/main/crates/oxc_allocator>
"""

