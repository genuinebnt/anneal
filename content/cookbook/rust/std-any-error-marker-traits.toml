[[sections]]
heading = "Where it is defined"
body = """
core: `core::any`, `core::error::Error` (in core since 1.81), `core::marker`. alloc: `Box`, the `From<E> for Box<dyn Error>` impls and `Box::downcast`; Rc/Arc downcasts. std: `std::io::Error`, `std::thread`. Also: <https://doc.rust-lang.org/std/error/trait.Error.html> , <https://doc.rust-lang.org/std/marker/index.html>
"""

[[sections]]
heading = "Not covered"
body = """
Error::description/cause (deprecated), Error::provide/request_ref and Error::sources (unstable in 1.98.1), downcast_unchecked&#95;&#42; (unsafe), writing `unsafe impl Send/Sync` (see the unsafe chapter), negative impls `impl !Send` (nightly).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Make my type an error</td><td><code>derive Debug, impl Display, impl Error (override source if wrapping)</code></td></tr><tr><td>Let <code>?</code> convert a lower error</td><td><code>impl From&lt;Lower&gt; for Mine</code></td></tr><tr><td>"any error" in an application</td><td><code>Box&lt;dyn Error + Send + Sync + 'static&gt;</code></td></tr><tr><td>An error from a string</td><td><code>Err("msg".into()) or io::Error::other("msg")</code></td></tr><tr><td>Print the whole cause chain</td><td><code>loop over source()</code></td></tr><tr><td>Was the cause an io::Error?</td><td><code>walk the chain with downcast_ref::&lt;io::Error&gt;()</code></td></tr><tr><td>Get the concrete error back by value</td><td><code>Box&lt;dyn Error&gt;::downcast::&lt;T&gt;() (Err returns the box)</code></td></tr><tr><td>Value of unknown type</td><td><code>Box&lt;dyn Any&gt; + downcast</code></td></tr><tr><td>One value per type</td><td><code>HashMap&lt;TypeId, Box&lt;dyn Any + Send + Sync&gt;&gt;</code></td></tr><tr><td>Print a type for debugging</td><td><code>type_name::&lt;T&gt;()  (never parse or compare it)</code></td></tr><tr><td>Prove a type is thread-safe</td><td><code>const _: () = assert_send_sync::&lt;T&gt;();</code></td></tr><tr><td>Zero-cost type tag</td><td><code>PhantomData&lt;T&gt; DISPLAY CONVENTION (from the Error docs): messages are typically lowercase, no trailing punctuation; a wrapping error returns the cause from source() OR includes it in its Display output, NOT both (otherwise chain printers repeat it).</code></td></tr></tbody></table>
"""

