[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>request "extensions" maps in web frameworks</li><li>event buses</li><li>logging a whole error chain</li><li>finding an io::Error inside a wrapped error to decide whether to retry</li><li><code>Send + Sync + 'static</code> bounds on spawned work</li></ul>
"""

