[[sections]]
heading = "Design notes"
body = """
Pattern: `Session<S>` is generic over a state type. Each state is its own (often zero-sized) type, and methods live in `impl Session<ThatState>` blocks, so `send()` simply **does not exist** on a logged-out session. Transitions take `self` **by value** and return the next state type, so the old state cannot be reused.

**A sealed** trait stops outside code from inventing new states. Failed transitions can hand the old session **back** in the `Err` so callers can retry. Compare with the enum state machine (state_machine): enums decide at **runtime** and can be stored in one variable; typestate decides at **compile time** but each state is a different type (awkward in collections).

Pick by where mistakes must be caught.
"""

