title = "One data model, seven formats"
module = "Crates and tooling"
module_order = 3
chapter = "Data, text and encoding crates"
chapter_order = 1
order = 113
kind = "recipe"
lede = "JSON, TOML, YAML, bincode, postcard, MessagePack, CBOR, plus CSV"
level = "intermediate"
code = ["crates/cb-crate-tour/examples/serde_formats_json_toml_yaml_bincode.rs"]

[[sections]]
heading = "Where you would use it"
body = """
choosing a wire/disk format; migrating between formats without surprising data loss.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>JSON for HTTP APIs</li><li>TOML for hand-edited config (Cargo)</li><li>YAML for CI/Kubernetes files</li><li>postcard for embedded and compact RPC</li><li>MessagePack/CBOR for schemaless binary payloads (CBOR is the base of COSE/WebAuthn)</li><li>CSV for exports</li></ul>
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>serde_json::to_vec</code></li><li><code>serde_json::from_slice</code></li><li><code>toml::to_string</code></li><li><code>toml::from_str</code></li><li><code>toml::value::Datetime</code></li><li><code>toml::Table</code></li><li><code>serde_yaml_ng::to_string</code></li><li><code>serde_yaml_ng::from_str</code></li><li><code>bincode::serialize</code></li><li><code>bincode::deserialize</code></li><li><code>bincode::DefaultOptions</code></li><li><code>bincode::Options::with_limit</code></li><li><code>postcard::to_allocvec</code></li><li><code>postcard::from_bytes</code></li><li><code>postcard::take_from_bytes</code></li><li><code>rmp_serde::to_vec</code></li><li><code>rmp_serde::to_vec_named</code></li><li><code>rmp_serde::from_slice</code></li><li><code>ciborium::into_writer</code></li><li><code>ciborium::from_reader</code></li><li><code>csv::Writer::serialize</code></li><li><code>csv::Reader::deserialize</code></li><li><code>csv::ReaderBuilder</code></li><li><code>serde_bytes (#[serde(with = "serde_bytes")])</code></li><li><code>serde_yaml_ng::Deserializer (multi-document)</code></li><li><code>Value::apply_merge</code></li><li><code>postcard::{to_slice, to_allocvec_cobs, from_bytes_cobs, take_from_bytes_cobs}</code></li><li><code>csv::WriterBuilder::has_headers</code></li><li><code>csv::ReaderBuilder::{has_headers, flexible}</code></li><li><code>serde_json::Deserializer::from_str</code></li></ul>
"""

