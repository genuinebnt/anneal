[[sections]]
heading = "Crates"
body = """
serde_json = "1", toml = "0.8" (not the newest major line), serde_yaml_ng = "0.10", bincode = "1.3", postcard = "1", rmp-serde = "1", ciborium = "0.2", csv = "1", serde_bytes = "0.11"
"""

[[sections]]
heading = "Design notes"
body = """
**Maintenance status** (checked on crates.io and rustsec.org while writing; check again before you adopt anything):

- `serde_yaml` (dtolnay) is published as 0.9.34+deprecated.
- `serde_yml` has advisory RUSTSEC-2025-0068 (unsound and unmaintained). Do not use it. <https://rustsec.org/advisories/RUSTSEC-2025-0068.html>
- `serde_yaml_ng` is **chosen** here: the advisory above lists it as an alternative and keeps the serde_yaml API. Caveat from the same advisory: it still builds on the unmaintained `unsafe-libyaml`; `serde_norway` is the other fork it lists.
- `bincode` has advisory RUSTSEC-2025-0141 (unmaintained; the team says 1.3.3 is complete). It is shown because existing code uses it; for **new** code prefer postcard (or evaluate the advisory's other alternatives). <https://rustsec.org/advisories/RUSTSEC-2025-0141.html>
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Humans read it, other languages consume it</td><td><code>JSON</code></td></tr><tr><td>Humans EDIT it</td><td><code>TOML (flat-ish config), YAML only if the ecosystem forces it</code></td></tr><tr><td>Compact, both ends are Rust, schema versioned</td><td><code>postcard (NOT self-describing: field order IS the schema)</code></td></tr><tr><td>Compact but self-describing</td><td><code>MessagePack with to_vec_named, or CBOR</code></td></tr><tr><td>Flat rows for spreadsheets</td><td><code>CSV</code></td></tr><tr><td>U64 ids that JavaScript will read</td><td><code>encode as strings</code></td></tr><tr><td>Vec&lt;u8&gt; in MessagePack/CBOR</td><td><code>mark it with serde_bytes, or every byte is encoded as a number</code></td></tr><tr><td>Packet framing for postcard over a serial line</td><td><code>COBS (0x00 never appears inside a frame)</code></td></tr></tbody></table>
"""

