[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Transform the value if present</td><td><code>map</code></td></tr><tr><td>Transform with something that may fail</td><td><code>and_then</code></td></tr><tr><td>Default if absent</td><td><code>unwrap_or / unwrap_or_else (lazy) / unwrap_or_default</code></td></tr><tr><td>Turn None into an error</td><td><code>ok_or / ok_or_else</code></td></tr><tr><td>Bubble None up</td><td><code>?</code></td></tr><tr><td>Look without moving a String/Vec</td><td><code>as_ref / as_deref</code></td></tr><tr><td>Mutate in place</td><td><code>as_mut</code></td></tr><tr><td>Move the value out of &amp;mut self.field</td><td><code>take / replace</code></td></tr><tr><td>Take only if</td><td><code>take_if</code></td></tr><tr><td>Compute once and cache</td><td><code>get_or_insert_with</code></td></tr><tr><td>First Some of several</td><td><code>or / or_else</code></td></tr><tr><td>Keep only if predicate</td><td><code>filter</code></td></tr><tr><td>Test present+predicate</td><td><code>is_some_and</code></td></tr><tr><td>Absent means "no limit"</td><td><code>is_none_or</code></td></tr><tr><td>Option&lt;Result&gt;</td><td><code>Result&lt;Option&gt; -&gt; transpose</code></td></tr><tr><td>Option&lt;&amp;T&gt; -&gt; Option&lt;T&gt;</td><td><code>copied / cloned</code></td></tr><tr><td>Option&lt;Option&lt;T&gt;&gt;</td><td><code>flatten</code></td></tr><tr><td>Both present</td><td><code>zip</code></td></tr><tr><td>Exactly one present</td><td><code>xor</code></td></tr><tr><td>Drop Nones from an iterator</td><td><code>flatten / filter_map</code></td></tr><tr><td>Bind or return early</td><td><code>let-else How to read this file: sections are grouped by what you want to DO with an optional value, not alphabetically. Every section is a small scenario with asserts; PITFALL lines show the trap and the idiom to use instead. Rule of thumb: Option is a value that may be absent; transform it with combinators, unwrap only where absence is a bug, and prefer ? / let-else when absence should leave the function.</code></td></tr></tbody></table>
"""

