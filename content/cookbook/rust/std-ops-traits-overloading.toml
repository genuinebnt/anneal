[[sections]]
heading = "Where it is defined"
body = """
core (`core::ops`, `core::iter::{Sum, Product}`), re-exported as std::ops. Usable in no_std. BTreeMap is alloc.
"""

[[sections]]
heading = "Not covered"
body = """
the Try / FromResidual / Residual traits and implementing Fn&#42; by hand (unstable), CoerceUnsized and DispatchFromDyn (unstable), RangeBounds intersect/IntoBounds and OneSidedRange use (unstable or niche), the remaining &#42;Assign traits (same shape as AddAssign), the new `core::range` Range types beyond this mention, Coroutine (unstable).

Comparison operators come from PartialEq/PartialOrd: see std_cmp_hash_default_traits.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>A + b on my type</td><td><code>impl Add (by value; add &amp;T forms if the type is not Copy)</code></td></tr><tr><td>A += b</td><td><code>impl AddAssign (separate trait, not derived from Add)</code></td></tr><tr><td>Container[key]</td><td><code>Index (+ IndexMut); it PANICS on a miss, also offer get() -&gt; Option</code></td></tr><tr><td>Cleanup at scope end</td><td><code>Drop</code></td></tr><tr><td>Accept a callback called once</td><td><code>impl FnOnce</code></td></tr><tr><td>... many times, may mutate its state</td><td><code>impl FnMut</code></td></tr><tr><td>... many times through &amp;self (shareable)</td><td><code>impl Fn</code></td></tr><tr><td>Accept <code>..</code>, <code>a..</code>, <code>..=b</code> in my API</td><td><code>impl RangeBounds&lt;T&gt;</code></td></tr><tr><td>Keyset pagination</td><td><code>map.range((Excluded(last), Unbounded))</code></td></tr><tr><td>Stop internal iteration early with a value</td><td><code>try_for_each + ControlFlow::Break</code></td></tr><tr><td>Smart-pointer-like wrapper</td><td><code>Deref (ONLY for pointer-like types)</code></td></tr></tbody></table>
"""

