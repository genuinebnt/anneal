[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>migrating 2021 crates (<code>cargo fix --edition</code>)</li><li>reviewing 2024 code</li><li>explaining odd drop orders and lifetimes</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
This crate is edition 2024, so the **after** behaviour is executed and asserted; the **before** behaviour was checked by compiling the same snippet with `rustc --edition 2021` and is recorded in comments.

Changes covered: RPIT lifetime capture, `if let` and tail-expression temporary scopes, `unsafe_op_in_unsafe_fn`, `unsafe extern` / `unsafe(no_mangle)`, `gen` keyword, never-type fallback, `Box<[T]>` by-value `IntoIterator`, `Future`/`IntoFuture` in the prelude, `static mut` references, Cargo resolver 3.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>finding which of your Drop guards (MutexGuard, RefCell borrow, span guards) now release earlier</li><li>fixing "does not live long enough" after upgrading</li><li>keeping FFI declarations honest</li><li>preparing for generators (<code>gen</code>). Migration: <code>cargo fix --edition</code> rewrites most of this mechanically</li><li>then set <code>edition = "2024"</code> and rerun tests</li></ul>
"""

