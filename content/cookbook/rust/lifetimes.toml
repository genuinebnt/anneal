[[sections]]
heading = "Where you would use it"
body = """
any struct/function that returns or stores a reference (parsers, views over input).
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>zero-copy parsers</li><li>views over buffers</li><li>iterators that borrow: the lifetime patterns behind most Rust libraries</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
A lifetime is the compiler's name for "how long this borrow is valid". It never changes runtime behaviour; it only lets the compiler **prove** a reference never outlives the data it points to.
"""

