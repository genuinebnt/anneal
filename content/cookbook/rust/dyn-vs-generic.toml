[[sections]]
heading = "Design notes"
body = """
Pattern: define behaviour as a trait. Use a generic `<R: Runner>` when the type is known at compile time (fast, inlinable, one copy of code per type). Use `Box<dyn Runner>` when you need a heterogeneous collection or runtime choice (one vtable call, smaller binary).

A fake implementation makes tests easy.
"""
