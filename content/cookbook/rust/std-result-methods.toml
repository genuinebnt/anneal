[[sections]]
heading = "Where it is defined"
body = """
`Result` core (`core::result`); `Error` trait core (`core::error`, in core since 1.81); `Box` alloc; `ExitCode`/`Termination` std (`std::process`).
"""

[[sections]]
heading = "Not covered"
body = """
unwrap_unchecked/unwrap_err_unchecked (unsafe), into_ok/into_err (unstable in 1.98.1).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Transform Ok</td><td><code>map</code></td></tr><tr><td>Transform Err (add context/convert)</td><td><code>map_err</code></td></tr><tr><td>Chain a fallible step</td><td><code>and_then / ?</code></td></tr><tr><td>Recover from an Err</td><td><code>or_else</code></td></tr><tr><td>Default on Err</td><td><code>unwrap_or / unwrap_or_else / unwrap_or_default</code></td></tr><tr><td>Drop the error, keep Option</td><td><code>ok()</code></td></tr><tr><td>Keep only the error</td><td><code>err()</code></td></tr><tr><td>Test Ok + predicate</td><td><code>is_ok_and / is_err_and</code></td></tr><tr><td>Look without moving</td><td><code>as_ref / as_deref</code></td></tr><tr><td>Vec&lt;Result&lt;T,E&gt;&gt;</td><td><code>Result&lt;Vec&lt;T&gt;,E&gt; -&gt; collect</code></td></tr><tr><td>Sum fallibly</td><td><code>sum::&lt;Result&lt;_,_&gt;&gt;</code></td></tr><tr><td>Stop at first error in a fold</td><td><code>try_fold / try_for_each</code></td></tr><tr><td>Keep both oks and errs</td><td><code>partition</code></td></tr><tr><td>Option&lt;Result&gt; &lt;-&gt; Result&lt;Option&gt;</td><td><code>transpose</code></td></tr><tr><td>Log without changing</td><td><code>inspect / inspect_err</code></td></tr><tr><td>Mix error types in one fn</td><td><code>? with From, or Box&lt;dyn Error + Send + Sync&gt;</code></td></tr><tr><td>Process exit code from main</td><td><code>main() -&gt; ExitCode / Result&lt;(), E&gt; (E: Debug)</code></td></tr></tbody></table>
"""

