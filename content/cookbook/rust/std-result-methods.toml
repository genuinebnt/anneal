body = """
<ul class="cb-g-uses"><li>every fallible std API (parse, fs, net)</li><li>config loaders</li><li>validation pipelines that collect all errors or stop at the first</li><li>CLI <code>main() -&gt; ExitCode</code></li><li>converting library errors at crate boundaries</li></ul>
"""

