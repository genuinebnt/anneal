[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>order/account/ticket lifecycles</li><li>event sourcing (replay events to rebuild state)</li><li>exhaustive model checking</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Separate the **pure** transition function from everything else: `step(&state, &event) -> Result<state, error>`. Because it is pure, you can (1) replay a stored event list to rebuild state, (2) fuzz it with random events and assert invariants, (3) reuse one generic `replay` for many machines. This is the core of event sourcing.

Associated types let each machine pick its own State/Event/Error; `replay<M: Machine>` works for all of them.
"""

