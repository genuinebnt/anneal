[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. Generics vs `dyn Trait`: what is static vs dynamic dispatch and what is a fat pointer? [Medium] [asked: very common] Q2. When do you choose generics and when trait objects? [Medium] [asked: very common] Q3.

What is object safety (dyn compatibility)? Which traits cannot be `dyn`? [Hard] [asked: very common] Q4. `impl Trait` in argument and return position: how do they differ from generics and `Box<dyn>`? [Medium] [asked: very common] Q5.

Trait bounds, `where` clauses and conditional method availability. [Easy] [asked: common] Q6. Associated types vs generic parameters on a trait (Iterator::Item vs From&lt;T>). [Medium] [asked: very common] Q7. What is the orphan rule?

How does the newtype pattern work around it? [Medium] [asked: very common] Q8. Blanket impls, default methods and supertraits. [Medium] [asked: common] Q9. Fn vs FnMut vs FnOnce: which closure implements which? [Medium] [asked: very common] Q10.

Storing and returning closures: `Box<dyn Fn + Send + 'static>`, `impl Fn`, `Box<dyn FnOnce>`. [Medium] [asked: common] Q11. How does operator overloading work? [Easy] [asked: common] Q12. PartialEq vs Eq vs PartialOrd vs Ord: why is f64 not Ord?

Derive vs manual. [Medium] [asked: very common] Q13. Default, From/Into and TryFrom: how do they relate? [Easy] [asked: common] Q14. AsRef vs Borrow vs Deref: what is the difference? [Hard] [asked: occasional] Q15.

What are `Sized` and `?Sized`? [Hard] [asked: common] Q16. How does `dyn Any` downcasting work? [Medium] [asked: occasional] Q17. What are marker traits (Copy, Send, Sync, Unpin)? [Medium] [asked: common]
"""

