heading = "Common uses"
body = """
config/API payload parsing (serde is the default for JSON/TOML/YAML in nearly every Rust service); strict schemas reject typos early.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: let the &#42;types&#42; do the validating. `u32` cannot be negative, a missing `Vec` can default to empty, and `deny_unknown_fields` turns typos into errors instead of silently ignoring them. Real code: <https://github.com/serde-rs/serde> (derive attributes: <https://serde.rs/field-attrs.html>)
"""

