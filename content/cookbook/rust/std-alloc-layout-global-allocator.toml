[[sections]]
heading = "Where it is defined"
body = """
core (`core::alloc`: Layout, LayoutError, GlobalAlloc; `core::mem`; `core::ptr`). alloc (`alloc::alloc`: the free functions alloc/alloc_zeroed/realloc/dealloc/handle_alloc_error and every owning heap type). std: `System`. `#[global_allocator]` is a language attribute.
"""

[[sections]]
heading = "Not covered"
body = """
the Allocator trait, Global as a value, Box::new_in / Vec::new_in (allocator_api, unstable in 1.98.1: with it a collection takes its allocator as a type parameter; today crates such as allocator-api2 or bumpalo fill the gap), alloc_error_hook (unstable), unchecked Layout constructors, Layout::dangling_ptr.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Size / alignment of a type</td><td><code>size_of::&lt;T&gt;() / align_of::&lt;T&gt;()</code></td></tr><tr><td>Where a field starts</td><td><code>offset_of!(Type, field)</code></td></tr><tr><td>Layout of T / [T; n]</td><td><code>Layout::new::&lt;T&gt;() / Layout::array::&lt;T&gt;(n)</code></td></tr><tr><td>Header followed by data</td><td><code>let (l, off) = header.extend(data)?; l.pad_to_align()</code></td></tr><tr><td>Raw heap memory</td><td><code>alloc(layout), check null, dealloc(ptr, SAME layout)</code></td></tr><tr><td>Zeroed memory</td><td><code>alloc_zeroed</code></td></tr><tr><td>Grow or shrink</td><td><code>realloc(ptr, old_layout, new_size)</code></td></tr><tr><td>Allocation failed</td><td><code>handle_alloc_error(layout)</code></td></tr><tr><td>Count or limit allocations</td><td><code>impl GlobalAlloc wrapping System + #[global_allocator]</code></td></tr><tr><td>A dangling pointer for zero capacity</td><td><code>NonNull::&lt;T&gt;::dangling() LAYERS. core: no heap, no OS (Option, Result, slices, str, fmt, atomics, Layout). alloc: adds a heap (Box, Vec, String, Rc, Arc, BTreeMap, format!). std: re-exports both and adds the OS (files, sockets, threads, Mutex, HashMap, process). A #![no_std] crate uses core, plus extern crate alloc; when an allocator exists. ALLOCATOR CONTRACT (core GlobalAlloc docs): alloc with a zero-sized layout is undefined behaviour; an allocator must not unwind; and you must NOT rely on a source-level allocation actually happening, because the optimiser may remove it. The counts below therefore pass values through black_box, are asserted as lower bounds or "none at all", and describe this build rather than a language guarantee.</code></td></tr></tbody></table>
"""

