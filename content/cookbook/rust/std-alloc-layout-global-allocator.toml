[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>no_std libraries</li><li>allocation budgets in tests</li><li>memory metrics</li><li>arenas and custom containers</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>firmware and WASM crates that avoid std</li><li>"this hot path must not allocate" tests</li><li>per-process allocation metrics</li><li>hand-rolled buffers with special alignment (SIMD, direct I/O)</li></ul>
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>std::mem::size_of</code></li><li><code>std::mem::align_of</code></li><li><code>std::mem::offset_of</code></li><li><code>std::alloc::Layout::new</code></li><li><code>Layout::size</code></li><li><code>Layout::align</code></li></ul>

<ul class="cb-g-names"><li><code>Layout::from_size_align</code></li><li><code>Layout::array</code></li><li><code>Layout::for_value</code></li><li><code>Layout::extend</code></li><li><code>Layout::pad_to_align</code></li><li><code>Layout::align_to</code></li><li><code>Layout::repeat</code></li></ul>

<ul class="cb-g-names"><li><code>Layout::repeat_packed</code></li><li><code>Layout::extend_packed</code></li><li><code>std::alloc::alloc</code></li><li><code>std::alloc::alloc_zeroed</code></li><li><code>std::alloc::realloc</code></li></ul>

<ul class="cb-g-names"><li><code>std::alloc::dealloc</code></li><li><code>std::alloc::handle_alloc_error</code></li><li><code>std::alloc::GlobalAlloc</code></li><li><code>std::alloc::System</code></li><li><code>std::alloc::LayoutError</code></li></ul>

<ul class="cb-g-names"><li><code>std::ptr::NonNull::new</code></li><li><code>std::ptr::NonNull::dangling</code></li><li><code>std::hint::black_box</code></li><li><code>std::mem::size_of_val</code></li></ul>
"""

[[sections]]
heading = "Documentation"
body = """
<ul class="cb-g-reading"><li><a href="https://doc.rust-lang.org/std/alloc/index.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/alloc/index.html</a></li></ul>
