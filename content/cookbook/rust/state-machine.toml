heading = "Where you would use it"
body = """
anything with a lifecycle (job/task/connection states); modelling "can this move from A to B?".
"""

[[sections]]
heading = "Common uses"
body = """
order/payment/job/connection lifecycles: make illegal transitions unrepresentable and testable.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: states are enum variants that **carry** the data valid in that state; `transition(self, event)` consumes the old state and returns the new one (or an error). An exhaustive `match` on `(state, event)` makes every legal move explicit and everything else an error. Terminal states can never be left because no arm leaves them.

Domain here: parcel delivery (not tasks!). Compare with the typestate approach in typestate_builder.
"""
