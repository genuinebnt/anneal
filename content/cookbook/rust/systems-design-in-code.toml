[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>URL shorteners</li><li>API gateways (rate limits)</li><li>Memcached/Redis clusters</li><li>WAL-backed stores</li><li>SQS-style queues</li><li>notification pipelines</li><li>autocomplete</li><li>crawlers</li><li>Kafka-style logs</li><li>job queues</li><li>leases</li><li>Snowflake IDs</li><li>trending lists</li><li>log shippers</li><li>feature flags</li><li>search</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
**How to use a question**: read only the question and **requirements**, say your **numbers** and API aloud, design the core, then read the code. Every core runs on a **virtual clock** (`now: u64`) and a seeded RNG, so each run is identical. The capacity numbers are assumed workloads chosen for practice, not measurements of any real service.

"Disk", "network" and "node" are in-memory stand-ins.
"""

