title = "Serde beyond derive"
module = "Crates and tooling"
module_order = 3
chapter = "Data, text and encoding crates"
chapter_order = 1
order = 114
kind = "recipe"
lede = "Hand-written impls, attributes, borrowing, seeds, and a custom data format"
level = "advanced"
code = ["examples/encoding_compression/serde_custom.rs"]

[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>wire formats</li><li>config schemas</li><li>protocol codecs</li><li>zero-copy parsers</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
five layers of serde control, each asserted: (1) hand-written `Serialize`/`Deserialize` with a `Visitor` for types whose wire form differs from their fields (`"1h30m"`, `"#rrggbb"` or a 3-tuple, a flag set as a list of names);

(2) the attribute toolbox (`with`, `serialize_with`, `flatten`, `untagged`, `tag/content`, `deny_unknown_fields`, `default`, `skip_serializing_if`, `rename_all`, `alias`) including the error messages each one produces; (3) **borrowed** deserialisation (`&str`, `Cow<str>` + `#[serde(borrow)]`) checked by pointer-range;

(4) `DeserializeSeed` for context-dependent parsing (string interning, shape validation); (5) a **complete** custom data format: a `Serializer` and `Deserializer` for a compact self-describing binary format (varint ints, length-prefixed strings, tagged enums) that works with derived impls on nested types.
"""

[[sections]]
heading = "Why it matters"
body = """
serde separates the data **model** (29 types) from the data **format**; once you implement either side by hand you see the whole contract. **How**: the format is &#126;300 lines; the demos round-trip 2000 random values and fuzz malformed input.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>human-friendly config values (durations, colours, sizes)</li><li>versioned protocols with tagged enums</li><li>zero-copy log/record parsing</li><li>interning repeated strings while decoding</li><li>internal RPC/storage codecs (bincode, postcard, rmp-serde are exactly this shape)</li><li>strict validation that reports the offending byte</li></ul>
"""

