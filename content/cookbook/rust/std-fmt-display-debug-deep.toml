[[sections]]
heading = "Not covered"
body = """
UpperExp (same as LowerExp with 'E'), Pointer beyond a shape check (addresses are not deterministic), DebugMap::key_with/value_with, Debug&#42;::entry_with/field_with and Formatter::sign/options (unstable in 1.98.1), `{x?}`-hex forms `{:x?}` shown once.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Left / right / centre in width 8</td><td><code>{:&lt;8}  {:&gt;8}  {:&#94;8}          custom fill: {:*&#94;8}</code></td></tr><tr><td>Width or precision from a variable</td><td><code>{:&gt;w$}  {:.p$}   (positional pair: {:.*} takes precision THEN value)</code></td></tr><tr><td>Zero-pad numbers</td><td><code>{:05}      (after the sign and 0x prefix; overrides fill and align)</code></td></tr><tr><td>Always show the sign</td><td><code>{:+}</code></td></tr><tr><td>Hex / octal / binary / scientific</td><td><code>{:x} {:X} {:o} {:b} {:e}     with prefix: {:#x} {:#010b} (width includes prefix)</code></td></tr><tr><td>Debug / pretty debug / debug with hex</td><td><code>{:?}  {:#?}  {:x?}</code></td></tr><tr><td>Inline variable</td><td><code>{name}  {name:&gt;5}            (identifiers only: no {a.b}, no calls)</code></td></tr><tr><td>Literal braces</td><td><code>{{ }}</code></td></tr><tr><td>Truncate a string to N chars</td><td><code>{:.N}</code></td></tr><tr><td>Make my type honour width/precision</td><td><code>f.pad(..) / f.pad_integral(..) / forward the Formatter</code></td></tr><tr><td>Append into an existing String</td><td><code>use std::fmt::Write; write!(s, ..)</code></td></tr><tr><td>Render lazily without a new type</td><td><code>std::fmt::from_fn(|f| ..)   (since 1.93) RULE (std::fmt docs): a formatting impl returns Err only when the Formatter's writer returned Err. format! and to_string() panic if an impl reports an error of its own.</code></td></tr></tbody></table>
"""

