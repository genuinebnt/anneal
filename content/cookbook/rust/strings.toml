[[sections]]
heading = "Design notes"
body = """
`String` owns a growable UTF-8 buffer. `&str` is a borrowed view (pointer + length) into UTF-8 bytes anywhere. Take `&str` in parameters; return `String` when you build something new.

Indexing by position (`s[0]`) is not allowed because a character may span 1-4 bytes; use `chars()`, `char_indices()` or byte ranges on boundaries. Docs: <https://doc.rust-lang.org/std/primitive.str.html> and <https://doc.rust-lang.org/std/string/struct.String.html>
"""

