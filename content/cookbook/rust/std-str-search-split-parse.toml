[[sections]]
heading = "Where it is defined"
body = """
most `str` methods core (`core::str`); `replace`, `replacen`, `repeat`, `to_lowercase`, `to_uppercase`, `to_ascii_uppercase`/`lowercase` alloc (`alloc::str`; the in-place make_ascii&#95;&#42; are core).
"""

[[sections]]
heading = "Not covered"
body = """
as_bytes_mut / as_mut_ptr / get_unchecked&#42; / from_utf8_unchecked&#42; (unsafe), split_at_unchecked (unsafe), trim_left/trim_right/ trim_left_matches/trim_right_matches (deprecated aliases), is_empty-like trivia, into_string/into_boxed_bytes (Box&lt;str> only, shown in 1021), to_string (ToString), as_ascii/as_ascii_unchecked (nightly), str_from_raw_parts helpers and char_count helpers (unstable or unsafe), split_at_mut_checked / from_utf8_mut (mutable twins of covered calls).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Split "k=v" once</td><td><code>split_once('=') (not split('=').collect::&lt;Vec&lt;_&gt;&gt;()[..])</code></td></tr><tr><td>File extension / last segment</td><td><code>rsplit_once('.')</code></td></tr><tr><td>Remove a known prefix and test it</td><td><code>strip_prefix (clippy::manual_strip)</code></td></tr><tr><td>Split on any whitespace run</td><td><code>split_whitespace (ASCII-only protocol text: split_ascii_whitespace)</code></td></tr><tr><td>Iterate lines of text</td><td><code>lines() (handles &#92;r&#92;n; split('&#92;n') does not)</code></td></tr><tr><td>Trim user input</td><td><code>trim(); trim a char set -&gt; trim_matches(['a','b'])</code></td></tr><tr><td>Does it contain X</td><td><code>contains(pat); where -&gt; find; last -&gt; rfind; all -&gt; match_indices</code></td></tr><tr><td>Case-insensitive ASCII compare</td><td><code>eq_ignore_ascii_case (no allocation)</code></td></tr><tr><td>Unicode case change</td><td><code>to_lowercase / to_uppercase (may change length)</code></td></tr><tr><td>Parse a number/bool</td><td><code>s.trim().parse::&lt;T&gt;() and match the error</code></td></tr><tr><td>Slice without panicking</td><td><code>s.get(a..b) / split_at_checked</code></td></tr><tr><td>Cut at N bytes safely</td><td><code>floor_char_boundary(n)</code></td></tr><tr><td>Count chars not bytes</td><td><code>chars().count() (graphemes need a crate)</code></td></tr><tr><td>Bytes to str</td><td><code>str::from_utf8 (strict) / String::from_utf8_lossy (logs)</code></td></tr><tr><td>Repeat / pad</td><td><code>"-".repeat(n), format!("{:&gt;8}", s)</code></td></tr><tr><td>Keep separators when splitting</td><td><code>split_inclusive</code></td></tr><tr><td>At most N pieces</td><td><code>splitn(n, sep) THE MODEL: a &amp;str is a (pointer, byte length) pair whose bytes are ALWAYS valid UTF-8. Every method that takes or returns a position works in BYTES, not chars. A position that lands inside a multi-byte character is not an Err for slicing, it is a PANIC (&amp;s[a..b]), so the non-panicking family (get, split_at_checked, is_char_boundary, floor_char_boundary) matters. A Pattern (the thing you pass to find/split/trim/...) is one of: char, &amp;str, &amp;String, [char; N], &amp;[char], or a closure</code></td></tr><tr><td>'FnMut(char)</td><td><code>bool'. Searching for a '&amp;str' is substring search; the others are per-char tests.</code></td></tr></tbody></table>
"""

