[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>timeouts</li><li>retries</li><li>metrics</li><li>cache TTLs</li><li>log timestamps</li><li>token expiry</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li><code>Instant</code> for "how long" and deadlines</li><li><code>SystemTime</code> for "what time is it" (persisted or sent to others)</li><li><code>Duration</code> for every timeout argument</li><li>an injected clock for tests</li></ul>
"""

