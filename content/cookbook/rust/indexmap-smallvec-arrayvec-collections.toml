heading = "Crates"
body = """
indexmap = "2", smallvec = "1", arrayvec = "0.7", tinyvec = "1" (alloc), hashbrown = "0.15" (not the newest line), rustc-hash = "2", ahash = "0.8", bitflags = "2", bit-set = "0.11", bitvec = "1"
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Hash map that remembers insertion order</td><td><code>IndexMap (swap_remove: O(1), reorders; shift_remove: O(n), keeps order)</code></td></tr><tr><td>Usually &lt;= N elements, sometimes more</td><td><code>SmallVec&lt;[T; N]&gt; (spills to the heap)</code></td></tr><tr><td>Never more than N, no heap</td><td><code>ArrayVec&lt;T, N&gt; (try_push returns the item back)</code></td></tr><tr><td>Same, without unsafe in the crate</td><td><code>tinyvec (elements need Default)</code></td></tr><tr><td>Look up by &amp;str, own the String only on insert</td><td><code>hashbrown entry_ref</code></td></tr><tr><td>Key stored elsewhere (index into an arena)</td><td><code>hashbrown::HashTable</code></td></tr><tr><td>Set of small dense integers (node ids)</td><td><code>BitSet (set algebra) ; fixed universe &lt;= 64 -&gt; a u64</code></td></tr><tr><td>Individual bits, bit fields in wire formats</td><td><code>bitvec (BitSlice over your own bytes; order is Msb0 or Lsb0)</code></td></tr><tr><td>Trusted integer keys, speed</td><td><code>FxHashMap ; untrusted keys -&gt; std or ahash with random state</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
BitSet memory is proportional to the **largest** element, not to the number of elements; bitvec's Msb0 and Lsb0 number the bits of a byte in opposite directions, and load_be/load_le is a second, independent choice.

SmallVec's inline buffer makes the **value** big (moves cost more, so measure); FxHash has no random seed, so an attacker who chooses keys can force collisions; IndexMap `==` ignores order.
"""

