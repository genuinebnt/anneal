[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>indexmap keeps JSON/TOML key order and gives dense indices to graph nodes</li><li>smallvec is common in compilers</li><li>rustc-hash is the Rust compiler's hasher</li><li>hashbrown is the table behind std's HashMap</li><li>bitflags wraps OS and protocol flags</li></ul>
"""

