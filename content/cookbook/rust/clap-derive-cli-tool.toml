[[sections]]
heading = "Where you would use it"
body = """
any command-line tool that needs help text, validation and shell completion.
"""

[[sections]]
heading = "Common uses"
body = """
cargo-style subcommand tools, ops utilities that read flags with environment fallbacks.
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>clap::Parser::try_parse_from</code></li><li><code>clap::Parser::parse</code></li><li><code>clap::Subcommand</code></li><li><code>clap::Args</code></li><li><code>clap::ValueEnum</code></li><li><code>clap::ArgAction::{Count, Append}</code></li><li><code>#[arg(short, long)]</code></li><li><code>#[arg(env)]</code></li><li><code>#[arg(default_value_t)]</code></li><li><code>#[arg(value_enum)]</code></li><li><code>#[arg(value_parser)]</code></li><li><code>clap::value_parser!</code></li><li><code>#[arg(value_delimiter)]</code></li><li><code>#[arg(num_args)]</code></li><li><code>#[arg(conflicts_with)]</code></li><li><code>#[arg(requires)]</code></li><li><code>#[arg(global)]</code></li><li><code>#[arg(last)]</code></li><li><code>#[command(flatten)]</code></li><li><code>#[command(subcommand)]</code></li><li><code>#[group(required, multiple)]</code></li><li><code>clap::CommandFactory::command</code></li><li><code>Command::render_help</code></li><li><code>Command::render_long_help</code></li><li><code>Command::debug_assert</code></li><li><code>clap::Error::kind</code></li><li><code>clap::Error::exit_code</code></li><li><code>clap::error::ErrorKind</code></li><li><code>ArgMatches::value_source</code></li><li><code>clap::FromArgMatches::from_arg_matches</code></li><li><code>clap_complete::generate</code></li><li><code>clap_complete::Shell</code></li><li><code>#[arg(hide_env_values)]</code></li><li><code>#[arg(required_unless_present)]</code></li><li><code>#[arg(default_value_if)]</code></li><li><code>#[arg(overrides_with)]</code></li><li><code>#[arg(allow_negative_numbers)]</code></li><li><code>#[arg(allow_hyphen_values, trailing_var_arg)]</code></li><li><code>#[command(external_subcommand)]</code></li><li><code>clap::builder::PossibleValuesParser</code></li><li><code>clap::builder::FalseyValueParser</code></li><li><code>clap::Parser::{parse_from, try_update_from}</code></li><li><code>clap::parser::ValueSource</code></li></ul>
"""

