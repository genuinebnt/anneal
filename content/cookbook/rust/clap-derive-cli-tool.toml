[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Flag</td><td><code>bool field              repeatable -vvv   -&gt; u8 with action = ArgAction::Count</code></td></tr><tr><td>Required value</td><td><code>T                       optional          -&gt; Option&lt;T&gt;       list -&gt; Vec&lt;T&gt;</code></td></tr><tr><td>Closed set of words</td><td><code>#[derive(ValueEnum)]    number in a range -&gt; value_parser!(u16).range(1..)</code></td></tr><tr><td>Own syntax (10s, 5m)</td><td><code>value_parser = my_fn  (fn(&amp;str) -&gt; Result&lt;T, String&gt;)</code></td></tr><tr><td>Exactly one of A or B</td><td><code>an ArgGroup with required = true</code></td></tr><tr><td>Test the CLI</td><td><code>Cli::try_parse_from (never parse(): it EXITS the process on error) EXIT CODES: clap uses 2 for usage errors and 0 for --help and --version. Your own failures should use other codes. ENVIRONMENT: env = "NAME" gives the precedence flag &gt; environment &gt; default. Setting a variable in a running process is unsafe in edition 2024 (other threads may be reading the environment), so section environment_fallback instead runs THIS executable again with Command::env: the child gets its own environment before it starts. The same trick shows the real process exit codes of Cli::parse. The in-process asserts assume CB_FERRY_RECIPE_CONFIG is unset in the parent (the name is unique to this recipe).</code></td></tr></tbody></table>
"""

