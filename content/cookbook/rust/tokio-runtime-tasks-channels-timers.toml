[[sections]]
heading = "Design notes"
body = """
**Deterministic time**. `start_paused(true)` (feature test-util, current-thread runtime) freezes the clock. When every task is idle, tokio jumps to the next timer.

Hours of simulated sleeping finish instantly and elapsed times are **exact**.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Many tasks, collect as they finish</td><td><code>JoinSet          fixed few, same task -&gt; join! / try_join!</code></td></tr><tr><td>First of several</td><td><code>select!           give up after d      -&gt; timeout(d, fut)</code></td></tr><tr><td>Work queue</td><td><code>bounded mpsc      one reply            -&gt; oneshot</code></td></tr><tr><td>Every subscriber sees every item</td><td><code>broadcast         latest value only    -&gt; watch</code></td></tr><tr><td>Limit concurrency</td><td><code>Semaphore         stop everything      -&gt; CancellationToken + await the tasks</code></td></tr><tr><td>Blocking or CPU-heavy call</td><td><code>spawn_blocking block_in_place (described): multi-thread runtime only; it runs blocking code on the current worker after moving other tasks away. It panics on a current-thread runtime, and other futures in the SAME task (join!/select!) still stall. STD MUTEX ACROSS .await. Section std_mutex_across_await builds the broken program and proves it is stuck WITHOUT running into the hang: the second future uses try_lock where the real bug calls lock(). clippy: await_holding_lock. CANCELLATION SAFETY. select! DROPS the losing futures. That is fine if a dropped future has lost nothing (mpsc::Receiver::recv) and a bug if it holds partial progress. Section cancellation_safety shows both.</code></td></tr></tbody></table>
"""

