title = "`char` and `u8` ASCII/Unicode methods"
module = "Standard library and core"
module_order = 2
chapter = "Text"
chapter_order = 2
order = 72
kind = "recipe"
lede = "Classification, case, digits, conversions, UTF-16, and byte-level lexers."
level = "simple"
