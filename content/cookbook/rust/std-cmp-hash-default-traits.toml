[[sections]]
heading = "Where it is defined"
body = """
core (`core::cmp`, `core::hash` traits, `core::default`, f64::total_cmp). DefaultHasher/RandomState are std (`std::hash`), HashMap is std, the stable slice sorts `sort`/`sort_by*` are alloc (they allocate), `sort_unstable*` are core. See also <https://doc.rust-lang.org/std/hash/index.html>
"""

[[sections]]
heading = "Not covered"
body = """
cmp::minmax&#42; and Ordering::then_ignore-style helpers (unstable), PartialOrd::lt/le/gt/ge (these are the `< <= > >=` operators), AssertParamIsEq (internal), SipHasher (deprecated), the per-integer Hasher::write_u8.. (provided methods that forward to write by default).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Sort by one cheap key</td><td><code>sort_by_key(|x| x.a)</code></td></tr><tr><td>Sort by an expensive/allocating key</td><td><code>sort_by_cached_key (key computed at most once per element)</code></td></tr><tr><td>Sort by a borrowed field (String)</td><td><code>sort_by(|a, b| a.name.cmp(&amp;b.name))   (sort_by_key cannot return a borrow)</code></td></tr><tr><td>Several columns</td><td><code>a.x.cmp(&amp;b.x).then_with(|| ...)   or a tuple key</code></td></tr><tr><td>One column descending</td><td><code>Reverse(key) inside the tuple, or .reverse() on the Ordering</code></td></tr><tr><td>Don't care about equal-element order</td><td><code>sort_unstable* (no allocation)</code></td></tr><tr><td>Sort floats</td><td><code>sort_by(f64::total_cmp)</code></td></tr><tr><td>Min-heap</td><td><code>BinaryHeap&lt;Reverse&lt;T&gt;&gt;</code></td></tr><tr><td>Keep a value inside bounds</td><td><code>clamp</code></td></tr><tr><td>Custom equality for a map key</td><td><code>impl PartialEq + Eq + Hash so that all three agree (or a normalising newtype)</code></td></tr><tr><td>Reproducible hash within one build</td><td><code>BuildHasherDefault&lt;MyHasher&gt; (never persist DefaultHasher output)</code></td></tr><tr><td>Struct with many optional knobs</td><td><code>#[derive(Default)] + ..Default::default() THE LAWS. Eq: reflexive, symmetric, transitive. Ord must agree with Eq and PartialOrd (a.cmp(b) == Equal iff a == b). Hash: k1 == k2 implies hash(k1) == hash(k2). The compiler checks none of this; breaking it is not undefined behaviour, but maps and sorts then give wrong answers, and sorting with a broken total order may panic.</code></td></tr></tbody></table>
"""

