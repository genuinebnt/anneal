[[sections]]
heading = "Design notes"
body = """
Pattern: `struct StopId(u32)` costs nothing at runtime but a `LineId` can no longer be passed where a `StopId` is expected. Typed indices into a `Vec` are how Rust graphs usually work. Real code: petgraph's `NodeIndex` -> <https://docs.rs/petgraph/latest/petgraph/graph/struct.NodeIndex.html>

```text
API Guidelines C-NEWTYPE -> https://rust-lang.github.io/api-guidelines/type-safety.html
```
"""

