[[sections]]
heading = "Where it is defined"
body = """
alloc: `BTreeMap`, `BTreeSet`, `BinaryHeap` (`alloc::collections`; std re-exports them, so they work in no_std + alloc). core: `Ord`, `Ordering`, `Reverse` (`core::cmp`), `Bound` (`core::ops`), `f64::total_cmp`.
"""

[[sections]]
heading = "Not covered"
body = """
BTreeMap cursors (`lower_bound`, `upper_bound`, `CursorMut`), `try_insert`, BTreeSet `entry`/`get_or_insert_with`, `BinaryHeap::{pop_if, drain_sorted, into_iter_sorted}`, `PeekMut::refresh` (all unstable in 1.98.1; `range` with `Bound` replaces most cursor uses).

Third-party structures (indexmap, priority-queue with decrease-key, interval trees) are out of scope for a std tour.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Iterate keys in sorted order</td><td><code>BTreeMap (no extra sort)</code></td></tr><tr><td>Last entry at or before k (floor)</td><td><code>m.range(..=k).next_back()</code></td></tr><tr><td>First entry at or after k (ceiling)</td><td><code>m.range(k..).next()</code></td></tr><tr><td>Strictly after k</td><td><code>m.range((Bound::Excluded(k), Bound::Unbounded))</code></td></tr><tr><td>Smallest / largest</td><td><code>first_key_value / last_key_value; remove: pop_first / pop_last</code></td></tr><tr><td>Expire everything older than t</td><td><code>let keep = m.split_off(&amp;t); (old stays in m)  or extract_if(..t, |_,_| true).for_each(drop) (extract_if is lazy: without for_each it removes nothing)</code></td></tr><tr><td>Merge two maps (right wins)</td><td><code>a.append(&amp;mut b)</code></td></tr><tr><td>Max-priority queue</td><td><code>BinaryHeap</code></td></tr><tr><td>Min-priority queue</td><td><code>BinaryHeap&lt;Reverse&lt;T&gt;&gt;</code></td></tr><tr><td>Fix up / replace the top in one sift</td><td><code>peek_mut() (mutate through it, or PeekMut::pop)</code></td></tr><tr><td>Top-k of a stream in O(n log k)</td><td><code>min-heap of size k: BinaryHeap&lt;Reverse&lt;T&gt;&gt;</code></td></tr><tr><td>Order floats</td><td><code>a newtype whose Ord calls total_cmp</code></td></tr><tr><td>Need remove-arbitrary or update-priority</td><td><code>BTreeSet&lt;(priority, id)&gt;; or heap + lazy deletion</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
`range` **panics** if start > end (or start == end with both excluded); heap order among **equal** elements is unspecified (add a sequence number); `BinaryHeap::iter` is **not** sorted; changing a key's order while it is inside a collection (via Cell/atomics) is a logic error (wrong results, not UB).
"""

