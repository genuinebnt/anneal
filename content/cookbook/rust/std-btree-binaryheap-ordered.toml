ce</code></li><li><code>BinaryHeap::append</code></li><li><code>BinaryHeap::extend</code></li><li><code>BinaryHeap::drain</code></li><li><code>BinaryHeap::retain</code></li><li><code>std::cmp::Reverse</code></li><li><code>std::cmp::Ordering::then_with</code></li><li><code>Ord</code></li><li><code>f64::total_cmp</code></li><li><code>std::ops::Bound</code></li></ul>
