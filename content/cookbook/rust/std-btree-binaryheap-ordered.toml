heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>"latest value at or before t" (<code>range(..=t).next_back()</code>)</li><li>expiring entries in time order</li><li>interval lookup</li><li>timer queues</li><li>Dijkstra</li><li>top-k</li></ul>
"""

