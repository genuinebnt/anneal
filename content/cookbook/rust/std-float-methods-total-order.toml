[[sections]]
heading = "Where it is defined"
body = """
core: abs, signum, copysign, min, max, clamp, midpoint, total_cmp, classification, bit/byte access, to_degrees, to_radians, recip, next_up/down, constants, Duration.

**Std only** in 1.98.1 (the core versions are unstable "float math in core"): floor, ceil, round, round_ties_even, trunc, fract, sqrt, cbrt, powi, powf, exp, ln, log&#42;, hypot, trig, mul_add, rem_euclid. So no_std code cannot call those without a maths crate.
"""

[[sections]]
heading = "Not covered"
body = """
parse/format round trips (see std_num_parsing_formatting section 7), hyperbolic and inverse trig (same shape), exp2, div_euclid, the little/native-endian byte forms, algebraic&#95;&#42; (1.98, permits reordering so results are not reproducible), abs_sub (deprecated), f16/f128, gamma/erf/maximum/minimum (unstable), to_int_unchecked (unsafe).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Round half away from zero / half to even</td><td><code>round() / round_ties_even()</code></td></tr><tr><td>Toward -inf / +inf / zero</td><td><code>floor() / ceil() / trunc()</code></td></tr><tr><td>Compare for sorting</td><td><code>total_cmp</code></td></tr><tr><td>Keep inside bounds</td><td><code>clamp(lo, hi)        (NaN stays NaN!)</code></td></tr><tr><td>Check input is a usable number</td><td><code>is_finite()</code></td></tr><tr><td>Approximately equal</td><td><code>|a-b| &lt;= max(abs_tol, rel_tol * max(|a|,|b|))</code></td></tr><tr><td>Distance without overflow</td><td><code>dx.hypot(dy)</code></td></tr><tr><td>Angle of a vector</td><td><code>y.atan2(x)           (note the argument order)</code></td></tr><tr><td>Wrap an angle into 0..360</td><td><code>rem_euclid(360.0)</code></td></tr><tr><td>Average two values without overflow</td><td><code>midpoint</code></td></tr><tr><td>Exact bit identity / hashing</td><td><code>to_bits</code></td></tr><tr><td>Seconds &lt;</td><td><code>Duration                       -&gt; as_secs_f64 / try_from_secs_f64 PRECISION (std docs): sqrt is correctly rounded. Transcendental functions and powi have "unspecified precision" that may vary by platform, Rust version and even between calls, so every assert on them here uses a tolerance.</code></td></tr></tbody></table>
"""

