[[sections]]
heading = "Design notes"
body = """
`unsafe` does **not** turn off the borrow checker. It unlocks exactly five things the compiler cannot verify:

1. dereference a raw pointer (`*const T`, `*mut T`)      2. call an `unsafe fn` (or extern fn)
3. access/modify a `static mut`                          4. implement an `unsafe trait` (Send, Sync, ...)
5. read a field of a `union`. The discipline: keep `unsafe` blocks tiny, put the proof in a `// SAFETY:` comment, document caller duties of `unsafe fn` under `# Safety`, and wrap everything in a **safe** function whose assertions make misuse impossible (or a panic). Soundness rule: safe code must never be able to trigger UB through your API.

   `static mut` is discouraged: any access can race, and in edition 2024 taking `&`/`&mut` to it is a deny-by-default lint. Prefer `AtomicUsize`, `OnceLock`, `Mutex`, or thread_local.

   Testing unsafe: (a) boundary cases (0, 1, len), (b) drop counters to prove no leak / double drop, (c) run under Miri, which detects UB (out-of-bounds, aliasing violations, uninit reads, leaks): rustup +nightly component add miri &amp;&amp; cargo +nightly miri run --example unsafe_basics (Miri is not installed in this environment; the command is documentation only.)
"""

