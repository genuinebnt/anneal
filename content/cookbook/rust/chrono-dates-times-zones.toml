[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>billing periods</li><li>schedulers</li><li>log/event timestamps</li><li>report windows</li><li>APIs that exchange RFC 3339</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>storing <code>DateTime&lt;Utc&gt;</code> in databases</li><li>rendering local times for users</li><li>business-day SLAs</li><li>cron-like recurring jobs</li><li>age/anniversary maths</li><li>JSON APIs (serde)</li><li>parsing log timestamps in odd formats</li></ul>
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>NaiveDate::from_ymd_opt</code></li><li><code>NaiveDate::checked_add_months</code></li><li><code>NaiveDate::checked_add_days</code></li><li><code>NaiveDate::weekday</code></li><li><code>NaiveDate::iso_week</code></li><li><code>NaiveDate::signed_duration_since</code></li><li><code>NaiveDate::succ_opt</code></li><li><code>NaiveDate::with_day</code></li><li><code>NaiveTime::from_hms_opt</code></li><li><code>NaiveDateTime::and_utc</code></li><li><code>NaiveDate::and_hms_opt</code></li><li><code>DateTime::parse_from_rfc3339</code></li><li><code>DateTime::parse_from_rfc2822</code></li><li><code>DateTime::to_rfc3339</code></li><li><code>DateTime::with_timezone</code></li><li><code>DateTime::timestamp</code></li><li><code>DateTime::from_timestamp</code></li><li><code>Utc::now</code></li><li><code>Utc::with_ymd_and_hms</code></li><li><code>TimeZone::from_local_datetime</code></li><li><code>LocalResult</code></li><li><code>Duration::hours</code></li><li><code>TimeDelta::num_minutes</code></li><li><code>NaiveDateTime::parse_from_str</code></li><li><code>format</code></li><li><code>Datelike::month</code></li><li><code>Timelike::hour</code></li><li><code>FixedOffset::east_opt</code></li><li><code>Months</code></li><li><code>Weekday::succ</code></li><li><code>DateTime::signed_duration_since</code></li><li><code>DurationRound::duration_trunc</code></li></ul>
"""

[[sections]]
heading = "Documentation"
body = """
<ul class="cb-g-reading"><li><a href="https://docs.rs/chrono/0.4/chrono/" target="_blank" rel="noreferrer">https://docs.rs/chrono/0.4/chrono/</a></li></ul>
