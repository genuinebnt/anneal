[[sections]]
heading = "Crates"
body = """
chrono = "0.4" (0.4.45 is current; this chapter pins &#94;0.4), chrono-tz = "0.10"
"""

[[sections]]
heading = "Not covered"
body = """
`Local` assertions (machine dependent; only constructed), `NaiveWeek` details, deprecated `Duration::seconds` family panics, `serde::ts_*` helpers beyond one example.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Store an instant</td><td><code>DateTime&lt;Utc&gt; (or i64 epoch seconds); convert at the edge</code></td></tr><tr><td>A calendar date without a zone</td><td><code>NaiveDate (birthday, due date, billing day)</code></td></tr><tr><td>Parse "2024-03-05T10:00:00+02:00"</td><td><code>DateTime::parse_from_rfc3339 (keeps the offset: DateTime&lt;FixedOffset&gt;)</code></td></tr><tr><td>Parse a custom log format</td><td><code>NaiveDateTime::parse_from_str(s, "%d/%b/%Y:%H:%M:%S") then .and_utc()</code></td></tr><tr><td>Add 1 month safely</td><td><code>date.checked_add_months(Months::new(1)) (clamps Jan 31 -&gt; Feb 28/29)</code></td></tr><tr><td>Add 24h vs "same time tomorrow"</td><td><code>Duration::hours(24) on UTC vs add Days on the LOCAL naive time</code></td></tr><tr><td>Difference between two instants</td><td><code>a.signed_duration_since(b) -&gt; TimeDelta, then num_seconds()/num_days()</code></td></tr><tr><td>Weekday / ISO week</td><td><code>date.weekday(), date.iso_week().week()</code></td></tr><tr><td>Convert zone</td><td><code>dt.with_timezone(&amp;Tz) (never re-interpret the wall clock!)</code></td></tr><tr><td>A local wall time in a real zone</td><td><code>tz.from_local_datetime(&amp;naive) -&gt; LocalResult (None in gaps, Ambiguous in overlaps)</code></td></tr><tr><td>Epoch seconds -&gt; instant</td><td><code>DateTime::from_timestamp(secs, nanos) -&gt; Option</code></td></tr><tr><td>Round to the hour/day</td><td><code>DurationRound::duration_trunc / DateTime::date_naive</code></td></tr><tr><td>First/last day of month</td><td><code>with_day(1) ; next month first day minus 1 day</code></td></tr><tr><td>JSON</td><td><code>chrono's serde feature: RFC 3339 strings; ts_seconds for numbers</code></td></tr></tbody></table>
"""

