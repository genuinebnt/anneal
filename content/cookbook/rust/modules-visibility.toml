[[sections]]
heading = "Design notes"
body = """
Everything is private by default. `pub` exposes to the world, `pub(crate)` to the whole crate, `pub(super)` to the parent module. Private **fields** + a constructor that validates = a type that can never hold an invalid value.

Re-export with `pub use` so users import `engine::Workflow` instead of `engine::model::workflow::Workflow`.

Real layout for a project (files, not inline):

```text
src/lib.rs        pub mod model; pub mod graph; pub use model::Workflow;
src/model.rs      (or src/model/mod.rs)       src/graph.rs
```

src/main.rs       thin: parse args, call the library, map errors to exit codes tests/            black-box tests of the public API only Study how big crates organise: <https://github.com/BurntSushi/ripgrep/tree/master/crates> and <https://rust-lang.github.io/api-guidelines/> (naming, organisation)
"""

