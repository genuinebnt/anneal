[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>state machines behind <code>&amp;mut self</code></li><li>linked structures</li><li>buffer reuse</li><li>layout checks</li><li>careful unsafe code</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>move a field out of <code>&amp;mut self</code> and put something back</li><li>flush a batch with <code>mem::take</code></li><li>double buffering</li><li>compare enum variants</li><li>initialise an array element by element</li></ul>
"""

