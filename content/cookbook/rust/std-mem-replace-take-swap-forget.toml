heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>std::mem::take</code></li><li><code>std::mem::replace</code></li><li><code>std::mem::swap</code></li><li><code>std::mem::drop</code></li><li><code>std::mem::forget</code></li><li><code>std::mem::size_of</code></li><li><code>std::mem::size_of_val</code></li><li><code>std::mem::align_of</code></li><li><code>std::mem::align_of_val</code></li><li><code>std::mem::needs_drop</code></li><li><code>std::mem::discriminant</code></li><li><code>std::mem::offset_of!</code></li><li><code>std::mem::zeroed</code></li><li><code>std::mem::ManuallyDrop::new</code></li><li><code>ManuallyDrop::into_inner</code></li><li><code>ManuallyDrop::drop</code></li><li><code>std::mem::MaybeUninit::uninit</code></li><li><code>MaybeUninit::new</code></li><li><code>MaybeUninit::zeroed</code></li><li><code>MaybeUninit::write</code></li><li><code>MaybeUninit::as_ptr</code></li><li><code>MaybeUninit::as_mut_ptr</code></li><li><code>MaybeUninit::assume_init</code></li><li><code>MaybeUninit::assume_init_ref</code></li><li><code>MaybeUninit::assume_init_drop</code></li><li><code>Option::take</code></li><li><code>Option::replace</code></li><li><code>Vec::swap_remove</code></li><li><code>Box::leak</code></li></ul>
"""

