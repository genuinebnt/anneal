[[sections]]
heading = "Where it is defined"
body = """
core: all of `std::mem` is `core::mem` re-exported, including `ManuallyDrop` and `MaybeUninit`. `size_of`, `size_of_val`, `align_of`, `align_of_val` and `drop` are also in the prelude. alloc: `Box::leak`, `Vec::swap_remove`.
"""

[[sections]]
heading = "Not covered"
body = """
`transmute` and `transmute_copy` (deliberately: use `to_bits`, `from_le_bytes`, pointer casts; see Nomicon), `variant_count`, `MaybeUninit` array helpers (`array_assume_init`, `transpose`), `std::array::try_from_fn` (unstable in 1.98.1); `Pin` (see the pin recipes). **Unsafe**: every block states why it is sound.

This file asserts behaviour on the paths it runs; it does not **prove** soundness. MIRI: run on 2026-11-26 with rustc 1.100.0-nightly (5a2be9f5f 2026-09-06) and `-Zmiri-ignore-leaks` (the file leaks **on purpose** with forget and Box::leak): no undefined behaviour under Stacked Borrows or Tree Borrows on the executed paths (smaller loops under `cfg(miri)`).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Move out of <code>&amp;mut</code> and leave the default</td><td><code>mem::take(&amp;mut self.items) (needs Default; no allocation for Vec/String)</code></td></tr><tr><td>Move out and leave a specific value</td><td><code>mem::replace(&amp;mut self.state, State::Idle)</code></td></tr><tr><td>Same for an Option</td><td><code>opt.take() / opt.replace(v)</code></td></tr><tr><td>Exchange two places</td><td><code>mem::swap(&amp;mut a, &amp;mut b); two items of ONE slice: slice.swap(i, j)</code></td></tr><tr><td>End a borrow or release a lock early</td><td><code>drop(guard) (a no-op for Copy values and references)</code></td></tr><tr><td>Hand ownership to C or a raw pointer</td><td><code>Box::into_raw / Vec::leak / ManuallyDrop, NOT forget after reading a pointer</code></td></tr><tr><td>"which variant is this" without the data</td><td><code>mem::discriminant(&amp;a) == mem::discriminant(&amp;b)</code></td></tr><tr><td>Layout assertions for FFI / file formats</td><td><code>#[repr(C)] + size_of, align_of, offset_of! in a const _: () = assert!(..)</code></td></tr><tr><td>Skip drop bookkeeping in generic code</td><td><code>needs_drop::&lt;T&gt;()</code></td></tr><tr><td>Delay or reorder a destructor</td><td><code>ManuallyDrop&lt;T&gt;</code></td></tr><tr><td>Build <code>[T; N]</code> safely</td><td><code>std::array::from_fn first; MaybeUninit only when it cannot express the need KEY FACT: leaking is SAFE (forget, Rc cycles, Box::leak). So unsafe code must never rely on a destructor running for memory safety.</code></td></tr></tbody></table>
"""

