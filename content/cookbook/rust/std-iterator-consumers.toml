[[sections]]
heading = "Where it is defined"
body = """
core: `Iterator`, `DoubleEndedIterator`, `ExactSizeIterator`, `FromIterator`, `Extend`, `Sum`, `Product` live in `core::iter` (std re-exports them). The `collect` **target** impls live with the type: `Vec`, `String`, `VecDeque`, `BTreeMap`, `Box<[T]>` in alloc; `HashMap`/`HashSet` in std.
"""

