[[sections]]
heading = "Not covered"
body = """
Iterator::try_reduce, Iterator::try_collect, Iterator::collect_into, Iterator::partition_in_place, Iterator::is_partitioned, Iterator::array_chunks, Iterator::intersperse, Iterator::map_windows, Iterator::cmp_by (all unstable in 1.98; probed with rustc); adapters live in std_iterator_adapters_lazy.
"""

[[sections]]
heading = "Design notes"
body = """
Cheat sheet (I want to ... -> use ...): count items                         -> `count()` (consumes; use `len()` on ExactSize instead when you can) total / product                     -> `sum::<T>()` / `product::<T>()`  (annotate the type!)

```text
biggest / smallest                  -> `max()` / `min()`; by a key: `max_by_key`; floats: `max_by(|a,b| a.total_cmp(b))`
```

custom accumulate                   -> `fold(init, |acc, x| ..)`; no init value: `reduce` stop early on error                 -> `try_fold` / `try_for_each` (or `collect::<Result<_,_>>()`) does any / every item match         -> `any` / `all` (short-circuit)

```text
first match / its index             -> `find` / `position`; last index: `rposition`; first Some(map): `find_map`
```

validate every item                 -> `collect::<Result<Vec<_>, E>>()` (first Err wins) skip the failures                   -> `filter_map(Result::ok)` or `flatten()` split in two by predicate           -> `partition` split pairs into two Vecs           -> `unzip` to a map / set / string / deque     -> `collect::<HashMap<_,_>>()`, `BTreeSet`, `String`, `VecDeque` compare two sequences               -> `eq`, `cmp`, `lt` (lexicographic)

```text
is it sorted                        -> `is_sorted()` / `is_sorted_by_key`
```

last / nth element                  -> `last()` (walks everything!) / `nth(n)`; from the back: `next_back`, `nth_back` sum Options / Results               -> `sum::<Option<i32>>()` (None if any None) reason about length                 -> `size_hint()` (lower, Some(upper)); `ExactSizeIterator::len`
"""

