[[sections]]
heading = "Where you would use it"
body = """
`main`/CLI/glue code where you only need to **report** an error well (libraries use thiserror, error_enum).
"""

[[sections]]
heading = "Common uses"
body = """
application glue code and CLIs: add context at each layer, report the whole chain.
"""

[[sections]]
heading = "Design notes"
body = """
`anyhow::Result<T>` = `Result<T, anyhow::Error>`: any error type converts with `?`, and `.context("what I was doing")` stacks a human explanation on top. Print with `{:#}` for the whole chain on one line, `{:?}` for a multi-line report. `bail!` returns an error early; `ensure!` is assert-as-error; `downcast_ref::<T>()` recovers the original type.

Real use: ripgrep's main <https://github.com/BurntSushi/ripgrep/blob/master/crates/core/main.rs>
"""

