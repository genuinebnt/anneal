[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Scratch directory for a test</td><td><code>tempfile::tempdir()  (deleted on drop; keep the guard ALIVE)</code></td></tr><tr><td>Replace a file atomically</td><td><code>NamedTempFile::new_in(SAME directory) -&gt; write -&gt; sync_all -&gt; persist</code></td></tr><tr><td>Walk everything</td><td><code>WalkDir (yields Result: permission errors do not stop the walk)</code></td></tr><tr><td>Prune subtrees</td><td><code>filter_entry (Iterator::filter only hides, it still descends)</code></td></tr><tr><td>Walk like a developer tool</td><td><code>ignore::WalkBuilder (.gitignore, hidden files)</code></td></tr><tr><td>Many globs against one path</td><td><code>GlobSet ; literal text inside a glob -&gt; globset::escape</code></td></tr><tr><td>"only Rust files" (like rg -t rust)</td><td><code>ignore::types::TypesBuilder</code></td></tr><tr><td>Use every core while walking</td><td><code>build_parallel().run(..)  (no ordering guarantee)</code></td></tr><tr><td>Hand a temp file name to another tool</td><td><code>into_temp_path() (handle closed, still deleted on drop)</code></td></tr><tr><td>User directories</td><td><code>dirs::config_dir() and friends (platform specific, Option) FS HELPERS: fs_extra-style recursive copy is about fifteen lines with walkdir (copy_tree below). WATCHING: file watching crates are out of scope; the polling snapshot at the end shows the portable fallback. PLATFORM: the symlink sections are compiled only on Unix.</code></td></tr></tbody></table>
"""

