[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>API payloads</li><li>config files</li><li>event logs</li><li>anything that must evolve its schema without breaking readers</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>REST/JSON APIs</li><li>Kubernetes-style tagged objects</li><li>event sourcing envelopes</li><li>config with defaults</li><li>forwarding unparsed JSON (RawValue)</li><li>NDJSON log pipelines</li></ul>
"""

[[sections]]
heading = "Methods"
body = """
<ul class="cb-g-names"><li><code>serde::Serialize</code></li><li><code>serde::Deserialize</code></li><li><code>#[serde(rename)]</code></li><li><code>#[serde(rename_all)]</code></li><li><code>#[serde(alias)]</code></li><li><code>#[serde(default)]</code></li><li><code>#[serde(skip)]</code></li><li><code>#[serde(skip_serializing_if)]</code></li><li><code>#[serde(flatten)]</code></li><li><code>#[serde(with)]</code></li><li><code>#[serde(serialize_with)]</code></li><li><code>#[serde(deserialize_with)]</code></li><li><code>#[serde(borrow)]</code></li><li><code>#[serde(bound)]</code></li><li><code>#[serde(transparent)]</code></li><li><code>#[serde(from)]</code></li><li><code>#[serde(into)]</code></li><li><code>#[serde(try_from)]</code></li><li><code>#[serde(deny_unknown_fields)]</code></li><li><code>#[serde(tag)]</code></li><li><code>#[serde(content)]</code></li><li><code>#[serde(untagged)]</code></li><li><code>serde_json::to_string</code></li><li><code>serde_json::from_str</code></li><li><code>serde_json::to_value</code></li><li><code>serde_json::from_value</code></li><li><code>serde_json::json</code></li><li><code>serde_json::Value::pointer</code></li><li><code>serde_json::Value::get</code></li><li><code>serde_json::Value::as_str</code></li><li><code>serde_json::value::RawValue</code></li><li><code>serde_json::Deserializer::from_str</code></li><li><code>serde_json::StreamDeserializer</code></li><li><code>serde::de::Visitor</code></li><li><code>serde_json::Error::line</code></li><li><code>serde_json::Error::column</code></li><li><code>serde_json::Error::classify</code></li></ul>
"""

