serde = "1" (1.0.229 current), serde_json = "1" (1.0.154 current, feature raw_value)
"""

[[sections]]
heading = "Not covered"
body = """
hand-written Serializer/Deserializer formats (see examples/encoding_compression/serde_custom.rs), `serde_with` (external crate), `#[serde(getter)]`/remote derive (rare).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Snake_case JSON keys from camelCase</td><td><code>#[serde(rename_all = "camelCase")]  (container) ; #[serde(rename = "x")] (field)</code></td></tr><tr><td>Accept old names too</td><td><code>#[serde(alias = "old")]</code></td></tr><tr><td>Missing field gets a value</td><td><code>#[serde(default)] / #[serde(default = "path::fn")]</code></td></tr><tr><td>Omit None / empty on output</td><td><code>#[serde(skip_serializing_if = "Option::is_none")]</code></td></tr><tr><td>Reject typos in config</td><td><code>#[serde(deny_unknown_fields)]  (NOT with flatten!)</code></td></tr><tr><td>Merge a nested struct's keys</td><td><code>#[serde(flatten)]  ; capture extras -&gt; flatten a HashMap&lt;String, Value&gt;</code></td></tr><tr><td>Newtype ID serialised as inner</td><td><code>#[serde(transparent)]</code></td></tr><tr><td>Validate while deserialising</td><td><code>#[serde(try_from = "Raw")]</code></td></tr><tr><td>Tagged union, readable</td><td><code>#[serde(tag = "type")] (internal) ; adjacent = tag + content ; untagged = try each in order</code></td></tr><tr><td>Custom string&lt;-&gt;type</td><td><code>#[serde(with = "module")] or serialize_with/deserialize_with</code></td></tr><tr><td>Avoid allocating</td><td><code>&amp;str fields, or #[serde(borrow)] on Cow&lt;str&gt;, + from_str/from_slice (from_reader requires an owned type)</code></td></tr><tr><td>Pass through unparsed JSON</td><td><code>Box&lt;RawValue&gt;</code></td></tr><tr><td>Process a stream of JSON docs</td><td><code>Deserializer::from_str(s).into_iter::&lt;T&gt;()</code></td></tr><tr><td>Explore unknown JSON</td><td><code>serde_json::Value + .pointer("/a/0/b")</code></td></tr><tr><td>Error position</td><td><code>err.line(), err.column(), err.classify()</code></td></tr></tbody></table>
"""

