[[sections]]
heading = "Where it is defined"
body = """
core: the address types `IpAddr`, `Ipv4Addr`, `Ipv6Addr`, `SocketAddr`, `SocketAddrV4/V6`, `AddrParseError` (`core::net`, re-exported by std). std: `TcpListener`, `TcpStream`, `UdpSocket`, `ToSocketAddrs`, `Shutdown` (they need an OS). std has no TLS, HTTP or async networking.
"""

[[sections]]
heading = "Not covered"
body = """
`is_global`, `is_documentation` for IPv6, `is_shared`, `set_linger`, `set_quickack` (unstable or Linux only); multicast joins (needs a multicast-capable interface); DNS lookups and any non-loopback traffic (this file never leaves 127.0.0.1/::1); socket options std lacks (use `socket2`).

Beyond `tcp_framed_server` (one framed server): this file is the API look-up page. Only the macOS build was run when this was written.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Parse "1.2.3.4:80" / "[::1]:80"</td><td><code>s.parse::&lt;SocketAddr&gt;() (never resolves names)</code></td></tr><tr><td>Accept "localhost:80" or ("host", 80)</td><td><code>to_socket_addrs()? (may do blocking DNS; may return several addresses: try each)</code></td></tr><tr><td>A free port in a test</td><td><code>bind "127.0.0.1:0", then local_addr()</code></td></tr><tr><td>Avoid hanging on a silent peer</td><td><code>set_read_timeout(Some(d)) and set_write_timeout; connect: connect_timeout</code></td></tr><tr><td>Recognise a timeout portably</td><td><code>matches!(e.kind(), WouldBlock | TimedOut) (unix and Windows differ)</code></td></tr><tr><td>Tell the peer "I am done sending"</td><td><code>shutdown(Shutdown::Write); you can still read the reply</code></td></tr><tr><td>Read and write from two threads</td><td><code>try_clone() (same socket: shutdown and timeouts affect both)</code></td></tr><tr><td>Read one whole message</td><td><code>frame it: length prefix + read_exact, or delimiter + BufReader; ALWAYS cap the size</code></td></tr><tr><td>Small request/response latency</td><td><code>one write_all per message and/or set_nodelay(true)</code></td></tr><tr><td>Stop a blocking accept loop</td><td><code>set a flag, then connect to yourself to wake it; or non-blocking accept + poll</code></td></tr><tr><td>Block internal targets (SSRF)</td><td><code>call to_canonical() first, then check every range on the resolved IP you will connect to</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
TCP is a byte stream: one `write` is not one `read`. `set_read_timeout(Some(ZERO))` is an error. A UDP datagram longer than the buffer is truncated (some platforms report an error instead).

On Apple/BSD an accepted socket inherits the listener's non-blocking flag (Linux does not): always set the mode you want on the accepted stream.
"""

