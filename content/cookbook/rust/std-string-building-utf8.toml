[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>report/CSV/SQL/log builders</li><li>template output</li><li>protocol encoders</li><li>anything that assembles text in a hot path</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>building HTTP responses and log lines without reallocating</li><li>JSON/CSV writers</li><li>code generators</li><li>text editors (insert/remove/replace_range)</li><li>choosing Box&lt;str&gt;/Rc&lt;str&gt;/Cow&lt;str&gt; for interned or shared text</li><li>validating and decoding UTF-8 from sockets</li></ul>
"""

