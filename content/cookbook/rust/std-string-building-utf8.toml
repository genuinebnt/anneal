[[sections]]
heading = "Not covered"
body = """
from_utf8_unchecked / as_mut_vec / from_raw_parts / into_raw_parts (unsafe), from_utf16_lossy (analogue of from_utf8_lossy), into_chars / remove_matches / from_utf8_lossy_owned (unstable in 1.98.1), try_reserve_exact (twin of try_reserve), from_utf16le / from_utf16be and their &#95;lossy forms (since 1.98; byte-slice versions of from_utf16), clone_from (trait), Deref-provided str methods (see std_str_search_split_parse).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Build a string of known size</td><td><code>String::with_capacity(n) then push_str</code></td></tr><tr><td>Append text / one char</td><td><code>push_str(&amp;str) / push(char)</code></td></tr><tr><td>Append formatted text, no temp</td><td><code>write!(s, "{x}") with use std::fmt::Write (clippy::format_push_string)</code></td></tr><tr><td>Join many pieces</td><td><code>parts.join(sep) / parts.concat()</code></td></tr><tr><td>Insert in the middle</td><td><code>insert(i, c) / insert_str(i, s) (O(n) shift; i is a byte index on a boundary)</code></td></tr><tr><td>Remove one char by byte index</td><td><code>remove(i) ; last char -&gt; pop()</code></td></tr><tr><td>Filter characters in place</td><td><code>retain(|c| ...)</code></td></tr><tr><td>Cut the tail</td><td><code>truncate(n) ; take the tail -&gt; split_off(n)</code></td></tr><tr><td>Remove a range and iterate it</td><td><code>drain(a..b) ; replace a range -&gt; replace_range(a..b, "x")</code></td></tr><tr><td>Bytes &lt;</td><td><code>String                   -&gt; String::from_utf8(vec) / into_bytes()</code></td></tr><tr><td>Shrink a long-lived string</td><td><code>into_boxed_str() / shrink_to_fit()</code></td></tr><tr><td>A read-only shared string</td><td><code>Rc&lt;str&gt; / Arc&lt;str&gt;; maybe-owned -&gt; Cow&lt;str&gt;</code></td></tr><tr><td>How many bytes does a char take</td><td><code>c.len_utf8() ; write it -&gt; c.encode_utf8(&amp;mut buf)</code></td></tr><tr><td>Reuse a buffer across iterations</td><td><code>buf.clear() (keeps capacity) instead of String::new() WHAT TO KNOW: a String is Vec&lt;u8&gt; guaranteed UTF-8: (ptr, len, capacity). Growth is amortised (capacity at least doubles) so N pushes cost O(N) total with O(log N) allocations. Positions are BYTE indices and must be char boundaries or the call panics. The counting global allocator below makes allocation counts an assertion instead of a guess.</code></td></tr></tbody></table>
"""

