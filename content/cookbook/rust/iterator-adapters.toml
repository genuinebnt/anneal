[[sections]]
heading = "Design notes"
body = """
Iterators are **lazy**: adapters (`map`, `filter`...) do nothing until a consumer (`collect`, `sum`, `for`, `next`) pulls items. The compiler usually optimises chains to the same machine code as a hand-written loop.
"""

