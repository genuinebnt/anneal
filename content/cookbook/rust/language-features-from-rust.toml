heading = "Overview"
body = """
<p class="cb-g-deep"><b>Deep dives</b> <a href="/cookbook/p/hindley-milner-type-inference">2 · Hindley–Milner</a> <a href="/cookbook/p/bidirectional-typing-and-dependent-types">3 · Bidirectional and dependent</a> <a href="/cookbook/p/pattern-matching-compilation-and-exhaustiveness">4 · Pattern matching</a> <a href="/cookbook/p/name-resolution-hygiene-and-modules">8 · Names, hygiene, modules</a> <a href="/cookbook/p/effects-async-and-memory-models">25 · Effects and memory models</a> <a href="/cookbook/p/metaprogramming-macros-and-staging">26 · Metaprogramming</a> <a href="/cookbook/p/implementing-rust-s-hardest-features">15 · Rust's hard features</a></p>

<div class="cb-g-tt"><table class="cb-g-cmp"> <thead><tr><th>Feature</th><th>How compilers implement it</th><th>In rustc</th><th>Try it in your Lox</th></tr></thead> <tbody> <tr><td>Enums and <code>match</code></td><td>Tagged unions. Patterns compile to decision trees (Maranget). Exhaustiveness checking uses the “usefulness” algorithm. Layout can hide the tag in invalid bit patterns, which is the niche optimization behind <code>Option&lt;&amp;T&gt;</code></td><td><code>rustc_pattern_analysis</code>, <code>rustc_abi</code> layout</td><td>Add <code>enum</code> and <code>match</code> to typed Lox, compile to jumps in clox, and report non-exhaustive matches</td></tr> <tr><td>Type inference</td><td>Hindley–Milner: create type variables, unify with union-find, generalize at <code>let</code>. Bidirectional checking handles annotations and subtyping</td><td>Inference variables in <code>rustc_infer</code>, unification with the <code>ena</code> crate</td><td>Algorithm W over the slice-7 AST, with a <code>// expect type:</code> annotation for golden tests</td></tr> <tr><td>Traits and generics</td><td>Two strategies: monomorphization (a copy per type, fast code, big binaries) or dictionary passing (vtables, as used for <code>dyn</code>). Trait resolution is a small logic-programming problem</td><td><code>rustc_trait_selection</code> (and the next-generation solver), <code>rustc_monomorphize</code></td><td>Interfaces for Lox classes with vtable dispatch, then try monomorphizing generic functions</td></tr> <tr><td>Ownership and borrowing</td><td>Move checking plus a dataflow analysis over the control-flow graph (non-lexical lifetimes). Polonius restates the analysis as Datalog facts</td><td><code>rustc_borrowck</code>, which runs on MIR</td><td>Add affine types to typed Lox: a moved variable can't be read again. Check it with a dataflow pass</td></tr> <tr><td>Closures</td><td>Closure conversion: each closure becomes a struct of captured variables plus a function that takes it. Capture analysis decides between by-reference and by-move, per field since edition 2021</td><td>Upvar analysis in <code>rustc_hir_typeck</code></td><td>Compare with your clox upvalues. Then write closure conversion as a pass in an AST-to-IR compiler</td></tr> <tr><td><code>?</code> and <code>Try</code></td><td>Desugared to a <code>match</code> that calls <code>From::from</code> on the error branch</td><td>Lowering from AST to HIR</td><td>Add a <code>?</code> operator on a <code>Result</code>-like enum as a desugaring in the parser</td></tr> <tr><td><code>async</code>/<code>await</code></td><td>The function body becomes a coroutine: a state machine enum whose variants hold the variables live across each <code>await</code></td><td>The coroutine transform in <code>rustc_mir_transform</code></td><td>Add generators (<code>yield</code>) to clox by saving and restoring call frames</td></tr> <tr><td>Macros</td><td><code>macro_rules!</code> matches token trees. Hygiene tags identifiers with syntax contexts. Proc macros are compiler plugins that run on token streams</td><td><code>rustc_expand</code>, <code>rustc_resolve</code></td><td>Token-tree macros for Lox, run between lexing and parsing</td></tr> <tr><td>Const evaluation</td><td>An interpreter for the middle IR that runs at compile time</td><td><code>rustc_const_eval</code>, whose engine Miri also uses</td><td>Constant-fold <code>const</code> declarations by running your clox VM inside the compiler</td></tr> <tr><td>Name resolution and modules</td><td>Scopes built from a module tree. Imports resolve by iterating to a fixed point, because globs and re-exports depend on one another</td><td><code>rustc_resolve</code></td><td>Add <code>import "file.lox";</code> with a module cache and cycle detection</td></tr> </tbody> </table></div>

<p>To see how a feature lowers, run <code>cargo rustc -- -Zunpretty=hir</code> or <code>-Zunpretty=mir</code> on nightly, or use the MIR view in the Rust Playground. Compiler Explorer (godbolt.org) shows the final assembly for any Rust snippet.</p>
"""
