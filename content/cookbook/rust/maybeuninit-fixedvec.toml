[[sections]]
heading = "Design notes"
body = """
`[T; N]` must be fully initialised, so a growable inline buffer needs `[MaybeUninit<T>; N]`: memory that may hold garbage and that the compiler will never drop or read for you. The container's **invariant** is the whole proof: slots `0..len` are initialised, slots `len..N` are not. Every unsafe block below just cites that invariant.

`Drop` must drop exactly the `0..len` prefix. `ManuallyDrop<T>` suppresses the automatic drop of a field, which lets a `Drop` impl (or a consuming method) move a field out exactly once without a double drop. `mem::forget` is safe (leaking is not UB) and skips Drop.

`std::array::from_fn` is the **safe** way to build `[T; N]` from an index closure; MaybeUninit is the manual version. Panic safety: if one element's `drop` panics, `drop_in_place` on a slice still drops the remaining elements.
"""

