e>Arc::ptr_eq</code></li><li><code>Arc::try_unwrap</code></li><li><code>Arc::into_inner</code></li><li><code>thread::scope</code></li><li><code>thread::Builder::name</code></li><li><code>thread::Builder::stack_size</code></li><li><code>thread::Builder::spawn</code></li><li><code>thread::Builder::spawn_scoped</code></li><li><code>thread::current</code></li><li><code>thread::park</code></li><li><code>Thread::unpark</code></li><li><code>JoinHandle::join</code></li><li><code>thread::available_parallelism</code></li><li><code>thread_local!</code></li><li><code>LocalKey::with</code></li><li><code>LocalKey::try_with</code></li><li><code>LocalKey::set</code></li><li><code>LocalKey::take</code></li><li><code>LocalKey::replace</code></li><li><code>LocalKey::get</code></li><li><code>LocalKey::with_borrow</code></li><li><code>LocalKey::with_borrow_mut</code></li></ul>
