[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>shared server state</li><li>connection pools</li><li>lazy config</li><li>worker queues</li><li>graceful shutdown</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li><code>Arc&lt;Mutex&lt;T&gt;&gt;</code> shared state</li><li><code>RwLock</code> config snapshots</li><li><code>OnceLock</code>/<code>LazyLock</code> globals</li><li>bounded <code>sync_channel</code> for backpressure</li><li><code>Condvar</code> blocking queues and pools</li></ul>
"""

