[[sections]]
heading = "Where it is defined"
body = """
std for `Mutex`, `RwLock`, `Condvar`, `Once`, `OnceLock`, `LazyLock`, `Barrier`, `mpsc`, `std::thread`, `thread_local!` (they need the OS). alloc: `Arc` and `Weak` (`alloc::sync`). core: atomics (`core::sync::atomic`), `OnceCell`/`LazyCell` (`core::cell`, single-threaded).
"""

[[sections]]
heading = "Not covered"
body = """
`std::sync::nonpoison`, `ReentrantLock`, `mpmc`, `oneshot`, mapped guards, `Mutex::{get_cloned,set,replace}`, `Receiver::recv_deadline`, `LocalKey::update`, `OnceLock::get_mut_or_init`, `SyncView` (formerly `Exclusive`) (all unstable in 1.98.1); async locks (see tokio examples); atomics (see std_atomics_ordering_use_cases).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Mutate shared state</td><td><code>Arc&lt;Mutex&lt;T&gt;&gt;; borrowed from the stack: thread::scope + &amp;Mutex&lt;T&gt;</code></td></tr><tr><td>Many readers, rare writer</td><td><code>RwLock&lt;T&gt; (measure first; or swap an Arc&lt;T&gt; under a short lock)</code></td></tr><tr><td>Survive a panic in another thread</td><td><code>lock().unwrap_or_else(PoisonError::into_inner); after repairing: clear_poison()</code></td></tr><tr><td>Do not block</td><td><code>try_lock / try_read / try_write (WouldBlock or Poisoned)</code></td></tr><tr><td>Sleep until state changes</td><td><code>condvar.wait_while(guard, |s| !ready(s))</code></td></tr><tr><td>Same, with a deadline</td><td><code>wait_timeout_while then check timed_out()</code></td></tr><tr><td>Run an initialiser once, no value</td><td><code>Once::call_once</code></td></tr><tr><td>Global set from runtime input</td><td><code>static X: OnceLock&lt;T&gt; + get_or_init / set</code></td></tr><tr><td>Global with a fixed initialiser</td><td><code>static X: LazyLock&lt;T&gt; = LazyLock::new(..)</code></td></tr><tr><td>All workers reach a phase boundary</td><td><code>Barrier</code></td></tr><tr><td>Hand work to other threads</td><td><code>mpsc::sync_channel(n) (bounded, backpressure); channel() is unbounded; 0 is a rendezvous</code></td></tr><tr><td>Know when all producers are done</td><td><code>drop every Sender; for x in rx then ends</code></td></tr><tr><td>Copy-on-write shared snapshot</td><td><code>Arc::make_mut</code></td></tr><tr><td>Cache without keeping alive</td><td><code>Weak + upgrade</code></td></tr><tr><td>Borrow locals in threads</td><td><code>thread::scope</code></td></tr><tr><td>Name threads (visible in panics)</td><td><code>thread::Builder::new().name(..)</code></td></tr><tr><td>Per-thread buffer / request id</td><td><code>thread_local! + with_borrow_mut / set</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
re-locking a Mutex you already hold deadlocks or panics (unspecified which); two reads of one RwLock on one thread can deadlock if a writer queues between them; RwLock fairness is OS-dependent (writer or reader starvation are both permitted); `Condvar::wait` may wake spuriously.
"""

