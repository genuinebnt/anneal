[[sections]]
heading = "Design notes"
body = """
What: `const fn` with loops builds lookup tables during compilation (no build.rs, no startup cost); const generics put sizes in the type so a dimension mismatch is a compile error; `const { assert!(..) }` turns invariants into build failures; zero-sized types carry state at the type level; blanket impls fake trait aliases; autoref method resolution fakes specialisation.

Why: errors move from runtime to compile time and the checks cost nothing at runtime.

How: each section is a small module-like block with asserts in `main`. Only **stable** features are used: arithmetic on const parameters in types (`[T; N + 1]`, `where [(); N]:`) is `generic_const_exprs`, which is still unstable, so it is avoided and the workaround patterns are shown instead.
"""

