[[sections]]
heading = "Common uses"
body = """
normalising ids/paths/HTML escaping: return borrowed data when no change is needed, allocate only on change.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: return `Cow<'_, str>`. Clean inputs come back as a borrow (zero allocation); only dirty inputs allocate a new `String`. Callers treat both as `&str`.

Docs: <https://doc.rust-lang.org/std/borrow/enum.Cow.html>
"""

