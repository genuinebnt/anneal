<ul class="cb-g-uses"><li>generic 'fn f&lt;R: Read</li><li>W: Write&gt;' functions tested on 'Cursor'/'Vec&lt;u8&gt;'</li><li>length-limited reads on untrusted input</li><li>tee/counting adapters (metrics, checksums)</li><li>retry on <code>Interrupted</code></li></ul>
"""

