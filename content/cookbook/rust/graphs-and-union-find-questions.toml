[[sections]]
heading = "Design notes"
body = """
**OMITTED on purpose** (these are the learner's own exercises elsewhere): topological sort / Kahn's algorithm, Course Schedule I/II, Alien Dictionary, cycle detection in dependency graphs, critical path and longest path in a task DAG. (Cycle detection in **undirected** graphs appears only as union-find: Redundant Connection and Graph Valid Tree.)

**Question bank** (numbering restarts in each interview file; a generator reads these lines) Q1. Number of Islands (DFS with an explicit stack, BFS, union-find) and Max Area of Island. [Medium] [asked: very common] Q2. Flood Fill. [Easy] [asked: common] Q3.

Clone Graph (arena indices and the `Rc<RefCell<..>>` version). [Medium] [asked: very common] Q4. Rotting Oranges (multi-source BFS by levels). [Medium] [asked: very common] Q5. 01 Matrix (BFS from all zeros) and Walls and Gates. [Medium] [asked: common] Q6. Pacific Atlantic Water Flow (reverse search from the borders). [Medium] [asked: common] Q7.

Surrounded Regions. [Medium] [asked: common] Q8. Word Ladder (BFS and bidirectional BFS). [Hard] [asked: very common] Q9. Shortest Path in a Binary Matrix (8 directions). [Medium] [asked: common] Q10.

Open the Lock (BFS over an implicit state graph). [Medium] [asked: common] Q11. Snakes and Ladders (BFS with board numbering). [Medium] [asked: common] Q12. Shortest Bridge (DFS to find an island, then BFS outward). [Medium] [asked: occasional] Q13.

Is Graph Bipartite and Possible Bipartition (2-colouring). [Medium] [asked: common] Q14. Number of Connected Components and Graph Valid Tree. [Medium] [asked: very common] Q15. Redundant Connection (union-find). [Medium] [asked: very common] Q16.

Accounts Merge (union-find over strings). [Medium] [asked: common] Q17. Evaluate Division (weighted union-find). [Medium] [asked: common] Q18. Network Delay Time (Dijkstra). [Medium] [asked: very common] Q19.

Cheapest Flights Within K Stops (Bellman-Ford rounds). [Medium] [asked: very common] Q20. Path With Minimum Effort and Swim in Rising Water (minimax Dijkstra). [Medium] [asked: common] Q21. Min Cost to Connect All Points (Prim's MST). [Medium] [asked: common] Q22.

Critical Connections in a Network (bridges via low-link, iterative). [Hard] [asked: common] Q23. Find the Town Judge and Find Center of Star Graph (degree tricks). [Easy] [asked: common] Q24. Reconstruct Itinerary (Eulerian path, Hierholzer). [Hard] [asked: common] Q25.

Graph representations: adjacency list vs matrix vs edge list vs CSR, and the grid-as-graph neighbour helper with `checked_add_signed`. [Easy] [asked: very common]

Every question: statement, approach (brute force then optimal, complexity, pattern), Rust wrinkle, solution(s), a brute-force oracle with 2000 seeded xorshift cases plus edge cases, and what the interviewer is really testing.

**Graph checklist** (say it first in the interview): is it directed? weighted (non-negative? negative?) ? connected? how big are V and E?

"shortest" with unit edges -> BFS; non-negative weights -> Dijkstra; at most k edges -> Bellman-Ford rounds; "are these connected" with merges -> union-find; implicit states (locks, words, boards) -> BFS over generated neighbours.
"""

