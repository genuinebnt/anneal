[[sections]]
heading = "Design notes"
body = """
tower (<https://github.com/tower-rs/tower> , <https://docs.rs/tower>) models everything as `Service<Request>`: an async function `Request -> Result<Response, Error>`. A `Layer` wraps one service in another (decorator pattern), and `ServiceBuilder` stacks layers.

The real trait is `fn poll_ready(&mut self, cx)` + `fn call(&mut self, req) -> Self::Future`, which lets a service apply **backpressure** before accepting work.

Here we simplify to `async fn call(&self, req)` (shared `&self`, readiness folded into `call`), so the middleware logic is easy to read; concurrency limit and rate limit therefore wait/reject inside `call`. Everything is generic (static dispatch): a whole stack monomorphises into one concrete type with no boxing.

Layer **order** is behaviour. `ServiceBuilder::new().layer(A).layer(B).service(s)` is `A(B(s))`: A is **outermost** (sees the request first, the response last). So `Retry` outside `Timeout` gives **each** attempt its own deadline; `Timeout` outside `Retry` puts **one** deadline over all attempts including backoff sleeps.

A circuit breaker outside a retry counts the final outcome, inside it counts every attempt. All of these orders are tested below.

axum: `Router` and `MethodRouter` are `tower::Service`s, and axum turns your handler functions into services for you.

That is why `.layer(...)` accepts middleware from `tower` or `tower-http` (CORS, tracing, compression) and why `ServiceExt::oneshot` can call an app directly in tests (shown at the end, using the real `tower` crate from this cookbook's dependencies).
"""

