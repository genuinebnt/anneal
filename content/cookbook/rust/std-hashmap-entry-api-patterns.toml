[[sections]]
heading = "Design notes"
body = """
Cheat sheet (I want to ... -> use ...): add or overwrite                       -> `insert` (returns the **old** value) read                                   -> `get(&k)` / `map[&k]` (panics when missing) / `get_key_value`

```text
count things                           -> `*m.entry(k).or_insert(0) += 1`  (or `or_default()`)
```

group into Vec per key                 -> `m.entry(k).or_default().push(v)` insert only if absent (lazy value)     -> `entry(k).or_insert_with(|| expensive())`

```text
value depends on key                   -> `or_insert_with_key(|k| ..)`
```

update if present else insert          -> `entry(k).and_modify(|v| ..).or_insert(init)`

```text
decide differently per case            -> `match m.entry(k) { Occupied(e) => .., Vacant(e) => .. }`
```

remove and get                         -> `remove(&k)` / `remove_entry`; conditionally: `Entry::Occupied(e).remove()` remove many by predicate               -> `retain(|k, v| ..)` (or `extract_if` when you want the removed ones) empty it but keep the allocation       -> `drain()` / `clear()`

```text
look up with &str for String keys      -> `m.get("abc")` (Borrow<str>)
```

mutate two values at once              -> `get_disjoint_mut([&a, &b])` (1.86) set algebra                            -> `a.union(&b)`, `intersection`, `difference`, `symmetric_difference`, `&a & &b` deterministic output                   -> sort keys / collect into BTreeMap; never print iteration order faster hashing for trusted keys        -> `BuildHasherDefault<MyHasher>` (e.g.

FxHash-like) via `with_hasher`
"""

