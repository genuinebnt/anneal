[[sections]]
heading = "Design notes"
body = """
Safe Rust cannot express a node pointing both forward and back (it would need Rc&lt;RefCell&lt;..>> + Weak). So nodes are heap-allocated with `Box`, leaked into raw pointers with `Box::into_raw`, and reclaimed with `Box::from_raw`. **Invariants** (every unsafe block below relies on these): I1.

Every node reachable from `head`/`tail` was created by `Box::into_raw` and is freed only by `Box::from_raw`. I2. `head` is None iff `tail` is None iff `len == 0`; `head.prev == None`, `tail.next == None`.

I3. For every node n: `n.next == Some(m)` implies `m.prev == Some(n)` (and symmetrically). I4.

The list owns its nodes uniquely: no other pointer is used for access while a `&mut Deque` exists. Why `NonNull<T>`: non-null (so `Option<NonNull<_>>` is pointer-sized) and **covariant** in T, unlike `*mut T`. Why `PhantomData<Box<Node<T>>>`: tells dropck that Deque **owns** (and drops) values of type T, so a `T` containing a borrow must strictly outlive the list.

Iterators carry `PhantomData<&'a T>` / `<&'a mut T>` to tie the borrow of the list to the items. `Send`/`Sync` are not automatic for raw pointers, so we `unsafe impl` them with T bounds.
"""

[[sections]]
heading = "Common uses"
body = """
LRU caches (O(1) unlink), task/timer queues, std::collections::LinkedList, intrusive lists in kernels. In practice `VecDeque` is faster for almost everything; linked lists win when you hold node handles for O(1) removal.

Study (cite only): <https://rust-unofficial.github.io/too-many-lists/> and <https://github.com/rust-lang/rust/blob/master/library/alloc/src/collections/linked_list.rs>
"""

