[[sections]]
heading = "Design notes"
body = """
Key ideas:

- `Read` and `Write` are traits. Write functions over `impl Write` / `impl Read` and you can test with `Vec<u8>` and `&[u8]` instead of real files.
- Wrap files in `BufReader`/`BufWriter` for many small reads/writes (see bufwriter).
- To update a file safely: write a temp file, flush+sync, then `rename` over the target (atomic on POSIX), so a crash never leaves a half-written file. Docs: <https://doc.rust-lang.org/std/io/index.html> and <https://doc.rust-lang.org/std/fs/index.html>
"""

