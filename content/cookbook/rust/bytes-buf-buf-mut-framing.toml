[[sections]]
heading = "Design notes"
body = """
**Mental model**

```text
Bytes    = pointer + length + shared ownership of the allocation. clone() and slice() copy no data.
```

BytesMut = a uniquely owned **window** of an allocation. split_to() hands out a disjoint window; freeze() makes it a Bytes. Buf      = a read cursor (get&#95;&#42; consume). BufMut = a write cursor (put&#95;&#42; append).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Share a message with N tasks</td><td><code>Bytes::clone</code></td></tr><tr><td>Keep a field of a parsed message</td><td><code>slice()/split_to (zero copy) ; copy_from_slice to avoid pinning a huge buffer</code></td></tr><tr><td>Read loop</td><td><code>BytesMut, append, decode until "need more", repeat</code></td></tr><tr><td>Maybe-incomplete input</td><td><code>check remaining() BEFORE get_* (they PANIC when short) or use try_get_*</code></td></tr><tr><td>Header + body without copying</td><td><code>a.chain(b)</code></td></tr><tr><td>3, 5, 6, 7 byte integers</td><td><code>get_uint(n) / put_uint(v, n)</code></td></tr><tr><td>Several buffers, one syscall</td><td><code>chunks_vectored + write_vectored, then advance(n) (writes can be partial)</code></td></tr><tr><td>Mmap / pooled memory as Bytes</td><td><code>Bytes::from_owner</code></td></tr><tr><td>Segmented input of your own</td><td><code>impl Buf (remaining, chunk, advance) and get every get_* for free</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
a 10-byte slice keeps its whole backing allocation alive; get_u32 is big-endian (use get_u32_le for LE); never trust a length prefix (cap it **before** reserving memory).
"""

