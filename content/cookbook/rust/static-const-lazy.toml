[[sections]]
heading = "Design notes"
body = """
const X: T      inlined at every use, evaluated at compile time. Prefer for plain values. static X: **T one** memory location with a fixed address for the whole program (`'static`). static mut      avoid: unsafe and almost always replaceable by the items below. OnceLock&lt;T>     set exactly once at runtime (e.g. config parsed from args), then read anywhere.

LazyLock&lt;T>     compute on first use (e.g. a table built from a function), thread-safe.

```text
thread_local!   one value per thread.
```

Atomic&#42; statics lock-free global counters. Docs: <https://doc.rust-lang.org/std/sync/struct.OnceLock.html> and <https://doc.rust-lang.org/std/sync/struct.LazyLock.html>
"""

