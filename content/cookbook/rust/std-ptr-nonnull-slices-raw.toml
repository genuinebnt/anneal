[[sections]]
heading = "Verification"
body = """
assertions and differential tests against safe code check **behaviour**. They cannot prove soundness. Miri checks the executed paths for undefined behaviour.

Run on 2026-11-26 with rustc 1.100.0-nightly (5a2be9f5f 2026-09-06): no errors under the default (Stacked Borrows) and under `-Zmiri-tree-borrows -Zmiri-strict-provenance`. Loop counts shrink under `cfg(miri)`, and the exposed-provenance demo is skipped there.
"""

[[sections]]
heading = "Design notes"
body = """
**The checklist** for every dereference: non-null; aligned for T; points into **one** live allocation with enough room; the bytes are an initialised, valid T (for reads); no `&mut` aliases it while you read, and nothing else aliases it while you write; you do not create a second owner of the same value.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>A pointer from a reference</td><td><code>ptr::from_ref(&amp;x) / &amp;raw const x; for fields of packed or uninit structs ONLY &amp;raw</code></td></tr><tr><td>Move a value out / in without dropping</td><td><code>ptr::read (now YOU must ensure one owner) / ptr::write (old value is NOT dropped)</code></td></tr><tr><td>Exchange through pointers</td><td><code>ptr::replace, ptr::swap (swap allows overlap)</code></td></tr><tr><td>Memcpy / memmove</td><td><code>copy_nonoverlapping (ranges disjoint) / copy (may overlap)</code></td></tr><tr><td>An unaligned field in a byte buffer</td><td><code>read_unaligned, or better: u32::from_le_bytes</code></td></tr><tr><td>(ptr, len) to a slice</td><td><code>slice::from_raw_parts (non-null and aligned EVEN IF len == 0)</code></td></tr><tr><td>Non-null + covariant, in a struct</td><td><code>NonNull&lt;T&gt;; empty containers use NonNull::dangling()</code></td></tr><tr><td>Step through an array</td><td><code>add / sub (must stay in bounds, one past the end allowed); else wrapping_add</code></td></tr><tr><td>Distance in elements</td><td><code>end.offset_from(start) (same allocation only)</code></td></tr><tr><td>Tag bits in a pointer</td><td><code>map_addr / addr (keeps provenance)</code></td></tr><tr><td>Address as an integer and back</td><td><code>expose_provenance + with_exposed_provenance (last resort)</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
`add` out of bounds is UB even without dereferencing; `ptr::read` of a `String` creates two owners (double free); assigning through a raw pointer (`*p = v`) **drops** the old value, which is UB on uninitialised memory; comparing `dyn Trait` pointers is unreliable.
"""

