<ul class="cb-g-uses"><li>HTTP clients (reqwest uses the url crate)</li><li>OAuth redirect handling</li><li>JWT segments (base64url without padding)</li><li>Basic auth</li><li>content digests (hex)</li><li>TOTP secrets (base32)</li></ul>
"""

