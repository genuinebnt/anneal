[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Resolve a link found on a page</td><td><code>base.join(href)   (mind the trailing slash!)</code></td></tr><tr><td>Add query parameters</td><td><code>query_pairs_mut().append_pair      (never format!)</code></td></tr><tr><td>Add a user value as ONE path segment</td><td><code>path_segments_mut().push           (never join(format!(..)))</code></td></tr><tr><td>Check where a URL really points</td><td><code>url.host(), compare exactly         (never starts_with/contains on the string)</code></td></tr><tr><td>Bytes in a URL or file name</td><td><code>URL_SAFE_NO_PAD</code></td></tr><tr><td>Bytes in MIME/JSON/Basic auth</td><td><code>STANDARD</code></td></tr><tr><td>Log a URL</td><td><code>strip userinfo (set_password(None)) and often the query</code></td></tr><tr><td>Cache key without query/fragment</td><td><code>&amp;url[..Position::AfterPath]</code></td></tr><tr><td>Local path &lt;</td><td><code>file URL               -&gt; from_file_path / to_file_path   (never format!("file://{path}"))</code></td></tr><tr><td>Accept padded AND unpadded base64</td><td><code>a GeneralPurpose engine with DecodePaddingMode::Indifferent</code></td></tr><tr><td>Large or incremental base64</td><td><code>base64::write / base64::read adapters</code></td></tr><tr><td>Line-wrapped MIME, custom alphabets</td><td><code>data_encoding (BASE64_MIME, Specification)</code></td></tr><tr><td>Digests for humans</td><td><code>hex</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
base64 and hex are **encodings**, not encryption. Query strings use form encoding (space &lt;-> '+'), paths do not. **International domains**: the parser converts them to punycode ("xn--..."); look-alike characters then stand out in the ASCII form, but IDNA is not a defence against homograph phishing by itself.
"""

