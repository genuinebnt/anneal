[[sections]]
heading = "Not covered"
body = """
not every family x operation pair is written out (for example checked_shr, wrapping_div, saturating_pow): they follow the shapes shown. unchecked&#95;&#42; (unsafe), carrying&#95;&#42;/borrowing&#95;&#42;/carryless_mul (multi-word arithmetic), the to_ne/from_ne/to_be/from_le variants (same shape as shown), leading_ones/trailing_ones, highest_one/lowest_one/isolate&#95;&#42; (bit tricks), bit_width, &#42;&#95;exact_div, the &#42;&#95;signed/&#95;unsigned mixed-sign twins other than checked_add_signed;

Signed div_ceil, widening_mul and checked_cast_signed (**unstable** on signed types / u64 in 1.98.1: widening is shown through u128).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Detect overflow and fail</td><td><code>checked_*  (returns Option)</code></td></tr><tr><td>Clamp at the type's limits</td><td><code>saturating_*</code></td></tr><tr><td>Modular arithmetic (hashes, sequences)</td><td><code>wrapping_*</code></td></tr><tr><td>Result AND a "did it overflow" flag</td><td><code>overflowing_*</code></td></tr><tr><td>Overflow is a bug: panic in every build</td><td><code>strict_*  (since 1.91)</code></td></tr><tr><td>Distance between two unsigned values</td><td><code>abs_diff</code></td></tr><tr><td>Non-negative modulo with negative input</td><td><code>rem_euclid</code></td></tr><tr><td>Pages needed for n items</td><td><code>n.div_ceil(per_page)</code></td></tr><tr><td>Round up to alignment</td><td><code>next_multiple_of</code></td></tr><tr><td>Average without overflow</td><td><code>midpoint</code></td></tr><tr><td>Number of decimal digits - 1</td><td><code>ilog10</code></td></tr><tr><td>Narrow a type safely</td><td><code>u32::try_from(x)</code></td></tr><tr><td>Reinterpret bits as signed/unsigned</td><td><code>cast_signed / cast_unsigned</code></td></tr><tr><td>Wire format</td><td><code>to_be_bytes / from_be_bytes</code></td></tr><tr><td>"never zero" in the type</td><td><code>NonZeroU32 (Option&lt;NonZeroU32&gt; is 4 bytes) OVERFLOW RULES. Plain + - * that overflows is a bug: with overflow-checks on (default in dev/test) it panics; with it off (default in release) it wraps in two's complement. Never rely on either; pick a method family. Division and remainder are different: / 0, % 0 and MIN / -1 panic in EVERY build. This page asserts nothing that depends on the build profile.</code></td></tr></tbody></table>
"""

