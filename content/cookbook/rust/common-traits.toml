[[sections]]
heading = "Design notes"
body = """
Debug/Display (formatting) &#124; Clone/Copy &#124; PartialEq/Eq/Hash (map keys) &#124; PartialOrd/Ord (sorting, BinaryHeap) &#124; Default &#124; FromStr &#124; Deref &#124; Iterator. Derive when the obvious behaviour is right; implement by hand when it is not. Guideline: implement the common traits eagerly <https://rust-lang.github.io/api-guidelines/interoperability.html>
"""

