[[sections]]
heading = "Where it is defined"
body = """
every slice method and array::from_fn here is core (`core::slice`, `core::array`), usable in no_std. `thread::scope` is std. `Iterator::step_by`/`zip` are core.
"""

[[sections]]
heading = "Not covered"
body = """
split_at_unchecked / as_chunks_unchecked (unsafe), split_off_first/last family, itertools-style `group_by` (chunk_by is the std equivalent for adjacent runs); string splitting is std_str_search_split_parse.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Batches of n, last one may be short</td><td><code>chunks(n)</code></td></tr><tr><td>Fixed records, handle the tail yourself</td><td><code>chunks_exact(n) + remainder()</code></td></tr><tr><td>Fixed records as real arrays (&amp;[T; N])</td><td><code>as_chunks::&lt;N&gt;()          -&gt; (&amp;[[T; N]], tail)</code></td></tr><tr><td>Batches counted from the END</td><td><code>rchunks(n)</code></td></tr><tr><td>Overlapping windows</td><td><code>windows(n)  /  array_windows::&lt;N&gt;()</code></td></tr><tr><td>Non-overlapping with a stride</td><td><code>iter().step_by(k)</code></td></tr><tr><td>Runs of ADJACENT items that belong together</td><td><code>chunk_by(|a, b| ..)</code></td></tr><tr><td>Break on a delimiter element</td><td><code>split(pred)      keep delimiter: split_inclusive(pred)</code></td></tr><tr><td>Header, then the rest (at most n pieces)</td><td><code>splitn(n, pred)</code></td></tr><tr><td>Two disjoint &amp;mut halves</td><td><code>split_at_mut(mid)</code></td></tr><tr><td>One &amp;mut element plus the others</td><td><code>split_first_mut / split_at_mut twice</code></td></tr><tr><td>Parallel work on disjoint regions</td><td><code>chunks_mut inside thread::scope PANICS (slice docs): chunks, chunks_exact, rchunks (and _mut forms) and windows panic when the size is 0; as_chunks/array_windows reject N = 0 at compile time; split_at(mid) panics if mid &gt; len; step_by(0) panics.</code></td></tr></tbody></table>
"""

