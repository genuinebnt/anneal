[[sections]]
heading = "Crates"
body = """
thiserror = "2", anyhow = "1", eyre = "0.6", miette = "7" (default features: derive, no "fancy")
"""

[[sections]]
heading = "Not covered"
body = """
color-eyre. It is a ready-made `EyreHandler` plus a panic hook with coloured, environment-dependent output; section `eyre_layer` shows the handler mechanism it plugs into. miette's graphical renderer needs the "fancy" feature, which is not enabled here: reports are rendered with the plain-text NarratableReportHandler so they can be asserted.
"""

[[sections]]
heading = "Design notes"
body = """
**The decision**

```text
Will a CALLER branch on the failure?  yes -> a concrete enum (thiserror)    no, it is only reported -> anyhow::Error
```

Libraries usually expose the first; the top of an application uses the second.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Wrap a cause and keep it</td><td><code>#[source] field (or a field named source)</code></td></tr><tr><td>Let <code>?</code> convert automatically</td><td><code>#[from] (one variant per source TYPE)</code></td></tr><tr><td>The variant IS the inner error</td><td><code>#[error(transparent)]</code></td></tr><tr><td>Add "while doing X"</td><td><code>.with_context(|| format!(..))?   (lazy: only runs on error)</code></td></tr><tr><td>Print the whole chain on one line</td><td><code>format!("{err:#}")</code></td></tr><tr><td>Print chain + backtrace</td><td><code>format!("{err:?}")  (what fn main() -&gt; anyhow::Result&lt;()&gt; prints)</code></td></tr><tr><td>Recover a typed error from anyhow</td><td><code>err.downcast_ref::&lt;MyError&gt;()</code></td></tr><tr><td>Need your OWN report format/extra data</td><td><code>eyre (pluggable EyreHandler); the API is otherwise close to anyhow</code></td></tr><tr><td>Point at a span of the user's INPUT</td><td><code>miette: Diagnostic + #[source_code] + #[label]  (parsers, config, DSLs) RULE: an error EITHER displays its cause's text OR returns it from source(). Doing both prints it twice in any chain-aware reporter. ANYHOW vs EYRE: the same idea (one boxed dynamic error with context). eyre adds a global hook that builds a handler for every Report; the hook can be installed ONCE per process, before the first Report exists. That makes it an application decision: a library should not call set_hook. BACKTRACES: anyhow captures one when RUST_BACKTRACE or RUST_LIB_BACKTRACE is set. This example does not assert on it because that depends on the environment.</code></td></tr></tbody></table>
"""

