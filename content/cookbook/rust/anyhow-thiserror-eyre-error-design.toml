[[sections]]
heading = "Where you would use it"
body = """
any crate with a public API (typed errors) and any binary that reports failures to people (anyhow).
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>library error enums</li><li>adding "what was I doing" context in applications</li><li>mapping errors to HTTP statuses</li></ul>
"""

