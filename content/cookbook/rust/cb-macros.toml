heading = "Design notes"
body = """
Procedural macros. Every entry point is a thin wrapper: parse the input `TokenStream` with syn, build output with `quote!`, and turn any `syn::Error` into `compile_error!` tokens so users get spanned errors instead of a panic inside the compiler.
"""

