[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>wrapping C libraries</li><li>exposing a Rust library to C/Python/Swift</li><li>plugin ABIs</li><li>anything crossing a language boundary</li></ul>
"""

[[sections]]
heading = "What it is"
body = """
the C ABI is the lingua franca between languages. Two directions: (1) Rust calls C: declare the function in an `unsafe extern "C" { ... }` block (mandatory `unsafe` in edition 2024), then every call is `unsafe` because the compiler cannot check C's promises.

We call `strlen`, `getenv`, `qsort`, `snprintf` (variadic) and `gettimeofday` (fills a `#[repr(C)]` struct, `libc::timeval`) straight from the platform libc, no C compiler needed. (2) C calls Rust: `#[unsafe(no_mangle)] pub extern "C" fn` gives an unmangled symbol with the C calling convention.

Here the "C caller" is simulated by a table of plain function pointers (`CApi`), which is exactly what a C program sees via dlsym/headers.
"""

[[sections]]
heading = "Design notes"
body = """
**Rules that prevent UB**:

- Ownership: memory is freed by the allocator that made it. `CString::into_raw` hands Rust-allocated memory to C; it must come back through `CString::from_raw` (our `ff_string_free`), **never** libc `free`. Likewise memory from `malloc` must not go to `Box`/`drop`.
- Opaque handle: Rust type boxed, exposed as `*mut Counter` (C sees an incomplete type). `_new` = `Box::into_raw`, `_free` = `Box::from_raw`. A safe Rust wrapper (`SafeCounter`) owns the pointer and calls `_free` in `Drop`, so leaks and double frees are impossible.
- Panics must not unwind across `extern "C"` (since Rust 1.81 that aborts the process). Wrap callback bodies in `catch_unwind` and translate to an error code.
- Enums: a Rust enum with an invalid discriminant is UB. Accept the raw integer at the boundary and validate with `TryFrom`.
- Slices are `(ptr, len)`; check null, then `slice::from_raw_parts` (ptr must be non-null and aligned even when len is 0).
- Out-parameters: `*mut T` the callee writes through; validate non-null, return a status code. `Option<extern "C" fn>` is the nullable function pointer (same ABI as a C pointer, `None` is **null**). Errors from C: read `errno` immediately via `io::Error::last_os_error()`.
- qsort has no user-context argument (`qsort_r`'s signature differs between glibc and BSD), so the comparator uses a global counter; our own `ff_counter_visit` shows the portable `(callback, void* ctx)` pattern.

**Automation**: writing these declarations by hand does not scale. `bindgen` reads C headers and generates the Rust `extern` blocks and `#[repr(C)]` structs; `cbindgen` reads your Rust `extern "C"` items and generates the C header. Use them in `build.rs` / CI.
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>sys crates (<code>libz-sys</code>, <code>openssl-sys</code> style) wrapped by safe crates</li><li>Rust cores embedded in Python/Node/Swift apps via a C ABI</li><li>plugin systems with C callbacks and <code>void*</code> user data</li><li>Rust components dropped into existing C codebases</li></ul>
"""

