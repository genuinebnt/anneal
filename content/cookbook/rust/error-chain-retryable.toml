[[sections]]
heading = "Where you would use it"
body = """
workers/executors that must decide "retry or give up?" based on **what** failed.
"""

[[sections]]
heading = "Common uses"
body = """
retry/dead-letter decisions in workers; error chains in logs.
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: keep a typed error enum, wrap the lower-level error with `#[source]` (so the chain is preserved), and add a method like `is_retryable()` so callers never string-match messages. `Error::source()` walks the chain; `Box<dyn Error + Send + Sync>` is the "any error" type that can cross threads.
"""

