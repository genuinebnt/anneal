body = """
axum = "0.8" (multipart), reqwest = "0.12" (no default features; json, stream, multipart, cookies; so NO TLS here, plain http on loopback), tokio = "1", futures-util = "0.3", tower = "0.5" (util)
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Reuse ONE Client</td><td><code>it holds the connection pool; creating one per request wastes handshakes</code></td></tr><tr><td>4xx/5xx are not Err</td><td><code>call error_for_status() or match on status()</code></td></tr><tr><td>Always set a timeout</td><td><code>reqwest has no overall timeout by default</code></td></tr><tr><td>Path syntax in axum 0.8</td><td><code>"/items/{id}" (older versions used :id)</code></td></tr><tr><td>Extractor order</td><td><code>the one that consumes the BODY (Json, Multipart, Bytes) comes last</code></td></tr><tr><td>Retry</td><td><code>only idempotent requests (or with an idempotency key), with a budget and backoff</code></td></tr><tr><td>Test server</td><td><code>bind 127.0.0.1:0 and read local_addr()</code></td></tr><tr><td>Test routes without any socket</td><td><code>router.oneshot(request)   (tower::ServiceExt)</code></td></tr><tr><td>Middleware</td><td><code>from_fn ; layer wraps only routes added BEFORE it; the last layer runs first</code></td></tr><tr><td>Auth for matched routes only</td><td><code>route_layer (unknown paths stay 404 instead of becoming 401)</code></td></tr><tr><td>Your own error body for bad JSON</td><td><code>take Result&lt;Json&lt;T&gt;, JsonRejection&gt;</code></td></tr><tr><td>Typed data from headers</td><td><code>impl FromRequestParts</code></td></tr><tr><td>URL may carry a token</td><td><code>error.without_url() before logging</code></td></tr></tbody></table>
"""

