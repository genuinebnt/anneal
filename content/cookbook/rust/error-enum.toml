heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>every CLI/service: one error enum per crate</li><li><code>?</code> everywhere</li><li>only <code>main</code> maps errors to exit codes or HTTP statuses</li></ul>
"""

[[sections]]
heading = "Design notes"
body = """
Pattern: all logic lives in `run() -> Result<_, Error>`. Only `main` turns an error into an exit code. `#[from]` lets `?` convert io/serde errors automatically.

Variants can carry data for good messages. Real code: ripgrep's main.rs -> <https://github.com/BurntSushi/ripgrep/blob/master/crates/core/main.rs>

```text
thiserror        -> https://github.com/dtolnay/thiserror
```
"""

