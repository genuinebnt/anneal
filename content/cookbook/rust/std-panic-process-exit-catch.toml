[[sections]]
heading = "Where it is defined"
body = """
panic!/assert!/unreachable! and `Location` are core; catch_unwind, hooks, resume_unwind, panic_any, process (Command, exit, abort, ExitCode, Termination), thread and Mutex are std. `AssertUnwindSafe` is core (`core::panic`). Also: <https://doc.rust-lang.org/std/process/index.html>
"""

[[sections]]
heading = "Not covered"
body = """
always_abort, update_hook, ExitStatus::exit_ok (unstable), the unix `pre_exec` (unsafe), uid/gid/ process_group extensions, io::pipe (see the io pages), `#[panic_handler]` (no_std only), panic=abort cannot be demonstrated inside one build profile (described below).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>A bug / broken invariant</td><td><code>panic! / assert! / unreachable! / expect("why it holds")</code></td></tr><tr><td>An expected failure (input, I/O)</td><td><code>Result</code></td></tr><tr><td>Isolate a panic in a worker</td><td><code>thread::spawn(..).join()  or catch_unwind</code></td></tr><tr><td>Re-raise after cleanup</td><td><code>resume_unwind(payload)</code></td></tr><tr><td>Read the message from a payload</td><td><code>downcast_ref::&lt;&amp;str&gt;() then ::&lt;String&gt;()</code></td></tr><tr><td>Log every panic once</td><td><code>set_hook (process-wide)</code></td></tr><tr><td>Set the exit status</td><td><code>return ExitCode from main (destructors run)</code></td></tr><tr><td>Quit from deep inside (no destructors)</td><td><code>process::exit(code)</code></td></tr><tr><td>Die immediately</td><td><code>process::abort()</code></td></tr><tr><td>Run and capture output</td><td><code>Command::output()</code></td></tr><tr><td>Run, inherit the terminal</td><td><code>Command::status()</code></td></tr><tr><td>Stream or feed a child</td><td><code>spawn() with Stdio::piped(), then wait() PANIC STRATEGY: by default a panic UNWINDS the thread, running destructors. With panic = "abort" in a Cargo profile the process aborts after the hook runs: no destructors, catch_unwind catches nothing, a panicking thread takes the whole process down. So a library must not rely on catch_unwind for correctness.</code></td></tr></tbody></table>
"""

