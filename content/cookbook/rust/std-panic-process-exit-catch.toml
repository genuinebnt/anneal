[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>worker isolation</li><li>test harnesses</li><li>CLI exit codes</li><li>running external tools with pipes and timeouts</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>keeping a server alive when one request handler panics</li><li>crash reporting hooks</li><li><code>git</code>/<code>ffmpeg</code> wrappers</li><li>health-check commands</li><li>supervising a subprocess</li></ul>
"""

