"""

[[sections]]
heading = "Design notes"
body = """
RAII: acquiring a resource creates a guard value; when the guard goes out of scope (return, `?`, even panic), `Drop::drop` runs and releases it. `MutexGuard`, `File`, tokio `OwnedSemaphorePermit` all work this way. Drop order: locals drop in **reverse** declaration order; struct fields drop in declaration order.
"""

