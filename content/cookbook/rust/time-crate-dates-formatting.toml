[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>services that want a small</li><li>panic-free</li><li>no-implicit-local-time date library</li><li>embedded/<code>no_std</code> friendly code</li><li>strict RFC 3339 handling</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>log/trace timestamps (tracing-subscriber uses <code>time</code>)</li><li>JWT expiry</li><li>certificate validity windows</li><li>API payloads in RFC 3339</li><li>compile-time-checked literals (<code>datetime!</code>) in tests and config defaults</li></ul>
"""

