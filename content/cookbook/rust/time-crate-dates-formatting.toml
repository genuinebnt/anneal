[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>A compile-time checked literal</td><td><code>date!(2024-03-05), time!(14:30), datetime!(2024-03-05 14:30 UTC)</code></td></tr><tr><td>Current instant</td><td><code>OffsetDateTime::now_utc()</code></td></tr><tr><td>Parse RFC 3339</td><td><code>OffsetDateTime::parse(s, &amp;Rfc3339)</code></td></tr><tr><td>Format RFC 3339</td><td><code>dt.format(&amp;Rfc3339)?</code></td></tr><tr><td>Custom format (compile time)</td><td><code>format_description!("[year]-[month]-[day] [hour]:[minute]:[second]")</code></td></tr><tr><td>Custom format (from config/runtime)</td><td><code>format_description::parse_borrowed::&lt;2&gt;(&amp;str)?  (returns Vec&lt;FormatItem&gt;)</code></td></tr><tr><td>Epoch seconds &lt;</td><td><code>instant             -&gt; from_unix_timestamp(i64)? / unix_timestamp()</code></td></tr><tr><td>Change zone</td><td><code>to_offset(UtcOffset) (same instant) vs replace_offset (reinterpret!)</code></td></tr><tr><td>Add days/hours</td><td><code>dt + Duration::days(1) ; checked_add for untrusted; saturating_add for clamping</code></td></tr><tr><td>Month arithmetic</td><td><code>NO built-in add months: use Month::next + replace_day, shown below</code></td></tr><tr><td>Weekday / ISO week</td><td><code>date.weekday(), date.iso_week()</code></td></tr><tr><td>Continuous day number (Julian day)</td><td><code>date.to_julian_day()</code></td></tr><tr><td>JSON field as RFC 3339 / epoch</td><td><code>#[serde(with = "time::serde::rfc3339")] / "time::serde::timestamp::milliseconds"</code></td></tr><tr><td>Epoch MILLISECONDS (JavaScript, Java)</td><td><code>from_unix_timestamp_nanos(ms as i128 * 1_000_000)</code></td></tr><tr><td>Next Friday</td><td><code>date.next_occurrence(Weekday::Friday)  (strictly after date) WHEN TO CHOOSE WHICH: chrono has Months, chrono-tz (real IANA zones), a bigger ecosystem and lax-ish ergonomics; time has no built-in IANA database (offsets only; zones need an add-on such as time-tz), compile-time literals, fully checked constructors, and no_std. jiff (BurntSushi) is the newer all-in-one with zones. For services that store UTC and display fixed offsets, both work. MSRV/SOUNDNESS: time raises its MSRV quickly (track the Cargo.lock); UtcOffset::current_local_offset returns Err when other threads exist on Unix (because localtime_r reads TZ unsafely), which is why local-offset is opt-in: determine the offset once at startup.</code></td></tr></tbody></table>
"""

