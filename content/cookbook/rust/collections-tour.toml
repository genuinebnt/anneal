heading = "Design notes"
body = """
Choosing: Vec (default) &#124; VecDeque (queue/both ends) &#124; HashMap/HashSet (lookup, unordered) &#124; BTreeMap/BTreeSet (sorted, range queries, deterministic iteration) &#124; BinaryHeap (priority) &#124; never LinkedList. Docs: <https://doc.rust-lang.org/std/collections/index.html>
"""

