[[sections]]
heading = "Rules of thumb that held up"
body = """
<ol> <li><strong>Default to <code>SeqCst</code>; weaken it only with an argument and a test.</strong> An argument names the happens-before edge you rely on; a test is a litmus test or a Miri run.</li> <li><strong>Pair every <code>Acquire</code> with a <code>Release</code> on the same variable and write down what the pair publishes.</strong></li> <li><strong>A lock hides the memory model; a lock-free structure exposes it.</strong> Use <code>std::sync::Mutex</code> and <code>RwLock</code> until a profile says otherwise (<a href="/cookbook/p/profiling-and-observability">Profiling</a>).</li> <li><strong>Keep <code>unsafe</code> blocks small, one operation each, with a <code>// SAFETY:</code> comment saying which invariant makes it sound.</strong> Put <code>#![deny(unsafe_op_in_unsafe_fn)]</code> on the crate.</li> <li><strong>Give every unsafe abstraction a model test.</strong> Compare with the safe equivalent on random operations, count drops, and run the tests under Miri.</li> <li><strong>Pad hot, per-thread data to the coherence unit</strong> (128 bytes on this machine) and shard counters.</li> <li><strong>Treat <code>unsafe impl Send/Sync</code> as the most dangerous line in a file.</strong> It is a statement about every use of the type from now on.</li> </ol>

<aside data-call="rust"><b>Rust notes</b><ul> <li><strong><code>MaybeUninit&lt;T&gt;</code></strong> is the only sound way to hold memory that is not yet a <code>T</code>. <code>StackVec</code> stores <code>[MaybeUninit&lt;T&gt;; N]</code>, writes with <code>.write(x)</code>, and reads with <code>assume_init_read()</code> exactly once per element; <code>[const { MaybeUninit::uninit() }; N]</code> builds the array without requiring <code>T: Copy</code>.</li> <li><strong><code>ptr::copy</code> handles overlap (<code>memmove</code>); <code>copy_nonoverlapping</code> does not (<code>memcpy</code>).</strong> <code>insert</code> and <code>remove</code> shift within one buffer, so they use <code>copy</code>.</li> <li><strong><code>read_unaligned</code> and <code>write_unaligned</code></strong> copy a value out of or into bytes at any address; <code>&amp;*(ptr as *const T)</code> requires alignment and validity. <code>PageHeader::view</code> checks alignment and falls back to <code>None</code>; <code>read</code> always works, at the price of a copy.</li> <li><strong><code>#[repr(C)]</code></strong> fixes field order and layout, <code>#[repr(align(128))]</code> raises alignment; <code>const _: () = assert!(size_of::&lt;PageHeader&gt;() == 16)</code> turns a layout assumption into a compile error.</li> <li><strong><code>UnsafeCell&lt;T&gt;</code></strong> is the one primitive that permits mutation through a shared reference; <code>Mutex</code>, <code>RefCell</code>, atomics and <code>Cell</code> are built on it. A type containing it is <code>!Sync</code> until you write <code>unsafe impl Sync</code>, and the compiler's disjoint closure capture means a closure that touches a <em>field</em> bypasses the wrapper's <code>Sync</code> impl; use a method (the Miri demos do).</li> <li><strong><code>std::hint::spin_loop()</code></strong> in a wait loop tells the processor it is spinning; on ARM it compiles to <code>isb</code> or <code>yield</code> depending on the target.</li> <li><strong><code>Drop</code> runs for the initialized prefix only:</strong> <code>StackVec::drop</code> calls <code>drop_in_place</code> on the slice <code>buf[..len]</code>; dropping the <code>MaybeUninit</code> array does nothing by design.</li> </ul></aside>

<aside data-call="testing"><b>Test plan</b><ul> <li><strong><code>StackVec</code></strong>: 600 rounds of 40 random operations (push, pop, insert, remove, clear, clone, with a full vector rejecting an insert and returning the element) against a <code>Vec</code> model; every element made is dropped exactly once (a leak or a double drop fails the count); zero-sized elements and capacity 0.</li> <li><strong><code>PageHeader</code></strong>: write then read round trip; <code>view</code> at an aligned address returns a reference, at an odd address returns <code>None</code> while <code>read</code> still works; too short, wrong magic; 20 000 random buffers on which <code>view</code> and <code>read</code> agree.</li> <li><strong>Litmus</strong>: the totals equal the iterations; the forbidden outcomes are zero (<code>SeqCst</code> store buffering, <code>Release</code>/<code>Acquire</code> message passing, acquire/release load buffering); the allowed ones are seen (each thread wins store buffering sometimes; the reader sometimes sees the message and sometimes does not), or the harness is not racing.</li> <li><strong>Counters</strong>: no increment is lost in any kind of counter or in the padded-increment experiment.</li> <li><strong>Miri</strong>: the above, with fewer iterations, under <code>cargo +nightly miri test</code>; six programs of <code>verify/miri/</code> with the verdicts above.</li> <li><strong>Mutants run against these tests</strong> (15): in <code>StackVec</code>, <code>push</code> one past the end, <code>pop</code> not shrinking, the slice one short, <code>insert</code> and <code>remove</code> moving too few elements, <code>drop</code> leaking, <code>remove</code> and <code>insert</code> not changing the length; in <code>PageHeader</code>, a view at any address, in a short buffer, a copy without its magic check; in the harness, instances not reset, a counter that loses increments, a store-buffering test with relaxed orderings, a message-passing test that sets the flag before the data. <strong>All 15 were killed</strong>; three (<code>pop</code> not shrinking, and the two moves) by the test process crashing, which the first version of the mutation runner misreported as survival until it checked the exit status.</li> </ul></aside>

<aside data-call="production"><b>What production systems do</b><ul> <li><strong>Rust database engines</strong> (TiKV, Materialize, RisingWave, DataFusion, Neon's storage layer, SurrealDB, Databend, GreptimeDB, and many others) use <code>unsafe</code> for the same reasons as above, behind small interfaces, and lean on <code>crossbeam</code>, <code>parking_lot</code>, <code>bytes</code> and <code>zerocopy</code>/<code>bytemuck</code> for the sound versions of common patterns.</li> <li><strong><code>loom</code></strong> explores every interleaving of a small concurrent program under the C++ memory model; <strong>Miri</strong> runs in the continuous integration of <code>crossbeam</code>, <code>tokio</code> and the standard library itself; <strong>ThreadSanitizer</strong> (nightly) finds races in executions it observes; <strong><code>cargo-careful</code></strong> and <strong><code>cargo-fuzz</code></strong> add debug assertions and input fuzzing for unsafe code.</li> <li><strong>Memory models in C and C++ systems</strong>: the Linux kernel has its own model (checked with <code>herd7</code>), PostgreSQL implements <code>pg_atomic_*</code> operations with explicit barriers per platform, and most engines wrap the compiler's atomics in a small layer that names the intent (<code>acquire_load</code>, <code>publish</code>).</li> <li><strong>Cache-line padding and sharding</strong> appear in every engine's statistics, lock tables, latch arrays and epoch counters (<code>CachePadded</code>, <code>alignas(64)</code> or 128), and the Linux kernel has <code>____cacheline_aligned</code> and per-CPU variables.</li> <li><strong>Safety audits</strong>: crates that use <code>unsafe</code> are reviewed by <code>cargo geiger</code> counts and by Miri runs; the Rust project's <code>unsafe</code> code guidelines working group maintains the reference for what is and is not allowed.</li> </ul></aside>

<aside data-call="warning"><b>Pitfalls</b><ul> <li><strong>"It passes on my machine" is not a memory-model argument.</strong> x86 hides most reorderings; this processor hides some that others show. Run Miri, <code>loom</code>, or a litmus test on weak hardware.</li> <li><strong><code>Relaxed</code> is atomic, not ordered.</strong> Counters are fine with it; flags that publish data are not.</li> <li><strong><code>SeqCst</code> is not a cure for everything.</strong> It orders only <code>SeqCst</code> operations with each other, and it can cost a fence per store.</li> <li><strong>A raw pointer cast to a reference is a claim about alignment, validity, aliasing and lifetime.</strong> Check each, or copy the bytes.</li> <li><strong>Padding is machine-specific.</strong> 64 is not enough on this processor; 128 wastes space on a machine with 64-byte lines. Measure on the target.</li> <li><strong><code>unsafe impl Sync</code> after a failed compile is the wrong fix.</strong> Read the error: it usually says a closure captured a field, or a type contains a raw pointer, and the real answer is a method or a wrapper that carries the promise in one place.</li> <li><strong><code>mem::forget</code> and leaks are safe; use-after-free is not.</strong> Leaking memory is allowed in safe Rust; do not confuse the two when wrapping unsafe code.</li> <li><strong>Miri cannot run everything.</strong> It is slow (the litmus test above runs 256 instances, not 2 million), does not model all hardware, and cannot call most foreign code; use it on the unit-sized pieces.</li> </ul></aside>
