[[sections]]
heading = "Overview"
body = """
### Key ideas

<ul> <li><strong>Safe Rust cannot have undefined behavior or data races; <code>unsafe</code> is a promise that you have not introduced one.</strong> The compiler checks every reference for validity, exclusivity and lifetime, and every shared value for thread safety. An <code>unsafe</code> block turns off those checks for five operations (dereferencing a raw pointer, calling an unsafe function, accessing a mutable static, implementing an unsafe trait, accessing a union field) and leaves their obligations to you. The point of Rust for a database is not that it has no <code>unsafe</code>; it is that <code>unsafe</code> is <em>small</em>, <em>marked</em>, and wrapped in an interface that no safe caller can misuse.</li> <li><strong>A sound abstraction states its invariant and is tested against it.</strong> <code>StackVec&lt;T, N&gt;</code> below keeps <code>buf[..len]</code> initialized and <code>buf[len..]</code> untouched; every <code>unsafe</code> block says why that invariant makes it correct (a <code>// SAFETY:</code> comment is the convention), and the tests compare the vector with a <code>Vec</code> while counting drops. <code>PageHeader::view</code> looks at bytes in place as a struct, which is sound only if the address is aligned and the length sufficient, so it checks both and returns <code>None</code> otherwise.</li> <li><strong>Why a database needs <code>unsafe</code> at all:</strong> page frames that are viewed as typed structures without copying; a buffer pool that hands out references into frames; lock-free and optimistic structures; arenas; memory-mapped files; SIMD; calls into the operating system. Each can be wrapped.</li> <li><strong>Atomics are not magic variables; they are the vocabulary of the memory model.</strong> The <em>language's</em> model says what a program may observe; the compiler may reorder to anything it allows; the <em>processor</em> may reorder further, differently on x86 (total store order: mostly strong) and ARM (weak). A <code>Relaxed</code> operation is atomic but orders nothing; a <code>Release</code> store and an <code>Acquire</code> load that reads it order everything before the store before everything after the load; <code>SeqCst</code> adds one total order of all <code>SeqCst</code> operations.</li> <li><strong>A program can pass every test on one machine and be wrong.</strong> The tests below count outcomes the language permits that this processor does or does not show. Miri, which implements the language's model rather than a processor's, shows the ones the hardware hides.</li> <li><strong>Contention is a property of cache lines.</strong> One shared atomic counter incremented by many threads scales <em>down</em>; the same counter split into per-thread cells scales <em>up</em>, provided each cell has a cache line of its own. On this machine a line is 128 bytes, not 64.</li> </ul>
"""

[[sections]]
heading = "What the hardware does with each ordering"
body = """
```text title="the arm64 instruction each atomic operation becomes"
operation   ordering   arm64 instruction (rustc --emit asm, default aarch64-apple-darwin target)
load        Relaxed    ldr
load        Acquire    ldapr
load        SeqCst     ldar
store       Relaxed    str
store       Release    stlr
store       SeqCst     stlr
fetch_add   Relaxed    ldadd
fetch_add   SeqCst     ldaddal
```

<p>On x86-64, loads and stores of every ordering below <code>SeqCst</code> compile to plain <code>mov</code>, and only a <code>SeqCst</code> store (or a <code>fetch_add</code>, which is a locked instruction anyway) costs a fence. On ARM the cheaper orderings are cheaper in instructions too, and the weaker orderings allow more hardware reordering. The language does not tell you which machine you will meet.</p>

:::deeper Reference: litmus tests on real threads (store buffering, message passing, load buffering), false-sharing and counter experiments
```rust title="src/test/litmus.rs"
//! Memory-model litmus tests and shared-counter experiments on real threads. A litmus test is a tiny concurrent program whose possible
//! outcomes tell which reorderings the language and the processor allow. Each test here runs two threads over many independent instances
//! of the same variables and counts how often each outcome appears. The outcomes depend on the compiler *and* the processor: a weak
//! outcome that is allowed but never seen on this machine proves nothing about another.
use std::sync::atomic::{AtomicU64, AtomicUsize, Ordering};
use std::sync::Arc;

/// Counts of outcome pairs `(r0, r1)` over all runs.
#[derive(Default, Debug, Clone)]
pub struct Outcomes {
    pub counts: std::collections::BTreeMap<(u64, u64), u64>,
}
impl Outcomes {
    pub fn get(&self, a: u64, b: u64) -> u64 {
        self.counts.get(&(a, b)).copied().unwrap_or(0)
    }
    pub fn total(&self) -> u64 {
        self.counts.values().sum()
    }
}

/// Instances run per synchronization point: each thread finishes its batch before the next starts, so the two threads are close in time.
const BATCH: usize = 64;

/// A pair of atomics on separate cache lines (so that the test measures ordering, not false sharing).
#[repr(align(128))]
pub struct Cell(pub AtomicU64);

/// Run `body0` on one thread and `body1` on another over `iters` instances of `State`, `BATCH` at a time, and count the pairs returned.
pub fn run<S, F0, F1>(iters: usize, make: fn() -> S, reset: fn(&S), body0: F0, body1: F1) -> Outcomes
where
    S: Send + Sync + 'static,
    F0: Fn(&S) -> u64 + Send + Sync + 'static,
    F1: Fn(&S) -> u64 + Send + Sync + 'static,
{
    let batches = iters / BATCH;
    let states: Arc<Vec<S>> = Arc::new((0..BATCH).map(|_| make()).collect());
    let results: Arc<Vec<[AtomicU64; 2]>> = Arc::new((0..BATCH).map(|_| [AtomicU64::new(0), AtomicU64::new(0)]).collect());
    // two barriers per batch: "start" (both threads ready, the instances reset) and "done"
    let start = Arc::new(AtomicUsize::new(0));
    let done = Arc::new(AtomicUsize::new(0));
    let worker = |id: usize, body: Arc<dyn Fn(&S) -> u64 + Send + Sync>, states: Arc<Vec<S>>, results: Arc<Vec<[AtomicU64; 2]>>, start: Arc<AtomicUsize>, done: Arc<AtomicUsize>| {
        std::thread::spawn(move || {
            for b in 0..batches {
                // wait for the batch to be released
                while start.load(Ordering::Acquire) <= b {
                    std::hint::spin_loop();
                }
                for (i, s) in states.iter().enumerate() {
                    results[i][id].store(body(s), Ordering::Relaxed);
                }
                done.fetch_add(1, Ordering::AcqRel);
            }
        })
    };
    let h0 = worker(0, Arc::new(body0), states.clone(), results.clone(), start.clone(), done.clone());
    let h1 = worker(1, Arc::new(body1), states.clone(), results.clone(), start.clone(), done.clone());
    let mut out = Outcomes::default();
    for b in 0..batches {
        for s in states.iter() {
            reset(s);
        }
        start.fetch_add(1, Ordering::Release);
        while done.load(Ordering::Acquire) < 2 * (b + 1) {
            std::hint::spin_loop();
        }
        for r in results.iter() {
            *out.counts.entry((r[0].load(Ordering::Relaxed), r[1].load(Ordering::Relaxed))).or_default() += 1;
        }
    }
    h0.join().unwrap();
    h1.join().unwrap();
    out
}

pub struct Two {
    pub x: Cell,
    pub y: Cell,
}
pub fn two() -> Two {
    Two { x: Cell(AtomicU64::new(0)), y: Cell(AtomicU64::new(0)) }
}
pub fn zero(s: &Two) {
    s.x.0.store(0, Ordering::Relaxed);
    s.y.0.store(0, Ordering::Relaxed);
}

/// Store buffering: `x = 1; r0 = y` on one thread, `y = 1; r1 = x` on the other. `(0, 0)` means both stores were still in a store buffer
/// when the other thread read: forbidden under sequential consistency.
pub fn store_buffering(iters: usize, store: Ordering, load: Ordering) -> Outcomes {
    run(
        iters,
        two,
        zero,
        move |s| {
            s.x.0.store(1, store);
            s.y.0.load(load)
        },
        move |s| {
            s.y.0.store(1, store);
            s.x.0.load(load)
        },
    )
}

/// Message passing: the writer sets data, then a flag; the reader reads the flag, then the data. `(1, 0)` as (flag, data) is the reader
/// seeing the flag but not the data the writer wrote before it.
pub fn message_passing(iters: usize, flag_store: Ordering, flag_load: Ordering) -> Outcomes {
    run(
        iters,
        two,
        zero,
        move |s| {
            s.x.0.store(1, Ordering::Relaxed); // data
            s.y.0.store(1, flag_store); // flag
            0
        },
        move |s| {
            let flag = s.y.0.load(flag_load);
            let data = s.x.0.load(Ordering::Relaxed);
            flag * 2 + data // 0..=3; (flag 1, data 0) = 2
        },
    )
}

/// Load buffering: `r0 = y; x = 1` and `r1 = x; y = 1`. `(1, 1)` means each load saw the store that comes *after* the other's load.
pub fn load_buffering(iters: usize, store: Ordering, load: Ordering) -> Outcomes {
    run(
        iters,
        two,
        zero,
        move |s| {
            let r = s.y.0.load(load);
            s.x.0.store(1, store);
            r
        },
        move |s| {
            let r = s.x.0.load(load);
            s.y.0.store(1, store);
            r
        },
    )
}

// ---- shared counters -----------------------------------------------------------------------------------------------------------------

/// Each of `threads` threads adds 1 to its own counter `ops` times; the counters are `stride_bytes` apart. Returns nanoseconds per
/// increment across all threads (wall time divided by the total number of increments times the thread count, i.e. per-thread latency).
pub fn increments_per_thread_ns(threads: usize, stride_bytes: usize, ops: u64) -> f64 {
    assert!(stride_bytes % 8 == 0 && stride_bytes >= 8);
    let step = stride_bytes / 8;
    let cells: Arc<Vec<AtomicU64>> = Arc::new((0..threads * step + 32).map(|_| AtomicU64::new(0)).collect());
    // align the first counter to a 128-byte boundary so the stride is the only thing that varies
    let base = {
        let p = cells.as_ptr() as usize;
        ((128 - p % 128) % 128) / 8
    };
    let go = Arc::new(AtomicUsize::new(0));
    let hs: Vec<_> = (0..threads)
        .map(|t| {
            let (cells, go) = (cells.clone(), go.clone());
            std::thread::spawn(move || {
                while go.load(Ordering::Acquire) == 0 {
                    std::hint::spin_loop();
                }
                let c = &cells[base + t * step];
                let start = std::time::Instant::now();
                for _ in 0..ops {
                    c.fetch_add(1, Ordering::Relaxed);
                }
                start.elapsed().as_secs_f64()
            })
        })
        .collect();
    go.store(1, Ordering::Release);
    let times: Vec<f64> = hs.into_iter().map(|h| h.join().unwrap()).collect();
    let total: u64 = (0..threads).map(|t| cells[base + t * step].load(Ordering::Relaxed)).sum();
    assert_eq!(total, threads as u64 * ops, "no increment may be lost");
    times.iter().sum::<f64>() / threads as f64 * 1e9 / ops as f64
}

/// A counter that every thread increments: one atomic, or a lock, or one padded cell per thread (summed when read).
pub enum Counter {
    Shared(AtomicU64),
    Locked(std::sync::Mutex<u64>),
    Sharded(Vec<Cell>),
}
impl Counter {
    pub fn add(&self, thread: usize) {
        match self {
            Counter::Shared(a) => {
                a.fetch_add(1, Ordering::Relaxed);
            }
            Counter::Locked(m) => *m.lock().unwrap() += 1,
            Counter::Sharded(cells) => {
                cells[thread].0.fetch_add(1, Ordering::Relaxed);
            }
        }
    }
    pub fn value(&self) -> u64 {
        match self {
            Counter::Shared(a) => a.load(Ordering::SeqCst),
            Counter::Locked(m) => *m.lock().unwrap(),
            Counter::Sharded(cells) => cells.iter().map(|c| c.0.load(Ordering::SeqCst)).sum(),
        }
    }
}

/// Million increments per second across all threads for each kind of counter.
pub fn counter_throughput(kind: &str, threads: usize, ops_per_thread: u64) -> f64 {
    let counter = Arc::new(match kind {
        "shared atomic" => Counter::Shared(AtomicU64::new(0)),
        "mutex" => Counter::Locked(std::sync::Mutex::new(0)),
        _ => Counter::Sharded((0..threads).map(|_| Cell(AtomicU64::new(0))).collect()),
    });
    let go = Arc::new(AtomicUsize::new(0));
    let hs: Vec<_> = (0..threads)
        .map(|t| {
            let (c, go) = (counter.clone(), go.clone());
            std::thread::spawn(move || {
                while go.load(Ordering::Acquire) == 0 {
                    std::hint::spin_loop();
                }
                for _ in 0..ops_per_thread {
                    c.add(t);
                }
            })
        })
        .collect();
    let start = std::time::Instant::now();
    go.store(1, Ordering::Release);
    for h in hs {
        h.join().unwrap();
    }
    let secs = start.elapsed().as_secs_f64();
    assert_eq!(counter.value(), threads as u64 * ops_per_thread, "{kind}: no increment may be lost");
    (threads as u64 * ops_per_thread) as f64 / secs / 1e6
}
```
