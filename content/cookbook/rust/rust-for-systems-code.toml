"""

[[sections]]
heading = "Measured"
body = """
<p>The litmus harness runs two threads over 2 million independent instances of two variables each, 64 at a time per synchronization, and counts outcomes. A <em>forbidden</em> outcome is one the model rules out for those orderings. The outcome counts for the weak cases change from run to run by a factor of several; the zeros do not.</p>

```text title="on the Apple M4 Pro (12 cores, 128-byte cache line, weak memory model)"
store buffering (0,0): SeqCst 0, Release/Acquire 0, Relaxed 1628739 of 2097152
message passing (flag seen, data not): Release/Acquire 0, Relaxed 4273 of 2097152
load buffering (1,1): Release/Acquire 0, Relaxed 0 of 2097152
```

```text title="in Miri, which implements the language's model (256 instances)"
store buffering (0,0): SeqCst 0, Release/Acquire 130, Relaxed 130 of 256
message passing (flag seen, data not): Release/Acquire 0, Relaxed 15 of 256
load buffering (1,1): Release/Acquire 0, Relaxed 0 of 256
```

<ul> <li><strong>Store buffering.</strong> Each thread stores to its own variable and reads the other's. Under sequential consistency at least one thread must see the other's store, so <code>(0, 0)</code> is forbidden. With <code>SeqCst</code> it never happened. With <code>Relaxed</code> it happened in <strong>78% of runs</strong> (1.63 million of 2.10 million): each store waited in a store buffer while the other thread's load went ahead, which is exactly what a store buffer is for. With <code>Release</code>/<code>Acquire</code> the language <em>allows</em> <code>(0, 0)</code> (Miri produced it in 130 of 256 instances), but <strong>this processor never showed it</strong> in 2 million runs: <code>stlr</code> followed by <code>ldapr</code> is the cheapest correct translation, and whether a core reorders that pair is a property of the core. Code that works here by luck of the microarchitecture can break on another core or after a compiler change.</li> <li><strong>Message passing.</strong> The writer stores data then sets a flag; the reader reads the flag then the data. Seeing the flag without the data is forbidden with a <code>Release</code> store and an <code>Acquire</code> load: <strong>0 occurrences</strong> in hardware and in Miri. With <code>Relaxed</code> on both it is allowed, and it happened 4 273 times in 2.1 million runs (15 of 256 in Miri). That is the failure a lock-free queue with a relaxed flag has: rare, silent, and data-dependent.</li> <li><strong>Load buffering</strong> <code>(1, 1)</code> is allowed for relaxed operations by the model and by ARM; neither hardware nor Miri produced it. Not seeing an allowed outcome is not evidence that it cannot occur.</li> </ul>

```text title="false sharing: 8 threads each incrementing their own counter, the counters a given number of bytes apart"
stride      ns per increment (8 threads)
8 bytes                     121.14
16 bytes                     75.68
32 bytes                     23.32
64 bytes                      2.71
128 bytes                     1.79
256 bytes                     1.79
```

```text title="million increments per second, all threads together, by kind of counter and number of threads"
counter                  1         2         4         8        12   (million increments per second, all threads)
shared atomic          558       112        72        39        20
mutex                  236        93        68        76        91
sharded                553      1112      2167      4322      4699
```

<ul> <li><strong>False sharing costs 68×.</strong> Counters 8 bytes apart (all in the same cache line) take 121 ns per increment per thread; 16 bytes 76 ns; 32 bytes 23 ns; <strong>64 bytes still 2.7 ns, against 1.8 ns at 128 bytes and beyond</strong>. The 64-byte padding that is right for most x86 machines is not enough here: the coherence unit on this processor is 128 bytes (<code>sysctl hw.cachelinesize</code> says 128), so two counters 64 bytes apart still share one. <code>crossbeam</code>'s <code>CachePadded</code> pads to 128 bytes on aarch64 and x86-64 for this reason.</li> <li><strong>One shared atomic gets slower with every thread</strong> (558 million increments per second on one thread, 20 on twelve), because every increment must own the line. <strong>A mutex is slower still at one thread and flat beyond</strong> (236 → 91). <strong>Sharded counters scale almost linearly</strong> (553 → 4 699, 8.5× on twelve threads), each thread's cell on its own line, at the price that reading the total means summing the cells and sees a count that may be a moment old.</li> <li>The same shape governs buffer-pool statistics, hit counters, per-operator row counts and every metric you add (<a href="/cookbook/p/profiling-and-observability">Profiling</a>): a global counter on the hot path is a scalability bug.</li> </ul>
"""

[[sections]]
heading = "The unsafe code under Miri"
body = """
<p>Miri interprets the program's MIR and checks every operation against the rules: alignment, validity of values, initialization, the aliasing model for references, data races, memory leaks and use after free. All the tests of <code>StackVec</code> and <code>PageHeader</code> and the litmus harness pass under it (<code>cargo +nightly miri test --test sysrust</code>). To see what it catches, here are five deliberately undefined programs and one that fixes a race (the sources are in <code>verify/miri/</code>):</p>

```text title="cargo +nightly miri run, one small program per bin"
$ cargo +nightly miri run --bin unaligned
error: Undefined Behavior: constructing invalid value of type &u32: encountered an unaligned reference (required 4 byte alignment but found 1)
$ cargo +nightly miri run --bin race_relaxed
error: Undefined Behavior: Data race detected between (1) non-atomic write on thread `unnamed-1` and (2) non-atomic read on thread `unnamed-2` at alloc210
$ cargo +nightly miri run --bin race_release
42
$ cargo +nightly miri run --bin use_after_free
error: Undefined Behavior: memory access failed: alloc289 has been freed, so this pointer is dangling
$ cargo +nightly miri run --bin uninit
error: Undefined Behavior: constructing invalid value of type u32: encountered uninitialized memory, but expected an integer
$ cargo +nightly miri run --bin two_mut
error: Undefined Behavior: attempting a read access using <541> at alloc207[0x0], but that tag does not exist in the borrow stack for this location
```

<p>The race is the lesson of the litmus tests in a form a compiler cannot see:</p>

```rust title="the relaxed version (src/bin/race_relaxed.rs); the release/acquire version differs in the two orderings"
// Message passing with a relaxed flag: the reader may see the flag without the data, and the plain read of the data races with the write.
use std::cell::UnsafeCell;
use std::sync::atomic::{AtomicBool, Ordering};
struct Shared { data: UnsafeCell<u64>, ready: AtomicBool }
unsafe impl Sync for Shared {}
impl Shared { fn data(&self) -> *mut u64 { self.data.get() } }
fn main() {
    let s = Shared { data: UnsafeCell::new(0), ready: AtomicBool::new(false) };
    std::thread::scope(|sc| {
        sc.spawn(|| {
            unsafe { *s.data() = 42 };
            s.ready.store(true, Ordering::Relaxed);
        });
        sc.spawn(|| {
            while !s.ready.load(Ordering::Relaxed) { std::hint::spin_loop(); }
            println!("{}", unsafe { *s.data() });
        });
    });
}
```

<p>With <code>Relaxed</code> on the flag, the plain write of <code>data</code> and the plain read of <code>data</code> are not ordered by anything, so Miri reports a data race: undefined behavior, even though on x86 and on this processor the program would almost always print 42. With <code>Release</code> and <code>Acquire</code> the write happens before the read and Miri prints 42.</p>

:::deeper Reference: an inline vector and a page header view, with their invariants
```rust title="src/test/stackvec.rs"
//! A growable vector with room for `N` elements inside the value itself, and a view of a page header cast from bytes: two of the small
//! `unsafe` abstractions that storage engines are full of. Each is a safe interface over code that is sound only if a stated invariant
//! holds; the tests state the invariant and check it, and the whole file is meant to be run under Miri (`cargo +nightly miri test`).
use std::mem::MaybeUninit;

/// A vector of at most `N` elements stored inline. Invariant: `buf[..len]` is initialized and `buf[len..]` is not (and is never read).
pub struct StackVec<T, const N: usize> {
    buf: [MaybeUninit<T>; N],
    len: usize,
}

impl<T, const N: usize> StackVec<T, N> {
    pub fn new() -> Self {
        StackVec { buf: [const { MaybeUninit::uninit() }; N], len: 0 }
    }
    pub fn len(&self) -> usize {
        self.len
    }
    pub fn is_empty(&self) -> bool {
        self.len == 0
    }
    pub fn capacity(&self) -> usize {
        N
    }
    /// Append, or give the element back when the vector is full.
    pub fn push(&mut self, x: T) -> Result<(), T> {
        if self.len == N {
            return Err(x);
        }
        self.buf[self.len].write(x);
        self.len += 1;
        Ok(())
    }
    pub fn pop(&mut self) -> Option<T> {
        if self.len == 0 {
            return None;
        }
        self.len -= 1;
        // SAFETY: slot `len` was initialized (it was inside `buf[..len]`) and is now outside it, so it is read exactly once.
        Some(unsafe { self.buf[self.len].assume_init_read() })
    }
    pub fn as_slice(&self) -> &[T] {
        // SAFETY: `buf[..len]` is initialized, and `MaybeUninit<T>` has the layout of `T`.
        unsafe { std::slice::from_raw_parts(self.buf.as_ptr() as *const T, self.len) }
    }
    pub fn as_mut_slice(&mut self) -> &mut [T] {
        // SAFETY: as in `as_slice`, and the exclusive borrow of `self` makes the unique borrow of the slice sound.
        unsafe { std::slice::from_raw_parts_mut(self.buf.as_mut_ptr() as *mut T, self.len) }
    }
    /// Insert at `at`, shifting the tail right; gives the element back when full.
    pub fn insert(&mut self, at: usize, x: T) -> Result<(), T> {
        assert!(at <= self.len, "insert index {at} beyond length {}", self.len);
        if self.len == N {
            return Err(x);
        }
        // SAFETY: the source range `at..len` is initialized, the destination `at+1..len+1` is within `N`; `copy` handles the overlap.
        // After the move slot `at` holds a stale bit copy that is overwritten without being dropped.
        unsafe {
            let p = self.buf.as_mut_ptr().add(at);
            std::ptr::copy(p, p.add(1), self.len - at);
            (*p).write(x);
        }
        self.len += 1;
        Ok(())
    }
    pub fn remove(&mut self, at: usize) -> T {
        assert!(at < self.len, "remove index {at} beyond length {}", self.len);
        // SAFETY: slot `at` is initialized; it is read out once and the tail is moved over it, after which the length shrinks by one.
        unsafe {
            let p = self.buf.as_mut_ptr().add(at);
            let x = (*p).assume_init_read();
            std::ptr::copy(p.add(1), p, self.len - at - 1);
            self.len -= 1;
            x
        }
    }
    pub fn clear(&mut self) {
        while self.pop().is_some() {}
    }
}

impl<T, const N: usize> Default for StackVec<T, N> {
    fn default() -> Self {
        Self::new()
    }
}

impl<T, const N: usize> Drop for StackVec<T, N> {
    fn drop(&mut self) {
        // SAFETY: exactly the initialized prefix is dropped, once.
        unsafe { std::ptr::drop_in_place(self.as_mut_slice()) }
    }
}

impl<T: Clone, const N: usize> Clone for StackVec<T, N> {
    fn clone(&self) -> Self {
        let mut v = StackVec::new();
        for x in self.as_slice() {
            let _ = v.push(x.clone()); // never fails: same capacity, same length
        }
        v
    }
}

// ---- a page header viewed in place -------------------------------------------------------------------------------------------------------

/// The fixed part of a page, as stored: little-endian integers at known offsets, 16 bytes, alignment 4.
#[repr(C)]
#[derive(Debug, Clone, Copy, PartialEq)]
pub struct PageHeader {
    pub magic: u32,
    pub page_id: u32,
    pub slots: u16,
    pub flags: u16,
    pub free_end: u32,
}
const _: () = assert!(std::mem::size_of::<PageHeader>() == 16 && std::mem::align_of::<PageHeader>() == 4);

pub const MAGIC: u32 = 0xB10C_5EED;

impl PageHeader {
    /// Look at the first 16 bytes of `bytes` as a header **without copying**. Sound only when the bytes are suitably aligned (checked)
    /// and long enough (checked), and every bit pattern is a valid `PageHeader` (true: it is made of integers). The values are in the
    /// machine's byte order, which is how pages are stored here; a portable format would store little-endian and convert.
    pub fn view(bytes: &[u8]) -> Option<&PageHeader> {
        if bytes.len() < std::mem::size_of::<PageHeader>() || bytes.as_ptr() as usize % std::mem::align_of::<PageHeader>() != 0 {
            return None;
        }
        // SAFETY: length and alignment were checked above; any 16 bytes are a valid PageHeader; the result borrows `bytes`.
        let h = unsafe { &*(bytes.as_ptr() as *const PageHeader) };
        (h.magic == MAGIC).then_some(h)
    }
    /// The same, for bytes that may be misaligned: reads a copy.
    pub fn read(bytes: &[u8]) -> Option<PageHeader> {
        if bytes.len() < std::mem::size_of::<PageHeader>() {
            return None;
        }
        // SAFETY: length checked; `read_unaligned` has no alignment requirement; any 16 bytes are a valid PageHeader.
        let h = unsafe { std::ptr::read_unaligned(bytes.as_ptr() as *const PageHeader) };
        (h.magic == MAGIC).then_some(h)
    }
    pub fn write(&self, out: &mut [u8]) {
        assert!(out.len() >= 16);
        // SAFETY: length checked; `write_unaligned` has no alignment requirement.
        unsafe { std::ptr::write_unaligned(out.as_mut_ptr() as *mut PageHeader, *self) }
    }
}
