[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. What does an `async fn` return? Does it run when called? [Easy] [asked: very common] Q2.

What are `Future::poll` and `Waker`? Write a Future by hand and a tiny `block_on`. [Hard] [asked: common] Q3. Why must futures be pinned?

What are `Pin`, `Unpin`, `Box::pin` and `pin!`? [Hard] [asked: very common] Q4. `tokio::spawn` vs `join!` vs `select!`: when each? [Medium] [asked: very common] Q5. What happens when a spawned task panics?

What does `JoinHandle` give you? [Medium] [asked: common] Q6. Why is a future holding an `Rc` or a `std::sync::MutexGuard` across `.await` not `Send`? [Hard] [asked: very common] Q7. What happens if you block (`thread::sleep`) inside async code?

How do you fix it? [Medium] [asked: very common] Q8. `tokio::sync::Mutex` vs `std::sync::Mutex` in async code. [Medium] [asked: common] Q9. What does cancellation mean in async Rust? [Medium] [asked: very common] Q10.

What is cancel safety in `select!`? Give a safe and an unsafe example. [Hard] [asked: common] Q11. Why does async recursion need `Box::pin`? [Medium] [asked: occasional] Q12.

Streams vs iterators. [Medium] [asked: occasional] Q13. Why did `async fn` in traits need special support? What about `dyn`? [Hard] [asked: occasional] Q14.

How do you run CPU-bound work from async code? [Medium] [asked: common] Q15. When should you **not** use async? [Medium] [asked: common]
"""

