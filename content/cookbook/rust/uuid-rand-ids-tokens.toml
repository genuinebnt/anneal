[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Opaque random id</td><td><code>Uuid::new_v4</code></td></tr><tr><td>Primary key that sorts by creation time</td><td><code>Uuid::now_v7</code></td></tr><tr><td>Same input =&gt; same id</td><td><code>Uuid::new_v5(&amp;namespace, name)</code></td></tr><tr><td>Reproducible test data</td><td><code>a seeded generator, with the seed printed on failure</code></td></tr><tr><td>Integer in a range</td><td><code>rng.random_range(a..b)   (never x % n)</code></td></tr><tr><td>Weighted choice, many draws</td><td><code>WeightedIndex</code></td></tr><tr><td>Weighted sample WITHOUT replacement</td><td><code>choose_multiple_weighted</code></td></tr><tr><td>K random items to the front, in place</td><td><code>partial_shuffle</code></td></tr><tr><td>"rows created between t1 and t2" on v7</td><td><code>id range from the smallest id of t1 to the largest id of t2</code></td></tr><tr><td>Windows / .NET / SQL Server GUID bytes</td><td><code>from_bytes_le / to_bytes_le (first three fields are byte-swapped)</code></td></tr><tr><td>Session token / API key / reset link</td><td><code>&gt;= 128 bits from the OS (OsRng), then encode REPRODUCIBILITY WARNING. rand documents StdRng as NOT value-stable: its algorithm may change between versions. If a seed must give the same stream forever (golden files, replayable simulations), pick a named algorithm crate (rand_chacha, rand_pcg, rand_xoshiro) and pin it. This file only compares two StdRng streams within one build. SECURITY WARNING. Never derive secrets from seed_from_u64, a timestamp, or any small seed: the whole stream follows from the seed. A UUIDv7 is NOT a secret (it leaks its creation time). v4 uuids come from the OS-backed getrandom, but when you need a secret, say so in code: take raw bytes from OsRng and size them yourself.</code></td></tr></tbody></table>
"""

