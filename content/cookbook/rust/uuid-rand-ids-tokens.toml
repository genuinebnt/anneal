[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>database keys</li><li>request ids</li><li>idempotency keys</li><li>simulations and tests</li><li>session tokens</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>v7 primary keys (index-friendly)</li><li>v5 for deterministic ids from natural keys</li><li>seeded RNG for reproducible tests and load generators</li><li>OS randomness for anything an attacker must not guess</li></ul>
"""

