[[sections]]
heading = "Design notes"
body = """
**Question bank** (numbering restarts in each interview file; a generator reads these lines) Q1. Two Sum: return indices of two numbers adding to a target (unsorted input, one pass with a hash map). [Easy] [asked: very common] Q2.

Two Sum II (sorted input, two pointers) and Two Sum IV (find a pair in a BST). [Easy] [asked: very common] Q3. 3Sum and 4Sum: all unique triplets/quadruplets summing to a target (sort + two pointers + dedupe). [Medium] [asked: very common] Q4. Contains Duplicate, Valid Anagram and Group Anagrams. [Easy] [asked: very common] Q5.

Top K Frequent Elements (hash map + bucket sort). [Medium] [asked: very common] Q6. Product of Array Except Self without division. [Medium] [asked: very common] Q7. Maximum Subarray (Kadane), with indices and the circular follow-up. [Medium] [asked: very common] Q8.

Maximum Product Subarray. [Medium] [asked: common] Q9. Best Time to Buy and Sell Stock I, II, III (and IV with k transactions). [Easy] [asked: very common] Q10. Merge Intervals, Insert Interval and Non-overlapping Intervals. [Medium] [asked: very common] Q11.

Rotate Array (three reversals), Move Zeroes and Remove Duplicates in place. [Easy] [asked: very common] Q12. Container With Most Water and Trapping Rain Water (two pointers). [Hard] [asked: very common] Q13. Subarray Sum Equals K (prefix sums + hash map). [Medium] [asked: very common] Q14.

Longest Consecutive Sequence in O(n) with a hash set. [Medium] [asked: very common] Q15. Longest Substring Without Repeating Characters (sliding window). [Medium] [asked: very common] Q16. Minimum Window Substring (sliding window with a need counter). [Hard] [asked: very common] Q17.

Longest Repeating Character Replacement and Permutation in String. [Medium] [asked: common] Q18. Longest Palindromic Substring (expand around centre and Manacher) and Palindromic Substrings count. [Medium] [asked: very common] Q19. Valid Palindrome and String to Integer (atoi) with every edge case. [Medium] [asked: very common] Q20.

Integer to Roman and Roman to Integer. [Medium] [asked: common] Q21. Longest Common Prefix, implement strStr (KMP), Reverse Words in a String, Encode and Decode Strings. [Medium] [asked: common] Q22. Spiral Matrix, Rotate Image and Set Matrix Zeroes. [Medium] [asked: very common] Q23.

Search in Rotated Sorted Array and Find Minimum in Rotated Sorted Array. [Medium] [asked: very common] Q24. First Missing Positive, Majority Element (Boyer-Moore) and Single Number I/II. [Hard] [asked: common] Q25.

Count Bits, Reverse Bits, Power of Two, Sum of Two Integers without `+`. [Easy] [asked: common] Q26. 3Sum Closest and Next Permutation. [Medium] [asked: common] Q27. Binary search variants: lower/upper bound, search insert position, sqrt(x), Koko Eating Bananas (search on the answer). [Medium] [asked: very common]

Every question: statement, approach (brute force then optimal, complexity, pattern), Rust wrinkle, the solution, a brute-force oracle with 2000 seeded xorshift cases plus edge cases, and what the interviewer is really testing.
"""

