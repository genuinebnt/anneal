[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. What does `unsafe` actually permit, and what does it **not** change? [Medium] [asked: very common] Q2. Safety contract vs soundness: what makes an unsafe abstraction sound? [Hard] [asked: common] Q3.

How do raw pointers and `MaybeUninit` work? [Hard] [asked: common] Q4. What are the sizes and alignments of common types? What is a niche? [Medium] [asked: very common] Q5.

Does Rust reorder struct fields? `repr(C)`, `repr(transparent)`, `repr(packed)`, `repr(u8)`. [Hard] [asked: common] Q6. Stack vs heap: where does each value live? [Easy] [asked: very common] Q7.

How does `Vec` grow, and why is `push` amortised O(1)? [Medium] [asked: very common] Q8. Why is `String` UTF-8, and what are bytes vs chars vs graphemes? [Medium] [asked: very common] Q9. What happens on integer overflow (debug vs release)? [Easy] [asked: very common] Q10.

What are the pitfalls of `as` casts? [Medium] [asked: common] Q11. Why is `transmute` dangerous and what replaces it? [Hard] [asked: common] Q12. What problem does `Pin` solve for self-referential structs? [Hard] [asked: common] Q13.

Are abstractions really zero-cost? Monomorphisation bloat and `#[inline]`. [Medium] [asked: common] Q14. `Drop`, `mem::forget`, `ManuallyDrop` and `Box::leak`: is leaking safe? [Medium] [asked: common] Q15.

`static` vs `const`; `static mut`; thread-local storage. [Medium] [asked: common] Q16. How does FFI work (`extern "C"`, `CString`, callbacks)? [Medium] [asked: common] Q17. Data race vs race condition: what does Rust actually prevent? [Hard] [asked: very common]
"""

