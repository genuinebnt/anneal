[[sections]]
heading = "Where you would use it"
body = """
every function that can fail or return nothing.
"""

[[sections]]
heading = "Common uses"
body = """
all fallible code: the right combinator or `?` instead of unwrap.
"""

[[sections]]
heading = "Design notes"
body = """
Prefer `?` for propagation, `match`/`if let`/`let else` for branching, and combinators for small transformations. `unwrap()`/`expect()` are for bugs (impossible states, tests), **never** for user input; `expect("why this cannot fail")` documents the invariant. Cheat sheet: <https://doc.rust-lang.org/std/option/enum.Option.html> and .../result/enum.Result.html
"""

