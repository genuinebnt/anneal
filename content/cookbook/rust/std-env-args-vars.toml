[[sections]]
heading = "Documentation"
body = """
<ul class="cb-g-reading"><li><a href="https://doc.rust-lang.org/std/env/index.html" target="_blank" rel="noreferrer">https://doc.rust-lang.org/std/env/index.html</a></li></ul>
"""

[[sections]]
heading = "Where it is defined"
body = """
`std::env`, `std::process`, `OsStr`/`OsString` and the unix extension traits are std only. `CStr` is core (`core::ffi`), `CString` is alloc (`alloc::ffi`); `env!`/`option_env!` are compiler built-in macros exported by core. Also: <https://doc.rust-lang.org/std/ffi/index.html>
"""

[[sections]]
heading = "Not covered"
body = """
set_current_dir (process-global, racy in tests: use Command::current_dir), env::chdir-like helpers, unsafe raw-pointer functions (CStr::from_ptr, CString::into_raw/from_raw: see the FFI chapter), from_encoded_bytes_unchecked (unsafe), Windows OsStringExt (cannot run here).
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Arguments, may be non-UTF-8 (robust)</td><td><code>args_os().skip(1)</code></td></tr><tr><td>Arguments as Strings (panics on bad UTF-8)</td><td><code>args().skip(1)</code></td></tr><tr><td>Optional text setting</td><td><code>env::var("X").ok()   (but that hides NotUnicode)</code></td></tr><tr><td>Distinguish unset from garbage</td><td><code>match env::var("X") { NotPresent / NotUnicode }</code></td></tr><tr><td>Path-valued variable</td><td><code>var_os("X").map(PathBuf::from)</code></td></tr><tr><td>Value fixed at COMPILE time</td><td><code>env!("CARGO_PKG_VERSION") / option_env!("X")</code></td></tr><tr><td>Give a variable to a child process</td><td><code>Command::env (never set_var for this)</code></td></tr><tr><td>Testable config code</td><td><code>take an args iterator and a Fn(&amp;str) -&gt; Option&lt;String&gt; lookup</code></td></tr><tr><td>Split or build PATH</td><td><code>split_paths / join_paths</code></td></tr><tr><td>OS string</td><td><code>&amp;str                          -&gt; to_str() (None if invalid) or to_string_lossy() (replacement chars)</code></td></tr><tr><td>String for a C API</td><td><code>CString::new(s)  (fails on an interior NUL) SAFETY NOTE (std docs for set_var): set_var/remove_var are unsafe in edition 2024. They are sound in a single-threaded program and on Windows. In a multi-threaded program on other systems the only sound option is not to call them, because C code (even DNS lookup) reads the environment without synchronisation. cargo test is multi-threaded.</code></td></tr></tbody></table>
"""

