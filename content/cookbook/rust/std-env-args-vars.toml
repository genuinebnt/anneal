<ul class="cb-g-uses"><li>CLI tools</li><li>12-factor service config</li><li>container entrypoints</li><li>passing paths and names to the OS or C</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>DATABASE_URL / <strong>port</strong> / RUST_LOG</li><li><code>--flag=value</code> parsing</li><li><code>--</code> pass-through to a child command</li><li>config precedence (defaults &lt; file &lt; env &lt; flags)</li><li>non-UTF-8 file names</li></ul>
"""

