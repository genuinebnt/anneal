[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. Reverse a singly linked list, iteratively and recursively. [Easy] [asked: very common] Q2. Reverse the nodes of a list k at a time (leave a short tail as is). [Hard] [asked: common] Q3.

Reverse the sublist between positions m and n (1-indexed) in one pass. [Medium] [asked: common] Q4. Merge two sorted linked lists into one sorted list. [Easy] [asked: very common] Q5. Merge k sorted linked lists. [Hard] [asked: very common] Q6.

Find the middle node of a list (second middle when even) in one pass. [Easy] [asked: very common] Q7. Remove the n-th node from the end of a list. [Medium] [asked: very common] Q8. Delete duplicates from a sorted list (keep one / remove all) and remove all nodes with value x. [Medium] [asked: common] Q9.

Partition a list around x, keeping relative order. [Medium] [asked: common] Q10. Rotate a list to the right by k places. [Medium] [asked: common] Q11. Is a linked list a palindrome?

O(n) time, O(1) extra space. [Easy] [asked: very common] Q12. Add two numbers stored as reversed-digit lists. [Medium] [asked: very common] Q13. Group the odd-indexed nodes together followed by the even-indexed nodes. [Medium] [asked: occasional] Q14.

Find the node where two lists intersect (shared tail). [Easy] [asked: common] Q15. Detect a cycle and find where it starts (Floyd). Why can't you build one with Box? [Medium] [asked: very common] Q16.

Deep-copy a list whose nodes have a random pointer. [Medium] [asked: very common] Q17. Flatten a multilevel list (nodes with child lists). [Medium] [asked: common] Q18. Why does dropping a 1,000,000-node Box list overflow the stack, and how do you fix it? [Medium] [asked: common] Q19.

Implement a generic singly linked stack with push/pop/peek/iter/iter_mut/into_iter. [Medium] [asked: very common] Q20. Implement a doubly linked list safely with Rc&lt;RefCell> and Weak. [Hard] [asked: common] Q21. Implement a doubly linked list with indices (arena); when would you reach for unsafe NonNull? [Hard] [asked: common]
"""

