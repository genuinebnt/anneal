[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. Result vs Option vs panic: when do you use each? [Easy] [asked: very common] Q2. What does the `?` operator desugar to, and how does `From` conversion fit in? [Medium] [asked: very common] Q3.

When do you use `Box<dyn Error + Send + Sync>`? [Medium] [asked: common] Q4. How do you write a custom error enum with `std::error::Error` and `source()`? [Medium] [asked: very common] Q5. thiserror vs anyhow: library vs application. What do they generate? [Medium] [asked: very common] Q6.

What is your `unwrap`/`expect` policy? [Easy] [asked: very common] Q7. What do `catch_unwind` and `panic = "abort"` do? [Hard] [asked: occasional] Q8. Iterators are lazy: what does that mean and how do you prove it? [Easy] [asked: very common] Q9.

`iter()` vs `iter_mut()` vs `into_iter()`; what does `for x in &v` desugar to? [Medium] [asked: very common] Q10. Adapters vs consumers; `collect` into Vec/HashMap/String/Result; how does `sum` infer its type? [Medium] [asked: very common] Q11. `map` vs `for_each` vs `filter_map` vs `flat_map`. [Easy] [asked: common] Q12.

Tour of `zip`, `chain`, `enumerate`, `windows`, `chunks`, `peekable`, `rev`, `step_by`. [Easy] [asked: common] Q13. Implement a custom `Iterator` and `IntoIterator for &MyType`. [Medium] [asked: common] Q14. Why is iterator invalidation impossible in safe Rust? [Medium] [asked: common] Q15.

Are iterators really zero-cost? Compare a pipeline with a manual loop. [Medium] [asked: common] Q16. How do closures capture variables (by ref, by mut ref, by move)? [Medium] [asked: very common] Q17.

How do you return closures, and what is E0373? [Medium] [asked: common]
"""

