[[sections]]
heading = "Where you would use it"
body = """
snapshot and log files, simple wire protocols, cache files, anywhere a serde dependency is not wanted or the byte layout must be exact. Run: cargo run --release --example std_hash_collections_io_serialization_formats
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>persisting a map to disk</li><li>appending records to a log</li><li>framing messages</li><li>escaping a line-based text export</li></ul>
"""

