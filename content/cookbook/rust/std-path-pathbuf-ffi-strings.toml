title = "Path PathBuf FFI strings (std)"
module = "Standard library and core"
module_order = 2
chapter = "I/O, files and paths"
chapter_order = 9
order = 111
kind = "recipe"
lede = "`Path`, `PathBuf`, `OsStr`, `OsString`, `CString`, `CStr`: paths, safe joins, platform strings, FFI strings."
level = "intermediate"
code = ["examples/std_tour/std_path_pathbuf_ffi_strings.rs"]

[[sections]]
heading = "Where you would use it"
body = """
<ul class="cb-g-uses"><li>CLIs</li><li>servers that serve files (path traversal!)</li><li>build tools</li><li>FFI wrappers</li><li>anything crossing OS or C boundaries</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li><code>base.join(user_input)</code> safely</li><li>extension/stem manipulation for output names</li><li><code>OsString</code> for argv/env that may not be UTF-8</li><li><code>CString::new</code> before calling C APIs (<code>open</code>, <code>getenv</code>)</li></ul>
"""

