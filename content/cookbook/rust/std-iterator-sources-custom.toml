[[sections]]
heading = "Design notes"
body = """
Cheat sheet (I want to ... -> use ...): one value as an iterator               -> `iter::once(x)`; lazily computed: `once_with(|| ..)` n copies / forever                     -> `repeat_n(x, n)` / `repeat(x)`; fresh value each time: `repeat_with(f)`

```text
nothing                                -> `iter::empty()`
```

stateful generator, closure style      -> `from_fn(|| ..)`;

Next from previous: `successors(first, |prev| ..)` a range of numbers/chars               -> `0..n`, `a..=b`, `'a'..='z'`, `.rev()`, `.step_by(k)` make my struct iterable                -> `impl Iterator for It` (+ `IntoIterator` for T, &amp;T, &amp;mut T) iterate a field of &amp;self               -> `fn iter(&self) -> impl Iterator<Item=&T> + '_` return different iterators             -> `Box<dyn Iterator<Item = T> + '_>` (or `Either`) add `.my_method()` to every iterator   -> extension trait with a blanket `impl<I: Iterator> Ext for I {}` hand out &amp;mut windows                  -> **not** possible with Iterator (lending problem): use indices or `chunks_mut` tell collect how many items            -> implement `size_hint` honestly (or `ExactSizeIterator`)

```text
promise None stays None                -> `impl FusedIterator`
```
"""

