[[sections]]
heading = "Design notes"
body = """
`match` must be **exhaustive**: add a variant to an enum and every `match` that lacks a wildcard stops compiling. That is a feature: it finds every place you must update. Avoid a lazy `_ =>` arm on enums you own.
"""

