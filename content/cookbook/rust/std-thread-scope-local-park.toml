"""

[[sections]]
heading = "Not covered"
body = """
`Thread::into_raw`/`from_raw`, `ThreadId::as_u64`, `thread::sleep_until`, `add_spawn_hook`, `LocalKey::update` (unstable in 1.98.1); thread priorities and CPU affinity (not in std); rayon (see `rayon_data_parallelism`). Mutex/channel/Condvar details are in `std_sync_primitives_use_cases`. Course: none.

Goes beyond `threads_channels` (first steps) and `structured_concurrency_cancellation`.
"""

[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Run something in the background and get its result</td><td><code>let h = thread::spawn(move || ..); h.join()</code></td></tr><tr><td>Borrow local data from threads</td><td><code>thread::scope (no Arc, no 'static)</code></td></tr><tr><td>Split <code>&amp;mut [T]</code> between threads</td><td><code>chunks_mut / split_at_mut: the borrow checker proves they are disjoint</code></td></tr><tr><td>Uneven work items</td><td><code>threads claim the next index from an AtomicUsize</code></td></tr><tr><td>Choose a thread count</td><td><code>available_parallelism().map_or(1, NonZero::get), capped by the work</code></td></tr><tr><td>Combine results</td><td><code>return a value from each thread and merge after join (no shared lock)</code></td></tr><tr><td>Keep a worker alive after a bad job</td><td><code>catch_unwind around the job</code></td></tr><tr><td>Pass a child panic on to the caller</td><td><code>h.join().unwrap_or_else(|p| resume_unwind(p))</code></td></tr><tr><td>Skip cleanup that is unsafe during unwinding</td><td><code>thread::panicking() inside Drop</code></td></tr><tr><td>Per-thread cache / counter</td><td><code>thread_local!; publish totals explicitly, before the thread ends</code></td></tr><tr><td>Wait for one condition</td><td><code>park in a loop + unpark; for anything richer use Condvar or a channel</code></td></tr><tr><td>Channels or shared state?</td><td><code>moving work or ownership: channel. Many readers/writers of one structure: lock. Independent partial results: neither.</code></td></tr></tbody></table>
"""

[[sections]]
heading = "Pitfalls"
body = """
dropping a `JoinHandle` **detaches** the thread (it keeps running; when `main` returns the process ends and kills it); `scope` waits for each thread's main function but TLS destructors may still be running when it returns (an explicit `join` waits for them); `thread::sleep` as synchronisation is a race; `available_parallelism` can over- or under-count (cgroups, affinity, VMs).
"""

