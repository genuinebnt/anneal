<ul class="cb-g-uses"><li>parallelising CPU work without extra crates</li><li>background workers</li><li>per-thread caches</li></ul>
"""

[[sections]]
heading = "Common uses"
body = """
<ul class="cb-g-uses"><li>split a slice across cores</li><li>a fixed worker pool for blocking jobs</li><li>per-thread scratch buffers and counters</li><li>supervising a thread that may panic</li></ul>
"""

