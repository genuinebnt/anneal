[[sections]]
heading = "Cheat sheet"
body = """
<table class="cb-g-cheat"><thead><tr><th>I want to</th><th>Use</th></tr></thead><tbody><tr><td>Yes/no</td><td><code>is_match (cheapest)</code></td></tr><tr><td>Where</td><td><code>find / find_iter ; pieces -&gt; captures / captures_iter</code></td></tr><tr><td>Fixed number of groups</td><td><code>captures_iter(..).map(|c| c.extract())</code></td></tr><tr><td>Rewrite</td><td><code>replace_all with "${name}" or a closure ; literal replacement -&gt; NoExpand</code></td></tr><tr><td>User-supplied literal inside regex</td><td><code>regex::escape</code></td></tr><tr><td>Which of N patterns match</td><td><code>RegexSet (one pass; no positions)</code></td></tr><tr><td>Non-UTF-8 input</td><td><code>regex::bytes::Regex</code></td></tr><tr><td>Untrusted PATTERN</td><td><code>RegexBuilder::size_limit</code></td></tr><tr><td>Compile once</td><td><code>static RE: LazyLock&lt;Regex&gt;</code></td></tr><tr><td>Resume a search at an offset</td><td><code>find_at / is_match_at (keeps context) ; &amp;text[i..] changes what &#94; and &#92;b see</code></td></tr><tr><td>Captures in a hot loop</td><td><code>capture_locations + captures_read (reuses the slots)</code></td></tr><tr><td>Many fixed words</td><td><code>one alternation of escaped words, LONGEST FIRST GUARANTEE AND ITS PRICE. Search time is O(pattern size * text length) for any single search: no catastrophic backtracking. The price: no look-around and no backreferences. (Iterating over ALL matches is a repeated search and has a weaker bound; the docs spell this out under "Untrusted input".)</code></td></tr></tbody></table>
"""

