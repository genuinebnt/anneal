[[sections]]
heading = "Design notes"
body = """
`&[u8]` / `Vec<u8>` are the raw currency of IO. Convert to text only when needed (`from_utf8` validates). Integers have `to_le_bytes/from_le_bytes` (little endian), `_be_` (big endian, network order), `_ne_` (native).

For high-performance byte scanning see BurntSushi's memchr <https://github.com/BurntSushi/memchr> and the `bytes` crate <https://docs.rs/bytes> for cheap shared buffers.
"""

