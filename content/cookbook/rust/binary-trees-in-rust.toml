[[sections]]
heading = "Design notes"
body = """
**Question bank Q1**. Inorder, preorder and postorder traversal: recursive, iterative with an explicit stack, and Morris (O(1) space). [Easy] [asked: very common] Q2. Level-order, zigzag level-order and right-side view of a binary tree. [Medium] [asked: very common] Q3.

Maximum depth and minimum depth of a binary tree. [Easy] [asked: very common] Q4. Invert (mirror) a binary tree, recursively and iteratively. [Easy] [asked: very common] Q5. Same tree, symmetric tree and subtree of another tree. [Easy] [asked: very common] Q6.

Is a binary tree height-balanced? Do it in one pass, O(n). [Easy] [asked: very common] Q7. Diameter of a binary tree and the maximum path sum (any node to any node). [Hard] [asked: very common] Q8.

Path sum I (does a root-to-leaf path sum to target) and Path sum II (return all such paths). [Medium] [asked: common] Q9. Validate a binary search tree (bounds, not parent-only checks; also via inorder). [Medium] [asked: very common] Q10. Kth smallest element in a BST. [Medium] [asked: very common] Q11.

Lowest common ancestor of two nodes: general binary tree and BST. [Medium] [asked: very common] Q12. Insert into and delete from a BST (three delete cases). [Medium] [asked: very common] Q13. Serialize and deserialize a binary tree. [Hard] [asked: common] Q14.

Construct a binary tree from preorder and inorder traversals. [Medium] [asked: very common] Q15. Convert a sorted array (or sorted list) to a height-balanced BST. [Easy] [asked: common] Q16. Flatten a binary tree to a linked list in preorder, in place. [Medium] [asked: common] Q17.

Count the nodes of a complete binary tree in better than O(n) (O(log&#94;2 n)). [Medium] [asked: common] Q18. Convert a binary tree to a circular doubly linked list in inorder (reuse the pointers). [Medium] [asked: occasional] Q19. Vertical order traversal of a binary tree. [Hard] [asked: common] Q20.

Recover a BST in which exactly two nodes were swapped. [Hard] [asked: occasional] Q21. Rust: which borrow-checker patterns do recursive Option&lt;Box&lt;Tree>> functions use (as_ref, as_deref, map, &amp;mut cursor)? [Medium] [asked: common] Q22.

Rust: LeetCode's Option&lt;Rc&lt;RefCell&lt;TreeNode>>>: how do you traverse and mutate it, what is Rc::clone vs a deep copy, and why does a double borrow_mut panic? [Medium] [asked: very common] Q23. Rust: how do you give tree nodes parent pointers without leaking (Rc + Weak)? [Hard] [asked: common] Q24.

Rust: a degenerate tree 100,000 levels deep: what overflows the stack and how do iterative versions fix it? [Medium] [asked: common]
"""

