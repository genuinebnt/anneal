| How a thread waits without spinning | [A channel from a mutex and condition variables](/cookbook/p/mutex-condvar-channel) |
| Why one network read is not one message | [A length-prefixed TCP server](/cookbook/p/tcp-framed-server) |
| Where an HTTP request ends | [HTTP/1.1 message parser](/cookbook/p/http1-parser) |
| Sockets, time limits and half-closing | [std::net by use case](/cookbook/p/std-net-tcp-udp-ip-addr) |
| What a panic does to a thread | [Panics, exits and child processes](/cookbook/p/std-panic-process-exit-catch) |
| Counting from many threads | [Concurrent counters and statistics](/cookbook/p/concurrent-counters-and-statistics) |
| What stopping cleanly promises | [Graceful shutdown](/cookbook/p/graceful-shutdown), which uses async code |
"""

