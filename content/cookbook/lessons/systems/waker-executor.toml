lede = "An executor that sleeps until a waker says a task can make progress, with a timer future that wakes it from another thread."
summary = """
An executor runs many futures on one thread. It keeps a queue of tasks that are ready to be polled, and each task's **waker** puts that task back in the queue. When nothing is ready, the executor sleeps instead of spinning.

This page builds one in about 60 lines, after the Async Book, plus a timer future that a helper thread wakes.
"""

[[sections]]
heading = "What does an executor need?"
body = """
The `block_on` in [What a Future really is](/cookbook/p/futures-by-hand) polls one future in a loop, wasting a CPU core while it waits. A real executor has three parts:

1. A **task**: a boxed future, and a way back into the queue.
2. A **ready queue**: tasks that are worth polling now.
3. A **waker** for each task. When something the task waits for happens, calling the waker puts the task back in the queue.

A task that returns `Pending` is in no queue until its waker is called. When the queue is empty, the executor blocks on it, so waiting tasks use no CPU.

Here four tasks wait on timers, and one of them waits twice.

```rust
let (executor, spawner) = new_executor();
for (name, ms) in [("slow", 90), ("fast", 30), ("mid", 60)] {
    let finished = finished.clone();
    spawner.spawn(async move {
        Timer::new(Duration::from_millis(ms)).await;
        finished.lock().unwrap().push(name);
    });
}
drop(spawner); // no more spawning: run() ends when the last task completes
executor.run();
```

The example checks that all four finish with at most 9 polls: one per task to start, and one more after each timer.
"""

[[sections]]
heading = "How does a future get woken from another thread?"
body = """
`Timer` starts a thread that sleeps, marks the timer done and calls the stored waker. When polled, the timer checks whether it is done. If not, it stores the waker from this poll and returns `Pending`.

```rust
fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
    let mut s = self.state.lock().unwrap();
    if s.done {
        Poll::Ready(())
    } else {
        s.waker = Some(cx.waker().clone()); // always store the latest waker
        Poll::Pending
    }
}
```

Two details matter. First, it stores the waker of the **latest** poll. The `Future` documentation asks for this: only the most recent waker is sure to reach the task. A combinator, for example, may pass a different waker each time.

Second, the checking and the storing happen under one lock. Otherwise the thread could mark the timer done between the check and the store, and nobody would ever wake the task.

The thread calls the waker after unlocking. Here `wake` only sends on a channel, but a waker may run any code, even code that polls this timer and takes the same lock. The example checks that the lock is free when its waker is called.
"""

[[sections]]
heading = "How do the tasks and the queue fit together?"
body = """
A task holds its future in a `Mutex<Option<...>>`, so the executor can take the future out, poll it, and put it back if it is still pending. Its waker is the task itself: `impl Wake for Task` sends the task down the ready queue.

:::deeper The task, its waker and the run loop (gives away much of "A task executor with spawn, join handles and wakers")
