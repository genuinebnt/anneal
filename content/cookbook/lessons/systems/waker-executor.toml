"""

[[sections]]
heading = "Why is the ready queue unbounded?"
body = """
The Async Book uses a bounded queue; this version does not, to avoid a deadlock. A task that wakes itself, or spawns another, sends on the queue from the executor's own thread. If the queue is full, that send waits for the executor, which is the thread that is waiting.

The example spawns 5,000 tasks on the executor's thread before `run`, and each wakes itself once while it is polled. With a queue that holds 100, the spawning alone hangs, and the check fails after its time limit.
"""

[[sections]]
heading = "What are its limits?"
body = """
It is a teaching executor, and it shows where real ones do more work.

| Limit | What happens | What Tokio does |
|---|---|---|
| a task woken twice | it is queued twice, and the second visit is wasted | a task's state says whether it is already queued |
| each `Timer` | starts a thread | one timer wheel, checked by the runtime |
| a panic in a task | stops `run` for every task | the panic is caught and reported through the `JoinHandle` |
| a waker that is stored and never called | `run` never returns, because the task can still be woken | tasks are tracked, and dropping the runtime drops them |
| results | none; a task returns `()` | `spawn` returns a `JoinHandle` with the output |
"""

