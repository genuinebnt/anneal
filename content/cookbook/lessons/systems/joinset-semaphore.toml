"""

[[sections]]
heading = "What if the permit is dropped too soon?"
body = """
In Rust, `let _ = value;` drops the value at once, while `let _permit = value;` keeps it to the end of the scope. Changing that one line in the example gives this:

```rust
let _ = permits.acquire_owned().await.expect("semaphore closed"); // dropped here
```

The run prints `max in flight: 12 (limit 3)` and fails with `limit violated!`. Each task waited for a permit, then gave it back before doing any work. The counters caught a bug that the compiler cannot see.
"""

[[sections]]
heading = "What does this shape cost?"
body = """
**Every task exists from the start.** All 12 are spawned at once and 9 of them wait. With 12 inputs that is fine. With a million, a million waiting tasks hold memory, and so does every input captured in them.

When the inputs are many, start a task only when a slot is free instead. The worker pool and stream pages below show two ways.

**The order of work is not the order of input.** Results come back as tasks finish, so keep an index with each result if order matters.
"""

