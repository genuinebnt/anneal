code_spoils = ["/p/b21-memory-budget", "/p/b22-run-the-jobs"]
lede = "Spawn every task, let each wait for a permit before it works, and count how many really ran at once."
summary = """A `JoinSet` holds spawned tasks and hands back their results as they finish. A `Semaphore` with 3 permits lets at most 3 of them do their work at a time: each task waits for a permit first. The example also checks that limit while it runs, with two atomic counters. The limit caps work in progress, not the number of tasks: all 12 exist from the start."""

[[sections]]
heading = "How do the two pieces share the job?"
body = """
Say you must call an API for 12 inputs, and the API allows 3 calls at a time. You want the calls to overlap, but never more than 3.

A **`JoinSet`** is a collection of spawned tasks. `join_next().await` returns the next one to finish, in the order they finish. If you drop the set, it aborts every task still in it.

A **`Semaphore`** holds a number of **permits**. `acquire_owned().await` waits until one is free, and returns a permit object. Dropping that object gives the permit back. Tokio's semaphore is fair: waiters get permits in the order they asked.

The example spawns 12 tasks into one `JoinSet`. Each task first waits for a permit, works for 20 ms, and finishes. Since the permit lives until the task ends, at most 3 tasks are past that first line.
"""

[[sections]]
heading = "How does the example check the limit?"
body = """
Each task counts itself in and out, and remembers the highest count seen:

```rust
let now = in_flight.fetch_add(1, SeqCst) + 1; // after the permit is granted
max_seen.fetch_max(now, SeqCst);
// ... the work ...
in_flight.fetch_sub(1, SeqCst);
```

At the end, `main` asserts `max_seen <= limit`. A typical run prints `max in flight: 3 (limit 3)`, after the jobs finish in an order such as 3, 0, 1, 5.

This is a check of an **invariant**, a rule that must hold at every moment. A failing run proves a bug. A passing run proves only that this schedule was fine, so the check is most useful run often, under different loads.

:::deeper Walk through the code (gives away much of "Background jobs within a memory budget" and "Run the jobs, a few at a time")
