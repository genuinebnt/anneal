kind = "lesson"
level = "advanced"
code = ["examples/async/worker_pool.rs"]
code_spoils = ["/p/c4-bounded-fan-out"]
lede = "A worker pool accepts a stream of jobs and runs only a few of them at once."
summary = """This pool takes jobs through a bounded queue, and a semaphore limits how many run at once. A job that panics becomes a result, so other jobs can continue. It suits a finite batch of async jobs that arrive over time. It is not ready for a long-running service, because stored results keep growing and shutdown has no deadline."""

[[sections]]
heading = "Why not start every job at once?"
body = """
Say 10,000 uploaded images arrive together. Resizing them all at once could overload your memory, your CPU or your storage service.

A **worker pool** puts a limit between "a job arrived" and "a job is running". This one has no permanent worker tasks. Here, `workers = 3` means that at most three jobs can run at once. It is **generic**: you choose the job type, result type and async function.
"""

[[sections]]
heading = "How does a job get through the pool?"
body = """
A job goes into a bounded channel. One **dispatcher** task takes jobs out. A **semaphore** counts the free running places. Before starting a job, the dispatcher takes a **permit**, which claims one place.

With three running places and room for two in the queue, how many submissions can complete before any job does?

```stepper
caption = "Three running places and a queue of two"
[[frame]]
title = "Three jobs run"
text = "The dispatcher has started jobs 0, 1 and 2. Each holds one permit."
lanes = [ { name = "Caller", items = ["submitting"] }, { name = "Queue", items = [], slots = 2 }, { name = "Dispatcher", items = [] }, { name = "Running", items = ["0", "1", "2"], slots = 3 } ]
[[frame]]
title = "The dispatcher holds one more"
text = "It takes job 3 from the queue, then waits for a permit. Job 3 is neither queued nor running."
lanes = [ { name = "Caller", items = ["submitting"] }, { name = "Queue", items = [], slots = 2 }, { name = "Dispatcher", items = ["3, waiting"] }, { name = "Running", items = ["0", "1", "2"], slots = 3 } ]
[[frame]]
title = "The caller has to wait"
text = "Jobs 4 and 5 fill the queue. The call to submit job 6 cannot finish yet."
lanes = [ { name = "Caller", items = ["waiting with 6"] }, { name = "Queue", items = ["4", "5"], slots = 2 }, { name = "Dispatcher", items = ["3, waiting"] }, { name = "Running", items = ["0", "1", "2"], slots = 3 } ]
[[frame]]
title = "One job finishes"
text = "If job 0 finishes first, its permit lets job 3 start. The dispatcher takes job 4, and job 6 enters the queue."
lanes = [ { name = "Caller", items = ["6 accepted"] }, { name = "Queue", items = ["5", "6"], slots = 2 }, { name = "Dispatcher", items = ["4, waiting"] }, { name = "Running", items = ["1", "2", "3"], slots = 3 } ]
```

So the answer is six, one more than workers plus queue size. Callers waiting in `submit` also keep their jobs in memory.
"""

[[sections]]
heading = "How does the code put the limit into practice?"
body = """
This section covers ideas that [At most N in flight](/p/c4-bounded-fan-out) asks you to find. To work them out yourself, solve that before reading on.

The dispatcher repeats three steps: receive a job, wait for a permit, then create a task. The task holds the permit until it ends. Dropping the permit frees the place, even after a panic.

Tokio's `JoinSet` holds these tasks, and keeps finished ones until you collect them. If it already holds `workers` tasks, the dispatcher collects one before adding another. It has a free permit then, so one of those tasks is ending.

When you call `finish`, it drops the job sender. The dispatcher runs what is still queued, waits for its tasks and exits. Then `finish` reads all the results.

The demo submits 12 jobs, and job 7 panics on purpose. The next fold shows the code, which gives away much more of that exercise.

:::deeper Show the limiting code (gives away much of the fan-out exercise)
This smaller program keeps only the limit, with six jobs and two permits.

```rust
use std::{sync::Arc, time::Duration};
use tokio::{sync::Semaphore, task::JoinSet};

#[tokio::main]
async fn main() {
    let places = Arc::new(Semaphore::new(2));
    let mut running = JoinSet::new();
    for job in 0..6 {
        let place = places.clone().acquire_owned().await.unwrap();
        while running.len() >= 2 {
            running.join_next().await; // collect a finished task
        }
        running.spawn(async move {
            let _place = place; // returned when this task ends
            tokio::time::sleep(Duration::from_millis(10)).await;
            println!("finished {job}");
        });
    }
    while running.join_next().await.is_some() {}
}
```

In the full demo, a **barrier** holds each job until three have arrived. So the demo finishes only if three jobs really run together.

```walkthrough
