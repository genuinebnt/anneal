```

Results arrive in finish order, so include a job ID if you need to match them to requests.
:::
"""

[[sections]]
heading = "How can one job panic without stopping the pool?"
body = """
A **panic** stops the current task with an error. Tokio catches it at the task boundary. Awaiting the task's **join handle**, returned by `tokio::spawn`, gives you a `JoinError` instead.

For each job, the pool starts two tasks. The outer one holds the permit and reports an outcome: a result or a panic message. The inner one runs your job.

Where you call the job function matters. In `tokio::spawn(f(job))`, Rust calls `f(job)` first, and only then spawns what it returns.

If `f` panics before returning its future, the outer task fails. No outcome is sent, and the caller gets one result too few. These programs show the mistake and the fix the code file uses.

```compare
takeaway = "Calling the function inside the spawned block covers both kinds of panic. In the pool, an `Arc` handle to the function moves into that block."
[wrong]
title = "Call the function before spawning"
code = '''
use std::future::{Ready, ready};

fn job(id: u32) -> Ready<u32> {
    if id == 1 {
        panic!("bad input");
    }
    ready(id)
}

#[tokio::main]
async fn main() {
    let outer = tokio::spawn(async {
        let outcome = tokio::spawn(job(1)).await;
        println!("outcome: {}", outcome.is_err());
    });
    println!("outer task failed: {}", outer.await.is_err());
}
'''
result = "The panic message appears, then `outer task failed: true`. The outcome line never prints."
[fixed]
title = "Call it inside the inner task"
code = '''
use std::future::{Ready, ready};

fn job(id: u32) -> Ready<u32> {
    if id == 1 {
        panic!("bad input");
    }
    ready(id)
}

#[tokio::main]
async fn main() {
    let outer = tokio::spawn(async {
        let outcome = tokio::spawn(async { job(1).await }).await;
        println!("outcome: {}", outcome.is_err());
    });
    println!("outer task failed: {}", outer.await.is_err());
}
'''
result = "After the panic message, it prints `outcome: true` and `outer task failed: false`."
```

None of this helps if your build aborts the process on a panic. The demo checks a panic raised before the future too, and expects four outcomes from four jobs.
"""

[[sections]]
heading = "What can still grow or get stuck?"
body = """
A limit on running jobs does not make the whole pool bounded.

| Problem in this example | What you would see | What to change |
|---|---|---|
| The result channel has no limit and is read only in `finish` | Submit 10,000 jobs before `finish`, and up to 10,000 results wait in memory | Read results while submitting; use a bounded result channel |
| A job never finishes | It keeps a permit, and `finish` waits forever | Decide on a timeout or cancellation rule |

Bounding results needs care. If workers wait to send results but nobody reads until all workers finish, the program can deadlock. Your caller must submit jobs and read results so that both keep moving.

Real image resizing is **CPU-bound**, meaning it spends its time computing. Inside an async task, that can keep other tasks from running. Tokio's `spawn_blocking` moves it to other threads, but you still need a limit.

If you drop `Pool` without calling `finish`, the dispatcher is not stopped, but you can no longer collect results.
"""

[[sections]]
heading = "When should you use this pattern?"
body = """
| Your situation | A reasonable choice |
|---|---|
| Async jobs arrive over time, and callers can pause | A bounded queue and a limit on running jobs |
| You already have a short list of async jobs | A simpler loop that limits how many run, with no job queue |
| Jobs spend most of their time computing | A pool built for CPU work, with a limit on waiting jobs |
| Work must survive a restart | A queue stored outside the process, with a plan for repeated work |
| You need to reuse database connections | A connection pool, which manages objects rather than jobs |

Before real use, test a reader that falls behind and a job that never ends.
"""

