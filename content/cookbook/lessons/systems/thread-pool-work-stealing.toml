summary = """
In a work-stealing pool, each worker thread has its own job queue and takes work elsewhere when that runs out. Use the design for CPU work that keeps splitting into many small jobs. The price is harder code for waiting, sleeping and shutdown. In real programs use rayon, and read this example to learn how stealing works and what shutdown must promise.
"""

[[sections]]
heading = "Why isn't one shared queue enough?"
body = """
Say you want to compute `fib(27)` on eight threads. You split the work: each call hands one half to the pool and computes the other half itself. Below `fib(8)` it stops splitting. That still creates 17,710 mostly tiny jobs.

The obvious pool keeps one `Mutex<VecDeque<Job>>`. Every thread takes that lock to add or remove a job. With tiny jobs, threads can spend much of their time waiting for it, which is called **contention**.

A work-stealing pool instead gives each worker its own **deque**, a queue with two usable ends.
"""

[[sections]]
heading = "Which job does a worker take next?"
body = """
The `crossbeam-deque` crate supplies three types. A `Worker` is one thread's own deque, and a `Stealer` lets other threads take from it. The `Injector` is a shared inbox for jobs from outside the pool.

A worker looks in its own deque first. If that is empty, it tries the injector, and then the other workers' deques. Taking from another worker is called **stealing**, and the worker being taken from is the **victim**.

This example tries victims in the same order every time, starting with worker 0. rayon and Tokio's multi-thread scheduler start at a random one, which spreads the thieves out.

The two ends matter. The owner pushes and pops at the back, so it gets its newest job first, called **LIFO** order. A thief takes the oldest job from the front.

```stepper
caption = "How two workers share a job that splits"
[[frame]]
title = "A job arrives from outside"
text = "Your main thread isn't a worker, so job A goes into the injector."
lanes = [ { name = "Injector", items = ["A"] }, { name = "Worker 1 deque (front first)", items = [] }, { name = "Worker 2 deque (front first)", items = [] }, { name = "Running", items = [] } ]
[[frame]]
title = "Worker 1 picks it up"
text = "Its own deque is empty, so it takes A from the injector."
lanes = [ { name = "Injector", items = [] }, { name = "Worker 1 deque (front first)", items = [] }, { name = "Worker 2 deque (front first)", items = [] }, { name = "Running", items = ["Worker 1: A"] } ]
[[frame]]
title = "A splits"
text = "A spawns B and then C. Both go to the back of Worker 1's own deque."
lanes = [ { name = "Injector", items = [] }, { name = "Worker 1 deque (front first)", items = ["B", "C"] }, { name = "Worker 2 deque (front first)", items = [] }, { name = "Running", items = ["Worker 1: A"] } ]
[[frame]]
title = "Worker 2 steals"
text = "Say Worker 2 is free. It takes B, the oldest job, from the front."
lanes = [ { name = "Injector", items = [] }, { name = "Worker 1 deque (front first)", items = ["C"] }, { name = "Worker 2 deque (front first)", items = [] }, { name = "Running", items = ["Worker 1: A", "Worker 2: B"] } ]
[[frame]]
title = "A waits by working"
text = "A now needs its children. Worker 1 pops C from the back and runs it while A waits."
lanes = [ { name = "Injector", items = [] }, { name = "Worker 1 deque (front first)", items = [] }, { name = "Worker 2 deque (front first)", items = [] }, { name = "Running", items = ["Worker 1: C, on top of A", "Worker 2: B"] } ]
```

A newest job's data may still be cached. An oldest job tends to be large, so one steal keeps a thief busy longer.
"""

[[sections]]
heading = "How does the code do it?"
body = """
The shared state holds the injector, a stealer for each deque, and the tools for sleeping and shutdown. Each worker keeps its own deque in a **thread-local** variable, which has one value per thread. A job spawned by a worker of this pool goes there. Other callers use the injector, unless the pool is closing.

To find work, a worker tries its own deque, then the injector, then each stealer. This function is the stealing part:

```rust title="Find the next job"
fn find_task(local: Option<&Worker<Job>>, sh: &WsShared) -> Option<Job> {
    if let Some(j) = local.and_then(|l| l.pop()) {
        return Some(j);
    }
    loop {
        let s = match local {
            Some(l) => sh.injector.steal_batch_and_pop(l),
            None => sh.injector.steal(),
        }
        .or_else(|| sh.stealers.iter().map(|s| s.steal()).collect());
        match s {
            Steal::Success(j) => return Some(j),
            Steal::Empty => return None,
            Steal::Retry => continue,
        }
    }
}
```

`steal_batch_and_pop` returns one injector job and may move more into the local deque. `Steal::Retry` means an attempt collided with another thread, so the loop tries again.

An idle worker mustn't sleep through a new job. It reads a counter, the **epoch**, before searching, and every spawn bumps it. The worker sleeps on a **condition variable** (`Condvar`) for at most 100 ms. It does so only if the counter hasn't changed and shutdown hasn't started.

If a sleeper is registered, the spawner takes the same lock before signalling. This stops the signal landing between the sleeper's check and its sleep.

Local push and pop take no lock, but every spawn still updates the epoch and reads the sleeper count.

The fold below shows the whole code file. Its single-queue pool gives away much of [A thread pool with results and graceful shutdown](/p/c2-thread-pool), so try that exercise first.

