[[sections]]
heading = "What happens when a job waits for another job?"
body = """
Suppose your pool has one worker. Its job spawns a child and needs the child's answer. If the job waits on an ordinary channel, the only worker goes to sleep. The child sits in its deque with nobody to run it.

The file's answer is `Batch`, a group of jobs you can wait for together. You add jobs with `batch.spawn`. While any are unfinished, `batch.join` doesn't sleep on them. Instead, it runs whatever pending job it can find.

```compare
takeaway = "Waiting by working lets this nested job finish on one worker. The cost: unrelated jobs can run on top of the waiting one, which makes the call stack deeper."
[wrong]
title = "Block the worker"
code = '''
fn double_in_child(pool: WsHandle, out: mpsc::Sender<u32>) {
    let worker_side = pool.clone();
    pool.spawn_job(Box::new(move || {
        let (child_tx, child_rx) = mpsc::channel();
        let child: Job = Box::new(move || child_tx.send(21).unwrap());
        worker_side.spawn_job(child).unwrap();
        let n: u32 = child_rx.recv().unwrap(); // this worker now sleeps
        out.send(n * 2).unwrap();
    }))
    .expect("pool is open");
}
'''
result = "With one worker, the answer never arrives. With a second, idle worker it returns 42, but extra workers only hide the problem."
[fixed]
title = "Help while waiting"
code = '''
fn double_in_child(pool: WsHandle, out: mpsc::Sender<u32>) {
    let worker_side = pool.clone();
    pool.spawn_job(Box::new(move || {
        let slot = Arc::new(AtomicU64::new(0));
        let child_slot = slot.clone();
        let batch = Batch::new(&worker_side);
        batch.spawn(move || child_slot.store(21, SeqCst)).unwrap();
        batch.join().unwrap(); // runs pending jobs while it waits
        out.send(slot.load(SeqCst) as u32 * 2).unwrap();
    }))
    .expect("pool is open");
}
'''
result = "It returned 42 with one worker and with two."
```

Helping has a limit. Each helped job runs on top of the waiting one's call stack, and nothing limits how deep that goes. Deep splitting can overflow a stack, so the demo calls from a thread with a very large one. That adds room but guarantees nothing.

Only `join` helps. A job that blocks on a channel or socket still holds its worker.
"""

[[sections]]
heading = "What happens when a job panics?"
body = """
A **panic** abandons the current operation after a serious error. The pool runs each job inside `catch_unwind`, so a panic doesn't end the worker thread. For batch jobs, `join` returns the panic messages as an error.

Without a batch, your code gets no report, although the default panic message still prints. With `panic = "abort"`, nothing is caught and the process ends.
"""

[[sections]]
heading = "What does shutdown promise?"
body = """
Dropping the pool promises that every accepted job runs before `drop` returns, if the jobs finish. After shutdown begins, an outside spawn returns your job as `Err(Rejected(job))`. Running jobs may still spawn children.

Pushing and shutting down race, so a job could be stranded. An outside thread might see an open pool, then push after the workers have gone. A **read-write lock** prevents this by making check and push one protected step.

Inside a worker, a job and a stop request could both arrive just after an empty search. So it reads the flag into `stopping` before each search. Follow both possible orders.

**Case 1: the worker reads before the stop.**

1. It reads `stopping` as false and searches, finding nothing.
2. A job is queued, then shutdown sets the flag.
3. `stopping` is still false, so the worker doesn't exit.
4. It searches again, and can see the job if nobody else took it.

**Case 2: the worker reads after the stop.**

1. Every accepted outside job is queued, then shutdown sets the flag.
2. The worker reads `stopping` as true and searches.
3. This search can see any of those jobs that are still queued.
4. If it finds nothing, the worker exits.

The next fold shows these lines inside the whole file. It also gives away much of [A thread pool with results and graceful shutdown](/p/c2-thread-pool).

:::deeper Walk through the shutdown code (gives away much of the thread pool exercise)
```walkthrough
file = "examples/concurrency/thread_pool_work_stealing.rs"
[[step]]
title = "Close first, then raise the flag"
lines = "207-212"
text = "The write lock waits for outside pushes in progress. After closing, it sets `shutdown` and wakes the workers."
[[step]]
title = "Read, search, then decide"
lines = "222-235"
text = "The worker reads `stopping`, searches, then decides. The hook in between is for tests."
[[step]]
title = "Drop waits for every worker"
lines = "247-254"
text = "`drop` starts shutdown, then waits for each worker thread to exit."
```
:::

The worker's gap needs exact timing, so a test hook pauses a worker after an empty search. In a copy, move the `stopping` line below the hook block, just before `if stopping`. The check then fails with `a job queued before shutdown was lost`.

Moving it only to just below the search is also a bug, but that check passes, because the hook runs later. A random race check can still fail with `accepted jobs and jobs run differ`.

So a passing run doesn't show that the order is safe.
"""

[[sections]]
heading = "When is stealing worth it?"
body = """
It depends on job size. The table shows medians of 15 release runs on a busy 12-core Mac. Each pool had eight workers, and the calling thread helped.

| Workload | Work stealing | One shared queue |
| --- | --- | --- |
| `fib(27)`, 17,710 mostly tiny jobs | 6.6 ms | 18.0 ms |
| Merge sort of 1 million numbers, 63 spawned jobs | 11.2 ms | 12.6 ms |

Stealing was clearly ahead only with the tiny jobs. Single runs varied widely, so measure your own workload.

| If you have | Reach for |
| --- | --- |
| CPU work over a collection, or work that splits in two | rayon's parallel iterators or `rayon::join` |
| Many tasks that mostly wait on the network or timers | tokio |
| A few longer, independent jobs | A single shared queue |
| A scheduler to study or build | `crossbeam-deque` |
"""

