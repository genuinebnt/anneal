lede = "Handlers return one error enum, and that enum alone decides the status code and the JSON body."
summary = """A quick lookup for axum error responses. Every handler returns `Result<T, AppError>`, and `AppError` implements `IntoResponse`. Each variant picks a status code and fills one JSON shape, so clients parse every failure the same way. Internal errors are logged and replaced by a plain message. The shape covers only what your handlers return: axum's own rejections still send their own bodies."""

[[sections]]
heading = "What does a handler return?"
body = """
A handler returns either its value or an `AppError`. You write no status codes inside handlers.

```rust
async fn show(Path(id): Path<String>) -> Result<Json<Value>, AppError> {
    match id.as_str() {
        "video" => Ok(Json(json!({ "id": "video" }))),
        other => Err(AppError::NotFound(other.to_string())),
    }
}
```

axum accepts this return type because `Result<T, E>` is a response when both `T` and `E` are. So the whole job sits in one `impl IntoResponse for AppError`. That impl maps each variant to a status and a `code` string, and builds the body. Its message comes from `thiserror`'s `#[error(...)]` text, and `Internal` says only "internal error", so its cause never reaches the client.

:::deeper Walk through the code (gives away much of "One error shape for the whole API")
```walkthrough
file = "examples/web/axum_errors.rs"
[[step]]
title = "One enum for every failure"
lines = "26-34"
text = "`thiserror` writes `Display` from the `#[error]` text. `Internal` keeps its `io::Error` as a source, for the log."
[[step]]
title = "A status and a code per variant"
lines = "36-45"
text = "The match decides the status, the `code` string and the details. `Internal` is logged here and replaced by a plain message."
[[step]]
title = "One body for all of them"
lines = "46-53"
text = "The message comes from `Display`. Every error ends as the same JSON object under `error`."
[[step]]
title = "Handlers only return Err"
lines = "55-66"
text = "No handler builds a response for an error itself."
[[step]]
title = "Check the status and that nothing leaks"
lines = "68-94"
text = "Four requests through `oneshot`, with no network. The test fails if the secret path appears in any body."
```
:::
"""

[[sections]]
heading = "What does the client see?"
body = """
These are the example's four requests, as it prints them:

| Request | Status | Body |
|---|---|---|
| `/v1/workflows/video` | 200 | `{"id":"video"}` |
| `/v1/workflows/nope` | 404 | `code` is `not_found`, and the message names the id |
| `/v1/workflows/bad` | 422 | `code` is `invalid`, and `details` lists one problem |
| `/v1/workflows/boom` | 500 | `{"error":{"code":"internal","details":[],"message":"internal error"}}` |

The 500 response does not contain the disk path from the `io::Error`. The example checks that, and the path appears only in the server's log line.
"""

[[sections]]
heading = "Which errors does it not cover?"
body = """
Some requests never reach your handler. axum answers them itself, so they do not get your shape. A small test router showed this:

| Request | Status | Body |
|---|---|---|
| An unknown path | 404 | empty |
| A known path with another method | 405 | empty |
| `Path<u64>` given `abc` | 400 | plain text starting `Invalid URL: Cannot parse` |
| `Json` without a JSON content type | 415 | plain text naming the expected content type |

To give these the same shape, you need a fallback for unknown routes and your own handling of extractor rejections. The axum documentation linked below covers both.

Two more limits. The example logs with `eprintln!`, not a logging library. And a variant's message is sent as written, so never put a secret in one that clients see.
"""

