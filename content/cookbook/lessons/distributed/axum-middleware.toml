lede = "An async function that runs around every request, before and after the handler."
summary = """A quick lookup for axum middleware. With `middleware::from_fn`, an ordinary `async fn(Request, Next) -> Response` can change the request, call `next.run(req)`, and then change the response. The example gives each request a correlation id, so the log lines of one request can be found across services. A layer wraps only the routes added before it."""

[[sections]]
heading = "What does a middleware function look like?"
body = """
It takes the request and `Next`, the rest of the stack. Whatever comes before `next.run(req).await` sees the request. Whatever comes after sees the response.

This one marks every response as not cacheable:

```rust
use axum::{extract::Request, http::{header, HeaderValue}, middleware::{self, Next}, response::Response};

async fn no_store(req: Request, next: Next) -> Response {
    let mut resp = next.run(req).await;
    resp.headers_mut().insert(header::CACHE_CONTROL, HeaderValue::from_static("no-store"));
    resp
}

// let app = Router::new().route(...).layer(middleware::from_fn(no_store));
```

The same shape hosts logging, metrics and checks of credentials. Return a response without calling `next` to stop a request early.
"""

[[sections]]
heading = "Which requests does a layer wrap?"
body = """
Order matters. A test router had `/before`, then the layer, then `/after`. It answered like this:

| Request | `.layer(...)` | `.route_layer(...)` |
|---|---|---|
| `GET /before` | wrapped | wrapped |
| `GET /after`, added after the layer | not wrapped | not wrapped |
| An unknown path (404) | wrapped | not wrapped |
| `POST /before`, a wrong method (405) | wrapped | wrapped |
| `POST /after`, a wrong method (405) | not wrapped | not wrapped |

So add every route first, then the layer. Use `route_layer` when the middleware should run only for paths that exist, such as a check that would otherwise turn a 404 into a 401.
"""

[[sections]]
heading = "What does the example do with request ids?"
body = """
It reuses the caller's `x-request-id`, or makes one when there is none. It puts the id on the request, so handlers can read it, and on the response. The example prints:

```text
supplied None -> response x-request-id = req-1
supplied None -> response x-request-id = req-2
supplied Some("trace-abc") -> response x-request-id = trace-abc
```

**The caller's id is copied as it comes.** It can be any length the server accepts for a header. Check or replace it before you trust it in logs, and never use it for access control.

**The new ids come from a counter.** They repeat after a restart and between servers. To join logs across services, use a random or time-based id, such as a UUID. The `tower-http` crate has a ready-made request id layer.

:::deeper Walk through the code (gives away much of "Name every request and log it")
