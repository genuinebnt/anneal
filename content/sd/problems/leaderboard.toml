title = "Top-k and leaderboards"
kind = "hld"
order = 14
minutes = 35
prompt = "Design two related features: a real-time leaderboard for a mobile game with 50 million players (my rank, the top 100, my neighbours), and 'top 100 trending songs' over the last hour, day and week for a streaming service with billions of plays a day."
uses = ["delivery-framework", "redis", "probabilistic-structures", "stream-processing", "sharding"]
companies = ["Spotify", "Amazon", "Meta", "Riot Games", "Google"]
hints = [
  "Which Redis structure gives you a rank in O(log n)? How big is it for 50 million players?",
  "Counting every song exactly per hour is a lot of counters. Do you need exact counts for a top-100 list?",
  "How do you get 'last 24 hours' without recounting a day of plays every minute?",
]

[[steps]]
name = "Requirements"
minutes = 5
prompt = "Functional requirements, the non-functional ones made measurable, and an estimate."
reference = """
Two features that look alike and are not: one is **exact and per player**, the other **approximate and global**. Saying so first is half the answer.

**Leaderboard (game)**:

1. Game servers report score changes for a player.
2. Players see the **top 100**, **their own rank and score**, and the **players just above and below** them.
3. Leaderboards are per **season** and reset; old seasons stay readable.

**Trending (music)**:

1. The **top 100 songs by plays** over the last **hour**, **day** and **week**, refreshed every minute.
2. Approximate counts are fine for the list (nobody can check the 37th song's exact count); charts that pay royalties are not, and are computed separately.

**Non-functional**:

| | Leaderboard | Trending |
|---|---|---|
| Latency | rank queries under 50 ms | served from a cache, under 50 ms |
| Freshness | my score change visible within ~1 s | the list may lag ~1 minute |
| Accuracy | **exact**: players notice and rewards depend on it | approximate is acceptable |
| Durability | scores never lost | counts can be recomputed from the event log |

**Estimate** (assumptions labelled):

```text
leaderboard  50M players × ~100 B per sorted-set entry (assumption;
             measure with MEMORY USAGE) ≈ 5 GB → fits one Redis node
updates      10M daily players × 10 games ≈ 100M/day ≈ 1,200/s (×5 peak ≈ 6,000/s)
plays        5B/day ≈ 58,000/s average, peaks ~200,000/s
```

The numbers say the leaderboard is **small** (one node) and the trending feature is a **stream** problem (200,000 events a second, counted over three sliding windows).
"""
[[steps.points]]
id = "req-split"
text = "Separated exact per-player ranks from approximate global top-k"
level = "senior"
[[steps.points]]
id = "req-est"
text = "Estimated the sorted set size and the play event rate"
level = "mid"

[[steps]]
name = "Core entities"
minutes = 2
prompt = "Name the things the system stores."
reference = """
| Entity | Fields | Store |
|---|---|---|
| `Score` | player, season, points, achieved_at | the durable record: a database table; mirrored into a sorted set |
| `PlayEvent` | song, user, time, duration listened | an event in a log (Kafka), never a row per play in a database |
| `WindowCount` | song, **time bucket** (a minute or an hour), count | state in the stream processor |
| `TopList` | window (1h, 24h, 7d), computed_at, ranked songs with counts | small; written every minute to Redis or a table |

The key choice is `WindowCount` **per bucket**: a count per song per minute (and per hour for longer windows) can be added up into any window, and a bucket that leaves the window is dropped as a whole. Counting "the last 24 hours" directly would mean remembering every play's time.
"""
[[steps.points]]
id = "ent-bucket"
text = "Counts kept per time bucket rather than per raw window"
level = "senior"

[[steps]]
name = "API"
minutes = 3
prompt = "What do clients call?"
reference = """
```http
POST /internal/scores        (game server → leaderboard, mutual TLS)
{ "season": 12, "player_id": "p_7", "delta": 50, "match_id": "m_9921" }   -> 204

GET /leaderboards/12/top?n=100          -> { "entries": [ { "rank": 1, "player": "p_3", "score": 98410 }, ... ] }
GET /leaderboards/12/me                 -> { "rank": 48211, "score": 7340, "around": [ ...5 above, 5 below... ] }
GET /trending?window=1h|24h|7d&n=100    -> { "computed_at": "...", "songs": [ { "id": "s_1", "plays": 412000 }, ... ] }
```

- **Scores come from game servers, never from the client.** A client can be modified to send any number; the game server that ran the match is the authority. `match_id` makes the report idempotent (a retried report for the same match is ignored).
- `me` takes the player from the auth token, not a parameter.
- Trending returns `computed_at`, so the client can say "updated a minute ago" and caches can key on it.
"""
[[steps.points]]
id = "api-trust"
text = "Scores submitted by trusted game servers, not by clients"
level = "senior"
[[steps.points]]
id = "api-match-idem"
text = "Score reports idempotent per match, so a retry does not add points twice"
level = "senior"

[[steps]]
name = "High-level design"
minutes = 14
prompt = "Draw both features."
reference = """
**The diagram**:

```text
LEADERBOARD
game server ─► score svc ─► scores DB (durable)
                   └──────► Redis sorted set season:12
player ─► leaderboard svc ─► ZREVRANGE / ZREVRANK

TRENDING
play events ─► Kafka (by song) ─► stream job: counts per
               song per minute and hour ─► top 100 per
               window, every minute ─► Redis ─► API (cached)
```

**Leaderboard: a Redis sorted set per season.** A sorted set keeps members ordered by score with a skip list plus a hash table, so updates and rank lookups are O(log n).

| Need | Command | Cost |
|---|---|---|
| add points | `ZINCRBY season:12 50 p_7` | O(log n) |
| top 100 | `ZREVRANGE season:12 0 99 WITHSCORES` | O(log n + 100) |
| my rank | `ZREVRANK season:12 p_7` (0-based) | O(log n) |
| my neighbours | `ZREVRANGE season:12 rank-5 rank+5 WITHSCORES` | O(log n + 11) |

With 50M players, log₂ 50M ≈ 26 steps: microseconds. The score service writes the **database first** (the durable record) and then the sorted set; if Redis is lost, the set is rebuilt from the table in one pass.

**Ties**: Redis orders equal scores lexicographically by member, which is arbitrary for players. Encode the tie-break into the score: `points × 10^7 + (season_end − achieved_at in seconds)`, so for equal points the earlier achiever has the larger value. Scores are double-precision floats, exact for integers up to 2^53 ≈ 9.0 × 10^15, so with a 10^7 multiplier points must stay under about 900 million: check the bound before choosing the multiplier.

**Trending: buckets in a stream processor.**

1. Play events go to **Kafka**, partitioned by song id, so each song's count lives on one worker.
2. A **stream job** (Flink, Kafka Streams) keeps counts per song per **minute** (for the last hour) and per **hour** (for the day and week).
3. Every minute it merges the buckets of each window and emits the **top 100** per partition; a final step merges the partitions' top lists (the global top 100 is among the union of each partition's top 100, because each song lives in exactly one partition).
4. The lists go to Redis (or a small table), and the API serves them from cache.

**Exact or sketched?** (assumptions labelled) If 20M distinct songs are played in an hour, exact counts are 20M × 16 B = 320 MB per hourly bucket, and a week of hourly buckets is 168 × 320 MB ≈ 54 GB across the cluster: affordable when sharded. A **count-min sketch** shrinks it: with error ε = 0.0001 of the total and failure probability δ = 1%, the width is ⌈e/ε⌉ = 27,183 and the depth ⌈ln(1/δ)⌉ = 5, so 136k counters × 4 B ≈ 544 KB per bucket. The price: an hour has 5B ÷ 24 ≈ 208M plays, so each count may be over by up to ε × 208M ≈ 21,000 plays. Pair the sketch with a heap of the current top candidates (keep exact counts only for them). Choose exact counts if the catalogue is moderate and you have the memory; a sketch if it is huge.
"""
[[steps.points]]
id = "hld-zset"
text = "Redis sorted set with the right commands for top, rank and neighbours"
level = "mid"
[[steps.points]]
id = "hld-durable"
text = "Scores persisted durably so the sorted set can be rebuilt"
level = "senior"
[[steps.points]]
id = "hld-buckets"
text = "Sliding windows built from small time buckets, merged each minute"
level = "senior"
[[steps.points]]
id = "hld-stream"
text = "Play events through a log and a stream processor, sharded by song"
level = "senior"
[[steps.points]]
id = "hld-tiebreak"
text = "Ties broken by encoding time into the score, within the 2^53 exact range of a double"
level = "senior"

[[steps]]
name = "Deep dives"
minutes = 11
prompt = "Scale beyond one node, hot keys, and accuracy."
reference = """
**1. A leaderboard bigger than one node** (500M players: 500M × 100 B = 50 GB, or more updates than one node takes).

| Approach | Rank query | Cost |
|---|---|---|
| **Shard by score range** (0-999, 1,000-4,999, ...) | rank = sum of `ZCARD` of every higher shard + rank within my shard | exact; a player **moves** shards when their score crosses a boundary (remove from one, add to another); ranges need rebalancing as scores grow |
| Shard by player, rank from a histogram | count of players per score bucket gives "about rank 48,000" | approximate for most players, exact top N by asking each shard for its top N and merging |
| Only the top is exact | exact sorted set for the top 100,000; everyone else sees a percentile ("top 12%") | what many games show anyway |

The top 100 is easy in every scheme: it lives in the highest shard, or is the merge of each shard's top 100.

**2. Hot keys.** A viral song gets a large share of plays; its partition's worker gets them all. **Pre-aggregate**: each producer or first-stage worker counts locally per second and sends one `(song, +n)` per second instead of n events. For the leaderboard, the hot spot is the sorted set itself during a tournament: batch score updates per player per second, and serve the top 100 from a copy refreshed every second instead of from the primary.

**3. Accuracy by purpose.** A sketch overestimates; the trending list tolerates it. Royalty charts do not: recompute **exact** daily counts in a batch job from the raw event log (the log is the source of truth), and publish those. Two paths, one approximate and fast, one exact and late, each for its use.

**4. Abuse.** Bots replaying a song inflate its count. Filter before counting: cap counted plays per user per song per hour, require a minimum listening time, and drop accounts flagged by fraud detection. For games, validate scores on the game server and flag impossible jumps.

**5. Seasons.** A new season is a new key (`season:13`); the old set is kept read-only for a while, then archived to the database, never deleted in place.
"""
[[steps.points]]
id = "dd-shard-rank"
text = "A way to shard the leaderboard and still compute global rank"
level = "staff"
[[steps.points]]
id = "dd-hot"
text = "Pre-aggregation for hot keys before the global merge"
level = "senior"
[[steps.points]]
id = "dd-accuracy"
text = "Approximate streaming counts vs exact batch counts, chosen by purpose"
level = "senior"
[[steps.points]]
id = "dd-abuse"
text = "Inflated counts filtered before counting (per-user caps, minimum listen time)"
level = "mid"

[[probes]]
question = "How do you compute 'top songs in the last 24 hours' every minute without recounting a day of events?"
answer = "Keep counts in time buckets (minutes for the last hour, hours for the day). Each minute, add the newest bucket and subtract the one that left the window (or merge the 24 hourly buckets), then take the top 100 from the merged counts: the work is proportional to buckets and distinct songs, not to raw plays."

[[probes]]
question = "Two players have the same score. How does a sorted set rank them, and how would you make the earlier achiever rank higher?"
answer = "Redis orders equal scores lexicographically by member, which is arbitrary for players. Encode a tie-breaker into the score, for example score × 10^10 + (max_time − achieved_time), so for equal points the earlier time gives a larger value. Keep the result under 2^53, where a double stops representing every integer exactly."

[[probes]]
question = "Why is it fine for trending to be approximate but not the player's own score?"
answer = "Trending shows a ranked list where a small counting error rarely changes positions and nobody can check exact numbers; a player sees their own score and rank and will notice any mistake, and rewards may depend on it, so it is exact and durable."

[[probes]]
question = "Each Kafka partition computes its own top 100 songs. Is the merge of those lists the true global top 100?"
answer = "Yes, when partitioning is by song: each song is counted in exactly one partition, so a song in the global top 100 must be in its own partition's top 100. If plays of one song were spread over partitions (partitioned by user, say), a song could be 101st everywhere yet first overall, and the merge would miss it."

