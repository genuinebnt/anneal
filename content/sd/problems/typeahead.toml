title = "Typeahead (search autocomplete)"
kind = "hld"
order = 10
minutes = 35
prompt = "Design search autocomplete: as a user types in the search box, show the ten most likely completions within a few milliseconds, for billions of searches a day."
uses = ["delivery-framework", "typeahead-tries", "caching", "estimation"]
companies = ["Google", "Amazon", "Meta", "LinkedIn"]
hints = [
  "Every keystroke is a request. How much time does each one have?",
  "What data structure answers 'top completions for this prefix' fastest?",
  "Is the ranking computed live, or ahead of time?",
]

[[steps]]
name = "Requirements"
minutes = 5
prompt = "Functional requirements, measurable non-functional ones, and an estimate."
reference = """
**Functional**:

1. For the prefix typed so far, return the **top 10 completions**, ranked by popularity.
2. Suggestions reflect **new trends** within an hour at most (minutes is better: a breaking news query should appear while it is news).
3. Unsafe or policy-violating completions are never shown.

Out of scope unless asked: spelling correction ("did you mean"), per-user personalisation beyond a re-rank, multiple languages (say each language or market gets its own data set).

**Non-functional**:

| Requirement | Target | Reasoning |
|---|---|---|
| Latency | the list redraws before the next keystroke: aim for ~50 ms end to end, so **~10 ms on the server** | at ~5 characters a second (assumption) keys come every ~200 ms; most of the budget is the user's network |
| Availability | high; a failure shows no suggestions, search still works | autocomplete degrades gracefully: fail silent |
| Freshness | stale by minutes to an hour is fine | lets the ranking be computed offline |
| Consistency | none needed: two users may see slightly different lists | |

**Estimate** (assumptions labelled):

```text
searches       5B a day (assumption)
keystrokes     ~6 requests per search (assumption; after debouncing)
requests       5B × 6 / 86,400 s ≈ 347,000/s, ×2 at peak ≈ 700,000/s
read/write     reads only on the request path; writes are a batch job
```

The estimate says: this is a **read-only, latency-bound** service at hundreds of thousands of requests a second. Nothing can be computed per request that could have been computed before.
"""
[[steps.points]]
id = "req-latency"
text = "A tight latency budget per keystroke stated"
level = "mid"
[[steps.points]]
id = "req-qps"
text = "Request rate estimated from searches × keystrokes"
level = "senior"

[[steps]]
name = "Core entities"
minutes = 2
prompt = "Name the things the system stores."
reference = """
| Entity | What it holds | Lifetime |
|---|---|---|
| Search log event | query text, time, market, (user id) | raw input, kept days to weeks |
| `QueryCount` | normalised query, decayed score, market | rebuilt by the aggregation job |
| `Trie` snapshot | the prefix tree with the **top 10 completions stored at every node** | an immutable file, versioned, replaced every build |
| Blocklist | terms and patterns never to suggest | edited by people; applied in the build |
| Recent history (optional) | a user's last searches | per user, for a re-rank on the device or server |

The snapshot is the key entity: serving reads only it, it is built offline from `QueryCount`, and because it is immutable a server can swap the whole thing atomically (load the new version, flip a pointer, drop the old).
"""
[[steps.points]]
id = "ent-snapshot"
text = "A precomputed trie snapshot built from query counts"
level = "mid"

[[steps]]
name = "API"
minutes = 5
prompt = "The suggestion endpoint."
reference = """
```http
GET /suggest?q=ca&limit=10&market=en-GB

200 OK
Cache-Control: public, max-age=300
{ "q": "ca", "suggestions": ["camera", "car insurance", "calculator", "canva", "cafe near me", ...] }
```

- **A `GET` keyed by the prefix** (and market), so every layer can cache it: the browser, the CDN, the server. The response does not depend on who asks (personalisation, if any, is a re-rank on top), which is what makes the shared cache possible.
- **Client behaviour** cuts load more than any server change: **debounce** (send only after ~50-150 ms without a keystroke), **cancel** the in-flight request when a new key arrives (an `AbortController`), ignore responses for a prefix that is no longer in the box, and keep a small client cache so backspace costs nothing.
- Normalise the prefix before it becomes a key (lowercase, trim, collapse spaces): "Ca", "ca " and "ca" must hit the same cache entry.
"""
[[steps.points]]
id = "api-cache"
text = "A GET keyed by prefix, cacheable, with client-side debouncing"
level = "mid"
[[steps.points]]
id = "api-normalise"
text = "The prefix normalised before it is a cache key, and stale responses ignored on the client"
level = "mid"

[[steps]]
name = "High-level design"
minutes = 15
prompt = "Building and serving suggestions."
reference = """
**The diagram**: two separate paths, an offline build and an online read.

```text
OFFLINE (hourly)
search logs ─► aggregate + decay ─► filter ─► trie builder
                                                  │
                                    snapshot v42 ─► object storage
ONLINE
browser ─► CDN ─► LB ─► suggest servers (snapshot in RAM)
                            ▲ load v42, swap pointer
```

**Offline pipeline** (batch, e.g. hourly):

1. **Aggregate** the search logs into a score per normalised query with **time decay**, so last week's queries count more than last year's: score = Σ count × 0.5^(age ÷ half-life). With a 7-day half-life, 10,000 searches 28 days ago score 10,000 × 0.5^4 = 625, less than 1,000 searches today.
2. **Filter**: drop queries below a minimum count (long-tail and private ones such as a person's address), and anything matching the blocklist.
3. **Build the trie** and store the top 10 completions at **every node**, computed bottom-up: a node's top 10 is the best 10 among its own query and its children's lists. A lookup is then a walk down the prefix (at most its length in steps) and a read: no search of the subtree at request time.
4. **Publish** the snapshot to object storage with a version number.

**Serving**: suggestion servers download the snapshot, load it into memory, then answer `GET /suggest` by walking the prefix. Microseconds per lookup; the rest of the 10 ms is HTTP.

**Sizing** (assumptions labelled):

```text
queries kept     100M (above the count threshold)
trie nodes       ~500M (shared prefixes; assumption)
per node         ~64 B (children + 10 × 4-byte query ids)
memory           500M × 64 B ≈ 32 GB  → fits one server's RAM
servers          700,000/s ÷ ~50,000/s per server (assumption) ≈ 14, plus headroom, per region
```

Because one snapshot fits one machine, **replicate it whole** rather than shard: every server can answer every prefix, any server can die, and adding capacity is adding copies. Shard by prefix range only when the snapshot outgrows RAM (more markets, more queries), and then by **first characters**, so one lookup still hits one shard.

**Caching**: short prefixes are few and hot. Prefixes of up to 3 characters from 37 symbols (letters, digits, space) number 37 + 37² + 37³ = 52,059: cache all of them at the CDN with a 5-minute TTL, and most requests (the first keystrokes of every search) never reach a server.

**Alternatives rejected**: a SQL `LIKE 'ca%' ORDER BY count DESC` per keystroke (an index range scan plus a sort on every request; far over budget at 700k a second); a search engine's completion feature (Elasticsearch's completion suggester keeps an in-memory FST per segment, which is a fine way to build this if you already run it, but it is the same idea with a cluster to operate).
"""
[[steps.points]]
id = "hld-offline"
text = "Offline pipeline from logs to a trie snapshot; serving is read-only"
level = "mid"
[[steps.points]]
id = "hld-memory"
text = "Served from memory, top-K per node, sharded and replicated"
level = "mid"
[[steps.points]]
id = "hld-decay"
text = "Scores decay with age (a half-life), so recent searches outrank old ones"
level = "senior"

[[steps]]
name = "Deep dives"
minutes = 8
prompt = "Freshness, size, quality."
reference = """
**1. Trends within minutes.** An hourly batch cannot show a query that exploded five minutes ago. Add a **real-time layer**:

- A stream processor reads the search log and keeps counts per query over the last ~15-60 minutes (sliding windows), flagging queries whose recent rate is far above their usual rate.
- It publishes a small **trending list** per prefix (or per first character) every minute; suggestion servers poll it.
- At serving time, merge the offline top 10 with the trending candidates for the prefix by score and return the top 10.

The small layer keeps the large snapshot simple: the batch job stays the source of truth; the stream only adds.

**2. Size.** The minimum-count threshold does most of the work (the long tail is huge and rarely typed again). Then: store query ids, not strings, in the per-node lists; compress the trie (merge single-child chains into one node, a radix tree); build one snapshot per market. Shard by prefix only when a market outgrows one machine.

**3. Quality and safety.** Autocomplete puts words in front of people who did not type them, so it is held to a stricter bar than search results. Google, for one, describes removing predictions under published policies (for example sexually explicit, hateful, harassing or dangerous content), with automated systems and enforcement teams behind them. In the design: a blocklist and classifiers run in the **build pipeline** (so a bad completion is never published), plus a fast **kill switch** list that servers check at request time so a single prediction can be removed within minutes without a rebuild.

**4. Personalisation** (if asked): keep the shared, cacheable list as the base and re-rank on the device with the user's recent searches. LinkedIn's Cleo is a published example of the split: a generic typeahead ranked the same for everyone and a network typeahead ranked by each member's connections.

**5. Rollout of a new snapshot.** Load it beside the old one, check it (size, a set of known prefixes return sane lists), then swap the pointer; keep the previous version so a bad build rolls back in seconds.
"""
[[steps.points]]
id = "dd-trend"
text = "A real-time layer blended with the offline trie for trends"
level = "senior"
[[steps.points]]
id = "dd-filter"
text = "Unsafe suggestions filtered before publishing"
level = "senior"
[[steps.points]]
id = "dd-killswitch"
text = "A request-time kill switch removes a bad prediction without waiting for a rebuild"
level = "staff"

[[probes]]
question = "Why not run a database query like WHERE query LIKE 'ca%' ORDER BY count DESC LIMIT 10 per keystroke?"
answer = "At 350k requests a second with a 50 ms budget, scanning and sorting a large range per request is far too slow and costly; a trie with top-K precomputed per node answers in microseconds from memory."

[[probes]]
question = "A news event makes a new query explode. How long until it is suggested, and how do you shorten that?"
answer = "With only the hourly rebuild, up to an hour; a streaming counter of recent queries feeds a small real-time trie or list that is merged with the offline results at serving time, so it appears within minutes."

[[probes]]
question = "Your snapshot is 32 GB. Do you shard it or replicate it?"
answer = "Replicate it whole: it fits one machine's memory, so every server can answer every prefix, a failed server costs nothing but capacity, and capacity grows by adding copies. Shard by leading characters only when it no longer fits, so each lookup still touches one shard."

