title = "YouTube (video)"
kind = "hld"
order = 8
minutes = 45
prompt = "Design a video platform like YouTube: creators upload videos, which are processed and then streamed smoothly to viewers on any device and network around the world."
uses = ["delivery-framework", "large-blobs", "queues-and-streams", "caching", "scaling-reads"]
companies = ["Google", "Netflix", "Meta", "TikTok"]
hints = [
  "One upload has to play on a phone on 3G and a TV on fibre. What do you make from the original?",
  "Where should the video bytes come from when a million people watch?",
  "Processing a 2-hour 4K video takes a long time. How do you make it faster?",
]

[[steps]]
name = "Requirements"
minutes = 5
prompt = "Functional requirements, measurable non-functional ones, and an estimate."
reference = """
**Functional**:

1. Creators **upload** videos (up to hours long, up to 4K).
2. Viewers **watch** on any device, with quality that **adapts** to their network.
3. Video **metadata** (title, description, channel), **search**, and **view counts**.

Out of scope unless asked: recommendations (a separate system that only needs view events), comments, live streaming (name the difference: segments produced in real time), monetisation.

**Non-functional**:

| Requirement | Target |
|---|---|
| Start time | playback starts in under ~2 s |
| Smoothness | rare rebuffering, even when bandwidth drops mid-video |
| Upload | durable and resumable; a 10 GB upload survives a dropped connection |
| Processing | watchable within minutes of upload (low resolutions first) |
| Reach | a global audience; a viral video must not melt anything |

**Estimate** (assumptions labelled):

```text
uploads    500 hours of video a minute (the figure YouTube has cited publicly) = 720,000 hours/day
renditions ~10 Mbit/s summed over the whole ladder (assumption) → 4.5 GB per video hour
           720,000 h × 4.5 GB ≈ 3.2 PB/day of renditions, + originals at ~20 Mbit/s ≈ 6.5 PB/day
views      5B a day (assumption) ≈ 58,000 starts/s; 5 min average at ~2.5 Mbit/s
egress     5B × 300 s × 2.5 Mbit/s ÷ 8 ≈ 470 PB/day ≈ 43 Tbit/s on average
```

The comparison is the answer: **storage grows by ~10 PB a day, but egress is ~470 PB a day**, about fifty times more bytes leaving than arriving. Delivery (the CDN), not storage or processing, is the cost and the scale problem.
"""
[[steps.points]]
id = "req-adaptive"
text = "Smooth playback on any network (adaptive quality) as a requirement"
level = "mid"
[[steps.points]]
id = "req-egress"
text = "Bandwidth (egress) identified as the dominant cost and scale problem"
level = "senior"

[[steps]]
name = "Core entities"
minutes = 2
prompt = "Name the things the system stores."
reference = """
| Entity | Fields | Store |
|---|---|---|
| `Video` | id, owner, title, description, **status** (`uploading`, `processing`, `ready`, `failed`), duration, created_at | metadata DB |
| Original | the uploaded file, exactly as received | object storage (kept: re-encode later with better codecs) |
| `Rendition` | video_id, resolution, codec, bitrate, status | metadata DB |
| Segments and manifests | 2-6 s pieces of each rendition; a manifest (HLS `.m3u8` or DASH `.mpd`) listing them | object storage, served through the CDN |
| View counts | per video: a counter fed by events | a stream plus a counter store |

The original and the renditions are separate: the original is the source of truth that is rarely read; renditions are derived, re-creatable, and read billions of times. A typical ladder (assumption) is 240p, 360p, 480p, 720p and 1080p (plus 1440p and 4K for sources that have them), each in one or two codecs (H.264 for every device, VP9 or AV1 where supported for fewer bits at the same quality).
"""
[[steps.points]]
id = "ent-rendition"
text = "Renditions and segments, apart from the original upload"
level = "mid"

[[steps]]
name = "API"
minutes = 5
prompt = "Uploading and watching."
reference = """
```http
POST /v1/videos   { "title": "Keynote", "size": 8589934592, "content_type": "video/mp4" }
-> 201 { "video_id": "v_19", "upload_id": "up_3", "part_size": 67108864,
         "part_urls": ["https://storage…/v_19/orig?partNumber=1&uploadId=…&X-Signature=…", "…"] }

PUT  <part url>   (each 64 MiB part straight to object storage; retry a failed part alone)
POST /v1/videos/v_19/complete   { "parts": [ { "n": 1, "etag": "…" }, … ] }   -> 202 { "status": "processing" }

GET  /v1/videos/v_19   -> { "title": "…", "status": "ready", "manifest_url": "https://cdn…/v_19/master.m3u8" }
GET  https://cdn…/v_19/master.m3u8        (the CDN; lists one playlist per rendition)
GET  https://cdn…/v_19/720p/seg_00042.m4s (the player picks a rendition per segment)
```

- **Uploads bypass the API servers** as multipart uploads with presigned URLs: an 8 GiB file is 128 parts of 64 MiB, each retried alone. `complete` returns **202**: processing takes minutes.
- **Playback is plain HTTP GETs of a manifest and segments**, which is exactly what CDNs cache best. HLS is standardised in RFC 8216; Apple's authoring specification for its devices asks for target segment durations of 6 seconds.
"""
[[steps.points]]
id = "api-manifest"
text = "Playback through a manifest (HLS/DASH) served from a CDN"
level = "mid"
[[steps.points]]
id = "api-multipart"
text = "Uploads as presigned multipart parts straight to storage, completed with a 202"
level = "mid"

[[steps]]
name = "High-level design"
minutes = 15
prompt = "Upload, processing, playback."
reference = """
**The diagram**:

```text
creator ─► object storage (original) ─► "uploaded" event ─► queue
                                                              │
               ┌─────────────── processing DAG ◄─────────────┘
               │ split → transcode ×N (parallel) → package → manifest
               ▼
object storage (segments, manifests) ─► CDN edges ─► viewers
                                           ▲
metadata DB (videos, status) ◄── API ◄─────┘ (player asks for manifest_url)
```

**Upload**: multipart, presigned, straight to object storage. Completion publishes an event to a **queue**; the API never touches the bytes.

**Processing pipeline** (asynchronous, a DAG of tasks):

1. **Inspect** the original (codec, resolution, duration); reject or flag what is broken.
2. **Split** it into chunks at keyframes (GOP boundaries) so each can be encoded independently.
3. **Transcode** each chunk into every rendition of the ladder, in parallel across many workers.
4. **Package**: cut into 2-6 s **segments** and write a **manifest** per rendition and a master manifest.
5. Mark the video `ready`; publish the manifest URL. Thumbnails, captions and content checks run as sibling tasks.

**Playback**: the player fetches the master manifest, picks a rendition, and downloads segments from the **CDN**. After each segment it measures throughput and buffer level and picks the next segment's rendition: that is **adaptive bitrate (ABR)**. A drop from fibre to 3G changes the quality at the next segment boundary instead of stalling.

:::steps Bandwidth drops mid-video
- player | 1080p segment 41 in 1.2 s for 6 s of video | Plenty of headroom; the buffer holds 20 s.
- network | throughput falls to 2 Mbit/s | Segment 42 at 1080p takes 7 s: slower than real time.
- player | buffer falling → request 480p for segment 43 | A smaller segment downloads in 2 s.
- viewer | sees a softer picture, no spinner | The manifest made the switch possible at a segment boundary.
:::

**Metadata** (titles, status, renditions) in a sharded relational or wide-column store; it is small next to the video bytes. **Search** in a search index fed from it. **View counts** through a stream (deep dives).
"""
[[steps.points]]
id = "hld-pipeline"
text = "An async processing pipeline: queue, parallel transcoding, segments and manifests"
level = "mid"
[[steps.points]]
id = "hld-cdn"
text = "Segments served from a CDN, with adaptive bitrate in the player"
level = "mid"

[[steps]]
name = "Deep dives"
minutes = 15
prompt = "Speed, cost, and the long tail."
reference = """
**1. Fast processing by parallelism.** A 3-hour video in 10 s chunks is 3 × 3,600 ÷ 10 = **1,080 chunks**. Encoded serially it takes hours; spread over 1,000 workers, the wall time is roughly one chunk's encode plus splitting and stitching. Run it as a **DAG** in a workflow engine (each task retried alone, a failed chunk re-encoded without redoing the rest). Do the **low renditions first** and publish the manifest as renditions complete: the video is watchable at 360p in minutes while 4K finishes. At YouTube's scale the encoding itself moved to hardware: Google's ASPLOS 2021 paper describes a video coding unit (VCU) accelerator deployed in its data centres, reporting 20-33× the efficiency of a well-tuned software baseline.

**2. Encode smarter, not only faster.** A fixed ladder wastes bits on simple content (a slide deck at 5 Mbit/s) and starves complex content (sport). **Per-title** (and per-shot) encoding chooses each video's ladder from test encodes, a technique Netflix pioneered in 2015. Spend the most encoding effort where it is watched most: re-encode popular videos with costlier codecs (AV1), because every bit saved is multiplied by millions of views.

**3. The CDN and the long tail.** Popularity is extremely skewed:

| Tier | Holds | Serves |
|---|---|---|
| edge caches (in or near ISPs) | the currently popular segments | the bulk of the 43 Tbit/s |
| regional caches | the warm middle | edge misses |
| origin (object storage) | everything, every rendition | the long tail and first requests |

Pre-position (push) a video's segments to edges when it starts trending, or for scheduled premieres. Netflix's Open Connect is the extreme case: appliances embedded **inside ISPs**, filled proactively during off-peak hours, so the busiest traffic never crosses the internet. Request coalescing at each tier (one fetch upstream for many concurrent misses on the same segment) keeps a viral video's first minutes from stampeding the origin.

**4. Cost of storage.** Renditions of videos nobody watches are cold: move them to cheaper storage classes, or delete rare renditions of cold videos and **re-create on demand** from the original (a few seconds of delay for a very rare viewer, against storing petabytes forever).

**5. View counts.** 58,000 view starts a second must not be 58,000 row updates on hot rows. Players send view events to a log (Kafka); a stream job **filters** (a "view" needs some seconds watched; duplicate and bot views dropped) and **aggregates** per video per minute, then adds the batch to a counter store. The count shown is approximate and a little behind; the exact count (for creators' payments) is recomputed in batch from the log.
"""
[[steps.points]]
id = "dd-parallel"
text = "Source split into chunks transcoded in parallel, with retries per task"
level = "senior"
[[steps.points]]
id = "dd-tail"
text = "Popular videos at the edge; the long tail from regional caches or origin"
level = "senior"
[[steps.points]]
id = "dd-counts"
text = "View counts batched through a stream, not a row update per view"
level = "staff"
[[steps.points]]
id = "dd-per-title"
text = "Encoding effort spent where views are (per-title ladders, better codecs for popular videos)"
level = "staff"
[[steps.points]]
id = "dd-coalesce"
text = "Request coalescing at cache tiers so a viral video's misses do not stampede the origin"
level = "senior"

[[probes]]
question = "Why cut videos into 2 to 6 second segments?"
answer = "So the player can change quality at every segment boundary as bandwidth changes, start playback after the first segment instead of the whole file, seek quickly, and so CDNs cache small, reusable pieces."

[[probes]]
question = "A creator uploads a 3-hour 4K stream. How do you have it watchable in minutes, not hours?"
answer = "Split the source into chunks at keyframes and transcode them in parallel across many workers, starting with the lower resolutions so playback can begin while higher ones finish; stitch the segments and publish the manifest as renditions complete."

[[probes]]
question = "A video goes viral in one country. What keeps the origin from melting?"
answer = "The CDN: segments are cached at edges near viewers, so after the first requests the origin is barely touched; pre-warm or push the video's segments to edges in that region once its views spike."

[[probes]]
question = "Your estimate says 43 Tbit/s of egress on average. Where does the next 10% saving come from?"
answer = "From the bits, not the servers: better codecs (VP9, AV1) and per-title ladders for the most-watched videos, since a saving on a popular video is multiplied by every view; and from where the bits travel: higher cache hit ratios at edges inside ISPs, so less traffic crosses paid transit."

