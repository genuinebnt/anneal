title = "Distributed job scheduler"
kind = "hld"
order = 15
minutes = 40
prompt = "Design a service that runs jobs for other teams: one-off jobs at a given time and recurring cron jobs, millions of them a day, each run at least once and on time even when machines fail."
uses = ["delivery-framework", "leases-and-fencing", "coordination-services", "queues-and-streams", "resilience"]
companies = ["Amazon", "Google", "Airbnb", "Uber", "Stripe"]
hints = [
  "How do you find the jobs that are due in the next second among 100 million without scanning them all?",
  "A worker picks up a job and dies halfway. How does someone else know to run it, and how do you stop both running it?",
  "Two scheduler instances both see the same due job. What prevents a double dispatch?",
]

[[steps]]
name = "Requirements"
minutes = 5
prompt = "Functional requirements, the non-functional ones made measurable, and an estimate."
reference = """
**Functional**:

1. Teams **create, update and cancel** jobs: one-off ("at 2026-12-01 09:00 UTC") or recurring (a cron expression in a time zone).
2. The system **runs** each due job on a worker: calls a handler with the payload.
3. **Retries** with backoff on failure, up to a limit, then a dead-letter state and an alert.
4. **History**: every run with its status, attempts, timing and error.

**Non-functional**:

| Requirement | Target |
|---|---|
| Timeliness | a run starts within ~5 s of its scheduled time (p99), outside declared spikes |
| Semantics | **at least once**: a due run is never silently lost; a duplicate is rare and must be harmless, so jobs are written to be **idempotent** |
| Availability | no single point of failure; losing a scheduler or a worker loses no runs |
| Isolation | one team scheduling a million jobs at once cannot starve the others |

Exactly-once is not on the list: a worker can always finish the work and die before reporting it, so the honest guarantee is at-least-once plus idempotent jobs. Say this before the interviewer asks.

**Estimate** (assumptions labelled):

```text
runs          10M a day ≈ 116/s on average
spike         cron's favourite moment is :00: assume 50,000 runs due in the same second
jobs table    10M job definitions × ~1 KB = 10 GB
runs table    10M/day × ~200 B = 2 GB/day; 30 days kept = 60 GB (partition by day)
```

The average is trivial for one Postgres. The design is driven by the **spike** (430 times the average, all at once) and by **failure handling**, not by volume.
"""
[[steps.points]]
id = "req-semantics"
text = "At-least-once execution stated, with idempotent jobs expected"
level = "mid"
[[steps.points]]
id = "req-spike"
text = "Noticed the top-of-the-hour spike from cron schedules"
level = "senior"

[[steps]]
name = "Core entities"
minutes = 3
prompt = "Name the things the system stores."
reference = """
| Entity | Fields | Notes |
|---|---|---|
| `Job` | id, owner team, handler (a queue name or an HTTP endpoint), payload, schedule (time, or cron + time zone), retry policy, timeout, **next_run_at**, enabled | the definition; one row per job |
| `Run` | id, job_id, scheduled_for, **status** (pending → leased → running → succeeded / failed / dead), attempt, **lease_owner**, **lease_expires_at**, started, finished, error | one row per execution; `(job_id, scheduled_for)` unique |
| `Worker` | id, capabilities, last heartbeat | for routing and liveness |

`Run` is separate from `Job` because a definition fires many times and each firing has its own life: attempts, an owner, a lease, an outcome. The **unique key `(job_id, scheduled_for)`** means a scheduler that tries to create the same firing twice fails the second time: the database, not the code, prevents double dispatch. The lease fields on the run are what let another worker take over safely.
"""
[[steps.points]]
id = "ent-run"
text = "Runs kept separate from job definitions, with a lease owner and expiry"
level = "senior"

[[steps]]
name = "API"
minutes = 3
prompt = "What do other teams call?"
reference = """
**Teams** (HTTP):

```http
POST /v1/jobs
Idempotency-Key: billing-monthly-close
{ "handler": "queue://billing.close", "payload": { "region": "eu" },
  "schedule": { "cron": "0 2 1 * *", "tz": "Europe/London" },
  "retry": { "max_attempts": 5, "backoff": "exponential", "base_s": 30 }, "timeout_s": 900 }
-> 201 { "id": "job_77", "next_run_at": "2026-12-01T02:00:00Z" }

PATCH  /v1/jobs/job_77      { "enabled": false }
DELETE /v1/jobs/job_77
GET    /v1/jobs/job_77/runs?status=failed
```

**Workers** (an internal protocol, the heart of failure handling):

```text
lease(worker_id, n, lease_s=60) -> [ { run_id, job, payload, attempt } ]
heartbeat(run_id, attempt)      -> extends lease_expires_at, or "lost" if no longer yours
complete(run_id, attempt, ok | error)
```

Every call after `lease` carries the **attempt number**; a heartbeat or completion for an attempt that is no longer current is refused, which is how a stale worker learns it lost the run.
"""
[[steps.points]]
id = "api-worker"
text = "A worker protocol with lease, heartbeat and complete"
level = "senior"

[[steps]]
name = "High-level design"
minutes = 15
prompt = "Draw how a due job becomes a running one."
reference = """
**The diagram**:

```text
teams ─► jobs API ─► Postgres: jobs (index on next_run_at)
                          │                 runs
              ┌───────────┴──────────┐
         scheduler A            scheduler B   (each owns some shards)
              └──────► run queue ◄───┘       (per tenant / priority)
                          │
                    workers: lease → heartbeat → complete
```

**1. Job store.** Postgres with `CREATE INDEX ON jobs (next_run_at) WHERE enabled`. Finding due jobs is a range read on that index, never a scan of 10M rows. Shard by job id when one database is not enough.

**2. Schedulers** (several, for availability). Each loop, every second or so:

```sql
BEGIN;
SELECT id, schedule FROM jobs
 WHERE enabled AND next_run_at <= now() + interval '5 seconds'
 ORDER BY next_run_at
 LIMIT 1000
 FOR UPDATE SKIP LOCKED;           -- rows another scheduler holds are skipped, not waited for
INSERT INTO runs (job_id, scheduled_for, status, attempt) VALUES (...)  -- unique (job_id, scheduled_for)
ON CONFLICT DO NOTHING;
UPDATE jobs SET next_run_at = <next cron time after this one> WHERE id = ...;
COMMIT;
```

then publish the new runs to the queue. Creating the run and advancing `next_run_at` in **one transaction** means a crash leaves either both done or neither: never a run without the schedule moving (a duplicate next time), never the schedule moved without a run (a lost firing). PostgreSQL documents `SKIP LOCKED` for exactly this, avoiding lock contention with many consumers of a queue-like table. The alternative is **shard ownership**: each scheduler owns a set of job shards, assigned and fenced through leases in etcd or ZooKeeper, so no two ever read the same rows.

**3. Run queue.** Kafka, SQS, or the `runs` table itself at this volume. Separate queues per tenant or priority, with per-tenant concurrency limits, so one team's million jobs cannot fill every worker. Dropbox's task framework (ATF) is a published example: one SQS queue per (handler, priority) pair.

**4. Workers** lease runs, **heartbeat** every ~lease/3 while running, and complete. A run whose lease expires (its worker died, hung or lost the network) goes back to pending and is retried with exponential backoff and jitter, up to `max_attempts`, then marked `dead` with an alert to its owner.

:::steps A worker dies mid-run
- worker 1 | lease run r9, attempt 1, expires 10:00:60 | It starts the job and heartbeats.
- worker 1 | crashes at 10:00:30 | Heartbeats stop.
- sweeper | lease_expires_at < now → pending, attempt 2 | A background sweep (or the next lease query) frees it.
- worker 2 | lease run r9, attempt 2 | Runs it again: the job must be idempotent.
:::
"""
[[steps.points]]
id = "hld-index"
text = "Due jobs found by an index or time buckets on next run time, not a scan"
level = "mid"
[[steps.points]]
id = "hld-skip-locked"
text = "Claiming due jobs safely across schedulers (SKIP LOCKED, shard ownership)"
level = "senior"
[[steps.points]]
id = "hld-lease"
text = "Worker leases with heartbeats; expired leases are retried"
level = "senior"
[[steps.points]]
id = "hld-next"
text = "Next run time advanced in the same transaction that creates the run"
level = "senior"
[[steps.points]]
id = "hld-tenant"
text = "Per-tenant queues or concurrency limits so one team cannot starve the rest"
level = "senior"

[[steps]]
name = "Deep dives"
minutes = 14
prompt = "Duplicates, the hourly spike, and long jobs."
reference = """
**1. Double execution and fencing.** A worker can pause (a long GC, a frozen VM, a network partition) past its lease while another worker takes the run. When it wakes, it still believes it owns the run. Leases alone cannot stop it writing; a **fencing token** can: every lease hands out a number that only grows (the attempt number), the worker passes it with every write it makes, and the store rejects writes with a token older than the newest it has seen. Kleppmann's essay on distributed locking makes the case with exactly this scenario; Chubby's sequencers are the same idea. `complete(run_id, attempt=1)` after attempt 2 began is refused. The job should still be idempotent, because side effects outside the fenced store (an email) cannot be fenced.

**2. The top-of-the-hour spike.** 50,000 runs due at 10:00:00:

- **Read ahead**: schedulers claim runs due in the next 5-30 s and enqueue them with their due time; workers start them at the second. The database work is spread over the seconds before.
- **Jitter by policy**: most "hourly" jobs do not care about the exact second. Offer a `window` (say 60 s) and spread runs over it: 50,000 ÷ 60 ≈ 830 a second instead of 50,000 in one.
- **Autoscale workers on queue depth**, and keep a warm pool before known peaks (midnight UTC, the first of the month).

**3. Long jobs.** Heartbeats extend the lease, so a two-hour job holds a one-minute lease renewed every 20 s; a job that stops heartbeating is presumed dead after one lease. A timeout per job kills runaways. Multi-step jobs that must survive restarts belong in a **workflow engine** (Temporal, Step Functions) that checkpoints each step, not in one long run.

**4. Missed runs.** After a 3-hour outage, an hourly job has three missed firings. Default: **run once** (the latest), and say so in the API; let a job opt into **catch-up** (run every missed firing) when each one matters, such as daily billing. Cap catch-up so an old outage does not unleash thousands of runs: Kubernetes' CronJob controller, for example, refuses to start a job that has missed more than 100 schedules.

**5. Time zones and DST.** Store cron with its time zone and compute the next time with a real time-zone library. On a spring-forward day, 02:30 local does not exist; on fall-back, 01:30 happens twice. Pick a policy (run at the next valid time; run once on the repeated hour) and document it, or recommend UTC for jobs that must run exactly every 24 hours.

**6. Scheduler failure.** Schedulers are stateless: the database holds everything. With `SKIP LOCKED`, any surviving scheduler simply picks up the rows; with shard ownership, a dead scheduler's lease in etcd expires and another takes its shards.
"""
[[steps.points]]
id = "dd-fencing"
text = "Fencing tokens or attempt numbers to stop a stale worker's writes"
level = "staff"
[[steps.points]]
id = "dd-spike"
text = "The hourly spike handled with pre-fetching, jitter and autoscaling"
level = "senior"
[[steps.points]]
id = "dd-missed"
text = "A policy for missed runs and DST"
level = "senior"
[[steps.points]]
id = "dd-workflow"
text = "Long multi-step jobs moved to a workflow engine with checkpoints"
level = "senior"

[[probes]]
question = "Two scheduler instances poll the same jobs table. How do you stop them dispatching the same run twice?"
answer = "Either give each scheduler exclusive ownership of shards (assigned through etcd or ZooKeeper leases), or claim rows with SELECT … FOR UPDATE SKIP LOCKED inside a transaction that creates the run and advances next_run_at, so a second scheduler skips rows already locked and sees the advanced time afterwards."

[[probes]]
question = "A worker leases a run, then its VM freezes for two minutes. The lease was one minute. What happens?"
answer = "The lease expires and the run is handed to another worker with a new attempt number. When the frozen worker wakes and tries to complete or write results, its old attempt number (fencing token) is rejected, so only the new attempt's results count; idempotent jobs make any side effects already done harmless."

[[probes]]
question = "Why advance next_run_at in the same transaction that creates the run?"
answer = "If they were separate, a crash between them would either create the run without moving the schedule (the next poll creates a duplicate) or move the schedule without a run (the run is lost). One transaction makes both happen or neither."

[[probes]]
question = "The scheduler was down for six hours. A job runs every minute. What should happen when it comes back?"
answer = "Not 360 runs at once. By default run the latest firing once and skip the rest (recorded as missed); jobs that need every firing opt into catch-up, which is rate-limited and capped. Kubernetes CronJob applies such a cap: past 100 missed schedules it does not start the job."

