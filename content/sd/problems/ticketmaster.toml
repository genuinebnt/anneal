title = "Ticketmaster (booking)"
kind = "hld"
order = 5
minutes = 45
prompt = "Design a ticket booking site like Ticketmaster: users browse and search events, see a seat map, hold seats while they pay, and buy them, including when a popular concert goes on sale and millions arrive at once."
uses = ["delivery-framework", "contention", "postgres", "redis", "consistency-cap", "caching", "scaling-reads"]
companies = ["Amazon", "Uber", "Meta", "Booking.com"]
hints = [
  "Two people click the same seat. What makes exactly one of them win?",
  "Payment takes minutes. How is the seat kept for one person without locking the database that long?",
  "Ten million people arrive at 10:00. What stands between them and the booking database?",
]

[[steps]]
name = "Requirements"
minutes = 5
prompt = "Functional requirements, measurable non-functional ones, and what makes it hard."
reference = """
**Functional**:

1. **Browse and search** events (by artist, city, date).
2. See an event's **seat map** with what is available.
3. **Hold** chosen seats for a few minutes while paying.
4. **Pay** and receive tickets.

Out of scope unless asked: resale, dynamic pricing, the venue-side tools, ticket scanning at the door.

**Non-functional**, two different consistency needs in one product:

| Part | Need | Why |
|---|---|---|
| Booking (hold, buy) | **strong consistency: no seat sold twice** | two people at the door with one seat is the failure that matters |
| Browse, search, seat map | **high availability, low latency**, may be seconds stale | a stale "available" costs one failed hold, which the hold step reports |
| On-sale moments | survive **millions of users in minutes** on one event | the load is concentrated on a few thousand rows |

**Estimate** (assumptions labelled), the hard case:

```text
arrivals        10M users at 10:00 for 50,000 seats (assumption)
orders          50,000 seats ÷ ~4 per order ≈ 12,500 orders can succeed
seat map        50,000 seats × ~50 B ≈ 2.5 MB per event (cacheable)
naive polling   10M users refreshing every 5 s = 2M requests/s at one event
```

Over 99% of the people who arrive cannot buy a ticket. The design's job is to say "no" or "wait" to them cheaply and fairly, while 12,500 orders go through a strongly consistent path. Real on-sales are this lopsided: Ticketmaster reported 3.5 billion system requests, four times its previous peak, during the 2022 presale for Taylor Swift's Eras Tour, and 3.5 million people had registered for its Verified Fan presale.
"""
[[steps.points]]
id = "req-double"
text = "No double booking named as the strongly consistent requirement"
level = "mid"
[[steps.points]]
id = "req-split"
text = "Browsing allowed to be eventually consistent and highly available"
level = "senior"
[[steps.points]]
id = "req-spike"
text = "The on-sale spike identified as the hardest load"
level = "senior"

[[steps]]
name = "Core entities"
minutes = 2
prompt = "Name the things the system stores."
reference = """
| Entity | Fields | Notes |
|---|---|---|
| `Event` | id, performer, venue, start time, on-sale time | read-mostly; also indexed for search |
| `Venue` | id, name, layout (sections, rows, seats) | static |
| `Ticket` (one per seat per event) | event_id, seat (section, row, number), price, **status** (`free`, `held`, `sold`), **held_by**, **held_until**, booking_id | the row that contention is about |
| `Booking` | id, user, ticket ids, total, payment status, idempotency key | created at payment |
| `User` | id, verified status | |

The ticket row carries its **hold expiry** (`held_until`). That one column is what lets a hold end by itself: a hold whose time has passed is treated as free by the next attempt, so nothing has to run for an abandoned hold to be released.
"""
[[steps.points]]
id = "ent-ticket"
text = "A ticket/seat row with a status and a hold expiry"
level = "mid"

[[steps]]
name = "API"
minutes = 5
prompt = "Endpoints for browsing, holding and buying."
reference = """
```http
GET  /events?q=taylor&city=london&from=2027-06-01        -> 200 { events: [...] }
GET  /events/{id}                                         -> 200 { event }        (cacheable)
GET  /events/{id}/seats                                   -> 200 { sections: [...] } (cacheable for seconds)

POST /events/{id}/holds        { "seat_ids": ["A-12-7", "A-12-8"] }
-> 201 { "hold_id": "h_81", "expires_at": "2027-03-01T10:10:00Z" }
-> 409 { "error": "seats_taken", "taken": ["A-12-8"] }

POST /bookings                 Idempotency-Key: 2b7e...   { "hold_id": "h_81", "payment_method": "pm_tok_..." }
-> 201 { "booking_id": "b_9", "tickets": [...] }
-> 410 { "error": "hold_expired" }
```

- **Holding is its own step** with an explicit `expires_at`, so the client can show a countdown, and with `409 Conflict` naming the seats that were taken, so the client can offer others.
- **Booking takes an idempotency key**: if the response to a booking is lost, the retry must return the same booking, not charge the card a second time.
- During an on-sale, holds and bookings also require an **admission token** from the waiting room (see the deep dives); requests without one are refused before they reach the booking service.
"""
[[steps.points]]
id = "api-hold"
text = "Holding seats is its own step, returning an expiry, with 409 when taken"
level = "mid"
[[steps.points]]
id = "api-idem"
text = "Booking is idempotent (a retry after a timeout does not charge twice)"
level = "senior"

[[steps]]
name = "High-level design"
minutes = 15
prompt = "Browsing, holding and booking."
reference = """
**The diagram**:

```text
users ─► CDN (event pages, seat-map snapshots)
  │
  └─► waiting room ─► API gateway (checks admission token)
                         ├─► event svc ─► Postgres + Elasticsearch
                         └─► booking svc ─► Postgres: tickets, bookings
                                   └─► payment provider
```

**Browsing** (the read path, kept apart): events live in Postgres and are indexed into **Elasticsearch** for search by text, place and date. Event pages and seat-map snapshots are cached at the **CDN** and in Redis, refreshed every few seconds. Browsing never touches the ticket rows that bookings lock.

**Holding** (the contended write): one statement, all seats or none:

```sql
BEGIN;
UPDATE tickets
   SET status = 'held', held_by = $user, held_until = now() + interval '10 minutes'
 WHERE event_id = $event AND seat_id = ANY($seats)
   AND (status = 'free' OR (status = 'held' AND held_until < now()));
-- rows updated must equal the number of seats asked for; otherwise ROLLBACK and answer 409
COMMIT;
```

Why it is safe: in Postgres's Read Committed mode, a second transaction updating the same row **waits** for the first to finish, then re-checks its `WHERE` against the new row version; it finds `status = 'held'` and updates nothing. Exactly one of two clicks wins, with no lock held beyond a few milliseconds.

:::steps Two users click seat A-12-8 at once
- user 1 | UPDATE … WHERE status = 'free' | Locks the row, sets held, commits.
- user 2 | same UPDATE, waits on the row lock | It blocks for the few ms user 1's transaction takes.
- user 2 | re-checks WHERE on the new version | status is held and not expired: 0 rows.
- booking svc | rows 0 < 1 asked → ROLLBACK, 409 | User 2 is told at once and picks another seat.
:::

**Buying**: `POST /bookings` checks the hold is still the user's and not expired, charges through the payment provider with an idempotency key, and in one transaction marks the tickets `sold` and writes the booking. If payment fails or the user leaves, the hold simply expires.

**Alternatives rejected**: `SELECT … FOR UPDATE` held while the user pays (a database lock for minutes, across a user's think time: connections pile up); a Redis lock per seat (`SET seat NX EX 480`) as the source of truth (fast, but the booking must still be recorded durably and atomically for several seats, and two stores that can disagree is the bug we are trying to avoid; Redis is fine as a cache of availability in front).
"""
[[steps.points]]
id = "hld-atomic"
text = "Holding is atomic: a conditional update (or row locks) in one transaction"
level = "mid"
[[steps.points]]
id = "hld-expiry"
text = "Holds expire by time, without keeping database locks open"
level = "senior"
[[steps.points]]
id = "hld-read"
text = "Browsing and search served from caches and a search index, apart from booking"
level = "mid"
[[steps.points]]
id = "hld-why-safe"
text = "Explained why the conditional update is safe: the second updater waits and re-checks the condition"
level = "senior"

[[steps]]
name = "Deep dives"
minutes = 15
prompt = "The on-sale rush, real-time seat maps, and failures."
reference = """
**1. The virtual waiting room.** Nobody reaches the booking service without passing it.

- At on-sale, users land on a **static page** served from the CDN: it costs nothing to serve 10M of them.
- Each gets a **position** (a Redis sorted set by arrival time, or a random order for everyone who arrived before the start, which removes the advantage of bots refreshing at 9:59:59). Cloudflare's Waiting Room, for example, offers both first-in-first-out and random ordering.
- The room **admits users at the rate the booking path can serve**, measured, not guessed: say 2,000 a minute. 12,500 successful orders at 2,000 admissions a minute is about 6 minutes, if every admitted user buys (many will not, so admission continues until seats run out).
- An admitted user gets a short-lived **signed token** (user, event, expiry) that the gateway checks on every hold and booking.
- Positions are polled slowly (every 20-30 s) or pushed, so the queue itself is cheap: 10M users polling every 20 s is 500,000 small requests a second, served at the edge from a counter, not by the database.
- When the seats are gone, the room says so at once to everyone still waiting.

Ticketmaster's real defence went further: its Verified Fan presale registered fans in advance and sent codes to only part of them, which is admission control before the day.

**2. Keep one event's tickets together.** A hold for several seats must be one transaction, so all of an event's tickets live on **one database (shard)**. Shard by `event_id` across events if the total grows, never one event across shards. One event's rows are a few thousand to 100,000: one Postgres handles thousands of short updates a second on them, which is why the waiting room's admission rate, not the database, is the limit.

**3. Seat-map freshness.** Admitted users see a map that changes every second. Options: poll a cached per-section summary every few seconds; or push changes over SSE or WebSockets to the few thousand admitted users. Either way the map is advisory: **the hold is the real check**, and a 409 offers the next best seats.

**4. Payment failures.** The booking moves through `paying` → `paid` with an idempotency key to the provider. A booking stuck in `paying` (the server died after charging) is found by a sweeper and **reconciled** with the provider: if the charge went through, mark the tickets sold; if not, release them. Never release seats a user has paid for because a response was lost.

**5. Bots and fairness.** Rate limits per account and per device, verified accounts, purchase limits per user per event, and the randomised queue. They are product rules as much as engineering.
"""
[[steps.points]]
id = "dd-queue"
text = "A virtual waiting room admits users at a sustainable rate"
level = "senior"
[[steps.points]]
id = "dd-shard"
text = "One event's seats kept together so holds stay in one transaction"
level = "staff"
[[steps.points]]
id = "dd-reconcile"
text = "Payment failures and stuck bookings reconciled with the provider"
level = "staff"
[[steps.points]]
id = "dd-token"
text = "Admitted users carry a signed, expiring token that the booking path checks"
level = "senior"

[[probes]]
question = "A user holds two seats and their browser crashes. What happens to the seats?"
answer = "Nothing needs to run: the hold has held_until, and the conditional update treats an expired hold as free, so after ten minutes anyone can take them. A background job can tidy the status later, but correctness does not depend on it."

[[probes]]
question = "Why not use a Redis lock per seat instead of the database?"
answer = "You can (SET seat NX EX 600) as a fast first gate, but the booking still has to be recorded durably and atomically for several seats; keeping the truth in one database transaction avoids two systems disagreeing, and Redis can front it to absorb reads."

[[probes]]
question = "Ten million users arrive at 10:00 for 50,000 seats. Walk through the first minute."
answer = "They land in the waiting room (a static page plus a queue), get a position, and are admitted a few thousand a minute with a signed token; admitted users see the cached seat map and hold seats with conditional updates; the rest keep their place or are told it sold out, and the booking database only sees the admitted rate."

[[probes]]
question = "A user's payment succeeds at the provider at 10:10:05, but their hold expired at 10:10:00 and someone else now holds the seat. What do you do?"
answer = "Prevent it first: check the hold and extend it briefly when payment starts, so a hold being paid cannot expire mid-payment. If it still happens, the booking transaction sees the seat is no longer the user's; refund the charge at once (with an idempotency key) and tell the user, rather than selling the seat twice."

