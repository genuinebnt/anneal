title = "Quorums, repair and gossip"
group = "distributed"
order = 4
minutes = 20
lede = "How leaderless, Dynamo-style stores stay available and still converge: write to W of N replicas, read from R, make the sets overlap, and repair the differences in the background. Gossip spreads who is alive."
say = "With N = 3, W = 2 and R = 2 every read overlaps the latest acknowledged write; during a partition the store uses a sloppy quorum with hinted handoff, so writes stay available and are repaired later."
related = ["replication", "cassandra", "consistency-cap", "consistent-hashing", "clocks-and-ordering", "dynamodb"]

summary = [
  "Each key lives on **N** replicas; a write waits for **W** acknowledgements and a read for **R** replies. **R + W > N** makes every read overlap the latest acknowledged write.",
