  "So **precompute the top K at every node**, offline, from counted search logs; requests only read.",
  "Make it small with a **radix tree** or an FST (2.4 million trie nodes became 389,000), and serve it **from memory**, replicated or sharded by prefix.",
  "Blend in a **real-time layer** for trending queries, filter unsafe suggestions before publishing, and **debounce and cache** on the client.",
