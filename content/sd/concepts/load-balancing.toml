summary = [
  "**L4** balances connections (fast, any protocol); **L7** balances requests (TLS, paths, headers, retries).",
  "**Least outstanding requests**, or its cheap form **two random choices**, beats round robin whenever request costs vary.",
  "A balancer acting on **stale load** information herds traffic onto one server; two random choices resists it.",
  "**Health checks** (active probes and passive ejection) keep failed servers out; **draining** and **slow start** make deploys invisible.",
