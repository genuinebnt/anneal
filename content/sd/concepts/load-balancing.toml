[[sections]]
heading = "What a load balancer does"
body = """
A load balancer receives client requests, sends each to one of a set of servers, and returns the response. It is effective at:

- keeping requests away from unhealthy servers;
- keeping any one server from being overloaded;
- removing the single server as a single point of failure, which is what lets you scale out with many cheap machines instead of up with one large one.

It also often does work the servers would otherwise repeat:

- **TLS termination**: decrypt requests and encrypt responses once, at the edge, so certificates live in one place and servers skip the cryptography;
- **session persistence**: route a client's requests to the same server when the application keeps sessions in memory (better: keep servers stateless and sessions in Redis or a database);
- as a **reverse proxy**: hide the servers' addresses, limit connections per client, compress responses, cache them, and serve static files.

A reverse proxy is useful even in front of one server; a load balancer is useful once there are several servers doing the same job. NGINX, HAProxy and Envoy are both.

The costs: the balancer can become the bottleneck if it is underpowered or misconfigured; it adds a component to run; and a single balancer is itself a single point of failure, so production runs several, which adds more complexity (see "Keeping the balancer up").
"""

[[sections]]
heading = "L4 and L7"
body = """
| | L4 (transport) | L7 (application) |
|---|---|---|
| sees | IP addresses and ports | HTTP: method, path, headers, cookies |
| routes by | connection | each request |
| can do | very fast forwarding, any TCP or UDP protocol | TLS termination, path and header routing, retries, compression, header rewriting, per-request metrics |
| connections | one end to end (forwarded or NATed), or terminated and copied byte for byte | two: client to balancer, balancer to server |
| examples | AWS NLB, Linux IPVS, Maglev | AWS ALB, Envoy, NGINX, HAProxy (in HTTP mode) |

An **L4** balancer looks only at the packet headers and forwards each connection's packets to one server, often rewriting addresses (NAT). Some L4 designs use **direct server return**: the request goes through the balancer, but the server replies straight to the client, so the balancer carries only the small inbound half of the traffic. L4 costs less CPU and adds less latency, and works for protocols it does not understand (databases, MQTT, custom TCP).

An **L7** balancer terminates the client's connection, reads each request, chooses a server, and sends the request over its own connection to that server. It can route `/api/*` to one service and `/video/*` to another, send billing traffic to hardened servers, retry an idempotent request on another server, and balance each HTTP/2 or gRPC call separately even when they share one client connection.

**Long-lived connections** (WebSockets, gRPC streams, database connections) are placed once, when they open, and then stay for hours. A server added later gets few of them until clients reconnect, and an L4 balancer cannot spread the calls inside one HTTP/2 connection at all.
"""

[[sections]]
heading = "Choosing a server"
body = """
| Algorithm | How it picks | Good when | In practice |
|---|---|---|---|
| round robin (weighted) | each server in turn | requests cost about the same | the default in NGINX, Envoy and HAProxy |
| random | any server | huge fleets, many balancers | HAProxy `balance random` |
| least connections / least outstanding requests | the server with the fewest in flight | request costs vary | HAProxy `leastconn`, NGINX `least_conn` |
| **two random choices** (P2C) | sample two servers, take the less loaded | the same, without scanning every server | Envoy's least request (2 choices by default), NGINX `random two`, HAProxy `random(2)` |
| hash of a key | the same key, the same server | caches, sticky routing | Envoy ring hash and Maglev, NGINX `hash … consistent`, HAProxy `hash` |
| first available | fill server 1, then 2… | saving power on idle servers | HAProxy `first` |

Round robin is fair in **count**, not in **work**: if one request in ten takes ten times longer, servers that drew several slow ones build queues while others idle. Policies that look at load avoid this. Envoy's documentation, citing Mitzenmacher, notes that sampling two hosts and taking the one with fewer active requests is nearly as good as scanning all of them.

To see how much it matters, a simulation: 10 servers each serving one request at a time, requests arriving at random at 90% of the fleet's capacity, two million requests per policy. Times are a request's wait plus service, in units of the average service time.

| Policy | Mean | p99 | p99.9 | Mean, heavy tail | p99, heavy tail |
|---|---|---|---|---|---|
| random | 9.94 | 45.0 | 63.6 | 29.71 | 157.0 |
| round robin | 5.78 | 26.7 | 40.2 | 24.06 | 127.5 |
| two random choices | 3.00 | 10.5 | 14.4 | 6.11 | 34.6 |
| least outstanding (all 10 checked) | 1.91 | 7.9 | 11.4 | 3.39 | 25.4 |
| two random choices, load seen 5 units late | 4.42 | 14.7 | 19.8 | 7.81 | 39.5 |
| least outstanding, load seen 5 units late | **13.91** | **50.6** | 62.0 | 15.42 | 66.7 |

"Heavy tail": the same average cost, but 10% of requests take ten times as long as the rest. Three lessons:

1. **Looking at load pays.** Two random choices cut round robin's p99 by 2.5× with exponential service times and by 3.7× with the heavy tail.
2. **Two choices get most of the way** to checking every server, with no global state and O(1) work per request.
3. **Stale information herds.** When the balancer's view of load is refreshed only every 5 service times (as when several balancers each see load late), "always the least loaded" sends every request in that window to the same server, and does **worse than picking at random**. Two random choices hardly notice: the two samples differ each time, so traffic still spreads.

:::deeper The simulation | 3 min
```rust title=lbsim.rs
//! Load balancing policies, simulated: 10 servers, each serving one request at a time in arrival order, with requests
//! arriving at random (Poisson) at 90% of the fleet's capacity. Prints the time a request spends queued plus served, in
//! units of the mean service time.
use std::collections::VecDeque;

struct Rng(u64);
impl Rng {
    fn next(&mut self) -> u64 {
        self.0 ^= self.0 >> 12;
        self.0 ^= self.0 << 25;
        self.0 ^= self.0 >> 27;
        self.0.wrapping_mul(0x2545F4914F6CDD1D)
    }
    fn unit(&mut self) -> f64 {
        ((self.next() >> 11) as f64 + 0.5) / (1u64 << 53) as f64
    }
    fn exp(&mut self, mean: f64) -> f64 {
        -mean * self.unit().ln()
    }
    fn below(&mut self, n: usize) -> usize {
        (self.next() % n as u64) as usize
    }
}

#[derive(Clone, Copy, PartialEq)]
enum Policy {
    Random,
    RoundRobin,
    LeastOutstanding,
    TwoChoices,
}

struct Server {
    busy_until: f64,
    done_at: VecDeque<f64>, // completion times of its requests, in order
}

impl Server {
    fn outstanding(&mut self, now: f64) -> usize {
        while self.done_at.front().is_some_and(|&t| t <= now) {
            self.done_at.pop_front();
        }
        self.done_at.len()
    }
}

/// `stale`: the balancer sees load counts refreshed only every `stale` time units (0 = always fresh).
fn run(policy: Policy, stale: f64, heavy_tail: bool, n: usize, seed: u64) -> (f64, f64, f64) {
    let k = 10;
    let mut rng = Rng(seed);
    let mut servers: Vec<Server> = (0..k).map(|_| Server { busy_until: 0.0, done_at: VecDeque::new() }).collect();
    let mut view = vec![0usize; k];
    let mut next_refresh = 0.0;
    let mut now = 0.0;
    let mut rr = 0;
    let mut times = Vec::with_capacity(n);
    for _ in 0..n {
        now += rng.exp(1.0 / (0.9 * k as f64));
        for (i, s) in servers.iter_mut().enumerate() {
            let o = s.outstanding(now);
            if stale == 0.0 || now >= next_refresh {
                view[i] = o;
            }
        }
        if stale > 0.0 && now >= next_refresh {
            next_refresh = now + stale;
        }
        let pick = match policy {
            Policy::Random => rng.below(k),
            Policy::RoundRobin => {
                rr = (rr + 1) % k;
                rr
            }
            Policy::LeastOutstanding => {
                // ties go to a random one of the least loaded
                let min = *view.iter().min().unwrap();
                let ties: Vec<usize> = (0..k).filter(|&i| view[i] == min).collect();
                ties[rng.below(ties.len())]
            }
            Policy::TwoChoices => {
                let a = rng.below(k);
                let mut b = rng.below(k - 1);
                if b >= a {
                    b += 1;
                }
                if view[b] < view[a] { b } else { a }
            }
        };
        // service time: exponential with mean 1, or a heavy tail with the same mean (90% short, 10% ten times longer)
        let service = if heavy_tail {
            if rng.unit() < 0.9 { rng.exp(1.0 / 1.9) } else { rng.exp(10.0 / 1.9) }
        } else {
            rng.exp(1.0)
        };
        let s = &mut servers[pick];
        let start = s.busy_until.max(now);
        s.busy_until = start + service;
        s.done_at.push_back(s.busy_until);
        times.push(s.busy_until - now);
    }
    times.sort_by(|a, b| a.partial_cmp(b).unwrap());
    let mean = times.iter().sum::<f64>() / n as f64;
    let p = |q: f64| times[((n as f64) * q) as usize];
    (mean, p(0.99), p(0.999))
}

fn main() {
    let n = 2_000_000;
    for heavy in [false, true] {
        println!("{}", if heavy { "\\nheavy-tailed service times (10% of requests take 10x longer)" } else { "exponential service times" });
        println!("{:<34} {:>8} {:>8} {:>8}", "policy", "mean", "p99", "p99.9");
        for (name, policy, stale) in [
            ("random", Policy::Random, 0.0),
            ("round robin", Policy::RoundRobin, 0.0),
            ("two random choices", Policy::TwoChoices, 0.0),
            ("least outstanding (all 10)", Policy::LeastOutstanding, 0.0),
            ("two choices, load seen 5 late", Policy::TwoChoices, 5.0),
            ("least outstanding, load seen 5 late", Policy::LeastOutstanding, 5.0),
        ] {
            let (mean, p99, p999) = run(policy, stale, heavy, n, 0x5EED);
            println!("{name:<34} {mean:>8.2} {p99:>8.1} {p999:>8.1}");
        }
    }
}
```
Run with `cargo run --release` (no dependencies). Random placement at 90% load gives each server an M/M/1 queue, whose mean time in system is 1 / (1 − 0.9) = 10; the simulation's 9.94 agrees.
