title = "Load balancers and API gateways"
group = "core"
order = 9
minutes = 22
lede = "The front door of every design: load balancers spread traffic over healthy servers, at the connection (L4) or request (L7) level, and API gateways add authentication, rate limits and routing in one place. Each is replicated so that it is not itself the single point of failure. The choice of algorithm matters more than it looks: on the same servers, the wrong one triples the wait."
say = "Clients hit a global anycast address, a regional L7 load balancer terminates TLS and routes by path to the services, picking the least-loaded healthy instance; WebSocket servers are behind an L4 balancer."
related = ["api-styles", "consistent-hashing", "resilience", "realtime-updates", "caching"]
