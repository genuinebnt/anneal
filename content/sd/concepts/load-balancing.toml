[[sections]]
heading = "Sticky routing and hashing"
body = """
Sometimes the same key should reach the same server: a cache shard that holds that user's data, a WebSocket server that holds a chat room, a server with a warm local cache.

- **Hash a key** (user id, cache key, room id) with **consistent hashing**, so adding or removing a server moves only its share of keys. Envoy offers ring hash and Maglev; NGINX's `hash $key consistent` uses the ketama ring.
- **Cookie stickiness**: the balancer sets a cookie naming the server. Exact, but a server's departure loses its users' in-memory sessions.
- **Source IP hashing** (`ip_hash`, HAProxy `source`): crude. Many users share one IP behind a carrier or office NAT, a phone changes IP when it changes network, and HAProxy's documentation notes that when the number of running servers changes, many clients move to another server.

Stickiness fights balancing: a hot key or a heavy user overloads its server. Prefer stateless servers with state in a shared store, and use hashing where locality is the whole point (caches, sharded in-memory state). Consistent hashing with bounded loads caps how far any server may exceed the average.
"""

[[sections]]
heading = "Health checks"
body = """
A balancer must stop sending traffic to a server that has died or is failing, and start again when it recovers.

- **Active checks**: probe each server on a schedule. HAProxy's defaults: a check every 2 seconds (`inter 2000`), marked down after 3 failures in a row (`fall 3`) and up after 2 successes (`rise 2`). Detection takes seconds, by design: one slow probe should not remove a server.
- **Passive checks (outlier detection)**: watch real traffic. Envoy ejects a host after 5 consecutive server errors by default, for a base ejection time of 30 seconds that grows each time it is ejected again, and never ejects more than 10% of a cluster by default. Open-source NGINX has only passive checks: a server is skipped for `fail_timeout` after `max_fails` failures (1 by default).
- **What the health endpoint checks**: a **shallow** check (the process answers) removes crashed or hung servers. A **deep** check (the process can reach the database) sounds better but is dangerous: if the shared database blips, every server fails its check at once and the balancer removes the whole fleet. Check what is local to the server; let dependencies fail requests, not health.
- **Panic mode**: Envoy stops trusting health checks when fewer than 50% of hosts are healthy (by default) and balances across all hosts, because a health checker that marks most of the fleet down is more likely broken than the fleet. Sending some requests to bad hosts beats overloading the few that are left.

> [!WARNING]
> Health checks catch dead servers, not slow ones. A server answering in 5 seconds instead of 50 ms passes its probe; least-outstanding balancing and outlier detection on latency are what route around it.
"""

[[sections]]
heading = "Deploys: draining and slow start"
body = """
A rolling deploy replaces servers one by one; users should never notice.

1. **Drain**: mark the server as leaving. The balancer sends it no new requests while in-flight ones finish (with a deadline, say 30 seconds); long-lived connections are asked to reconnect elsewhere.
2. Stop, update and start the server.
3. **Readiness**: it joins only when its health check passes, which should mean caches are loaded and connections open, not just "the process started".
4. **Slow start**: ramp its share up gradually instead of handing a cold server its full share at once. HAProxy's `slowstart` grows a server's weight linearly from 0 to 100% over the given time; Envoy's slow start mode scales a new endpoint's weight over a configured window, and its documentation notes that this helps when a few endpoints are new, not when the whole fleet is (they all ramp together).

Least-connections balancing needs slow start most: a fresh server has zero connections, so without it every new request goes to the server with the coldest caches.
"""

[[sections]]
heading = "Keeping the balancer up"
body = """
The balancer must not become the new single point of failure:

- **Active-passive pair with a floating IP**: two balancers share a virtual IP via VRRP (keepalived); if the active one stops answering, the standby takes over the IP within seconds.
- **Active-active behind DNS**: several balancers, all returned for the name. Clients spread across them, but DNS answers are cached for their TTL, so a dead balancer keeps receiving some clients until caches expire.
- **Anycast and ECMP**: many balancers announce the same IP address; routers send each flow to one of them (equal-cost multi-path), and a balancer that fails stops announcing and drops out. Google's **Maglev** (NSDI 2016) works this way on ordinary Linux servers: routers spread packets over Maglev machines with ECMP; each machine picks the backend with the same consistent-hash table, so a connection's packets reach the same backend whichever Maglev machine receives them; and backends reply directly to clients.
- **Cloud balancers** (AWS ALB and NLB, Google Cloud Load Balancing) are already replicated across zones by the provider; say so, and draw them as one box.
"""

[[sections]]
heading = "Global load balancing"
body = """
With several regions, a first decision sends each user to a region:

- **GeoDNS / latency-based DNS**: the DNS answer depends on where the resolver is (or on measured latency). Failover is as fast as the TTL lets clients notice, so keep TTLs short (tens of seconds) for names you may need to move.
- **Anycast**: one IP announced from every region; the internet's routing delivers each user to a nearby one, and a region that withdraws its announcement stops receiving traffic without any DNS change. CDNs and global cloud balancers use it.
- **Health-based failover**: the global layer checks each region and stops routing to one that fails, which only works if the other regions have spare capacity for the extra load.

Inside the region, the regional L7 balancer takes over.
"""

[[sections]]
heading = "API gateway"
body = """
An L7 entry point for many services that centralises cross-cutting work: **authentication** (validate the JWT once), **rate limiting**, request routing and versioning, request and response transformation, caching, and metrics. A **backend for frontend** is a gateway per client type (mobile, web) that shapes responses for it.

Keep business logic out of the gateway; it should stay thin and fast. A gateway is also a load balancer for the services behind it, so everything above (algorithms, health, draining) applies to it as well.

> [!INTERVIEW]
> Draw the load balancer as replicated, say what algorithm it uses and why, and keep the servers behind it stateless.
"""

[[sections]]
heading = "In the interview"
body = """
1. **Where**: a global layer (DNS or anycast) to a region, a regional L7 balancer or gateway, and balancers in front of internal services where they need it.
2. **L4 or L7**, with the reason: L7 for HTTP and gRPC (per-request routing, TLS, retries), L4 for raw TCP or very long-lived connections.
3. **The algorithm**: least outstanding requests or two random choices when request costs vary; consistent hashing when locality matters.
4. **Health**: active checks plus outlier ejection; shallow health endpoints.
5. **Deploys**: draining and slow start.
6. **Its own availability**: several instances behind a floating IP, anycast or a managed balancer.
"""

[[checks]]
prompt = "Why can a newly added WebSocket server sit almost idle while the old ones stay overloaded?"
answer = "Load balancers place a WebSocket when the connection opens and it then lives for hours; existing clients stay on the old servers. Only new or reconnecting clients reach the new server. Fixes: least-connections balancing for new connections and gradually asking clients on busy servers to reconnect."

[[checks]]
prompt = "What does 'power of two choices' do and why is it better than picking a random server?"
answer = "For each request it picks two servers at random and sends to the one with fewer outstanding requests. Random choice leaves some servers with much longer queues by chance; comparing just two cuts the worst-case load dramatically, nearly matching checking every server, without global coordination."

[[checks]]
prompt = "Six load balancers each send every request to the server they believe has the fewest active requests, but each learns the servers' load only once a second. Latency gets worse than with random routing. Why?"
answer = "Herding: between updates every balancer believes the same server is least loaded and sends it all of its traffic, so that server is flooded while the others idle, and the next update just moves the flood elsewhere. With stale information, two random choices (sample two servers, take the less loaded) avoids it, because each request compares a different random pair and traffic still spreads."

[[checks]]
prompt = "Your health endpoint returns 500 when the database is unreachable. The database has a 20-second failover. What happens to the site, and what should the health check test instead?"
answer = "Every server fails its health check at the same moment, so the balancer removes the whole fleet and the site is down even for requests that did not need the database, and possibly for longer than the failover while servers rise back in. The health check should test what is local to the server (the process is up and can serve); dependency failures should fail or degrade individual requests, protected by timeouts and circuit breakers."

[[checks]]
prompt = "With round robin, why does the 99th percentile latency rise sharply when a small share of requests are much slower than the rest, even though average load is unchanged?"
answer = "Round robin balances the count of requests, not the work: a server that happens to receive several slow requests builds a queue, and fast requests stuck behind them wait, while other servers sit idle. Balancing by outstanding requests (least requests or two random choices) sends new requests away from the server that is busy with slow ones."

[[checks]]
prompt = "A server rejoins a least-connections pool after a deploy and immediately times out. What happened, and what setting prevents it?"
answer = "With zero connections it looks like the least loaded server, so the balancer sends it a burst of new requests while its caches, connection pools and JIT are cold, and it falls over. Slow start ramps a returning server's share up gradually (HAProxy slowstart, Envoy slow start mode), and a readiness check should only pass once it is warmed up."

