term = "Pipelining"
means = "Sending many commands before reading replies, which removes most round-trip waits."
section = "Inside"

[[terms]]
term = "Listpack"
means = "The compact encoding Redis uses for small hashes, lists, sets and sorted sets."
section = "Inside"

[[terms]]
term = "RDB / AOF"
means = "A point-in-time snapshot file, and an append-only log of write commands."
section = "Persistence and durability"

[[terms]]
term = "Hash slot"
means = "One of 16,384 buckets a key maps to with CRC16; each cluster primary owns a range."
section = "Scaling it"

[[terms]]
term = "Hash tag"
means = "The part of a key in braces, hashed alone so related keys share a slot."
section = "Scaling it"

[[terms]]
term = "HyperLogLog"
means = "A fixed-size probabilistic counter of distinct items."
section = "The structures, and what they solve"

[[terms]]
term = "Fencing token"
means = "A number that grows with each lock grant, checked by the resource to reject stale holders."
section = "Redis as a lock, and why that is subtle"

