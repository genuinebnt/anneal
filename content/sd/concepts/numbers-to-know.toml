title = "Numbers to know"
group = "fundamentals"
order = 2
minutes = 16
lede = "A handful of orders of magnitude, enough to say whether something fits on one machine, how long a request costs, and whether a cache is worth it. The classic table dates from 2009 hardware, so this page puts it next to numbers measured on a current machine: most ratios held, a few moved, and the slow things are still slow for the same physical reasons."
say = "That's about 1,200 writes a second at peak, which one Postgres primary handles; the read side is 100 times that, so it needs a cache."
related = ["estimation", "caching", "storage-engines", "load-balancing"]
credit = "The classic latency table and the powers of two table are adapted from [The System Design Primer](https://github.com/donnemartin/system-design-primer#latency-numbers-every-programmer-should-know) by Donne Martin, licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), which collects Jeff Dean's and Peter Norvig's numbers. The measurements are anneal's own."

summary = [
  "Each step down the hierarchy is roughly **100× slower**: cache, memory, SSD, network across the world.",
  "A round trip **inside a data centre** costs about as much as an SSD read (hundreds of µs); across a continent, tens of ms that no hardware removes.",
  "A **durable commit** waits for the disk: from a fraction of a millisecond to several, which caps one connection's commit rate.",
  "One machine does a lot: a single Redis served **83,000 requests a second** (700,000 pipelined) on a 4-core VM.",
  "A day is about **100,000 seconds**; 1 million a day is about 12 a second.",
]

[[sections]]
heading = "Why orders of magnitude"
body = """
Design decisions turn on ratios, not exact figures: is this 10 times or 1,000 times slower than that? Whether a read takes 80 or 120 nanoseconds never changes a design; whether it costs 100 nanoseconds or 100 microseconds always does.

Three ladders cover most decisions:

- **Where data lives**: CPU cache, memory, local SSD, another machine's memory, another region.
- **What a request waits for**: computation, a lock, a network round trip, a disk flush.
- **How much one machine does**: requests a second, bytes a second, bytes stored.

Learn the rungs as powers of ten and the ratios between them; derive the rest.
"""

[[sections]]
heading = "The classic table"
body = """
Jeff Dean's latency numbers (popularised by Peter Norvig and in Dean's 2009 LADIS keynote) as the System Design Primer lists them:

| Operation | Latency | Note |
|---|---|---|
| L1 cache reference | 0.5 ns | |
| branch mispredict | 5 ns | |
| L2 cache reference | 7 ns | 14× L1 |
| mutex lock and unlock | 25 ns | |
| main memory reference | 100 ns | 20× L2, 200× L1 |
| compress 1 KB with Zippy (Snappy) | 10 µs | |
| send 1 KB over a 1 Gbps network | 10 µs | |
| read 4 KB at random from SSD | 150 µs | about 1 GB/s SSD |
| read 1 MB sequentially from memory | 250 µs | |
| round trip within the same data centre | 500 µs | |
| read 1 MB sequentially from SSD | 1 ms | 4× memory |
| disk seek | 10 ms | 20× a data centre round trip |
| read 1 MB sequentially from a 1 Gbps network | 10 ms | |
| read 1 MB sequentially from disk | 30 ms | |
| send a packet California → Netherlands → California | 150 ms | |

Handy rates from it: a disk reads sequentially at about 30 MB/s, a 1 Gbps link carries about 100 MB/s, an SSD about 1 GB/s, memory about 4 GB/s; about 2,000 round trips a second fit inside a data centre, and 6 or 7 around the world.

These are **2009-era** figures. Colin Scott's interactive version extrapolates each one from hardware trends year by year (it is a model, not a measurement). What changed most since: SSDs and networks got much faster, spinning disks did not, and memory latency barely moved.
"""

[[sections]]
heading = "Measured on a current machine"
body = """
The same operations, measured by a Rust program (below) on a **4-vCPU Intel Xeon cloud VM at 2.1 GHz with 15 GB of memory, Linux 6.18, Rust 1.97, a virtual disk**, shared with other workloads. Each figure is the median of five timed runs; the range spans four separate runs of the program.

| Operation | Measured | Classic | |
|---|---|---|---|
| dependent random load, 16 KB array (in L1) | 1.6 to 2.6 ns | 0.5 ns | includes the loop |
| dependent random load, 1 MB array (in L2) | 7 to 16 ns | 7 ns | |
| dependent random load, 1 GB array | 305 to 500 ns | 100 ns | with 2 MB pages: 268 to 322 ns |
| mutex lock and unlock, uncontended | 15 to 19 ns | 25 ns | |
| compress 1 KB of English with Snappy | 1.0 to 1.5 µs | 10 µs | |
| read 1 MB sequentially from memory | 88 to 138 µs | 250 µs | 7 to 11 GB/s |
| message to another thread and back (channels) | 3.3 to 4.6 µs | | the OS wakes a sleeping thread twice |
| TCP round trip over loopback | 5.6 to 8.7 µs | | no network, just the kernel |
| spawn and await a Tokio task | 4.5 to 16 µs | | |
| spawn and join an OS thread | 17 to 523 µs | | very noisy on a VM |
| random 4 KB read from the disk, bypassing the page cache | 54 to 69 µs | 150 µs | |
| read 1 MB sequentially from the disk | 0.54 to 0.66 ms | 1 ms | 1.5 to 1.9 GB/s |
| append 8 KB and `fdatasync` | 2.4 to 4.6 ms | | a durable write |
| `sleep(1 ms)` | 1.11 to 1.24 ms | | timers overshoot |

What to take from it:

- **Memory latency did not improve**: a random access into a large array still costs hundreds of nanoseconds here, more than the classic 100 ns, because this is a virtual machine (two levels of page tables to walk on a miss) and 4 KB pages mean a TLB miss on nearly every access; 2 MB pages cut it to about 270 to 320 ns. Bandwidth, by contrast, rose: sequential reads are 2 to 3 times faster than the table.
- **Uncontended locks are cheap** (about 15 ns): what costs is contention and waiting, not taking the lock.
- **Waking another thread costs microseconds**: a message to another thread and back took 3 to 5 µs, about as much as a loopback TCP round trip. Fine-grained hand-offs between threads are not free.
- **Durability is the slow part**: reading the disk took 54 to 69 µs, but making an 8 KB write durable took milliseconds on this virtual disk (Postgres's own `pg_test_fsync` measured between 0.36 and 4.1 ms per synced 8 KB write depending on the method). A local NVMe drive with power-loss protection syncs far faster; a network-attached cloud disk is closer to this. Either way, **one connection committing one transaction at a time is capped by sync latency**, which is why databases batch commits (group commit).

:::deeper The measurement program | 3 min
Dependencies: `libc`, `snap` and `tokio` (with `full`). Run with `cargo run --release -- <scratch file> <a text file> [file size in MB]`; the disk tests use a 4 GB file by default (the runs above used 4 GB, and 256 MB for the last run).

```rust title=lat.rs
//! Latency numbers measured on this machine. Each test prints the median of several runs, per operation.
use std::fs::OpenOptions;
use std::hint::black_box;
use std::io::{Read, Write};
use std::net::{TcpListener, TcpStream};
use std::os::unix::fs::{FileExt, OpenOptionsExt};
use std::sync::{mpsc, Mutex};
use std::time::{Duration, Instant};

struct Rng(u64);
impl Rng {
    fn next(&mut self) -> u64 {
        // xorshift64*
        self.0 ^= self.0 >> 12;
        self.0 ^= self.0 << 25;
        self.0 ^= self.0 >> 27;
        self.0.wrapping_mul(0x2545F4914F6CDD1D)
    }
    fn below(&mut self, n: u64) -> u64 {
        self.next() % n
    }
}

fn median(mut v: Vec<f64>) -> f64 {
    v.sort_by(|a, b| a.partial_cmp(b).unwrap());
    v[v.len() / 2]
}

/// Runs `f` (which does `n` operations) `runs` times and returns the median ns per operation.
fn per_op(runs: usize, n: u64, mut f: impl FnMut()) -> f64 {
    f(); // warm up
    median((0..runs).map(|_| {
        let t = Instant::now();
        f();
        t.elapsed().as_nanos() as f64 / n as f64
    }).collect())
}

fn show(name: &str, ns: f64) {
    let s = if ns < 1_000.0 { format!("{ns:.1} ns") } else if ns < 1_000_000.0 { format!("{:.1} µs", ns / 1e3) } else { format!("{:.2} ms", ns / 1e6) };
    println!("{name:<52} {s:>12}");
}

/// A random cycle through `len` slots (Sattolo's algorithm), so each load depends on the one before.
fn chase(len: usize, hops: u64) -> f64 {
    let mut next: Vec<u32> = (0..len as u32).collect();
    let mut rng = Rng(0x9E3779B97F4A7C15);
    for i in (1..len).rev() {
        let j = rng.below(i as u64) as usize;
        next.swap(i, j);
    }
    per_op(5, hops, || {
        let mut p = 0u32;
        for _ in 0..hops {
            p = next[p as usize];
        }
        black_box(p);
    })
}

fn main() {
    // 1. memory: a dependent random load inside a cache-sized and a memory-sized array
    show("random load, 16 KB array (L1)", chase(16 * 1024 / 4, 20_000_000));
    show("random load, 1 MB array (L2)", chase(1024 * 1024 / 4, 20_000_000));
    show("random load, 1 GB array (main memory)", chase(1024 * 1024 * 1024 / 4, 5_000_000));

    // 2. read 1 MB sequentially from memory (sum it, from a buffer bigger than the caches)
    let big: Vec<u64> = (0..(1u64 << 30) / 8).collect(); // 1 GB
    let mib = (1 << 20) / 8;
    let mut off = 0usize;
    show("read 1 MB sequentially from memory", per_op(200, 1, || {
        let s: u64 = big[off..off + mib].iter().sum();
        black_box(s);
        off = (off + mib * 7) % (big.len() - mib);
    }));
    drop(big);

    // 3. an uncontended mutex lock and unlock
    let m = Mutex::new(0u64);
    show("mutex lock + unlock, uncontended", per_op(9, 10_000_000, || {
        for _ in 0..10_000_000 {
            *m.lock().unwrap() += 1;
        }
    }));

    // 4. compress 1 KB with Snappy (Google's Zippy) of text-like data
    // 1 KB of English prose (from the System Design Primer README), so the data compresses like real text
    let prose = std::fs::read(std::env::args().nth(2).expect("a text file")).unwrap();
    let text: Vec<u8> = prose[50_000..50_000 + 1024].to_vec();
    let mut enc = snap::raw::Encoder::new();
    let mut out = vec![0u8; snap::raw::max_compress_len(1024)];
    show("compress 1 KB with Snappy", per_op(9, 100_000, || {
        for _ in 0..100_000 {
            black_box(enc.compress(black_box(&text), &mut out).unwrap());
        }
    }));

    // 5. thread to thread: send a message and get a reply over std channels
    let (to, rx) = mpsc::channel::<u64>();
    let (back, from) = mpsc::channel::<u64>();
    let echo = std::thread::spawn(move || {
        for v in rx {
            back.send(v).unwrap();
        }
    });
    show("channel round trip between two threads", per_op(5, 100_000, || {
        for i in 0..100_000 {
            to.send(i).unwrap();
            black_box(from.recv().unwrap());
        }
    }));
    drop(to);
    echo.join().unwrap();

    // 6. start and join an OS thread
    show("spawn + join an OS thread", per_op(5, 2_000, || {
        for _ in 0..2_000 {
            std::thread::spawn(|| black_box(1)).join().unwrap();
        }
    }));

    // 7. spawn + await a Tokio task on a multi-thread runtime
    let rt = tokio::runtime::Runtime::new().unwrap();
    show("spawn + await a Tokio task", per_op(5, 100_000, || {
        rt.block_on(async {
            for _ in 0..100_000 {
                tokio::spawn(async { black_box(1) }).await.unwrap();
            }
        })
    }));
    drop(rt);

    // 8. a TCP round trip over loopback (1 byte each way, Nagle off)
    let l = TcpListener::bind("127.0.0.1:0").unwrap();
    let addr = l.local_addr().unwrap();
    std::thread::spawn(move || {
        let (mut s, _) = l.accept().unwrap();
        s.set_nodelay(true).unwrap();
        let mut b = [0u8; 1];
        while s.read_exact(&mut b).is_ok() {
            s.write_all(&b).unwrap();
        }
    });
    let mut c = TcpStream::connect(addr).unwrap();
    c.set_nodelay(true).unwrap();
    show("TCP round trip over loopback", per_op(5, 20_000, || {
        let mut b = [7u8; 1];
        for _ in 0..20_000 {
            c.write_all(&b).unwrap();
            c.read_exact(&mut b).unwrap();
        }
    }));
    drop(c);

    // 9. the disk: 4 KB random reads and 1 MB sequential reads, bypassing the page cache (O_DIRECT)
    let path = std::env::args().nth(1).unwrap_or_else(|| "lat-test.bin".into());
    let mb: u64 = std::env::args().nth(3).map_or(4096, |a| a.parse().unwrap()); // 4 GB unless told otherwise
    let size: u64 = mb << 20;
    {
        let mut f = OpenOptions::new().create(true).write(true).truncate(true).open(&path).unwrap();
        let chunk = vec![0xA5u8; 8 << 20];
        for _ in 0..size / chunk.len() as u64 {
            f.write_all(&chunk).unwrap();
        }
        f.sync_all().unwrap();
    }
    let f = OpenOptions::new().read(true).custom_flags(libc::O_DIRECT).open(&path).unwrap();
    let mut buf = AlignedBuf::new(1 << 20);
    let mut rng = Rng(42);
    let blocks = size / 4096;
    show("disk: random 4 KB read (O_DIRECT)", per_op(5, 2_000, || {
        for _ in 0..2_000 {
            let at = rng.below(blocks) * 4096;
            f.read_exact_at(&mut buf.as_mut()[..4096], at).unwrap();
        }
    }));
    let mut at = 0u64;
    show("disk: read 1 MB sequentially (O_DIRECT)", per_op(5, 200, || {
        for _ in 0..200 {
            f.read_exact_at(buf.as_mut(), at).unwrap();
            at = (at + (1 << 20)) % size;
        }
    }));

    // 10. a durable write: 8 KB appended, then fdatasync
    let mut w = OpenOptions::new().create(true).append(true).open(format!("{path}.wal")).unwrap();
    let page = [1u8; 8192];
    show("disk: append 8 KB + fdatasync", per_op(5, 200, || {
        for _ in 0..200 {
            w.write_all(&page).unwrap();
            w.sync_data().unwrap();
        }
    }));
    std::fs::remove_file(&path).ok();
    std::fs::remove_file(format!("{path}.wal")).ok();

    // 11. sleep(1 ms): what a "1 ms" timer really costs
    show("std::thread::sleep(1 ms), actual", per_op(5, 200, || {
        for _ in 0..200 {
            std::thread::sleep(Duration::from_millis(1));
        }
    }));
}

struct AlignedBuf {
    ptr: *mut u8,
    len: usize,
}
impl AlignedBuf {
    fn new(len: usize) -> Self {
        let layout = std::alloc::Layout::from_size_align(len, 4096).unwrap();
        Self { ptr: unsafe { std::alloc::alloc_zeroed(layout) }, len }
    }
    fn as_mut(&mut self) -> &mut [u8] {
        unsafe { std::slice::from_raw_parts_mut(self.ptr, self.len) }
    }
}
```
