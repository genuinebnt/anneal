[[sections]]
heading = "The network and the speed of light"
body = """
Inside one machine, a loopback round trip took 6 to 9 µs. Between two machines in one data centre, the classic figure is 500 µs; modern data-centre networks do better at the switch level, but a request through a load balancer, TLS and a busy server is commonly a few hundred microseconds to a millisecond. Plan on **about 0.5 to 1 ms per hop inside a region**.

Between regions, physics sets a floor. Light in optical fibre travels at about two thirds of its speed in vacuum, roughly **200,000 km/s**, or 200 km per millisecond:

| Route (great-circle distance) | Minimum round trip in fibre |
|---|---|
| same metro area (50 km) | 0.5 ms |
| San Francisco – New York (4,130 km) | 41 ms |
| New York – London (5,570 km) | 56 ms |
| London – Sydney (16,990 km) | 170 ms |

Real paths are longer than great circles and add routers, so measured round trips are higher. No hardware upgrade removes these; only **moving data closer** (CDNs, regional replicas, edge caches) or **making fewer round trips** (batching, pipelining, fewer sequential calls) does.

> [!WARNING]
> Sequential calls add up. A page that makes 20 calls one after another to a service 1 ms away has spent 20 ms before doing any work; 20 calls to another continent, over a second. Fan out in parallel, batch, or move the data.
"""

[[sections]]
heading = "What one machine does"
body = """
Measured on the same 4-vCPU VM, client and server on the same machine (so they compete for the CPU):

| Workload | Measured |
|---|---|
| Redis 7.0 `GET`, 50 clients, one command at a time | 82,500 a second, median 0.34 ms |
| Redis 7.0 `SET`, 50 clients | 82,900 a second |
| Redis 7.0 `GET`, 50 clients, pipelining 16 commands | 702,000 a second |
| Redis 7.0 `GET`, one client | 58,800 a second, median 15 µs |
| Postgres 18 primary-key `SELECT` (pgbench `-S`), 8 clients, through Docker port forwarding, 16 MB of shared buffers | 10,000 a second, 0.8 ms average |
| Postgres 18 primary-key `SELECT`, one client | 4,000 a second, 0.25 ms |
| Postgres 18 pgbench's default read-write transaction, 8 clients | 800 a second: bound by commit flushes on this disk |
| Snowflake-style id generator, one thread | 4.0 million ids a second (its 4,096-per-millisecond ceiling) |

Pipelining multiplied Redis's throughput by 8.5 without changing the server: most of a simple command's cost is the round trip and the system calls around it, not the work. Production servers have many more cores than this VM and fast local disks, so treat these as floors.

The habits these numbers support:

- **One machine is a lot**: a single Redis or Postgres server handles tens of thousands of simple operations a second; many products never need more than one primary and a few replicas. Say the number and decide, rather than sharding by reflex.
- **Writes that must be durable** are bounded by flush latency per connection; throughput comes from concurrency and batching.
- **Memory is the limit for caches**: a Redis node holds what fits in RAM, so size it from the working set.
"""

[[sections]]
heading = "Time and size"
body = """
**Time**:

- A day is 86,400 seconds: call it **100,000** (10⁵). A month is about **2.5 million** seconds; a year about **30 million** (3 × 10⁷).
- 1 million requests a day is about **12 a second**; 1 billion a day is about **12,000 a second**. Peak is usually 2 to 3 times the average.

**Powers of two**:

| Power | Exact value | Approximately | Bytes |
|---|---|---|---|
| 10 | 1,024 | a thousand | 1 KB |
| 16 | 65,536 | | 64 KB |
| 20 | 1,048,576 | a million | 1 MB |
| 30 | 1,073,741,824 | a billion | 1 GB |
| 32 | 4,294,967,296 | | 4 GB |
| 40 | 1,099,511,627,776 | a trillion | 1 TB |

**Sizes** to estimate with (round, and say them as assumptions):

| Thing | Size |
|---|---|
| an id | 8 bytes (64 bit) or 16 (UUID) |
| a short text post with metadata | about 1 KB |
| a database row of a dozen columns | a few hundred bytes |
| a compressed photo | a few hundred KB to a few MB |
| a minute of compressed HD video | tens of MB |
"""

[[sections]]
heading = "In the interview"
body = """
1. Say numbers as orders of magnitude and say what they **mean**: "100,000 reads a second: one Redis node, or two to be safe".
2. Count **round trips** on the critical path, and the regions they cross.
3. Ask whether each write must be **durable before the reply**; if so, its latency includes a flush.
4. Check whether the working set fits in **memory**: if it does, a cache or an in-memory store is the cheap answer.

> [!INTERVIEW]
> When you quote a number, name the resource it stresses (CPU, memory, disk, network) and whether one machine covers it. The decision is what gets marked, not the arithmetic.
"""

[[checks]]
prompt = "500 million users, each viewing 20 posts a day. Average and peak reads a second?"
answer = "10 billion reads a day / 100,000 s is about 100,000 a second on average; peak is often 2 to 3 times that, so 200k to 300k a second."

[[checks]]
prompt = "Is a 2 TB dataset with 3,000 writes a second a reason to shard?"
answer = "Not by itself: one large Postgres server holds a few TB and takes thousands of writes a second. Replicas for reads and good indexes come first; shard when writes or size outgrow one primary with headroom."

[[checks]]
prompt = "A service in Frankfurt calls a database in Virginia ten times, one after another, for each request. Roughly what latency does that add, and what would you change?"
answer = "A transatlantic round trip is at least 60 to 90 ms in practice (the speed of light in fibre alone gives tens of milliseconds), so ten sequential calls add close to a second. Make fewer round trips (batch the ten queries into one, or run them in parallel), or move the data or the service so they are in the same region, with a regional replica or cache for reads."

[[checks]]
prompt = "A worker inserts rows one transaction at a time on one connection and tops out near 300 commits a second, while the disk is mostly idle. Why, and how do you go faster?"
answer = "Each commit waits for the write-ahead log to be flushed to the disk; at about 3 ms per flush, one connection can commit only about 300 times a second, however idle the disk's bandwidth is. Batch many rows per transaction, use several connections so the database can flush many commits together (group commit), or, where losing the last moment of writes on a crash is acceptable, relax synchronous commit."

[[checks]]
prompt = "Redis serves 80,000 GET requests a second from 50 clients, but 700,000 a second when the same clients pipeline 16 commands. What does that tell you about where the time goes?"
answer = "Most of a simple command's cost is not the lookup itself but the round trip and the per-request system calls and scheduling. Pipelining sends many commands per round trip and per read and write call, so the same server does eight or nine times the work. Batching and pipelining are the cheapest throughput wins for chatty clients."

[[checks]]
prompt = "Roughly how many times slower is a random read from main memory than from the L1 cache, and a random 4 KB SSD read than a memory read? Why do the ratios matter more than the exact numbers?"
answer = "Memory is about 100 to 200 times slower than L1 (around 100 ns or more against well under a nanosecond to a couple of nanoseconds), and an SSD read is several hundred to a thousand times slower than memory (tens to about a hundred microseconds against about 100 ns). The ratios decide designs (keep the working set in memory, avoid a disk read or a network hop on the hot path) and hold across hardware generations, while the absolute numbers vary by machine."

[[terms]]
