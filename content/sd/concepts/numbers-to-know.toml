means = "A system call that returns once a file's data has reached stable storage."
section = "Measured on a current machine"

[[terms]]
term = "Group commit"
means = "Flushing many transactions' log records with one disk sync."
section = "Measured on a current machine"

[[terms]]
term = "Round trip"
means = "A request's journey to another machine and the reply's journey back."
