term = "Partition key / sort key"
means = "The key that is hashed to choose the partition, and the key that orders items within it."
section = "Keys and items"

[[terms]]
term = "Item collection"
means = "All items sharing one partition key."
section = "Keys and items"

[[terms]]
term = "GSI / LSI"
means = "A global secondary index (any keys, eventually consistent) and a local one (same partition key, another sort key)."
section = "Secondary indexes"

[[terms]]
term = "RCU / WCU"
means = "Read and write capacity units: 4 KB strongly consistent reads and 1 KB writes per second."
section = "Capacity and cost"

[[terms]]
term = "Adaptive capacity"
means = "DynamoDB moving unused throughput to hot partitions and splitting hot item collections."
section = "Limits worth knowing"

[[terms]]
term = "Write sharding"
means = "Adding a random suffix to a hot key so writes spread over several partitions."
section = "Patterns that come up"

