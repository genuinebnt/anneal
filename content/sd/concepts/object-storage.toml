term = "Object"
means = "Bytes plus metadata addressed by key in a bucket; immutable once written."
section = "The model"

[[terms]]
term = "Presigned URL"
means = "A URL, signed by the API, that allows one operation on one key for a short time."
section = "Uploads and downloads that skip your servers"

[[terms]]
term = "Multipart upload"
means = "Uploading a large object as parts in parallel and then completing it."
section = "Uploads and downloads that skip your servers"

[[terms]]
term = "Erasure coding"
means = "Storing data as k data chunks and m parity chunks so any k of the k+m rebuild it."
section = "Inside, roughly"

[[terms]]
term = "Lifecycle rule"
means = "A policy that moves objects to cheaper classes or deletes them by age."
section = "Durability, cost and speed"

[[terms]]
term = "Egress"
means = "Data transferred out of the provider to the internet or another region; billed per GB."
section = "Storage classes and the cost model"

[[terms]]
term = "Object lock"
means = "Write once, read many: an object cannot be deleted or overwritten for a retention period."
