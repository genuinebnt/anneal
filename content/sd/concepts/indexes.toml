[[terms]]
term = "Leftmost prefix"
means = "A composite index helps only queries that constrain its first columns."
section = "Composite keys"

[[terms]]
term = "Covering index"
means = "An index holding every column a query needs, so the table is never read."
section = "Making hot queries cheaper"

[[terms]]
term = "Partial index"
means = "An index over only the rows that match a condition."
section = "Making hot queries cheaper"

[[terms]]
term = "Selectivity"
means = "How small a share of rows a condition matches; indexes need selective conditions."
section = "Reading a query plan"

[[terms]]
