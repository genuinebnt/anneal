title = "Multi-step processes: sagas, outbox, workflows"
group = "pattern"
order = 7
minutes = 13
lede = "When one business action touches several services (charge the card, reserve the stock, book the courier), there is no single transaction to wrap it. Sagas undo completed steps, the outbox makes 'save and publish' atomic, and workflow engines make the whole thing durable."
say = "Checkout is an orchestrated saga: reserve stock, charge, create the shipment, each step idempotent with a compensation; services publish events through an outbox table so a change and its event can never disagree."
related = ["queues-and-streams", "kafka", "resilience", "isolation-anomalies"]

[[sections]]
heading = "Why not one big transaction"
body = """
**Two-phase commit** (2PC) can make several databases commit together: a coordinator asks each to prepare, then tells all to commit. It works inside one system, but across services it holds locks while waiting, blocks everyone if the coordinator dies between phases, and needs every participant to speak the protocol (payment providers do not). Most service designs avoid it.
"""

[[sections]]
heading = "Sagas"
body = """
A **saga** is a sequence of local transactions; each step commits on its own, and if a later step fails, **compensating actions** undo the earlier ones in reverse.

| Step | Action | Compensation |
|---|---|---|
| 1 | reserve stock | release stock |
| 2 | charge the card | refund |
| 3 | create the shipment | cancel the shipment |

- **Orchestration**: a coordinator (an order service or a workflow engine) tells each service what to do and tracks the state. Easy to follow and change; the coordinator is a central piece.
- **Choreography**: each service reacts to the previous one's event (`StockReserved` → payment charges). No centre, but the flow is spread across services and hard to see.

Compensations are not rollbacks: others may have seen the intermediate state (the stock looked reserved), and some actions cannot be undone (an email sent), so you send a correction instead. Order steps so the hard-to-undo ones come last.
"""

[[sections]]
heading = "The outbox"
body = """
A service must update its database **and** publish an event. Doing both directly (dual write) fails half the time it fails at all: the DB commits and the publish is lost, or the event goes out and the DB rolls back.

**Transactional outbox**: in the same transaction as the business change, insert the event into an `outbox` table. A relay then publishes outbox rows to Kafka and marks them sent, either by polling the table or by reading the database's log (CDC, for example Debezium). The change and the event now commit together.

```sql
BEGIN;
UPDATE orders SET status = 'paid' WHERE id = 42;
INSERT INTO outbox (aggregate_id, type, payload) VALUES (42, 'OrderPaid', '{…}');
COMMIT;
```

The relay can publish a row twice (it crashed after publishing, before marking), so delivery is **at least once**: consumers must be idempotent.
"""

[[sections]]
heading = "Idempotent consumers"
body = """
Every message carries a unique id. The consumer records processed ids in an **inbox** (dedup) table in the same transaction as its own change, and skips ids it has already seen. Or make the operation naturally idempotent: `SET status = 'shipped'` instead of `count = count + 1`, upserts keyed by the event id, and idempotency keys passed to payment providers.
"""

[[sections]]
heading = "Workflow engines"
body = """
Long processes (an order that waits days for shipping, a KYC check with a human step) need state that survives crashes and deploys, timers, and retries. A **durable execution** engine such as **Temporal** (or AWS Step Functions) runs workflow code whose every step result is recorded in an event history; after a crash the workflow is replayed from history and continues where it stopped. Activities (the side effects) are retried with policies; timers can sleep for months.

> [!INTERVIEW]
> For anything spanning services, say: saga (orchestrated), compensation per step, outbox for events, idempotent consumers, and a workflow engine when steps wait for hours or people.
"""

[[checks]]
prompt = "An order service updates the order to paid and then publishes OrderPaid to Kafka. The process crashes between the two. What breaks, and how does an outbox fix it?"
answer = "The database says paid but no event was sent, so shipping never starts. With an outbox, the OrderPaid row is inserted in the same transaction as the status change, so both commit or neither does; a relay publishes committed outbox rows afterwards and retries until it succeeds."

[[checks]]
prompt = "In a checkout saga, payment succeeded but creating the shipment failed permanently. What happens, and why is it not a rollback?"
answer = "The orchestrator runs the compensations of completed steps in reverse: refund the payment, release the stock. It is not a rollback because those steps already committed and may have been seen (a charge on the statement); the compensation is a new forward action that semantically undoes them."

[[checks]]
prompt = "Why must consumers of outbox events be idempotent?"
answer = "The relay delivers at least once: it may publish a row and crash before marking it sent, so the event is published again on restart. A consumer that dedups on the event id (or applies an idempotent change) handles the duplicate safely."

