title = "Elasticsearch"
group = "technology"
order = 6
minutes = 24
lede = "A distributed search engine on Lucene: documents are analysed into terms and stored in inverted indexes, spread over shards, and ranked by relevance. It is the usual answer for full-text search, filters with facets, and log search, but not for the system of record."
say = "Postgres stays the source of truth; changes flow through CDC into Elasticsearch, which serves the search box with BM25 relevance plus filters on price and category, and a second of lag is acceptable."
related = ["indexes", "typeahead-tries", "replication", "sharding", "storage-engines", "probabilistic-structures"]

summary = [
  "Elasticsearch is a **distributed search engine** over Lucene: an **inverted index** maps terms to documents, which makes full-text search, filters and aggregations fast on data that would be slow to scan.",
  "Use it as a **derived view** of your database, fed by change data capture or an outbox, with a way to **rebuild** it. It is not a system of record.",
  "Documents are **near real time**: a refresh makes them searchable about a second later. Writes are not transactional across documents.",
  "An index is **primary shards plus replicas**; a query fans out to every shard and merges (scatter-gather). Shard count is fixed at creation, and aim for tens of GB per shard.",
  "Know the traps: `text` vs `keyword`, deep paging, mapping explosions, and cost of fields you never search.",
]

[[sections]]
heading = "The inverted index"
body = """
A B-tree finds rows by a value; an **inverted index** finds documents by the words in them. For each term it keeps a **postings list**: the documents that contain it (and where).

| term | postings |
|---|---|
| `rust` | 1, 4, 9 |
| `async` | 4, 7 |
| `tokio` | 4 |

The query `rust async` intersects the lists: document 4. Lists are sorted and compressed, so intersecting millions of ids is fast.

**Analysis** turns text into terms when indexing and again at query time: a tokenizer splits words, filters lowercase them, remove stop words, stem (`running` → `run`) or add synonyms. A `text` field is analysed for full-text search; a `keyword` field is stored whole for exact filters, sorting and aggregations.
"""

[[sections]]
heading = "Relevance"
body = """
The default score is **BM25**: a document ranks higher when the query's terms appear in it often (with diminishing returns), when those terms are rare across all documents (inverse document frequency), and when the field is short. Boost fields (`title^3`), add recency or popularity with a `function_score`, or rerank the top results.

Use **filter context** for yes/no conditions (price < 50, in stock): filters do not score and are cached, so they are much cheaper than scoring queries.
"""

[[sections]]
heading = "Shards, replicas and near real time"
body = """
- An index is split into **primary shards** (each a Lucene index), fixed when the index is created; changing the count means a split, shrink or reindex. Each has **replica shards** on other nodes for failover and read throughput.
- A search goes to one copy of every shard, each returns its top hits, and the coordinating node merges them (scatter-gather). Many tiny shards make every query slower; aim for shards of tens of GB.
- New documents go to an in-memory buffer and a **translog**; a **refresh** (every second by default) writes a new immutable **segment** and makes them searchable. Search is therefore **near real time**: about one second behind. Segments are merged in the background; an update is a delete plus a new document.
"""

[[sections]]
heading = "Keeping it in sync with the database"
body = """
Elasticsearch can lose recent writes in some failures and has no multi-document transactions, so it is a **derived view**:

1. **Change data capture**: read the database's log (Debezium on Postgres or MySQL) into Kafka, and a consumer indexes each change. Ordered per key, replayable, no dual writes.
2. **Outbox**: the service writes an event row in the same transaction as the data; a relay publishes it.
3. Avoid **dual writes** from the app (write the DB, then ES): one can fail and they drift.

Keep a way to **rebuild the index from scratch** (reindex into a new index, then swap an alias), because mappings change and drift happens.
"""

[[sections]]
heading = "Pagination and other traps"
body = """
- `from` + `size` makes every shard collect `from + size` hits; it is capped at 10,000 by default. For deep paging use **`search_after`** with a sort key (a cursor), or a point-in-time for a stable view.
- Mapping explosions: indexing arbitrary JSON keys creates a field per key; set dynamic mapping to strict or use a flattened type.
- High-cardinality aggregations (unique users) are approximate (HyperLogLog-based `cardinality`).

> [!INTERVIEW]
> Say what is analysed (text) and what is filtered (keyword), how the index is fed (CDC, not dual writes), and that results lag by about a second.
"""

[[sections]]
heading = "Mappings: text, keyword and doc values"
body = """
A field's **mapping** decides how it is stored and what you can do with it:

| Type | Indexed as | Use for |
|---|---|---|
| `text` | analysed into terms | full-text search on titles, descriptions |
| `keyword` | the exact value as one term | filters, sorting, aggregations: status, country, id |
| numeric, `date`, `boolean` | BKD tree | ranges and sorting |
| `dense_vector` | HNSW graph | nearest-neighbour search on embeddings |
| `nested` | each object as its own hidden document | arrays of objects that must match together |

Two copies of the same string field are common: `title` as `text` for search and `title.keyword` for sorting and exact filters. Sorting and aggregations read **doc values**, a column-oriented structure on disk built at index time; a `text` field has none by default, which is why you cannot sort on it.

Changing a mapping for existing data is not possible: you create a new index with the new mapping and **reindex**, then move an alias. Plan for this from day one by always reading and writing through an alias.
"""

[[sections]]
heading = "Inside a shard: segments, merges and the translog"
body = """
Each shard is a Lucene index made of immutable **segments**. A write goes to an in-memory buffer and to the **translog** (fsynced per request by default). A **refresh** (every second by default; a shard with no search for 30 seconds skips background refreshes until the next search arrives) turns the buffer into a new segment that search can see; a **flush** commits segments to disk and clears the translog. Because segments are never edited, an update is a delete flag on the old document plus a new document, and a **background merge** combines small segments into bigger ones and finally drops deleted documents: the same idea as an LSM tree.

Consequences:

- Many tiny refreshes create many small segments and heavy merging. For a bulk load set `refresh_interval` to `-1` (or 30s), load, then restore it.
- A document updated often is rewritten each time; keep frequently changing counters (view counts) out of the search index.
- Shards are fixed in count, and a document's shard is `hash(_routing or _id) mod primary shards`. This is why the count cannot change without reindexing, split or shrink.
- A node should keep about 20 shards or fewer per GB of heap; thousands of tiny shards are a common cause of slow clusters.
"""

[[sections]]
heading = "Operating it"
body = """
- **Cluster state**: a master-eligible quorum (three dedicated nodes) manages the cluster's metadata; a split brain is prevented by requiring a majority. Data nodes hold shards; coordinating nodes route queries.
- **Health**: `green` means all shards are assigned, `yellow` means a replica is missing, `red` means a primary is missing and some data is unavailable.
- **Hot-warm-cold**: time-series data (logs) goes into a new index per day or size, with **index lifecycle management** moving old indices to cheaper nodes and then deleting them. Dropping a whole index is instant; deleting millions of documents is not.
- **Capacity**: size by shards of 10 to 50 GB, document count, query load and the heap (keep the JVM heap under the threshold for compressed object pointers: Elastic documents 26 GB as safe on most systems and up to about 30 GB on some; the rest of memory is the file system cache that Lucene relies on).
- **Backups**: snapshots to object storage; rebuild from the source of truth if you can.


> [!NOTE]
> **How these figures were checked.** Checked against the Elasticsearch repository's documentation on GitHub: the one-second refresh and 30-second search-idle rule, translog `request` durability, the 10,000-hit `from + size` cap and the compressed-pointer heap guidance (26 GB safe, up to about 30 GB). Not verified (Elastic's sizing guide could not be reached): shards of 10 to 50 GB and about 20 shards per GB of heap."""

[[sections]]
heading = "Elasticsearch against the alternatives"
body = """
Postgres full-text search (`tsvector` with a GIN index) handles modest search with no extra system and transactional consistency; use it first for a few million documents. Elasticsearch (or OpenSearch, its fork) earns its place when you need relevance tuning, facets, typo tolerance, many fields, scale across nodes, or log analytics. Dedicated engines such as Typesense and Meilisearch are simpler for small product-search cases. Vector search (embeddings) is now in Elasticsearch, Postgres (`pgvector`) and dedicated vector stores; choose by scale and by whether you also need filters and keyword matches in the same query (hybrid search).

> [!INTERVIEW]
> Say the index is derived from the database, name the sync method, give the shard sizing, and say the result lags by about a second.
"""

[[checks]]
prompt = "Why should the product catalogue's source of truth be Postgres rather than Elasticsearch, and how do the two stay in sync?"
answer = "Elasticsearch is near real time, has no multi-document transactions and can lose recently acknowledged writes in some failure cases, so it is a derived index. Keep Postgres as the source, stream changes through CDC (or an outbox) into a consumer that indexes them, and be able to reindex from Postgres when needed."

[[checks]]
prompt = "A user pages to page 2,000 of search results at 20 per page and the request fails. Why, and what is the fix?"
answer = "from + size = 40,000 exceeds the default max_result_window of 10,000, and each shard would have to collect and sort 40,000 hits. Use search_after with the last hit's sort values (a cursor), usually with a point in time; or stop offering deep page numbers."

[[checks]]
prompt = "What is the difference between a `text` and a `keyword` field, and which do you use for a category filter?"
answer = "A text field is analysed into terms for full-text matching and scoring; a keyword field stores the exact value for filtering, sorting and aggregations. A category filter uses keyword in filter context (exact, unscored, cached)."

[[checks]]
prompt = "A search for `Shoes` should match `shoes`, but filtering `brand = Nike` returns nothing for the document with brand `nike`. What is wrong?"
answer = "The brand field is probably mapped as keyword, which stores the exact value, so Nike and nike are different terms. A text field would be lowercased by the analyser. Use a keyword field with a lowercase normalizer for exact but case-insensitive filters, or normalise the value on write."

[[checks]]
prompt = "Why can you not change the number of primary shards of an existing index, and what can you do instead?"
answer = "A document's shard is chosen by hashing its routing value modulo the number of primary shards, so changing the count would move almost every document. Create a new index with the right number and reindex into it, or use the split or shrink API when the new count is a multiple or factor of the old; read through an alias so the switch is invisible."

[[checks]]
prompt = "An index receives 20,000 updates a second to a view-count field and search slows down. Why, and what do you change?"
answer = "Segments are immutable, so each update writes a whole new document and marks the old one deleted; constant updates mean heavy indexing, many small segments, merges and deleted-document overhead. Keep counters in another store (Redis or a database), update the search document in batches every few minutes, or store only a coarse bucket."

[[checks]]
prompt = "The product team wants infinite scroll through search results. Why does from + size break at page 1,000, and what do you use?"
answer = "Each shard must collect from + size hits and send them to the coordinator, so deep pages cost memory and time and are capped at 10,000 by default. Use search_after with the sort values of the last hit as a cursor, with a point-in-time for a stable view while the index changes."

