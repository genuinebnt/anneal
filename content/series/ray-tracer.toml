# The series "Build a ray tracer": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "ray-tracer"
rank = 16
title = "Build a ray tracer"
summary = "Small parts give you what the capstone needs. Then you build a program that turns a described scene into a picture."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a ray tracer"
capstone_summary = "Rays and shapes, a camera, a PNG file, lamps and shadows, mirrors and glass, large scenes, bounced light and a renderer on several threads."
capstone_note = "From step 2 on, each starter contains reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and some of the preparation.\n\nThe capstone leaves out two things the Cookbook file has: its showcase scenes and its timing report. Limits of the finished renderer: bounced light does not use the lamps, glass is always taken to be in air, and a flat lamp has no front side."
capstone_cookbook = "ray-tracer"

[[stage]]
id = "aim"
name = "Aim and meet"

[[stage]]
id = "chance"
name = "Use chance"

[[stage]]
id = "light"
name = "Follow the light"

[[stage]]
id = "machine"
name = "Build the machinery"

