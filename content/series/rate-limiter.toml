# The series "From a clock to a rate limiter lab": an order over existing problems, not a track. It copies and moves
# nothing. required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives
# away how to solve the part. cookbook: reference pages (slugs in content/cookbook), closed by default; level is exact
# (solves the task), similar (same technique, different task) or related (explains the idea). Notes say how much of a
# page was read. Minutes are estimates; nobody has been timed.

[series]
id = "rate-limiter"
rank = 5
title = "From a clock to a rate limiter lab"
summary = "Small parts teach you to work with time, shared counts and unknown limits. Then you build a laboratory that compares rate limiters, one step at a time."
note = "All times are estimates; nobody has been timed. No part reads a real clock: every test passes the time in."
capstone_title = "Capstone: a rate limiter lab"
capstone_summary = "Run six limiters on the same traffic, give each client its own, and cap the work in flight with a limit that adjusts itself."
capstone_note = "Each step whose starter has reference code begins with a warning that names what the code solves. Read it before opening the editor."
capstone_cookbook = "rate-limiter-lab"

[[stage]]
id = "measure-time"
name = "Work with time"

[[stage]]
id = "share"
name = "Share a limit between threads"

[[stage]]
id = "react"
name = "React to what happens"

[[part]]
number = 1
id = "m3-pace-by-period"
stage = "measure-time"
title = "Faster or slower than last time?"
status = "new"
minutes = 45
blurb = "Compare this hour with the last one while it is still running"
new_idea = "Time as an argument, rolling from one period to the next, and comparing fractions without dividing"
reuses = "nothing"
required = []
used_again = ["m4-measure-a-limiter", "m4-two-counts"]
real_uses = "Usage dashboards, billing periods, alerting on a rising rate, quota counters."
cookbook = [
    { level = "related", page = "stream-processing-windows", note = "Only its header and the window assignment were read.", hidden = true },
]

[[part]]
number = 2
id = "m3-busiest-stretch"
stage = "measure-time"
title = "The busiest stretch"
status = "new"
minutes = 60
blurb = "Find the worst moment in a log, wherever it starts"
new_idea = "Two positions that only move forward over sorted times, and half-open stretches"
reuses = "half-open time from part 1"
required = []
used_again = ["m2-rate-limiter", "m4-measure-a-limiter", "m4-side-by-side"]
real_uses = "Capacity planning, abuse detection, checking whether a limit was really kept."
cookbook = [
    { level = "related", page = "algorithmic-optimization-toolbox", note = "Its sliding maximum was read: a window over a list on another task.", hidden = true },
]

[[part]]
number = 3
id = "m2-rate-limiter"
stage = "measure-time"
title = "A rate limiter on a clock you control"
status = "existing"
minutes = 120
blurb = "Build two kinds of limiter on a clock the test moves, one for each client"
new_idea = "Allowance worked out lazily from elapsed time, exact retry times, and forgetting idle clients"
reuses = "time as an argument from part 1"
know_first = "Traits, generics, VecDeque and HashMap"
required = ["m3-pace-by-period"]
helpful = [
    { id = "m3-busiest-stretch", why = "the same two ends moving over times", reveals_method = true, hidden = true },
]
used_again = ["m4-measure-a-limiter", "m4-one-number-per-client", "m4-forget-safely"]
real_uses = "API quotas, login throttling, outbound call budgets."
cookbook = [
    { level = "similar", page = "token-bucket", note = "Read in full. A floating-point bucket with an injected clock.", hidden = true },
    { level = "similar", page = "concurrency-interview-questions", note = "Its token bucket question was read. Integer tokens, an injected clock and a carried refill remainder.", hidden = true },
]

[[part]]
number = 4
id = "m3-book-the-next-slot"
stage = "measure-time"
title = "Give every message a send time"
status = "new"
minutes = 60
blurb = "Plan when each message goes out, and refuse with the time to come back"
new_idea = "One number, the moment the line is next free, stands for the whole queue"
reuses = "exact retry times from part 3"
required = []
used_again = ["m4-one-number-per-client"]
real_uses = "Outbound API pacing, network traffic shaping, honouring Retry-After."

[[part]]
number = 5
id = "l1-raii-span-guard"
stage = "share"
title = "An RAII span guard"
status = "existing"
minutes = 45
blurb = "Make something happen however a piece of code ends"
new_idea = "Undoing something in Drop, so every way out of a scope does it"
reuses = "nothing"
required = []
used_again = ["m4-cap-work-in-flight", "m4-let-the-cap-find-itself"]
real_uses = "Gauges, tracing spans, lock guards, in-flight counts."

[[part]]
number = 6
id = "l4-plugin-logger"
stage = "share"
title = "Plugin logger with trait objects"
status = "existing"
minutes = 60
blurb = "Combine pieces chosen at run time, and share one between several owners"
new_idea = "Boxed trait objects, sharing through Arc, and implementing a trait for a smart pointer"
reuses = "one trait with several implementations, like Limiter in part 3"
required = []
used_again = ["m4-cap-work-in-flight", "m4-side-by-side"]
real_uses = "Middleware stacks, plugin systems, choosing a policy from configuration."

[[part]]
number = 7
id = "c3-atomic-stats"
stage = "share"
title = "Lock-free statistics counters"
status = "existing"
minutes = 45
blurb = "Keep correct counts when many threads report at once"
new_idea = "Atomic add, minimum, maximum, and an update that retries"
reuses = "nothing new from this series"
required = []
used_again = ["m3-claim-without-a-lock", "m4-cap-work-in-flight"]
real_uses = "Metrics libraries, high-water marks, allocator statistics."
cookbook = [
    { level = "related", page = "std-atomics-ordering-use-cases", note = "Its header and its gauge section were read.", hidden = true },
]

[[part]]
number = 8
id = "m3-claim-without-a-lock"
stage = "share"
title = "Hand out space that nobody else has"
status = "new"
minutes = 60
blurb = "Give many threads pieces of one buffer, with no overlap, and close it cleanly"
new_idea = "A change that only happens if what was looked at is still true, retried otherwise"
reuses = "atomics from part 7"
required = ["c3-atomic-stats"]
used_again = ["m4-cap-work-in-flight"]
real_uses = "Bump allocators, log reservation in storage engines, id ranges."
cookbook = [
    { level = "similar", page = "std-atomics-ordering-use-cases", note = "Its gauge section was read: check and add as one step, on another task. This shows the method.", hidden = true },
]

[[part]]
number = 9
id = "m3-how-hard-to-push"
stage = "react"
title = "How big should the next batch be?"
status = "new"
minutes = 75
blurb = "Find a limit that nobody tells you, and keep up when it moves"
new_idea = "Learning a hidden limit from yes and no answers, judged by simulation"
reuses = "nothing from earlier parts"
required = []
used_again = ["m4-let-the-cap-find-itself"]
real_uses = "Congestion control, adaptive batch sizes, client-side throttling."
cookbook = [
    { level = "similar", page = "tcp-congestion-control-sim", note = "Its header and its window growth and loss handling were read. This shows a method.", hidden = true },
]

[[capstone]]
step = 1
id = "m4-measure-a-limiter"
title = "Measure a limiter"
minutes = 60
blurb = "Run any limiter over recorded arrivals and report what got through"
new_idea = "A harness over one trait, and the measure that matters to the backend"
reuses = "periods from part 1, the busiest stretch from part 2"
prepared_by = ["m3-pace-by-period", "m3-busiest-stretch", "m2-rate-limiter"]
required = ["m3-busiest-stretch", "m2-rate-limiter"]
used_again = ["m4-side-by-side"]
real_uses = "Replaying production traffic against a proposed limit."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
]

[[capstone]]
step = 2
id = "m4-two-counts"
title = "A smoother count from two numbers"
minutes = 75
blurb = "Smooth the edge between windows with almost no extra memory"
new_idea = "A weighted estimate in exact integers, and the wait solved from the rule"
reuses = "comparing fractions from part 1, retry times from part 3"
prepared_by = ["m3-pace-by-period", "m2-rate-limiter"]
required = ["m4-measure-a-limiter"]
used_again = ["m4-forget-safely", "m4-side-by-side"]
real_uses = "Edge and gateway limits that cannot store every request."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
    { level = "similar", page = "systems-design-in-code", note = "Its rate limiter question was read. The same estimate in integers, with no retry time.", hidden = true },
]

[[capstone]]
step = 3
id = "m4-one-number-per-client"
title = "The same promise in one number"
minutes = 90
blurb = "Keep a client's whole limit in a single stored value"
new_idea = "Two other states that behave exactly like a token bucket, one of them a single number"
reuses = "the token bucket and retry times from part 3"
prepared_by = ["m2-rate-limiter", "m3-book-the-next-slot"]
required = ["m4-two-counts", "m2-rate-limiter"]
helpful = [
    { id = "m3-book-the-next-slot", why = "one number standing for a whole queue", reveals_method = true, hidden = true },
]
used_again = ["m4-forget-safely", "m4-side-by-side"]
real_uses = "Distributed limiters that keep one value per key and update it atomically."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
]

[[capstone]]
step = 4
id = "m4-forget-safely"
title = "A limit per client, and forgetting safely"
minutes = 90
blurb = "Serve millions of clients without ever giving one a second allowance"
new_idea = "Forgetting only what no future answer depends on, at a constant average cost"
reuses = "one limiter per client from part 3"
prepared_by = ["m2-rate-limiter"]
required = ["m4-one-number-per-client", "m2-rate-limiter"]
used_again = ["m4-side-by-side"]
real_uses = "Per-key limiters in gateways, expiry in caches and session tables."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
]

[[capstone]]
step = 5
id = "m4-cap-work-in-flight"
title = "Cap the work in flight"
minutes = 75
blurb = "Bound how much runs at once, however slow it becomes"
new_idea = "A permit that returns itself, over a count and a limit that must change together"
reuses = "Drop from part 5, Arc from part 6, the retried change from part 8"
prepared_by = ["l1-raii-span-guard", "l4-plugin-logger", "c3-atomic-stats", "m3-claim-without-a-lock"]
required = ["m3-claim-without-a-lock", "l1-raii-span-guard"]
helpful = [
    { id = "c2-bounded-channel", why = "handles that share state and give something back when dropped", reveals_method = false, hidden = true },
]
used_again = ["m4-let-the-cap-find-itself"]
real_uses = "Connection and request caps, bulkheads, load shedding."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
]

[[capstone]]
step = 6
id = "m4-let-the-cap-find-itself"
title = "Let the cap find itself"
minutes = 90
blurb = "Raise and lower a limit from how the admitted work turns out"
new_idea = "Counting one overload episode once, and growing only when the limit is really used"
reuses = "the rule you found in part 9, the gate from step 5"
prepared_by = ["m3-how-hard-to-push", "l1-raii-span-guard"]
required = ["m4-cap-work-in-flight", "m3-how-hard-to-push"]
real_uses = "Adaptive concurrency limits in service clients and proxies."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
    { level = "related", page = "tcp-congestion-control-sim", note = "Its header and its window growth and loss handling were read.", hidden = true },
]

[[capstone]]
step = 7
id = "m4-side-by-side"
title = "Put them side by side"
minutes = 90
blurb = "Compare every limiter on the same traffic, shared and per client"
new_idea = "One harness over limiters chosen at run time, with per-client results"
reuses = "boxed traits from part 6, steps 1 to 4"
prepared_by = ["l4-plugin-logger", "m2-rate-limiter", "m3-busiest-stretch"]
required = ["m4-forget-safely"]
real_uses = "Choosing a limiter policy from recorded traffic before shipping it."
cookbook = [
    { level = "similar", page = "rate-limiter-lab", note = "The Cookbook lab, read in full. Shows the method for the whole capstone; its rules differ.", hidden = true },
]

