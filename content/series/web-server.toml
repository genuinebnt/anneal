# The series "From threads to a web server": an order over existing problems, not a track. It copies and moves nothing.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "threads-to-web-server"
title = "From threads to a web server"
summary = "Small parts give you what the capstone needs. Then you build the web server yourself, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a web server"
capstone_note = "From step 2 on, each starter contains reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and much of the preparation before them."

[[stage]]
id = "hand-work-to-workers"
name = "Hand work to workers"

[[stage]]
id = "read-requests"
name = "Read requests"

[[stage]]
id = "answer-requests"
name = "Answer requests"

[[stage]]
id = "run-it-for-real"
name = "Run it for real"

[[part]]
number = 1
id = "c1-blocking-queue"
stage = "hand-work-to-workers"
title = "A bounded blocking queue with Condvar"
status = "existing"
minutes = 60
blurb = "Let threads hand work to each other, and finish cleanly when the work ends"
new_idea = "Waiting for a condition, and waking waiters when the work ends"
reuses = "Mutex, VecDeque"
required = []
helpful = []
used_again = ["c2-bounded-channel", "c2-thread-pool", "b7-tests-without-luck"]
real_uses = "Job queues, connection pools, bounded buffers between pipeline stages."
cookbook = [
    { level = "related", page = "mutex-condvar-channel", note = "Builds locks, a condvar and a bounded channel. Chosen by its summary; code not read.", hidden = true },
]

[[part]]
number = 2
id = "c2-bounded-channel"
know_first = "Threads, and sharing a value between them"
stage = "hand-work-to-workers"
title = "A bounded MPMC channel with disconnect"
status = "existing"
minutes = 75
blurb = "Let each side find out when the other has gone"
new_idea = "The other side being gone is a count that reaches zero"
reuses = "the wait loop of part 1"
required = ["c1-blocking-queue"]
helpful = []
used_again = ["c2-thread-pool", "b7-turn-work-away"]
real_uses = "std::sync::mpsc, crossbeam channels, actor mailboxes."
cookbook = [
    { level = "similar", page = "mutex-condvar-channel", note = "A bounded MPMC channel from simpler pieces. Chosen by its summary; code not read.", hidden = true },
]

[[part]]
number = 3
id = "c2-thread-pool"
stage = "hand-work-to-workers"
title = "A thread pool with results and graceful shutdown"
status = "existing"
minutes = 90
blurb = "Run many jobs, survive a failing one and stop without losing work"
new_idea = "A fixed set of workers that survives failing jobs and finishes the queue before it stops"
reuses = "parts 1 and 2"
required = ["c1-blocking-queue"]
helpful = [
    { id = "c2-bounded-channel", why = "results come back through a channel", reveals_method = false, hidden = true },
]
used_again = ["b7-turn-work-away", "b7-stop-a-listening-server", "b8-many-clients-and-overload"]
real_uses = "rayon, web server worker pools, background job runners; later the FlowForge executor with a limit."
cookbook = [
    { level = "related", page = "thread-pool-work-stealing", note = "Chosen by title; not read.", hidden = true },
    { level = "related", page = "worker-pool", note = "An async pool with a bounded queue, panic isolation and drain; the Pool type and its submit were read.", hidden = true },
]

