# The series "From bytes on a socket to a mini Redis": an order over problems, not a track. It copies and moves nothing.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). No page here is exact: the Cookbook
# mini Redis is one file with another interface. Minutes are estimates; nobody has been timed.

[series]
id = "mini-redis"
rank = 4
title = "From bytes on a socket to a mini Redis"
summary = "Small parts give you what the capstone needs. Then you build a small Redis, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a mini Redis"
capstone_summary = "Its wire protocol, five kinds of value, expiry, transactions, blocking pops, publish and subscribe, a log with snapshots, and a TCP server."
capstone_note = "From step 2 on, each starter contains reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step. It gives away those steps, and several parts of the series; each step names them. It is a teaching server, not Redis: one database, about 60 commands, RESP2 only."
capstone_cookbook = "mini-redis"

[[stage]]
id = "messages"
name = "Messages in pieces"

[[stage]]
id = "data"
name = "Data a server keeps"

[[stage]]
id = "waiting"
name = "Waiting and telling"

[[stage]]
id = "disk"
name = "A log you can replay"

[[stage]]
id = "network"
name = "Over the network"

