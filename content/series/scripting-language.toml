# The series "Build a scripting language": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "scripting-language"
rank = 12
title = "Build a scripting language"
summary = "Small parts give you what the capstone needs. Then you build a language with variables, functions and classes, and run it two ways."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a scripting language"
capstone_summary = "A scanner, a parser that reports every mistake, name checking, a tree interpreter, and a compiler with its own machine."
capstone_note = "From step 2 on, each starter contains reference code for earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and much of the preparation before them."
capstone_cookbook = "toy-language-interpreter"

[[stage]]
id = "read"
name = "Read text"

[[stage]]
id = "meaning"
name = "Give it a meaning"

[[stage]]
id = "machine"
name = "Run flat code"

[[part]]
number = 1
id = "l3-zero-copy-tokenizer"
stage = "read"
status = "existing"
minutes = 45
blurb = "Cut source text into pieces without copying it"
new_idea = "Walking through text and handing out pieces of it"
reuses = "nothing"
required = []
helpful = [
    { id = "s2-bytes-chars-char-indices", why = "positions in bytes and in characters", reveals_method = false, hidden = true },
    { id = "s2-fix-slicing-mid-utf8", why = "what goes wrong when a position splits a character", reveals_method = false, hidden = true },
]
used_again = ["y122-read-the-source"]
real_uses = "The first stage of compilers, linters and config readers."
cookbook = [
    { level = "similar", page = "zero-copy-lexer", note = "A lexer whose tokens borrow from the source.", hidden = true },
]

[[part]]
number = 2
id = "y9-shell-line-parser"
stage = "read"
status = "existing"
minutes = 75
blurb = "Take a command line apart the way a shell does"
