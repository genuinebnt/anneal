stage = "read"
status = "existing"
minutes = 75
blurb = "Work out every word a short pattern stands for"
new_idea = "One function for each level of a nested notation, with errors that name a position and a depth limit"
reuses = "nothing"
required = []
helpful = []
used_again = ["y14-pratt-parser", "y121-every-broken-line", "y122-read-the-whole-language"]
real_uses = "Shells, build tools, route patterns."

[[part]]
