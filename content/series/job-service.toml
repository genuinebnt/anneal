# The series "From one HTTP request to a job service": an order over existing problems, not a track. It copies and
# moves nothing. required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link
# gives away how to solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default;
# level is exact (solves the task), similar (same technique, different task) or related (explains the idea).
# Minutes are estimates; nobody has been timed.

[series]
id = "job-service"
title = "From one HTTP request to a job service"
summary = "Small parts give you what the capstone needs. Then you build a service that runs background jobs over HTTP, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a job service"
capstone_summary = "Clients post image-resize jobs, page through them, cancel them and watch them happen. The service runs a few at a time and shuts down without losing one."
capstone_note = "From step 2 on, each starter contains reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step. It gives away those steps and much of the preparation before them. The tests run in memory: no step opens a network port."
capstone_cookbook = "job-service-axum"

[[stage]]
id = "edge"
name = "At the HTTP edge"

[[stage]]
id = "background"
name = "Work in the background"

[[stage]]
id = "promises"
name = "Promises to clients"

[[stage]]
id = "running"
name = "Run it for real"

[[part]]
number = 1
id = "f7-wire-format-json"
stage = "edge"
title = "JSON you do not control"
status = "existing"
minutes = 60
blurb = "Read and write JSON whose shape somebody else decided"
new_idea = "Describing a wire format with serde attributes"
reuses = "structs and enums"
required = []
helpful = []
used_again = ["b21-two-editors", "b22-refuse-bad-jobs"]
real_uses = "Webhooks, third-party APIs, config files."
cookbook = [
    { level = "similar", page = "backend-request-validation-extractors", note = "Strict decoding with serde, then every field error collected.", hidden = true },
]

[[part]]
number = 2
id = "b1-api-error-response"
stage = "edge"
title = "One error shape for the whole API"
status = "existing"
minutes = 75
blurb = "Make every failure of a small web API look the same"
new_idea = "One error type that turns into every response, rejections and fallbacks included"
reuses = "Result and ?"
required = []
helpful = [
    { id = "l8-import-errors", why = "designing an error type that keeps its cause", reveals_method = false, hidden = true },
]
used_again = ["b22-refuse-bad-jobs", "b22-serve-the-jobs"]
real_uses = "Any public HTTP API with documented error codes."
cookbook = [
    { level = "similar", page = "axum-errors", note = "One error type with one JSON shape.", hidden = true },
]

[[part]]
number = 3
id = "b21-two-editors"
stage = "edge"
title = "Two people edit one page"
minutes = 75
blurb = "Stop one writer from silently wiping out another"
new_idea = "Write preconditions with ETags: headers, raw bytes, and a compare-and-write under one lock"
reuses = "axum routing from part 2, serde from part 1"
required = ["b1-api-error-response"]
helpful = [
    { id = "b7-only-what-the-client-needs", why = "the same tags used for reading, in the web server series", reveals_method = false, hidden = true },
]
used_again = ["b22-serve-the-jobs"]
real_uses = "REST APIs with optimistic concurrency, object stores, configuration services."
cookbook = [
    { level = "similar", page = "rest-api-patterns", note = "ETag with If-Match, 412 and 428, inside a larger REST example.", hidden = true },
    { level = "similar", page = "http-caching-conditional", note = "An axum server with ETag and If-Match.", hidden = true },
]

[[part]]
number = 4
id = "b21-pages-that-hold-still"
stage = "edge"
title = "Pages that hold still while the list changes"
minutes = 60
blurb = "Show a changing list a page at a time without repeats or gaps"
new_idea = "Keyset pagination over a sorted set with an excluded lower bound and one extra row"
reuses = "ordered collections"
required = []
helpful = [
    { id = "s4-btreemap-ranges", why = "ranges over a sorted map, as a small warm-up", reveals_method = true, hidden = true },
]
used_again = ["b22-serve-the-jobs"]
real_uses = "Feeds, audit logs, any list API with next-page cursors."
cookbook = [
    { level = "similar", page = "rest-api-patterns", note = "Offset against cursor pagination under inserts and deletes.", hidden = true },
]

[[part]]
number = 5
id = "c4-bounded-fan-out"
stage = "background"
title = "At most N in flight"
status = "existing"
minutes = 60
blurb = "Run many async calls without running them all at once"
new_idea = "Spawning, joining and cancelling tasks with a JoinSet, within a limit"
reuses = "async functions"
required = []
helpful = []
used_again = ["b21-memory-budget", "b22-run-the-jobs"]
real_uses = "Crawlers, batch API calls, fan-out requests."
cookbook = [
    { level = "related", page = "joinset-semaphore", note = "A JoinSet and a limit. It spawns every task up front, which this problem forbids.", hidden = true },
    { level = "similar", page = "structured-concurrency-cancellation", note = "A scope that cancels the rest on the first failure.", hidden = true },
]

[[part]]
number = 6
id = "b21-memory-budget"
stage = "background"
title = "Background jobs within a memory budget"
minutes = 75
blurb = "Accept work at once and run only as much as fits"
new_idea = "A semaphore as a resource budget, one task per job, and waiting for them without owning them"
reuses = "JoinSet from part 5"
required = ["c4-bounded-fan-out"]
helpful = [
    { id = "l1-raii-span-guard", why = "a guard that acts on every way out", reveals_method = true, hidden = true },
    { id = "c1-fair-semaphore", why = "build a fair semaphore yourself", reveals_method = true, hidden = true },
]
used_again = ["b22-run-the-jobs"]
real_uses = "Upload processing, image pipelines, limits on database connections."
cookbook = [
    { level = "similar", page = "joinset-semaphore", note = "A JoinSet with a Semaphore that proves a limit.", hidden = true },
]

[[part]]
number = 7
id = "b21-one-piece-of-work"
stage = "background"
title = "Run one piece of work and say how it ended"
minutes = 90
blurb = "Survive work that crashes, hangs or is no longer wanted"
new_idea = "Panic isolation in a child task, a biased select over cancel, result and time, and abort that is awaited"
reuses = "tasks from part 5"
required = ["c4-bounded-fan-out"]
helpful = [
    { id = "c4-fix-cancel-safe-reader", why = "what select! does to the branches that lose", reveals_method = false, hidden = true },
]
used_again = ["b22-run-the-jobs", "b22-cancel-a-job"]
real_uses = "Job runners, plugin hosts, request handlers with deadlines."
cookbook = [
    { level = "similar", page = "structured-concurrency-cancellation", note = "Cancellation, grace periods and abort.", hidden = true },
    { level = "related", page = "select-cancel", note = "What select! does to the losing branches.", hidden = true },
]

[[part]]
number = 8
id = "b21-charge-once"
stage = "promises"
title = "Charge the card once"
minutes = 75
blurb = "Make a retried request safe, even while the first is still running"
new_idea = "Claiming an idempotency key under one lock and freeing it with a drop guard"
reuses = "Mutex, async"
required = []
helpful = [
    { id = "l1-raii-span-guard", why = "a guard that acts on every way out", reveals_method = true, hidden = true },
]
used_again = ["b22-accept-each-job-once"]
real_uses = "Payment APIs, order creation, job submission."
cookbook = [
    { level = "similar", page = "axum-idempotency", note = "Idempotency keys over HTTP, without in-flight calls.", hidden = true },
    { level = "similar", page = "idempotency-dedup-leader-fencing-store", note = "In flight or done, with a request fingerprint. Keys free themselves by expiry.", hidden = true },
]

[[part]]
number = 9
id = "b21-leave-and-rejoin"
stage = "promises"
title = "A progress feed you can leave and rejoin"
minutes = 90
blurb = "Let a reader catch up and then stay up to date, missing nothing"
new_idea = "A log plus a watch signal: mark seen, read from your position, wait"
reuses = "async streams"
required = []
helpful = [
    { id = "c5-block-on", why = "what a waker is, and why waiting does not mean spinning", reveals_method = false, hidden = true },
]
used_again = ["b22-follow-a-job"]
real_uses = "Build logs, job progress, change feeds, chat history."
cookbook = [
    { level = "similar", page = "axum-sse-replay", note = "Replay after a last-seen id, without following.", hidden = true },
]

[[part]]
number = 10
id = "b21-prices-in-the-browser"
stage = "promises"
title = "Live prices in the browser"
minutes = 75
blurb = "Keep one response open and send news as it happens"
new_idea = "Server-Sent Events with axum: a stream as a body, keep-alive, and telling a slow client what it lost"
reuses = "streams from part 9, extractors from part 2"
required = ["b1-api-error-response"]
helpful = [
    { id = "b21-leave-and-rejoin", why = "building a stream with unfold", reveals_method = true, hidden = true },
]
used_again = ["b22-follow-a-job"]
real_uses = "Dashboards, notifications, token-by-token model output."
cookbook = [
    { level = "similar", page = "axum-sse-replay", note = "SSE with axum over a fixed log.", hidden = true },
]

[[part]]
number = 11
id = "c4-drain-with-deadline"
stage = "running"
title = "Shut down without losing work"
status = "existing"
minutes = 75
blurb = "Stop a background worker without losing what it accepted"
new_idea = "Close the queue, then drain under one deadline and account for every job"
reuses = "select! from part 7"
required = ["b21-one-piece-of-work"]
helpful = []
used_again = ["b21-closing-time", "b22-drain-the-service"]
real_uses = "Deployments, queue consumers."
cookbook = [
    { level = "related", page = "graceful-shutdown", note = "Stop, close the channel, drain. There is no deadline.", hidden = true },
    { level = "similar", page = "structured-concurrency-cancellation", note = "One grace deadline over a set of tasks.", hidden = true },
]

[[part]]
number = 12
id = "b21-closing-time"
stage = "running"
title = "Close the door, then wait for everyone to leave"
minutes = 75
blurb = "Know for certain that nothing is still running"
new_idea = "Admission and closing decided in one change of a watched value, with a cancel-safe wait"
reuses = "the watch signal from part 9"
required = ["c4-drain-with-deadline"]
helpful = [
    { id = "m4-cap-work-in-flight", why = "permits that give themselves back, in the rate limiter series", reveals_method = false, hidden = true },
    { id = "b7-stop-a-listening-server", why = "the same promise with threads and sockets", reveals_method = false, hidden = true },
]
used_again = ["b22-drain-the-service"]
real_uses = "Server shutdown, connection draining, hot reload."
cookbook = [
    { level = "similar", page = "structured-concurrency-cancellation", note = "Its task tracker: close, then wait for zero.", hidden = true },
]

[[part]]
number = 13
id = "b21-line-per-request"
stage = "running"
title = "A log line for every request"
