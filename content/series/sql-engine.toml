steps = [1]
note = "No part teaches these. Step 1's statement gives the rules, and its hints name the calls."

[[readiness]]
group = "Reading text"
concept = "One cursor with look, take and demand; fixed words and names; optional clauses; a mistake at a piece or at the end"
