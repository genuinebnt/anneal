[[readiness]]
group = "Reading text"
concept = "Quoted text where a doubled quote stands for one; an unclosed quote; ranges in bytes"
parts = ["y181-read-one-exported-line"]
steps = [1]

[[readiness]]
group = "Reading text"
concept = "Trying the longer symbol first; parsing a number that may not fit"
