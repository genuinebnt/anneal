# The series "From bytes on disk to a key-value store": an order over problems, not a track. It copies and moves nothing.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "key-value-store"
rank = 3
title = "From bytes on disk to a key-value store"
summary = "Small parts give you what the capstone needs. Then you build a key-value store that recovers after a crash, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a key-value store"
capstone_summary = "A log, sorted table files with their own index and filter, recovery after any crash, and compaction. Then a test that proves it."
capstone_note = "From step 2 to step 6, each starter contains reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps. Step 3 also gives the filter you repaired in part 12. Power loss itself cannot be tested here: the tests check the files each crash would leave."
capstone_cookbook = "mini-kv-store-code"

[[stage]]
id = "bytes"
name = "Bytes you can trust"

[[stage]]
id = "files"
name = "Files that survive"

[[stage]]
id = "sorted"
name = "Sorted data you can search"

[[stage]]
id = "layers"
name = "Many layers, one answer"

[[stage]]
id = "proof"
name = "Tests you can trust"

