# The series "From numbered pages to a filesystem": an order over existing and new problems, not a track. It copies and
# moves nothing. required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives
# away how to solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact
# (solves the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates;
# nobody has been timed.

[series]
id = "toy-filesystem"
rank = 11
title = "From numbered pages to a filesystem"
summary = "Small parts give you what the capstone needs. Then you build a small UNIX filesystem on a disk of blocks, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a filesystem"
capstone_summary = "A disk and its first block, free space, files with holes, directories, a disk that loses writes, surviving a power cut and a checker for damaged disks."
capstone_note = "From step 2 on, each starter holds reference code for earlier steps, which gives those steps away. Some starters also give parts of their own step, as their statements say. The filesystem takes one caller at a time and has no permission checks or open file handles. Only the superblock and journal carry checksums, and a test disk imitates power loss."
capstone_cookbook = "toy-filesystem"

[[stage]]
id = "pages"
name = "Bytes in fixed places"

[[stage]]
id = "space"
name = "Keep track of space"

[[stage]]
id = "waiting"
name = "Changes that wait"

[[stage]]
id = "names"
name = "Names for things"

[[stage]]
id = "damage"
name = "Crashes and damage"

