# The series "From a stock book to a bank ledger": an order over existing and new problems, not a track. It copies and moves nothing.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "event-ledger"
rank = 8
title = "From a stock book to a bank ledger"
summary = "Small parts give you what the capstone needs. Then you build a bank ledger that never edits a balance, one step at a time."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a bank ledger"
capstone_summary = "The rules of an account, a journal that old records can live in, a file that survives crashes, reports, transfers, and an auditor."
capstone_note = "From step 2 on, each starter contains reference code for earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and parts of the preparation. Telling the outside world about changes is built in part 13 and has no step of its own. Power loss cannot be tested: the tests check the bytes a crash could leave."
capstone_cookbook = "event-sourced-ledger"

[[stage]]
id = "history"
name = "Keep what happened"

[[stage]]
id = "sharing"
name = "Many writers, one history"

[[stage]]
id = "survive"
name = "Survive a bad disk"

[[stage]]
id = "followers"
name = "Follow the history, and prove it"

