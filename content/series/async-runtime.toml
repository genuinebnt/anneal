# The series "Build a small async runtime": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "async-runtime"
rank = 7
title = "Build a small async runtime"
summary = "Small parts give you what the capstone needs. Then you build the machinery under async and await yourself."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build an async runtime"
capstone_summary = "Tasks, join handles, a runtime on one thread, time, worker threads and a thread that watches for input and output."
capstone_note = "Every step's starter contains reference code for earlier work. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and several preparation parts. Real sockets are not graded: the runner has no mio, so step 7 uses an in-memory stand-in."
capstone_cookbook = "mini-async-runtime"

[[stage]]
id = "wake-and-poll"
name = "Wake and poll"

[[stage]]
id = "many-waits"
name = "Many waits in one task"

[[stage]]
id = "survive"
name = "Tasks that survive anything"

[[stage]]
id = "events-and-threads"
name = "Time, events and threads"

