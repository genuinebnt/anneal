# The series "Build a lease simulator": an order over new and existing problems, not a track. It copies and moves
# nothing. required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives
# away how to solve the part. cookbook: reference pages (slugs in content/cookbook), closed by default; level is exact
# (solves the task), similar (same technique, different task) or related (explains the idea). Notes say how much of a
# page was read. Minutes are estimates; nobody has been timed.

[series]
id = "lease-simulator"
rank = 9
title = "Build a lease simulator"
summary = "Small parts teach you to replay random runs, handle late messages and hunt for bad orderings. Then you build a simulated system that takes turns writing to one disk, and find the run that corrupts it."
note = "All times are estimates; nobody has been timed. Nothing sleeps or reads a real clock: every run is simulated."
capstone_title = "Capstone: a lease simulator"
capstone_summary = "A lease service, a shared disk, clients that can stall, a slow network, and a search through thousands of runs for the one that goes wrong."
capstone_note = "From step 2 on, each starter contains reference code for the earlier steps. Steps 4 and 5 also contain code that solves preparation parts. Each of those steps begins with a warning that names what the code solves. Read it before opening the editor. The model is small: no message is lost or repeated by the network, and the service never restarts. Clients and the service share one perfect clock. A real disk must save its highest token, and check and write in one step. A real service needs more than saved tokens after a restart: it must not grant over a lease that is still live. A holder that reads before it writes must show the disk its token before reading."
capstone_cookbook = "lease-fencing-sim"

