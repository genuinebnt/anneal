# The series "Build a query planner": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "query-optimizer"
rank = 13
title = "Build a query planner"
summary = "Small parts give you what the capstone needs. Then you build the part of a database that decides how to run a query."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a query planner"
capstone_summary = "Summaries of data, row estimates, a rewrite, plans that run, prices, a join order, printed plans and a bug hunter."
capstone_note = "From step 2 on, each starter contains reference code for earlier steps. The given `conjuncts` function also does the work of one BusTub optimizer challenge. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps. The capstone leaves out some pieces of the Cookbook file: simplifying constant expressions, dropping unused columns, a greedy join order and a left-deep-only mode. Its final pipeline does not use column dropping. Step 3 is close to one of the optimizer challenges in the BusTub course: whichever you do first will help with the other."
capstone_cookbook = "query-optimizer"

[[stage]]
id = "estimate"
name = "Guess without looking"

[[stage]]
id = "reshape"
name = "Change a tree, keep its meaning"

[[stage]]
id = "pull"
name = "Hand out results on request"

[[stage]]
id = "choose"
name = "Choose well"

[[stage]]
id = "check"
name = "Get ready to check it"

