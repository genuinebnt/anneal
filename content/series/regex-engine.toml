# The series "Build a regular-expression engine": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "regex-engine"
rank = 6
title = "Build a regular-expression engine"
summary = "Small parts give you what the capstone needs. Then you build an engine that stays fast on any pattern, and check it."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a regular-expression engine"
capstone_summary = "A parser, a compiler to a state machine, a matcher that cannot blow up, search, a second matcher and a bug hunter."
capstone_note = "From step 2 on, each starter contains reference code for earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and much of the preparation before them."
capstone_cookbook = "regex-nfa-engine"

[[stage]]
id = "read-notation"
name = "Read a small notation"

[[stage]]
id = "many-possibilities"
name = "Handle many possibilities"

[[stage]]
id = "second-opinion"
name = "Get a second opinion"

[[part]]
number = 1
id = "l3-zero-copy-tokenizer"
stage = "read-notation"
status = "existing"
minutes = 45
blurb = "Cut source text into pieces without copying it"
new_idea = "Walking through text and handing out pieces of it"
reuses = "nothing"
required = []
helpful = [
    { id = "l3-cursor-over-str", why = "optional warm-up: moving through text and keeping your place", reveals_method = false, hidden = true },
    { id = "s2-bytes-chars-char-indices", why = "positions in bytes and in characters", reveals_method = false, hidden = true },
]
used_again = ["y15-the-longest-word-first"]
real_uses = "The first stage of compilers, linters and config readers."

[[part]]
number = 2
id = "y15-expand-the-braces"
stage = "read-notation"
status = "new"
minutes = 75
blurb = "Work out every word a short pattern stands for"
new_idea = "One function for each level of a nested notation, with errors that name a position and limits on what a stranger sends"
reuses = "walking through text"
required = []
helpful = [
    { id = "y9-shell-line-parser", why = "another shell notation, with positions of a different kind", reveals_method = false, hidden = true },
    { id = "l8-import-errors", why = "error types a caller can match on", reveals_method = false, hidden = true },
]
used_again = ["y15-characters-in-a-few-keystrokes", "y15-print-it-so-it-reads-back", "y16-read-a-pattern"]
real_uses = "Shells, build tools, route and glob patterns."

[[part]]
number = 3
id = "y15-characters-in-a-few-keystrokes"
stage = "read-notation"
status = "new"
minutes = 60
blurb = "Turn a few keystrokes into an exact set of characters"
new_idea = "Rules for a dash that depend on what comes next, escapes, and one standard form for a set"
reuses = "positions and errors from part 2"
required = ["y15-expand-the-braces"]
helpful = [
    { id = "s4-interval-map", why = "ranges kept in order in a map", reveals_method = false, hidden = true },
]
used_again = ["y16-sets-and-escapes"]
real_uses = "tr, regex classes, Unicode tables, firewall port lists."
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "Its class parser and Class type. It has bugs with escapes inside brackets.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]

[[part]]
number = 4
id = "y15-lay-a-program-out-flat"
stage = "many-possibilities"
status = "new"
minutes = 105
blurb = "Turn nested instructions into a flat list a simple machine can run"
new_idea = "A graph stored in a Vec with indices as links, built from the end backwards, then run within a step limit"
reuses = "nothing from this series"
required = []
helpful = [
    { id = "y6-wasm-stack-interpreter", why = "running structured control flow without flattening it first", reveals_method = false, hidden = true },
    { id = "f3-generational-slab", why = "indices as handles", reveals_method = false, hidden = true },
]
used_again = ["y16-build-the-machine", "y16-a-second-matcher"]
real_uses = "Compilers, query plans, workflow engines."
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "Nfa::emit builds states the same way, for a different source language.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]

[[part]]
number = 5
id = "y15-which-roles-do-you-have"
stage = "many-possibilities"
status = "new"
minutes = 60
blurb = "Work out everything one account can really do"
new_idea = "Everything reachable, each node once, without recursion, where some links hold only in some situations"
reuses = "nothing new"
required = []
helpful = []
used_again = ["y15-where-could-it-be-now", "y16-match-the-whole-text"]
real_uses = "Access control, dependency closure, garbage-collector marking."

[[part]]
number = 6
id = "y15-where-could-it-be-now"
stage = "many-possibilities"
status = "new"
minutes = 75
blurb = "Follow a device you cannot see, from the sounds it makes"
new_idea = "Keeping the set of all possibilities, and advancing the whole set one input at a time"
reuses = "the closure walk of part 5"
required = ["y15-which-roles-do-you-have"]
helpful = []
used_again = ["y16-match-the-whole-text", "y16-find-inside-a-text"]
real_uses = "Protocol monitors, fuzzy matching, tokenizers, model checking."
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "closure and step run the same idea on regex states.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]

[[part]]
number = 7
id = "y15-the-longest-word-first"
stage = "many-possibilities"
status = "new"
minutes = 60
