required = ["y16-read-a-pattern"]
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "It reads \\s and \\t as the letters s and t, and shorthands inside brackets wrongly. Do not copy those parts.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]

[[capstone]]
