]
used_again = ["y16-find-inside-a-text"]
real_uses = "Lexers (longest match), routers, CSV and protocol scanners."

[[part]]
number = 8
id = "y15-an-order-that-stays-in-bounds"
stage = "second-opinion"
status = "new"
minutes = 90
blurb = "Choose an order for a nested job sheet that never breaks its limits"
