    { id = "l2-cell-for-copy", why = "changing a value through a shared reference", reveals_method = false, hidden = true },
]
used_again = ["y16-a-second-matcher"]
real_uses = "Schedulers with ordering constraints, planners, solvers, backtracking parsers."
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "bt and bt_cat pass the rest as a function, for a different task.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]

[[part]]
