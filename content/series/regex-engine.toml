reuses = "seeded random choices from part 9"
required = []
helpful = []
used_again = ["y16-catch-a-wrong-engine"]
real_uses = "Testing data structures, parsers, storage engines and rewrites."

[[capstone]]
step = 1
id = "y16-read-a-pattern"
title = "Read a pattern"
minutes = 75
blurb = "Understand how a pattern is put together"
new_idea = "Three levels of binding turned into a tree, with positioned errors and depth limits"
prepared_by = ["y15-expand-the-braces", "y15-print-it-so-it-reads-back"]
required = []
cookbook = [
    { level = "similar", page = "regex-nfa-engine", note = "Its parser has no depth limit, so deep or long patterns overflow the stack.", source = "examples/capstones/regex_nfa_engine.rs", hidden = true },
]
helpful = [
    { id = "y14-pratt-parser", why = "another way to handle operator strengths", reveals_method = false, hidden = true },
]

[[capstone]]
step = 2
id = "y16-sets-and-escapes"
