]
used_again = ["y152-suggest-by-what-starts-a-term", "y152-inside-a-term-and-despite-slips", "y152-serve-the-suggestions"]
real_uses = "Search boxes, command palettes, contact pickers."
cookbook = [
    { level = "similar", page = "typeahead-service", note = "normalize builds a key the same way. It has no way to light up the original text.", source = "examples/capstones/typeahead_service.rs", hidden = true },
]

