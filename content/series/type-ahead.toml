# The series "Build a type-ahead service": an order over existing and new problems, not a track.
# required: do these first. helpful: keep closed (hidden = true); reveals_method = true means the link gives away how to
# solve the part. cookbook: reference pages (slugs in content/cookbook), also closed by default; level is exact (solves
# the task), similar (same technique, different task) or related (explains the idea). Minutes are estimates; nobody has
# been timed.

[series]
id = "type-ahead"
rank = 15
title = "Build a type-ahead service"
summary = "Small parts give you what the capstone needs. Then you build the service behind a search box that suggests as you type."
note = "All times are estimates; nobody has been timed."
capstone_title = "Capstone: build a type-ahead service"
capstone_summary = "Ranked beginnings, matches inside terms and despite slips, a cache that stays fresh under writes, and an HTTP API."
capstone_note = "Each step's starter carries reference code for the earlier steps. It is a stand-in until the app can carry your own code from step to step, and it gives away those steps and some of the preparation. The service keeps everything in memory and never deletes a term. A real socket, shutdown, access control and a limit on the number of terms are left out."
capstone_cookbook = "typeahead-service"

[[stage]]
id = "what-was-meant"
name = "Work out what was meant"

[[stage]]
id = "what-comes-first"
name = "Decide what comes first"

[[stage]]
id = "stay-fresh"
name = "Stay fresh"

[[stage]]
id = "go-live"
name = "Go online"

[[part]]
number = 1
id = "y151-light-up-what-was-typed"
stage = "what-was-meant"
status = "new"
minutes = 60
blurb = "Match what a user typed against a name written differently, and light up that part"
new_idea = "One key for many spellings, cleaned after lowercasing, with positions mapped back to the original"
