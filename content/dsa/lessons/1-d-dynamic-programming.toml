template_name = "Maximum subarray sum with one deletion"
template = '''
def maximum_sum(arr):
    keep = arr[0]  # the best subarray ending here, nothing deleted
    drop = float("-inf")  # the best ending here, one element deleted
    best = arr[0]
    for x in arr[1:]:
        # delete x (use keep), or delete an earlier element and extend
        drop = max(keep, drop + x)
        keep = max(keep + x, x)
        best = max(best, keep, drop)
    return best
'''
