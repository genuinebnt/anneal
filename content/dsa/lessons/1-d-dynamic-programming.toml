template_name = "Fibonacci by fast doubling"
template = '''
def fib(n):
    def go(k):  # returns (F(k), F(k + 1))
        if k == 0:
            return 0, 1
        a, b = go(k // 2)
        c = a * (2 * b - a)  # F(2m)
        d = a * a + b * b  # F(2m + 1)
        return (d, c + d) if k % 2 else (c, d)

    return go(n)[0]
'''
