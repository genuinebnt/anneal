    result = [[1, 0, 0], [0, 1, 0], [0, 0, 1]]  # the identity
    step = [[0, 1, 0], [0, 0, 1], [1, 1, 1]]  # (a, b, c) -> (b, c, sum)
    while n:
        if n & 1:
            result = mul(result, step)
        step = mul(step, step)  # square
        n >>= 1
    return result[0][1] + result[0][2]  # times (T0, T1, T2) = (0, 1, 1)
'''

