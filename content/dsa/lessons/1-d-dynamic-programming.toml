name = "Coin change II (combinations)"
note = "Coins outside, amounts inside: each set of coins is counted once."
template = '''
def change(amount, coins):
    dp = [0] * (amount + 1)
    dp[0] = 1
    for coin in coins:  # coins outside: order does not matter
        for a in range(coin, amount + 1):
            dp[a] += dp[a - coin]
    return dp[amount]
'''

[[extra.variant]]
name = "Sum of powers (each number once)"
note = "A 0/1 knapsack: iterate the target downwards so each base is used at most once."
template = '''
def number_of_ways(n, x):
    mod = 10**9 + 7
    dp = [0] * (n + 1)
    dp[0] = 1
    base = 1
    while base**x <= n:
        p = base**x
        for t in range(n, p - 1, -1):  # downwards: use each base once
            dp[t] = (dp[t] + dp[t - p]) % mod
        base += 1
    return dp[n]
'''

