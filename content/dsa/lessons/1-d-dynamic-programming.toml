template_name = "Longest string chain"
template = '''
def longest_str_chain(words):
    best = {}  # word -> the longest chain that ends with it
    for w in sorted(words, key=len):  # shorter words first
        best[w] = 1
        for i in range(len(w)):
            prev = w[:i] + w[i + 1:]  # delete one letter
            if prev in best:
                best[w] = max(best[w], best[prev] + 1)
    return max(best.values())
'''
