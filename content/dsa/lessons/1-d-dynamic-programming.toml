]
template_name = "Valid partition of the array"
template = '''
def valid_partition(nums):
    n = len(nums)
    dp = [False] * (n + 1)
    dp[0] = True  # the empty prefix is fine
    for i in range(2, n + 1):
        two = nums[i - 1] == nums[i - 2]
        if two and dp[i - 2]:
            dp[i] = True
        if i >= 3 and dp[i - 3]:
            a, b, c = nums[i - 3], nums[i - 2], nums[i - 1]
            if (a == b == c) or (b == a + 1 and c == b + 1):
                dp[i] = True  # three equal, or three consecutive
    return dp[n]
'''
pitfalls = [
    "dp[0] = True: a split that uses the whole prefix as one block starts from the empty prefix.",
    "Check each allowed block length against its rule and the dp value before it.",
    "A prefix of length 1 is never valid: the loop starts at 2.",
]
examples = ["check-if-there-is-a-valid-partition-for-the-array", "ugly-number-ii", "number-of-ways-to-divide-a-long-corridor"]

