name = "Counting ways: does the order matter?"
group = "Coin change"
signals = [
    "count the ways to reach a target with a list of numbers, where 1 + 2 and 2 + 1 are different (permutations)",
    "or the same (combinations): the loop order decides which one you count",
    "loop over the target outside to count orderings, over the items outside to count combinations",
]
template_name = "Combination sum IV (orderings)"
template = '''
def combination_sum4(nums, target):
    dp = [0] * (target + 1)
    dp[0] = 1  # one way to make 0: take nothing
    for t in range(1, target + 1):  # target outside: orderings count
        for x in nums:
            if x <= t:
                dp[t] += dp[t - x]
    return dp[target]
'''
pitfalls = [
    "Target outside, items inside counts each ordering; items outside, target inside counts each combination once.",
    "dp[0] = 1 starts every count.",
    "With negative numbers a bound on the length is needed to avoid infinite counts.",
]
