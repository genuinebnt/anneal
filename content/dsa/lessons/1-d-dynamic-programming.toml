name = "Non-negative integers without consecutive ones"
note = "Count the binary numbers up to n with no two adjacent ones using Fibonacci counts per position."
template = '''
def find_integers(n):
    fib = [1, 2]  # fib[k]: valid strings of length k (no two 1s adjacent)
    for _ in range(31):
        fib.append(fib[-1] + fib[-2])
    bits = bin(n)[2:]
    total, prev = 0, 0
    for i, b in enumerate(bits):
        if b == "1":
            total += fib[len(bits) - i - 1]  # a 0 here: the rest is free
            if prev == 1:
                return total  # two ones in a row: stop
            prev = 1
        else:
            prev = 0
    return total + 1  # n itself is valid
'''

