    "sum the probabilities of the states you care about at the end",
]
template_name = "Knight probability in a chessboard"
template = '''
def knight_probability(n, k, row, column):
    moves = ((1, 2), (2, 1), (-1, 2), (-2, 1),
             (1, -2), (2, -1), (-1, -2), (-2, -1))
    cur = [[0.0] * n for _ in range(n)]
    cur[row][column] = 1.0
    for _ in range(k):
        nxt = [[0.0] * n for _ in range(n)]
        for r in range(n):
            for c in range(n):
                if cur[r][c]:
                    for dr, dc in moves:
                        a, b = r + dr, c + dc
                        if 0 <= a < n and 0 <= b < n:
                            nxt[a][b] += cur[r][c] / 8  # one of eight moves
        cur = nxt
    return sum(sum(row) for row in cur)  # the chance of being on the board
'''
pitfalls = [
    "Each move has probability 1/8; the mass that falls off the board simply disappears.",
    "Keep only two layers: the current step and the next.",
    "The answer is the total probability that remains on the board.",
]
examples = ["knight-probability-in-chessboard", "soup-servings", "new-21-game"]

