name = "Mountain array: LIS from both ends"
note = "inc[i] is the longest increasing run ending at i, dec[i] the longest decreasing one starting at i; a peak needs both above 1."
template = '''
def minimum_mountain_removals(nums):
    n = len(nums)
    inc, dec = [1] * n, [1] * n
    for i in range(n):
        for j in range(i):
            if nums[j] < nums[i]:
                inc[i] = max(inc[i], inc[j] + 1)
    for i in range(n - 1, -1, -1):
        for j in range(n - 1, i, -1):
            if nums[j] < nums[i]:
                dec[i] = max(dec[i], dec[j] + 1)
    keep = max((inc[i] + dec[i] - 1 for i in range(n)
                if inc[i] > 1 and dec[i] > 1), default=0)  # real peaks
    return n - keep
'''

[[extra.variant]]
name = "Number of longest increasing subsequences"
note = "Keep the length and the count of the best chains ending at each index."
template = '''
def find_number_of_lis(nums):
    n = len(nums)
    length, count = [1] * n, [1] * n
    for i in range(n):
        for j in range(i):
            if nums[j] < nums[i]:
                if length[j] + 1 > length[i]:
                    # a longer chain: restart the count
                    length[i], count[i] = length[j] + 1, count[j]
                elif length[j] + 1 == length[i]:
                    count[i] += count[j]  # one more chain, same length
    top = max(length)
    return sum(c for l, c in zip(length, count) if l == top)
'''

