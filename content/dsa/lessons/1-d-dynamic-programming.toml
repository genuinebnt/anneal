]
template_name = "Maximize score after n operations"
template = '''
from functools import cache
from math import gcd


def max_score(nums):
    n = len(nums)

    @cache
    def best(mask, op):  # op: the number of the pair being removed, from 1
        top = 0
        for i in range(n):
            if mask >> i & 1:
                continue
            for j in range(i + 1, n):
                if mask >> j & 1:
                    continue
                score = op * gcd(nums[i], nums[j])
                top = max(top, score + best(mask | 1 << i | 1 << j, op + 1))
        return top

    return best(0, 1)
'''
pitfalls = [
    "The mask says which items are used; the operation number follows from the mask, so it need not multiply the state.",
    "2^n states times O(n^2) pairs: fine for n up to about 14.",
    "Choose the first free item and try all partners to avoid counting the same pairing twice.",
]
examples = ["maximize-score-after-n-operations", "shortest-path-visiting-all-nodes", "stickers-to-spell-word", "optimal-account-balancing"]

[[extra.variant]]
name = "Shortest path visiting all nodes"
note = "BFS over (visited mask, current node): the first time every node is visited is the answer."
template = '''
from collections import deque


def shortest_path_length(graph):
    n = len(graph)
    full = (1 << n) - 1
    queue = deque((1 << i, i, 0) for i in range(n))  # start anywhere
    seen = {(1 << i, i) for i in range(n)}
    while queue:
        mask, u, d = queue.popleft()
        if mask == full:
            return d
        for v in graph[u]:
            state = (mask | 1 << v, v)
            if state not in seen:
                seen.add(state)
                queue.append((state[0], v, d + 1))
    return 0
'''

[[extra.variant]]
name = "Optimal account balancing"
note = "Only the nonzero balances matter: settle the first one with every later one that can take it, and recurse."
template = '''
from collections import defaultdict


def min_transfers(transactions):
    balance = defaultdict(int)
    for a, b, amount in transactions:
        balance[a] -= amount
        balance[b] += amount
    debts = [v for v in balance.values() if v]

    def settle(i):
        while i < len(debts) and debts[i] == 0:
            i += 1  # skip people who are already even
        if i == len(debts):
            return 0
        best = float("inf")
        for j in range(i + 1, len(debts)):
            if debts[i] * debts[j] < 0:  # opposite signs: they can offset
                debts[j] += debts[i]
                best = min(best, 1 + settle(i + 1))
                debts[j] -= debts[i]
        return best

    return settle(0)
'''

