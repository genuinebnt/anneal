id = "1-D Dynamic Programming:interval-games"
name = "Interval game DP: the score difference"
group = "Game and minimax DP"
signals = [
    "two players take from the ends of a row (or a pile) and both play perfectly",
    "dp[i][j] is the best score difference the player to move can force on the segment i..j",
    "the opponent's best reply is subtracted: your gain minus what the opponent then gets",
]
template_name = "Predict the winner"
template = '''
def predict_the_winner(nums):
    n = len(nums)
    # dp[i][j]: the best (mine - opponent's) on nums[i..j]
    dp = [[0] * n for _ in range(n)]
    for i in range(n):
        dp[i][i] = nums[i]
    for length in range(2, n + 1):
        for i in range(n - length + 1):
            j = i + length - 1
            dp[i][j] = max(nums[i] - dp[i + 1][j],  # take the left end
                           nums[j] - dp[i][j - 1])  # or the right end
    return dp[0][n - 1] >= 0
'''
pitfalls = [
    "Store a difference, not a score: the opponent's best result is subtracted.",
    "Fill by increasing segment length so the smaller segments are ready.",
    "A non-negative difference means the first player wins (a tie goes to player 1).",
]
examples = ["predict-the-winner", "stone-game-vii", "stone-game-v", "nim-game", "divisor-game"]

[[extra.variant]]
name = "Stone game VII"
note = "Remove an end stone and score the sum of the rest; the same difference DP with prefix sums."
template = '''
def stone_game_vii(stones):
    n = len(stones)
    pre = [0]
    for s in stones:
        pre.append(pre[-1] + s)
    dp = [[0] * n for _ in range(n)]  # best difference on i..j
    for length in range(2, n + 1):
        for i in range(n - length + 1):
            j = i + length - 1
            take_left = pre[j + 1] - pre[i + 1] - dp[i + 1][j]
            take_right = pre[j] - pre[i] - dp[i][j - 1]
            dp[i][j] = max(take_left, take_right)  # remove an end stone
    return dp[0][n - 1]
'''

