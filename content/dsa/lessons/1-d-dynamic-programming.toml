template_name = "Integer replacement"
template = '''
from functools import cache


def integer_replacement(n):
    @cache
    def steps(x):
        if x == 1:
            return 0
        if x % 2 == 0:
            return 1 + steps(x // 2)
        return 1 + min(steps(x + 1), steps(x - 1))  # try both for odd x

    return steps(n)
'''
pitfalls = [
    "Only odd numbers branch; halving is forced, so the number of states is about 2 log n.",
    "Memoise: the same number is reached along different branches.",
    "A bit trick: add 1 when the two low bits are 11 (except 3), otherwise subtract 1.",
]
examples = ["integer-replacement", "integer-break", "4-keys-keyboard", "2-keys-keyboard"]

[[extra.variant]]
name = "Integer break"
note = "Split n into at least two parts to maximise the product: use as many 3s as possible."
template = '''
def integer_break(n):
    if n <= 3:
        return n - 1  # a split is mandatory
    threes, rest = divmod(n, 3)
    if rest == 0:
        return 3**threes
    if rest == 1:
        return 3 ** (threes - 1) * 4  # replace 3 + 1 by 2 + 2
    return 3**threes * 2
'''

[[extra.variant]]
name = "2 Keys keyboard"
note = "The cost is the sum of the prime factors of n."
template = '''
def min_steps(n):
    steps, p = 0, 2
    while n > 1:
        while n % p == 0:
            steps += p  # copy all, then paste p - 1 times
            n //= p
        p += 1
    return steps
'''

