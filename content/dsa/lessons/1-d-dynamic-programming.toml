[[extra.variant]]
name = "Maximum subarray min-product"
note = "For each element as the minimum, the widest range where it is the minimum (monotonic stack) times that range's sum."
template = '''
def max_sum_min_product(nums):
    pre = [0]
    for x in nums:
        pre.append(pre[-1] + x)
    best, stack = 0, []  # stack of indexes with increasing values
    for i, x in enumerate(nums + [0]):  # a final 0 flushes the stack
        while stack and nums[stack[-1]] >= x:
            m = nums[stack.pop()]  # m is the minimum of the range
            left = stack[-1] + 1 if stack else 0
            best = max(best, m * (pre[i] - pre[left]))
        stack.append(i)
    return best % (10**9 + 7)
'''

