name = "Ugly number II (three pointers)"
note = "Each pointer marks the next multiple of 2, 3 or 5 to consider: take the smallest candidate and advance every pointer that produced it."
template = '''
def nth_ugly_number(n):
    ugly = [1]
    i2 = i3 = i5 = 0
    while len(ugly) < n:
        nxt = min(ugly[i2] * 2, ugly[i3] * 3, ugly[i5] * 5)
        ugly.append(nxt)
        if nxt == ugly[i2] * 2:
            i2 += 1
        if nxt == ugly[i3] * 3:
            i3 += 1  # advance every pointer that produced nxt
        if nxt == ugly[i5] * 5:
            i5 += 1
    return ugly[-1]
'''

