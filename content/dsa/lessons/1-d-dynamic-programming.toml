id = "1-D Dynamic Programming:digit-dp"
name = "Digit DP: count numbers up to n by their digits"
group = "Digit DP"
signals = [
    "count numbers up to n whose digits obey a rule: no two adjacent ones, all digits different, rotated digits",
    "walk the digits of n from the top, tracking whether the prefix still equals n's prefix (tight)",
    "memoise on (position, state, tight) so each state is computed once",
]
template_name = "Count special integers"
template = '''
from functools import cache


def count_special_numbers(n):
    digits = list(map(int, str(n)))

    @cache
    def go(pos, used, tight, started):
        if pos == len(digits):
            return 1 if started else 0  # a valid number (not just zeros)
        total = 0
        limit = digits[pos] if tight else 9
        for d in range(limit + 1):
            if started and used >> d & 1:
                continue  # a repeated digit
            nxt_started = started or d > 0
            total += go(pos + 1,
                        used | 1 << d if nxt_started else used,
                        tight and d == limit,
                        nxt_started)
        return total

    return go(0, 0, True, False)
'''
pitfalls = [
    "Track 'started' so leading zeros do not count as digits.",
    "tight means the digits so far equal n's prefix: the next digit is capped by n's digit.",
    "States: positions x masks x 2 x 2: tiny, so memoisation is enough.",
]
examples = ["count-special-integers", "non-negative-integers-without-consecutive-ones", "rotated-digits"]

