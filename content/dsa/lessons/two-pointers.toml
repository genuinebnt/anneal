template_name = "Sort array by parity II"
template = '''
def sort_array_by_parity_ii(nums):
    j = 1  # the next odd position
    for i in range(0, len(nums), 2):  # even positions
        if nums[i] % 2:  # an odd number sits at an even position
            while nums[j] % 2:
                j += 2  # find an odd position holding an even number
            nums[i], nums[j] = nums[j], nums[i]
    return nums
'''
pitfalls = [
    "Walk the even positions; only when one holds an odd number look for a wrong number at an odd position.",
    "The two pointers move in steps of two and never move back: linear time.",
    "A stable partition (keeping the order inside each part) needs extra space or a different method.",
]
examples = ["sort-array-by-parity-ii", "sort-array-by-parity", "rearrange-array-elements-by-sign", "partition-array-according-to-given-pivot", "move-zeroes", "apply-operations-to-an-array"]

[[extra.variant]]
name = "Rearrange by sign (alternating)"
note = "Positives at even positions and negatives at odd positions, each in the original order."
template = '''
def rearrange_array(nums):
    out = [0] * len(nums)
    pos, neg = 0, 1  # the next free even and odd position
    for x in nums:
        if x > 0:
            out[pos] = x
            pos += 2
        else:
            out[neg] = x
            neg += 2
    return out
'''

[[extra.variant]]
name = "Partition around a pivot"
note = "Smaller values, then equal, then larger, each in the original order."
template = '''
def pivot_array(nums, pivot):
    small = [x for x in nums if x < pivot]
    equal = [x for x in nums if x == pivot]
    large = [x for x in nums if x > pivot]
    return small + equal + large
'''

[[extra.variant]]
name = "Move zeroes"
note = "A writer pointer collects the non-zeros; the rest is filled with zeros."
template = '''
def move_zeroes(nums):
    write = 0
    for x in nums:
        if x:
            nums[write] = x  # keep the non-zero numbers in order
            write += 1
    for i in range(write, len(nums)):
        nums[i] = 0
'''

[[extra]]
id = "Two Pointers:nearest-sorted"
name = "Nearest on the other side of a sorted list"
group = "Pointer + binary search"
signals = [
    "the smallest radius so that every house is covered, the closest partner for each element",
    "sort both lists, and a pointer into the second list moves forward only",
    "pairs with a fixed difference or a ratio bound: one pointer per side of the pair",
]
template_name = "Heaters"
template = '''
def find_radius(houses, heaters):
    houses.sort()
    heaters.sort()
    radius, j = 0, 0
    for h in houses:
        # move to the last heater that is not past the house
        while j + 1 < len(heaters) and heaters[j + 1] <= h:
            j += 1
        nearest = abs(heaters[j] - h)
        if j + 1 < len(heaters):
            nearest = min(nearest, abs(heaters[j + 1] - h))
        radius = max(radius, nearest)  # the farthest house sets the radius
    return radius
'''
pitfalls = [
    "Houses are sorted, so the best heater index never goes back: j only increases.",
    "Check the heater just before and just after the house.",
    "The answer is the largest of the per-house distances.",
]
examples = ["heaters", "k-diff-pairs-in-an-array", "check-if-n-and-its-double-exist", "friends-of-appropriate-ages"]

[[extra.variant]]
name = "K-diff pairs"
note = "Two pointers on the sorted array, with the second always ahead of the first."
template = '''
def find_pairs(nums, k):
    nums.sort()
    count, i, j = 0, 0, 1
    while i < len(nums) and j < len(nums):
        if i == j or nums[j] - nums[i] < k:
            j += 1
        elif nums[j] - nums[i] > k:
            i += 1
        else:
            count += 1
            i += 1
            while i < len(nums) and nums[i] == nums[i - 1]:
                i += 1  # count each distinct pair once
    return count
'''

[[extra.variant]]
name = "Friends of appropriate ages"
note = "Sort the ages; for each age the valid partners are a contiguous range, found with two pointers."
template = '''
def num_friend_requests(ages):
    ages.sort()
    total, lo, hi = 0, 0, 0
    for i, a in enumerate(ages):
        if a <= 14:
            continue  # nobody is allowed to be asked
        while ages[lo] <= 0.5 * a + 7:
            lo += 1  # too young
        while hi + 1 < len(ages) and ages[hi + 1] <= a:
            hi += 1  # not older than a
        total += hi - lo  # everybody in [lo, hi] except a itself
    return total
'''

[[extra]]
id = "Two Pointers:k-sum-pairs"
walk = "pointers-opposite"
name = "Pair up for a target: sort, then two ends"
group = "Pointers and greedy"
signals = [
    "the most pairs that add to k, or pair the numbers to minimise the largest pair sum",
    "sort; the smallest is best paired with the largest",
    "equal skill teams: every pair must have the same sum",
]
template_name = "Max number of k-sum pairs"
template = '''
def max_operations(nums, k):
    nums.sort()
    lo, hi, count = 0, len(nums) - 1, 0
    while lo < hi:
        s = nums[lo] + nums[hi]
        if s == k:
            count += 1  # remove the pair
            lo, hi = lo + 1, hi - 1
        elif s < k:
            lo += 1  # too small: use a bigger left number
        else:
            hi -= 1
    return count
'''
pitfalls = [
    "A pair uses two different elements: stop when the pointers meet.",
    "A hash map of counts does the same in one pass without sorting.",
    "To minimise the largest pair sum pair the smallest with the largest.",
]
examples = ["max-number-of-k-sum-pairs", "minimize-maximum-pair-sum-in-array", "divide-players-into-teams-of-equal-skill", "largest-positive-integer-that-exists-with-its-negative"]

[[extra.variant]]
name = "Minimize the maximum pair sum"
note = "After sorting, pair the i-th smallest with the i-th largest and take the largest sum."
template = '''
def min_pair_sum(nums):
    nums.sort()
    return max(nums[i] + nums[-1 - i] for i in range(len(nums) // 2))
'''

[[extra.variant]]
name = "Teams of equal skill"
note = "Every pair must add up to the same total: the smallest with the largest fixes it."
template = '''
def divide_players(skill):
    skill.sort()
    target = skill[0] + skill[-1]
    total = 0
    for i in range(len(skill) // 2):
        if skill[i] + skill[-1 - i] != target:
            return -1
        total += skill[i] * skill[-1 - i]  # the chemistry of the team
    return total
'''

[[extra]]
id = "Two Pointers:expand-center"
name = "Expand around each center"
group = "Center expansion"
signals = [
    "the longest palindromic substring, or how many palindromic substrings there are",
    "a palindrome grows outward from its center: 2n - 1 centers (letters and gaps between letters)",
    "O(n^2) time and O(1) memory, simpler than a DP table",
]
template_name = "Longest palindromic substring"
template = '''
def longest_palindrome(s):
    best = ""

    def expand(lo, hi):
        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:
            lo, hi = lo - 1, hi + 1  # grow while the ends match
        return s[lo + 1:hi]

    for i in range(len(s)):
        for cand in (expand(i, i), expand(i, i + 1)):  # odd, even
            if len(cand) > len(best):
                best = cand
    return best
'''
pitfalls = [
    "Try two kinds of centers: a letter (odd length) and the gap between two letters (even length).",
    "Return the substring between the pointers after the loop: they have gone one step too far.",
    "Manacher's algorithm gets it down to O(n).",
]
examples = ["longest-palindromic-substring", "palindromic-substrings"]

[[extra.variant]]
name = "Count palindromic substrings"
note = "Every successful step of an expansion is one more palindrome."
template = '''
def count_substrings(s):
    count = 0
    for center in range(2 * len(s) - 1):
        lo = center // 2
        hi = lo + center % 2  # even centers start with hi = lo + 1
        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:
            count += 1  # the current window is a palindrome
            lo, hi = lo - 1, hi + 1
    return count
'''

[[extra]]
id = "Two Pointers:order-pieces"
name = "Pieces that keep their relative order"
group = "String pointers"
signals = [
    "can one string become another when pieces (L and R, or letters) may only move in one direction",
    "the pieces appear in the same order in both strings, and each can only move one way",
    "two pointers skip the blanks and compare piece by piece, checking their positions",
]
template_name = "Move pieces to obtain a string"
template = '''
def can_change(start, target):
    i = j = 0
    n = len(start)
    while i < n or j < n:
        while i < n and start[i] == "_":
            i += 1  # skip blanks in both strings
        while j < n and target[j] == "_":
            j += 1
        if i == n or j == n:
            return i == j  # both must run out together
        if start[i] != target[j]:
            return False  # a different piece
        if start[i] == "L" and i < j:
            return False  # L can only move left
        if start[i] == "R" and i > j:
            return False  # R can only move right
        i, j = i + 1, j + 1
    return True
'''
pitfalls = [
    "Without the blanks both strings must be the same sequence of pieces.",
    "An L can only move to the left: its target position must not be to the right of its start.",
    "Advance both pointers after a matching piece.",
]
examples = ["move-pieces-to-obtain-a-string", "swap-adjacent-in-lr-string", "make-string-a-subsequence-using-cyclic-increments"]

[[extra.variant]]
name = "Subsequence with cyclic increments"
note = "A letter of str1 may match its target or the one before it (z follows a)."
template = '''
def can_make_subsequence(str1, str2):
    j = 0
    for ch in str1:
        nxt = chr((ord(ch) - 97 + 1) % 26 + 97)  # the letter after ch
        if j < len(str2) and str2[j] in (ch, nxt):
            j += 1  # matched, possibly after one increment
    return j == len(str2)
'''

[[extra]]
id = "Two Pointers:compress"
name = "Compress runs in place"
group = "In-place dedupe and compaction"
signals = [
    "rewrite a character array as letter and count, in the same array",
    "a read pointer finds the end of each run; a write pointer lays down the result",
    "the write pointer can never overtake the read pointer",
]
template_name = "String compression"
template = '''
def compress(chars):
    write = read = 0
    while read < len(chars):
        ch, start = chars[read], read
        while read < len(chars) and chars[read] == ch:
            read += 1  # the end of this run
        chars[write] = ch
        write += 1
        if read - start > 1:  # write the count digit by digit
            for d in str(read - start):
                chars[write] = d
                write += 1
    return write
'''
pitfalls = [
    "Write the letter first, and the count only when the run is longer than one.",
    "A count of 12 takes two characters: write each digit separately.",
    "The write position never passes the read position, so it is safe in place.",
]
examples = ["string-compression", "string-compression-iii"]

[[extra.variant]]
name = "String compression III"
note = "Runs longer than 9 are split into runs of at most 9."
template = '''
def compressed_string(word):
    out, i = [], 0
    while i < len(word):
        j = i
        while j < len(word) and word[j] == word[i] and j - i < 9:
            j += 1  # at most 9 equal letters
        out.append(str(j - i) + word[i])
        i = j
    return "".join(out)
'''

[[extra]]
id = "Two Pointers:shrink-ends"
walk = "pointers-opposite"
name = "Shrink matching ends"
group = "Opposite-end pointers"
signals = [
    "delete a matching prefix and suffix again and again, and ask for what remains",
    "two strings that are equal after inserting a sentence: compare the common prefix and suffix of the words",
    "pointers at both ends, moving inward while the ends agree",
]
template_name = "Minimum length after deleting similar ends"
template = '''
def minimum_length(s):
    lo, hi = 0, len(s) - 1
    while lo < hi and s[lo] == s[hi]:
        ch = s[lo]
        while lo <= hi and s[lo] == ch:
            lo += 1  # delete the whole prefix of this letter
        while hi >= lo and s[hi] == ch:
            hi -= 1  # and the whole suffix
    return hi - lo + 1
'''
pitfalls = [
    "Delete all copies of the letter at each end, not just one.",
    "Keep lo <= hi when moving: the two ends can eat the whole string.",
    "The remaining length is hi - lo + 1, which can be 0.",
]
examples = ["minimum-length-of-string-after-deleting-similar-ends", "sentence-similarity-iii", "valid-palindrome-ii"]

[[extra.variant]]
name = "Sentence similarity III"
note = "One sentence is the other with a sentence inserted: match words from the front, then from the back."
template = '''
def are_sentences_similar(sentence1, sentence2):
    a, b = sentence1.split(), sentence2.split()
    if len(a) > len(b):
        a, b = b, a  # a is the shorter one
    i = 0
    while i < len(a) and a[i] == b[i]:
        i += 1  # the common prefix
    j = 0
    while j < len(a) - i and a[-1 - j] == b[-1 - j]:
        j += 1  # the common suffix
    return i + j == len(a)
'''

[[extra]]
id = "Two Pointers:tokens"
name = "Walk two strings by tokens"
group = "String pointers"
signals = [
    "compare version numbers, or insert spaces at given positions in one pass",
    "split on a separator and compare piece by piece, treating a missing piece as zero",
    "a pointer into the list of positions moves forward while the text index advances",
]
template_name = "Compare version numbers"
template = '''
def compare_version(version1, version2):
    a = version1.split(".")
    b = version2.split(".")
    for i in range(max(len(a), len(b))):
        x = int(a[i]) if i < len(a) else 0  # a missing part counts as 0
        y = int(b[i]) if i < len(b) else 0
        if x != y:
            return 1 if x > y else -1
    return 0
'''
pitfalls = [
    "Compare as integers: '01' and '1' are equal.",
    "Pad the shorter list with zeros: '1.0' equals '1'.",
    "Return at the first difference.",
]
examples = ["compare-version-numbers", "adding-spaces-to-a-string"]

[[extra.variant]]
name = "Adding spaces to a string"
note = "A pointer into the sorted list of positions; insert a space before each listed index."
template = '''
def add_spaces(s, spaces):
    out, j = [], 0
    for i, ch in enumerate(s):
        if j < len(spaces) and i == spaces[j]:
            out.append(" ")
            j += 1  # the next position to split at
        out.append(ch)
    return "".join(out)
'''

[[extra]]
id = "Two Pointers:fill-back"
name = "Fill from the back"
group = "Same-direction pointers (reader / writer, fast / slow)"
signals = [
    "merge into an array that has free space at the end, or duplicate items in place",
    "writing from the front would overwrite values you still need: write from the back",
    "the read pointers start at the last real element of each input",
]
template_name = "Merge sorted array"
template = '''
def merge(nums1, m, nums2, n):
    i, j, k = m - 1, n - 1, m + n - 1  # last element of each, last slot
    while j >= 0:  # what is left of nums1 is already in place
        if i >= 0 and nums1[i] > nums2[j]:
            nums1[k] = nums1[i]
            i -= 1
        else:
            nums1[k] = nums2[j]
            j -= 1
        k -= 1
'''
pitfalls = [
    "Fill from the largest: the free slots are at the end, so nothing is overwritten before it is read.",
    "Stop when nums2 is used up: the rest of nums1 is already sorted and in place.",
    "Merging from the front would need a copy of nums1.",
]
examples = ["merge-sorted-array", "duplicate-zeros"]

[[extra.variant]]
name = "Duplicate zeros"
note = "Count how many slots the result needs, then write from the back, skipping what falls off the end."
template = '''
def duplicate_zeros(arr):
    n, zeros = len(arr), arr.count(0)
    for i in range(n - 1, -1, -1):
        pos = i + zeros  # where arr[i] goes in the expanded array
        if arr[i] == 0:
            zeros -= 1
            if pos < n:
                arr[pos] = 0
            pos -= 1  # the first copy of the zero
        if pos < n:
            arr[pos] = arr[i]
'''

