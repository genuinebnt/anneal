pattern = "Two Pointers"
intro = "Two indexes move through the data so one pass does the work of a nested loop. They either start at the two ends and move toward each other, or one reads ahead while the other writes behind. The skill is knowing which pointer to move, and why moving it can't skip the answer."
groups = ["Opposite-end pointers", "Same-direction pointers (reader / writer, fast / slow)", "K-sum on sorted arrays", "Merge-like walks", "Linked-list pointers (cross-reference: the Linked List track)", "String pointers", "Partition pointers", "Pointer + binary search", "Rotation and reversal", "In-place dedupe and compaction", "Center expansion", "Pointers and greedy"]










[[technique]]
id = "Two Pointers:in-place"
walk = "pointers-same"
group = "String pointers"
signals = [
    "remove or compact items inside the array, using no extra array",
    "keep the first occurrence, drop a value, or move zeros to the end",
    "return the new length, and only the first part of the array matters",
]
template = '''
def remove_duplicates(nums):
    # nums is sorted. Keep one of each value, in place; return the count.
    write = 0
    for read in range(len(nums)):
        if write == 0 or nums[read] != nums[write - 1]:
            nums[write] = nums[read]
            write += 1
    return write
'''
pitfalls = [
    "read is always at or ahead of write, so you never overwrite something you still need.",
    "Compare with the last item KEPT (nums[write - 1]), not with nums[read - 1].",
    "Return the length. The tail beyond it can hold anything.",
]

[[technique]]
id = "Two Pointers:opposite"
walk = "pointers-opposite"
group = "String pointers"
signals = [
    "a palindrome, or a pair that depends on both ends",
    "the array is sorted and you want a pair with some property",
    "move the left pointer right or the right pointer left, depending on a comparison",
]
template = '''
def is_palindrome(s):
    lo, hi = 0, len(s) - 1
    while lo < hi:
        if not s[lo].isalnum():
            lo += 1
        elif not s[hi].isalnum():
            hi -= 1
        elif s[lo].lower() != s[hi].lower():
            return False
        else:
            lo, hi = lo + 1, hi - 1
    return True
'''
pitfalls = [
    "Use lo < hi. When they meet, the middle character matches itself.",
    "Skip characters you must ignore before comparing, and keep the bounds check in every step.",
    "For a sorted pair-sum, move lo up when the sum is too small and hi down when it is too big. Neither move can skip an answer.",
]

[[technique]]
id = "Two Pointers:merge-sorted"
group = "K-sum on sorted arrays"
signals = [
    "combine two sorted arrays or strings into one",
    "the first array has spare space at its end, so fill it from the back",
    "take whichever front item is smaller, then advance that pointer",
]
template = '''
def merge(nums1, m, nums2, n):
    # nums1 has m values then n spare slots; merge nums2 into it, in place.
    i, j, k = m - 1, n - 1, m + n - 1
    while j >= 0:
        if i >= 0 and nums1[i] > nums2[j]:
            nums1[k] = nums1[i]
            i -= 1
        else:
            nums1[k] = nums2[j]
            j -= 1
        k -= 1
'''
pitfalls = [
    "Fill from the back so you don't overwrite values of nums1 you haven't moved yet.",
    "Stop when nums2 is used up. What is left of nums1 is already in place.",
    "To merge strings alternately, advance both pointers each step instead of comparing.",
]

[[technique]]
id = "Two Pointers:simulate"
group = "Pointer + binary search"
signals = [
    "build a new string or list by following two sequences together",
    "one pointer walks the input, another walks the list of edits",
    "insert, replace or skip at given positions",
]
template = '''
def add_spaces(s, spaces):
    # spaces is sorted: insert a space before s[i] for each i in it.
    out, j = [], 0
    for i, ch in enumerate(s):
        if j < len(spaces) and spaces[j] == i:
            out.append(" ")
            j += 1
        out.append(ch)
    return "".join(out)
'''
pitfalls = [
    "Build in a list and join once. Repeated string concatenation copies each time.",
    "Check j < len(spaces) before reading spaces[j].",
    "Two pointers over two sorted sequences is the same shape as a merge.",
]

[[technique]]
id = "Two Pointers:ksum"
walk = "pointers-opposite"
group = "Opposite-end pointers"
signals = [
    "find all unique pairs, triples or quadruples that sum to a target",
    "sort, fix one item, and find the rest with two pointers",
    "duplicates in the answer must be avoided",
]
template = '''
def three_sum(nums):
    nums.sort()
    out = []
    for i in range(len(nums) - 2):
        if i and nums[i] == nums[i - 1]:
            continue  # same first value as before: skip
        lo, hi = i + 1, len(nums) - 1
        while lo < hi:
            total = nums[i] + nums[lo] + nums[hi]
            if total < 0:
                lo += 1
            elif total > 0:
                hi -= 1
            else:
                out.append([nums[i], nums[lo], nums[hi]])
                lo += 1
                while lo < hi and nums[lo] == nums[lo - 1]:
                    lo += 1
    return out
'''
pitfalls = [
    "Skip repeated values for the fixed item and, after a hit, for the left pointer. That removes duplicate triples.",
    "After sorting, a small sum means move lo up, a big sum means move hi down.",
    "For four numbers add another loop around this one. The pattern is: sort, fix k - 2 items, two pointers.",
]

[[technique]]
id = "Two Pointers:pair-count"
group = "K-sum on sorted arrays"
signals = [
    "count subsets or pairs whose smallest and largest satisfy a condition",
    "once sorted, only the minimum and maximum of a group matter",
    "everything between them can be included or not",
]
template = '''
def num_subseq(nums, target):
    # Count non-empty subsequences whose min + max <= target.
    nums.sort()
    MOD = 10**9 + 7
    powers = [1] * (len(nums) + 1)
    for i in range(1, len(powers)):
        powers[i] = powers[i - 1] * 2 % MOD
    count, lo, hi = 0, 0, len(nums) - 1
    while lo <= hi:
        if nums[lo] + nums[hi] <= target:
            count += powers[hi - lo]  # items between lo and hi: in or out
            lo += 1
        else:
            hi -= 1
    return count % MOD
'''
pitfalls = [
    "Fix the smallest element at lo. Every subset of the items between lo and hi can be added, which is 2 to the power hi - lo.",
    "Precompute the powers of 2, because pow in a loop is slower and the numbers get huge.",
    "Order within a subsequence doesn't matter for min and max, so sorting is safe.",
]

[[technique]]
id = "Two Pointers:greedy-pair"
group = "Pointers and greedy"
signals = [
    "pair the heaviest with the lightest, or the biggest with the smallest",
    "each group holds at most two items under a limit",
    "the fewest groups",
]
template = '''
def num_boats(people, limit):
    people = sorted(people)
    lo, hi, boats = 0, len(people) - 1, 0
    while lo <= hi:
        if people[lo] + people[hi] <= limit:
            lo += 1  # the lightest rides along with the heaviest
        hi -= 1
        boats += 1
    return boats
'''
pitfalls = [
    "The heaviest person always takes a boat. Only the lightest is optional.",
    "If the heaviest can't pair with the lightest, they can't pair with anyone.",
    "Use lo <= hi so a single person left in the middle still gets a boat.",
]

[[technique]]
id = "Two Pointers:running-max"
group = "Opposite-end pointers"
signals = [
    "the amount each position can hold depends on the tallest item on each side",
    "two scans (left maxima, right maxima) would work, and you want one pass",
    "the smaller of the two sides decides the answer at that end",
]
template = '''
def trap(height):
    lo, hi = 0, len(height) - 1
    left_max = right_max = water = 0
    while lo < hi:
        if height[lo] < height[hi]:  # the right side is tall enough
            left_max = max(left_max, height[lo])
            water += left_max - height[lo]
            lo += 1
        else:
            right_max = max(right_max, height[hi])
            water += right_max - height[hi]
            hi -= 1
    return water
'''
pitfalls = [
    "Move the pointer at the SMALLER side. That side's water level is fixed by its own maximum, since the other side is taller.",
    "Update the running maximum before adding the water, so the water is never negative.",
    "The version with two arrays (left_max[i], right_max[i]) is easier to explain. Offer it first.",
]

[[extra]]
id = "Two Pointers:triples-count"
name = "Count triples or pairs under a bound"
group = "K-sum on sorted arrays"
signals = [
    "how many triples form a triangle, have a sum below a target, or have a sum closest to it",
    "sort, fix one element, and move two pointers: when a pair works, every pair between the pointers works too",
    "a counted pair (lo, hi) means all of lo..hi - 1 pair with hi",
]
template_name = "Valid triangle number"
template = '''
def triangle_number(nums):
    nums.sort()
    count = 0
    for k in range(len(nums) - 1, 1, -1):  # nums[k] is the longest side
        lo, hi = 0, k - 1
        while lo < hi:
            if nums[lo] + nums[hi] > nums[k]:
                count += hi - lo  # every lo..hi-1 works with hi
                hi -= 1
            else:
                lo += 1
    return count
'''
pitfalls = [
    "Fix the largest side: then the triangle rule needs only the two smaller sides to add up to more than it.",
    "When nums[lo] + nums[hi] is big enough, all indexes from lo to hi - 1 work too: add hi - lo.",
    "Sorting costs O(n log n); the scan is O(n^2).",
]
examples = ["valid-triangle-number", "3sum-closest", "3sum-smaller", "number-of-arithmetic-triplets"]

[[extra.variant]]
name = "3Sum closest"
note = "Fix one element and move two pointers towards the target, remembering the closest sum."
template = '''
def three_sum_closest(nums, target):
    nums.sort()
    best = nums[0] + nums[1] + nums[2]
    for i in range(len(nums) - 2):
        lo, hi = i + 1, len(nums) - 1
        while lo < hi:
            s = nums[i] + nums[lo] + nums[hi]
            if abs(s - target) < abs(best - target):
                best = s
            if s < target:
                lo += 1
            elif s > target:
                hi -= 1
            else:
                return s  # an exact hit
    return best
'''

[[extra.variant]]
name = "3Sum smaller"
note = "When the sum is below the target, every partner between lo and hi works."
template = '''
def three_sum_smaller(nums, target):
    nums.sort()
    count = 0
    for i in range(len(nums) - 2):
        lo, hi = i + 1, len(nums) - 1
        while lo < hi:
            if nums[i] + nums[lo] + nums[hi] < target:
                count += hi - lo  # (lo, lo+1 .. hi) all work
                lo += 1
            else:
                hi -= 1
    return count
'''

[[extra.variant]]
name = "Arithmetic triplets"
note = "A set of the values makes each (x, x + d, x + 2d) test O(1)."
template = '''
def arithmetic_triplets(nums, diff):
    seen = set(nums)
    return sum(1 for x in nums if x + diff in seen and x + 2 * diff in seen)
'''

[[extra]]
id = "Two Pointers:compare-back"
name = "Compare from the end, skipping as you go"
group = "String pointers"
signals = [
    "compare two strings after backspaces, or check a typed name against the real one",
    "a pointer on each string, walking backwards; a skip counter handles the characters that do not count",
    "O(1) extra memory, unlike building the final strings with a stack",
]
template_name = "Backspace string compare"
template = '''
def backspace_compare(s, t):
    def next_char(x, i):  # the next kept character at or before i
        skip = 0
        while i >= 0:
            if x[i] == "#":
                skip += 1
            elif skip:
                skip -= 1  # this letter was erased
            else:
                return i
            i -= 1
        return -1

    i, j = len(s) - 1, len(t) - 1
    while True:
        i, j = next_char(s, i), next_char(t, j)
        if i < 0 or j < 0:
            return i < 0 and j < 0  # both exhausted at the same time
        if s[i] != t[j]:
            return False
        i, j = i - 1, j - 1
'''
pitfalls = [
    "Walk from the end: a backspace affects what comes before it, so reading backwards you know what to skip.",
    "Both strings must end at the same time: check both indexes after skipping.",
    "A stack version is simpler but uses O(n) memory.",
]
examples = ["backspace-string-compare", "long-pressed-name", "valid-word-abbreviation", "is-subsequence"]

[[extra.variant]]
name = "Long pressed name"
note = "Match letters in order; an extra copy of the previous letter is allowed in the typed string."
template = '''
def is_long_pressed_name(name, typed):
    i = 0
    for j, ch in enumerate(typed):
        if i < len(name) and name[i] == ch:
            i += 1  # the next expected letter
        elif j == 0 or typed[j - 1] != ch:
            return False  # a different letter that is not a long press
    return i == len(name)
'''

[[extra.variant]]
name = "Valid word abbreviation"
note = "Read digits as a number to skip; letters must match exactly. A leading zero is not allowed."
template = '''
def valid_word_abbreviation(word, abbr):
    i = j = 0
    while i < len(word) and j < len(abbr):
        if abbr[j].isdigit():
            if abbr[j] == "0":
                return False  # no leading zero
            num = 0
            while j < len(abbr) and abbr[j].isdigit():
                num = num * 10 + int(abbr[j])
                j += 1
            i += num  # skip that many letters
        else:
            if word[i] != abbr[j]:
                return False
            i, j = i + 1, j + 1
    return i == len(word) and j == len(abbr)
'''

[[extra]]
id = "Two Pointers:merge-scan"
name = "Merge-like scans over two sorted lists"
group = "Merge-like walks"
signals = [
    "combine two sorted lists of (key, value) pairs, summing equal keys",
    "find the first time slot that fits both calendars",
    "advance the pointer of the smaller key; when keys are equal use both and advance both",
]
template_name = "Merge two 2D arrays by summing"
template = '''
def merge_arrays(nums1, nums2):
    i = j = 0
    out = []
    while i < len(nums1) and j < len(nums2):
        (k1, v1), (k2, v2) = nums1[i], nums2[j]
        if k1 == k2:
            out.append([k1, v1 + v2])  # same key: add
            i, j = i + 1, j + 1
        elif k1 < k2:
            out.append([k1, v1])
            i += 1
        else:
            out.append([k2, v2])
            j += 1
    out.extend(nums1[i:])  # one list is left
    out.extend(nums2[j:])
    return out
'''
pitfalls = [
    "Equal keys advance both pointers; otherwise advance the one with the smaller key.",
    "After the loop at most one list has items left: append the rest.",
    "Inputs must be sorted by key; sort first if they are not.",
]
examples = ["merge-two-2d-arrays-by-summing-values", "meeting-scheduler", "product-of-two-run-length-encoded-arrays", "merge-sorted-array"]

[[extra.variant]]
name = "Meeting scheduler"
note = "The overlap of two slots is [max of starts, min of ends]; advance the slot that ends first."
template = '''
def min_available_duration(slots1, slots2, duration):
    slots1.sort()
    slots2.sort()
    i = j = 0
    while i < len(slots1) and j < len(slots2):
        start = max(slots1[i][0], slots2[j][0])
        end = min(slots1[i][1], slots2[j][1])
        if end - start >= duration:
            return [start, start + duration]  # the earliest fit
        if slots1[i][1] < slots2[j][1]:
            i += 1  # this slot ends first: nothing later can use it
        else:
            j += 1
    return []
'''

[[extra.variant]]
name = "Product of run-length encoded arrays"
note = "Walk both lists of (value, count) pairs; consume the smaller count and merge equal products."
template = '''
def find_rle_product(encoded1, encoded2):
    i = j = 0
    left1, left2 = encoded1[0][1], encoded2[0][1]  # counts left in each run
    out = []
    while i < len(encoded1) and j < len(encoded2):
        take = min(left1, left2)
        prod = encoded1[i][0] * encoded2[j][0]
        if out and out[-1][0] == prod:
            out[-1][1] += take  # same value as the last run
        else:
            out.append([prod, take])
        left1 -= take
        left2 -= take
        if left1 == 0:
            i += 1
            left1 = encoded1[i][1] if i < len(encoded1) else 0
        if left2 == 0:
            j += 1
            left2 = encoded2[j][1] if j < len(encoded2) else 0
    return out
'''

[[extra]]
id = "Two Pointers:reverse-in-place"
name = "Reverse in place with two pointers"
group = "Rotation and reversal"
signals = [
    "reverse only the vowels or only the letters of a string, every k characters, or each word",
    "a pointer from each end; skip positions that do not take part; swap and move both inward",
    "reversing a whole string then each word reverses the order of the words",
]
template_name = "Reverse vowels of a string"
template = '''
def reverse_vowels(s):
    chars, vowels = list(s), set("aeiouAEIOU")
    lo, hi = 0, len(chars) - 1
    while lo < hi:
        if chars[lo] not in vowels:
            lo += 1  # skip non-vowels on the left
        elif chars[hi] not in vowels:
            hi -= 1
        else:
            chars[lo], chars[hi] = chars[hi], chars[lo]
            lo, hi = lo + 1, hi - 1
    return "".join(chars)
'''
pitfalls = [
    "Move only the pointer that points to a character that does not take part, then swap when both do.",
    "Strings are immutable in Python: work on a list of characters.",
    "A swap moves both pointers; the loop ends when they meet or cross.",
]
examples = ["reverse-vowels-of-a-string", "reverse-only-letters", "reverse-string-ii", "reverse-words-in-a-string-iii", "reverse-words-in-a-string"]

[[extra.variant]]
name = "Reverse only letters"
note = "The same skipping, with isalpha as the test."
template = '''
def reverse_only_letters(s):
    chars = list(s)
    lo, hi = 0, len(chars) - 1
    while lo < hi:
        if not chars[lo].isalpha():
            lo += 1
        elif not chars[hi].isalpha():
            hi -= 1
        else:
            chars[lo], chars[hi] = chars[hi], chars[lo]
            lo, hi = lo + 1, hi - 1
    return "".join(chars)
'''

[[extra.variant]]
name = "Reverse string II (every 2k)"
note = "Reverse the first k of every block of 2k characters."
template = '''
def reverse_str(s, k):
    chars = list(s)
    for start in range(0, len(chars), 2 * k):
        chars[start:start + k] = chars[start:start + k][::-1]
    return "".join(chars)
'''

[[extra.variant]]
name = "Reverse each word"
note = "Reverse the characters of each word, keeping the order of the words."
template = '''
def reverse_words(s):
    return " ".join(word[::-1] for word in s.split(" "))
'''

[[extra]]
id = "Two Pointers:fill-larger"
name = "Sorted input: fill the answer from the larger end"
group = "Opposite-end pointers"
signals = [
    "squares or a polynomial of a sorted array: the largest values are at the two ends",
    "two pointers at the ends choose the larger value and write it from the back of the result",
    "negative numbers make the order of squares V-shaped",
]
template_name = "Squares of a sorted array"
template = '''
def sorted_squares(nums):
    out = [0] * len(nums)
    lo, hi = 0, len(nums) - 1
    for pos in range(len(nums) - 1, -1, -1):  # fill from the largest
        if abs(nums[lo]) > abs(nums[hi]):
            out[pos] = nums[lo] * nums[lo]
            lo += 1
        else:
            out[pos] = nums[hi] * nums[hi]
            hi -= 1
    return out
'''
pitfalls = [
    "The largest square is at one of the two ends: compare absolute values.",
    "Write the result from the back so it comes out ascending.",
    "A quadratic with a positive leading coefficient is the same shape: the largest values are at the ends.",
]
examples = ["squares-of-a-sorted-array", "sort-transformed-array"]

[[extra.variant]]
name = "Sort transformed array"
note = "For a x^2 + b x + c: if a > 0 the extremes are at the ends (fill from the back); if a < 0 fill from the front."
template = '''
def sort_transformed_array(nums, a, b, c):
    def f(x):
        return a * x * x + b * x + c

    out = [0] * len(nums)
    lo, hi = 0, len(nums) - 1
    if a >= 0:
        for pos in range(len(nums) - 1, -1, -1):  # largest at the ends
            if f(nums[lo]) > f(nums[hi]):
                out[pos] = f(nums[lo])
                lo += 1
            else:
                out[pos] = f(nums[hi])
                hi -= 1
    else:
        for pos in range(len(nums)):  # smallest values are at the ends
            if f(nums[lo]) < f(nums[hi]):
                out[pos] = f(nums[lo])
                lo += 1
            else:
                out[pos] = f(nums[hi])
                hi -= 1
    return out
'''

[[extra]]
id = "Two Pointers:partition-in-place"
name = "Partition in place with two pointers"
group = "Partition pointers"
signals = [
    "put the evens before the odds, the zeros at the end, or place numbers at even and odd positions",
    "one pointer scans, another marks the next slot to fill",
    "positions with a fixed parity: two pointers, one for each kind of slot",
