[[extra.variant]]
name = "Number of digit one"
note = "For each place, count how many numbers up to n have a 1 there from the high part, the digit and the low part."
template = '''
def count_digit_one(n):
    total, place = 0, 1
    while place <= n:
        high, cur, low = n // (place * 10), n // place % 10, n % place
        if cur == 0:
            total += high * place
        elif cur == 1:
            total += high * place + low + 1
        else:
            total += (high + 1) * place
        place *= 10
    return total
'''

