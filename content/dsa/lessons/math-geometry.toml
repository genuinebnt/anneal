pattern = "Math & Geometry"
intro = "These problems are less about a data structure and more about careful arithmetic and indexing: converting number systems, counting with a formula, moving things around a matrix. The edge cases (zero, negatives, overflow, one row or column) are where they are won or lost. Work a tiny example by hand before coding."
