template_name = "Count good numbers"
template = '''
def count_good_numbers(n):
    mod = 10**9 + 7
    evens, odds = (n + 1) // 2, n // 2  # even and odd positions
    # even positions: 5 digits (0, 2, 4, 6, 8); odd positions: 4 primes
    return pow(5, evens, mod) * pow(4, odds, mod) % mod
'''
pitfalls = [
    "Count positions of each kind first, then raise the number of choices to that power.",
    "pow(base, exp, mod) is fast modular exponentiation; do not compute the huge power first.",
    "Reduce modulo after each multiplication when working by hand.",
]
