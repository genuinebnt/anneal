def monkey_move(n):
    mod = 10**9 + 7
    return (pow(2, n, mod) - 2) % mod
'''

[[extra.variant]]
name = "Super pow"
note = "a ^ [d1 d2 ...]: process the digits from the left, raising to 10 each time."
template = '''
def super_pow(a, b):
    mod, result = 1337, 1
    a %= mod
    for digit in b:
        # result ^ 10 * a ^ digit
        result = pow(result, 10, mod) * pow(a, digit, mod) % mod
    return result
'''

[[extra]]
id = "Math & Geometry:slopes"
name = "Slopes in a hash map: lines through points"
group = "Geometry"
signals = [
    "the most points on one line, or counting pairs of points at the same distance",
    "fix one point and group the others by direction or by distance in a hash map",
    "a slope as a reduced fraction (dy / g, dx / g) avoids float errors",
]
template_name = "Maximum points on a line"
template = '''
from collections import Counter
from math import gcd


def max_points(points):
    best = min(len(points), 2)
    for i, (x1, y1) in enumerate(points):
        slopes = Counter()
        for x2, y2 in points[i + 1:]:
            dx, dy = x2 - x1, y2 - y1
            g = gcd(dx, dy)
            dx, dy = dx // g, dy // g
            if dx < 0 or (dx == 0 and dy < 0):
                dx, dy = -dx, -dy  # one name for each direction
            slopes[(dx, dy)] += 1
        if slopes:
            best = max(best, max(slopes.values()) + 1)  # + the point
    return best
'''
pitfalls = [
    "Reduce the slope by the gcd and fix the sign: (1, 2) and (-1, -2) are the same direction.",
    "Never use floating-point slopes: they can collide or differ by rounding.",
    "Only look at points after i: lines through earlier points were counted already.",
]
examples = ["max-points-on-a-line", "number-of-boomerangs", "minimum-area-rectangle", "valid-square"]

[[extra.variant]]
name = "Number of boomerangs"
note = "For each point count the others by squared distance; k points at the same distance make k * (k - 1) boomerangs."
template = '''
from collections import Counter


def number_of_boomerangs(points):
    total = 0
    for x1, y1 in points:
        dist = Counter((x2 - x1) ** 2 + (y2 - y1) ** 2 for x2, y2 in points)
        total += sum(k * (k - 1) for k in dist.values())  # ordered pairs
    return total
'''

[[extra.variant]]
name = "Minimum area rectangle"
note = "Remember seen pairs of points in a column; two columns that share two rows form a rectangle."
template = '''
def min_area_rect(points):
    cols, last, best = {}, {}, float("inf")
    for x, y in sorted(points):
        cols.setdefault(x, []).append(y)
    for x in sorted(cols):
        ys = cols[x]
        for i in range(len(ys)):
            for j in range(i):
                pair = (ys[j], ys[i])
                if pair in last:  # the same two rows in an earlier column
                    best = min(best, (x - last[pair]) * (ys[i] - ys[j]))
                last[pair] = x
    return best if best != float("inf") else 0
'''

