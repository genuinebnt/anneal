[[extra]]
id = "Math & Geometry:encode-state"
name = "Old and new state in one cell"
group = "Matrix on grids"
signals = [
    "update every cell of a grid at once from its neighbours, in place",
    "write the next state into spare bits of the same cell so that the old state is still readable",
    "a second pass drops the old bit",
]
template_name = "Game of life"
template = '''
def game_of_life(board):
    rows, cols = len(board), len(board[0])
    for i in range(rows):
        for j in range(cols):
            live = sum(board[a][b] & 1  # the old state is bit 0
                       for a in range(max(0, i - 1), min(rows, i + 2))
                       for b in range(max(0, j - 1), min(cols, j + 2))
                       if (a, b) != (i, j))
            if live == 3 or (board[i][j] & 1 and live == 2):
                board[i][j] |= 2  # the new state is bit 1
    for i in range(rows):
        for j in range(cols):
            board[i][j] >>= 1  # keep only the new state
'''
pitfalls = [
    "Read neighbours with & 1 (the old state) while writing into bit 1.",
    "A final pass shifts every cell right by one to drop the old state.",
    "Without bits you can copy the board: simpler, but O(rows * cols) extra memory.",
]
examples = ["game-of-life", "rotating-the-box"]

[[extra.variant]]
name = "Rotating the box"
note = "Gravity per row: stones fall right until an obstacle; then rotate the grid a quarter turn."
template = '''
def rotate_the_box(box):
    for row in box:
        free = len(row) - 1  # the rightmost free cell
        for j in range(len(row) - 1, -1, -1):
            if row[j] == "*":
                free = j - 1  # an obstacle: stones stop before it
            elif row[j] == "#":
                row[j], row[free] = ".", "#"  # the stone falls
                free -= 1
    return [list(col) for col in zip(*box[::-1])]  # rotate clockwise
'''

[[extra]]
id = "Math & Geometry:robot"
name = "Simulate a robot with directions"
group = "Simulation and sequences"
signals = [
    "a robot follows instructions on a plane: where does it end, does it loop, does it hit obstacles",
    "directions as an index into a list of (dx, dy): turning is index +- 1 modulo 4",
    "repeating the instructions: after at most four rounds the position and direction cycle",
]
template_name = "Robot bounded in a circle"
template = '''
def is_robot_bounded(instructions):
    dirs = [(0, 1), (1, 0), (0, -1), (-1, 0)]  # north, east, south, west
    x = y = d = 0
    for ch in instructions:
        if ch == "G":
            x, y = x + dirs[d][0], y + dirs[d][1]
        elif ch == "L":
            d = (d + 3) % 4
        else:
            d = (d + 1) % 4
    # back at the start, or not facing north: the path repeats in a cycle
    return (x, y) == (0, 0) or d != 0
'''
pitfalls = [
    "After one round the robot is either back at the origin or facing a different way: in the second case four rounds return it.",
    "Facing north away from the origin means it drifts forever.",
    "Keep turning as arithmetic on an index, not as if-chains.",
]
examples = ["robot-bounded-in-circle", "walking-robot-simulation"]

[[extra.variant]]
name = "Walking robot simulation"
note = "A set of obstacles; the answer is the farthest squared distance seen on the way."
template = '''
def robot_sim(commands, obstacles):
    blocked = {tuple(o) for o in obstacles}
    dirs = [(0, 1), (1, 0), (0, -1), (-1, 0)]
    x = y = d = best = 0
    for c in commands:
        if c == -2:
            d = (d + 3) % 4
        elif c == -1:
            d = (d + 1) % 4
        else:
            for _ in range(c):
                nx, ny = x + dirs[d][0], y + dirs[d][1]
                if (nx, ny) in blocked:
                    break  # stop in front of the obstacle
                x, y = nx, ny
                best = max(best, x * x + y * y)
    return best
'''

[[extra]]
id = "Math & Geometry:dates"
name = "Dates, clocks and Chebyshev distance"
group = "Simulation and sequences"
signals = [
    "the number of days between two dates, or the angle between clock hands",
    "convert a date to a day number (days since a fixed date), then subtract",
    "moving diagonally costs the same as one step: the distance is max(|dx|, |dy|)",
]
template_name = "Days between two dates"
template = '''
def days_between_dates(date1, date2):
    def to_days(date):
        y, m, d = map(int, date.split("-"))
        leap = lambda yr: yr % 4 == 0 and (yr % 100 != 0 or yr % 400 == 0)
        days = 365 * (y - 1970) + sum(leap(v) for v in range(1970, y))
        feb = 29 if leap(y) else 28
        month = [31, feb, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
        return days + sum(month[:m - 1]) + d
    return abs(to_days(date1) - to_days(date2))
'''
pitfalls = [
    "Count leap years by the rule: divisible by 4, except by 100 unless also by 400.",
    "Convert both dates to a day count from the same origin and subtract.",
    "Python's datetime.date does this in one line; the exercise is to do it by hand.",
]
examples = ["number-of-days-between-two-dates", "angle-between-hands-of-a-clock", "minimum-time-visiting-all-points"]

[[extra.variant]]
name = "Angle between clock hands"
note = "The hour hand moves 30 degrees per hour plus half a degree per minute; the minute hand 6 per minute."
template = '''
def angle_clock(hour, minutes):
    h = (hour % 12) * 30 + minutes * 0.5  # degrees of the hour hand
    m = minutes * 6  # degrees of the minute hand
    diff = abs(h - m)
    return min(diff, 360 - diff)  # the smaller of the two angles
'''

[[extra.variant]]
name = "Minimum time visiting all points"
note = "A diagonal step covers one unit in both directions: each leg costs max(|dx|, |dy|)."
template = '''
def min_time_to_visit_all_points(points):
    return sum(max(abs(x2 - x1), abs(y2 - y1))
               for (x1, y1), (x2, y2) in zip(points, points[1:]))
'''

[[extra.variant]]
name = "Day of the year"
note = "Days in the months before this one, plus the day; February has 29 days in a leap year."
template = '''
def day_of_year(date):
    y, m, d = map(int, date.split("-"))
    leap = y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)
    feb = 29 if leap else 28
    months = [31, feb, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
    return sum(months[:m - 1]) + d
'''

[[extra]]
id = "Math & Geometry:square-sums"
name = "Sums of squares and powers: two pointers and base digits"
group = "Counting and number properties"
signals = [
    "is n the sum of two squares: two pointers from 0 and sqrt(n)",
    "is n a sum of distinct powers of three: its base-3 digits are all 0 or 1",
    "a number written in another base answers 'sum of distinct powers' questions",
]
template_name = "Sum of square numbers"
template = '''
from math import isqrt


def judge_square_sum(c):
    lo, hi = 0, isqrt(c)
    while lo <= hi:
        s = lo * lo + hi * hi
        if s == c:
            return True
        if s < c:
            lo += 1
        else:
            hi -= 1
    return False
'''
pitfalls = [
    "lo may equal hi: c = 2 * a * a is a sum of two equal squares.",
    "Start hi at the integer square root, never a float.",
    "Both pointers move monotonically, so the loop is O(sqrt(c)).",
]
examples = ["sum-of-square-numbers", "check-if-number-is-a-sum-of-powers-of-three", "armstrong-number"]

[[extra.variant]]
name = "Sum of distinct powers of three"
note = "Write n in base three: a digit 2 means a power is needed twice."
template = '''
def check_powers_of_three(n):
    while n:
        if n % 3 == 2:
            return False
        n //= 3
    return True
'''

[[extra]]
id = "Math & Geometry:josephus"
name = "Josephus: the last one standing"
group = "Simulation and sequences"
signals = [
    "people in a circle, every k-th is removed: who survives?",
    "a recurrence over the number of people: the winner for n comes from the winner for n - 1",
    "simulating with a queue is O(n k); the recurrence is O(n)",
]
template_name = "Find the winner of the circular game"
template = '''
def find_the_winner(n, k):
    winner = 0  # zero-based position of the winner when only one remains
    for people in range(2, n + 1):
        winner = (winner + k) % people  # shift by k in a smaller circle
    return winner + 1
'''
pitfalls = [
    "Work with zero-based positions and add 1 at the end.",
    "After the first removal the circle starts k positions later: the recurrence adds k and takes the modulus.",
    "A queue simulation (rotate k - 1, pop) is the safest way to test the formula.",
]
examples = ["find-the-winner-of-the-circular-game", "elimination-game"]

[[extra.variant]]
name = "Elimination game"
note = "Remove every other number alternately from the left and the right: track the first number and the step."
template = '''
def last_remaining(n):
    head, step, left, remaining = 1, 1, True, n
    while remaining > 1:
        if left or remaining % 2:  # the head is removed: it moves on
            head += step
        remaining //= 2
        step *= 2
        left = not left
    return head
'''

[[extra]]
id = "Math & Geometry:int-to-text"
name = "Integers to Roman numerals and English words"
group = "Digit manipulation"
signals = [
    "write a number with a table of values and symbols, greedily from the largest",
    "split into groups of three digits (thousand, million, billion) and name each group",
    "special forms such as 4 = IV and 9 = IX are extra entries in the table",
]
template_name = "Integer to Roman"
template = '''
def int_to_roman(num):
    table = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"),
             (90, "XC"), (50, "L"), (40, "XL"), (10, "X"), (9, "IX"),
             (5, "V"), (4, "IV"), (1, "I")]
    out = []
    for value, symbol in table:  # greedy: biggest value first
        count, num = divmod(num, value)
        out.append(symbol * count)
    return "".join(out)
'''
pitfalls = [
    "Put the subtractive forms (900, 400, 90, 40, 9, 4) in the table in order: then plain greedy works.",
    "divmod gives how many times a value fits and what is left.",
    "For English words, name groups of three digits and add Thousand, Million, Billion.",
]
examples = ["integer-to-roman", "integer-to-english-words", "roman-to-integer"]

[[extra.variant]]
name = "Integer to English words"
note = "Name each three-digit group and append its scale word."
template = '''
def number_to_words(num):
    if num == 0:
        return "Zero"
    ones = ("One Two Three Four Five Six Seven Eight Nine Ten Eleven "
            "Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen "
            "Nineteen").split()
    tens = "Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety".split()

    def below_1000(n):
        words = []
        if n >= 100:
            words += [ones[n // 100 - 1], "Hundred"]
            n %= 100
        if n >= 20:
            words.append(tens[n // 10 - 2])
            n %= 10
        if n:
            words.append(ones[n - 1])
        return words

    out = []
    scales = [(10**9, "Billion"), (10**6, "Million"), (1000, "Thousand"),
              (1, "")]
    for unit, scale in scales:
        group, num = divmod(num, unit)
        if group:
            out += below_1000(group) + ([scale] if scale else [])
    return " ".join(out)
'''

[[extra]]
id = "Math & Geometry:shuffle"
name = "Random shuffle: Fisher-Yates"
group = "Probability and random"
signals = [
    "return a uniformly random permutation of an array, and reset it to the original",
    "for each position i pick a random index j in [i, n) and swap",
    "every permutation then has probability 1 / n!",
]
template = '''
import random


class Solution:
    def __init__(self, nums):
        self.original = nums[:]
        self.nums = nums[:]

    def reset(self):
        self.nums = self.original[:]
        return self.nums

    def shuffle(self):
        a = self.nums
        for i in range(len(a)):
            j = random.randrange(i, len(a))  # a later (or the same) spot
            a[i], a[j] = a[j], a[i]
        return a
'''
pitfalls = [
    "Choose j from [i, n), not from the whole array: choosing from everything gives a biased result.",
    "Keep a copy of the original to reset.",
    "Python's random.shuffle does exactly this.",
]
examples = ["shuffle-an-array"]

[[extra]]
id = "Math & Geometry:convex-hull"
name = "Convex hull: the fence around points"
group = "Geometry"
signals = [
    "the smallest convex polygon that contains every point, or the points on the boundary of it",
    "sort by x (then y), build the lower chain and the upper chain with a stack, and keep only left turns",
    "the sign of a cross product tells a left turn, a right turn or a straight line",
]
template_name = "Erect the fence (monotone chain)"
template = '''
def outer_trees(trees):
    pts = sorted(map(tuple, trees))
    if len(pts) <= 2:
        return [list(p) for p in pts]

    def cross(o, a, b):  # > 0 for a left turn at a
        return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])

    def chain(points):
        out = []
        for p in points:
            while len(out) >= 2 and cross(out[-2], out[-1], p) < 0:
                out.pop()  # a right turn: the last point is inside
            out.append(p)  # a straight line keeps the point on the fence
        return out

    hull = set(chain(pts)) | set(chain(pts[::-1]))  # lower and upper chains
    return [list(p) for p in hull]
'''
pitfalls = [
    "Pop on a strictly negative cross product to keep points that lie on an edge; pop on <= 0 for the corners only.",
    "Build the lower chain left to right and the upper chain right to left, then join them.",
    "Fewer than three points are their own hull.",
]
examples = ["erect-the-fence"]

