template_name = "Diagonal traverse"
template = '''
def find_diagonal_order(mat):
    rows, cols = len(mat), len(mat[0])
    out = []
    for d in range(rows + cols - 1):  # d = i + j
        cells = [(i, d - i) for i in range(rows) if 0 <= d - i < cols]
        if d % 2 == 0:
            cells.reverse()  # even diagonals go up and to the right
        out.extend(mat[i][j] for i, j in cells)
    return out
'''
pitfalls = [
    "Cells on an anti-diagonal share i + j; cells on a diagonal share i - j.",
    "Alternate the direction by the parity of the diagonal number.",
    "Use a dict from i - j to the list of values to sort or compare each diagonal.",
]
examples = ["diagonal-traverse", "sort-matrix-by-diagonals", "toeplitz-matrix", "spiral-matrix-iii"]

[[extra.variant]]
name = "Sort matrix by diagonals"
note = "Top-right diagonals ascend, the others descend; collect each diagonal by i - j, sort, write back."
template = '''
from collections import defaultdict, deque


def sort_matrix(grid):
    n = len(grid)
    diag = defaultdict(list)
    for i in range(n):
        for j in range(n):
            diag[i - j].append(grid[i][j])
    for key, vals in diag.items():
        vals.sort(reverse=key >= 0)  # below the main diagonal: descending
        diag[key] = deque(vals)
    for i in range(n):
        for j in range(n):
            grid[i][j] = diag[i - j].popleft()  # along the diagonal
    return grid
'''

