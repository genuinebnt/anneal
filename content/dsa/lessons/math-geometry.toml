[[technique]]
id = "Math & Geometry:matrix-sim"
group = "Simulation and sequences"
signals = [
    "build a new matrix from the old one by following a rule (transpose, flip, diagonals)",
    "the answer is a function of (row, column) indexes",
    "the matrix may not be square",
]
template = '''
def transpose(matrix):
    rows, cols = len(matrix), len(matrix[0])
    result = [[0] * rows for _ in range(cols)]  # cols rows of length rows
    for r in range(rows):
        for c in range(cols):
            result[c][r] = matrix[r][c]
    return result
'''
pitfalls = [
    "A transpose of an m by n matrix is n by m. Build the new shape; don't reuse the old one.",
    "zip(*matrix) transposes in one expression in Python.",
    "Write the rule as new[i][j] = old[f(i, j)] and let the loops follow.",
]

[[technique]]
id = "Math & Geometry:matrix-inplace"
walk = "math-rotate"
group = "Matrix on grids"
signals = [
    "rotate or flip a square matrix without a second matrix",
    "swap values in groups of four, or compose two simple flips",
    "constant extra memory",
]
template = '''
def rotate(matrix):
    # 90 degrees clockwise: transpose, then reverse each row.
    n = len(matrix)
    for i in range(n):
        for j in range(i + 1, n):  # above the diagonal: each pair once
            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]
    for row in matrix:
        row.reverse()
'''
pitfalls = [
    "Swap only the part above the diagonal. Looping over the whole matrix swaps every pair twice, undoing it.",
    "Clockwise is transpose then reverse each row. Anticlockwise is transpose then reverse the order of the rows.",
    "Modify the matrix and return nothing, if the problem says in place.",
]

[[technique]]
id = "Math & Geometry:spiral"
group = "Simulation and sequences"
signals = [
    "visit a matrix in spiral order, or fill one",
    "four sides, and the rectangle shrinks after each pass",
    "keep four boundaries: top, bottom, left, right",
]
template = '''
def spiral_order(matrix):
    out = []
    top, bottom = 0, len(matrix) - 1
    left, right = 0, len(matrix[0]) - 1
    while top <= bottom and left <= right:
        out += matrix[top][left:right + 1]  # the top row, left to right
        top += 1
        out += [matrix[r][right] for r in range(top, bottom + 1)]
        right -= 1
        if top <= bottom:
            out += matrix[bottom][left:right + 1][::-1]
            bottom -= 1
        if left <= right:
            out += [matrix[r][left] for r in range(bottom, top - 1, -1)]
            left += 1
    return out
'''
pitfalls = [
    "After the top row and the right column, check top <= bottom and left <= right again before the other two sides. A single row or column otherwise gets read twice.",
    "Matrices need not be square. Use separate row and column bounds.",
    "A direction-vector version (turn at the edge or at a visited cell) avoids the four loops but needs a visited grid.",
]

[[technique]]
id = "Math & Geometry:markers"
group = "Matrix on grids"
signals = [
    "mark rows or columns in place, without extra memory",
    "an action on a cell would confuse later checks if done immediately",
    "use the first row and column as the notes",
]
template = '''
def set_zeroes(matrix):
    rows, cols = len(matrix), len(matrix[0])
    first_row = any(matrix[0][c] == 0 for c in range(cols))
    first_col = any(matrix[r][0] == 0 for r in range(rows))
    for r in range(1, rows):  # note zeros in the first row and column
        for c in range(1, cols):
            if matrix[r][c] == 0:
                matrix[r][0] = matrix[0][c] = 0
    for r in range(1, rows):
        for c in range(1, cols):
            if matrix[r][0] == 0 or matrix[0][c] == 0:
                matrix[r][c] = 0
    if first_row:
        matrix[0] = [0] * cols
    if first_col:
        for r in range(rows):
            matrix[r][0] = 0
'''
pitfalls = [
    "Record first whether the first row and column themselves had a zero, because they are about to be used as notes.",
    "Handle the first row and column LAST. Clearing them early destroys the notes.",
    "A pair of sets (rows and columns to clear) is the O(m + n) version, and the easier one to get right.",
]

[[technique]]
id = "Math & Geometry:number-cycle"
group = "Digit manipulation"
signals = [
    "repeat a step on a number until it reaches a goal or loops forever",
    "the sequence is deterministic, so a repeat means a cycle",
    "detect the cycle without remembering every value",
]
template = '''
def is_happy(n):
    def step(x):
        total = 0
        while x:
            x, digit = divmod(x, 10)
            total += digit * digit
        return total

    slow, fast = n, step(n)
    while fast != 1 and slow != fast:
        slow, fast = step(slow), step(step(fast))
    return fast == 1
'''
pitfalls = [
    "The sequence either reaches 1 or enters a cycle. It can't grow without bound, because the next value stays small.",
    "A set of seen values is the simplest version. Fast and slow pointers do it in constant space.",
    "Stop at 1 as well as at a repeat. 1 maps to itself.",
]

[[technique]]
id = "Math & Geometry:digits"
group = "Digit manipulation"
signals = [
    "add one to, or add two, numbers stored as digit lists or strings",
    "carry from the least significant digit",
    "the result may be one digit longer",
]
template = '''
def plus_one(digits):
    for i in range(len(digits) - 1, -1, -1):
        if digits[i] < 9:
            digits[i] += 1
            return digits
        digits[i] = 0  # 9 + 1 carries
    return [1] + digits  # every digit was 9


def add_strings(a, b):
    out, carry = [], 0
    i, j = len(a) - 1, len(b) - 1
    while i >= 0 or j >= 0 or carry:
        total = carry
        if i >= 0:
            total += int(a[i])
            i -= 1
        if j >= 0:
            total += int(b[j])
            j -= 1
        carry, digit = divmod(total, 10)
        out.append(str(digit))
    return "".join(reversed(out))
'''
pitfalls = [
    "Loop while there are digits or a carry left. A final carry becomes a new leading digit.",
    "Stop plus_one at the first digit below 9: nothing further left changes.",
    "Don't convert to an integer and back: it hides the point, and overflows in many languages.",
]

[[technique]]
id = "Math & Geometry:fast-pow"
walk = "math-pow"
group = "Exponentiation and roots"
signals = [
    "x to the power n for a huge n",
    "multiplying n times is too slow",
    "square the base and halve the exponent",
]
template = '''
def my_pow(x, n):
    if n < 0:
        x, n = 1 / x, -n
    result = 1.0
    while n:
        if n & 1:  # this bit of n is set: multiply it in
            result *= x
        x *= x
        n >>= 1
    return result
'''
pitfalls = [
    "A negative exponent is the reciprocal: invert x and use -n.",
    "About log2(n) steps: 31 at most for a 32-bit exponent.",
    "The same loop computes a power modulo m if you reduce after every multiplication.",
]

[[technique]]
id = "Math & Geometry:point-counts"
group = "Counting and number properties"
signals = [
    "count shapes (squares, rectangles) formed by stored points",
    "the other corners are fixed once you pick two of them",
    "keep a count of how many times each point was added",
]
template = '''
from collections import Counter


class DetectSquares:
    def __init__(self):
        self.counts = Counter()  # (x, y) -> how many times it was added

    def add(self, point):
        self.counts[tuple(point)] += 1

    def count(self, point):
        x, y = point
        total = 0
        for (px, py), n in list(self.counts.items()):
            # (px, py) is the opposite corner of a square of side |px - x|.
            if abs(px - x) == abs(py - y) and px != x:
                total += n * self.counts[(px, y)] * self.counts[(x, py)]
        return total
'''
pitfalls = [
    "Store counts, not a set: the same point added twice makes more squares.",
    "Require px != x so the side isn't zero, and equal horizontal and vertical distances so it is a square.",
    "Counter returns 0 for a missing key without adding it.",
]

[[technique]]
id = "Math & Geometry:median"
group = "Geometry"
signals = [
    "make all numbers equal by adding or subtracting a fixed step, with the fewest moves",
    "the best target minimises the total distance to every value",
    "that target is the median",
]
template = '''
def min_operations(grid, x):
    values = sorted(v for row in grid for v in row)
    if any((v - values[0]) % x for v in values):
        return -1  # the values can't all land on the same number
    median = values[len(values) // 2]
    return sum(abs(v - median) // x for v in values)
'''
pitfalls = [
    "Check that every value has the same remainder modulo the step. If not, it is impossible.",
    "The median minimises the sum of absolute differences. The mean does not.",
    "For an even count either middle value gives the same total.",
]

[[technique]]
id = "Math & Geometry:lex-order"
signals = [
    "numbers in dictionary order (1, 10, 100, 11, ...) rather than numeric order",
    "generate them without sorting strings",
    "go deeper first (times 10), then move across, then back up",
]
template = '''
def lexical_order(n):
    out, cur = [], 1
    for _ in range(n):
        out.append(cur)
        if cur * 10 <= n:
            cur *= 10  # go deeper: 1 -> 10 -> 100
        else:
            while cur % 10 == 9 or cur + 1 > n:
                cur //= 10  # back up when the row is finished
            cur += 1
    return out
'''
pitfalls = [
    "Try to go deeper first. Otherwise move to the next sibling, and back up when you run out of siblings (a 9, or past n).",
    "sorted(range(1, n + 1), key=str) is the one-liner, but it uses O(n log n) time and O(n) strings.",
    "This is a pre-order walk of a tree whose children of k are 10k to 10k + 9.",
]

[[extra]]
id = "Math & Geometry:long-division"
name = "Long division with a remainder map"
group = "Number ranges"
signals = [
    "write a fraction as a decimal, with the repeating part in parentheses",
    "the digits come from long division: remainder * 10 divided by the denominator",
    "a repeated remainder means the digits repeat from where that remainder first appeared",
]
template_name = "Fraction to recurring decimal"
template = '''
def fraction_to_decimal(numerator, denominator):
    if numerator == 0:
        return "0"
    sign = "-" if (numerator < 0) != (denominator < 0) else ""
    n, d = abs(numerator), abs(denominator)
    whole, rem = divmod(n, d)
    if rem == 0:
        return sign + str(whole)
    digits, seen = [], {}  # seen: remainder -> where its digit sits
    while rem and rem not in seen:
        seen[rem] = len(digits)
        rem *= 10
        digits.append(str(rem // d))
        rem %= d
    if rem:  # the remainder came back: the digits from there repeat
        i = seen[rem]
        head, cycle = "".join(digits[:i]), "".join(digits[i:])
        return f"{sign}{whole}.{head}({cycle})"
    return f"{sign}{whole}." + "".join(digits)
'''
pitfalls = [
    "Handle the sign separately and work with absolute values.",
    "Record the position of each remainder: the first time it repeats marks the start of the cycle.",
    "A remainder of 0 means the decimal terminates.",
]
examples = ["fraction-to-recurring-decimal", "add-digits"]

