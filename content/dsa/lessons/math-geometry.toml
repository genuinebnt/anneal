    "Every multiple of 25 has two factors of 5: the loop adds n // 25 as well as n // 5.",
    "Factors of 2 are plentiful, so only the 5s decide the number of zeroes.",
    "Digit counts: split n into the part above, the digit, and the part below the place being counted.",
]
