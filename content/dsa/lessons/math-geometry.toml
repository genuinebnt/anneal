[[technique]]
id = "Math & Geometry:number-format"
group = "Digit manipulation"
signals = [
    "convert between a number and a string in some base or format (Excel columns, Roman numerals)",
    "digits are built from the right using a remainder, then reversed",
    "a numbering system with no zero digit",
]
template = '''
def convert_to_title(n):
    # 1 -> A, 26 -> Z, 27 -> AA. Base 26 with digits 1..26 (no zero).
    letters = []
    while n:
        n, remainder = divmod(n - 1, 26)  # subtract 1 FIRST
        letters.append(chr(ord("A") + remainder))
    return "".join(reversed(letters))


def title_to_number(title):
    n = 0
    for ch in title:
        n = n * 26 + (ord(ch) - ord("A") + 1)
    return n
'''
pitfalls = [
    "A system with no zero digit needs n - 1 before dividing and taking the remainder. Plain base conversion gives 26 -> empty.",
    "Digits come out last-first, so reverse (or build the string from the left).",
    "Check the boundaries by hand: 26, 27, 52, 701, 702, 703.",
]

[[technique]]
id = "Math & Geometry:number-theory"
group = "GCD, LCM and divisibility"
signals = [
    "greatest common divisor, least common multiple, divisibility",
    "primes up to n, or whether a number is prime",
    "a repeated pattern whose length divides both lengths",
]
template = '''
def gcd(a, b):
    while b:
        a, b = b, a % b
    return a


def sieve(n):
    # All primes up to and including n.
    is_prime = [True] * (n + 1)
    is_prime[:2] = [False] * min(2, n + 1)
    for p in range(2, int(n**0.5) + 1):
        if is_prime[p]:
            for multiple in range(p * p, n + 1, p):
                is_prime[multiple] = False
    return [i for i, ok in enumerate(is_prime) if ok]


def gcd_of_strings(a, b):
    if a + b != b + a:
        return ""
    return a[:gcd(len(a), len(b))]
'''
pitfalls = [
    "The least common multiple is a * b // gcd(a, b). Divide before multiplying in languages with fixed-size integers.",
    "In the sieve, start crossing off at p * p. Smaller multiples were crossed off by smaller primes.",
    "To test one number for primality, trial-divide up to its square root.",
]

