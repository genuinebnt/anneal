[[extra.variant]]
name = "The k-th factor"
note = "Collect the small divisors up to sqrt(n); the large ones are n divided by those, in reverse."
template = '''
def kth_factor(n, k):
    small, large = [], []
    d = 1
    while d * d <= n:
        if n % d == 0:
            small.append(d)
            if d * d != n:
                large.append(n // d)
        d += 1
    factors = small + large[::-1]  # all divisors in increasing order
    return factors[k - 1] if k <= len(factors) else -1
'''

