[[extra]]
id = "Linked List:split-parts"
name = "Split a list into parts"
group = "Splitting"
template_name = "Split into k parts"
signals = [
    "cut a list into k parts of nearly equal size, the first ones longer",
    "length // k per part, and the first length % k parts get one extra node",
    "cut each part by setting its tail's next to None",
]
template = '''
def split_list_to_parts(head, k):
    n, node = 0, head
    while node:
        n, node = n + 1, node.next
    size, extra = divmod(n, k)
    out, node = [], head
    for i in range(k):
        part = node
        for _ in range(size + (i < extra) - 1):  # to the end of this part
            node = node.next
        if node:
            node.next, node = None, node.next  # cut here and move on
        out.append(part)
    return out
'''
pitfalls = [
    "A part can be empty when k > n: the loop must leave node as None and append None.",
    "Cut after reading the next pointer: save it, set next to None, then move on.",
    "The first (n % k) parts are one node longer.",
]
examples = ["split-linked-list-in-parts", "linked-list-components"]

[[extra.variant]]
name = "Linked list components"
note = "Count maximal runs of nodes whose values are in a given set."
template = '''
def num_components(head, nums):
    present, count, in_run = set(nums), 0, False
    while head:
        if head.val in present:
            if not in_run:
                count += 1  # a new component starts
            in_run = True
        else:
            in_run = False
        head = head.next
    return count
'''

[[extra]]
id = "Linked List:half-reverse"
name = "Reverse the second half: palindromes and twin sums"
group = "Intersection and comparison"
signals = [
    "compare the first half with the second half read backwards, in O(1) extra memory",
    "find the middle, reverse the second half, then walk both halves together",
    "the same pairs give a sum of each node with its mirror (twin sums)",
]
template_name = "Palindrome list"
template = '''
def is_palindrome(head):
    slow = fast = head
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
    prev = None
    while slow:  # reverse the second half
        slow.next, prev, slow = prev, slow, slow.next
    a, b = head, prev
    while b:
        if a.val != b.val:
            return False
        a, b = a.next, b.next
    return True
'''
pitfalls = [
    "For an odd length slow ends on the middle node; the middle can be skipped or compared with itself, both are fine.",
    "Walk until the second half ends: it is the shorter or equal one.",
    "To leave the input intact, reverse the half back before returning.",
]
examples = ["palindrome-linked-list", "maximum-twin-sum-of-a-linked-list"]

[[extra.variant]]
name = "Maximum twin sum"
note = "Node i pairs with node n - 1 - i: the first half against the reversed second half."
template = '''
def pair_sum(head):
    slow = fast = head
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
    prev = None
    while slow:
        slow.next, prev, slow = prev, slow, slow.next
    best, a, b = 0, head, prev
    while b:
        best = max(best, a.val + b.val)
        a, b = a.next, b.next
    return best
'''

[[extra]]
id = "Linked List:reservoir"
name = "Reservoir sampling: a random node"
group = "Random node"
template_name = "Linked list random node"
signals = [
    "pick a random node of a list whose length you do not know, in one pass",
    "keep one candidate: the i-th node replaces it with probability 1 / i",
    "every node ends up chosen with the same probability 1 / n",
]
template = '''
import random


class Solution:
    def __init__(self, head):
        self.head = head

    def getRandom(self):
        choice, node, i = None, self.head, 0
        while node:
            i += 1
            if random.randrange(i) == 0:  # a 1 / i chance
                choice = node.val
            node = node.next
        return choice
'''
pitfalls = [
    "The first node is always taken (randrange(1) is 0); later nodes replace it with a smaller and smaller chance.",
    "Do not store the list in an array unless the length is known and small: reservoir sampling needs O(1) memory.",
    "For a sample of size k, fill k slots first, then replace a random slot with probability k / i.",
]
examples = ["linked-list-random-node"]

[[extra.variant]]
name = "Random pick index (array with repeats)"
note = "Among the indexes whose value equals the target, keep one at random: the k-th match replaces it with probability 1 / k."
template = '''
import random


class Solution:
    def __init__(self, nums):
        self.nums = nums

    def pick(self, target):
        choice, seen = -1, 0
        for i, x in enumerate(self.nums):
            if x == target:
                seen += 1
                if random.randrange(seen) == 0:  # a 1 / seen chance
                    choice = i
        return choice
'''

[[extra]]
id = "Linked List:splice-between"
name = "Splice between boundary nodes"
group = "Dummy head and in-place surgery"
signals = [
    "replace the nodes between positions a and b with another list",
    "walk to the node before a and to the node after b, then connect the new list between them",
    "sums between sentinel values, or the gap between local extremes, are single passes with a previous pointer",
]
template_name = "Merge in between linked lists"
template = '''
def merge_in_between(list1, a, b, list2):
    before = list1
    for _ in range(a - 1):
        before = before.next  # the node just before position a
    after = before
    for _ in range(b - a + 2):
        after = after.next  # the node just after position b
    before.next = list2
    tail = list2
    while tail.next:
        tail = tail.next
    tail.next = after
    return list1
'''
pitfalls = [
    "Find the node before a and the node after b first; then there is nothing to lose.",
    "Attach the end of list2 to the node after b.",
    "Positions are zero-based: count the steps carefully.",
]
examples = ["merge-in-between-linked-lists", "merge-nodes-in-between-zeros", "swapping-nodes-in-a-linked-list", "find-the-minimum-and-maximum-number-of-nodes-between-critical-points", "insert-into-a-sorted-circular-linked-list"]

[[extra.variant]]
name = "Merge nodes between zeros"
note = "Sum the values between two zeros into one node."
template = '''
def merge_nodes(head):
    dummy = tail = ListNode()
    total = 0
    node = head.next
    while node:
        if node.val == 0:
            tail.next = ListNode(total)  # the group is complete
            tail = tail.next
            total = 0
        else:
            total += node.val
        node = node.next
    return dummy.next
'''

[[extra.variant]]
name = "Swap the k-th from each end"
note = "Find the k-th from the start; a second pointer, k nodes behind the end, is the k-th from the end."
template = '''
def swap_nodes(head, k):
    first = head
    for _ in range(k - 1):
        first = first.next
    second, fast = head, first
    while fast.next:
        second, fast = second.next, fast.next
    first.val, second.val = second.val, first.val
    return head
'''

[[extra.variant]]
name = "Critical points"
note = "A local maximum or minimum compares a node with its neighbours; keep the first and last positions."
template = '''
def nodes_between_critical_points(head):
    prev, cur, i = head, head.next, 1
    first = last = None
    smallest = float("inf")
    while cur.next:
        nxt = cur.next
        if (cur.val > prev.val and cur.val > nxt.val) or (
                cur.val < prev.val and cur.val < nxt.val):
            if first is None:
                first = i
            else:
                smallest = min(smallest, i - last)
            last = i
        prev, cur, i = cur, nxt, i + 1
    if first is None or first == last:
        return [-1, -1]
    return [smallest, last - first]
'''

[[extra]]
id = "Linked List:bucket-list"
name = "A doubly linked list of count buckets"
group = "Design with linked lists"
signals = [
    "increment, decrement, get-max-key and get-min-key must all be O(1)",
    "buckets ordered by count in a doubly linked list; each bucket holds the keys with that count",
    "a key moves to the neighbouring bucket on increment or decrement, creating or removing buckets",
]
template = '''
class Bucket:
    def __init__(self, count):
        self.count, self.keys = count, set()
        self.prev = self.next = None


class AllOne:
    def __init__(self):
        self.head, self.tail = Bucket(0), Bucket(0)  # sentinels
        self.head.next, self.tail.prev = self.tail, self.head
        self.where = {}  # key -> its bucket

    def _insert_after(self, node, count):
        b = Bucket(count)
        b.prev, b.next = node, node.next
        node.next.prev = b
        node.next = b
        return b

    def _drop_if_empty(self, b):
        if not b.keys:
            b.prev.next, b.next.prev = b.next, b.prev

    def inc(self, key):
        cur = self.where.get(key)
        count = cur.count if cur else 0
        after = cur if cur else self.head
        nxt = after.next
        if nxt is self.tail or nxt.count != count + 1:
            nxt = self._insert_after(after, count + 1)
        nxt.keys.add(key)
        self.where[key] = nxt
        if cur:
            cur.keys.discard(key)
            self._drop_if_empty(cur)

    def dec(self, key):
        cur = self.where[key]
        if cur.count == 1:
            del self.where[key]
        else:
            before = cur.prev
            if before is self.head or before.count != cur.count - 1:
                before = self._insert_after(before, cur.count - 1)
            before.keys.add(key)
            self.where[key] = before
        cur.keys.discard(key)
        self._drop_if_empty(cur)

    def getMaxKey(self):
        b = self.tail.prev  # the bucket with the largest count
        return next(iter(b.keys)) if b is not self.head else ""

    def getMinKey(self):
        b = self.head.next  # the bucket with the smallest count
        return next(iter(b.keys)) if b is not self.tail else ""
'''
pitfalls = [
    "Sentinel head and tail buckets remove every null check.",
    "A bucket is created only when the neighbour does not already have the wanted count, and removed when it becomes empty.",
    "A hash map from key to bucket makes finding a key O(1).",
]
examples = ["all-oone-data-structure", "design-authentication-manager", "lfu-cache"]

[[extra]]
id = "Linked List:circular-loop"
name = "Cycles in arrays: values as next pointers"
group = "Cycles in functional graphs"
signals = [
    "an array where each value says where to go next: a cycle exists, how long, where does it start?",
    "the array is a functional graph: every node has one outgoing edge, so slow and fast pointers apply",
    "a happy number or the duplicate in n + 1 values is the same cycle problem",
]
template_name = "Circular array loop"
template = '''
def circular_array_loop(nums):
    n = len(nums)

    def nxt(i):
        return (i + nums[i]) % n

    for start in range(n):
        slow, fast = start, start
        direction = nums[start] > 0
        while True:  # slow and fast must stay in one direction
            slow = nxt(slow)
            if (nums[slow] > 0) != direction:
                break
            fast = nxt(fast)
            if (nums[fast] > 0) != direction:
                break
            fast = nxt(fast)
            if (nums[fast] > 0) != direction:
                break
            if slow == fast:
                if nxt(slow) != slow:  # a loop of length 1 does not count
                    return True
                break
    return False
'''
pitfalls = [
    "All numbers on the loop must have the same sign: stop as soon as a step changes direction.",
    "A self-loop (an index that points to itself) is not a valid cycle.",
    "Mark visited indexes (set them to 0) to keep the whole scan linear.",
]
examples = ["circular-array-loop", "find-the-duplicate-number", "happy-number"]

[[extra.variant]]
name = "Happy number"
note = "The digit-square sum is the next pointer: it reaches 1 or falls into a cycle."
template = '''
def is_happy(n):
    def step(x):
        return sum(int(d) ** 2 for d in str(x))

    slow, fast = n, step(n)
    while fast != 1 and slow != fast:
        slow = step(slow)
        fast = step(step(fast))
    return fast == 1
'''

[[extra]]
id = "Linked List:two-deque-queue"
name = "A queue with a middle: two deques"
group = "Design with linked lists"
signals = [
    "push and pop at the front, the middle and the back of a queue in O(1)",
    "keep two halves in two deques so that the middle is always at their boundary",
    "rebalance after each operation: the front half is never more than one bigger than the back half",
]
template = '''
from collections import deque


class FrontMiddleBackQueue:
    def __init__(self):
        # invariant: len(front) <= len(back) <= len(front) + 1
        self.front, self.back = deque(), deque()

    def _balance(self):
        if len(self.front) > len(self.back):
            self.back.appendleft(self.front.pop())
        elif len(self.back) > len(self.front) + 1:
            self.front.append(self.back.popleft())

    def pushFront(self, v):
        self.front.appendleft(v)
        self._balance()

    def pushMiddle(self, v):
        if len(self.front) < len(self.back):
            self.front.append(v)  # the end of the front half
        else:
            self.back.appendleft(v)
        self._balance()

    def pushBack(self, v):
        self.back.append(v)
        self._balance()

    def _pop(self, d, left):
        v = d.popleft() if left else d.pop()
        self._balance()
        return v

    def popFront(self):
        if not self.front and not self.back:
            return -1
        return self._pop(self.front if self.front else self.back, True)

    def popMiddle(self):
        if not self.front and not self.back:
            return -1
        if len(self.front) == len(self.back):
            return self._pop(self.front, False)
        return self._pop(self.back, True)

    def popBack(self):
        if not self.front and not self.back:
            return -1
        return self._pop(self.back if self.back else self.front, False)
'''
pitfalls = [
    "Fix the invariant after every operation: len(front) <= len(back) <= len(front) + 1.",
    "With an even number of items the middle is the last item of the front half, otherwise the first of the back half.",
    "Return -1 on pop from an empty queue.",
]
examples = ["design-front-middle-back-queue", "design-circular-deque", "design-circular-queue"]

