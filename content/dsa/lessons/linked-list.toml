pattern = "Linked List"
intro = "Linked list problems are pointer bookkeeping. A few habits remove most of the bugs: draw the nodes, save next before you overwrite it, and put a dummy node in front so the head is never special. Then it is one of a handful of moves: reverse, merge, two speeds, a gap, or a copy map."
groups = ["Reversal", "Fast and slow pointers", "Merging and sorting", "Partition and reorder", "Dummy head and in-place surgery", "Arithmetic on lists", "Intersection and comparison", "Copy with a random pointer", "Flattening and linking structure", "Design with linked lists", "List and structure conversion", "Splitting", "Cycles in functional graphs", "Random node", "O(1)-space variants", "Pitfalls and edge cases"]










[[technique]]
id = "Linked List:reverse"
walk = "list-reverse"
group = "Reversal"
signals = [
    "reverse a list, or a part of it",
    "every node's next must point at the node before it",
    "reorder by reversing a half",
]
template = '''
def reverse_list(head):
    prev = None
    while head:
        head.next, prev, head = prev, head, head.next
    return prev


def reverse_between(head, left, right):
    # Reverse the nodes at positions left..right (1-based).
    dummy = ListNode(0, head)
    before = dummy
    for _ in range(left - 1):
        before = before.next
    cur = before.next
    for _ in range(right - left):  # pull the next node to the front
        nxt = cur.next
        cur.next = nxt.next
        nxt.next = before.next
        before.next = nxt
    return dummy.next
'''
pitfalls = [
    "Save head.next before you change it, or you lose the rest of the list. The tuple assignment above does that safely.",
    "prev starts as None because the old head becomes the new tail.",
    "A dummy node before the head makes reversing a range that includes the head the same as any other range.",
]

[[technique]]
id = "Linked List:dummy-merge"
group = "Arithmetic on lists"
signals = [
    "build a new list from existing nodes, in order",
    "merge two sorted lists, or add two numbers digit by digit",
    "the first node of the result is not known in advance",
]
template = '''
def merge_two_lists(a, b):
    dummy = tail = ListNode()
    while a and b:
        if a.val <= b.val:
            tail.next, a = a, a.next
        else:
            tail.next, b = b, b.next
        tail = tail.next
    tail.next = a or b  # attach whatever is left
    return dummy.next
'''
pitfalls = [
    "A dummy head removes the 'is the result still empty?' case. Return dummy.next.",
    "When one list runs out, link the rest of the other directly. No copying is needed.",
    "Use <= so that equal items keep their original order (a stable merge).",
]

[[technique]]
id = "Linked List:fast-slow"
walk = "list-cycle"
group = "Cycles in functional graphs"
signals = [
    "does the list have a cycle, and where does it start?",
    "find the middle of the list in one pass",
    "two pointers moving at different speeds",
]
template = '''
def has_cycle(head):
    slow = fast = head
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
        if slow is fast:
            return True
    return False


def cycle_start(head):
    slow = fast = head
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
        if slow is fast:  # they met inside the cycle
            slow = head
            while slow is not fast:  # same speed: meet at the entrance
                slow, fast = slow.next, fast.next
            return slow
    return None


def middle(head):
    slow = fast = head
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
    return slow  # the second of the two middles for an even length
'''
pitfalls = [
    "Check fast and fast.next before stepping twice, or you dereference None.",
    "Compare nodes with `is`, not values. Different nodes often hold equal values.",
    "The restart-from-head trick works because the distance from the head to the entrance equals the distance from the meeting point onward.",
]

[[technique]]
id = "Linked List:splice"
group = "Merging and sorting"
signals = [
    "remove, insert or reorder nodes in place",
    "delete every node with a given value, or remove duplicates",
    "the node to change might be the head",
]
template = '''
def remove_elements(head, val):
    dummy = ListNode(0, head)
    prev = dummy
    while prev.next:
        if prev.next.val == val:
            prev.next = prev.next.next  # unlink it; prev stays put
        else:
            prev = prev.next
    return dummy.next
'''
pitfalls = [
    "Look at prev.next, the node AFTER the one you hold, so you can unlink it.",
    "Don't advance prev after an unlink: the new next might need removing too.",
    "With a dummy node the head is removed like any other node.",
]

[[technique]]
id = "Linked List:gap"
group = "Intersection and comparison"
signals = [
    "the n-th node from the END, in one pass",
    "two pointers that keep a fixed distance apart",
    "you don't know the length in advance",
]
template = '''
def remove_nth_from_end(head, n):
    dummy = ListNode(0, head)
    lead = trail = dummy
    for _ in range(n):  # open a gap of n nodes
        lead = lead.next
    while lead.next:  # move both until lead is on the last node
        lead, trail = lead.next, trail.next
    trail.next = trail.next.next  # trail is just before the target
    return dummy.next
'''
pitfalls = [
    "Both pointers start at the dummy, so removing the head (n equal to the length) needs no special case.",
    "Stop when lead.next is None. Then trail sits at the node BEFORE the one to delete.",
    "Counting the length first is also fine, but takes two passes.",
]

[[technique]]
id = "Linked List:clone-map"
group = "Copy with a random pointer"
signals = [
    "copy a list whose nodes have an extra pointer (random, parent)",
    "the extra pointer may point forwards, to a node that has no copy yet",
    "a map from original to copy answers 'which copy goes there?'",
]
template = '''
def copy_random_list(head):
    copies = {None: None}  # original -> copy; None maps to None
    node = head
    while node:  # first pass: make a copy of every node
        copies[node] = Node(node.val)
        node = node.next
    node = head
    while node:  # second pass: wire the pointers through the map
        copies[node].next = copies[node.next]
        copies[node].random = copies[node.random]
        node = node.next
    return copies[head]
'''
pitfalls = [
    "Two passes: create every copy first, then connect them. Linking while creating fails for pointers that go forward.",
    "Mapping None to None removes the empty-pointer checks.",
    "An O(1) memory version weaves each copy right after its original, then separates the two lists.",
]

[[technique]]
id = "Linked List:design-list"
group = "Design with linked lists"
signals = [
    "implement a queue, deque or stack on a fixed amount of space",
    "enqueue and dequeue in O(1)",
    "reuse freed slots instead of shifting items",
]
template = '''
class RingQueue:
    def __init__(self, capacity):
        self.items = [0] * capacity
        self.head = self.size = 0

    def enqueue(self, value):
        if self.size == len(self.items):
            return False
        self.items[(self.head + self.size) % len(self.items)] = value
        self.size += 1
        return True

    def dequeue(self):
        if not self.size:
            return False
        self.head = (self.head + 1) % len(self.items)
        self.size -= 1
        return True

    def front(self):
        return self.items[self.head] if self.size else -1

    def rear(self):
        last = (self.head + self.size - 1) % len(self.items)
        return self.items[last] if self.size else -1
'''
pitfalls = [
    "Keep a size counter. With only a head and a tail index, 'empty' and 'full' look the same.",
    "The write position is (head + size) % capacity, and the last item is at (head + size - 1) % capacity.",
    "A linked list with head, tail and a count is the alternative, and needs no modulo.",
]

[[technique]]
id = "Linked List:lru"
group = "Design with linked lists"
signals = [
    "a cache that evicts the least recently used entry",
    "get and put must both be O(1), and a get counts as a use",
    "a hash map finds entries but has no order; a list has order but can't find",
]
template = '''
class LRUCache:
    class Entry:
        def __init__(self, key=0, value=0):
            self.key, self.value = key, value
            self.prev = self.next = None

    def __init__(self, capacity):
        self.capacity = capacity
        self.entries = {}  # key -> Entry
        self.head, self.tail = self.Entry(), self.Entry()  # sentinels
        self.head.next, self.tail.prev = self.tail, self.head

    def _unlink(self, e):
        e.prev.next, e.next.prev = e.next, e.prev

    def _push_back(self, e):  # the most recently used sit before the tail
        last = self.tail.prev
        last.next = e
        e.prev, e.next = last, self.tail
        self.tail.prev = e

    def get(self, key):
        e = self.entries.get(key)
        if e is None:
            return -1
        self._unlink(e)
        self._push_back(e)
        return e.value

    def put(self, key, value):
        e = self.entries.get(key)
        if e:
            e.value = value
            self._unlink(e)
        else:
            if len(self.entries) == self.capacity:
                oldest = self.head.next
                self._unlink(oldest)
                del self.entries[oldest.key]
            e = self.entries[key] = self.Entry(key, value)
        self._push_back(e)
'''
pitfalls = [
    "Store the key inside each node: evicting a node also needs to remove its key from the map.",
    "put on an existing key updates the value and refreshes it. It must not evict anything.",
    "Sentinel nodes at both ends remove every empty-list case from the linking code.",
]

[[technique]]
id = "Linked List:kway-merge"
group = "Merging and sorting"
signals = [
    "merge k sorted lists (or k sorted streams) into one",
    "the next item overall is the smallest of the k current fronts",
    "a heap of the fronts finds that smallest in O(log k)",
]
template = '''
import heapq


def merge_k_lists(lists):
    heap = [(node.val, i, node) for i, node in enumerate(lists) if node]
    heapq.heapify(heap)
    dummy = tail = ListNode()
    while heap:
        _, i, node = heapq.heappop(heap)
        tail.next = node
        tail = node
        if node.next:
            heapq.heappush(heap, (node.next.val, i, node.next))
    return dummy.next
'''
pitfalls = [
    "Put the list index in the tuple, so ties never compare two ListNode objects (which can't be ordered).",
    "Push only non-empty lists, and push a node's successor right after popping it.",
    "Merging in pairs (like merge sort) is the alternative, with the same O(n log k) cost.",
]

[[extra]]
id = "Linked List:swap-groups"
name = "Swap in pairs, reverse in groups"
group = "Reversal"
signals = [
    "swap every two adjacent nodes by relinking, not by changing values",
    "reverse every group of a given size (or only the groups of even length)",
    "a dummy head and a pointer to the node before the group keep the code free of special cases",
]
template_name = "Swap nodes in pairs"
template = '''
def swap_pairs(head):
    dummy = ListNode(0, head)
    prev = dummy  # the node before the pair
    while prev.next and prev.next.next:
        a, b = prev.next, prev.next.next
        a.next = b.next  # a now points past the pair
        b.next = a  # b comes first
        prev.next = b
        prev = a  # the next pair starts after a
    return dummy.next
'''
pitfalls = [
    "Relink in an order that never loses a node: a.next first, then b.next, then prev.next.",
    "Stop when fewer than two nodes remain after prev.",
    "A dummy head makes swapping the first pair the same as any other.",
]
examples = ["swap-nodes-in-pairs", "reverse-nodes-in-even-length-groups", "reverse-nodes-in-k-group"]

[[extra.variant]]
name = "Reverse nodes in even-length groups"
note = "Group sizes grow 1, 2, 3, ...; reverse a group only when its real length is even."
template = '''
def reverse_even_length_groups(head):
    dummy = ListNode(0, head)
    prev, size = dummy, 1
    while prev.next:
        # count the real length of this group (it may be cut short)
        n, node = 0, prev.next
        while node and n < size:
            node, n = node.next, n + 1
        if n % 2 == 0:
            cur = prev.next  # reverse n nodes
            for _ in range(n - 1):
                nxt = cur.next
                cur.next = nxt.next
                nxt.next = prev.next
                prev.next = nxt
            prev = cur
        else:
            for _ in range(n):
                prev = prev.next
        size += 1
    return dummy.next
'''

[[extra]]
id = "Linked List:sort-list"
name = "Sort a linked list: merge sort and insertion sort"
group = "Merging and sorting"
signals = [
    "sort a list in O(n log n) without random access",
    "split at the middle with fast and slow pointers, sort both halves, merge them",
    "a list can be merged in place with no extra memory, unlike an array",
]
template_name = "Merge sort"
template = '''
def sort_list(head):
    if not head or not head.next:
        return head
    slow, fast = head, head.next  # slow ends at the end of the first half
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
    second, slow.next = slow.next, None  # cut the list in two
    a, b = sort_list(head), sort_list(second)
    tail = dummy = ListNode()
    while a and b:
        if a.val <= b.val:  # <= keeps the sort stable
            tail.next, a = a, a.next
        else:
            tail.next, b = b, b.next
        tail = tail.next
    tail.next = a or b
    return dummy.next
'''
pitfalls = [
    "Start fast one step ahead so that slow stops at the end of the first half (and a two-node list splits as 1 + 1).",
    "Cut the list (slow.next = None) before sorting the halves, or they would still be linked.",
    "Recursion depth is log n: fine. A bottom-up version gets O(1) extra space.",
]
examples = ["sort-list", "insertion-sort-list"]

[[extra.variant]]
name = "Insertion sort"
note = "Take nodes one at a time and insert each into the sorted part: O(n^2) but simple."
template = '''
def insertion_sort_list(head):
    dummy = ListNode(0)  # the sorted list starts empty
    while head:
        nxt = head.next
        prev = dummy
        while prev.next and prev.next.val < head.val:
            prev = prev.next  # find the place
        head.next = prev.next
        prev.next = head
        head = nxt
    return dummy.next
'''

[[extra]]
id = "Linked List:partition"
name = "Partition and regroup with two dummy lists"
group = "Partition and reorder"
signals = [
    "reorder nodes by a rule while keeping the original order inside each part: less than x first, odd positions first",
    "build each part on its own dummy head, then join the parts",
    "rotating by k is a cut and a join at a computed position",
]
template_name = "Partition list"
template = '''
def partition(head, x):
    small = s = ListNode()
    large = l = ListNode()
    while head:
        if head.val < x:
            s.next, s = head, head
        else:
            l.next, l = head, head
        head = head.next
    l.next = None  # the last large node must not point back into the list
    s.next = large.next  # join the two parts
    return small.next
'''
pitfalls = [
    "Set the tail of the second list to None: it may still point to a node that moved to the first list.",
    "Stability: each part keeps the order the nodes had in the input.",
    "Join with the head of the second dummy (large.next), not the dummy itself.",
]
examples = ["partition-list", "odd-even-linked-list", "rotate-list"]

[[extra.variant]]
name = "Odd even linked list"
note = "Odd-position nodes first, even-position nodes after, in place and in O(1) memory."
template = '''
def odd_even_list(head):
    if not head:
        return head
    odd, even = head, head.next
    even_head = even  # where the even nodes start
    while even and even.next:
        odd.next = even.next
        odd = odd.next
        even.next = odd.next
        even = even.next
    odd.next = even_head
    return head
'''

[[extra.variant]]
name = "Rotate list"
note = "Make the list circular, then cut it at the new tail, n - k % n steps from the head."
template = '''
def rotate_right(head, k):
    if not head or not head.next:
        return head
    n, tail = 1, head
    while tail.next:
        tail, n = tail.next, n + 1
    k %= n
    if k == 0:
        return head
    tail.next = head  # circular
    new_tail = head
    for _ in range(n - k - 1):
        new_tail = new_tail.next
    new_head, new_tail.next = new_tail.next, None  # cut
    return new_head
'''

[[extra]]
id = "Linked List:remove-runs"
name = "Remove duplicates with a dummy head"
group = "Dummy head and in-place surgery"
signals = [
    "delete every value that appears more than once, or keep one copy of each",
    "a sorted list puts equal values next to each other: compare with the next node",
    "the head itself may be deleted, so start from a dummy node",
]
template_name = "Remove all duplicates (sorted)"
template = '''
def delete_duplicates(head):
    dummy = ListNode(0, head)
    prev = dummy  # the last node that is certainly kept
    while head:
        if head.next and head.val == head.next.val:
            dup = head.val
            while head and head.val == dup:
                head = head.next  # skip the whole run
            prev.next = head
        else:
            prev = head
            head = head.next
    return dummy.next
'''
pitfalls = [
    "Skip the entire run of equal values, including its first node.",
    "Advance prev only when a node is kept; after a deletion prev stays where it is.",
    "For 'keep one copy' it is enough to compare with the next node and unlink it.",
]
examples = ["remove-duplicates-from-sorted-list-ii", "remove-duplicates-from-sorted-list", "remove-duplicates-from-an-unsorted-linked-list", "remove-zero-sum-consecutive-nodes-from-linked-list"]

[[extra.variant]]
name = "Unsorted: remove values that repeat"
note = "Count values first, then delete every node whose count is above one."
template = '''
from collections import Counter


def delete_duplicates_unsorted(head):
    count = Counter()
    node = head
    while node:
        count[node.val] += 1
        node = node.next
    dummy = ListNode(0, head)
    prev = dummy
    while prev.next:
        if count[prev.next.val] > 1:
            prev.next = prev.next.next  # unlink and stay
        else:
            prev = prev.next
    return dummy.next
'''

[[extra.variant]]
name = "Remove zero-sum runs (prefix sums)"
note = "Two nodes with the same prefix sum bound a run that sums to zero: jump the earlier one over it."
template = '''
def remove_zero_sum_sublists(head):
    dummy = ListNode(0, head)
    last, prefix, node = {}, 0, dummy
    while node:  # the last node with each prefix sum
        prefix += node.val
        last[prefix] = node
        node = node.next
    prefix, node = 0, dummy
    while node:
        prefix += node.val
        node.next = last[prefix].next  # skip to the last equal prefix
        node = node.next
    return dummy.next
'''

[[extra]]
id = "Linked List:delete-by-rule"
name = "Delete nodes by a rule"
group = "Dummy head and in-place surgery"
signals = [
    "remove nodes that are in a set, that have a greater value to their right, or that sit in the middle",
    "a rule that depends on the right side: reverse, or keep a stack of survivors",
    "given only the node to delete, copy the next node into it and unlink the next",
]
template_name = "Remove nodes with a greater value to the right"
template = '''
def remove_nodes(head):
    stack = []  # the survivors, with values that never increase
    while head:
        while stack and stack[-1].val < head.val:
            stack.pop()  # head is greater and to its right
        stack.append(head)
        head = head.next
    for a, b in zip(stack, stack[1:]):
        a.next = b  # relink the survivors
    if stack:
        stack[-1].next = None
    return stack[0] if stack else None
'''
pitfalls = [
    "Pop while the top is smaller than the new node: those have a greater node to their right.",
    "Relink the survivors and cut the last one's next, or removed nodes stay reachable.",
    "Another way: reverse the list, keep a running maximum, reverse again.",
]
examples = ["remove-nodes-from-linked-list", "delete-nodes-from-linked-list-present-in-array", "delete-the-middle-node-of-a-linked-list", "delete-node-in-a-linked-list"]

[[extra.variant]]
name = "Delete nodes present in an array"
note = "Put the values in a set and unlink every node that is in it."
template = '''
def modified_list(nums, head):
    gone = set(nums)
    dummy = ListNode(0, head)
    prev = dummy
    while prev.next:
        if prev.next.val in gone:
            prev.next = prev.next.next  # unlink and stay
        else:
            prev = prev.next
    return dummy.next
'''

[[extra.variant]]
name = "Delete the middle node"
note = "Fast and slow, with a trailing pointer to the node before the middle."
template = '''
def delete_middle(head):
    if not head.next:
        return None
    slow, fast = ListNode(0, head), head  # slow stops before the middle
    dummy = slow
    while fast and fast.next:
        slow, fast = slow.next, fast.next.next
    slow.next = slow.next.next
    return dummy.next
'''

[[extra.variant]]
name = "Delete a node given only that node"
note = "Copy the next node's value into it, then unlink the next node."
template = '''
def delete_node(node):
    node.val = node.next.val  # become the next node
    node.next = node.next.next
'''

[[extra]]
id = "Linked List:number-lists"
name = "Numbers stored as lists"
group = "Arithmetic on lists"
signals = [
    "add one to a number, double it, or add two numbers whose digits are stored most significant first",
    "carries travel from the end: use stacks, a reversal, or find the last digit that is not 9",
    "never convert to an int when the list can be longer than the language's integer",
]
template_name = "Add two numbers II"
template = '''
def add_two_numbers(l1, l2):
    s1, s2 = [], []
    while l1:
        s1.append(l1.val)
        l1 = l1.next
    while l2:
        s2.append(l2.val)
        l2 = l2.next
    head, carry = None, 0
    while s1 or s2 or carry:
        total = carry + (s1.pop() if s1 else 0) + (s2.pop() if s2 else 0)
        carry, digit = divmod(total, 10)
        head = ListNode(digit, head)  # least significant digit first
    return head
'''
pitfalls = [
    "Pop from the two stacks together: they hold the digits from the least significant end.",
    "Continue while a carry is left, or 99 + 1 loses its leading 1.",
    "Insert each new digit at the head: the list comes out in the right order without reversing.",
]
examples = ["add-two-numbers-ii", "plus-one-linked-list", "double-a-number-represented-as-a-linked-list", "convert-binary-number-in-a-linked-list-to-integer"]

[[extra.variant]]
name = "Plus one"
note = "The carry stops at the last digit that is not 9: add one there and zero the 9s after it."
template = '''
def plus_one(head):
    dummy = ListNode(0, head)
    not_nine = dummy  # the last node whose digit is not 9
    while head:
        if head.val != 9:
            not_nine = head
        head = head.next
    not_nine.val += 1
    node = not_nine.next
    while node:
        node.val = 0  # the 9s roll over
        node = node.next
    return dummy if dummy.val else dummy.next
'''

[[extra.variant]]
name = "Double a number"
note = "Each digit doubles; it gets a carry from the digit after it, so look one node ahead."
template = '''
def double_it(head):
    if head.val > 4:
        head = ListNode(0, head)  # room for a leading carry
    node = head
    while node:
        node.val = (node.val * 2) % 10
        if node.next and node.next.val > 4:
            node.val += 1  # the carry from the next digit
        node = node.next
    return head
'''

[[extra]]
id = "Linked List:flatten-levels"
name = "Flatten a multilevel list"
group = "Flattening and linking structure"
signals = [
    "each node may also have a child list, which must be spliced in right after the node",
    "a stack of the nodes whose next is waiting while a child list is walked",
    "fix both next and prev pointers, and clear the child pointer",
]
template = '''
def flatten(head):
    node, stack = head, []
    while node:
        if node.child:
            if node.next:
                stack.append(node.next)  # come back to this later
            node.next = node.child  # splice the child in
            node.next.prev = node
            node.child = None
        elif not node.next and stack:
            node.next = stack.pop()  # the child ended: back to the parent
            node.next.prev = node
        node = node.next
    return head
'''
pitfalls = [
    "Remember the old next on a stack before overwriting it.",
    "Set prev as well as next, and set child to None.",
    "The end of a child list continues with the most recent saved next.",
]
