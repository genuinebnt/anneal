template_name = "Word filter"
template = '''
class WordFilter:
    def __init__(self, words):
        self.best = {}  # (prefix, suffix) -> the largest index
        for index, w in enumerate(words):
            for i in range(len(w) + 1):
                for j in range(len(w) + 1):
                    # later words overwrite earlier ones
                    self.best[(w[:i], w[j:])] = index

    def f(self, pref, suff):
        return self.best.get((pref, suff), -1)
'''
pitfalls = [
    "Words are processed in order, so a later word overwrites an earlier one: the stored index is the largest.",
    "The dictionary has up to len(w)^2 entries per word: fine for words up to 7 letters.",
    "A trie of suffix + '{' + word answers the same query in O(len(pref) + len(suff)) with less memory per entry.",
]
examples = ["prefix-and-suffix-search", "longest-common-suffix-queries"]

