template_name = "Replace words"
template = '''
def replace_words(dictionary, sentence):
    root = {}
    for w in dictionary:
        node = root
        for ch in w:
            node = node.setdefault(ch, {})
        node["$"] = w  # the word that ends here
    out = []
    for word in sentence.split():
        node, root_word = root, word
        for ch in word:
            if ch not in node:
                break
            node = node[ch]
            if "$" in node:
                root_word = node["$"]  # the first (shortest) root wins
                break
        out.append(root_word)
    return " ".join(out)
'''
pitfalls = [
    "Stop at the first end marker on the walk: that is the shortest root.",
    "Store the word at its end node: no need to rebuild it from the path.",
    "Keep the end marker under a key that is not a letter.",
]
examples = ["replace-words", "longest-word-in-dictionary", "short-encoding-of-words", "longest-common-suffix-queries"]

[[extra.variant]]
name = "Longest word in the dictionary"
note = "Walk only through end nodes: a word counts when every prefix of it is also a word."
template = '''
def longest_word(words):
    root = {}
    for w in words:
        node = root
        for ch in w:
            node = node.setdefault(ch, {})
        node["$"] = w
    best = ""
    stack = [root]
    while stack:
        node = stack.pop()
        for ch, child in node.items():
            if ch != "$" and "$" in child:  # this prefix is a word too
                w = child["$"]
                if len(w) > len(best) or (len(w) == len(best) and w < best):
                    best = w
                stack.append(child)
    return best
'''

[[extra.variant]]
name = "Short encoding of words (reversed trie)"
note = "A word that is a suffix of another costs nothing: insert reversed words, and count leaves."
template = '''
def minimum_length_encoding(words):
    root, leaves = {}, {}
    for w in set(words):
        node = root
        for ch in reversed(w):
            node = node.setdefault(ch, {})
        leaves[id(node)] = (node, len(w) + 1)  # the word plus its '#'
    total = 0
    for node, size in leaves.values():
        if not node:  # no longer word continues it: a leaf
            total += size
    return total
'''

[[extra.variant]]
name = "Stream of characters (reversed trie)"
note = "Insert the words reversed; after each new letter walk the trie backwards over the most recent letters."
template = '''
class StreamChecker:
    def __init__(self, words):
        self.root = {}
        self.longest = max(map(len, words))
        for w in words:
            node = self.root
            for ch in reversed(w):  # a suffix check becomes a prefix walk
                node = node.setdefault(ch, {})
            node["$"] = True
        self.recent = []  # the last letters, newest at the end

    def query(self, letter):
        self.recent.append(letter)
        if len(self.recent) > self.longest:
            self.recent.pop(0)  # older letters can not matter
        node = self.root
        for ch in reversed(self.recent):  # newest letter first
            if ch not in node:
                return False
            node = node[ch]
            if "$" in node:
                return True  # a word ends exactly here
        return False
'''

