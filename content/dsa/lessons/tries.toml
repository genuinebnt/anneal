template_name = "Sum of prefix scores"
template = '''
def sum_prefix_scores(words):
    root = {}
    for w in words:
        node = root
        for ch in w:
            node = node.setdefault(ch, {"#": 0})
            node["#"] += 1  # one more word passes through this node
    out = []
    for w in words:
        node, total = root, 0
        for ch in w:
            node = node[ch]
            total += node["#"]  # words that share this prefix
        out.append(total)
    return out
'''
pitfalls = [
    "Increment the counter when entering a node, so it counts the words that have this exact prefix.",
    "Keep the counter under a key that is not a letter, such as '#'.",
    "The total work is the total number of characters, not the number of pairs of words.",
]
examples = ["sum-of-prefix-scores-of-strings", "counting-words-with-a-given-prefix", "map-sum-pairs", "count-prefix-and-suffix-pairs-i", "count-prefix-and-suffix-pairs-ii"]

[[extra.variant]]
name = "Map sum pairs"
note = "Store the value at the end node and add the difference along the path on every overwrite."
template = '''
class MapSum:
    def __init__(self):
        self.root = {"#": 0}  # the root counts everything
        self.value = {}  # the current value of each key

    def insert(self, key, val):
        delta = val - self.value.get(key, 0)  # only the change is added
        self.value[key] = val
        node = self.root
        node["#"] += delta
        for ch in key:
            node = node.setdefault(ch, {"#": 0})
            node["#"] += delta

    def sum(self, prefix):
        node = self.root
        for ch in prefix:
            if ch not in node:
                return 0
            node = node[ch]
        return node["#"]
'''

[[extra.variant]]
name = "Count prefix and suffix pairs"
note = "A trie over pairs (w[i], w[-1 - i]): a word is both a prefix and a suffix of another when its pair path exists."
template = '''
def count_prefix_suffix_pairs(words):
    root, total = {}, 0
    for w in words:
        node = root
        for pair in zip(w, reversed(w)):  # (i-th from each end)
            node = node.setdefault(pair, {"#": 0})
            total += node["#"]  # earlier words that end here fit w twice
        node["#"] += 1  # w ends here
    return total
'''

