name = "Palindrome pairs"
group = "Palindrome pairs and pairs of words"
template_name = "Palindrome pairs"
signals = [
    "pairs of words whose concatenation is a palindrome",
    "split each word at every position: if one side is a palindrome, the reverse of the other side must be a word",
    "a hash map of reversed words answers each lookup in O(length)",
]
template = '''
def palindrome_pairs(words):
    index = {w: i for i, w in enumerate(words)}
    out = []

    def is_pal(t):
        return t == t[::-1]

    for i, w in enumerate(words):
        for cut in range(len(w) + 1):
            left, right = w[:cut], w[cut:]
            if is_pal(left):  # a reverse of the right part goes before w
                j = index.get(right[::-1])
                if j is not None and j != i:
                    out.append([j, i])
            if cut != len(w) and is_pal(right):  # reverse of left: after w
                j = index.get(left[::-1])
                if j is not None and j != i:
                    out.append([i, j])
    return out
'''
pitfalls = [
    "Consider every split, including the empty prefix and the empty suffix.",
    "Skip the empty right part in the second check, or the pair (i, j) is found twice.",
    "Never pair a word with itself.",
]
examples = ["palindrome-pairs", "shortest-palindrome"]

[[extra.variant]]
name = "Shortest palindrome"
note = "Find the longest palindromic prefix with a rolling comparison; the rest, reversed, goes in front."
template = '''
def shortest_palindrome(s):
    rev = s[::-1]
    for i in range(len(s) + 1):
        if s.startswith(rev[i:]):  # the longest palindromic prefix of s
            return rev[:i] + s
    return s
'''

[[extra]]
id = "Tries:autocomplete"
name = "Autocomplete: counts on a sentence trie"
group = "Prefix counting, sums and autocomplete (counts on nodes, top-k at nodes)"
signals = [
    "suggest the most frequent sentences that start with what has been typed so far",
    "each node keeps the sentences below it with their counts, or the walk collects them with a DFS",
    "ties are broken by the smaller string (ASCII order)",
]
template = '''
import heapq


class AutocompleteSystem:
    def __init__(self, sentences, times):
        self.root, self.cur, self.node = {}, "", None
        self.node = self.root
        for s, t in zip(sentences, times):
            self._add(s, t)

    def _add(self, s, count):
        node = self.root
        for ch in s:
            node = node.setdefault(ch, {})
        node["#"] = node.get("#", 0) + count  # how often s was typed

    def input(self, c):
        if c == "#":
            self._add(self.cur, 1)
            self.cur, self.node = "", self.root
            return []
        self.cur += c
        if self.node is not None:
            self.node = self.node.get(c)
        if self.node is None:
            return []
        found = []  # collect (-count, sentence) under the prefix
        stack = [(self.node, self.cur)]
        while stack:
            node, text = stack.pop()
            for ch, child in node.items():
                if ch == "#":
                    found.append((-child, text))
                else:
                    stack.append((child, text + ch))
        return [s for _, s in heapq.nsmallest(3, found)]
'''
pitfalls = [
    "Remember the node of the current prefix so that each typed character costs one step.",
    "A '#' ends the sentence: add it to the trie and reset the walk.",
    "Sort by (-count, sentence): the highest count first, then the smaller string.",
]
examples = ["design-search-autocomplete-system"]

