id = "Tries:fuzzy"
name = "One wrong letter, or at most k edits"
group = "Wildcards and approximate matching (DFS through the trie)"
signals = [
    "does a dictionary word differ from the query in exactly one letter",
    "words within two edits of a query: carry an edit budget down the walk",
    "branch to every child with the budget reduced by one when the letter differs",
]
template_name = "Magic dictionary"
template = '''
class MagicDictionary:
    def __init__(self):
        self.root = {}

    def buildDict(self, dictionary):
        for w in dictionary:
            node = self.root
            for ch in w:
                node = node.setdefault(ch, {})
            node["$"] = True

    def search(self, word):
        def go(node, i, edits):
            if i == len(word):
                return "$" in node and edits == 1
            for ch, child in node.items():
                if ch == "$":
                    continue
                if ch == word[i]:
                    if go(child, i + 1, edits):
                        return True
                elif edits == 0 and go(child, i + 1, 1):
                    return True  # use the one change here
            return False

        return go(self.root, 0, 0)
'''
pitfalls = [
    "Spend the single change only when the letters differ, and finish with exactly one change used.",
    "A word of another length can never match: the walk must reach the end at the same index.",
    "For k edits pass the remaining budget and prune when it goes below zero.",
]
examples = ["implement-magic-dictionary", "words-within-two-edits-of-dictionary"]

[[extra.variant]]
name = "Words within two edits"
note = "For each query count the positions that differ with each dictionary word of the same length."
template = '''
def two_edit_words(queries, dictionary):
    out = []
    for q in queries:
        for w in dictionary:
            if len(w) == len(q) and sum(a != b for a, b in zip(q, w)) <= 2:
                out.append(q)  # one close word is enough
                break
    return out
'''

[[extra]]
id = "Tries:segment-dp"
name = "A trie inside a DP over positions"
group = "Trie with DP (word break and its cousins)"
signals = [
    "split a string into dictionary words and minimise the leftover letters",
    "dp[i] is the best for the first i letters: skip a letter, or take a word that ends at i",
    "a trie finds all dictionary words that start at a position in one walk",
]
template_name = "Extra characters in a string"
template = '''
def min_extra_char(s, dictionary):
    root = {}
    for w in dictionary:
        node = root
        for ch in w:
            node = node.setdefault(ch, {})
        node["$"] = True
    n = len(s)
    dp = [0] * (n + 1)  # dp[i]: fewest leftover letters in s[i:]
    for i in range(n - 1, -1, -1):
        dp[i] = dp[i + 1] + 1  # skip the letter s[i]
        node = root
        for j in range(i, n):
            if s[j] not in node:
                break
            node = node[s[j]]
            if "$" in node:
                dp[i] = min(dp[i], dp[j + 1])  # take the word s[i..j]
    return dp[0]
'''
pitfalls = [
    "Fill dp from the right so that dp[j + 1] is ready.",
    "Every word that starts at i is found by one walk down the trie from i.",
    "The default choice is to skip the letter at a cost of one.",
]
examples = ["extra-characters-in-a-string", "partition-string", "word-break"]

[[extra.variant]]
name = "Greedy segmentation (partition string)"
note = "Cut a new segment as soon as the current one has been seen before."
template = '''
def partition_string(s):
    seen, cur, out = set(), "", []
    for ch in s:
        cur += ch
        if cur not in seen:  # the shortest segment not seen yet
            seen.add(cur)
            out.append(cur)
            cur = ""
    return out
'''

