[[technique]]
id = "Tries:trie"
walk = "trie-insert"
group = "Aho-Corasick multi-pattern matching"
signals = [
    "does this word, or any word with this prefix, exist?",
    "insert words and check prefixes over and over",
    "a hash set can't answer prefix questions quickly",
]
template = '''
class Trie:
    def __init__(self):
        self.root = {}

    def insert(self, word):
        node = self.root
        for ch in word:
            node = node.setdefault(ch, {})
        node["$"] = True  # a word ends here

    def _walk(self, text):
        node = self.root
        for ch in text:
            if ch not in node:
                return None
            node = node[ch]
        return node

    def search(self, word):
        node = self._walk(word)
        return node is not None and "$" in node

    def starts_with(self, prefix):
        return self._walk(prefix) is not None
'''
pitfalls = [
    "The end-of-word marker is what separates search('app') from starts_with('app') after inserting only 'apple'.",
    "One helper that walks a string and returns the node makes search and starts_with one line each.",
    "Each operation costs O(length of the word), whatever the number of stored words.",
]

[[technique]]
id = "Tries:trie-dfs"
group = "Basic trie"
signals = [
    "search with wildcards: a '.' that matches any one letter",
    "at a wildcard, every child could match",
    "the search branches, so it recurses over the trie",
]
template = '''
class WordDictionary:
    def __init__(self):
        self.root = {}

    def add_word(self, word):
        node = self.root
        for ch in word:
            node = node.setdefault(ch, {})
        node["$"] = True

    def search(self, word):
        def match(node, i):
            if i == len(word):
                return "$" in node
            ch = word[i]
            if ch == ".":
                return any(match(child, i + 1)
                           for key, child in node.items() if key != "$")
            return ch in node and match(node[ch], i + 1)

        return match(self.root, 0)
'''
pitfalls = [
    "Only the wildcard branches. A search with no dots is the plain walk.",
    "Skip the end marker when trying every child, since it is not a letter.",
    "Reaching the end of the pattern needs the end-of-word flag as well.",
]

[[technique]]
id = "Tries:trie-grid"
group = "Word search on a grid with a trie (pruning)"
signals = [
    "find many words in a grid of letters",
    "searching for each word separately repeats the same walks",
    "the words share prefixes, so share the search",
]
template = '''
def find_words(board, words):
    root = {}
    for word in words:
        node = root
        for ch in word:
            node = node.setdefault(ch, {})
        node["$"] = word  # store the whole word at its end node

    rows, cols = len(board), len(board[0])
    found = []

    def explore(r, c, parent):
        ch = board[r][c]
        node = parent[ch]
        word = node.pop("$", None)  # take it once: no repeats
        if word:
            found.append(word)
        board[r][c] = "#"
        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            nr, nc = r + dr, c + dc
            if 0 <= nr < rows and 0 <= nc < cols and board[nr][nc] in node:
                explore(nr, nc, node)
        board[r][c] = ch
        if not node:
            del parent[ch]  # prune: nothing more to find below here

    for r in range(rows):
        for c in range(cols):
            if board[r][c] in root:
                explore(r, c, root)
    return found
'''
pitfalls = [
    "Search the board once, walking the trie alongside, instead of once per word.",
    "Only step to a neighbour if the trie has a child for its letter. That is what prunes the search.",
    "Delete exhausted branches of the trie. Later searches then skip them.",
]

[[extra]]
id = "Tries:xor-trie"
name = "Binary trie for the maximum XOR"
group = "XOR with a binary trie"
signals = [
    "the largest XOR of two numbers in a set, or of a number with any element not above a bound",
    "insert the numbers bit by bit from the highest; for a query take the opposite bit when that branch exists",
    "with a bound on the partner, sort the queries and insert numbers as the bound grows",
]
template_name = "Maximum XOR of two numbers"
template = '''
def find_maximum_xor(nums):
    root = {}
    for x in nums:
        node = root
        for bit in range(31, -1, -1):
            node = node.setdefault(x >> bit & 1, {})
    best = 0
    for x in nums:
        node, value = root, 0
        for bit in range(31, -1, -1):
            want = 1 - (x >> bit & 1)  # the opposite bit: a bigger XOR
            if want in node:
                value |= 1 << bit
                node = node[want]
            else:
                node = node[1 - want]
        best = max(best, value)
    return best
'''
pitfalls = [
    "Use the same width (32 bits) for every number so all paths have the same length.",
    "Greedy per bit is right: a higher bit is worth more than all lower bits together.",
    "A hash set of prefixes does the same job without building a trie.",
]
examples = ["maximum-xor-of-two-numbers-in-an-array", "maximum-xor-with-an-element-from-array"]

[[extra.variant]]
name = "Maximum XOR with an element not above a limit"
note = "Sort the queries by limit and insert numbers up to it before answering each query."
template = '''
def maximize_xor(nums, queries):
    nums.sort()
    order = sorted(range(len(queries)), key=lambda i: queries[i][1])
    out, root, j = [-1] * len(queries), {}, 0
    for qi in order:
        x, limit = queries[qi]
        while j < len(nums) and nums[j] <= limit:
            node = root
            for bit in range(31, -1, -1):
                node = node.setdefault(nums[j] >> bit & 1, {})
            j += 1
        if not root:
            continue  # no element is small enough: -1
        node, value = root, 0
        for bit in range(31, -1, -1):
            want = 1 - (x >> bit & 1)
            if want in node:
                value |= 1 << bit
                node = node[want]
            else:
                node = node[1 - want]
        out[qi] = value
    return out
'''

