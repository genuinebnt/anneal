template_name = "Remove sub-folders"
template = '''
def remove_subfolders(folder):
    root = {}
    for path in folder:
        node = root
        for name in path.split("/")[1:]:
            node = node.setdefault(name, {})
        node["$"] = path  # this folder was given
    out = []

    def walk(node):
        for name, child in node.items():
            if name == "$":
                out.append(child)  # keep it, and do not look inside
                return
        for name, child in node.items():
            walk(child)

    walk(root)
    return out
'''
pitfalls = [
    "A node that is marked as given hides everything below it: return as soon as it is found.",
    "Split the path on '/' and skip the empty first part.",
    "Sorting the paths and keeping those that do not start with the last kept path + '/' also works.",
]
examples = ["remove-sub-folders-from-the-filesystem", "design-file-system", "design-in-memory-file-system"]

[[extra.variant]]
name = "Design file system"
note = "A dict from full path to value; a path can be created only when its parent exists."
template = '''
class FileSystem:
    def __init__(self):
        self.value = {"": 0}  # the root, so that "/a" has a parent

    def createPath(self, path, value):
        parent = path[:path.rindex("/")]
        if path in self.value or parent not in self.value:
            return False
        self.value[path] = value
        return True

    def get(self, path):
        return self.value.get(path, -1)
'''

