pattern = "Binary Search"
intro = "Binary search works whenever a yes/no question flips exactly once as you move along an ordered range: false, false, false, true, true. The array can be sorted values, a rotated array, or just the numbers 1 to n with a test function. Decide what the question is, then find where it flips."
groups = ["Classic boundaries", "Rotated arrays", "Peaks and turning points", "2-D matrices", "Search on the answer (minimise the max / maximise the min)", "Real numbers", "Indices of other structures", "Kth element problems", "Counting-based search", "Unknown size / exponential search", "Oracle / interactive", "Binary lifting (cross-reference)", "Parametric search", "Binary search + two pointers", "Ternary search", "Bisect on tails (LIS)", "Weighted random pick", "Length, hashing and halves", "Inside data structures and offline", "Pitfalls"]










[[technique]]
id = "Binary Search:classic"
walk = "search-find"
group = "Real numbers"
signals = [
    "find a value in a sorted array",
    "return its index, or -1 when it isn't there",
    "the input is sorted and large",
]
template = '''
def search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1
'''
pitfalls = [
    "lo <= hi with lo = mid + 1 and hi = mid - 1: always move past mid, or the loop can stall.",
    "mid = (lo + hi) // 2 is safe in Python. In languages with fixed-size integers use lo + (hi - lo) // 2.",
    "A 2-D matrix that is sorted row by row is a 1-D array in disguise: index i is (i // cols, i % cols).",
]

[[technique]]
id = "Binary Search:insert-pos"
group = "Classic boundaries"
signals = [
    "where would this value go to keep the array sorted?",
    "the first element that is at least the target (or greater than it)",
    "count how many elements are smaller than a value",
]
template = '''
def lower_bound(nums, target):
    # The first index whose value is >= target (len(nums) if none).
    lo, hi = 0, len(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid
    return lo


def upper_bound(nums, target):
    # The first index whose value is > target.
    lo, hi = 0, len(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] <= target:
            lo = mid + 1
        else:
            hi = mid
    return lo
'''
pitfalls = [
    "Start hi at len(nums), not len(nums) - 1: inserting at the very end is a valid answer.",
    "lo < hi with hi = mid shrinks the range every time. This is the shape for 'first index where it becomes true'.",
    "The count of a value is upper_bound minus lower_bound. This is the same as bisect_left and bisect_right.",
]

[[technique]]
id = "Binary Search:by-count"
group = "Binary search + two pointers"
signals = [
    "the largest k such that some formula in k still fits (staircase rows, a square root)",
    "no array is given, only a number and a monotone test",
    "binary search over 1..n with a test function",
]
template = '''
def arrange_coins(n):
    # The largest k with 1 + 2 + ... + k <= n.
    lo, hi = 0, n
    while lo < hi:
        mid = (lo + hi + 1) // 2  # round UP, because we keep lo = mid
        if mid * (mid + 1) // 2 <= n:
            lo = mid
        else:
            hi = mid - 1
    return lo
'''
pitfalls = [
    "When the loop keeps lo = mid, round mid up. Rounding down makes lo = mid stall forever.",
    "Write the test as a function of mid first, then pick which half to keep.",
    "A closed form (a square root) exists here, but the binary search generalises when there isn't one.",
]

[[technique]]
id = "Binary Search:on-answer"
walk = "search-first-true"
group = "Search on the answer (minimise the max / maximise the min)"
signals = [
    "the smallest value that makes something possible (a speed, a capacity, a time)",
    "you can check a guess quickly, and bigger guesses are never worse",
    "minimise the maximum, or maximise the minimum",
]
template = '''
def min_eating_speed(piles, hours):
    def can_finish(speed):
        needed = sum(-(-p // speed) for p in piles)  # ceil(p / speed)
        return needed <= hours

    lo, hi = 1, max(piles)  # the answer is in [1, the biggest pile]
    while lo < hi:
        mid = (lo + hi) // 2
        if can_finish(mid):
            hi = mid
        else:
            lo = mid + 1
    return lo
'''
pitfalls = [
    "Search over the ANSWER's range, not over the input. Bounds come from the problem (at least 1, at most the biggest item).",
    "can_finish must be monotone: once true for a speed it stays true for every faster one.",
    "Ceiling division without floats: -(-a // b).",
]

[[technique]]
id = "Binary Search:rotated"
group = "Binary search + two pointers"
signals = [
    "a sorted array that was rotated at some unknown point",
    "find the minimum, or search for a target",
    "one half around mid is always sorted",
]
template = '''
def find_min(nums):
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] > nums[hi]:  # the drop is to the right of mid
            lo = mid + 1
        else:
            hi = mid
    return nums[lo]


def search_rotated(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        if nums[lo] <= nums[mid]:  # the left half is sorted
            if nums[lo] <= target < nums[mid]:
                hi = mid - 1
            else:
                lo = mid + 1
        else:  # the right half is sorted
            if nums[mid] < target <= nums[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
    return -1
'''
pitfalls = [
    "Compare with nums[hi], not nums[lo], to find the minimum. It works for an array that was never rotated.",
    "To search, first decide which half is sorted, then check if the target lies inside it.",
    "With duplicates the sorted half can't always be told apart. That needs a linear step when nums[lo] == nums[mid] == nums[hi].",
]

[[technique]]
id = "Binary Search:weighted"
group = "Binary search + two pointers"
signals = [
    "pick a random index with probability proportional to a weight",
    "turn weights into cumulative sums, then find where a random number lands",
    "a prefix sum array is sorted, so bisect works",
]
template = '''
import random
from bisect import bisect_right
from itertools import accumulate


class WeightedPicker:
    def __init__(self, weights):
        self.prefix = list(accumulate(weights))  # [3, 4, 9] for [3, 1, 5]
        self.total = self.prefix[-1]

    def pick(self, r=None):
        if r is None:
            r = random.randrange(self.total)  # 0 .. total - 1
        return bisect_right(self.prefix, r)  # the first prefix above r
'''
pitfalls = [
    "A number r in [0, total) falls in the first bucket whose prefix is greater than r, so use bisect_right.",
    "Weight w[i] owns w[i] of the numbers, which makes its probability w[i] / total.",
    "Build the prefix sums once in the constructor. Each pick is then O(log n).",
]

[[technique]]
id = "Binary Search:partition"
group = "Binary search + two pointers"
signals = [
    "the median or k-th item of two sorted arrays in O(log n)",
    "split both arrays so that the left parts together hold the lower half",
    "binary search over how many items come from the shorter array",
]
template = '''
def find_median(a, b):
    if len(a) > len(b):
        a, b = b, a  # search the shorter one
    half = (len(a) + len(b) + 1) // 2
    lo, hi = 0, len(a)
    inf = float("inf")
    while lo <= hi:
        i = (lo + hi) // 2  # items taken from a
        j = half - i        # items taken from b
        a_left = a[i - 1] if i else -inf
        a_right = a[i] if i < len(a) else inf
        b_left = b[j - 1] if j else -inf
        b_right = b[j] if j < len(b) else inf
        if a_left > b_right:
            hi = i - 1
        elif b_left > a_right:
            lo = i + 1
        else:  # a valid split
            if (len(a) + len(b)) % 2:
                return max(a_left, b_left)
            return (max(a_left, b_left) + min(a_right, b_right)) / 2
'''
pitfalls = [
    "Use infinity for the missing neighbours at either end of an array.",
    "A split is valid when each left item is no bigger than the opposite right item (a_left <= b_right and b_left <= a_right).",
    "Search the shorter array so j can never go out of range.",
]

[[technique]]
id = "Binary Search:peak"
group = "Binary search + two pointers"
signals = [
    "a peak or a turning point in an array that goes up then down",
    "compare an element with its neighbour to know which side the peak is on",
    "the array isn't sorted, but it has a direction",
]
template = '''
def find_peak(nums):
    # Any index that is larger than its neighbours (the ends count as -inf).
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < nums[mid + 1]:  # still climbing: peak is right
            lo = mid + 1
        else:
            hi = mid
    return lo
'''
pitfalls = [
    "Compare mid with mid + 1. The slope tells you which side must contain a peak.",
    "hi = mid, not mid - 1: mid itself may be the peak.",
    "For a mountain array with a target, find the peak first, then binary search each side separately.",
]

[[extra]]
id = "Binary Search:matrix-sorted"
name = "Rows and columns both sorted: the staircase"
group = "2-D matrices"
signals = [
    "a matrix whose rows are sorted left to right and columns top to bottom, not one long sorted list",
    "start at a corner where one move makes the value bigger and the other smaller",
    "each step discards a whole row or a whole column: O(rows + cols)",
]
template_name = "Search a 2D matrix II"
template = '''
def search_matrix(matrix, target):
    r, c = 0, len(matrix[0]) - 1  # the top-right corner
    while r < len(matrix) and c >= 0:
        v = matrix[r][c]
        if v == target:
            return True
        if v > target:
            c -= 1  # everything below in this column is bigger too
        else:
            r += 1  # everything to the left in this row is smaller too
    return False
'''
pitfalls = [
    "Start at the top-right (or bottom-left): from the top-left both moves only increase.",
    "Every comparison removes one row or one column, so the walk is at most rows + cols steps.",
    "When the whole matrix is one sorted sequence, a single binary search over rows * cols is faster.",
]
examples = ["search-a-2d-matrix-ii", "count-negative-numbers-in-a-sorted-matrix", "kth-smallest-element-in-a-sorted-matrix"]

[[extra.variant]]
name = "Count negatives"
note = "The same staircase from the bottom-left: each row's negatives start where the walk turns."
template = '''
def count_negatives(grid):
    rows, cols = len(grid), len(grid[0])
    r, c, count = 0, cols - 1, 0  # the top-right corner
    while r < rows and c >= 0:
        if grid[r][c] < 0:
            count += rows - r  # the whole column below is negative too
            c -= 1
        else:
            r += 1
    return count
'''

[[extra.variant]]
name = "Kth smallest by value"
note = "Binary search the value; count how many entries are at most it with the staircase."
template = '''
def kth_smallest(matrix, k):
    n = len(matrix)

    def count_le(x):
        r, c, count = n - 1, 0, 0  # the bottom-left corner
        while r >= 0 and c < n:
            if matrix[r][c] <= x:
                count += r + 1  # this whole column up to r is <= x
                c += 1
            else:
                r -= 1
        return count

    lo, hi = matrix[0][0], matrix[-1][-1]
    while lo < hi:
        mid = (lo + hi) // 2
        if count_le(mid) >= k:
            hi = mid
        else:
            lo = mid + 1
    return lo
'''

[[extra]]
id = "Binary Search:kth-by-count"
name = "K-th smallest by binary searching the value"
group = "Kth element problems"
signals = [
    "the k-th smallest pair distance, product, sum or fraction: there are far too many pairs to list",
    "count how many pairs are at most x; the answer is the smallest x whose count reaches k",
    "the count is a two-pointer or bisect sweep, so each guess costs O(n)",
]
template_name = "K-th smallest pair distance"
template = '''
def smallest_distance_pair(nums, k):
    nums.sort()

    def count_le(d):  # pairs with a difference of at most d
        count, left = 0, 0
        for right in range(len(nums)):
            while nums[right] - nums[left] > d:
                left += 1
            count += right - left
        return count

    lo, hi = 0, nums[-1] - nums[0]
    while lo < hi:
        mid = (lo + hi) // 2
        if count_le(mid) >= k:
            hi = mid
        else:
            lo = mid + 1
    return lo
'''
pitfalls = [
    "Search the value range, not the list of pairs: the answer is the smallest d with at least k pairs at most d.",
    "A count of exactly k is not needed: use >= k and keep the smaller half.",
    "The count must be monotone in the guess: more allowed distance, more pairs.",
]
examples = ["find-k-th-smallest-pair-distance", "kth-smallest-product-of-two-sorted-arrays"]

[[extra.variant]]
name = "K-th smallest prime fraction"
note = "Count the fractions at most x with two pointers over the sorted array, remembering the largest one seen."
template = '''
def kth_smallest_prime_fraction(arr, k):
    n = len(arr)
    lo, hi = 0.0, 1.0
    while True:
        mid = (lo + hi) / 2
        count, best, j = 0, (0, 1, 0), 1
        for i in range(n - 1):
            while j < n and arr[i] > mid * arr[j]:
                j += 1  # the first j with arr[i] / arr[j] <= mid
            count += n - j
            if j < n and arr[i] * best[1] > best[0] * arr[j]:
                best = (arr[i], arr[j], 0)  # the largest fraction so far
        if count == k:
            return [best[0], best[1]]
        if count < k:
            lo = mid
        else:
            hi = mid
'''

[[extra]]
id = "Binary Search:min-gap"
name = "Maximise the smallest gap or piece"
group = "Search on the answer (minimise the max / maximise the min)"
signals = [
    "place k items as far apart as possible, or cut pieces as long as possible",
    "feasible(x) greedily places items at least x apart: if x works, so does anything smaller",
    "binary search the largest x that is still feasible (round mid up)",
]
template_name = "Magnetic force between balls"
template = '''
def max_distance(position, m):
    position.sort()

    def can(gap):  # can m balls be at least gap apart?
        count, last = 1, position[0]
        for p in position[1:]:
            if p - last >= gap:
                count += 1
                last = p  # place the next ball as early as possible
        return count >= m

    lo, hi = 1, position[-1] - position[0]
    while lo < hi:
        mid = (lo + hi + 1) // 2  # round up so that lo = mid always moves
        if can(mid):
            lo = mid
        else:
            hi = mid - 1
    return lo
'''
pitfalls = [
    "Round mid up when you move lo to mid, or the loop never ends on lo + 1 == hi.",
    "Place each ball as early as it can go: leaving room for the others is the greedy choice.",
    "For 'minimise the maximum' flip the roles: smallest x that is feasible, round mid down.",
]
examples = ["magnetic-force-between-two-balls", "cutting-ribbons", "maximum-candies-allocated-to-k-children", "divide-chocolate", "house-robber-iv"]

[[extra.variant]]
name = "Cutting ribbons"
note = "The largest length that still gives at least k pieces."
template = '''
def max_length(ribbons, k):
    lo, hi = 0, max(ribbons)
    while lo < hi:
        mid = (lo + hi + 1) // 2
        if sum(r // mid for r in ribbons) >= k:
            lo = mid  # mid works: try a longer piece
        else:
            hi = mid - 1
    return lo
'''

[[extra.variant]]
name = "House robber IV (minimise the maximum)"
note = "The smallest capability such that k non-adjacent houses are each worth at most it."
template = '''
def min_capability(nums, k):
    def can(cap):  # rob greedily every house with value <= cap
        count, i = 0, 0
        while i < len(nums):
            if nums[i] <= cap:
                count += 1
                i += 2  # skip the neighbour
            else:
                i += 1
        return count >= k

    lo, hi = min(nums), max(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if can(mid):
            hi = mid
        else:
            lo = mid + 1
    return lo
'''

[[extra]]
id = "Binary Search:time-to-finish"
name = "Smallest time or rate that finishes the work"
group = "Search on the answer (minimise the max / maximise the min)"
signals = [
    "the least time, speed or divisor so that a total requirement is met",
    "given a guess, the work done is a sum of floor divisions: easy to compute and monotone",
