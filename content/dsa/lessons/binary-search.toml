def my_sqrt(x):
    lo, hi = 0, x
    while lo < hi:
        mid = (lo + hi + 1) // 2  # round up: lo = mid must move
        if mid * mid <= x:
            lo = mid
        else:
            hi = mid - 1
    return lo
'''
pitfalls = [
    "Search for the largest x with x * x <= n; round mid up so the loop terminates.",
    "For a real answer loop a fixed number of times instead of comparing floats with ==.",
    "Newton's method (x = (x + n / x) / 2) converges much faster for square roots.",
]
examples = ["sqrtx", "valid-perfect-square", "separate-squares-i"]

[[extra.variant]]
name = "Newton's method"
note = "Each step averages x and n / x; start high and stop when it no longer decreases."
template = '''
def my_sqrt_newton(n):
    if n < 2:
        return n
    x = n
    while x * x > n:
        x = (x + n // x) // 2  # moves down towards the root
    return x
'''

[[extra.variant]]
name = "Separate squares (real line)"
note = "The area below a horizontal line y grows with y: bisect until the two areas are equal."
template = '''
def separate_squares(squares):
    total = sum(l * l for _, _, l in squares)

    def below(y):  # area of the squares under the line
        return sum(l * min(max(y - yi, 0), l) for _, yi, l in squares)

    lo = min(yi for _, yi, _ in squares)
    hi = max(yi + l for _, yi, l in squares)
    for _ in range(100):  # a fixed number of halvings
        mid = (lo + hi) / 2
        if below(mid) * 2 < total:
            lo = mid
        else:
            hi = mid
    return lo
'''

[[extra]]
id = "Binary Search:bisect-other"
name = "Bisect a per-item history"
group = "Indices of other structures"
signals = [
    "values with timestamps or versions, and a query for 'the value at or before time t'",
    "per key (or per index) keep a sorted list of changes and bisect it",
    "also: the nearest candle, the first word with a prefix: sorted arrays plus bisect",
]
template_name = "Snapshot array"
template = '''
from bisect import bisect_right


class SnapshotArray:
    def __init__(self, length):
        self.history = [[(0, 0)] for _ in range(length)]  # (snap id, value)
        self.current = 0  # the id of the next snapshot

    def set(self, index, val):
        h = self.history[index]
        if h[-1][0] == self.current:
            h[-1] = (self.current, val)  # overwrite within this snapshot
        else:
            h.append((self.current, val))

    def snap(self):
        self.current += 1
        return self.current - 1

    def get(self, index, snap_id):
        h = self.history[index]
        # the last change made at or before snap_id
        i = bisect_right(h, (snap_id, float("inf"))) - 1
        return h[i][1]
'''
pitfalls = [
    "Store only changes, not full copies: memory grows with the number of sets, not snapshots times length.",
    "bisect_right with (snap_id, inf) finds the last entry whose snapshot id is at most snap_id.",
    "A set after a snapshot belongs to the next snapshot id: keep one counter for the id that is current.",
]
examples = ["snapshot-array", "time-based-key-value-store", "search-suggestions-system", "plates-between-candles"]

[[extra.variant]]
name = "Search suggestions (sorted words)"
note = "Sort the words; for each prefix the matches are a contiguous block starting at bisect_left."
template = '''
from bisect import bisect_left


def suggested_products(products, search_word):
    products.sort()
    out, prefix = [], ""
    for ch in search_word:
        prefix += ch
        i = bisect_left(products, prefix)  # the first word >= prefix
        out.append([w for w in products[i:i + 3] if w.startswith(prefix)])
    return out
'''

[[extra.variant]]
name = "Plates between candles"
note = "Prefix counts of plates, and for each position the nearest candle on each side."
template = '''
def plates_between_candles(s, queries):
    n = len(s)
    plates = [0] * (n + 1)  # plates[i]: plates in s[:i]
    left, right = [-1] * n, [n] * n  # nearest candle at or before / after i
    last = -1
    for i, ch in enumerate(s):
        plates[i + 1] = plates[i] + (ch == "*")
        if ch == "|":
            last = i
        left[i] = last
    last = n
    for i in range(n - 1, -1, -1):
        if s[i] == "|":
            last = i
        right[i] = last
    out = []
    for a, b in queries:
        lo, hi = right[a], left[b]  # the candles just inside the query
        out.append(plates[hi] - plates[lo] if lo < hi else 0)
    return out
'''

[[extra]]
id = "Binary Search:lis-tails"
name = "Longest increasing subsequence with a tails array"
group = "Bisect on tails (LIS)"
signals = [
    "the length of the longest increasing subsequence in O(n log n)",
    "tails[i] is the smallest last value of an increasing subsequence of length i + 1; the array stays sorted",
    "each new value replaces the first tail that is not smaller (strict) or larger (non-decreasing)",
]
template_name = "Strictly increasing"
template = '''
from bisect import bisect_left


def length_of_lis(nums):
    tails = []  # tails[i]: smallest end of a subsequence of length i + 1
    for x in nums:
        i = bisect_left(tails, x)  # the first tail >= x
        if i == len(tails):
            tails.append(x)  # x extends the longest subsequence
        else:
            tails[i] = x  # a smaller end for the same length
    return len(tails)
'''
pitfalls = [
    "tails is not the subsequence itself, only its length is meaningful.",
    "bisect_left gives a strictly increasing result; bisect_right allows equal values (non-decreasing).",
    "Keep another array of parents if the subsequence itself is needed.",
]
examples = ["longest-increasing-subsequence", "russian-doll-envelopes", "find-the-longest-valid-obstacle-course-at-each-position", "number-of-longest-increasing-subsequence"]

[[extra.variant]]
name = "Obstacle course (non-decreasing)"
note = "For every position, the length of the longest non-decreasing subsequence ending there."
template = '''
from bisect import bisect_right


def longest_obstacle_course(obstacles):
    tails, out = [], []
    for x in obstacles:
        i = bisect_right(tails, x)  # equal values may follow each other
        if i == len(tails):
            tails.append(x)
        else:
            tails[i] = x
        out.append(i + 1)  # the length of the subsequence ending here
    return out
'''

[[extra.variant]]
name = "Russian doll envelopes"
note = "Sort by width ascending, height descending on ties; then LIS on heights."
template = '''
from bisect import bisect_left


def max_envelopes(envelopes):
    envelopes.sort(key=lambda e: (e[0], -e[1]))  # equal widths can not nest
    tails = []
    for _, h in envelopes:
        i = bisect_left(tails, h)
        if i == len(tails):
            tails.append(h)
        else:
            tails[i] = h
    return len(tails)
'''

[[extra]]
id = "Binary Search:sorted-then-bisect"
name = "Sort, then bisect the partner"
group = "Binary search + two pointers"
signals = [
    "count pairs whose sum lies in a range, or match each query to the best item under a bound",
    "sort the values once; for each element a binary search finds how many partners work",
    "the answer for each query is a count or the best prefix maximum",
]
template_name = "Count fair pairs"
template = '''
from bisect import bisect_left, bisect_right


def count_fair_pairs(nums, lower, upper):
    nums.sort()
    count = 0
    for i, x in enumerate(nums):
        # partners after i with lower <= x + y <= upper
        lo = bisect_left(nums, lower - x, i + 1)
        hi = bisect_right(nums, upper - x, i + 1)
        count += hi - lo
    return count
'''
pitfalls = [
    "Search only to the right of i so each pair is counted once, and bisect from i + 1.",
    "The pair order does not matter for the count, so sorting is allowed.",
    "bisect_left for the lower bound and bisect_right for the upper bound give an inclusive range.",
]
examples = ["count-the-number-of-fair-pairs", "count-pairs-whose-sum-is-less-than-target", "successful-pairs-of-spells-and-potions", "most-profit-assigning-work"]

[[extra.variant]]
name = "Successful pairs of spells and potions"
note = "Sort the potions; a spell succeeds with every potion at or above ceil(success / spell)."
template = '''
from bisect import bisect_left


def successful_pairs(spells, potions, success):
    potions.sort()
    m = len(potions)
    # the smallest potion that works is at least success / spell
    return [m - bisect_left(potions, -(-success // s)) for s in spells]
'''

[[extra.variant]]
name = "Most profit assigning work"
note = "Sort jobs by difficulty and keep the best profit so far; bisect each worker's ability."
template = '''
from bisect import bisect_right


def max_profit_assignment(difficulty, profit, worker):
    jobs = sorted(zip(difficulty, profit))
    diffs = [d for d, _ in jobs]
    best, run = [], 0
    for _, p in jobs:
        run = max(run, p)
        best.append(run)  # the best profit among jobs up to here
    total = 0
    for w in worker:
        i = bisect_right(diffs, w) - 1  # the hardest job the worker can do
        total += best[i] if i >= 0 else 0
    return total
'''

[[extra]]
id = "Binary Search:first-true"
walk = "search-first-true"
name = "First true in a monotone yes/no"
group = "Classic boundaries"
signals = [
    "the first bad version, the first index where a property holds, the first letter above a target",
    "a predicate that is false, false, ..., true, true: find the boundary",
    "the loop keeps lo as a possible answer and hi as a known true",
]
template_name = "First bad version"
template = '''
def first_bad_version(n, is_bad):
    lo, hi = 1, n  # hi is bad, by the problem's promise
    while lo < hi:
        mid = (lo + hi) // 2
        if is_bad(mid):
            hi = mid  # mid might be the first: keep it
        else:
            lo = mid + 1  # mid is good: the answer is after it
    return lo
'''
pitfalls = [
    "Never write hi = mid - 1 here: mid itself may be the answer.",
    "lo < hi (not <=) with hi = mid always shrinks the range, so the loop ends with lo == hi.",
    "Make sure the predicate really is monotone before binary searching it.",
]
examples = ["first-bad-version", "h-index-ii", "find-smallest-letter-greater-than-target", "find-target-indices-after-sorting-array"]

[[extra.variant]]
name = "H-index II"
note = "The citations are sorted: the first index i with citations[i] >= n - i gives h = n - i."
template = '''
def h_index(citations):
    n = len(citations)
    lo, hi = 0, n
    while lo < hi:
        mid = (lo + hi) // 2
        if citations[mid] >= n - mid:  # n - mid papers have that many
            hi = mid
        else:
            lo = mid + 1
    return n - lo
'''

[[extra.variant]]
name = "Smallest letter greater than target"
note = "The first letter strictly above the target, wrapping to the first letter when none is."
template = '''
from bisect import bisect_right


def next_greatest_letter(letters, target):
    i = bisect_right(letters, target)  # the first letter > target
    return letters[i % len(letters)]  # wrap around the end
'''

[[extra]]
id = "Binary Search:missing-count"
name = "Counting what is missing before an index"
group = "Counting-based search"
signals = [
    "the k-th missing positive number, or the k-th missing number in a sorted list",
    "at index i the count of missing numbers before arr[i] is arr[i] - (i + 1): it never decreases",
    "binary search the first index where that count reaches k",
]
template_name = "K-th missing positive number"
template = '''
def find_kth_positive(arr, k):
    lo, hi = 0, len(arr)
    while lo < hi:
        mid = (lo + hi) // 2
        if arr[mid] - (mid + 1) < k:  # fewer than k missing before it
            lo = mid + 1
        else:
            hi = mid
    return lo + k  # lo numbers of arr come before the answer
'''
pitfalls = [
    "Missing before arr[i] = arr[i] - (i + 1): that is the monotone quantity to search.",
    "The answer is lo + k: skip the lo numbers that are present before it.",
    "If k is larger than anything missing in the array, lo is len(arr) and the answer is beyond the last number.",
]
examples = ["kth-missing-positive-number", "missing-element-in-sorted-array", "single-element-in-a-sorted-array", "missing-number-in-arithmetic-progression"]

[[extra.variant]]
name = "Single element in a sorted array"
note = "Pairs sit at (even, odd) indexes until the single element; compare mid with its partner."
template = '''
def single_non_duplicate(nums):
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if mid % 2:
            mid -= 1  # make mid the first of a possible pair
        if nums[mid] == nums[mid + 1]:
            lo = mid + 2  # the pairs are intact up to here
        else:
            hi = mid  # the single element is at mid or before
    return nums[lo]
'''

[[extra.variant]]
name = "Missing number in an arithmetic progression"
note = "Before the gap element i equals first + i * d; binary search the first index that breaks that."
template = '''
def missing_number(arr):
    n = len(arr)
    d = (arr[-1] - arr[0]) // n  # the common difference
    lo, hi = 0, n - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if arr[mid] == arr[0] + mid * d:
            lo = mid + 1  # still on the progression
        else:
            hi = mid
    return arr[0] + lo * d
'''

[[extra]]
id = "Binary Search:merge-count"
name = "Count pairs while merge sorting"
group = "Counting-based search"
signals = [
    "count pairs (i < j) with a relation between the values, such as nums[i] > 2 * nums[j]",
    "merge sort splits the pairs into left-left, right-right and left-right; the last is counted while merging",
    "both halves are sorted, so the cross pairs are counted with two pointers",
]
template_name = "Reverse pairs"
template = '''
def reverse_pairs(nums):
    def sort(a):
        if len(a) <= 1:
            return a, 0
        mid = len(a) // 2
        left, cl = sort(a[:mid])
        right, cr = sort(a[mid:])
        count, j = cl + cr, 0
        for x in left:  # both halves are sorted
            while j < len(right) and x > 2 * right[j]:
                j += 1  # right[:j] are all smaller than x / 2
            count += j
        return sorted(left + right), count  # the merge step

    return sort(nums)[1]
'''
pitfalls = [
    "Count the cross pairs before merging, while both halves are still sorted.",
    "The pointer j never moves back: x grows along the sorted left half.",
    "The merge itself can use sorted() here; a hand-written merge makes the whole thing O(n log n) in practice.",
]
examples = ["reverse-pairs", "count-of-smaller-numbers-after-self"]

[[extra.variant]]
name = "Count of smaller numbers after self"
note = "Merge sort on (value, index) pairs; when a left element moves out, add how many right elements went before it."
template = '''
def count_smaller(nums):
    n = len(nums)
    counts = [0] * n

    def sort(items):
        if len(items) <= 1:
            return items
        mid = len(items) // 2
        left, right = sort(items[:mid]), sort(items[mid:])
        merged, j = [], 0
        for v, i in left:
            while j < len(right) and right[j][0] < v:
                merged.append(right[j])
                j += 1  # these right elements are smaller than v
            counts[i] += j
            merged.append((v, i))
        merged.extend(right[j:])
        return merged

    sort([(v, i) for i, v in enumerate(nums)])
    return counts
'''

[[extra.variant]]
name = "Count of range sum"
note = "Prefix sums turn it into counting pairs (i < j) with lower <= p[j] - p[i] <= upper: count them while merge sorting."
template = '''
def count_range_sum(nums, lower, upper):
    prefix = [0]
    for x in nums:
        prefix.append(prefix[-1] + x)

    def sort(a):
        if len(a) <= 1:
            return a, 0
        mid = len(a) // 2
        left, cl = sort(a[:mid])
        right, cr = sort(a[mid:])
        count, lo, hi = cl + cr, 0, 0
        for x in left:  # both halves are sorted: a window in right
            while lo < len(right) and right[lo] - x < lower:
                lo += 1
            while hi < len(right) and right[hi] - x <= upper:
                hi += 1
            count += hi - lo
        return sorted(left + right), count

    return sort(prefix)[1]
'''

