]
template_name = "Minimum time to complete trips"
template = '''
def minimum_time(time, total_trips):
    def trips(t):  # trips completed by time t
        return sum(t // x for x in time)

    lo, hi = 1, min(time) * total_trips  # the fastest bus alone works
    while lo < hi:
        mid = (lo + hi) // 2
        if trips(mid) >= total_trips:
            hi = mid
        else:
            lo = mid + 1
    return lo
'''
pitfalls = [
    "The upper bound is a value that certainly works, such as the fastest worker doing everything.",
    "Use integer division for the work done: no floats and no rounding errors.",
    "Smallest feasible value: when feasible, keep it (hi = mid); when not, skip it (lo = mid + 1).",
]
examples = ["minimum-time-to-complete-trips", "minimum-time-to-repair-cars", "minimum-number-of-days-to-make-m-bouquets", "find-the-smallest-divisor-given-a-threshold", "minimum-speed-to-arrive-on-time"]

[[extra.variant]]
name = "Bouquets"
note = "A day works if the flowers bloomed by then form enough runs of k adjacent ones."
template = '''
def min_days(bloom_day, m, k):
    if m * k > len(bloom_day):
        return -1

    def ok(day):
        bouquets = run = 0
        for b in bloom_day:
            run = run + 1 if b <= day else 0
            if run == k:
                bouquets += 1
                run = 0  # the flowers are used up
        return bouquets >= m

    lo, hi = min(bloom_day), max(bloom_day)
    while lo < hi:
        mid = (lo + hi) // 2
        if ok(mid):
            hi = mid
        else:
            lo = mid + 1
    return lo
'''

[[extra.variant]]
name = "Smallest divisor given a threshold"
note = "The sum of ceilings falls as the divisor grows."
template = '''
def smallest_divisor(nums, threshold):
    lo, hi = 1, max(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if sum(-(-x // mid) for x in nums) <= threshold:  # ceiling division
            hi = mid
        else:
            lo = mid + 1
    return lo
'''

[[extra.variant]]
name = "Minimum speed to arrive on time"
note = "All but the last train wait for the next whole hour; the last one is exact."
template = '''
def min_speed_on_time(dist, hour):
    def time(v):
        return sum(-(-d // v) for d in dist[:-1]) + dist[-1] / v

    if len(dist) - 1 >= hour:
        return -1  # each of the first trains costs at least one hour
    lo, hi = 1, 10**7
    while lo < hi:
        mid = (lo + hi) // 2
        if time(mid) <= hour:
            hi = mid
        else:
            lo = mid + 1
    return lo if time(lo) <= hour else -1  # even the top speed is too slow
'''

