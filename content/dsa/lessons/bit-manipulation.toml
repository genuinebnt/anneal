def largest_combination(candidates):
    best = 0
    for bit in range(32):
        # numbers that all share this bit have a non-zero AND
        best = max(best, sum(x >> bit & 1 for x in candidates))
    return best
'''
pitfalls = [
    "A group has AND > 0 exactly when some bit is set in every member: the best group per bit is all numbers with that bit.",
    "Check each of the 32 bits independently.",
    "A k-OR sets a bit when at least k numbers have it: the same count, a different comparison.",
]
examples = ["largest-combination-with-bitwise-and-greater-than-zero", "find-the-k-or-of-an-array", "sort-integers-by-the-number-of-1-bits", "find-if-array-can-be-sorted"]

[[extra.variant]]
name = "K-or of an array"
note = "A bit is in the answer when at least k numbers have it."
template = '''
def find_k_or(nums, k):
    result = 0
    for bit in range(32):
        if sum(x >> bit & 1 for x in nums) >= k:
            result |= 1 << bit
    return result
'''

[[extra.variant]]
name = "Sort by number of one bits"
note = "A tuple key (popcount, value) sorts by the number of ones and breaks ties by value."
template = '''
def sort_by_bits(arr):
    return sorted(arr, key=lambda x: (bin(x).count("1"), x))
'''

[[extra.variant]]
name = "Can the array be sorted (equal popcount swaps)"
note = "Only numbers with the same popcount can swap: split into runs of equal popcount and compare run bounds."
template = '''
def can_sort_array(nums):
    prev_max = float("-inf")
    i = 0
    while i < len(nums):
        pop = bin(nums[i]).count("1")
        lo = hi = nums[i]
        while i < len(nums) and bin(nums[i]).count("1") == pop:
            lo, hi = min(lo, nums[i]), max(hi, nums[i])
            i += 1
        if lo < prev_max:
            return False  # smaller than the previous run's maximum
        prev_max = hi
    return True
'''

[[extra]]
id = "Bit Manipulation:binary-shape"
name = "Shape tests on a binary number"
group = "Binary representation problems"
signals = [
    "are the bits alternating, what is the longest gap between ones, is it a power of two or of four",
    "x & (x - 1) clears the lowest set bit; x ^ (x >> 1) is 1 where neighbouring bits differ",
    "a number of the form 2^k - 1 (all ones) satisfies y & (y + 1) == 0",
]
template_name = "Alternating bits"
template = '''
def has_alternating_bits(n):
    y = n ^ (n >> 1)  # all ones exactly when the bits alternate
    return y & (y + 1) == 0
'''
pitfalls = [
    "x ^ (x >> 1) turns alternating bits into a run of ones.",
    "A run of ones 2^k - 1 plus one is a power of two: AND with it is 0.",
    "Binary gap: remember the position of the previous 1 while shifting.",
]
examples = ["binary-number-with-alternating-bits", "binary-gap", "power-of-two"]

[[extra.variant]]
name = "Binary gap"
note = "The longest distance between two adjacent ones."
template = '''
def binary_gap(n):
    last, best, pos = -1, 0, 0
    while n:
        if n & 1:
            if last != -1:
                best = max(best, pos - last)
            last = pos
        n >>= 1
        pos += 1
    return best
'''

