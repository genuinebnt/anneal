template_name = "Original array from prefix XOR"
template = '''
def find_array(pref):
    out = [pref[0]]
    for i in range(1, len(pref)):
        out.append(pref[i] ^ pref[i - 1])  # undo the running XOR
    return out
'''
pitfalls = [
    "pref[i] = pref[i - 1] ^ arr[i], so arr[i] = pref[i] ^ pref[i - 1].",
    "A circular array of neighbour XORs is consistent only when the XOR of all of them is 0.",
    "The same idea gives range XOR queries: XOR of prefixes at the two ends.",
]
examples = ["find-the-original-array-of-prefix-xor", "neighboring-bitwise-xor", "maximum-xor-for-each-query"]

[[extra.variant]]
name = "Neighbouring bitwise XOR"
note = "derived[i] = original[i] ^ original[i + 1 (circular)]: a valid original exists iff the XOR of derived is 0."
template = '''
def does_valid_array_exist(derived):
    xor = 0
    for x in derived:
        xor ^= x
    return xor == 0
'''

[[extra.variant]]
name = "Maximum XOR for each query"
note = "The best k below 2^m is the complement of the total XOR; remove elements from the end one by one."
template = '''
def get_maximum_xor(nums, maximum_bit):
    mask = (1 << maximum_bit) - 1
    total, out = 0, []
    for x in nums:
        total ^= x
    for x in reversed(nums):  # each query drops the last element
        out.append(total ^ mask)  # flip every bit of total within the width
        total ^= x
    return out
'''

[[extra]]
id = "Bit Manipulation:parity-mask"
name = "Parity state as a mask"
group = "Bit manipulation for sets"
signals = [
    "a substring where every vowel (or letter) appears an even number of times, or can be rearranged into a palindrome",
    "one bit per symbol holds its parity so far; the whole state fits in an integer",
    "two prefixes with the same mask bound a substring with all-even counts: remember the first index of each mask",
]
template_name = "Vowels in even counts"
template = '''
def find_the_longest_substring(s):
    bit = {"a": 1, "e": 2, "i": 4, "o": 8, "u": 16}
    first = {0: -1}  # the first index at which each mask was seen
    mask = best = 0
    for i, ch in enumerate(s):
        mask ^= bit.get(ch, 0)  # flip the parity of this vowel
        if mask in first:
            best = max(best, i - first[mask])
        else:
            first[mask] = i
    return best
'''
pitfalls = [
    "Store the first index of a mask only once: the earliest start gives the longest substring.",
    "Seed the map with {0: -1}: the empty prefix has all counts even.",
    "For palindromes the mask of a substring may have at most one bit set.",
]
examples = ["find-the-longest-substring-containing-vowels-in-even-counts", "can-make-palindrome-from-substring", "number-of-wonderful-substrings"]

[[extra.variant]]
name = "Palindrome queries (prefix masks)"
note = "A substring can be rearranged into a palindrome with k changes when its odd-count letters are at most 2k + 1."
template = '''
def can_make_pali_queries(s, queries):
    prefix = [0]
    for ch in s:
        prefix.append(prefix[-1] ^ (1 << (ord(ch) - 97)))  # parity so far
    out = []
    for left, right, k in queries:
        mask = prefix[right + 1] ^ prefix[left]
        odd = bin(mask).count("1")  # letters with an odd count
        out.append(odd // 2 <= k)
    return out
'''

[[extra.variant]]
name = "Wonderful substrings"
note = "Count substrings with at most one odd letter: for each prefix mask count equal masks and masks one bit away."
template = '''
def wonderful_substrings(word):
    count = [0] * 1024  # masks of the letters a..j
    count[0] = 1
    mask = total = 0
    for ch in word:
        mask ^= 1 << (ord(ch) - 97)
        total += count[mask]  # no odd letter in between
        for b in range(10):
            total += count[mask ^ (1 << b)]  # exactly one odd letter
        count[mask] += 1
    return total
'''

[[extra]]
id = "Bit Manipulation:fields"
name = "Fields with shifts and masks: hex, UTF-8, IPs"
group = "Masks, shifts and fields"
signals = [
    "convert a number to hexadecimal or binary text, including negatives (two's complement)",
    "validate or pack a byte format: UTF-8 headers, IP addresses, CIDR blocks",
    "extract a field with (x >> shift) & mask and build one with (value & mask) << shift",
]
template_name = "Number to hexadecimal"
template = '''
def to_hex(num):
    if num == 0:
        return "0"
    num &= 0xFFFFFFFF  # two's complement for negatives
    digits = "0123456789abcdef"
    out = []
    while num:
        out.append(digits[num & 15])  # the lowest four bits
        num >>= 4
    return "".join(reversed(out))
'''
pitfalls = [
    "Mask a negative number with 0xFFFFFFFF first: Python has no fixed width.",
    "Four bits make one hex digit: num & 15 then num >>= 4.",
    "The digits come out lowest first: reverse them at the end.",
]
examples = ["convert-a-number-to-hexadecimal", "utf-8-validation", "ip-to-cidr"]

[[extra.variant]]
name = "UTF-8 validation"
note = "The top bits of the first byte give the number of bytes; each continuation byte starts with 10."
template = '''
def valid_utf8(data):
    need = 0  # continuation bytes still expected
    for byte in data:
        byte &= 0xFF
        if need:
            if byte >> 6 != 0b10:
                return False
            need -= 1
        elif byte >> 7 == 0:
            continue  # a one-byte character
        elif byte >> 5 == 0b110:
            need = 1
        elif byte >> 4 == 0b1110:
            need = 2
        elif byte >> 3 == 0b11110:
            need = 3
        else:
            return False
    return need == 0
'''

[[extra]]
id = "Bit Manipulation:binary-arith"
name = "Arithmetic on binary strings and with shifts"
group = "Arithmetic with bits"
signals = [
    "add or process numbers given as binary strings, longer than any integer type",
    "reduce a binary number to 1 by halving and adding, counting the steps",
    "divide or multiply without the operator, using shifts",
]
template_name = "Add binary"
template = '''
def add_binary(a, b):
    i, j, carry, out = len(a) - 1, len(b) - 1, 0, []
    while i >= 0 or j >= 0 or carry:
        total = carry
        if i >= 0:
            total += int(a[i])
            i -= 1
        if j >= 0:
            total += int(b[j])
            j -= 1
        out.append(str(total & 1))  # the digit
        carry = total >> 1  # the carry into the next position
    return "".join(reversed(out))
'''
pitfalls = [
    "Walk from the ends of both strings and keep going while a carry remains.",
    "total & 1 is the digit and total >> 1 the carry: the same as % 2 and // 2.",
    "Digits come out lowest first; reverse them at the end.",
]
examples = ["add-binary", "number-of-steps-to-reduce-a-number-in-binary-representation-to-one", "concatenation-of-consecutive-binary-numbers", "divide-two-integers"]

[[extra.variant]]
name = "Steps to reduce a binary number to one"
note = "Even: shift (1 step). Odd: add 1, which carries (1 step) and then shifts. Walk from the least significant bit with a carry."
template = '''
def num_steps(s):
    steps, carry = 0, 0
    for ch in reversed(s[1:]):  # every bit except the leading 1
        bit = int(ch) + carry
        if bit == 1:
            steps += 2  # odd: add one, then halve
            carry = 1
        else:
            steps += 1  # even: halve
    return steps + carry  # a final carry makes one more step
'''

[[extra.variant]]
name = "Concatenate consecutive binary numbers"
note = "Shift the result by the bit length of i and add i; the length grows at each power of two."
template = '''
def concatenated_binary(n):
    mod, result = 10**9 + 7, 0
    for i in range(1, n + 1):
        result = ((result << i.bit_length()) | i) % mod
    return result
'''

[[extra.variant]]
name = "Divide two integers (shifts)"
note = "Subtract the largest shifted copy of the divisor that fits, add its multiple to the quotient, repeat."
template = '''
def divide(dividend, divisor):
    if dividend == -(2**31) and divisor == -1:
        return 2**31 - 1  # overflow
    negative = (dividend < 0) != (divisor < 0)
    a, b, quotient = abs(dividend), abs(divisor), 0
    while a >= b:
        shift = 0
        while a >= (b << (shift + 1)):
            shift += 1  # the largest b * 2^shift that fits
        a -= b << shift
        quotient += 1 << shift
    return -quotient if negative else quotient
'''

[[extra]]
id = "Bit Manipulation:bit-window"
name = "AND and OR over windows"
group = "Range AND / OR"
signals = [
    "the longest window where no two numbers share a bit, or the shortest with OR at least k",
    "OR only grows when you add a number and AND only shrinks: windows are monotone",
    "a plain OR cannot remove a number: keep per-bit counts, or shrink while a bit is shared",
]
template_name = "Longest nice subarray"
template = '''
def longest_nice_subarray(nums):
    left = used = best = 0  # used: the OR of the current window
    for right, x in enumerate(nums):
        while used & x:  # x shares a bit with the window
            used ^= nums[left]  # disjoint bits: XOR removes it
            left += 1
        used |= x
        best = max(best, right - left + 1)
    return best
'''
pitfalls = [
    "In a nice window all numbers have disjoint bits, so the OR equals the XOR and removing a number is a XOR.",
    "Shrink while x collides with the window, then add it.",
    "For general OR conditions keep a counter per bit and rebuild the OR from the counters.",
]
examples = ["longest-nice-subarray", "shortest-subarray-with-or-at-least-k-ii", "longest-subarray-with-maximum-bitwise-and"]

[[extra.variant]]
name = "Shortest subarray with OR at least k"
note = "Per-bit counts of the window: add a number, then shrink while the OR is still at least k."
template = '''
def minimum_subarray_length(nums, k):
    count = [0] * 32  # how many numbers in the window have each bit
    best, left, value = float("inf"), 0, 0

    def update(x, delta):
        nonlocal value
        for b in range(32):
            if x >> b & 1:
                count[b] += delta
                if delta > 0 and count[b] == 1:
                    value |= 1 << b  # the bit appeared
                elif delta < 0 and count[b] == 0:
                    value &= ~(1 << b)  # the last number with it left

    for right, x in enumerate(nums):
        update(x, 1)
        while left <= right and value >= k:
            best = min(best, right - left + 1)
            update(nums[left], -1)
            left += 1
    return best if best != float("inf") else -1
'''

[[extra.variant]]
name = "Longest subarray with the maximum AND"
note = "The maximum AND is the maximum element: the answer is the longest run of it."
template = '''
def longest_subarray(nums):
    top = max(nums)  # an AND can not exceed its largest member
    best = run = 0
    for x in nums:
        run = run + 1 if x == top else 0
        best = max(best, run)
    return best
'''

[[extra]]
id = "Bit Manipulation:kth-bit"
name = "The k-th bit of a recursive string"
group = "Binary representation problems"
signals = [
    "a string built by S_n = S_(n-1) + 1 + reverse(invert(S_(n-1))), asked for its k-th bit without building it",
    "the length is 2^n - 1, so k is before, at, or after the middle",
    "after the middle, map k to its mirror position and flip the answer",
]
template_name = "K-th bit in the n-th binary string"
template = '''
def find_kth_bit(n, k):
    flips = 0
    length = (1 << n) - 1
    while length > 1:
        mid = (length + 1) // 2
        if k == mid:
            return str((1 ^ flips) & 1)  # the middle is always 1
        if k > mid:
            k = length + 1 - k  # mirror into the first half
            flips ^= 1  # the second half is inverted
        length = mid - 1
    return str(flips)  # S_1 = "0"
'''
pitfalls = [
    "The second half is the reverse and inversion of the first: mirror the index and flip the answer.",
    "Track the number of flips as a parity, not by recursing.",
    "The middle bit is 1 before any flip.",
]
examples = ["find-kth-bit-in-nth-binary-string", "find-the-k-th-character-in-string-game-i", "k-th-symbol-in-grammar"]

[[extra.variant]]
name = "K-th symbol in grammar"
note = "Row n is row n - 1 with 0 -> 01 and 1 -> 10: the k-th symbol is the parent's, flipped when k is even."
template = '''
def kth_grammar(n, k):
    k -= 1  # zero-based position in row n
    return bin(k).count("1") & 1  # each right-child step flips the value
'''

