pattern = "Bit Manipulation"
intro = "Bit tricks treat a number as a row of switches. A few identities do most of the work: x ^ x is 0, x & (x - 1) clears the lowest set bit, and shifting left or right multiplies or divides by 2. In Python integers are unbounded, so negative numbers and overflow need a mask when a problem assumes 32 bits."
groups = ["Single-number tricks", "XOR tricks", "Masks, shifts and fields", "Bitmask subsets and bitmask DP", "Counting bits across numbers", "Arithmetic with bits", "Range AND / OR", "Gray code", "Bit-level greedy and tries", "Bit manipulation for sets", "Hamming distance and total Hamming", "Bit tricks for strings", "Sieve and bitset algorithms", "Binary representation problems", "Flip operations on binary arrays", "Algebraic properties and invariants", "Advanced bit techniques", "Core implementation idioms"]










[[technique]]
id = "Bit Manipulation:xor"
walk = "bits-xor"
group = "XOR tricks"
signals = [
    "every value appears twice except one (or one is missing)",
    "constant memory, one pass",
    "equal values cancel under XOR",
]
template = '''
def single_number(nums):
    result = 0
    for x in nums:
        result ^= x  # pairs cancel, the single one remains
    return result


def missing_number(nums):
    # nums holds 0..n with one missing. XOR every index and every value.
    result = len(nums)
    for i, x in enumerate(nums):
        result ^= i ^ x
    return result
'''
pitfalls = [
    "x ^ x == 0 and x ^ 0 == x, and XOR is order independent. That is the whole idea.",
    "For the missing number a sum formula n * (n + 1) // 2 also works, and overflows in other languages. XOR doesn't.",
    "It only works when everything else appears an even number of times.",
]

[[technique]]
id = "Bit Manipulation:bit-count"
walk = "bits-count"
group = "Single-number tricks"
signals = [
    "count the 1 bits in a number, or in every number up to n",
    "reuse the count of a smaller number",
    "x & (x - 1) removes the lowest set bit",
]
template = '''
def hamming_weight(n):
    count = 0
    while n:
        n &= n - 1  # drop the lowest 1 bit
        count += 1
    return count


def count_bits(n):
    bits = [0] * (n + 1)
    for i in range(1, n + 1):
        bits[i] = bits[i >> 1] + (i & 1)  # shift off the last bit, add it
    return bits
'''
pitfalls = [
    "n & (n - 1) loops once per set bit. Shifting and testing the lowest bit loops once per bit position.",
    "Counting every number up to n is dynamic programming: bits[i] reuses bits[i >> 1].",
    "x & (x - 1) == 0 tests whether x is a power of two (or zero).",
]

[[technique]]
id = "Bit Manipulation:shift"
group = "Single-number tricks"
signals = [
    "reverse or rotate the bits of a number",
    "build the result one bit at a time from the end",
    "the word size (32 bits) is part of the problem",
]
template = '''
def reverse_bits(n):
    result = 0
    for _ in range(32):  # always 32 steps, even when n runs out of bits
        result = (result << 1) | (n & 1)  # push n's last bit onto result
        n >>= 1
    return result
'''
pitfalls = [
    "Loop exactly 32 times. Leading zeros in the input become trailing zeros in the output.",
    "Shift the result left BEFORE adding the new bit.",
    "For many calls, reverse byte by byte with a 256-entry lookup table.",
]

[[technique]]
id = "Bit Manipulation:add-bits"
group = "Arithmetic with bits"
signals = [
    "add two integers without using + or -",
    "XOR adds without carrying, AND then shift left finds the carries",
    "repeat until no carry is left",
]
template = '''
def get_sum(a, b):
    mask = 0xFFFFFFFF  # emulate 32-bit integers
    while b:
        carry = ((a & b) << 1) & mask
        a = (a ^ b) & mask
        b = carry
    return a if a <= 0x7FFFFFFF else ~(a ^ mask)  # negative again
'''
pitfalls = [
    "In Python, negative numbers have infinitely many leading 1 bits, so mask to 32 bits or the loop never ends.",
    "At the end, a result above 0x7FFFFFFF represents a negative number: ~(a ^ mask) converts it.",
    "Trace 1 + 3 by hand: xor 2, carry 2; then xor 0, carry 4; then xor 4, carry 0. The answer is 4.",
]

[[technique]]
id = "Bit Manipulation:digit-extract"
signals = [
    "reverse the digits of an integer",
    "the result must fit in 32 bits, otherwise return 0",
    "peel digits with % 10 and // 10",
]
template = '''
def reverse_integer(x):
    sign = -1 if x < 0 else 1
    x = abs(x)
    result = 0
    while x:
        x, digit = divmod(x, 10)
        result = result * 10 + digit
    result *= sign
    return result if -(2**31) <= result <= 2**31 - 1 else 0
'''
pitfalls = [
    "Python has no overflow, so check the range at the end. In other languages check BEFORE multiplying by 10.",
    "Take the sign off first. Remainders of negative numbers behave differently between languages.",
    "Trailing zeros vanish (120 becomes 21). The loop handles that without extra code.",
]

[[technique]]
id = "Bit Manipulation:prefix-xor"
group = "Single-number tricks"
signals = [
    "XOR of a range (a subarray) answered many times",
    "XOR undoes itself, so a range is the difference of two prefixes",
    "precompute once, answer each query in O(1)",
]
template = '''
def xor_queries(arr, queries):
    prefix = [0]
    for x in arr:
        prefix.append(prefix[-1] ^ x)  # prefix[i] = XOR of arr[:i]
    # XOR of arr[l..r] = prefix[r + 1] ^ prefix[l]: the shared part cancels.
    return [prefix[r + 1] ^ prefix[l] for l, r in queries]
'''
pitfalls = [
    "Use a leading 0 in the prefix array so a range starting at index 0 needs no special case.",
    "Prefix XOR works like prefix sums, but with XOR as its own inverse.",
    "Combine with a dictionary of prefix values to count subarrays whose XOR equals k.",
]

[[extra]]
id = "Bit Manipulation:single-number-ii"
name = "Single number when the others appear three times"
group = "Single-number tricks"
signals = [
    "every value appears k times except one that appears once (or twice)",
    "XOR cancels pairs only; for threes count each bit position modulo 3",
    "two different singles: XOR them all, then split the numbers by one bit where the two differ",
]
template_name = "Single number II"
template = '''
def single_number(nums):
    result = 0
    for bit in range(32):
        ones = sum(x >> bit & 1 for x in nums)
        if ones % 3:  # the bits of the single number are what is left over
            result |= 1 << bit
    if result >= 1 << 31:
        result -= 1 << 32  # the sign bit: back to a negative number
    return result
'''
pitfalls = [
    "Count each bit across all numbers and take it modulo 3: numbers that appear three times add 0 or 3.",
    "Python integers are unbounded: restore the sign yourself when bit 31 is set.",
    "A bit-state machine with two variables (ones, twos) does the same in one pass without a loop over bits.",
]
examples = ["single-number-ii", "single-number-iii", "find-the-xor-of-numbers-which-appear-twice"]

[[extra.variant]]
name = "Single number III (two singles)"
note = "XOR everything: the result is a ^ b. Any set bit of it tells a and b apart: split the numbers by that bit."
template = '''
def single_number_iii(nums):
    xor = 0
    for x in nums:
        xor ^= x  # a ^ b, because every pair cancels
    low = xor & -xor  # a bit where a and b differ
    a = 0
    for x in nums:
        if x & low:
            a ^= x  # the group with the bit set holds only a
    return [a, xor ^ a]
'''

[[extra]]
id = "Bit Manipulation:range-bits"
name = "Range AND, and building numbers bit by bit"
group = "Range AND / OR"
signals = [
    "the AND of every number in a range: only the common binary prefix of the endpoints survives",
    "build the smallest number that has a given set of bits, or the one that minimises an XOR",
    "decide bits from the highest down, using the structure of the range",
]
template_name = "Bitwise AND of a range"
template = '''
def range_bitwise_and(left, right):
    shift = 0
    while left != right:
        left >>= 1  # drop the differing low bits
        right >>= 1
        shift += 1
    return left << shift  # the common prefix, with zeros after it
'''
pitfalls = [
    "Any bit position where the endpoints differ has both a 0 and a 1 in the range: the AND is 0 there and below.",
    "Brian Kernighan's version: right &= right - 1 until right <= left.",
    "A range of two or more consecutive numbers always has bit 0 equal to 0 in the AND.",
]
examples = ["bitwise-and-of-numbers-range", "minimum-array-end", "minimize-xor"]

[[extra.variant]]
name = "Minimum array end"
note = "The elements must have all bits of x set; the n-th one fills the zero bits of x with the bits of n - 1."
template = '''
def min_end(n, x):
    result, rest = x, n - 1  # rest: the rank of the number, zero-based
    bit = 1
    while rest:
        if not x & bit:  # a free position: take the next bit of rest
            if rest & 1:
                result |= bit
            rest >>= 1
        bit <<= 1
    return result
'''

[[extra.variant]]
name = "Minimize XOR"
note = "Match the set-bit count of num2: set the highest bits of num1 first, then fill the lowest free bits."
template = '''
def minimize_xor(num1, num2):
    want = bin(num2).count("1")
    x = 0
    for bit in range(31, -1, -1):  # highest bits of num1 first
        if want and num1 >> bit & 1:
            x |= 1 << bit
            want -= 1
    bit = 0
    while want:  # still bits to place: the lowest free ones
        if not x >> bit & 1:
            x |= 1 << bit
            want -= 1
        bit += 1
    return x
'''

[[extra]]
id = "Bit Manipulation:hamming"
name = "Hamming distance: per bit, ones times zeros"
group = "Hamming distance and total Hamming"
signals = [
    "the number of differing bits between two numbers is the popcount of their XOR",
    "the total over all pairs: for each bit, (numbers with the bit) times (numbers without it)",
    "flips to turn one number into another is the same distance",
]
template_name = "Total Hamming distance"
template = '''
def total_hamming_distance(nums):
    total, n = 0, len(nums)
    for bit in range(32):
        ones = sum(x >> bit & 1 for x in nums)
        total += ones * (n - ones)  # every pair with different bits here
    return total
'''
pitfalls = [
    "Count pairs per bit, not per pair of numbers: O(32 n) instead of O(n^2).",
    "A pair differs at a bit exactly when one has a 1 and the other a 0.",
    "bin(a ^ b).count('1') is the distance of one pair.",
]
examples = ["total-hamming-distance", "hamming-distance", "minimum-bit-flips-to-convert-number", "complement-of-base-10-integer"]

[[extra.variant]]
name = "Hamming distance of two numbers"
note = "Differing bits are the set bits of the XOR; Kernighan's loop clears one per step."
template = '''
def hamming_distance(x, y):
    diff, count = x ^ y, 0
    while diff:
        diff &= diff - 1  # clear the lowest set bit
        count += 1
    return count
'''

[[extra.variant]]
name = "Complement of a number"
note = "XOR with a mask of ones as long as the number."
template = '''
def find_complement(num):
    mask = (1 << num.bit_length()) - 1  # all ones, same length
    return num ^ mask if num else 1
'''

[[extra]]
id = "Bit Manipulation:xor-decode"
name = "Decode with XOR"
group = "XOR tricks"
signals = [
    "restore an array from its prefix XORs or from the XORs of neighbours",
    "x ^ x = 0, so a ^ (a ^ b) = b: XOR is its own inverse",
