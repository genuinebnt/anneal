name = "Binary tree coloring game"
note = "The second player takes the biggest of three regions around x: its left subtree, its right subtree, or everything above."
template = '''
def btree_game_winning_move(root, n, x):
    left = right = 0

    def count(node):
        nonlocal left, right
        if node is None:
            return 0
        l, r = count(node.left), count(node.right)
        if node.val == x:
            left, right = l, r  # the sizes under x
        return l + r + 1

    count(root)
    above = n - left - right - 1
    return max(left, right, above) > n // 2
'''

