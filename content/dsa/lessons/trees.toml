template_name = "Sum of distances in a tree"
template = '''
from collections import defaultdict


def sum_of_distances_in_tree(n, edges):
    adj = defaultdict(list)
    for a, b in edges:
        adj[a].append(b)
        adj[b].append(a)
    size, ans = [1] * n, [0] * n
    order, parent, stack = [], [-1] * n, [0]
    while stack:  # a DFS order, without recursion
        u = stack.pop()
        order.append(u)
        for v in adj[u]:
            if v != parent[u]:
                parent[v] = u
                stack.append(v)
    for u in reversed(order):  # children before parents
        for v in adj[u]:
            if v != parent[u]:
                size[u] += size[v]
                ans[u] += ans[v] + size[v]  # distances inside u's subtree
    for u in order:  # parents before children: move the root u -> v
        for v in adj[u]:
            if v != parent[u]:
                ans[v] = ans[u] - size[v] + (n - size[v])
    return ans
'''
pitfalls = [
    "First compute the answer for one root (node 0) with subtree sizes, then derive every other node from its parent.",
    "Moving the root to v: the size[v] nodes get one step closer, the other n - size[v] one step farther.",
    "Avoid recursion on a path of 10^4 nodes: the order list makes both passes iterative.",
]
examples = ["sum-of-distances-in-tree", "binary-tree-coloring-game", "minimum-height-trees"]

