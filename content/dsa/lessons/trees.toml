name = "Time to infect the whole tree"
note = "BFS from the start node over (left, right, parent); the number of levels is the time."
template = '''
def amount_of_time(root, start):
    parent, begin, stack = {}, None, [(root, None)]
    while stack:
        node, par = stack.pop()
        parent[node] = par
        if node.val == start:
            begin = node
        for c in (node.left, node.right):
            if c:
                stack.append((c, node))
    seen, level, minutes = {begin}, [begin], -1
    while level:
        minutes += 1  # one level of BFS = one minute
        nxt = []
        for n in level:
            for nb in (n.left, n.right, parent[n]):
                if nb and nb not in seen:
                    seen.add(nb)
                    nxt.append(nb)
        level = nxt
    return minutes
'''

