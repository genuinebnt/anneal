def count_highest_score_nodes(parents):
    n = len(parents)
    kids = [[] for _ in range(n)]
    for i, p in enumerate(parents):
        if p >= 0:
            kids[p].append(i)
    best = count = 0

    def size(u):
        nonlocal best, count
        total, score = 1, 1
        for v in kids[u]:
            s = size(v)
            total += s
            score *= s  # a piece for each child subtree
        if n - total:
            score *= n - total  # the rest above u
        if score > best:
            best, count = score, 1
        elif score == best:
            count += 1
        return total

    size(0)
    return count
'''
pitfalls = [
    "The piece above the node has n - size nodes: it exists only when the node is not the root.",
    "A product of non-zero sizes: skip the factor when a piece is empty, do not multiply by 0.",
    "Count ties: compare with the best so far and reset the count on a strictly better score.",
]
examples = ["count-nodes-with-the-highest-score"]

[[extra]]
id = "Trees:path-parity"
name = "Path parity: a mask from the root and a counter"
group = "Tree DP"
signals = [
    "count node pairs whose path letters can be rearranged into a palindrome",
    "each node's mask is the parity of every letter on its path from the root",
    "a pair is good when the XOR of the two masks has at most one bit set",
]
template = '''
from collections import defaultdict


def count_palindrome_paths(parent, s):
    n = len(parent)
    kids = [[] for _ in range(n)]
    for i in range(1, n):
        kids[parent[i]].append(i)
    seen = defaultdict(int)
    answer = 0
    stack = [(0, 0)]  # (node, parity mask of the path from the root)
    while stack:
        u, mask = stack.pop()
        answer += seen[mask]  # the same parity: an even path
        for b in range(26):
            answer += seen[mask ^ (1 << b)]  # exactly one letter odd
        seen[mask] += 1
        for v in kids[u]:
            stack.append((v, mask ^ (1 << (ord(s[v]) - 97))))
    return answer
'''
pitfalls = [
    "XOR of two root masks is the parity of the path between them: the shared part cancels.",
    "At most one odd letter is the palindrome condition: the XOR is 0 or a single bit.",
    "Count a pair once: look up the masks of the nodes already seen, then add the current one.",
]
examples = ["count-paths-that-can-form-a-palindrome-in-a-tree"]

[[extra]]
id = "Trees:binary-lifting"
name = "Binary lifting: the k-th ancestor"
group = "Lowest common ancestor"
signals = [
    "many queries for the k-th ancestor (or the LCA) of a node in a rooted tree",
    "store the 2^j-th ancestor of every node: any k is a sum of powers of two",
    "O(n log n) to build, O(log n) per query",
]
template = '''
class TreeAncestor:
    def __init__(self, n, parent):
        self.log = max(1, n.bit_length())
        self.up = [parent[:]]  # up[j][v]: the 2^j-th ancestor of v
        for _ in range(1, self.log):
            prev = self.up[-1]
            self.up.append([prev[prev[v]] if prev[v] != -1 else -1
                            for v in range(n)])

    def getKthAncestor(self, node, k):
        if k >= 1 << self.log:
            return -1  # deeper than any chain
        for j in range(self.log):
            if k >> j & 1:
                node = self.up[j][node]
                if node == -1:
                    return -1
        return node
'''
pitfalls = [
    "Use -1 for 'no ancestor' and keep it sticky: the ancestor of -1 is -1.",
    "Level j is built from level j - 1: up[j][v] = up[j - 1][up[j - 1][v]].",
    "For the LCA lift the deeper node to the same depth, then lift both while their ancestors differ.",
]
examples = ["kth-ancestor-of-a-tree-node"]

[[extra]]
id = "Trees:lazy-iterators"
name = "Lazy iterators: flatten and peek"
group = "Iterator design"
signals = [
    "an iterator over a nested structure that must not build the full flat list",
    "keep a stack of iterators: the innermost one is read, and a nested list pushes a new one",
    "peek without consuming: buffer one value ahead",
]
template_name = "Nested list iterator"
template = '''
class NestedIterator:
    def __init__(self, nestedList):
        self.stack = [iter(nestedList)]  # innermost iterator last
        self.value = None

    def _advance(self):
        while self.stack:
            for item in self.stack[-1]:
                if item.isInteger():
                    self.value = item.getInteger()
                    return
                self.stack.append(iter(item.getList()))  # go inside
                break
            else:
                self.stack.pop()  # this list is finished

    def hasNext(self):
        if self.value is None:
            self._advance()
        return self.value is not None

    def next(self):
        self.hasNext()
        out, self.value = self.value, None
        return out
'''
pitfalls = [
    "Skip empty nested lists: the loop must keep going until it finds an integer or runs out of iterators.",
    "hasNext does the work (it may need to look ahead through empty lists), next only reads the buffer.",
    "Never call getList on an integer item: test isInteger first.",
]
examples = ["flatten-nested-list-iterator", "peeking-iterator"]

[[extra.variant]]
name = "Peeking iterator"
note = "Keep one value ahead of the wrapped iterator."
template = '''
class PeekingIterator:
    def __init__(self, iterator):
        self.it = iterator
        self.has = iterator.hasNext()
        self.buf = iterator.next() if self.has else None

    def peek(self):
        return self.buf

    def next(self):
        out = self.buf
        self.has = self.it.hasNext()
        self.buf = self.it.next() if self.has else None
        return out

    def hasNext(self):
        return self.has
'''

[[extra]]
id = "Trees:insertion-orders"
name = "Count the insertion orders that build the same BST"
group = "Count and enumerate trees"
signals = [
    "how many permutations of the keys give exactly this BST?",
    "the root is first; the left and right sequences interleave in any way: C(n - 1, |left|) ways",
    "multiply with the counts for the two subtrees",
]
template = '''
from math import comb


def num_of_ways(nums):
    mod = 10**9 + 7

    def go(a):
        if len(a) <= 2:
            return 1
        left = [x for x in a if x < a[0]]
        right = [x for x in a if x > a[0]]
        # the left and right orders can be interleaved freely
        return comb(len(a) - 1, len(left)) * go(left) * go(right)

    return (go(nums) - 1) % mod  # the given order itself is not counted
'''
pitfalls = [
    "Each subtree keeps its own order: only the interleaving is free.",
    "Subtract 1: the question asks for the other orders.",
    "Work with exact integers (math.comb) and reduce at the end, or use modular inverses in other languages.",
]
examples = ["number-of-ways-to-reorder-array-to-get-same-bst"]

