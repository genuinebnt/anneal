def merge_trees(a, b):
    if a is None or b is None:
        return a or b
    a.val += b.val
    a.left = merge_trees(a.left, b.left)
    a.right = merge_trees(a.right, b.right)
    return a
'''

[[extra.variant]]
name = "Linked list in a binary tree"
note = "Try to match the list starting at every node, going down one child at a time."
template = '''
def is_sub_path(head, root):
    def match(node, cur):  # does the list from cur go down from node?
        if cur is None:
            return True
        if node is None or node.val != cur.val:
            return False
        return match(node.left, cur.next) or match(node.right, cur.next)

    if root is None:
        return False
    return (match(root, head) or is_sub_path(head, root.left)
            or is_sub_path(head, root.right))
'''

