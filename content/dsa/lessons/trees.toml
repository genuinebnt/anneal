template_name = "Duplicate subtrees"
template = '''
from collections import defaultdict


def find_duplicate_subtrees(root):
    ids = {}  # (left id, value, right id) -> id
    count = defaultdict(int)
    out = []

    def go(node):
        if node is None:
            return 0
        key = (go(node.left), node.val, go(node.right))
        if key not in ids:
            ids[key] = len(ids) + 1  # a new shape gets a new id
        i = ids[key]
        count[i] += 1
        if count[i] == 2:
            out.append(node)  # report each duplicate once
        return i

    go(root)
    return out
'''
