[[extra.variant]]
name = "Balance an existing BST"
note = "Inorder gives the sorted values; build the balanced tree from them."
template = '''
def balance_bst(root):
    vals = []

    def walk(node):
        if node:
            walk(node.left)
            vals.append(node.val)
            walk(node.right)

    def build(lo, hi):
        if lo >= hi:
            return None
        mid = (lo + hi) // 2
        return TreeNode(vals[mid], build(lo, mid), build(mid + 1, hi))

    walk(root)
    return build(0, len(vals))
'''

[[extra.variant]]
name = "Sorted linked list (inorder simulation)"
note = "Build the left subtree first, then take the next list node as the root, then build the right subtree."
template = '''
def sorted_list_to_bst(head):
    n, node = 0, head
    while node:
        n += 1
        node = node.next
    cur = head

    def build(lo, hi):  # builds nodes lo .. hi - 1 in order
        nonlocal cur
        if lo >= hi:
            return None
        mid = (lo + hi) // 2
        left = build(lo, mid)
        root = TreeNode(cur.val)  # the next list node is the root
        cur = cur.next
        root.left = left
        root.right = build(mid + 1, hi)
        return root

    return build(0, n)
'''

