def distance_k(root, target, k):
    parent = {}

    def link(node, par):
        if node:
            parent[node] = par
            link(node.left, node)
            link(node.right, node)

    link(root, None)
    seen, level = {target}, [target]
    for _ in range(k):  # one BFS level per step
