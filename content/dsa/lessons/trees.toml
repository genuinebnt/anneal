template = '''
def construct(grid):
    def build(r, c, size):
        first = grid[r][c]
        if all(grid[r + i][c + j] == first
               for i in range(size) for j in range(size)):
            return Node(bool(first), True, None, None, None, None)
        half = size // 2
        return Node(True, False,
                    build(r, c, half), build(r, c + half, half),
                    build(r + half, c, half),
                    build(r + half, c + half, half))

    return build(0, 0, len(grid))
'''
