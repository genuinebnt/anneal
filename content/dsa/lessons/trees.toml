    "a tree has exactly one root (in-degree 0), every other node has exactly one parent, and all nodes are reachable",
    "count in-degrees, find the root, walk from it",
]
template = '''
def validate_binary_tree_nodes(n, left, right):
    indeg = [0] * n
    for kids in (left, right):
        for c in kids:
            if c != -1:
                indeg[c] += 1
                if indeg[c] > 1:
                    return False  # two parents
    roots = [i for i in range(n) if indeg[i] == 0]
    if len(roots) != 1:
        return False  # none (a cycle) or several (a forest)
    seen, stack = set(), [roots[0]]
    while stack:
        u = stack.pop()
        if u in seen:
            return False
        seen.add(u)
        stack += [c for c in (left[u], right[u]) if c != -1]
    return len(seen) == n  # everything is reachable
'''
