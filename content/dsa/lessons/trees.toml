]
template_name = "Count nodes"
template = '''
def count_nodes(root):
    def depth(node):  # depth going only left
        d = 0
        while node:
            d += 1
            node = node.left
        return d

    if root is None:
        return 0
    left, right = depth(root.left), depth(root.right)
    if left == right:
        return (1 << left) + count_nodes(root.right)  # left is perfect
    return (1 << right) + count_nodes(root.left)  # right is perfect
'''
pitfalls = [
    "Equal left depths mean the left subtree is perfect; unequal means the right one is (one level shorter).",
    "(1 << h) is the root plus a perfect subtree of height h: 2^h - 1 + 1.",
    "Only one side recurses each time, so the work is O(log^2 n).",
]
examples = ["count-complete-tree-nodes", "complete-binary-tree-inserter", "check-completeness-of-a-binary-tree"]

[[extra.variant]]
name = "Complete binary tree inserter"
note = "Keep the nodes that still have a free child slot in level order; the first one is the parent of the next insert."
template = '''
from collections import deque


class CBTInserter:
    def __init__(self, root):
        self.root = root
        self.open = deque()  # nodes with a free child slot, in order
        queue = deque([root])
        while queue:
            node = queue.popleft()
            for c in (node.left, node.right):
                if c:
                    queue.append(c)
            if node.left is None or node.right is None:
                self.open.append(node)

    def insert(self, val):
        parent = self.open[0]
        child = TreeNode(val)
        if parent.left is None:
            parent.left = child
        else:
            parent.right = child
            self.open.popleft()  # now full
        self.open.append(child)
        return parent.val

    def get_root(self):
        return self.root
'''

