name = "Height after removing a subtree: top two per depth"
group = "Subtree aggregation"
signals = [
    "many queries, each removes a subtree and asks for the height of the rest",
    "the new height is the deepest node among the other nodes at the removed node's depth, or the depth above",
    "for each depth keep only the two deepest (depth + height) values",
]
template = '''
from collections import defaultdict


def tree_queries(root, queries):
    depth, height = {}, {}

    def go(node, d):  # height in edges; an empty tree is -1
        if node is None:
            return -1
        depth[node.val] = d
        height[node.val] = 1 + max(go(node.left, d + 1),
                                   go(node.right, d + 1))
        return height[node.val]

    go(root, 0)
    top = defaultdict(list)  # depth -> the two deepest (reach, value)
    for v, d in depth.items():
        top[d].append((d + height[v], v))
    for d in top:
        top[d] = sorted(top[d], reverse=True)[:2]
    out = []
    for q in queries:
        d = depth[q]
        others = [reach for reach, v in top[d] if v != q]
        out.append(others[0] if others else d - 1)
    return out
'''
