pattern = "Trees"
intro = "A tree problem is almost always a recursion over its two children. Ask what each call needs to be told (carried down) and what it should report back (returned up). If the answer depends on levels, use a queue. If the tree is a search tree, use its order."
groups = ["Traversals", "Level-order family", "Subtree aggregation", "Path problems", "Construction", "BST operations", "Lowest common ancestor", "Tree comparison", "Transformations", "Tree DP", "Parent pointers and tree-to-graph", "Views", "Count and enumerate trees", "N-ary trees", "Iterator design"]










[[technique]]
id = "Trees:dfs"
walk = "tree-dfs"
group = "Traversals"
signals = [
    "do the same thing at every node (invert, compare, count, find the depth)",
    "the answer for a node comes from the answers for its two children",
    "an empty tree is the base case",
]
template = '''
def invert_tree(root):
    if root is None:
        return None
    root.left, root.right = invert_tree(root.right), invert_tree(root.left)
    return root


def max_depth(root):
    if root is None:
        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))
'''
pitfalls = [
    "State the base case first: an empty node. Leaves then work without a special case.",
    "Return the node so the caller can reattach it as a child.",
    "A skewed tree can be 10,000 deep. Python's default recursion limit is 1000, so an iterative version may be needed.",
]

[[technique]]
id = "Trees:dfs-return"
walk = "tree-dfs"
group = "Subtree aggregation"
signals = [
    "the best path, longest chain or biggest difference passing through a node",
    "what a node reports upward is different from what it records as a candidate answer",
    "balanced, diameter, maximum path sum",
]
template_name = "Diameter"
template = '''
def diameter(root):
    best = 0

    def height(node):
        nonlocal best
        if node is None:
            return 0
        left, right = height(node.left), height(node.right)
        best = max(best, left + right)  # a path bending at this node
        return 1 + max(left, right)     # a path continuing up to the parent

    height(root)
    return best
'''
pitfalls = [
    "Two different numbers: what you return (a path that can continue upward) and what you record (a path that bends here).",
    "Count edges or nodes consistently. The diameter in edges is left + right.",
    "Computing heights again at every node is O(n squared). Return the height from one pass.",
]

[[technique.variant]]
name = "Balanced tree"
note = "Return the height, or -1 when a subtree is already unbalanced."
template = '''
def is_balanced(root):
    def height(node):  # -1: unbalanced somewhere below
        if node is None:
            return 0
        left, right = height(node.left), height(node.right)
        if left < 0 or right < 0 or abs(left - right) > 1:
            return -1
        return 1 + max(left, right)

    return height(root) >= 0
'''

[[technique.variant]]
name = "Maximum path sum"
note = "Return the best downward path; the answer may bend at a node and use both sides."
template = '''
def max_path_sum(root):
    best = float("-inf")

    def down(node):  # the best path that starts here and goes down
        nonlocal best
        if node is None:
            return 0
        left = max(down(node.left), 0)  # a negative side is dropped
        right = max(down(node.right), 0)
        best = max(best, node.val + left + right)  # a path bending here
        return node.val + max(left, right)

    down(root)
    return best
'''

[[technique.variant]]
name = "House robber III"
note = "Return two numbers per node: the best when it is robbed and the best when it is skipped."
template = '''
def rob(root):
    def go(node):  # (best if node is robbed, best if it is skipped)
        if node is None:
            return 0, 0
        l_take, l_skip = go(node.left)
        r_take, r_skip = go(node.right)
        take = node.val + l_skip + r_skip
        skip = max(l_take, l_skip) + max(r_take, r_skip)
        return take, skip

    return max(go(root))
'''

[[technique.variant]]
name = "Largest BST subtree"
note = "Return a tuple (is BST, size, min, max) so the parent can decide without looking again."
template = '''
def largest_bst_subtree(root):
    best = 0

    def go(node):  # (is a BST, size, min, max)
        nonlocal best
        if node is None:
            return True, 0, float("inf"), float("-inf")
        lb, ls, lmin, lmax = go(node.left)
        rb, rs, rmin, rmax = go(node.right)
        if lb and rb and lmax < node.val < rmin:
            size = ls + rs + 1
            best = max(best, size)
            return True, size, min(lmin, node.val), max(rmax, node.val)
        return False, 0, 0, 0

    go(root)
    return best
'''

[[technique.variant]]
name = "Longest univalue path"
note = "Extend a child's chain only when the values match; the answer joins the two chains."
template = '''
def longest_univalue_path(root):
    best = 0

    def go(node):  # the longest equal chain going down from node
        nonlocal best
        if node is None:
            return 0
        left, right = go(node.left), go(node.right)
        left = (left + 1 if node.left
                and node.left.val == node.val else 0)
        right = (right + 1 if node.right
                 and node.right.val == node.val else 0)
        best = max(best, left + right)
        return max(left, right)

    go(root)
    return best
'''

[[technique.variant]]
name = "Good leaf pairs"
note = "Return how many leaves lie at each distance below; pair the two children's counts."
template = '''
def count_pairs(root, distance):
    pairs = 0

    def go(node):  # counts[d]: leaves at distance d below node
        nonlocal pairs
        counts = [0] * (distance + 1)
        if node is None:
            return counts
        if node.left is None and node.right is None:
            counts[0] = 1
            return counts
        left, right = go(node.left), go(node.right)
        for i in range(distance + 1):
            for j in range(distance + 1):
                if i + j + 2 <= distance:  # two edges to reach this node
                    pairs += left[i] * right[j]
        for i in range(distance):
            counts[i + 1] = left[i] + right[i]
        return counts

    go(root)
    return pairs
'''

[[technique]]
id = "Trees:bst-walk"
group = "BST operations"
signals = [
    "a binary SEARCH tree: left is smaller, right is larger",
    "find a value, a closest value or an ancestor without visiting everything",
    "each comparison discards a whole subtree",
]
template = '''
def lowest_common_ancestor(root, p, q):
    node = root
    while node:
        if p.val < node.val and q.val < node.val:
            node = node.left
        elif p.val > node.val and q.val > node.val:
            node = node.right
        else:
            return node  # p and q split here (or one of them is node)
'''
pitfalls = [
    "Use the order: only one path from the root is walked, so it is O(height).",
    "A node counts as its own ancestor, so when p is an ancestor of q the answer is p.",
    "A binary tree that isn't a search tree needs a full search instead.",
]

[[technique]]
id = "Trees:bst-edit"
group = "BST operations"
signals = [
    "insert, delete or trim values in a binary search tree",
    "the tree must stay a valid search tree afterwards",
    "return the new root, because it may change",
]
template = '''
def insert(root, val):
    if root is None:
        return TreeNode(val)
    if val < root.val:
        root.left = insert(root.left, val)
    else:
        root.right = insert(root.right, val)
    return root


def delete(root, key):
    if root is None:
        return None
    if key < root.val:
        root.left = delete(root.left, key)
    elif key > root.val:
        root.right = delete(root.right, key)
    else:
        if root.left is None:
            return root.right
        if root.right is None:
            return root.left
        heir = root.right  # the smallest value in the right subtree
        while heir.left:
            heir = heir.left
        root.val = heir.val
        root.right = delete(root.right, heir.val)
    return root
'''
pitfalls = [
    "Always reassign the child from the recursive call (root.left = ...). That is how a changed or removed child gets attached.",
    "A node with two children takes the value of its in-order successor (or predecessor), and then that node is deleted.",
    "Insertion can always go at a leaf, which is the simplest valid choice.",
]

[[technique]]
id = "Trees:bfs-levels"
walk = "tree-bfs"
group = "Level-order family"
signals = [
    "level by level, or by depth",
    "the right-side view, the average of each level, a zigzag order",
    "the shortest distance from the root",
]
template_name = "Level order"
template = '''
from collections import deque


def level_order(root):
    levels = []
    queue = deque([root] if root else [])
    while queue:
        level = []
        for _ in range(len(queue)):  # exactly the nodes of this level
            node = queue.popleft()
            level.append(node.val)
            if node.left:
                queue.append(node.left)
            if node.right:
                queue.append(node.right)
        levels.append(level)
    return levels
'''
pitfalls = [
    "Read len(queue) BEFORE the inner loop. The queue grows as you add children.",
    "Use a deque. list.pop(0) is O(n).",
    "A DFS that passes the depth down and appends to levels[depth] builds the same result.",
]

[[technique.variant]]
name = "Zigzag"
note = "Reverse every other level."
template = '''
from collections import deque


def zigzag_level_order(root):
    out, level, left_to_right = [], deque([root] if root else []), True
    while level:
        vals = [n.val for n in level]
        out.append(vals if left_to_right else vals[::-1])
        left_to_right = not left_to_right
        level = deque(c for n in level for c in (n.left, n.right) if c)
    return out
'''

[[technique.variant]]
name = "Right side view"
note = "The last node of each level is the one you see from the right."
template = '''
def right_side_view(root):
    out, level = [], [root] if root else []
    while level:
        out.append(level[-1].val)  # the last node of each level
        level = [c for n in level for c in (n.left, n.right) if c]
    return out
'''

[[technique.variant]]
name = "Maximum width"
note = "Number the nodes like a heap (2i, 2i + 1); the width of a level is last index - first index + 1."
template = '''
def width_of_binary_tree(root):
    best, level = 0, [(root, 0)] if root else []
    while level:
        base = level[0][1]
        best = max(best, level[-1][1] - base + 1)
        nxt = []
        for node, i in level:
            i -= base  # keep the numbers small
            if node.left:
                nxt.append((node.left, 2 * i))
            if node.right:
                nxt.append((node.right, 2 * i + 1))
        level = nxt
    return best
'''

[[technique.variant]]
name = "Is complete"
note = "Put the missing children in the queue too: after the first gap no real node may follow."
template = '''
from collections import deque


def is_complete_tree(root):
    queue, seen_gap = deque([root]), False
    while queue:
        node = queue.popleft()
        if node is None:
            seen_gap = True  # after a gap only gaps may follow
        else:
            if seen_gap:
                return False
            queue.append(node.left)
            queue.append(node.right)
    return True
'''

[[technique.variant]]
name = "Next right pointers (O(1) space)"
note = "Walk a level through the next pointers you have already built, and link the level below."
template = '''
def connect(root):
    start = root  # the leftmost node of the level being walked
    while start:
        prev, next_start = None, None
        node = start
        while node:  # walk this level along the next pointers
            for child in (node.left, node.right):
                if child:
                    if prev:
                        prev.next = child
                    else:
                        next_start = child
                    prev = child
            node = node.next
        start = next_start
    return root
'''

[[technique.variant]]
name = "Cousins"
note = "Same depth, different parents: keep each node's parent in the level list."
template = '''
def is_cousins(root, x, y):
    level = [(root, None)]
    while level:
        found = [par for node, par in level if node.val in (x, y)]
        if len(found) == 2:
            return found[0] is not found[1]  # same level, other parents
        if found:
            return False  # only one of them is on this level
        level = [(c, node) for node, _ in level
                 for c in (node.left, node.right) if c]
    return False
'''

[[technique.variant]]
name = "Reverse odd levels"
note = "Collect each level, and on odd depths write the values back reversed."
template = '''
def reverse_odd_levels(root):
    level, depth = [root], 0
    while level[0].left:  # a perfect tree: all or none have children
        kids = [c for n in level for c in (n.left, n.right)]
        depth += 1
        if depth % 2:
            vals = [c.val for c in kids][::-1]
            for c, v in zip(kids, vals):
                c.val = v
        level = kids
    return root
'''

[[technique.variant]]
name = "Cousin sums"
note = "Replace each value by the level sum minus the sum of its siblings."
template = '''
def replace_value_in_tree(root):
    root.val = 0
    level = [root]
    while level:
        total = sum(c.val for n in level for c in (n.left, n.right) if c)
        nxt = []
        for n in level:
            sibs = sum(c.val for c in (n.left, n.right) if c)
            for c in (n.left, n.right):
                if c:
                    c.val = total - sibs  # all cousins, no siblings
                    nxt.append(c)
        level = nxt
    return root
'''

[[technique]]
id = "Trees:tree-as-graph"
group = "Parent pointers and tree-to-graph"
signals = [
    "the tree is given as a list of edges, not as nodes",
    "a cost or time depends on which branches matter (those that hold apples, targets)",
    "walk from a root and decide for each child whether it is worth visiting",
]
template = '''
def min_time_to_collect(n, edges, has_apple):
    graph = [[] for _ in range(n)]
    for a, b in edges:
        graph[a].append(b)
        graph[b].append(a)

    def cost(node, parent):
        # Time to walk this subtree and back: 0 if nothing to collect.
        total = 0
        for child in graph[node]:
            if child != parent:
                total += cost(child, node)
        if total or has_apple[node]:
            # Add the edge up to the parent, walked twice (not the root).
            return total + (2 if parent != -1 else 0)
        return 0

    return cost(0, -1)
'''
pitfalls = [
    "Pass the parent down, so you never walk back along the edge you came from.",
    "A subtree that holds nothing costs nothing: skip it, don't count its edges.",
    "The root has no edge above it, so it adds no 2.",
]

[[technique]]
id = "Trees:dfs-carry"
group = "Path problems"
signals = [
    "the answer for a node depends on the path from the root to it",
    "count nodes that are bigger than everything above them, or whose path sums to a target",
    "pass information DOWN as an argument",
]
template_name = "Good nodes"
template = '''
def good_nodes(root):
    def count(node, highest):
        if node is None:
            return 0
        good = 1 if node.val >= highest else 0
        highest = max(highest, node.val)  # what the children must beat
        return good + count(node.left, highest) + count(node.right, highest)

    return count(root, root.val)
'''
pitfalls = [
    "State carried down is a parameter. Information coming back up is a return value.",
    "Pass a number, not a growing list, when one value is enough (the path maximum, the remaining sum).",
    "Use >= when an equal value still counts.",
]

[[technique.variant]]
name = "Path sum II (all paths)"
note = "Keep one shared path list: append going down, pop coming back."
template = '''
def path_sum(root, target):
    out, path = [], []

    def go(node, left):
        if node is None:
            return
        path.append(node.val)
        left -= node.val
        if node.left is None and node.right is None and left == 0:
            out.append(path[:])  # a copy: the list keeps changing
        go(node.left, left)
        go(node.right, left)
        path.pop()  # undo

    go(root, target)
    return out
'''

[[technique.variant]]
name = "Root-to-leaf numbers"
note = "Carry the number so far: acc * 10 + digit."
template = '''
def sum_numbers(root):
    def go(node, acc):
        if node is None:
            return 0
        acc = acc * 10 + node.val
        if node.left is None and node.right is None:
            return acc  # a complete number
        return go(node.left, acc) + go(node.right, acc)

    return go(root, 0)
'''

[[technique.variant]]
name = "Largest difference with an ancestor"
note = "Carry the minimum and maximum on the path; at the leaves the answer is max - min."
template = '''
def max_ancestor_diff(root):
    def go(node, lo, hi):
        if node is None:
            return hi - lo
        lo, hi = min(lo, node.val), max(hi, node.val)
        return max(go(node.left, lo, hi), go(node.right, lo, hi))

    return go(root, root.val, root.val)
'''

[[technique.variant]]
name = "Pseudo-palindromic paths (bitmask)"
note = "Toggle one bit per digit: a path can be rearranged into a palindrome when at most one bit is set."
template = '''
def pseudo_palindromic_paths(root):
    def go(node, mask):
        if node is None:
            return 0
        mask ^= 1 << node.val  # toggle this digit's parity
        if node.left is None and node.right is None:
            return 1 if mask & (mask - 1) == 0 else 0  # <= one odd
        return go(node.left, mask) + go(node.right, mask)

    return go(root, 0)
'''

[[technique.variant]]
name = "Longest zigzag path"
note = "Carry the direction and the length: switch side to continue, or restart with length 1."
template = '''
def longest_zigzag(root):
    best = 0

    def go(node, went_left, length):
        nonlocal best
        if node is None:
            return
        best = max(best, length)
        if went_left:
            go(node.right, False, length + 1)  # switch: keep the zigzag
            go(node.left, True, 1)  # same side: restart
        else:
            go(node.left, True, length + 1)
            go(node.right, False, 1)

    if root:
        go(root.left, True, 1)
        go(root.right, False, 1)
    return best
'''

[[technique]]
id = "Trees:inorder"
group = "Traversals"
signals = [
    "the k-th smallest value, or a check that a tree is a valid search tree",
    "an in-order walk of a search tree visits values in sorted order",
    "stop early once you have what you need",
]
template = '''
def kth_smallest(root, k):
    stack, node = [], root
    while stack or node:
        while node:  # go as far left as possible
            stack.append(node)
            node = node.left
        node = stack.pop()
        k -= 1
        if k == 0:
            return node.val
        node = node.right
'''
pitfalls = [
    "In-order is left, node, right. For a search tree that is sorted order.",
    "The explicit stack stops as soon as the k-th node is reached, and avoids deep recursion.",
    "To validate a search tree, check that each value is greater than the previous one in this walk.",
]

[[technique]]
id = "Trees:from-traversals"
group = "Construction"
signals = [
    "rebuild a tree from two traversals (preorder and inorder, or inorder and postorder)",
    "the first preorder value is the root, and inorder splits the left from the right",
    "all values are distinct",
]
template_name = "Preorder and inorder"
template = '''
def build_tree(preorder, inorder):
    position = {v: i for i, v in enumerate(inorder)}
    next_root = 0

    def build(lo, hi):  # the slice inorder[lo:hi + 1]
        nonlocal next_root
        if lo > hi:
            return None
        node = TreeNode(preorder[next_root])
        next_root += 1
        mid = position[node.val]
        node.left = build(lo, mid - 1)  # preorder lists the left first
        node.right = build(mid + 1, hi)
        return node

    return build(0, len(inorder) - 1)
'''
pitfalls = [
    "Preorder says WHICH value is the root. Inorder says how big the left subtree is.",
    "Build the left subtree before the right, because preorder lists it first.",
    "Pass index bounds, not sliced lists. Slicing copies and turns this into O(n squared).",
]

[[technique.variant]]
name = "Inorder and postorder"
note = "The root is the last postorder value; build the right subtree first."
template = '''
def build_tree_post(inorder, postorder):
    index = {v: i for i, v in enumerate(inorder)}
    post = len(postorder) - 1

    def build(lo, hi):  # inorder[lo..hi]
        nonlocal post
        if lo > hi:
            return None
        node = TreeNode(postorder[post])
        post -= 1
        mid = index[node.val]
        node.right = build(mid + 1, hi)  # postorder ends with the right
        node.left = build(lo, mid - 1)
        return node

    return build(0, len(inorder) - 1)
'''

[[technique.variant]]
name = "Preorder and postorder"
note = "The value after the root in preorder is the left subtree's root: find it in postorder."
template = '''
def construct_from_pre_post(preorder, postorder):
    index = {v: i for i, v in enumerate(postorder)}
    pre = 0

    def build(lo, hi):  # postorder[lo..hi]
        nonlocal pre
        if lo > hi:
            return None
        node = TreeNode(preorder[pre])
        pre += 1
        if lo == hi:
            return node
        mid = index[preorder[pre]]  # the root of the left subtree
        node.left = build(lo, mid)
        node.right = build(mid + 1, hi - 1)
        return node

    return build(0, len(postorder) - 1)
'''

[[technique]]
id = "Trees:catalan"
group = "Count and enumerate trees"
signals = [
    "count or build all binary search trees with n distinct keys",
    "choose a root, and the left and right subtrees are independent smaller problems",
    "the counts multiply: ways(left) times ways(right)",
]
template = '''
def num_trees(n):
    ways = [1, 1] + [0] * (n - 1)  # ways[k]: shapes of a tree with k nodes
    for size in range(2, n + 1):
        for left in range(size):
            ways[size] += ways[left] * ways[size - 1 - left]
    return ways[n]


def generate_trees(lo, hi):
    # Every search tree using the keys lo..hi.
    if lo > hi:
        return [None]
    trees = []
    for root in range(lo, hi + 1):
        for left in generate_trees(lo, root - 1):
            for right in generate_trees(root + 1, hi):
                trees.append(TreeNode(root, left, right))
    return trees
'''
pitfalls = [
    "An empty range counts as one way (the empty tree), or the products collapse to 0.",
    "The answers are Catalan numbers: 1, 1, 2, 5, 14, 42, ...",
    "Building all the trees is exponential. Only count if the problem asks for a count.",
]

[[technique]]
id = "Trees:dfs-edit"
group = "Transformations"
signals = [
    "remove nodes, and removing one can make its parent removable too",
    "prune subtrees that are empty or don't satisfy a rule",
    "children must be fixed BEFORE you decide about the node (post-order)",
]
template_name = "Remove leaf nodes"
template = '''
def remove_leaf_nodes(root, target):
    if root is None:
        return None
    root.left = remove_leaf_nodes(root.left, target)
    root.right = remove_leaf_nodes(root.right, target)
    if root.left is None and root.right is None and root.val == target:
        return None  # now a leaf with the target value: remove it
    return root
'''
pitfalls = [
    "Post-order: clean the children first. A node may only become a leaf after its children are gone.",
    "Reassign root.left and root.right from the calls. Returning None is how a node disappears.",
    "The whole tree may vanish: the function can return None.",
]

[[technique.variant]]
name = "Delete nodes, return the forest"
note = "A deleted node's children become roots: pass 'my parent was deleted' down."
template = '''
def del_nodes(root, to_delete):
    gone, out = set(to_delete), []

    def go(node, is_root):
        if node is None:
            return None
        deleted = node.val in gone
        if is_root and not deleted:
            out.append(node)  # a new tree starts here
        node.left = go(node.left, deleted)
        node.right = go(node.right, deleted)
        return None if deleted else node

    go(root, True)
    return out
'''

[[technique.variant]]
name = "Prune subtrees of zeros"
note = "Prune the children first: then a node with no children and value 0 can go."
template = '''
def prune_tree(root):
    if root is None:
        return None
    root.left = prune_tree(root.left)
    root.right = prune_tree(root.right)
    if root.val == 0 and root.left is None and root.right is None:
        return None
    return root
'''

[[technique]]
id = "Trees:serialize"
group = "Construction"
signals = [
    "turn a tree into a string and back",
    "the string must carry the shape, including where children are missing",
    "values can be negative or have several digits",
]
template = '''
def serialize(root):
    tokens = []

    def walk(node):
        if node is None:
            tokens.append("N")
            return
        tokens.append(str(node.val))
        walk(node.left)
        walk(node.right)

    walk(root)
    return ",".join(tokens)


def deserialize(data):
    tokens = iter(data.split(","))

    def build():
        token = next(tokens)
        if token == "N":
            return None
        node = TreeNode(int(token))
        node.left = build()  # preorder: the left subtree's tokens come next
        node.right = build()
        return node

    return build()
'''
pitfalls = [
    "Write a marker for every missing child. Values alone don't fix the shape.",
    "Separate tokens with a delimiter, since values can be several digits long or negative.",
    "One iterator shared by every call keeps the position in the token stream.",
]

[[extra]]
id = "Trees:traversals-iterative"
name = "Traversals with an explicit stack"
group = "Traversals"
signals = [
    "the recursion depth could be 10^5 (a skewed tree), or you are asked for the iterative version",
    "the output is preorder, inorder or postorder values",
    "O(1) extra space is wanted: temporarily thread the tree (Morris)",
]
template_name = "Inorder"
template = '''
def inorder(root):
    out, stack, node = [], [], root
    while node or stack:
        while node:
            stack.append(node)  # go as far left as possible
            node = node.left
        node = stack.pop()
        out.append(node.val)
        node = node.right  # then the right subtree
    return out
'''
pitfalls = [
    "Inorder visits a node when it is popped, preorder when it is pushed: that is the only difference.",
    "Push the right child before the left in preorder, so the left is popped first.",
    "Postorder is the reverse of 'node, right, left': that is the simplest iterative version.",
]
examples = ["binary-tree-inorder-traversal", "binary-tree-preorder-traversal", "binary-tree-postorder-traversal", "n-ary-tree-preorder-traversal", "n-ary-tree-postorder-traversal"]

[[extra.variant]]
name = "Preorder"
note = "Visit when pushed; the right child goes on the stack first."
template = '''
def preorder(root):
    out, stack = [], [root] if root else []
    while stack:
        node = stack.pop()
        out.append(node.val)
        if node.right:
            stack.append(node.right)  # popped after the left
        if node.left:
            stack.append(node.left)
    return out
'''

[[extra.variant]]
name = "Postorder"
note = "Preorder with the children swapped is node, right, left: reversed it is left, right, node."
template = '''
def postorder(root):
    out, stack = [], [root] if root else []
    while stack:
        node = stack.pop()
        out.append(node.val)  # node, then right, then left ...
        if node.left:
            stack.append(node.left)
        if node.right:
            stack.append(node.right)
    return out[::-1]  # ... reversed: left, right, node
'''

[[extra.variant]]
name = "Morris inorder (O(1) space)"
note = "Thread the rightmost node of the left subtree back to the current node, and remove the thread on the way back."
template = '''
def morris_inorder(root):
    out, node = [], root
    while node:
        if node.left is None:
            out.append(node.val)
            node = node.right
            continue
        pred = node.left
        while pred.right and pred.right is not node:
            pred = pred.right  # the rightmost of the left subtree
        if pred.right is None:
            pred.right = node  # a thread back to node
            node = node.left
        else:
            pred.right = None  # second visit: remove the thread
            out.append(node.val)
            node = node.right
    return out
'''

[[extra]]
id = "Trees:columns"
name = "Columns and boundaries: vertical order and boundary"
group = "Views"
signals = [
    "report the nodes column by column, left to right, top to bottom",
    "the boundary of a tree: left edge, leaves, right edge",
    "give every node a (row, column) coordinate while walking",
]
template_name = "Vertical order"
template = '''
from collections import defaultdict, deque


def vertical_traversal(root):
    cols = defaultdict(list)  # column -> [(row, value)]
    queue = deque([(root, 0, 0)] if root else [])
    while queue:
        node, row, col = queue.popleft()
        cols[col].append((row, node.val))
        if node.left:
            queue.append((node.left, row + 1, col - 1))
        if node.right:
            queue.append((node.right, row + 1, col + 1))
    # within a column: by row, then by value
    return [[v for _, v in sorted(cols[c])] for c in sorted(cols)]
'''
pitfalls = [
    "Two nodes in the same row and column are ordered by value, not by arrival: sort the (row, value) pairs.",
    "Columns can be negative: sort the keys of the dict, do not index an array.",
    "Some versions of the problem want only top-to-bottom order of arrival: then no sort within a column is needed.",
]
examples = ["vertical-order-traversal-of-a-binary-tree", "binary-tree-vertical-order-traversal", "boundary-of-binary-tree", "binary-tree-right-side-view"]

[[extra.variant]]
name = "Boundary of a binary tree"
note = "Left edge (no leaves), then all leaves left to right, then the right edge in reverse."
template = '''
def boundary_of_binary_tree(root):
    def is_leaf(n):
        return n.left is None and n.right is None

    if root is None:
        return []
    out = [] if is_leaf(root) else [root.val]
    node = root.left
    while node:  # left edge, top down, leaves excluded
        if not is_leaf(node):
            out.append(node.val)
        node = node.left or node.right

    def leaves(n):
        if n is None:
            return
        if is_leaf(n):
            out.append(n.val)
        leaves(n.left)
        leaves(n.right)

    leaves(root)
    edge, node = [], root.right
    while node:  # right edge, collected top down, then reversed
        if not is_leaf(node):
            edge.append(node.val)
        node = node.right or node.left
    return out + edge[::-1]
'''

[[extra]]
id = "Trees:prefix-map"
name = "Paths that start anywhere: a prefix-sum map with undo"
group = "Path problems"
signals = [
    "count downward paths (not necessarily from the root) whose values add up to a target",
    "prefix sums along the root-to-node path, like the subarray-sum problem on an array",
    "a hash map of seen prefix sums that is updated on the way down and undone on the way up",
]
template = '''
from collections import defaultdict


def path_sum_iii(root, target):
    seen = defaultdict(int)
    seen[0] = 1  # the empty prefix
    def go(node, running):
        if node is None:
            return 0
        running += node.val
        count = seen[running - target]  # paths that end at this node
        seen[running] += 1
        count += go(node.left, running) + go(node.right, running)
        seen[running] -= 1  # leaving the node: undo
        return count

    return go(root, 0)
'''
pitfalls = [
    "Undo the map entry after both children: otherwise a sibling's branch sees prefixes that are not its ancestors.",
    "Seed the map with {0: 1}: it counts the paths that start at the root.",
    "Count before adding the current prefix: a path of length zero must not match.",
]
examples = ["path-sum-iii", "path-sum-ii", "binary-tree-paths", "path-sum"]

[[extra]]
id = "Trees:lca"
name = "Lowest common ancestor in a binary tree"
group = "Lowest common ancestor"
signals = [
    "the lowest node that has both p and q below it (or is one of them)",
    "a node is the answer when p is found on one side and q on the other",
    "the deepest leaves, the nodes of a tree path, or turns between two nodes all use the same LCA idea",
]
template_name = "Recursive return"
template = '''
def lowest_common_ancestor(root, p, q):
    if root is None or root is p or root is q:
        return root
    left = lowest_common_ancestor(root.left, p, q)
    right = lowest_common_ancestor(root.right, p, q)
    if left and right:
        return root  # p and q are on different sides
    return left or right  # both on one side, or only one exists
'''
pitfalls = [
    "Return the node itself when you meet p or q: if the other is below it, this node is the answer.",
    "If both subtrees return something, the current node is the split point.",
    "A BST needs no recursion into both sides: compare the values and descend into one.",
]
examples = ["lowest-common-ancestor-of-a-binary-tree", "lowest-common-ancestor-of-a-binary-tree-iii", "lowest-common-ancestor-of-deepest-leaves", "smallest-subtree-with-all-the-deepest-nodes", "step-by-step-directions-from-a-binary-tree-node-to-another"]

[[extra.variant]]
name = "With parent pointers (two walkers)"
note = "Each walker goes up and, at the top, restarts from the other node: they meet at the LCA after a - b + b - a steps."
template = '''
def lowest_common_ancestor_parent(p, q):
    a, b = p, q
    while a is not b:
        a = a.parent if a else q  # at the top, switch to the other start
        b = b.parent if b else p
    return a
'''

[[extra.variant]]
name = "Deepest leaves"
note = "Return (depth, answer): the deeper side wins, a tie makes the current node the answer."
template = '''
def lca_deepest_leaves(root):
    def go(node):  # (depth below node, lca of the deepest leaves there)
        if node is None:
            return 0, None
        ld, lc = go(node.left)
        rd, rc = go(node.right)
        if ld > rd:
            return ld + 1, lc
        if rd > ld:
            return rd + 1, rc
        return ld + 1, node  # equal: node is where they split
    return go(root)[1]
'''

[[extra.variant]]
name = "Directions between two nodes"
note = "Path from the root to each node; drop the shared prefix, go up for the rest of the first and down along the second."
template = '''
def get_directions(root, start, dest):
    def path(node, target, acc):
        if node is None:
            return False
        if node.val == target:
            return True
        acc.append("L")
        if path(node.left, target, acc):
            return True
        acc[-1] = "R"
        if path(node.right, target, acc):
            return True
        acc.pop()
        return False

    a, b = [], []
    path(root, start, a)
    path(root, dest, b)
    i = 0
    while i < min(len(a), len(b)) and a[i] == b[i]:
        i += 1  # the shared prefix leads to the LCA
    return "U" * (len(a) - i) + "".join(b[i:])
'''

