]
template = '''
from collections import defaultdict


def find_min_height_trees(n, edges):
    if n == 1:
        return [0]
    adj = defaultdict(set)
    for a, b in edges:
        adj[a].add(b)
        adj[b].add(a)
    leaves = [u for u in range(n) if len(adj[u]) == 1]
    remaining = n
    while remaining > 2:
        remaining -= len(leaves)
        nxt = []
        for leaf in leaves:
            (nb,) = adj[leaf]  # a leaf has exactly one neighbour
            adj[nb].discard(leaf)
            if len(adj[nb]) == 1:
                nxt.append(nb)  # it has become a leaf
        leaves = nxt
    return leaves
'''
