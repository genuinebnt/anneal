template_name = "Validate"
template = '''
def is_valid_bst(root):
    def ok(node, lo, hi):  # every value must lie in (lo, hi)
        if node is None:
            return True
        if not lo < node.val < hi:
            return False
        return ok(node.left, lo, node.val) and ok(node.right, node.val, hi)

    return ok(root, float("-inf"), float("inf"))
'''
pitfalls = [
    "Checking only left < node < right misses a deep violation: pass the bounds down.",
    "Use strict inequalities: duplicates are not allowed in a BST.",
    "Do not use INT_MIN as the first bound: a node may hold that value. Use infinities (or None).",
]
examples = ["validate-binary-search-tree", "construct-binary-search-tree-from-preorder-traversal", "verify-preorder-sequence-in-binary-search-tree", "range-sum-of-bst", "trim-a-binary-search-tree"]

[[extra.variant]]
name = "Build from preorder"
note = "Take values while they are below the upper bound; the left child's bound is the node, the right child's is the parent's."
template = '''
def bst_from_preorder(preorder):
    i = 0

    def build(hi):  # take values while they are below hi
        nonlocal i
        if i == len(preorder) or preorder[i] > hi:
            return None
        node = TreeNode(preorder[i])
        i += 1
        node.left = build(node.val)
        node.right = build(hi)
        return node

    return build(float("inf"))
'''

[[extra.variant]]
name = "Verify a preorder list (stack)"
note = "A pop means we turned right of the popped value: from then on nothing may be smaller than it."
template = '''
def verify_preorder(preorder):
    stack, low = [], float("-inf")
    for x in preorder:
        if x < low:
            return False  # smaller than an ancestor we passed on the right
        while stack and stack[-1] < x:
            low = stack.pop()  # went right of it: a new lower bound
        stack.append(x)
    return True
'''

[[extra.variant]]
name = "Trim to a range"
note = "A root below the range is replaced by the trimmed right subtree, a root above it by the left."
template = '''
def trim_bst(root, low, high):
    if root is None:
        return None
    if root.val < low:
        return trim_bst(root.right, low, high)  # root and left are out
    if root.val > high:
        return trim_bst(root.left, low, high)  # root and right are out
    root.left = trim_bst(root.left, low, high)
    root.right = trim_bst(root.right, low, high)
    return root
'''

[[extra.variant]]
name = "Range sum"
note = "Skip the side that cannot contain values in the range."
template = '''
def range_sum_bst(root, low, high):
    if root is None:
        return 0
    if root.val < low:
        return range_sum_bst(root.right, low, high)  # left is too small
    if root.val > high:
        return range_sum_bst(root.left, low, high)  # right is too big
    return (root.val + range_sum_bst(root.left, low, high)
            + range_sum_bst(root.right, low, high))
'''

[[extra.variant]]
name = "Nearest keys"
note = "Inorder gives the sorted keys; the floor and the ceiling of a query come from one binary search."
template = '''
from bisect import bisect_left


def closest_nodes(root, queries):
    vals = []

    def walk(node):
        if node:
            walk(node.left)
            vals.append(node.val)
            walk(node.right)

    walk(root)
    out = []
    for q in queries:
        i = bisect_left(vals, q)
        if i < len(vals) and vals[i] == q:
            out.append([q, q])
        else:
            out.append([vals[i - 1] if i else -1,
                        vals[i] if i < len(vals) else -1])
    return out
'''

[[extra]]
id = "Trees:bst-iterator"
name = "BST iterator: a stack of the left spine"
group = "Iterator design"
template_name = "Iterator"
signals = [
    "an object that hands out the next smaller (or larger) value on demand, in O(h) memory",
    "next() and hasNext() in amortised O(1)",
    "two iterators, one from each end, find pairs in a BST",
]
template = '''
class BSTIterator:
    def __init__(self, root):
        self.stack = []
        self._push_left(root)

    def _push_left(self, node):
        while node:
            self.stack.append(node)
            node = node.left

    def next(self):
        node = self.stack.pop()
        self._push_left(node.right)  # what follows comes from its right
        return node.val

    def hasNext(self):
        return bool(self.stack)
'''
pitfalls = [
    "Keep only the left spine, not the whole inorder list: that is the O(h) memory.",
    "After popping a node push the left spine of its right child, and nothing else.",
    "A second iterator that goes right first gives the descending order: two-sum on a BST needs both.",
]
examples = ["binary-search-tree-iterator", "two-sum-iv-input-is-a-bst", "two-sum-bsts", "closest-binary-search-tree-value-ii"]

[[extra.variant]]
name = "Two sum on a BST"
note = "One generator ascending and one descending: move the one that brings the sum towards the target."
template = '''
def find_target(root, k):
    def walk(forward):
        stack, node = [], root
        while stack or node:
            while node:
                stack.append(node)
                node = node.left if forward else node.right
            node = stack.pop()
            yield node.val
            node = node.right if forward else node.left

    lo, hi = walk(True), walk(False)
    a, b = next(lo, None), next(hi, None)
    while a is not None and b is not None and a < b:
        s = a + b
        if s == k:
            return True
        if s < k:
            a = next(lo, None)
        else:
            b = next(hi, None)
    return False
'''

[[extra]]
id = "Trees:inorder-state"
name = "Inorder with a running previous node"
group = "BST operations"
signals = [
    "the inorder sequence of a BST is sorted, so questions about neighbours are questions about adjacent nodes",
    "find the two swapped nodes, the minimum gap, the mode",
    "carry the previous node (or value) through the walk instead of building the list",
]
template_name = "Recover a BST"
template = '''
def recover_tree(root):
    first = second = prev = None
    stack, node = [], root
    while stack or node:
        while node:
            stack.append(node)
            node = node.left
        node = stack.pop()
        if prev and prev.val > node.val:  # an inversion
            if first is None:
                first = prev  # the larger of the first inversion
            second = node  # the smaller of the last inversion
        prev = node
        node = node.right
    first.val, second.val = second.val, first.val
'''
pitfalls = [
    "Two swapped nodes give one inversion (adjacent) or two (far apart): keep the first 'larger' and the last 'smaller'.",
    "Swap the values, not the nodes: that is far simpler and the structure stays valid.",
    "The O(1)-space version is the same loop with Morris threading.",
]
examples = ["recover-binary-search-tree", "minimum-distance-between-bst-nodes", "minimum-absolute-difference-in-bst", "convert-bst-to-greater-tree", "binary-search-tree-to-greater-sum-tree", "find-mode-in-binary-search-tree"]

[[extra.variant]]
name = "Minimum difference between nodes"
note = "Only neighbours in the inorder order can be closest."
template = '''
def min_diff_in_bst(root):
    best, prev = float("inf"), None
    stack, node = [], root
    while stack or node:
        while node:
            stack.append(node)
            node = node.left
        node = stack.pop()
        if prev is not None:
            best = min(best, node.val - prev)  # neighbours in order
        prev = node.val
        node = node.right
    return best
'''

[[extra.variant]]
name = "Greater tree (reverse inorder)"
note = "Walk from the largest to the smallest, keeping a running total of what is bigger."
template = '''
def convert_bst(root):
    total, stack, node = 0, [], root
    while stack or node:
        while node:
            stack.append(node)
            node = node.right  # the biggest first
        node = stack.pop()
        total += node.val
        node.val = total  # itself plus everything larger
        node = node.left
    return root
'''

[[extra.variant]]
name = "Mode of a BST"
note = "Equal values are adjacent in order: count the current run and keep the longest ones."
template = '''
def find_mode(root):
    best, count, prev, modes = 0, 0, None, []
    stack, node = [], root
    while stack or node:
        while node:
            stack.append(node)
            node = node.left
        node = stack.pop()
        count = count + 1 if node.val == prev else 1
        prev = node.val
        if count > best:
            best, modes = count, [node.val]
        elif count == best:
            modes.append(node.val)
        node = node.right
    return modes
'''

