name = "Diameter"
note = "Combine the two tallest children at each node."
template = '''
def diameter(root):
    best = 0

    def height(node):
        nonlocal best
        top1 = top2 = 0
        for c in node.children:
            h = height(c)
            if h > top1:
                top1, top2 = h, top1
            elif h > top2:
                top2 = h
        best = max(best, top1 + top2)  # a path through this node
        return top1 + 1

    if root:
        height(root)
    return best
'''

