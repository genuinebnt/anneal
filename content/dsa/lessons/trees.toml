template = '''
def path_in_zig_zag_tree(label):
    out = []
    level = label.bit_length()  # level 1 holds just the label 1
    while label:
        out.append(label)
        lo, hi = 1 << (level - 1), (1 << level) - 1
        label = (lo + hi - label) // 2  # mirror in the level, then halve
        level -= 1
    return out[::-1]
'''
