def create_binary_tree(descriptions):
    nodes, children = {}, set()
    for parent, child, is_left in descriptions:
        p = nodes.setdefault(parent, TreeNode(parent))
        c = nodes.setdefault(child, TreeNode(child))
        if is_left:
            p.left = c
        else:
            p.right = c
        children.add(child)
    root = next(v for v in nodes if v not in children)  # nobody's child
    return nodes[root]
'''
