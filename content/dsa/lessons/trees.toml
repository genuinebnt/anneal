name = "Symmetric"
note = "The two halves must mirror each other: left with right, and right with left."
template = '''
def is_symmetric(root):
    def mirror(a, b):
        if a is None or b is None:
            return a is b
        return (a.val == b.val and mirror(a.left, b.right)
                and mirror(a.right, b.left))

    return root is None or mirror(root.left, root.right)
'''

[[extra.variant]]
name = "Subtree of another tree"
note = "Try the match at every node of the big tree."
template = '''
def is_subtree(root, sub):
    def same(a, b):
        if a is None or b is None:
            return a is b
        return (a.val == b.val and same(a.left, b.left)
                and same(a.right, b.right))

    def go(node):
        if node is None:
            return sub is None
        return same(node, sub) or go(node.left) or go(node.right)

    return go(root)
'''

[[extra.variant]]
name = "Flip equivalent"
note = "At each node either the children match straight or after swapping them."
template = '''
def flip_equiv(a, b):
    if a is None or b is None:
        return a is b
    if a.val != b.val:
        return False
    straight = flip_equiv(a.left, b.left) and flip_equiv(a.right, b.right)
    flipped = flip_equiv(a.left, b.right) and flip_equiv(a.right, b.left)
    return straight or flipped
'''

