[[extra.variant]]
name = "Depth-marked preorder (dashes)"
note = "A stack holds the current path: the number of dashes says how many nodes to keep."
template = '''
def recover_from_preorder(traversal):
    stack, i, n = [], 0, len(traversal)
    while i < n:
        depth = 0
        while i < n and traversal[i] == "-":
            depth += 1
            i += 1
        j = i
        while j < n and traversal[j] != "-":
            j += 1
        node = TreeNode(int(traversal[i:j]))
        i = j
        while len(stack) > depth:
            stack.pop()  # climb back to the parent
        if stack:
            parent = stack[-1]
            if parent.left is None:
                parent.left = node  # the left child comes first
            else:
                parent.right = node
        stack.append(node)
    return stack[0]
'''

