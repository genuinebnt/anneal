pattern = "2-D Dynamic Programming"
intro = "A 2-D DP has two things that change at once: a row and a column, two positions in two strings, or the two ends of an interval. Draw the table, say what each cell means, and see which neighbouring cells it needs. That also tells you the order to fill it and which rows you can throw away."
groups = ["LCS and edit distance", "Interval DP", "Grid and path DP", "Tree DP", "DAG and graph DP", "State machine DP", "Constrained subsequences", "Broken profile and tiling DP"]










[[technique]]
id = "2-D Dynamic Programming:grid-dp"
walk = "dp2-path"
group = "Grid and path DP"
signals = [
    "move through a grid, usually only right and down",
    "count the paths, or find the cheapest path, from one corner to another",
    "each cell's answer comes from the cell above and the cell to the left",
]
template = '''
def min_path_sum(grid):
    rows, cols = len(grid), len(grid[0])
    dp = [float("inf")] * cols  # one row at a time: dp[c] is the cell above
    dp[0] = 0
    for r in range(rows):
        for c in range(cols):
            left = dp[c - 1] if c else float("inf")
            dp[c] = min(dp[c], left) + grid[r][c]
    return dp[-1]
'''
pitfalls = [
    "Fill the first row and first column carefully: they have only one neighbour to come from.",
    "A blocked cell (an obstacle) simply gets 0 ways, or infinite cost.",
    "Keeping one row is enough because a cell only needs the row above and the cell to its left.",
]

[[technique]]
id = "2-D Dynamic Programming:two-string"
walk = "dp2-lcs"
group = "LCS and edit distance"
signals = [
    "compare two strings or two arrays position by position",
    "longest common subsequence, edit distance, or interleaving",
    "dp[i][j] is the answer for the first i of one and the first j of the other",
]
template = '''
def lcs_length(a, b):
    # dp[i][j]: longest common subsequence of a[:i] and b[:j].
    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            if a[i - 1] == b[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
    return dp[-1][-1]
'''
pitfalls = [
    "The table has one extra row and column for the empty prefix. Characters are a[i - 1] and b[j - 1].",
    "A match uses the diagonal. A mismatch drops a character from one string or the other.",
    "Edit distance has the same table: the three neighbours become insert, delete and replace, each plus one.",
]

[[technique]]
id = "2-D Dynamic Programming:pair-dp"
group = "Constrained subsequences"
signals = [
    "a subsequence where each element is decided by the previous two",
    "the state is the last two chosen positions (j, k)",
    "a hash map from value to index finds the earlier element in O(1)",
]
template = '''
def longest_fib_subseq(arr):
    index = {x: i for i, x in enumerate(arr)}
    # dp[(j, k)]: length of the longest chain ending with arr[j], arr[k].
    dp = {}
    best = 0
    for k in range(len(arr)):
        for j in range(k):
            i = index.get(arr[k] - arr[j], -1)  # the element before arr[j]
            if 0 <= i < j:
                dp[(j, k)] = dp.get((i, j), 2) + 1
                best = max(best, dp[(j, k)])
    return best
'''
pitfalls = [
    "A chain of two is always valid, so a missing entry defaults to length 2.",
    "Require i < j so the elements stay in order.",
    "Return 0 when no chain of three exists. best only changes when one is found.",
]

[[technique]]
id = "2-D Dynamic Programming:state-machine"
group = "State machine DP"
signals = [
    "buy and sell with a rule: a cooldown, a fee, or a limited number of trades",
    "you are always in one of a few named states (holding, sold, resting)",
    "each day moves you between the states",
]
template = '''
def max_profit_with_cooldown(prices):
    hold = float("-inf")  # owning a share
    sold = 0              # just sold today: must rest tomorrow
    rest = 0              # free to buy
    for p in prices:
        hold, sold, rest = max(hold, rest - p), hold + p, max(rest, sold)
    return max(sold, rest)
'''
pitfalls = [
    "Name the states and draw the arrows between them before writing code.",
    "Update all states from yesterday's values at once. A tuple assignment does that.",
    "The answer is a state where you hold nothing, never hold.",
]

[[technique]]
id = "2-D Dynamic Programming:dfs-memo"
group = "Grid and path DP"
signals = [
    "the best path in a grid where you can move in any of four directions",
    "moves are only allowed under a rule (strictly increasing) so there are no cycles",
    "the answer from a cell does not depend on how you got there",
]
template = '''
from functools import lru_cache


def longest_increasing_path(matrix):
    rows, cols = len(matrix), len(matrix[0])

    @lru_cache(maxsize=None)
    def longest_from(r, c):
        best = 1
        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            nr, nc = r + dr, c + dc
            if 0 <= nr < rows and 0 <= nc < cols:
                if matrix[nr][nc] > matrix[r][c]:
                    best = max(best, 1 + longest_from(nr, nc))
        return best

    return max(longest_from(r, c) for r in range(rows) for c in range(cols))
'''
pitfalls = [
    "Memoise on the cell. Without it each cell is re-explored from every path that reaches it.",
    "The strictly increasing rule means no cycles, so no visited set is needed.",
    "Recursion depth can reach rows times columns. Raise the limit or sort cells by value and fill in order.",
]

[[technique]]
id = "2-D Dynamic Programming:interval"
group = "Interval DP"
signals = [
    "remove or merge items from a line, and the cost depends on the neighbours at that moment",
    "the answer for a range [i, j] is built from two smaller ranges",
    "think about the last item removed, not the first",
]
template = '''
def max_coins(nums):
    nums = [1] + nums + [1]  # imaginary balloons at both ends
    n = len(nums)
    # dp[i][j]: best total from bursting everything between i and j.
    dp = [[0] * n for _ in range(n)]
    for length in range(2, n):
        for i in range(n - length):
            j = i + length
            for k in range(i + 1, j):  # k is the LAST one burst in (i, j)
                gain = nums[i] * nums[k] * nums[j]
                dp[i][j] = max(dp[i][j], dp[i][k] + gain + dp[k][j])
    return dp[0][n - 1]
'''
pitfalls = [
    "Choose the last item to remove in the range. Then its neighbours are fixed (i and j), and the two sides are independent.",
    "Loop by increasing range length so the smaller ranges are ready.",
    "Pad the ends with a neutral value so there are no special cases at the borders.",
]

[[extra]]
id = "2-D Dynamic Programming:tree-dp"
name = "Tree DP: a tuple per node"
group = "Tree DP"
signals = [
    "a choice at a node limits the choices at its children (take or skip, coloured or not)",
    "the answer for a node is built from the answers of its children, then reported to its parent",
    "the best value may pass through a node without being a root-to-leaf chain",
]
template = '''
def rob(root):
    """House robber on a tree: no two directly linked nodes both taken."""

    def go(node):
        """(best total if node is taken, best total if it is skipped)"""
        if not node:
            return 0, 0
        left_take, left_skip = go(node.left)
        right_take, right_skip = go(node.right)
        take = node.val + left_skip + right_skip
        skip = max(left_take, left_skip) + max(right_take, right_skip)
        return take, skip

    return max(go(root))
'''
pitfalls = [
    "Return one tuple per node (one number per state): the DP table is the return value, not an array.",
    "When the answer can bend at a node (path sum, diameter), return the best single chain and update a separate best with the two chains joined.",
    "A deep tree can exceed Python's recursion limit: raise it, or process nodes in post-order with a stack.",
]
examples = ["house-robber-iii", "binary-tree-maximum-path-sum", "diameter-of-binary-tree", "maximum-average-subtree"]

[[extra]]
id = "2-D Dynamic Programming:lcs-family"
walk = "dp2-lcs"
name = "LCS and its relatives"
group = "LCS and edit distance"
signals = [
    "the longest palindromic subsequence, the fewest deletions to make two strings equal, crossing-free matchings",
    "many problems are the longest common subsequence in disguise: of a string with its reverse, of two arrays",
    "dp[i][j] over prefixes: extend on a match, otherwise the better of dropping one side",
]
template_name = "Longest palindromic subsequence"
template = '''
def longest_palindrome_subseq(s):
    n = len(s)
    dp = [[0] * n for _ in range(n)]  # dp[i][j]: the answer for s[i..j]
    for i in range(n - 1, -1, -1):
        dp[i][i] = 1
        for j in range(i + 1, n):
            if s[i] == s[j]:
                dp[i][j] = dp[i + 1][j - 1] + 2  # the ends match
            else:
                dp[i][j] = max(dp[i + 1][j], dp[i][j - 1])  # drop an end
    return dp[0][n - 1] if n else 0
'''
pitfalls = [
    "Fill i from the end and j upwards so that dp[i + 1][...] and dp[i][j - 1] are ready.",
    "When j = i + 1 the inner part is empty: dp[i + 1][j - 1] is 0 (it sits below the diagonal).",
    "The same answer is the LCS of s and its reverse.",
]
examples = ["longest-palindromic-subsequence", "delete-operation-for-two-strings", "minimum-ascii-delete-sum-for-two-strings", "uncrossed-lines", "valid-palindrome-iii"]

[[extra.variant]]
name = "Delete operation for two strings"
note = "The fewest deletions leave the longest common subsequence: answer = len(a) + len(b) - 2 * LCS."
template = '''
def min_distance(word1, word2):
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i - 1] == word2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
    return m + n - 2 * dp[m][n]
'''

[[extra.variant]]
name = "Minimum ASCII delete sum"
note = "The cost of a deletion is the character's code: dp[i][j] is the cheapest way to make the prefixes equal."
template = '''
def minimum_delete_sum(s1, s2):
    m, n = len(s1), len(s2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(1, m + 1):
        dp[i][0] = dp[i - 1][0] + ord(s1[i - 1])  # delete everything
    for j in range(1, n + 1):
        dp[0][j] = dp[0][j - 1] + ord(s2[j - 1])
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s1[i - 1] == s2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]  # free: they match
            else:
                dp[i][j] = min(dp[i - 1][j] + ord(s1[i - 1]),
                               dp[i][j - 1] + ord(s2[j - 1]))
    return dp[m][n]
'''

[[extra.variant]]
name = "Uncrossed lines"
note = "Connecting equal numbers without crossing lines is exactly the longest common subsequence."
template = '''
def max_uncrossed_lines(nums1, nums2):
    m, n = len(nums1), len(nums2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if nums1[i - 1] == nums2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
    return dp[m][n]
'''

[[extra]]
id = "2-D Dynamic Programming:match-count"
name = "Counting subsequences and matching patterns"
group = "LCS and edit distance"
signals = [
    "how many times does t appear as a subsequence of s",
    "is a string an interleaving of two others, does it match a pattern with . and *",
    "dp over a prefix of each: a match adds the ways with both advanced, plus the ways that skip a character of s",
]
template_name = "Distinct subsequences"
template = '''
def num_distinct(s, t):
    m, n = len(s), len(t)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(m + 1):
        dp[i][0] = 1  # the empty t appears once in any prefix
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            dp[i][j] = dp[i - 1][j]  # skip s[i - 1]
            if s[i - 1] == t[j - 1]:
                dp[i][j] += dp[i - 1][j - 1]  # or use it for t[j - 1]
    return dp[m][n]
'''
pitfalls = [
    "dp[i][0] = 1: the empty target is formed in exactly one way (take nothing).",
    "Add, not max: this counts ways.",
    "A row can be reused (iterate j downwards) to save memory.",
]
examples = ["distinct-subsequences", "interleaving-string", "regular-expression-matching", "is-subsequence"]

[[extra.variant]]
name = "Interleaving string"
note = "dp[i][j]: the first i characters of s1 and j of s2 can form the first i + j of s3."
template = '''
def is_interleave(s1, s2, s3):
    m, n = len(s1), len(s2)
    if m + n != len(s3):
        return False
    dp = [[False] * (n + 1) for _ in range(m + 1)]
    dp[0][0] = True
    for i in range(m + 1):
        for j in range(n + 1):
            if i and dp[i - 1][j] and s1[i - 1] == s3[i + j - 1]:
                dp[i][j] = True  # the last character came from s1
            if j and dp[i][j - 1] and s2[j - 1] == s3[i + j - 1]:
                dp[i][j] = True  # or from s2
    return dp[m][n]
'''

[[extra.variant]]
name = "Regular expression matching"
note = "'.' matches any one character; 'x*' matches zero or more x. dp[i][j]: s[:i] matches p[:j]."
template = '''
def is_match(s, p):
    m, n = len(s), len(p)
    dp = [[False] * (n + 1) for _ in range(m + 1)]
    dp[0][0] = True
    for j in range(2, n + 1):
        dp[0][j] = p[j - 1] == "*" and dp[0][j - 2]  # x* can match nothing
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if p[j - 1] == "*":
                dp[i][j] = dp[i][j - 2]  # zero copies
                if p[j - 2] in (s[i - 1], "."):
                    dp[i][j] = dp[i][j] or dp[i - 1][j]  # one more copy
            elif p[j - 1] in (s[i - 1], "."):
                dp[i][j] = dp[i - 1][j - 1]
    return dp[m][n]
'''

[[extra]]
id = "2-D Dynamic Programming:square-shapes"
name = "Squares and plus signs in a binary grid"
group = "Grid and path DP"
signals = [
    "the largest square of ones, how many squares of ones, the largest plus sign",
    "dp[r][c] = the side of the largest square whose bottom-right corner is (r, c)",
    "the square extends the smallest of its three neighbours (up, left, up-left) by one",
]
template_name = "Maximal square"
template = '''
def maximal_square(matrix):
    rows, cols = len(matrix), len(matrix[0])
    dp = [[0] * (cols + 1) for _ in range(rows + 1)]  # a border of zeros
    best = 0
    for r in range(1, rows + 1):
        for c in range(1, cols + 1):
            if matrix[r - 1][c - 1] == "1":
                neighbours = (dp[r - 1][c], dp[r][c - 1], dp[r - 1][c - 1])
                dp[r][c] = 1 + min(neighbours)
                best = max(best, dp[r][c])
    return best * best
'''
pitfalls = [
    "The border of zeros avoids index checks at the edges.",
    "A square of side k ending here needs squares of side k - 1 ending at all three neighbours: the minimum.",
    "The answer is the area: the side squared.",
]
examples = ["maximal-square", "count-square-submatrices-with-all-ones", "largest-plus-sign"]

[[extra.variant]]
name = "Count square submatrices"
note = "dp[r][c] is also the number of squares that end at (r, c): sum them all."
template = '''
def count_squares(matrix):
    rows, cols = len(matrix), len(matrix[0])
    dp = [[0] * (cols + 1) for _ in range(rows + 1)]
    total = 0
    for r in range(1, rows + 1):
        for c in range(1, cols + 1):
            if matrix[r - 1][c - 1]:
                neighbours = (dp[r - 1][c], dp[r][c - 1], dp[r - 1][c - 1])
                dp[r][c] = 1 + min(neighbours)
                total += dp[r][c]  # squares of side 1..dp[r][c] end here
    return total
'''

[[extra.variant]]
name = "Largest plus sign"
note = "For each cell the longest run of ones in four directions; the plus has the minimum of the four."
template = '''
def order_of_largest_plus_sign(n, mines):
    banned = {tuple(m) for m in mines}
    grid = [[0 if (r, c) in banned else 1 for c in range(n)]
            for r in range(n)]
    arm = [[n] * n for _ in range(n)]  # shortest of the four arms
    for r in range(n):
        for order in (range(n), range(n - 1, -1, -1)):
            run = 0
            for c in order:  # left to right, then right to left
                run = run + 1 if grid[r][c] else 0
                arm[r][c] = min(arm[r][c], run)
    for c in range(n):
        for order in (range(n), range(n - 1, -1, -1)):
            run = 0
            for r in order:  # top to bottom, then bottom to top
                run = run + 1 if grid[r][c] else 0
                arm[r][c] = min(arm[r][c], run)
    return max(max(row) for row in arm)
'''

[[extra]]
id = "2-D Dynamic Programming:falling-paths"
name = "Falling paths and DP from the end"
group = "Grid and path DP"
signals = [
    "a path from the top row to the bottom row where each step goes to one of the cells below",
    "dp[r][c] = the cell's value plus the best of the (up to three) cells above it",
    "when the start is what you need to decide (dungeon game), run the DP backwards from the goal",
]
template_name = "Minimum falling path sum"
template = '''
def min_falling_path_sum(matrix):
    n = len(matrix)
    row = matrix[0][:]
    for r in range(1, n):
        nxt = []
        for c in range(n):
            best = row[c]  # straight down
            if c > 0:
                best = min(best, row[c - 1])  # from the upper left
            if c < n - 1:
                best = min(best, row[c + 1])  # from the upper right
            nxt.append(matrix[r][c] + best)
        row = nxt
    return min(row)
'''
pitfalls = [
    "Only the previous row is needed: keep one row.",
    "Handle the first and last column when looking diagonally.",
    "The answer is the best value in the last row.",
]
examples = ["minimum-falling-path-sum", "dungeon-game", "minimum-path-cost-in-a-grid", "triangle"]

[[extra.variant]]
name = "Dungeon game (backwards)"
note = "The knight needs at least 1 health at every step: compute the health needed at each cell from the goal backwards."
template = '''
def calculate_minimum_hp(dungeon):
    rows, cols = len(dungeon), len(dungeon[0])
    inf = float("inf")
    need = [[inf] * (cols + 1) for _ in range(rows + 1)]
    need[rows][cols - 1] = need[rows - 1][cols] = 1  # after the goal
    for r in range(rows - 1, -1, -1):
        for c in range(cols - 1, -1, -1):
            best_next = min(need[r + 1][c], need[r][c + 1])
            need[r][c] = max(1, best_next - dungeon[r][c])  # never below 1
    return need[0][0]
'''

[[extra]]
id = "2-D Dynamic Programming:two-walkers"
name = "Two walkers at once"
group = "Grid and path DP"
signals = [
    "two robots (or one robot going and returning) collect from the same grid and shared cells count once",
    "move both one row at a time: the state is the row and the column of each walker",
    "when both are on the same cell count it only once",
]
template_name = "Cherry pickup II"
template = '''
from functools import cache


def cherry_pickup(grid):
    rows, cols = len(grid), len(grid[0])

    @cache
    def best(r, a, b):  # row, column of robot 1, column of robot 2
        gain = grid[r][a]
        if a != b:
            gain += grid[r][b]  # a shared cell counts once
        if r == rows - 1:
            return gain
        top = 0
        for da in (-1, 0, 1):
            for db in (-1, 0, 1):
                na, nb = a + da, b + db
                if 0 <= na < cols and 0 <= nb < cols:
                    top = max(top, best(r + 1, na, nb))
        return gain + top

    return best(0, 0, cols - 1)
'''
pitfalls = [
    "Move both robots down together: the row is shared, so the state is (row, col1, col2).",
    "Count a cell once when both stand on it.",
    "Nine moves per state, rows * cols^2 states.",
]
examples = ["cherry-pickup-ii", "cherry-pickup"]

[[extra]]
id = "2-D Dynamic Programming:step-states"
name = "Counting over steps and states"
group = "State machine DP"
signals = [
    "the number of ways after k steps, with a small set of positions or states",
    "dp[step][state] = ways to be in that state; each step moves ways between states",
    "sums of dice, walks that may leave the board, strings built with rules between neighbours",
]
template_name = "Number of dice rolls with a target sum"
template = '''
def num_rolls_to_target(n, k, target):
    mod = 10**9 + 7
    dp = [0] * (target + 1)  # dp[t]: ways to reach sum t so far
    dp[0] = 1
    for _ in range(n):  # one die at a time
        nxt = [0] * (target + 1)
        for t in range(target + 1):
            if dp[t]:
                for face in range(1, k + 1):
                    if t + face <= target:
                        nxt[t + face] = (nxt[t + face] + dp[t]) % mod
        dp = nxt
    return dp[target]
'''
pitfalls = [
    "A new array per step: updating in place would let one die be used twice.",
    "Take the modulus after every addition.",
    "Counts that fall off the board (sum above target) are simply dropped.",
]
examples = ["number-of-dice-rolls-with-target-sum", "out-of-boundary-paths", "count-vowels-permutation", "number-of-ways-to-stay-in-the-same-place-after-some-steps", "number-of-music-playlists"]

[[extra.variant]]
name = "Out of boundary paths"
note = "Each step spreads the count to the four neighbours; moving off the board adds to the answer."
template = '''
def find_paths(m, n, max_move, start_row, start_column):
    mod = 10**9 + 7
    cur = [[0] * n for _ in range(m)]
    cur[start_row][start_column] = 1
    out = 0
    for _ in range(max_move):
        nxt = [[0] * n for _ in range(m)]
        for r in range(m):
            for c in range(n):
                if cur[r][c]:
                    for a, b in ((r + 1, c), (r - 1, c),
                                 (r, c + 1), (r, c - 1)):
                        if 0 <= a < m and 0 <= b < n:
                            nxt[a][b] = (nxt[a][b] + cur[r][c]) % mod
                        else:
                            out = (out + cur[r][c]) % mod  # off the board
        cur = nxt
    return out
'''

[[extra.variant]]
name = "Count vowels permutation"
note = "The vowel that may follow each vowel is fixed: spread the counts along those rules."
template = '''
def count_vowel_permutation(n):
    mod = 10**9 + 7
    a = e = i = o = u = 1  # strings of length 1 ending in each vowel
    for _ in range(n - 1):
        a, e, i, o, u = ((e + i + u) % mod, (a + i) % mod,
                         (e + o) % mod, i, (i + o) % mod)
    return (a + e + i + o + u) % mod
'''

