signals = [
    "pick the largest set of items under two limits at once: zeros and ones, people and profit",
    "dp[a][b] = the best with a of the first resource and b of the second",
    "iterate both capacities downwards so each item is used once",
]
template_name = "Ones and zeroes"
template = '''
def find_max_form(strs, m, n):
    dp = [[0] * (n + 1) for _ in range(m + 1)]  # dp[zeros][ones]
    for s in strs:
        zeros, ones = s.count("0"), s.count("1")
        for a in range(m, zeros - 1, -1):  # downwards: use s once
            for b in range(n, ones - 1, -1):
                dp[a][b] = max(dp[a][b], dp[a - zeros][b - ones] + 1)
    return dp[m][n]
'''
pitfalls = [
    "Loop both capacities from high to low: a string must be counted at most once.",
    "Each string costs its own zeros and ones and adds one to the size of the set.",
    "dp[a][b] is the best with at most a zeros and b ones.",
]
examples = ["ones-and-zeroes", "profitable-schemes", "target-sum", "painting-the-walls"]

[[extra.variant]]
name = "Profitable schemes"
note = "dp[people][profit]: ways to reach at least that profit with that many people; cap the profit at the minimum."
template = '''
def profitable_schemes(n, min_profit, group, profit):
    mod = 10**9 + 7
    dp = [[0] * (min_profit + 1) for _ in range(n + 1)]
    dp[0][0] = 1  # one way to do nothing
    for need, gain in zip(group, profit):
        for people in range(n, need - 1, -1):
            for p in range(min_profit, -1, -1):
                q = min(min_profit, p + gain)  # above the goal: the goal
                dp[people][q] = (dp[people][q] + dp[people - need][p]) % mod
    return sum(dp[people][min_profit] for people in range(n + 1)) % mod
'''

[[extra]]
id = "2-D Dynamic Programming:interval-cuts"
name = "Interval DP by the last cut"
group = "Interval DP"
signals = [
    "cut a stick, triangulate a polygon, merge piles: the cost of a segment depends on how it is split",
    "dp[i][j] = the best for the segment between positions i and j; try every split point k inside",
    "think about the last operation: after it, the two sides are independent",
]
template_name = "Minimum cost to cut a stick"
template = '''
def min_cost(n, cuts):
    cuts = sorted(cuts + [0, n])  # the ends are fixed cut points
    m = len(cuts)
    dp = [[0] * m for _ in range(m)]  # between cuts[i] and cuts[j]
    for length in range(2, m):
        for i in range(m - length):
            j = i + length
            # the first cut at k, then two independent parts
            split = min(dp[i][k] + dp[k][j] for k in range(i + 1, j))
            dp[i][j] = split + cuts[j] - cuts[i]
    return dp[0][m - 1]
'''
pitfalls = [
    "Choose the first cut of the segment: it splits the stick into two parts that never interact again.",
    "The cost of a cut is the length of the segment being cut.",
    "Segments of one gap (j = i + 1) cost nothing.",
]
examples = ["minimum-cost-to-cut-a-stick", "minimum-score-triangulation-of-polygon", "burst-balloons", "strange-printer"]

[[extra.variant]]
name = "Minimum score triangulation of polygon"
note = "The last triangle on the edge (i, j) has a third vertex k; the two remaining polygons are independent."
template = '''
def min_score_triangulation(values):
    n = len(values)
    dp = [[0] * n for _ in range(n)]
    for length in range(2, n):
        for i in range(n - length):
            j = i + length
            dp[i][j] = min(
                dp[i][k] + dp[k][j] + values[i] * values[k] * values[j]
                for k in range(i + 1, j))
    return dp[0][n - 1]
'''

[[extra.variant]]
name = "Strange printer"
note = "The last character of the segment: if it matches an earlier one, they can be printed together."
template = '''
def strange_printer(s):
    n = len(s)
    dp = [[0] * n for _ in range(n)]
    for i in range(n - 1, -1, -1):
        dp[i][i] = 1
        for j in range(i + 1, n):
            dp[i][j] = dp[i][j - 1] + 1  # print s[j] on its own
            for k in range(i, j):
                if s[k] == s[j]:  # share the stroke with s[k]
                    inner = dp[k + 1][j - 1] if k + 1 <= j - 1 else 0
                    dp[i][j] = min(dp[i][j], dp[i][k] + inner)
    return dp[0][n - 1] if n else 0
'''

[[extra]]
id = "2-D Dynamic Programming:two-states"
name = "Two-state scans: a mode that can switch"
group = "State machine DP"
signals = [
    "make a binary string monotone, pick an alternating subsequence of the best sum",
    "keep two running values, one per mode, updated from the previous step",
    "a value for 'so far in mode A' and 'so far in mode B', with a transition between them",
]
template_name = "Flip string to monotone increasing"
template = '''
def min_flips_mono_incr(s):
    ones = flips = 0  # ones seen so far / the best flips so far
    for ch in s:
        if ch == "1":
            ones += 1  # a 1 is fine before any 0 that is flipped
        else:
            # make this 0 a 1 (one more flip) or flip every earlier 1 to 0
            flips = min(flips + 1, ones)
    return flips
'''
pitfalls = [
    "A monotone string is zeros then ones: for each 0, either flip it to 1 or flip all the ones before it.",
    "flips is the cheapest cost for the prefix; it never exceeds the number of ones so far.",
    "The same idea with two running values handles alternating sums.",
]
examples = ["flip-string-to-monotone-increasing", "maximum-alternating-subsequence-sum"]

[[extra.variant]]
name = "Maximum alternating subsequence sum"
note = "Two states: the best sum when the next element would be added, and when it would be subtracted."
template = '''
def max_alternating_sum(nums):
    plus, minus = 0, 0  # best ending with + / ending with -
    for x in nums:
        plus, minus = max(plus, minus + x), max(minus, plus - x)
    return plus
'''

[[extra]]
id = "2-D Dynamic Programming:arithmetic-dict"
name = "Arithmetic subsequences: a dictionary per index"
group = "Constrained subsequences"
signals = [
    "count subsequences (not subarrays) that form arithmetic progressions of length at least three",
    "for each index keep a dictionary: difference -> number of progressions ending here",
    "extend every earlier index j with the difference nums[i] - nums[j]",
]
template_name = "Arithmetic slices II (subsequences)"
template = '''
from collections import defaultdict


def number_of_arithmetic_slices(nums):
    n, total = len(nums), 0
    # ways[i][d]: progressions that end at i with difference d
    ways = [defaultdict(int) for _ in range(n)]
    for i in range(n):
        for j in range(i):
            d = nums[i] - nums[j]
            extend = ways[j][d]  # progressions at j with difference d
            ways[i][d] += extend + 1  # extend them, plus the pair (j, i)
            total += extend  # each extension has length >= 3
    return total
'''
pitfalls = [
    "A pair (j, i) is a progression of length 2: it is stored but not counted.",
    "Every progression at j with the same difference becomes one of length at least 3 at i.",
    "Use dictionaries because the differences can be huge.",
]
examples = ["arithmetic-slices-ii-subsequence", "arithmetic-slices", "length-of-longest-fibonacci-subsequence"]

[[extra.variant]]
name = "Arithmetic slices (subarrays)"
note = "A run of equal differences of length k adds k to the count at every step."
template = '''
def number_of_arithmetic_slices_subarrays(nums):
    total = run = 0  # run: slices ending at the previous index
    for i in range(2, len(nums)):
        if nums[i] - nums[i - 1] == nums[i - 1] - nums[i - 2]:
            run += 1  # one more slice ends here than at the last index
            total += run
        else:
            run = 0
    return total
'''

[[extra.variant]]
name = "Longest arithmetic subsequence"
note = "For each pair (j, i) the longest progression ending at i with difference nums[i] - nums[j]: a dictionary per index."
template = '''
def longest_arith_seq_length(nums):
    best = 2  # any two numbers form a progression
    length = [{} for _ in nums]  # length[i][d]: ending at i, step d
    for i in range(len(nums)):
        for j in range(i):
            d = nums[i] - nums[j]
            length[i][d] = length[j].get(d, 1) + 1  # extend or start
            best = max(best, length[i][d])
    return best
'''

[[extra]]
id = "2-D Dynamic Programming:k-groups"
name = "Split into k groups: dp[i][k]"
group = "Constrained subsequences"
signals = [
    "schedule jobs over d days, split an array into k parts, compress a string by deleting k characters",
    "dp[i][k] = the best for the first i items split into k groups",
    "try every start of the last group: dp[i][k] = best over j of dp[j][k - 1] + cost(j..i)",
]
template_name = "Minimum difficulty of a job schedule"
template = '''
def min_difficulty(job_difficulty, d):
    n = len(job_difficulty)
    if n < d:
        return -1  # every day needs at least one job
    inf = float("inf")
    dp = [[inf] * (n + 1) for _ in range(d + 1)]  # dp[day][jobs done]
    dp[0][0] = 0
    for day in range(1, d + 1):
        for i in range(day, n + 1):
            hardest = 0
            for j in range(i, day - 1, -1):  # the last day does jobs j..i
                hardest = max(hardest, job_difficulty[j - 1])
                dp[day][i] = min(dp[day][i], dp[day - 1][j - 1] + hardest)
    return dp[d][n]
'''
pitfalls = [
    "A day's difficulty is its hardest job: update it as you extend the day backwards.",
    "Every day must do at least one job, so the loops start at day for i.",
    "Return -1 when there are fewer jobs than days.",
]
examples = ["minimum-difficulty-of-a-job-schedule", "painting-the-walls", "string-compression-ii"]

[[extra.variant]]
name = "Painting the walls"
note = "A paid painter takes time[i] and covers time[i] + 1 walls in total; the free painter works while the paid one is busy."
template = '''
def paint_walls(cost, time):
    n = len(cost)
    inf = float("inf")
    dp = [0] + [inf] * n  # dp[w]: the cheapest cost to cover w walls
    for c, t in zip(cost, time):
        for walls in range(n, 0, -1):
            # the paid painter takes this wall; t more come free
            dp[walls] = min(dp[walls], dp[max(0, walls - 1 - t)] + c)
    return dp[n]
'''

[[extra]]
id = "2-D Dynamic Programming:row-masks"
name = "Row masks: seat people row by row"
group = "Broken profile and tiling DP"
signals = [
    "place people, tiles or colours in a grid with few columns (about 8), where each row only depends on the row before",
    "the state of a row is a bitmask of the occupied cells: at most 2^cols states",
    "precompute which masks are valid within a row, then which pairs of masks fit together across rows",
]
template_name = "Maximum students taking an exam"
template = '''
def max_students(seats):
    rows, cols = len(seats), len(seats[0])
    broken = [sum(1 << c for c in range(cols) if seats[r][c] == "#")
              for r in range(rows)]  # the unusable seats of each row
    # dp[mask]: the most students so far, with this mask in the last row
    dp = {0: 0}
    for r in range(rows):
        nxt = {}
        for mask in range(1 << cols):
            if mask & broken[r] or mask & (mask << 1):
                continue  # a broken seat, or two neighbours in one row
            best = -1
            for prev, total in dp.items():
                # nobody sits on a diagonal in front of this student
                if mask & (prev << 1) or mask & (prev >> 1):
                    continue
                best = max(best, total)
            if best >= 0:
                nxt[mask] = best + bin(mask).count("1")
        dp = nxt
    return max(dp.values())
'''
pitfalls = [
    "mask & (mask << 1) catches two students next to each other in the same row.",
    "mask & (prev << 1) and mask & (prev >> 1) catch a student looking at the upper left or upper right.",
    "Only the previous row matters: the state is one mask, and there are at most 2^cols of them.",
]
examples = ["maximum-students-taking-exam", "painting-a-grid-with-three-different-colors", "domino-and-tromino-tiling"]

