name = "Counts in a small value range, or in buckets"
group = "Ordered-set / heap windows"
signals = [
    "the x-th smallest (a beauty, a median) in every window of size k when values are in a small range",
    "a count array indexed by value replaces a heap: add and remove in O(1), query by scanning the range",
    "a window of values within a distance t: put values in buckets of width t + 1",
]
template_name = "Sliding subarray beauty"
template = '''
def get_subarray_beauty(nums, k, x):
    count = [0] * 101  # values -50 .. 50, shifted by 50
    out = []
    for i, v in enumerate(nums):
        count[v + 50] += 1
        if i >= k:
            count[nums[i - k] + 50] -= 1
        if i >= k - 1:
            seen = 0
            for value in range(-50, 0):  # negatives only
                seen += count[value + 50]
                if seen >= x:
                    out.append(value)  # the x-th smallest negative
                    break
            else:
                out.append(0)
    return out
'''
pitfalls = [
    "Shift negative values by an offset to use them as indexes.",
    "Remove the element that leaves before querying.",
    "A scan of the value range is O(range) per window: fine for 101 values, not for 10^9 (use a tree).",
]
examples = ["sliding-subarray-beauty", "contains-duplicate-iii", "sliding-window-median"]

[[extra.variant]]
name = "Nearby almost duplicate (buckets)"
note = "Values within t land in the same or adjacent bucket; keep at most k recent items."
template = '''
def contains_nearby_almost_duplicate(nums, index_diff, value_diff):
    if value_diff < 0:
        return False
    width = value_diff + 1
    buckets = {}
    for i, v in enumerate(nums):
        b = v // width
        if b in buckets:
            return True  # the same bucket: within value_diff
        for nb in (b - 1, b + 1):
            if nb in buckets and abs(buckets[nb] - v) <= value_diff:
                return True
        buckets[b] = v
        if i >= index_diff:
            del buckets[nums[i - index_diff] // width]  # too old
    return False
'''

[[extra]]
id = "Sliding Window:count-from-right"
name = "Count windows by the earliest valid start"
group = "Counting windows (atMost(k) - atMost(k-1))"
signals = [
    "count subarrays where a condition holds once a count reaches k (the maximum appears k times, a bound is met)",
    "once a window is valid, every window that starts earlier is valid too",
    "for each right end add the number of valid starts, found with a moving left pointer",
]
template_name = "Maximum appears at least k times"
template = '''
def count_subarrays(nums, k):
    top = max(nums)
    left = count = total = 0  # count: copies of top in the window
    for x in nums:
        count += x == top
        while count >= k:  # the window [left, right] is valid
            count -= nums[left] == top
            left += 1
        total += left  # every start before left gives a valid subarray
    return total
'''
pitfalls = [
    "Shrink while the window is still valid: left stops at the first start that is invalid.",
    "Every start in [0, left) forms a valid subarray with this right end: add left.",
    "Counting with atMost(k) - atMost(k - 1) is the other way when the condition is 'exactly k'.",
]
examples = ["count-subarrays-where-max-element-appears-at-least-k-times", "count-subarrays-with-fixed-bounds", "count-complete-subarrays-in-an-array", "number-of-substrings-containing-all-three-characters"]

[[extra.variant]]
name = "Fixed bounds (last seen positions)"
note = "Remember the last index of min-k, of max-k and of a value outside the range; valid starts are up to the older of the first two."
template = '''
def count_subarrays_bounds(nums, min_k, max_k):
    total, last_min, last_max, bad = 0, -1, -1, -1
    for i, x in enumerate(nums):
        if x < min_k or x > max_k:
            bad = i  # no window may cross this element
        if x == min_k:
            last_min = i
        if x == max_k:
            last_max = i
        total += max(0, min(last_min, last_max) - bad)
    return total
'''

[[extra.variant]]
name = "Substrings with all of a, b, c"
note = "Once a window holds all three letters, every start up to the last-seen of the rarest works."
template = '''
def number_of_substrings(s):
    last = {"a": -1, "b": -1, "c": -1}
    total = 0
    for i, ch in enumerate(s):
        last[ch] = i
        total += min(last.values()) + 1  # starts 0 .. oldest last-seen
    return total
'''

[[extra]]
id = "Sliding Window:deque-dp"
name = "A deque inside a DP"
group = "Monotonic-queue windows"
signals = [
    "dp[i] depends on the best of dp[j] for j in a sliding range, such as the last k positions",
    "a monotonic deque of indexes keeps that best in O(1) per step",
    "partitions whose max - min is at most k: the last cut can be anywhere in a range",
]
template_name = "Partitions with max - min at most k"
template = '''
from collections import deque


def count_partitions(nums, k):
    mod, n = 10**9 + 7, len(nums)
    dp = [0] * (n + 1)  # dp[i]: ways to split the first i numbers
    pre = [0] * (n + 2)  # pre[i + 1] = dp[0] + ... + dp[i]
    dp[0], pre[1] = 1, 1
    big, small, left = deque(), deque(), 0
    for i, x in enumerate(nums):
        while big and nums[big[-1]] <= x:
            big.pop()
        big.append(i)
        while small and nums[small[-1]] >= x:
            small.pop()
        small.append(i)
        while nums[big[0]] - nums[small[0]] > k:
            left += 1  # the last piece must start at or after left
            if big[0] < left:
                big.popleft()
            if small[0] < left:
                small.popleft()
        dp[i + 1] = (pre[i + 1] - pre[left]) % mod  # starts left .. i
        pre[i + 2] = (pre[i + 1] + dp[i + 1]) % mod
    return dp[n]
'''
pitfalls = [
    "Keep two deques (a max and a min) over the same window of the last piece's candidates.",
    "A start j is allowed when the window nums[j..i] has max - min at most k: valid starts form a range [left, i].",
    "A prefix sum of dp turns the sum over a range of starts into one subtraction.",
]
examples = ["count-partitions-with-max-min-difference-at-most-k", "continuous-subarrays", "jump-game-vi"]

[[extra.variant]]
name = "Continuous subarrays"
note = "Count windows whose largest and smallest differ by at most 2, with two deques."
template = '''
from collections import deque


def continuous_subarrays(nums):
    big, small, left, total = deque(), deque(), 0, 0
    for right, x in enumerate(nums):
        while big and nums[big[-1]] <= x:
            big.pop()
        big.append(right)
        while small and nums[small[-1]] >= x:
            small.pop()
        small.append(right)
        while nums[big[0]] - nums[small[0]] > 2:
            left += 1
            if big[0] < left:
                big.popleft()
            if small[0] < left:
                small.popleft()
        total += right - left + 1  # windows ending at right
    return total
'''

[[extra]]
id = "Sliding Window:rows-pairs"
name = "Collapse pairs of rows to one dimension"
group = "2-D windows"
signals = [
    "a rectangle in a matrix with a given sum (or a sum not above k)",
    "fix a top row and a bottom row, add the rows column by column, and solve a 1-D problem",
    "O(rows^2 * cols) with a prefix-sum hash map per row pair",
]
template_name = "Submatrices summing to target"
template = '''
from collections import defaultdict


def num_submatrix_sum_target(matrix, target):
    rows, cols, total = len(matrix), len(matrix[0]), 0
    for top in range(rows):
        col_sum = [0] * cols  # the rows top..bottom added up
        for bottom in range(top, rows):
            for c in range(cols):
                col_sum[c] += matrix[bottom][c]
            seen = defaultdict(int)  # prefix sums of this 1-D array
            seen[0] = 1
            prefix = 0
            for v in col_sum:
                prefix += v
                total += seen[prefix - target]
                seen[prefix] += 1
    return total
'''
pitfalls = [
    "Add the row to a column-sum array instead of recomputing: each bottom row costs O(cols).",
    "The 1-D step is the prefix-sum hash map: it works with negative numbers too.",
    "For the largest sum at most k use a sorted list of prefixes and bisect instead of a map.",
]
examples = ["number-of-submatrices-that-sum-to-target", "max-sum-of-rectangle-no-larger-than-k"]

[[extra]]
id = "Sliding Window:min-changes"
name = "Fixed window: the fewest changes"
group = "Fixed-size window"
signals = [
    "the fewest recolours, flips or swaps so that some window of length k is perfect",
    "the cost of a window is how many items in it are wrong, which the slide updates in O(1)",
    "take the minimum cost over all windows",
]
template_name = "Recolours to get k black blocks"
template = '''
def minimum_recolors(blocks, k):
    whites = blocks[:k].count("W")  # recolours needed in the first window
    best = whites
    for i in range(k, len(blocks)):
        whites += blocks[i] == "W"  # enters
        whites -= blocks[i - k] == "W"  # leaves
        best = min(best, whites)
    return best
'''
pitfalls = [
    "Build the first window separately, then slide with one add and one remove.",
    "Compare booleans as 0/1 to update the count without if statements.",
    "For a circular array double it first; for swaps count the ones in the window.",
]
examples = ["minimum-recolors-to-get-k-consecutive-black-blocks", "minimum-swaps-to-group-all-1s-together-ii", "maximum-average-subarray-i", "k-radius-subarray-averages"]

[[extra.variant]]
name = "Group all 1s together (circular)"
note = "The best window of length (number of ones) is the one with the most ones; swaps = zeros in it."
template = '''
def min_swaps(nums):
    ones, n = sum(nums), len(nums)
    if ones in (0, n):
        return 0
    doubled = nums + nums
    window = sum(doubled[:ones])
    best = window
    for i in range(ones, n + ones):
        window += doubled[i] - doubled[i - ones]
        best = max(best, window)
    return ones - best
'''

[[extra.variant]]
name = "K-radius averages"
note = "A window of 2k + 1 with a running sum; positions without a full window stay -1."
template = '''
def get_averages(nums, k):
    n, size = len(nums), 2 * k + 1
    out = [-1] * n
    if size > n:
        return out
    running = sum(nums[:size])
    out[k] = running // size
    for i in range(k + 1, n - k):
        running += nums[i + k] - nums[i - k - 1]
        out[i] = running // size
    return out
'''

