pattern = "Sliding Window"
intro = "A window is a stretch of the array between two indexes. Slide it by moving the right end forward, and move the left end only to repair the window when it breaks a rule. Each index enters and leaves once, so the whole scan is O(n). Decide what the window must satisfy and what you keep as its summary (a sum, a count map, a set)."
groups = ["Fixed-size window", "Variable window, longest valid", "Variable window, shortest valid", "Counting windows (atMost(k) - atMost(k-1))", "Frequency (need / have) windows", "Windows over two sequences", "Circular arrays", "Monotonic-queue windows", "Ordered-set / heap windows", "Negative numbers (when windows fail: prefix sums)", "Binary search on window size", "Character-budget windows", "2-D windows", "Sorted-input windows (sort first, then slide)", "Window as a helper for DP and greedy", "Core implementation patterns"]










[[technique]]
id = "Sliding Window:running-best"
signals = [
    "a single pass tracking the best seen so far (the lowest price, the highest score)",
    "choose a start and a later end to maximise a difference",
    "the window is simply 'everything so far'",
]
template = '''
def max_profit(prices):
    lowest, best = float("inf"), 0
    for price in prices:
        lowest = min(lowest, price)  # the best day to have bought so far
        best = max(best, price - lowest)
    return best
'''
pitfalls = [
    "Update the lowest price first, so selling on the day you buy gives 0, not a negative.",
    "Start best at 0: not trading is allowed.",
    "No nested loop: the best buy day for a sell day is the lowest price before it.",
]

[[technique]]
id = "Sliding Window:fixed-sum"
walk = "window-fixed"
group = "Fixed-size window"
signals = [
    "every window of exactly k items",
    "a sum or average over each block of k",
    "add the item entering and subtract the one leaving",
]
template = '''
def count_windows_at_least(nums, k, threshold):
    total = sum(nums[:k])
    count = 1 if total >= k * threshold else 0
    for i in range(k, len(nums)):
        total += nums[i] - nums[i - k]  # slide by one
        if total >= k * threshold:
            count += 1
    return count
'''
pitfalls = [
    "Compare sums (total >= k * threshold) instead of averages to avoid floating point.",
    "Initialise the first window separately, then slide.",
    "If k is larger than the array there are no windows.",
]

[[technique]]
id = "Sliding Window:window-max"
group = "Variable window, longest valid"
signals = [
    "the LONGEST stretch with some property (no repeats, at most k replacements)",
    "grow the window to the right, shrink from the left only when it becomes invalid",
    "the answer is the largest window size seen",
]
template = '''
def longest_unique(s):
    last = {}  # character -> its most recent index
    left = best = 0
    for right, ch in enumerate(s):
        if ch in last and last[ch] >= left:
            left = last[ch] + 1  # jump past the repeat
        last[ch] = right
        best = max(best, right - left + 1)
    return best
'''
pitfalls = [
    "Only move left forward (max with the old value). A repeat before the window start doesn't count.",
    "Record the window size after the window is valid again.",
    "Moving left one step at a time with a set works too, and is easier to get right first.",
]

[[technique]]
id = "Sliding Window:fixed-window"
walk = "window-fixed"
group = "Fixed-size window"
signals = [
    "find a window of a fixed length that has the same letters as a pattern",
    "compare character counts of each window with a target",
    "the window moves one step: one character in, one out",
]
template = '''
from collections import Counter


def check_inclusion(pattern, text):
    k = len(pattern)
    need = Counter(pattern)
    window = Counter(text[:k])
    if window == need:
        return True
    for i in range(k, len(text)):
        window[text[i]] += 1
        window[text[i - k]] -= 1
        if window[text[i - k]] == 0:
            del window[text[i - k]]  # so equality with need works
        if window == need:
            return True
    return False
'''
pitfalls = [
    "Delete counts that reach zero. Counter equality treats a key with 0 as different from a missing key.",
    "Comparing two 26-slot arrays is constant time. Comparing dictionaries is bounded by the alphabet too.",
    "Handle a pattern longer than the text before sliding.",
]

[[technique]]
id = "Sliding Window:at-most-k"
walk = "window-variable"
group = "Fixed-size window"
signals = [
    "the longest window with at most k distinct values (or kinds)",
    "keep a count map for the window, and shrink while it has too many kinds",
    "fruit baskets, at most two distinct letters, at most k colours",
]
template = '''
def longest_at_most_k_distinct(items, k):
    counts = {}
    left = best = 0
    for right, x in enumerate(items):
        counts[x] = counts.get(x, 0) + 1
        while len(counts) > k:  # too many kinds: shrink from the left
            counts[items[left]] -= 1
            if counts[items[left]] == 0:
                del counts[items[left]]
            left += 1
        best = max(best, right - left + 1)
    return best
'''
pitfalls = [
    "Remove a kind from the map when its count hits zero, or len(counts) never shrinks.",
    "A while loop is needed to shrink. One removal can leave it still too wide.",
    "k = 0 returns 0 because no window is valid.",
]

[[technique]]
id = "Sliding Window:window-sort"
group = "Binary search on window size"
signals = [
    "choose k elements of a SORTED array nearest to a value",
    "the answer is one contiguous block, so only its start is unknown",
    "binary search on the start, or shrink from both ends",
]
template = '''
def closest_k(arr, k, x):
    lo, hi = 0, len(arr) - k  # the window starts somewhere in [0, n - k]
    while lo < hi:
        mid = (lo + hi) // 2
        if x - arr[mid] > arr[mid + k] - x:  # the right edge is closer
            lo = mid + 1
        else:
            hi = mid
    return arr[lo:lo + k]
'''
pitfalls = [
    "Search over the window's start, not over values.",
    "On a tie the smaller element wins, which the strict > already gives.",
    "Shrinking from both ends (drop the farther one) is O(n) and simpler to explain.",
]

[[technique]]
id = "Sliding Window:count-windows"
group = "Negative numbers (when windows fail: prefix sums)"
signals = [
    "count the subarrays with EXACTLY k of something",
    "counting 'at most k' with a window is easy, 'exactly k' is not",
    "exactly k equals (at most k) minus (at most k - 1)",
]
template = '''
def subarrays_with_k_distinct(nums, k):
    def at_most(limit):
        counts, left, total = {}, 0, 0
        for right, x in enumerate(nums):
            counts[x] = counts.get(x, 0) + 1
            while len(counts) > limit:
                counts[nums[left]] -= 1
                if counts[nums[left]] == 0:
                    del counts[nums[left]]
                left += 1
            total += right - left + 1  # every window ending at right
        return total

    return at_most(k) - at_most(k - 1)
'''
pitfalls = [
    "A window [left, right] contributes right - left + 1 subarrays: one for each start that still works.",
    "Run the same counting function twice with different limits.",
    "at_most(0) is 0, so k = 1 works without a special case.",
]

[[technique]]
id = "Sliding Window:window-min"
group = "Variable window, shortest valid"
signals = [
    "the SHORTEST window that contains everything required",
    "grow right until the window is valid, then shrink left while it stays valid",
    "track how many required items are still missing",
]
template = '''
from collections import Counter


def min_window(s, t):
    need = Counter(t)
    missing = len(t)  # characters of t not yet covered
    best, left = (0, 0), 0
    for right, ch in enumerate(s, 1):
        if need[ch] > 0:
            missing -= 1
        need[ch] -= 1
        if missing == 0:  # valid: shrink while it stays valid
            while need[s[left]] < 0:
                need[s[left]] += 1
                left += 1
            if best == (0, 0) or right - left < best[1] - best[0]:
                best = (left, right)
            need[s[left]] += 1  # give up s[left] and keep searching
            missing += 1
            left += 1
    return s[best[0]:best[1]]
'''
pitfalls = [
    "Keep a single 'missing' counter, so checking validity is O(1) and not a comparison of two maps.",
    "A count below zero in need means the window holds more than required of that letter, so it can be dropped.",
    "Return the empty string when no window works.",
]

[[technique]]
id = "Sliding Window:mono-deque"
group = "Monotonic-queue windows"
signals = [
    "the maximum (or minimum) of every window of size k",
    "a heap works but is O(n log n); a deque does it in O(n)",
    "an item that is smaller than a later item can never be the maximum again",
]
template = '''
from collections import deque


def max_sliding_window(nums, k):
    dq = deque()  # indexes, with their values in decreasing order
    out = []
    for i, x in enumerate(nums):
        while dq and nums[dq[-1]] <= x:
            dq.pop()  # dominated by x: can never win again
        dq.append(i)
        if dq[0] <= i - k:
            dq.popleft()  # fell out of the window
        if i >= k - 1:
            out.append(nums[dq[0]])
    return out
'''
pitfalls = [
    "Store indexes, not values, so you can tell when the front has left the window.",
    "The front of the deque is the maximum of the current window.",
    "Each index is pushed and popped at most once, so the total is O(n).",
]

[[extra]]
id = "Sliding Window:both-ends"
name = "Take from both ends: slide the middle"
group = "Variable window, shortest valid"
signals = [
    "remove items only from the left and the right end, and you want the fewest removals",
    "what stays is a contiguous middle: the longest middle window with a fixed total (or content) is the answer",
    "the fewest taken from the ends = n minus the longest middle that is allowed",
]
template_name = "Reduce x to zero"
template = '''
def min_operations(nums, x):
    target = sum(nums) - x  # the sum that must stay in the middle
    if target < 0:
        return -1
    best, left, running = -1, 0, 0
    for right, v in enumerate(nums):
        running += v
        while running > target:  # all numbers are positive: shrink
            running -= nums[left]
            left += 1
        if running == target:
            best = max(best, right - left + 1)
    return len(nums) - best if best != -1 else -1
'''
pitfalls = [
    "Think of the middle that stays, not the ends that go: a plain window then solves it.",
    "No valid middle (best stays -1) means the target cannot be reached.",
    "An empty middle is allowed when x equals the total: target 0 gives a window of length 0.",
]
examples = ["minimum-operations-to-reduce-x-to-zero", "take-k-of-each-character-from-left-and-right", "maximum-points-you-can-obtain-from-cards"]

[[extra.variant]]
name = "Take k of each character"
note = "Keep the longest middle where every character still has at most (total - k) copies."
template = '''
from collections import Counter


def take_characters(s, k):
    count = Counter(s)
    if any(count[c] < k for c in "abc"):
        return -1
    left, best = 0, 0
    for right, ch in enumerate(s):
        count[ch] -= 1  # the middle window keeps this one
        while count[ch] < k:  # too many kept: not enough left for the ends
            count[s[left]] += 1
            left += 1
        best = max(best, right - left + 1)
    return len(s) - best
'''

[[extra]]
id = "Sliding Window:circular"
name = "Circular windows: double the array"
group = "Circular arrays"
signals = [
    "a window may wrap around the end of the array",
    "concatenate the array with itself (or use index % n) and slide on the doubled array",
    "only windows that start in the first copy are real",
]
template_name = "Defuse the bomb"
template = '''
def decrypt(code, k):
    n = len(code)
    if k == 0:
        return [0] * n
    doubled = code + code
    # the window of the next k items, or of the previous |k| items
    lo, hi = (1, k) if k > 0 else (n + k, n - 1)
    running = sum(doubled[lo:hi + 1])
    out = []
    for i in range(n):
        out.append(running)
        running += doubled[hi + 1] - doubled[lo]  # slide by one
        lo, hi = lo + 1, hi + 1
    return out
'''
pitfalls = [
    "For a negative k the window ends just before position i: shift it by n so the indexes stay positive.",
    "Slide with one addition and one subtraction, never re-summing.",
    "The doubled array must be long enough: n + k elements are read.",
]
examples = ["defuse-the-bomb", "alternating-groups-ii", "minimum-size-subarray-in-infinite-array", "minimum-number-of-flips-to-make-the-binary-string-alternating"]

[[extra.variant]]
name = "Alternating groups II"
note = "Count windows of k tiles that alternate, on the doubled array."
template = '''
def number_of_alternating_groups(colors, k):
    n = len(colors)
    c = colors + colors[:k - 1]
    count = run = 0
    for i in range(1, len(c)):
        run = run + 1 if c[i] != c[i - 1] else 0  # alternating run
        if i >= k - 1 and run >= k - 1 and i - (k - 1) < n:
            count += 1
    return count
'''

[[extra.variant]]
name = "Shortest subarray in an infinite array"
note = "Whole copies take total sums; the rest is a window in the doubled array."
template = '''
def min_size_subarray(nums, target):
    total, n = sum(nums), len(nums)
    copies, need = divmod(target, total)  # whole copies of the array
    if need == 0:
        return copies * n
    doubled = nums + nums
    best, left, running = float("inf"), 0, 0
    for right, v in enumerate(doubled):
        running += v
        while running > need:
            running -= doubled[left]
            left += 1
        if running == need:
            best = min(best, right - left + 1)
    return copies * n + best if best != float("inf") else -1
'''

[[extra]]
id = "Sliding Window:cost-budget"
name = "A window whose cost stays within a budget"
group = "Character-budget windows"
signals = [
    "the longest window that can be made uniform with at most k changes, or whose total cost is at most a limit",
    "cost of a window = (what it should be) - (what it is), computed from the window's size and sum",
    "if the window gets too expensive, move the left end; never let it shrink below its best size",
]
template_name = "Frequency of the most frequent element"
template = '''
def max_frequency(nums, k):
    nums.sort()
    left, running, best = 0, 0, 1
    for right, x in enumerate(nums):
        running += x
        # raising every element of the window to x costs this much
        while x * (right - left + 1) - running > k:
            running -= nums[left]
            left += 1
        best = max(best, right - left + 1)
    return best
'''
pitfalls = [
    "Sort first: the best target for a window is its largest element, and sorting makes windows contiguous.",
    "The cost is x * size - sum: no inner loop, just the running sum.",
    "Shrink with while: one step is not always enough after the right end grows.",
]
examples = ["frequency-of-the-most-frequent-element", "get-equal-substrings-within-budget", "maximize-the-confusion-of-an-exam", "max-consecutive-ones-iii", "longest-repeating-character-replacement"]

[[extra.variant]]
name = "Equal substrings within a budget"
note = "The cost of position i is |s[i] - t[i]|: a window of costs with a sum limit."
template = '''
def equal_substring(s, t, max_cost):
    left, cost, best = 0, 0, 0
    for right in range(len(s)):
        cost += abs(ord(s[right]) - ord(t[right]))
        while cost > max_cost:
            cost -= abs(ord(s[left]) - ord(t[left]))
            left += 1
        best = max(best, right - left + 1)
    return best
'''

[[extra.variant]]
name = "Confusion of an exam"
note = "Longest window with at most k answers of the other kind, tried for both letters."
template = '''
def max_consecutive_answers(answer_key, k):
    def longest(keep):
        left = flips = best = 0
        for right, ch in enumerate(answer_key):
            flips += ch != keep  # an answer to change
            while flips > k:
                flips -= answer_key[left] != keep
                left += 1
            best = max(best, right - left + 1)
        return best

    return max(longest("T"), longest("F"))
'''

[[extra.variant]]
name = "Make the array continuous"
note = "After sorting the distinct values, the answer is n minus the most values that fit in a range of n."
template = '''
def min_operations_continuous(nums):
    n = len(nums)
    vals = sorted(set(nums))
    best, left = 0, 0
    for right, v in enumerate(vals):
        while v - vals[left] > n - 1:  # the range must be at most n wide
            left += 1
        best = max(best, right - left + 1)
    return n - best
'''

[[extra]]
id = "Sliding Window:prefix-hash"
name = "When windows fail: prefix sums and a hash map"
group = "Negative numbers (when windows fail: prefix sums)"
signals = [
    "count subarrays with a given sum when numbers can be negative (the sum is not monotone)",
    "a subarray sum is a difference of two prefix sums: look up how many earlier prefixes equal prefix - target",
    "the same trick counts subarrays with a given count of odd numbers, or sums divisible by k",
]
template_name = "Subarray sum equals k"
template = '''
from collections import defaultdict


def subarray_sum(nums, k):
    seen = defaultdict(int)
    seen[0] = 1  # the empty prefix
    prefix = count = 0
    for x in nums:
        prefix += x
        count += seen[prefix - k]  # earlier prefixes that make a sum of k
        seen[prefix] += 1
    return count
'''
pitfalls = [
    "Seed the map with {0: 1}: it counts the subarrays that start at index 0.",
    "Look up before inserting the current prefix: a subarray cannot be empty.",
    "Shrinking a window needs non-negative numbers: that is when this version is required.",
]
examples = ["subarray-sum-equals-k", "binary-subarrays-with-sum", "count-number-of-nice-subarrays", "subarray-sums-divisible-by-k", "continuous-subarray-sum"]

[[extra.variant]]
name = "Sums divisible by k"
note = "Two equal remainders of prefix sums mean the subarray between them is divisible."
template = '''
from collections import defaultdict


def subarrays_div_by_k(nums, k):
    seen = defaultdict(int)
    seen[0] = 1
    prefix = count = 0
    for x in nums:
        prefix = (prefix + x) % k  # Python keeps it non-negative
        count += seen[prefix]
        seen[prefix] += 1
    return count
'''

[[extra.variant]]
name = "Nice subarrays (k odd numbers)"
note = "The prefix is the number of odd values so far."
template = '''
from collections import defaultdict


def number_of_subarrays(nums, k):
    seen = defaultdict(int)
    seen[0] = 1
    odd = count = 0
    for x in nums:
        odd += x & 1
        count += seen[odd - k]
        seen[odd] += 1
    return count
'''

