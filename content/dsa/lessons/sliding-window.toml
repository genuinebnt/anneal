id = "Sliding Window:anagram"
name = "Anagram windows: a fixed window against a count"
group = "Frequency (need / have) windows"
signals = [
    "every start index where a window is a permutation of a pattern",
    "a window of the pattern's length, with letter counts compared as it slides",
    "a matched-letters counter makes each step O(1) instead of comparing 26 counts",
]
template_name = "Find all anagrams"
template = '''
from collections import Counter


def find_anagrams(s, p):
    need, window, out = Counter(p), Counter(), []
    k = len(p)
    for i, ch in enumerate(s):
        window[ch] += 1
        if i >= k:
            old = s[i - k]
            window[old] -= 1
            if window[old] == 0:
                del window[old]  # keep the counters comparable
        if window == need:
            out.append(i - k + 1)
    return out
'''
pitfalls = [
    "Delete a count that reaches zero, or two Counters with zero entries compare unequal.",
    "The window has exactly len(p) letters: remove the letter that leaves before comparing.",
    "Comparing Counters costs O(26); a counter of satisfied letters makes it O(1).",
]
examples = ["find-all-anagrams-in-a-string", "permutation-in-string", "count-substrings-that-can-be-rearranged-to-contain-a-string-i", "substring-with-concatenation-of-all-words"]

[[extra.variant]]
name = "Concatenation of all words"
note = "Slide by whole words from every offset; the window holds as many words as the list."
template = '''
from collections import Counter


def find_substring(s, words):
    w, m = len(words[0]), len(words)
    need, out = Counter(words), []
    for offset in range(w):  # words may start at any of w alignments
        left, seen = offset, Counter()
        for right in range(offset, len(s) - w + 1, w):
            word = s[right:right + w]
            if word not in need:
                seen.clear()
                left = right + w
                continue
            seen[word] += 1
            while seen[word] > need[word]:  # one copy too many
                seen[s[left:left + w]] -= 1
                left += w
            if (right - left) // w + 1 == m:
                out.append(left)
    return sorted(out)
'''

[[extra]]
id = "Sliding Window:rolling-hash"
name = "Rolling hash of a window"
group = "Windows over two sequences"
signals = [
    "find repeated or matching substrings of a fixed length without comparing characters each time",
    "the hash of the next window comes from the previous one in O(1): drop the first letter, add the new one",
    "a short alphabet (DNA) fits in a bit mask instead of a modular hash",
]
template_name = "Repeated DNA sequences"
template = '''
def find_repeated_dna(s):
    code = {"A": 0, "C": 1, "G": 2, "T": 3}
    mask = (1 << 20) - 1  # ten letters of two bits each
    seen, repeated, h = set(), set(), 0
    for i, ch in enumerate(s):
        h = ((h << 2) | code[ch]) & mask  # slide: shift in, drop the oldest
        if i >= 9:
            if h in seen:
                repeated.add(s[i - 9:i + 1])
            seen.add(h)
    return list(repeated)
'''
pitfalls = [
    "Start checking only once the window has 10 letters (i >= 9).",
    "Mask the hash to the window width: the shift would keep old letters forever.",
    "For general text use a polynomial hash modulo a large prime, and compare the strings when hashes match.",
]
examples = ["repeated-dna-sequences", "find-the-index-of-the-first-occurrence-in-a-string", "longest-duplicate-substring"]

[[extra.variant]]
name = "Rabin-Karp substring search"
note = "Hash the pattern, slide a hash over the text, and verify on a match."
template = '''
def str_str(haystack, needle):
    n, m = len(haystack), len(needle)
    if m == 0:
        return 0
    base, mod = 256, 1_000_000_007
    top = pow(base, m - 1, mod)  # the weight of the leading letter
    hn = hh = 0
    for i in range(m):
        hn = (hn * base + ord(needle[i])) % mod
    for i in range(n):
        if i >= m:
            hh = (hh - ord(haystack[i - m]) * top) % mod  # drop the oldest
        hh = (hh * base + ord(haystack[i])) % mod
        if i >= m - 1 and hh == hn and haystack[i - m + 1:i + 1] == needle:
            return i - m + 1
    return -1
'''

[[extra]]
id = "Sliding Window:answer-window"
name = "Binary search on the answer, check with a window"
group = "Binary search on window size"
signals = [
    "maximise the minimum (or minimise the maximum) of something that depends on how much you spend",
    "feasibility is monotone: if the target works, every smaller one works",
    "the check is a greedy sweep with a running window of what has been added so far",
]
template_name = "Maximize the minimum powered city"
template = '''
def max_min_power(stations, r, k):
    n = len(stations)
    power = [0] * n
    run = sum(stations[:r])  # stations that reach city 0 are in [0, r]
    for i in range(n):
        if i + r < n:
            run += stations[i + r]
        if i - r - 1 >= 0:
            run -= stations[i - r - 1]
        power[i] = run

    def ok(target):
        extra = [0] * (n + 1)  # new stations, as a difference array
        added, window = 0, 0
        for i in range(n):
            window += extra[i]
            need = target - power[i] - window
            if need > 0:
                added += need
                if added > k:
                    return False
                window += need
                if i + 2 * r + 1 < n + 1:
                    extra[min(n, i + 2 * r + 1)] -= need  # stops helping
        return True

    lo, hi = min(power), min(power) + k
    while lo < hi:
        mid = (lo + hi + 1) // 2
        if ok(mid):
            lo = mid
        else:
            hi = mid - 1
    return lo
'''
pitfalls = [
    "Place a missing station as far right as it still covers the current city: it helps the most later cities.",
    "Keep a difference array for the effect of stations you added, so each is applied and removed in O(1).",
    "The search range is from the current minimum to that minimum plus k.",
]
examples = ["maximize-the-minimum-powered-city", "maximum-length-of-repeated-subarray"]

