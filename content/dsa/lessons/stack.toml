pattern = "Stack"
intro = "A stack gives you the most recent unfinished thing. Use it when something is waiting for a later item to resolve it: an open bracket waits for its closer, a day waits for a warmer one, an operator waits for its operand. Say what each stack entry is waiting for, and when it can be removed."
groups = ["Matching and nesting", "Monotonic stack", "Expression evaluation", "Stack and queue design", "Simulation with a stack", "Iterative DFS and tree traversal", "Sorting with stacks", "Monotonic queue (cross-reference: Sliding Window)", "Stack and greedy", "Stack and DP", "Parsing", "Recursion to iteration", "Queues next to stacks (round simulation and streams)", "Core implementation patterns"]










[[technique]]
id = "Stack:simulate-stack"
group = "Simulation with a stack"
signals = [
    "items arrive in order and each can cancel, collide with or undo the previous one",
    "undo, remove adjacent duplicates, asteroids colliding",
    "the result is whatever is left on the stack",
]
template = '''
def asteroid_collision(asteroids):
    stack = []
    for a in asteroids:
        alive = True
        while alive and a < 0 and stack and stack[-1] > 0:
            if stack[-1] < -a:
                stack.pop()  # the one on the stack is smaller: it explodes
            else:
                alive = stack[-1] != -a  # equal sizes: both explode
                if not alive:
                    stack.pop()
                break
        else:
            if alive:
                stack.append(a)
    return stack
'''
pitfalls = [
    "Only a right-moving asteroid on the stack and a left-moving one arriving collide.",
    "Loop: the new asteroid can destroy several in a row.",
    "Equal sizes destroy both. Handle that case separately from a smaller or larger one.",
]

[[technique]]
id = "Stack:matching"
walk = "stack-brackets"
group = "Matching and nesting"
signals = [
    "brackets, tags or any open and close pairs",
    "each closer must match the most recent unmatched opener",
    "valid if the stack ends empty",
]
template = '''
def is_valid(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
        else:
            stack.append(ch)
    return not stack
'''
pitfalls = [
    "A closer with an empty stack is invalid, so check for empty before popping.",
    "At the end the stack must be empty. '((' ends with openers left over.",
    "Map closers to openers, so the check is one dictionary lookup.",
]

[[technique]]
id = "Stack:design-queue-stack"
group = "Stack and queue design"
signals = [
    "build a queue from stacks, or a stack from queues",
    "reverse the order once to get first-in first-out",
    "amortised O(1) is acceptable",
]
template = '''
class MyQueue:
    def __init__(self):
        self.inbox, self.outbox = [], []

    def push(self, x):
        self.inbox.append(x)

    def _fill(self):
        if not self.outbox:  # only refill when it is empty
            while self.inbox:
                self.outbox.append(self.inbox.pop())

    def pop(self):
        self._fill()
        return self.outbox.pop()

    def peek(self):
        self._fill()
        return self.outbox[-1]

    def empty(self):
        return not self.inbox and not self.outbox
'''
pitfalls = [
    "Move items to the outbox only when it is empty. Moving earlier breaks the order.",
    "Each item moves at most once, so the amortised cost per operation is O(1).",
    "empty() must check both stacks.",
]

[[technique]]
id = "Stack:aux-stack"
group = "Stack and queue design"
signals = [
    "a stack that also answers 'what is the minimum (or maximum) right now?' in O(1)",
    "keep extra information next to each pushed item",
    "popping must restore the previous answer",
]
template = '''
class MinStack:
    def __init__(self):
        self.items = []  # (value, minimum of everything up to here)

    def push(self, x):
        low = min(x, self.items[-1][1]) if self.items else x
        self.items.append((x, low))

    def pop(self):
        self.items.pop()

    def top(self):
        return self.items[-1][0]

    def get_min(self):
        return self.items[-1][1]
'''
pitfalls = [
    "Store the running minimum with each item, so popping restores the earlier minimum for free.",
    "A single 'current min' variable breaks on pop, because you don't know the previous minimum.",
    "The same trick tracks a running maximum, or a frequency.",
]

[[technique]]
id = "Stack:expression"
group = "Simulation with a stack"
signals = [
    "evaluate an expression in postfix (reverse Polish) form",
    "operands first, then the operator that applies to the last two",
    "push numbers, apply operators to the top two",
]
template = '''
def eval_rpn(tokens):
    stack = []
    for t in tokens:
        if t in "+-*/" and len(t) == 1:
            b, a = stack.pop(), stack.pop()  # b came last
            if t == "+":
                stack.append(a + b)
            elif t == "-":
                stack.append(a - b)
            elif t == "*":
                stack.append(a * b)
            else:
                stack.append(int(a / b))  # truncate toward zero
        else:
            stack.append(int(t))
    return stack[0]
'''
pitfalls = [
    "Pop the right operand first (b), then the left (a). Subtraction and division care.",
    "Division truncates toward zero: int(a / b), not a // b, for negative numbers.",
    "A token like '-5' is a number, not an operator. Check the length as well.",
]

[[technique]]
id = "Stack:mono-stack"
walk = "stack-mono"
group = "Monotonic stack"
signals = [
    "for each item, the next greater (or smaller) item to its right or left",
    "how many days until a warmer day, or the nearest taller building",
    "keep the stack in sorted order, and pop what the new item resolves",
]
template = '''
def daily_temperatures(temps):
    answer = [0] * len(temps)
    stack = []  # indexes whose warmer day hasn't come yet
    for i, t in enumerate(temps):
        while stack and temps[stack[-1]] < t:
            j = stack.pop()
            answer[j] = i - j  # day i is the first warmer day for j
        stack.append(i)
    return answer
'''
pitfalls = [
    "Store indexes so you can compute distances.",
    "Items left on the stack at the end have no answer and keep the default of 0.",
    "The stack stays sorted (decreasing here). Choose strict or non-strict comparison to match the problem's wording.",
]

[[technique]]
id = "Stack:nested"
group = "Iterative DFS and tree traversal"
signals = [
    "an encoded or nested structure like 3[a2[c]]",
    "each opening symbol starts a new level and each closing one ends it",
    "save the state when you enter a level and restore it when you leave",
]
template = '''
def decode_string(s):
    stack = []
    text, count = "", 0
    for ch in s:
        if ch.isdigit():
            count = count * 10 + int(ch)  # numbers can have several digits
        elif ch == "[":
            stack.append((text, count))  # save this level
            text, count = "", 0
        elif ch == "]":
            before, times = stack.pop()
            text = before + text * times
        else:
            text += ch
    return text
'''
pitfalls = [
    "Digits can be multi-digit: build the number with count * 10 + digit.",
    "At '[' save the text so far and the repeat count, then start fresh inside.",
    "Letters outside brackets just extend the current text.",
]

[[technique]]
id = "Stack:calculator"
group = "Matching and nesting"
signals = [
    "evaluate an expression with + - * / and operator precedence",
    "multiplication and division bind tighter than addition and subtraction",
    "numbers can have several digits",
]
template = '''
def calculate(s):
    stack, num, op = [], 0, "+"
    for i, ch in enumerate(s + "+"):  # the sentinel flushes the last number
        if ch.isdigit():
            num = num * 10 + int(ch)
        elif ch != " ":
            if op == "+":
                stack.append(num)
            elif op == "-":
                stack.append(-num)
            elif op == "*":
                stack.append(stack.pop() * num)
            else:
                stack.append(int(stack.pop() / num))
            op, num = ch, 0
    return sum(stack)
'''
pitfalls = [
    "Apply * and / to the top of the stack right away. Push + and - terms and add them up at the end.",
    "The operator being applied is the PREVIOUS one, which is why the code keeps `op` and updates it after.",
    "Append a sentinel operator to the string so the last number is processed.",
    "Division truncates toward zero: int(a / b).",
]

[[technique]]
id = "Stack:mono-contrib"
group = "Monotonic stack"
signals = [
    "sum over all subarrays of their minimum (or maximum)",
    "count how many subarrays an item is the minimum of",
    "the nearest smaller item on each side bounds that count",
]
template = '''
def sum_subarray_mins(arr):
    MOD = 10**9 + 7
    n = len(arr)
    left = [0] * n   # distance to the previous strictly smaller item
    right = [0] * n  # distance to the next smaller-or-equal item
    stack = []
    for i in range(n):
        while stack and arr[stack[-1]] > arr[i]:
            j = stack.pop()
            right[j] = i - j
        left[i] = i - stack[-1] if stack else i + 1
        stack.append(i)
    for j in stack:
        right[j] = n - j
    return sum(a * l * r for a, l, r in zip(arr, left, right)) % MOD
'''
pitfalls = [
    "Break ties on ONE side only (strict on one, non-strict on the other), or equal minimums are counted twice.",
    "arr[i] is the minimum of left[i] * right[i] subarrays: choose a start on the left and an end on the right.",
    "Items still on the stack at the end have no smaller item to their right: use n - j.",
]

[[extra]]
id = "Stack:next-greater"
walk = "stack-mono"
name = "Next greater element, also around a circle"
group = "Monotonic stack"
signals = [
    "for every element, the next element to its right that is bigger (or smaller)",
    "a stack of elements still waiting for their answer: each new element answers all smaller ones on top",
    "a circular array: walk the indexes twice",
]
template_name = "Circular array"
template = '''
def next_greater_elements(nums):
    n = len(nums)
    out = [-1] * n
    stack = []  # indexes still waiting; their values never increase
    for i in range(2 * n):  # the second lap sees the elements before them
        x = nums[i % n]
        while stack and nums[stack[-1]] < x:
            out[stack.pop()] = x
        if i < n:
            stack.append(i)  # only the first lap asks for an answer
    return out
'''
pitfalls = [
    "Pop while the top is smaller: every popped element has just found its answer.",
    "Store indexes, not values, when the answer is a position or a distance.",
    "For a circle push only during the first lap; the second lap only answers.",
]
examples = ["next-greater-element-ii", "next-greater-element-i", "next-greater-node-in-linked-list", "final-prices-with-a-special-discount-in-a-shop", "daily-temperatures"]

[[extra.variant]]
name = "Next greater element I"
note = "Answer the whole of nums2 once, keep the result in a dict, and look up nums1."
template = '''
def next_greater_element(nums1, nums2):
    nxt, stack = {}, []
    for x in nums2:
        while stack and stack[-1] < x:
            nxt[stack.pop()] = x
        stack.append(x)
    return [nxt.get(x, -1) for x in nums1]
'''

[[extra.variant]]
name = "Final prices (next smaller or equal)"
note = "The discount of an item is the first later price that is not higher."
template = '''
def final_prices(prices):
    out, stack = prices[:], []
    for i, p in enumerate(prices):
        while stack and prices[stack[-1]] >= p:
            out[stack.pop()] -= p  # p is its discount
        stack.append(i)
    return out
'''

[[extra]]
id = "Stack:histogram-rows"
name = "Rows as histograms: maximal rectangle"
group = "Monotonic stack"
signals = [
    "the largest rectangle (or the number of rectangles) of ones in a binary matrix",
    "build a histogram of consecutive ones above each row, then solve each row as the largest rectangle in a histogram",
    "the histogram needs the nearest smaller bar on both sides: a monotonic stack",
]
template_name = "Maximal rectangle"
template = '''
def maximal_rectangle(matrix):
    if not matrix:
        return 0
    cols, heights, best = len(matrix[0]), [0] * len(matrix[0]), 0
    for row in matrix:
        for j in range(cols):
            heights[j] = heights[j] + 1 if row[j] == "1" else 0
        stack = []  # indexes of bars with increasing heights
        for j in range(cols + 1):
            # a bar of height 0 at the end flushes the stack
            h = heights[j] if j < cols else 0
            while stack and heights[stack[-1]] >= h:
                height = heights[stack.pop()]
                left = stack[-1] if stack else -1
                best = max(best, height * (j - left - 1))
            stack.append(j)
    return best
'''
pitfalls = [
    "Reset a column's height to 0 on a zero, otherwise add one: that is the histogram of the row.",
    "Flush the stack at the end with a bar of height 0, or the last bars are never counted.",
    "The width of a popped bar runs from the new top of the stack + 1 to the current index - 1.",
]
examples = ["maximal-rectangle", "count-submatrices-with-all-ones", "largest-rectangle-in-histogram"]

[[extra.variant]]
name = "Count submatrices of ones"
note = "For every row, sum the number of rectangles ending at each cell with a running count over the histogram."
template = '''
def num_submat(mat):
    rows, cols, total = len(mat), len(mat[0]), 0
    heights = [0] * cols
    for r in range(rows):
        for c in range(cols):
            heights[c] = heights[c] + 1 if mat[r][c] else 0
        stack = []
        count = [0] * cols  # count[j]: rectangles ending at column j
        for j in range(cols):
            while stack and heights[stack[-1]] >= heights[j]:
                stack.pop()
            if stack:
                k = stack[-1]
                count[j] = count[k] + heights[j] * (j - k)
            else:
                count[j] = heights[j] * (j + 1)
            stack.append(j)
            total += count[j]
    return total
'''

[[extra]]
id = "Stack:ramp"
name = "Candidates on a stack, then scan back"
group = "Monotonic stack"
signals = [
    "the widest pair i < j with nums[i] <= nums[j], or the 132 pattern",
    "only the prefix minima can be the left end: keep them on a decreasing stack",
    "scan the right end from the back and pop every candidate it can use",
]
template_name = "Maximum width ramp"
template = '''
def max_width_ramp(nums):
    stack = []  # left candidates: indexes of strictly smaller values
    for i, x in enumerate(nums):
        if not stack or x < nums[stack[-1]]:
            stack.append(i)
    best = 0
    for j in range(len(nums) - 1, -1, -1):  # right end, from the back
        while stack and nums[stack[-1]] <= nums[j]:
            best = max(best, j - stack.pop())  # its widest ramp
    return best
'''
pitfalls = [
    "Only a new strict minimum is a useful left end: any other index has a smaller one to its left that is at least as wide.",
    "Scan j from the far end: the first j that accepts a candidate gives that candidate its widest ramp.",
    "A candidate that is popped is never needed again, so the scan is linear.",
]
examples = ["maximum-width-ramp", "132-pattern", "beautiful-towers-ii"]

[[extra.variant]]
name = "132 pattern"
note = "Walk from the right keeping the best 'two' (the largest value popped by a bigger one); a smaller 'one' to its left proves the pattern."
template = '''
def find132pattern(nums):
    two, stack = float("-inf"), []  # best "2"; stack of "3" candidates
    for x in reversed(nums):
        if x < two:
            return True  # x is the "1" below a known "2" and "3"
        while stack and stack[-1] < x:
            two = stack.pop()  # x is a "3"; the largest popped is "2"
        stack.append(x)
    return False
'''

[[extra]]
id = "Stack:parens-depth"
name = "Depth of nested parentheses"
group = "Matching and nesting"
signals = [
    "the score, the outer layer, the nesting depth or a split of a valid parentheses string",
    "a counter of open brackets is enough: no stack of characters is needed",
    "a closing bracket at depth d belongs to the pair that opened at depth d",
]
template_name = "Score of parentheses"
template = '''
def score_of_parentheses(s):
    score, depth = 0, 0
    for i, ch in enumerate(s):
        depth += 1 if ch == "(" else -1
        if ch == ")" and s[i - 1] == "(":
            score += 1 << depth  # a "()" at this depth counts 2^depth
    return score
'''
pitfalls = [
    "Only a direct \"()\" adds to the score: its value is 2 to the power of its depth after closing.",
    "Track depth with a number, not a stack, unless the content of the bracket matters.",
    "Remove the outer layer by skipping the brackets that bring the depth to or from zero.",
]
examples = ["score-of-parentheses", "remove-outermost-parentheses", "maximum-nesting-depth-of-the-parentheses", "maximum-nesting-depth-of-two-valid-parentheses-strings"]

[[extra.variant]]
name = "Remove outermost parentheses"
note = "Keep a bracket unless it opens at depth 0 or closes back to depth 0."
template = '''
def remove_outer_parentheses(s):
    out, depth = [], 0
    for ch in s:
        if ch == "(":
            if depth:
                out.append(ch)
            depth += 1
        else:
            depth -= 1
            if depth:
                out.append(ch)
    return "".join(out)
'''

[[extra.variant]]
name = "Split into two valid strings"
note = "Give each bracket to group 0 or 1 by the parity of its depth: no group gets deeper than half."
template = '''
def max_depth_after_split(seq):
    out, depth = [], 0
    for ch in seq:
        if ch == "(":
            depth += 1
            out.append(depth % 2)
        else:
            out.append(depth % 2)
            depth -= 1
    return out
'''

[[extra]]
id = "Stack:valid-length"
name = "Longest valid parentheses: a stack of indexes"
group = "Matching and nesting"
signals = [
    "the longest well-formed substring of brackets",
    "push indexes, with a base index under the stack: the distance to the base is the current valid length",
