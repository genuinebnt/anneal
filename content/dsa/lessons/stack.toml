def make_good(s):
    stack = []
    for ch in s:
        if stack and stack[-1] == ch.swapcase():
            stack.pop()
        else:
            stack.append(ch)
    return "".join(stack)
'''

[[extra.variant]]
name = "Remove a pattern repeatedly"
note = "Push characters; when the top of the stack ends with the pattern, pop it."
template = '''
def remove_occurrences(s, part):
    stack = []
    for ch in s:
        stack.append(ch)
        if len(stack) >= len(part) and "".join(stack[-len(part):]) == part:
            del stack[-len(part):]  # gone: earlier text re-joins
    return "".join(stack)
'''

[[extra]]
id = "Stack:call-stack"
name = "A stack of contexts: logs and paths"
group = "Simulation with a stack"
signals = [
    "function start and end logs with timestamps, or a path made of directories",
    "the stack is the chain of open scopes; the top is the one that is running now",
    "work done by a child must be taken out of its parent",
]
template_name = "Exclusive time of functions"
template = '''
def exclusive_time(n, logs):
    out, stack, prev = [0] * n, [], 0
    for log in logs:
        fid, kind, t = log.split(":")
        fid, t = int(fid), int(t)
        if kind == "start":
            if stack:
                out[stack[-1]] += t - prev  # the parent ran until now
            stack.append(fid)
            prev = t
        else:
            out[stack.pop()] += t - prev + 1  # an end is inclusive
            prev = t + 1  # the next tick starts after it
    return out
'''
pitfalls = [
    "A start log is at the beginning of the tick and an end log at its end: the end adds 1.",
    "When a child starts, credit the parent for the time until now; when a child ends, the parent resumes after it.",
    "prev is the time from which the current top is running.",
]
examples = ["exclusive-time-of-functions", "longest-absolute-file-path", "simplify-path", "crawler-log-folder"]

[[extra.variant]]
name = "Longest absolute file path"
note = "A stack of the path length at each depth; a file's depth is the number of tabs."
template = '''
def length_longest_path(text):
    best, lengths = 0, [0]  # lengths[d]: length of the path to depth d
    for line in text.split("\n"):
        name = line.lstrip("\t")
        depth = len(line) - len(name)
        del lengths[depth + 1:]  # leave the deeper directories
        if "." in name:
            best = max(best, lengths[depth] + len(name))  # a file
        else:
            lengths.append(lengths[depth] + len(name) + 1)  # dir + "/"
    return best
'''

[[extra.variant]]
name = "Simplify path"
note = "Split on slashes; '..' pops, '.' and empty parts are ignored."
template = '''
def simplify_path(path):
    stack = []
    for part in path.split("/"):
        if part == "..":
            if stack:
                stack.pop()
        elif part and part != ".":
            stack.append(part)
    return "/" + "/".join(stack)
'''

[[extra]]
id = "Stack:two-stack-cursor"
name = "Two stacks around a cursor: text editor, browser history"
group = "Stack and queue design"
signals = [
    "an editor with a cursor, or a history with back and forward",
    "the stack on the left of the cursor holds what was passed; the stack on the right holds what is ahead",
    "moving the cursor moves items from one stack to the other",
]
template_name = "Text editor"
template = '''
class TextEditor:
    def __init__(self):
        self.left, self.right = [], []  # before / after the cursor

    def addText(self, text):
        self.left.extend(text)

    def deleteText(self, k):
        k = min(k, len(self.left))
        del self.left[len(self.left) - k:]
        return k

    def cursorLeft(self, k):
        for _ in range(min(k, len(self.left))):
            self.right.append(self.left.pop())
        return "".join(self.left[-10:])

    def cursorRight(self, k):
        for _ in range(min(k, len(self.right))):
            self.left.append(self.right.pop())
        return "".join(self.left[-10:])
'''
pitfalls = [
    "Clamp k to the number of characters that exist before moving or deleting.",
    "Moving left pushes onto the right stack in reverse: popping it later restores the order.",
    "The editor returns the last 10 characters before the cursor, not the whole text.",
]
examples = ["design-a-text-editor", "design-browser-history"]

[[extra.variant]]
name = "Browser history"
note = "A list of pages and a position; visiting drops everything ahead."
template = '''
class BrowserHistory:
    def __init__(self, homepage):
        self.pages, self.at = [homepage], 0

    def visit(self, url):
        del self.pages[self.at + 1:]  # forward history is gone
        self.pages.append(url)
        self.at += 1

    def back(self, steps):
        self.at = max(0, self.at - steps)
        return self.pages[self.at]

    def forward(self, steps):
        self.at = min(len(self.pages) - 1, self.at + steps)
        return self.pages[self.at]
'''

[[extra]]
id = "Stack:lazy-increment"
name = "Stack with lazy increments"
group = "Stack and queue design"
signals = [
    "increment the bottom k elements of a stack many times, with push and pop in O(1)",
    "do not touch the k elements: remember the increment on the k-th position",
    "when an element is popped, its pending increment moves down to the element below",
]
template = '''
class CustomStack:
    def __init__(self, maxSize):
        self.cap, self.a = maxSize, []
        self.add = []  # add[i]: pending +v for elements 0..i

    def push(self, x):
        if len(self.a) < self.cap:
            self.a.append(x)
            self.add.append(0)

    def pop(self):
        if not self.a:
            return -1
        inc = self.add.pop()
        if self.add:
            self.add[-1] += inc  # it covers the element below too
        return self.a.pop() + inc

    def increment(self, k, val):
        if self.a:
            self.add[min(k, len(self.a)) - 1] += val  # one note, not k
'''
pitfalls = [
    "Record the increment once, at index min(k, size) - 1, and resolve it on pop.",
    "On pop pass the increment down: elements below were covered by the same operation.",
    "Check the empty stack before increment and pop.",
]
examples = ["design-a-stack-with-increment-operation", "build-an-array-with-stack-operations"]

[[extra]]
id = "Stack:holding-buffer"
name = "A stack as a holding buffer"
group = "Sorting with stacks"
signals = [
    "items move through a stack on the way to the output: the order out depends on when you pop",
    "pop whenever the top is no worse than everything still to come",
    "check if a push/pop sequence is possible by simulating it",
]
template_name = "Validate stack sequences"
template = '''
def validate_stack_sequences(pushed, popped):
    stack, j = [], 0
    for x in pushed:
        stack.append(x)
        while stack and j < len(popped) and stack[-1] == popped[j]:
            stack.pop()  # this is the next item to leave
            j += 1
    return not stack
'''
pitfalls = [
    "Pop greedily: when the top equals the next popped value, popping now is never worse.",
    "The sequence is valid exactly when the stack is empty at the end.",
    "The same idea builds the smallest string: pop while the top is at most every letter still to come.",
]
examples = ["validate-stack-sequences", "using-a-robot-to-print-the-lexicographically-smallest-string"]

[[extra.variant]]
name = "Robot prints the smallest string"
note = "Pop while the top is not larger than the smallest letter still unread."
template = '''
def robot_with_string(s):
    left, out, stack = [0] * 27, [], []
    for ch in s:
        left[ord(ch) - 97] += 1
    for ch in s:
        stack.append(ch)
        left[ord(ch) - 97] -= 1
        # the smallest letter that is still unread
        low = next((i for i in range(26) if left[i]), 26)
        while stack and ord(stack[-1]) - 97 <= low:
            out.append(stack.pop())  # nothing smaller is coming: print it
    return "".join(out)
'''

[[extra]]
id = "Stack:chunks"
name = "Chunks that sort independently"
group = "Sorting with stacks"
signals = [
    "the most pieces you can cut an array into so that sorting each piece sorts the whole",
    "a stack of chunk maxima: a smaller new element merges the chunks above it",
    "the shortest subarray to sort so the whole array is sorted",
]
template_name = "Max chunks to make sorted II"
template = '''
def max_chunks_to_sorted(arr):
    stack = []  # the maximum of each chunk, increasing
    for x in arr:
        biggest = x
        while stack and stack[-1] > x:
            biggest = max(biggest, stack.pop())  # x merges these chunks
        stack.append(biggest)
    return len(stack)
'''
pitfalls = [
    "A new element smaller than a chunk's maximum merges with that chunk (and every chunk above the first smaller maximum).",
    "Push the largest value of the merged chunk: it is the new chunk's maximum.",
    "The answer is the number of chunks left on the stack.",
]
examples = ["max-chunks-to-make-sorted-ii", "max-chunks-to-make-sorted", "shortest-unsorted-continuous-subarray"]

[[extra.variant]]
name = "Shortest unsorted subarray"
note = "The right end is the last element smaller than the running maximum, the left end the first larger than the running minimum from the right."
template = '''
def find_unsorted_subarray(nums):
    n, hi, lo = len(nums), float("-inf"), float("inf")
    end = start = -1
    for i in range(n):
        hi = max(hi, nums[i])
        if nums[i] < hi:
            end = i  # something bigger came before: out of order
    for i in range(n - 1, -1, -1):
        lo = min(lo, nums[i])
        if nums[i] > lo:
            start = i
    return 0 if end == -1 else end - start + 1
'''

[[extra]]
id = "Stack:deque-prefix"
name = "Monotonic deque over prefix sums"
group = "Monotonic queue (cross-reference: Sliding Window)"
template_name = "Prefix sums"
signals = [
    "the shortest subarray with sum at least k, when values can be negative (a sliding window fails)",
    "prefix sums turn it into: the closest earlier prefix that is at most the current one minus k",
    "a deque of increasing prefix sums: pop from the front while the answer is met, from the back while it is not smaller",
]
template = '''
from collections import deque


def shortest_subarray(nums, k):
    prefix = [0]
    for x in nums:
        prefix.append(prefix[-1] + x)
    best, dq = len(nums) + 1, deque()  # indexes with increasing prefix sums
    for i, p in enumerate(prefix):
        while dq and p - prefix[dq[0]] >= k:
            best = min(best, i - dq.popleft())  # later ends are longer
        while dq and prefix[dq[-1]] >= p:
            dq.pop()  # a larger earlier prefix is never a better start
        dq.append(i)
    return best if best <= len(nums) else -1
'''
pitfalls = [
    "Negative numbers break the usual two-pointer window: that is why the deque of prefix sums is needed.",
    "Pop the front when it already satisfies the sum: any later end only makes it longer.",
    "Pop the back while it is not smaller than the new prefix: the new one starts shorter and sums at least as much.",
]
examples = ["shortest-subarray-with-sum-at-least-k", "longest-continuous-subarray-with-absolute-diff-less-than-or-equal-to-limit"]

[[extra.variant]]
name = "Two deques: max and min in the window"
note = "A window is valid while max - min is at most the limit; shrink from the left when it is not."
template = '''
from collections import deque


def longest_subarray(nums, limit):
    big, small, left, best = deque(), deque(), 0, 0
    for right, x in enumerate(nums):
        while big and big[-1] < x:
            big.pop()
        big.append(x)
        while small and small[-1] > x:
            small.pop()
        small.append(x)
        while big[0] - small[0] > limit:
            if big[0] == nums[left]:
                big.popleft()  # the leaving element was the maximum
            if small[0] == nums[left]:
                small.popleft()
            left += 1
        best = max(best, right - left + 1)
    return best
'''

[[extra]]
id = "Stack:parser"
name = "Recursive-descent parsing with an index"
group = "Parsing"
signals = [
    "a nested format: lists, a boolean expression, a ternary, a tag tree",
    "one function per kind of thing, sharing an index that moves through the text",
    "a function parses its own part and returns, leaving the index after it",
]
template_name = "Ternary expression"
template = '''
def parse_ternary(expression):
    # a ? b : c  is right associative: read from the right with a stack
    stack = []
    i = len(expression) - 1
    while i >= 0:
        ch = expression[i]
        if stack and stack[-1] == "?":
            stack.pop()  # "?"
            first = stack.pop()
            stack.pop()  # ":"
            second = stack.pop()
            stack.append(first if ch == "T" else second)
        else:
            stack.append(ch)
        i -= 1
    return stack[0]
'''
pitfalls = [
    "Read from the right: the nearest condition is then the one in front of a completed pair of branches.",
    "When the item below the stack top is \"?\", the current character is a condition: resolve it.",
    "A recursive-descent version keeps one shared index and a function per construct.",
]
examples = ["ternary-expression-parser", "parsing-a-boolean-expression", "mini-parser", "tag-validator", "parse-lisp-expression"]

[[extra.variant]]
name = "Boolean expression"
note = "Operators with arguments in parentheses: a stack of operators and results, folded at the closing bracket."
template = '''
def parse_bool_expr(expression):
    stack = []
    for ch in expression:
        if ch in ",":
            continue
        if ch == ")":
            vals = set()
            while stack[-1] != "(":
                vals.add(stack.pop())  # the arguments
            stack.pop()  # "("
            op = stack.pop()
            if op == "!":
                stack.append("f" if "t" in vals else "t")
            elif op == "&":
                stack.append("f" if "f" in vals else "t")
            else:
                stack.append("t" if "t" in vals else "f")
        else:
            stack.append(ch)
    return stack[0] == "t"
'''

[[extra.variant]]
name = "Mini parser (nested integers)"
note = "A stack of open lists; a number is read when a comma or bracket ends it."
template = '''
def deserialize(s):
    if s[0] != "[":
        return int(s)  # a single integer
    stack, num, sign = [], "", 1
    for ch in s:
        if ch == "[":
            stack.append([])
        elif ch == "-":
            sign = -1
        elif ch.isdigit():
            num += ch
        else:  # "," or "]": end of a number, and maybe of a list
            if num:
                stack[-1].append(sign * int(num))
                num, sign = "", 1
            if ch == "]" and len(stack) > 1:
                inner = stack.pop()
                stack[-1].append(inner)
    return stack[0]
'''

[[extra]]
id = "Stack:encoded-index"
name = "Index into an encoded string without expanding it"
group = "Parsing"
signals = [
    "the k-th character of a string that would be enormous if expanded (letters repeat by digits)",
    "compute the expanded length first, then walk back, shrinking k by the length with modulo",
    "never build the string: only lengths",
]
template = '''
def decode_at_index(s, k):
    size = 0
    for ch in s:  # the length of the expanded string
        size = size * int(ch) if ch.isdigit() else size + 1
    for ch in reversed(s):
        k %= size
        if k == 0 and ch.isalpha():
            return ch  # the end of this prefix is the k-th character
        size = size // int(ch) if ch.isdigit() else size - 1
'''
pitfalls = [
    "Walk backwards: undoing a digit divides the size, undoing a letter subtracts one.",
    "Take k modulo the current size first: a repeat means the same text again.",
    "When k becomes 0 on a letter, that letter is the answer.",
]
examples = ["decoded-string-at-index"]

