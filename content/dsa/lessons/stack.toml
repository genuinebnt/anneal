template = '''
def longest_valid_parentheses(s):
    stack, best = [-1], 0  # the base: the index before the current run
    for i, ch in enumerate(s):
        if ch == "(":
            stack.append(i)
        else:
            stack.pop()
            if stack:
                best = max(best, i - stack[-1])  # the run since the new top
            else:
                stack.append(i)  # unmatched ")": a new base
    return best
'''
