[[extra]]
id = "Stack:run-length"
name = "Cancel adjacent items with run-length entries"
group = "Simulation with a stack"
signals = [
    "remove adjacent duplicates, k equal letters in a row, or a letter and its opposite case",
    "the stack holds (item, run length): equal items extend the top entry",
    "an entry that reaches the limit is popped; removals can chain",
]
template_name = "Remove k adjacent duplicates"
template = '''
def remove_duplicates(s, k):
    stack = []  # [letter, how many in a row]
    for ch in s:
        if stack and stack[-1][0] == ch:
            stack[-1][1] += 1
            if stack[-1][1] == k:
                stack.pop()  # k in a row disappear
        else:
            stack.append([ch, 1])
    return "".join(ch * n for ch, n in stack)
'''
pitfalls = [
    "Compare with the top of the stack, not with the previous input character: after a removal the neighbours change.",
    "Rebuild the string from the entries with their counts.",
    "A letter and its opposite case cancel: compare with ch.swapcase() instead of equality.",
]
examples = ["remove-all-adjacent-duplicates-in-string-ii", "remove-all-adjacent-duplicates-in-string", "make-the-string-great", "clear-digits", "removing-stars-from-a-string", "remove-all-occurrences-of-a-substring"]

[[extra.variant]]
name = "Make the string great"
note = "Two letters cancel when they are the same letter in different cases."
