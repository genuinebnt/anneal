]
template = '''
from collections import defaultdict


class TweetCounts:
    def __init__(self):
        self.times = defaultdict(list)

    def recordTweet(self, tweetName, time):
        self.times[tweetName].append(time)

    def getTweetCountsPerFrequency(
            self, freq, tweetName, startTime, endTime):
        size = 60 if freq == "minute" else 3600 if freq == "hour" else 86400
        out = [0] * ((endTime - startTime) // size + 1)
        for t in self.times[tweetName]:
            if startTime <= t <= endTime:
                out[(t - startTime) // size] += 1  # which bucket
        return out
'''
pitfalls = [
    "The last bucket may be shorter than the others: its size is (end - start) % size + 1, but it is still one bucket.",
    "Buckets are counted from startTime, not from time 0.",
    "Keep each key's times sorted (bisect) when there are many records and few queries.",
]
examples = ["tweet-counts-per-frequency"]

[[extra]]
id = "Intervals:interval-set"
name = "A set of disjoint intervals with add, remove and query"
group = "Calendar booking"
signals = [
    "numbers (or ranges) arrive over time, and you must report the union as sorted disjoint intervals",
    "add, remove and ask 'is this whole range present'",
    "a sorted list of intervals, found by bisect, merged or split on every change",
]
template_name = "Data stream as disjoint intervals"
template = '''
from bisect import bisect_left


class SummaryRanges:
    def __init__(self):
        self.iv = []  # sorted, disjoint [start, end]

    def addNum(self, value):
        i = bisect_left(self.iv, [value, value])  # first start >= value
        if i > 0 and self.iv[i - 1][1] >= value:
            return  # inside the interval before
        if i < len(self.iv) and self.iv[i][0] == value:
            return  # already a start
        join_left = i > 0 and self.iv[i - 1][1] == value - 1
        join_right = i < len(self.iv) and self.iv[i][0] == value + 1
        if join_left and join_right:
            self.iv[i - 1][1] = self.iv[i][1]
            del self.iv[i]
        elif join_left:
            self.iv[i - 1][1] = value
        elif join_right:
            self.iv[i][0] = value
        else:
            self.iv.insert(i, [value, value])

    def getIntervals(self):
        return [x[:] for x in self.iv]
'''
pitfalls = [
    "Check 'already covered' before looking at the neighbours: the interval before may contain the value.",
    "Joining can merge two intervals into one: update one and delete the other.",
    "Return copies: the caller must not be able to change the stored intervals.",
]
examples = ["data-stream-as-disjoint-intervals", "range-module"]

[[extra.variant]]
name = "Range module (half-open ranges)"
note = "Add merges every touching range, remove cuts pieces, query needs one stored range to contain it."
template = '''
class RangeModule:
    def __init__(self):
        self.iv = []  # sorted, disjoint half-open [left, right)

    def addRange(self, left, right):
        out = []
        for l, r in self.iv:
            if r < left or right < l:
                out.append([l, r])  # apart, and not touching
            else:
                left, right = min(left, l), max(right, r)  # absorb it
        out.append([left, right])
        out.sort()
        self.iv = out

    def queryRange(self, left, right):
        return any(l <= left and right <= r for l, r in self.iv)

    def removeRange(self, left, right):
        out = []
        for l, r in self.iv:
            if r <= left or right <= l:
                out.append([l, r])
                continue
            if l < left:
                out.append([l, left])  # the piece on the left
            if right < r:
                out.append([right, r])  # the piece on the right
        self.iv = out
'''

[[extra]]
id = "Intervals:free-days"
name = "Days without a meeting"
group = "Gaps and free time"
signals = [
    "count (or find) the days not covered by any meeting or busy interval",
    "sort by start, keep the furthest end so far, and add each gap before the next start",
    "the gaps before the first start and after the last end count as well",
]
template = '''
def count_days(days, meetings):
    free, end = 0, 0  # end: the last day covered so far
    for start, stop in sorted(meetings):
        if start > end + 1:
            free += start - end - 1  # the gap before this meeting
        end = max(end, stop)
    return free + max(0, days - end)  # the days after the last meeting
'''
pitfalls = [
    "Take the maximum of the ends: a long meeting may contain several later ones.",
    "Days are inclusive on both sides: the gap between end and start is start - end - 1.",
    "Add the tail after the last end separately.",
]
examples = ["count-days-without-meetings"]

[[extra]]
id = "Intervals:rectangle"
name = "Overlap and union of rectangles"
group = "Union length and area"
signals = [
    "the overlap of two axis-aligned rectangles is the overlap of two intervals in each axis",
    "the area of a union by inclusion-exclusion, or by cutting into vertical strips",
    "coordinates are compressed so that only the interesting x values are visited",
]
template_name = "Two rectangles"
template = '''
def compute_area(ax1, ay1, ax2, ay2, bx1, by1, bx2, by2):
    area = (ax2 - ax1) * (ay2 - ay1) + (bx2 - bx1) * (by2 - by1)
    w = min(ax2, bx2) - max(ax1, bx1)  # overlap of the x intervals
    h = min(ay2, by2) - max(ay1, by1)  # overlap of the y intervals
    return area - (w * h if w > 0 and h > 0 else 0)
'''
pitfalls = [
    "A negative width or height means no overlap: do not multiply two negatives into a positive area.",
    "Touching edges (w == 0) overlap in no area.",
    "Subtract the overlap once: it was counted in both rectangles.",
]
examples = ["rectangle-area", "rectangle-overlap", "rectangle-area-ii", "projection-area-of-3d-shapes"]

[[extra.variant]]
name = "Union area of many rectangles"
note = "Cut the plane into vertical strips between consecutive x values; in each strip merge the y spans."
template = '''
def rectangle_area(rectangles):
    xs = sorted({x for x1, _, x2, _ in rectangles for x in (x1, x2)})
    total = 0
    for a, b in zip(xs, xs[1:]):  # each vertical strip [a, b]
        spans = sorted((y1, y2) for x1, y1, x2, y2 in rectangles
                       if x1 <= a and b <= x2)
        covered, top = 0, 0
        for y1, y2 in spans:
            y1 = max(y1, top)  # skip what is already counted
            if y2 > y1:
                covered += y2 - y1
                top = y2
        total += covered * (b - a)
    return total % (10**9 + 7)
'''

[[extra.variant]]
name = "Projection area of 3-D shapes"
note = "Top = non-zero cells, front = the tallest of each row, side = the tallest of each column."
template = '''
def projection_area(grid):
    top = sum(v > 0 for row in grid for v in row)
    front = sum(max(row) for row in grid)
    side = sum(max(col) for col in zip(*grid))
    return top + front + side
'''

[[extra]]
id = "Intervals:offline-queries"
name = "Queries sorted, intervals pushed into a heap as they become eligible"
group = "Queries on intervals (offline sort + heap)"
signals = [
    "for each query point, the smallest interval that contains it (or the best by some key)",
    "answer queries in increasing order: intervals with start <= q are eligible, and stay eligible until their end passes",
    "a heap keyed by size, with lazy deletion of intervals that already ended",
]
template = '''
import heapq


def min_interval(intervals, queries):
    intervals = sorted(intervals)
    heap, i, answer = [], 0, {}  # heap: (size, right end)
    for q in sorted(set(queries)):
        while i < len(intervals) and intervals[i][0] <= q:
            l, r = intervals[i]
            heapq.heappush(heap, (r - l + 1, r))  # eligible from now on
            i += 1
        while heap and heap[0][1] < q:
            heapq.heappop(heap)  # ended before q: never useful again
        answer[q] = heap[0][0] if heap else -1
    return [answer[q] for q in queries]
'''
pitfalls = [
    "Sort the queries but answer in the original order: keep a dict from query to answer.",
    "An interval that ended before the current query also ended before every later query: popping it is final.",
    "Do not remove from the middle of the heap: let dead entries reach the top and pop them there.",
]
examples = ["minimum-interval-to-include-each-query"]

[[extra]]
id = "Intervals:circular"
name = "Circular intervals: unroll the circle once"
group = "Circular intervals"
signals = [
    "times of day, angles or positions on a ring: the smallest difference may wrap around",
    "sort, take adjacent differences, and add the wrap-around gap between the last and first",
    "a window on a circle: duplicate the sorted list shifted by one full turn",
]
template_name = "Minimum time difference"
template = '''
def find_min_difference(time_points):
    minutes = sorted(int(t[:2]) * 60 + int(t[3:]) for t in time_points)
    gaps = [b - a for a, b in zip(minutes, minutes[1:])]
    gaps.append(minutes[0] + 1440 - minutes[-1])  # across midnight
    return min(gaps)
'''
pitfalls = [
    "Include the gap from the last time to the first of the next day.",
    "Equal times give difference 0: do not deduplicate before computing gaps.",
    "More than 1440 time points must contain a duplicate (pigeonhole): the answer is 0 at once.",
]
examples = ["minimum-time-difference", "maximum-number-of-visible-points", "angle-between-hands-of-a-clock"]

[[extra.variant]]
name = "Visible points (window of angles)"
note = "Sort the angles, append each plus 360, and for every start take the points within the field of view."
template = '''
import math
from bisect import bisect_right


def visible_points(points, angle, location):
    here, angles = 0, []
    for x, y in points:
        if [x, y] == location:
            here += 1  # at the viewer: always visible
        else:
            angles.append(math.degrees(
                math.atan2(y - location[1], x - location[0])))
    angles.sort()
    angles += [a + 360 for a in angles]  # unroll the circle once
    best = 0
    for i in range(len(angles) // 2):
        j = bisect_right(angles, angles[i] + angle + 1e-9)
        best = max(best, j - i)  # points in [a_i, a_i + angle]
    return best + here
'''

[[extra]]
id = "Intervals:next-start"
name = "The first interval that starts at or after an end"
group = "Interval graphs and matching"
signals = [
    "for each interval, find the interval with the smallest start that is not before its end",
    "sort the starts once, and answer each query with a binary search",
    "pairing two sorted groups: players with trainers, jobs with workers",
]
template = '''
from bisect import bisect_left


def find_right_interval(intervals):
    starts = sorted((s, i) for i, (s, _) in enumerate(intervals))
    out = []
    for _, end in intervals:
        k = bisect_left(starts, (end, -1))  # first start >= end
        out.append(starts[k][1] if k < len(starts) else -1)
    return out
'''
pitfalls = [
    "Keep the original index with each start, because the answer is an index.",
    "Use >= for the start: an interval that starts exactly at this end is allowed.",
    "bisect on tuples: (end, -1) sorts before any (end, i) with i >= 0.",
]
examples = ["find-right-interval", "maximum-matching-of-players-with-trainers"]

