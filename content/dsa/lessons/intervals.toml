id = "Intervals:flowers"
name = "Count intervals containing a point: two sorted arrays"
group = "Line sweep"
signals = [
    "for each query time, how many intervals contain it?",
    "the number that started by t minus the number that ended before t",
    "sort the starts and the ends separately, then two binary searches per query",
]
template_name = "Flowers in bloom"
template = '''
from bisect import bisect_left, bisect_right


def full_bloom_flowers(flowers, people):
    starts = sorted(s for s, _ in flowers)
    ends = sorted(e for _, e in flowers)
    # in bloom at t: started by t, minus those that ended before t
    return [bisect_right(starts, t) - bisect_left(ends, t) for t in people]
'''
pitfalls = [
    "Closed intervals: a flower is in bloom on its last day, so count ends strictly before t (bisect_left).",
    "Starts use bisect_right: a flower that starts at t counts at t.",
    "The starts and the ends need not be paired: only their counts matter.",
]
examples = ["number-of-flowers-in-full-bloom", "maximum-population-year", "meeting-rooms-ii"]

[[extra.variant]]
name = "Maximum population year"
note = "A difference array over the years: +1 at birth, -1 at death; the first year of the maximum wins."
template = '''
def maximum_population(logs):
    delta = [0] * 101  # years 1950 .. 2050
    for born, died in logs:
        delta[born - 1950] += 1
        delta[died - 1950] -= 1  # not alive in the year of death
    best = alive = year = 0
    for i, d in enumerate(delta):
        alive += d
        if alive > best:
            best, year = alive, 1950 + i
    return year
'''

