id = "Intervals:difference-array"
name = "Range updates with a difference array"
group = "Range updates with difference arrays"
signals = [
    "many updates of the form 'add v to every position from l to r', and only the final array is asked",
    "write +v at l and -v after r, then one prefix sum rebuilds every position",
    "a capacity check over time (car pooling) is a prefix sum of the changes",
]
template_name = "Flight bookings"
template = '''
def corp_flight_bookings(bookings, n):
    diff = [0] * (n + 1)
    for first, last, seats in bookings:  # 1-based, inclusive
        diff[first - 1] += seats
        diff[last] -= seats  # stops counting after last
    out, run = [], 0
    for i in range(n):
        run += diff[i]  # the prefix sum of the changes
        out.append(run)
    return out
'''
pitfalls = [
    "The end marker goes one past the last position: size the array n + 1.",
    "Convert 1-based inputs once at the start; mixing bases causes off-by-one answers.",
    "Many updates then one rebuild is O(n + q); updating each position per query is O(n * q).",
]
examples = ["corporate-flight-bookings", "car-pooling", "increment-submatrices-by-one", "shifting-letters-ii", "zero-array-transformation-iii"]

[[extra.variant]]
name = "Car pooling (events by time)"
note = "People get on at start and off at end; the load is a running sum over the sorted times."
template = '''
from collections import defaultdict


def car_pooling(trips, capacity):
    delta = defaultdict(int)
    for people, start, end in trips:
        delta[start] += people  # get on
        delta[end] -= people  # get off before anyone boards at end
    load = 0
    for t in sorted(delta):
        load += delta[t]
        if load > capacity:
            return False
    return True
'''

[[extra.variant]]
name = "Two dimensions"
note = "Four corners per rectangle; a 2-D prefix sum rebuilds the grid."
template = '''
def range_add_queries(n, queries):
    diff = [[0] * (n + 1) for _ in range(n + 1)]
    for r1, c1, r2, c2 in queries:
        diff[r1][c1] += 1
        diff[r1][c2 + 1] -= 1
        diff[r2 + 1][c1] -= 1
        diff[r2 + 1][c2 + 1] += 1
    for r in range(n + 1):
        for c in range(n + 1):
            if r:
                diff[r][c] += diff[r - 1][c]
            if c:
                diff[r][c] += diff[r][c - 1]
            if r and c:
                diff[r][c] -= diff[r - 1][c - 1]  # counted twice
    return [row[:n] for row in diff[:n]]
'''

[[extra]]
id = "Intervals:skyline"
name = "Skyline: sweep with a heap of heights"
group = "Skyline problem"
signals = [
    "report where the maximum height changes as buildings (or intervals with weights) begin and end",
    "events sorted by x: a start pushes the height, an end only matters when it was the maximum",
    "a max-heap with lazy deletion: pop the top while its building has already ended",
]
template_name = "The skyline problem"
template = '''
import heapq


def get_skyline(buildings):
    events = sorted([(l, -h, r) for l, r, h in buildings]
                    + [(r, 0, 0) for _, r, _ in buildings])
    out, heap = [], [(0, float("inf"))]  # (negative height, right end)
    for x, neg_h, r in events:
        while heap[0][1] <= x:
            heapq.heappop(heap)  # a building that ended
        if neg_h:
            heapq.heappush(heap, (neg_h, r))
        top = -heap[0][0]
        if not out or out[-1][1] != top:
            out.append([x, top])  # the height changed here
    return out
'''
pitfalls = [
    "Sort starts with higher heights first at the same x (the negative height does this): then the tallest is seen at once.",
    "Delete lazily: pop only when the top is dead, never search the heap.",
    "Record a point only when the maximum changes, otherwise equal heights are listed twice.",
]
examples = ["the-skyline-problem", "falling-squares"]

[[extra.variant]]
name = "Falling squares (range assign and max)"
note = "A square lands on the tallest thing under its span; its new height is that plus its size."
template = '''
def falling_squares(positions):
    placed = []  # (left, right, height) of squares that have landed
    out, tallest = [], 0
    for left, size in positions:
        right = left + size
        base = 0
        for l, r, h in placed:
            if l < right and left < r:  # shares some width
                base = max(base, h)
        placed.append((left, right, base + size))
        tallest = max(tallest, base + size)
        out.append(tallest)
    return out
'''

