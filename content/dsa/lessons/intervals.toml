pattern = "Intervals"
intro = "Almost every interval problem starts with a sort. Sort by start to merge or insert, sort by end to choose the most that fit, or turn each interval into two events and sweep. Decide which sort first, and the loop that follows is short."
groups = ["Merge and combine", "Intersection and subtraction", "Selection by earliest end (non-overlapping)", "Covering points and ranges", "Meeting rooms", "Line sweep", "Range updates with difference arrays", "Interval scheduling: weighted, bounded and deadline", "Calendar booking", "Gaps and free time", "Interval tree and stabbing queries", "Skyline problem", "Interval DP (cross-reference to 2-D Dynamic Programming)", "Union length and area", "Queries on intervals (offline sort + heap)", "Circular intervals", "Interval graphs and matching", "Intervals built from other data", "Core implementation patterns"]










[[technique]]
id = "Intervals:merge"
walk = "intervals-merge"
group = "Merge and combine"
template_name = "Merge overlapping"
signals = [
    "combine overlapping ranges, or insert a new range into a sorted list",
    "ask what the union of the ranges looks like",
    "sort by start, then each range either joins the last one or begins a new one",
]
template = '''
def merge_intervals(intervals):
    merged = []
    for start, end in sorted(intervals):
        if merged and start <= merged[-1][1]:  # overlaps the last one
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])
    return merged
'''
pitfalls = [
    "Take the larger end: a long interval can swallow a shorter one that follows it.",
    "Decide whether touching ranges ([1, 2] and [2, 3]) overlap. Here start <= end says yes.",
    "To insert a new interval into a sorted list, copy the ones ending before it, merge the overlapping ones into it, then copy the rest.",
]

[[technique.variant]]
name = "Insert an interval"
note = "Copy what ends before it, absorb everything it touches, copy the rest."
template = '''
def insert(intervals, new):
    out, i, n = [], 0, len(intervals)
    while i < n and intervals[i][1] < new[0]:
        out.append(intervals[i])  # entirely before
        i += 1
    while i < n and intervals[i][0] <= new[1]:
        new = [min(new[0], intervals[i][0]), max(new[1], intervals[i][1])]
        i += 1  # overlaps: absorb it
    out.append(new)
    out.extend(intervals[i:])  # entirely after
    return out
'''

[[technique.variant]]
name = "Count groups of overlapping ranges"
note = "Each group of ranges that overlap (directly or through others) is a component; every group is split in two ways."
template = '''
def count_ways(ranges):
    groups, end = 0, -1  # end: the furthest end of the current group
    for start, stop in sorted(ranges):
        if start > end:  # no overlap with the group so far
            groups += 1
        end = max(end, stop)
    return pow(2, groups, 10**9 + 7)
'''

[[technique]]
id = "Intervals:by-end"
group = "Selection by earliest end (non-overlapping)"
signals = [
    "keep as many non-overlapping intervals as possible, or remove as few as possible",
    "schedule the most meetings, arrows or tasks",
    "finishing early leaves the most room for what is left",
]
template = '''
def min_removals(intervals):
    removed, last_end = 0, float("-inf")
    for start, end in sorted(intervals, key=lambda iv: iv[1]):
        if start >= last_end:  # fits after the last kept interval
            last_end = end
        else:
            removed += 1  # overlaps: drop it (it ends no earlier)
    return removed
'''
pitfalls = [
    "Sort by END, not by start. Sorting by start can keep a long interval that blocks many short ones.",
    "Intervals that only touch (end equal to the next start) don't overlap.",
    "The kept intervals are the most that fit, so the removals are the total minus the kept.",
]

[[technique]]
id = "Intervals:calendar"
group = "Calendar booking"
template_name = "No double booking"
signals = [
    "bookings arrive one at a time and each must be checked against the existing ones",
    "reject a booking that overlaps, or count the most overlapping at once",
    "a sorted list of starts lets you check only the neighbours",
]
template = '''
from bisect import bisect_right, insort


class Calendar:
    def __init__(self):
        self.starts = []  # sorted start times
        self.ends = {}    # start -> end

    def book(self, start, end):
        i = bisect_right(self.starts, start)
        if i and self.ends[self.starts[i - 1]] > start:
            return False  # the previous booking runs into this one
        if i < len(self.starts) and self.starts[i] < end:
            return False  # this one runs into the next booking
        insort(self.starts, start)
        self.ends[start] = end
        return True
'''
pitfalls = [
    "Only the neighbours before and after the new start can overlap it, because the stored ones don't overlap each other.",
    "Intervals are half-open here: [10, 20) and [20, 30) don't overlap.",
    "A double booking that is allowed up to a limit needs counting (a sweep over events) instead of this check.",
]

[[technique.variant]]
name = "At most two at once"
note = "Keep the booked ranges and the ranges that are already double booked; a new range must avoid the second list."
template = '''
class MyCalendarTwo:
    def __init__(self):
        self.booked, self.double = [], []

    def book(self, start, end):
        for s, e in self.double:
            if start < e and s < end:
                return False  # it would be the third booking
        for s, e in self.booked:
            if start < e and s < end:
                self.double.append((max(s, start), min(e, end)))
        self.booked.append((start, end))
        return True
'''

[[technique.variant]]
name = "Largest overlap so far"
note = "Count changes at the start and end points; the answer is the maximum running sum."
template = '''
from collections import defaultdict


class MyCalendarThree:
    def __init__(self):
        self.delta = defaultdict(int)

    def book(self, startTime, endTime):
        self.delta[startTime] += 1
        self.delta[endTime] -= 1
        cur = best = 0
        for t in sorted(self.delta):
            cur += self.delta[t]
            best = max(best, cur)
        return best
'''

[[technique]]
id = "Intervals:sweep"
walk = "intervals-sweep"
group = "Line sweep"
signals = [
    "how many ranges overlap at the busiest moment (meeting rooms)",
    "for each query point, the smallest range that contains it",
    "turn each range into a start event and an end event, then process them in time order",
]
template = '''
import heapq


def min_rooms(intervals):
    rooms = []  # a min-heap of the end times of the meetings in progress
    for start, end in sorted(intervals):
        if rooms and rooms[0] <= start:  # the earliest room is free again
            heapq.heapreplace(rooms, end)
        else:
            heapq.heappush(rooms, end)
    return len(rooms)
'''
pitfalls = [
    "Process an end before a start at the same time, so a meeting that ends at 10 frees its room for one starting at 10.",
    "The size of the heap at any moment is the number of overlapping meetings. Its largest size is the answer.",
    "Sorting the starts and the ends separately and walking both with two pointers does the same without a heap.",
]

[[extra]]
id = "Intervals:intersect"
name = "Intersection of two sorted interval lists"
group = "Intersection and subtraction"
signals = [
    "two lists of disjoint intervals, each sorted, and you want where both are active",
    "two pointers: the interval that ends first cannot overlap anything later in the other list",
    "the overlap of two intervals is [max of the starts, min of the ends]",
]
template = '''
def interval_intersection(a, b):
    out, i, j = [], 0, 0
    while i < len(a) and j < len(b):
        lo = max(a[i][0], b[j][0])
        hi = min(a[i][1], b[j][1])
        if lo <= hi:
            out.append([lo, hi])  # they share [lo, hi]
        if a[i][1] < b[j][1]:
            i += 1  # this one ends first: nothing later matches it
        else:
            j += 1
    return out
'''
pitfalls = [
    "Advance the pointer of the interval that ends first, not the one that starts first.",
    "A single shared point counts (lo == hi) when the ends are closed.",
    "For k lists, merge them pairwise or sweep all the events together.",
]
examples = ["interval-list-intersections"]

[[extra]]
id = "Intervals:stab-k"
name = "At least k points inside every interval"
group = "Covering points and ranges"
signals = [
    "choose the fewest integers so that every interval contains at least two of them",
    "sort by the right end (largest start first on a tie) and look at the two newest points",
    "a point placed as far right as possible helps the most later intervals",
]
template = '''
def intersection_size_two(intervals):
    intervals = sorted(intervals, key=lambda i: (i[1], -i[0]))
    a, b = -1, -1  # the two largest chosen points, a < b
    count = 0
    for s, e in intervals:
        if s > b:  # none of the chosen points is inside
            a, b = e - 1, e
            count += 2
        elif s > a:  # only b is inside: add one more
            count += 1
            if e == b:
                a, b = e - 1, e  # b stays; the new point is just below
            else:
                a, b = b, e
    return count
'''
pitfalls = [
    "Sort by end ascending and start descending: the interval that is contained in another one comes first.",
    "Only the last two points matter: earlier intervals end before them and are already satisfied.",
    "When the only point inside is b and e == b, the new point is e - 1, not e again.",
]
examples = ["set-intersection-size-at-least-two", "minimum-number-of-arrows-to-burst-balloons"]

[[extra]]
id = "Intervals:room-heap"
walk = "intervals-sweep"
name = "Which room: a heap of free rooms and a heap of busy ones"
group = "Meeting rooms"
signals = [
    "each meeting takes the lowest-numbered free room, or waits for the first room to free up",
    "two heaps: free room numbers, and (end time, room) of the busy ones",
    "the output is a count per room or the room of one meeting",
]
template_name = "Most booked room"
template = '''
import heapq


def most_booked(n, meetings):
    meetings = sorted(meetings)
    free = list(range(n))  # heap of free room numbers
    busy = []  # heap of (end time, room)
    used = [0] * n
    for start, end in meetings:
        while busy and busy[0][0] <= start:
            _, room = heapq.heappop(busy)
            heapq.heappush(free, room)  # that room is free again
        if free:
            room = heapq.heappop(free)
            heapq.heappush(busy, (end, room))
        else:
            t, room = heapq.heappop(busy)  # wait for the first room
            heapq.heappush(busy, (t + end - start, room))
        used[room] += 1
    return used.index(max(used))
'''
pitfalls = [
    "Free every room whose meeting has ended by this start before deciding: only then is the lowest number known.",
    "A delayed meeting keeps its length: the new end is the room's end plus the duration, not the original end.",
    "On a tie of counts return the smallest room number: index(max(...)) does exactly that.",
]
examples = ["meeting-rooms-iii", "the-number-of-the-smallest-unoccupied-chair"]

[[extra.variant]]
name = "Smallest unoccupied chair"
note = "Arrivals in order; a heap of free chairs and a heap of (leave time, chair)."
template = '''
import heapq


def smallest_chair(times, target_friend):
    order = sorted(range(len(times)), key=lambda i: times[i][0])
    free = list(range(len(times)))  # a heap of free chairs
    leaving = []  # heap of (leave time, chair)
    for i in order:
        arrive, leave = times[i]
        while leaving and leaving[0][0] <= arrive:
            heapq.heappush(free, heapq.heappop(leaving)[1])
        chair = heapq.heappop(free)
        if i == target_friend:
            return chair
        heapq.heappush(leaving, (leave, chair))
'''

