template_name = "Summary ranges"
template = '''
def summary_ranges(nums):
    out, i = [], 0
    while i < len(nums):
        j = i
        while j + 1 < len(nums) and nums[j + 1] == nums[j] + 1:
            j += 1  # extend the run
        out.append(str(nums[i]) if i == j else f"{nums[i]}->{nums[j]}")
        i = j + 1
    return out
'''
pitfalls = [
    "A run of one is printed as a single number, not 'a->a'.",
    "Compare with the previous element (+1), not with the first of the run.",
    "Avoid overflow thinking in other languages: nums[j] + 1 may overflow a 32-bit int.",
]
examples = ["summary-ranges", "add-bold-tag-in-string", "smallest-range-covering-elements-from-k-lists"]

[[extra.variant]]
name = "Add bold tags (mark, then merge runs)"
note = "Mark every character covered by an occurrence; each maximal run of marks is one tag."
template = '''
def add_bold_tag(s, words):
    bold = [False] * len(s)
    for w in words:
        start = s.find(w)
        while start != -1:
            for k in range(start, start + len(w)):
                bold[k] = True
            start = s.find(w, start + 1)  # overlapping occurrences count
    out, i = [], 0
    while i < len(s):
        if bold[i]:
            j = i
            while j < len(s) and bold[j]:
                j += 1
            out.append("<b>" + s[i:j] + "</b>")
            i = j
        else:
            out.append(s[i])
            i += 1
    return "".join(out)
'''

[[extra.variant]]
name = "Smallest range covering k lists (heap)"
note = "Keep one element per list in a min-heap and the current maximum; advance the list of the minimum."
template = '''
import heapq


def smallest_range(nums):
    heap = [(row[0], i, 0) for i, row in enumerate(nums)]
    heapq.heapify(heap)
    hi = max(row[0] for row in nums)
    best = [heap[0][0], hi]
    while True:
        lo, i, j = heapq.heappop(heap)
        if hi - lo < best[1] - best[0]:
            best = [lo, hi]
        if j + 1 == len(nums[i]):
            return best  # one list has no more elements
        nxt = nums[i][j + 1]
        hi = max(hi, nxt)
        heapq.heappush(heap, (nxt, i, j + 1))
'''

[[extra]]
id = "Intervals:weighted-k"
name = "Weighted intervals with at most k picks"
group = "Interval scheduling: weighted, bounded and deadline"
signals = [
    "choose at most k non-overlapping events to maximise the total value",
    "sort by end; for each event the compatible earlier events are a prefix, found by binary search",
    "a table over (how many events used, how many events considered)",
]
template = '''
from bisect import bisect_left


def max_value(events, k):
    events = sorted(events, key=lambda e: e[1])  # by end day
    ends = [e[1] for e in events]
    n = len(events)
    # best[j][i]: the most value using at most j of the first i events
    best = [[0] * (n + 1) for _ in range(k + 1)]
    for i, (s, e, v) in enumerate(events):
        p = bisect_left(ends, s, 0, i)  # events that end before day s
        for j in range(1, k + 1):
            best[j][i + 1] = max(best[j][i], best[j - 1][p] + v)
    return best[k][n]
'''
pitfalls = [
    "Two events may not share a day: the compatible ones end strictly before s (bisect_left), not on s.",
    "The number of picks is part of the state: a greedy by value or by end is wrong here.",
    "Iterate over events in the outer loop and picks in the inner one, so best[j - 1][p] is already final.",
]
examples = ["maximum-number-of-events-that-can-be-attended-ii", "maximum-profit-in-job-scheduling"]

