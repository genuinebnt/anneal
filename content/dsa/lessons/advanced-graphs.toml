pattern = "Advanced Graphs"
intro = "These are the graph algorithms you name rather than invent: shortest paths with costs, minimum spanning trees, paths that use every edge, and cuts. Each is a template you adapt. Know which question it answers and what it needs from the input (no negative edges, at most k edges, an undirected graph)."
groups = ["Shortest paths", "Minimum spanning trees", "Connectivity and graph decomposition", "Matching and bipartite graphs", "Network flow", "Graph dynamic programming", "Eulerian and Hamiltonian", "Backtracking and enumeration", "Advanced connectivity and offline algorithms", "Specialized graph algorithms", "Cycle detection and graph properties"]










[[technique]]
id = "Advanced Graphs:dijkstra"
walk = "graph-dijkstra"
group = "Shortest paths"
signals = [
    "shortest path or cheapest cost where edges have different non-negative weights",
    "time for a signal to reach every node, or the route with the least effort",
    "BFS would be right if all the edges cost the same",
]
template = '''
import heapq


def dijkstra(n, edges, source):
    # edges are directed (u, v, weight). Returns every node's distance.
    graph = [[] for _ in range(n)]
    for u, v, w in edges:
        graph[u].append((v, w))
    dist = [float("inf")] * n
    dist[source] = 0
    heap = [(0, source)]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]:
            continue  # a shorter path to u was already found
        for v, w in graph[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(heap, (dist[v], v))
    return dist
'''
pitfalls = [
    "Negative edges break it: use Bellman-Ford.",
    "Skip stale heap entries (d > dist[u]). Without that check it is still correct but slower.",
    "Unreached nodes stay at infinity. Check for that before using the answer.",
    "To minimise something other than a sum (the largest edge on the path), the same heap works with a different combine step.",
]

[[technique]]
id = "Advanced Graphs:euler"
group = "Eulerian and Hamiltonian"
signals = [
    "use every edge exactly once (every ticket, every road)",
    "the lexicographically smallest valid route",
    "an itinerary or a path that retraces nothing",
]
template = '''
from collections import defaultdict


def find_itinerary(tickets, start="JFK"):
    graph = defaultdict(list)
    for a, b in sorted(tickets, reverse=True):  # pop() gives the smallest
        graph[a].append(b)
    route = []

    def visit(city):
        while graph[city]:
            visit(graph[city].pop())
        route.append(city)  # added only once the city has no tickets left

    visit(start)
    return route[::-1]
'''
pitfalls = [
    "Add a city to the route after exploring all its tickets (post-order), then reverse. A dead end then lands at the end.",
    "Don't try to pick the right branch greedily: Hierholzer's algorithm fixes dead ends by itself.",
    "Sorting the tickets in reverse lets you pop the smallest next city in O(1).",
]

[[technique]]
id = "Advanced Graphs:mst"
walk = "graph-kruskal"
group = "Minimum spanning trees"
signals = [
    "connect every point or node as cheaply as possible",
    "choose edges so the whole graph is connected with the least total weight",
    "no cycles are needed: n nodes need exactly n - 1 edges",
]
template = '''
def min_spanning_tree(n, edges):
    # Kruskal: take the cheapest edge that joins two separate groups.
    parent = list(range(n))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    total = used = 0
    for w, u, v in sorted(edges):
        ru, rv = find(u), find(v)
        if ru != rv:
            parent[ru] = rv
            total += w
            used += 1
    return total if used == n - 1 else -1  # -1: the graph isn't connected
'''
pitfalls = [
    "Kruskal sorts edges and uses union-find. Prim grows from one node with a heap, which suits dense graphs where edges are computed from points.",
    "Check you used n - 1 edges. Fewer means the graph has several parts.",
    "For points in a plane the edges are all pairs, so Prim with an array is O(n squared) and avoids building them.",
]

[[technique]]
id = "Advanced Graphs:bellman"
group = "Shortest paths"
signals = [
    "the cheapest path using at most k edges (or k stops)",
    "edges may have negative weights",
    "relaxing every edge k times gives paths of up to k edges",
]
template = '''
def cheapest_within_k(n, flights, src, dst, k):
    # flights are (from, to, price). At most k stops, so k + 1 flights.
    cost = [float("inf")] * n
    cost[src] = 0
    for _ in range(k + 1):
        nxt = cost[:]  # read last round's costs, so a round adds one edge
        for u, v, w in flights:
            if cost[u] + w < nxt[v]:
                nxt[v] = cost[u] + w
        cost = nxt
    return -1 if cost[dst] == float("inf") else cost[dst]
'''
pitfalls = [
    "Copy the costs each round. Updating in place lets a path use more than one new edge per round, which breaks the limit.",
    "k stops means k + 1 edges.",
    "Dijkstra can't enforce the edge limit on its own, because the cheapest path to a node may use too many edges.",
]

[[technique]]
id = "Advanced Graphs:floyd"
group = "Shortest paths"
signals = [
    "shortest distance between every pair of nodes",
    "a small number of nodes (a few hundred at most)",
    "many queries about pairs: the cost of converting one thing into another",
]
template = '''
def all_pairs(n, edges):
    INF = float("inf")
    dist = [[0 if i == j else INF for j in range(n)] for i in range(n)]
    for u, v, w in edges:
        dist[u][v] = min(dist[u][v], w)
    for k in range(n):  # allow k as an intermediate stop
        for i in range(n):
            for j in range(n):
                if dist[i][k] + dist[k][j] < dist[i][j]:
                    dist[i][j] = dist[i][k] + dist[k][j]
    return dist
'''
pitfalls = [
    "The loop over the intermediate node k must be the OUTERMOST one.",
    "O(n cubed): fine for n up to a few hundred, too slow beyond that.",
    "Keep the cheapest of several parallel edges, not the last one.",
]

[[technique]]
id = "Advanced Graphs:cycles"
group = "Cycle detection and graph properties"
signals = [
    "every node has exactly one outgoing edge (a function from nodes to nodes)",
    "the longest cycle, or the length of the cycle a node ends up in",
    "following the edges from any node eventually repeats",
]
template = '''
def longest_cycle(nxt):
    # nxt[i] is the single node that i points to (or -1 for none).
    n = len(nxt)
    seen_at = [None] * n  # which walk first visited a node, and when
    best = -1
    for start in range(n):
        if seen_at[start] is not None:
            continue
        node, step = start, 0
        while node != -1 and seen_at[node] is None:
            seen_at[node] = (start, step)
            node, step = nxt[node], step + 1
        if node != -1 and seen_at[node][0] == start:  # back in this walk
            best = max(best, step - seen_at[node][1])
    return best
'''
pitfalls = [
    "Remember which walk visited a node. Reaching a node from an earlier walk means no new cycle.",
    "Only a node reached again in the same walk closes a cycle, and the cycle's length is the step difference.",
    "Each node is visited once overall, so it is O(n).",
]

[[technique]]
id = "Advanced Graphs:articulation"
group = "Connectivity and graph decomposition"
signals = [
    "which single edge or node, if removed, disconnects the graph",
    "the minimum days or edges to split a network",
    "critical connections, bridges or cut points",
]
template = '''
def bridges_and_cut_points(n, edges):
    graph = [[] for _ in range(n)]
    for a, b in edges:
        graph[a].append(b)
        graph[b].append(a)
    order = [-1] * n  # the time each node was first reached
    low = [0] * n     # earliest time reachable by going down, one back edge
    bridges, cuts, time = [], set(), [0]

    def dfs(u, parent):
        order[u] = low[u] = time[0]
        time[0] += 1
        children = 0
        for v in graph[u]:
            if v == parent:
                continue
            if order[v] == -1:
                children += 1
                dfs(v, u)
                low[u] = min(low[u], low[v])
                if low[v] > order[u]:
                    bridges.append((u, v))
                if parent != -1 and low[v] >= order[u]:
                    cuts.add(u)
            else:
                low[u] = min(low[u], order[v])
        if parent == -1 and children > 1:
            cuts.add(u)

    for s in range(n):
        if order[s] == -1:
            dfs(s, -1)
    return bridges, sorted(cuts)
'''
pitfalls = [
    "An edge is a bridge when the subtree below it can't reach back above (low[v] > order[u]). A node is a cut point when low[v] >= order[u] for a child.",
    "The root is a cut point only if it has more than one DFS child.",
    "Skip the edge back to the parent, but with parallel edges skip it only once.",
]

[[extra]]
id = "Advanced Graphs:zero-one-bfs"
name = "0-1 BFS"
group = "Shortest paths"
signals = [
    "every edge costs 0 or 1: a turn or no turn, a wall to break or not, a flip or a keep",
    "a shortest path where some moves are free",
    "Dijkstra works, but a heap is more machinery than two kinds of cost need",
]
template = '''
from collections import deque


def zero_one_bfs(graph, src):
    """graph[u] = [(v, w)] with w in {0, 1}: distance to every node."""
    dist = {u: float("inf") for u in graph}
    dist[src] = 0
    queue = deque([src])
    while queue:
        u = queue.popleft()
        for v, w in graph[u]:
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
                if w == 0:
                    queue.appendleft(v)  # free: as near as u
                else:
                    queue.append(v)
    return dist
'''
pitfalls = [
    "A free edge goes to the front of the deque; both ends to the back is plain BFS and gives wrong answers.",
    "A node can be queued twice: the distance check discards the stale entry.",
    "On a grid the cost is often on the move (turning costs 1), not on the cell.",
]
examples = ["minimum-obstacle-removal-to-reach-corner", "minimum-cost-to-make-at-least-one-valid-path-in-a-grid"]

[[extra]]
id = "Advanced Graphs:dijkstra-products"
name = "Dijkstra with products and with path counts"
group = "Shortest paths"
signals = [
    "the most probable path: multiply probabilities and maximise instead of adding and minimising",
    "how many shortest paths lead to the destination: carry a count next to each distance",
    "any cost that only gets worse along a path keeps Dijkstra correct",
]
template_name = "Path with maximum probability"
template = '''
import heapq


def max_probability(n, edges, succ_prob, start, end):
    adj = [[] for _ in range(n)]
    for (a, b), p in zip(edges, succ_prob):
        adj[a].append((b, p))
        adj[b].append((a, p))
    best = [0.0] * n
    best[start] = 1.0
    heap = [(-1.0, start)]  # a max-heap of probabilities, negated
    while heap:
        neg, u = heapq.heappop(heap)
        if u == end:
            return -neg
        if -neg < best[u]:
            continue  # a stale entry
        for v, p in adj[u]:
            if best[u] * p > best[v]:
                best[v] = best[u] * p
                heapq.heappush(heap, (-best[v], v))
    return 0.0
'''
pitfalls = [
    "A probability never exceeds 1, so extending a path never helps: that is the property Dijkstra needs.",
    "Negate the probability to use heapq as a max-heap.",
    "Skip stale heap entries whose value is worse than the best known.",
]
examples = ["path-with-maximum-probability", "number-of-ways-to-arrive-at-destination", "minimum-time-to-visit-a-cell-in-a-grid", "second-minimum-time-to-reach-destination"]

[[extra.variant]]
name = "Number of ways to arrive"
note = "When a path ties the best distance, add the number of ways; when it beats it, replace."
template = '''
import heapq


def count_paths(n, roads):
    adj = [[] for _ in range(n)]
    for a, b, t in roads:
        adj[a].append((b, t))
        adj[b].append((a, t))
    dist, ways = [float("inf")] * n, [0] * n
    dist[0], ways[0] = 0, 1
    heap = [(0, 0)]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]:
            continue
        for v, t in adj[u]:
            if d + t < dist[v]:
                dist[v], ways[v] = d + t, ways[u]  # a strictly better path
                heapq.heappush(heap, (dist[v], v))
            elif d + t == dist[v]:
                ways[v] = (ways[v] + ways[u]) % (10**9 + 7)  # a tie
    return ways[n - 1] % (10**9 + 7)
'''

[[extra.variant]]
name = "Minimum time to visit a cell (waiting)"
note = "A cell opens at time grid[r][c]; if you arrive early you can bounce between two cells until it opens, losing a parity."
template = '''
import heapq


def minimum_time(grid):
    rows, cols = len(grid), len(grid[0])
    if grid[0][1] > 1 and grid[1][0] > 1:
        return -1  # stuck at the start: no neighbour opens at time 1
    best = [[float("inf")] * cols for _ in range(rows)]
    best[0][0] = 0
    heap = [(0, 0, 0)]
    while heap:
        t, r, c = heapq.heappop(heap)
        if (r, c) == (rows - 1, cols - 1):
            return t
        if t > best[r][c]:
            continue
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < rows and 0 <= b < cols:
                need = max(t + 1, grid[a][b])
                if (need - t) % 2 == 0:
                    need += 1  # waiting costs even steps: fix the parity
                if need < best[a][b]:
                    best[a][b] = need
                    heapq.heappush(heap, (need, a, b))
'''

