id = "Advanced Graphs:group-bfs"
name = "BFS over groups instead of nodes"
group = "Shortest paths"
signals = [
    "the fewest buses (or trains, airlines) to get from a stop to another",
    "a node is a route, and two routes are neighbours when they share a stop",
    "a map from stop to the routes that serve it avoids comparing every pair of routes",
]
template_name = "Bus routes"
template = '''
from collections import defaultdict, deque


def num_buses_to_destination(routes, source, target):
    if source == target:
        return 0
    stops = defaultdict(list)  # stop -> the routes that serve it
    for i, route in enumerate(routes):
        for s in route:
            stops[s].append(i)
    queue, seen_routes, seen_stops = deque([(source, 0)]), set(), {source}
    while queue:
        stop, buses = queue.popleft()
        for r in stops[stop]:
            if r in seen_routes:
                continue  # this route was already ridden
            seen_routes.add(r)
            for nxt in routes[r]:
                if nxt == target:
                    return buses + 1
                if nxt not in seen_stops:
                    seen_stops.add(nxt)
                    queue.append((nxt, buses + 1))
    return -1
'''
pitfalls = [
    "Count buses, not stops: boarding a route costs one, riding along it is free.",
    "Mark a route as used the first time it is boarded: all its stops are then reached in the same number of buses.",
    "Without the stop-to-routes map the neighbour search is quadratic in the number of routes.",
]
examples = ["bus-routes"]

[[extra]]
id = "Advanced Graphs:flip-one"
name = "Component sizes, then try one change"
group = "Connectivity and graph decomposition"
signals = [
    "the largest island after turning at most one 0 into a 1",
    "label every island with its size first, then for each 0 add the sizes of the distinct islands around it",
    "count each neighbouring island only once per cell",
]
template_name = "Making a large island"
template = '''
def largest_island(grid):
    n = len(grid)
    size, label = {}, 2  # island ids start at 2: 0 and 1 are taken
    for r in range(n):
        for c in range(n):
            if grid[r][c] == 1:
                stack, grid[r][c], count = [(r, c)], label, 0
                while stack:
                    a, b = stack.pop()
                    count += 1
                    for x, y in ((a + 1, b), (a - 1, b),
                                 (a, b + 1), (a, b - 1)):
                        if 0 <= x < n and 0 <= y < n and grid[x][y] == 1:
                            grid[x][y] = label
                            stack.append((x, y))
                size[label] = count
                label += 1
    best = max(size.values(), default=0)
    for r in range(n):
        for c in range(n):
            if grid[r][c] == 0:
                around = ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1))
                near = {grid[x][y] for x, y in around
                        if 0 <= x < n and 0 <= y < n and grid[x][y] > 1}
                # the cell itself plus every distinct island around it
                best = max(best, 1 + sum(size[i] for i in near))
    return best
'''
pitfalls = [
    "Use a set of neighbouring island ids: the same island may touch the cell on two sides.",
    "Start labels at 2 so they differ from the original 0 and 1.",
    "If there is no 0, the answer is the size of the grid (the max size already holds it).",
]
examples = ["making-a-large-island", "minimum-number-of-days-to-disconnect-island"]

[[extra.variant]]
name = "Days to disconnect an island"
note = "The answer is 0, 1 or 2: check whether it is already disconnected, then whether removing any single land cell disconnects it."
template = '''
def min_days(grid):
    rows, cols = len(grid), len(grid[0])

    def islands():
        seen, count = set(), 0
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] and (r, c) not in seen:
                    count += 1
                    stack = [(r, c)]
                    seen.add((r, c))
                    while stack:
                        a, b = stack.pop()
                        for x, y in ((a + 1, b), (a - 1, b),
                                     (a, b + 1), (a, b - 1)):
                            inside = 0 <= x < rows and 0 <= y < cols
                            if inside and grid[x][y] and (x, y) not in seen:
                                seen.add((x, y))
                                stack.append((x, y))
        return count

    if islands() != 1:
        return 0  # disconnected (or empty) already
    for r in range(rows):
        for c in range(cols):
            if grid[r][c]:
                grid[r][c] = 0
                broken = islands() != 1
                grid[r][c] = 1
                if broken:
                    return 1  # one cell is a cut point
    return 2  # two removals always suffice
'''

[[extra]]
id = "Advanced Graphs:topo-constraints"
name = "Topological order from constraints"
group = "Graph dynamic programming"
signals = [
    "place numbers in a matrix so that rows and columns obey 'above' and 'left of' rules",
    "recover the alphabet order from sorted words, or check that a sequence is the only order",
    "a unique order exists only when the queue never holds more than one node",
]
template_name = "Build a matrix with conditions"
template = '''
from collections import deque


def build_matrix(k, row_conditions, col_conditions):
    def topo(conditions):
        adj = [[] for _ in range(k + 1)]
        indeg = [0] * (k + 1)
        for a, b in conditions:
            adj[a].append(b)
            indeg[b] += 1
        queue = deque(i for i in range(1, k + 1) if indeg[i] == 0)
        order = []
        while queue:
            u = queue.popleft()
            order.append(u)
            for v in adj[u]:
                indeg[v] -= 1
                if indeg[v] == 0:
                    queue.append(v)
        return order if len(order) == k else None  # a cycle: impossible

    rows, cols = topo(row_conditions), topo(col_conditions)
    if rows is None or cols is None:
        return []
    col_of = {v: i for i, v in enumerate(cols)}
    grid = [[0] * k for _ in range(k)]
    for r, v in enumerate(rows):
        grid[r][col_of[v]] = v  # row from one order, column from the other
    return grid
'''
pitfalls = [
    "The row order and the column order are independent problems: solve each with its own topological sort.",
    "A cycle in either set of conditions makes the matrix impossible.",
    "A number goes to (its position in the row order, its position in the column order).",
]
examples = ["build-a-matrix-with-conditions", "alien-dictionary", "sequence-reconstruction"]

