id = "Advanced Graphs:floyd-small"
name = "Floyd-Warshall for small graphs"
group = "Shortest paths"
signals = [
    "the distance between every pair of nodes, with at most a few hundred nodes",
    "the city with the fewest neighbours within a threshold, the cheapest way to convert one letter into another",
    "three nested loops: the intermediate node k is the outermost",
