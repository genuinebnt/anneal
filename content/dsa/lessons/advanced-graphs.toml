from collections import deque


def alien_order(words):
    adj = {c: set() for w in words for c in w}
    indeg = {c: 0 for c in adj}
    for a, b in zip(words, words[1:]):
        for x, y in zip(a, b):
            if x != y:
                if y not in adj[x]:
                    adj[x].add(y)
                    indeg[y] += 1
                break  # only the first difference counts
        else:
            if len(a) > len(b):
                return ""  # "abc" before "ab" is impossible
    queue = deque(c for c in adj if indeg[c] == 0)
    out = []
    while queue:
        c = queue.popleft()
        out.append(c)
        for d in adj[c]:
            indeg[d] -= 1
            if indeg[d] == 0:
                queue.append(d)
    return "".join(out) if len(out) == len(adj) else ""  # a cycle
'''

[[extra.variant]]
name = "Sequence reconstruction (unique order)"
note = "The sequence is the only valid order exactly when the queue holds one node at every step."
template = '''
from collections import deque


def sequence_reconstruction(nums, sequences):
    n = len(nums)
    adj = [[] for _ in range(n + 1)]
    indeg = [0] * (n + 1)
    for seq in sequences:
        for a, b in zip(seq, seq[1:]):
            adj[a].append(b)
            indeg[b] += 1
    queue = deque(i for i in range(1, n + 1) if indeg[i] == 0)
    order = []
    while queue:
        if len(queue) > 1:
            return False  # two candidates: the order is not unique
        u = queue.popleft()
        order.append(u)
        for v in adj[u]:
            indeg[v] -= 1
            if indeg[v] == 0:
                queue.append(v)
    return order == nums
'''

[[extra]]
id = "Advanced Graphs:prime-dsu"
name = "Union by shared prime factors"
group = "Connectivity and graph decomposition"
signals = [
    "can you travel between any two indices when numbers with a common factor are neighbours",
    "do not compare every pair: connect each number to each of its prime factors",
    "two numbers are connected when they share a prime, and a prime joins every number it divides",
]
template_name = "Greatest common divisor traversal"
template = '''
def can_traverse_all_pairs(nums):
    if len(nums) == 1:
        return True
    if 1 in nums:
        return False  # 1 has no common factor with anything
    parent = {}

    def find(x):
        parent.setdefault(x, x)
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    for x in nums:
        p, n = 2, x
        while p * p <= n:
            if n % p == 0:
                parent[find(x)] = find(p)  # connect x to its prime p
                while n % p == 0:
                    n //= p
            p += 1
        if n > 1:
            parent[find(x)] = find(n)  # the leftover prime
    return len({find(x) for x in nums}) == 1
'''
pitfalls = [
    "Connect each number to its prime factors, not to other numbers: that keeps it near-linear.",
    "A single leftover factor greater than sqrt is itself a prime.",
    "The number 1 has no prime factors: with other numbers present the answer is False.",
]
examples = ["greatest-common-divisor-traversal", "number-of-good-paths"]

[[extra.variant]]
name = "GCD sort of an array"
note = "Two numbers may swap when they share a factor: union by prime factors, then each sorted value must stay in its own component."
template = '''
def gcd_sort(nums):
    parent = {}

    def find(x):
        parent.setdefault(x, x)
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    for x in nums:
        n, p = x, 2
        while p * p <= n:
            if n % p == 0:
                parent[find(x)] = find(p)  # x and its prime p are connected
                while n % p == 0:
                    n //= p
            p += 1
        if n > 1:
            parent[find(x)] = find(n)
    # each value must be connected to the sorted value of its position
    return all(find(a) == find(b) for a, b in zip(nums, sorted(nums)))
'''

[[extra]]
id = "Advanced Graphs:two-phase"
name = "Two phases: distances first, then a path"
group = "Shortest paths"
signals = [
    "the safest path in a grid: maximise the minimum distance to any thief along the path",
    "phase one: a multi-source BFS gives every cell its distance to the nearest thief",
    "phase two: a Dijkstra with a max-heap on the smallest distance seen so far on the path",
]
template_name = "Find the safest path in a grid"
template = '''
import heapq
from collections import deque


def maximum_safeness_factor(grid):
    n = len(grid)
    dist = [[-1] * n for _ in range(n)]
    queue = deque()
    for r in range(n):
        for c in range(n):
            if grid[r][c] == 1:
                dist[r][c] = 0
                queue.append((r, c))
    while queue:  # distance to the nearest thief
        r, c = queue.popleft()
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < n and 0 <= b < n and dist[a][b] < 0:
                dist[a][b] = dist[r][c] + 1
                queue.append((a, b))
    best = [[-1] * n for _ in range(n)]
    best[0][0] = dist[0][0]
    heap = [(-dist[0][0], 0, 0)]  # the safest known path first
    while heap:
        neg, r, c = heapq.heappop(heap)
        if (r, c) == (n - 1, n - 1):
            return -neg
        if -neg < best[r][c]:
            continue
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < n and 0 <= b < n:
                safe = min(-neg, dist[a][b])  # as safe as its worst cell
                if safe > best[a][b]:
                    best[a][b] = safe
                    heapq.heappush(heap, (-safe, a, b))
'''
pitfalls = [
    "A path's safeness is the minimum distance over its cells: the same pattern as maximising the minimum edge.",
    "The BFS must start from all thieves at once.",
    "Start and end can be thieves themselves: their distance is 0, and the answer is 0.",
]
examples = ["find-the-safest-path-in-a-grid", "trapping-rain-water-ii"]

[[extra.variant]]
name = "Trapping rain water II"
note = "Water is held by the lowest wall of the boundary: pop the lowest boundary cell and fill its lower neighbours up to it."
template = '''
import heapq


def trap_rain_water(height):
    rows, cols = len(height), len(height[0])
    if rows < 3 or cols < 3:
        return 0
    heap, seen = [], set()
    for r in range(rows):
        for c in range(cols):
            if r in (0, rows - 1) or c in (0, cols - 1):
                heapq.heappush(heap, (height[r][c], r, c))  # the boundary
                seen.add((r, c))
    water = 0
    while heap:
        h, r, c = heapq.heappop(heap)  # the lowest wall so far
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < rows and 0 <= b < cols and (a, b) not in seen:
                seen.add((a, b))
                water += max(0, h - height[a][b])  # filled up to the wall
                heapq.heappush(heap, (max(h, height[a][b]), a, b))
    return water
'''

[[extra]]
id = "Advanced Graphs:diameter"
name = "Tree diameter by two searches"
group = "Specialized graph algorithms"
signals = [
    "the longest path in a tree, or the best way to join two trees by one edge",
    "BFS from any node finds one end of a diameter; BFS from that end finds the other",
    "joining two trees: the new diameter is the max of both diameters and the two radii plus one",
]
template_name = "Diameter of a tree"
template = '''
from collections import defaultdict, deque


def tree_diameter(edges):
    adj = defaultdict(list)
    for a, b in edges:
        adj[a].append(b)
        adj[b].append(a)
    if not adj:
        return 0

    def farthest(start):
        dist, queue = {start: 0}, deque([start])
        last = start
        while queue:
            u = queue.popleft()
            last = u
            for v in adj[u]:
                if v not in dist:
                    dist[v] = dist[u] + 1
                    queue.append(v)
        return last, dist[last]

    end, _ = farthest(next(iter(adj)))  # one end of the longest path
    return farthest(end)[1]
'''
pitfalls = [
    "The first BFS can start anywhere: the farthest node is always an end of some diameter.",
    "The diameter is the distance found by the second BFS.",
    "Joining at the centers of two trees gives max(d1, d2, ceil(d1 / 2) + ceil(d2 / 2) + 1).",
]
examples = ["find-minimum-diameter-after-merging-two-trees", "tree-diameter"]

[[extra.variant]]
name = "Minimum diameter after merging two trees"
note = "Connect the centres: the new diameter is the largest of the two old ones and the two radii joined by an edge."
template = '''
from collections import defaultdict, deque


def minimum_diameter_after_merge(edges1, edges2):
    def diameter(edges):
        adj = defaultdict(list)
        for a, b in edges:
            adj[a].append(b)
            adj[b].append(a)
        if not adj:
            return 0

        def far(s):
            dist, q, last = {s: 0}, deque([s]), s
            while q:
                u = q.popleft()
                last = u
                for v in adj[u]:
                    if v not in dist:
                        dist[v] = dist[u] + 1
                        q.append(v)
            return last, dist[last]

        return far(far(next(iter(adj)))[0])[1]

    d1, d2 = diameter(edges1), diameter(edges2)
    return max(d1, d2, (d1 + 1) // 2 + (d2 + 1) // 2 + 1)
'''

[[extra]]
id = "Advanced Graphs:dsu-values"
name = "Union nodes in order of value"
group = "Advanced connectivity and offline algorithms"
signals = [
    "count paths whose two ends are equal and whose inner values do not exceed them",
    "process nodes in increasing value: when a node is added, union it with neighbours that are not larger",
    "inside each component count the nodes of the current value: pairs among them are good paths",
]
template_name = "Number of good paths"
template = '''
from collections import defaultdict


def number_of_good_paths(vals, edges):
    n = len(vals)
    adj = [[] for _ in range(n)]
    for a, b in edges:
        adj[a].append(b)
        adj[b].append(a)
    parent = list(range(n))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    by_value = defaultdict(list)
    for i, v in enumerate(vals):
        by_value[v].append(i)
    total = n  # every single node is a path
    for v in sorted(by_value):
        for u in by_value[v]:
            for w in adj[u]:
                if vals[w] <= v:
                    parent[find(u)] = find(w)  # join not-larger neighbours
        count = defaultdict(int)
        for u in by_value[v]:
            count[find(u)] += 1  # nodes of value v in each component
        total += sum(k * (k - 1) // 2 for k in count.values())
    return total
'''
pitfalls = [
    "Union with a neighbour only when its value is at most the current one: larger nodes would break the path rule.",
    "Count the pairs inside each component only after all unions for this value are done.",
    "Add n for the single-node paths.",
]
examples = ["number-of-good-paths"]

