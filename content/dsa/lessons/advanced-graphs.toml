template_name = "City with the fewest neighbours"
template = '''
def find_the_city(n, edges, distance_threshold):
    inf = float("inf")
    dist = [[inf] * n for _ in range(n)]
    for i in range(n):
        dist[i][i] = 0
    for a, b, w in edges:
        dist[a][b] = dist[b][a] = w
    for k in range(n):  # the intermediate node is the outer loop
        for i in range(n):
            for j in range(n):
                if dist[i][k] + dist[k][j] < dist[i][j]:
                    dist[i][j] = dist[i][k] + dist[k][j]
    best, city = inf, -1
    for i in range(n):
        reach = sum(1 for j in range(n)
                    if i != j and dist[i][j] <= distance_threshold)
        if reach <= best:  # ties go to the larger city number
            best, city = reach, i
    return city
'''
pitfalls = [
    "k must be the outermost loop, or the shortest paths through later intermediates are missed.",
    "Initialise dist[i][i] = 0 and missing edges to infinity.",
    "O(n^3) time: only for small n (a few hundred).",
]
examples = ["find-the-city-with-the-smallest-number-of-neighbors-at-a-threshold-distance", "minimum-cost-to-convert-string-i"]

[[extra.variant]]
name = "Minimum cost to convert a string"
note = "Letters are nodes, a conversion is an edge with a cost; the answer sums the cheapest path per position."
template = '''
def minimum_cost(source, target, original, changed, cost):
    inf = float("inf")
    dist = [[inf] * 26 for _ in range(26)]
    for i in range(26):
        dist[i][i] = 0
    for a, b, c in zip(original, changed, cost):
        x, y = ord(a) - 97, ord(b) - 97
        dist[x][y] = min(dist[x][y], c)  # several rules for one pair
    for k in range(26):
        for i in range(26):
            for j in range(26):
                dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])
    total = 0
    for s, t in zip(source, target):
        d = dist[ord(s) - 97][ord(t) - 97]
        if d == inf:
            return -1
        total += d
    return total
'''

[[extra]]
id = "Advanced Graphs:kruskal-types"
name = "Kruskal with edge types"
group = "Minimum spanning trees"
signals = [
    "keep the graph connected for two people with different edge types, deleting as many edges as possible",
    "shared edges first: they help both; then each person's own edges",
    "an edge is removable when it joins nodes that are already connected",
]
template_name = "Remove the maximum number of edges"
template = '''
def max_num_edges_to_remove(n, edges):
    def make():
        return list(range(n + 1))

    def find(p, x):
        while p[x] != x:
            p[x] = p[p[x]]
            x = p[x]
        return x

    alice, bob = make(), make()
    used = 0

    def union(p, a, b):
        ra, rb = find(p, a), find(p, b)
        if ra == rb:
            return False
        p[ra] = rb
        return True

    for t, a, b in edges:  # shared edges (type 3) first
        if t == 3:
            ok_a, ok_b = union(alice, a, b), union(bob, a, b)
            used += ok_a or ok_b  # useful for at least one of them
    for t, a, b in edges:
        if t == 1:
            used += union(alice, a, b)
        elif t == 2:
            used += union(bob, a, b)
    ca = len({find(alice, i) for i in range(1, n + 1)})
    cb = len({find(bob, i) for i in range(1, n + 1)})
    return len(edges) - used if ca == 1 and cb == 1 else -1
'''
pitfalls = [
    "Process the shared edges first: one shared edge replaces two private ones.",
    "An edge is kept only if it merges two components for at least one of the people.",
    "At the end both people must see a single component, or the answer is -1.",
]
examples = ["remove-max-number-of-edges-to-keep-graph-fully-traversable", "find-critical-and-pseudo-critical-edges-in-minimum-spanning-tree"]

