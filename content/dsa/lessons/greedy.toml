name = "H-index"
note = "A paper cited more than n times counts as n; walk h downwards until enough papers reach it."
template = '''
def h_index(citations):
    n = len(citations)
    count = [0] * (n + 1)
    for c in citations:
        count[min(c, n)] += 1  # more than n citations still counts as n
    total = 0
    for h in range(n, -1, -1):
        total += count[h]  # papers with at least h citations
        if total >= h:
            return h
    return 0
'''

