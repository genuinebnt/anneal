    "of all that are currently affordable, the most profitable is always right",
    "sort by cost to unlock, push into a max-heap as the budget grows",
]
template = '''
import heapq


def find_maximized_capital(k, w, profits, capital):
    projects = sorted(zip(capital, profits))
    heap, i = [], 0  # heap: profits of affordable projects (negated)
    for _ in range(k):
        while i < len(projects) and projects[i][0] <= w:
            heapq.heappush(heap, -projects[i][1])
            i += 1
        if not heap:
            break  # nothing affordable
        w -= heapq.heappop(heap)  # take the most profitable
    return w
'''
