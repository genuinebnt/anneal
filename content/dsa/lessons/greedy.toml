]
template = '''
def make_integer_beautiful(n, target):
    def digit_sum(x):
        return sum(map(int, str(x)))

    x, step = n, 10
    while digit_sum(x) > target:
        x = (x // step + 1) * step  # round up: the low digits become 0
        step *= 10
    return x - n
'''
