name = "Monotone stack: the smallest result after removals"
group = "Stack-based greedy"
signals = [
    "remove k characters (digits) so that what is left is as small as possible, keeping the order",
    "a bigger digit followed by a smaller one should go: the earlier position matters more",
    "keep a stack that is non-decreasing, popping while a removal is still allowed",
]
template_name = "Remove k digits"
template = '''
def remove_k_digits(num, k):
    stack = []
    for d in num:
        while k and stack and stack[-1] > d:
            stack.pop()  # a smaller digit later beats a bigger one here
            k -= 1
        stack.append(d)
    stack = stack[:len(stack) - k]  # still removing: cut from the end
    return "".join(stack).lstrip("0") or "0"
'''
