[[extra]]
id = "Greedy:two-pass"
name = "Two passes: left to right, then right to left"
group = "Candy two-pass"
signals = [
    "each element depends on both neighbours, or on everything to its left and to its right",
    "one pass can satisfy only one side: the second pass repairs the other side",
    "prefix and suffix information combine at each position",
]
template_name = "Candy"
template = '''
def candy(ratings):
    n = len(ratings)
    give = [1] * n
    for i in range(1, n):  # left to right: beat the left neighbour
        if ratings[i] > ratings[i - 1]:
            give[i] = give[i - 1] + 1
    for i in range(n - 2, -1, -1):  # right to left: beat the right one
        if ratings[i] > ratings[i + 1]:
            give[i] = max(give[i], give[i + 1] + 1)
    return sum(give)
'''
pitfalls = [
    "In the second pass take the maximum with the first pass's value: overwriting would break the left condition.",
    "Equal ratings need no more candy than a neighbour: use strict > only.",
    "Each pass is O(n) and needs no sort: that is why two simple passes beat a priority queue.",
]
examples = ["candy", "shortest-distance-to-a-character", "longest-mountain-in-array", "trapping-rain-water", "product-of-array-except-self"]

[[extra.variant]]
name = "Distance to the nearest target"
note = "One pass remembers the last target on the left, the second the last on the right."
template = '''
def shortest_to_char(s, c):
    n = len(s)
    out, last = [n] * n, -n  # last: the closest c on the left
    for i in range(n):
        if s[i] == c:
            last = i
        out[i] = i - last
    last = 2 * n
    for i in range(n - 1, -1, -1):
        if s[i] == c:
            last = i
        out[i] = min(out[i], last - i)
    return out
'''

[[extra.variant]]
name = "Longest mountain (runs)"
note = "From each peak widen over the up run and the down run; the next peak is past this mountain."
template = '''
def longest_mountain(arr):
    best, i, n = 0, 1, len(arr)
    while i < n - 1:
        if arr[i - 1] < arr[i] > arr[i + 1]:  # a peak
            lo = i - 1
            while lo > 0 and arr[lo - 1] < arr[lo]:
                lo -= 1
            hi = i + 1
            while hi < n - 1 and arr[hi] > arr[hi + 1]:
                hi += 1
            best = max(best, hi - lo + 1)
            i = hi  # nothing between here and hi can be a new peak
        else:
            i += 1
    return best
'''

