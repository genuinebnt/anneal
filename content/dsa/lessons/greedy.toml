name = "Reduce to zero by adding or removing powers of two"
note = "A run of two or more ones is cheaper to carry away (add the lowest one) than to remove bit by bit."
template = '''
def min_operations(n):
    ops = 0
    while n:
        if n & 1:
            # 11 at the bottom: add 1 to clear the run; a lone 1: remove it
            n += 1 if n & 3 == 3 else -1
            ops += 1
        n >>= 1
    return ops
'''

