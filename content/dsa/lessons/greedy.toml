]
template = '''
def bag_of_tokens_score(tokens, power):
    tokens = sorted(tokens)
    lo, hi, score, best = 0, len(tokens) - 1, 0, 0
    while lo <= hi:
        if power >= tokens[lo]:
            power -= tokens[lo]  # play the cheapest face up
            lo += 1
            score += 1
            best = max(best, score)
        elif score > 0:
            power += tokens[hi]  # trade a point for the largest power
            hi -= 1
            score -= 1
        else:
            break
    return best
'''
