    "a star can take any length, but the latest star is always the one to retry",
    "two pointers plus one saved position: O(n * m) worst, usually linear",
]
template = '''
def is_match(s, p):
    i = j = 0
    star = mark = -1  # the last * in p and where it started in s
    while i < len(s):
        if j < len(p) and p[j] in (s[i], "?"):
            i += 1
            j += 1
        elif j < len(p) and p[j] == "*":
            star, mark = j, i  # try the star taking nothing first
            j += 1
        elif star >= 0:
            mark += 1  # let the star swallow one more character
            i, j = mark, star + 1
        else:
            return False
    while j < len(p) and p[j] == "*":
        j += 1  # trailing stars match the empty string
    return j == len(p)
'''
