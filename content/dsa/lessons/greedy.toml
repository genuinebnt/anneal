id = "Greedy:jump-window"
name = "Best score over a sliding window of earlier positions"
group = "Jump game family"
signals = [
    "from position i you may have come from any of the last k positions, and each step adds a value",
    "best[i] = nums[i] + max(best[i - k .. i - 1])",
    "keep the window maxima in a monotonic deque instead of rescanning k values",
]
template = '''
from collections import deque


def max_result(nums, k):
    best = [0] * len(nums)
    best[0] = nums[0]
    window = deque([0])  # indexes whose best[] decreases from the front
    for i in range(1, len(nums)):
        while window[0] < i - k:
            window.popleft()  # out of reach
        best[i] = nums[i] + best[window[0]]
        while window and best[window[-1]] <= best[i]:
            window.pop()  # never the maximum again
        window.append(i)
    return best[-1]
'''
