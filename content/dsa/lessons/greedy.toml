name = "Remove duplicate letters"
note = "Pop a bigger letter only when it will appear again later; keep a set of the letters in the stack."
template = '''
from collections import Counter


def remove_duplicate_letters(s):
    left, inside, stack = Counter(s), set(), []
    for ch in s:
        left[ch] -= 1  # occurrences still ahead of us
        if ch in inside:
            continue
        while stack and stack[-1] > ch and left[stack[-1]] > 0:
            inside.discard(stack.pop())  # it comes again later
        stack.append(ch)
        inside.add(ch)
    return "".join(stack)
'''

[[extra.variant]]
name = "Most competitive subsequence"
note = "Keep exactly k elements: pop only while enough elements remain to refill."
template = '''
def most_competitive(nums, k):
    stack, n = [], len(nums)
    for i, x in enumerate(nums):
        # popping is safe when enough numbers remain to still reach k
        while stack and stack[-1] > x and len(stack) - 1 + n - i >= k:
            stack.pop()
        if len(stack) < k:
            stack.append(x)
    return stack
'''

