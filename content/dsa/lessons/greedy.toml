pattern = "Greedy"
intro = "A greedy solution makes the locally best choice at each step and never looks back. It is only correct when that choice can't hurt later, so the real work is the argument for why. For each idea below, the one-line reason is in the pitfalls. If you can't state it, try a small counter-example before trusting the greedy."
groups = ["Sorting-based greedy", "Interval scheduling and covering", "Jump game family", "Gas station", "Two-pointer greedy", "Heap-assisted greedy", "Exchange arguments", "Stack-based greedy", "Number construction", "Partition labels", "Candy two-pass", "Stock problems", "Activity selection", "Huffman", "Greedy on graphs", "Counting greedy", "Bit greedy", "When greedy fails", "Running-state scans", "Window flips and grouping", "Greedy simulation", "Core implementation patterns"]










[[technique]]
id = "Greedy:scan-balance"
group = "Running-state scans"
signals = [
    "one pass over the data keeping a running total, a balance or a count",
    "every rise (or deposit) is worth collecting on its own",
    "decisions at each step don't depend on what comes later",
]
template = '''
def max_profit_unlimited(prices):
    # Buy and sell as often as you like: collect every rise.
    profit = 0
    for today, yesterday in zip(prices[1:], prices):
        profit += max(0, today - yesterday)
    return profit
'''
pitfalls = [
    "A long rise from a to b is the sum of its day-to-day rises, so splitting it into one-day trades loses nothing.",
    "This works because there is no limit on trades. With a fee or a cooldown you need a DP.",
    "Name what the running value means (profit, change in hand, open brackets) and check it stays valid after each step.",
]

[[technique]]
id = "Greedy:sort-pick"
group = "Sorting-based greedy"
signals = [
    "choose as many items as possible under a budget, or the best few of a list",
    "the order of the items does not matter, only their values",
    "after sorting, the best choice at each step is obvious",
]
template = '''
def max_items(costs, budget):
    taken = 0
    for cost in sorted(costs):  # cheapest first
        if cost > budget:
            break
        budget -= cost
        taken += 1
    return taken
'''
pitfalls = [
    "Sorting by cost is right for the most items. Maximising total value under a budget is a knapsack, not a greedy.",
    "Stop at the first item you can't afford: every later item costs at least as much.",
    "Sorting costs O(n log n). If the values are small integers, counting them is O(n).",
]

[[technique]]
id = "Greedy:swap-greedy"
group = "Number construction"
signals = [
    "rearrange digits or characters to make the largest or smallest result",
    "one or two swaps are allowed, or any rearrangement",
    "the leftmost positions matter most",
]
template = '''
def max_odd_binary(s):
    # Largest odd binary number from the same bits: the last bit must be 1,
    # and the remaining ones go as far left as possible.
    ones = s.count("1")
    return "1" * (ones - 1) + "0" * (len(s) - ones) + "1"
'''
pitfalls = [
    "Fix the constraint first (an odd number ends in 1), then maximise what is left.",
    "For the largest number from one swap, swap the leftmost digit that has a larger digit later with the largest such digit, taking its last occurrence.",
    "Leftmost positions weigh more, so improve those first.",
]

[[technique]]
id = "Greedy:count-greedy"
group = "Sorting-based greedy"
signals = [
    "the answer depends on how many of each thing there is, not on where they are",
    "check whether strings can be made equal, rearranged, or matched",
    "mismatches can be counted and compared",
]
template = '''
def one_swap_makes_equal(a, b):
    # Can swapping two letters of one string make the strings equal?
    diff = [i for i in range(len(a)) if a[i] != b[i]]
    if not diff:
        return True
    return (len(diff) == 2
            and a[diff[0]] == b[diff[1]] and a[diff[1]] == b[diff[0]])
'''
pitfalls = [
    "Equal strings are already fine: a swap of two identical letters changes nothing.",
    "Exactly two mismatches that cross over (a[i] == b[j] and a[j] == b[i]) is the only fixable case, besides none.",
    "Counting first (letters, mismatches) usually avoids trying every swap.",
]

[[technique]]
id = "Greedy:flip-window"
group = "Bit greedy"
signals = [
    "flip a block of k consecutive items, and the goal is the fewest flips",
    "scanning left to right, the leftmost wrong item can only be fixed by a flip that starts there",
    "a flip affects the next k items",
]
template = '''
from collections import deque


def min_k_flips(bits, k):
    # Fewest flips of k consecutive bits to make every bit 1, or -1.
    flips = 0
    ends = deque()  # positions where an active flip stops
    for i, bit in enumerate(bits):
        while ends and ends[0] <= i:
            ends.popleft()
        if (bit + len(ends)) % 2 == 0:  # the bit now reads as 0
            if i + k > len(bits):
                return -1
            flips += 1
            ends.append(i + k)
    return flips
'''
pitfalls = [
    "The first wrong item has only one way to be fixed (a flip starting there), so the choice is forced.",
    "Track how many active flips cover the current position instead of flipping k items each time, which would cost O(n times k).",
    "A flip that would run past the end is impossible: report -1.",
]

[[technique]]
id = "Greedy:kadane"
walk = "greedy-kadane"
template_name = "Maximum subarray"
signals = [
    "the best contiguous subarray (sum, product, or a circular version)",
    "a prefix with a negative total can never help what comes after it",
    "one pass, constant memory",
]
template = '''
def max_subarray(nums):
    best = cur = nums[0]
    for x in nums[1:]:
        cur = max(x, cur + x)  # extend the run, or start again here
        best = max(best, cur)
    return best
'''
pitfalls = [
    "Start from nums[0], not 0, so an all-negative array returns its largest element.",
    "Restarting at x is the same as dropping a run whose sum went negative.",
    "For a circular array, the answer is the larger of the normal best and (total minus the minimum subarray), unless every element is negative.",
]

[[technique.variant]]
name = "Circular array"
note = "Either the best run inside the array, or the total minus the worst run (the best run wraps around)."
template = '''
def max_subarray_circular(nums):
    best = cur_max = nums[0]
    worst = cur_min = nums[0]
    for x in nums[1:]:
        cur_max = max(x, cur_max + x)
        best = max(best, cur_max)
        cur_min = min(x, cur_min + x)
        worst = min(worst, cur_min)
    total = sum(nums)
    # all negative: total - worst would be the empty run
    return best if best < 0 else max(best, total - worst)
'''

[[technique.variant]]
name = "Maximum product"
note = "A negative number swaps the roles: keep both the largest and the smallest product ending here."
template = '''
def max_product(nums):
    best = hi = lo = nums[0]
    for x in nums[1:]:
        if x < 0:
            hi, lo = lo, hi  # a negative factor flips them
        hi = max(x, hi * x)
        lo = min(x, lo * x)
        best = max(best, hi)
    return best
'''

[[technique]]
id = "Greedy:reach"
walk = "greedy-jump"
group = "Jump game family"
signals = [
    "can you get to the end when each position says how far you may jump?",
    "the minimum number of jumps",
    "only the furthest reachable position matters, not which route got there",
