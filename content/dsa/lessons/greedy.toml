[[extra.variant]]
name = "Halve the array sum (heap)"
note = "Always halve the largest remaining value, until the total has dropped by half."
template = '''
import heapq


def halve_array(nums):
    heap = [-x for x in nums]  # max-heap by negating
    heapq.heapify(heap)
    total, need, ops = sum(nums), sum(nums) / 2, 0
    while total > need:
        x = -heapq.heappop(heap) / 2  # halve the largest
        total -= x
        heapq.heappush(heap, -x)
        ops += 1
    return ops
'''

[[extra]]
id = "Greedy:leaves-first"
name = "Decide from the leaves up"
group = "Greedy on graphs"
signals = [
    "place the fewest cameras, guards or coins in a tree so that every node is covered or balanced",
    "a node's choice depends on the states of its children, never on its parent",
    "post-order DFS returns a small state (covered / not covered / has a camera) to the parent",
]
template_name = "Binary tree cameras"
template = '''
def min_camera_cover(root):
    cameras = 0

    # states: 0 not covered, 1 covered, 2 has a camera
    def go(node):
        nonlocal cameras
        if node is None:
            return 1  # nothing to cover
        left, right = go(node.left), go(node.right)
        if left == 0 or right == 0:
            cameras += 1  # a child is uncovered: camera here
            return 2
        if left == 2 or right == 2:
            return 1  # covered by a child's camera
        return 0  # leave it for the parent

    if go(root) == 0:
        cameras += 1  # the root itself is uncovered
    return cameras
'''
pitfalls = [
    "Never put a camera on a leaf: its parent covers it and more.",
    "A null child counts as covered, otherwise leaves would demand cameras.",
    "After the DFS the root may still be uncovered: add one more camera.",
]
examples = ["binary-tree-cameras", "distribute-coins-in-binary-tree", "maximum-number-of-k-divisible-components"]

[[extra.variant]]
name = "Distribute coins (excess flows up)"
note = "A subtree with excess e sends e coins up (or needs -e): every unit crosses the edge once."
template = '''
def distribute_coins(root):
    moves = 0

    def excess(node):
        nonlocal moves
        if node is None:
            return 0
        left, right = excess(node.left), excess(node.right)
        moves += abs(left) + abs(right)  # coins crossing the two edges
        return node.val + left + right - 1  # keep one coin here

    excess(root)
    return moves
'''

