]
template_name = "Sort characters by frequency"
template = '''
from collections import Counter


def frequency_sort(s):
    buckets = [[] for _ in range(len(s) + 1)]  # buckets[c]: seen c times
    for ch, c in Counter(s).items():
        buckets[c].append(ch)
    out = []
    for c in range(len(s), 0, -1):
        for ch in buckets[c]:
            out.append(ch * c)
    return "".join(out)
'''
