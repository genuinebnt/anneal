name = "Task scheduler (formula)"
note = "Only the most frequent tasks create idle time: the answer is the larger of the task count and the frame the top tasks need."
template = '''
from collections import Counter


def least_interval(tasks, n):
    counts = Counter(tasks).values()
    top = max(counts)
    at_top = sum(1 for c in counts if c == top)  # tasks with the max count
    return max(len(tasks), (top - 1) * (n + 1) + at_top)
'''

