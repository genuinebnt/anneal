template = '''
def find_smallest_integer(nums, value):
    rem = [0] * value
    for x in nums:
        rem[x % value] += 1
    mex = 0
    while rem[mex % value]:
        rem[mex % value] -= 1  # use one number of this class
        mex += 1
    return mex
'''

[[extra]]
id = "Greedy:highest-bit"
name = "Build the answer from the highest bit down"
group = "Bit greedy"
signals = [
    "maximise an XOR (or OR, AND) of two numbers from a set",
    "decide the bits from the top: try to set the next bit, keep it if some pair can do it",
    "a set of prefixes answers 'is there a pair whose XOR has this prefix' in O(1)",
]
template = '''
def find_maximum_xor(nums):
    best = mask = 0
    for bit in range(max(nums).bit_length() - 1, -1, -1):
        mask |= 1 << bit
        prefixes = {x & mask for x in nums}  # the top bits of every number
        want = best | 1 << bit  # can the next bit be 1?
        if any(want ^ p in prefixes for p in prefixes):
            best = want
    return best
'''
