template = '''
def min_flips(a, b, c):
    flips = 0
    for i in range(32):
        x, y, z = a >> i & 1, b >> i & 1, c >> i & 1
        if z:
            flips += not (x or y)  # one of them must be 1
        else:
            flips += x + y  # both must be 0
    return flips
'''
