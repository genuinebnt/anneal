    "Negative numbers: in Python x % k is already non-negative; in other languages add k and take the remainder again.",
    "The two self-paired remainders (0 and k / 2) need an even count, the others need equal counts with their partner.",
    "Count remainders in an array of size k, not a map, when k is small.",
]
examples = ["check-if-array-pairs-are-divisible-by-k", "smallest-missing-non-negative-integer-after-operations", "pairs-of-songs-with-total-durations-divisible-by-60", "make-sum-divisible-by-p"]

