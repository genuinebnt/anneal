def can_partition(nums):
    total = sum(nums)
    if total % 2:
        return False
    reach = 1  # bit s is set when sum s can be made
    for x in nums:
        reach |= reach << x  # each item is used at most once
    return reach >> (total // 2) & 1 == 1
