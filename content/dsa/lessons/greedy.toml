    "the best arrangement puts the largest of each class in the earliest positions of that class",
    "positions keep their class; only the order within a class changes",
]
template = '''
def largest_integer(num):
    digits = list(map(int, str(num)))
    odd = sorted((d for d in digits if d % 2), reverse=True)
    even = sorted((d for d in digits if d % 2 == 0), reverse=True)
    out, io, ie = [], 0, 0
    for d in digits:
        if d % 2:
            out.append(odd[io])  # the biggest odd digit left
            io += 1
        else:
            out.append(even[ie])
            ie += 1
    return int("".join(map(str, out)))
'''
