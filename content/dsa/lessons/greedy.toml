id = "Greedy:cooldown-heap"
name = "Most frequent first, with spacing"
group = "Heap-assisted greedy"
signals = [
    "arrange items so that equal ones are not adjacent, or are at least k apart",
    "place the item with the most copies left that is not on cooldown",
    "the answer is a feasibility check on the largest count: it needs at most (n + 1) / 2 for no two adjacent",
]
template_name = "Reorganize string"
template = '''
import heapq
from collections import Counter


def reorganize_string(s):
    heap = [(-n, ch) for ch, n in Counter(s).items()]
    heapq.heapify(heap)
    out, held = [], None  # held: the letter just used, one round out
    while heap or held:
        if not heap:
            return ""  # only the held letter is left: it would touch itself
        n, ch = heapq.heappop(heap)
        out.append(ch)
        if held:
            heapq.heappush(heap, held)
            held = None
        if n + 1 < 0:
            held = (n + 1, ch)
    return "".join(out)
'''
pitfalls = [
    "Hold the letter you just used out of the heap for one round: that is what prevents two adjacent equals.",
    "When the heap is empty but a letter is held, the arrangement is impossible: return the empty string.",
    "Pushing the held letter back after taking the next one keeps the order of counts correct.",
]
examples = ["reorganize-string", "task-scheduler", "longest-happy-string", "distant-barcodes", "construct-string-with-repeat-limit"]

