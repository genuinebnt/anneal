template = '''
from collections import Counter


def min_deletions(s):
    used, deleted = set(), 0
    for count in sorted(Counter(s).values(), reverse=True):
        while count and count in used:
            count -= 1  # delete one occurrence of this letter
            deleted += 1
        used.add(count)  # 0 may repeat; adding it is harmless
