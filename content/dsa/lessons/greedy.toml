template_name = "Jump game III"
template = '''
from collections import deque


def can_reach(arr, start):
    """From i you may jump to i + arr[i] or i - arr[i]."""
    seen, queue = {start}, deque([start])
    while queue:
        i = queue.popleft()
        if arr[i] == 0:
            return True
        for j in (i + arr[i], i - arr[i]):
            if 0 <= j < len(arr) and j not in seen:
                seen.add(j)
                queue.append(j)
    return False
'''
pitfalls = [
    "Mark a position when it is queued, not when it is taken out: otherwise it can be queued many times.",
    "Check both directions and both bounds before queueing.",
    "BFS gives the fewest jumps level by level; plain reachability needs only a visited set (DFS also works).",
]
examples = ["jump-game-iii", "jump-game-iv", "minimum-jumps-to-reach-home"]

[[extra.variant]]
name = "Jump game IV (equal values teleport)"
note = "Use each value's group of positions once: after it is expanded, delete it from the map."
template = '''
from collections import defaultdict, deque


def min_jumps(arr):
    same = defaultdict(list)
    for i, v in enumerate(arr):
        same[v].append(i)
    seen, queue, steps = {0}, deque([0]), 0
    while queue:
        for _ in range(len(queue)):
            i = queue.popleft()
            if i == len(arr) - 1:
                return steps
            # each value's group is expanded once: pop it from the map
            for j in same.pop(arr[i], []) + [i - 1, i + 1]:
                if 0 <= j < len(arr) and j not in seen:
                    seen.add(j)
                    queue.append(j)
        steps += 1
    return -1
'''

