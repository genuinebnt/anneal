]
template = '''
def check_array(nums, k):
    n, running = len(nums), 0  # running: active subtractions here
    ends = [0] * (n + 1)  # ends[i]: subtractions that stop covering at i
    for i, x in enumerate(nums):
        running -= ends[i]
        x -= running
        if x < 0:
            return False  # already pushed below zero
        if x > 0:
            if i + k > n:
                return False  # the window would run off the end
            running += x
            ends[i + k] += x
    return True
'''
