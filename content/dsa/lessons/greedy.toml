template_name = "Pairs divisible by k"
template = '''
def can_arrange(arr, k):
    rem = [0] * k
    for x in arr:
        rem[x % k] += 1  # Python's % is never negative here
    if rem[0] % 2:
        return False  # multiples of k pair with each other
    if k % 2 == 0 and rem[k // 2] % 2:
        return False  # k / 2 pairs with itself
    return all(rem[r] == rem[k - r] for r in range(1, (k + 1) // 2))
'''
