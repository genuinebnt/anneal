template = '''
def can_reach_end(jumps):
    furthest = 0
    for i, jump in enumerate(jumps):
        if i > furthest:
            return False  # a gap nothing could cross
        furthest = max(furthest, i + jump)
    return True
'''
pitfalls = [
    "Everything up to the furthest reachable index is reachable too, so one number summarises all the routes.",
    "For the fewest jumps, count a jump each time you pass the end of the current range, then extend the range to the furthest seen.",
    "Check i > furthest before using position i.",
]

[[technique]]
id = "Greedy:surplus"
group = "Running-state scans"
signals = [
    "a circular route where each stop adds some and costs some",
    "find the starting point from which you can complete the loop",
    "if you run out at a stop, none of the stops before it could have been the start",
]
template = '''
def can_complete_circuit(gas, cost):
    if sum(gas) < sum(cost):
        return -1
    start = tank = 0
    for i in range(len(gas)):
        tank += gas[i] - cost[i]
        if tank < 0:  # failed before reaching i + 1: start further on
            start, tank = i + 1, 0
    return start
'''
pitfalls = [
    "Check the total first. If the total is negative no start works, and if it is not, the last reset point does.",
    "When the tank goes negative at i, every start between the old one and i would have failed there too.",
    "No second pass around the circle is needed once the total check has passed.",
]

[[technique]]
id = "Greedy:group-smallest"
group = "Sorting-based greedy"
signals = [
    "split items into groups of a given size, each a run of consecutive values",
    "the smallest remaining value has to start a group",
    "counts of each value can be tracked in a map",
]
template = '''
from collections import Counter


def can_split_consecutive(hand, size):
    if len(hand) % size:
        return False
    counts = Counter(hand)
    for start in sorted(counts):
        need = counts[start]
        if need:
            for value in range(start, start + size):
                if counts[value] < need:
                    return False
                counts[value] -= need
    return True
'''
pitfalls = [
    "The smallest remaining card can't join any group that starts lower, so it must start a group. The choice is forced.",
    "Take the whole count at once (need) instead of one group at a time.",
    "Check that the hand size is divisible by the group size first.",
]

[[technique]]
id = "Greedy:simulate-greedy"
group = "Greedy simulation"
signals = [
    "players or items act in turn, each removing or blocking an opponent",
    "the best move is always against the opponent who acts soonest",
    "queues of positions model who goes next",
]
template = '''
from collections import deque


def winner(senate):
    radiant, dire = deque(), deque()
    for i, party in enumerate(senate):
        (radiant if party == "R" else dire).append(i)
    n = len(senate)
    while radiant and dire:
        r, d = radiant.popleft(), dire.popleft()
        if r < d:
            radiant.append(r + n)  # acts again next round, after everyone
        else:
            dire.append(d + n)
    return "Radiant" if radiant else "Dire"
'''
pitfalls = [
    "Compare positions to see who acts first. That one removes the other.",
    "Adding n to the winner's position puts it after everyone from this round, preserving the order.",
    "Each step removes one person, so the loop is O(n).",
]

[[technique]]
id = "Greedy:filter"
signals = [
    "pick items so that a combined result (a maximum, an OR) equals a target",
    "any item that overshoots the target in some position can never be used",
    "after filtering, check whether the remaining items can reach each target value",
]
template = '''
def can_merge_to_target(triplets, target):
    got = [False] * 3
    for t in triplets:
        if all(t[i] <= target[i] for i in range(3)):  # never overshoots
            for i in range(3):
                if t[i] == target[i]:
                    got[i] = True
    return all(got)
'''
pitfalls = [
    "Taking a maximum can only raise values, so one overshoot ruins that position for good. Drop the item.",
    "Among the safe items, the maximum per position is the best you can do, so just check each target is hit.",
    "No need to find which items to merge. Existence is enough.",
]

[[technique]]
id = "Greedy:last-seen"
group = "Two-pointer greedy"
signals = [
    "split a string into as many parts as possible so that each letter appears in only one part",
    "each part must reach at least as far as its letters' last occurrences",
    "record the last index of every letter first",
]
template = '''
def partition_labels(s):
    last = {c: i for i, c in enumerate(s)}
    sizes, start, end = [], 0, 0
    for i, c in enumerate(s):
        end = max(end, last[c])  # this part must reach c's last position
        if i == end:
            sizes.append(end - start + 1)
            start = i + 1
    return sizes
'''
pitfalls = [
    "Cut only when the index reaches the furthest last-occurrence seen so far. Cutting earlier splits a letter.",
    "Two passes: one to record last indices, one to cut.",
    "The same idea merges intervals: end is the furthest end among the intervals so far.",
]

[[technique]]
id = "Greedy:paren-range"
signals = [
    "brackets with wildcards that can be an open, a close, or nothing",
    "you can't track a single count, but you can track the smallest and largest possible",
    "valid if some choice keeps the count from going below zero and ends at zero",
]
template = '''
def check_valid_string(s):
    lo = hi = 0  # fewest and most open brackets the prefix can have
    for c in s:
        lo += 1 if c == "(" else -1
        hi += 1 if c != ")" else -1
        if hi < 0:
            return False  # too many closers even if every * opens
        lo = max(lo, 0)  # a * can always avoid going negative
    return lo == 0
'''
pitfalls = [
    "Two numbers are enough: the wildcard widens the range of possible open counts.",
    "Clamp lo at 0. A negative count is never a real state, because you can choose differently.",
    "Fail as soon as hi < 0. At the end the count 0 must be inside the range, which means lo == 0.",
]

[[extra]]
id = "Greedy:rank-match"
name = "Sort both sides and match rank to rank"
group = "Sorting-based greedy"
signals = [
    "two groups must be paired (children and cookies, people and boats, jobs and workers) to maximise the matches",
    "a partner is good enough when it is at least as big, and a bigger one is never better",
    "after sorting, the smallest sufficient partner or the two ends decide each step",
]
template_name = "Smallest sufficient partner"
template = '''
def find_content_children(greed, sizes):
    """Most children who get a cookie at least as big as their greed."""
    greed, sizes = sorted(greed), sorted(sizes)
    child = 0
    for cookie in sizes:  # smallest cookie first
        if child < len(greed) and cookie >= greed[child]:
            child += 1  # it satisfies the least greedy child left
    return child
'''
pitfalls = [
    "Walk over the resource (cookies), not the demand: a cookie that is too small is skipped, never stored.",
    "Sort both lists: the match of the smallest with the smallest sufficient partner is what makes the greedy right.",
    "Equal sizes are allowed to match: the comparison is >=, not >.",
]
examples = ["assign-cookies", "boats-to-save-people", "advantage-shuffle", "maximize-greatness-of-an-array", "most-profit-assigning-work"]

[[extra.variant]]
name = "Pair the lightest with the heaviest"
note = "Each boat takes at most two people: the heaviest always leaves, the lightest joins when it fits."
template = '''
def num_rescue_boats(people, limit):
    people = sorted(people)
    lo, hi, boats = 0, len(people) - 1, 0
    while lo <= hi:
        if people[lo] + people[hi] <= limit:
            lo += 1  # the lightest shares the boat
        hi -= 1  # the heaviest always leaves
        boats += 1
    return boats
'''

[[extra]]
id = "Greedy:comparator-sort"
name = "Sort with a custom comparator"
group = "Sorting-based greedy"
signals = [
    "the best order is not by one key: two items are compared by what happens if each goes first",
    "build the largest (or smallest) number or string by concatenating the given pieces",
    "elements are placed one at a time and an earlier choice is fixed by a later, less important one",
]
template_name = "Largest number"
template = '''
from functools import cmp_to_key


def largest_number(nums):
    def before(a, b):  # negative: a goes first
        return -1 if a + b > b + a else 1 if a + b < b + a else 0

    words = sorted(map(str, nums), key=cmp_to_key(before))
    return "0" if words[0] == "0" else "".join(words)
'''
pitfalls = [
    "Compare a + b with b + a, not a with b: 9 beats 34 as 934 > 349, but 3 beats 34 as 334 < 343 fails the plain comparison.",
    "A comparator must be consistent (a transitive order): test it on pairs of three numbers when in doubt.",
    "All zeros give \"0\", not \"000\": check the first word after sorting.",
]
examples = ["largest-number", "queue-reconstruction-by-height", "reorder-data-in-log-files"]

[[extra.variant]]
name = "Queue reconstruction"
note = "Tallest first: a shorter person inserted later never changes the count in front of a taller one."
template = '''
def reconstruct_queue(people):
    out = []
    # tallest first; among equals, the smaller k first
    for h, k in sorted(people, key=lambda p: (-p[0], p[1])):
        out.insert(k, [h, k])  # exactly k taller-or-equal ones are in front
    return out
'''

[[extra]]
id = "Greedy:gain-diff"
name = "Sort by what each choice gains over the other"
group = "Sorting-based greedy"
signals = [
    "every item goes to one of two places and each place has its own cost, with a size limit per place",
    "choose k items for one option and the rest for the other",
    "the difference between the two costs is what decides the order",
]
template_name = "Two cities"
template = '''
def two_city_sched_cost(costs):
    # the people who save the most by going to city A come first
    costs = sorted(costs, key=lambda c: c[0] - c[1])
    half = len(costs) // 2
    return (sum(a for a, _ in costs[:half])
            + sum(b for _, b in costs[half:]))
'''
pitfalls = [
    "Sorting by one city's cost alone is wrong: a cheap A is still bad when B is far cheaper.",
    "Start from 'everyone goes to B' and pay the difference for the half who switch: that is why the difference is the key.",
    "An odd number of people has no equal split: the problem guarantees an even count.",
]
examples = ["two-city-scheduling", "put-marbles-in-bags"]

[[extra.variant]]
name = "Put marbles in bags"
note = "Only the cut points matter: each cut adds the sum of its two neighbours, so take the k - 1 largest and the k - 1 smallest."
template = '''
def put_marbles(weights, k):
    pairs = sorted(a + b for a, b in zip(weights, weights[1:]))
    return sum(pairs[len(pairs) - (k - 1):]) - sum(pairs[:k - 1])
'''

