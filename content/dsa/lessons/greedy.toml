    "Only the most recent star needs to be remembered: an earlier star cannot do better by taking more.",
    "After the string ends, only stars may remain in the pattern.",
    "Do not mix this with regular expressions: here * is a wildcard on its own, not 'zero or more of the previous'.",
]
