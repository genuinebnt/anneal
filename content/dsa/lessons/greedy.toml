template_name = "Fewest arrows"
template = '''
def find_min_arrow_shots(points):
    points = sorted(points, key=lambda p: p[1])  # by right end
    arrows, last = 0, float("-inf")
    for start, end in points:
        if start > last:  # the last arrow missed this one
            arrows += 1
            last = end  # shoot at the earliest end
    return arrows
'''
pitfalls = [
    "Sort by the end: shooting at the earliest end hits the most intervals that start before it.",
    "Touching ends: for balloons start == last is a hit (> in the test); for meetings it is no conflict (>= in the test).",
    "Do not subtract: keep the count of what you take, and answer the total minus that if asked for removals.",
]
examples = ["minimum-number-of-arrows-to-burst-balloons", "non-overlapping-intervals", "maximum-length-of-pair-chain", "maximum-number-of-non-overlapping-subarrays-with-sum-equals-target"]

[[extra.variant]]
name = "Fewest removals (keep the most)"
note = "The same scan keeps the most intervals that do not overlap; the rest are removed."
template = '''
def erase_overlap_intervals(intervals):
    intervals = sorted(intervals, key=lambda i: i[1])
    kept, last = 0, float("-inf")
    for start, end in intervals:
        if start >= last:  # touching is not overlapping
            kept += 1
            last = end
    return len(intervals) - kept
'''

[[extra]]
id = "Greedy:interval-cover"
name = "Cover a range with the fewest intervals"
group = "Interval scheduling and covering"
signals = [
    "choose the fewest clips, taps or segments whose union covers [0, T]",
    "from the covered prefix, take the interval that starts inside it and reaches furthest",
    "the same as jump game II with intervals as the jumps",
]
template_name = "Video stitching"
template = '''
def video_stitching(clips, time):
    clips = sorted(clips)
    count = reach = far = i = 0
    while reach < time:
        while i < len(clips) and clips[i][0] <= reach:
            far = max(far, clips[i][1])  # starts inside what is covered
            i += 1
        if far <= reach:
            return -1  # a gap that no clip bridges
        count += 1
        reach = far
    return count
'''
pitfalls = [
    "Take the best end among all clips that start at or before the covered end, then move the covered end there.",
    "If the best end does not exceed the covered end there is a gap: return -1 at once, or the loop never ends.",
    "A clip may start before 0 (taps): clamp to 0 when you convert.",
]
examples = ["video-stitching", "minimum-number-of-taps-to-open-to-water-a-garden", "jump-game-ii"]

[[extra.variant]]
name = "Garden taps"
note = "Per start point keep the furthest right end, then walk like jump game II."
template = '''
def min_taps(n, ranges):
    reach_from = [0] * (n + 1)  # furthest right end of a tap starting at i
    for i, r in enumerate(ranges):
        lo = max(0, i - r)
        reach_from[lo] = max(reach_from[lo], i + r)
    taps = end = far = 0
    for i in range(n):
        far = max(far, reach_from[i])
        if i == end:  # must open one more tap here
            if far <= i:
                return -1
            taps += 1
            end = far
    return taps
'''

[[extra]]
id = "Greedy:earliest-deadline"
name = "Earliest deadline first with a heap of open items"
group = "Activity selection"
signals = [
    "attend or do at most one thing per day, and every thing has a window (start day, end day)",
    "each day, of everything open, do the one that expires first",
    "sort by start and keep a min-heap of end days",
]
template = '''
import heapq


def max_events(events):
    events = sorted(events)
    heap, day, i, attended = [], 0, 0, 0  # heap: end days of open events
    while i < len(events) or heap:
        if not heap:
            day = events[i][0]  # nothing open: jump to the next start
        while i < len(events) and events[i][0] <= day:
            heapq.heappush(heap, events[i][1])
            i += 1
        heapq.heappop(heap)  # attend the one that ends first
        attended += 1
        day += 1
        while heap and heap[0] < day:
            heapq.heappop(heap)  # expired before it could be attended
    return attended
'''
pitfalls = [
    "Always attend the open event with the smallest end day: any other choice can only make a later day worse.",
    "Drop expired events after moving to the next day, or an old end day sits on top of the heap.",
    "Jump the day forward when the heap is empty, not one day at a time: days may be up to 10^5.",
]
examples = ["maximum-number-of-events-that-can-be-attended", "minimum-interval-to-include-each-query"]

[[extra]]
id = "Greedy:regret-heap"
name = "Regret: undo the worst choice made so far"
group = "Heap-assisted greedy"
signals = [
    "take items in a natural order and keep every one, then repair when a limit is broken",
    "when the limit breaks, drop the single most expensive (or longest) item taken so far",
    "a max-heap of what has been taken makes the repair O(log n)",
]
template_name = "Course schedule III"
template = '''
import heapq


def schedule_course(courses):
    courses = sorted(courses, key=lambda c: c[1])  # earliest deadline
    taken, time = [], 0  # taken: max-heap (negated) of durations
    for duration, deadline in courses:
        heapq.heappush(taken, -duration)
        time += duration
        if time > deadline:  # too late: regret the longest one taken
            time += heapq.heappop(taken)  # stored negated
    return len(taken)
'''
pitfalls = [
    "Add the new item first and then repair: the new item may itself be the one dropped.",
    "Store negatives for a max-heap in Python: heapq is a min-heap.",
    "The set of taken items is never exact in order, but its size and total are: that is all the answer needs.",
]
examples = ["course-schedule-iii", "minimum-number-of-refueling-stops", "furthest-building-you-can-reach"]

[[extra.variant]]
name = "Refuel stops"
note = "Drive as far as the fuel goes; only when stuck, retroactively buy the largest tank passed."
template = '''
import heapq


def min_refuel_stops(target, start_fuel, stations):
    heap, fuel, stops, prev = [], start_fuel, 0, 0
    for pos, gas in stations + [[target, 0]]:
        fuel -= pos - prev
        while fuel < 0 and heap:
            fuel -= heapq.heappop(heap)  # negated: buys the biggest tank
            stops += 1
        if fuel < 0:
            return -1
        heapq.heappush(heap, -gas)
        prev = pos
    return stops
'''

