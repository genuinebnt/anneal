id = "Greedy:create-maximum"
name = "Largest number from the digits of two lists"
group = "Number construction"
signals = [
    "build the largest number of length k, taking digits from two lists and keeping each list's order",
    "for each split (i from the first, k - i from the second) take the best subsequence of each",
    "then merge by comparing the remaining suffixes, not single digits",
]
template = '''
def max_number(nums1, nums2, k):
    def pick(nums, t):  # the largest subsequence of length t
        drop, stack = len(nums) - t, []
        for x in nums:
            while drop and stack and stack[-1] < x:
                stack.pop()
                drop -= 1
            stack.append(x)
        return stack[:t]

    def merge(a, b):
        out = []
        while a or b:
            big = a if a > b else b  # compares the whole rest
            out.append(big.pop(0))
        return out

    best = []
    for i in range(max(0, k - len(nums2)), min(k, len(nums1)) + 1):
        best = max(best, merge(pick(nums1, i), pick(nums2, k - i)))
    return best
'''
