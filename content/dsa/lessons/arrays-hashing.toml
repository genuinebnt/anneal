template = '''
class SparseVector:
    def __init__(self, nums):
        self.nz = {i: v for i, v in enumerate(nums) if v}  # non-zeros

    def dotProduct(self, vec):
        a, b = self.nz, vec.nz
        if len(a) > len(b):
            a, b = b, a  # loop over the smaller map
        return sum(v * b[i] for i, v in a.items() if i in b)
'''
pitfalls = [
    "Loop over the map with fewer entries: the cost is the number of non-zeros of the smaller vector.",
    "A missing key means zero: do not store zeros.",
    "A sparse matrix times a matrix is the same idea per row: skip zero entries.",
]
