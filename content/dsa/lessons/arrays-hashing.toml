template_name = "Find all numbers disappeared"
template = '''
def find_disappeared_numbers(nums):
    for v in nums:
        i = abs(v) - 1  # the slot of the value v
        if nums[i] > 0:
            nums[i] = -nums[i]  # mark: v was seen
    return [i + 1 for i, v in enumerate(nums) if v > 0]  # never marked
'''
pitfalls = [
    "Use abs(v) when reading: an earlier mark may have flipped the sign of the value you are reading.",
    "Flip only if the cell is still positive, or a duplicate would flip it back.",
    "This destroys the input: restore the signs if the caller needs it.",
]
