[[extra.variant]]
name = "Find all duplicates"
note = "A value whose slot is already negative has been seen before: it is a duplicate."
template = '''
def find_duplicates(nums):
    out = []
    for v in nums:
        i = abs(v) - 1
        if nums[i] < 0:
            out.append(abs(v))  # its slot was already marked
        else:
            nums[i] = -nums[i]
    return out
'''

[[extra.variant]]
name = "Set mismatch (cyclic sort)"
note = "Swap every value into its slot; the slot that ends up wrong holds the duplicate and names the missing number."
template = '''
def find_error_nums(nums):
    i = 0
    while i < len(nums):
        j = nums[i] - 1  # where nums[i] belongs
        if nums[i] != nums[j]:
            nums[i], nums[j] = nums[j], nums[i]
        else:
            i += 1
    for i, v in enumerate(nums):
        if v != i + 1:
            return [v, i + 1]  # the duplicate and the missing number
'''

