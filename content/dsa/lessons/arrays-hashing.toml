id = "Arrays & Hashing:transformed-key"
name = "Pair counting with a transformed key"
group = "Two-sum family"
signals = [
    "count pairs (i < j) where a condition links nums[i] and nums[j]: rewrite it as f(i, nums[i]) == g(j, nums[j])",
    "bad pairs: j - i != nums[j] - nums[i], so count good pairs by nums[i] - i",
    "keep a counter of keys seen so far and add the matching count for each new element",
]
template_name = "Count bad pairs"
template = '''
from collections import Counter


def count_bad_pairs(nums):
    seen, good = Counter(), 0
    for i, v in enumerate(nums):
        good += seen[v - i]  # earlier j with v_j - j == v_i - i
        seen[v - i] += 1
    n = len(nums)
    return n * (n - 1) // 2 - good  # all pairs minus the good ones
'''
pitfalls = [
    "Move everything that depends on one index to one side: j - i == a[j] - a[i] means a[j] - j == a[i] - i.",
    "It is often easier to count the good pairs and subtract from n * (n - 1) / 2.",
    "Add to the counter after looking up, so an element does not pair with itself.",
]
examples = ["count-number-of-bad-pairs", "count-nice-pairs-in-an-array", "number-of-pairs-of-interchangeable-rectangles", "4sum-ii", "number-of-good-pairs"]

