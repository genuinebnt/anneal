template_name = "Isomorphic strings"
template = '''
def is_isomorphic(s, t):
    def shape(x):
        first = {}
        # each new letter gets the next number: 0, 1, 2, ...
        return [first.setdefault(ch, len(first)) for ch in x]

    return shape(s) == shape(t)
'''
pitfalls = [
    "The shape must be computed for both strings: a one-way mapping would allow two letters to map to one.",
    "setdefault(ch, len(first)) gives each new letter the next number.",
    "For word patterns apply the same shape function to the words of the sentence.",
]
examples = ["isomorphic-strings", "word-pattern", "find-and-replace-pattern", "group-shifted-strings"]

