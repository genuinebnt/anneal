template_name = "Tic-tac-toe"
template = '''
class TicTacToe:
    def __init__(self, n):
        self.n = n
        self.rows, self.cols = [0] * n, [0] * n
        self.diag = self.anti = 0

    def move(self, row, col, player):
        d = 1 if player == 1 else -1  # one player counts up, the other down
        self.rows[row] += d
        self.cols[col] += d
        if row == col:
            self.diag += d
        if row + col == self.n - 1:
            self.anti += d
        n = self.n
        if n in (abs(self.rows[row]), abs(self.cols[col]),
                 abs(self.diag), abs(self.anti)):
            return player  # someone owns a whole line
        return 0
'''
pitfalls = [
    "Player 1 adds +1 and player 2 adds -1: a line is won when its counter reaches +n or -n.",
    "Only the row, the column and the (anti)diagonals of the last move can have changed.",
    "A move is O(1) instead of O(n).",
]
examples = ["design-tic-tac-toe", "design-a-leaderboard", "design-parking-system"]

