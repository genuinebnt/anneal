name = "Duplicates allowed"
note = "A set of indexes per value; the removed index is replaced by the last index of the list."
template = '''
import random
from collections import defaultdict


class RandomizedCollection:
    def __init__(self):
        self.items, self.pos = [], defaultdict(set)

    def insert(self, val):
        self.pos[val].add(len(self.items))
        self.items.append(val)
        return len(self.pos[val]) == 1  # true when val was new

    def remove(self, val):
        if not self.pos[val]:
            return False
        i = self.pos[val].pop()
        last = self.items[-1]
        self.items[i] = last
        self.pos[last].add(i)
        self.pos[last].discard(len(self.items) - 1)
        self.items.pop()
        return True

    def getRandom(self):
        return random.choice(self.items)
'''

