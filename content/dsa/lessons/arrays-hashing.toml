template_name = "Pascal's triangle"
template = '''
def generate(num_rows):
    rows = []
    for i in range(num_rows):
        row = [1] * (i + 1)
        for j in range(1, i):
            row[j] = rows[i - 1][j - 1] + rows[i - 1][j]  # the two above
        rows.append(row)
    return rows
'''
pitfalls = [
    "The edges of each row are 1; only the inner cells are sums.",
    "For a single row update from right to left so the values you still need are not overwritten.",
    "Row n is also the binomial coefficients C(n, k).",
]
