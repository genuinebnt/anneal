id = "Arrays & Hashing:random-set"
name = "Array plus map: O(1) insert, delete and random"
group = "Design with hash maps"
signals = [
    "insert, remove and return a uniformly random element, all in O(1)",
    "a list gives random access; a dict from value to index gives O(1) lookup",
    "to delete from the middle, swap the item with the last one and pop",
]
template_name = "Randomized set"
template = '''
import random


class RandomizedSet:
    def __init__(self):
        self.items, self.pos = [], {}  # list, and value -> its index

    def insert(self, val):
        if val in self.pos:
            return False
        self.pos[val] = len(self.items)
        self.items.append(val)
        return True

    def remove(self, val):
        if val not in self.pos:
            return False
        i, last = self.pos[val], self.items[-1]
        self.items[i] = last  # move the last item into the hole
        self.pos[last] = i
        self.items.pop()
        del self.pos[val]  # after fixing pos[last]: val may be last itself
        return True

    def getRandom(self):
        return random.choice(self.items)
'''
pitfalls = [
    "Update the moved item's index before deleting val: when val is the last item the order matters.",
    "Popping the last item is O(1); removing from the middle is O(n).",
    "With duplicates allowed keep a set of indexes per value.",
]
examples = ["insert-delete-getrandom-o1", "insert-delete-getrandom-o1-duplicates-allowed", "design-skiplist"]

