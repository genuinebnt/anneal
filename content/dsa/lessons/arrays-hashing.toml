template = '''
from collections import deque


class RecentCounter:
    def __init__(self):
        self.times = deque()

    def ping(self, t):
        self.times.append(t)
        while self.times[0] < t - 3000:  # older than the window
            self.times.popleft()
        return len(self.times)
'''
pitfalls = [
    "Drop old events when a new one arrives: the queue never holds more than the window.",
    "Timestamps are increasing, so the oldest is always at the front.",
    "A rate limiter keeps the time each key may speak next, in a dict.",
]
examples = ["number-of-recent-calls", "moving-average-from-data-stream", "logger-rate-limiter", "design-hit-counter", "design-underground-system"]

[[extra.variant]]
name = "Moving average"
note = "A queue of the last size values and a running sum."
template = '''
from collections import deque


class MovingAverage:
    def __init__(self, size):
        self.size, self.window, self.total = size, deque(), 0

    def next(self, val):
        self.window.append(val)
        self.total += val
        if len(self.window) > self.size:
            self.total -= self.window.popleft()
        return self.total / len(self.window)
'''

