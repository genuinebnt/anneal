[[extra.variant]]
name = "Pascal's triangle II (one row)"
note = "Update the row in place, right to left."
template = '''
def get_row(row_index):
    row = [1] + [0] * row_index
    for i in range(1, row_index + 1):
        for j in range(i, 0, -1):  # right to left keeps row[j - 1] old
            row[j] += row[j - 1]
    return row
'''

[[extra.variant]]
name = "Champagne tower"
note = "Pour into the top glass; every glass overflows half of its excess to each glass below."
template = '''
def champagne_tower(poured, query_row, query_glass):
    tower = [[0.0] * (r + 1) for r in range(query_row + 2)]
    tower[0][0] = poured
    for r in range(query_row + 1):
        for c in range(r + 1):
            extra = max(0.0, tower[r][c] - 1)  # what a full glass spills
            tower[r + 1][c] += extra / 2
            tower[r + 1][c + 1] += extra / 2
    return min(1.0, tower[query_row][query_glass])
'''

