name = "Underground system"
note = "Open trips per customer; per station pair keep total time and count."
template = '''
from collections import defaultdict


class UndergroundSystem:
    def __init__(self):
        self.open = {}  # id -> (station, time)
        self.total = defaultdict(lambda: [0, 0])  # (a, b) -> [sum, count]

    def checkIn(self, id, stationName, t):
        self.open[id] = (stationName, t)

    def checkOut(self, id, stationName, t):
        start, t0 = self.open.pop(id)
        entry = self.total[(start, stationName)]
        entry[0] += t - t0
        entry[1] += 1

    def getAverageTime(self, startStation, endStation):
        s, c = self.total[(startStation, endStation)]
        return s / c
'''

