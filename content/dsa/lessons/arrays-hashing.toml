name = "Count nice pairs (reverse digits)"
note = "nums[i] + rev(nums[j]) == nums[j] + rev(nums[i]) means nums[i] - rev(nums[i]) == nums[j] - rev(nums[j])."
template = '''
from collections import Counter


def count_nice_pairs(nums):
    seen, total = Counter(), 0
    for x in nums:
        key = x - int(str(x)[::-1])
        total += seen[key]
        seen[key] += 1
    return total % (10**9 + 7)
'''

