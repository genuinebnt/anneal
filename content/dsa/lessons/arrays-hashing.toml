name = "Count binary substrings"
note = "Each pair of neighbouring runs contributes min(a, b) substrings with equal 0s and 1s."
template = '''
def count_binary_substrings(s):
    prev, cur, total = 0, 1, 0  # lengths of the previous and current runs
    for i in range(1, len(s)):
        if s[i] == s[i - 1]:
            cur += 1
        else:
            total += min(prev, cur)
            prev, cur = cur, 1
    return total + min(prev, cur)
