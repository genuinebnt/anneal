name = "Interchangeable rectangles"
note = "A ratio w / h as a reduced fraction; equal fractions pair up."
template = '''
from collections import Counter
from math import gcd


def interchangeable_rectangles(rectangles):
    seen, total = Counter(), 0
    for w, h in rectangles:
        g = gcd(w, h)
        key = (w // g, h // g)  # exact, no floats
        total += seen[key]
        seen[key] += 1
    return total
'''

