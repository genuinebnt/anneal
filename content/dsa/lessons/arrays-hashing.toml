template = '''
def two_sum(nums, target):
    index = {}  # value -> position where it was seen
    for i, x in enumerate(nums):
        if target - x in index:
            return [index[target - x], i]
        index[x] = i
    return []
'''
pitfalls = [
    "Look up the complement before storing the current value, so an item can't pair with itself.",
    "Duplicates work: [3, 3] with target 6 finds the first 3 when it reaches the second.",
    "If the array is sorted, two pointers use no extra memory.",
]

[[technique]]
id = "Arrays & Hashing:string-match"
group = "Hashing structures"
signals = [
    "find a pattern inside a longer text, possibly many times",
    "compare many substrings of the same length",
    "an O(n times m) comparison is too slow",
]
template = '''
def find_all(text, pattern, base=256, mod=1_000_000_007):
    n, m = len(text), len(pattern)
    if m == 0 or m > n:
        return []
    high = pow(base, m - 1, mod)  # the weight of the leftmost character
    want = window = 0
    for i in range(m):
        want = (want * base + ord(pattern[i])) % mod
        window = (window * base + ord(text[i])) % mod
    found = []
    for i in range(n - m + 1):
        # Confirm a hash match: different strings can share a hash.
        if window == want and text[i:i + m] == pattern:
            found.append(i)
        if i + m < n:  # slide: drop text[i], add text[i + m]
            window = (window - ord(text[i]) * high) * base
            window = (window + ord(text[i + m])) % mod
    return found
'''
pitfalls = [
    "Equal hashes don't prove equal strings. Compare the actual substrings when the hashes match.",
    "Keep the arithmetic modulo a large prime so numbers stay small.",
    "When you only need one answer, Python's `in` and str.find already do the job. The rolling hash is for many comparisons.",
]

