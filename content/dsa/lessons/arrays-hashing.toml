name = "Word pattern"
note = "The shape of the pattern letters equals the shape of the words."
template = '''
def word_pattern(pattern, s):
    words = s.split()

    def shape(items):
        first = {}
        return [first.setdefault(x, len(first)) for x in items]

    return len(pattern) == len(words) and shape(pattern) == shape(words)
'''

[[extra.variant]]
name = "Find and replace pattern"
note = "Keep the words whose shape equals the pattern's."
template = '''
def find_and_replace_pattern(words, pattern):
    def shape(x):
        first = {}
        return [first.setdefault(ch, len(first)) for ch in x]

    target = shape(pattern)
    return [w for w in words if shape(w) == target]
'''

