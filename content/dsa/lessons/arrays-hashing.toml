def multiply(mat1, mat2):
    m, n, p = len(mat1), len(mat2), len(mat2[0])
    rows2 = [[(j, v) for j, v in enumerate(row) if v] for row in mat2]
    out = [[0] * p for _ in range(m)]
    for i in range(m):
        for k, a in enumerate(mat1[i]):
            if a:  # skip zeros of the first matrix
                for j, b in rows2[k]:  # and zeros of the second
                    out[i][j] += a * b
    return out
'''

