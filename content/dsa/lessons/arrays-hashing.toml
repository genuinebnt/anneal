[[extra]]
id = "Arrays & Hashing:justify"
name = "Text justification: pack words, then pad"
group = "Simulation"
signals = [
    "lay out words in lines of a fixed width, spreading the spaces evenly",
    "first pack as many words as fit with one space each, then distribute the extra spaces",
    "the last line and single-word lines are left-aligned",
]
template = '''
def full_justify(words, max_width):
    out, line, chars = [], [], 0  # chars: letters in the current line
    for w in words:
        if chars + len(w) + len(line) > max_width:  # w does not fit
            gaps = len(line) - 1
            spaces = max_width - chars
            if gaps == 0:
                out.append(line[0] + " " * spaces)  # a single word: left
            else:
                q, r = divmod(spaces, gaps)
                # the left gaps get the extra spaces
                parts = [word + " " * (q + (i < r))
                         for i, word in enumerate(line[:-1])]
                out.append("".join(parts) + line[-1])
            line, chars = [], 0
        line.append(w)
        chars += len(w)
    last = " ".join(line)
    out.append(last + " " * (max_width - len(last)))  # the last line: left
    return out
'''
pitfalls = [
    "A word fits when letters + words already in the line (one space each) + its length is within the width.",
    "Extra spaces go to the left gaps first: gap i gets one more when i < remainder.",
    "The last line is joined with single spaces and padded on the right.",
]
examples = ["text-justification"]

