template = '''
def ways_to_split_array(nums):
    total, left, count = sum(nums), 0, 0
    for v in nums[:-1]:  # both parts must be non-empty
        left += v
        if left >= total - left:
            count += 1
    return count
'''

[[extra.variant]]
name = "Sum of absolute differences (sorted)"
note = "For each element, the distances to smaller and larger elements come from the prefix sum."
template = '''
def get_sum_absolute_differences(nums):
    total, left, out = sum(nums), 0, []
    n = len(nums)
    for i, v in enumerate(nums):
        right = total - left - v
        smaller = v * i - left  # distance to the elements before
        larger = right - v * (n - 1 - i)  # and to the ones after
        out.append(smaller + larger)
        left += v
    return out
'''

[[extra.variant]]
name = "Grid game"
note = "The second robot takes the better of the leftover top suffix and the leftover bottom prefix; the first minimises that."
template = '''
def grid_game(grid):
    top, bottom = sum(grid[0]), 0
    best = float("inf")
    for i in range(len(grid[0])):
        top -= grid[0][i]  # what is left on top after column i
        best = min(best, max(top, bottom))  # the second robot's best path
        bottom += grid[1][i]
    return best
'''

[[extra]]
id = "Arrays & Hashing:fenwick"
name = "Fenwick tree: prefix sums that change"
group = "Prefix / suffix products and aggregates"
signals = [
    "range sums with point updates: a plain prefix-sum array would need O(n) to update",
    "a binary indexed tree stores partial sums: update and query in O(log n)",
    "the lowest set bit i & -i says how many items a cell covers",
]
template_name = "Range sum query - mutable"
template = '''
class NumArray:
    def __init__(self, nums):
        self.n = len(nums)
        self.nums = nums[:]
        self.tree = [0] * (self.n + 1)  # 1-based
        for i, v in enumerate(nums):
            self._add(i + 1, v)

    def _add(self, i, delta):
        while i <= self.n:
            self.tree[i] += delta
            i += i & -i  # the next cell that covers i

    def _prefix(self, i):
        total = 0
        while i > 0:
            total += self.tree[i]
            i -= i & -i  # drop the lowest set bit
        return total

    def update(self, index, val):
        self._add(index + 1, val - self.nums[index])
        self.nums[index] = val

    def sumRange(self, left, right):
        return self._prefix(right + 1) - self._prefix(left)
'''
pitfalls = [
    "The tree is 1-based: shift every index by one.",
    "update takes the difference from the old value, not the new value.",
    "A range sum is the difference of two prefix sums.",
]
examples = ["range-sum-query-mutable", "range-sum-query-2d-mutable", "range-sum-query-immutable"]

[[extra.variant]]
name = "2-D Fenwick tree"
note = "The same idea in two dimensions: update and prefix walk both indexes."
template = '''
class NumMatrix:
    def __init__(self, matrix):
        self.m, self.n = len(matrix), len(matrix[0])
        self.a = [[0] * self.n for _ in range(self.m)]
        self.t = [[0] * (self.n + 1) for _ in range(self.m + 1)]
        for i in range(self.m):
            for j in range(self.n):
                self.update(i, j, matrix[i][j])

    def update(self, row, col, val):
        delta, self.a[row][col] = val - self.a[row][col], val
        i = row + 1
        while i <= self.m:
            j = col + 1
            while j <= self.n:
                self.t[i][j] += delta
                j += j & -j
            i += i & -i

    def _prefix(self, row, col):  # the sum of rows < row and cols < col
        total, i = 0, row
        while i > 0:
            j = col
            while j > 0:
                total += self.t[i][j]
                j -= j & -j
            i -= i & -i
        return total

    def sumRegion(self, r1, c1, r2, c2):
        return (self._prefix(r2 + 1, c2 + 1) - self._prefix(r1, c2 + 1)
                - self._prefix(r2 + 1, c1) + self._prefix(r1, c1))
'''

