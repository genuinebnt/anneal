[[extra]]
id = "Arrays & Hashing:prefix-function"
name = "Prefix function (KMP) for borders"
group = "Hashing structures"
signals = [
    "the longest proper prefix of a string that is also a suffix (a border)",
    "the failure table pi[i]: the border length of s[:i + 1], built in O(n)",
    "a string is a repetition of a shorter block when n - pi[-1] divides n",
]
template_name = "Longest happy prefix"
template = '''
def longest_prefix(s):
    pi = [0] * len(s)  # pi[i]: longest border of s[:i + 1]
    k = 0
    for i in range(1, len(s)):
        while k and s[i] != s[k]:
            k = pi[k - 1]  # fall back to a shorter border
        if s[i] == s[k]:
            k += 1
        pi[i] = k
    return s[:pi[-1]] if s else ""
'''
pitfalls = [
    "On a mismatch fall back to pi[k - 1], not to 0: a shorter border may still match.",
    "k never decreases more than it has increased, so the whole loop is O(n).",
    "The same table drives KMP search: run it over pattern + '#' + text.",
]
examples = ["longest-happy-prefix", "repeated-substring-pattern", "shortest-palindrome", "find-the-index-of-the-first-occurrence-in-a-string"]

[[extra.variant]]
name = "Repeated substring pattern"
note = "The shortest repeating block has length n - pi[-1]; the string repeats it when that divides n."
template = '''
def repeated_substring_pattern(s):
    n = len(s)
    pi, k = [0] * n, 0
    for i in range(1, n):
        while k and s[i] != s[k]:
            k = pi[k - 1]
        if s[i] == s[k]:
            k += 1
        pi[i] = k
    block = n - pi[-1]
    return pi[-1] > 0 and n % block == 0
'''

