template = '''
def max_compatibility_sum(students, mentors):
    """Match each student with one mentor: most agreeing answers."""
    n = len(students)
    fit = [[sum(x == y for x, y in zip(s, m)) for m in mentors]
           for s in students]
    dp = [-1] * (1 << n)  # dp[mask]: the first popcount(mask) students
    dp[0] = 0             # are matched with exactly the mentors in mask
    for mask in range(1 << n):
        if dp[mask] < 0:
            continue
        i = bin(mask).count("1")  # the next student to place
        if i == n:
            continue
        for j in range(n):
            if not mask >> j & 1:
                nxt = mask | 1 << j
                dp[nxt] = max(dp[nxt], dp[mask] + fit[i][j])
    return dp[(1 << n) - 1]
'''
