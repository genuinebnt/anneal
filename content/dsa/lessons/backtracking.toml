template = '''
def lexical_order(n):
    """1..n in dictionary order, without building strings."""
    out, cur = [], 1
    for _ in range(n):
        out.append(cur)
        if cur * 10 <= n:
            cur *= 10  # one level deeper
        else:
            if cur >= n:
                cur //= 10  # the last leaf: climb first
            cur += 1
            while cur % 10 == 0:
                cur //= 10  # a carry: 19 -> 2, not 20
    return out
'''
pitfalls = [
    "Going deeper (x10) comes first; only when that is past n do you move to the next sibling (+1).",
    "After +1 you can land on a number that ends in 0 (19 + 1 = 20): drop the zeros to return to the parent's sibling.",
    "The depth is only about 6 for n up to 10^6 or more: the walk is O(n) with O(1) memory.",
]
examples = ["lexicographical-numbers", "k-th-smallest-in-lexicographical-order"]

