template = '''
def restore_ip_addresses(s):
    out = []

    def go(i, parts):
        if len(parts) == 4:
            if i == len(s):
                out.append(".".join(parts))
            return
        for size in (1, 2, 3):
            if i + size > len(s):
                break
            piece = s[i:i + size]
            if (len(piece) > 1 and piece[0] == "0") or int(piece) > 255:
                continue
            go(i + size, parts + [piece])

    go(0, [])
    return out
'''
pitfalls = [
    "Reject a leading zero for a multi-digit piece and check the range before recursing.",
    "Prune with lengths: the rest of the string must still fit into the remaining parts.",
    "For a sequence rule (Fibonacci), the first two pieces decide the rest: loop over them and verify, instead of branching at every cut.",
]
examples = ["restore-ip-addresses", "additive-number", "split-array-into-fibonacci-sequence", "splitting-a-string-into-descending-consecutive-values"]

[[extra]]
id = "Backtracking:sudoku"
name = "Sudoku: constraint sets and the most constrained cell"
group = "Constraint satisfaction"
signals = [
    "fill a board so that row, column and box constraints all hold",
    "the choices for a cell shrink as the board fills",
    "plain left-to-right filling is too slow: the order of cells matters",
]
template = '''
def solve_sudoku(board):
    """board: 9 lists of 9 characters, '.' for empty. Solved in place."""
    used = [set() for _ in range(27)]  # 9 rows, 9 columns, 9 boxes

    def groups(r, c):
        return used[r], used[9 + c], used[18 + r // 3 * 3 + c // 3]

    empty = []
    for r in range(9):
        for c in range(9):
            if board[r][c] == ".":
                empty.append((r, c))
            else:
                for g in groups(r, c):
                    g.add(board[r][c])

    def options(r, c):
        row, col, box = groups(r, c)
        return [d for d in "123456789"
                if d not in row and d not in col and d not in box]

    def go():
        if not empty:
            return True
        # the cell with the fewest options goes first
        k = min(range(len(empty)), key=lambda i: len(options(*empty[i])))
        empty[k], empty[-1] = empty[-1], empty[k]
        r, c = empty.pop()
        for d in options(r, c):
            board[r][c] = d
            for g in groups(r, c):
                g.add(d)
            if go():
                return True
            for g in groups(r, c):
                g.discard(d)
        board[r][c] = "."
        empty.append((r, c))
        return False

    go()
'''
pitfalls = [
    "Undo everything you set (the board cell and all three sets) before trying the next digit.",
    "Choosing the cell with the fewest options first is what turns a hopeless search into a fast one.",
    "Restore the cell to the empty list on failure: the caller may try its next digit.",
]
examples = ["sudoku-solver", "valid-sudoku", "n-queens-ii"]

[[extra]]
id = "Backtracking:kth-permutation"
name = "The k-th permutation, and the next one"
group = "Iterative generation"
signals = [
    "the answer is one permutation in lexicographic order, not all of them",
    "k can be huge, so counting beats generating",
    "the next arrangement in order, in place and without extra memory",
]
template_name = "k-th permutation (factorial digits)"
template = '''
from math import factorial


def get_permutation(n, k):
    """The k-th (1-based) permutation of 1..n in lexicographic order."""
    digits = list(range(1, n + 1))
    k -= 1
    out = []
    for i in range(n, 0, -1):
        block = factorial(i - 1)  # permutations that share a first digit
        index, k = divmod(k, block)
        out.append(str(digits.pop(index)))
    return "".join(out)
'''
pitfalls = [
    "Make k zero-based first: then divmod gives the digit's index directly.",
    "Each digit fixes (i - 1)! permutations: count them, never generate them.",
    "Remove the used digit from the list so the next position sees only what is left.",
]
examples = ["permutation-sequence", "next-permutation", "the-k-th-lexicographical-string-of-all-happy-strings-of-length-n"]

[[extra.variant]]
name = "Next permutation (in place)"
note = "Find the rightmost ascent, swap with the next larger value to its right, and reverse the tail."
template = '''
def next_permutation(nums):
    i = len(nums) - 2
    while i >= 0 and nums[i] >= nums[i + 1]:
        i -= 1  # the rightmost position that can still grow
    if i >= 0:
        j = len(nums) - 1
        while nums[j] <= nums[i]:
            j -= 1
        nums[i], nums[j] = nums[j], nums[i]
    nums[i + 1:] = reversed(nums[i + 1:])  # the smallest tail
'''

[[extra]]
id = "Backtracking:path-undo"
name = "Enumerating paths with a shared path list"
group = "Path enumeration in graphs and trees"
signals = [
    "list every path from a start to a goal in a DAG or a tree",
    "the path is built while descending: append on the way down, pop on the way back",
    "no visited set is needed because the structure has no cycles",
]
template = '''
def all_paths(graph):
    """All paths from node 0 to node n - 1 of a DAG (adjacency lists)."""
    n = len(graph)
    out, path = [], [0]

    def go(u):
        if u == n - 1:
            out.append(path[:])  # copy: the list is reused
            return
        for v in graph[u]:
            path.append(v)
            go(v)
            path.pop()

    go(0)
    return out
'''
pitfalls = [
    "Copy the path when recording it, and pop after every recursive call.",
    "In a graph that may have cycles you also need a per-path visited set that you undo.",
    "The number of paths can be exponential: the output size is the lower bound on the work.",
]
examples = ["all-paths-from-source-to-target", "binary-tree-paths", "path-sum-ii"]

[[extra]]
id = "Backtracking:meet-in-the-middle"
name = "Meet in the middle"
group = "Meet in the middle"
signals = [
    "n is about 30 to 40: 2^n is too many, 2^(n/2) is fine",
    "choose a subset whose sum is closest to a target, or count subsets with a given sum",
    "the two halves interact only through one number (a sum, a difference)",
]
template = '''
from bisect import bisect_left


def closest_subset_sum(nums, goal):
    """Smallest |sum(subset) - goal| over all subsets."""
    def sums(a):
        out = [0]
        for x in a:
            out += [v + x for v in out]
        return out

    half = len(nums) // 2
    left = sums(nums[:half])
    right = sorted(sums(nums[half:]))
    best = abs(goal)
    for a in left:
        i = bisect_left(right, goal - a)
        for j in (i - 1, i):  # the two neighbours of the ideal partner
            if 0 <= j < len(right):
                best = min(best, abs(a + right[j] - goal))
    return best
'''
pitfalls = [
    "Sort one half and binary search from the other: that is the O(2^(n/2) * n) step.",
    "Check both neighbours of the insertion point: the closest value is on either side.",
