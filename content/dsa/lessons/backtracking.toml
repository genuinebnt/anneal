template = '''
def count_arrangements(n):
    """Permutations of 1..n where each value divides its position
    or the position divides the value."""
    used = [False] * (n + 1)

    def go(pos):
        if pos == 0:
            return 1
        total = 0
        for v in range(1, n + 1):
            if not used[v] and (v % pos == 0 or pos % v == 0):
                used[v] = True
                total += go(pos - 1)
                used[v] = False
        return total

    return go(n)  # fill from the last slot: it is the most constrained
'''
