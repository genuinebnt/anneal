template = '''
def distribute_cookies(cookies, k):
    """Minimise the largest total any of k children gets."""
    cookies = sorted(cookies, reverse=True)  # big items fail fast
    loads = [0] * k
    best = [sum(cookies)]

    def go(i):
        if i == len(cookies):
            best[0] = min(best[0], max(loads))
            return
        seen = set()
        for b in range(k):
            if loads[b] in seen or loads[b] + cookies[i] >= best[0]:
                continue  # same load as another bucket, or no better
            seen.add(loads[b])
            loads[b] += cookies[i]
            go(i + 1)
            loads[b] -= cookies[i]

    go(0)
    return best[0]
'''
pitfalls = [
    "Seed the bound with a feasible answer (here: everything to one child) or the first branches prune nothing.",
    "Skip a bucket whose load equals one you already tried at this level: it is a symmetric branch.",
    "Place the largest items first: they fail (and prune) earliest.",
]
examples = ["fair-distribution-of-cookies", "find-minimum-time-to-finish-all-jobs", "partition-to-k-equal-sum-subsets"]

