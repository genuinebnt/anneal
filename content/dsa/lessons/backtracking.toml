template = '''
def is_solvable(words, result):
    weight = {}
    for w in words:
        for i, ch in enumerate(reversed(w)):
            weight[ch] = weight.get(ch, 0) + 10 ** i
    for i, ch in enumerate(reversed(result)):
        weight[ch] = weight.get(ch, 0) - 10 ** i
    leading = {w[0] for w in words + [result] if len(w) > 1}
    letters = list(weight)
    used = [False] * 10

    def go(i, total):
        if i == len(letters):
            return total == 0  # the equation holds
        for d in range(10):
            if used[d] or (d == 0 and letters[i] in leading):
                continue
            used[d] = True
            ok = go(i + 1, total + weight[letters[i]] * d)
            used[d] = False
            if ok:
                return True
        return False

    return go(0, 0)
'''
pitfalls = [
    "Add each word with positive weights and the result with negative ones: a solution is a total of exactly zero.",
    "A letter at the front of a longer word cannot be 0, but a one-letter word may be 0.",
    "At most 10 letters can exist: 10! assignments at worst, so no further pruning is needed.",
]
examples = ["verbal-arithmetic-puzzle"]

