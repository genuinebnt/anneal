pattern = "Backtracking"
intro = "Backtracking builds an answer one choice at a time and undoes the choice to try the next. Picture a tree of decisions: at each node you choose, recurse, and un-choose. What changes between problems is what a choice is, when a branch is dead (prune early), and when the path so far is a complete answer."
groups = ["Subsets, combinations and permutations", "Constraint satisfaction", "Partitioning", "String generation", "Grid and word search with visited state", "Path enumeration in graphs and trees", "Pruning techniques", "Bitmask state", "Meet in the middle", "Iterative generation", "Branch and bound and search order", "Game-tree search", "Backtracking versus DP boundary", "Core implementation patterns"]










[[technique]]
id = "Backtracking:include-exclude"
walk = "bt-subsets"
group = "Subsets, combinations and permutations"
signals = [
    "all subsets, or all selections from a list",
    "for each item the choice is: take it, or skip it",
    "the number of results is 2 to the power n",
]
template = '''
def subsets(nums):
    result, path = [], []

    def choose(i):
        if i == len(nums):
            result.append(path[:])  # a copy: path keeps changing
            return
        path.append(nums[i])  # take it
        choose(i + 1)
        path.pop()  # undo, then skip it
        choose(i + 1)

    choose(0)
    return result
'''
pitfalls = [
    "Append a COPY of the path (path[:]). Appending the list itself stores one list that keeps changing.",
    "Every append needs a matching pop, or later branches inherit stale choices.",
    "The output has 2 to the n subsets, so O(n times 2 to the n) is the best possible.",
]

[[technique]]
id = "Backtracking:reuse"
group = "Subsets, combinations and permutations"
signals = [
    "combinations that add up to a target, where an item may be used many times",
    "pass a start index so each combination is built in one order",
    "stop a branch when the remaining target goes negative",
]
template = '''
def combination_sum(candidates, target):
    result, path = [], []

    def go(start, remaining):
        if remaining == 0:
            result.append(path[:])
            return
        for i in range(start, len(candidates)):
            if candidates[i] > remaining:
                continue  # too big (sort first and break to prune harder)
            path.append(candidates[i])
            go(i, remaining - candidates[i])  # i, not i + 1: reuse allowed
            path.pop()

    go(0, target)
    return result
'''
pitfalls = [
    "Recurse with i (not i + 1) to allow reuse, and loop from start (not 0) so [2, 3] and [3, 2] aren't both produced.",
    "Sort the candidates and break at the first one that is too big to cut whole branches.",
    "The start index is what makes these combinations and not permutations.",
]

[[technique]]
id = "Backtracking:skip-dups"
group = "Subsets, combinations and permutations"
signals = [
    "the input has repeated values, but the answer must not repeat a combination",
    "each item can be used once",
    "sort, then skip a value equal to the previous one at the same depth",
]
template = '''
def combination_sum2(candidates, target):
    candidates.sort()
    result, path = [], []

    def go(start, remaining):
        if remaining == 0:
            result.append(path[:])
            return
        for i in range(start, len(candidates)):
            if i > start and candidates[i] == candidates[i - 1]:
                continue  # same value already tried at this level
            if candidates[i] > remaining:
                break
            path.append(candidates[i])
            go(i + 1, remaining - candidates[i])  # each item used once
            path.pop()

    go(0, target)
    return result
'''
pitfalls = [
    "The check is i > start, not i > 0. A duplicate is only skipped at the SAME level, so [1, 1, 6] can still use both ones.",
    "Sorting first puts equal values next to each other.",
    "The same trick removes duplicates from subsets and permutations of a list with repeated values.",
]

[[technique]]
id = "Backtracking:permute"
group = "Subsets, combinations and permutations"
signals = [
    "all orderings of the items",
    "every position gets one of the items not yet used",
    "n factorial results",
]
template = '''
def permutations(nums):
    result, path = [], []
    used = [False] * len(nums)

    def go():
        if len(path) == len(nums):
            result.append(path[:])
            return
        for i in range(len(nums)):
            if not used[i]:
                used[i] = True
                path.append(nums[i])
                go()
                path.pop()
                used[i] = False

    go()
    return result
'''
pitfalls = [
    "Track which items are used, by index, not by value. Values may repeat.",
    "Unmark on the way out, in the reverse order you marked.",
    "The swap-in-place version needs no used array but is harder to get right the first time.",
]

[[technique]]
id = "Backtracking:construct"
group = "String generation"
signals = [
    "build every valid string or sequence under a rule (balanced brackets, a phone-number mapping)",
    "at each step there are a few legal next characters",
    "prune the moment a prefix can no longer become valid",
]
template = '''
def generate_parentheses(n):
    result = []

    def build(prefix, opened, closed):
        if len(prefix) == 2 * n:
            result.append(prefix)
            return
        if opened < n:
            build(prefix + "(", opened + 1, closed)
        if closed < opened:  # only close what is open
            build(prefix + ")", opened, closed + 1)

    build("", 0, 0)
    return result
'''
pitfalls = [
    "Only generate legal prefixes (never close more than you opened). Then every leaf is valid and no filtering is needed.",
    "Passing the prefix as a string makes each call independent, so no undo step is needed.",
    "The count of results is a Catalan number, so the work is proportional to the output.",
]

[[technique]]
id = "Backtracking:grid"
group = "Grid and word search with visited state"
signals = [
    "find a path of cells in a grid that spells a word or satisfies a rule",
    "a cell can't be used twice in the same path",
    "try each of four directions, and un-mark the cell when you back out",
]
template = '''
def exist(board, word):
    rows, cols = len(board), len(board[0])

    def go(r, c, k):
        if k == len(word):
            return True
        if not (0 <= r < rows and 0 <= c < cols) or board[r][c] != word[k]:
            return False
        letter, board[r][c] = board[r][c], "#"  # mark this cell as used
        found = any(go(r + dr, c + dc, k + 1)
                    for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)))
        board[r][c] = letter  # put it back for other paths
        return found

    return any(go(r, c, 0) for r in range(rows) for c in range(cols))
'''
pitfalls = [
    "Restore the cell after exploring. Forgetting makes later paths see it as used.",
    "Check the bounds before indexing, and the letter before recursing.",
    "Find the word's rarest letter, or the shorter end, to start from when the grid is large.",
]

[[technique]]
id = "Backtracking:partition-k"
group = "Bitmask state"
signals = [
    "split items into k groups with equal sums",
    "put each item into one of k buckets, without any bucket overflowing",
    "sort in descending order so the awkward items are placed first",
]
template = '''
def can_make_square(sticks):
    total = sum(sticks)
    if total % 4:
        return False
    side = total // 4
    sticks = sorted(sticks, reverse=True)  # big sticks first: fail early
    if sticks[0] > side:
        return False
    sides = [0] * 4

    def place(i):
        if i == len(sticks):
            return True
        tried = set()
        for s in range(4):
            if sides[s] + sticks[i] > side or sides[s] in tried:
                continue
            tried.add(sides[s])  # equal sides are interchangeable
            sides[s] += sticks[i]
            if place(i + 1):
                return True
            sides[s] -= sticks[i]
        return False

    return place(0)
'''
pitfalls = [
    "Two prunings matter: sort descending, and skip a bucket whose current total equals one already tried at this level.",
    "Check the total is divisible by k and no item is bigger than the target first.",
    "For up to about 16 items a bitmask DP over which items are used is the alternative.",
]

[[technique]]
id = "Backtracking:n-queens"
walk = "bt-queens"
group = "Constraint satisfaction"
template_name = "Sets"
signals = [
    "place pieces on a board so none attack each other",
    "one piece per row, so the only choice is the column",
    "track which columns and diagonals are taken in sets",
]
template = '''
def solve_n_queens(n):
    result, cols = [], []  # cols[r] is the column of the queen in row r
    taken_cols, diag, anti = set(), set(), set()

    def place(r):
        if r == n:
            result.append(["." * c + "Q" + "." * (n - c - 1) for c in cols])
            return
        for c in range(n):
            if c in taken_cols or r - c in diag or r + c in anti:
                continue
            for s, v in ((taken_cols, c), (diag, r - c), (anti, r + c)):
                s.add(v)
            cols.append(c)
            place(r + 1)
            cols.pop()
            for s, v in ((taken_cols, c), (diag, r - c), (anti, r + c)):
                s.remove(v)

    place(0)
    return result
'''
pitfalls = [
    "Squares on one diagonal share r - c. Squares on one anti-diagonal share r + c. Those two numbers are the set keys.",
    "Placing one queen per row guarantees no two share a row, so rows are never checked.",
    "Add to all three sets before recursing and remove from all three after.",
]

[[technique.variant]]
name = "Bitmasks"
note = "Columns and both diagonals as bits of one integer each: the free columns of a row are one expression."
template = '''
def total_n_queens(n):
    full = (1 << n) - 1

    def go(cols, d1, d2):
        if cols == full:
            return 1
        count = 0
        free = full & ~(cols | d1 | d2)  # columns still safe in this row
        while free:
            bit = free & -free  # the lowest free column
            free ^= bit
            count += go(cols | bit, (d1 | bit) << 1 & full, (d2 | bit) >> 1)
        return count

    return go(0, 0, 0)
'''

[[technique]]
id = "Backtracking:split-memo"
group = "Backtracking versus DP boundary"
signals = [
    "split a string into words from a dictionary, and list every way",
    "from each position, try every word that matches there",
    "the same suffix is reached many times, so cache its results",
]
template = '''
def word_break(s, words):
    words = set(words)
    lengths = {len(w) for w in words}
    memo = {}

    def sentences(i):  # every way to split s[i:]
        if i == len(s):
            return [""]
        if i not in memo:
            memo[i] = [
                s[i:i + n] + (" " + rest if rest else "")
                for n in lengths
                if s[i:i + n] in words
                for rest in sentences(i + n)
            ]
        return memo[i]

    return sentences(0)
'''
pitfalls = [
    "Memoise on the start index. Without it, a string with many dead ends takes exponential time.",
    "The base case returns [''] (one way: nothing left), so the join step can leave out the extra space.",
    "Looping over the distinct word lengths is cheaper than testing every word at each position.",
]

[[extra]]
id = "Backtracking:combinations-k"
name = "Combinations of k items"
group = "Subsets, combinations and permutations"
signals = [
    "choose exactly k items from n, in any order, with no repeats",
    "the answer lists every k-subset (or counts the ways to pick k that satisfy a rule)",
    "the numbers or items are distinct and each is used at most once",
]
template = '''
def combine(n, k):
    """Every k-subset of 1..n."""
    out, path = [], []

    def go(start):
        if len(path) == k:
            out.append(path[:])
            return
        # stop early: fewer than k - len(path) numbers are left
        for x in range(start, n - (k - len(path)) + 2):
            path.append(x)
            go(x + 1)
            path.pop()

    go(1)
    return out
'''
pitfalls = [
    "Start the next loop at x + 1: that is what makes (1, 2) and (2, 1) the same combination.",
    "Copy the path (path[:]) when you record it: the list keeps changing.",
    "The upper bound of the loop prunes dead branches: without it the search still works but visits many partial paths that cannot reach size k.",
]
examples = ["combinations", "combination-sum-iii", "subsets", "permutations"]

[[extra]]
id = "Backtracking:bitmask-subsets"
name = "Every subset as a bitmask"
group = "Bitmask state"
signals = [
    "n is at most about 20 and you must look at every subset",
    "a subset needs a quick membership test or a quick union (OR) with another",
    "checking a condition on every subset is cheaper than building them recursively",
]
template = '''
def all_subsets(nums):
    """Subset number m holds nums[i] when bit i of m is set."""
    n = len(nums)
    return [[nums[i] for i in range(n) if mask >> i & 1]
            for mask in range(1 << n)]


def count_subsets(nums, ok):
    """How many subsets satisfy ok(list)."""
    n = len(nums)
    total = 0
    for mask in range(1 << n):
        if ok([nums[i] for i in range(n) if mask >> i & 1]):
            total += 1
    return total
'''
pitfalls = [
    "1 << n subsets: for n = 20 that is a million; the check per subset must be cheap.",
    "Test a bit with (mask >> i) & 1, not mask & i.",
    "Precedence: in Python, mask >> i & 1 is (mask >> i) & 1, but write the parentheses when it is not obvious.",
]
examples = ["subsets", "maximum-length-of-a-concatenated-string-with-unique-characters", "the-number-of-beautiful-subsets", "count-number-of-maximum-bitwise-or-subsets"]

[[extra]]
id = "Backtracking:letter-product"
name = "One choice per position"
group = "String generation"
signals = [
    "each position of the answer picks one option from its own small set",
    "phone-keypad letters, upper or lower case, one of several spellings",
    "the answer size is the product of the options, so every answer is listed",
]
template = '''
KEYS = {"2": "abc", "3": "def", "4": "ghi", "5": "jkl",
        "6": "mno", "7": "pqrs", "8": "tuv", "9": "wxyz"}


def letter_combinations(digits):
    if not digits:
        return []
    out = [""]
    for d in digits:
        out = [prefix + c for prefix in out for c in KEYS[d]]
    return out


def letter_case_permutations(s):
    out = [""]
    for ch in s:
        options = {ch.lower(), ch.upper()}  # one option for a digit
        out = [prefix + c for prefix in out for c in options]
    return out
'''
pitfalls = [
    "An empty input has no combinations ([]), not one empty string ([\"\"]) in the phone problem.",
    "The answer is exponential: build it level by level (as here) or recurse, but never construct strings by repeated concatenation inside the innermost loop more than once.",
    "A digit has no case: the set {c.lower(), c.upper()} has one element for it.",
]
examples = ["letter-combinations-of-a-phone-number", "letter-case-permutation", "brace-expansion"]

[[extra]]
id = "Backtracking:min-removals"
name = "Fewest removals by BFS levels"
group = "String generation"
signals = [
    "remove the fewest characters (or edits) so that a string becomes valid, and list every result",
    "all answers have the same length, so breadth first search stops at the first valid level",
    "the string is short (about 25 characters or fewer)",
]
template = '''
def remove_invalid_parentheses(s):
    def valid(t):
        open_ = 0
        for ch in t:
            if ch == "(":
                open_ += 1
            elif ch == ")":
                open_ -= 1
                if open_ < 0:
                    return False
        return open_ == 0

    level = {s}
    while level:
        good = [t for t in level if valid(t)]
        if good:
            return good  # the fewest removals: stop at this level
        level = {t[:i] + t[i + 1:] for t in level
                 for i in range(len(t)) if t[i] in "()"}
    return [""]
'''
pitfalls = [
    "Use a set per level: removing different characters often gives the same string, and duplicates multiply.",
    "Stop at the first level that has a valid string: deeper levels remove more than needed.",
    "Only remove parentheses; letters are never removed.",
]
examples = ["remove-invalid-parentheses", "minimum-remove-to-make-valid-parentheses"]

[[extra]]
id = "Backtracking:operators"
name = "Inserting operators with a carried operand"
group = "String generation"
signals = [
    "place +, - or * between the digits of a string so that the expression equals a target",
    "multiplication binds tighter, so the last term must be undone and redone",
    "numbers cannot have leading zeros",
]
template = '''
def add_operators(num, target):
    out = []

    def go(i, expr, value, last):
        # value: the total so far; last: the term a * could still extend
        if i == len(num):
            if value == target:
                out.append(expr)
            return
        for j in range(i, len(num)):
            if j > i and num[i] == "0":
                break  # no leading zeros
            piece = num[i:j + 1]
            v = int(piece)
            if i == 0:
                go(j + 1, piece, v, v)
            else:
                go(j + 1, expr + "+" + piece, value + v, v)
                go(j + 1, expr + "-" + piece, value - v, -v)
                go(j + 1, expr + "*" + piece,
                   value - last + last * v, last * v)

    go(0, "", 0, 0)
    return out
'''
pitfalls = [
    "For *, take the last term back out of the total and put last * v back in: 2 + 3 * 4 is 2 + 12, not 5 * 4.",
    "Keep the sign inside last (-v for a minus): then a following * multiplies the signed term.",
    "A piece such as \"05\" is not allowed, but \"0\" alone is.",
]
examples = ["expression-add-operators", "different-ways-to-add-parentheses"]

[[extra]]
id = "Backtracking:segments"
name = "Cutting a string into valid segments"
group = "Partitioning"
signals = [
    "cut a digit string into a fixed number of pieces that each obey a rule (range, no leading zero)",
    "the number of cut points is small, so every split can be tried",
    "the pieces are numbers: a Fibonacci-like or descending sequence, or the parts of an IP address",
