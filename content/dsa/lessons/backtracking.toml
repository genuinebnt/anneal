from collections import Counter


def max_score_words(words, letters, score):
    have = Counter(letters)
    need = [Counter(w) for w in words]
    value = [sum(score[ord(c) - 97] for c in w) for w in words]

    def go(i):
        if i == len(words):
            return 0
        best = go(i + 1)  # skip word i
        if all(have[c] >= n for c, n in need[i].items()):
            have.subtract(need[i])  # take it
            best = max(best, value[i] + go(i + 1))
            have.update(need[i])  # give it back
        return best

    return go(0)
'''
