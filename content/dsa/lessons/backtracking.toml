name = "K-th in dictionary order"
note = "Count the numbers under a prefix, and skip the whole subtree when k is not inside it."
template = '''
def find_kth_number(n, k):
    cur, k = 1, k - 1  # k more steps from 1
    while k > 0:
        steps, lo, hi = 0, cur, cur + 1
        while lo <= n:  # numbers under cur, level by level
            steps += min(n + 1, hi) - lo
            lo *= 10
            hi *= 10
        if steps <= k:
            k -= steps  # the answer is not under cur: next sibling
            cur += 1
        else:
            k -= 1  # inside: go to the first child
            cur *= 10
    return cur
'''

