template = '''
from functools import cache


def can_i_win(max_choosable, desired_total):
    if desired_total <= 0:
        return True
    if max_choosable * (max_choosable + 1) // 2 < desired_total:
        return False  # nobody can reach the total

    @cache
    def win(used, remaining):
        # used is a bitmask; the remaining total follows from it
        for x in range(1, max_choosable + 1):
            bit = 1 << x
            if used & bit:
                continue
            if x >= remaining or not win(used | bit, remaining - x):
                return True  # win now, or leave the opponent losing
        return False

    return win(0, desired_total)
'''
