            best = count
            return
        for j in range(i + 1, len(s) + 1):
            piece = s[i:j]
            if piece not in seen:
                seen.add(piece)
                go(j, count + 1)
                seen.discard(piece)

    go(0, 0)
    return best
'''
pitfalls = [
    "Undo the seen set after each recursive call, or a piece would stay forbidden for the other branches.",
    "The bound count + remaining characters is the most that can still be reached: cut the branch when it cannot beat best.",
    "The result is the number of pieces, not the pieces themselves: no list is built.",
]
examples = ["split-a-string-into-the-max-number-of-unique-substrings"]

[[extra]]
id = "Backtracking:lazy-iterator"
name = "Lazy generation: an iterator over combinations"
group = "Iterative generation"
signals = [
    "an object must hand out the next combination on demand, with next() and hasNext()",
    "the full list is too big to build, so only the current one is kept",
    "the next combination is found from the current one by changing the rightmost index that can move",
]
template = '''
class CombinationIterator:
    def __init__(self, characters, k):
        self.chars, self.k = characters, k
        self.idx = list(range(k))  # positions of the current one
        self.done = k > len(characters)

    def next(self):
        out = "".join(self.chars[i] for i in self.idx)
        self._advance()
        return out

    def hasNext(self):
        return not self.done

    def _advance(self):
        n, k = len(self.chars), self.k
        i = k - 1
        while i >= 0 and self.idx[i] == n - k + i:
            i -= 1  # already at its largest possible position
        if i < 0:
            self.done = True
            return
        self.idx[i] += 1
        for j in range(i + 1, k):  # the tail restarts right after it
            self.idx[j] = self.idx[j - 1] + 1
'''
pitfalls = [
    "Find the rightmost index that has room (it can still move right), move it by one, and reset everything after it.",
    "Advance when the current one is handed out, so hasNext is a single flag.",
    "A Python generator over itertools.combinations is simpler when no class is required.",
]
examples = ["iterator-for-combination"]

