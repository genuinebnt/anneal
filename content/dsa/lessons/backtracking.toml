template_name = "Itinerary"
template = '''
from collections import defaultdict


def find_itinerary(tickets):
    """Use every ticket once, starting at JFK, smallest route first."""
    graph = defaultdict(list)
    for a, b in sorted(tickets, reverse=True):  # pop() = smallest
        graph[a].append(b)
    route = []

    def visit(city):
        while graph[city]:
            visit(graph[city].pop())  # use the ticket, never again
        route.append(city)  # added when stuck: post-order

    visit("JFK")
    return route[::-1]
'''
pitfalls = [
    "Add a city to the route when it is stuck (after the loop), then reverse: the dead end must come last in the route.",
    "Remove a ticket as it is used (pop): that is the only visited state needed.",
    "Plain backtracking also works but is slow in the worst case; Hierholzer visits every edge once, O(E log E) with the sort.",
]
examples = ["reconstruct-itinerary", "valid-arrangement-of-pairs", "cracking-the-safe"]

[[extra.variant]]
name = "De Bruijn sequence (the safe)"
note = "Nodes are the last n - 1 digits; every edge is one more digit; an Eulerian circuit visits every n-digit password."
template = '''
def crack_safe(n, k):
    seen, out = set(), []

    def visit(node):
        for d in map(str, range(k)):
            edge = node + d
            if edge not in seen:
                seen.add(edge)
                visit(edge[1:])
                out.append(d)  # post-order, as in Hierholzer

    start = "0" * (n - 1)
    visit(start)
    return "".join(out) + start
'''

