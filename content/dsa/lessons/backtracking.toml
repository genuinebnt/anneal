from functools import cache
from operator import add, mul, sub

OPS = {"+": add, "-": sub, "*": mul}


def diff_ways_to_compute(expression):
    @cache
    def go(s):
        if s.isdigit():
            return [int(s)]
        out = []
        for i, ch in enumerate(s):
            if ch in OPS:
                for a in go(s[:i]):  # every result of the left part
                    for b in go(s[i + 1:]):  # paired with every right one
                        out.append(OPS[ch](a, b))
        return out

    return sorted(go(expression))
'''
