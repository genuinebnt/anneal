    "a plain DFS over all paths is exponential, but the shortest ones are few",
    "BFS first for distances and parents, then DFS from the target back to the source",
]
template = '''
from collections import defaultdict


def find_ladders(begin, end, words):
    words = set(words)
    if end not in words:
        return []
    parents = defaultdict(set)  # word -> words one step nearer to begin
    level, seen, found = {begin}, {begin}, False
    while level and not found:
        nxt = set()
        for w in level:
            for i in range(len(w)):
                for c in "abcdefghijklmnopqrstuvwxyz":
                    v = w[:i] + c + w[i + 1:]
                    if v in words and v not in seen:
                        nxt.add(v)
                        parents[v].add(w)
                        found = found or v == end
        seen |= nxt  # a whole level at once, after it is complete
        level = nxt
    out, path = [], [end]

    def back(w):
        if w == begin:
            out.append(path[::-1])
            return
        for p in parents[w]:
            path.append(p)
            back(p)
            path.pop()

    if found:
        back(end)
    return out
'''
pitfalls = [
    "Mark words as seen only when their whole level is done: two words of the same level may both lead to a third one, and both parents are needed.",
    "Stop at the level that contains the target: deeper levels only give longer paths.",
    "Walk back from the target through the parents: walking forward wastes time on branches that never reach it.",
]
examples = ["word-ladder-ii"]

