    "a valid structure exists if any combination of choices reaches the top",
]
template = '''
from collections import defaultdict
from functools import cache


def pyramid_transition(bottom, allowed):
    rules = defaultdict(list)
    for a, b, c in allowed:  # a and b side by side may carry c above
        rules[a + b].append(c)

    @cache
    def can_build(row):
        if len(row) == 1:
            return True

        def above(i, cur):  # choose the block above position i
            if i == len(row) - 1:
                return can_build(cur)
            return any(above(i + 1, cur + c) for c in rules[row[i:i + 2]])

        return above(0, "")

    return can_build(bottom)
'''
pitfalls = [
    "Memoise on the row: different choices below often produce the same row above.",
    "A pair with no rule has no options, which fails that branch immediately: rules[...] must be read without inserting.",
    "Build the next row position by position and recurse only when it is complete.",
]
