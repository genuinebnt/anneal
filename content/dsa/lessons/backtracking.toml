]
template_name = "Grid (maximum gold)"
template = '''
def get_maximum_gold(grid):
    rows, cols = len(grid), len(grid[0])

    def go(r, c):
        gold = grid[r][c]
        grid[r][c] = 0  # mark: a visited cell looks empty
        best = 0
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < rows and 0 <= b < cols and grid[a][b]:
                best = max(best, go(a, b))
        grid[r][c] = gold  # restore for the next walk
        return gold + best

    return max((go(r, c) for r in range(rows) for c in range(cols)
                if grid[r][c]), default=0)
'''
pitfalls = [
    "Restore the cell after exploring it: the next start must see the grid as it was.",
    "Start the walk from every non-empty cell: the best walk does not have to begin at a corner.",
    "Mutating the grid is the visited set; with a graph use a counter per node and undo it.",
]
examples = ["path-with-maximum-gold", "maximum-path-quality-of-a-graph", "unique-paths-iii"]

[[extra.variant]]
name = "Graph with a time limit"
note = "A node's value counts the first time it is visited in this walk; the walk must return to node 0 within the time."
template = '''
def maximal_path_quality(values, edges, max_time):
    graph = [[] for _ in values]
    for u, v, t in edges:
        graph[u].append((v, t))
        graph[v].append((u, t))
    visits = [0] * len(values)
    visits[0] = 1
    best = 0

    def go(u, time, quality):
        nonlocal best
        if u == 0:
            best = max(best, quality)
        for v, t in graph[u]:
            if time + t <= max_time:
                visits[v] += 1
                first = visits[v] == 1  # value counts once per walk
                go(v, time + t, quality + (values[v] if first else 0))
                visits[v] -= 1  # undo

    go(0, 0, values[0])
    return best
'''

