template = '''
def min_sessions(tasks, limit):
    """Fewest sessions of length <= limit that cover all the tasks."""
    n = len(tasks)
    total = [0] * (1 << n)  # total[m]: the sum of the tasks in m
    for m in range(1, 1 << n):
        low = m & -m
        total[m] = total[m ^ low] + tasks[low.bit_length() - 1]
    best = [n + 1] * (1 << n)
    best[0] = 0
    for m in range(1, 1 << n):
        sub = m
        while sub:  # every non-empty submask of m
            if total[sub] <= limit:
                best[m] = min(best[m], best[m ^ sub] + 1)
            sub = (sub - 1) & m
    return best[(1 << n) - 1]
'''
