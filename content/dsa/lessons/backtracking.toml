def generate_trees(n):
    def build(lo, hi):
        if lo > hi:
            return [None]
        return [TreeNode(root, left, right)
                for root in range(lo, hi + 1)
                for left in build(lo, root - 1)
                for right in build(root + 1, hi)]

    return build(1, n) if n else []
'''

