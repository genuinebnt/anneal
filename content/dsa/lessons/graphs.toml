        for v, d in adj[u]:
            best = min(best, d)  # every edge of the component counts
            if v not in seen:
                seen.add(v)
                stack.append(v)
    return best
'''

[[extra.variant]]
name = "Detonate the maximum bombs"
note = "Bomb i triggers bomb j when j is inside i's radius (a directed edge); DFS from each bomb."
template = '''
def maximum_detonation(bombs):
    n = len(bombs)
    adj = [[] for _ in range(n)]
    for i, (x1, y1, r1) in enumerate(bombs):
        for j, (x2, y2, _) in enumerate(bombs):
            if i != j and (x1 - x2) ** 2 + (y1 - y2) ** 2 <= r1 * r1:
                adj[i].append(j)  # j is within the blast of i
    best = 0
    for s in range(n):
        seen, stack = {s}, [s]
        while stack:
            u = stack.pop()
            for v in adj[u]:
                if v not in seen:
                    seen.add(v)
                    stack.append(v)
        best = max(best, len(seen))
    return best
'''

