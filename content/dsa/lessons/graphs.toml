name = "Sliding puzzle"
note = "The state is the board as a string; the neighbours come from swapping the 0 with an adjacent tile."
template = '''
from collections import deque


def sliding_puzzle(board):
    start = "".join(str(x) for row in board for x in row)
    goal = "123450"
    near = {0: (1, 3), 1: (0, 2, 4), 2: (1, 5),  # neighbours of each cell
            3: (0, 4), 4: (1, 3, 5), 5: (2, 4)}
    queue, seen = deque([(start, 0)]), {start}
    while queue:
        s, moves = queue.popleft()
        if s == goal:
            return moves
        z = s.index("0")
        for j in near[z]:
            t = list(s)
            t[z], t[j] = t[j], t[z]  # slide the tile into the gap
            t = "".join(t)
            if t not in seen:
                seen.add(t)
                queue.append((t, moves + 1))
    return -1
'''

