from collections import defaultdict


def find_all_people(n, meetings, first_person):
    parent = list(range(n))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    parent[find(first_person)] = find(0)  # 0 tells first_person
    by_time = defaultdict(list)
    for a, b, t in meetings:
        by_time[t].append((a, b))
    for t in sorted(by_time):
        people = set()
        for a, b in by_time[t]:
            parent[find(a)] = find(b)
            people |= {a, b}
        for p in people:  # those not linked to person 0 forget this meeting
            if find(p) != find(0):
                parent[p] = p
    return [i for i in range(n) if find(i) == find(0)]
'''

