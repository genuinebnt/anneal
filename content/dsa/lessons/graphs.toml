from collections import deque


def min_knight_moves(x, y):
    x, y = abs(x), abs(y)  # symmetry
    queue, seen = deque([(0, 0, 0)]), {(0, 0)}
    while queue:
        a, b, d = queue.popleft()
        if (a, b) == (x, y):
            return d
        for da, db in ((1, 2), (2, 1), (-1, 2), (-2, 1),
                       (1, -2), (2, -1), (-1, -2), (-2, -1)):
            na, nb = a + da, b + db
            inside = -2 <= na <= x + 2 and -2 <= nb <= y + 2
            if inside and (na, nb) not in seen:
                seen.add((na, nb))
                queue.append((na, nb, d + 1))
'''

