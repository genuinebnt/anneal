template_name = "Shortest cycle in a graph"
template = '''
from collections import deque


def find_shortest_cycle(n, edges):
    adj = [[] for _ in range(n)]
    for a, b in edges:
        adj[a].append(b)
        adj[b].append(a)
    best = float("inf")
    for start in range(n):
        dist, parent = {start: 0}, {start: -1}
        queue = deque([start])
        while queue:
            u = queue.popleft()
            for v in adj[u]:
                if v not in dist:
                    dist[v], parent[v] = dist[u] + 1, u
                    queue.append(v)
                elif parent[u] != v:  # a non-tree edge closes a cycle
                    best = min(best, dist[u] + dist[v] + 1)
    return best if best != float("inf") else -1
'''
pitfalls = [
    "Run the BFS from every node: the shortest cycle through the start is found, and the minimum over all starts is the answer.",
    "Skip the parent edge: it is not a cycle.",
