template_name = "Grid with obstacle elimination"
template = '''
from collections import deque


def shortest_path(grid, k):
    rows, cols = len(grid), len(grid[0])
    if k >= rows + cols - 2:
        return rows + cols - 2  # enough removals for any direct path
    queue = deque([(0, 0, k, 0)])  # row, col, removals left, steps
    seen = {(0, 0, k)}
    while queue:
        r, c, left, steps = queue.popleft()
        if (r, c) == (rows - 1, cols - 1):
            return steps
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < rows and 0 <= b < cols:
                nxt = left - grid[a][b]  # removing a wall costs one
                if nxt >= 0 and (a, b, nxt) not in seen:
                    seen.add((a, b, nxt))
                    queue.append((a, b, nxt, steps + 1))
    return -1
'''
pitfalls = [
    "The visited key includes the remaining budget: arriving with more left is a different, better state.",
    "BFS gives the fewest steps because every move costs one.",
    "A shortcut: if k covers the Manhattan path, the answer is rows + cols - 2.",
]
