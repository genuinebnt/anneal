from collections import deque


def largest_path_value(colors, edges):
    n = len(colors)
    children = [[] for _ in range(n)]
    indeg = [0] * n
    for a, b in edges:
        children[a].append(b)
        indeg[b] += 1
    # count[u][c]: the most nodes of colour c on a path that ends at u
    count = [[0] * 26 for _ in range(n)]
    queue = deque(i for i in range(n) if indeg[i] == 0)
    seen = best = 0
    while queue:
        u = queue.popleft()
        seen += 1
        count[u][ord(colors[u]) - 97] += 1  # u's own colour
        best = max(best, max(count[u]))
        for v in children[u]:
            for c in range(26):
                count[v][c] = max(count[v][c], count[u][c])
            indeg[v] -= 1
            if indeg[v] == 0:
                queue.append(v)
    return best if seen == n else -1  # a cycle: some nodes never ran
'''
pitfalls = [
