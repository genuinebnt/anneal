name = "Possible bipartition"
note = "Two-colour the dislike graph with DFS; a conflict means the split is impossible."
template = '''
def possible_bipartition(n, dislikes):
    adj = [[] for _ in range(n + 1)]
    for a, b in dislikes:
        adj[a].append(b)
        adj[b].append(a)
    color = [0] * (n + 1)  # 0 unseen, 1 and -1 the two groups
    for s in range(1, n + 1):
        if color[s]:
            continue
        color[s] = 1
        stack = [s]
        while stack:
            u = stack.pop()
            for v in adj[u]:
                if color[v] == color[u]:
                    return False  # two who dislike each other: same group
                if not color[v]:
                    color[v] = -color[u]
                    stack.append(v)
    return True
'''

