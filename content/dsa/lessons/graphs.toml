[[extra.variant]]
name = "Find champion II"
note = "The champion is the only node with no incoming edge; with two or more such nodes there is no unique champion."
template = '''
def find_champion(n, edges):
    beaten = {b for _, b in edges}
    candidates = [i for i in range(n) if i not in beaten]
    return candidates[0] if len(candidates) == 1 else -1
'''

[[extra.variant]]
name = "Restore the array from adjacent pairs"
note = "The ends of the array appear in only one pair: start at one and follow the neighbours."
template = '''
from collections import defaultdict


def restore_array(adjacent_pairs):
    adj = defaultdict(list)
    for a, b in adjacent_pairs:
        adj[a].append(b)
        adj[b].append(a)
    start = next(x for x, nb in adj.items() if len(nb) == 1)  # an end
    out, prev = [start], None
    while len(out) <= len(adjacent_pairs):
        cur = out[-1]
        nxt = adj[cur][0] if adj[cur][0] != prev else adj[cur][-1]
        prev = cur
        out.append(nxt)
    return out[:len(adjacent_pairs) + 1]
'''

