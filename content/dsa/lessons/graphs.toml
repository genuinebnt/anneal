template_name = "Count unreachable pairs of nodes"
template = '''
def count_pairs(n, edges):
    parent = list(range(n))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    for a, b in edges:
        parent[find(a)] = find(b)
    size = {}
    for i in range(n):
        root = find(i)
        size[root] = size.get(root, 0) + 1
    pairs, remaining = 0, n
    for s in size.values():
        remaining -= s
        pairs += s * remaining  # this component against all later ones
    return pairs
'''
