template = '''
def remove_stones(stones):
    parent = {}

    def find(x):
        parent.setdefault(x, x)
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    for r, c in stones:
        parent[find(("r", r))] = find(("c", c))  # row and column joined
    components = len({find(("r", r)) for r, _ in stones})
    return len(stones) - components  # keep one stone per component
'''

