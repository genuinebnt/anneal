note = "The first edge whose ends are already connected closes a cycle."
template = '''
def find_redundant_connection(edges):
    parent = list(range(len(edges) + 1))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]
            x = parent[x]
        return x

    for a, b in edges:
        ra, rb = find(a), find(b)
        if ra == rb:
            return [a, b]  # already connected: this edge makes a cycle
        parent[ra] = rb
'''

