id = "Graphs:indegree"
name = "In-degree tricks"
group = "Cycle detection and graph properties"
signals = [
    "the fewest nodes from which everything can be reached: those with in-degree 0",
    "a champion that no team loses to; a judge trusted by everyone",
    "the ends of a path are the nodes with one neighbour",
]
template_name = "Minimum vertices to reach all nodes"
template = '''
def find_smallest_set_of_vertices(n, edges):
    has_incoming = {b for _, b in edges}
    return [i for i in range(n) if i not in has_incoming]  # a start
'''
pitfalls = [
    "A node with no incoming edge cannot be reached from any other node, so it must be a start.",
