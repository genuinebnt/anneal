name = "All ancestors in a DAG"
note = "Process nodes in topological order and pass each node's ancestor set to its children."
template = '''
from collections import deque


def get_ancestors(n, edges):
    children = [[] for _ in range(n)]
    indeg = [0] * n
    for a, b in edges:
        children[a].append(b)
        indeg[b] += 1
    anc = [set() for _ in range(n)]
    queue = deque(i for i in range(n) if indeg[i] == 0)
    while queue:
        u = queue.popleft()
        for v in children[u]:
            anc[v] |= anc[u] | {u}  # everything above u, and u
            indeg[v] -= 1
            if indeg[v] == 0:
                queue.append(v)
    return [sorted(a) for a in anc]
'''

