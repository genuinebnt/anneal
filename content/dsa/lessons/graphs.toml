template_name = "Accounts merge"
template = '''
from collections import defaultdict


def accounts_merge(accounts):
    parent = list(range(len(accounts)))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]  # path halving
            x = parent[x]
        return x

    owner = {}  # email -> the first account that had it
    for i, (_, *emails) in enumerate(accounts):
        for e in emails:
            if e in owner:
                parent[find(i)] = find(owner[e])  # same email: same person
            else:
                owner[e] = i
    groups = defaultdict(list)
    for e, i in owner.items():
        groups[find(i)].append(e)
    return [[accounts[i][0]] + sorted(es) for i, es in groups.items()]
'''
pitfalls = [
    "The first account that holds an email owns it; later accounts with that email are unioned with the owner.",
    "Group by the root at the end, after all unions.",
    "Names alone do not identify people: only shared emails merge accounts.",
]
