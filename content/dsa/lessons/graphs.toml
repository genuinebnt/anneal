id = "Graphs:dsu-groups"
name = "Union-find by key: merge things that share a value"
group = "Union-find (DSU)"
signals = [
    "merge accounts that share an email, positions that can swap, stones that share a row or column",
    "union items that share a key, then group by root",
    "the keys can be nodes themselves: connect a stone to its row and its column",
