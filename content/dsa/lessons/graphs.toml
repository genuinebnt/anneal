from collections import defaultdict, deque


def find_all_recipes(recipes, ingredients, supplies):
    need = defaultdict(list)  # ingredient -> recipes waiting for it
    missing = {}
    for r, ing in zip(recipes, ingredients):
        missing[r] = len(ing)
        for x in ing:
            need[x].append(r)
    queue, out = deque(supplies), []
    while queue:
        item = queue.popleft()
        for r in need[item]:
            missing[r] -= 1
            if missing[r] == 0:
                out.append(r)
                queue.append(r)  # a made recipe can be an ingredient
    return out
'''

[[extra.variant]]
name = "All paths lead to the destination"
note = "Every path from the source must end at the destination: DFS with colours, rejecting cycles and wrong dead ends."
template = '''
def leads_to_destination(n, edges, source, destination):
    graph = [[] for _ in range(n)]
    for a, b in edges:
        graph[a].append(b)
    state = [0] * n  # 0 unseen, 1 on the current path, 2 done and good

    def ok(u):
        if state[u]:
            return state[u] == 2  # on the path again means a cycle
        if not graph[u]:
            return u == destination  # a dead end must be the destination
        state[u] = 1
        if all(ok(v) for v in graph[u]):
            state[u] = 2
            return True
        return False

    return ok(source)
'''

