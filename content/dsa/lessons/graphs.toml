name = "Find eventual safe states"
note = "A node is safe when every path from it ends in a terminal node: DFS with three colours detects the cycles."
template = '''
def eventual_safe_nodes(graph):
    state = [0] * len(graph)  # 0 unseen, 1 on the path, 2 safe

    def safe(u):
        if state[u]:
            return state[u] == 2  # on the path again means a cycle
        state[u] = 1
        if all(safe(v) for v in graph[u]):
            state[u] = 2
            return True
        return False

    return [u for u in range(len(graph)) if safe(u)]
'''

