template = '''
from collections import defaultdict


def minimum_fuel_cost(roads, seats):
    adj = defaultdict(list)
    for a, b in roads:
        adj[a].append(b)
        adj[b].append(a)
    fuel = 0

    def people(u, parent):  # the number of people in the subtree of u
        nonlocal fuel
        total = 1
        for v in adj[u]:
            if v != parent:
                total += people(v, u)
        if parent != -1:
            fuel += -(-total // seats)  # cars needed to cross the edge
        return total

    people(0, -1)
    return fuel
'''
