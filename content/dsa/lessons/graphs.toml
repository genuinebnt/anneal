template_name = "Shortest bridge"
template = '''
from collections import deque


def shortest_bridge(grid):
    n = len(grid)
    start = next((r, c) for r in range(n) for c in range(n) if grid[r][c])
    island, stack = {start}, [start]
    while stack:  # mark the first island
        r, c = stack.pop()
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            inside = 0 <= a < n and 0 <= b < n
            if inside and grid[a][b] and (a, b) not in island:
                island.add((a, b))
                stack.append((a, b))
    queue, seen, dist = deque(island), set(island), 0
    while queue:  # grow the island one layer at a time
        for _ in range(len(queue)):
            r, c = queue.popleft()
            for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= a < n and 0 <= b < n and (a, b) not in seen:
                    if grid[a][b]:
                        return dist  # reached the other island
                    seen.add((a, b))
                    queue.append((a, b))
        dist += 1
'''
