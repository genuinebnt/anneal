[[extra.variant]]
name = "Most profitable path in a tree"
note = "Bob's path to the root gives the time he reaches each node; Alice's DFS pays or shares at each node by comparing times."
template = '''
from collections import defaultdict


def most_profitable_path(edges, bob, amount):
    adj = [[] for _ in range(len(amount))]
    for a, b in edges:
        adj[a].append(b)
        adj[b].append(a)
    parent, order = {0: -1}, [0]
    for u in order:  # a BFS from the root records every parent
        for v in adj[u]:
            if v not in parent:
                parent[v] = u
                order.append(v)
    bob_time, u, t = {}, bob, 0
    while u != -1:  # Bob walks to the root: when does he reach each node?
        bob_time[u] = t
        u, t = parent[u], t + 1

    def alice(u, par, time):
        gain = amount[u]
        if u in bob_time:
            if time > bob_time[u]:
                gain = 0  # Bob opened the gate or door first
            elif time == bob_time[u]:
                gain //= 2  # they arrive together and share
        sub = [alice(v, u, time + 1) for v in adj[u] if v != par]
        return gain + (max(sub) if sub else 0)  # a leaf ends the walk

    return alice(0, -1, 0)
'''

