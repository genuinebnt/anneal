template_name = "K smallest pairs"
template = '''
import heapq


def k_smallest_pairs(nums1, nums2, k):
    if not nums1 or not nums2:
        return []
    heap = [(nums1[i] + nums2[0], i, 0) for i in range(min(k, len(nums1)))]
    heapq.heapify(heap)  # the first column: pair i with nums2[0]
    out = []
    while heap and len(out) < k:
        _, i, j = heapq.heappop(heap)
        out.append([nums1[i], nums2[j]])
        if j + 1 < len(nums2):  # the next candidate in this row
            heapq.heappush(heap, (nums1[i] + nums2[j + 1], i, j + 1))
    return out
'''
pitfalls = [
    "Start with only the first column (at most k entries): later cells are bigger than their left neighbour.",
    "Push the right neighbour of the cell you pop, and only that one: no cell is added twice.",
    "Stop at k pops: the heap never holds more than k entries.",
]
examples = ["find-k-pairs-with-smallest-sums", "kth-smallest-element-in-a-sorted-matrix", "find-the-kth-smallest-sum-of-a-matrix-with-sorted-rows", "ugly-number-ii", "super-ugly-number"]

