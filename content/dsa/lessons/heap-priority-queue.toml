def max_score(nums1, nums2, k):
    best, total, heap = 0, 0, []
    for b, a in sorted(zip(nums2, nums1), reverse=True):
        heapq.heappush(heap, a)
        total += a
        if len(heap) > k:
            total -= heapq.heappop(heap)
        if len(heap) == k:
            best = max(best, total * b)  # b is the minimum nums2 so far
    return best
'''

[[extra.variant]]
name = "Minimum cost to hire k workers"
note = "Sort by wage per unit of quality; the current ratio is paid to everyone, and a max-heap keeps the k smallest qualities."
template = '''
import heapq


def mincost_to_hire_workers(quality, wage, k):
    best, total, heap = float("inf"), 0, []  # heap: negated qualities
    for ratio, q in sorted((w / q, q) for q, w in zip(quality, wage)):
        heapq.heappush(heap, -q)
        total += q
        if len(heap) > k:
            total += heapq.heappop(heap)  # drop the top quality (negated)
        if len(heap) == k:
            best = min(best, total * ratio)
    return best
'''

[[extra]]
id = "Heap / Priority Queue:two-ends"
name = "Cheapest from the two ends of a list"
group = "Greedy with a heap"
signals = [
    "hire k people, each time the cheapest from the first c or the last c of the list that remain",
    "two heaps, one for each end, filled from both sides until they meet",
    "ties between the two ends go to the smaller index",
]
template = '''
import heapq


def total_cost(costs, k, candidates):
    n = len(costs)
    left = costs[:candidates]
    right = costs[max(candidates, n - candidates):]
    heapq.heapify(left)
    heapq.heapify(right)
    i, j = candidates, n - candidates - 1  # next to enter each heap
    total = 0
    for _ in range(k):
        if not right or (left and left[0] <= right[0]):
            total += heapq.heappop(left)
            if i <= j:
                heapq.heappush(left, costs[i])
                i += 1
        else:
            total += heapq.heappop(right)
            if i <= j:
                heapq.heappush(right, costs[j])
                j -= 1
    return total
'''
pitfalls = [
    "The two heaps must not share a cost: stop refilling when the indexes meet (i > j).",
    "Compare the two roots; on a tie take the left one.",
    "When n < 2 * candidates the right heap starts empty or short: slice with max(candidates, n - candidates).",
]
examples = ["total-cost-to-hire-k-workers"]

[[extra]]
id = "Heap / Priority Queue:marginal-gain"
name = "Best marginal gain at each step"
group = "Greedy with a heap"
signals = [
    "spread a limited resource (extra students, increments) where it improves the total the most",
    "the gain of the next unit at each place is computable, and gains only shrink",
    "pop the biggest gain, apply it, push the new gain of that place",
]
template = '''
import heapq


def max_average_ratio(classes, extra):
    def gain(p, t):  # how much one more passing student adds
        return (p + 1) / (t + 1) - p / t

    heap = [(-gain(p, t), p, t) for p, t in classes]
    heapq.heapify(heap)
    for _ in range(extra):
        _, p, t = heapq.heappop(heap)
        p, t = p + 1, t + 1
        heapq.heappush(heap, (-gain(p, t), p, t))
    return sum(p / t for _, p, t in heap) / len(classes)
'''
pitfalls = [
    "This works because the gain of the next unit never grows: a diminishing-return greedy.",
    "Recompute the gain of only the class you changed, and push it back.",
    "Float gains are fine here; for exact answers compare fractions by cross-multiplication.",
]
examples = ["maximum-average-pass-ratio", "maximum-number-of-eaten-apples"]

[[extra]]
id = "Heap / Priority Queue:order-book"
name = "Two books: matching orders"
group = "Two heaps and the median"
signals = [
    "buy orders and sell orders arrive; a buy matches the cheapest sell at or below its price",
    "a max-heap of buys against a min-heap of sells; the roots are the best offers",
    "match while the best buy meets the best sell, and what is left joins the backlog",
]
template = '''
import heapq


def get_number_of_backlog_orders(orders):
    buys, sells = [], []  # buys: (-price, amount); sells: (price, amount)
    for price, amount, kind in orders:
        if kind == 0:  # a buy
            while amount and sells and sells[0][0] <= price:
                p, a = heapq.heappop(sells)
                take = min(a, amount)
                amount -= take
                if a > take:
                    heapq.heappush(sells, (p, a - take))
            if amount:
                heapq.heappush(buys, (-price, amount))
        else:  # a sell
            while amount and buys and -buys[0][0] >= price:
                p, a = heapq.heappop(buys)
                take = min(a, amount)
                amount -= take
                if a > take:
                    heapq.heappush(buys, (p, a - take))
            if amount:
                heapq.heappush(sells, (price, amount))
    total = sum(a for _, a in buys) + sum(a for _, a in sells)
    return total % (10**9 + 7)
'''
pitfalls = [
    "Match against the best opposite offer only: the buy heap is a max-heap (negate), the sell heap a min-heap.",
    "A partly filled resting order goes back with its remaining amount.",
    "Count the amounts, not the entries, in the backlog.",
]
examples = ["number-of-orders-in-the-backlog"]

[[extra]]
id = "Heap / Priority Queue:servers"
name = "Free servers and busy servers"
group = "Scheduling with heaps"
signals = [
    "tasks arrive over time and go to the best free server (lowest weight, then lowest index)",
    "one heap of free servers by (weight, index), one of busy servers by (finish time, ...)",
    "before assigning, release every server that has finished by now",
]
template = '''
import heapq


def assign_tasks(servers, tasks):
    free = [(w, i) for i, w in enumerate(servers)]
    heapq.heapify(free)
    busy = []  # (time it frees up, weight, index)
    out, time = [], 0
    for j, duration in enumerate(tasks):
        time = max(time, j)  # task j arrives at second j
        if not free:
            time = max(time, busy[0][0])  # wait for the first to free up
        while busy and busy[0][0] <= time:
            t, w, i = heapq.heappop(busy)
            heapq.heappush(free, (w, i))
        w, i = heapq.heappop(free)
        out.append(i)
        heapq.heappush(busy, (time + duration, w, i))
    return out
'''
pitfalls = [
    "Move finished servers from busy to free before choosing: only then is the best free server known.",
    "When nobody is free, jump the clock to the earliest finish time instead of stepping second by second.",
    "A task never starts before it arrives: keep time at least j.",
]
examples = ["process-tasks-using-servers", "find-servers-that-handled-most-number-of-requests", "meeting-rooms-iii"]

