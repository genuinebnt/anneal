name = "Number containers"
note = "A min-heap of indexes per number; an index is valid only if the map still points to that number."
template = '''
import heapq
from collections import defaultdict


class NumberContainers:
    def __init__(self):
        self.at = {}  # index -> number
        self.heap = defaultdict(list)  # number -> min-heap of indexes

    def change(self, index, number):
        self.at[index] = number
        heapq.heappush(self.heap[number], index)

    def find(self, number):
        h = self.heap[number]
        while h and self.at[h[0]] != number:
            heapq.heappop(h)  # that index holds another number now
        return h[0] if h else -1
'''

