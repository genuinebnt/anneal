import heapq
from collections import Counter


def top_k_frequent(words, k):
    count = Counter(words)
    # most frequent first; ties in alphabetical order
    return heapq.nsmallest(k, count, key=lambda w: (-count[w], w))
'''
pitfalls = [
    "Put the whole ordering in one key: (-count, word) sorts by frequency and breaks ties by name.",
    "A size-k heap of the *worst of the best* gives O(n log k); nsmallest does that for you.",
    "For a distance use the squared distance: no square root, no float error.",
]
