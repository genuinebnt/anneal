template_name = "Food ratings"
template = '''
import heapq
from collections import defaultdict


class FoodRatings:
    def __init__(self, foods, cuisines, ratings):
        self.info = {}  # food -> (cuisine, current rating)
        self.heap = defaultdict(list)  # cuisine -> [(-rating, food)]
        for f, c, r in zip(foods, cuisines, ratings):
            self.info[f] = (c, r)
            heapq.heappush(self.heap[c], (-r, f))

    def changeRating(self, food, newRating):
        cuisine, _ = self.info[food]
        self.info[food] = (cuisine, newRating)
        # the old entry stays in the heap; it is skipped when it surfaces
        heapq.heappush(self.heap[cuisine], (-newRating, food))

    def highestRated(self, cuisine):
        h = self.heap[cuisine]
        while -h[0][0] != self.info[h[0][1]][1]:
            heapq.heappop(h)  # stale: the food has another rating now
        return h[0][1]
'''
pitfalls = [
    "Compare the popped entry with the dictionary before trusting it, and pop it if they differ.",
    "Push every update: the heap grows, but each entry is popped at most once, so the total stays O(n log n).",
    "Break ties inside the tuple (rating, then name) so equal ratings are ordered the way the problem asks.",
]
examples = ["design-a-food-rating-system", "design-a-number-container-system", "design-task-manager", "stock-price-fluctuation", "most-frequent-ids"]

