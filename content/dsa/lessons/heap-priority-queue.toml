template_name = "Path with minimum effort"
template = '''
import heapq


def minimum_effort_path(heights):
    rows, cols = len(heights), len(heights[0])
    best = [[float("inf")] * cols for _ in range(rows)]
    best[0][0] = 0
    heap = [(0, 0, 0)]  # (largest climb on the path so far, row, col)
    while heap:
        effort, r, c = heapq.heappop(heap)
        if (r, c) == (rows - 1, cols - 1):
            return effort
        if effort > best[r][c]:
            continue  # a stale entry
        for a, b in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            if 0 <= a < rows and 0 <= b < cols:
                nxt = max(effort, abs(heights[a][b] - heights[r][c]))
                if nxt < best[a][b]:
                    best[a][b] = nxt
                    heapq.heappush(heap, (nxt, a, b))
    return 0
'''
pitfalls = [
    "The cost of a path is the maximum along it, not the sum: combine with max when you extend.",
    "Skip entries whose cost is already worse than the best known for that cell.",
    "For the widest path (maximise the minimum) negate the values and use the same code.",
]
examples = ["path-with-minimum-effort", "swim-in-rising-water", "path-with-maximum-minimum-value"]

