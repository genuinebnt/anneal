name = "Kth smallest in a sorted matrix"
note = "Rows are sorted: a heap of row heads gives the values in order."
template = '''
import heapq


def kth_smallest(matrix, k):
    heap = [(row[0], r, 0) for r, row in enumerate(matrix)]
    heapq.heapify(heap)
    for _ in range(k - 1):
        _, r, c = heapq.heappop(heap)
        if c + 1 < len(matrix[r]):
            heapq.heappush(heap, (matrix[r][c + 1], r, c + 1))
    return heap[0][0]
'''

[[extra.variant]]
name = "Ugly numbers (merge the multiples)"
note = "Each ugly number times each prime is a candidate; a pointer per prime merges the streams in order."
template = '''
def nth_super_ugly_number(n, primes):
    ugly = [1]
    point = [0] * len(primes)  # per prime: the ugly number it multiplies
    for _ in range(n - 1):
        nxt = min(ugly[point[i]] * p for i, p in enumerate(primes))
        ugly.append(nxt)
        for i, p in enumerate(primes):
            if ugly[point[i]] * p == nxt:
                point[i] += 1  # advance every prime that produced it
    return ugly[-1]
'''

