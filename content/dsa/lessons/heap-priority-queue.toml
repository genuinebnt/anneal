name = "Stock price (latest, max, min)"
note = "Two heaps with the timestamp; an entry is stale when the stored price at that time has changed."
template = '''
import heapq


class StockPrice:
    def __init__(self):
        self.price = {}  # timestamp -> price
        self.latest = 0
        self.lo, self.hi = [], []  # (price, time) and (-price, time)

    def update(self, timestamp, price):
        self.price[timestamp] = price
        self.latest = max(self.latest, timestamp)
        heapq.heappush(self.lo, (price, timestamp))
        heapq.heappush(self.hi, (-price, timestamp))

    def current(self):
        return self.price[self.latest]

    def maximum(self):
        while -self.hi[0][0] != self.price[self.hi[0][1]]:
            heapq.heappop(self.hi)  # corrected since
        return -self.hi[0][0]

    def minimum(self):
        while self.lo[0][0] != self.price[self.lo[0][1]]:
            heapq.heappop(self.lo)
        return self.lo[0][0]
'''

