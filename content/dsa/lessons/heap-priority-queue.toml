template_name = "Maximum performance of a team"
template = '''
import heapq


def max_performance(n, speed, efficiency, k):
    best, total, heap = 0, 0, []  # heap: the speeds of the chosen engineers
    # the current engineer has the lowest efficiency in the team
    for e, s in sorted(zip(efficiency, speed), reverse=True):
        heapq.heappush(heap, s)
        total += s
        if len(heap) > k:
            total -= heapq.heappop(heap)  # drop the slowest
        best = max(best, total * e)
    return best % (10**9 + 7)
'''
pitfalls = [
    "Sorting by efficiency (descending) makes the current engineer the minimum, so the formula is a plain product.",
    "Drop the smallest speed when the team is too big: removing it never lowers the minimum efficiency.",
    "Take the modulus only at the very end: the best value is compared exactly.",
]
examples = ["maximum-performance-of-a-team", "minimum-cost-to-hire-k-workers", "maximum-subsequence-score", "total-cost-to-hire-k-workers"]

