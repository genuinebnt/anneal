id = "Heap / Priority Queue:own-heap"
walk = "heap-sift"
name = "Write the heap yourself"
group = "Heapify and heap sort"
signals = [
    "implement a priority queue, or sort in place with O(1) extra memory",
    "a complete tree in an array: the parent of i is (i - 1) // 2, its children are 2i + 1 and 2i + 2",
    "push sifts up, pop moves the last item to the root and sifts down",
]
template_name = "Min-heap class"
template = '''
class MinHeap:
    def __init__(self, items=()):
        self.a = list(items)
        for i in range(len(self.a) // 2 - 1, -1, -1):
            self._down(i)  # heapify in O(n): from the last parent up

    def push(self, x):
        self.a.append(x)
        self._up(len(self.a) - 1)

    def pop(self):
        a = self.a
        a[0], a[-1] = a[-1], a[0]
        top = a.pop()
        if a:
            self._down(0)
        return top

    def _up(self, i):
        a = self.a
        while i and a[i] < a[(i - 1) // 2]:
            a[i], a[(i - 1) // 2] = a[(i - 1) // 2], a[i]
            i = (i - 1) // 2

    def _down(self, i):
        a, n = self.a, len(self.a)
        while True:
            small = i
            for c in (2 * i + 1, 2 * i + 2):
                if c < n and a[c] < a[small]:
                    small = c
            if small == i:
                return
            a[i], a[small] = a[small], a[i]
            i = small

    def __len__(self):
        return len(self.a)
'''
pitfalls = [
    "Heapify from the last parent down to 0: O(n). Pushing n items one by one is O(n log n).",
    "Sift down toward the smaller child, and stop when neither child is smaller.",
    "Pop: swap the root with the last item, remove the last, then sift the new root down.",
]
examples = ["sort-an-array", "kth-largest-element-in-an-array"]

[[extra.variant]]
name = "Heap sort in place"
note = "Build a max-heap in the array, then swap the root to the end and shrink the heap."
template = '''
def heap_sort(a):
    def down(i, n):
        while True:
            big = i
            for c in (2 * i + 1, 2 * i + 2):
                if c < n and a[c] > a[big]:
                    big = c
            if big == i:
                return
            a[i], a[big] = a[big], a[i]
            i = big

    n = len(a)
    for i in range(n // 2 - 1, -1, -1):
        down(i, n)
    for end in range(n - 1, 0, -1):
        a[0], a[end] = a[end], a[0]  # the biggest goes to its place
        down(0, end)
    return a
'''

