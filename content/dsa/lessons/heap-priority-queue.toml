name = "K closest points (max-heap of size k)"
note = "Keep the k nearest; the farthest of them sits at the root and leaves first."
template = '''
import heapq


def k_closest(points, k):
    heap = []  # max-heap by distance: store the negative
    for x, y in points:
        d = x * x + y * y
        if len(heap) < k:
            heapq.heappush(heap, (-d, x, y))
        elif -heap[0][0] > d:
            heapq.heapreplace(heap, (-d, x, y))  # drop the farthest
    return [[x, y] for _, x, y in heap]
'''

[[extra.variant]]
name = "K closest elements (window)"
note = "The answer is a window of k elements in the sorted array: binary search its left end."
template = '''
def find_closest_elements(arr, k, x):
    lo, hi = 0, len(arr) - k  # the left end of the window
    while lo < hi:
        mid = (lo + hi) // 2
        if x - arr[mid] > arr[mid + k] - x:
            lo = mid + 1  # the window is better one step to the right
        else:
            hi = mid
    return arr[lo:lo + k]
'''

