# The indexes (and other changes) a captured plan runs with. tools/sqlperf/capture.py applies a plan's setups in order
# before running it and undoes them in reverse afterwards, so the example schema (tools/sqlperf/schema.sql) is the same
# for every plan and a page always says exactly which indexes existed. A setup with `session` instead (planner settings
# such as `SET enable_seqscan = off`) runs in the session that takes the plan, since settings last only for a session.

[[setup]]
id = "orders-customer"
sql = "CREATE INDEX orders_customer ON orders (customer_id);"
undo = "DROP INDEX orders_customer;"

[[setup]]
id = "orders-created-customer"
sql = "CREATE INDEX orders_created_customer ON orders (created_at, customer_id);"
undo = "DROP INDEX orders_created_customer;"

[[setup]]
id = "orders-customer-created"
sql = "CREATE INDEX orders_customer_created ON orders (customer_id, created_at);"
undo = "DROP INDEX orders_customer_created;"

[[setup]]
id = "orders-customer-created-cover"
sql = "CREATE INDEX orders_customer_created_cover ON orders (customer_id, created_at) INCLUDE (id, total_cents); VACUUM orders;"
undo = "DROP INDEX orders_customer_created_cover;"

[[setup]]
id = "orders-status-created"
sql = "CREATE INDEX orders_status_created ON orders (status, created_at);"
undo = "DROP INDEX orders_status_created;"

[[setup]]
id = "orders-status"
sql = "CREATE INDEX orders_status ON orders (status);"
undo = "DROP INDEX orders_status;"

[[setup]]
id = "customers-email"
sql = "CREATE INDEX customers_email ON customers (email);"
undo = "DROP INDEX customers_email;"

[[setup]]
id = "customers-lower-email"
sql = "CREATE INDEX customers_lower_email ON customers (lower(email)); ANALYZE customers;"
undo = "DROP INDEX customers_lower_email;"

[[setup]]
id = "orders-created-day"
sql = "CREATE INDEX orders_created ON orders (created_at);"
undo = "DROP INDEX orders_created;"

[[setup]]
id = "customers-email-unique"
sql = "CREATE UNIQUE INDEX customers_email_key ON customers (email);"
undo = "DROP INDEX customers_email_key;"

[[setup]]
id = "no-seqscan"
session = "SET enable_seqscan = off;"

[[setup]]
id = "orders-status-customer"
sql = "CREATE INDEX orders_status_customer ON orders (status, customer_id);"
undo = "DROP INDEX orders_status_customer;"

[[setup]]
id = "orders-customer-status"
sql = "CREATE INDEX orders_customer_status ON orders (customer_id, status);"
undo = "DROP INDEX orders_customer_status;"

[[setup]]
id = "customers-lower-email-nostats"
sql = "CREATE INDEX customers_lower_email ON customers (lower(email));"
undo = "DROP INDEX customers_lower_email;"

[[setup]]
id = "orders-day-utc"
sql = "CREATE INDEX orders_day_utc ON orders (((created_at AT TIME ZONE 'UTC')::date));"
undo = "DROP INDEX orders_day_utc;"

[[setup]]
id = "customers-email-pattern"
sql = "CREATE INDEX customers_email_pattern ON customers (email text_pattern_ops);"
undo = "DROP INDEX customers_email_pattern;"

[[setup]]
id = "customers-email-c"
sql = "CREATE INDEX customers_email_c ON customers (email COLLATE \"C\");"
undo = "DROP INDEX customers_email_c;"

[[setup]]
id = "orders-total"
sql = "CREATE INDEX orders_total ON orders (total_cents);"
undo = "DROP INDEX orders_total;"

[[setup]]
id = "orders-pending-partial"
sql = "CREATE INDEX orders_pending ON orders (created_at) WHERE status = 'pending';"
undo = "DROP INDEX orders_pending;"

[[setup]]
id = "generic-pending"
session = "SET plan_cache_mode = force_generic_plan; PREPARE pending_orders (text) AS SELECT id FROM orders WHERE status = $1 ORDER BY created_at DESC LIMIT 20;"

# a nullable column for the NULL pages: 500,000 tickets, every 50th one unassigned (10,000), deterministic
[[setup]]
id = "tickets"
sql = "CREATE TABLE tickets AS SELECT i AS id, CASE WHEN i % 50 = 0 THEN NULL ELSE (1 + (i::bigint * 7919) % 200)::int END AS assignee_id, timestamptz '2026-01-01' + (i % 100000) * interval '5 minutes' AS created_at FROM generate_series(1, 500000) AS i; ALTER TABLE tickets ADD PRIMARY KEY (id); VACUUM ANALYZE tickets;"
undo = "DROP TABLE tickets;"

[[setup]]
id = "tickets-assignee"
sql = "CREATE INDEX tickets_assignee ON tickets (assignee_id);"
undo = "DROP INDEX tickets_assignee;"

[[setup]]
id = "tickets-unassigned"
sql = "CREATE INDEX tickets_unassigned ON tickets (created_at) WHERE assignee_id IS NULL;"
undo = "DROP INDEX tickets_unassigned;"

[[setup]]
id = "generic-optional"
session = "SET plan_cache_mode = force_generic_plan; PREPARE optional_customer (int) AS SELECT id FROM orders WHERE (customer_id = $1 OR $1 IS NULL) LIMIT 50;"

# a table this small is on the edge of the planner's parallel-scan threshold, so a plan that must keep one shape says so
[[setup]]
id = "no-parallel"
session = "SET max_parallel_workers_per_gather = 0;"

# the same sort twice: a work_mem too small for it (it spills to disk) and one large enough (it stays in memory)
[[setup]]
id = "sort-small-mem"
session = "SET work_mem = '1MB'; SET max_parallel_workers_per_gather = 0;"

[[setup]]
id = "sort-big-mem"
session = "SET work_mem = '64MB'; SET max_parallel_workers_per_gather = 0;"

[[setup]]
id = "small-work-mem"
session = "SET work_mem = '64kB';"

# a table where one column determines another (every city is in exactly one country), for the correlated-columns plans
[[setup]]
id = "places"
sql = "CREATE TABLE places AS SELECT i AS id, 1 + (i % 1000) AS city, (1 + (i % 1000)) % 10 AS country FROM generate_series(1, 1000000) AS i; ALTER TABLE places ADD PRIMARY KEY (id); VACUUM ANALYZE places;"
undo = "DROP TABLE places;"

[[setup]]
id = "places-stats"
sql = "CREATE STATISTICS places_dep (dependencies) ON city, country FROM places; ANALYZE places;"
undo = "DROP STATISTICS places_dep;"

# for plans where two scans cost nearly the same, so which one wins depends on the sampled statistics
[[setup]]
id = "no-bitmap"
session = "SET enable_bitmapscan = off;"

# module 11: planner settings used as experiments
[[setup]]
id = "no-index-scans"
session = "SET enable_seqscan = off; SET enable_bitmapscan = off;"

[[setup]]
id = "ssd-cost"
session = "SET random_page_cost = 1.1;"

[[setup]]
id = "generic-status"
session = "SET plan_cache_mode = force_generic_plan; PREPARE by_status (text) AS SELECT id FROM orders WHERE status = $1;"

# module 12: parallel query
[[setup]]
id = "parallel-4"
session = "SET max_parallel_workers_per_gather = 4;"

[[setup]]
id = "plus1-unsafe"
sql = "CREATE FUNCTION plus1(x int) RETURNS int LANGUAGE sql IMMUTABLE PARALLEL UNSAFE AS 'SELECT x + 1';"
undo = "DROP FUNCTION plus1(int);"

[[setup]]
id = "plus1-safe"
sql = "CREATE FUNCTION plus1(x int) RETURNS int LANGUAGE sql IMMUTABLE PARALLEL SAFE AS 'SELECT x + 1';"
undo = "DROP FUNCTION plus1(int);"

# module 13: joins
[[setup]]
id = "no-hash-nestloop"
session = "SET enable_hashjoin = off; SET enable_nestloop = off;"

# module 15: sorting and grouping
[[setup]]
id = "no-hashagg"
session = "SET enable_hashagg = off;"

# module 16: pagination
[[setup]]
id = "orders-created-id"
sql = "CREATE INDEX orders_created_id ON orders (created_at, id); VACUUM orders;"
undo = "DROP INDEX orders_created_id;"

# module 21: the visibility map. A 500,000-row copy that autovacuum leaves alone, so every figure is the one the page prints.
[[setup]]
id = "vm-table"
sql = "CREATE TABLE vm_orders AS SELECT id, customer_id, total_cents FROM orders WHERE id <= 500000; ALTER TABLE vm_orders ADD PRIMARY KEY (id); ALTER TABLE vm_orders SET (autovacuum_enabled = false); CREATE INDEX vm_orders_cover ON vm_orders (customer_id) INCLUDE (total_cents); VACUUM ANALYZE vm_orders;"
undo = "DROP TABLE vm_orders;"

[[setup]]
id = "vm-update-few"
sql = "UPDATE vm_orders SET total_cents = total_cents + 1 WHERE id % 5000 = 0;"
undo = "SELECT 1;"

[[setup]]
id = "vm-update-many"
sql = "UPDATE vm_orders SET total_cents = total_cents + 1 WHERE id % 10 = 0;"
undo = "SELECT 1;"

[[setup]]
id = "vm-vacuum"
sql = "VACUUM vm_orders;"
undo = "SELECT 1;"

# module 22: physical order. A throwaway copy of orders, because CLUSTER rewrites the table under an exclusive lock.
[[setup]]
id = "cl-orders"
sql = "CREATE TABLE cl_orders AS SELECT * FROM orders; ALTER TABLE cl_orders ADD PRIMARY KEY (id); ALTER TABLE cl_orders SET (autovacuum_enabled = false); CREATE INDEX cl_created ON cl_orders (created_at); VACUUM ANALYZE cl_orders;"
undo = "DROP TABLE cl_orders;"

[[setup]]
id = "cl-cluster"
sql = "CLUSTER cl_orders USING cl_created; ANALYZE cl_orders;"
undo = "SELECT 1;"

[[setup]]
id = "cl-drop-btree"
sql = "DROP INDEX cl_created;"
undo = "SELECT 1;"

[[setup]]
id = "cl-brin"
sql = "CREATE INDEX cl_brin ON cl_orders USING brin (created_at); ANALYZE cl_orders;"
undo = "DROP INDEX cl_brin;"

# module 23: row versions. A 500,000-row copy that autovacuum leaves alone, then updated twice without a vacuum.
[[setup]]
id = "mv-table"
sql = "CREATE TABLE mv_t AS SELECT id, customer_id, total_cents FROM orders WHERE id <= 500000; ALTER TABLE mv_t ADD PRIMARY KEY (id); ALTER TABLE mv_t SET (autovacuum_enabled = false); VACUUM ANALYZE mv_t;"
undo = "DROP TABLE mv_t;"

[[setup]]
id = "mv-bloat"
sql = "UPDATE mv_t SET total_cents = total_cents + 1; UPDATE mv_t SET total_cents = total_cents + 1;"
undo = "SELECT 1;"

[[setup]]
id = "mv-vacuum"
sql = "VACUUM mv_t;"
undo = "SELECT 1;"

[[setup]]
id = "mv-vacuum-full"
sql = "VACUUM FULL mv_t;"
undo = "SELECT 1;"

# module 25: TOAST. 20,000 rows with a 6,400-byte incompressible text (stored out of line) and an 8,104-byte compressible one (compressed to 137 bytes, stays in the row); and the same with a jsonb document.
[[setup]]
id = "toast-t"
sql = "CREATE TABLE toast_t AS SELECT i AS id, 'title ' || i AS title, (i % 7) AS kind, (SELECT string_agg(md5(i::text || g::text), '') FROM generate_series(1, 200) g) AS body_inc, repeat('lorem ipsum dolor sit amet ', 300) || i AS body_cmp FROM generate_series(1, 20000) i; ALTER TABLE toast_t ADD PRIMARY KEY (id); ALTER TABLE toast_t SET (autovacuum_enabled = false); VACUUM ANALYZE toast_t;"
undo = "DROP TABLE toast_t;"

[[setup]]
id = "toast-j"
sql = "CREATE TABLE toast_j AS SELECT i AS id, (SELECT jsonb_object_agg('k' || g, md5(i::text || g::text)) FROM generate_series(1, 200) g) || jsonb_build_object('n', i % 100) AS payload FROM generate_series(1, 20000) i; ALTER TABLE toast_j ADD PRIMARY KEY (id); ALTER TABLE toast_j SET (autovacuum_enabled = false); VACUUM ANALYZE toast_j;"
undo = "DROP TABLE toast_j;"
