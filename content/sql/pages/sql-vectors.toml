means = "The share of the true nearest neighbours that an approximate search returns; 1.0 is exact search. Measured against the exact result for a sample of queries."
section = "Exact search, and why you add an index"

[[terms]]
term = "HNSW"
means = "Hierarchical Navigable Small World: a multilayer graph of near neighbours searched greedily from the top layer down. Tuned with m, ef_construction and hnsw.ef_search."
section = "HNSW: a layered graph"

[[terms]]
term = "IVFFlat"
means = "Inverted file with flat storage: vectors grouped into k-means lists at build time, with only the probes nearest lists scanned at query time. Tuned with lists and ivfflat.probes."
