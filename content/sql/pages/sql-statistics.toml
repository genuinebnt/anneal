term = "pg_stats"
means = "The catalog view of per-column statistics built by ANALYZE: null fraction, n_distinct, most common values, histogram, correlation."
section = "What ANALYZE stores"

[[terms]]
term = "Most common values (MCV)"
means = "The list of a column's most frequent values with their frequencies; a value in it is estimated as frequency times row count."
section = "What ANALYZE stores"

[[terms]]
term = "Histogram"
means = "Bounds that split the column's remaining values into buckets of equal row count (100 by default), used to estimate ranges."
section = "Estimating a condition"

[[terms]]
term = "Correlation"
means = "How closely the order of a column's values follows the physical order of rows, from 1 to -1; near 0 means a range scan jumps around the table."
section = "What ANALYZE stores"

[[terms]]
term = "Independence assumption"
means = "The planner multiplies the selectivities of separate conditions as if the columns were unrelated."
section = "Columns that depend on each other"

