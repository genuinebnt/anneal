means = "A row's physical address: page number and slot."
section = "Pages, the heap and row addresses"

[[terms]]
term = "Leaf page"
means = "The bottom level of a B-tree, holding every key with its row's TID, in order."
section = "The leaf level: a sorted, doubly linked list"

[[terms]]
term = "Fillfactor"
means = "How full pages are packed when built; 90 for B-tree leaves by default."
section = "The leaf level: a sorted, doubly linked list"

[[terms]]
term = "High key"
means = "An upper bound for the keys on a leaf page, stored as its first entry."
section = "The leaf level: a sorted, doubly linked list"

[[terms]]
term = "Fanout"
means = "How many downlinks an internal page holds; sets how slowly the tree grows deeper."
section = "The tree above the leaves"

