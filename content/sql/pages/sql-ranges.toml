term = "Range scan"
means = "One descent to the first matching entry, then a walk along the leaf pages until the first entry that no longer matches."
section = "A range is a walk along the leaves"

[[terms]]
term = "Bitmap heap scan"
means = "Collects matching TIDs from one or more indexes, sorts them by table page, then visits each page once."
section = "A range is a walk along the leaves"

[[terms]]
term = "Half-open range"
means = "Includes the start and excludes the end (>= a AND < b); consecutive ranges never share a row."
section = "Half-open ranges, not BETWEEN"

[[terms]]
term = "Equality before range"
means = "In a multi-column index, columns compared with = go first and the one range column last, so the range is a contiguous slice."
section = "A range on the second column of an index"

