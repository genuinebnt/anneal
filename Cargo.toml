[workspace]
resolver = "3"
members = ["crates/content", "crates/runner", "crates/rules", "crates/cli", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anneal-content = { path = "crates/content" }
anneal-runner = { path = "crates/runner" }
anneal-rules = { path = "crates/rules" }
anyhow = "1"
argon2 = "0.5"
# OsRng for argon2 salts and session tokens.
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
toml = "0.9"

# The meaning model (crates/api/src/meaning.rs) runs a small transformer on the CPU. Unoptimised, one embedding takes seconds,
# so its numeric crates are optimised even in debug builds and tests.
[profile.dev.package]
candle-core = { opt-level = 3 }
candle-nn = { opt-level = 3 }
candle-transformers = { opt-level = 3 }
gemm = { opt-level = 3 }
gemm-common = { opt-level = 3 }
gemm-f32 = { opt-level = 3 }
tokenizers = { opt-level = 3 }
