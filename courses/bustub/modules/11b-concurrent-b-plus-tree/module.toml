code = "2e"
title = "Concurrent B+ tree"
summary = "The B+ tree of module 2c, with and without tombstones, shared by many threads: latch crabbing that lets go of every ancestor above a safe page, an optimistic fast path that write-latches only the leaf, and a scan that holds no latch yet never returns a key twice or out of order while writers split and merge under it. BusTub Project 2, the concurrent index."
lectures = ["indexconcurrency"]
bustub = ["src/include/storage/index/b_plus_tree.h", "src/storage/index/b_plus_tree.cpp", "src/include/storage/index/index_iterator.h", "src/storage/index/index_iterator.cpp", "src/include/buffer/traced_buffer_pool_manager.h", "test/storage/b_plus_tree_concurrent_test.cpp", "test/storage/b_plus_tree_insert_test.cpp", "test/storage/b_plus_tree_delete_test.cpp"]

