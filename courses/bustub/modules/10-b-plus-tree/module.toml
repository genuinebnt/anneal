code = "2c"
title = "B+ tree index"
summary = "A single-threaded B+ tree on top of the buffer pool, built a level at a time: a header page and one leaf; the first split and the internal page above it; splits that climb to a new root; an iterator over the leaf chain; removes that borrow and merge at the leaves; then merges that climb back up. Concurrency is module 2e. BusTub Project 2, part 2."
lectures = ["indexes1", "indexes2"]
bustub = ["src/include/storage/page/b_plus_tree_page.h", "src/include/storage/page/b_plus_tree_header_page.h", "src/include/storage/page/b_plus_tree_internal_page.h", "src/include/storage/page/b_plus_tree_leaf_page.h", "src/include/storage/index/b_plus_tree.h", "src/storage/index/b_plus_tree.cpp", "src/include/storage/index/index_iterator.h", "src/storage/index/index_iterator.cpp", "src/include/buffer/traced_buffer_pool_manager.h", "test/include/storage/b_plus_tree_utils.h", "test/storage/b_plus_tree_insert_test.cpp", "test/storage/b_plus_tree_delete_test.cpp", "test/storage/b_plus_tree_sequential_scale_test.cpp"]
files = ["src/buffer/traced_buffer_pool_manager.rs", "tests/b_plus_tree_utils/mod.rs", "tests/b_plus_tree_insert_test.rs", "tests/b_plus_tree_delete_test.rs"]

