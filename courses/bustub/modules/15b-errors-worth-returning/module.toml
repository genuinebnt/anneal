code = "3k"
title = "Errors worth returning"
summary = "One error type for a whole database. Every layer you have built so far fails in its own way (a file, a lexer, a catalog, an integer, the engine); a client needs one type that keeps the cause as a value, says what each layer was doing, carries a stable SQLSTATE-style code, and shows a client only what it may see. You design the type; the tests check the standard behaviour: `From`, `?`, `Display`, `source()`, context, codes and a client-safe message. Not in BusTub, which throws C++ exceptions with a type and a message."
