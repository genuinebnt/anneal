[package]
name = "flowforge-cookbook"
version = "0.0.0"
edition = "2024"
publish = false
autoexamples = false  # examples live in chapter folders; see gen_manifest.py

[workspace]
members = ["crates/*"]

# Standalone crate: not part of the flowforge build. Run an example with
#   cd cookbook && cargo run --example r01_serde_defaults
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process", "signal", "test-util"] }
anyhow = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout", "limit", "set-header", "request-id", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
memmap2 = "0.9"
mio = { version = "1", features = ["os-poll", "net"] }
rayon = "1"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
bytes = "1"
parking_lot = "0.12"
smallvec = "1"

