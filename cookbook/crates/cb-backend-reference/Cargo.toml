[package]
name = "cb-backend-reference"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reference backend web app: every building block of a real SaaS API in one readable crate"

[lib]
name = "backend_ref"
path = "src/lib.rs"

[[bin]]
name = "backend-demo"
path = "src/bin/backend-demo.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "catch-panic"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
bytes = "1"
mime = "0.3"
futures-util = "0.3"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
http-body-util = "0.1"
